  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Network Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/InertiaPlugin.min.js"></script>
  <style>
    .dot {
      will-change: transform, background-color;
      transform-origin: center;
      background-color: #333333;
      border-radius: 50%;
      width: 0.75em;
      height: 0.75em;
      position: relative;
      transform: translate(0);
    }
    
    .dots-container {
      grid-column-gap: 2em;
      grid-row-gap: 2em;
      pointer-events: none;
      flex-flow: wrap;
      justify-content: center;
      align-items: center;
      display: flex;
      position: absolute;
      inset: 0;
    }
  </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-black/30 backdrop-blur-xl rounded-2xl overflow-hidden shadow-2xl border border-white/20 relative">
    <div class="relative h-64 overflow-hidden">
      <div class="absolute inset-0">
        <div data-dots-container-init class="dots-container">
          <div class="dot"></div>
        </div>
      </div>
      <div class="absolute top-3 left-4 z-10">
        <h2 class="text-2xl font-bold text-white">Global Network</h2>
        <p class="text-white/70 text-sm">Interactive visualization</p>
      </div>
      <div class="absolute bottom-3 right-4 bg-black/30 backdrop-blur-md rounded-lg p-2 z-10">
        <div class="flex space-x-3 text-xs text-white">
          <div class="flex items-center">
            <span class="w-3 h-3 rounded-full bg-pink-500 mr-1"></span>

          </div>
          <div class="flex items-center">
            <span class="w-3 h-3 rounded-full bg-blue-400 mr-1"></span>
            <span>Regional Office</span>
          </div>
        </div>
      </div>
    </div>
    <div class="p-5 bg-black/40">
      <div class="flex justify-between text-white/80 text-sm">
        <div>
          <p class="font-medium">San Francisco</p>
          <p class="text-xs text-white/60">Headquarters</p>
        </div>
        <div>
          <p class="font-medium">New York</p>
          <p class="text-xs text-white/60">East Coast Office</p>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-white/10">
        <p class="text-white/70 text-sm">Our global presence spans key strategic locations, enabling us to serve clients worldwide with localized expertise and 24/7 support capabilities.</p>
      </div>
    </div>
  </div>

  <script>
    gsap.registerPlugin(InertiaPlugin);

    function initGlowingInteractiveDotsGrid() {
      document.querySelectorAll('[data-dots-container-init]').forEach(container => {
        const colors = { base: "#333333", active: "#ffffff" };
        const threshold = 150;
        const speedThreshold = 100;
        const shockRadius = 250;
        const shockPower = 5;
        const maxSpeed = 5000;
        const centerHole = false;

        let dots = [];
        let dotCenters = [];

        function buildGrid() {
          container.innerHTML = "";
          dots = [];
          dotCenters = [];

          const style = getComputedStyle(container);
          const dotPx = parseFloat(style.fontSize) * 0.75;
          const gapPx = dotPx * 2.5;
          const contW = container.clientWidth;
          const contH = container.clientHeight;

          const cols = Math.floor((contW + gapPx) / (dotPx + gapPx));
          const rows = Math.floor((contH + gapPx) / (dotPx + gapPx));
          const total = cols * rows;

          for (let i = 0; i < total; i++) {
            const row = Math.floor(i / cols);
            const col = i % cols;

            const d = document.createElement("div");
            d.classList.add("dot");
            gsap.set(d, { x: 0, y: 0, backgroundColor: colors.base });
            d._inertiaApplied = false;

            container.appendChild(d);
            dots.push(d);
          }

          requestAnimationFrame(() => {
            dotCenters = dots.map(d => {
              const r = d.getBoundingClientRect();
              return {
                el: d,
                x: r.left + window.scrollX + r.width / 2,
                y: r.top + window.scrollY + r.height / 2
              };
            });
          });
        }

        window.addEventListener("resize", buildGrid);
        buildGrid();

        let lastTime = 0, lastX = 0, lastY = 0;

        window.addEventListener("mousemove", e => {
          const now = performance.now();
          const dt = now - lastTime || 16;
          let dx = e.pageX - lastX;
          let dy = e.pageY - lastY;
          let vx = dx / dt * 1000;
          let vy = dy / dt * 1000;
          let speed = Math.hypot(vx, vy);

          if (speed > maxSpeed) {
            const scale = maxSpeed / speed;
            vx *= scale; vy *= scale; speed = maxSpeed;
          }

          lastTime = now;
          lastX = e.pageX;
          lastY = e.pageY;

          requestAnimationFrame(() => {
            dotCenters.forEach(({ el, x, y }) => {
              const dist = Math.hypot(x - e.pageX, y - e.pageY);
              const t = Math.max(0, 1 - dist / threshold);
              const col = gsap.utils.interpolate(colors.base, colors.active, t);
              gsap.set(el, { backgroundColor: col });

              if (speed > speedThreshold && dist < threshold && !el._inertiaApplied) {
                el._inertiaApplied = true;
                const pushX = (x - e.pageX) + vx * 0.005;
                const pushY = (y - e.pageY) + vy * 0.005;

                gsap.to(el, {
                  inertia: { x: pushX, y: pushY, resistance: 750 },
                  onComplete() {
                    gsap.to(el, {
                      x: 0,
                      y: 0,
                      duration: 1.5,
                      ease: "elastic.out(1,0.75)"
                    });
                    el._inertiaApplied = false;
                  }
                });
              }
            });
          });
        });

        window.addEventListener("click", e => {
          dotCenters.forEach(({ el, x, y }) => {
            const dist = Math.hypot(x - e.pageX, y - e.pageY);
            if (dist < shockRadius && !el._inertiaApplied) {
              el._inertiaApplied = true;
              const falloff = Math.max(0, 1 - dist / shockRadius);
              const pushX = (x - e.pageX) * shockPower * falloff;
              const pushY = (y - e.pageY) * shockPower * falloff;

              gsap.to(el, {
                inertia: { x: pushX, y: pushY, resistance: 750 },
                onComplete() {
                  gsap.to(el, {
                    x: 0,
                    y: 0,
                    duration: 1.5,
                    ease: "elastic.out(1,0.75)"
                  });
                  el._inertiaApplied = false;
                }
              });
            }
          });
        });
      });
    }

    document.addEventListener('DOMContentLoaded', initGlowingInteractiveDotsGrid);
  </script>
</body>
</html>
