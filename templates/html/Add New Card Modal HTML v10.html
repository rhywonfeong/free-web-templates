  <meta charset="UTF-8">
  <title>Add New Card — Futurist Style (Turquoise Button)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');
    body {
      font-family: 'Orbitron', 'Segoe UI', 'Arial', sans-serif;
    }
    .futurist-glass {
      background: rgba(16,20,32,0.80);
      box-shadow: 0 8px 40px 2px #1f2937a6, 0 2px 6px #0009;
      border: 1.5px solid #1de9b6;
      backdrop-filter: blur(14px) saturate(150%);
    }
    .futurist-input {
      background: rgba(0, 0, 0, 0.22);
      border: 2px solid #1de9b6aa;
      color: #c7eafe;
      font-family: 'Orbitron', 'Segoe UI', 'Arial', sans-serif;
      letter-spacing: .025em;
      box-shadow: 0 0 0 1px #1de9b670;
      transition: border-color .2s, box-shadow .2s, color .2s;
    }
    .futurist-input:focus {
      border-color: #0093e9;
      box-shadow: 0 0 8px 2px #0093e9cc, 0 0px 3px #fff1;
      color: #fcfcfc;
    }
    .futurist-label {
      color: #66ffe6;
      font-weight: 600;
      font-size: 0.92rem;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 12px #1de9b670;
    }
    .turquoise-btn {
      background: linear-gradient(90deg,#1de9b6 0%,#0093e9 100%);
      color: #fff;
      border-radius: 1.1rem;
      box-shadow: 0 6px 30px #1de9b670, 0 0px 4px #0093e970;
      font-weight: bold;
      letter-spacing: .06em;
      text-shadow: 0 1px 8px #e0fff9;
      border: none;
      outline: none;
      transition: background 0.2s, box-shadow 0.2s, filter 0.2s;
    }
    .turquoise-btn:hover {
      background: linear-gradient(90deg,#0093e9 0%,#1de9b6 100%);
      filter: brightness(1.1) drop-shadow(0 0 8px #1de9b6cc) drop-shadow(0 0 12px #0093e999);
      box-shadow: 0 0 18px 7px #1de9b6bb, 0 6px 40px #0093e9bb;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#141e30] via-[#243b55] to-[#1e293b]">
  <div class="fixed inset-0 bg-black bg-opacity-60 z-0"></div>
  <div class="relative z-10 w-full max-w-lg px-4">
    <div class="futurist-glass rounded-3xl px-10 py-9">
      <div class="flex items-center justify-between mb-10">
        <h2 class="text-2xl font-bold tracking-widest text-cyan-200 uppercase drop-shadow-xl">Add New Card</h2>
        <button class="p-2 rounded-full bg-transparent hover:bg-cyan-900/50 active:bg-cyan-700/70 focus:outline-none focus:ring-2 focus:ring-[#1de9b6] transition">
          <svg class="w-7 h-7 text-cyan-200" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <form class="space-y-7">
        <div>
          <label class="futurist-label block mb-2">Cardholder Name</label>
          <input type="text" value="Alice Smith" class="futurist-input w-full rounded-xl py-2.5 px-5 text-lg placeholder-gray-400 outline-none" placeholder="Enter full name">
        </div>
        <div>
          <label class="futurist-label block mb-2">Card Number</label>
          <div class="relative flex items-center">
            <input type="text" value="4321 8765 2109 3344" class="futurist-input w-full rounded-xl py-2.5 px-5 text-lg pr-16 placeholder-gray-400 outline-none" maxlength="19" placeholder="Card number">
            <div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center">
              <span class="bg-gradient-to-r from-[#1de9b6] to-[#0093e9] rounded-lg w-10 h-7 flex items-center justify-center shadow-xl border border-[#1de9b670]">
                <svg width="24" height="14" viewBox="0 0 24 14" fill="none">
                  <rect x="2" y="3" width="20" height="8" rx="2" fill="#0093e9" fill-opacity="0.19"/>
                  <circle cx="12" cy="7" r="3" fill="#1de9b6"/>
                </svg>
              </span>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="futurist-label block mb-2">Expiry</label>
            <input type="text" value="05/28" maxlength="5" class="futurist-input w-full rounded-xl py-2.5 px-5 text-lg placeholder-gray-400 outline-none" placeholder="MM/YY">
          </div>
          <div>
            <label class="futurist-label block mb-2">CVV</label>
            <input type="text" value="789" maxlength="4" class="futurist-input w-full rounded-xl py-2.5 px-5 text-lg placeholder-gray-400 outline-none" placeholder="CVV">
          </div>
        </div>
        <div>
          <label class="futurist-label flex items-center mb-2 gap-2">
            <svg class="h-5 w-5 text-[#6fffe9]" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 21s-6-5.686-6-10a6 6 0 1112 0c0 4.314-6 10-6 10z"/>
              <circle cx="12" cy="11" r="2.5" fill="#00fff7"/>
            </svg>
            Verified Address
            <a href="#" class="ml-auto text-xs font-bold text-[#1de9b6] hover:text-[#0093e9] hover:underline transition">Edit</a>
          </label>
          <input type="text" value="456 Ocean Ave, Los Angeles, CA" class="futurist-input w-full rounded-xl py-2.5 px-5 text-lg placeholder-gray-400 outline-none mb-3" placeholder="Address">
          <input type="text" value="90001" class="futurist-input w-full rounded-xl py-2.5 px-5 text-lg placeholder-gray-400 outline-none" placeholder="Postal Code">
        </div>
        <button type="submit" class="turquoise-btn w-full mt-2 py-3 text-lg">Confirm</button>
      </form>
    </div>
  </div>
</body>
</html>
