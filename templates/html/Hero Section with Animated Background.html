    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Hero Background</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="antialiased bg-gray-900">
    <div id="hero" class="relative flex items-center justify-center min-h-screen w-full overflow-hidden">
        <!-- Vanta.js will be attached to this element -->
        <div id="vanta-bg" class="absolute inset-0 z-0"></div>
        
        <!-- Content overlay -->
        <div class="relative z-10 text-center px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto">
            <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight text-white">
                <span class="block">Discover Something</span>
                <span class="block text-indigo-400">Extraordinary</span>
            </h1>
            <p class="mt-6 text-xl text-gray-300 max-w-3xl mx-auto">
                Experience the future with our innovative solutions designed to transform your digital presence.
            </p>
            <div class="mt-10 flex justify-center gap-4">
                <a href="#" class="px-8 py-3 rounded-md bg-indigo-600 text-white font-medium hover:bg-indigo-700 transition-colors duration-300 shadow-lg hover:shadow-xl">
                    Get Started
                </a>
                <a href="#" class="px-8 py-3 rounded-md bg-gray-800 text-white font-medium hover:bg-gray-700 transition-colors duration-300 border border-gray-600">
                    Learn More
                </a>
            </div>
        </div>
        
        <!-- Optional scroll indicator -->
        <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 animate-bounce">
            <svg class="w-6 h-6 text-white" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
            </svg>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            VANTA.BIRDS({
                el: "#vanta-bg",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                backgroundColor: 0x0f172a,
                color1: 0x5f27cd,
                color2: 0x6c5ce7,
                birdSize: 1.20,
                wingSpan: 20.00,
                speedLimit: 4.00,
                separation: 30.00,
                quantity: 3.00
            });
        });
    </script>
</body>
</html>
