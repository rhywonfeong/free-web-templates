  <style>
    html, body {
      height: 100%;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      transform-style: preserve-3d;
      perspective: 80vmin;
    }
    section {
      width: 100vmin;
      aspect-ratio: 4 / 3;
      outline: 2px dashed red;
      transform-origin: 100% 50%;
      rotate: y 40deg;
      position: relative;
      container-type: inline-size;
      mask-image: linear-gradient(90deg, transparent 0 40px, #fff, transparent calc(100% - 40px) 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0 40px, #fff, transparent calc(100% - 40px) 100%);
      overflow: visible;
    }
    .logo {
      width: 40px;
      aspect-ratio: 1 / 1;
      position: absolute;
      animation-name: travel;
      animation-iteration-count: infinite;
      left: 0;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .star {
      width: 32px;
      height: 32px;
      display: block;
      filter: drop-shadow(0 0 6px hsl(var(--hue,200) 80% 60% / 0.7));
      transition: filter 0.3s;
    }
    @keyframes travel {
      0%   { translate: 100cqi 0; }
      100% { translate: -50% 0; }
    }
  </style>

  <script>
    const logos = document.querySelectorAll('.logo');
    for (let i = 0; i < logos.length; i++) {
      const hue = Math.floor(Math.random() * 360);
      const y = Math.floor(Math.random() * 100);
      const delay = Math.random() * 8;
      const duration = Math.random() * 8 + 4;
      logos[i].style.setProperty('--hue', hue);
      logos[i].style.setProperty('--y', y);
      logos[i].style.top = `calc(${y}% - 20px)`;
      logos[i].style.animationDelay = `-${delay}s`;
      logos[i].style.animationDuration = `${duration}s`;
      // Set SVG color
      const svg = logos[i].querySelector('.star');
      if(svg) svg.style.color = `hsl(${hue} 90% 60%)`;
    }
  </script>
