<!DOCTYPE html>
<html lang="es">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tu Viaje Paso a Paso</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
.dot-pattern {
background-image: radial-gradient(#ffffff 1px, transparent 1px);
background-size: 24px 24px;
opacity: 0.15;
}
/* Custom shape for the right background */
.bg-shape {
border-top-left-radius: 6rem;
}
</style></head>
<body class="bg-gray-50 text-slate-900 overflow-x-hidden min-h-screen flex flex-col justify-center relative">

    <!-- Decorative Bottom Swooshes -->
    <div class="absolute bottom-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute -bottom-32 -left-32 w-[600px] h-[600px] bg-white rounded-full opacity-60 blur-3xl"></div>
        <div class="absolute -bottom-48 left-0 w-[800px] h-[400px] bg-gray-100/80 rounded-[100%] rotate-3 origin-bottom-left"></div>
    </div>

    <main class="w-full max-w-7xl mx-auto px-6 lg:px-8 py-12 lg:py-20 relative z-10">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 items-center">
            
            <!-- Left Content -->
            <div class="content-col flex flex-col items-start max-w-2xl">
                <!-- Breadcrumb -->
                <div class="breadcrumb opacity-0 translate-y-4 inline-flex items-center gap-2 bg-white px-5 py-2.5 rounded-full shadow-sm border border-slate-100 mb-8">
                    <span class="text-slate-600 font-medium text-base">Inicio</span>
                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                    <span class="text-slate-900 font-medium text-base">tu viaje paso a paso</span>
                </div>

                <!-- Headline -->
                <h1 class="title opacity-0 translate-y-8 text-6xl lg:text-[5.5rem] leading-[0.95] font-bold tracking-tight text-slate-900 mb-8">
                    Tu viaje <br/>
                    paso a paso
                </h1>

                <!-- Body Text -->
                <p class="description opacity-0 translate-y-4 text-xl text-slate-600 leading-relaxed font-normal max-w-lg mb-8">
                    Más de 2.500 latinos como tú han vivido la experiencia de estudiar, trabajar e incluso migrar al país más feliz de Norte América con nosotros.
                </p>
            </div>

            <!-- Right Visuals -->
            <div class="visual-col relative h-[500px] lg:h-[700px] w-full flex items-end justify-center lg:justify-end">
                
                <!-- Background Diagonal Shapes Container -->
                <div class="absolute inset-0 z-0 overflow-visible lg:overflow-hidden">
                    <!-- Teal Strip -->
                    <div class="teal-strip opacity-0 absolute top-0 right-0 w-[120%] h-[120%] bg-[#2dd4bf] origin-bottom-left transform translate-x-32 -translate-y-12 rotate-[-40deg] rounded-tl-[4rem] z-0"></div>
                    
                    <!-- Dark Dot Pattern Shape -->
                    <div class="dark-shape opacity-0 absolute top-4 right-[-10%] w-[120%] h-[120%] bg-[#383a50] origin-bottom-left transform translate-x-32 translate-y-0 rotate-[-40deg] rounded-tl-[5rem] z-10 overflow-hidden shadow-2xl">
                        <div class="absolute inset-0 dot-pattern"></div>
                    </div>
                </div>

                <!-- Person Image -->
                <div class="person-img opacity-0 translate-y-12 relative z-20 h-[90%] w-auto flex items-end">
                    <!-- Using a placeholder that closely resembles the subject -->
                    <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/917d6f93-fb36-439a-8c48-884b67b35381_1600w.jpg" 
                         alt="Student with backpack" 
                         class="h-full w-auto object-cover object-top drop-shadow-2xl" 
                         style="mask-image: linear-gradient(to bottom, black 90%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 90%, transparent 100%); mix-blend-mode: normal;">
                </div>

                <!-- Floating Circle Inset -->
                <div class="circle-inset opacity-0 scale-50 absolute left-4 lg:left-10 bottom-24 lg:bottom-32 z-30">
                    <div class="w-32 h-32 lg:w-40 lg:h-40 rounded-full border-[6px] border-white shadow-xl overflow-hidden relative group cursor-pointer hover:scale-105 transition-transform duration-300">
                        <img src="https://images.unsplash.com/photo-1562774053-701939374585?q=80&w=2572&auto=format&fit=crop" 
                             alt="Campus Building" 
                             class="w-full h-full object-cover">
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // GSAP Animations
        document.addEventListener("DOMContentLoaded", () => {
            const tl = gsap.timeline({ defaults: { ease: "power3.out" } });

            // 1. Reveal Breadcrumb
            tl.to(".breadcrumb", {
                y: 0,
                opacity: 1,
                duration: 0.8
            })
            // 2. Reveal Title
            .to(".title", {
                y: 0,
                opacity: 1,
                duration: 1,
                stagger: 0.1
            }, "-=0.6")
            // 3. Reveal Paragraph
            .to(".description", {
                y: 0,
                opacity: 1,
                duration: 0.8
            }, "-=0.8")
            // 4. Slide in Background Shapes (Right side)
            .to(".teal-strip", {
                opacity: 1,
                x: 0, 
                y: 0,
                rotate: -45, // Target rotation
                duration: 1.2,
                ease: "power2.out"
            }, "-=1")
            .to(".dark-shape", {
                opacity: 1,
                x: 0,
                y: 0,
                rotate: -45, // Target rotation
                duration: 1.2,
                ease: "power2.out"
            }, "-=1.1")
            // 5. Slide up Person
            .to(".person-img", {
                y: 0,
                opacity: 1,
                duration: 1,
                ease: "back.out(1.2)"
            }, "-=0.8")
            // 6. Pop in Circle
            .to(".circle-inset", {
                scale: 1,
                opacity: 1,
                duration: 0.6,
                ease: "elastic.out(1, 0.5)"
            }, "-=0.6");
        });
    </script>
</body>
</html>
