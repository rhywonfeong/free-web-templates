<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-gradient-to-br from-pink-50 via-purple-50 to-blue-50 min-h-screen flex items-center justify-center font-sans overflow-hidden text-slate-800 relative selection:bg-pink-200 selection:text-pink-900">

    <!-- Background Elements Container -->
    <div id="bg-container" class="absolute inset-0 pointer-events-none z-0"></div>

    <!-- Music Toggle -->
    <button id="music-toggle" class="fixed top-6 right-6 z-50 w-10 h-10 bg-white/50 backdrop-blur-md border border-white/60 rounded-full flex items-center justify-center text-slate-500 hover:text-pink-500 hover:bg-white hover:shadow-sm transition-all duration-300 active:scale-95">
        <iconify-icon icon="solar:music-note-linear" stroke-width="1.5"></iconify-icon>
    </button>

    <!-- Main Glassmorphism Card -->
    <main class="relative z-10 w-full max-w-sm mx-4 p-8 bg-white/70 backdrop-blur-xl border border-white/80 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] text-center">
        
        <!-- Step 0: Landing -->
        <div id="step-0" class="step flex flex-col items-center gap-6 w-full transition-all duration-500 ease-out" style="opacity: 1; transform: translateY(0);">
            <div class="w-16 h-16 bg-gradient-to-tr from-pink-100 to-red-100 rounded-full flex items-center justify-center mb-2 shadow-inner border border-white text-2xl">
                💌
            </div>
            <h1 class="text-2xl font-semibold tracking-tight text-slate-800">
                Hey ❤️<br/>
                <span class="text-slate-500 font-medium text-lg mt-2 block tracking-normal">I have something to ask you...</span>
            </h1>
            <button onclick="goToStep(1)" class="mt-4 px-8 py-3 bg-slate-900 text-white rounded-full font-medium text-sm transition-all duration-300 hover:bg-slate-800 hover:shadow-[0_0_20px_rgba(236,72,153,0.2)] hover:scale-105 active:scale-95 flex items-center gap-2">
                Start <iconify-icon icon="solar:arrow-right-linear" stroke-width="1.5"></iconify-icon>
            </button>
        </div>

        <!-- Step 1 -->
        <div id="step-1" class="step hidden flex-col items-center gap-6 w-full transition-all duration-500 ease-out" style="opacity: 0; transform: translateY(1rem);">
            <div class="text-3xl mb-2 animate-pulse">🥺</div>
            <h1 class="text-2xl font-semibold tracking-tight text-slate-800">Do you think I’m cute?</h1>
            <div class="flex flex-col gap-3 w-full mt-2">
                <button onclick="goToStep(2)" class="w-full px-6 py-3 bg-white border border-slate-200 text-slate-700 rounded-full font-medium text-sm transition-all duration-300 hover:bg-pink-50 hover:text-pink-600 hover:border-pink-200 hover:scale-[1.02] active:scale-95">
                    Yes 😍
                </button>
                <button onclick="goToStep(2)" class="w-full px-6 py-3 bg-white border border-slate-200 text-slate-700 rounded-full font-medium text-sm transition-all duration-300 hover:bg-pink-50 hover:text-pink-600 hover:border-pink-200 hover:scale-[1.02] active:scale-95">
                    Very 😘
                </button>
            </div>
        </div>

        <!-- Step 2 -->
        <div id="step-2" class="step hidden flex-col items-center gap-6 w-full transition-all duration-500 ease-out" style="opacity: 0; transform: translateY(1rem);">
            <div class="text-3xl mb-2">💕</div>
            <h1 class="text-2xl font-semibold tracking-tight text-slate-800">Do you enjoy spending time with me?</h1>
            <div class="flex flex-col gap-3 w-full mt-2">
                <button onclick="goToStep(3)" class="w-full px-6 py-3 bg-white border border-slate-200 text-slate-700 rounded-full font-medium text-sm transition-all duration-300 hover:bg-pink-50 hover:text-pink-600 hover:border-pink-200 hover:scale-[1.02] active:scale-95">
                    Yes of course ❤️
                </button>
                <button onclick="goToStep(3)" class="w-full px-6 py-3 bg-white border border-slate-200 text-slate-700 rounded-full font-medium text-sm transition-all duration-300 hover:bg-pink-50 hover:text-pink-600 hover:border-pink-200 hover:scale-[1.02] active:scale-95">
                    Always 🥰
                </button>
            </div>
        </div>

        <!-- Step 3: Special Interaction -->
        <div id="step-3" class="step hidden flex-col items-center gap-6 w-full transition-all duration-500 ease-out" style="opacity: 0; transform: translateY(1rem);">
            <div class="text-3xl mb-2">😏❤️</div>
            <h1 class="text-2xl font-semibold tracking-tight text-slate-800">Do you love me?</h1>
            <div class="flex flex-row gap-4 w-full justify-center mt-4 relative min-h-[50px]">
                <button onclick="goToStep(4)" class="px-8 py-3 bg-pink-500 text-white rounded-full font-medium text-sm transition-all duration-300 hover:bg-pink-600 hover:shadow-lg hover:shadow-pink-200 hover:scale-110 active:scale-95 z-20">
                    Yes 😍
                </button>
                <button id="btn-no" class="px-8 py-3 bg-white border border-slate-200 text-slate-700 rounded-full font-medium text-sm whitespace-nowrap z-30" style="transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);">
                    No 😢
                </button>
            </div>
        </div>

        <!-- Step 4: Final -->
        <div id="step-4" class="step hidden flex-col items-center gap-5 w-full transition-all duration-500 ease-out" style="opacity: 0; transform: translateY(1rem);">
            <div class="w-20 h-20 bg-gradient-to-tr from-pink-400 to-purple-400 rounded-full flex items-center justify-center mb-2 shadow-xl shadow-pink-200 animate-bounce text-3xl">
                🥰
            </div>
            <h1 class="text-2xl font-semibold tracking-tight uppercase bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-violet-500">
                I LOVE YOU SO MUCH ❤️
            </h1>
            <p class="text-slate-500 font-medium text-sm">
                You make my world better every day 💖
            </p>
            <button onclick="location.reload()" class="mt-6 px-6 py-2.5 bg-slate-100 text-slate-600 rounded-full font-medium text-xs transition-all duration-300 hover:bg-slate-200 hover:text-slate-800 hover:scale-105 active:scale-95 flex items-center gap-2">
                <iconify-icon icon="solar:restart-linear" stroke-width="1.5"></iconify-icon> Replay
            </button>
        </div>

    </main>

    <script>
        // Smooth Screen Transitions
        const steps = document.querySelectorAll('.step');
        let currentStep = 0;

        function goToStep(index) {
            // Fade out current
            steps[currentStep].style.opacity = '0';
            steps[currentStep].style.transform = 'translateY(1rem)';
            steps[currentStep].style.pointerEvents = 'none';

            setTimeout(() => {
                steps[currentStep].classList.add('hidden');
                steps[currentStep].classList.remove('flex');
                
                currentStep = index;
                
                // Fade in next
                steps[currentStep].classList.remove('hidden');
                steps[currentStep].classList.add('flex');
                
                // Force reflow
                void steps[currentStep].offsetWidth;
                
                steps[currentStep].style.opacity = '1';
                steps[currentStep].style.transform = 'translateY(0)';
                steps[currentStep].style.pointerEvents = 'auto';

                if (index === 4) triggerConfetti();
            }, 300);
        }

        // Special Interaction: Running Button
        const noBtn = document.getElementById('btn-no');
        const funnyTexts = ["Are you sure? 🤨", "Think again 😜", "Wrong answer 😂", "Catch me! 🙈", "Nope! 🏃💨"];
        
        const dodgeButton = (e) => {
            e.preventDefault();
            const btnRect = noBtn.getBoundingClientRect();
            
            // Calculate safe bounds within window
            const maxX = window.innerWidth - btnRect.width - 20;
            const maxY = window.innerHeight - btnRect.height - 20;
            
            const randomX = Math.max(20, Math.random() * maxX);
            const randomY = Math.max(20, Math.random() * maxY);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            
            // Swap text randomly
            noBtn.innerText = funnyTexts[Math.floor(Math.random() * funnyTexts.length)];
        };

        noBtn.addEventListener('mouseover', dodgeButton);
        noBtn.addEventListener('touchstart', dodgeButton, { passive: false });
        noBtn.addEventListener('click', dodgeButton);

        // Background Hearts Animation
        const bgContainer = document.getElementById('bg-container');
        const fontSizes = ['text-xs', 'text-sm', 'text-base', 'text-lg'];
        const icons = ['❤️', '💖', '💕', '✨', '🫧'];

        function spawnFloatingHeart() {
            const el = document.createElement('div');
            el.innerText = icons[Math.floor(Math.random() * icons.length)];
            
            // Apply Tailwind classes for styling instead of inline px/em
            el.className = `absolute pointer-events-none opacity-40 blur-[0.5px] ${fontSizes[Math.floor(Math.random() * fontSizes.length)]}`;
            
            el.style.left = `${Math.random() * 100}vw`;
            el.style.top = '105vh'; // Start slightly below screen
            
            bgContainer.appendChild(el);

            const duration = 6000 + Math.random() * 6000;
            
            el.animate([
                { transform: 'translateY(0) rotate(0deg) scale(1)', opacity: 0 },
                { opacity: 0.5, offset: 0.2 },
                { opacity: 0.5, offset: 0.8 },
                { transform: `translateY(-120vh) rotate(${Math.random() * 90 - 45}deg) scale(1.5)`, opacity: 0 }
            ], {
                duration: duration,
                easing: 'linear',
                fill: 'forwards'
            }).onfinish = () => el.remove();
        }
        
        setInterval(spawnFloatingHeart, 500);

        // Confetti Explosion on Final Screen
        function triggerConfetti() {
            for(let i = 0; i < 60; i++) {
                const conf = document.createElement('div');
                conf.innerText = Math.random() > 0.5 ? '❤️' : '✨';
                conf.className = `fixed pointer-events-none z-50 ${fontSizes[Math.floor(Math.random() * fontSizes.length)]}`;
                conf.style.left = '50%';
                conf.style.top = '50%';
                document.body.appendChild(conf);

                const angle = Math.random() * Math.PI * 2;
                const velocity = 15 + Math.random() * 25;
                const tx = Math.cos(angle) * velocity * 15;
                const ty = Math.sin(angle) * velocity * 15;

                conf.animate([
                    { transform: 'translate(-50%, -50%) scale(0.5) rotate(0deg)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${Math.random() + 0.5}) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: 1000 + Math.random() * 1500,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                    fill: 'forwards'
                }).onfinish = () => conf.remove();
            }
        }

        // Music Toggle Logic (Visual Only to avoid external dependencies / autoplay block)
        let musicActive = false;
        let musicInterval;
        const musicBtn = document.getElementById('music-toggle');
        const musicIcon = musicBtn.querySelector('iconify-icon');

        musicBtn.addEventListener('click', () => {
            musicActive = !musicActive;
            if(musicActive) {
                musicIcon.setAttribute('icon', 'solar:stop-circle-linear');
                musicBtn.classList.add('text-pink-500', 'bg-white', 'shadow-md');
                musicInterval = setInterval(spawnMusicNote, 800);
            } else {
                musicIcon.setAttribute('icon', 'solar:music-note-linear');
                musicBtn.classList.remove('text-pink-500', 'bg-white', 'shadow-md');
                clearInterval(musicInterval);
            }
        });

        function spawnMusicNote() {
            const note = document.createElement('div');
            note.innerHTML = '<iconify-icon icon="solar:music-notes-linear"></iconify-icon>';
            note.className = 'fixed top-10 right-10 text-pink-400 text-sm pointer-events-none z-40';
            document.body.appendChild(note);
            
            note.animate([
                { transform: 'translate(0, 0) scale(0.5)', opacity: 0 },
                { opacity: 1, offset: 0.2 },
                { transform: `translate(-${20 + Math.random()*40}px, ${20 + Math.random()*40}px) scale(1.5)`, opacity: 0 }
            ], { 
                duration: 2000, 
                easing: 'ease-out', 
                fill: 'forwards' 
            }).onfinish = () => note.remove();
        }
    </script>
</body>
</html>
