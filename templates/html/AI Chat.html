          <button class="key flex-1 h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-xl font-normal flex items-center justify-center key-press transition-colors" data-char="~">~</button>
          <button class="key flex-1 h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-xl font-normal flex items-center justify-center key-press transition-colors" data-char="&lt;">&lt;</button>
          <button class="key flex-1 h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-xl font-normal flex items-center justify-center key-press transition-colors" data-char="&gt;">&gt;</button>
          <button class="key flex-1 h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-xl font-normal flex items-center justify-center key-press transition-colors" data-char="€">€</button>
          <button class="key flex-1 h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-xl font-normal flex items-center justify-center key-press transition-colors" data-char="£">£</button>
          <button class="key flex-1 h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-xl font-normal flex items-center justify-center key-press transition-colors" data-char="¥">¥</button>
          <button class="key flex-1 h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-xl font-normal flex items-center justify-center key-press transition-colors" data-char="•">•</button>
        </div>

        <!-- Row 3 -->
        <div class="flex justify-center gap-1.5 w-full">
          <button class="w-[12%] max-w-[42px] h-[42px] bg-[#ACB1B8] rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black flex items-center justify-center key-press-dark transition-colors" onclick="showNumbers()">
            <span class="text-base font-normal">123</span>
          </button>
          <div class="flex flex-1 justify-center gap-1.5">
            <button class="key flex-1 max-w-[56px] h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-xl font-normal flex items-center justify-center key-press transition-colors" data-char=".">.</button>
            <button class="key flex-1 max-w-[56px] h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-xl font-normal flex items-center justify-center key-press transition-colors" data-char=",">,</button>
            <button class="key flex-1 max-w-[56px] h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-xl font-normal flex items-center justify-center key-press transition-colors" data-char="?">?</button>
            <button class="key flex-1 max-w-[56px] h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-xl font-normal flex items-center justify-center key-press transition-colors" data-char="!">!</button>
            <button class="key flex-1 max-w-[56px] h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-xl font-normal flex items-center justify-center key-press transition-colors" data-char="'">'</button>
          </div>
          <button class="w-[12%] max-w-[42px] h-[42px] bg-[#ACB1B8] rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black flex items-center justify-center key-press-dark transition-colors" onclick="deleteLast()">
            <iconify-icon icon="solar:backspace-linear" width="24" height="24"></iconify-icon>
          </button>
        </div>

        <!-- Row 4 -->
        <div class="flex justify-center gap-1.5 w-full">
          <button class="w-[23%] max-w-[88px] h-[42px] bg-[#ACB1B8] rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-base font-normal key-press-dark transition-colors" onclick="showLetters()">ABC</button>
          <button class="key flex-1 h-[42px] bg-white rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-base font-normal key-press transition-colors" data-char=" ">space</button>
          <button class="w-[23%] max-w-[88px] h-[42px] bg-[#ACB1B8] rounded-[5px] shadow-[0_1px_0_rgba(0,0,0,0.3)] text-black text-base font-normal key-press-dark transition-colors" onclick="sendMessage()">retour</button>
        </div>
      </div>

    </div>

    <!-- Bottom Toolbar -->
    <div class="flex justify-between items-center px-6 pt-5 pb-2 relative max-w-[500px] w-full mx-auto">
      <button class="text-[#555860] hover:text-black transition-colors flex items-center justify-center">
        <iconify-icon icon="solar:smile-circle-linear" width="28" height="28"></iconify-icon>
      </button>
      <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-[130px] h-[5px] bg-black rounded-full"></div>
      <button class="text-[#555860] hover:text-black transition-colors flex items-center justify-center">
        <iconify-icon icon="solar:microphone-2-linear" width="28" height="28"></iconify-icon>
      </button>
    </div>

  </div>
</div>

<script>
  let inputText = '';
  let shiftActive = true; 
  let currentMode = 'letters'; 

  document.querySelectorAll('.key[data-char]').forEach(key => {
    key.addEventListener('click', () => {
      const char = key.dataset.char;
      if (char === ' ') { addChar(' '); return; }
      
      if (currentMode === 'letters') {
          addChar(shiftActive ? char.toUpperCase() : char.toLowerCase());
          if (shiftActive) toggleShift(); 
      } else {
          addChar(char);
      }
    });
  });

  function addChar(char) {
    inputText += char;
    updateDisplay();
  }

  function deleteLast() {
    inputText = inputText.slice(0, -1);
    updateDisplay();
    if (inputText.length === 0 && !shiftActive && currentMode === 'letters') {
      toggleShift();
    }
  }

  function toggleShift() {
    shiftActive = !shiftActive;
    const shiftKey = document.getElementById('shiftKey');
    
    if(shiftActive) {
      shiftKey.classList.add('shift-active', 'bg-white');
      shiftKey.classList.remove('bg-[#ACB1B8]');
    } else {
      shiftKey.classList.remove('shift-active', 'bg-white');
      shiftKey.classList.add('bg-[#ACB1B8]');
    }
    
    document.querySelectorAll('#letterKeys .key[data-char]').forEach(k => {
      if (k.dataset.char !== ' ') {
        k.textContent = shiftActive ? k.dataset.char.toUpperCase() : k.dataset.char.toLowerCase();
      }
    });
  }

  function showLetters() {
    currentMode = 'letters';
    document.getElementById('letterKeys').classList.remove('hidden');
    document.getElementById('numericKeys').classList.add('hidden');
    document.getElementById('symbolKeys').classList.add('hidden');
  }

  function showNumbers() {
    currentMode = 'numbers';
    document.getElementById('letterKeys').classList.add('hidden');
    document.getElementById('numericKeys').classList.remove('hidden');
    document.getElementById('symbolKeys').classList.add('hidden');
  }

  function showSymbols() {
    currentMode = 'symbols';
    document.getElementById('letterKeys').classList.add('hidden');
    document.getElementById('numericKeys').classList.add('hidden');
    document.getElementById('symbolKeys').classList.remove('hidden');
  }

  function updateDisplay() {
    const display = document.getElementById('textDisplay');
    
    if (inputText.length > 0) {
      display.innerHTML = `<span class="text-base text-black font-normal break-all flex items-center whitespace-pre-wrap">${escapeHtml(inputText)}<span class="inline-block w-[1.5px] h-5 bg-blue-500 cursor-blink rounded-full ml-px"></span></span>`;
    } else {
      display.innerHTML = `<span class="w-[1.5px] h-5 bg-blue-500 cursor-blink rounded-full"></span>`;
    }
    display.scrollLeft = display.scrollWidth;
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function appendUserMessage(text) {
    const area = document.getElementById('messagesArea');
    const row = document.createElement('div');
    row.className = 'text-white/80 text-base leading-relaxed text-right ml-8';
    row.innerHTML = escapeHtml(text);
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
  }

  function appendBotMessage(text) {
    const area = document.getElementById('messagesArea');
    const row = document.createElement('div');
    row.className = 'text-white/95 text-base leading-relaxed mr-8 mt-2';
    row.innerHTML = text; 
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
  }

  function sendMessage() {
    const text = inputText.trim();
    if (!text) return;

    appendUserMessage(text);
    
    inputText = '';
    updateDisplay();
    
    if (currentMode !== 'letters') {
      showLetters();
    }
    if (!shiftActive) {
      toggleShift(); 
    }

    setTimeout(() => {
      const lowerText = text.toLowerCase();
      
      if (lowerText.includes('vol') || lowerText.includes('volé') || lowerText.includes('voler') || lowerText.includes('perdu')) {
        const responseHtml = `
          Je suis vraiment désolé d'apprendre cela. Chaque minute compte maintenant, nous allons voir ensemble comment faire opposition à votre carte et en commander une nouvelle.
          <button class="mt-4 w-full bg-white text-neutral-900 font-medium py-3 px-4 rounded-xl flex items-center justify-center transition-transform active:scale-95 shadow-sm">
            Faire opposition à ma CB
          </button>
        `;
        appendBotMessage(responseHtml);
      } else if (lowerText.includes('conseiller') || lowerText.includes('contact') || lowerText.includes('parler')) {
        appendBotMessage("Je comprends que vous avez besoin d'aide, pourriez-vous m'expliquer quelle est votre problématique ?");
      } else {
        appendBotMessage("Je suis là pour vous aider. Que souhaitez-vous savoir ?");
      }
    }, 600);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace') { deleteLast(); return; }
    if (e.key === 'Enter') { sendMessage(); return; }
    if (e.key === 'Shift') { 
        if (!shiftActive && currentMode === 'letters') toggleShift(); 
        return; 
    }
    if (e.key.length === 1) { addChar(e.key); }
  });
</script>

</body></html>
