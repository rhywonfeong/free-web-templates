  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Payment Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #030712;
    }
    @keyframes meteor {
      0% { transform: rotate(215deg) translateX(0); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: rotate(215deg) translateX(-500px); opacity: 0; }
    }
    .meteor {
      position: absolute;
      height: 1px;
      width: 1px;
      border-radius: 9999px;
      background-color: rgba(209, 213, 219, 0.8);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
      transform: rotate(215deg);
      animation: meteor 5s linear infinite;
    }
    .meteor::before {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 1px;
      background: linear-gradient(to right, rgba(209,213,219,0.8), transparent);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-950 to-black p-4">

  <div class="relative w-[350px] h-[210px] rounded-2xl shadow-2xl border border-gray-800 bg-black/40 overflow-hidden">
    <!-- Meteor animation background -->
    <div id="meteor-container" class="absolute inset-0 bg-gray-950/90 z-0 pointer-events-none"></div>
    <!-- Card content -->
    <div class="relative z-10 h-full w-full flex flex-col justify-between p-6">
      <div class="flex items-center justify-between">
        <div class="flex flex-col">
          <span class="uppercase tracking-widest text-[10px] font-semibold text-gray-300/80 mb-1">Cosmic Bank</span>
          <span class="text-xs text-violet-200/70 tracking-wider">Premium</span>
        </div>
        <!-- Chip SVG -->
        <div class="w-10 h-7 bg-gradient-to-br from-gray-200/80 to-gray-400/80 rounded-lg flex items-center justify-center relative">
          <svg class="w-7 h-5" viewBox="0 0 44 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect y="5" width="44" height="18" rx="5" fill="#d1d5db"/>
            <rect x="7" y="0" width="30" height="28" rx="5" fill="#f3f4f6"/>
            <rect x="14" y="8" width="16" height="12" rx="2" fill="#e5e7eb"/>
            <rect x="19" y="12" width="6" height="4" rx="1" fill="#9ca3af"/>
          </svg>
          <div class="absolute top-0 left-0 w-full h-full rounded-lg border border-gray-300/50"></div>
        </div>
      </div>
      <!-- Card Number (smaller font size) -->
      <div class="mt-5 mb-2 select-none">
        <span class="block text-base md:text-lg font-mono tracking-widest text-white drop-shadow">5132  8745  2367  4412</span>
      </div>
      <div class="flex items-end justify-between">
        <div class="flex flex-col gap-2">
          <div>
            <span class="text-[10px] text-gray-400 tracking-widest uppercase">Card Holder</span>
            <div class="text-sm font-semibold text-white tracking-wide mt-0.5">ALEX STRIDER</div>
          </div>
        </div>
        <div class="flex flex-col items-end gap-2">
          <div class="flex flex-col">
            <span class="text-[10px] text-gray-400 uppercase tracking-widest">Expires</span>
            <span class="text-sm text-white font-semibold tracking-wider mt-0.5">08/28</span>
          </div>
          <!-- Visa/Mastercard logo (simple circle mockup) -->
          <div class="flex items-center gap-1 mt-2">
            <span class="inline-block w-5 h-5 rounded-full bg-gradient-to-tr from-orange-400 to-yellow-300 opacity-80"></span>
            <span class="inline-block w-5 h-5 rounded-full bg-gradient-to-tl from-orange-700 to-red-400 opacity-80 -ml-2"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const container = document.getElementById('meteor-container');
      const meteorCount = 18;
      for (let i = 0; i < meteorCount; i++) {
        const meteor = document.createElement('div');
        meteor.classList.add('meteor');
        const delay = Math.random() * 6;
        const duration = Math.random() * 4 + 3;
        const topPosition = Math.random() * 100;
        const leftPosition = Math.floor(Math.random() * 300) - 300;
        meteor.style.top = `${topPosition}%`;
        meteor.style.left = `${leftPosition}px`;
        meteor.style.animationDelay = `${delay}s`;
        meteor.style.animationDuration = `${duration}s`;
        // Color variety
        if (i % 3 === 0) {
          meteor.style.background = 'rgba(167, 139, 250, 0.8)';
          meteor.style.boxShadow = '0 0 1px rgba(167, 139, 250, 0.15)';
        } else if (i % 4 === 0) {
          meteor.style.background = 'rgba(96, 165, 250, 0.8)';
          meteor.style.boxShadow = '0 0 1px rgba(96, 165, 250, 0.15)';
        }
        container.appendChild(meteor);
      }
    });
  </script>
</body>
