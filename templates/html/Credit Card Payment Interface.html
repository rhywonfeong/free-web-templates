<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <div id="particles-js"></div>
  
  <div class="max-w-md w-full card-container">
    <div class="card-content shadow-2xl backdrop-blur-sm">
      <div class="relative font-manrope bg-gradient-to-br from-emerald-600 to-emerald-800 pt-6 pr-6 pb-6 pl-6">

        <div class="mt-4 flex items-center space-x-3">
          <div class="card-chip"></div>
          <svg class="w-6 h-6 text-emerald-200" fill="currentColor" viewBox="0 0 24 24">
            
          </svg>
        </div>
        
        <div class="mt-6">
          <div class="text-emerald-100 text-xl font-mono tracking-wider">•••• •••• •••• 1234</div>
          <div class="flex justify-between mt-3">
            <div>
              <div class="text-emerald-200 text-xs">VALID THRU</div>

            <div class="text-right">

          </div>
        </div>
      </div>
      
      <div class="font-manrope bg-gray-800 pt-6 pr-6 pb-6 pl-6">
        <div class="">
          <span class="px-3 py-1 bg-gray-700 rounded-full text-xs text-gray-300 mb-3 inline-block">PAYMENT DETAILS</span>
          <h3 class="text-xl font-semibold text-gray-100 mb-4">Card Information</h3>
          
          <form class="space-y-4 mb-6">
            <div class="">
              <label for="cardNumber" class="text-gray-300 text-xs font-medium block mb-1">CARD NUMBER</label>
              <input type="text" id="cardNumber" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="1234 5678 9012 3456" maxlength="19" required="">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
              <div class="">
                <label for="expiry" class="text-gray-300 text-xs font-medium block mb-1">EXPIRY DATE</label>
                <input type="text" id="expiry" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="MM/YY" maxlength="5" required="">
              </div>
              <div class="">
                <label for="cvv" class="text-gray-300 text-xs font-medium block mb-1">CVV</label>
                <input type="text" id="cvv" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="123" maxlength="4" required="">
              </div>
            </div>
            
            <div class="">
              <label for="cardName" class="text-gray-300 text-xs font-medium block mb-1">CARDHOLDER NAME</label>
              <input type="text" id="cardName" class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2 text-gray-100 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm" placeholder="John Doe" required="">
            </div>
            
            <div class="flex items-center">

          </form>
          
          <div class="flex justify-between text-sm space-x-3">

            <button class="flex-1 px-4 py-3 bg-gray-700 hover:bg-gray-600 text-gray-200 rounded-lg transition flex items-center justify-center font-medium">
              Cancel
            </button>
          </div>
        </div>
        
        <div class="mt-6 pt-4 text-center">
          <div class="divider-gradient mb-4"></div>
          <p class="text-gray-400 text-xs">Protected by 256-bit SSL encryption</p>
          <div class="flex items-center justify-center mt-4 space-x-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span class="text-gray-400 text-xs">Payment Gateway: Secure</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    particlesJS('particles-js', {
      particles: {
        number: { value: 80, density: { enable: true, value_area: 800 } },
        color: { value: "#10b981" },
        shape: { type: "circle" },
        opacity: { value: 0.5, random: false },
        size: { value: 3, random: true },
        line_linked: { enable: true, distance: 150, color: "#10b981", opacity: 0.4, width: 1 },
        move: { enable: true, speed: 6, direction: "none", random: false, straight: false, out_mode: "out", bounce: false }
      },
      interactivity: {
        detect_on: "canvas",
        events: { onhover: { enable: true, mode: "repulse" }, onclick: { enable: true, mode: "push" }, resize: true },
        modes: { grab: { distance: 400, line_linked: { opacity: 1 } }, bubble: { distance: 400, size: 40, duration: 2, opacity: 8, speed: 3 }, repulse: { distance: 200, duration: 0.4 }, push: { particles_nb: 4 }, remove: { particles_nb: 2 } }
      },
      retina_detect: true
    });

    // Card number formatting
    document.getElementById('cardNumber').addEventListener('input', function(e) {
      let value = e.target.value.replace(/\s+/g, '').replace(/[^0-9]/gi, '');
      let formattedValue = value.match(/.{1,4}/g)?.join(' ') || value;
      e.target.value = formattedValue;
    });

    // Expiry date formatting
    document.getElementById('expiry').addEventListener('input', function(e) {
      let value = e.target.value.replace(/\D/g, '');
      if (value.length >= 2) {
        value = value.substring(0,2) + '/' + value.substring(2,4);
      }
      e.target.value = value;
    });
  </script>
