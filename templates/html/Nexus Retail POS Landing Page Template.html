<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
/* Custom Keyframes for floating and entrance animations */
@keyframes float {
0%, 100% { transform: translateY(0px) rotate(0deg); }
50% { transform: translateY(-20px) rotate(2deg); }
}
@keyframes glow-pulse {
0%, 100% { opacity: 0.5; transform: scale(1); }
50% { opacity: 0.8; transform: scale(1.1); }
}
@keyframes slide-up-fade {
0% { opacity: 0; transform: translateY(20px); }
100% { opacity: 1; transform: translateY(0); }
}
.animate-float { animation: float 8s ease-in-out infinite; }
.animate-glow { animation: glow-pulse 4s ease-in-out infinite; }
.reveal-1 { animation: slide-up-fade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; animation-delay: 0.1s; }
.reveal-2 { animation: slide-up-fade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; animation-delay: 0.3s; }
.reveal-3 { animation: slide-up-fade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; animation-delay: 0.5s; }
/* 3D Abstract Shape Styling via CSS Gradients */
.abstract-shape {
background: linear-gradient(135deg, #e2e8f0 0%, #ffffff 50%, #d1d5db 100%);
box-shadow:
inset 10px 10px 40px rgba(255, 255, 255, 0.9),
inset -10px -10px 40px rgba(0, 0, 0, 0.1),
20px 40px 60px rgba(0, 0, 0, 0.2);
}
.core-glow {
background: radial-gradient(circle, rgba(0,122,255,0.8) 0%, rgba(0,122,255,0) 70%);
filter: blur(40px);
}
</style></head>
<body class="bg-[#F5F5F7] text-[#1D1D1F] overflow-hidden min-h-screen relative selection:bg-[#007AFF] selection:text-white">

    <!-- Navigation (Simulated minimalist header) -->
    <nav class="absolute top-0 w-full p-6 md:p-8 flex justify-between items-center z-50">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 bg-[#1D1D1F] rounded-full"></div>
            <span class="font-semibold text-lg tracking-tight">Nexus</span>
        </div>
        <button class="hidden md:block text-sm font-medium text-gray-500 hover:text-black transition-colors">Menu</button>
    </nav>

    <!-- Parallax Background Text -->
    <div id="parallax-bg" class="absolute inset-0 flex items-center justify-center overflow-hidden z-0 pointer-events-none">
        <h1 class="text-[15vw] md:text-[22vw] font-bold text-gray-300/30 tracking-tighter whitespace-nowrap select-none scale-110 transition-transform duration-100 ease-out transform translate-y-[-5%]" style="font-stretch: expanded;">
            NEXUS
        </h1>
    </div>

    <!-- Main Hero Grid -->
    <main class="relative z-10 w-full h-screen max-w-7xl mx-auto px-6 md:px-12 py-8 flex flex-col md:grid md:grid-cols-12 md:gap-8">
        
        <!-- Top Left Section: Headline -->
        <div class="order-1 md:order-none col-span-12 md:col-span-4 flex flex-col justify-start pt-16 md:pt-32 reveal-1">
            <div class="inline-flex self-start items-center gap-2 px-3 py-1 mb-6 border border-gray-200 bg-white/50 backdrop-blur-sm rounded-full shadow-sm">
                <div class="w-1.5 h-1.5 rounded-full bg-[#007AFF] animate-pulse"></div>
                <span class="text-xs font-semibold tracking-wide uppercase text-gray-500">POS Built for Scale</span>
            </div>
            <h2 class="text-5xl md:text-7xl font-semibold tracking-tight leading-[1.1] text-[#1D1D1F]">
                Sell Faster,<br>
                <span class="text-gray-400">Grow Smarter</span>
            </h2>
        </div>

        <!-- Center Section: 3D Element -->
        <div class="order-2 md:order-none col-span-12 md:col-span-4 flex items-center justify-center relative h-[40vh] md:h-auto reveal-2">
            <!-- Glow Effect behind object -->
            <div class="absolute w-48 h-48 md:w-64 md:h-64 core-glow animate-glow z-0"></div>
            
            <!-- Abstract 3D Object Constructed with CSS (simulating the chrome rock) -->
            <div id="hero-object" class="relative z-10 w-56 h-56 md:w-80 md:h-80 animate-float transition-transform duration-200 ease-out">
                <!-- Main facet -->
                <div class="abstract-shape absolute inset-0 rounded-[3rem] rotate-45 transform skew-x-12 skew-y-6 opacity-90 border border-white/40"></div>
                <!-- Secondary facet (overlay for depth) -->
                <div class="abstract-shape absolute inset-4 rounded-[2.5rem] bg-gradient-to-br from-white via-gray-100 to-transparent opacity-80 backdrop-blur-md rotate-[20deg]"></div>
                <!-- Metallic Highlight -->
                <div class="absolute top-10 right-10 w-24 h-24 bg-gradient-to-bl from-white to-transparent rounded-full opacity-60 blur-xl"></div>
                <!-- Dark contrast element -->
                <div class="absolute bottom-10 left-10 w-20 h-20 bg-[#1D1D1F] rounded-full blur-2xl opacity-20 mix-blend-multiply"></div>
            </div>
        </div>

        <!-- Bottom Right Section: Description & CTA -->
        <div class="order-3 md:order-none col-span-12 md:col-span-4 flex flex-col justify-end items-start md:items-end pb-12 md:pb-32 reveal-3">
            <p class="text-lg md:text-xl text-gray-500 leading-relaxed md:text-right max-w-sm mb-8">
                Revolutionize your retail experience with a high-performance, cloud-based POS system designed for speed, security, and effortless scaling.
            </p>
            
            <button class="group relative inline-flex items-center gap-3 bg-[#1D1D1F] text-white pl-6 pr-4 py-3 rounded-full hover:bg-black transition-all duration-300 hover:scale-105 hover:shadow-lg">
                <span class="font-medium text-sm">Get Started</span>
                <span class="bg-white/20 rounded-full p-1 group-hover:bg-white group-hover:text-black transition-colors duration-300">
                    <i data-lucide="arrow-right" class="w-4 h-4 transition-transform duration-300 group-hover:-rotate-45"></i>
                </span>
            </button>
        </div>

    </main>

    <!-- Gradient Overlay for smooth fade at edges -->
    <div class="fixed bottom-0 left-0 w-full h-32 bg-gradient-to-t from-[#F5F5F7] to-transparent pointer-events-none z-20 md:hidden"></div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Mouse Parallax Logic
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;

            // Move Background Text
            const bgText = document.querySelector('h1');
            bgText.style.transform = `translateX(${x}px) translateY(${y}px)`;

            // Subtle rotation of 3D object based on mouse
            const object = document.getElementById('hero-object');
            const rotateX = y * 0.5;
            const rotateY = x * 0.5;
            object.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });
    </script>
</body>
