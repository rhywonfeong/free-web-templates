<body class="bg-gray-50 font-inter">
    <div class="relative w-full h-screen overflow-hidden">
        <!-- Game Canvas -->
        <div id="game-container" class="w-full h-full"></div>
        
        <!-- UI Overlay -->
        <div class="absolute top-0 left-0 right-0 z-10 p-4">
            <div class="flex items-center justify-between">
                <div class="bg-white/90 backdrop-blur-sm rounded-xl px-4 py-3 shadow-sm border border-gray-200">
                    <h1 class="text-lg font-semibold text-gray-900 tracking-tight">Minecraft Demo</h1>
                </div>
                <div class="bg-white/90 backdrop-blur-sm rounded-xl px-4 py-3 shadow-sm border border-gray-200">
                    <div class="text-sm text-gray-600">
                        <span class="font-medium">FPS:</span> <span id="fps">60</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Block Selector -->
        <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-10">
            <div class="bg-white/90 backdrop-blur-sm rounded-xl p-3 shadow-sm border border-gray-200">
                <div class="flex items-center space-x-3">
                    <button id="grass-block" class="w-12 h-12 rounded-lg bg-green-500 border-2 border-green-600 shadow-sm hover:scale-105 transition-transform" data-block="grass"></button>
                    <button id="stone-block" class="w-12 h-12 rounded-lg bg-gray-500 border-2 border-gray-600 shadow-sm hover:scale-105 transition-transform" data-block="stone"></button>
                    <button id="dirt-block" class="w-12 h-12 rounded-lg bg-amber-700 border-2 border-amber-800 shadow-sm hover:scale-105 transition-transform" data-block="dirt"></button>
                    <button id="wood-block" class="w-12 h-12 rounded-lg bg-amber-600 border-2 border-amber-700 shadow-sm hover:scale-105 transition-transform" data-block="wood"></button>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="absolute bottom-4 right-4 z-10">
            <div class="bg-white/90 backdrop-blur-sm rounded-xl p-4 shadow-sm border border-gray-200">
                <div class="text-sm text-gray-600 space-y-1">
                    <div><span class="font-medium">WASD:</span> Move</div>
                    <div><span class="font-medium">Mouse drag:</span> Look around</div>
                    <div><span class="font-medium">Left click:</span> Place block</div>
                    <div><span class="font-medium">Right click:</span> Remove block</div>
                </div>
            </div>
        </div>

        <!-- Crosshair -->
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-10 pointer-events-none">
            <div class="w-4 h-4">
                <div class="absolute top-1/2 left-0 w-4 h-0.5 bg-white/80 transform -translate-y-1/2 shadow-sm"></div>
                <div class="absolute left-1/2 top-0 w-0.5 h-4 bg-white/80 transform -translate-x-1/2 shadow-sm"></div>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let world = new Map();
        let selectedBlock = 'grass';
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        
        // Camera drag variables
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let dragStartPosition = { x: 0, y: 0 };

        // Block materials
        const materials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x4ade80 }),
            stone: new THREE.MeshLambertMaterial({ color: 0x6b7280 }),
            dirt: new THREE.MeshLambertMaterial({ color: 0x92400e }),
            wood: new THREE.MeshLambertMaterial({ color: 0xd97706 })
        };

        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 50, 200);

            // Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 20, 20);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('game-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(50, 50, 25);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Generate initial world
            generateWorld();

            // Event listeners
            setupEventListeners();

            // Start animation loop
            animate();
        }

        function generateWorld() {
            const size = 20;
            for (let x = -size; x < size; x++) {
                for (let z = -size; z < size; z++) {
                    const height = Math.floor(Math.sin(x * 0.1) * Math.cos(z * 0.1) * 3) + 5;
                    for (let y = 0; y < height; y++) {
                        let blockType = 'dirt';
                        if (y === height - 1) blockType = 'grass';
                        if (y < 2) blockType = 'stone';
                        
                        addBlock(x, y, z, blockType);
                    }
                }
            }
        }

        function addBlock(x, y, z, blockType) {
            const key = `${Math.round(x)},${Math.round(y)},${Math.round(z)}`;
            if (world.has(key)) return;

            const mesh = new THREE.Mesh(blockGeometry, materials[blockType]);
            mesh.position.set(Math.round(x), Math.round(y), Math.round(z));
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { blockType, x: Math.round(x), y: Math.round(y), z: Math.round(z) };
            
            scene.add(mesh);
            world.set(key, mesh);
        }

        function removeBlock(x, y, z) {
            const key = `${Math.round(x)},${Math.round(y)},${Math.round(z)}`;
            const block = world.get(key);
            if (block) {
                scene.remove(block);
                world.delete(key);
            }
        }

        function setupEventListeners() {
            // Mouse down - start drag or prepare for block action
            renderer.domElement.addEventListener('mousedown', (event) => {
                isDragging = false;
                dragStartPosition.x = event.clientX;
                dragStartPosition.y = event.clientY;
                previousMousePosition.x = event.clientX;
                previousMousePosition.y = event.clientY;
            });

            // Mouse move - camera drag
            document.addEventListener('mousemove', (event) => {
                if (event.buttons === 0) return; // No button pressed
                
                const dragDistance = Math.abs(event.clientX - dragStartPosition.x) + Math.abs(event.clientY - dragStartPosition.y);
                
                if (dragDistance > 5) { // Start dragging after minimum movement
                    isDragging = true;
                    renderer.domElement.style.cursor = 'grabbing';
                    
                    const deltaMove = {
                        x: event.clientX - previousMousePosition.x,
                        y: event.clientY - previousMousePosition.y
                    };

                    const sensitivity = 0.005;
                    camera.rotation.y -= deltaMove.x * sensitivity;
                    camera.rotation.x -= deltaMove.y * sensitivity;
                    camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));

                    previousMousePosition.x = event.clientX;
                    previousMousePosition.y = event.clientY;
                }
            });

            // Mouse up - handle block placement/removal if not dragging
            document.addEventListener('mouseup', (event) => {
                if (!isDragging) {
                    handleBlockAction(event);
                }
                isDragging = false;
                renderer.domElement.style.cursor = 'crosshair';
            });

            // Right click for block removal - prevent context menu
            renderer.domElement.addEventListener('contextmenu', (event) => {
                event.preventDefault();
            });

            // Set initial cursor
            renderer.domElement.style.cursor = 'crosshair';

            // Keyboard controls
            document.addEventListener('keydown', (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                }
            });

            document.addEventListener('keyup', (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            });

            // Block selector
            document.querySelectorAll('[data-block]').forEach(button => {
                button.addEventListener('click', (e) => {
                    selectedBlock = e.target.dataset.block;
                    document.querySelectorAll('[data-block]').forEach(b => b.classList.remove('ring-2', 'ring-blue-500'));
                    e.target.classList.add('ring-2', 'ring-blue-500');
                });
            });

            // Window resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function handleBlockAction(event) {
            // Use center of screen for raycasting (crosshair position)
            mouse.x = 0;
            mouse.y = 0;
            
            raycaster.setFromCamera(mouse, camera);
            
            // Get all blocks for intersection testing
            const blocks = [];
            world.forEach(block => blocks.push(block));
            
            const intersects = raycaster.intersectObjects(blocks);
            
            if (intersects.length > 0) {
                const intersect = intersects[0];
                const block = intersect.object;
                
                if (event.button === 0) { // Left click - place block
                    const face = intersect.face;
                    const normal = face.normal.clone();
                    normal.transformDirection(block.matrixWorld);
                    
                    const newPos = block.position.clone().add(normal);
                    addBlock(newPos.x, newPos.y, newPos.z, selectedBlock);
                } else if (event.button === 2) { // Right click - remove block
                    removeBlock(block.userData.x, block.userData.y, block.userData.z);
                }
            }
        }

        function updateMovement() {
            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            // Get camera's forward and right vectors
            const forward = new THREE.Vector3();
            const right = new THREE.Vector3();
            
            camera.getWorldDirection(forward);
            right.crossVectors(forward, camera.up).normalize();
            
            // Remove Y component from forward vector for horizontal movement
            forward.y = 0;
            forward.normalize();
            
            // Calculate movement based on camera orientation
            const moveVector = new THREE.Vector3();
            const speed = 20;
            
            // Forward/backward movement
            if (moveForward) {
                moveVector.add(forward.clone().multiplyScalar(speed * delta));
            }
            if (moveBackward) {
                moveVector.add(forward.clone().multiplyScalar(-speed * delta));
            }
            
            // Left/right movement
            if (moveLeft) {
                moveVector.add(right.clone().multiplyScalar(-speed * delta));
            }
            if (moveRight) {
                moveVector.add(right.clone().multiplyScalar(speed * delta));
            }
            
            camera.position.add(moveVector);

            prevTime = time;
        }

        function animate() {
            requestAnimationFrame(animate);
            
            updateMovement();
            
            renderer.render(scene, camera);
            
            // Update FPS (simplified)
            if (Math.random() < 0.1) { // Update occasionally to avoid constant DOM updates
                document.getElementById('fps').textContent = '60';
            }
        }

        // Initialize the game
        init();

        // Set default selected block
        document.getElementById('grass-block').classList.add('ring-2', 'ring-blue-500');
    </script>
</body>
