<body class="bg-white text-neutral-900 pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white border-b border-neutral-100 px-4 h-14 flex items-center justify-between">
        <div class="flex items-center gap-2">

            </button>
        </div>

    <!-- Main Content -->
    <main class="max-w-lg mx-auto p-4 space-y-8">

        <!-- Section 1: Profile Summary Card (Sidebar Content adapted for Mobile) -->

                </div>
                <button class="absolute bottom-0 right-0 bg-white border border-neutral-200 p-2 rounded-full shadow-sm text-primary">
                    <i data-lucide="camera" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Profile Actions -->
            <button class="text-primary font-bold text-sm flex items-center gap-1.5 hover:opacity-80 transition-opacity">
                <i data-lucide="plus" class="w-4 h-4"></i>

            </button>

            <div class="w-full bg-white rounded-lg border border-neutral-200 p-4 text-left space-y-4 shadow-sm">

                    <i data-lucide="chevron-right" class="w-4 h-4 text-neutral-400"></i>
                </div>
                
                <!-- Service Item 1 -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">

                        <p>잔여 자기소개서 ai 분석 (8/10회)</p>
                    </div>
                    <a href="#" class="text-neutral-400 text-xs underline decoration-neutral-300 underline-offset-2">결제 정보</a>
                </div>

                <div class="h-px bg-neutral-100 w-full"></div>

                <!-- Service Item 2 -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-sm tracking-tight">AI 패키지 3개월 구독권</span>
                        <span class="text-primary text-xs font-medium">D-39</span>
                    </div>
                    <div class="text-xs text-neutral-500">

                    </div>
                    
                    <!-- Age -->

                        <label class="w-16 text-neutral-900 font-medium whitespace-nowrap">나이</label>

                        </div>
                    </div>
                </div>
            </div>

            <div class="h-px bg-neutral-200 w-full"></div>

            <!-- Education -->
            <div class="space-y-4">

                                <option>대학교</option>
                                <option>대학원</option>
                            </select>
                            <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-neutral-400 pointer-events-none"></i>
                        </div>
                        <input type="text" placeholder="학교명" class="flex-1 bg-neutral-100 text-neutral-900 rounded-lg px-3 py-3 text-sm focus:outline-none focus:ring-1 focus:ring-primary border border-transparent placeholder-neutral-400">

            <!-- Desired Industry -->

                <h2 class="text-lg font-bold text-primary border-l-4 border-primary pl-3 leading-none">희망 산업</h2>
                
                <div class="flex flex-wrap items-center gap-2 p-1">
                    <!-- Tags Loop -->
                    <div class="flex items-center gap-1 bg-white border border-neutral-200 rounded px-3 py-1.5 shadow-sm">
                        <span class="text-sm text-neutral-800">IT</span>
                        <button class="text-neutral-400 hover:text-red-500 ml-1">
                            <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                    </div>
                    <div class="flex items-center gap-1 bg-white border border-neutral-200 rounded px-3 py-1.5 shadow-sm">
                        <span class="text-sm text-neutral-800">요식업</span>
                        <button class="text-neutral-400 hover:text-red-500 ml-1">
                            <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                    </div>
                    <div class="flex items-center gap-1 bg-white border border-neutral-200 rounded px-3 py-1.5 shadow-sm">
                        <span class="text-sm text-neutral-800">제조업</span>
                        <button class="text-neutral-400 hover:text-red-500 ml-1">

                    <div class="flex items-center gap-1 bg-white border border-neutral-200 rounded px-3 py-1.5 shadow-sm">

            <!-- Current Situation -->

    <!-- Floating Bottom Action Bar -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-neutral-100 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40">

            <button class="flex-1 bg-neutral-200 text-neutral-500 font-bold py-3.5 rounded-lg text-sm transition-colors hover:bg-neutral-300">

            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
