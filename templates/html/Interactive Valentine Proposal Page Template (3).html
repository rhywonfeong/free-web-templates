<style>
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}
/* Subtle animated background mesh */
.mesh-bg {
background-color: #fdfcfc;
background-image:
radial-gradient(at 0% 0%, hsla(350, 89%, 96%, 1) 0, transparent 50%),
radial-gradient(at 100% 0%, hsla(340, 100%, 96%, 1) 0, transparent 50%),
radial-gradient(at 100% 100%, hsla(350, 89%, 96%, 1) 0, transparent 50%),
radial-gradient(at 0% 100%, hsla(340, 100%, 96%, 1) 0, transparent 50%);
transition: background-image 2s ease;
}
.mesh-bg.celebrate {
background-image:
radial-gradient(at 0% 0%, hsla(350, 90%, 94%, 1) 0, transparent 50%),
radial-gradient(at 100% 0%, hsla(330, 100%, 92%, 1) 0, transparent 50%),
radial-gradient(at 100% 100%, hsla(350, 90%, 94%, 1) 0, transparent 50%),
radial-gradient(at 0% 100%, hsla(330, 100%, 92%, 1) 0, transparent 50%);
}
/* Floating animation */
@keyframes float {
0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
50% { transform: translateY(-20px) rotate(5deg); opacity: 0.6; }
}
.floating-icon {
animation: float 6s ease-in-out infinite;
}
/* Animations */
.fade-in-up {
animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
opacity: 0;
transform: translateY(10px);
}
@keyframes fadeInUp {
to { opacity: 1; transform: translateY(0); }
}
.fade-out {
animation: fadeOut 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
@keyframes fadeOut {
to { opacity: 0; transform: translateY(-10px); }
}
/* Button Shine */
.btn-shine {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
transform: skewX(-20deg) translateX(-150%);
transition: 0.5s;
}
.group:hover .btn-shine {
transform: skewX(-20deg) translateX(150%);
transition-duration: 1s;
}
/* Confetti */
.confetti-heart {
position: fixed;
animation: dropConfetti 4s ease-in forwards;
z-index: 100;
}
@keyframes dropConfetti {
0% { transform: translateY(-10vh) rotate(0deg) scale(0); opacity: 0; }
10% { opacity: 1; transform: translateY(0) rotate(45deg) scale(1); }
100% { transform: translateY(110vh) rotate(360deg) scale(0.8); opacity: 0; }
}
.delay-100 { animation-delay: 0.1s; }
.delay-200 { animation-delay: 0.2s; }
.delay-300 { animation-delay: 0.3s; }
</style></head>

    <main id="main-container" class="relative z-10 w-full max-w-2xl px-6 flex flex-col items-center justify-center min-h-[400px]">

        <!-- Screen 2: The Question -->
        <div id="screen-2" class="w-full hidden flex-col items-center text-center relative h-[400px]">
            <div class="fade-in-up w-full flex flex-col items-center">
                <div class="mb-6 inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-50 border border-rose-100 text-rose-600 text-[10px] font-medium tracking-widest uppercase">

                <div class="flex flex-col items-center gap-4 w-full max-w-xs relative">

                    <button id="btn-no" onmouseover="dodgeButton()" ontouchstart="dodgeButton()" class="w-full py-3.5 bg-white hover:bg-slate-50 border border-slate-200 text-slate-500 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 z-10">

                <div class="animate-bounce mt-4">
                     <iconify-icon icon="solar:arrow-down-linear" class="text-2xl text-rose-300"></iconify-icon>

        <div id="screen-4" class="w-full hidden flex-col items-center text-center">

                        <div class="w-12 h-12 rounded-full bg-orange-50 text-orange-400 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">

                        </div>
                        <span class="text-sm font-medium text-slate-600 group-hover:text-rose-600">A Warm Hug 🤍</span>
                    </button>

                        <div class="w-12 h-12 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">

    <script>
        const btnNo = document.getElementById('btn-no');
        const bgMusic = document.getElementById('bg-music');
        let moveCount = 0;

        function nextScreen(current, next) {
            const currentEl = document.getElementById(`screen-${current}`);
            const nextEl = document.getElementById(`screen-${next}`);
            
            // Fade out current
            currentEl.classList.add('fade-out');
            
            setTimeout(() => {
                currentEl.classList.add('hidden');
                currentEl.classList.remove('fade-out');
                
                // Show next
                nextEl.classList.remove('hidden');
                nextEl.classList.add('flex'); // Ensure flex display
                
                // Trigger animations for next screen elements
                const children = nextEl.querySelectorAll('.fade-in-up');
                children.forEach(child => {
                    child.style.animation = 'none';
                    child.offsetHeight; /* trigger reflow */
                    child.style.animation = null; 
                });
            }, 450);
        }

        function dodgeButton() {
            moveCount++;
            const phrases = [
                "Oops… missed it 😜",
                "Not so easy 😏",
                "Try again, cutie 👀❤️",
                "Too slow! 🏃‍♂️",
                "Nice try! ✨"
            ];

            // Update text
            const span = btnNo.querySelector('span');
            span.innerText = phrases[moveCount % phrases.length];

            // Mobile fallback
            if (window.innerWidth < 768 && moveCount > 5) {
                btnNo.style.opacity = '0.5';
                btnNo.style.pointerEvents = 'none';
            }

            // Calculate movement
            // Using fixed positioning relative to viewport to ensure it runs away
            const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
            const vh = Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
            
            const btnRect = btnNo.getBoundingClientRect();
            const btnW = btnRect.width;
            const btnH = btnRect.height;

            // Generate new random position with padding
            let newX = Math.random() * (vw - btnW - 40) + 20;
            let newY = Math.random() * (vh - btnH - 40) + 20;

            btnNo.style.position = 'fixed';
            btnNo.style.left = `${newX}px`;
            btnNo.style.top = `${newY}px`;
            btnNo.style.width = 'auto'; // allow it to shrink if needed
            btnNo.style.minWidth = '120px';
            btnNo.style.zIndex = '50';
            
            // Add tilt
            const rotate = Math.random() * 20 - 10;
            btnNo.style.transform = `rotate(${rotate}deg)`;
        }

        function handleYes() {
            // Play Music
            bgMusic.volume = 0.5;
            bgMusic.play().catch(e => console.log("Audio requires interaction first"));
            
            // Confetti
            fireConfetti();
            document.body.classList.add('celebrate');
            
            // Transition
            nextScreen(2, 3);
            
            // Auto advance after reading (optional, but button provided)
            setTimeout(() => {
               // Optional auto-scroll or hint could go here
            }, 2000);
        }

        function finalizeChoice(choice) {
            // Show sealed deal alert
            const btn = event.currentTarget;
            btn.innerHTML = `
                <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-500 flex items-center justify-center text-2xl mb-3">
                    <iconify-icon icon="solar:check-circle-bold"></iconify-icon>
                </div>
                <span class="text-sm font-medium text-emerald-600">Valentine Confirmed 💘</span>
            `;
            
            setTimeout(() => {
                nextScreen(4, 5);
                fireConfetti();
            }, 800);
        }

        function fireConfetti() {
            const icons = ['heart-bold', 'star-bold', 'music-note-bold', 'confetti-minimalistic-bold'];
            const colors = ['#f43f5e', '#fb7185', '#fda4af', '#e11d48'];

            const interval = setInterval(() => {
                const heart = document.createElement('div');
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                
                heart.innerHTML = `<iconify-icon icon="solar:${randomIcon}"></iconify-icon>`;
                heart.className = 'confetti-heart';
                
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = -50 + 'px';
                heart.style.color = colors[Math.floor(Math.random() * colors.length)];
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 4000);
            }, 100);

            setTimeout(() => clearInterval(interval), 3000);
        }
    </script>
