  <meta charset="UTF-8">
  <title>Nebula Account Setup</title>

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    body { background: #0f172a; font-family: 'Space Grotesk', sans-serif;}

      position: absolute;
      background-color: rgba(255,255,255,0.6);

<body class="relative min-h-screen overflow-x-hidden">
  <div id="particles-container" class="fixed inset-0 z-0 pointer-events-none"></div>
  <!-- Header -->
  <header class="fixed top-0 left-0 w-full z-10 px-6 py-4 bg-indigo-950/30 border-b border-indigo-900/30 backdrop-blur-sm">
    <div class="max-w-4xl mx-auto flex items-center">
      <div class="flex items-center">
        <div class="w-8 h-8 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 flex items-center justify-center">

        </div>
        <span class="ml-2 text-white font-bold text-xl">Nebula</span>
      </div>
      <span class="ml-auto text-gray-400 text-sm hidden sm:block">Already a member? <a href="#" class="text-purple-400 hover:underline">Sign in</a></span>
    </div>
  </header>
  <!-- Main Content -->
  <main class="flex items-center justify-center min-h-screen pt-32 pb-12 px-4 relative z-10">
    <div class="w-full max-w-2xl rounded-2xl bg-indigo-900/30 border border-indigo-800/60 shadow-2xl py-12 px-7 md:px-14 backdrop-blur-md flex flex-col relative">
      <!-- Stepper -->
      <ol class="flex justify-between items-center mb-12">
        <li class="flex-1 flex flex-col items-center relative z-10">
          <div class="mb-1 w-9 h-9 flex items-center justify-center rounded-full active-step font-bold shadow">1</div>
          <span class="text-xs text-purple-200">Personal</span>
        </li>
        <div class="hidden sm:block h-1 flex-1 bg-purple-700/30 mx-1"></div>
        <li class="flex-1 flex flex-col items-center relative">
          <div class="mb-1 w-9 h-9 flex items-center justify-center rounded-full bg-indigo-700/60 text-white font-bold">2</div>
          <span class="text-xs text-purple-100 opacity-80">Verification</span>
        </li>
        <div class="hidden sm:block h-1 flex-1 bg-purple-700/30 mx-1"></div>
        <li class="flex-1 flex flex-col items-center relative">
          <div class="mb-1 w-9 h-9 flex items-center justify-center rounded-full bg-indigo-700/60 text-white font-bold">3</div>
          <span class="text-xs text-purple-100 opacity-80">Complete</span>
        </li>
      </ol>
      <!-- Form Content -->
      <form class="w-full flex flex-col gap-6 z-10">
        <h2 class="text-2xl font-bold text-white mb-2">Create your account</h2>
        <p class="text-gray-400 mb-2">Let’s get started with your basic information.</p>
        <div class="flex flex-col gap-4">
          <div class="flex flex-col md:flex-row md:gap-4">

            <input type="text" placeholder="Last Name" required class="px-4 py-3 rounded-lg border border-gray-700 bg-indigo-950/40 text-gray-100 flex-1 mt-4 md:mt-0 focus:outline-none focus:border-purple-500 transition"/>
          </div>
          <input type="email" placeholder="Email Address" required class="px-4 py-3 rounded-lg border border-gray-700 bg-indigo-950/40 text-gray-100 focus:outline-none focus:border-purple-500 transition"/>
          <input type="password" placeholder="Create Password" required class="px-4 py-3 rounded-lg border border-gray-700 bg-indigo-950/40 text-gray-100 focus:outline-none focus:border-purple-500 transition"/>
          <input type="tel" placeholder="Mobile Number" class="px-4 py-3 rounded-lg border border-gray-700 bg-indigo-950/40 text-gray-100 focus:outline-none focus:border-purple-500 transition"/>
        </div>
        <button type="submit" class="glow mt-2 py-3 rounded-lg bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold text-lg tracking-wide hover:from-purple-700 hover:to-indigo-700 transition">Continue</button>

      <div class="mt-8 text-center text-xs text-gray-400">

      </div>
      <div class="absolute -inset-4 blur-2xl pointer-events-none z-0">
        <div class="w-full h-full rounded-2xl bg-gradient-to-r from-purple-700/10 via-indigo-700/15 to-transparent"></div>
      </div>
    </div>
  </main>
  <script>
    // Particle animation
    const container = document.getElementById('particles-container');
    let particles = [];
    function createParticles() {
      particles.forEach(p=>p.el?.remove());
      particles = [];
      for(let i=0;i<45;i++){
        const el=document.createElement('div');
        el.className='particle';
        const sz=Math.random()*2+1.3;
        el.style.width=sz+'px';el.style.height=sz+'px';
        const x=Math.random()*window.innerWidth;
        const y=Math.random()*window.innerHeight;
        el.style.left=x+'px';el.style.top=y+'px';
        const o=Math.random()*0.35+0.18;
        const h=Math.random()*60+220;
        el.style.backgroundColor=`hsla(${h},80%,70%,${o})`;
        container.appendChild(el);
        particles.push({el,x,y,ox:x,oy:y,vx:0,vy:0,speed:Math.random()*0.28+0.12});
      }
    }
    let mx=window.innerWidth/2,my=window.innerHeight/2;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
    function animate(){
      particles.forEach(p=>{
        const dx=mx-p.x,dy=my-p.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<75){const f=(75-d)/75;
          p.vx-=(dx/d)*f*0.11;
          p.vy-=(dy/d)*f*0.11;
        }
        p.vx+=(p.ox-p.x)*0.011;p.vy+=(p.oy-p.y)*0.011;
        p.vx*=0.94;p.vy*=0.94;
        p.x+=p.vx*p.speed;p.y+=p.vy*p.speed;
        p.el.style.transform=`translate(${p.x-p.ox}px
,${p.y-p.oy}px)`;
      });
      requestAnimationFrame(animate);
    }
    createParticles();
    animate();
    window.addEventListener('resize', createParticles);
  </script>
