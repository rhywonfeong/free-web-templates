<style>
/* Custom CSS for Effects not covered by Tailwind utilities */
body {
background-color: #000;
color: #e5e5e5;
overflow-x: hidden;
}
/* Scanline Effect */
.scanlines {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: linear-gradient(
to bottom,
rgba(255,255,255,0),
rgba(255,255,255,0) 50%,
rgba(0,0,0,0.2) 50%,
rgba(0,0,0,0.2)
);
background-size: 100% 4px;
z-index: 50;
pointer-events: none;
opacity: 0.15;
}
/* CRT Flicker */
.crt-overlay {
position: fixed;
top: 0;
left: 0;
width: 100vw;
height: 100vh;
background: rgba(18, 16, 16, 0.1);
opacity: 0;
z-index: 50;
pointer-events: none;
animation: flickerAnimation 0.15s infinite;
}
@keyframes flickerAnimation {
0% { opacity: 0.02; }
5% { opacity: 0.05; }
10% { opacity: 0.02; }
100% { opacity: 0.02; }
}
/* Glitch Text Effect */
.glitch {
position: relative;
}
.glitch::before,
.glitch::after {
content: attr(data-text);
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: #000;
}
.glitch::before {
left: 2px;
text-shadow: -1px 0 #00ffff;
clip: rect(44px, 450px, 56px, 0);
animation: glitch-anim 5s infinite linear alternate-reverse;
}
.glitch::after {
left: -2px;
text-shadow: -1px 0 #9d00ff;
clip: rect(44px, 450px, 56px, 0);
animation: glitch-anim2 5s infinite linear alternate-reverse;
}
@keyframes glitch-anim {
0% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.5deg); }
5% { clip: rect(80px, 9999px, 90px, 0); transform: skew(0.2deg); }
10% { clip: rect(30px, 9999px, 10px, 0); transform: skew(-0.5deg); }
100% { clip: rect(60px, 9999px, 70px, 0); }
}
@keyframes glitch-anim2 {
0% { clip: rect(60px, 9999px, 20px, 0); transform: skew(0.2deg); }
5% { clip: rect(10px, 9999px, 80px, 0); transform: skew(-0.2deg); }
10% { clip: rect(90px, 9999px, 50px, 0); transform: skew(0.5deg); }
100% { clip: rect(30px, 9999px, 40px, 0); }
}
/* Fog Animation */
.fog-container {
position: fixed;
width: 100%;
height: 100%;
top: 0;
left: 0;
z-index: 0;
pointer-events: none;
overflow: hidden;
opacity: 0.4;
}
.fog-img {
position: absolute;
height: 100vh;
width: 300vw;
z-index: 1;
opacity: 0.5;
background: url('https://raw.githubusercontent.com/danielstuart14/CSS_FOG_ANIMATION/master/fog1.png') repeat-x;
background-size: contain;
animation: fog 60s linear infinite;
}
.fog-img-2 {
position: absolute;
height: 100vh;
width: 300vw;
z-index: 2;
opacity: 0.3;
background: url('https://raw.githubusercontent.com/danielstuart14/CSS_FOG_ANIMATION/master/fog2.png') repeat-x;
background-size: contain;
animation: fog 40s linear infinite;
top: 30%;
}
@keyframes fog {
0% { transform: translate3d(0, 0, 0); }
100% { transform: translate3d(-200vw, 0, 0); }
}
/* Glassmorphism */
.glass-card {
background: rgba(10, 10, 10, 0.6);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(255, 255, 255, 0.05);
box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(157, 0, 255, 0.05);
}
/* Typewriter Cursor */
.typewriter-cursor::after {
content: '|';
animation: blink 1s step-end infinite;
color: #00FFFF;
}
@keyframes blink { 50% { opacity: 0; } }
/* Noise Texture */
.noise {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
z-index: 40;
opacity: 0.03;
background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}
/* Utility for input styling */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active{
-webkit-box-shadow: 0 0 0 30px #050505 inset !important;
-webkit-text-fill-color: white !important;
transition: background-color 5000s ease-in-out 0s;
}
/* Rune Glow */
.rune-active {
filter: drop-shadow(0 0 8px #9D00FF);
color: #9D00FF;
}
.rune-locked {
filter: blur(1px);
color: #333;
}

    <!-- Script Logic -->
    <script>
        // Typewriter Effect
        const text = "Only those who hold the key may pass";
        const typewriterElement = document.getElementById('typewriter');
        let i = 0;

        function typeWriter() {
            if (i < text.length) {
                typewriterElement.innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 50 + Math.random() * 50); // Random variation for realism
            }
        }
        
        // Start typewriter after a slight delay
        setTimeout(typeWriter, 1000);

        // Wallet Logic
        const walletStep = document.getElementById('wallet-step');
        const interactionStep = document.getElementById('interaction-step');
        const balanceDisplay = document.getElementById('balance-display');
        const walletAddress = document.getElementById('wallet-address');
        const statusMessage = document.getElementById('status-message');
        const gateControl = document.getElementById('gate-control');

        function connectWallet() {
            // Simulate connection delay
            const btn = walletStep.querySelector('button');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<iconify-icon icon="solar:refresh-circle-linear" class="animate-spin" width="20"></iconify-icon> Connecting...';
            btn.classList.add('cursor-wait');

            setTimeout(() => {
                walletStep.classList.add('hidden');
                interactionStep.classList.remove('hidden');
                interactionStep.classList.add('flex');
                
                // Mock Data
                const mockAddress = "8yP3...jK9s";
                const mockBalance = 888; // Sufficient amount
                // const mockBalance = 400; // Test insufficient by changing this

                walletAddress.innerText = mockAddress;
                
                // Count up animation for balance
                let currentBal = 0;
                const interval = setInterval(() => {
                    currentBal += 11;
                    if (currentBal >= mockBalance) {
                        currentBal = mockBalance;
                        clearInterval(interval);
                        checkEligibility(mockBalance);
                    }
                    balanceDisplay.innerText = currentBal;
                }, 20);

            }, 1800);
        }

        function checkEligibility(balance) {
            if (balance >= 777) {
                statusMessage.innerHTML = '<span class="text-liminal-cyan" style="text-shadow:0 0 5px cyan">Essence Sufficient. The path opens.</span>';
                gateControl.classList.remove('opacity-50', 'pointer-events-none');
                gateControl.classList.add('opacity-100');
            } else {
                statusMessage.innerHTML = '<span class="text-red-500 glitch" data-text="INSUFFICIENT ESSENCE">Insufficient essence. 777 $LMNS required.</span>';
            }
        }

        function attemptCross() {
            const input = document.getElementById('pass-input');
            const btn = gateControl.querySelector('button');
            
            if (input.value.trim().length > 0) {
                btn.innerText = "Dissolving Reality...";
                
                // Trigger Success Sequence
                setTimeout(() => {
                    const overlay = document.getElementById('success-overlay');
                    const msg = document.getElementById('success-message');
                    
                    // Flash
                    overlay.classList.remove('hidden');
                    overlay.classList.add('animate-ping'); // tailwind ping is simplistic, usually needs custom, but works for flash
                    overlay.style.animation = "ping 0.5s cubic-bezier(0, 0, 0.2, 1) forwards reverse";
                    
                    // Fade to black outcome
                    setTimeout(() => {
                        overlay.style.backgroundColor = "black";
                        overlay.style.opacity = "1";
                        msg.classList.remove('hidden');
                        msg.classList.add('flex');
                    }, 200);

                }, 1000);
            } else {
                input.classList.add('animate-pulse', 'border-red-500');
                setTimeout(() => input.classList.remove('animate-pulse', 'border-red-500'), 1000);
            }
        }
    </script>
