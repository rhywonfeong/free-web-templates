  <meta charset="UTF-8">
  <title>Dark Mesh Credit Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://geist-fonts.vercel.app/geist/Geist.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Geist', 'Lato', sans-serif; background: #121927; }
    @media (max-width: 767px) { .responsive-scale { transform: scale(1.1); } }
    .mesh1 { animation: mesh1 7s ease-in-out infinite alternate; }
    .mesh2 { animation: mesh2 6.3s ease-in-out infinite alternate; }
    .mesh3 { animation: mesh3 4.8s ease-in-out infinite alternate; }
    .mesh4 { animation: mesh4 8.2s ease-in-out infinite alternate; }
    @keyframes mesh1 {
      0%{transform:translate(-55%,-62%) scale(1);}
      33%{transform:translate(-38%,-46%) scale(1.34);}
      66%{transform:translate(-85%,-62%) scale(1.12);}
      100%{transform:translate(-55%,-62%) scale(1);}
    }
    @keyframes mesh2 {
      0%{transform:translate(-60%,-30%) scale(1);}
      30%{transform:translate(-42%,-32%) scale(1.27);}
      70%{transform:translate(-69%,-37%) scale(0.92);}
      100%{transform:translate(-60%,-30%) scale(1);}
    }
    @keyframes mesh3 {
      0%{transform:translate(-33%,-70%) scale(1);}
      40%{transform:translate(-18%,-33%) scale(0.82);}
      90%{transform:translate(-70%,-60%) scale(1.23);}
      100%{transform:translate(-33%,-70%) scale(1);}
    }
    @keyframes mesh4 {
      0%{transform:translate(-15%,-60%) scale(1);}
      50%{transform:translate(-49%,-67%) scale(1.36);}
      100%{transform:translate(-15%,-60%) scale(1);}
    }
    .mesh-overlay { mix-blend-mode: overlay; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">
  <div class="relative w-[53vmin] h-[33vmin] bg-[#191f2e]/[.98] custom-shadow responsive-scale rounded-[2.2vmin] overflow-hidden flex items-center"
       style="box-shadow:0 8px 40px 0 rgba(25,35,93,0.23),0 1.5px 10px 0 rgba(25,35,93,0.19);">
    <!-- Mesh gradients -->
    <div class="absolute top-1/2 left-1/2 w-[34vmin] h-[25vmin] rounded-full mesh1 pointer-events-none"
        style="background:linear-gradient(120deg,#6366f1 92%,transparent 100%);filter:blur(3.2vmin);"></div>
    <div class="absolute top-1/2 left-1/2 w-[30vmin] h-[25vmin] rounded-full mesh2 pointer-events-none"
        style="background:linear-gradient(80deg,#2563eb 85%,transparent 100%);filter:blur(2.4vmin);"></div>
    <div class="absolute top-1/2 left-1/2 w-[26vmin] h-[18vmin] rounded-full mesh-overlay bg-white/25 mesh3 pointer-events-none"
        style="filter:blur(1.5vmin);"></div>
    <div class="absolute top-1/2 left-1/2 w-[15vmin] h-[16vmin] rounded-full mesh4 pointer-events-none"
        style="background:linear-gradient(95deg,#fb923c 80%,transparent 100%);filter:blur(1.8vmin);"></div>
    <!-- Chip -->
    <div class="absolute top-[3.3vmin] left-[3vmin] flex flex-col items-center z-10">
      <svg width="46" height="32" viewBox="0 0 46 32" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-[6.3vmin] h-[4.6vmin]">
        <rect x="1" y="1" width="44" height="30" rx="6" fill="#475569" stroke="#cbd5e1" stroke-width="2"/>
        <rect x="7" y="7" width="32" height="18" rx="3" fill="#cbd5e1"/>
        <path d="M10.5,15 h25" stroke="#64748b" stroke-width="1.1"/>
        <path d="M10.5,21 h25" stroke="#64748b" stroke-width="1.1"/>
        <path d="M15,10 v12" stroke="#64748b" stroke-width="1.1"/>
        <path d="M31,10 v12" stroke="#64748b" stroke-width="1.1"/>
      </svg>
    </div>
    <!-- Card Logo (top-right) -->
    <div class="absolute top-[3.2vmin] right-[3.2vmin] flex items-center z-10">
      <svg width="42" height="28" viewBox="0 0 42 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-[5.3vmin] h-[3.5vmin]">
        <defs>
          <linearGradient id="logoGradientDark" x1="0" y1="0" x2="42" y2="28" gradientUnits="userSpaceOnUse">
            <stop stop-color="#2563eb"/>
            <stop offset="0.65" stop-color="#6366f1"/>
            <stop offset="1" stop-color="#fb923c"/>
          </linearGradient>
        </defs>
        <path d="M6 22 Q21 2 36 22" stroke="url(#logoGradientDark)" stroke-width="5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <!-- Card Number (centered) -->
    <div class="absolute left-1/2 top-[47%] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center w-full z-10">
      <span class="font-mono text-[2.7vmin] tracking-widest text-white/90 drop-shadow font-semibold select-none">
        4628&nbsp;&nbsp;9301&nbsp;&nbsp;2457&nbsp;&nbsp;1098

    </div>

      <div>
        <span class="block uppercase text-[1.08vmin] tracking-widest font-bold text-white/55 select-none">cardholder</span>
        <span class="block text-white/90 text-[1.6vmin] tracking-wide font-medium select-none">YOUR NAME</span>
      </div>
      <div class="flex flex-col items-end">
        <span class="uppercase text-[1.08vmin] tracking-widest font-bold text-white/55 select-none">expires</span>
        <span class="text-white/90 text-[1.51vmin] font-semibold select-none">08/27</span>
      </div>
    </div>
  </div>
</body>
