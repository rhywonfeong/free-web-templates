<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

  <meta charset="UTF-8">
  <meta name="viewport" content="width=430, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stats Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>body{background:#08081a;}</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#08081a] text-white">
  <div class="relative w-[390px] max-w-full h-[844px] bg-gradient-to-b from-[#181830] to-[#0a0a17] shadow-xl rounded-[40px] overflow-hidden border-4 border-[#171731] flex flex-col mx-auto">
    <div class="absolute left-1/2 -top-1.5 -translate-x-1/2 z-10 flex items-center justify-center" style="height:44px;">
      <div class="w-24 h-4 bg-black/80 rounded-b-3xl mt-2"></div>
    </div>
    <div class="flex-1 flex flex-col">
      <div class="flex justify-between items-center p-2 text-xs mt-2">
        <span id="clock">9:41</span>
        <div class="flex space-x-1">
          <i class="fas fa-signal"></i>
          <i class="fas fa-wifi"></i>
          <i class="fas fa-battery-three-quarters"></i>
        </div>
      </div>
      <header class="px-6 py-4">
        <div class="flex justify-between items-center">
          <h1 class="text-2xl font-bold">Statistics</h1>
          <button id="datePickerBtn" class="h-8 w-8 flex items-center justify-center rounded-full bg-[#1e1e3a]">
            <i class="fas fa-calendar-alt text-sm"></i>
          </button>
        </div>
      </header>
      <div class="px-6 mb-4">
        <div class="flex bg-[#1e1e3a] rounded-xl p-1.5">
          <button class="time-period flex-1 py-2 rounded-lg text-gray-400 font-medium text-sm" data-period="week">Week</button>
          <button class="time-period flex-1 py-2 rounded-lg bg-gradient-to-r from-pink-500 to-purple-500 text-white font-medium text-sm" data-period="month">Month</button>
          <button class="time-period flex-1 py-2 rounded-lg text-gray-400 font-medium text-sm" data-period="year">Year</button>
          <button class="time-period flex-1 py-2 rounded-lg text-gray-400 font-medium text-sm" data-period="all">All</button>
        </div>
      </div>
      <main class="px-6 pb-20 flex-1 overflow-y-auto hide-scrollbar">
        <div class="bg-[#1e1e3a] rounded-2xl p-5 shadow-lg mb-6">
          <div class="flex justify-between items-center mb-5">
            <h3 class="font-bold">Monthly Overview</h3>
            <span id="periodLabel" class="text-xs text-purple-400">May 2023</span>
          </div>
          <div class="h-[180px] relative mb-4">
            <canvas id="barChart"></canvas>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div class="bg-[#151530] rounded-xl p-3">
              <div class="text-xs text-gray-400 mb-1">Income</div>
              <div id="incomeAmount" class="font-bold">$3,540</div>
              <div class="flex items-center text-green-400 text-xs mt-1">
                <i class="fas fa-arrow-up mr-1"></i>
                <span id="incomeChange">+12.6%</span>
              </div>
            </div>
            <div class="bg-[#151530] rounded-xl p-3">
              <div class="text-xs text-gray-400 mb-1">Expenses</div>
              <div id="expenseAmount" class="font-bold">$2,238</div>
              <div class="flex items-center text-red-400 text-xs mt-1">
                <i class="fas fa-arrow-up mr-1"></i>
                <span id="expenseChange">+3.1%</span>
              </div>
            </div>
          </div>
        </div>
        <div class="bg-[#1e1e3a] rounded-2xl p-5 shadow-lg mb-6">
          <div class="flex justify-between items-center mb-5">
            <h3 class="font-bold">Spending Breakdown</h3>
            <button class="text-xs text-purple-400">See All</button>
          </div>
          <div class="flex mb-5">
            <div class="w-24 h-24 relative mr-5">
              <canvas id="pieChart"></canvas>
              <div class="absolute inset-0 flex items-center justify-center flex-col">
                <span class="text-xs text-gray-400">Total</span>
                <span id="totalSpending" class="font-bold">$2,238</span>
              </div>
            </div>
            <div class="flex-1" id="pieChartLegend">
              <!-- Legend will be generated by JS -->
            </div>
          </div>
        </div>
        <div class="mb-6">
          <div class="flex justify-between items-center mb-4">
            <h3 class="font-bold">Top Spending</h3>
            <button class="text-xs text-purple-400">View All</button>
          </div>
          <div id="topSpendingContainer">
            <!-- Top spending categories will be generated by JS -->
          </div>
        </div>
      </main>
    </div>
    <nav class="absolute bottom-0 left-0 right-0 bg-[#151530]/90 rounded-t-3xl py-4 px-6 backdrop-blur-sm" style="z-index:20;">
      <div class="flex justify-between items-center">
        <div class="nav-item flex flex-col items-center cursor-pointer" data-page="finance">
          <i class="fas fa-dollar-sign text-gray-400"></i>
          <span class="text-xs text-gray-400 mt-1">Finance</span>
        </div>
        <div class="nav-item flex flex-col items-center cursor-pointer" data-page="wallet">
          <i class="fas fa-wallet text-gray-400"></i>
          <span class="text-xs text-gray-400 mt-1">Wallet</span>
        </div>
        <div class="relative -mt-8">
          <button class="w-14 h-14 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center shadow-lg shadow-pink-500/20" id="addButton">
            <i class="fas fa-plus text-white text-xl"></i>
          </button>
        </div>
        <div class="nav-item flex flex-col items-center active cursor-pointer" data-page="stats">
          <i class="fas fa-chart-pie text-purple-500"></i>
          <span class="text-xs text-purple-500 mt-1">Stats</span>
          <div class="w-1 h-1 bg-purple-500 rounded-full mt-1"></div>
        </div>
        <div class="nav-item flex flex-col items-center cursor-pointer" data-page="more">
          <i class="fas fa-ellipsis-h text-gray-400"></i>
          <span class="text-xs text-gray-400 mt-1">More</span>
        </div>
      </div>
    </nav>
  </div>
  <script>
    // Update clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();
    
    // Data for different time periods
    const data = {
      week: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        values: [120, 210, 270, 150, 330, 240, 90],
        income: 1540,
        incomeChange: '+8.3%',
        expenses: 1410,
        expenseChange: '+5.2%',
        period: 'This Week'
      },
      month: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        values: [240, 420, 540, 300, 660, 480, 180],
        income: 3540,
        incomeChange: '+12.6%',
        expenses: 2238,
        expenseChange: '+3.1%',
        period: 'May 2023'
      },
      year: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
        values: [1500, 1800, 2200, 1900, 2500, 2300, 2100, 2400, 2600, 2800, 3000, 3200],
        income: 31240,
        incomeChange: '+15.8%',
        expenses: 24680,
        expenseChange: '+7.4%',
        period: '2023'
      },
      all: {
        labels: ['2019', '2020', '2021', '2022', '2023'],
        values: [18000, 22000, 27000, 32000, 35000],
        income: 134000,
        incomeChange: '+22.4%',
        expenses: 98500,
        expenseChange: '+18.2%',
        period: 'All Time'
      }
    };
    
    // Spending categories data
    const spendingCategories = [
      { name: 'Shopping', amount: 783, percentage: 35, transactions: 15, icon: 'shopping-bag', color: 'rgb(147, 51, 234)' },
      { name: 'Food', amount: 695, percentage: 31, transactions: 28, icon: 'utensils', color: 'rgb(236, 72, 153)' },
      { name: 'Transport', amount: 492, percentage: 22, transactions: 12, icon: 'car', color: 'rgb(59, 130, 246)' },
      { name: 'Others', amount: 268, percentage: 12, transactions: 8, icon: 'tag', color: 'rgb(16, 185, 129)' }
    ];
    
    // Initialize charts
    let barChart, pieChart;
    let currentPeriod = 'month';
    
    function initCharts() {
      // Bar Chart
      const barCtx = document.getElementById('barChart').getContext('2d');
      barChart = new Chart(barCtx, {
        type: 'bar',
        data: {
          labels: data[currentPeriod].labels,
          datasets: [{
            label: 'Spending',
            data: data[currentPeriod].values,
            backgroundColor: 'rgb(168, 85, 247)',
            borderColor: 'rgb(168, 85, 247)',
            borderWidth: 0,
            borderRadius: 4,
            barThickness: 12
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              grid: {
                color: 'rgba(255, 255, 255, 0.05)',
                drawBorder: false
              },
              ticks: {
                color: 'rgba(255, 255, 255, 0.5)',
                font: { size: 10 }
              }
            },
            x: {
              grid: { display: false },
              ticks: {
                color: 'rgba(255, 255, 255, 0.5)',
                font: { size: 10 }
              }
            }
          }
        }
      });
      
      // Pie Chart
      const pieCtx = document.getElementById('pieChart').getContext('2d');
      pieChart = new Chart(pieCtx, {
        type: 'doughnut',
        data: {
          labels: spendingCategories.map(cat => cat.name),
          datasets: [{
            data: spendingCategories.map(cat => cat.percentage),
            backgroundColor: spendingCategories.map(cat => cat.color),
            borderWidth: 0,
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '70%',
          plugins: {
            legend: { display: false }
          }
        }
      });
      
      // Generate pie chart legend
      const legendContainer = document.getElementById('pieChartLegend');
      legendContainer.innerHTML = '';
      spendingCategories.forEach(category => {
        const legendItem = document.createElement('div');
        legendItem.className = 'flex items-center justify-between mb-2';
        legendItem.innerHTML = `
          <div class="flex items-center">
            <div class="w-3 h-3 rounded-sm mr-2" style="background-color: ${category.color}"></div>
            <span class="text-sm">${category.name}</span>
          </div>
          <div class="text-sm font-medium">$${category.amount}</div>
        `;
        legendContainer.appendChild(legendItem);
      });
      
      // Generate top spending categories
      const topSpendingContainer = document.getElementById('topSpendingContainer');
      topSpendingContainer.innerHTML = '';
      spendingCategories.slice(0, 3).forEach((category, index) => {
        const categoryItem = document.createElement('div');
        categoryItem.className = 'bg-[#1e1e3a] rounded-2xl p-4 shadow-lg' + (index < 2 ? ' mb-3' : '');
        categoryItem.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="flex items-center">
              <div class="w-10 h-10 rounded-full bg-${category.color.includes('rgb(147, 51, 234)') ? 'purple' : category.color.includes('rgb(236, 72, 153)') ? 'pink' : category.color.includes('rgb(59, 130, 246)') ? 'blue' : 'green'}-500/20 flex items-center justify-center mr-3">
                <i class="fas fa-${category.icon} text-${category.color.includes('rgb(147, 51, 234)') ? 'purple' : category.color.includes('rgb(236, 72, 153)') ? 'pink' : category.color.includes('rgb(59, 130, 246)') ? 'blue' : 'green'}-400"></i>
              </div>
              <div>
                <p class="font-medium">${category.name}</p>
                <p class="text-xs text-gray-400">${category.transactions} transactions</p>
              </div>
            </div>
            <div class="text-right">
              <p class="font-bold">$${category.amount}</p>
              <p class="text-xs text-gray-400">${category.percentage}%</p>
            </div>
          </div>
        `;
        topSpendingContainer.appendChild(categoryItem);
      });
    }
    
    function updateCharts() {
      // Update bar chart
      barChart.data.labels = data[currentPeriod].labels;
      barChart.data.datasets[0].data = data[currentPeriod].values;
      barChart.update();
      
      // Update financial data
      document.getElementById('incomeAmount').textContent = `$${data[currentPeriod].income}`;
      document.getElementById('incomeChange').textContent = data[currentPeriod].incomeChange;
      document.getElementById('expenseAmount').textContent = `$${data[currentPeriod].expenses}`;
      document.getElementById('expenseChange').textContent = data[currentPeriod].expenseChange;
      document.getElementById('periodLabel').textContent = data[currentPeriod].period;
    }
    
    // Time period selector
    document.querySelectorAll('.time-period').forEach(button => {
      button.addEventListener('click', function() {
        document.querySelectorAll('.time-period').forEach(btn => {
          btn.classList.remove('bg-gradient-to-r', 'from-pink-500', 'to-purple-500', 'text-white');
          btn.classList.add('text-gray-400');
        });
        
        this.classList.remove('text-gray-400');
        this.classList.add('bg-gradient-to-r', 'from-pink-500', 'to-purple-500', 'text-white');
        
        currentPeriod = this.dataset.period;
        updateCharts();
      });
    });
    
    // Navigation
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', function() {
        alert(`Navigate to ${this.dataset.page} page`);
      });
    });
    
    // Add button
    document.getElementById('addButton').addEventListener('click', function() {
      alert('Open add transaction modal');
    });
    
    // Date picker
    document.getElementById('datePickerBtn').addEventListener('click', function() {
      alert('Open date picker');
    });
    
    // Initialize on load
    window.addEventListener('load', initCharts);
  </script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display:none;}
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none;}
  </style>
</body>
</html>
