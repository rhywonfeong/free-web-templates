<meta charset="utf-8">
<title>Neon Glass Sign Up Form</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Optional font to match your look -->
<style>
:root{
--hue1:255; --hue2:222;
--border:1px;
--border-color:hsl(var(--hue2),12%,20%);
--radius:22px;
--ease:cubic-bezier(0.5,1,0.89,1);
--fg:#e7ebf6;
}
/* ============ SIGN UP FORM ============ */
#menu{
visibility:hidden; opacity:0; pointer-events:none;
transition-property:visibility,opacity,filter;
transition-duration:0s,.25s,.25s;
transition-delay:.5s,0s,0s;
transition-timing-function:var(--ease);
filter:blur(4px);
font-family:'Asap',sans-serif; color:#737985;
position:fixed; top:50%; left:50%; transform:translate(-50%, -50%);
width:100%;
max-width:480px;
min-width:min(380px, calc(100vw - 2rem));
min-height:480px;
max-height:calc(100vh - 2rem);
overflow-y:auto;
border-radius:var(--radius);
border:var(--border) solid var(--border-color);
padding:clamp(1rem, 4vw, 2rem);
background:
linear-gradient(235deg,hsl(var(--hue1) 50% 10% / .8),hsl(var(--hue1) 50% 10% / 0) 33%),
linear-gradient(45deg ,hsl(var(--hue2) 50% 10% / .8),hsl(var(--hue2) 50% 10% / 0) 33%),
linear-gradient(hsl(220deg 25% 4.8% / .66));
backdrop-filter:blur(12px);
box-shadow:
hsl(var(--hue2) 50% 2%) 0 10px 16px -8px,
hsl(var(--hue2) 50% 4%) 0 20px 36px -14px;
cursor:move;
user-select:none;
}
@media (max-width: 480px) {
#menu {
min-width:calc(100vw - 2rem);
min-height:auto;
max-height:calc(100vh - 2rem);
padding:1.5rem;
border-radius:16px;
}
}
#menu:not(.open)::before,
#menu:not(.open)::after,
#menu:not(.open) .glow{
opacity:0; pointer-events:none; animation:glowoff .25s var(--ease) both;
}
#menu.open{
visibility:visible; opacity:1; pointer-events:auto;
transition-delay:0s; filter:blur(0);
}
#menu.dragging{
cursor:grabbing;
z-index:9999;
}
#menu.open::before,
#menu.open::after,
#menu.open .glow,
#menu.open .shine{ animation:glow 1s var(--ease) both; }
#menu.open .shine{ animation-delay:0s; animation-duration:2s; }
#menu.open .glow{  animation-delay:.2s; }
#menu.open .glow-bright{ animation-delay:.1s; animation-duration:1.5s; }
#menu.open .shine-bottom{ animation-delay:.1s; animation-duration:1.8s; }
#menu.open .glow-bottom{ animation-delay:.3s; }
#menu.open .glow-bright.glow-bottom{ animation-delay:.3s; animation-duration:1.1s; }
#menu .shine, #menu .glow{ --hue:var(--hue1); }
#menu .shine-bottom, #menu .glow-bottom{ --hue:var(--hue2); --conic:135deg; }
/* SHINE (thin inner speculars) */
#menu .shine,
#menu .shine::before,
#menu .shine::after{
pointer-events:none; border-radius:0;
border-top-right-radius:inherit; border-bottom-left-radius:inherit;
border:1px solid transparent;
width:75%; aspect-ratio:1; display:block; position:absolute;
right:calc(var(--border) * -1); top:calc(var(--border) * -1); left:auto;
z-index:1;
--start:12%;
background:conic-gradient(
from var(--conic,-45deg) at center in oklch,
transparent var(--start,0%),
hsl(var(--hue), var(--sat,80%), var(--lit,60%)),
transparent var(--end,50%)
) border-box;
-webkit-mask:linear-gradient(transparent),linear-gradient(black);
mask:linear-gradient(transparent),linear-gradient(black);
-webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
-webkit-mask-clip:padding-box, border-box; mask-clip:padding-box, border-box;
-webkit-mask-composite:destination-out; mask-composite:subtract;
}
#menu .shine::before, #menu .shine::after{ content:""; inset:-2px; -webkit-mask:none; mask:none; }
#menu .shine::after{
z-index:2; --start:17%; --end:33%;
background:conic-gradient(
from var(--conic,-45deg) at center in oklch,
transparent var(--start,0%),
hsl(var(--hue), var(--sat,80%), var(--lit,85%)),
transparent var(--end,50%)
);
}
#menu .shine-bottom{ top:auto; bottom:calc(var(--border) * -1); left:calc(var(--border) * -1); right:auto; }
/* GLOW (soft color bleed + noise) */
#menu .glow{
pointer-events:none;
border-top-right-radius:calc(var(--radius) * 2.5);
border-bottom-left-radius:calc(var(--radius) * 2.5);
border:calc(var(--radius) * 1.25) solid transparent;
inset:calc(var(--radius) * -2);
width:75%; aspect-ratio:1; display:block; position:absolute;
left:auto; bottom:auto;
-webkit-mask:url('https://assets.codepen.io/13471/noise-base.png');
mask:url('https://assets.codepen.io/13471/noise-base.png');
-webkit-mask-mode:luminance; mask-mode:luminance;
-webkit-mask-size:29%; mask-size:29%;
opacity:1; filter:blur(12px) saturate(1.25) brightness(.5);
mix-blend-mode:plus-lighter; z-index:3;
}
#menu .glow.glow-bottom{ inset:calc(var(--radius) * -2); top:auto; right:auto; }
#menu .glow::before, #menu .glow::after{
content:""; position:absolute; inset:0; border:inherit; border-radius:inherit;
background:conic-gradient(
from var(--conic,-45deg) at center in oklch,
transparent var(--start,0%),
hsl(var(--hue), var(--sat,95%), var(--lit,60%)),
transparent var(--end,50%)
) border-box;
-webkit-mask:linear-gradient(transparent),linear-gradient(black);
mask:linear-gradient(transparent),linear-gradient(black);
-webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
-webkit-mask-clip:padding-box, border-box; mask-clip:padding-box, border-box;
-webkit-mask-composite:destination-out; mask-composite:subtract;
filter:saturate(2) brightness(1);
}
#menu .glow::after{
--lit:70%; --sat:100%; --start:15%; --end:35%;
border-width:calc(var(--radius) * 1.75);
border-radius:calc(var(--radius) * 2.75);
inset:calc(var(--radius) * -.25);
z-index:4; opacity:.75;
}
/* GLOW BRIGHT (crisp outline) */
#menu .glow-bright{
--lit:80%; --sat:100%; --start:13%; --end:37%;
border-width:5px; border-radius:calc(var(--radius) + 2px);
inset:-7px; left:auto; filter:blur(2px) brightness(.66);
}
#menu .glow-bright::after{ content:none; }
#menu .glow-bright.glow-bottom{ inset:-7px; right:auto; top:auto; }
/* Inner layout */
#menu .inner{ display:flex; flex-direction:column; gap:clamp(1rem, 3vw, 1.5rem); }
#menu .form-group{ display:flex; flex-direction:column; gap:.5rem; }
#menu input, #menu select{
--tint2:hsl(var(--hue2) 50% 90% / .1);
font-family:'Asap',sans-serif; font-weight:300; font-size:clamp(0.8rem, 2vw, 0.875rem);
box-shadow:0 0 0 1px transparent;
border:1px solid hsl(var(--hue2) 13% 18.5% / .5);
background:hsl(var(--hue1) 0% 40% / .05);
border-radius:calc(var(--radius) * .33333);
padding:clamp(0.6rem, 2vw, 0.75rem) 1rem; color:#cfd6ea;
height:clamp(40px, 8vw, 44px);
transition:border-color .3s ease, box-shadow .3s ease;
width:100%;
}
#menu input:focus, #menu select:focus{
outline:none;
border-color:hsl(var(--hue1) 50% 50% / .6);
box-shadow:0 0 0 2px hsl(var(--hue1) 50% 50% / .2);
}
#menu input::placeholder{ color:#98a0b6; }
#menu label{
font-size:clamp(0.7rem, 1.8vw, 0.75rem); font-weight:400; color:#b7bed1; margin-bottom:.25rem;
}
#menu h1{
font-size:clamp(1.25rem, 4vw, 1.5rem); font-weight:600; color:#fff; margin:0 0 .5rem; text-align:center;
background:linear-gradient(135deg, hsl(var(--hue1) 50% 70%), hsl(var(--hue2) 50% 70%));
-webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
#menu p{ font-size:clamp(0.8rem, 2vw, 0.875rem); color:#98a0b6; margin:0 0 1.5rem; text-align:center; }
#menu button{
font-family:'Asap',sans-serif; font-weight:500; font-size:clamp(0.8rem, 2vw, 0.875rem);
padding:clamp(0.75rem, 2.5vw, 0.875rem) 2rem; border-radius:calc(var(--radius) * .33333);
border:1px solid hsl(var(--hue1) 50% 40% / .6);
background:linear-gradient(135deg, hsl(var(--hue1) 50% 25% / .8), hsl(var(--hue2) 50% 20% / .6));
color:#fff; cursor:pointer; transition:all .3s ease; margin-top:1rem;
position:relative; overflow:hidden; width:100%;
min-height:44px;
}
#menu button:hover{
background:linear-gradient(135deg, hsl(var(--hue1) 50% 30% / .9), hsl(var(--hue2) 50% 25% / .7));
box-shadow:0 0 20px hsl(var(--hue1) 50% 50% / .3);
transform:translateY(-1px);
}
#menu button:active{ transform:translateY(0); }
#menu .checkbox-group{
display:flex; align-items:flex-start; gap:.75rem; margin:.5rem 0;
}
#menu input[type="checkbox"]{
width:18px; height:18px; margin:0; cursor:pointer; flex-shrink:0; margin-top:1px;
}
#menu .checkbox-group label{
margin:0; font-size:clamp(0.8rem, 2vw, 0.875rem); cursor:pointer; line-height:1.4;
}
#menu .sign-in-link{
text-align:center; margin-top:1rem; font-size:clamp(0.8rem, 2vw, 0.875rem); color:#98a0b6;
}
#menu .sign-in-link a{
color:hsl(var(--hue1) 50% 70%); text-decoration:none; font-weight:500;
}
#menu .sign-in-link a:hover{ text-decoration:underline; }
/* Form elements shouldn't trigger drag */
#menu input, #menu button, #menu label, #menu .checkbox-group, #menu .sign-in-link {
cursor: auto;
}
#menu input[type="checkbox"] {
cursor: pointer;
}
#menu button {
cursor: pointer;
}
#menu .sign-in-link a {
cursor: pointer;
}
@property --item-opacity{ syntax:"<number>"; inherits:false; initial-value:0; }
/* ============ PAGE / CONTROLS ============ */
body{
background:#08090d;
background-image:
url(https://assets.codepen.io/13471/abstract-light.jpg),
linear-gradient(to right in oklab, hsl(var(--hue2) 50% 75%), hsl(var(--hue1) 50% 75%));
background-size:cover; background-position:center; background-blend-mode:hard-light;
padding:0; min-height:100svh;

}
#app{

}
#app>header{ display:flex; gap:.5rem; flex-direction:column; }

}

#app>footer h2{

@media (max-width:480px){

}
