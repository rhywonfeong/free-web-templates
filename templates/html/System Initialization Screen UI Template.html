body {
font-family: 'Inter', sans-serif;
}
/* Ambient Background Grid */
.bg-grid-pattern {
background-size: 32px 32px;
background-image:
linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
}
/* Progress Bar Animation */
@keyframes progressLoad {
0% { width: 0%; }
20% { width: 15%; }
50% { width: 65%; }
80% { width: 85%; }
100% { width: 100%; }
}
.animate-progress-bar {
animation: progressLoad 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
}
/* Rotating Dashed Ring */
@keyframes slowSpin {
from { transform: rotate(0deg); }
to { transform: rotate(360deg); }
}
.animate-slow-spin {
animation: slowSpin 15s linear infinite;
}
/* Dynamic Text Sequence */
@keyframes fadeMsg1 {
0%, 20% { opacity: 1; transform: translateY(0); }
25%, 100% { opacity: 0; transform: translateY(-8px); }
}
@keyframes fadeMsg2 {
0%, 20% { opacity: 0; transform: translateY(8px); }
25%, 45% { opacity: 1; transform: translateY(0); }
50%, 100% { opacity: 0; transform: translateY(-8px); }
}
@keyframes fadeMsg3 {
0%, 45% { opacity: 0; transform: translateY(8px); }
50%, 70% { opacity: 1; transform: translateY(0); }
75%, 100% { opacity: 0; transform: translateY(-8px); }
}
@keyframes fadeMsg4 {
0%, 70% { opacity: 0; transform: translateY(8px); }
75%, 100% { opacity: 1; transform: translateY(0); }
}
.msg-seq-1 { animation: fadeMsg1 3s forwards ease-in-out; }
.msg-seq-2 { animation: fadeMsg2 3s forwards ease-in-out; }
.msg-seq-3 { animation: fadeMsg3 3s forwards ease-in-out; }
.msg-seq-4 { animation: fadeMsg4 3s forwards ease-in-out; }
/* Scanning Line Effect */
@keyframes scan {
0% { top: -10%; opacity: 0; }
10% { opacity: 1; }
90% { opacity: 1; }
100% { top: 110%; opacity: 0; }
}
.animate-scan {
animation: scan 3s ease-in-out infinite;
}
/* Sequence Highlights */
@keyframes highlightSys {
0% { border-color: #e2e8f0; background-color: #ffffff; box-shadow: none; }
100% { border-color: #06b6d4; background-color: rgba(6,182,212,0.05); box-shadow: 0 0 15px rgba(6,182,212,0.2); }
}
@keyframes highlightIcon {
0% { color: #94a3b8; }
100% { color: #06b6d4; }
}
.sys-seq-1 > div { animation: highlightSys 0.3s forwards; animation-delay: 0s; }
.sys-seq-1 iconify-icon, .sys-seq-1 span { animation: highlightIcon 0.3s forwards; animation-delay: 0s; }
.sys-seq-2 > div { animation: highlightSys 0.3s forwards; animation-delay: 0.75s; }
