    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Code Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="bg-gray-900 rounded-lg shadow-2xl overflow-hidden">
            <!-- Code editor header with window controls -->
            <div class="bg-[#1f2937] px-4 py-2 flex items-center justify-between">
                <div class="flex space-x-2">
                    <div class="w-3 h-3 rounded-full bg-[#ef4444]"></div>
                    <div class="w-3 h-3 rounded-full bg-[#eab308]"></div>
                    <div class="w-3 h-3 rounded-full bg-[#22c55e]"></div>
                </div>
                <div class="text-gray-400 text-sm">SignUp.json</div>
                <div class="text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                        <rect x="9" y="9" width="6" height="6"></rect>
                    </svg>
                </div>
            </div>
            
            <!-- File tabs -->
            <div class="bg-gray-700 px-4 py-1.5 text-white">
                <span>SignUp.json</span>
            </div>
            
            <!-- Form content in code editor style -->
            <div class="p-6 bg-[#111827] text-white">
                <div class="mb-6">
                    <div class="flex mb-1">
                        <span class="text-gray-500 mr-2">1</span>
                        <span class="text-white">{</span>
                    </div>
                    
                    <form id="signup-form">
                        <!-- Name field -->
                        <div class="flex mb-4 pl-6">
                            <span class="text-gray-500 mr-2">2</span>
                            <span class="text-pink-400 mr-2">"name"</span>
                            <span class="text-white mr-2">:</span>
                            <div class="relative flex-grow">
                                <input type="text" name="name" placeholder="Your Name" 
                                    class="w-full bg-gray-800 border-0 border-b border-gray-700 focus:border-yellow-300 text-yellow-300 py-1 px-2 focus:outline-none"
                                    required>
                                <span class="text-white absolute right-0 top-1/2 transform -translate-y-1/2 mr-2">,</span>
                            </div>
                        </div>
                        
                        <!-- Email field -->
                        <div class="flex mb-4 pl-6">
                            <span class="text-gray-500 mr-2">3</span>
                            <span class="text-pink-400 mr-2">"email"</span>
                            <span class="text-white mr-2">:</span>
                            <div class="relative flex-grow">
                                <input type="email" name="email" placeholder="your@email.com" 
                                    class="w-full bg-gray-800 border-0 border-b border-gray-700 focus:border-yellow-300 text-yellow-300 py-1 px-2 focus:outline-none"
                                    required>
                                <span class="text-white absolute right-0 top-1/2 transform -translate-y-1/2 mr-2">,</span>
                            </div>
                        </div>
                        
                        <!-- Password field -->
                        <div class="flex mb-4 pl-6">
                            <span class="text-gray-500 mr-2">4</span>
                            <span class="text-pink-400 mr-2">"password"</span>
                            <span class="text-white mr-2">:</span>
                            <div class="relative flex-grow">
                                <input type="password" name="password" placeholder="••••••••" 
                                    class="w-full bg-gray-800 border-0 border-b border-gray-700 focus:border-yellow-300 text-yellow-300 py-1 px-2 focus:outline-none"
                                    required>
                                <span class="text-white absolute right-0 top-1/2 transform -translate-y-1/2 mr-2">,</span>
                            </div>
                        </div>
                        
                        <!-- Confirm Password field -->
                        <div class="flex mb-6 pl-6">
                            <span class="text-gray-500 mr-2">5</span>
                            <span class="text-pink-400 mr-2">"confirmPassword"</span>
                            <span class="text-white mr-2">:</span>
                            <div class="relative flex-grow">
                                <input type="password" name="confirmPassword" placeholder="••••••••" 
                                    class="w-full bg-gray-800 border-0 border-b border-gray-700 focus:border-yellow-300 text-yellow-300 py-1 px-2 focus:outline-none"
                                    required>
                            </div>
                        </div>
                        
                        <div class="flex mb-2">
                            <span class="text-gray-500 mr-2">6</span>
                            <span class="text-white">}</span>
                        </div>
                        
                        <!-- Submit button styled as a terminal command -->
                        <div class="mt-6 pt-4 border-t border-gray-700">
                            <div class="flex items-center">
                                <span class="text-green-400 mr-2">$</span>
                                <button type="submit" 
                                    class="bg-gray-800 hover:bg-gray-700 text-white py-2 px-4 rounded-md transition duration-200">
                                    user.create(SignUp.json)
                                </button>
                            </div>
                            
                            <!-- Login link -->
                            <div class="mt-4 text-center text-gray-400">
                                <span>Already have an account?</span>
                                <a href="#" class="text-blue-400 hover:text-blue-300 ml-1">Login</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            
            <!-- Status bar -->
            <div class="bg-gray-800 px-4 py-2 text-gray-400 text-sm flex justify-between">
                <div>Ready</div>
                <div>Ln 6, Col 1</div>
            </div>
        </div>
    </div>
</body>
</html>
