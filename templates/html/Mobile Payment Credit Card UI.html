                  <input id="cvc" name="cvc" type="text" maxlength="4" placeholder="123" class="w-full rounded-lg bg-[#23243a] text-white placeholder-gray-500 px-4 py-3 border border-[#28427a] focus:ring-2 focus:ring-blue-400 focus:outline-none transition" autocomplete="cc-csc" inputmode="numeric">
                </div>
              </div>
              <div>
                <label for="cardholder" class="block text-gray-300 text-sm font-medium mb-1">Card Holder Name</label>
                <input id="cardholder" name="cardholder" type="text" placeholder="Alex Morgan" class="w-full rounded-lg bg-[#23243a] text-white placeholder-gray-500 px-4 py-3 border border-[#28427a] focus:ring-2 focus:ring-blue-400 focus:outline-none transition" autocomplete="cc-name">
              </div>
            </form>
            <!-- Payment summary -->
            <div class="mt-10 mb-4 px-4 py-5 bg-[#23243a] rounded-xl shadow-lg animate-slide-fade delay-2">
              <div class="flex items-center justify-between mb-2">
                <span class="text-gray-400 text-sm">Amount</span>
                <span class="text-gray-100 font-medium">$24.99</span>
              </div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-gray-400 text-sm">Service</span>
                <span class="text-gray-100 font-medium">Spotify Premium</span>
              </div>
              <div class="flex items-center justify-between">
                <span class="text-gray-400 text-sm">Next Due</span>
                <span class="text-gray-100 font-medium">Jul 8, 2024</span>
              </div>
            </div>
            <!-- Pay Now Button -->
            <button class="mt-2 w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 via-blue-500 to-blue-400 text-white font-bold text-lg shadow-md hover:from-blue-500 hover:to-blue-700 transition-all focus:outline-none animate-slide-fade delay-3">
              Pay Now $24.99
            </button>
          </div>
        </div>
        <!-- Home Indicator (inside mockup) -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-24 h-1.5 bg-gray-600 rounded-full z-50"></div>
      </div>
    </div>
  </div>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll('.animate-slide-fade').forEach(el => {
        el.style.opacity = 1;
      });
    });
  </script>
</body>
