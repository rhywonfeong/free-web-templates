<style>
/* iOS-like Smoothing & Scroll */
body { -webkit-tap-highlight-color: transparent; user-select: none; overscroll-behavior-y: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
[x-cloak] { display: none !important; }
/* Grid Spacing Lock */
.app-grid {
display: grid;
grid-template-columns: repeat(4, minmax(0, 1fr));
gap: 1.5rem 0.5rem;
padding-bottom: 8rem;
}
@media (min-width: 640px) { .app-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2rem 1rem; } }
@media (min-width: 768px) { .app-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .app-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
@media (min-width: 1280px) { .app-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
/* Icon Styling */
.ios-icon {
width: 60px; height: 60px;
border-radius: 12px;
position: relative;
overflow: hidden;
border: 1px solid rgba(255,255,255,0.08);
box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 8px rgba(0,0,0,0.3);
transition: transform 0.1s;
}
.ios-icon:active { transform: scale(0.95); }
/* Default dark background for standard apps only (folders handle their own) */
.app-icon-bg { background: linear-gradient(145deg, #1a1a1a, #0a0a0a); }
.folder-mini-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
grid-template-rows: repeat(3, 1fr);
gap: 2px;
padding: 8px;
width: 100%; height: 100%;
}
/* Gradient Mask for Bottom Fade */
.scroll-mask { mask-image: linear-gradient(to bottom, black 85%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%); }
/* Sortable Ghost */
.sortable-ghost { opacity: 0; }
.sortable-drag { opacity: 1; transform: scale(1.1); z-index: 50; }
/* Gallery Specific */
.gallery-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
gap: 0.5rem;
}
@media (min-width: 640px) { .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; } }
.gallery-vertical {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
gap: 1rem;
}
/* Custom Inputs */
.folder-title-input {
background: transparent;
border: none;
font-size: 1.5rem;
font-weight: 700;
color: white;
width: 100%;
outline: none;
}
.folder-title-input:focus { border-bottom: 1px solid rgba(255,255,255,0.2); }
</style></head>
<body class="bg-black text-white h-screen w-full overflow-hidden flex flex-col" x-data="livedesk()">

    <!-- AUTH MODAL -->
    <div x-show="authModalOpen" x-cloak="" class="fixed inset-0 z-[70] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md" @click="authModalOpen = false" x-transition.opacity=""></div>
        <div class="relative w-full max-w-sm p-8 space-y-8 text-center bg-[#111] border border-gray-800 rounded-3xl shadow-2xl" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-10" x-transition:enter-end="opacity-100 translate-y-0">
            <button @click="authModalOpen = false" class="absolute top-4 right-4 text-gray-500 hover:text-white transition-colors">
                <span class="iconify text-2xl" data-icon="solar:close-circle-bold"></span>
            </button>
            <div class="space-y-2">
                <div class="w-16 h-16 mx-auto rounded-[16px] bg-gradient-to-b from-gray-800 to-black border border-gray-700 flex items-center justify-center shadow-2xl">
                    <span class="iconify text-3xl text-white" data-icon="solar:rocket-2-bold-duotone"></span>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">Sign In</h1>
                <p class="text-xs text-gray-500">Sync your apps across devices</p>
            </div>
            <div class="space-y-4">
                <button @click="signInGoogle" class="w-full py-3 bg-white text-black font-semibold rounded-xl flex items-center justify-center gap-2 hover:bg-gray-200 transition-colors">
                    <span class="iconify text-xl" data-icon="logos:google-icon"></span>
                    <span>Continue with Google</span>
                </button>
                <div class="relative py-2">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
                    <span class="relative bg-[#111] px-2 text-xs text-gray-500 uppercase">Or</span>
                </div>
                <form @submit.prevent="signInEmail" class="space-y-3">
                    <input type="email" x-model="email" placeholder="Email" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-white outline-none transition-colors">
                    <input type="password" x-model="password" placeholder="Password" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-white outline-none transition-colors">
                    <button type="submit" class="w-full py-3 bg-gray-800 text-white font-medium rounded-xl hover:bg-gray-700 transition-colors">
                        <span x-show="!authLoading">Sign In / Register</span>
                        <span x-show="authLoading" class="iconify animate-spin mx-auto" data-icon="solar:refresh-circle-bold-duotone"></span>
                    </button>
                    <p x-text="authError" class="text-red-500 text-xs h-4"></p>
                </form>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="h-full w-full relative bg-black">
       
        <!-- FIXED HEADER -->
        <header class="fixed top-0 left-0 right-0 h-16 px-4 md:px-8 flex items-center justify-between border-b border-white/5 bg-black/80 backdrop-blur-md z-40">
            <div class="flex items-center gap-4">
                <h1 class="text-lg font-bold tracking-tight text-white hidden md:block">LDL15 EXPERIMENTAL <span class="text-xs text-gray-600 ml-1">v20</span></h1>
                <div class="flex bg-gray-900 rounded-lg p-1 border border-white/10">
                    <button @click="viewMode = 'grid'; holisticViewOpen = false" :class="viewMode === 'grid' ? 'bg-gray-700 text-white' : 'text-gray-500 hover:text-gray-300'" class="p-1.5 rounded-md transition-colors">
                        <span class="iconify text-lg" data-icon="solar:widget-2-bold-duotone"></span>
                    </button>
                    <button @click="viewMode = 'list'; holisticViewOpen = false" :class="viewMode === 'list' ? 'bg-gray-700 text-white' : 'text-gray-500 hover:text-gray-300'" class="p-1.5 rounded-md transition-colors">
                        <span class="iconify text-lg" data-icon="solar:list-bold-duotone"></span>
                    </button>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right leading-tight hidden sm:block">
                    <div class="text-sm font-bold text-white" x-text="time"></div>
                    <div class="text-[10px] font-medium text-gray-500 uppercase tracking-wide" x-text="date"></div>
                </div>
               
                <div class="flex items-center gap-3">
                    <button @click="handlePlusClick()" class="w-8 h-8 rounded-full bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                        <span class="iconify" data-icon="solar:add-circle-bold-duotone"></span>
                    </button>
                    <button @click="handleProfileClick()" class="relative group">
                        <div x-show="user" class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 overflow-hidden border border-white/20 ring-2 ring-green-500/20">
                            <img x-show="user?.photoURL" :src="user?.photoURL" class="w-full h-full object-cover">
                            <div x-show="!user?.photoURL" class="w-full h-full flex items-center justify-center font-bold text-xs" x-text="user?.email?.[0].toUpperCase()"></div>
                        </div>
                        <div x-show="!user" class="w-9 h-9 rounded-full bg-gray-800 overflow-hidden border border-white/10 flex items-center justify-center hover:bg-gray-700 transition-colors">
                            <span class="iconify text-xl text-gray-400" data-icon="solar:user-circle-bold-duotone"></span>
                        </div>
                    </button>
                </div>
            </div>
        </header>

        <!-- SCROLLABLE CONTENT AREA -->
        <main class="absolute inset-0 pt-16 pb-0 overflow-hidden" @touchstart="handleTouchStart" @touchend="handleTouchEnd">
           
            <!-- GRID VIEW (UPDATED FOR HOLISTIC VIEW) -->
            <div x-show="viewMode === 'grid'" class="h-full w-full relative" x-transition.opacity="">
                <!-- This wrapper transforms based on holistic mode -->
                <div class="h-full w-full relative transition-all duration-300" :class="holisticViewOpen ? 'z-50 bg-black/40 backdrop-blur-xl overflow-y-auto p-10 pt-20 flex flex-wrap justify-center items-center gap-8' : ''">
                    
                    <template x-for="pNum in pageNumbers" :key="pNum">
                        <!-- Individual Page Container: Transitions between Full Screen and Mini Card -->
                        <div x-show="holisticViewOpen || currentPage === pNum" class="transition-all duration-500 ease-out" :class="holisticViewOpen ? 'relative w-[260px] h-[460px] md:w-[300px] md:h-[530px] rounded-3xl border border-white/10 bg-[#111] shadow-2xl cursor-pointer hover:border-indigo-500/50 hover:shadow-indigo-500/20 hover:-translate-y-2' : 'absolute inset-0 overflow-y-auto no-scrollbar scroll-mask p-4 md:p-8'" @click="if(holisticViewOpen) { currentPage = pNum; holisticViewOpen = false; }">
                            
                             <!-- Header for Holistic Card (Only visible in holistic mode) -->
                             <div x-show="holisticViewOpen" class="absolute top-4 left-0 right-0 text-center z-10 pointer-events-none">
                                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest bg-black/80 px-3 py-1.5 rounded-full border border-white/10 shadow-lg" x-text="getPageName(pNum)"></span>
                             </div>

                             <!-- Content Scaler Wrapper -->
                             <!-- In holistic mode, this scales down the content to fit the card -->
                             <div :class="holisticViewOpen ? 'w-[360%] h-[360%] origin-top-left scale-[0.277] pointer-events-none p-10 pt-24' : 'max-w-7xl mx-auto min-h-full'">
                                <div class="app-grid sortable-grid" :data-page="pNum">
                                    <template x-for="app in getAppsForPage(pNum)" :key="app.id">
                                        <div :data-id="app.id" class="relative flex flex-col items-center gap-1.5 rounded-xl transition-all cursor-pointer touch-manipulation group select-none app-item" @click="handleAppClick($event, app)" @contextmenu.prevent="openContext($event, app)">
                                           
                                            <!-- FOLDER ICON RENDER -->
                                            <template x-if="app.type === 'folder'">
                                                <div class="ios-icon flex flex-col z-10 p-0 backdrop-blur-md !bg-opacity-50" :class="app.bgColor || 'bg-[#1a1a1a]'">
                                                    <div class="folder-mini-grid">
                                                        <template x-for="subApp in (app.items || []).slice(0, 9)" :key="subApp.id">
                                                            <div class="w-full h-full rounded-[2px] overflow-hidden bg-black/50 flex items-center justify-center">
                                                                 <template x-if="subApp.icon.includes('data:') || subApp.icon.includes('http')">
                                                                    <img :src="subApp.icon" class="w-full h-full object-cover" @error="$el.src='https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&amp;w=200&amp;auto=format&amp;fit=crop'">
                                                                </template>
                                                                <template x-if="!subApp.icon.includes('data:') &amp;&amp; !subApp.icon.includes('http')">
                                                                    <span class="iconify text-[8px] text-white" :data-icon="subApp.icon"></span>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- GALLERY ICON RENDER (Shows contents like folder) -->
                                            <template x-if="app.type === 'gallery' || app.id === 'system-gallery'">
                                                 <div class="ios-icon flex flex-col z-10 p-0 bg-[#1a1a1a] overflow-hidden">
                                                     <!-- Grid of images -->
                                                     <div x-show="getGalleryPreviews(app.id).length &gt; 0" class="folder-mini-grid">
                                                        <template x-for="item in getGalleryPreviews(app.id)" :key="item.id">
                                                            <div class="w-full h-full rounded-[2px] overflow-hidden bg-gray-900 relative">
                                                                <template x-if="item.type === 'image'">
                                                                    <img :src="item.data" class="w-full h-full object-cover opacity-90" @error="$el.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&amp;w=200&amp;auto=format&amp;fit=crop'">
                                                                </template>
                                                                 <template x-if="item.type === 'video'">
                                                                    <div class="w-full h-full flex items-center justify-center bg-gray-800">
                                                                        <video :src="item.data" class="w-full h-full object-cover opacity-60 pointer-events-none" muted=""></video>
                                                                        <span class="iconify text-[8px] text-white absolute z-10" data-icon="solar:play-bold"></span>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                     </div>
                                                     <!-- Fallback Icon if empty -->
                                                     <div x-show="getGalleryPreviews(app.id).length === 0" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-indigo-900/30 to-purple-900/30">
                                                         <span class="iconify text-3xl text-gray-500" :data-icon="app.icon || 'solar:gallery-bold-duotone'"></span>
                                                     </div>
                                                 </div>
                                            </template>

                                            <!-- NORMAL APP ICON RENDER -->
                                            <template x-if="app.type !== 'folder' &amp;&amp; app.type !== 'gallery' &amp;&amp; app.id !== 'system-gallery'">
                                                <div class="ios-icon app-icon-bg flex items-center justify-center z-10 relative">
                                                    <!-- Note Indicator -->
                                                    <template x-if="app.note || (app.attachments &amp;&amp; app.attachments.length)">
                                                        <div class="absolute top-1 right-1 w-3 h-3 bg-yellow-400 rounded-full border border-black z-20 flex items-center justify-center shadow-sm">
                                                             <span class="iconify text-[8px] text-black" data-icon="solar:notes-bold"></span>
                                                        </div>
                                                    </template>

                                                    <template x-if="app.icon.includes('data:') || app.icon.includes('http')">
                                                        <img :src="app.icon" class="w-full h-full object-cover pointer-events-none" @error="$el.src='https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&amp;w=200&amp;auto=format&amp;fit=crop'">
                                                    </template>
                                                    <template x-if="!app.icon.includes('data:') &amp;&amp; !app.icon.includes('http')">
                                                        <span class="iconify text-3xl text-gray-200" :data-icon="app.icon"></span>
                                                    </template>
                                                </div>
                                            </template>

                                            <div class="flex flex-col items-center gap-0.5 text-center">
                                                <span class="text-[11px] font-bold text-white tracking-tight leading-tight truncate w-20" x-text="app.name"></span>
                                                <span :class="categoryColors[app.category] || categoryColors.default" class="text-[9px] font-medium uppercase leading-none truncate w-20" x-text="app.type === 'folder' ? 'Folder' : (app.type === 'gallery' ? 'Gallery' : (app.category || 'App'))"></span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                             </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- LIST VIEW -->
            <div x-show="viewMode === 'list'" class="h-full overflow-y-auto p-4 md:p-8 no-scrollbar pb-32" x-cloak="">
                <div id="list-sortable" class="max-w-4xl mx-auto space-y-3">
                    <template x-for="app in apps" :key="app.id">
                         <div :data-id="app.id" class="flex items-center gap-4 p-3 rounded-2xl bg-gray-900/50 border border-white/5 hover:bg-gray-800 transition-colors group cursor-pointer select-none" @click="handleAppClick($event, app)" @contextmenu.prevent="openContext($event, app)">
                             <!-- Icon Logic for List -->
                             <div class="w-12 h-12 rounded-[10px] bg-gray-800 flex items-center justify-center overflow-hidden flex-shrink-0 relative border border-white/5">
                                <template x-if="app.type === 'folder'">
                                    <div class="grid grid-cols-2 gap-0.5 p-1 w-full h-full">
                                        <template x-for="sub in (app.items||[]).slice(0,4)">
                                            <div class="bg-gray-600 rounded-[2px]"></div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="app.type === 'gallery' || app.id === 'system-gallery'">
                                     <div class="grid grid-cols-2 gap-0.5 p-1 w-full h-full">
                                         <template x-for="item in getGalleryPreviews(app.id).slice(0,4)">
                                             <div class="bg-gray-700 rounded-[2px] overflow-hidden">
                                                 <img x-show="item.type!=='video'" :src="item.data" class="w-full h-full object-cover">
                                                 <div x-show="item.type==='video'" class="w-full h-full bg-gray-800"></div>
                                             </div>
                                         </template>
                                         <div x-show="getGalleryPreviews(app.id).length === 0" class="absolute inset-0 flex items-center justify-center">
                                             <span class="iconify text-xl text-gray-500" :data-icon="app.icon || 'solar:gallery-bold-duotone'"></span>
                                         </div>
                                    </div>
                                </template>
                                <template x-if="app.type !== 'folder' &amp;&amp; app.type !== 'gallery' &amp;&amp; app.id !== 'system-gallery'">
                                    <div class="relative w-full h-full flex items-center justify-center">
                                         <!-- Note Indicator List View -->
                                         <template x-if="app.note || (app.attachments &amp;&amp; app.attachments.length)">
                                            <div class="absolute top-0.5 right-0.5 w-2.5 h-2.5 bg-yellow-400 rounded-full border border-black z-20 flex items-center justify-center"></div>
                                        </template>

                                        <template x-if="app.icon.includes('data:') || app.icon.includes('http')">
                                            <img :src="app.icon" class="w-full h-full object-cover" @error="$el.src='https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&amp;w=200&amp;auto=format&amp;fit=crop'">
                                        </template>
                                        <template x-if="!app.icon.includes('data:') &amp;&amp; !app.icon.includes('http')">
                                            <span class="iconify text-xl text-white" :data-icon="app.icon"></span>
                                        </template>
                                    </div>
                                </template>
                            </div>
                            <div class="flex-grow min-w-0">
                                <div class="flex items-center gap-2">
                                    <h3 class="font-bold text-white truncate text-sm" x-text="app.name"></h3>
                                    <span :class="categoryColors[app.category] || categoryColors.default" class="text-[10px] px-1.5 py-0.5 rounded bg-gray-800 border border-gray-700 font-medium uppercase" x-text="app.type === 'folder' ? 'Folder' : (app.type === 'gallery' ? 'Gallery' : app.category)"></span>
                                </div>
                                <p class="text-xs text-gray-500 truncate" x-text="app.type === 'folder' ? `${(app.items||[]).length} items` : (app.type === 'gallery' ? 'Media Collection' : app.url)"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </main>

        <!-- NOTE VIEWER WINDOW -->
        <div x-show="noteViewerOpen" class="fixed inset-0 z-[110] flex items-center justify-center p-4" x-cloak="">
             <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" @click="noteViewerOpen = false" x-transition.opacity=""></div>
             <div class="relative w-full max-w-md bg-[#161616] border border-gray-700 rounded-3xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-8" x-transition:enter-end="opacity-100 translate-y-0">
                <div class="p-6 border-b border-gray-700 bg-gray-900/50 flex items-center gap-4">
                     <div class="w-12 h-12 rounded-xl bg-black border border-gray-600 flex items-center justify-center overflow-hidden flex-shrink-0">
                        <template x-if="viewingNoteApp?.icon.includes('data:') || viewingNoteApp?.icon.includes('http')">
                            <img :src="viewingNoteApp.icon" class="w-full h-full object-cover">
                        </template>
                        <template x-if="viewingNoteApp &amp;&amp; (!viewingNoteApp.icon.includes('data:') &amp;&amp; !viewingNoteApp.icon.includes('http'))">
                            <span class="iconify text-2xl text-white" :data-icon="viewingNoteApp.icon"></span>
                        </template>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h2 class="text-lg font-bold text-white truncate" x-text="viewingNoteApp?.name"></h2>
                        <div class="text-xs text-gray-400 truncate" x-text="viewingNoteApp?.category"></div>
                    </div>
                    <button @click="noteViewerOpen = false" class="text-gray-400 hover:text-white"><span class="iconify text-2xl" data-icon="solar:close-circle-bold"></span></button>
                </div>
                
                <div class="p-6 overflow-y-auto custom-scrollbar space-y-6">
                    <!-- Action -->
                    <button @click="window.open(viewingNoteApp?.url, '_blank')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl flex items-center justify-center gap-2 transition-colors shadow-lg">
                        <span class="iconify text-lg" data-icon="solar:link-circle-bold"></span>
                        Open Application
                    </button>

                    <!-- Note Content -->
                    <div x-show="viewingNoteApp?.note" class="space-y-2">
                        <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Note</div>
                        <div class="p-4 bg-yellow-400/10 border border-yellow-400/20 rounded-xl text-gray-200 text-sm whitespace-pre-wrap leading-relaxed" x-text="viewingNoteApp?.note"></div>
                    </div>

                    <!-- Attachments -->
                    <div x-show="viewingNoteApp?.attachments &amp;&amp; viewingNoteApp.attachments.length &gt; 0" class="space-y-2">
                        <div class="text-[10px] font-bold text-gray-500 uppercase tracking-wider">Attachments</div>

             <div class="absolute top-4 right-4 z-50">
                <button @click="closeLightbox" class="p-2 rounded-full bg-gray-800 text-white hover:bg-gray-700 transition-colors border border-gray-700">
                    <span class="iconify text-2xl" data-icon="solar:close-circle-bold"></span>
                </button>
            </div>
            <div class="flex-1 flex items-center justify-center p-4 md:p-10 overflow-hidden">
                <template x-if="viewImage?.type === 'video'">
                     <video x-ref="lightboxVideo" :src="viewImage.data" controls="" autoplay="" class="max-w-full max-h-full rounded-lg shadow-2xl bg-black outline-none border border-white/10"></video>
                </template>
                <template x-if="viewImage?.type !== 'video'">
                    <img :src="viewImage?.data" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl border border-white/5" @error="$el.src='https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&amp;w=1200&amp;auto=format&amp;fit=crop'">
                </template>
            </div>
             <div class="h-16 flex flex-col items-center justify-center text-gray-400 shrink-0">
                <div class="text-xs font-bold text-white tracking-wide" x-text="viewImage?.name"></div>
                <div class="text-[10px] font-mono uppercase tracking-widest opacity-60" x-text="viewImage ? new Date(viewImage.date).toLocaleString() : ''"></div>
            </div>
        </div>

        <!-- FIXED BOTTOM ELEMENTS (Updated Dock with Holistic View) -->
        <div class="fixed bottom-3 right-4 z-40 pointer-events-none select-none">
            <span class="text-[9px] font-mono text-gray-600/60 uppercase tracking-wider font-medium mix-blend-plus-lighter" x-text="versionString"></span>
        </div>
        
        <!-- Page Name Editor (Only visible in normal grid mode) -->
        <div x-show="viewMode === 'grid' &amp;&amp; !holisticViewOpen" class="fixed bottom-6 left-6 z-40 group" x-cloak="">
            <div class="flex items-center gap-2">
                <input type="text" :value="getPageName(currentPage)" @input="updatePageName(currentPage, $event.target.value)" @blur="savePageNames" @keydown.enter="$el.blur()" class="bg-transparent text-gray-600 font-bold text-xl focus:text-white outline-none w-48 placeholder-gray-800 transition-colors uppercase tracking-tight">
                <span class="iconify text-gray-700 group-hover:text-gray-500 transition-colors text-sm" data-icon="solar:pen-bold-duotone"></span>
            </div>
        </div>

        <!-- PRIMARY DOCK: Pagination & Holistic Button -->
        <div x-show="viewMode === 'grid'" class="fixed bottom-6 left-0 right-0 z-[60] flex flex-col items-center justify-end gap-4 pointer-events-none" x-cloak="">
             <!-- Pagination Dots (Hidden during Holistic View) -->
             <div x-show="!holisticViewOpen" class="pointer-events-auto flex gap-2 p-2 bg-black/40 backdrop-blur-xl rounded-full border border-white/10 shadow-xl transition-all duration-300">
                <template x-for="pNum in pageNumbers" :key="pNum">
                    <div class="w-2 h-2 rounded-full transition-all duration-300 cursor-pointer shadow-lg flex items-center justify-center" :class="currentPage === pNum ? 'bg-white w-4 shadow-white/50' : 'bg-gray-600 hover:bg-gray-400'" @click="currentPage = pNum">
                    </div>
                </template>
            </div>

            <!-- Prominent Holistic View Button -->
            <button @click="toggleHolistic()" class="pointer-events-auto group relative flex items-center justify-center w-14 h-14 bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl hover:bg-white/20 hover:scale-105 active:scale-95 transition-all duration-300 overflow-hidden">
                <span class="iconify text-2xl text-white transition-transform duration-500 relative z-10" :class="holisticViewOpen ? 'rotate-180' : ''" :data-icon="holisticViewOpen ? 'solar:minimize-square-bold-duotone' : 'solar:widget-5-bold-duotone'"></span>
                <!-- Aura Glow Effect -->
                <div class="absolute inset-0 bg-gradient-to-tr from-indigo-500/30 to-purple-500/30 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="absolute inset-0 bg-white/5 opacity-0 group-active:opacity-100 transition-opacity duration-100"></div>
            </button>
        </div>

        <!-- CONTEXT MENU -->
        <div x-show="contextOpen" @click.outside="contextOpen = false" class="fixed z-[85] w-56 bg-[#111] border border-gray-800 rounded-xl shadow-2xl py-1.5 overflow-hidden flex flex-col backdrop-blur-xl" :style="`top: ${contextPos.y}px; left: ${contextPos.x}px`" x-transition.opacity.duration.200ms="">
            <template x-if="contextApp?.type !== 'folder'">
                <button @click="launchApp(contextApp); contextOpen=false" class="px-4 py-2 text-left text-sm text-white hover:bg-indigo-600 flex items-center gap-3">
                    <span class="iconify text-lg opacity-70" data-icon="solar:plain-bold-duotone"></span> Open
                </button>
            </template>
             <template x-if="contextApp?.type === 'folder'">
                <button @click="openFolder(contextApp); contextOpen=false" class="px-4 py-2 text-left text-sm text-white hover:bg-indigo-600 flex items-center gap-3">
                    <span class="iconify text-lg opacity-70" data-icon="solar:folder-open-bold-duotone"></span> Open Folder
                </button>
            </template>
            <div class="h-px bg-gray-800 my-1 mx-2"></div>
           
            <button @click="openModal('edit', contextApp); contextOpen=false" class="px-4 py-2 text-left text-xs font-medium text-gray-300 hover:bg-gray-800 hover:text-white flex items-center gap-3">
                <span class="iconify text-lg opacity-70" data-icon="solar:pen-bold-duotone"></span> Edit
            </button>
        </div>

    </div>

    <!-- Logic Script -->
    <script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('livedesk', () => ({
            authModalOpen: false,
            authLoading: false,
            email: '',
            password: '',
            authError: '',
            user: null, 
            viewMode: 'grid',
            holisticViewOpen: false,
            currentPage: 1,
            pageNumbers: [1, 2, 3, 4, 5],
            pageNames: {1: 'Home', 2: 'Work', 3: 'Media', 4: 'Tools', 5: 'Settings'},
            time: '',
            date: '',
            apps: [], 
            noteViewerOpen: false,
            viewingNoteApp: null,
            createMenuOpen: false,
            folderModalOpen: false,
            activeFolder: null,
            showImportModal: false,
            availableAppsForImport: [],
            importSelection: [],
            galleryOpen: false,
            activeGalleryName: '',
            currentGalleryItems: [],
            galleryViewMode: 'grid',
            virtualLookOpen: false,
            virtualFashion9Open: false,
            viewImage: null,
            versionString: 'v20.0.0-alpha',
            contextOpen: false,
            contextPos: {x: 0, y: 0},
            contextApp: null,
            categoryColors: {
                default: 'text-gray-500',
                'Productivity': 'text-blue-400',
                'Social': 'text-green-400',
                'Utility': 'text-purple-400',
                'Design': 'text-pink-400'
            },

            init() {
                this.updateTime();
                setInterval(() => this.updateTime(), 1000);
                this.loadApps();
                document.addEventListener('click', (e) => {
                    // Close context menu on general click
                    if(this.contextOpen) this.contextOpen = false;
                });
            },

            updateTime() {
                const now = new Date();
                this.time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                this.date = now.toLocaleDateString([], {weekday: 'long', month: 'short', day: 'numeric'});
            },

            loadApps() {
                // Initial dummy data to make the requested UI functional
                this.apps = [
                    {id: '1', name: 'Browser', icon: 'solar:globe-bold-duotone', category: 'Utility', type: 'app', page: 1, url: 'https://google.com'},
                    {id: '2', name: 'Fashion 3', icon: 'solar:hanger-2-bold-duotone', category: 'Design', type: 'app', page: 1, url: 'virtual-look'},
                    {id: '3', name: 'Fashion 9', icon: 'solar:t-shirt-bold-duotone', category: 'Design', type: 'app', page: 1, url: 'virtual-fashion-9'},
                    {id: '4', name: 'Notes', icon: 'solar:notes-bold-duotone', category: 'Productivity', type: 'app', page: 1, note: 'Meeting at 5pm', url: '#'},
                    {id: 'system-gallery', name: 'Photos', icon: 'solar:gallery-bold-duotone', category: 'Media', type: 'gallery', page: 1},
                    {id: 'folder-1', name: 'Socials', icon: 'solar:folder-bold-duotone', type: 'folder', page: 1, items: [
                        {id: 'f1', name: 'Chat', icon: 'solar:chat-round-dots-bold', url: '#'},
                        {id: 'f2', name: 'Mail', icon: 'solar:letter-bold', url: '#'}
                    ]}
                ];
            },

            getPageName(num) { return this.pageNames[num] || `Page ${num}`; },
            updatePageName(num, name) { this.pageNames[num] = name; },
            savePageNames() { },
            
            getAppsForPage(page) {
                return this.apps.filter(app => app.page === page);
            },

            handleAppClick(e, app) {
                if(this.createMenuOpen || this.contextOpen) return;
                this.launchApp(app);
            },

            launchApp(app) {
                if(app.type === 'folder') {
                    this.openFolder(app);
                } else if(app.type === 'gallery' || app.id === 'system-gallery') {
                    this.openGallery(app);
                } else if(app.url === 'virtual-look') {
                    this.virtualLookOpen = true;
                } else if(app.url === 'virtual-fashion-9') {
                    this.virtualFashion9Open = true;
                } else if(app.note || app.attachments) {
                    this.viewingNoteApp = app;
                    this.noteViewerOpen = true;
                } else if(app.url && app.url !== '#') {
                    window.open(app.url, '_blank');
                }
            },

            openFolder(folder) {
                this.activeFolder = folder;
                this.folderModalOpen = true;
            },
            closeFolder() {
                this.folderModalOpen = false;
                this.activeFolder = null;
            },

            openGallery(app) {
                this.activeGalleryName = app.name;
                this.currentGalleryItems = [
                    {id: 'g1', type: 'image', name: 'Design Mockup', date: new Date(), data: 'https://images.unsplash.com/photo-1558655146-d09347e0b7a8?auto=format&fit=crop&w=800&q=80'},
                    {id: 'g2', type: 'video', name: 'Demo Reel', date: new Date(), data: 'https://www.w3schools.com/html/mov_bbb.mp4'}
                ]; 
                this.galleryOpen = true;
            },

            getGalleryPreviews(id) {
                return [
                    {type: 'image', id: 'p1', data: 'https://images.unsplash.com/photo-1558655146-d09347e0b7a8?auto=format&fit=crop&w=200&q=80'},
                    {type: 'image', id: 'p2', data: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=200&q=80'}
                ];
            },
            
            viewMediaItem(item) {
                this.viewImage = item;
            },
            closeLightbox() {
                this.viewImage = null;
            },
            deleteGalleryItem(id) {
                this.currentGalleryItems = this.currentGalleryItems.filter(i => i.id !== id);
            },
            uploadGalleryItem(e) { },

            handlePlusClick() { this.createMenuOpen = true; },
            handleProfileClick() { this.authModalOpen = true; },
            signInGoogle() { this.user = { email: 'demo@user.com', photoURL: null }; this.authModalOpen = false; },
            signInEmail() { this.authLoading = true; setTimeout(() => { this.user = { email: this.email, photoURL: null }; this.authModalOpen = false; this.authLoading = false; }, 1000); },

            openContext(e, app, inFolder = false) {
                e.preventDefault();
                this.contextOpen = true;
                this.contextApp = app;
                this.contextPos = { x: e.clientX, y: e.clientY };
                if (this.contextPos.x + 224 > window.innerWidth) this.contextPos.x = window.innerWidth - 230;
                if (this.contextPos.y + 150 > window.innerHeight) this.contextPos.y = window.innerHeight - 160;
            },

            toggleHolistic() {
                this.holisticViewOpen = !this.holisticViewOpen;
            },
            
            handleTouchStart() {},
            handleTouchEnd() {},
            selectCreateType() {},
            saveApps() {},
            openModal() {},
            toggleImport() {},
            confirmImport() {},
            formatBytes(bytes) { return '1.2 MB'; }
        }));
    });
    </script>
</body></html>
