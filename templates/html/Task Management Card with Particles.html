    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Card with Particles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
</head>
<body class="min-h-screen bg-gray-900 flex items-center justify-center p-8 relative overflow-hidden">
    <!-- Particles Background -->
    <div id="particles-js" class="absolute inset-0 z-0"></div>
    
    <!-- Card -->
    <div class="relative z-10 max-w-sm mx-auto bg-gray-800/80 backdrop-blur-sm rounded-xl border border-gray-700/50 overflow-hidden hover:border-gray-600/70 transition-all duration-300 shadow-2xl">
        <!-- Header with gradient -->
        <div class="relative h-32 bg-gradient-to-br from-violet-600 via-purple-600 to-blue-600 overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
            <!-- Animated geometric elements -->
            <div class="absolute top-4 right-4 w-16 h-16 border border-white/20 rounded-full animate-pulse"></div>
            <div class="absolute top-8 right-8 w-8 h-8 border border-white/40 rounded-full animate-ping"></div>
            <!-- Glow effect -->
            <div class="absolute inset-0 bg-gradient-to-br from-violet-400/20 via-transparent to-blue-400/20"></div>
        </div>

        <!-- Content -->
        <div class="p-6">
            <!-- Status badge -->
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-2">
                    <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></div>
                    <span class="text-xs font-medium text-gray-300 uppercase tracking-wide">In Progress</span>
                </div>
                <span class="text-xs text-gray-500">#LIN-1247</span>
            </div>

            <!-- Title -->
            <h3 class="text-lg font-semibold text-white mb-2 leading-tight">
                Redesign navigation components
            </h3>

            <!-- Description -->
            <p class="text-sm text-gray-300 leading-relaxed mb-4">
                Update the primary navigation to improve user experience and align with the new design system guidelines.
            </p>

            <!-- Meta info -->
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <!-- Assignee -->
                    <div class="flex items-center space-x-2">
                        <div class="w-6 h-6 bg-gradient-to-br from-violet-500 to-blue-500 rounded-full flex items-center justify-center ring-2 ring-violet-400/30">
                            <span class="text-xs font-medium text-white">JD</span>
                        </div>
                        <span class="text-xs text-gray-400">John Doe</span>
                    </div>
                </div>
                
                <!-- Priority -->
                <div class="flex items-center space-x-1">
                    <div class="w-3 h-3 bg-orange-400 rounded-sm shadow-lg shadow-orange-400/30"></div>
                    <span class="text-xs text-gray-400">High</span>
                </div>
            </div>

            <!-- Labels -->
            <div class="flex flex-wrap gap-2 mb-4">
                <span class="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-violet-500/20 text-violet-300 border border-violet-500/30 backdrop-blur-sm">
                    Frontend
                </span>
                <span class="inline-flex items-center px-2 py-1 rounded text-xs font-medium bg-blue-500/20 text-blue-300 border border-blue-500/30 backdrop-blur-sm">
                    Design System
                </span>
            </div>

            <!-- Footer -->
            <div class="flex items-center justify-between pt-4 border-t border-gray-700/50">
                <div class="flex items-center space-x-1 text-gray-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <span class="text-xs">Due in 3 days</span>
                </div>
                
                <button class="flex items-center space-x-1 text-xs text-gray-400 hover:text-gray-200 transition-colors duration-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span>2 comments</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 80,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": ["#8b5cf6", "#06b6d4", "#3b82f6"]
                },
                "shape": {
                    "type": "circle"
                },
                "opacity": {
                    "value": 0.3,
                    "random": true,
                    "anim": {
                        "enable": true,
                        "speed": 1,
                        "opacity_min": 0.1
                    }
                },
                "size": {
                    "value": 3,
                    "random": true,
                    "anim": {
                        "enable": true,
                        "speed": 2,
                        "size_min": 0.1
                    }
                },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#8b5cf6",
                    "opacity": 0.2,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 2,
                    "direction": "none",
                    "random": false,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "repulse"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    }
                },
                "modes": {
                    "repulse": {
                        "distance": 100,
                        "duration": 0.4
                    },
                    "push": {
                        "particles_nb": 4
                    }
                }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
