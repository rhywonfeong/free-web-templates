<!DOCTYPE html>
<html lang="en" class="bg-gradient-to-b from-gray-900 via-gray-800 to-gray-900 min-h-screen">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aviator Crash Betting Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <script>
    // Simple JS for mock multiplier and timers
    let multiplier = 1;
    let interval;
    let crashed = false;
    function startGame() {
      multiplier = 1;
      crashed = false;
      document.getElementById('multiplier').innerText = multiplier.toFixed(2) + 'x';
      document.getElementById('cashout-btn').disabled = false;
      document.getElementById('cashout-btn').innerText = 'Cash Out';
      document.getElementById('plane').style.transform = 'translateY(0)';
      interval = setInterval(() => {
        multiplier += Math.random() * 0.08 + 0.02;
        document.getElementById('multiplier').innerText = multiplier.toFixed(2) + 'x';
        document.getElementById('plane').style.transform = `translateY(-${multiplier*10}px)`;
        if (multiplier > Math.random() * 9 + 1.5) { // random crash between 1.5-10x
          crashed = true;
          clearInterval(interval);
          document.getElementById('multiplier').innerText = '💥 ' + multiplier.toFixed(2) + 'x';
          document.getElementById('cashout-btn').disabled = true;
          document.getElementById('cashout-btn').innerText = 'Crashed';
          addHistory(multiplier, false);
        }
      }, 70);
    }
    function cashOut() {
      if (!crashed) {
        clearInterval(interval);
        document.getElementById('cashout-btn').disabled = true;
        document.getElementById('cashout-btn').innerText = 'Cashed Out!';
        addHistory(multiplier, true);
      }
    }
    function addHistory(mult, win) {
      let color = mult < 2 ? 'bg-red-600' : mult > 5 ? 'bg-green-600' : 'bg-yellow-500';
      let text = win ? 'You' : 'Crash';
      let el = `<div class="flex items-center gap-2 ${color} rounded px-2 py-1 text-xs mb-1 font-semibold">
        <span>${text}</span>
        <span>${mult.toFixed(2)}x</span>
      </div>`;
      document.getElementById('history').innerHTML = el + document.getElementById('history').innerHTML;
    }
    window.onload = () => {
      let countdown = 5;
      let countdownEl = document.getElementById('countdown');
      let cdInt = setInterval(() => {
        if (countdown > 1) {
          countdown--;
          countdownEl.innerText = countdown;
        } else {
          clearInterval(cdInt);
          countdownEl.innerText = '';
          startGame();
        }
      }, 1000);
      document.getElementById('cashout-btn').addEventListener('click', cashOut);
      document.getElementById('bet-btn').addEventListener('click', () => {
        countdown = 5;
        countdownEl.innerText = countdown;
        let cdInt2 = setInterval(() => {
          if (countdown > 1) {
            countdown--;
            countdownEl.innerText = countdown;
          } else {
            clearInterval(cdInt2);
            countdownEl.innerText = '';
            startGame();
          }
        }, 1000);
      });
    }
  </script>
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Orbitron&display=swap" rel="stylesheet">
</head>
<body class="text-white font-sans min-h-screen flex flex-col items-center bg-gradient-to-b from-gray-900 via-gray-800 to-gray-900">
  <!-- Header -->
  <header class="flex items-center justify-between w-full max-w-2xl py-6 px-4">
    <div class="flex items-center gap-2">
      <span class="text-3xl font-extrabold text-green-500 tracking-widest" style="font-family: 'Orbitron', sans-serif;">Aviator</span>
      <svg class="w-10 h-10 text-white drop-shadow-lg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 48 48">
        <!-- Simple F16 fighter jet silhouette -->
        <path stroke-linecap="round" stroke-linejoin="round" d="M24 4l3 14h8L24 44l-2-12h-6l-2 4-2-12 2-4h-8l17-16z"/>
      </svg>
    </div>
    <span class="uppercase text-xs tracking-widest text-gray-400 font-bold">Real-Time Crash Game</span>
  </header>

  <!-- Main Game Area -->
  <main class="flex flex-col md:flex-row w-full max-w-5xl gap-6 px-4">
    <!-- Graph + Plane + Multiplier -->
    <section class="relative flex-1 bg-gray-800 rounded-2xl shadow-lg overflow-hidden min-h-[380px] flex flex-col items-center justify-end pb-8">
      <!-- Multiplier Display -->
      <div class="absolute top-6 left-1/2 -translate-x-1/2 flex flex-col items-center z-10">
        <span id="multiplier" class="text-5xl font-bold text-green-400 drop-shadow-md" style="font-family: 'Orbitron', sans-serif;">1.00x</span>
        <span class="uppercase text-xs text-gray-400 mt-1 tracking-widest">Live Multiplier</span>
      </div>
      <!-- Plane (F16) -->
      <div class="absolute left-1/2 bottom-20 z-20 transition-transform duration-300" id="plane" style="transform:translateY(0)">
        <svg class="w-16 h-16 text-white" fill="currentColor" viewBox="0 0 48 48">
          <path d="M24 4l3 14h8L24 44l-2-12h-6l-2 4-2-12 2-4h-8l17-16z" />
        </svg>
      </div>
      <!-- Graph Axis -->
      <div class="absolute bottom-0 left-0 w-full h-2/3 flex items-end">
        <svg class="w-full h-full" viewBox="0 0 600 220" fill="none">
          <polyline points="0,200 80,180 160,140 240,90 320,60 400,40 480,30 600,20"
            class="stroke-green-400 opacity-50" stroke-width="3" fill="none" />
          <line x1="0" y1="200" x2="600" y2="200" stroke="#fff" stroke-opacity="0.2" stroke-width="2"/>
        </svg>
      </div>
      <!-- Countdown Overlay -->
      <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-60 z-30 text-6xl font-bold text-white transition-all" id="countdown">5</div>
      <!-- Cash Out Button -->
      <button id="cashout-btn" class="absolute right-8 top-1/2 -translate-y-1/2 bg-green-500 hover:bg-green-600 disabled:bg-gray-700 text-white text-lg font-bold px-6 py-3 rounded-xl shadow-lg transition-all focus:outline-none focus:ring-2 focus:ring-green-300 z-20">
        Cash Out
      </button>
    </section>

    <!-- Side Panel: Bet Controls & Feed -->
    <aside class="flex flex-col w-full md:w-80 gap-4">
      <!-- Bet Panel -->
      <div class="bg-gray-800 rounded-2xl p-6 shadow-lg flex flex-col gap-4">
        <div class="flex items-center justify-between">
          <span class="text-lg font-bold tracking-wide">Your Bet</span>
          <label class="flex items-center gap-1 cursor-pointer">
            <span class="text-xs text-gray-400">Auto Bet</span>
            <input type="checkbox" class="form-toggle h-5 w-10 rounded-full bg-gray-600 checked:bg-green-500 transition-all" />
          </label>
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-xs text-gray-400 font-semibold">Amount</label>
          <input type="number" min="1" max="2000" placeholder="e.g. 100"
            class="rounded-lg bg-gray-700 text-white font-bold px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400 transition-all text-lg"/>
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-xs text-gray-400 font-semibold">Auto Cashout (<span class="text-green-400">x</span>)</label>
          <input type="number" min="1.1" step="0.01" placeholder="e.g. 2.00"
            class="rounded-lg bg-gray-700 text-white font-bold px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400 transition-all text-lg"/>
        </div>
        <button id="bet-btn" class="mt-3 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl py-3 text-lg transition-all shadow-md focus:outline-none focus:ring-2 focus:ring-green-300 w-full uppercase tracking-wider">
          Place Bet
        </button>
        <div class="flex justify-center mt-1">
          <span class="text-xs text-gray-400">Next round in</span>
          <span class="ml-1 text-green-400 font-bold" id="side-countdown"></span>
        </div>
      </div>
      <!-- Live Bets Feed -->
      <div class="bg-gray-800 rounded-2xl p-4 shadow-lg">
        <div class="flex items-center justify-between mb-2">
          <span class="text-sm font-bold tracking-wide">Live Bets</span>
          <span class="text-xs text-green-400 uppercase font-bold">Top Wins</span>
        </div>
        <div class="flex flex-col gap-2 max-h-24 overflow-y-auto">
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span class="bg-green-500 rounded-full w-2.5 h-2.5 animate-pulse"></span>
              <span class="font-semibold text-sm">PilotJack</span>
            </div>
            <span class="text-green-400 font-bold">3.20x</span>
            <span class="text-xs text-gray-400">Cashed</span>
          </div>
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span class="bg-yellow-400 rounded-full w-2.5 h-2.5"></span>
              <span class="font-semibold text-sm">SkyQueen</span>
            </div>
            <span class="text-yellow-300 font-bold">1.80x</span>
            <span class="text-xs text-red-400">Crashed</span>
          </div>
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span class="bg-green-400 rounded-full w-2.5 h-2.5"></span>
              <span class="font-semibold text-sm">F16Ace</span>
            </div>
            <span class="text-green-400 font-bold">7.00x</span>
            <span class="text-xs text-green-300">Cashed</span>
          </div>
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-2">
              <span class="bg-red-500 rounded-full w-2.5 h-2.5"></span>
              <span class="font-semibold text-sm">JetFan</span>
            </div>
            <span class="text-red-400 font-bold">1.20x</span>
            <span class="text-xs text-red-400">Crashed</span>
          </div>
        </div>
      </div>
      <!-- Game History -->
      <div class="bg-gray-800 rounded-2xl p-4 shadow-lg">
        <span class="text-sm font-bold tracking-wide mb-2 block">Game History</span>
        <div id="history" class="flex flex-col"></div>
      </div>
    </aside>
  </main>
  <!-- Footer -->
  <footer class="w-full max-w-2xl mt-8 mb-4 text-center text-xs text-gray-500 font-semibold">
    <span>Play responsibly&nbsp;&bull;&nbsp;Aviator &copy; 2024</span>
  </footer>
</body>
</html>
