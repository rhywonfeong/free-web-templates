<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mood Spirits - 移动 AI 侍酒师</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.7/dist/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
background-color: #050505;
/* Mobile-friendly background */
background-image:
radial-gradient(circle at 10% 20%, rgba(76, 29, 149, 0.2), transparent 40%),
radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.15), transparent 40%);
-webkit-tap-highlight-color: transparent;
}
.glass-panel {
background: rgba(20, 20, 23, 0.6);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid rgba(255, 255, 255, 0.08);
box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
}
/* Custom Range Slider */
input[type=range] {
-webkit-appearance: none;
width: 100%;
background: transparent;
}
input[type=range]::-webkit-slider-thumb {
-webkit-appearance: none;
height: 24px;
width: 24px;
border-radius: 50%;
background: #ffffff;
box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
margin-top: -10px;
}
input[type=range]::-webkit-slider-runnable-track {
width: 100%;
height: 4px;
background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
border-radius: 2px;
}
/* Fluid Animation */
@keyframes flow {
0% { transform: translateY(0) rotate(0deg); }
50% { transform: translateY(-3px) rotate(1deg); }
100% { transform: translateY(0) rotate(0deg); }
}
.liquid-simulate {
animation: flow 5s ease-in-out infinite;
}
/* Mobile Scroll Snap */
.snap-x-mandatory {
scroll-snap-type: x mandatory;
}
.snap-center {
scroll-snap-align: center;
}
/* Hide scrollbar */
.no-scrollbar::-webkit-scrollbar {
display: none;
}
.no-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
</style></head>
<body class="text-zinc-300 min-h-screen flex flex-col overflow-x-hidden">

    <!-- Top Bar -->
    <header class="fixed top-0 inset-x-0 z-50 glass-panel border-b border-white/5 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg shadow-purple-500/20">
                <iconify-icon icon="lucide:wine" class="text-white" width="16" stroke-width="1.5"></iconify-icon>
            </div>
            <span class="text-sm font-medium tracking-tight text-white uppercase ml-1">Mood Spirits</span>
        </div>
        <button class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center">
            <iconify-icon icon="lucide:menu" class="text-zinc-400" width="18" stroke-width="1.5"></iconify-icon>
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 pt-24 pb-24 px-4 space-y-4 max-w-md mx-auto w-full">

        <!-- Dynamic Glass Visualizer (Hero Section) -->
        <section class="glass-panel rounded-3xl p-8 relative overflow-hidden flex flex-col items-center justify-center min-h-[360px] transition-all duration-500">
            <!-- Dynamic Background Glow -->
            <div id="bg-glow" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-indigo-500/20 rounded-full blur-[80px] transition-colors duration-700"></div>

            <!-- The Glass Container -->
            <div class="relative z-10 flex flex-col items-center">
                <!-- Glass Shape: Controlled via JS -->
                <div id="glass" class="relative border-x border-b border-white/20 bg-gradient-to-b from-white/10 to-white/5 backdrop-blur-sm liquid-simulate transition-all duration-700 ease-[cubic-bezier(0.34,1.56,0.64,1)] shadow-[0_0_30px_rgba(255,255,255,0.05)] overflow-hidden"
                     style="width: 11rem; height: 9rem; border-bottom-left-radius: 4rem; border-bottom-right-radius: 4rem;">
                    
                    <!-- Liquid Level -->
                    <div id="liquid" class="absolute bottom-0 w-full h-[75%] bg-gradient-to-t from-indigo-600/90 to-purple-400/70 transition-all duration-700">
                        <!-- Bubbles -->
                        <div class="absolute bottom-4 left-1/3 w-1 h-1 bg-white/40 rounded-full animate-pulse"></div>
                        <div class="absolute bottom-8 right-1/3 w-1.5 h-1.5 bg-white/30 rounded-full animate-pulse delay-75"></div>
                    </div>
                    
                    <!-- Ice Cube (Optional visibility) -->
                    <div id="ice" class="absolute bottom-4 left-1/2 -translate-x-1/2 w-10 h-10 bg-white/10 border border-white/20 rounded-lg backdrop-blur-md rotate-12 transition-opacity duration-500 opacity-0"></div>
                
                    <!-- Surface Reflection -->
                    <div class="absolute top-[25%] left-0 w-full h-[1px] bg-white/20 opacity-50"></div>
                </div>

                <!-- Stem/Base (Visual only, hidden for highballs) -->
                <div id="stem" class="flex flex-col items-center transition-all duration-500 opacity-100">
                    <div class="w-1.5 h-12 bg-white/20"></div>
                    <div class="w-12 h-1 bg-white/20 rounded-full shadow-[0_-2px_10px_rgba(255,255,255,0.2)]"></div>
                </div>
            </div>

            <!-- Drink Name -->
            <div class="mt-8 text-center z-10">
                <h2 id="drink-name" class="text-3xl text-white font-light tracking-tighter transition-all duration-300">韦斯帕马提尼</h2>
                <div class="flex items-center justify-center gap-2 mt-2 text-xs text-zinc-400 uppercase tracking-widest">
                    <iconify-icon icon="lucide:thermometer" width="12"></iconify-icon>
                    <span id="drink-temp">-4°C 最佳饮用</span>
                </div>
            </div>
        </section>

        <!-- Spirit Selection (Changes Glass) -->
        <section class="glass-panel rounded-3xl p-5">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xs text-zinc-400 font-medium uppercase tracking-widest">基酒选择</h3>
                <iconify-icon icon="lucide:archive" class="text-zinc-500" width="16"></iconify-icon>
            </div>
            
            <!-- Horizontal Scrollable Selector -->
            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-1 snap-x-mandatory">
                <button onclick="changeGlass('gin')" class="snap-center shrink-0 px-5 py-3 rounded-2xl bg-indigo-500/20 border border-indigo-500/50 text-white text-sm font-medium transition-all active:scale-95 hover:bg-indigo-500/30 focus:outline-none focus:ring-2 focus:ring-indigo-500/50">
                    金酒
                </button>
                <button onclick="changeGlass('whiskey')" class="snap-center shrink-0 px-5 py-3 rounded-2xl bg-zinc-800/50 border border-white/10 text-zinc-400 text-sm font-medium transition-all active:scale-95 hover:bg-white/10 hover:text-white">
                    威士忌
                </button>
                <button onclick="changeGlass('vodka')" class="snap-center shrink-0 px-5 py-3 rounded-2xl bg-zinc-800/50 border border-white/10 text-zinc-400 text-sm font-medium transition-all active:scale-95 hover:bg-white/10 hover:text-white">
                    伏特加
                </button>
                <button onclick="changeGlass('tequila')" class="snap-center shrink-0 px-5 py-3 rounded-2xl bg-zinc-800/50 border border-white/10 text-zinc-400 text-sm font-medium transition-all active:scale-95 hover:bg-white/10 hover:text-white">
                    龙舌兰
                </button>
            </div>
        </section>

        <!-- Mood Input -->
        <section class="glass-panel rounded-3xl p-5">
            <div class="flex justify-between items-end mb-4">
                <div>
                    <h3 class="text-xs text-zinc-400 font-medium uppercase tracking-widest mb-1">心情指数</h3>
                    <div class="text-lg text-white font-light">此刻感觉如何？</div>
                </div>
                <div class="text-2xl">✨</div>
            </div>
            
            <input type="range" min="0" max="100" value="60" class="mb-4 touch-none">
            
            <div class="flex justify-between text-[10px] text-zinc-500 uppercase tracking-wider font-medium">
                <span>惬意放松</span>
                <span>热烈狂欢</span>
            </div>
        </section>

        <!-- Context Pills -->
        <div class="grid grid-cols-2 gap-4">
            <div class="glass-panel rounded-2xl p-4 flex flex-col justify-between h-28">
                <iconify-icon icon="lucide:cloud-rain" class="text-blue-400" width="20"></iconify-icon>
                <div>
                    <div class="text-2xl text-white font-light">19°C</div>
                    <div class="text-[10px] text-zinc-500 uppercase tracking-widest mt-1">上海</div>
                </div>
            </div>
            <div class="glass-panel rounded-2xl p-4 flex flex-col justify-between h-28">
                <iconify-icon icon="lucide:music" class="text-pink-400" width="20"></iconify-icon>
                <div>
                    <div class="text-sm text-white font-light leading-tight">爵士电台<br>频道</div>
                    <div class="text-[10px] text-zinc-500 uppercase tracking-widest mt-2">播放中</div>
                </div>
            </div>
        </div>

    </main>

    <!-- Bottom Action -->
    <div class="fixed bottom-6 inset-x-4 z-50 max-w-md mx-auto">
        <button class="w-full py-4 rounded-2xl bg-white text-black font-medium text-sm tracking-wide shadow-xl shadow-white/10 active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
            <iconify-icon icon="lucide:sparkles" width="16"></iconify-icon>
            生成特调配方
        </button>
    </div>

    <!-- Background Noise -->
    <div class="fixed inset-0 opacity-[0.04] pointer-events-none z-0 mix-blend-overlay" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>

    <script>
        // Logic to handle Glass Metamorphosis
        const glass = document.getElementById('glass');
        const liquid = document.getElementById('liquid');
        const stem = document.getElementById('stem');
        const ice = document.getElementById('ice');
        const bgGlow = document.getElementById('bg-glow');
        const nameLabel = document.getElementById('drink-name');
        const tempLabel = document.getElementById('drink-temp');

        // Reset active state styles for buttons
        function resetButtons() {
            document.querySelectorAll('button[onclick^="changeGlass"]').forEach(btn => {
                btn.className = "snap-center shrink-0 px-5 py-3 rounded-2xl bg-zinc-800/50 border border-white/10 text-zinc-400 text-sm font-medium transition-all active:scale-95 hover:bg-white/10 hover:text-white";
            });
        }

        function changeGlass(type) {
            resetButtons();
            
            // Find clicked button and style it active
            const clickedBtn = document.querySelector(`button[onclick="changeGlass('${type}')"]`);
            if(clickedBtn) {
                clickedBtn.className = "snap-center shrink-0 px-5 py-3 rounded-2xl bg-indigo-500/20 border border-indigo-500/50 text-white text-sm font-medium transition-all active:scale-95 shadow-[0_0_15px_rgba(99,102,241,0.3)]";
            }

            if (type === 'gin') {
                // Shape: Coupe / Martini (Wide, curved bottom, stem)
                glass.style.width = '11rem';
                glass.style.height = '9rem';
                glass.style.borderRadius = '0';
                glass.style.borderBottomLeftRadius = '4rem';
                glass.style.borderBottomRightRadius = '4rem';
                
                liquid.className = "absolute bottom-0 w-full h-[75%] bg-gradient-to-t from-indigo-600/90 to-purple-400/70 transition-all duration-700";
                bgGlow.className = "absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-indigo-500/20 rounded-full blur-[80px] transition-colors duration-700";
                
                stem.style.opacity = '1';
                stem.style.height = 'auto';
                ice.style.opacity = '0'; // No ice usually
                
                nameLabel.innerText = "韦斯帕马提尼";
                tempLabel.innerText = "-4°C 最佳饮用";
            } 
            else if (type === 'whiskey') {
                // Shape: Rocks / Old Fashioned (Short, wide, no stem)
                glass.style.width = '10rem';
                glass.style.height = '9rem';
                glass.style.borderRadius = '0';
                glass.style.borderBottomLeftRadius = '1.5rem';
                glass.style.borderBottomRightRadius = '1.5rem';

                liquid.className = "absolute bottom-0 w-full h-[60%] bg-gradient-to-t from-amber-700/90 to-orange-500/60 transition-all duration-700";
                bgGlow.className = "absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-orange-500/10 rounded-full blur-[80px] transition-colors duration-700";

                stem.style.opacity = '0'; // Hide stem
                setTimeout(() => { stem.style.height = '0'; }, 500);
                ice.style.opacity = '1'; // Show ice
                
                nameLabel.innerText = "烟熏古典鸡尾酒";
                tempLabel.innerText = "加冰 · 口感醇厚";
            } 
            else if (type === 'vodka') {
                // Shape: Highball (Tall, thin, no stem)
                glass.style.width = '6rem';
                glass.style.height = '14rem';
                glass.style.borderRadius = '0';
                glass.style.borderBottomLeftRadius = '1rem';
                glass.style.borderBottomRightRadius = '1rem';

                liquid.className = "absolute bottom-0 w-full h-[85%] bg-gradient-to-t from-cyan-500/80 to-blue-300/40 transition-all duration-700";
                bgGlow.className = "absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-cyan-500/20 rounded-full blur-[80px] transition-colors duration-700";

                stem.style.opacity = '0';
                setTimeout(() => { stem.style.height = '0'; }, 500);
                ice.style.opacity = '1';
                
                nameLabel.innerText = "电光嗨棒";
                tempLabel.innerText = "2°C 冰镇爽口";
            }
            else if (type === 'tequila') {
                 // Shape: Margaritaish (Wide top, narrow bottom) - simulating with clip/borders
                 // Simplifying to a shorter V shape
                glass.style.width = '12rem';
                glass.style.height = '7rem';
                glass.style.borderRadius = '0';
                glass.style.borderBottomLeftRadius = '6rem';
                glass.style.borderBottomRightRadius = '6rem';

                liquid.className = "absolute bottom-0 w-full h-[70%] bg-gradient-to-t from-emerald-600/80 to-lime-400/60 transition-all duration-700";
                bgGlow.className = "absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-lime-500/10 rounded-full blur-[80px] transition-colors duration-700";

                stem.style.opacity = '1';
                stem.style.height = 'auto';
                ice.style.opacity = '0';

                nameLabel.innerText = "香辣帕洛玛";
                tempLabel.innerText = "盐边 · 风味独特";
            }
        }
    </script>
</body>
</html>
