  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Credit Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0f172a;
      overflow: hidden;
      margin: 0;
      font-family: 'Space Mono', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    #particles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .particle {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      transition: transform 0.1s ease-out;
    }
    
    .credit-card {
      width: 360px;
      height: 220px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      transform-style: preserve-3d;
      transition: transform 0.5s ease;
    }
    
    .credit-card:hover {
      transform: rotateY(5deg) rotateX(5deg);
    }
    
    .card-particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 16px;
      background: linear-gradient(125deg, #4c1d95 0%, #2e1065 50%, #1e1b4b 100%);
    }
    
    .chip {
      width: 40px;
      height: 30px;
      background: linear-gradient(135deg, #c7a94e 0%, #e6d395 50%, #c7a94e 100%);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    
    .chip::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(0,0,0,0.2);
    }
    
    .chip::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
      background: rgba(0,0,0,0.2);
    }
    
    .holographic-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        125deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.05) 25%,
        rgba(255,255,255,0.1) 50%,
        rgba(255,255,255,0.05) 75%,
        rgba(255,255,255,0) 100%
      );
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="credit-card">
    <div class="card-particles">
      <div id="card-particles-container"></div>
    </div>
    
    <!-- Card Content -->
    <div class="absolute inset-0 p-6 flex flex-col justify-between text-white z-10">
      <!-- Top Row -->
      <div class="flex justify-between items-start">
        <div class="chip"></div>
        <div class="text-right font-bold text-xl tracking-wider">NEBULA</div>
      </div>
      
      <!-- Card Number -->
      <div class="text-center tracking-widest text-xl mt-2">
        <span class="inline-block mx-1 opacity-90">5412</span>
        <span class="inline-block mx-1 opacity-90">7534</span>
        <span class="inline-block mx-1 opacity-90">8901</span>
        <span class="inline-block mx-1 opacity-90">2345</span>
      </div>
      
      <!-- Bottom Row -->
      <div class="flex justify-between items-end text-sm">
        <div>
          <div class="text-xs opacity-70">CARDHOLDER NAME</div>
          <div class="tracking-wider">ALEX MORGAN</div>
        </div>
        <div class="text-right">
          <div class="text-xs opacity-70">VALID THRU</div>
          <div>09/27</div>
        </div>
      </div>
    </div>
    
    <!-- Holographic Effect Overlay -->
    <div class="holographic-effect"></div>
  </div>

  <script>
    const cardParticlesContainer = document.getElementById('card-particles-container');
    let particles = [];
    
    // Settings with default values
    const settings = {
      count: 60,
      minSize: 1,
      maxSize: 3,
      mouseRadius: 80,
      mouseForce: 0.3,
      minSpeed: 0.1,
      maxSpeed: 0.5,
      friction: 0.95,
      returnForce: 0.01
    };
    
    // Initialize particles
    function createParticles() {
      // Remove existing particles
      particles.forEach(p => {
        if (p.element) p.element.remove();
      });
      particles = [];
      
      const cardBounds = document.querySelector('.credit-card').getBoundingClientRect();
      
      // Create new particles
      for (let i = 0; i < settings.count; i++) {
        const particle = document.createElement('div');
        particle.classList.add('particle');
        
        // Random size between minSize and maxSize
        const size = Math.random() * (settings.maxSize - settings.minSize) + settings.minSize;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        
        // Random position within card
        const x = Math.random() * 360;
        const y = Math.random() * 220;
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        
        // Random opacity and color
        const opacity = Math.random() * 0.4 + 0.1;
        const hue = Math.random() * 60 + 220; // Blue to purple range
        particle.style.backgroundColor = `hsla(${hue}, 80%, 70%, ${opacity})`;
        
        // Store properties
        particles.push({
          element: particle,
          x,
          y,
          size,
          originalX: x,
          originalY: y,
          vx: 0,
          vy: 0,
          speed: Math.random() * (settings.maxSpeed - settings.minSpeed) + settings.minSpeed
        });
        
        cardParticlesContainer.appendChild(particle);
      }
    }
    
    // Track mouse position relative to card
    let mouseX = 180;
    let mouseY = 110;
    let isMouseOverCard = false;
    
    document.querySelector('.credit-card').addEventListener('mousemove', (e) => {
      const cardBounds = document.querySelector('.credit-card').getBoundingClientRect();
      mouseX = e.clientX - cardBounds.left;
      mouseY = e.clientY - cardBounds.top;
      isMouseOverCard = true;
      
      // Update card tilt based on mouse position
      const card = document.querySelector('.credit-card');
      const centerX = cardBounds.width / 2;
      const centerY = cardBounds.height / 2;
      const rotateY = (mouseX - centerX) / 10;
      const rotateX = (centerY - mouseY) / 5;
      
      card.style.transform = `perspective(1000px) rotateY(${rotateY}deg) rotateX(${rotateX}deg)`;
    });
    
    document.querySelector('.credit-card').addEventListener('mouseleave', () => {
      isMouseOverCard = false;
      
      // Reset card rotation when mouse leaves
      document.querySelector('.credit-card').style.transform = 'perspective(1000px) rotateY(0deg) rotateX(0deg)';
    });
    
    // Animation loop
    function animate() {
      particles.forEach(particle => {
        if (isMouseOverCard) {
          // Calculate distance to mouse
          const dx = mouseX - particle.x;
          const dy = mouseY - particle.y;
          const distanceToMouse = Math.sqrt(dx * dx + dy * dy);
          
          // Influence from mouse
          if (distanceToMouse < settings.mouseRadius) {
            const force = (settings.mouseRadius - distanceToMouse) / settings.mouseRadius;
            particle.vx -= (dx / distanceToMouse) * force * settings.mouseForce;
            particle.vy -= (dy / distanceToMouse) * force * settings.mouseForce;
          }
        }
        
        // Return to original position
        particle.vx += (particle.originalX - particle.x) * settings.returnForce;
        particle.vy += (particle.originalY - particle.y) * settings.returnForce;
        
        // Apply friction
        particle.vx *= settings.friction;
        particle.vy *= settings.friction;
        
        // Update position
        particle.x += particle.vx * particle.speed;
        particle.y += particle.vy * particle.speed;
        
        // Update DOM element
        particle.element.style.transform = `translate(${particle.x - particle.originalX}px, ${particle.y - particle.originalY}px)`;
      });
      
      requestAnimationFrame(animate);
    }
    
    // Initialize and start animation
    createParticles();
    animate();
    
    // Handle window resize
    window.addEventListener('resize', createParticles);
  </script>
</body>
</html>
