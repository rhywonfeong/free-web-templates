? window.cancelAnimationFrame.bind(window)
: window.clearTimeout.bind(window);

let paused = false;
let nextFrameId = 1;
const frameRecords = new Map();
const pausedFrameCallbacks = new Map();

'  transition-duration: 0s !important;',
'  scroll-behavior: auto !important;',
'}'

document.head.appendChild(style);
window.requestAnimationFrame = function(callback) {
const frameId = nextFrameId++;
if (paused) {
pausedFrameCallbacks.set(frameId, callback);
frameRecords.set(frameId, { paused: true });

}

frameRecords.delete(frameId);

});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });

}

const args = Array.prototype.slice.call(arguments, 2);

const callbacks = Array.from(pausedFrameCallbacks.entries());
pausedFrameCallbacks.clear();
callbacks.forEach(function(entry) {
const frameId = entry[0];
const callback = entry[1];
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In-Flight Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #09090b; /* Zinc 950 */
}
/* Hide scrollbar for screen-like feel */
::-webkit-scrollbar {
display: none;
}
.glass-panel {
background: rgba(24, 24, 27, 0.6);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255, 255, 255, 0.08);
}
.glass-panel-hover:hover {
background: rgba(39, 39, 42, 0.8);
border-color: rgba(255, 255, 255, 0.15);
}
.map-grid {
background-image:
linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
background-size: 40px 40px;
}
/* Custom Range Slider Styling */
input[type=range] {
-webkit-appearance: none;
width: 100%;
background: transparent;
}
input[type=range]::-webkit-slider-thumb {
-webkit-appearance: none;
}
input[type=range]:focus {
outline: none;
}

<body class="text-zinc-300 antialiased h-screen w-screen overflow-hidden flex flex-col selection:bg-indigo-500/30 selection:text-indigo-200">

    <!-- Top Status Bar -->
    <header class="w-full h-16 px-6 flex items-center justify-between border-b border-white/5 z-20 bg-zinc-950/50 backdrop-blur-md">
        <div class="flex items-center gap-6">
            <div class="text-xl tracking-tighter font-medium text-white">AERO</div>
            <div class="h-4 w-px bg-white/10"></div>
            <div class="flex items-center gap-3 text-sm font-light">
                <span class="text-zinc-400">FLT</span>
                <span class="text-white tracking-wide">NX-204</span>
            </div>
        </div>

        <div class="flex items-center gap-8">
            <div class="flex flex-col items-center">
                <span class="text-[10px] uppercase tracking-wider text-zinc-500">Local Time</span>
                <span class="text-sm font-medium text-zinc-200">14:42</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-[10px] uppercase tracking-wider text-zinc-500">Dest Time</span>
                <span class="text-sm font-medium text-zinc-200">02:42</span>
            </div>
            <div class="h-8 w-8 rounded-full bg-indigo-500/10 flex items-center justify-center border border-indigo-500/20">
                <i data-lucide="wifi" class="text-indigo-400 h-4 w-4"></i>
            </div>
            <div class="flex items-center gap-2 px-3 py-1 rounded-full glass-panel">
                <span class="h-2 w-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></span>
                <span class="text-xs text-zinc-300 font-medium">Seat 4A</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 overflow-y-auto">
        
        <!-- Left Col: Flight Viz & Stats (Span 7) -->
        <section class="lg:col-span-7 flex flex-col gap-6">
            
            <!-- Map Visualization Card -->
            <div class="relative w-full h-80 rounded-2xl overflow-hidden glass-panel flex flex-col group transition-all duration-500">
                <div class="absolute inset-0 map-grid opacity-50"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-zinc-950/80 via-transparent to-transparent pointer-events-none"></div>
                
                <!-- Stylized Flight Path -->
                <svg class="absolute inset-0 w-full h-full stroke-indigo-500/30" preserveAspectRatio="none">
                    <path d="M -50,250 Q 400,100 900,150 T 1200,200" fill="none" stroke-width="2" stroke-dasharray="8 8" />
                    <!-- Progress Line -->
                    <path d="M -50,250 Q 400,100 600,132" fill="none" stroke="#6366f1" stroke-width="2" class="drop-shadow-[0_0_10px_rgba(99,102,241,0.5)]" />
                </svg>

                <!-- Plane Icon Positioned -->
                <div class="absolute left-[58%] top-[38%] transform -translate-x-1/2 -translate-y-1/2">
                    <div class="relative">
                        <i data-lucide="plane" class="text-white fill-white h-6 w-6 rotate-12 drop-shadow-[0_0_15px_rgba(255,255,255,0.8)]"></i>
                        <div class="absolute -inset-4 bg-indigo-500/20 blur-xl rounded-full"></div>
                    </div>
                </div>

                <!-- Locations -->
                <div class="absolute left-10 bottom-10">
                    <div class="text-[10px] tracking-widest text-zinc-500 uppercase mb-1">Origin</div>
                    <div class="text-2xl font-light text-white tracking-tight">NYC</div>
                    <div class="text-xs text-zinc-400 font-light">New York</div>
                </div>

                <div class="absolute right-10 top-10 text-right">
                    <div class="text-[10px] tracking-widest text-zinc-500 uppercase mb-1">Destination</div>
                    <div class="text-2xl font-light text-white tracking-tight">LHR</div>
                    <div class="text-xs text-zinc-400 font-light">London</div>
                </div>

                <!-- Progress Pill -->
                <div class="absolute top-6 left-1/2 -translate-x-1/2 glass-panel px-4 py-1.5 rounded-full flex items-center gap-3">
                    <span class="text-xs text-zinc-400">Time Remaining</span>
                    <span class="text-xs text-white font-medium">3h 45m</span>
                </div>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-3 gap-4">
                <div class="glass-panel p-5 rounded-2xl flex flex-col justify-between h-28 glass-panel-hover transition-colors cursor-default">
                    <div class="flex justify-between items-start">
                        <i data-lucide="gauge" class="text-zinc-500 h-5 w-5"></i>
                        <span class="text-[10px] uppercase text-zinc-600 font-semibold tracking-wider">Speed</span>
                    </div>
                    <div>
                        <span class="text-2xl font-light text-white tracking-tight">584</span>
                        <span class="text-xs text-zinc-500 ml-1">mph</span>
                    </div>
                </div>
                <div class="glass-panel p-5 rounded-2xl flex flex-col justify-between h-28 glass-panel-hover transition-colors cursor-default">
                    <div class="flex justify-between items-start">
                        <i data-lucide="mountain" class="text-zinc-500 h-5 w-5"></i>
                        <span class="text-[10px] uppercase text-zinc-600 font-semibold tracking-wider">Alt</span>
                    </div>
                    <div>
                        <span class="text-2xl font-light text-white tracking-tight">36,000</span>
                        <span class="text-xs text-zinc-500 ml-1">ft</span>
                    </div>
                </div>
                <div class="glass-panel p-5 rounded-2xl flex flex-col justify-between h-28 glass-panel-hover transition-colors cursor-default">
                    <div class="flex justify-between items-start">
                        <i data-lucide="thermometer" class="text-zinc-500 h-5 w-5"></i>
                        <span class="text-[10px] uppercase text-zinc-600 font-semibold tracking-wider">Temp</span>
                    </div>
                    <div>
                        <span class="text-2xl font-light text-white tracking-tight">-48</span>
                        <span class="text-xs text-zinc-500 ml-1">°F</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Col: Media & Controls (Span 5) -->
        <section class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- Quick Controls -->
            <div class="glass-panel p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-sm font-medium text-white">Cabin Control</h3>
                    <div class="h-2 w-2 rounded-full bg-indigo-500"></div>
                </div>
                
                <!-- Custom Slider: Lighting -->
                <div class="mb-6 group">
                    <div class="flex justify-between text-xs text-zinc-400 mb-2">
                        <span>Window Dimmer</span>
                        <span>60%</span>
                    </div>
                    <div class="relative w-full h-10 bg-zinc-900 rounded-lg flex items-center px-1 overflow-hidden border border-zinc-800">
                        <!-- Filled Part -->
                        <div class="absolute left-0 top-0 bottom-0 bg-indigo-500/20 w-[60%] border-r border-indigo-500/30"></div>
                        <input type="range" min="0" max="100" value="60" class="relative z-10 w-full h-full opacity-0 cursor-pointer">
                        <!-- Visual Thumb -->
                        <div class="absolute pointer-events-none h-6 w-1 rounded-full bg-indigo-400 shadow-[0_0_10px_rgba(129,140,248,0.5)] left-[60%] -translate-x-1/2"></div>
                    </div>
                </div>

                <!-- Toggles Grid -->
                <div class="grid grid-cols-2 gap-3">
                    <!-- Reading Light Toggle -->
                    <label class="cursor-pointer relative flex items-center justify-between p-3 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-zinc-700 transition-all">
                        <div class="flex items-center gap-3">
                            <i data-lucide="lightbulb" class="h-4 w-4 text-zinc-400"></i>
                            <span class="text-xs text-zinc-300">Read Light</span>
                        </div>
                        <input type="checkbox" class="peer sr-only">
                        <div class="w-9 h-5 bg-zinc-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[14px] after:right-[14px] after:bg-zinc-500 after:border-zinc-500 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-600 peer-checked:after:bg-white peer-checked:after:right-[14px] peer-checked:after:translate-x-[0px] relative">
                            <div class="absolute top-[2px] left-[2px] h-4 w-4 bg-zinc-500 rounded-full transition-transform peer-checked:translate-x-4 peer-checked:bg-white"></div>
                        </div>
                    </label>

                     <!-- Call Attendant -->
                     <button class="flex items-center justify-between p-3 rounded-xl bg-zinc-900 border border-zinc-800 hover:bg-red-500/10 hover:border-red-500/30 group transition-all">
                        <div class="flex items-center gap-3">
                            <i data-lucide="bell" class="h-4 w-4 text-zinc-400 group-hover:text-red-400 transition-colors"></i>
                            <span class="text-xs text-zinc-300 group-hover:text-red-200">Call Crew</span>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Entertainment Teaser -->
            <div class="flex-1 glass-panel p-6 rounded-2xl flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-medium text-white">Continue Watching</h3>
                    <button class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors">View All</button>
                </div>
                
                <div class="relative flex-1 rounded-xl overflow-hidden group cursor-pointer border border-zinc-800">
                    <div class="absolute inset-0 bg-zinc-800 flex items-center justify-center">
                        <!-- Abstract Movie Poster Art -->
                        <div class="w-full h-full bg-gradient-to-br from-indigo-900 via-purple-900 to-zinc-900 opacity-60"></div>
                        <div class="absolute inset-0 flex items-center justify-center">
                             <div class="h-12 w-12 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center border border-white/20 group-hover:scale-110 transition-transform duration-300">
                                <i data-lucide="play" class="h-5 w-5 text-white fill-white ml-0.5"></i>
                             </div>
                        </div>
                    </div>
                    <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black/90 to-transparent">
                        <div class="text-lg font-medium text-white tracking-tight">Interstellar</div>
                        <div class="text-xs text-zinc-400 mt-1 flex gap-2">
                            <span>2h 14m left</span>
                            <span class="text-zinc-600">•</span>
                            <span>Sci-Fi</span>
                        </div>
                        <!-- Progress Bar -->
                        <div class="w-full h-1 bg-zinc-700 rounded-full mt-3 overflow-hidden">
                            <div class="h-full bg-indigo-500 w-[35%]"></div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 grid grid-cols-2 gap-3">
                     <div class="h-20 bg-zinc-900/50 rounded-lg border border-zinc-800 flex items-center p-3 gap-3 hover:bg-zinc-800/50 transition-colors cursor-pointer">
                        <div class="h-10 w-10 bg-zinc-800 rounded flex items-center justify-center">
                            <i data-lucide="music" class="h-5 w-5 text-zinc-500"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs font-medium text-white">Lofi Beats</span>
                            <span class="text-[10px] text-zinc-500">Playlist</span>
                        </div>
                     </div>
                     <div class="h-20 bg-zinc-900/50 rounded-lg border border-zinc-800 flex items-center p-3 gap-3 hover:bg-zinc-800/50 transition-colors cursor-pointer">
                        <div class="h-10 w-10 bg-zinc-800 rounded flex items-center justify-center">
                            <i data-lucide="gamepad-2" class="h-5 w-5 text-zinc-500"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs font-medium text-white">Arcade</span>
                            <span class="text-[10px] text-zinc-500">12 Games</span>
                        </div>
                     </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <footer class="h-20 border-t border-white/5 bg-zinc-950/80 backdrop-blur-xl px-12 flex items-center justify-center relative z-20">
        <nav class="flex items-center gap-12">
            <button class="flex flex-col items-center gap-1.5 group">
                <i data-lucide="home" class="h-6 w-6 text-white transition-transform group-hover:-translate-y-1"></i>
                <span class="text-[10px] uppercase font-medium text-white tracking-wide opacity-100">Home</span>
            </button>
            <button class="flex flex-col items-center gap-1.5 group">
                <i data-lucide="clapperboard" class="h-6 w-6 text-zinc-500 transition-colors group-hover:text-zinc-300 transition-transform group-hover:-translate-y-1"></i>
                <span class="text-[10px] uppercase font-medium text-zinc-500 tracking-wide group-hover:text-zinc-300">Movies</span>
            </button>
            <button class="flex flex-col items-center gap-1.5 group">
                <i data-lucide="music-2" class="h-6 w-6 text-zinc-500 transition-colors group-hover:text-zinc-300 transition-transform group-hover:-translate-y-1"></i>
                <span class="text-[10px] uppercase font-medium text-zinc-500 tracking-wide group-hover:text-zinc-300">Audio</span>
            </button>
            <button class="flex flex-col items-center gap-1.5 group">
                <i data-lucide="shopping-bag" class="h-6 w-6 text-zinc-500 transition-colors group-hover:text-zinc-300 transition-transform group-hover:-translate-y-1"></i>
                <span class="text-[10px] uppercase font-medium text-zinc-500 tracking-wide group-hover:text-zinc-300">Shop</span>
            </button>
            <button class="flex flex-col items-center gap-1.5 group">
                <i data-lucide="settings" class="h-6 w-6 text-zinc-500 transition-colors group-hover:text-zinc-300 transition-transform group-hover:-translate-y-1"></i>
                <span class="text-[10px] uppercase font-medium text-zinc-500 tracking-wide group-hover:text-zinc-300">System</span>
            </button>
        </nav>

        <!-- Volume Indicator Absolute Right -->
        <div class="absolute right-8 top-1/2 -translate-y-1/2 flex items-center gap-3">
             <i data-lucide="volume-2" class="h-4 w-4 text-zinc-400"></i>
             <div class="w-24 h-1 bg-zinc-800 rounded-full overflow-hidden">
                 <div class="w-3/4 h-full bg-zinc-500"></div>
             </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
