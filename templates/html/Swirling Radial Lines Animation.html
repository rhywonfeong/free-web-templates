  <meta charset="UTF-8" />
  <title>Slow Swirling Random Minimal Lines</title>
  <style>
    body {
      background: #000;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lines-container {
      position: relative;
      width: 340px;
      height: 340px;
    }
    .line {
      position: absolute;
      width: 10px;
      height: 1px;
      border-radius: 1px;
      background: #fff;
      opacity: 0.63;
      pointer-events: none;
      animation: minipulse 2.6s infinite;
    }
    @keyframes minipulse {
      0%   { opacity: 0.15; }
      40%  { opacity: 0.9; }
      80%  { opacity: 0.45; }
      100% { opacity: 0.15; }
    }
  </style>
</head>
<body>
  <div class="lines-container" id="lines"></div>
  <script>
    const LINES = 400;
    const RADIUS = 150;
    const LENGTH = 10, THICK = 1;
    const CENTER = 170;
    const lines = [];
    const container = document.getElementById('lines');
    for (let i = 0; i < LINES; i++) {
      const r = Math.sqrt(Math.random()) * RADIUS;
      const theta0 = Math.random() * 2 * Math.PI;
      const x = CENTER + r * Math.cos(theta0);
      const y = CENTER + r * Math.sin(theta0);
      const line = document.createElement('div');
      line.className = 'line';
      line.style.left = (x - LENGTH/2) + 'px';
      line.style.top = (y - THICK/2) + 'px';
      line.style.animationDelay = (Math.random()*2).toFixed(2) + 's';
      container.appendChild(line);
      // Each line gets a unique rotation for an organic effect
      const phi = Math.random() * 2 * Math.PI;
      lines.push({ dom: line, r, theta0, offset: Math.random()*6.28, phi });
    }
    function animate(ts) {
      const t = ts / 1000;
      for (let i=0; i<LINES; i++) {
        const { dom, r, theta0, offset, phi } = lines[i];
        const pct = r / RADIUS;
        const theta = theta0 + t * (0.18 + 0.18 * (1-pct)) + offset;
        const x = CENTER + r * Math.cos(theta);
        const y = CENTER + r * Math.sin(theta);
        dom.style.left = (x - LENGTH/2) + 'px';
        dom.style.top = (y - THICK/2) + 'px';
        // Most lines are horizontal (<), angled slightly for uniqueness
        dom.style.transform = `rotate(${phi * 180 / Math.PI}deg)`;
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
