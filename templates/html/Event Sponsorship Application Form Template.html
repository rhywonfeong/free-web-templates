                        <input type="text" id="contact_name" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-gray-900 focus:ring-gray-900 py-2.5 px-3 text-sm transition-all" placeholder="Full Name">
                    </div>

                    <div>
                        <label for="position" class="block text-sm font-medium text-gray-700 mb-2">Job Title</label>
                        <input type="text" id="position" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-gray-900 focus:ring-gray-900 py-2.5 px-3 text-sm transition-all" placeholder="e.g. Marketing Manager">
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-lucide="mail" aria-hidden="true" class="lucide lucide-mail w-4 h-4"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect></svg>
                            </div>
                            <input type="email" id="email" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-gray-900 focus:ring-gray-900 py-2.5 pl-10 pr-3 text-sm transition-all" placeholder="you@company.com">
                        </div>
                    </div>

                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-lucide="phone" aria-hidden="true" class="lucide lucide-phone w-4 h-4"><path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"></path></svg>
                            </div>
                            <input type="tel" id="phone" class="w-full rounded-lg border-gray-300 shadow-sm focus:border-gray-900 focus:ring-gray-900 py-2.5 pl-10 pr-3 text-sm transition-all" placeholder="+61 400 000 000">
                        </div>
                    </div>

                    <div class="col-span-1 md:col-span-2">
                         <label for="website" class="block text-sm font-medium text-gray-700 mb-2">Website / Social Handle</label>
                         <div class="flex rounded-lg shadow-sm">
                             <span class="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-gray-300 bg-gray-50 text-gray-500 text-sm">https://</span>
                             <input type="text" id="website" class="flex-1 min-w-0 block w-full px-3 py-2.5 rounded-none rounded-r-lg border-gray-300 focus:ring-gray-900 focus:border-gray-900 text-sm transition-all" placeholder="www.example.com">
                         </div>
                    </div>

                    <!-- Logo Upload -->
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Company Logo (Vector or Hi-Res PNG)</label>
                        <div class="mt-1 flex justify-center px-6 pt-10 pb-10 border-2 border-gray-300 border-dashed rounded-xl hover:bg-gray-50 hover:border-gray-400 transition-all cursor-pointer group">
                            <div class="space-y-2 text-center">
                                <div class="mx-auto h-12 w-12 text-gray-400 group-hover:text-gray-500 transition-colors">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-lucide="cloud-upload" aria-hidden="true" class="lucide lucide-cloud-upload w-10 h-10 mx-auto"><path d="M12 13v8"></path><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="m8 17 4-4 4 4"></path></svg>
                                </div>
                                <div class="flex text-sm text-gray-600 justify-center">
                                    <label for="file-upload" class="relative cursor-pointer bg-transparent rounded-md font-medium text-gray-900 hover:text-gray-700 focus-within:outline-none">
                                        <span>Upload a file</span>
                                        <input id="file-upload" name="file-upload" type="file" class="sr-only">
                                    </label>
                                    <p class="pl-1">or drag and drop</p>
                                </div>
                                <p class="text-xs text-gray-500">SVG, PNG, AI up to 10MB</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Terms -->
                <div class="mb-10">
                    <div class="flex items-start">
                        <div class="flex items-center h-5">
                            <input id="terms" name="terms" type="checkbox" class="h-4 w-4 text-gray-900 border-gray-300 rounded focus:ring-gray-900 cursor-pointer">
                        </div>
                        <div class="ml-3 text-sm">
                            <label for="terms" class="font-medium text-gray-900 cursor-pointer">I agree to the Sponsorship Terms</label>
                            <p class="text-gray-500">I understand that a tax invoice will be issued upon acceptance of this application.</p>
                        </div>
                    </div>
                </div>

                <!-- Footer Actions -->
                <div class="flex flex-col-reverse md:flex-row items-center justify-between gap-6 pt-8 border-t border-gray-200">
                    <p class="text-sm text-gray-500">
                        Questions? Contact <a href="#" class="font-medium text-gray-900 underline decoration-gray-300 underline-offset-4 hover:decoration-gray-900 transition-all">sponsorship@event.com</a>
                    </p>
                    <button type="submit" class="w-full md:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 border border-transparent text-sm font-semibold rounded-lg shadow-sm text-white bg-gray-900 hover:bg-black focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 transition-all">
                        Submit Application
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-right" aria-hidden="true" class="lucide lucide-arrow-right w-4 h-4"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
        </form>
    </main>
    
    <script>
        lucide.createIcons();
    </script>

</body></html>
