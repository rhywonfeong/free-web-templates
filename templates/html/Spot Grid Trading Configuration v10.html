<!doctype html>
<html lang="en" class="h-full antialiased">
  <head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Strategies</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script></head>
  <body class="min-h-screen bg-neutral-950 text-neutral-100" style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji';">
    <main class="mx-auto max-w-5xl px-4 sm:px-6 py-6 md:py-10">
      <!-- Top tabs -->
      <div class="flex items-center gap-7 border-b border-white/10">
        <button class="relative pb-3 text-sm md:text-[15px] font-normal text-neutral-400 hover:text-neutral-200 transition">
          Trade
        </button>
        <button class="relative pb-3 text-sm md:text-[15px] font-semibold tracking-tight text-white">
          Strategies
          <span class="pointer-events-none absolute -bottom-px left-0 h-0.5 w-full bg-emerald-400"></span>
        </button>
      </div>

      <!-- Filter chips (smaller font as requested) -->
      <div class="mt-4 flex flex-wrap gap-2">
        <button class="px-3 py-1.5 rounded-full text-[11px] md:text-xs font-medium text-white bg-white/10 border border-white/10 hover:bg-white/15 transition">All</button>
        <button class="px-3 py-1.5 rounded-full text-[11px] md:text-xs font-medium text-neutral-300 bg-transparent border border-white/10 hover:bg-white/[0.06] hover:text-white transition">Bullish</button>
        <button class="px-3 py-1.5 rounded-full text-[11px] md:text-xs font-medium text-neutral-300 bg-transparent border border-white/10 hover:bg-white/[0.06] hover:text-white transition">Bearish</button>
        <button class="px-3 py-1.5 rounded-full text-[11px] md:text-xs font-medium text-neutral-300 bg-transparent border border-white/10 hover:bg-white/[0.06] hover:text-white transition">Sideways</button>
        <button class="px-3 py-1.5 rounded-full text-[11px] md:text-xs font-medium text-neutral-300 bg-transparent border border-white/10 hover:bg-white/[0.06] hover:text-white transition">Slicing bots</button>
        <button class="px-3 py-1.5 rounded-full text-[11px] md:text-xs font-medium text-neutral-300 bg-transparent border border-white/10 hover:bg-white/[0.06] hover:text-white transition">Signal bots</button>
      </div>

      <!-- Bots grid (two columns side-by-side) -->
      <section aria-label="Strategies" class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
        <!-- Card -->
        <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-white/[0.04] p-4 hover:bg-white/[0.06] transition focus:outline-none focus:ring-2 focus:ring-emerald-400/50">
          <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/15 bg-white/[0.06]">
            <i data-lucide="plus" class="h-5 w-5 text-white"></i>
          </span>
          <div class="flex-1 text-left">
            <h3 class="text-[15px] md:text-base font-medium tracking-tight text-white">Futures grid</h3>
            <p class="hidden sm:block text-xs text-neutral-400">Automated grid strategy for futures markets.</p>
          </div>
        </button>

        <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-white/[0.04] p-4 hover:bg-white/[0.06] transition focus:outline-none focus:ring-2 focus:ring-emerald-400/50">
          <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/15 bg-white/[0.06]">
            <i data-lucide="plus" class="h-5 w-5 text-white"></i>
          </span>
          <div class="flex-1 text-left">
            <h3 class="text-[15px] md:text-base font-medium tracking-tight text-white">Spot grid</h3>
            <p class="hidden sm:block text-xs text-neutral-400">Range-trading grid for spot pairs.</p>
          </div>
        </button>

        <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-white/[0.04] p-4 hover:bg-white/[0.06] transition focus:outline-none focus:ring-2 focus:ring-emerald-400/50">
          <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/15 bg-white/[0.06]">
            <i data-lucide="plus" class="h-5 w-5 text-white"></i>
          </span>
          <div class="flex-1 text-left">
            <h3 class="text-[15px] md:text-base font-medium tracking-tight text-white">Futures DCA</h3>
            <p class="hidden sm:block text-xs text-neutral-400">Scale into futures positions over time.</p>
          </div>
        </button>

        <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-white/[0.04] p-4 hover:bg-white/[0.06] transition focus:outline-none focus:ring-2 focus:ring-emerald-400/50">
          <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/15 bg-white/[0.06]">
            <i data-lucide="plus" class="h-5 w-5 text-white"></i>
          </span>
          <div class="flex-1 text-left">
            <h3 class="text-[15px] md:text-base font-medium tracking-tight text-white">Spot DCA</h3>
            <p class="hidden sm:block text-xs text-neutral-400">Average into spot positions automatically.</p>
          </div>
        </button>

        <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-white/[0.04] p-4 hover:bg-white/[0.06] transition focus:outline-none focus:ring-2 focus:ring-emerald-400/50">
          <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/15 bg-white/[0.06]">
            <i data-lucide="plus" class="h-5 w-5 text-white"></i>
          </span>
          <div class="flex-1 text-left">
            <h3 class="text-[15px] md:text-base font-medium tracking-tight text-white">Flywheel</h3>
            <p class="hidden sm:block text-xs text-neutral-400">Compound gains via cyclical execution.</p>
          </div>
        </button>

        <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-white/[0.04] p-4 hover:bg-white/[0.06] transition focus:outline-none focus:ring-2 focus:ring-emerald-400/50">
          <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/15 bg-white/[0.06]">
            <i data-lucide="plus" class="h-5 w-5 text-white"></i>
          </span>
          <div class="flex-1 text-left">
            <h3 class="text-[15px] md:text-base font-medium tracking-tight text-white">Smart Arbitrage</h3>
            <p class="hidden sm:block text-xs text-neutral-400">Capture spreads across pairs or venues.</p>
          </div>
        </button>

        <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-white/[0.04] p-4 hover:bg-white/[0.06] transition focus:outline-none focus:ring-2 focus:ring-emerald-400/50">
          <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/15 bg-white/[0.06]">
            <i data-lucide="plus" class="h-5 w-5 text-white"></i>
          </span>
          <div class="flex-1 text-left">
            <h3 class="text-[15px] md:text-base font-medium tracking-tight text-white">Recurring buy</h3>
            <p class="hidden sm:block text-xs text-neutral-400">Automate periodic accumulation.</p>
          </div>
        </button>

        <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-white/[0.04] p-4 hover:bg-white/[0.06] transition focus:outline-none focus:ring-2 focus:ring-emerald-400/50">
          <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/15 bg-white/[0.06]">
            <i data-lucide="plus" class="h-5 w-5 text-white"></i>
          </span>
          <div class="flex-1 text-left">
            <h3 class="text-[15px] md:text-base font-medium tracking-tight text-white">Tradingview signal</h3>
            <p class="hidden sm:block text-xs text-neutral-400">Execute from external alerts.</p>
          </div>
        </button>
      </section>

      <!-- Optional hero image to align with requested image usage -->
      <section class="mt-10">
        <div class="relative overflow-hidden rounded-2xl border border-white/10 bg-gradient-to-b from-white/[0.04] to-transparent">
          <img
            src="https://images.unsplash.com/photo-1549880338-65ddcdfd017b?q=80&w=1600&auto=format&fit=crop"
            alt="Minimal mountainscape"
            class="h-40 w-full object-cover opacity-60 mix-blend-luminosity"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/40 to-transparent"></div>
          <div class="absolute bottom-0 left-0 right-0 p-5">
            <h2 class="text-xl md:text-2xl font-semibold tracking-tight text-white">Build your strategy</h2>
            <p class="mt-1 text-sm text-neutral-300">Pick a template and customize parameters to launch.</p>
          </div>
        </div>
      </section>
    </main>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
