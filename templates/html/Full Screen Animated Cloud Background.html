  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    #background {
      position: fixed;

    }
  </style>

<body>
  <div id="background"></div>

  <script>

      VANTA.CLOUDS({
        el: "#background",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        speed: 1.0,
        cloudColor: 0x1a365d,
        skyColor: 0x2b6cb0
      });
    });
  </script>
