                    <div class="absolute top-6 right-6 w-4 h-4 rounded-full border border-gray-300 bg-white transition-all duration-200 peer-checked:border-[5px] peer-checked:border-purple-600 group-hover:border-purple-300"></div>

                    <!-- Recommended Badge -->
                    <div class="mb-5">
                        <span class="inline-flex items-center px-2 py-0.5 bg-purple-100 text-purple-600 text-xs font-medium uppercase tracking-wide rounded-full">
                            Recommended
                        </span>
                    </div>

                    <!-- Card Header -->
                    <div class="flex items-start gap-4 mb-5">
                        <div class="shrink-0 w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center text-purple-600">
                            <i data-lucide="list-checks" class="w-5 h-5" stroke-width="1.5"></i>
                        </div>
                        <div class="pr-8">
                            <h3 class="text-lg font-medium text-gray-900 mb-0.5">Guided Workflow</h3>
                            <p class="text-sm text-gray-500 leading-relaxed">Step-by-step control over every part of your post</p>
                        </div>
                    </div>

                    <!-- Divider -->
                    <div class="w-full h-px bg-gray-100 mb-5"></div>

                    <!-- Features -->
                    <ul class="flex flex-col gap-2.5 mb-8 flex-grow">
                        <li class="flex items-start gap-3 text-sm text-gray-700">
                            <i data-lucide="check" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5" stroke-width="1.5"></i>
                            <span>Review SERP data and competitor insights</span>
                        </li>
                        <li class="flex items-start gap-3 text-sm text-gray-700">
                            <i data-lucide="check" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5" stroke-width="1.5"></i>
                            <span>Customize title, outline and sections</span>
                        </li>
                        <li class="flex items-start gap-3 text-sm text-gray-700">
                            <i data-lucide="check" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5" stroke-width="1.5"></i>
                            <span>Regenerate any section individually</span>
                        </li>
                        <li class="flex items-start gap-3 text-sm text-gray-700">
                            <i data-lucide="check" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5" stroke-width="1.5"></i>
                            <span>Best for in-depth, SEO-focused content</span>
                        </li>
                    </ul>

                    <!-- Time Estimate -->
                    <div class="mt-auto w-full bg-gray-50 rounded-lg p-2.5 flex items-center gap-2 text-xs text-gray-400 border border-transparent peer-checked:bg-white peer-checked:border-gray-100 transition-colors">
                        <i data-lucide="clock" class="w-4 h-4 shrink-0" stroke-width="1.5"></i>
                        <span>Avg. 8–12 min to complete</span>
                    </div>

                </label>
            </div>

            <!-- Card 2: One Click Blog -->
            <div class="relative">
                <input type="radio" name="mode_selection" id="mode-quick" value="quick" class="peer sr-only" onchange="updateButtonState()">
                <label for="mode-quick" class="relative flex flex-col h-full bg-white border border-gray-200 rounded-lg cursor-pointer transition-all duration-200 hover:border-purple-300 peer-checked:border-purple-600 peer-checked:ring-1 peer-checked:ring-purple-600 peer-checked:bg-neutral-50 p-6 group">
                    
                    <!-- Custom Radio Dot -->
                    <div class="absolute top-6 right-6 w-4 h-4 rounded-full border border-gray-300 bg-white transition-all duration-200 peer-checked:border-[5px] peer-checked:border-purple-600 group-hover:border-purple-300"></div>

                    <!-- Card Header (Slightly larger top margin to balance missing badge whitespace) -->
                    <div class="flex items-start gap-4 mb-6 mt-1">
                        <div class="shrink-0 w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center text-purple-600">
                            <i data-lucide="zap" class="w-5 h-5" stroke-width="1.5"></i>
                        </div>
                        <div class="pr-8">
                            <h3 class="text-lg font-medium text-gray-900 mb-0.5">One Click Blog</h3>
                            <p class="text-sm text-gray-500 leading-relaxed">Enter a topic and get a full draft instantly</p>
                        </div>
                    </div>

                    <!-- Features (No divider for a lighter, faster feel) -->
                    <ul class="flex flex-col gap-2.5 mb-8 flex-grow">
                        <li class="flex items-start gap-3 text-sm text-gray-700">
                            <i data-lucide="check" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5" stroke-width="1.5"></i>
                            <span>AI generates title, headings and content</span>
                        </li>
                        <li class="flex items-start gap-3 text-sm text-gray-700">
                            <i data-lucide="check" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5" stroke-width="1.5"></i>
                            <span>Complete draft ready in under a minute</span>
                        </li>
                        <li class="flex items-start gap-3 text-sm text-gray-700">
                            <i data-lucide="check" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5" stroke-width="1.5"></i>
                            <span>Edit or improve the draft anytime</span>
                        </li>
                        <li class="flex items-start gap-3 text-sm text-gray-700">
                            <i data-lucide="check" class="w-4 h-4 text-emerald-500 shrink-0 mt-0.5" stroke-width="1.5"></i>
                            <span>Best for quick drafts and content ideas</span>
                        </li>
                    </ul>

                    <!-- Time Estimate -->
                    <div class="mt-auto w-full bg-gray-50 rounded-lg p-2.5 flex items-center gap-2 text-xs text-gray-400 border border-transparent peer-checked:bg-white peer-checked:border-gray-100 transition-colors">

        <!-- Bottom Action Row -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-6 pt-2">
            <p class="text-xs text-gray-400 italic text-center sm:text-left">
                Not sure which to pick? Guided Workflow gives you more control.
            </p>
            <button id="continue-btn" disabled class="h-11 w-full sm:w-[140px] rounded-lg text-sm font-medium flex items-center justify-center gap-1.5 shrink-0 transition-all duration-200 bg-gray-100 text-gray-400 cursor-not-allowed border border-transparent enabled:bg-purple-600 enabled:text-white enabled:cursor-pointer enabled:hover:bg-purple-700 enabled:active:bg-purple-800">
                Continue <span class="text-lg leading-none mt-[-1px]">&rarr;</span>
            </button>
        </div>

    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Handle button state logic
        function updateButtonState() {
            const radios = document.getElementsByName('mode_selection');
            const btn = document.getElementById('continue-btn');
            let isChecked = false;
            
            for (const radio of radios) {
                if (radio.checked) {
                    isChecked = true;
                    break;
                }
            }
            
            if (isChecked) {
                btn.removeAttribute('disabled');
            } else {
                btn.setAttribute('disabled', 'true');
            }
        }
    </script>
