    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;1,400..700&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-primary-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-primary-serif: 'Lora', serif;
            --font-style-pastel-ui: 'Nunito Sans', sans-serif;
            
            --font-current-main: var(--font-style-pastel-ui);
            --font-current-heading: var(--font-primary-serif);
            
            --bg-page: #fdf6f0;
            --bg-component: #ffffff;
            --bg-input: #fffefc;
            --bg-button-primary: #ff8c69;
            --bg-button-primary-hover: #ff7043;
            
            --text-primary: #6d5d52;
            --text-secondary: #938278;
            --text-muted: #b5a9a2;
            --text-heading: #5c4d44;
            --text-accent: var(--bg-button-primary);
            --text-on-button-primary: #ffffff;
            
            --border-color: #ffe8d9;
            --border-input: #ffe0c2;
            --border-input-focus: var(--text-accent);
            
            --border-radius-base: 10px;
            --border-radius-lg: 16px;
            
            --shadow-color-rgb: 180, 160, 150;
            --shadow-opacity-sm: 0.08;
            --shadow-opacity-md: 0.1;
            --shadow-opacity-lg: 0.12;
            --shadow-sm: 0 3px 6px rgba(var(--shadow-color-rgb), var(--shadow-opacity-sm));
            --shadow-md: 0 6px 12px rgba(var(--shadow-color-rgb), var(--shadow-opacity-md));
            --shadow-lg: 0 10px 20px rgba(var(--shadow-color-rgb), var(--shadow-opacity-lg));
            
            --focus-ring-color: rgba(255, 140, 105, 0.3);
            --transition-speed-fast: 0.15s;
            --transition-speed-normal: 0.25s;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: var(--font-current-main);
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }

        .login-form-wrapper {
            background-color: var(--bg-component);
            padding: 30px 40px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
        }

        .login-form-title {
            font-family: var(--font-current-heading);
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-heading);
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border: 1px solid var(--border-input);
            border-radius: var(--border-radius-base);
            background-color: var(--bg-input);
            color: var(--text-primary);
            transition: all var(--transition-speed-fast);
            box-shadow: var(--shadow-sm);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--border-input-focus);
            box-shadow: 0 0 0 3px var(--focus-ring-color), var(--shadow-sm);
        }

        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 1;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .form-link {
            color: var(--text-accent);
            text-decoration: none;
            font-weight: 500;
        }

        .form-link:hover {
            text-decoration: underline;
        }

        .c-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            border-radius: var(--border-radius-base);
            cursor: pointer;
            transition: all var(--transition-speed-fast);
            border: 1px solid transparent;
            box-shadow: var(--shadow-sm);
        }

        .c-btn-primary {
            background: var(--bg-button-primary);
            color: var(--text-on-button-primary);
        }

        .c-btn-primary:hover {
            background: var(--bg-button-primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .form-footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        @media (max-width: 480px) {
            .login-form-wrapper {
                padding: 20px;
            }
            
            .form-control, .c-btn {
                font-size: 0.95rem;
                padding: 10px 12px;
            }
            
            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="login-form-wrapper">
        <h3 class="login-form-title">Quick Access</h3>
        <p style="text-align:center; color: var(--text-secondary); font-size:0.9rem; margin-top:-20px; margin-bottom:25px;">
            Sign in to your account below.
        </p>
        <form action="#" method="POST">
            <div class="form-group">
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <div class="form-options">
                <a href="#" class="form-link">Create account</a>
                <a href="#" class="form-link">Need help?</a>
            </div>
            <button type="submit" class="c-btn c-btn-primary">Log In</button>
            <p class="form-footer-text">
                By signing in, you agree to our <a href="#" class="form-link">Terms</a> &amp; <a href="#" class="form-link">Policy</a>.
            </p>
        </form>
    </div>
</body>
</html>
