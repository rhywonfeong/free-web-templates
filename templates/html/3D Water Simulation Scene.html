    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Water in Three.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/objects/Water.js"></script>
</head>
<body class="m-0 p-0 overflow-hidden bg-black">
    <div class="absolute top-0 left-0 p-4 text-white z-10">
        <h1 class="text-xl font-bold">Realistic Water Simulation</h1>
        <p class="text-sm">Click and drag to rotate view</p>
    </div>
    <div id="container" class="w-full h-screen"></div>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        
        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 50);
        
        // Renderer
        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('container').appendChild(renderer.domElement);
        
        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.minDistance = 10;
        controls.maxDistance = 100;
        
        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(0, 10, 5);
        scene.add(directionalLight);
        
        // Create ground
        const groundGeometry = new THREE.PlaneGeometry(100, 100, 1, 1);
        const groundMaterial = new THREE.MeshStandardMaterial({
            color: 0x555555,
            roughness: 0.8,
        });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -2;
        scene.add(ground);
        
        // Create water
        const waterGeometry = new THREE.PlaneGeometry(100, 100, 50, 50);
        
        let water = null;
        
        // Load water texture
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load('https://threejs.org/examples/textures/waternormals.jpg', function(texture) {
            texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
            
            water = new THREE.Water(waterGeometry, {
                textureWidth: 512,
                textureHeight: 512,
                waterNormals: texture,
                alpha: 1.0,
                sunDirection: directionalLight.position.clone().normalize(),
                sunColor: 0xffffff,
                waterColor: 0x001e0f,
                distortionScale: 3.7,
                fog: false
            });
            
            water.rotation.x = -Math.PI / 2;
            scene.add(water);
            
            // Add some objects to reflect
            addObjects();
        });
        
        function addObjects() {
            // Add cube
            const cubeGeometry = new THREE.BoxGeometry(5, 5, 5);
            const cubeMaterial = new THREE.MeshStandardMaterial({
                color: 0x0088ff,
                metalness: 0.5,
                roughness: 0.2
            });
            const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
            cube.position.set(-10, 5, 0);
            scene.add(cube);
            
            // Add sphere
            const sphereGeometry = new THREE.SphereGeometry(4, 32, 32);
            const sphereMaterial = new THREE.MeshStandardMaterial({
                color: 0xff8800,
                metalness: 0.2,
                roughness: 0.3
            });
            const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            sphere.position.set(10, 6, 0);
            scene.add(sphere);
            
            // Add boat
            const boatGeometry = new THREE.BoxGeometry(8, 2, 15);
            const boatMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const boat = new THREE.Mesh(boatGeometry, boatMaterial);
            boat.position.set(0, 2, -15);
            scene.add(boat);
        }
        
        // Sky color
        scene.background = new THREE.Color(0x88ccff);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            if (water) {
                water.material.uniforms['time'].value += 1.0 / 60.0;
            }
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
</html>
