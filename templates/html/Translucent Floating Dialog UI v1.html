<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gradient-to-br from-[#050914] via-[#0b1730] to-[#011825] flex items-center justify-center min-h-screen text-white antialiased">
  <!-- Ambient glow -->
  <div class="absolute inset-0 pointer-events-none">
    <div style="background:radial-gradient(ellipse at 40% 60%,rgba(21,139,224,0.25),transparent 60%);" class="w-full h-full blur-3xl"></div>
  </div>

  <!-- Dialog -->
  <div id="dialog" class="relative w-11/12 max-w-md p-8 rounded-3xl bg-white/5 backdrop-blur-xl ring-1 ring-white/20 shadow-2xl transition-all duration-700 opacity-0 translate-y-6">
    <button id="closeBtn" class="absolute top-4 right-4 text-white/70 hover:text-white focus:outline-none">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>

    <h2 class="text-2xl md:text-3xl font-semibold tracking-tight mb-3">Jellyfish Dialog</h2>
    <p class="text-white/80 leading-relaxed mb-6">
      This translucent panel floats above the deep-sea background, softly glowing like a jellyfish in the abyss. Customize its contents or embed forms, media, or notifications here.
    </p>

    <div class="flex gap-3">
      <button class="flex-1 py-2.5 rounded-lg bg-white/10 hover:bg-white/20 ring-1 ring-inset ring-white/20 font-medium transition-colors">Cancel</button>
      <button class="flex-1 py-2.5 rounded-lg bg-cyan-500 hover:bg-cyan-400 font-medium transition-colors">Confirm</button>
    </div>

    <!-- Jellyfish glow decoration -->
    <div style="background:radial-gradient(circle at 50% 50%,rgba(98,199,255,0.35),rgba(0,0,0,0) 70%);" class="absolute -bottom-12 left-1/2 -translate-x-1/2 w-60 h-60 blur-3xl pointer-events-none"></div>
  </div>

  <script>
    // Reveal dialog
    addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('dialog').classList.remove('opacity-0', 'translate-y-6');
        lucide.createIcons();
      }, 100);
    });
    // Close dialog
    document.addEventListener('click', e => {
      if (e.target.id === 'closeBtn' || e.target.closest('#closeBtn')) {
        document.getElementById('dialog').classList.add('opacity-0', 'translate-y-6');
      }
    });
  </script>
</body>
</html>
