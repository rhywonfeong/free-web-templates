<body class="bg-white text-gray-900 flex h-screen overflow-hidden antialiased selection:bg-gray-100 selection:text-gray-900">

    <!-- Sidebar -->
    <aside class="w-[260px] bg-[#F9F9FB] border-r border-gray-100 hidden md:flex flex-col h-full flex-shrink-0 transition-all duration-300">
        <!-- Top Action -->
        <div class="p-3 pt-4">
            <button class="group flex items-center justify-between w-full px-3 py-2 bg-white hover:bg-gray-50 border border-gray-200/60 hover:border-gray-300 rounded-lg shadow-[0_1px_2px_rgba(0,0,0,0.04)] transition-all duration-200">
                <div class="flex items-center gap-2.5">
                    <i data-lucide="plus" class="w-4 h-4 text-gray-500 group-hover:text-gray-700" stroke-width="1.5"></i>
                    <span class="text-sm font-medium text-gray-600 group-hover:text-gray-900">Đoạn chat mới</span>

        <div class="flex-1 overflow-y-auto px-2 py-2 no-scrollbar">
            <div class="px-2 py-1.5 text-[11px] font-medium text-gray-400 uppercase tracking-wider">Hôm nay</div>
            <div class="space-y-0.5 mb-4">

                <button class="w-full text-left px-2.5 py-2 text-[13px] text-gray-600 hover:text-gray-900 hover:bg-gray-200/50 rounded-md truncate transition-colors font-normal">

            <button class="flex items-center gap-3 w-full px-2 py-2 text-[13px] text-gray-600 hover:text-gray-900 transition-colors rounded-md hover:bg-gray-200/50">

        <!-- Header -->
        <header class="h-14 flex items-center justify-between px-4 md:px-6 w-full z-10 absolute top-0 left-0 bg-white/80 backdrop-blur-md">
            <!-- Left: Sidebar Toggle (Mobile) & Logo -->
            <div class="flex items-center gap-3">

                    <p class="text-base text-gray-500 font-normal leading-relaxed max-w-lg mx-auto">

                </div>

                <!-- Suggestion Cards -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full pt-6">
                    <button class="flex flex-col text-left p-3.5 rounded-xl border border-gray-200/70 hover:border-gray-300 hover:bg-gray-50 transition-all duration-200">

                            <span class="text-sm font-medium text-gray-700">Tìm kiếm giải pháp</span>
                        </div>
                        <span class="text-xs text-gray-500 font-normal truncate">Hệ thống quan trắc nước thải tự động?</span>
                    </button>
                    
                    <button class="flex flex-col text-left p-3.5 rounded-xl border border-gray-200/70 hover:border-gray-300 hover:bg-gray-50 transition-all duration-200">

    <script>

        textarea.addEventListener('input', function() {

        });
    </script>
