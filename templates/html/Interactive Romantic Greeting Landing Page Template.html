<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For NAVI 💖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
@keyframes gradientBG {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}
@keyframes floatUp {
0% { transform: translateY(0) rotate(0deg); opacity: 0.7; }
100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
}
@keyframes slideIn {
from { opacity: 0; transform: translateY(16px); }
to { opacity: 1; transform: translateY(0); }
}
.animate-gradient {
background: linear-gradient(135deg, #ffd1dc, #e6e6fa, #ffe5b4);
background-size: 400% 400%;
animation: gradientBG 15s ease infinite;
}
.floating-heart {
animation: floatUp linear infinite;
position: absolute;
bottom: -32px;
z-index: 0;
color: #d15c8a;
}
.animate-slide-up {
animation: slideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="animate-gradient h-screen w-screen overflow-hidden flex justify-center items-center text-[#5a4b5e] font-['Nunito',sans-serif] antialiased selection:bg-[#d15c8a]/20">

    <!-- Ambient Floating Hearts -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
        <div class="floating-heart left-[15%] text-2xl opacity-40" style="animation-duration: 9s; animation-delay: 0s;">💖</div>
        <div class="floating-heart left-[35%] text-base opacity-30" style="animation-duration: 12s; animation-delay: 2s;">💖</div>
        <div class="floating-heart left-[65%] text-3xl opacity-20" style="animation-duration: 10s; animation-delay: 5s;">💖</div>
        <div class="floating-heart left-[85%] text-lg opacity-50" style="animation-duration: 8s; animation-delay: 1s;">💖</div>
        <div class="floating-heart left-[50%] text-xl opacity-40" style="animation-duration: 14s; animation-delay: 3s;">💖</div>
    </div>

    <!-- Main Interactive Card -->
    <main class="relative z-10 w-[90%] max-w-[400px] bg-white/40 backdrop-blur-xl border border-white/60 p-10 rounded-[32px] shadow-[0_24px_48px_-12px_rgba(90,75,94,0.15)] min-h-[380px] flex flex-col justify-center items-center text-center transition-all duration-500">
        
        <div class="animate-slide-up flex flex-col items-center w-full gap-8">
            
            <!-- Icon & Typography -->
            <div class="flex flex-col items-center gap-5">
                <div class="w-14 h-14 bg-white/70 rounded-2xl flex items-center justify-center shadow-sm text-[#d15c8a] ring-1 ring-white/80">
                    <iconify-icon icon="solar:letter-opened-linear" width="28" height="28"></iconify-icon>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-[#d15c8a] leading-snug max-w-[260px]">
                    Hey NAVI! I have something for you...
                </h1>
                <p class="text-sm font-normal text-[#5a4b5e]/80 max-w-[220px]">
                    A special message awaits just a tap away.
                </p>
            </div>

            <!-- Controls -->
            <div class="flex flex-col gap-3 w-full mt-2">
                <button class="group relative w-full bg-white text-[#d15c8a] py-3.5 px-6 text-base font-semibold rounded-full shadow-[0_8px_20px_-6px_rgba(209,92,138,0.3)] hover:shadow-[0_12px_24px_-8px_rgba(209,92,138,0.4)] hover:bg-[#d15c8a] hover:text-white transition-all duration-300 active:scale-[0.97] flex items-center justify-center gap-2 overflow-hidden">
                    <span class="relative z-10 flex items-center gap-2">
                        Open message
                        <iconify-icon icon="solar:arrow-right-linear" width="18" height="18" class="transition-transform duration-300 group-hover:translate-x-1"></iconify-icon>
                    </span>
                </button>
                
                <button class="w-full bg-transparent border-2 border-white/50 text-[#5a4b5e] py-3 px-6 text-sm font-semibold rounded-full hover:bg-white/40 hover:border-white/80 transition-all duration-300 active:scale-[0.97]">
                    Maybe later
                </button>
            </div>

        </div>

        <!-- Decorative subtle inner glow -->
        <div class="absolute inset-0 rounded-[32px] ring-1 ring-inset ring-white/20 pointer-events-none"></div>
    </main>

</body>
</html>
