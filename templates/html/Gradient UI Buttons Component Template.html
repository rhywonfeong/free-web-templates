<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Buttons</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
</style></head>
<body class="bg-[#eff4fa] min-h-screen flex items-center justify-center p-6">

    <div class="flex flex-col gap-8 w-full max-w-xs">
        
        <!-- Button 1: Share Now -->
        <button class="group relative w-full h-[72px] rounded-full bg-gradient-to-r from-[#d62df6] via-[#f75d9e] to-[#ff9838] p-2 pl-8 pr-2 flex items-center justify-between shadow-xl shadow-pink-500/25 transition-transform duration-300 hover:scale-[1.02] hover:shadow-pink-500/35 active:scale-[0.98]">
            <span class="text-white font-medium tracking-widest text-sm uppercase">Share Now</span>
            <div class="h-14 w-[72px] bg-white rounded-full flex items-center justify-center text-[#ff9838]">
                <i data-lucide="square-arrow-out-up-right" class="w-6 h-6 stroke-[2]"></i>
            </div>
        </button>

        <!-- Button 2: Play Now -->
        <button class="group relative w-full h-[72px] rounded-full bg-gradient-to-r from-[#f01e74] to-[#ff7b7b] p-2 pl-8 pr-2 flex items-center justify-between shadow-xl shadow-rose-500/25 transition-transform duration-300 hover:scale-[1.02] hover:shadow-rose-500/35 active:scale-[0.98]">
            <span class="text-white font-medium tracking-widest text-sm uppercase">Play Now</span>
            <div class="h-14 w-[72px] bg-white rounded-full flex items-center justify-center text-[#f01e74]">
                <!-- Using fill to match the solid look of the play button in the reference -->
                <i data-lucide="play" class="w-6 h-6 stroke-[1.5] fill-current ml-1"></i>
            </div>
        </button>

        <!-- Button 3: Rate Now -->
        <button class="group relative w-full h-[72px] rounded-full bg-gradient-to-r from-[#1c77f0] to-[#b640f7] p-2 pl-8 pr-2 flex items-center justify-between shadow-xl shadow-indigo-500/25 transition-transform duration-300 hover:scale-[1.02] hover:shadow-indigo-500/35 active:scale-[0.98]">
            <span class="text-white font-medium tracking-widest text-sm uppercase">Rate Now</span>
            <div class="h-14 w-[72px] bg-white rounded-full flex items-center justify-center text-[#8e52f5]">
                 <i data-lucide="star" class="w-6 h-6 stroke-[1.5] fill-current"></i>
            </div>
        </button>

        <!-- Button 4: Donate -->
        <button class="group relative w-full h-[72px] rounded-full bg-gradient-to-r from-[#007aff] to-[#2acbf7] p-2 pl-8 pr-2 flex items-center justify-between shadow-xl shadow-blue-500/25 transition-transform duration-300 hover:scale-[1.02] hover:shadow-blue-500/35 active:scale-[0.98]">
            <span class="text-white font-medium tracking-widest text-sm uppercase">Donate</span>
            <div class="h-14 w-[72px] bg-white rounded-full flex items-center justify-center text-[#008cff]">
                <i data-lucide="heart-handshake" class="w-7 h-7 stroke-[1.5] fill-current opacity-90"></i>
            </div>
        </button>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
