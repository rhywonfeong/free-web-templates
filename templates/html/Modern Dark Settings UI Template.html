<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preferences</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
}
/* Custom toggle active state simulation for demonstration */
.toggle-active {
background-color: #f4f4f5; /* zinc-100 */
}
.toggle-active span {
transform: translateX(1rem);
background-color: #09090b; /* zinc-950 */
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
  <body class="bg-zinc-950 text-zinc-300 min-h-screen flex items-center justify-center p-4 antialiased selection:bg-zinc-800 selection:text-zinc-100">
    <main class="w-full max-w-md bg-zinc-900/40 border border-zinc-800/80 rounded-2xl p-6 shadow-2xl backdrop-blur-md">
      <!-- Header -->

      <!-- Settings List -->
      <div class="space-y-1">
        <!-- Item 1: Profile -->
        <div class="group flex items-center justify-between p-3 -mx-3 rounded-xl hover:bg-zinc-800/30 transition-all duration-300 ease-out hover:scale-[1.02] active:scale-[0.98] cursor-pointer">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-full bg-zinc-800 border border-zinc-700/50 flex items-center justify-center overflow-hidden shrink-0">
              <iconify-icon icon="solar:user-linear" style="stroke-width: 1.5;" class="text-zinc-400 text-lg"></iconify-icon>
            </div>
            <div>
              <h2 class="text-sm font-medium text-zinc-200">Account Profile</h2>
              <p class="text-xs text-zinc-500 mt-0.5">
                Manage your personal information
              </p>
            </div>
          </div>
          <iconify-icon icon="solar:alt-arrow-right-linear" style="stroke-width: 1.5;" class="text-zinc-600 group-hover:text-zinc-400 transition-colors"></iconify-icon>
        </div>

        <div class="h-px w-full bg-zinc-800/50 my-2"></div>

        <!-- Item 2: Notifications (Toggle) -->
        <div class="flex items-center justify-between p-3 -mx-3 rounded-xl transition-all duration-300 ease-out hover:bg-zinc-800/10 hover:scale-[1.02] active:scale-[0.98] cursor-pointer group">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-xl bg-zinc-800/50 border border-zinc-800 flex items-center justify-center shrink-0">
              <iconify-icon icon="solar:bell-linear" style="stroke-width: 1.5;" class="text-zinc-400 text-lg"></iconify-icon>
            </div>
            <div>
              <h2 class="text-sm font-medium text-zinc-200">
                Push Notifications
              </h2>
              <p class="text-xs text-zinc-500 mt-0.5">
                Receive alerts for activity
              </p>
            </div>
          </div>
          <button class="toggle-active relative inline-flex h-5 w-9 shrink-0 items-center rounded-full transition-all duration-300 ease-out hover:scale-[1.1] active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-zinc-300 focus-visible:ring-offset-2 focus-visible:ring-offset-zinc-950 border border-zinc-800/50" role="switch" aria-checked="true">
            <span class="inline-block h-3.5 w-3.5 transform rounded-full transition duration-200 ease-in-out shadow-sm ml-0.5"></span>
          </button>
        </div>

        <!-- Item 3: Theme (Dropdown) -->
        <div class="flex items-center justify-between p-3 -mx-3 rounded-xl transition-all duration-300 ease-out hover:bg-zinc-800/10 hover:scale-[1.02] active:scale-[0.98] cursor-pointer group">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-xl bg-zinc-800/50 border border-zinc-800 flex items-center justify-center shrink-0">
              <iconify-icon icon="solar:palette-linear" style="stroke-width: 1.5;" class="text-zinc-400 text-lg"></iconify-icon>
            </div>
            <div>
              <h2 class="text-sm font-medium text-zinc-200">Appearance</h2>
              <p class="text-xs text-zinc-500 mt-0.5">Select interface theme</p>
            </div>
          </div>
          <button class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-zinc-700/80 bg-zinc-800/40 text-xs font-medium text-zinc-300 hover:bg-zinc-700/60 hover:text-zinc-100 transition-all duration-300 ease-out hover:scale-[1.05] active:scale-95 shadow-sm hover:shadow-[0_0_15px_rgba(255,255,255,0.05)]">
            Dark
            <iconify-icon icon="solar:alt-arrow-down-linear" style="stroke-width: 1.5;" class="text-zinc-500"></iconify-icon>
          </button>
        </div>
      </div>
    </main>
  
</body></html>
