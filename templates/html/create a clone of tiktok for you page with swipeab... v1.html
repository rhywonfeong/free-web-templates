<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For You | TikTok Clone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- Inter font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Particles.js for background -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <style>
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: radial-gradient(ellipse 80% 60% at 50% 40%, #101010 80%, #171717 100%);
      min-height: 100vh;
      overflow: hidden;
    }
    /* Custom scrollbar for feed */
    ::-webkit-scrollbar {
      width: 8px;
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #232323;
      border-radius: 8px;
    }
    /* Fade in, blur in, slide in animation */
    .animate-fade-in {
      opacity: 0;
      transform: translateY(40px) scale(0.97) blur(12px);
      animation: fade-in 0.9s cubic-bezier(.5,.2,.2,1) forwards;
    }
    @keyframes fade-in {
      to {
        opacity: 1;
        transform: translateY(0) scale(1) blur(0);
      }
    }
    .blur-glass {
      background: rgba(24,24,27, 0.75);
      backdrop-filter: blur(16px) saturate(1.5);
      -webkit-backdrop-filter: blur(16px) saturate(1.5);
      border-radius: 24px;
      border: 1px solid rgba(64,64,73,0.25);
      box-shadow: 0 4px 32px 0 rgba(0,0,0,0.18);
    }
    .gradient-outline {
      border: 2px solid transparent;
      border-radius: 50%;
      background: linear-gradient(#222, #222) padding-box, linear-gradient(135deg,#6EE7B7,#3B82F6,#9333EA) border-box;
    }
    .icon-btn {
      transition: background 0.18s, box-shadow 0.18s;
      cursor: pointer;
      border-radius: 9999px;
      padding: 0.6rem;
      background: rgba(34,34,39,0.7);
      border: 1px solid rgba(80,80,94,0.14);
    }
    .icon-btn:hover {
      background: #171717;
      box-shadow: 0 2px 12px 0 rgba(64,72,255,0.08);
      border-color: #3B82F6;
    }
    .sidebar-nav-btn {
      transition: color 0.15s;
    }
    .sidebar-nav-btn.active, .sidebar-nav-btn:hover {
      color: #fff;
    }
    .sidebar-nav-btn:not(.active) {
      color: #555;
    }
    .video-action {
      transition: color 0.13s, transform 0.13s;
    }
    .video-action:hover {
      color: #3B82F6;
      transform: scale(1.13) translateY(-2px);
    }
    .video-feed {
      touch-action: pan-y;
      user-select: none;
    }
    .video-shadow {
      box-shadow: 0 8px 64px 0 rgba(16,16,24,0.68);
    }
    .video-gradient {
      background: linear-gradient(180deg,rgba(0,0,0,0.02) 40%,rgba(19,19,28,0.69) 90%);
    }
    .avatar-outline {
      border: 2px solid transparent;
      border-radius: 50%;
      background: linear-gradient(#232325, #232325) padding-box, linear-gradient(120deg,#a78bfa,#4f46e5,#06b6d4) border-box;
      box-shadow: 0 2px 8px 0 rgba(73,0,255,0.06);
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
</head>
<body class="flex bg-[#16181a] text-white min-h-screen w-full overflow-hidden antialiased">
  <!-- Particles BG -->
  <div id="particles-js" class="fixed inset-0 z-0 pointer-events-none"></div>

  <!-- Sidebar -->
  <aside class="w-24 py-8 px-2 flex flex-col justify-between items-center blur-glass z-10 fixed left-0 top-0 bottom-0 h-full animate-fade-in" style="animation-delay:.1s">
    <div class="flex flex-col items-center gap-8">
      <a href="#" class="mb-4">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/62/TikTok_Logo.svg" alt="TikTok" class="h-8 w-8 drop-shadow-md" />
      </a>
      <button class="sidebar-nav-btn active" title="For You">
        <svg width="28" height="28" stroke="currentColor" fill="none"><use href="#lucide-home" /></svg>
      </button>
      <button class="sidebar-nav-btn" title="Discover">
        <svg width="26" height="26" stroke="currentColor" fill="none"><use href="#lucide-compass" /></svg>
      </button>
      <button class="sidebar-nav-btn" title="Inbox">
        <svg width="26" height="26" stroke="currentColor" fill="none"><use href="#lucide-message-square" /></svg>
      </button>
      <button class="sidebar-nav-btn" title="Profile">
        <svg width="26" height="26" stroke="currentColor" fill="none"><use href="#lucide-user" /></svg>
      </button>
    </div>
    <div class="mt-8 flex flex-col items-center">
      <button class="icon-btn mb-5" title="Upload">
        <svg width="22" height="22" stroke="currentColor" fill="none"><use href="#lucide-plus" /></svg>
      </button>
      <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Avatar" class="w-10 h-10 avatar-outline" />
    </div>
  </aside>

  <!-- Main Feed -->
  <main class="flex-1 flex flex-col items-center justify-center relative z-10 ml-24">
    <div class="flex flex-col items-center justify-center h-screen w-full relative">
      <h2 class="text-3xl md:text-4xl font-semibold tracking-tight mb-1 animate-fade-in" style="animation-delay:.17s">For You</h2>
      <p class="text-neutral-400 text-md font-normal mb-4 animate-fade-in" style="animation-delay:.23s">Personalized video feed</p>

      <!-- Video Feed (Swipeable) -->
      <div id="videoFeed" class="relative w-full max-w-[420px] h-[72vh] flex flex-col justify-center items-center video-feed select-none">
        <!-- Videos will be injected by JS -->
      </div>
    </div>
  </main>

  <!-- Video Template (hidden) -->
  <template id="video-card-template">
    <div class="absolute inset-0 w-full h-full flex flex-col justify-end items-stretch pointer-events-auto transition-all duration-500">
      <div class="relative w-full h-full rounded-3xl overflow-hidden video-shadow border border-neutral-800 video-gradient">
        <video class="object-cover w-full h-full absolute top-0 left-0" playsinline loop muted preload="auto"></video>
        <!-- Overlay Info -->
        <div class="absolute bottom-0 left-0 right-0 p-5 pb-6 z-10 flex flex-row justify-between items-end gap-5 pointer-events-none">
          <div>
            <div class="flex flex-row gap-3 items-center mb-1">
              <img class="w-9 h-9 rounded-full avatar-outline pointer-events-auto" />
              <span class="font-semibold text-lg tracking-tight">User</span>
              <button class="ml-2 px-3 py-1 rounded-full bg-gradient-to-r from-blue-500 to-cyan-400 text-xs font-medium text-white shadow-md hover:scale-105 transition pointer-events-auto">Follow</button>
            </div>
            <p class="text-md md:text-lg font-normal text-neutral-100 mb-1 max-w-[70vw] md:max-w-[300px] pointer-events-auto"></p>
            <div class="flex gap-2 text-sm text-neutral-400 pointer-events-auto">
              <span class="hashtag"></span>
              <span class="hashtag"></span>
              <span class="hashtag"></span>
            </div>
          </div>
          <div class="flex flex-col gap-4 items-center pointer-events-auto">
            <button class="video-action flex flex-col items-center group" title="Like">
              <svg width="32" height="32" stroke="currentColor" fill="none" class="mb-1 group-hover:stroke-blue-400"><use href="#lucide-heart" /></svg>
              <span class="text-xs">0</span>
            </button>
            <button class="video-action flex flex-col items-center group" title="Comment">
              <svg width="32" height="32" stroke="currentColor" fill="none" class="mb-1 group-hover:stroke-blue-400"><use href="#lucide-message-circle" /></svg>
              <span class="text-xs">0</span>
            </button>
            <button class="video-action flex flex-col items-center group" title="Share">
              <svg width="32" height="32" stroke="currentColor" fill="none" class="mb-1 group-hover:stroke-blue-400"><use href="#lucide-share-2" /></svg>
              <span class="text-xs">Share</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Lucide Icon Sprites -->
  <svg style="display:none;">
    <symbol id="lucide-home" viewBox="0 0 24 24"><path d="M3 9.5 12 4l9 5.5"/><path d="M3 9.5V19a2 2 0 0 0 2 2h3m10-11.5V19a2 2 0 0 1-2 2h-3m-6 0V14a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v7"/></symbol>
    <symbol id="lucide-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 9.76 9.76 7.76 16.24 14.24 14.24 16.24 7.76"/></symbol>
    <symbol id="lucide-message-square" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="lucide-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-3-3.87"/><path d="M4 21v-2a4 4 0 0 1 3-3.87"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="lucide-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="lucide-heart" viewBox="0 0 24 24"><path d="M20.8 4.6c-1.7-1.7-4.5-1.7-6.2 0l-.6.6-.6-.6C11.1 2.9 8.3 2.9 6.6 4.6c-1.7 1.7-1.7 4.5 0 6.2l8.6 8.6 8.6-8.6c1.7-1.7 1.7-4.5 0-6.2z"/></symbol>
    <symbol id="lucide-message-circle" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-1.9 5.4 8.5 8.5 0 0 1-6.6 3.1c-2.3 0-4.4-.9-6-2.6C3.7 15.3 3 13.4 3 11.5a8.5 8.5 0 0 1 8.5-8.5c2.3 0 4.4.9 6 2.6 1.7 1.7 2.6 3.8 2.6 6z"/></symbol>
    <symbol id="lucide-share-2" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></symbol>
  </svg>

  <script>
    // --- Particles.js background
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 46, "density": { "enable": true, "value_area": 750 } },
        "color": { "value": ["#2dd4bf", "#2563eb", "#a78bfa"] },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.17, "random": true },
        "size": { "value": 3, "random": true },
        "move": { "enable": true, "speed": 1.2, "direction": "none", "straight": false, "random": true }
      },
      "interactivity": { "events": { "onhover": { "enable": false } } },
      "retina_detect": true
    });

    // --- Demo Video Data
    const videos = [
      {
        url: "https://www.w3schools.com/html/mov_bbb.mp4",
        cover: "https://images.unsplash.com/photo-1621619856624-42fd193a0661?w=2160&q=80",
        username: "astrodev",
        avatar: "https://randomuser.me/api/portraits/men/42.jpg",
        caption: "Stargazing from a rooftop 🌌",
        hashtags: ["#night", "#stars", "#sky"],
        likes: 1520,
        comments: 220
      },
      {
        url: "https://www.w3schools.com/html/movie.mp4",
        cover: "https://images.unsplash.com/photo-1629946832022-c327f74956e0?w=2160&q=80",
        username: "luna_art",
        avatar: "https://randomuser.me/api/portraits/women/43.jpg",
        caption: "Painting the moon in real time 🌙🎨",
        hashtags: ["#art", "#timelapse", "#moon"],
        likes: 2398,
        comments: 312
      },
      {
        url: "https://www.w3schools.com/html/mov_bbb.mp4",
        cover: "https://images.unsplash.com/photo-1724525647065-f948fc102e68?w=2160&q=80",
        username: "techbyte",
        avatar: "https://randomuser.me/api/portraits/men/45.jpg",
        caption: "Building a robot arm from scratch 🤖",
        hashtags: ["#diy", "#robotics", "#build"],
        likes: 3110,
        comments: 498
      },
      {
        url: "https://www.w3schools.com/html/movie.mp4",
        cover: "https://images.unsplash.com/photo-1642615835477-d303d7dc9ee9?w=2160&q=80",
        username: "oceaneyes",
        avatar: "https://randomuser.me/api/portraits/women/32.jpg",
        caption: "Underwater wonders of the reef 🐠",
        hashtags: ["#ocean", "#nature", "#explore"],
        likes: 1845,
        comments: 211
      }
    ];

    // --- Render Videos, Only 1 on screen, stack above/below for swipe
    const feed = document.getElementById('videoFeed');
    const tpl = document.getElementById('video-card-template');
    let current = 0;

    function createVideoCard(data, index) {
      const node = tpl.content.cloneNode(true).children[0];
      // Video
      const video = node.querySelector('video');
      video.src = data.url;
      video.poster = data.cover;
      if(index === current) video.autoplay = true;
      video.oncanplay = () => {
        if(index === current) video.play();
      };
      // Profile
      node.querySelector('img').src = data.avatar;
      node.querySelector('.font-semibold').textContent = data.username;
      // Caption
      node.querySelector('p').textContent = data.caption;
      // Hashtags
      const hashtags = node.querySelectorAll('.hashtag');
      hashtags.forEach((el,i) => {
        el.textContent = data.hashtags[i] || "";
        if(!data.hashtags[i]) el.style.display = "none";
      });
      // Likes/Comments
      node.querySelectorAll('.video-action span')[0].textContent = data.likes;
      node.querySelectorAll('.video-action span')[1].textContent = data.comments;
      // Animations
      node.style.zIndex = (100 - Math.abs(current-index));
      node.style.opacity = index === current ? 1 : 0.45;
      node.style.pointerEvents = index === current ? "auto" : "none";
      node.style.transition = "opacity .47s cubic-bezier(.4,.2,.2,1), transform .6s cubic-bezier(.4,.2,.2,1)";
      node.style.transform = `translateY(${(index-current)*60}px) scale(${index===current?1:0.93})`;
      node.classList.add('animate-fade-in');
      node.style.animationDelay = `${.27 + Math.abs(index-current)*0.04}s`;
      // Pause video if not current
      video.muted = true;
      video.loop = true;
      if(index !== current) video.pause();

      // Like animation
      node.querySelectorAll('.video-action')[0].onclick = (e) => {
        e.preventDefault(); e.stopPropagation();
        let span = e.currentTarget.querySelector('span');
        span.textContent = parseInt(span.textContent)+1;
        e.currentTarget.querySelector('svg').classList.add('stroke-pink-500');
      };
      // Comment/share
      node.querySelectorAll('.video-action')[1].onclick = (e) => {e.preventDefault();};
      node.querySelectorAll('.video-action')[2].onclick = (e) => {e.preventDefault();};

      // Follow
      node.querySelector('button').onclick = (e) => {
        e.target.textContent = "Following";
        e.target.classList.remove("bg-gradient-to-r","from-blue-500","to-cyan-400");
        e.target.classList.add("bg-neutral-600");
      };

      // Prevent action click propagation
      node.querySelectorAll('.pointer-events-auto').forEach(el=>el.onclick = e=>e.stopPropagation());

      // Play/pause on tap
      node.onclick = () => {
        if(index !== current) return;
        if(video.paused) video.play();
        else video.pause();
      };

      return node;
    }

    function renderFeed() {
      feed.innerHTML = '';
      // Render previous, current, next for smooth swipe
      for(let i = -1; i <= 1; i++) {
        let idx = current+i;
        if(idx >= 0 && idx < videos.length) {
          let el = createVideoCard(videos[idx], idx);
          if(i === 0) el.classList.add('pointer-events-auto');
          feed.appendChild(el);
        }
      }
    }
    renderFeed();

    // --- Swipe Logic
    let startY = null, deltaY = 0, isDragging = false;

    feed.addEventListener('touchstart', (e) => {
      if(e.touches.length !== 1) return;
      startY = e.touches[0].clientY;
      isDragging = true;
    });
    feed.addEventListener('touchmove', (e) => {
      if(!isDragging) return;
      deltaY = e.touches[0].clientY - startY;
    });
    feed.addEventListener('touchend', () => {
      if(!isDragging) return;
      if(Math.abs(deltaY) > 60) {
        if(deltaY > 0 && current > 0) current--;
        else if(deltaY < 0 && current < videos.length-1) current++;
        renderFeed();
      }
      startY = null; deltaY = 0; isDragging = false;
    });

    // Mouse drag for desktop
    feed.addEventListener('mousedown', (e) => {
      startY = e.clientY; isDragging = true;
    });
    feed.addEventListener('mousemove', (e) => {
      if(!isDragging) return;
      deltaY = e.clientY - startY;
    });
    feed.addEventListener('mouseup', () => {
      if(!isDragging) return;
      if(Math.abs(deltaY) > 60) {
        if(deltaY > 0 && current > 0) current--;
        else if(deltaY < 0 && current < videos.length-1) current++;
        renderFeed();
      }
      startY = null; deltaY = 0; isDragging = false;
    });
    feed.addEventListener('mouseleave', () => { isDragging = false; });

    // Keyboard support
    window.addEventListener('keydown', e => {
      if(e.key === 'ArrowDown' && current < videos.length-1) { current++; renderFeed(); }
      if(e.key === 'ArrowUp' && current > 0) { current--; renderFeed(); }
    });

    // Responsive: keep feed centered
    window.addEventListener('resize', () => {
      renderFeed();
    });
  </script>
</body>
</html>
