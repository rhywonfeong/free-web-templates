  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testimonial Split Layout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Roboto', 'sans-serif'],
            serif: ['Lora', 'serif'],
          },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen grid place-items-center p-6">
  <div class="flex flex-col md:flex-row max-w-4xl w-full bg-white rounded-lg shadow-xl border border-gray-200 overflow-hidden transition-shadow duration-300 hover:shadow-2xl">
    <div 
      class="md:w-2/5 min-h-[200px] md:min-h-[300px] bg-blue-500 bg-cover bg-center relative transition-transform duration-500 ease-out group-hover:scale-103"
      style="background-image: url('https://images.unsplash.com/photo-1557804506-669a67965ba0?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=800&q=80');">
    </div>
    <div class="md:w-3/5 p-6 md:p-10 flex flex-col justify-center">
      <div class="text-yellow-500 text-xl mb-5">★★★★★</div>
      <blockquote class="font-serif text-lg leading-relaxed text-gray-800 mb-6">
        Integrating this platform was seamless. We saw a 40% increase in productivity within the first quarter. It's become an indispensable tool for our entire team.
      </blockquote>
      <p class="font-semibold text-lg text-blue-900 mb-1">Samantha Lee</p>
      <span class="text-sm text-gray-600">Operations Manager, Global Solutions Ltd.</span>
    </div>
  </div>
  
  <script>
    // Add hover effect for the image scaling
    document.addEventListener('DOMContentLoaded', function() {
      const container = document.querySelector('.flex');
      const visual = container.querySelector('div:first-child');
      
      container.addEventListener('mouseenter', function() {
        visual.style.transform = 'scale(1.03)';
      });
      
      container.addEventListener('mouseleave', function() {
        visual.style.transform = 'scale(1)';
      });
    });
  </script>
</body>
