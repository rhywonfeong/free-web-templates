<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap"
rel="stylesheet"
/>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body { font-family: 'Inter', sans-serif; }
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
  <body
    class="flex items-center justify-center min-h-screen sm:p-8 antialiased overflow-hidden bg-zinc-950 pt-4 pr-4 pb-4 pl-4"
  >
    <!-- Main Container -->
    <div
      class="relative w-full max-w-7xl h-[calc(100dvh-2rem)] sm:h-auto sm:aspect-video rounded-3xl overflow-hidden group cursor-pointer shadow-[0_0_80px_rgba(0,0,0,0.6)]"
      onclick="this.classList.toggle('is-active')"
    >
      <!-- Day View Office Image (Image 2) -->
      <!-- Replace the src attribute with the path to your day office image -->
      <img
        src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/37df9b9c-6860-40ad-928b-23e85832d1bf_1600w.jpg"
        alt="Day Office"
        class="absolute inset-0 w-full h-full object-cover object-[calc(20%_-_150px)_center] sm:object-center z-10"
      />

      <!-- Night View Party Image (Image 1) -->
      <!-- Replace the src attribute with the path to your night party image -->
      <img
        src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/12832136-803b-424f-9712-cbc9768da354_1600w.jpg"
        alt="Night Party"
        class="object-[calc(20%_-_150px)_center] group-[.is-active]:opacity-100 transition-all duration-1000 ease-out sm:object-center opacity-0 w-full h-full object-cover z-40 absolute top-0 right-0 bottom-0 left-0"
      />

      <!-- Overlay for better text readability -->
      <div
        class="z-30 pointer-events-none absolute top-0 right-0 bottom-0 left-0"
      ></div>

      <!-- Text Container -->
      <div
        class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 sm:p-12 z-40 pointer-events-none"
      >
        <!-- Initial Text (Day) -->
        <div
          class="absolute left-0 top-0 bottom-0 sm:top-auto sm:bottom-12 my-auto sm:my-0 h-fit flex flex-col items-center opacity-100 translate-y-0 scale-100 blur-0 transition-all duration-700 ease-out transform group-[.is-active]:opacity-0 group-[.is-active]:translate-y-8 group-[.is-active]:scale-95 group-[.is-active]:blur-md w-full px-6"
        >
          <div
            class="inline-flex items-center justify-center gap-3 px-6 py-3 sm:px-8 sm:py-4 rounded-full bg-black/40 backdrop-blur-xl border border-white/10 text-white shadow-[0_0_40px_rgba(0,0,0,0.4)]"
          >
            <i
              data-lucide="mouse-pointer-2"
              class="w-5 h-5 sm:w-6 sm:h-6 text-white"
              stroke-width="1.5"
            ></i>
            <p class="text-base sm:text-lg font-medium tracking-tight">
              Click to find out how your night will look like in a few days.
            </p>
          </div>
        </div>

        <!-- Reveal Text (Night) -->
        <div
          class="absolute left-0 top-0 bottom-0 sm:top-auto sm:bottom-12 my-auto sm:my-0 h-fit flex flex-col items-center opacity-0 translate-y-12 scale-90 blur-md transition-all duration-700 delay-100 ease-out transform group-[.is-active]:translate-y-0 group-[.is-active]:opacity-100 group-[.is-active]:scale-100 group-[.is-active]:blur-0 w-full px-6"
        >
          <h1
            class="text-6xl sm:text-7xl md:text-8xl font-medium tracking-tighter mb-6 sm:mb-8 text-center leading-tight drop-shadow-2xl py-4"
          >
            <span
              class="text-white inline-block pb-1 [text-shadow:0_0_15px_#60a5fa,_0_0_30px_#3b82f6,_0_0_45px_#2563eb]"
            >
              Happy
            </span>
            <br />
            <span
              class="italic font-light inline-block mt-2 [text-shadow:0_0_15px_#60a5fa,_0_0_30px_#3b82f6,_0_0_45px_#2563eb]"
            >
              <span class="text-[#2200F6] font-medium">6/</span>
              <span class="text-white">6th</span>
            </span>
          </h1>
          <div
            class="inline-flex items-center justify-center gap-3 px-5 py-3 sm:px-8 sm:py-4 rounded-full bg-black/40 backdrop-blur-xl border border-white/10 text-white shadow-[0_0_40px_rgba(0,0,0,0.4)] transition-colors duration-300"
          >
            <i
              data-lucide="sparkles"
              class="w-5 h-5 sm:w-6 sm:h-6 text-cyan-300"
              stroke-width="1.5"
            ></i>
            <p
              class="text-sm sm:text-base md:text-lg font-medium tracking-tight text-center"
            >
              See you on 10th April at ^ a t o m's office, 06:00PM onwards.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
