<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
font-family: 'Inter', sans-serif;
background-image:
radial-gradient(circle at 50% 0%, rgba(255,255,255,0.03) 0%, transparent 50%),
linear-gradient(to bottom, #09090b, #000000);
}
.animate-fade-in {
animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.animate-fade-out {
animation: fadeOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
@keyframes fadeOut {
from { opacity: 1; transform: translateY(0); filter: blur(0); }
to { opacity: 0; transform: translateY(-10px); filter: blur(4px); }
}
/* Custom scrollbar for aesthetics */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
</style></head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen flex flex-col antialiased selection:bg-indigo-500/30 selection:text-indigo-200">

    <!-- Navigation / Header -->
    <header class="w-full max-w-5xl mx-auto p-6 flex justify-between items-center z-10">
        <div class="flex items-center gap-2 group cursor-pointer">
            <span class="iconify text-zinc-400 group-hover:text-white transition-colors duration-300" data-icon="lucide:quote" data-width="20"></span>
            <h1 class="text-sm font-medium tracking-tighter text-zinc-100 group-hover:text-white transition-colors">QUOTIENT</h1>
        </div>
        <nav class="flex gap-4">
            <a href="#" class="text-xs text-zinc-500 hover:text-zinc-300 transition-colors">Collection</a>
            <a href="#" class="text-xs text-zinc-500 hover:text-zinc-300 transition-colors">About</a>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-6 relative">
        
        <!-- Ambient Glow behind card -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[400px] bg-indigo-500/10 rounded-full blur-[100px] pointer-events-none"></div>

        <!-- Quote Card -->
        <div class="relative w-full max-w-2xl bg-zinc-900/40 backdrop-blur-xl border border-white/5 rounded-2xl p-8 sm:p-12 shadow-2xl shadow-black/50 overflow-hidden group">
            
            <!-- Shine effect on top border -->
            <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
            
            <!-- Content Wrapper -->
            <div class="flex flex-col items-start gap-8">
                
                <!-- Category Tag -->
                <div id="category-pill" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/5 border border-white/5 text-xs font-medium text-zinc-400 tracking-wide uppercase transition-all duration-500">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                    <span id="quote-category">Wisdom</span>
                </div>

                <!-- Quote Text Area -->
                <div class="min-h-[160px] flex items-center">
                    <blockquote id="quote-text" class="text-2xl sm:text-3xl md:text-4xl font-normal leading-tight tracking-tight text-zinc-100 animate-fade-in">
                        "The only way to do great work is to love what you do."
                    </blockquote>
                </div>

                <!-- Footer: Author & Actions -->
                <div class="w-full flex flex-col sm:flex-row sm:items-end justify-between gap-6 pt-6 border-t border-white/5">
                    
                    <!-- Author Info -->
                    <div class="flex flex-col gap-1">
                        <cite id="quote-author" class="not-italic text-base font-medium text-zinc-200">Steve Jobs</cite>
                        <span class="text-xs text-zinc-500">American Business Magnate</span>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center gap-3">
                        
                        <!-- Utility Group -->
                        <div class="flex items-center gap-1 bg-zinc-950/50 rounded-lg p-1 border border-white/5">
                            <button onclick="copyQuote()" class="p-2 text-zinc-400 hover:text-white hover:bg-white/10 rounded-md transition-all duration-200 focus:outline-none focus:ring-1 focus:ring-zinc-700" title="Copy to clipboard">
                                <span class="iconify" data-icon="lucide:copy" data-width="16"></span>
                            </button>
                            <button onclick="tweetQuote()" class="p-2 text-zinc-400 hover:text-white hover:bg-white/10 rounded-md transition-all duration-200 focus:outline-none focus:ring-1 focus:ring-zinc-700" title="Share on X">
                                <span class="iconify" data-icon="lucide:twitter" data-width="16"></span>
                            </button>
                        </div>

                        <!-- Primary Trigger -->
                        <button onclick="generateQuote()" class="group/btn relative flex items-center gap-2 px-4 py-2.5 bg-zinc-100 hover:bg-white text-zinc-950 text-sm font-medium rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:ring-offset-2 focus:ring-offset-zinc-950 shadow-[0_0_15px_rgba(255,255,255,0.1)] hover:shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                            <span>New Quote</span>
                            <span class="iconify transition-transform group-hover/btn:rotate-180 duration-500" data-icon="lucide:refresh-cw" data-width="14"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Instructions / Subtitle -->
        <p class="mt-8 text-xs text-zinc-600 font-medium tracking-wide">
            PRESS <kbd class="bg-zinc-900 border border-zinc-800 rounded px-1.5 py-0.5 text-zinc-400 mx-1 font-sans">SPACE</kbd> TO SHUFFLE
        </p>

    </main>

    <!-- Footer -->
    <footer class="w-full p-6 text-center border-t border-white/5 bg-zinc-950/50 backdrop-blur-sm">
        <p class="text-xs text-zinc-600">
            Designed with precision. &copy; 2023 Quotient Inc.
        </p>
    </footer>

    <!-- Toast Notification (Hidden by default) -->
    <div id="toast" class="fixed bottom-6 right-6 translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 px-4 py-3 bg-zinc-900 border border-zinc-800 rounded-lg shadow-xl z-50">
        <span class="iconify text-emerald-500" data-icon="lucide:check-circle-2" data-width="16"></span>
        <span class="text-xs font-medium text-zinc-300">Copied to clipboard</span>
    </div>

    <script>
        // Data Store
        const quotes = [
            { text: "The only way to do great work is to love what you do.", author: "Steve Jobs", title: "Business Magnate", category: "Work" },
            { text: "Innovation distinguishes between a leader and a follower.", author: "Steve Jobs", title: "Business Magnate", category: "Innovation" },
            { text: "Simplicity is the ultimate sophistication.", author: "Leonardo da Vinci", title: "Polymath", category: "Design" },
            { text: "Every child is an artist. The problem is how to remain an artist once we grow up.", author: "Pablo Picasso", title: "Artist", category: "Creativity" },
            { text: "Code is like humor. When you have to explain it, it’s bad.", author: "Cory House", title: "Software Architect", category: "Engineering" },
            { text: "Good design is as little design as possible.", author: "Dieter Rams", title: "Industrial Designer", category: "Design" },
            { text: "It’s not just what it looks like and feels like. Design is how it works.", author: "Steve Jobs", title: "Business Magnate", category: "Design" },
            { text: "Stay hungry, stay foolish.", author: "Stewart Brand", title: "Writer", category: "Life" },
            { text: "The details are not the details. They make the design.", author: "Charles Eames", title: "Designer", category: "Detail" },
            { text: "Make it simple, but significant.", author: "Don Draper", title: "Fictional Character", category: "Marketing" },
            { text: "Creativity is intelligence having fun.", author: "Albert Einstein", title: "Physicist", category: "Creativity" },
            { text: "Do not go where the path may lead, go instead where there is no path and leave a trail.", author: "Ralph Waldo Emerson", title: "Essayist", category: "Leadership" },
            { text: "Quality is more important than quantity. One home run is much better than two doubles.", author: "Steve Jobs", title: "Business Magnate", category: "Quality" },
            { text: "Optimism is an essential ingredient for innovation.", author: "Bob Iger", title: "Executive", category: "Mindset" },
            { text: "If you think good design is expensive, you should look at the cost of bad design.", author: "Ralf Speth", title: "Executive", category: "Business" },
            { text: "Styles come and go. Good design is a language, not a style.", author: "Massimo Vignelli", title: "Designer", category: "Design" },
            { text: "Move fast and break things.", author: "Mark Zuckerberg", title: "Entrepreneur", category: "Speed" }
        ];

        // Elements
        const elText = document.getElementById('quote-text');
        const elAuthor = document.getElementById('quote-author');
        const elCategory = document.getElementById('quote-category');
        const elTitle = elAuthor.nextElementSibling;
        const toast = document.getElementById('toast');

        let isAnimating = false;

        function generateQuote() {
            if (isAnimating) return;
            isAnimating = true;

            // Trigger fade out
            elText.classList.remove('animate-fade-in');
            elText.classList.add('animate-fade-out');
            
            // Wait for fade out to finish slightly
            setTimeout(() => {
                // Logic to get random quote
                const random = quotes[Math.floor(Math.random() * quotes.length)];
                
                // Update Content
                elText.innerText = `"${random.text}"`;
                elAuthor.innerText = random.author;
                elCategory.innerText = random.category;
                elTitle.innerText = random.title;

                // Trigger fade in
                elText.classList.remove('animate-fade-out');
                void elText.offsetWidth; // Trigger reflow
                elText.classList.add('animate-fade-in');
                
                isAnimating = false;
            }, 300);
        }

        function copyQuote() {
            const textToCopy = `${elText.innerText} — ${elAuthor.innerText}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast();
            });
        }

        function tweetQuote() {
            const text = encodeURIComponent(`${elText.innerText} — ${elAuthor.innerText}`);
            window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
        }

        function showToast() {
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2000);
        }

        // Keyboard Shortcut
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                generateQuote();
            }
        });
        
        // Initial random quote on load
        window.addEventListener('load', generateQuote);

    </script>
</body>
</html>
