  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abstraction Magazine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white rounded-xl shadow-md w-full max-w-sm p-6">
    <!-- Header -->
    <div class="text-center mb-6">
      <div class="w-16 h-16 bg-gradient-to-r from-purple-600 to-pink-500 rounded-full mx-auto mb-3 flex items-center justify-center">
        <span class="text-white text-xl font-bold">A</span>
      </div>
      <h1 class="text-gray-800 font-medium">Abstraction Magazine</h1>
      <p class="text-gray-500 text-sm">$19 per month</p>
    </div>
    
    <!-- Form -->
    <form>
      <div class="space-y-4">
        <!-- Email -->
        <div>
          <label for="email" class="block text-sm text-gray-600 mb-1">Email</label>
          <input type="email" id="email" class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" required>
        </div>
        
        <!-- Card details -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">Card information</label>
          <input type="text" placeholder="Card number" class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none mb-2" required>
          <div class="flex space-x-2">
            <input type="text" placeholder="MM / YY" class="w-1/2 px-3 py-2 border border-gray-200 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" required>
            <input type="text" placeholder="CVC" class="w-1/2 px-3 py-2 border border-gray-200 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" required>
          </div>
        </div>
        
        <!-- Custom dropdown -->
        <div>
          <label class="block text-sm text-gray-600 mb-1">Country</label>
          <div class="relative">
            <select id="country" class="appearance-none w-full px-3 py-2 border border-gray-200 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none bg-white" required>
              <option value="sg">Singapore</option>
              <option value="us">United States</option>
              <option value="ca">Canada</option>
              <option value="au">Australia</option>
              <option value="uk">United Kingdom</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
              <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                <path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/>
              </svg>
            </div>
          </div>
        </div>
        
        <!-- ZIP/Postal code -->
        <div>
          <label for="postal" class="block text-sm text-gray-600 mb-1">ZIP/Postal code</label>
          <input type="text" id="postal" class="w-full px-3 py-2 border border-gray-200 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" required>
        </div>
        
        <!-- Submit button -->
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition duration-200">
          Subscribe now
        </button>
      </div>
    </form>
    
    <!-- Footer -->
    <p class="text-xs text-gray-500 text-center mt-6">
      By subscribing, you agree to our terms and conditions.
    </p>
  </div>
</body>
