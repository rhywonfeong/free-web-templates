        const submitBtn = document.getElementById('submitBtn');
        const titleInput = document.getElementById('title');
        const detailsInput = document.getElementById('details');
        const btnText = document.getElementById('btnText');

        function checkValidity() {
            if (titleInput.value.trim() !== '' && detailsInput.value.trim() !== '') {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        titleInput.addEventListener('input', checkValidity);
        detailsInput.addEventListener('input', checkValidity);

        submitBtn.addEventListener('click', () => {
            if(submitBtn.disabled) return;
            
            const originalText = btnText.innerText;
            btnText.innerText = "Sending...";
            submitBtn.classList.add('opacity-90');
            
            setTimeout(() => {
                btnText.innerText = "Report Sent";
                submitBtn.classList.remove('bg-[#1B5E20]');
                submitBtn.classList.add('bg-stone-800');
                
                setTimeout(() => {
                    btnText.innerText = originalText;
                    submitBtn.classList.add('bg-[#1B5E20]');
                    submitBtn.classList.remove('bg-stone-800');
                    submitBtn.classList.remove('opacity-90');
                    document.getElementById('reportForm').reset();
                    checkValidity();
                }, 2000);
            }, 800);
        });
    </script>

</body></html>
