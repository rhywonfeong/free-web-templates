    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Success Modal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-confetti@2.12.0/tsparticles.confetti.bundle.min.js"></script>
    <style>
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }
        .modal-animation {
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .pulse-animation {
            animation: pulse 2s ease-in-out infinite;
        }
        .ring-glow {
            box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.1);
        }
        body {
            background: linear-gradient(to bottom, #13151A, #090A0D);
        }
        .backdrop {
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <!-- Background overlay -->
    <div class="fixed inset-0 bg-black bg-opacity-60 backdrop z-10"></div>
    
    <!-- Success Modal -->
    <div class="w-full max-w-md bg-[#13151A] border border-[#2D2F36] rounded-lg shadow-xl overflow-hidden relative z-20 modal-animation ring-glow">
        <!-- Modal Content -->
        <div class="relative z-10 flex flex-col p-6">
            <div class="flex justify-between items-start mb-4">
                <div class="flex items-center">
                    <div class="h-8 w-8 rounded-full bg-blue-500/10 flex items-center justify-center mr-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-blue-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <h3 class="text-gray-100 text-lg font-medium tracking-tight">Operation successful</h3>
                </div>
                <button class="text-gray-400 hover:text-gray-200 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
            
            <div class="py-2">
                <p class="text-gray-400 text-sm leading-relaxed">
                    Your changes have been successfully saved. All team members will now see the updated workflow.
                </p>
                
                <div class="mt-6 flex flex-col space-y-2">
                    <button id="confettiButton" class="w-full px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded transition-colors duration-150">
                        Celebrate
                    </button>
                    
                    <button class="w-full px-4 py-2 bg-[#2D2F36] hover:bg-[#3A3D47] text-gray-200 text-sm font-medium rounded transition-colors duration-150">
                        View changes
                    </button>
                </div>
                
                <div class="mt-4 pt-4 border-t border-[#2D2F36]">
                    <div class="flex items-center justify-between">
                        <span class="text-gray-500 text-xs">Created 15s ago</span>
                        <div class="flex items-center text-xs text-gray-500">
                            <span class="w-2 h-2 bg-green-500 rounded-full mr-2 pulse-animation"></span>
                            System message
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Confetti Script -->
    <script>
        document.getElementById('confettiButton').addEventListener('click', () => {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#3B82F6', '#60A5FA', '#93C5FD', '#FFFFFF', '#1E40AF']
            });
        });
        
        // Auto launch confetti on page load
        window.addEventListener('load', () => {
            setTimeout(() => {
                confetti({
                    particleCount: 80,
                    spread: 80,
                    origin: { y: 0.6 },
                    colors: ['#3B82F6', '#60A5FA', '#93C5FD', '#FFFFFF', '#1E40AF']
                });
            }, 600);
        });
    </script>
</body>
</html>
