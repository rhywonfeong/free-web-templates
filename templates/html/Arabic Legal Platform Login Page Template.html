<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full antialiased bg-[#0B1024]">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - الراية</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Cairo', sans-serif; }
/* Custom scrollbar to match the sleek dark theme */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #0B1024; }
::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
</style></head>
<body class="h-full flex flex-col items-center justify-center relative overflow-hidden selection:bg-indigo-500/30 selection:text-indigo-200">

    <!-- Background Decoration (Matching Hero Section) -->
    <div class="absolute inset-0 bg-[#0B1024]">
        <!-- Subtle Grid Pattern -->
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#1f2937_1px,transparent_1px),linear-gradient(to_bottom,#1f2937_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_0%,#000_70%,transparent_100%)] opacity-[0.15]"></div>
        <!-- Gradient Glows -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-[500px] bg-indigo-900/20 blur-[120px] rounded-full pointer-events-none"></div>
        <div class="absolute bottom-0 right-0 w-[500px] h-[500px] bg-blue-900/10 blur-[100px] rounded-full pointer-events-none"></div>
    </div>

    <!-- Main Content Wrapper -->
    <div class="relative w-full max-w-[440px] px-6 py-12 z-10">
        
        <!-- Header / Logo Area -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center p-3 mb-6 bg-white/5 rounded-2xl border border-white/10 backdrop-blur-xl shadow-2xl">
                <!-- Abstract Logo representation -->
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-white">
                    <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h1 class="text-3xl font-semibold tracking-tight text-white">تسجيل الدخول</h1>
            <p class="mt-3 text-lg text-slate-400 font-normal">مرحباً بك في منصة الراية القانونية</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-3xl shadow-[0_20px_50px_-12px_rgba(0,0,0,0.5)] ring-1 ring-white/10 overflow-hidden">
            <div class="p-8 sm:p-10">
                <form action="#" method="POST" class="space-y-6">
                    
                    <!-- Email Field -->
                    <div class="space-y-2">
                        <label for="email" class="block text-base font-normal text-slate-700">
                            البريد الإلكتروني
                        </label>
                        <div class="relative group">
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                autocomplete="email" 
                                required
                                class="block w-full rounded-xl border-0 py-4 pr-11 pl-4 text-slate-900 shadow-[0_0_0_1px_rgba(226,232,240,1)] ring-inset ring-transparent placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 focus:shadow-none sm:text-base sm:leading-6 transition-all duration-200 bg-white"
                                placeholder="name@company.com"
                            >
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4">
                                <i data-lucide="mail" class="h-5 w-5 text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Password Field -->
                    <div class="space-y-2">
                        <label for="password" class="block text-base font-normal text-slate-700">
                            كلمة المرور
                        </label>
                        <div class="relative group">
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                autocomplete="current-password" 
                                required
                                class="block w-full rounded-xl border-0 py-4 pr-11 pl-4 text-slate-900 shadow-[0_0_0_1px_rgba(226,232,240,1)] ring-inset ring-transparent placeholder:text-slate-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 focus:shadow-none sm:text-base sm:leading-6 transition-all duration-200 bg-white"
                                placeholder="••••••••"
                            >
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4">
                                <i data-lucide="lock" class="h-5 w-5 text-slate-400 group-focus-within:text-indigo-600 transition-colors"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Additional Actions -->
                    <div class="flex items-center justify-between pt-1">
                        <div class="flex items-center">
                            <input 
                                id="remember-me" 
                                name="remember-me" 
                                type="checkbox" 
                                class="h-5 w-5 rounded border-slate-300 text-indigo-600 focus:ring-indigo-600 cursor-pointer transition-all"
                            >
                            <label for="remember-me" class="mr-3 block text-base text-slate-600 select-none cursor-pointer">
                                تذكرني
                            </label>
                        </div>
                        <div class="text-base">
                            <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500 transition-colors">
                                نسيت كلمة المرور؟
                            </a>
                        </div>
                    </div>

                    <!-- Primary Button -->
                    <button 
                        type="submit" 
                        class="flex w-full justify-center items-center gap-2 rounded-xl bg-[#0F172A] px-3 py-4 text-base font-medium leading-6 text-white shadow-lg shadow-indigo-500/20 hover:bg-[#1e293b] hover:shadow-xl hover:-translate-y-0.5 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all duration-200"
                    >
                        <span>تسجيل الدخول</span>
                        <i data-lucide="arrow-left" class="h-4 w-4 opacity-70"></i>
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative mt-8">
                    <div class="absolute inset-0 flex items-center" aria-hidden="true">
                        <div class="w-full border-t border-slate-100"></div>
                    </div>
                    <div class="relative flex justify-center">
                        <span class="bg-white px-3 text-base text-slate-500">أو</span>
                    </div>
                </div>

                <!-- Secondary Action -->
                <div class="mt-8">
                    <a href="#" class="flex w-full items-center justify-center gap-3 rounded-xl bg-slate-50 px-3 py-4 text-base font-medium text-slate-700 shadow-sm ring-1 ring-inset ring-slate-200 hover:bg-slate-100 hover:text-slate-900 transition-all duration-200">
                        <i data-lucide="user-plus" class="h-5 w-5 text-slate-500"></i>
                        إنشاء حساب جديد
                    </a>
                </div>
            </div>

            <!-- Trust Indicator / Footer of Card -->
            <div class="bg-slate-50/50 border-t border-slate-100 px-6 py-4 flex items-center justify-center gap-2">
                <i data-lucide="shield-check" class="h-4 w-4 text-emerald-500"></i>
                <span class="text-sm font-medium text-slate-500">بياناتك محمية ومشفرة بالكامل</span>
            </div>
        </div>

        <!-- Page Footer -->
        <div class="mt-10 flex items-center justify-center gap-x-8 text-sm text-slate-400">
            <a href="#" class="hover:text-slate-200 transition-colors">سياسة الخصوصية</a>
            <span class="w-1 h-1 rounded-full bg-slate-700"></span>
            <a href="#" class="hover:text-slate-200 transition-colors">شروط الاستخدام</a>
            <span class="w-1 h-1 rounded-full bg-slate-700"></span>
            <a href="#" class="hover:text-slate-200 transition-colors">المساعدة</a>
        </div>
        
        <p class="mt-6 text-center text-xs text-slate-600">
            &copy; 2024 موسوعة الراية القانونية. جميع الحقوق محفوظة.
        </p>

    </div>

    <script>
        // Initialize Lucide icons with 1.5 stroke width as requested
        lucide.createIcons({
            attrs: {
                'stroke-width': 1.5
            }
        });
    </script>
</body>
</html>
