? window.cancelAnimationFrame.bind(window)
: window.clearTimeout.bind(window);
const nativeSetInterval = window.setInterval.bind(window);

let nextFrameId = 1;

const pausedFrameCallbacks = new Map();

'  transition-duration: 0s !important;',
'  scroll-behavior: auto !important;',
'}'

document.head.appendChild(style);
window.requestAnimationFrame = function(callback) {
const frameId = nextFrameId++;
if (paused) {
pausedFrameCallbacks.set(frameId, callback);
frameRecords.set(frameId, { paused: true });

}
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });

};

const record = frameRecords.get(frameId);
pausedFrameCallbacks.delete(frameId);
if (record && typeof record.nativeFrameId !== 'undefined') {

}
frameRecords.delete(frameId);
};
window.setInterval = function(callback, delay) {
const args = Array.prototype.slice.call(arguments, 2);
return nativeSetInterval(function() {

callback.apply(this, args);
}, delay);
};
const flushPausedFrames = function() {
const callbacks = Array.from(pausedFrameCallbacks.entries());
pausedFrameCallbacks.clear();
callbacks.forEach(function(entry) {
const frameId = entry[0];
const callback = entry[1];
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });

};

const shouldPause = Boolean(nextPaused);
if (paused === shouldPause) return;

  <script>
    const frameworkButton = document.getElementById('framework-button');
    const frameworkMenu = document.getElementById('framework-menu');
    const prompt = document.getElementById('build-prompt');
    const buildButton = document.getElementById('build-button');
    const toast = document.getElementById('status-toast');

    frameworkButton.addEventListener('click', () => {
      const isOpen = !frameworkMenu.classList.contains('hidden');
      frameworkMenu.classList.toggle('hidden');
      frameworkButton.setAttribute('aria-expanded', String(!isOpen));
    });

    document.addEventListener('click', (event) => {
      if (!frameworkButton.contains(event.target) && !frameworkMenu.contains(event.target)) {
        frameworkMenu.classList.add('hidden');
        frameworkButton.setAttribute('aria-expanded', 'false');
      }
    });

    document.querySelectorAll('.prompt-card').forEach((card) => {
      card.addEventListener('click', () => {
        prompt.value = card.dataset.prompt;
        prompt.focus();
      });
    });

    buildButton.addEventListener('click', () => {
      if (!prompt.value.trim()) {
        prompt.focus();
        prompt.parentElement.classList.add('ring-2', 'ring-rose-500/50', 'shadow-[0_0_30px_rgba(244,63,94,0.3)]');
        setTimeout(() => prompt.parentElement.classList.remove('ring-2', 'ring-rose-500/50', 'shadow-[0_0_30px_rgba(244,63,94,0.3)]'), 900);
        return;
      }

      toast.classList.remove('translate-y-8', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.add('translate-y-8', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2600);
    });

    prompt.addEventListener('keydown', (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
        buildButton.click();
      }
    });
  </script>
