<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'IBM Plex Sans Arabic', sans-serif;
background-color: #050505;

.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

background: rgba(255, 255, 255, 0.03);
backdrop-filter: blur(12px);
border: 1px solid rgba(255, 255, 255, 0.06);
box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);

/* Smooth fade in animation */
@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}
.animate-enter {
animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.gold-glow {

<body class="bg-neutral-950 text-slate-50 flex items-center justify-center min-h-screen p-4 sm:p-8 antialiased selection:bg-amber-500/30">

    <!-- Mobile Device Simulator -->
    <div class="relative w-full max-w-sm h-[800px] bg-black rounded-[2.5rem] shadow-2xl border-[6px] border-neutral-900 overflow-hidden ring-1 ring-white/10">
        
        <!-- Status Bar -->
        <div class="absolute top-0 left-0 right-0 h-12 z-30 flex justify-between items-end px-6 pb-2 text-[10px] font-medium tracking-widest text-white/60 pointer-events-none select-none">
            <span dir="ltr">9:41</span>
            <div class="flex gap-1.5 items-center">
                <iconify-icon icon="solar:signal-linear" width="14"></iconify-icon>
                <iconify-icon icon="solar:wi-fi-linear" width="14"></iconify-icon>
                <iconify-icon icon="solar:battery-full-linear" width="14" class="text-white"></iconify-icon>

        </div>

        <!-- Close Button -->
        <button onclick="alert('Close clicked')" class="absolute top-12 right-5 z-30 p-2 bg-white/5 rounded-full hover:bg-white/10 transition-colors active:scale-95 border border-white/5">
            <iconify-icon icon="solar:close-circle-linear" width="20" class="text-neutral-400"></iconify-icon>
        </button>

        <!-- Main Scroll Container -->
        <div id="slider" class="flex overflow-x-hidden snap-x snap-mandatory h-full w-full scroll-smooth">

            <!-- 🟡 SCREEN 1: ARRIVAL -->
            <div class="w-full h-full flex-shrink-0 snap-center flex flex-col items-center justify-between relative p-6 pt-24 pb-8 bg-neutral-950">
                <!-- Background Effects -->
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-amber-900/10 via-neutral-950/50 to-neutral-950 z-0 pointer-events-none"></div>
                
                <div class="relative z-10 w-full flex-1 flex flex-col items-center justify-center text-center space-y-6 animate-enter">
                    <!-- Icon -->
                    <div class="w-20 h-20 rounded-full border border-amber-500/20 flex items-center justify-center bg-gradient-to-b from-amber-500/10 to-transparent gold-glow mb-2">
                        <iconify-icon icon="solar:cup-star-linear" width="36" class="text-amber-400" stroke-width="1.5"></iconify-icon>
                    </div>

                    <div class="space-y-2 max-w-[260px]">
                        <h1 class="text-2xl font-semibold tracking-tight text-white">
                            خلصت التحدي 👏
                        </h1>
                        <p class="text-base text-neutral-400 font-light leading-relaxed">
                            كانت رحلة طويلة، بس إرادتك كانت أقوى من أي عذر.
                        </p>
                    </div>
                </div>

                <!-- Primary Action -->
                <div class="relative z-10 w-full animate-enter" style="animation-delay: 0.1s;">
                    <button onclick="scrollToSlide(1)" class="w-full group bg-white text-black h-14 rounded-xl font-medium text-sm hover:bg-neutral-100 transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                        <span>شوف إنجازك</span>
                        <iconify-icon icon="solar:arrow-left-linear" width="18" class="transition-transform group-hover:-translate-x-1"></iconify-icon>
                    </button>
                </div>
            </div>

            <!-- 🟡 SCREEN 2: STATS -->
            <div class="w-full h-full flex-shrink-0 snap-center flex flex-col items-center justify-between relative bg-black p-6 pt-20 pb-8">
                
                <div class="relative z-10 w-full flex flex-col items-center">
                    <!-- Badge -->
                    <div class="mb-8 flex flex-col items-center animate-enter">
                        <iconify-icon icon="solar:medal-ribbons-star-linear" width="64" class="text-amber-500 mb-4 drop-shadow-[0_0_15px_rgba(245,158,11,0.3)]"></iconify-icon>
                        <span class="px-3 py-1 rounded-full border border-neutral-800 bg-neutral-900/50 text-neutral-400 text-xs font-medium tracking-wide">
                             ملخص الأداء
                        </span>
                    </div>

                    <!-- Stats Grid -->
                    <div class="w-full space-y-3 relative z-10">
                        
                        <!-- Stat 1 -->
                        <div class="glass-panel rounded-xl p-4 flex items-center gap-4 animate-enter" style="animation-delay: 0.1s;">
                            <div class="w-10 h-10 rounded-lg bg-neutral-900/80 flex items-center justify-center text-neutral-400 border border-white/5">
                                <iconify-icon icon="solar:calendar-check-linear" width="20"></iconify-icon>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-xs text-neutral-500">الالتزام</span>
                                <span class="text-base text-slate-100 font-medium dir-ltr text-right">21 Days</span>
                            </div>
                        </div>

                        <!-- Stat 2 -->
                        <div class="glass-panel rounded-xl p-4 flex items-center gap-4 animate-enter" style="animation-delay: 0.2s;">
                            <div class="w-10 h-10 rounded-lg bg-neutral-900/80 flex items-center justify-center text-neutral-400 border border-white/5">
                                <iconify-icon icon="solar:fire-linear" width="20"></iconify-icon>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-xs text-neutral-500">مجموع الخطوات</span>
                                <span class="text-base text-slate-100 font-medium">150,000 خطوة</span>
                            </div>
                        </div>

                        <!-- Stat 3 -->
                        <div class="glass-panel rounded-xl p-4 flex items-center gap-4 animate-enter" style="animation-delay: 0.3s;">
                            <div class="w-10 h-10 rounded-lg bg-neutral-900/80 flex items-center justify-center text-emerald-500/80 border border-white/5">
                                <iconify-icon icon="solar:body-linear" width="20"></iconify-icon>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-xs text-neutral-500">النتيجة</span>
                                <span class="text-base text-emerald-400 font-medium dir-ltr text-right">- 5.0 kg</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Next Button -->
                <div class="w-full relative z-10 animate-enter" style="animation-delay: 0.4s;">
                     <button onclick="scrollToSlide(2)" class="w-full bg-neutral-800 text-white h-14 rounded-xl font-medium text-sm hover:bg-neutral-700 border border-neutral-700 transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                        <span>التالي</span>
                        <iconify-icon icon="solar:arrow-left-linear" width="18"></iconify-icon>
                    </button>
                </div>
            </div>

            <!-- 🟡 SCREEN 3: CONCLUSION -->
            <div class="w-full h-full flex-shrink-0 snap-center flex flex-col relative bg-neutral-950 p-6 pt-20 pb-8">
                <!-- Ambient Top Light -->
                <div class="absolute top-0 left-0 right-0 h-40 bg-gradient-to-b from-neutral-900 to-transparent opacity-60 pointer-events-none"></div>

                <!-- Content -->
                <div class="flex-1 flex flex-col items-center justify-center text-center relative z-10 animate-enter">
                    <div class="mb-6 text-neutral-500">
                         <iconify-icon icon="solar:heart-angle-linear" width="48" stroke-width="1"></iconify-icon>
                    </div>
                    <p class="text-xl text-white font-medium leading-relaxed tracking-tight max-w-[280px]">
                        اللي بنيته هنا… <br>
                        <span class="text-neutral-500">راح يكمل معك في حياتك</span>
                    </p>
                </div>

                <!-- Footer Actions -->
                <div class="w-full space-y-3 relative z-10 animate-enter" style="animation-delay: 0.2s;">
                    <!-- Primary -->
                    <button class="w-full group relative overflow-hidden flex items-center justify-center gap-2 bg-gradient-to-b from-amber-400 to-amber-500 text-black h-14 rounded-xl font-semibold text-sm transition-transform active:scale-[0.98] shadow-lg shadow-amber-900/20">
                        <span class="relative z-10">كمل على نفس الطريق</span>
                        <iconify-icon icon="solar:arrow-left-linear" width="18" class="relative z-10 transition-transform group-hover:-translate-x-1"></iconify-icon>
                    </button>

                    <!-- Secondary -->
                    <button class="w-full h-14 rounded-xl font-medium text-sm text-neutral-400 hover:text-white transition-colors hover:bg-white/5 border border-transparent hover:border-white/5">
                        اشترك بتحدي جديد
                    </button>
                </div>
            </div>

        </div>

        <!-- Dots Indicator -->
        <div class="absolute bottom-3 left-0 right-0 flex justify-center gap-2 z-20 pointer-events-none">
            <div id="dot-0" class="w-1.5 h-1.5 rounded-full bg-white transition-colors duration-300"></div>
            <div id="dot-1" class="w-1.5 h-1.5 rounded-full bg-white/20 transition-colors duration-300"></div>
            <div id="dot-2" class="w-1.5 h-1.5 rounded-full bg-white/20 transition-colors duration-300"></div>
        </div>

    </div>

    <script>
        const slider = document.getElementById('slider');
        const dots = [document.getElementById('dot-0'), document.getElementById('dot-1'), document.getElementById('dot-2')];

        // Programmatic scroll
        function scrollToSlide(index) {
            const width = slider.clientWidth;
            slider.scrollTo({
                left: -1 * index * width, // Negative because RTL direction might affect scrollLeft behavior in some browsers, but usually standard flex-row in RTL still scrolls normally. Let's rely on element width calculation.
                // Actually for RTL flex-row, the first item is on the right. 
                // However, CSS snap logic handles it. Let's try standard calculation.
                // In standard LTR JS logic: left: index * width.
                // Since we used flex-row with dir="rtl" on html, let's verify.
                // To be safe and compatible, we use scrollIntoView on children.
                behavior: 'smooth'
            });
            // Better approach for RTL compatibility:
            slider.children[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
            updateDots(index);
        }

        // Update dots on scroll
        slider.addEventListener('scroll', () => {
            const scrollLeft = Math.abs(slider.scrollLeft);
            const width = slider.clientWidth;
            const index = Math.round(scrollLeft / width);
            
            // RTL correction: if browsers treat scrollLeft as negative or starting from right
            // The safest is calculating based on center point intersection usually, but let's try simple index approximation
            // For this specific view, scrollIntoView is safer, but for dots we need to detect.
            // Let's use IntersectionObserver for perfect dot syncing.
        });

        // Robust Dot Observer
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const index = Array.from(slider.children).indexOf(entry.target);
                    updateDots(index);
                }
            });
        }, { threshold: 0.6, root: slider });

        Array.from(slider.children).forEach(child => observer.observe(child));

        function updateDots(activeIdx) {
            dots.forEach((dot, idx) => {
                if (idx === activeIdx) {
                    dot.classList.remove('bg-white/20');
                    dot.classList.add('bg-white');
                } else {
                    dot.classList.remove('bg-white');
                    dot.classList.add('bg-white/20');
                }
            });
        }
    </script>
