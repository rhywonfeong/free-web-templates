<body class="font-sans bg-gradient-to-br from-white via-purple-50 to-blue-50 min-h-screen flex items-center justify-center p-4">
    <!-- Login Container -->
    <div class="max-w-md w-full">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center">
                <div class="h-12 w-12 rounded-full bg-gradient-to-r from-primary to-secondary flex items-center justify-center">
                    <div class="h-3 w-3 rounded-full bg-white"></div>
                </div>
                <span class="ml-3 text-2xl font-semibold">Serendipity</span>
            </div>
        </div>
        
        <!-- Login Form Card -->
        <div class="bg-white/60 backdrop-blur-sm rounded-2xl overflow-hidden shadow-xl relative">
            <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-primary to-secondary"></div>
            <div class="absolute top-0 right-0 -mt-10 -mr-10 w-40 h-40 bg-gradient-to-bl from-primary/10 to-secondary/10 rounded-full blur-xl"></div>
            <div class="absolute bottom-0 left-0 -mb-10 -ml-10 w-40 h-40 bg-gradient-to-tr from-blue-400/10 to-purple-400/10 rounded-full blur-xl"></div>
            
            <div class="p-8 relative z-10">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Welcome back</h2>
                
                <form>
                    <div class="space-y-5">
                        <!-- Email Field -->
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email address</label>
                            <input type="email" id="email" name="email" autocomplete="email" required 
                                class="w-full px-4 py-2 bg-white/70 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors" 
                                placeholder="Enter your email">
                        </div>
                        
                        <!-- Password Field -->
                        <div>
                            <div class="flex items-center justify-between mb-1">
                                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                                <a href="#" class="text-sm text-primary hover:text-secondary transition-colors">Forgot password?</a>
                            </div>
                            <input type="password" id="password" name="password" autocomplete="current-password" required 
                                class="w-full px-4 py-2 bg-white/70 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors" 
                                placeholder="Enter your password">
                        </div>
                        
                        <!-- Remember Me -->
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" 
                                class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-700">
                                Remember me
                            </label>
                        </div>
                        
                        <!-- Login Button -->
                        <button type="submit" 
                            class="w-full bg-gradient-to-r from-primary to-secondary hover:from-pink-600 hover:to-purple-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-md transition duration-300">
                            Sign in
                        </button>
                    </div>
                </form>
                
                <!-- Divider -->
                <div class="my-6 flex items-center">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="px-4 text-sm text-gray-500">Or continue with</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>
                
                <!-- Social Login Buttons -->
                <div class="grid grid-cols-3 gap-3">
                    <button class="flex justify-center items-center py-2 px-4 border border-gray-300 rounded-lg shadow-sm bg-white hover:bg-gray-50 transition-colors">
