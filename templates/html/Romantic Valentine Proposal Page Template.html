<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love, Kajal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<!-- Importing Romantic Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
body {
font-family: 'Cormorant Garamond', serif;
overflow: hidden;
}
.font-display {
font-family: 'Playfair Display', serif;
}
/* Deep Atmosphere */
.blob {
position: absolute;
filter: blur(80px);
z-index: 0;
opacity: 0.6;
animation: move 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes move {
from { transform: translate(0, 0) scale(1); }
to { transform: translate(20px, -20px) scale(1.1); }
}
/* Floating Hearts Animation */
.floating-heart {
position: absolute;
bottom: -100px;
animation: floatUp linear infinite;
z-index: 1;
opacity: 0;
}
@keyframes floatUp {
0% { transform: translateY(0) scale(0.5); opacity: 0; }
10% { opacity: 0.5; }
100% { transform: translateY(-110vh) scale(1.2) rotate(20deg); opacity: 0; }
}
/* Glassmorphism (Only for Question Card) */
.glass-panel {
background: rgba(255, 255, 255, 0.05);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(255, 255, 255, 0.15);
box-shadow: 0 40px 100px -12px rgba(0, 0, 0, 0.5);
}
/* Text Effects */
.text-glow {
text-shadow: 0 0 40px rgba(255, 200, 210, 0.4);
}
/* Heart Glow Pulse */
.heart-beat {
animation: heartbeat 2.5s infinite ease-in-out;
filter: drop-shadow(0 0 20px rgba(225, 29, 72, 0.5));
}
@keyframes heartbeat {
0%, 100% { transform: scale(1); }
15% { transform: scale(1.15); }
30% { transform: scale(1); }
45% { transform: scale(1.15); filter: drop-shadow(0 0 35px rgba(225, 29, 72, 0.8)); }
60% { transform: scale(1); }
}
/* Button movement */
#noBtn {
transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
/* Fade transitions */
.fade-enter {
opacity: 0;
transform: scale(0.95);
}
.fade-enter-active {
opacity: 1;
transform: scale(1);
transition: opacity 800ms ease-out, transform 800ms cubic-bezier(0.16, 1, 0.3, 1);
}
.fade-exit {
opacity: 1;
transform: scale(1);
}
.fade-exit-active {
opacity: 0;
transform: scale(1.05);
transition: opacity 500ms ease-in, transform 500ms ease-in;
}
</style></head>
<body class="bg-black h-screen w-full flex items-center justify-center relative selection:bg-rose-500/30 selection:text-rose-200">

    <!-- Updated Romantic Background -->
    <!-- Using a deep radial gradient for a spotlight effect -->
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-rose-950 via-slate-950 to-black z-0"></div>
    
    <!-- Animated Blobs for Atmosphere -->
    <div class="blob w-[600px] h-[600px] bg-rose-900/30 rounded-full top-0 left-1/4 -translate-x-1/2 -translate-y-1/2 mix-blend-screen animate-pulse"></div>
    <div class="blob w-[500px] h-[500px] bg-red-900/20 rounded-full bottom-0 right-1/4 translate-x-1/2 translate-y-1/3 mix-blend-screen" style="animation-delay: -5s;"></div>
    
    <!-- Stars/Dust texture overlay -->
    <div class="fixed inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDUiLz4KPC9zdmc+')] opacity-20 z-0 pointer-events-none"></div>

    <!-- Floating Hearts Container -->
    <div id="heartsContainer" class="absolute inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <!-- Main Container -->
    <main class="relative z-10 w-full max-w-lg mx-4 flex flex-col items-center justify-center min-h-[400px]">
        
        <!-- Success State (No Glass Bar, just content) -->
        <div id="successMessage" class="hidden absolute inset-0 z-20 flex flex-col items-center justify-center text-center">
            
            <!-- Intense Pulsing Heart -->
            <div class="relative mb-10">
                <div class="absolute inset-0 bg-rose-600 blur-[60px] opacity-40 animate-pulse"></div>
                <div class="heart-beat">
                    <iconify-icon icon="solar:heart-angle-bold" class="text-rose-500 text-7xl md:text-8xl relative z-10"></iconify-icon>
                </div>
            </div>
            
            <h2 class="font-display italic text-4xl md:text-5xl text-white tracking-tight mb-6 text-glow drop-shadow-2xl">
                My heart is yours forever.
            </h2>
            
            <p class="text-rose-100/80 text-xl font-light leading-relaxed mb-12 drop-shadow-lg max-w-xs mx-auto">
                I love you, Kajal. I can't wait to celebrate with you.
            </p>

            <!-- Replay Button -->
            <button onclick="resetProposal()" class="group flex items-center gap-2 px-6 py-2 rounded-full border border-rose-200/20 text-rose-200/60 hover:text-white hover:border-rose-200/50 hover:bg-white/5 transition-all duration-300 backdrop-blur-sm">
                <iconify-icon icon="solar:restart-linear" class="text-lg group-hover:-rotate-180 transition-transform duration-500"></iconify-icon>
                <span class="font-display italic text-sm tracking-wide">Replay</span>
            </button>
        </div>

        <!-- Question State (Card) -->
        <div id="questionCard" class="w-full glass-panel rounded-[2.5rem] p-8 md:p-14 text-center transform transition-all duration-700">
            
            <!-- Subtle Icon -->
            <div class="flex justify-center mb-8">
                <iconify-icon icon="solar:heart-bold" class="text-rose-500/80 text-5xl animate-bounce" style="animation-duration: 3s;"></iconify-icon>
            </div>

            <!-- Content -->
            <p class="font-display italic text-rose-300/90 text-xl mb-3 tracking-wide">My Dearest Kajal,</p>
            
            <h1 class="font-display italic font-medium text-4xl md:text-5xl text-white mb-6 tracking-tight leading-[1.1] text-glow">
                Will you be my Valentine?
            </h1>
            
            <p class="text-lg text-white/60 font-light leading-relaxed mb-12 mx-auto max-w-sm">
                You are the poetry my heart writes every day.
            </p>

            <!-- Buttons Area -->
            <div id="interactionArea" class="relative h-28 w-full flex items-center justify-center">
                
                <!-- Yes Button -->
                <button id="yesBtn" onclick="acceptProposal()" class="absolute z-20 px-10 py-4 rounded-full bg-rose-600 text-white font-display italic text-xl tracking-wide shadow-[0_0_40px_rgba(225,29,72,0.3)] hover:shadow-[0_0_60px_rgba(225,29,72,0.5)] hover:bg-rose-500 hover:scale-105 transition-all duration-300 overflow-hidden group border border-rose-400/30">
                    <span class="relative z-10 flex items-center gap-2">
                        Yes, Always
                        <iconify-icon icon="solar:heart-linear" class="text-xl group-hover:fill-current transition-colors"></iconify-icon>
                    </span>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
                </button>

                <!-- No Button -->
                <button id="noBtn" onmouseover="moveButton()" class="absolute z-30 px-6 py-2 rounded-full bg-white/5 text-white/40 font-display italic text-base border border-white/5 hover:bg-white/10 hover:text-white transition-colors backdrop-blur-md" style="transform: translateX(140px);">
                    No
                </button>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <div class="fixed bottom-6 w-full text-center z-10 pointer-events-none opacity-30">
        <iconify-icon icon="solar:infinity-linear" class="text-rose-200 text-2xl"></iconify-icon>
    </div>

    <script>
        // --- Romantic Heart Rain ---
        function createHeart() {
            const container = document.getElementById('heartsContainer');
            if(container.children.length > 25) return; 

            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            const icons = ['heart-bold', 'heart-linear', 'heart-angle-bold'];
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];
            
            // Warmer colors for the hearts
            heart.innerHTML = `<iconify-icon icon="solar:${randomIcon}" style="color: rgba(225, 29, 72, ${Math.random() * 0.4 + 0.1}); font-size: ${Math.random() * 24 + 12}px;"></iconify-icon>`;
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 5 + 12 + 's';
            
            container.appendChild(heart);
            setTimeout(() => heart.remove(), 17000);
        }
        setInterval(createHeart, 600);

        // --- No Button Logic ---
        const noBtn = document.getElementById('noBtn');
        
        function moveButton() {
            const radius = 140; 
            const randomAngle = Math.random() * 2 * Math.PI; 
            
            const x = Math.cos(randomAngle) * radius;
            const y = Math.sin(randomAngle) * (radius * 0.8); // Slightly flattened vertically
            
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
            
            const phrases = ["Try Again", "Kajal Please", "Be Mine?", "Click Yes"];
            noBtn.innerText = phrases[Math.floor(Math.random() * phrases.length)];
        }

        // --- Acceptance Logic ---
        function acceptProposal() {
            const duration = 3000;
            const end = Date.now() + duration;
            // Warmer confetti colors
            const colors = ['#e11d48', '#f43f5e', '#ffe4e6', '#ffd700'];

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());

            const card = document.getElementById('questionCard');
            const success = document.getElementById('successMessage');
            
            // Fade out card
            card.classList.add('fade-exit-active');
            
            setTimeout(() => {
                card.classList.add('hidden');
                card.classList.remove('fade-exit-active');
                
                success.classList.remove('hidden');
                success.classList.add('fade-enter');
                
                // Trigger reflow
                void success.offsetWidth;
                
                success.classList.add('fade-enter-active');
                success.classList.remove('fade-enter');
            }, 500);
        }

        // --- Reset Logic ---
        function resetProposal() {
            const card = document.getElementById('questionCard');
            const success = document.getElementById('successMessage');
            
            // Fade out success
            success.style.opacity = '0';
            success.style.transform = 'scale(0.9)';
            success.style.transition = 'all 0.5s ease';

            setTimeout(() => {
                success.classList.add('hidden');
                success.style.opacity = '';
                success.style.transform = '';
                success.style.transition = '';
                success.classList.remove('fade-enter-active');

                card.classList.remove('hidden');
                // Trigger reflow for animation
                void card.offsetWidth;
                card.classList.add('fade-enter');
                requestAnimationFrame(() => {
                    card.classList.add('fade-enter-active');
                    card.classList.remove('fade-enter');
                    setTimeout(() => card.classList.remove('fade-enter-active'), 800);
                });

                // Reset No Button
                noBtn.style.transform = "translateX(140px)";
                noBtn.innerText = "No";
            }, 500);
        }
    </script>
</body>
</html>
