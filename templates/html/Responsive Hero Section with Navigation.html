    <style>
        :root {
            --font-primary: 'Poppins', sans-serif;
            --bg-page: #fef6e4;
            --bg-nav: rgba(255, 250, 240, 0.85);
            --text-primary: #3a3a3a;
            --text-secondary: #5c5c5c;
            --text-headline: #2c2c2c;
            --text-heading-accent: #d9534f;
            --text-cta-accent: #f0ad4e;
            --text-on-cta: #ffffff;
            --radius-pill: 50px;
            --radius-blobby: 40% 60% 70% 30% / 40% 50% 60% 50%;
            --shadow-soft: 0 4px 8px rgba(100, 100, 100, 0.08);
            --shadow-medium: 0 6px 12px rgba(100, 100, 100, 0.12);
            --transition-speed: 0.3s;
            --transition-bounce: cubic-bezier(0.68, -0.55, 0.27, 1.55);
            --color-playful-green: #6FCF97;
            --color-playful-purple: #9B51E0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-primary);
            background-color: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 40px;
            background-color: var(--bg-nav);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--shadow-soft);
        }
        .nav-logo a {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-heading-accent);
            text-decoration: none;
            transition: transform var(--transition-speed) ease;
        }
        .nav-logo a:hover {
            transform: scale(1.05) rotate(-3deg);
        }
        .nav-links ul {
            list-style: none;
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 500;
            position: relative;
            padding-bottom: 5px;
            transition: color var(--transition-speed) ease;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background-color: var(--text-cta-accent);
            transition: width var(--transition-speed) var(--transition-bounce);
        }
        .nav-links a:hover {
            color: var(--text-cta-accent);
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .nav-links .nav-cta-link {
            background-color: var(--text-cta-accent);
            color: var(--text-on-cta);
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-soft);
            transition: none;
        }
        .nav-links .nav-cta-link:hover {
            color: var(--text-on-cta);
        }
        .nav-links .nav-cta-link::after {
            display: none;
        }
        .hero {
            flex-grow: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 30px 60px;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 10% 20%, rgba(240, 173, 78, 0.1), transparent 70%),
                      radial-gradient(circle at 80% 70%, rgba(217, 83, 79, 0.1), transparent 70%),
                      var(--bg-page);
        }
        .hero-content {
            z-index: 2;
            position: relative;
            max-width: 800px;
        }
        .hero-headline {
            font-size: clamp(2.8rem, 7vw, 5rem);
            font-weight: 800;
            color: var(--text-headline);
            line-height: 1.15;
            margin-bottom: 25px;
            letter-spacing: -0.02em;
        }
        .hero-headline .highlight {
            color: var(--text-heading-accent);
            display: inline-block;
            transition: transform var(--transition-speed) var(--transition-bounce);
            cursor: pointer;
        }
        .hero-headline .highlight:hover {
            transform: scale(1.1) rotate(-3deg);
        }
        .hero-headline .char {
            display: inline-block;
            transition: transform 0.2s var(--transition-bounce), color 0.2s ease-out;
            cursor: default;
        }
        .hero-headline .char:hover {
            transform: translateY(-8px) scale(1.15) rotate(5deg);
            color: var(--text-cta-accent);
        }
        .hero-headline .char:hover + .char { transform: translateY(-4px) scale(1.05) rotate(2deg); }
        .hero-headline .char:hover + .char + .char { transform: translateY(-2px) scale(1.02) rotate(1deg); }
        .hero-subheadline {
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            color: var(--text-secondary);
            max-width: 650px;
            margin: 0 auto 40px auto;
            font-weight: 400;
        }
        .hero-cta {
            display: inline-block;
            background-color: var(--text-cta-accent);
            color: var(--text-on-cta);
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: var(--radius-pill);
            box-shadow: 0 4px 10px rgba(240, 173, 78, 0.3);
            transition: transform var(--transition-speed) var(--transition-bounce),
                        box-shadow var(--transition-speed) ease;
            position: relative;
            overflow: hidden;
        }
        .hero-cta .cta-arrow {
            display: inline-block;
            margin-left: 8px;
            transition: transform var(--transition-speed) ease-in-out;
        }
        .hero-cta:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 15px rgba(240, 173, 78, 0.4);
        }
        .hero-cta:hover .cta-arrow {
            transform: translateX(5px);
        }
        .hero-cta::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.6s ease;
        }
        .hero-cta:hover::before {
            left: 150%;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            filter: blur(20px);
            animation: float 20s infinite ease-in-out alternate,
                       pulse 8s infinite ease-in-out alternate;
        }
        .blob-1 { width: 30vw; height: 30vw; background-color: var(--text-cta-accent); top: 5%; left: -5%; animation-duration: 25s, 7s; }
        .blob-2 { width: 25vw; height: 25vw; background-color: var(--text-heading-accent); top: 55%; left: 70%; animation-duration: 30s, 9s; animation-delay: -5s, -2s; }
        .blob-3 { width: 20vw; height: 20vw; background-color: var(--color-playful-green); top: 25%; left: 80%; animation-duration: 20s, 6s; animation-delay: -10s, -4s; }
        .blob-4 { width: 18vw; height: 18vw; background-color: var(--color-playful-purple); top: 70%; left: 5%; animation-duration: 35s, 10s; animation-delay: -15s, -1s; }
        @keyframes float {
            0% { transform: translateY(0) translateX(0) rotate(0); border-radius: var(--radius-blobby); }
            50% { transform: translateY(-40px) translateX(30px) rotate(180deg); border-radius: 60% 40% 30% 70% / 50% 60% 40% 50%;}
            100% { transform: translateY(0) translateX(0) rotate(360deg); border-radius: var(--radius-blobby);}
        }
        @keyframes pulse {
            0% { opacity: 0.1; transform: scale(0.95); }
            50% { opacity: 0.2; transform: scale(1.05); }
            100% { opacity: 0.1; transform: scale(0.95); }

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const headlineElement = document.querySelector('.hero-headline');
            const headlineText = "Wowza! Your Ideas Take Flight.";
            
            function prepareHeadline(text) {
                // Only "Ideas" will be highlighted as a whole word
                const wordToHighlight = "Ideas";
                let parts = text.split(wordToHighlight);
                
                let finalHTML = '';
                
                // Process first part (before "Ideas")
                if (parts[0]) {
                    finalHTML += parts[0].split('').map(char => 
                        char === ' ' ? ' ' : '<span class="char">' + char + '</span>'
                    ).join('');
                }
                
                // Add the highlighted "Ideas"
                finalHTML += '<span class="highlight">' + wordToHighlight + '</span>';
                
                // Process second part (after "Ideas")
                if (parts[1]) {
                    finalHTML += parts[1].split('').map(char => 
                        char === ' ' ? ' ' : '<span class="char">' + char + '</span>'
                    ).join('');
                }
                
                return finalHTML;
            }

            if (headlineElement) {
                headlineElement.innerHTML = prepareHeadline(headlineText);
            }
        });
    </script>
