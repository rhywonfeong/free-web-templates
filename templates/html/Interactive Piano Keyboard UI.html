<html>
<head>

    <title>Advanced Interactive Piano</title>
    <style>
        body {
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        .piano-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 900px;
        }
        
        .control-bar {
            background-color: #333;
            padding: 15px;
            border-radius: 5px 5px 0 0;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            box-sizing: border-box;
        }
        
        .control-row {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .control-row:last-child {
            margin-bottom: 0;
        }
        
        .control-label {
            color: white;
            margin-right: 10px;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            margin-right: 20px;
            margin-bottom: 5px;
        }
        
        .control-selector {
            padding: 8px;
            border-radius: 4px;
            border: none;
            background-color: #555;
            color: white;
            cursor: pointer;
        }
        
        .control-selector:focus {
            outline: none;
            box-shadow: 0 0 0 2px #4a90e2;
        }
        
        .slider-container {
            display: flex;
            align-items: center;
        }
        
        .slider {
            -webkit-appearance: none;
            width: 100px;
            height: 8px;
            border-radius: 4px;
            background: #555;
            outline: none;
            margin: 0 10px;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4a90e2;
            cursor: pointer;
        }
        
        .slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #4a90e2;
            cursor: pointer;
        }
        
        .slider-value {
            color: white;
            width: 30px;
            text-align: center;
        }
        
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
            margin-left: 10px;
        }
        
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: .4s;
            border-radius: 24px;
        }
        
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        
        input:checked + .toggle-slider {
            background-color: #4a90e2;
        }
        
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
        
        .button {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .button:hover {
            background-color: #357abD;
        }
        
        .piano {
            display: flex;
            position: relative;
            background-color: #000;
            padding: 10px;
            border-radius: 0 0 5px 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        
        .white-key {
            width: 60px;
            height: 280px;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 0 0 5px 5px;
            margin: 0 2px;
            cursor: pointer;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-size: 14px;
            color: #888;
        }
        
        .black-key {
            width: 40px;
            height: 160px;
            background-color: black;
            position: absolute;
            z-index: 2;
            border-radius: 0 0 5px 5px;
            cursor: pointer;
            box-shadow: 1px 0 #777, 0 2px 0 #777, 0 3px 0 #666, 0 4px 0 #555, 0 5px 0 #444, 0 6px 1px rgba(0,0,0,0.1), 0 0 5px rgba(0,0,0,0.1), 0 1px 3px rgba(0,0,0,0.3), 0 3px 5px rgba(0,0,0,0.2), 0 5px 10px rgba(0,0,0,0.25);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-size: 12px;
            color: #ccc;
        }
        
        .white-key:active, .white-key.active {
            background-color: #f0f0f0;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.1);
            transform: translateY(2px);
        }
        
        .black-key:active, .black-key.active {
            background-color: #222;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
            transform: translateY(2px);
        }
        
        .instructions {
            margin-top: 20px;
            text-align: center;
            color: #666;
        }
        
        .status-display {
            background-color: #4a90e2;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            margin-left: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .control-row {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .control-group {
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="piano-container">
        <div class="control-bar">
            <div class="control-row">
                <div class="control-group">
                    <span class="control-label">Octave:</span>
                    <select id="octave-selector" class="control-selector">
                        <option value="1">Octave 1</option>
                        <option value="2">Octave 2</option>
                        <option value="3">Octave 3</option>
                        <option value="4" selected>Octave 4</option>
                        <option value="5">Octave 5</option>
                        <option value="6">Octave 6</option>
                        <option value="7">Octave 7</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <span class="control-label">Sound Type:</span>
                    <select id="wave-type-selector" class="control-selector">
                        <option value="sine">Sine</option>
                        <option value="square">Square</option>
                        <option value="sawtooth">Sawtooth</option>
                        <option value="triangle">Triangle</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <span class="control-label">Note Labels:</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="show-labels" checked>
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
            
            <div class="control-row">
                <div class="control-group">
                    <span class="control-label">Volume:</span>
                    <div class="slider-container">
                        <input type="range" min="0" max="100" value="30" class="slider" id="volume-slider">
                        <span class="slider-value" id="volume-value">30%</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <span class="control-label">Sustain:</span>
                    <div class="slider-container">
                        <input type="range" min="10" max="200" value="50" class="slider" id="sustain-slider">
                        <span class="slider-value" id="sustain-value">0.5s</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <button id="record-button" class="button">Record</button>
                    <button id="play-button" class="button" style="margin-left: 10px;" disabled>Play</button>
                </div>
            </div>
            
            <div class="control-row">
                <div class="status-display" id="current-octave-display">Octave 4</div>
                <div class="status-display" id="current-note-display">No Note</div>
            </div>
        </div>
        
        <div class="piano" id="piano">
            <!-- Keys will be generated by JavaScript -->
        </div>
    </div>
    
    <div class="instructions">
        Click on the keys to play notes. Customize your piano experience using the control bar.
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create audio context
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            let currentOctave = 4;
            let waveType = 'sine';
            let volume = 0.3;
            let sustain = 0.5;
            let showLabels = true;
            let isRecording = false;
            let recordedNotes = [];
            let recordStartTime = 0;
            
            // Function to play a note
            function playNote(frequency, duration) {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = waveType;
                oscillator.frequency.value = frequency;
                
                gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + duration);
                
                return { oscillator, gainNode };
            }
            
            // Base note frequencies for octave 4
            const baseNotes = {
                'C': 261.63,
                'C#': 277.18,
                'D': 293.66,
                'D#': 311.13,
                'E': 329.63,
                'F': 349.23,
                'F#': 369.99,
                'G': 392.00,
                'G#': 415.30,
                'A': 440.00,
                'A#': 466.16,
                'B': 493.88
            };
            
            // Calculate frequency for a note in a specific octave
            function getFrequency(note, octave) {
                const baseFreq = baseNotes[note];
                const octaveDiff = octave - 4;
                return baseFreq * Math.pow(2, octaveDiff);
            }
            
            // Generate the piano keys
            function generatePianoKeys() {
                const piano = document.getElementById('piano');
                piano.innerHTML = ''; // Clear existing keys
                
                const whiteNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
                const blackNotes = ['C#', 'D#', 'F#', 'G#', 'A#'];
                const blackKeyPositions = [45, 111, 243, 309, 375];
                
                // Create white keys
                whiteNotes.forEach((note, index) => {
                    const key = document.createElement('div');
                    key.className = 'white-key';
                    key.setAttribute('data-note', note);
                    if (showLabels) {
                        key.textContent = note + currentOctave;
                    }
                    piano.appendChild(key);
                });
                
                // Add C for the next octave
                const lastKey = document.createElement('div');
                lastKey.className = 'white-key';
                lastKey.setAttribute('data-note', 'C');
                lastKey.setAttribute('data-next-octave', 'true');
                if (showLabels) {
                    lastKey.textContent = 'C' + (currentOctave + 1);
                }
                piano.appendChild(lastKey);
                
                // Create black keys
                blackNotes.forEach((note, index) => {
                    const key = document.createElement('div');
                    key.className = 'black-key';
                    key.setAttribute('data-note', note);
                    key.style.left = blackKeyPositions[index] + 'px';
                    if (showLabels) {
                        key.textContent = note + currentOctave;
                    }
                    piano.appendChild(key);
                });
                
                // Add event listeners to piano keys
                const keys = document.querySelectorAll('.white-key, .black-key');
                keys.forEach(key => {
                    key.addEventListener('mousedown', function() {
                        const note = this.getAttribute('data-note');
                        const isNextOctave = this.getAttribute('data-next-octave') === 'true';
                        const octave = isNextOctave ? currentOctave + 1 : currentOctave;
                        const frequency = getFrequency(note, octave);
                        
                        this.classList.add('active');
                        playNote(frequency, sustain);
                        
                        // Update current note display
                        document.getElementById('current-note-display').textContent = note + octave;
                        
                        // Record note if recording
                        if (isRecording) {
                            const time = (Date.now() - recordStartTime) / 1000;
                            recordedNotes.push({
                                note,
                                octave,
                                time,
                                duration: sustain
                            });
                        }
                    });
                    
                    key.addEventListener('mouseup', function() {
                        this.classList.remove('active');
                    });
                    
                    key.addEventListener('mouseleave', function() {
                        this.classList.remove('active');
                    });
                });
            }
            
            // Initialize the piano
            generatePianoKeys();
            
            // Set up octave selector
            const octaveSelector = document.getElementById('octave-selector');
            const currentOctaveDisplay = document.getElementById('current-octave-display');
            
            octaveSelector.addEventListener('change', function() {
                currentOctave = parseInt(this.value);
                currentOctaveDisplay.textContent = 'Octave ' + currentOctave;
                generatePianoKeys();
            });
            
            // Set up wave type selector
            const waveTypeSelector = document.getElementById('wave-type-selector');
            waveTypeSelector.addEventListener('change', function() {
                waveType = this.value;
            });
            
            // Set up volume slider
            const volumeSlider = document.getElementById('volume-slider');
            const volumeValue = document.getElementById('volume-value');
            
            volumeSlider.addEventListener('input', function() {
                volume = this.value / 100;
                volumeValue.textContent = this.value + '%';
            });
            
            // Set up sustain slider
            const sustainSlider = document.getElementById('sustain-slider');
            const sustainValue = document.getElementById('sustain-value');
            
            sustainSlider.addEventListener('input', function() {
                sustain = this.value / 100;
                sustainValue.textContent = sustain.toFixed(1) + 's';
            });
            
            // Set up note labels toggle
            const showLabelsToggle = document.getElementById('show-labels');
            
            showLabelsToggle.addEventListener('change', function() {
                showLabels = this.checked;
                generatePianoKeys();
            });
            
            // Set up recording functionality
            const recordButton = document.getElementById('record-button');
            const playButton = document.getElementById('play-button');
            
            recordButton.addEventListener('click', function() {
                if (!isRecording) {
                    // Start recording
                    isRecording = true;
                    recordedNotes = [];
                    recordStartTime = Date.now();
                    this.textContent = 'Stop';
                    this.style.backgroundColor = '#e74c3c';
                    playButton.disabled = true;
                } else {
                    // Stop recording
                    isRecording = false;
                    this.textContent = 'Record';
                    this.style.backgroundColor = '#4a90e2';
                    playButton.disabled = false;
                }
            });
            
            playButton.addEventListener('click', function() {
                if (recordedNotes.length === 0) return;
                
                // Disable buttons during playback
                this.disabled = true;
                recordButton.disabled = true;
                
                let lastNoteTime = recordedNotes[recordedNotes.length - 1].time + recordedNotes[recordedNotes.length - 1].duration;
                
                // Play each recorded note at the right time
                recordedNotes.forEach(note => {
                    setTimeout(() => {
                        const frequency = getFrequency(note.note, note.octave);
                        playNote(frequency, note.duration);
                        
                        // Highlight the corresponding key
                        const isNextOctave = note.octave > currentOctave;
                        const keySelector = isNextOctave ? 
                            `.white-key[data-note="${note.note}"][data-next-octave="true"]` : 
                            `.${note.note.includes('#') ? 'black' : 'white'}-key[data-note="${note.note}"]`;
                        
                        const key = document.querySelector(keySelector);
                        if (key) {
                            key.classList.add('active');
                            setTimeout(() => {
                                key.classList.remove('active');
                            }, note.duration * 1000);
                        }
                        
                        // Update current note display
                        document.getElementById('current-note-display').textContent = note.note + note.octave;
                    }, note.time * 1000);
                });
                
                // Re-enable buttons after playback
                setTimeout(() => {
                    this.disabled = false;
                    recordButton.disabled = false;
                    document.getElementById('current-note-display').textContent = 'No Note';
                }, lastNoteTime * 1000 + 100);
            });
        });
    </script>
</body>
