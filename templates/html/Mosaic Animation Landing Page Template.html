  <head><script id="aura-preview-performance-controller">
(function() {
if (window.__auraPreviewPerformanceController) return;
const nativeRequestAnimationFrame = window.requestAnimationFrame
? window.requestAnimationFrame.bind(window)
: function(callback) { return window.setTimeout(function() { callback(Date.now()); }, 16); };
const nativeCancelAnimationFrame = window.cancelAnimationFrame
? window.cancelAnimationFrame.bind(window)
: window.clearTimeout.bind(window);
const nativeSetInterval = window.setInterval.bind(window);
let paused = false;
let nextFrameId = 1;
const frameRecords = new Map();
const pausedFrameCallbacks = new Map();
const style = document.createElement('style');
style.id = 'aura-preview-performance-style';
style.textContent = [
'html[data-aura-preview-paused="true"] *,',
'html[data-aura-preview-paused="true"] *::before,',
'html[data-aura-preview-paused="true"] *::after {',
'  animation-play-state: paused !important;',
'  transition-duration: 0s !important;',
'  scroll-behavior: auto !important;',
'}'
].join('\n');
document.head.appendChild(style);
window.requestAnimationFrame = function(callback) {
const frameId = nextFrameId++;
if (paused) {
pausedFrameCallbacks.set(frameId, callback);
frameRecords.set(frameId, { paused: true });
return frameId;
}
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });
return frameId;
};
window.cancelAnimationFrame = function(frameId) {
const record = frameRecords.get(frameId);
pausedFrameCallbacks.delete(frameId);
if (record && typeof record.nativeFrameId !== 'undefined') {
nativeCancelAnimationFrame(record.nativeFrameId);
}
frameRecords.delete(frameId);
};
window.setInterval = function(callback, delay) {
const args = Array.prototype.slice.call(arguments, 2);
return nativeSetInterval(function() {
if (paused) return;
callback.apply(this, args);
}, delay);
};
const flushPausedFrames = function() {
const callbacks = Array.from(pausedFrameCallbacks.entries());
pausedFrameCallbacks.clear();
callbacks.forEach(function(entry) {
const frameId = entry[0];
const callback = entry[1];
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });
});
};
const setPaused = function(nextPaused) {
const shouldPause = Boolean(nextPaused);
if (paused === shouldPause) return;
paused = shouldPause;
document.documentElement.toggleAttribute('data-aura-preview-paused', paused);
if (!paused) {
flushPausedFrames();
}
};
window.__auraPreviewPerformanceController = {
setPaused: setPaused,
get paused() {
return paused;
}
};
window.addEventListener('message', function(event) {
if (event.source !== window.parent) return;
if (!event.data || event.data.type !== 'aura-preview-performance-mode') return;
setPaused(event.data.paused);
});
})();
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mosaic Animation</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap');
body { font-family: 'Inter', sans-serif; }
</style><!-- aura-ga4-start -->

</head>
  <body
    class="bg-[#050505] text-neutral-200 min-h-screen flex flex-col items-center justify-center p-6 overflow-hidden selection:bg-lime-500/30"
  >
    <div class="w-full relative flex flex-col items-center gap-8 max-w-4xl">
      <!-- Canvas Container -->
      <div
        class="w-[120px] h-[30px] relative rounded-sm border border-white/5 bg-[#0a0a0a] shadow-lg shadow-lime-900/10 overflow-hidden group shrink-0"
      >
        <!-- Ambient Glow -->
        <div
          class="absolute inset-0 bg-gradient-to-tr from-lime-900/5 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-1000 pointer-events-none"
        ></div>

        <canvas
          id="matrixCanvas"
          class="w-full h-full object-contain relative z-10"
        ></canvas>
        <div
          class="absolute left-0 top-0 bottom-0 w-[2px] bg-gradient-to-b from-transparent via-[#8DF885]/80 to-transparent shadow-[0_0_15px_#8DF885] z-20 pointer-events-none"
        ></div>
        <div
          class="absolute right-0 top-0 bottom-0 w-[2px] bg-gradient-to-b from-transparent via-[#8DF885]/80 to-transparent shadow-[0_0_15px_#8DF885] z-20 pointer-events-none"
        ></div>
      </div>

      <!-- Controls -->
      <button
        id="replayBtn"
        class="flex items-center gap-1.5 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 hover:border-white/20 transition-all duration-300 font-medium text-neutral-400 hover:text-white backdrop-blur-md active:scale-95 shadow-sm shadow-black/50 px-2.5 py-1 text-[10px]"
      >
        <svg
          class="w-3 h-3 text-lime-400"
          stroke-width="2"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        Replay
      </button>
    </div>

    <script>
      const canvas = document.getElementById('matrixCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      // Logical resolution for crisp pixels
      const cw = 1200;
      const ch = 300;
      canvas.width = cw;
      canvas.height = ch;

      // Grid settings
      const blockSize = 10;
      const gap = 2;
      const step = blockSize + gap;

      // Grid dimensions
      const cols = Math.floor(cw / step);
      const rows = Math.floor(ch / step);

      let particles = [];
      let animationId;

      const texts = ["Trade Royale", "Up to $20,000"];
      let textIndex = 0;
      let state = 'enter'; // 'enter', 'idle', 'exit'
      let idleTimer;

      function extractPixels(text) {
          const off = document.createElement('canvas');
          off.width = cols;
          off.height = rows;
          const octx = off.getContext('2d', { willReadFrequently: true });

          // Dynamically adjust font size to ensure text fits without cropping
          let fontSize = 32;
          octx.font = `800 ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
          while (octx.measureText(text).width > cols - 12 && fontSize > 10) {
              fontSize--;
              octx.font = `800 ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
          }

          octx.fillStyle = 'white';
          octx.textBaseline = 'middle';
          octx.textAlign = 'center';
          octx.fillText(text, cols / 2, rows / 2);

          const imgData = octx.getImageData(0, 0, cols, rows).data;
          const newParticles = [];
          const colors = ['#8DF885'];

          for (let y = 0; y < rows; y++) {
              for (let x = 0; x < cols; x++) {
                  const idx = (y * cols + x) * 4;
                  // High alpha threshold ensures sharp edges, ignoring anti-aliased pixels
                  if (imgData[idx + 3] > 160) {
                      newParticles.push({
                          x: x * step,
                          y: -(Math.random() * ch * 1.5) - 100, // Fall from above
                          tx: x * step,
                          ty: y * step,
                          speed: Math.random() * 24 + 12, // Randomize fall speed
                          delay: Math.random() * 30 + (x / cols) * 15, // Slight wave from left to right
                          settled: false,
                          glowIntensity: 0,
                          exitDelay: Math.random() * 15 + (x / cols) * 15,
                          color: colors[Math.floor(Math.random() * colors.length)]
                      });
                  }
              }
          }
          return newParticles;
      }

      function drawBackground() {
          ctx.fillStyle = '#080808';
          ctx.fillRect(0, 0, cw, ch);

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
          ctx.lineWidth = 1;

          ctx.beginPath();
          for (let i = 0; i <= cw; i += step) {
              ctx.moveTo(i - gap/2, 0);
              ctx.lineTo(i - gap/2, ch);
          }
          for (let i = 0; i <= ch; i += step) {
              ctx.moveTo(0, i - gap/2);
              ctx.lineTo(cw, i - gap/2);
          }
          ctx.stroke();
      }

      function animate() {
          drawBackground();

          let allSettled = true;
          let allExited = true;

          particles.forEach(p => {
              if (state === 'enter') {
                  if (p.delay > 0) {
                      p.delay--;
                      allSettled = false;
                      return;
                  }

                  if (!p.settled) {
                      p.y += p.speed;
                      // Ease out slightly at the end
                      if (p.ty - p.y < 40) {
                          p.speed *= 0.85;
                      }

                      if (p.y >= p.ty) {
                          p.y = p.ty;
                          p.settled = true;
                          p.glowIntensity = 1; // Trigger impact glow
                      } else {
                          allSettled = false;
                      }
                  }

                  // Smoothly fade out the impact glow
                  if (p.settled && p.glowIntensity > 0) {
                      p.glowIntensity -= 0.1;
                      if(p.glowIntensity < 0) p.glowIntensity = 0;
                  }
              } else if (state === 'exit') {
                  if (p.exitDelay > 0) {
                      p.exitDelay--;
                      allExited = false;
                  } else {
                      p.speed += 1.6; // Gravity
                      p.y += p.speed;
                      if (p.y < ch + 50) {
                          allExited = false;
                      }
                  }
              }

              if (p.y > -blockSize && p.y < ch + blockSize) {
                  ctx.fillStyle = p.color;
                  if (state === 'enter' && p.settled) {
                      ctx.shadowBlur = 12 + (p.glowIntensity * 10);
                      ctx.shadowColor = p.color;
                  } else {
                      ctx.shadowBlur = 4;
                      ctx.shadowColor = p.color;
                  }
                  ctx.fillRect(p.x, p.y, blockSize, blockSize);
              }
          });

          ctx.shadowBlur = 0; // Reset for next frame background

          if (state === 'enter') {
              if (!allSettled) {
                  animationId = requestAnimationFrame(animate);
              } else {
                  drawFinalStatic();
                  state = 'idle';
                  idleTimer = setTimeout(() => {
                      state = 'exit';
                      particles.forEach(p => p.speed = 0); // reset speed for exit
                      animate();
                  }, 1500); // Wait 1.5 seconds before exiting
              }
          } else if (state === 'exit') {
              if (!allExited) {
                  animationId = requestAnimationFrame(animate);
              } else {
                  // Switch text and enter again
                  textIndex = (textIndex + 1) % texts.length;
                  particles = extractPixels(texts[textIndex]);
                  state = 'enter';
                  animate();
              }
          }
      }

      function drawFinalStatic() {
          drawBackground();

          particles.forEach(p => {
              ctx.fillStyle = p.color;
              ctx.shadowBlur = 12;
              ctx.shadowColor = p.color;
              ctx.fillRect(p.x, p.y, blockSize, blockSize);
          });
          ctx.shadowBlur = 0;
      }

      function init() {
          if(animationId) cancelAnimationFrame(animationId);
          clearTimeout(idleTimer);
          textIndex = 0;
          state = 'enter';
          particles = extractPixels(texts[textIndex]);
          animate();
      }

      document.getElementById('replayBtn').addEventListener('click', init);

      // Start initial animation
      init();
    </script>
  </body>
</html>
