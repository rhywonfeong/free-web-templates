<meta charset="UTF-8" />
<title>Memory Trainer - Level 1</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-white text-slate-900 antialiased flex flex-col items-stretch justify-between font-sans">
  <div class="w-full max-w-md mx-auto flex flex-col min-h-screen bg-white">
    <!-- HEADER -->
    <header class="w-full bg-white border-b border-slate-200 pt-6 pb-3 px-5">
      <div class="flex items-center justify-center">
        <h1 class="text-2xl font-semibold tracking-tight text-slate-900">
          Level 1
        </h1>
      </div>

      <!-- Progress bar container -->
      <div class="mt-4 w-full h-3 rounded-full bg-slate-200 overflow-hidden">
        <!-- 20% progress -->
        <div class="h-full bg-blue-600 w-1/5"></div>
      </div>
    </header>

    <!-- INSTRUCTION -->
    <section class="w-full px-5 pt-6">
      <p class="text-xl md:text-2xl font-medium tracking-tight text-slate-800 leading-snug">
        Tap the item that matches the body part.
      </p>
    </section>

    <!-- STAGE: BODY PART CARDS -->
    <main class="flex-1 w-full px-5 pt-6 pb-32">
      <div class="flex flex-col gap-4">
        <!-- Card 1: Head (Active) -->
        <button
          type="button"
          class="w-full bg-gray-50 border-2 border-blue-600 rounded-2xl py-4 px-4 flex items-center justify-between focus:outline-none focus:ring-4 focus:ring-blue-300"
          aria-pressed="true"
        >
          <div class="flex items-center gap-4">
            <!-- Head Icon (lucide-user icon style) -->
            <div class="flex items-center justify-center rounded-full bg-blue-50 border border-blue-100 w-16 h-16">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-10 h-10 text-blue-600"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" />
                <path d="M6 20a6 6 0 0 1 12 0" />
              </svg>
            </div>
            <div class="flex flex-col items-start">
              <span class="text-xl md:text-2xl font-semibold tracking-tight text-slate-900">
                Head
              </span>
              <span class="text-lg font-medium text-blue-700">
                Current focus
              </span>
            </div>
          </div>
          <!-- Right arrow cue -->
          <div class="flex items-center justify-center text-blue-600">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-7 h-7"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 18l6-6-6-6" />
            </svg>
          </div>
        </button>

        <!-- Card 2: Ear -->
        <button
          type="button"
          class="w-full bg-gray-50 border-2 border-gray-200 rounded-2xl py-4 px-4 flex items-center justify-between focus:outline-none focus:ring-4 focus:ring-blue-300"
          aria-pressed="false"
        >
          <div class="flex items-center gap-4">
            <!-- Ear Icon (lucide-ear style) -->
            <div class="flex items-center justify-center rounded-full bg-slate-50 border border-slate-200 w-16 h-16">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-10 h-10 text-slate-800"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M6 8a6 6 0 0 1 12 0c0 4-2 5-3 6.5-.8.9-1 1.4-1 2.5a2 2 0 0 1-4 0" />
                <path d="M8 8a2.5 2.5 0 0 1 5 0c0 1.5-.5 2-1 2.5" />
              </svg>
            </div>
            <div class="flex flex-col items-start">
              <span class="text-xl md:text-2xl font-semibold tracking-tight text-slate-900">
                Ear
              </span>
              <span class="text-lg font-medium text-slate-700">
                Hearing
              </span>
            </div>
          </div>
        </button>

        <!-- Card 3: Eye -->
        <button
          type="button"
          class="w-full bg-gray-50 border-2 border-gray-200 rounded-2xl py-4 px-4 flex items-center justify-between focus:outline-none focus:ring-4 focus:ring-blue-300"
          aria-pressed="false"
        >
          <div class="flex items-center gap-4">
            <!-- Eye Icon (lucide-eye style) -->
            <div class="flex items-center justify-center rounded-full bg-slate-50 border border-slate-200 w-16 h-16">
              <svg
                xmlns="http://www.w3.org/2000/svg"

                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </div>
            <div class="flex flex-col items-start">
              <span class="text-xl md:text-2xl font-semibold tracking-tight text-slate-900">
                Eye
              </span>
              <span class="text-lg font-medium text-slate-700">
                Seeing
              </span>
            </div>
          </div>
        </button>
      </div>
    </main>

    <!-- DOCK: FIXED BOTTOM SECTION -->
    <footer class="fixed inset-x-0 bottom-0">
      <div class="w-full max-w-md mx-auto bg-white shadow-[0_-8_24_0_rgba(15,23,42,0.18)] border-t border-slate-200">
        <div class="px-5 pt-3 pb-5 flex flex-col gap-3">
          <p class="text-lg md:text-xl font-semibold tracking-tight text-slate-900">
            Choose one item:
          </p>
          <div class="flex items-stretch justify-between gap-3">
            <!-- Russian Doll -->
            <button
              type="button"
              class="flex-1 bg-gradient-to-b from-red-500 to-red-700 rounded-2xl shadow-2xl shadow-red-700/40 py-4 px-2 flex flex-col items-center justify-center gap-2 focus:outline-none focus:ring-4 focus:ring-blue-300"
            >
              <span class="text-4xl" aria-hidden="true">🎎</span>
              <span class="text-lg md:text-xl font-semibold tracking-tight text-white leading-snug">
                Russian Doll
              </span>
            </button>

            <!-- Maple Leaves -->
            <button
              type="button"
              class="flex-1 bg-gradient-to-b from-amber-400 to-orange-600 rounded-2xl shadow-2xl shadow-orange-700/40 py-4 px-2 flex flex-col items-center justify-center gap-2 focus:outline-none focus:ring-4 focus:ring-blue-300"

              type="button"

              <span class="text-4xl" aria-hidden="true">🍔</span>
              <span class="text-lg md:text-xl font-semibold tracking-tight text-white leading-snug">
                Hamburger
