  <meta charset="UTF-8">

  <style>
    body { background: #0f172a; font-family: 'Space Grotesk', sans-serif;}
    .particle {
      position: absolute;
      background-color: rgba(255,255,255,0.65);
      border-radius: 9999px;

<body class="relative overflow-x-hidden min-h-screen text-gray-300">
  <div id="particles-container" class="fixed inset-0 z-0 pointer-events-none"></div>
  <section class="relative z-10 min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-2xl bg-indigo-900/30 border border-indigo-800/60 rounded-2xl shadow-2xl p-10 backdrop-blur-xl flex flex-col items-center">
      <div class="flex items-center mb-7">
        <div class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 flex items-center justify-center">
          <span class="text-white font-bold text-xl">N</span>
        </div>
        <span class="ml-3 text-white text-2xl font-bold">Nebula</span>
      </div>
      <h2 class="text-3xl font-bold text-white mb-2 text-center">Contact Us</h2>
      <p class="text-gray-400 mb-8 text-center">Have a question or need help? Send us a message and our team will get back to you as soon as possible.</p>
      <form class="w-full flex flex-col space-y-5">
        <div class="flex flex-col md:flex-row gap-5">
          <input type="text" required placeholder="Your Name" class="glow-input flex-1 px-4 py-3 rounded-lg border border-gray-700 bg-indigo-950/40 text-gray-100 focus:outline-none focus:border-purple-500 transition" />
          <input type="email" required placeholder="Email" class="glow-input flex-1 px-4 py-3 rounded-lg border border-gray-700 bg-indigo-950/40 text-gray-100 focus:outline-none focus:border-purple-500 transition" />
        </div>
        <input type="text" required placeholder="Subject" class="glow-input px-4 py-3 rounded-lg border border-gray-700 bg-indigo-950/40 text-gray-100 focus:outline-none focus:border-purple-500 transition" />
        <textarea required placeholder="Your Message" rows="4" class="glow-input px-4 py-3 rounded-lg border border-gray-700 bg-indigo-950/40 text-gray-100 focus:outline-none focus:border-purple-500 transition"></textarea>
        <button type="submit" class="glow-btn mt-2 py-3 w-full rounded-lg bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold text-lg tracking-wide hover:from-purple-700 hover:to-indigo-700 transition">
          Send Message
        </button>
      </form>
      <div class="mt-7 text-gray-400 text-sm text-center">Or email us at <a class="text-purple-400 hover:underline" href="mailto:support@nebulabank.com">support@nebulabank.com</a></div>
    </div>
  </section>
  <script>
    // Particle animation for cosmic effect
    const container = document.getElementById('particles-container');
    let particles = [];
    function createParticles() {
      particles.forEach(p=>p.el?.remove());
      particles = [];
      for(let i=0;i<35;i++){
        const el=document.createElement('div');
        el.className='particle';
        const sz=Math.random()*2+1.2;
        el.style.width=sz+'px';el.style.height=sz+'px';
        const x=Math.random()*window.innerWidth;
        const y=Math.random()*window.innerHeight;
        el.style.left=x+'px';el.style.top=y+'px';
        const o=Math.random()*0.4+0.15;
        const h=Math.random()*60+220;
        el.style.backgroundColor=`hsla(${h},80%,70%,${o})`;
        container.appendChild(el);
        particles.push({el,x,y,ox:x,oy:y,vx:0,vy:0,speed:Math.random()*0.25+0.14});
      }
    }
    let mx=window.innerWidth/2,my=window.innerHeight/2;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
    function animate(){
      particles.forEach(p=>{
        const dx=mx-p.x,dy=my-p.y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<75){const f=(75-d)/75;
          p.vx-=(dx/d)*f*0.11;
          p.vy-=(dy/d)*f*0.11;
        }
        p.vx+=(p.ox-p.x)*0.011;p.vy+=(p.oy-p.y)*0.011;
        p.vx*=0.94;p.vy*=0.94;
        p.x+=p.vx*p.speed;p.y+=p.vy*p.speed;
        p.el.style.transform=`translate(${p.x-p.ox}px,${p.y-p.oy}px)`;
      });
      requestAnimationFrame(animate);
    }
    createParticles(); animate();
    window.addEventListener('resize',createParticles);
  </script>
</body>
