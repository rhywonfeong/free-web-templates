<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Outfit', sans-serif;
background-color: #202020;
}
/* Custom Checkbox/Radio Logic for Profile Types */
.profile-type-card.selected {
border-color: #FF8D00;
background-color: rgba(255, 141, 0, 0.05);
}
.profile-type-card.selected iconify-icon {
color: #FF8D00;
}
.btn-gradient {
background: linear-gradient(90deg, #FF5700 0%, #FFC400 100%);
}
/* Remove default select arrow */
select {
-webkit-appearance: none;
-moz-appearance: none;
appearance: none;
}
.animate-enter {
animation: enter 0.4s ease-out forwards;
}
@keyframes enter {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}
</style></head>
<body class="text-white min-h-screen flex flex-col items-center relative overflow-x-hidden selection:bg-[#FF8D00]/30">

    <!-- Header -->
    <header class="w-full p-6 flex justify-between items-center z-10 max-w-lg mx-auto">
        <button class="text-white/70 hover:text-white transition-colors p-2 -ml-2 rounded-full hover:bg-white/5 active:scale-95 duration-200">
            <iconify-icon icon="solar:arrow-left-linear" width="24" height="24" stroke-width="1.5"></iconify-icon>
        </button>
        <h1 class="text-xl font-medium tracking-tight text-white">Create Profile</h1>
        <div class="w-10"></div> <!-- Spacer for visual balance -->
    </header>

    <!-- Main Form -->
    <main class="w-full max-w-md mx-auto px-6 flex flex-col items-center flex-grow pb-10 animate-enter">
        
        <!-- 1. Avatar Selection -->
        <div class="relative group mt-4 mb-8">
            <div class="w-32 h-32 rounded-full bg-[#121212] border border-white/5 flex items-center justify-center overflow-hidden shadow-2xl shadow-black/20 group-hover:border-white/20 transition-all cursor-pointer">
                <iconify-icon icon="solar:user-circle-linear" width="64" height="64" class="text-white/20"></iconify-icon>
            </div>
            
            <button class="absolute bottom-0 right-0 w-10 h-10 bg-[#2A2A2A] hover:bg-[#333] border border-[#121212] text-white rounded-full flex items-center justify-center shadow-lg transition-transform active:scale-90 group-hover:scale-110">
                <iconify-icon icon="solar:camera-linear" width="20" height="20" stroke-width="1.5"></iconify-icon>
            </button>
        </div>

        <form class="w-full space-y-6" onsubmit="event.preventDefault();">
            
            <!-- 2. Name Input -->
            <div class="space-y-2">
                <label class="text-xs font-medium text-white/50 ml-1">Profile Name</label>
                <div class="relative group">
                    <input type="text" placeholder="e.g. John Doe" class="w-full bg-[#121212] border border-white/5 text-white text-base rounded-2xl px-5 py-4 focus:outline-none focus:border-white/20 focus:ring-1 focus:ring-white/10 transition-all placeholder:text-white/20 font-light">
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 text-white/20 group-focus-within:text-white/50 transition-colors">
                        <iconify-icon icon="solar:pen-new-linear" width="20" height="20" stroke-width="1.5"></iconify-icon>
                    </div>
                </div>
            </div>

            <!-- 3. Profile Type -->
            <div class="space-y-2">
                <label class="text-xs font-medium text-white/50 ml-1">Profile Type</label>
                <div class="grid grid-cols-2 gap-4">
                    <!-- Standard Option -->
                    <div onclick="selectProfileType('standard')" id="type-standard" class="profile-type-card selected cursor-pointer bg-[#121212] border border-white/5 rounded-2xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-[#181818] transition-all duration-300">
                        <iconify-icon icon="solar:user-linear" width="28" height="28" class="text-white/60 transition-colors" stroke-width="1.5"></iconify-icon>
                        <span class="text-sm font-medium text-white/90">Standard</span>
                    </div>

                    <!-- Kids Option -->
                    <div onclick="selectProfileType('kids')" id="type-kids" class="profile-type-card cursor-pointer bg-[#121212] border border-white/5 rounded-2xl p-4 flex flex-col items-center justify-center gap-3 hover:bg-[#181818] transition-all duration-300">
                        <iconify-icon icon="solar:smile-circle-linear" width="28" height="28" class="text-white/60 transition-colors" stroke-width="1.5"></iconify-icon>
                        <span class="text-sm font-medium text-white/90">Kids</span>
                    </div>
                </div>
            </div>

            <!-- 4. Language Preference -->
            <div class="space-y-2">
                <label class="text-xs font-medium text-white/50 ml-1">Language</label>
                <div class="relative">
                    <select class="w-full bg-[#121212] border border-white/5 text-white text-base rounded-2xl px-5 py-4 focus:outline-none focus:border-white/20 transition-all cursor-pointer font-light appearance-none">
                        <option value="en">English (EN)</option>
                        <option value="de">Deutsch (DE)</option>
                        <option value="fr">Français (FR)</option>
                        <option value="it">Italiano (IT)</option>
                        <option value="es">Español (ES)</option>
                    </select>
                    <div class="absolute right-5 top-1/2 -translate-y-1/2 text-white/30 pointer-events-none flex items-center">
                        <iconify-icon icon="solar:alt-arrow-down-linear" width="20" height="20" stroke-width="1.5"></iconify-icon>
                    </div>
                </div>
            </div>

            <!-- Spacer -->
            <div class="h-4"></div>

            <!-- 5. Bottom Action -->
            <button class="w-full btn-gradient text-black font-semibold text-lg tracking-wide py-4 rounded-full shadow-lg shadow-orange-500/20 hover:shadow-orange-500/40 active:scale-[0.98] transition-all duration-300 flex items-center justify-center gap-2">
                <span>Save & Continue</span>
                <iconify-icon icon="solar:arrow-right-linear" width="20" height="20" stroke-width="1.5"></iconify-icon>
            </button>

        </form>
    </main>

    <script>
        function selectProfileType(type) {
            const standardCard = document.getElementById('type-standard');
            const kidsCard = document.getElementById('type-kids');

            if (type === 'kids') {
                standardCard.classList.remove('selected');
                kidsCard.classList.add('selected');
            } else {
                kidsCard.classList.remove('selected');
                standardCard.classList.add('selected');
            }
        }
    </script>
</body>
</html>
