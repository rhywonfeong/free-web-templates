  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Converging Sinusoidal Wave</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes drawWaveRight {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 500; }
    }
    @keyframes drawWaveLeft {
      0% { stroke-dashoffset: -1000; }
      100% { stroke-dashoffset: -500; }
    }
    .wave-right {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawWaveRight 3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    .wave-left {
      stroke-dasharray: 1000;
      stroke-dashoffset: -1000;
      animation: drawWaveLeft 3s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    .pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="relative w-full max-w-4xl mx-auto">
    <svg class="w-full h-64 md:h-80" viewBox="0 0 1000 200" preserveAspectRatio="none">
      <line x1="0" y1="100" x2="1000" y2="100" stroke="#374151" stroke-width="1" stroke-dasharray="4" />
      <line x1="500" y1="0" x2="500" y2="200" stroke="#374151" stroke-width="1" stroke-dasharray="4" />
      
      <path 
        id="wave-right"
        class="wave-right"
        d="M 500,100 
           Q 550,100 575,50 
           Q 600,0 625,50 
           Q 650,100 675,150 
           Q 700,200 725,150 
           Q 750,100 775,50 
           Q 800,0 825,50 
           Q 850,100 875,150 
           Q 900,200 925,150 
           Q 950,100 975,100 
           Q 1000,100 1000,100" 
        fill="none" 
        stroke="#3B82F6" 
        stroke-width="3" 
        stroke-linecap="round"
      />
      
      <path 
        id="wave-left"
        class="wave-left"
        d="M 500,100 
           Q 450,100 425,150 
           Q 400,200 375,150 
           Q 350,100 325,50 
           Q 300,0 275,50 
           Q 250,100 225,150 
           Q 200,200 175,150 
           Q 150,100 125,50 
           Q 100,0 75,50 
           Q 50,100 25,100 
           Q 0,100 0,100" 
        fill="none" 
        stroke="#8B5CF6" 
        stroke-width="3" 
        stroke-linecap="round"
      />
      
      <circle cx="500" cy="100" r="6" fill="#EC4899" class="pulse" />
    </svg>
    
    <div class="absolute inset-0 pointer-events-none bg-gradient-to-r from-gray-900 via-transparent to-gray-900 opacity-60"></div>
  </div>
  
  <div class="text-center mt-10">
    <h1 class="text-3xl md:text-4xl font-bold text-white mb-4">Converging Sinusoidal Wave</h1>
    <p class="text-lg text-blue-200 max-w-xl mx-auto">
      A precisely timed vector animation depicting a sinusoidal waveform drawn from both endpoints toward the center.
    </p>
    <button id="replay" class="mt-6 px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-lg font-medium hover:from-blue-700 hover:to-purple-700 transition-all duration-300 shadow-lg shadow-blue-500/20">
      Replay Animation
    </button>
  </div>
  
  <script>
    document.getElementById('replay').addEventListener('click', function() {
      // Get the wave elements
      const rightWave = document.getElementById('wave-right');
      const leftWave = document.getElementById('wave-left');
      
      // Clone and replace the elements to restart animation
      const rightWaveClone = rightWave.cloneNode(true);
      const leftWaveClone = leftWave.cloneNode(true);
      
      rightWave.parentNode.replaceChild(rightWaveClone, rightWave);
      leftWave.parentNode.replaceChild(leftWaveClone, leftWave);
      
      // Add a small visual feedback for the button
      const replayBtn = document.getElementById('replay');
      replayBtn.classList.add('scale-95', 'opacity-90');
      setTimeout(() => {
        replayBtn.classList.remove('scale-95', 'opacity-90');
      }, 150);
    });
  </script>
</body>
</html>
