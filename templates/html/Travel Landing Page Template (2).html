<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" />
<title>Globe Express — Immersive Destinations</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet" /><!-- aura-ga4-start -->

</head>
  <body class="bg-neutral-950 text-white/90 antialiased selection:bg-amber-400/20 selection:text-white" style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;">
    <!-- Top progress indicator -->
    <div id="indicator" class="fixed top-0 left-0 right-0 h-1 bg-amber-400 z-50" style="transform-origin: left; transform: scaleX(0); transition: transform 15s linear;"></div>

    <!-- Navigation -->
    <nav class="fixed inset-x-0 top-0 z-40">
      <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="flex h-16 items-center justify-between border-b border-white/10 backdrop-blur supports-[backdrop-filter]:bg-white/5">
          <div class="flex items-center gap-3">
            <div class="h-8 w-8 rounded-md grid place-items-center bg-white/5 ring-1 ring-white/10 text-white tracking-tight font-semibold">
              GE
            </div>
            <div class="flex items-center gap-2 text-white/90">
              <span class="inline-flex items-center justify-center">
                <!-- lucide: globe -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white/70" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M2 12h20"></path>
                  <path d="M12 2a15.3 15.3 0 0 1 0 20 15.3 15.3 0 0 1 0-20z"></path>
                </svg>
              </span>
              <span class="text-sm sm:text-base font-medium tracking-tight">Globe Express</span>
            </div>
          </div>

          <div class="hidden md:flex items-center gap-8 text-xs uppercase">
            <a href="#" class="relative font-medium text-white hover:text-white/90 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/50">
              Home
              <span class="absolute -bottom-2 left-0 right-0 mx-auto h-0.5 bg-amber-400 rounded-full"></span>
            </a>
            <a href="#" class="text-white/70 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/50 font-medium">Holidays</a>
            <a href="#" class="text-white/70 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/50 font-medium">Destinations</a>
            <a href="#" class="text-white/70 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/50 font-medium">Flights</a>
            <a href="#" class="text-white/70 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/50 font-medium">Offers</a>
            <a href="#" class="text-white/70 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/50 font-medium">Contact</a>

            <button class="h-9 w-9 grid place-items-center rounded-full hover:bg-white/10 ring-1 ring-white/10 text-white/80 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/50" aria-label="Search">
              <!-- lucide: search -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </svg>
            </button>

            <button class="h-9 w-9 grid place-items-center rounded-full hover:bg-white/10 ring-1 ring-white/10 text-white/80 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/50" aria-label="Account">
              <!-- lucide: user -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path d="M20 21a8 8 0 1 0-16 0"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </button>
          </div>

          <div class="md:hidden">
            <button class="h-9 w-9 grid place-items-center rounded-md hover:bg-white/10 ring-1 ring-white/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/50" aria-label="Menu">
              <!-- lucide: menu -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white/80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main -->
    <main class="relative h-[100dvh] overflow-hidden">
      <!-- Slides -->
      <div id="slides" class="absolute inset-0 -z-10">
        <!-- Slides injected by JS -->
      </div>

      <!-- Gradient edge for readability -->
      <div class="pointer-events-none absolute inset-0 bg-[radial-gradient(1200px_600px_at_10%_40%,rgba(0,0,0,0.6),transparent_60%)]"></div>
      <div class="pointer-events-none absolute inset-0 bg-gradient-to-tr from-neutral-950/70 via-neutral-950/20 to-transparent"></div>

      <!-- Details A -->
      <section id="detailsA" class="absolute left-0 right-0 top-24 sm:top-28 md:top-32 px-6 sm:px-8 lg:px-16 max-w-7xl mx-auto">
        <div class="max-w-xl">
          <div class="relative overflow-hidden h-[44px]">
            <div class="pt-3 text-base sm:text-lg font-medium text-white/90"> </div>
            <span class="absolute top-0 left-0 h-1.5 w-8 rounded-full bg-white/90"></span>
          </div>

          <div class="mt-1 overflow-hidden h-[92px]">
            <h1 class="font-[Oswald] font-semibold text-5xl sm:text-6xl leading-[0.95] tracking-tight uppercase text-white"> </h1>
          </div>

          <div class="mt-1 overflow-hidden h-[92px]">
            <h2 class="font-[Oswald] font-semibold text-5xl sm:text-6xl leading-[0.95] tracking-tight uppercase text-white/90"> </h2>
          </div>

          <p class="mt-4 text-sm sm:text-base text-white/80 leading-relaxed"> </p>

          <div class="mt-6 flex items-center gap-3">
            <button class="h-9 w-9 rounded-full grid place-items-center bg-amber-400 text-neutral-950 ring-1 ring-amber-300/70 hover:ring-amber-200 hover:bg-amber-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/60" aria-label="Bookmark destination">
              <!-- lucide: bookmark -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
              </svg>
            </button>
            <button class="h-9 px-5 rounded-full uppercase text-[11px] tracking-wider font-medium border border-white/40 text-white hover:text-neutral-950 hover:bg-white transition-colors focus:outline-none focus-visible-2 focus-visible:ring-amber-400/60">
              Discover Location
            </button>
          </div>
        </div      </section>

      <!-- Details B -->
      <section id="detailsB" class="absolute left-0 right-0 top-24 sm:top-28 md:top-32 px-6 sm:px-8 lg:px-16 max-w-7xl mx-auto opacity-0 pointer-events-none">
        <div class="max-w-xl">
          <div class="relative overflow-hidden h-[44px]">
            <div class="pt-3 text-base sm:text-lg font-medium text-white/90"> </div>
            <span class="absolute top-0 left-0 h-1.5 w-8 rounded-full bg-white/90"></span>
          </div>

          <div class="mt-1 overflow-hidden h-[92px]">
            <h1 class="font-[Oswald] font-semibold text-5xl sm:text-6xl leading-[0.95] tracking-tight uppercase text-white"> </h1>
          </div>

          <div class="mt-1 overflow-hidden h-[92px]">
            <h2 class="font-[Oswald] font-semibold text-5xl sm:text-6xl leading-[0.95] tracking-tight uppercase text-white/90"> </h2>
          </div>

          <p class="mt-4 text-sm sm:text-base text-white/80 leading-relaxed"> </p>

          <div class="mt-6 flex items-center gap-3">
            <button class="h-9 w-9 rounded-full grid place-items-center bg-amber-400 text-neutral-950 ring-1 ring-amber-300/70 hover:ring-amber-200 hover:bg-amber-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/60" aria-label="Bookmark destination">
              <!-- lucide: bookmark -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
              </svg>
            </button>
            <button class="h-9 px-5 rounded-full uppercase text-[11px] tracking-wider font-medium border border-white/40 text-white hover:text-neutral-950 hover:bg-white transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/60">
              Discover Location
            </button>
          </div>
        </div>
      </section>

      <!-- Right rail thumbnails + controls -->
      <aside class="absolute bottom-6 sm:bottom-8 right-4 sm:right-6 lg:right-10 z-30">
        <div class="flex items-center gap-4 sm:gap-6">
          <!-- Arrows -->
          <div class="flex items-center gap-3">
            <button id="prevBtn" class="h-12 w-12 rounded-full grid place-items-center ring-1 ring-white/15 border border-white/10 text-white/80 hover:text-white hover:bg-white/10 hover:ring-white/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/60" aria-label="Previous">
              <!-- lucide: chevron-left -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>
            <button id="nextBtn" class="h-12 w-12 rounded-full grid place-items-center ring-1 ring-white/15 border border-white/10 text-white/80 hover:text-white hover:bg-white/10 hover:ring-white/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/60" aria-label="Next">
              <!-- lucide: chevron-right -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path d="m9 18 6-6-6-6"></path>
              </svg>
            </button>
          </div>

          <!-- Progress + numbers -->
          <div class="hidden md:flex items-center gap-4">
            <div class="w-[440px] h-[3px] bg-white/20 rounded">
              <div id="progress" class="h-[3px] bg-amber-400 rounded" style="width: 0%; transition: width .6s ease;"></div>
            </div>
            <div class="min-w-[64px] text-right font-semibold tracking-tight tabular-nums text-white/90">
              <span id="currentNum">01</span>
              <span class="text-white/50">/</span>
              <span id="totalNum">06</span>
            </div>
          </div>
        </div>

        <!-- Thumbs row -->
        <div id="thumbs" class="mt-4 sm:mt-6 flex gap-4 sm:gap-5 overflow-hidden">
          <!-- Thumbnails injected by JS -->
        </div>
      </aside>
    </main>

    <script>
      const slidesData = [
        {
          place: 'Switzerland Alps',
          title1: 'SAINT',
          title2: 'ANTÖNIEN',
          desc: "Tucked away in the Swiss Alps, Saint Antönien offers serene alpine charm and winter backcountry routes. Summer reveals lush trails for hiking and biking in pristine mountain air.",
          image: 'https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2000&auto=format&fit=crop'
        },
        {
          place: 'Japan Alps',
          title1: 'NAGANO',
          title2: 'PREFECTURE',
          desc: "A cultural jewel set in dramatic peaks, Nagano blends historic temples with world-class powder. Find quiet onsens, cedar forests, and powder days that feel timeless.",
          image: 'https://images.unsplash.com/photo-1545569341-9eb8b30979d9?q=80&w=2000&auto=format&fit=crop'
        },
        {
          place: 'Sahara Desert, Morocco',
          title1: 'MARRAKECH',
          title2: 'MERZOUGA',
          desc: "From vibrant souks to starlit dunes, traverse a spectrum of color and calm. Camel treks, desert camps, and Berber hospitality shape unforgettable nights.",
          image: 'https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=2000&auto=format&fit=crop'
        },
        {
          place: 'Sierra Nevada, USA',
          title1: 'YOSEMITE',
          title2: 'VALLEY',
          desc: "Granite cathedrals, ancient sequoias, and thundering falls. Yosemite is a year-round icon—climb, wander, and watch alpenglow paint Half Dome.",
          image: 'https://images.unsplash.com/photo-1501706362039-c6b2a4efc9b1?q=80&w=2000&auto=format&fit=crop'
        },
        {
          place: 'Tarifa, Spain',
          title1: 'LOS LANCES',
          title2: 'BEACH',
          desc: "Wind-swept shores where Atlantic meets Mediterranean. Kites slice the sky above sprawling sands and lively chiringuitos.",
          image: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2000&auto=format&fit=crop'
        },
        {
          place: 'Cappadocia, Turkey',
          title1: 'GÖREME',
          title2: 'VALLEY',
          desc: "Fairy chimneys and rose canyons glow at dawn. Drift by hot-air balloon above ancient cave churches and surreal stone spires.",
          image: 'https://images.unsplash.com/photo-1548013146-72479768bada?q=80&w=2000&auto=format&fit=crop'
        }
      ];

      // Elements
      const slidesRoot = document.getElementById('slides');
      const detailsA = document.getElementById('detailsA');
      const detailsB = document.getElementById('detailsB');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const indicator = document.getElementById('indicator');
      const progressEl = document.getElementById('progress');
      const thumbs = document.getElementById('thumbs');
      const currentNum = document.getElementById('currentNum');
      const totalNum = document.getElementById('totalNum');

      let index = 0;
      let even = true;
      const N = slidesData.length;
      const cycleMs = 6000;
      let timer = null;

      // Initialize numbers
      totalNum.textContent = String(N).padStart(2, '0');

      // Create slide elements
      const slideEls = slidesData.map((s, i) => {
        const el = document.createElement('div');
        el.className = 'absolute inset-0 opacity-0 transition-opacity duration-700 ease-out will-change-transform';
        el.style.backgroundImage = `url('${s.image}')`;
        el.style.backgroundSize = 'cover';
        el.style.backgroundPosition = 'center';
        if (i === 0) el.classList.add('opacity-100');
        slidesRoot.appendChild(el);
        return el;
      });

      function fillDetails(container, data) {
        const [placeWrap, title1, title2, desc] = [
          container.querySelector('div>div'),
          container.querySelector('h1'),
          container.querySelector('h2'),
          container.querySelector('p')
        ];
        placeWrap.textContent = data.place;
        title1.textContent = data.title1;
        title2.textContent = data.title2;
        desc.textContent = data.desc;
      }

      function showDetails(data) {
        const show = even ? detailsA : detailsB;
        const hide = even ? detailsB : detailsA;

        fillDetails(show, data);

        // Animate in/out via classes
        hide.classList.add('opacity-0');
        hide.classList.add('pointer-events-none');

        show.classList.remove('pointer-events-none');
        show.style.transition = 'opacity .5s ease, transform .5s ease';
        hide.style.transition = 'opacity .5s ease, transform .5s ease';

        show.classList.remove('opacity-0');
        even = !even;
      }

      function renderThumbs() {
        thumbs.innerHTML = '';
        const toShow = 4;
        for (let i = 1; i <= toShow; i++) {
          const idx = (index + i) % N;
          const s = slidesData[idx];
          const t = document.createElement('button');
          t.className = 'relative group w-28 sm:w-36 lg:w-40 h-40 sm:h-48 lg:h-56 rounded-xl overflow-hidden ring-1 ring-white/10 border border-white/10 hover:ring-white/20 hover:border-white/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-400/60';
          t.setAttribute('aria-label', `${s.place} preview`);
          t.innerHTML = `
            <div class="absolute inset-0" style="background-image:url('${s.image}'); background-size:cover; background-position:center;"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-black/10 to-transparent"></div>
            <div class="absolute bottom-2 left-2 right-2 flex items-center gap-2 text-xs">
              <!-- lucide: map-pin -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white/90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M20 10c0 7-8 12-8 12S4 17 4 10a8 8 0 1 1 16 0Z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
              <span class="line-clamp-1 font-medium text-white/90">${s.place}</span>
            </div>
          `;
          t.addEventListener('click', () => {
            goTo(idx);
          });
          thumbs.appendChild(t);
        }
      }

      function updateSlides() {
        slideEls.forEach((el, i) => {
          if (i === index) el.classList.add('opacity-100');
          else el.classList.remove('opacity-100');
        });
      }

      function updateNumbers() {
        currentNum.textContent = String(index + 1).padStart(2, '0');
      }

      function updateProgress() {
        const pct = ((index + 1) / N) * 100;
        progressEl.style.width = pct + '%';
      }

      function restartIndicator() {
        indicator.style.transition = 'none';
        indicator.style.transform = 'scaleX(0)';
        // Force reflow to restart transition
        void indicator.offsetWidth;
        indicator.style.transition = `transform ${cycleMs}ms linear`;
        indicator.style.transform = 'scaleX(1)';
      }

      function scheduleNext() {
        clearTimeout(timer);
        restartIndicator();
        timer = setTimeout(() => {
          next();
        }, cycleMs);
      }

      function next() {
        index = (index + 1) % N;
        showDetails(slidesData[index]);
        updateSlides();
        updateNumbers();
        updateProgress();
        renderThumbs();
        scheduleNext();
      }

      function prev() {
        index = (index - 1 + N) % N;
        showDetails(slidesData[index]);
        updateSlides();
        updateNumbers();
        updateProgress();
        renderThumbs();
        scheduleNext();
      }

      function goTo(i) {
        index = i % N;
        showDetails(slidesData[index]);
        updateSlides();
        updateNumbers();
        updateProgress();
        renderThumbs();
        scheduleNext();
      }

      // Init
      fillDetails(detailsA, slidesData[0]);
      updateSlides();
      updateNumbers();
      updateProgress();
      renderThumbs();
      scheduleNext();

      // Events
      nextBtn.addEventListener('click', next);
      prevBtn.addEventListener('click', prev);

      // Accessibility: arrow keys
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') next();
        if (e.key === 'ArrowLeft') prev();
      });

      // Resize-safe: keep indicator full width behavior intact
      window.addEventListener('resize', () => {
        // No layout-sensitive calculations required; keep minimal.
      });
    </script>
  </body>
</html>
