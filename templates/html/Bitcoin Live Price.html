<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Crypto Hero Stats</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="font-inter text-gray-50 antialiased">
  <!-- Hero -->
  <section class="relative isolate overflow-hidden">
    <!-- Background image -->
    <img src="https://lemonchiffon-hornet-823603.hostingersite.com/lunarcrush-imgs/background.jpg?w=1080&q=80" class="absolute inset-0 -z-30 h-full w-full object-cover opacity-30" alt="">
    
    <!-- Grid overlay -->
    <div class="pointer-events-none absolute inset-0 -z-20 opacity-50" style="background:hsla(209,100%,47%,0.1);background-image:radial-gradient(white 5%,transparent 0);background-size:16px 16px;"></div>
    
    <!-- Gradient overlay -->
    <div class="pointer-events-none absolute inset-0 -z-10 bg-gradient-radial from-black/60 via-black/40 to-gray-900"></div>

    <div class="mx-auto max-w-6xl px-6 py-16 sm:py-24 md:py-32">
      <!-- Header -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <img src="https://lemonchiffon-hornet-823603.hostingersite.com/lunarcrush-imgs/bitcoin-avatar.png?w=1080&q=80" alt="Bitcoin logo" class="h-[140px] w-[140px] object-cover">
          <div class="flex flex-col">
            <span class="text-4xl sm:text-5xl font-medium tracking-tight text-slate-50">Bitcoin</span>
            <span class="text-3xl font-normal tracking-tight text-gray-500">BTC</span>
          </div>
        </div>
        <span class="text-lg font-medium text-slate-50">LunarCrush</span>
      </div>

      <!-- Price -->
      <h1 id="btcPrice" class="mt-12 text-6xl font-semibold tracking-tight sm:text-7xl md:text-9xl">$105,206.00</h1>

      <!-- Stats -->
      <div class="mt-12 grid grid-cols-1 gap-y-6 sm:grid-cols-2 sm:gap-x-12">
        <div class="flex items-center justify-between border-b border-white/10 pb-4">
          <span class="text-xl font-normal text-gray-400">Market Cap</span>
          <span id="marketCap" class="text-xl font-normal">$2,090,390,084,144.00</span>
        </div>
        <div class="flex items-center justify-between border-b border-white/10 pb-4">
          <span class="text-xl font-normal text-gray-400">24h Volume</span>
          <span id="volume24h" class="text-xl font-normal">$53,889,944,282.00</span>
        </div>
        <div class="flex items-center justify-between border-b border-white/10 pb-4">
          <span class="text-xl font-normal text-gray-400">24h Change</span>
          <span id="change24h" class="text-xl font-normal">-1.47%</span>
        </div>
        <div class="flex items-center justify-between border-b border-white/10 pb-4">
          <span class="text-xl font-normal text-gray-400">Circulating Supply</span>
          <span id="supply" class="text-xl font-normal">NaN</span>
        </div>
      </div>

      <!-- Chart -->
      <div class="mt-16 h-64">
        <canvas id="priceChart" class="w-full h-full"></canvas>
      </div>
    </div>
  </section>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>
    const $ = id => document.getElementById(id);
    const fmtNum = (v,d=0)=>Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
    const fmtUsd = v=>'$'+fmtNum(v,2);
    const fmtPct = v=>(v>=0?'+':'')+fmtNum(v,2)+'%';

    /* Chart setup */
    const ctx = $('priceChart').getContext('2d');
    const priceData = {
      labels: [],
      datasets: [{
        data: [],
        borderColor: '#f97316',
        backgroundColor: 'rgba(249,115,22,0.08)',
        borderWidth: 2,
        tension: .35,
        pointRadius: 0
      }]
    };
    const priceChart = new Chart(ctx, {
      type: 'line',
      data: priceData,
      options: {
        scales: {
          y: {ticks:{color:'#f3f4f6'},grid:{color:'rgba(255,255,255,0.05)'}},
          x: {ticks:{color:'#9ca3af'},grid:{display:false}}
        },
        plugins:{legend:{display:false}},
        responsive:true,
        maintainAspectRatio:false
      }
    });

    /* Fetch data */
    const API='https://api.coingecko.com/api/v3/coins/bitcoin?localization=false&tickers=false&community_data=false&developer_data=false&sparkline=false';

    async function fetchMetrics() {
      try {
        const res = await fetch(API);
        const d   = await res.json();
        const m   = d.market_data;

        $('btcPrice').textContent = fmtUsd(m.current_price.usd);
        $('marketCap').textContent = fmtUsd(m.market_cap.usd);
        $('volume24h').textContent = fmtUsd(m.total_volume.usd);
        $('change24h').textContent = fmtPct(m.price_change_percentage_24h);
        $('supply').textContent = fmtNum(d.circulating_supply);

        const ts = new Date().toLocaleTimeString();
        priceData.labels.push(ts);
        priceData.datasets[0].data.push(m.current_price.usd);
        if (priceData.labels.length > 50) {
          priceData.labels.shift();
          priceData.datasets[0].data.shift();
        }
        priceChart.update();
      } catch (err) {
        console.error(err);
      }
    }

    fetchMetrics();
    setInterval(fetchMetrics, 30000);
  </script>
</body></html>
