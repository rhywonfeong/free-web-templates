<!DOCTYPE html>
<html lang="en" class="bg-[#050505] text-zinc-100 antialiased selection:bg-yellow-500/30 selection:text-yellow-500">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Interface</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body {
font-family: 'Inter', sans-serif;
}
/* Custom scrollbar for webkit */
::-webkit-scrollbar {
width: 4px;
}
::-webkit-scrollbar-track {
background: transparent;
}
::-webkit-scrollbar-thumb {
background: #3f3f46;
border-radius: 2px;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-black relative">

    <!-- Background Layer -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=2574&auto=format&fit=crop" 
             class="w-full h-full object-cover opacity-20" alt="Background Texture">
        <div class="absolute inset-0 bg-gradient-to-r from-black via-black/80 to-transparent"></div>
        <!-- Main Character Placeholder Image -->
        <div class="absolute right-0 top-0 h-full w-[60%] flex items-center justify-center opacity-90 mix-blend-lighten">
            <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/917d6f93-fb36-439a-8c48-884b67b35381_1600w.jpg" 
                 class="h-[120%] w-auto object-cover object-top mask-image-gradient" 
                 style="-webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%, linear-gradient(to left, black 80%, transparent 100%));" alt="Character">
        </div>
    </div>

    <!-- Top Navigation Bar -->
    <header class="relative z-20 flex items-center justify-between px-8 py-5 bg-gradient-to-b from-black/80 to-transparent border-b border-white/5 backdrop-blur-sm">
        
        <!-- Left Side Nav -->
        <div class="flex items-center space-x-12">
            <div class="flex items-center space-x-2">
                <span class="text-lg font-medium border border-zinc-700/50 bg-zinc-900/50 px-3 py-1 rounded-sm shadow-sm backdrop-blur-md">R1</span>
            </div>
            
            <nav class="flex items-center space-x-8 text-sm tracking-wide text-zinc-400">
                <a href="#" class="hover:text-zinc-100 transition-colors">HOME</a>
                <a href="#" class="text-zinc-100 font-medium relative py-1">
                    ARMOR
                    <span class="absolute bottom-0 left-0 w-full h-[2px] bg-yellow-500"></span>
                </a>
                <a href="#" class="hover:text-zinc-100 transition-colors">UPGRADES</a>
                <a href="#" class="hover:text-zinc-100 transition-colors">HEROES</a>
                <a href="#" class="hover:text-zinc-100 transition-colors">OPTIONS</a>
            </nav>
        </div>

        <!-- Right Side Nav -->
        <div class="flex items-center space-x-8">
            <div class="flex items-center space-x-2">
                <span class="text-lg font-medium border border-zinc-700/50 bg-zinc-900/50 px-3 py-1 rounded-sm shadow-sm backdrop-blur-md">L1</span>
            </div>
            
            <div class="flex items-center space-x-6 text-base font-medium">
                <div class="flex items-center space-x-2 bg-zinc-900/40 px-3 py-1 border border-white/5 rounded-sm">
                    <span>203</span>
                    <i data-lucide="shield" class="text-yellow-600 w-5 h-5 drop-shadow-[0_0_8px_rgba(202,138,4,0.5)]"></i>
                </div>
                <div class="flex items-center space-x-2 bg-zinc-900/40 px-3 py-1 border border-white/5 rounded-sm">
                    <span>34 GP</span>
                    <i data-lucide="box" class="text-zinc-400 w-5 h-5"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="relative z-10 flex-1 w-full flex p-8 gap-8 overflow-hidden">
        
        <!-- Left Side Panel (Stats & Menus) -->
        <aside class="w-[380px] flex flex-col space-y-4 shrink-0">
            
            <!-- HEROES Section -->
            <section class="bg-zinc-900/60 border border-zinc-800/80 rounded-sm backdrop-blur-md p-5 flex flex-col relative overflow-hidden">
                <div class="flex items-center justify-between mb-4 border-b border-zinc-800/50 pb-2">
                    <h2 class="text-sm tracking-tight text-zinc-100 uppercase">HEROES</h2>
                    <div class="h-full w-[2px] bg-yellow-500 absolute right-0 top-0"></div>
                </div>
                
                <div class="grid grid-cols-3 gap-3">
                    <!-- Selected Hero -->
                    <div class="relative group cursor-pointer">
                        <div class="aspect-square bg-zinc-800 rounded-sm overflow-hidden border border-yellow-500 ring-1 ring-yellow-500/50 shadow-[0_0_15px_rgba(234,179,8,0.15)]">
                            <img src="https://images.unsplash.com/photo-1535295972055-1c762f4483e5?q=80&w=200&auto=format&fit=crop" class="w-full h-full object-cover grayscale mix-blend-luminosity opacity-80" alt="Hero 1">
                        </div>
                    </div>
                    <!-- Unselected Hero -->
                    <div class="relative group cursor-pointer">
                        <div class="aspect-square bg-zinc-800 rounded-sm overflow-hidden border border-zinc-700 group-hover:border-zinc-500 transition-colors">
                            <img src="https://images.unsplash.com/photo-1618336753974-aae8e04506aa?q=80&w=200&auto=format&fit=crop" class="w-full h-full object-cover grayscale mix-blend-luminosity opacity-60" alt="Hero 2">
                        </div>
                    </div>
                    <!-- Add Hero Slot -->
                    <div class="relative group cursor-pointer">
                        <div class="aspect-square bg-zinc-900 rounded-sm overflow-hidden border border-zinc-800 flex items-center justify-center hover:bg-zinc-800 transition-colors">
                            <i data-lucide="plus" class="w-6 h-6 text-zinc-600"></i>
                        </div>
                    </div>
                </div>
            </section>

            <!-- STATS Section -->
            <section class="bg-zinc-900/60 border border-zinc-800/80 rounded-sm backdrop-blur-md p-5 flex flex-col relative overflow-hidden">
                <div class="flex items-center justify-between mb-5 border-b border-zinc-800/50 pb-2">
                    <h2 class="text-sm tracking-tight text-zinc-100 uppercase">STATS</h2>
                    <div class="h-full w-[2px] bg-yellow-500 absolute right-0 top-0"></div>
                </div>
                
                <div class="grid grid-cols-3 gap-4">
                    <!-- Kills -->
                    <div class="flex flex-col space-y-1">
                        <div class="flex items-center space-x-1.5 text-zinc-400">
                            <i data-lucide="crosshair" class="w-3.5 h-3.5 text-yellow-500"></i>
                            <span class="text-xs font-medium tracking-wide">KILLS</span>
                        </div>
                        <span class="text-3xl font-medium tracking-tight">3.226</span>
                    </div>
                    <!-- Deaths -->
                    <div class="flex flex-col space-y-1">
                        <div class="flex items-center space-x-1.5 text-zinc-400">
                            <i data-lucide="skull" class="w-3.5 h-3.5 text-red-500"></i>
                            <span class="text-xs font-medium tracking-wide">DEATHS</span>
                        </div>
                        <span class="text-3xl font-medium tracking-tight text-zinc-300">1.104</span>
                    </div>
                    <!-- Ratio -->
                    <div class="flex flex-col space-y-1">
                        <div class="flex items-center space-x-1.5 text-zinc-400">
                            <i data-lucide="arrow-down-right" class="w-3.5 h-3.5 text-green-500"></i>
                            <span class="text-xs font-medium tracking-wide">RATIO</span>
                        </div>
                        <div class="flex items-baseline space-x-1">
                            <span class="text-3xl font-medium tracking-tight text-zinc-300">3.11</span>
                            <span class="text-sm text-zinc-500">K/D</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- BEST MAP Section -->
            <section class="bg-zinc-900/60 border border-zinc-800/80 rounded-sm backdrop-blur-md flex flex-col relative overflow-hidden">
                <div class="px-5 pt-4 pb-2 border-b border-zinc-800/50">
                    <h2 class="text-sm tracking-tight text-zinc-100 uppercase">BEST MAP</h2>
                </div>
                <div class="relative h-32 w-full group overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1506452305024-9d3f02d1c9b5?q=80&w=800&auto=format&fit=crop" 
                         class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-700 ease-out" alt="Map">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                    <span class="absolute bottom-3 left-4 text-xs font-medium tracking-wider text-zinc-200">GORKANE ISLAND</span>
                </div>
            </section>

        </aside>

        <!-- Center Area Callout Overlay -->
        <div class="absolute top-[32%] left-[38%] flex items-center z-30 pointer-events-none">
            <div class="flex items-center space-x-2 bg-black/40 backdrop-blur-sm px-2 py-1 rounded-sm border border-white/5">
                <i data-lucide="volume-2" class="w-4 h-4 text-zinc-400"></i>
                <span class="text-sm font-medium tracking-widest text-zinc-200">IIII_OFF_IIII</span>
            </div>
            
            <!-- Connecting Line SVG -->
            <svg class="absolute left-[calc(100%-10px)] top-1/2 w-[300px] h-[300px] overflow-visible pointer-events-none" style="transform: translateY(-50%);">
                <path d="M 10,0 L 40,0 L 160,180" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="160" cy="180" r="2.5" fill="#eab308" class="drop-shadow-[0_0_6px_rgba(234,179,8,0.8)]"/>
            </svg>
        </div>

    </main>

    <!-- Bottom Weapon Panels Container -->
    <div class="absolute bottom-8 left-8 right-8 z-40 flex gap-6 pointer-events-none">
        
        <!-- Weapon Panel 1 (Selected) -->
        <div class="flex-1 bg-zinc-900/85 border border-zinc-700/50 rounded-sm backdrop-blur-xl p-6 flex items-end justify-between relative overflow-hidden pointer-events-auto shadow-2xl shadow-black/50">
            <!-- Selected Accent Line -->
            <div class="absolute bottom-0 left-0 w-full h-[3px] bg-yellow-500 shadow-[0_0_10px_rgba(234,179,8,0.5)]"></div>
            
            <div class="flex flex-col space-y-6 w-1/2">
                <h1 class="text-3xl font-medium tracking-tight text-zinc-100">AXT 700</h1>
                
                <div class="flex items-center space-x-4">
                    <!-- Stat Icons -->
                    <div class="w-8 h-8 rounded-full border border-zinc-700 flex items-center justify-center bg-zinc-800/50">
                        <i data-lucide="target" class="w-4 h-4 text-yellow-600"></i>
                    </div>
                    <div class="w-8 h-8 rounded-full border border-cyan-500/50 flex items-center justify-center bg-cyan-950/30 ring-1 ring-cyan-500/30">
                        <i data-lucide="disc" class="w-4 h-4 text-cyan-400"></i>
                    </div>
                    <div class="w-8 h-8 rounded-full border border-zinc-700 flex items-center justify-center bg-zinc-800/50 text-green-500">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                </div>

                <!-- Weapon Image Placeholder -->
                <div class="h-32 -ml-8 -mb-4 relative z-10 w-[120%]">
                    <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/4734259a-bad7-422f-981e-ce01e79184f2_1600w.jpg" 
                         class="w-full h-full object-cover object-center grayscale mix-blend-luminosity brightness-150 contrast-125 [mask-image:linear-gradient(to_right,black_60%,transparent)]" alt="Weapon 1">
                </div>
            </div>

            <!-- Weapon Stats Bars -->
            <div class="w-[45%] flex flex-col justify-center space-y-3 pb-4">
                <div class="flex items-center">
                    <span class="w-24 text-sm text-zinc-400 font-medium text-right pr-4 uppercase tracking-wider">PRECISION</span>
                    <div class="flex-1 h-[5px] bg-zinc-800 rounded-full overflow-hidden relative border border-white/5">
                        <div class="absolute top-0 left-0 h-full bg-cyan-400 w-[85%] shadow-[0_0_8px_rgba(34,211,238,0.6)]"></div>
                    </div>
                </div>
                <div class="flex items-center">
                    <span class="w-24 text-sm text-zinc-400 font-medium text-right pr-4 uppercase tracking-wider">CADENCE</span>
                    <div class="flex-1 h-[5px] bg-zinc-800 rounded-full overflow-hidden relative border border-white/5">
                        <div class="absolute top-0 left-0 h-full bg-cyan-400 w-[65%] shadow-[0_0_8px_rgba(34,211,238,0.6)]"></div>
                    </div>
                </div>
                <div class="flex items-center">
                    <span class="w-24 text-sm text-zinc-400 font-medium text-right pr-4 uppercase tracking-wider">STABILITY</span>
                    <div class="flex-1 h-[5px] bg-zinc-800 rounded-full overflow-hidden relative border border-white/5">
                        <div class="absolute top-0 left-0 h-full bg-cyan-400 w-[75%] shadow-[0_0_8px_rgba(34,211,238,0.6)]"></div>
                    </div>
                </div>
                <div class="flex items-center">
                    <span class="w-24 text-sm text-zinc-400 font-medium text-right pr-4 uppercase tracking-wider">DAMAGE</span>
                    <div class="flex-1 h-[5px] bg-zinc-800 rounded-full overflow-hidden relative border border-white/5">
                        <div class="absolute top-0 left-0 h-full bg-cyan-400 w-[70%] shadow-[0_0_8px_rgba(34,211,238,0.6)]"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Weapon Panel 2 (Unselected) -->
        <div class="flex-1 bg-zinc-900/60 border border-zinc-800/80 rounded-sm backdrop-blur-md p-6 flex items-start justify-between relative overflow-hidden pointer-events-auto group hover:bg-zinc-900/80 transition-colors">
            
            <div class="flex flex-col space-y-6 w-full relative z-10">
                <h1 class="text-3xl font-medium tracking-tight text-zinc-200 group-hover:text-zinc-100 transition-colors">ARTEMOS-Y</h1>
                
                <div class="flex items-center space-x-4">
                    <!-- Stat Icons -->
                    <div class="w-8 h-8 rounded-full border border-yellow-500/50 flex items-center justify-center bg-yellow-950/20">
                        <i data-lucide="target" class="w-4 h-4 text-yellow-500"></i>
                    </div>
                    <div class="w-8 h-8 rounded-full border border-zinc-700 flex items-center justify-center bg-zinc-800/50">
                        <div class="w-4 h-4 rounded-full border-[1.5px] border-emerald-400 flex items-center justify-center">
                            <div class="w-[8px] h-[1.5px] bg-emerald-400"></div>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full border border-zinc-700 flex items-center justify-center bg-zinc-800/50 text-green-500">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                </div>
            </div>

            <!-- Weapon Image Placeholder (Absolute positioned to right) -->
            <div class="absolute right-4 bottom-4 h-40 w-[60%] z-0">
                <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/c543a9e1-f226-4ced-80b0-feb8445a75b9_1600w.jpg" 
                     class="w-full h-full object-cover object-center grayscale mix-blend-luminosity opacity-70 group-hover:opacity-90 transition-opacity [mask-image:linear-gradient(to_left,black_70%,transparent)]" alt="Weapon 2">
            </div>
        </div>

    </div>

    <!-- Initialize Icons -->
    <script>
        lucide.createIcons({
            attrs: {
                'stroke-width': 1.5
            }
        });
    </script>
</body>
</html>
