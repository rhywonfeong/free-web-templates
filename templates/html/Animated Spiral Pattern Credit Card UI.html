  <meta charset="UTF-8" />
  <title>Spiral Credit Card - Dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen">
  <div class="relative w-[380px] h-[240px] rounded-2xl shadow-[0_35px_60px_-15px_rgba(0,0,0,0.5)] overflow-hidden border border-zinc-700 bg-gray-800">
    <!-- Card Background with Spiral Animation -->
    <div class="absolute inset-0 z-0">
      <svg width="380" height="240" viewBox="0 0 380 240" class="block">
        <rect width="380" height="240" fill="#1f2937" rx="16" ry="16" />
        <g>
          <script type="application/ecmascript"><![CDATA[
            const svgNS = "http://www.w3.org/2000/svg";
            const N = 150, WIDTH = 380, HEIGHT = 240, DOT_R = 1.5, MARGIN = 10;
            const CX = WIDTH/2, CY = HEIGHT/2, MAX_R = Math.min(CX, CY) - MARGIN;
            const GOLDEN = Math.PI * (3 - Math.sqrt(5)), DUR = 3;
            const COLORS = [
              "#9333ea", "#6366f1", "#3b82f6", "#06b6d4", "#10b981", "#84cc16", "#eab308", "#f97316", "#ef4444", "#ec4899"
            ];
            for(let i=0; i<N; i++) {
              const frac = (i+0.5)/N;
              const r = Math.sqrt(frac) * MAX_R;
              const theta = (i+0.5) * GOLDEN;
              const x = CX + r*Math.cos(theta), y = CY + r*Math.sin(theta);
              const colorIdx = Math.floor((frac)*(COLORS.length - 1));
              const c1 = COLORS[colorIdx], c2 = COLORS[(colorIdx+1) % COLORS.length];
              function lerpColor(a, b, t) {
                a = a.replace('#',''); b = b.replace('#','');
                const r = Math.round(parseInt(a.substr(0,2),16)*(1-t)+parseInt(b.substr(0,2),16)*t);
                const g = Math.round(parseInt(a.substr(2,2),16)*(1-t)+parseInt(b.substr(2,2),16)*t);
                const b_ = Math.round(parseInt(a.substr(4,2),16)*(1-t)+parseInt(b.substr(4,2),16)*t);
                return 'rgb('+r+','+g+','+b_+')';
              }
              const localFrac = (frac*COLORS.length)%1;
              const fill = lerpColor(c1,c2,localFrac);
              const circle = document.createElementNS(svgNS,"circle");
              circle.setAttribute("cx",x);
              circle.setAttribute("cy",y);
              circle.setAttribute("r",DOT_R);
              circle.setAttribute("fill",fill);
              circle.setAttribute("opacity","0.7");
              const animR = document.createElementNS(svgNS,"animate");
              animR.setAttribute("attributeName","r");
              animR.setAttribute("values",`${DOT_R*0.7};${DOT_R*1.8};${DOT_R*0.7}`);
              animR.setAttribute("dur",`${DUR}s`);
              animR.setAttribute("begin",`${frac*DUR}s`);
              animR.setAttribute("repeatCount","indefinite");
              animR.setAttribute("calcMode","spline");
              animR.setAttribute("keySplines","0.4 0 0.6 1;0.4 0 0.6 1");
              const animO = document.createElementNS(svgNS,"animate");
              animO.setAttribute("attributeName","opacity");
              animO.setAttribute("values","0.4;0.9;0.4");
              animO.setAttribute("dur",`${DUR}s`);
              animO.setAttribute("begin",`${frac*DUR}s`);
              animO.setAttribute("repeatCount","indefinite");
              animO.setAttribute("calcMode","spline");
              animO.setAttribute("keySplines","0.4 0 0.6 1;0.4 0 0.6 1");
              circle.appendChild(animR); 
              circle.appendChild(animO);
              document.currentScript.parentNode.appendChild(circle);
            }
          ]]></script>
        </g>
      </svg>
    </div>
    
    <!-- Card Content -->
    <div class="absolute inset-0 p-6 text-white flex flex-col justify-between z-10">
      <!-- Top Row -->
      <div class="flex justify-between items-start">
        <!-- Chip -->
        <div class="h-8 w-10 bg-gradient-to-br from-yellow-600 to-yellow-400 rounded-md flex flex-col justify-center">
          <div class="h-1.5 mx-1 my-0.5 bg-yellow-900/30 rounded"></div>
          <div class="h-1.5 mx-1 my-0.5 bg-yellow-900/30 rounded"></div>
        </div>
        
        <!-- Logo -->
        <div class="font-bold text-xl tracking-widest">
          <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 to-purple-300">SPIRAL</span>
        </div>
      </div>
      
      <!-- Middle - Card Number -->
      <div class="text-center font-mono text-xl tracking-wider font-semibold mt-2 mb-4">
        <span class="opacity-90">4929</span>
        <span class="mx-2 opacity-90">•••</span>
        <span class="mx-2 opacity-90">•••</span>
        <span class="opacity-90">3021</span>
      </div>
      
      <!-- Bottom Row -->
      <div class="flex justify-between items-end">
        <!-- Cardholder Name -->
        <div class="flex flex-col">
          <span class="text-xs opacity-70">CARDHOLDER NAME</span>
          <span class="font-mono text-sm tracking-wider">JOHN DOE</span>
        </div>
        
        <!-- Expiry -->
        <div class="flex flex-col text-right">
          <span class="text-xs opacity-70">EXPIRES</span>
          <span class="font-mono text-sm tracking-wider">05/27</span>
        </div>
      </div>
    </div>
  </div>
</body>
