<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mental Care App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest"></script></head>

<body class="font-[Inter] bg-sky-50 text-gray-800 flex flex-col min-h-screen selection:bg-sky-200/60 transition-colors duration-300">

<!-- ───────────── AUTH SCREENS ───────────── -->
<main id="authWrapper" class="flex-1 flex flex-col items-center justify-center gap-10 p-6">
  <!-- Login -->
  <section id="loginScreen" data-screen="" class="w-full max-w-sm space-y-6">
    <div class="space-y-2">
      <h1 class="text-3xl font-semibold tracking-tight text-center">Welcome back</h1>
      <p class="text-sm text-center text-gray-500">Keep caring for your mind</p>
    </div>

    <div class="space-y-4">
      <label class="block">
        <span class="text-sm">Email</span>
        <input type="email" id="loginEmail" placeholder="you@example.com"
               class="mt-1 w-full rounded-xl p-3 bg-white shadow placeholder-gray-400 focus:outline-none">
      </label>
      <label class="block">
        <span class="text-sm">Password</span>
        <input type="password" id="loginPass" placeholder="••••••••"
               class="mt-1 w-full rounded-xl p-3 bg-white shadow placeholder-gray-400 focus:outline-none">
      </label>
      <button id="loginBtn" class="w-full py-3 rounded-xl bg-sky-300 text-sky-900 font-medium hover:bg-sky-400 transition">Log in</button>
      <button id="googleBtn" class="w-full py-3 rounded-xl bg-white shadow flex items-center justify-center gap-3 hover:bg-gray-50 transition">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-5 h-5"><path fill="#EA4335" d="M24 9.5c3.51 0 6.68 1.35 9.1 3.55l6.79-6.79C35.58 2.34 30.04 0 24 0 14.66 0 6.54 5.48 2.69 13.44l7.9 6.14C12.4 12.23 17.76 9.5 24 9.5z"/><path fill="#4285F4" d="M46.9 24.64c0-1.55-.15-3.05-.43-4.5H24v8.52h12.82c-.55 2.96-2.21 5.47-4.72 7.17l7.54 5.86C44.6 37.78 46.9 31.7 46.9 24.64z"/><path fill="#FBBC05" d="M10.59 28.58A14.8 14.8 0 0 1 9.5 24c0-1.59.27-3.13.78-4.58l-7.9-6.14A23.96 23.96 0 0 0 0 24c0 3.93.93 7.64 2.58 10.94l8.01-6.36z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.15 15.91-5.85l-7.54-5.86c-2.1 1.42-4.79 2.25-8.37 2.25-6.28 0-11.62-4.25-13.53-9.99l-7.86 6.29C6.54 42.52 14.66 48 24 48z"/></svg>
        Continue with Google
      </button>
      <a href="#" class="block text-center text-sm text-sky-600 hover:underline">Forgot password?</a>
    </div>

    <p class="text-xs text-center">No account?
      <button id="toRegister" class="text-sky-600 hover:underline font-medium">Sign up</button>
    </p>
  </section>

  <!-- Registration -->
  <section id="registerScreen" data-screen="" class="w-full max-w-sm space-y-6 hidden">
    <div class="space-y-2">
      <h2 class="text-3xl font-semibold tracking-tight text-center">Create account</h2>
      <p class="text-sm text-center text-gray-500">Start your self-care journey</p>
    </div>

    <div class="space-y-4">
      <label class="block">
        <span class="text-sm">Name</span>
        <input type="text" id="regName" placeholder="Full name"
               class="mt-1 w-full rounded-xl p-3 bg-white shadow placeholder-gray-400 focus:outline-none">
      </label>
      <label class="block">
        <span class="text-sm">Email</span>
        <input type="email" id="regEmail" placeholder="you@example.com"
               class="mt-1 w-full rounded-xl p-3 bg-white shadow placeholder-gray-400 focus:outline-none">
      </label>
      <label class="block">
        <span class="text-sm">Password</span>
        <input type="password" id="regPass" placeholder="Create password"
               class="mt-1 w-full rounded-xl p-3 bg-white shadow placeholder-gray-400 focus:outline-none">
      </label>
      <label class="block">
        <span class="text-sm">Age</span>
        <input type="number" id="regAge" min="10" max="120" placeholder="26"
               class="mt-1 w-full rounded-xl p-3 bg-white shadow placeholder-gray-400 focus:outline-none">
      </label>
      <label class="block">
        <span class="text-sm">Pronouns</span>
        <select id="regPronouns" class="mt-1 w-full rounded-xl p-3 bg-white shadow focus:outline-none">
          <option disabled selected>Choose</option>
          <option>She / Her</option>
          <option>He / Him</option>
          <option>They / Them</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm">Wellness goal</span>
        <select id="regGoal" class="mt-1 w-full rounded-xl p-3 bg-white shadow focus:outline-none">
          <option disabled selected>Select goal</option>
          <option>Feel more balanced</option>
          <option>Track my emotions</option>
          <option>Build a habit</option>
        </select>
      </label>
      <button id="registerBtn" class="w-full py-3 rounded-xl bg-mint-300 text-mint-900 font-medium hover:bg-mint-400 transition">Sign up</button>
    </div>

    <p class="text-xs text-center">Have an account?
      <button id="toLogin" class="text-sky-600 hover:underline font-medium">Log in</button>
    </p>
  </section>
</main>

<!-- ───────────── MAIN APP ───────────── -->
<div id="appWrapper" class="flex-1 flex flex-col hidden">

  <!-- Top bar -->
  <header class="flex items-center justify-between px-4 py-3 bg-white shadow">
    <h1 class="text-xl font-semibold tracking-tight">Mind Balance</h1>
    <button id="openProfile" aria-label="Profile">
      <img src="https://images.unsplash.com/photo-1580128634645-96e296fa3262?ixlib=rb-4.0.3&q=80&w=96" alt="avatar" class="w-10 h-10 rounded-full object-cover ring-2 ring-lavender-300">
    </button>
  </header>

  <!-- Screens -->
  <main class="flex-1 overflow-y-auto pb-24">

    <!-- Mood Tracker -->
    <section id="moodScreen" data-main class="space-y-6 px-4 pt-6">
      <h2 class="text-xl font-semibold tracking-tight">How are you feeling?</h2>

      <div class="flex justify-between">
        <button class="moodBtn w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl hover:ring-2 hover:ring-sky-300" data-val="😊">😊</button>
        <button class="moodBtn w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl hover:ring-2 hover:ring-sky-300" data-val="🙂">🙂</button>
        <button class="moodBtn w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl hover:ring-2 hover:ring-sky-300" data-val="😐">😐</button>
        <button class="moodBtn w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl hover:ring-2 hover:ring-sky-300" data-val="😔">😔</button>
        <button class="moodBtn w-16 h-16 bg-white rounded-full shadow flex items-center justify-center text-2xl hover:ring-2 hover:ring-sky-300" data-val="😭">😭</button>
      </div>

      <div class="bg-white rounded-xl shadow p-4">
        <h3 class="text-lg font-medium tracking-tight mb-2">This week</h3>
        <div class="relative"><canvas id="chart" height="300"></canvas></div>
      </div>

      <!-- FAB -->
      <button id="addMood" aria-label="Add mood"
              class="fixed bottom-28 right-6 p-4 rounded-full bg-lavender-300 text-lavender-900 shadow-lg hover:bg-lavender-400 transition">
        <svg data-lucide="plus" class="w-6 h-6"></svg>
      </button>
    </section>

    <!-- Journal -->
    <section id="journalScreen" data-main class="hidden space-y-6 px-4 pt-6">
      <h2 class="text-xl font-semibold tracking-tight">Journal</h2>

      <div class="bg-white rounded-xl shadow p-4 space-y-3">
        <textarea id="journalText" rows="4" placeholder="Write your thoughts..."
                  class="w-full resize-none bg-transparent focus:outline-none placeholder-gray-400"></textarea>
        <button id="saveJournal" class="w-full py-3 rounded-lg bg-sky-300 text-sky-900 font-medium hover:bg-sky-400 transition">Save entry</button>
      </div>

      <ul id="journalList" class="space-y-4"></ul>
    </section>

    <!-- Recommendations -->
    <section id="tipsScreen" data-main class="hidden space-y-6 px-4 pt-6">
      <h2 class="text-xl font-semibold tracking-tight">Your tips</h2>

      <div id="cardZone" class="relative h-72">
        <!-- cards filled by JS -->
      </div>

      <div class="flex justify-center gap-10">
        <button id="tipNo" class="p-4 rounded-full bg-red-200 text-red-700 hover:bg-red-300 transition">
          <svg data-lucide="x" class="w-6 h-6"></svg>
        </button>
        <button id="tipYes" class="p-4 rounded-full bg-mint-300 text-mint-900 hover:bg-mint-400 transition">
          <svg data-lucide="heart" class="w-6 h-6"></svg>
        </button>
      </div>
    </section>
  </main>

  <!-- Bottom navigation -->
  <nav class="fixed bottom-0 inset-x-0 bg-white shadow-t flex justify-around py-2">
    <button class="navBtn flex flex-col items-center gap-1 text-sky-600" data-target="moodScreen">
      <svg data-lucide="smile" class="w-6 h-6"></svg><span class="text-xs">Mood</span>
    </button>
    <button class="navBtn flex flex-col items-center gap-1 text-gray-400" data-target="journalScreen">
      <svg data-lucide="book" class="w-6 h-6"></svg><span class="text-xs">Journal</span>
    </button>
    <button class="navBtn flex flex-col items-center gap-1 text-gray-400" data-target="tipsScreen">
      <svg data-lucide="sparkles" class="w-6 h-6"></svg><span class="text-xs">Tips</span>
    </button>
  </nav>
</div>

<!-- ───────────── PROFILE ───────────── -->
<div id="profileOverlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-6 hidden">
  <div class="w-full max-w-sm bg-white rounded-xl shadow-lg p-6 space-y-6">
    <div class="flex justify-between items-center">
      <h2 class="text-xl font-semibold tracking-tight">Profile</h2>
      <button id="closeProfile"><svg data-lucide="x" class="w-6 h-6"></svg></button>
    </div>

    <div class="flex flex-col items-center gap-2">
      <img src="https://images.unsplash.com/photo-1614285663879-cd94af728621?ixlib=rb-4.0.3&q=80&w=96" class="w-20 h-20 rounded-full object-cover ring-2 ring-sky-200">
      <input id="profName" placeholder="Your name"
             class="text-center w-full bg-gray-100 rounded-md p-2 focus:outline-none">
    </div>

    <div class="space-y-3">
      <label class="block">
        <span class="text-sm">Age</span>
        <input type="number" id="profAge" class="mt-1 w-full bg-gray-100 rounded-md p-2 focus:outline-none">
      </label>
      <label class="block">
        <span class="text-sm">Pronouns</span>
        <select id="profPronouns" class="mt-1 w-full bg-gray-100 rounded-md p-2 focus:outline-none">
          <option>She/Her</option><option>He/Him</option><option>They/Them</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm">Goal</span>
        <select id="profGoal" class="mt-1 w-full bg-gray-100 rounded-md p-2 focus:outline-none">
          <option>Feel more balanced</option><option>Track my emotions</option><option>Build a habit</option>
        </select>
      </label>
    </div>

    <div class="border-t pt-4 space-y-2">
      <div class="flex justify-between">
        <span class="text-sm">Streak</span><span id="streakVal" class="font-medium">0 days</span>
      </div>
      <div class="flex justify-between">
        <span class="text-sm">Mood ↑</span><span id="improveVal" class="font-medium">0%</span>
      </div>
    </div>

    <div class="flex items-center justify-between pt-4">
      <span class="text-sm">Dark mode</span>
      <button id="themeToggle" class="w-12 h-6 bg-gray-300 rounded-full relative">
        <span class="dot absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform"></span>
      </button>
    </div>
  </div>
</div>

<!-- ───────────── SCRIPTS ───────────── -->
<script>
lucide.createIcons();

// Auth navigation
const loginScreen=document.getElementById('loginScreen');
const registerScreen=document.getElementById('registerScreen');
document.getElementById('toRegister').onclick=()=>{loginScreen.classList.add('hidden');registerScreen.classList.remove('hidden');};
document.getElementById('toLogin').onclick=()=>{registerScreen.classList.add('hidden');loginScreen.classList.remove('hidden');};

// Simulated auth success
function enterApp(){document.getElementById('authWrapper').classList.add('hidden');document.getElementById('appWrapper').classList.remove('hidden');}
document.getElementById('loginBtn').onclick=enterApp;
document.getElementById('registerBtn').onclick=enterApp;

// Bottom nav
document.querySelectorAll('.navBtn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const target=btn.dataset.target;
    document.querySelectorAll('[data-main]').forEach(s=>s.classList.add('hidden'));
    document.getElementById(target).classList.remove('hidden');
    document.querySelectorAll('.navBtn').forEach(b=>b.classList.remove('text-sky-600'));
    btn.classList.add('text-sky-600');
  });
});

// Mood chart
const moodVals=[], moodLabels=[];
const chart=new Chart(document.getElementById('chart'),{
  type:'line',
  data:{labels:moodLabels,datasets:[{data:moodVals,borderColor:'#a78bfa',tension:.4,fill:false}]},
  options:{plugins:{legend:{display:false}},scales:{y:{display:false}}}
});
let chosen=null;
document.querySelectorAll('.moodBtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.moodBtn').forEach(x=>x.classList.remove('ring-2','ring-lavender-400'));b.classList.add('ring-2','ring-lavender-400');chosen=b.dataset.val;});
document.getElementById('addMood').onclick=()=>{
  if(!chosen)return alert('Pick a mood first');
  const label=new Date().toLocaleDateString('en-US',{weekday:'short'});
  moodLabels.push(label); moodVals.push(['😊','🙂','😐','😔','😭'].indexOf(chosen)+1); chart.update();
  document.querySelectorAll('.moodBtn').forEach(x=>x.classList.remove('ring-2','ring-lavender-400'));chosen=null;
};

// Journal
document.getElementById('saveJournal').onclick=()=>{
  const txt=document.getElementById('journalText').value.trim(); if(!txt) return;
  const li=document.createElement('li');
  li.className='bg-white rounded-lg shadow p-3 flex justify-between items-start';
  li.innerHTML=`<p class="text-sm mr-2">${txt}</p><span class="text-xs text-gray-400">${new Date().toLocaleDateString()}</span>`;
  document.getElementById('journalList').prepend(li);
  document.getElementById('journalText').value='';
};

// Tips cards
const tips=["Try 5-minute breathing","Mindful walk outside","List 3 gratitudes","Drink water slowly","Stretch shoulders"];
const cardZone=document.getElementById('cardZone');
function loadTips(){
  tips.slice().reverse().forEach((t,i)=>{
    const card=document.createElement('div');
    card.className='absolute inset-0 bg-gradient-to-br from-beige-100 to-sky-100 rounded-xl shadow-lg flex items-center justify-center p-6 text-center text-lg font-medium select-none';
    card.style.transform=`translateY(${i*6}px)`; card.textContent=t; cardZone.append(card);
  });
} loadTips();
function swipe(ok){
  const card=cardZone.querySelector('div:last-child'); if(!card) return;
  card.style.transition='transform .4s, opacity .4s'; card.style.transform=`translate(${ok?'+':'-'}120%, -30%) rotate(${ok?'+':'-'}15deg)`; card.style.opacity=0;
  setTimeout(()=>{card.remove(); if(!cardZone.children.length) loadTips();},400);
}
document.getElementById('tipYes').onclick=()=>swipe(true);
document.getElementById('tipNo').onclick=()=>swipe(false);

// Profile overlay
const overlay=document.getElementById('profileOverlay');
document.getElementById('openProfile').onclick=()=>overlay.classList.remove('hidden');
document.getElementById('closeProfile').onclick=()=>overlay.classList.add('hidden');

// Dark mode
const themeToggle=document.getElementById('themeToggle');
themeToggle.onclick=()=>{
  document.body.classList.toggle('dark'); themeToggle.querySelector('.dot').style.transform=document.body.classList.contains('dark')?'translateX(24px)':'none';
};

// Entry animations
window.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('[data-screen] > *, [data-main] > *').forEach((el,i)=>{el.style.opacity=0;el.style.transform='translateY(12px)';setTimeout(()=>{el.style.transition='all .5s';el.style.opacity=1;el.style.transform='none';},200+40*i);});});
</script>
</body>
</html>
