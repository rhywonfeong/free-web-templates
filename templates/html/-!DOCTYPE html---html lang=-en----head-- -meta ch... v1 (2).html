<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Glowing Rays Background</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="h-screen w-screen overflow-hidden bg-black text-white font-sans">
  <!-- Background WebGL container -->
  <div id="bg" class="absolute inset-0 -z-10"></div>

  <!-- Soft vignette overlay for subtle depth -->
  <div class="pointer-events-none absolute inset-0"
       style="background: radial-gradient(1200px 600px at 50% 60%, rgba(255,255,255,0.08), rgba(0,0,0,0) 60%), radial-gradient(900px 500px at 0% 0%, rgba(0,180,255,0.10), rgba(0,0,0,0) 50%), radial-gradient(900px 500px at 100% 0%, rgba(128,0,255,0.10), rgba(0,0,0,0) 50%);">
  </div>

  <!-- Top Bar -->
  <header class="relative z-10">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between py-5">
        <div class="flex items-center gap-3">
          <div class="flex h-9 w-9 items-center justify-center rounded-md bg-white/10 ring-1 ring-white/15 backdrop-blur">
            <span class="text-white tracking-tight text-lg font-semibold leading-none">GR</span>
          </div>
          <div class="hidden sm:block">
            <p class="text-sm text-white/70">Glowing Rays</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="pauseBtn"
                  class="group inline-flex items-center gap-2 rounded-md bg-white/5 px-3.5 py-2 text-sm font-medium text-white/90 ring-1 ring-white/15 hover:bg-white/10 hover:text-white focus:outline-none focus-visible:ring-2 focus-visible:ring-sky-400/60 transition">
            <svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="opacity-90 group-hover:opacity-100 transition">
              <rect x="6" y="4" width="4" height="16" rx="1"></rect>
              <rect x="14" y="4" width="4" height="16" rx="1"></rect>
            </svg>
            <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="hidden opacity-90 group-hover:opacity-100 transition">
              <polygon points="6 3 20 12 6 21 6 3"></polygon>
            </svg>
            <span id="pauseLabel" class="tracking-tight">Pause</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Hero Copy -->
  <main class="relative z-10">
    <section class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 pt-10 md:pt-16">
      <div class="max-w-2xl">
        <h1 class="text-3xl md:text-5xl tracking-tight font-semibold text-white/95">
          Real-time shader background
        </h1>
        <p class="mt-3 md:mt-4 text-base md:text-lg text-white/70">
          A radial rayfield with time-driven glow. Resize-safe, crisp on high-DPI, and optimized with a full-screen fragment shader.
        </p>
        <div class="mt-6 flex items-center gap-3 text-xs text-white/60">
          <div class="h-5 w-px bg-white/15"></div>
          <div class="inline-flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="">
              <path d="M20 7h-9"></path><path d="M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle>
            </svg>
            <span>Cosine ray bands</span>
          </div>
          <div class="inline-flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v4"></path><path d="M12 18v4"></path><path d="m4.93 4.93 2.83 2.83"></path><path d="m16.24 16.24 2.83 2.83"></path><path d="M2 12h4"></path><path d="M18 12h4"></path><path d="m4.93 19.07 2.83-2.83"></path><path d="m16.24 7.76 2.83-2.83"></path>
            </svg>
            <span>Exponential glow</span>
          </div>
          <div class="inline-flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M22 21H2"></path>
            </svg>
            <span>High-DPI aware</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer hint -->
  <footer class="pointer-events-none absolute bottom-0 left-0 right-0 z-10">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between border-t border-white/10 py-4">
        <p class="text-xs text-white/50">Shader runs on a full-screen quad. Toggle motion if needed.</p>
        <p class="text-xs text-white/40">© GR Studio</p>
      </div>
    </div>
  </footer>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>

  <!-- Shaders -->
  <script id="fragmentShader" type="x-shader/x-fragment">
    precision highp float;

    uniform float u_time;
    uniform vec2 u_resolution;

    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution.xy;
      uv = uv * 2.0 - 1.0; // normalize to -1..1

      float angle = atan(uv.y, uv.x);
      float radius = length(uv);

      float rays = cos(angle * 10.0 + u_time * 0.5) * 0.5 + 0.5;
      float glow = exp(-radius * 2.5);

      vec3 color = mix(vec3(0.1, 0.0, 0.3), vec3(0.0, 0.8, 1.0), rays * glow);

      gl_FragColor = vec4(color, 1.0);
    }
  </script>
  <script id="vertexShader" type="x-shader/x-vertex">
    void main() {
      gl_Position = vec4(position, 1.0);
    }
  </script>

  <!-- App -->
  <script>
    const container = document.getElementById('bg');

    // Scene & renderer
    const scene = new THREE.Scene();
    const camera = new THREE.Camera();
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Uniforms
    const uniforms = {
      u_time: { value: 0.0 },
      u_resolution: { value: new THREE.Vector2(container.clientWidth, container.clientHeight) }
    };

    // Material & mesh
    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: document.getElementById('vertexShader').textContent,
      fragmentShader: document.getElementById('fragmentShader').textContent
    });

    const geometry = new THREE.PlaneGeometry(2, 2);
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // Animation control
    let rafId = null;
    let paused = false;
    const startTime = performance.now();

    function renderFrame(now) {
      uniforms.u_time.value = (now - startTime) * 0.001;
      renderer.render(scene, camera);
      rafId = requestAnimationFrame(renderFrame);
    }

    // Start
    rafId = requestAnimationFrame(renderFrame);

    // Resize handling
    function onResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h, false);
      uniforms.u_resolution.value.set(w, h);
    }
    window.addEventListener('resize', onResize);

    // Pause/Resume UI
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseLabel = document.getElementById('pauseLabel');
    const pauseIcon = document.getElementById('pauseIcon');
    const playIcon = document.getElementById('playIcon');

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      if (paused) {
        cancelAnimationFrame(rafId);
        rafId = null;
        pauseLabel.textContent = 'Resume';
        pauseIcon.classList.add('hidden');
        playIcon.classList.remove('hidden');
      } else {
        pauseLabel.textContent = 'Pause';
        pauseIcon.classList.remove('hidden');
        playIcon.classList.add('hidden');
        rafId = requestAnimationFrame(renderFrame);
      }
    });

    // Initial resize to ensure correct DPR sizing
    onResize();
  </script>
</body>
</html>
