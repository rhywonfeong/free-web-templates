<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Nuggets Game Day</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .oswald { font-family: 'Oswald', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.8s ease-out forwards; }
        .animate-scale-in { animation: scaleIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
        .delay-500 { animation-delay: 0.5s; }
        .delay-600 { animation-delay: 0.6s; }
        .gradient-border { background: linear-gradient(135deg, #FFD233, #FFA500); padding: 2px; border-radius: 8px; }
        .gradient-border-inner { background: #0B2239; border-radius: 6px; }
        .glass-effect { backdrop-filter: blur(10px); background: rgba(11, 34, 57, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); }
        .text-shadow { text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5); }
        .hover-glow:hover { box-shadow: 0 0 20px rgba(255, 210, 51, 0.3); transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen overflow-x-hidden">
    <div class="max-w-6xl mx-auto px-4 py-8 lg:py-12">
        <!-- Logo Section -->
        <div class="text-center mb-8 opacity-0 animate-fade-in">
            <div class="w-32 h-32 mx-auto bg-gradient-to-br from-yellow-400 to-orange-500 rounded-2xl flex items-center justify-center shadow-2xl">
                <span class="text-slate-900 text-2xl font-bold oswald">FN</span>
            </div>
        </div>

        <!-- Game Day Title -->
        <div class="text-center mb-12 opacity-0 animate-slide-up delay-100">
            <h1 class="oswald text-6xl lg:text-8xl font-bold text-yellow-400 tracking-tight text-shadow">
                GAME DAY
            </h1>
            <div class="w-24 h-1 bg-gradient-to-r from-yellow-400 to-orange-500 mx-auto mt-4 rounded-full"></div>
        </div>

        <!-- Score Row -->
        <div class="flex flex-col sm:flex-row justify-center gap-6 mb-16 opacity-0 animate-scale-in delay-200">
            <div class="glass-effect rounded-xl p-6 text-center hover-glow transition-all duration-300 hover:scale-105">
                <div class="oswald text-xl font-semibold text-white mb-2 tracking-wide">FINAL SCORE</div>
                <div class="oswald text-4xl font-bold text-yellow-400 tracking-wider">--</div>
            </div>
            <div class="glass-effect rounded-xl p-6 text-center hover-glow transition-all duration-300 hover:scale-105">
                <div class="oswald text-xl font-semibold text-white mb-2 tracking-wide">TEAM 2</div>
                <div class="oswald text-4xl font-bold text-yellow-400 tracking-wider">--</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="grid lg:grid-cols-2 gap-12 items-start">
            <!-- Player Image -->
            <div class="opacity-0 animate-slide-up delay-300">
                <div class="aspect-square bg-gradient-to-br from-slate-700 to-slate-800 rounded-2xl border-2 border-slate-600 flex items-center justify-center text-slate-400 text-2xl oswald font-medium text-center shadow-2xl hover:shadow-yellow-400/20 transition-all duration-500 group">
                    <div class="group-hover:scale-105 transition-transform duration-300">
                        <div class="w-16 h-16 mx-auto mb-4 opacity-50">
                            <i data-lucide="user" class="w-full h-full"></i>
                        </div>
                        Drop<br>Player Image<br>Here
                    </div>
                </div>
            </div>

            <!-- Player Info -->
            <div class="space-y-8">
                <!-- Player Name -->
                <div class="opacity-0 animate-slide-up delay-400">
                    <h2 class="oswald text-4xl lg:text-5xl font-bold text-yellow-400 tracking-tight mb-4 text-shadow">
                        PLAYER NAME
                    </h2>
                </div>

                <!-- Highlights -->
                <div class="opacity-0 animate-slide-up delay-500">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-6 h-6 text-yellow-400">
                            <i data-lucide="star" class="w-full h-full fill-current"></i>
                        </div>
                        <h3 class="oswald text-2xl font-semibold text-white tracking-wide">HIGHLIGHTS</h3>
                    </div>
                    <div class="h-px bg-gradient-to-r from-white via-white/50 to-transparent"></div>
                </div>

                <!-- Quote Section -->
                <div class="opacity-0 animate-slide-up delay-600">
                    <div class="flex items-start gap-4 mb-4">
                        <div class="text-yellow-400 text-4xl oswald font-bold leading-none">"</div>
                        <div class="oswald text-2xl font-semibold text-yellow-400 leading-tight">
                            QUOTE / STAT
                        </div>
                    </div>
                    <p class="text-slate-300 text-lg leading-relaxed ml-12">
                        Write a quote or statistical summary here.
                    </p>
                </div>

                <!-- Big Quote -->
                <div class="opacity-0 animate-slide-up delay-700">
                    <div class="border-t-4 border-yellow-400 pt-6 mt-12">
                        <div class="flex items-start gap-4">
                            <div class="text-yellow-400 text-6xl oswald font-bold leading-none">"</div>
                            <div class="oswald text-3xl lg:text-4xl font-bold text-yellow-400 tracking-tight leading-tight">
                                FEATURED QUOTE
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Additional Stats Grid -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-16 opacity-0 animate-fade-in delay-700">
            <div class="glass-effect rounded-lg p-4 text-center hover-glow transition-all duration-300">
                <div class="text-2xl font-bold text-yellow-400 oswald">--</div>
                <div class="text-sm text-slate-400 oswald">POINTS</div>
            </div>
            <div class="glass-effect rounded-lg p-4 text-center hover-glow transition-all duration-300">
                <div class="text-2xl font-bold text-yellow-400 oswald">--</div>
                <div class="text-sm text-slate-400 oswald">ASSISTS</div>
            </div>
            <div class="glass-effect rounded-lg p-4 text-center hover-glow transition-all duration-300">
                <div class="text-2xl font-bold text-yellow-400 oswald">--</div>
                <div class="text-sm text-slate-400 oswald">REBOUNDS</div>
            </div>
            <div class="glass-effect rounded-lg p-4 text-center hover-glow transition-all duration-300">
                <div class="text-2xl font-bold text-yellow-400 oswald">--</div>
                <div class="text-sm text-slate-400 oswald">STEALS</div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Add some interactive hover effects
        document.querySelectorAll('.hover-glow').forEach(element => {
            element.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-2px)';
            });
            
            element.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
            });
        });
    </script>
</body>
</html>
