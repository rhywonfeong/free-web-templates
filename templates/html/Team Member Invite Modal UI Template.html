<meta charset="UTF-8">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
body {

/* Custom Scrollbar */

@keyframes fadeIn {

.slide-up {
animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;

@keyframes slideUp {

</style></head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Success Toast -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 bg-white border border-gray-200 shadow-lg rounded-full px-4 py-2 flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 z-50">
        <iconify-icon icon="solar:check-circle-linear" class="text-emerald-500 text-lg"></iconify-icon>
        <span class="text-sm font-medium text-gray-700">Invite generated successfully</span>

    <!-- Main Card -->
    <main class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden relative slide-up">
        
        <!-- Header -->

                    B

            </div>
            <button class="text-gray-400 hover:text-gray-600 transition-colors">

        <!-- STEP 1: Configuration -->
        <div id="step-1" class="p-6 space-y-6">
            
            <!-- Section: Person -->
            <div class="space-y-2">
                <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Person</label>
                <div class="relative group">
                    <iconify-icon icon="solar:magnifer-linear" class="absolute left-3 top-2.5 text-gray-400 text-lg"></iconify-icon>
                    <input type="text" id="user-search" placeholder="Name, email or @username" 
                           class="w-full pl-10 pr-4 py-2 text-sm bg-gray-50 border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-gray-300 focus:bg-white transition-all placeholder:text-gray-400 font-light">
                    
                    <!-- Search Results (Simulated) -->
                    <div id="user-results" class="hidden absolute top-full left-0 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-20 overflow-hidden">
                        <!-- User Item 1 -->
                        <button onclick="selectUser(this, 'Sarah Connor', '@sarah')" class="w-full flex items-center gap-3 p-2 hover:bg-gray-50 text-left transition-colors border-b border-gray-50 last:border-0 user-option" data-id="1">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Sarah" class="w-8 h-8 rounded-full bg-gray-100" alt="">
                            <div class="flex-1">
                                <div class="text-sm font-medium text-gray-900 leading-tight">Sarah Connor</div>
                                <div class="text-xs text-gray-500 font-light">sarah@skynet.com</div>

                        <!-- User Item 2 (Disabled/Already Member) -->
                        <div class="w-full flex items-center gap-3 p-2 bg-gray-50 opacity-50 cursor-not-allowed text-left border-b border-gray-50 last:border-0">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=John" class="w-8 h-8 rounded-full bg-gray-200 grayscale" alt="">

                    </div>
                </div>
                <!-- Selected User Display -->
                <div id="selected-user-display" class="hidden items-center gap-3 p-2 bg-indigo-50/50 border border-indigo-100 rounded-lg">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600">
                        <iconify-icon icon="solar:user-linear" class="text-lg"></iconify-icon>
                    </div>

                    <button onclick="clearUser()" class="p-1 hover:bg-indigo-100 rounded text-indigo-400 hover:text-indigo-600">
                        <iconify-icon icon="solar:close-square-linear"></iconify-icon>
                    </button>
                </div>
            </div>

            <!-- Section: Team -->
            <div class="space-y-2">
                <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Team</label>
                <div class="border border-gray-200 rounded-lg overflow-hidden">
                    <div class="max-h-32 overflow-y-auto custom-scroll">
                        <!-- Parent -->
                        <button onclick="selectTeam(this, 'Engineering')" class="w-full text-left px-3 py-2.5 hover:bg-gray-50 flex items-center justify-between group transition-colors team-option" data-id="eng">
                            <div class="flex items-center gap-2">
                                <iconify-icon icon="solar:folder-path-connect-linear" class="text-gray-400 group-hover:text-gray-600"></iconify-icon>
                                <span class="text-sm text-gray-700 group-hover:text-gray-900">Engineering</span>
                            </div>
                            <iconify-icon icon="solar:check-circle-bold" class="text-indigo-600 hidden check-icon"></iconify-icon>
                        </button>
                        <!-- Child -->
                        <button onclick="selectTeam(this, 'Frontend Core')" class="w-full text-left px-3 py-2.5 pl-8 hover:bg-gray-50 flex items-center justify-between group transition-colors team-option" data-id="fe">
                            <div class="flex items-center gap-2">
                                <iconify-icon icon="solar:code-circle-linear" class="text-gray-400 group-hover:text-gray-600"></iconify-icon>
                                <span class="text-sm text-gray-700 group-hover:text-gray-900">Frontend Core</span>
                            </div>
                            <iconify-icon icon="solar:check-circle-bold" class="text-indigo-600 hidden check-icon"></iconify-icon>
                        </button>
                        <!-- Child -->
                        <button onclick="selectTeam(this, 'Design Systems')" class="w-full text-left px-3 py-2.5 pl-8 hover:bg-gray-50 flex items-center justify-between group transition-colors team-option" data-id="ds">
                            <div class="flex items-center gap-2">
                                <iconify-icon icon="solar:pallete-2-linear" class="text-gray-400 group-hover:text-gray-600"></iconify-icon>
                                <span class="text-sm text-gray-700 group-hover:text-gray-900">Design Systems</span>
                            </div>
                            <iconify-icon icon="solar:check-circle-bold" class="text-indigo-600 hidden check-icon"></iconify-icon>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Section: Role -->
            <div class="space-y-2">
                <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Role</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="selectRole(this, 'Admin')" class="role-option border border-gray-200 rounded-lg p-2 text-center hover:border-gray-300 transition-all focus:ring-1 focus:ring-gray-200">
                        <div class="text-sm font-medium text-gray-700">Admin</div>
                    </button>
                    <button onclick="selectRole(this, 'Member')" class="role-option border border-gray-200 rounded-lg p-2 text-center hover:border-gray-300 transition-all focus:ring-1 focus:ring-gray-200">
                        <div class="text-sm font-medium text-gray-700">Member</div>
                    </button>
                    <!-- Disabled Role -->
                    <button disabled class="border border-gray-100 bg-gray-50 rounded-lg p-2 text-center opacity-50 cursor-not-allowed">
                        <div class="text-sm font-medium text-gray-400">Owner</div>
                    </button>
                </div>
            </div>

            <!-- Section: Profile (Optional) -->
            <div id="profile-section" class="space-y-2 hidden">
                <div class="flex justify-between items-end">
                    <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Profile <span class="text-gray-400 font-normal lowercase">(optional)</span></label>
                    <span class="text-[10px] text-gray-400 tracking-tight">Permissions not affected</span>
                </div>
                <div class="relative">
                    <select class="w-full appearance-none bg-white border border-gray-200 text-gray-700 py-2 px-3 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-gray-300 text-sm font-light">
                        <option>No specific profile</option>
                        <option>Senior Engineer</option>
                        <option>Tech Lead</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-500">
                        <iconify-icon icon="solar:alt-arrow-down-linear"></iconify-icon>
                    </div>
                </div>
            </div>

            <!-- Footer Action -->
            <div class="pt-4 border-t border-gray-100">
                <button id="btn-continue" onclick="goToStep2()" disabled class="w-full py-2.5 rounded-lg bg-gray-900 text-white text-sm font-medium transition-all hover:bg-gray-800 disabled:opacity-50 disabled:cursor-not-allowed shadow-sm flex items-center justify-center gap-2">
                    Continue
                    <iconify-icon icon="solar:arrow-right-linear" class="text-lg"></iconify-icon>
                </button>
            </div>
        </div>

        <!-- STEP 2: Invite Generated -->
        <div id="step-2" class="hidden p-6 space-y-6 fade-in">
            
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-green-50 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3">
                    <iconify-icon icon="solar:link-circle-linear" class="text-2xl"></iconify-icon>
                </div>
                <h2 class="text-base font-medium text-gray-900 tracking-tight">Invite Link Ready</h2>
                <p class="text-sm text-gray-500 font-light">
                    User will join <strong id="confirm-team" class="font-medium text-gray-700"></strong> as <strong id="confirm-role" class="font-medium text-gray-700"></strong>.
                </p>
            </div>

            <!-- Link Field -->
            <div class="group relative">
                <label class="text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5 block">Unique Link</label>
                <div class="flex bg-gray-50 border border-gray-200 rounded-lg overflow-hidden transition-colors hover:border-gray-300">
                    <input type="text" value="boom.co/invite/x8z9-q2p4-m5n6" readonly class="flex-1 bg-transparent border-none px-3 py-2.5 text-sm text-gray-600 font-mono focus:ring-0">
                    <button onclick="copyLink()" class="px-3 border-l border-gray-200 hover:bg-gray-100 text-gray-500 hover:text-gray-900 transition-colors flex items-center justify-center" title="Copy Link">
                        <iconify-icon icon="solar:copy-linear" class="text-lg"></iconify-icon>
                    </button>
                </div>
            </div>

            <!-- Delivery Options -->
            <div class="space-y-3">
                <label class="text-xs font-medium text-gray-500 uppercase tracking-wide">Send via</label>
                
                <!-- Email Checkbox -->
                <div class="flex items-center justify-between p-3 border border-gray-200 rounded-lg hover:border-gray-300 cursor-pointer transition-all" onclick="toggleCheckbox('email-check', 'email-icon')">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-blue-500">
                            <iconify-icon icon="solar:letter-linear"></iconify-icon>
                        </div>
                        <div>
                            <div class="text-sm font-medium text-gray-900">Email</div>
                            <div class="text-xs text-gray-500 font-light">Send to sarah@skynet.com</div>
                        </div>
                    </div>
                    <div id="email-check" class="w-5 h-5 rounded border border-gray-300 flex items-center justify-center transition-colors">
                        <iconify-icon id="email-icon" icon="solar:check-read-linear" class="text-white text-xs opacity-0 scale-75 transition-all"></iconify-icon>
                    </div>
                </div>

                <!-- WhatsApp Checkbox -->
                <div class="flex items-center justify-between p-3 border border-gray-200 rounded-lg hover:border-gray-300 cursor-pointer transition-all" onclick="toggleCheckbox('wa-check', 'wa-icon')">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-green-50 flex items-center justify-center text-green-600">
                            <iconify-icon icon="solar:phone-linear"></iconify-icon>
                        </div>
                        <div>
                            <div class="text-sm font-medium text-gray-900">WhatsApp</div>
                            <div class="text-xs text-gray-500 font-light">Open WhatsApp web</div>
                        </div>
                    </div>
                    <div id="wa-check" class="w-5 h-5 rounded border border-gray-300 flex items-center justify-center transition-colors">
                        <iconify-icon id="wa-icon" icon="solar:check-read-linear" class="text-white text-xs opacity-0 scale-75 transition-all"></iconify-icon>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="pt-2 flex flex-col gap-3">
                <button onclick="finishProcess()" class="w-full py-2.5 rounded-lg bg-gray-900 text-white text-sm font-medium transition-all hover:bg-gray-800 shadow-sm flex items-center justify-center gap-2">
                    Send Invite
                </button>
                <button onclick="editConfig()" class="w-full py-2 rounded-lg text-gray-500 text-sm font-medium hover:text-gray-900 transition-colors">
                    Back & Edit
                </button>
            </div>
        </div>

    </main>

    <script>
        // --- State Management ---
        const state = {
            user: null,
            team: null,
            role: null,
            sendEmail: false,
            sendWa: false
        };

        // --- Step 1 Logic ---

        // User Search Simulation
        const searchInput = document.getElementById('user-search');
        const resultsBox = document.getElementById('user-results');
        
        searchInput.addEventListener('focus', () => {
            resultsBox.classList.remove('hidden');
        });

        // Hide results when clicking outside is usually good, keeping simple for demo
        
        function selectUser(el, name, handle) {
            state.user = { name, handle };
            document.getElementById('sel-name').innerText = name;
            document.getElementById('sel-handle').innerText = handle;
            
            // UI Toggle
            searchInput.parentElement.classList.add('hidden');
            document.getElementById('selected-user-display').classList.remove('hidden');
            document.getElementById('selected-user-display').classList.add('flex');
            resultsBox.classList.add('hidden');
            
            validateStep1();
        }

        function clearUser() {
            state.user = null;
            searchInput.parentElement.classList.remove('hidden');
            searchInput.value = '';
            document.getElementById('selected-user-display').classList.add('hidden');
            document.getElementById('selected-user-display').classList.remove('flex');
            validateStep1();
        }

        function selectTeam(el, teamName) {
            // Visual reset
            document.querySelectorAll('.team-option').forEach(btn => {
                btn.classList.remove('bg-indigo-50', 'border-indigo-100');
                btn.querySelector('.check-icon').classList.add('hidden');
            });

            // Active State
            el.classList.add('bg-indigo-50');
            el.querySelector('.check-icon').classList.remove('hidden');

            state.team = teamName;
            
            // Show Profile section if "Frontend Core" is selected (Simulation of rule)
            if(teamName === 'Frontend Core' || teamName === 'Engineering') {
                document.getElementById('profile-section').classList.remove('hidden');
                document.getElementById('profile-section').classList.add('block', 'fade-in');
            } else {
                document.getElementById('profile-section').classList.add('hidden');
            }

            validateStep1();
        }

        function selectRole(el, roleName) {
            // Visual Reset
            document.querySelectorAll('.role-option').forEach(btn => {
                btn.classList.remove('bg-gray-900', 'text-white', 'border-gray-900');
                btn.classList.add('border-gray-200', 'text-gray-700');
                btn.querySelector('div').classList.remove('text-white');
                btn.querySelector('div').classList.add('text-gray-700');
            });

            // Active State
            el.classList.remove('border-gray-200', 'text-gray-700');
            el.classList.add('bg-gray-900', 'text-white', 'border-gray-900');
            el.querySelector('div').classList.remove('text-gray-700');
            el.querySelector('div').classList.add('text-white');

            state.role = roleName;
            validateStep1();
        }

        function validateStep1() {
            const btn = document.getElementById('btn-continue');
            if (state.user && state.team && state.role) {
                btn.disabled = false;
            } else {
                btn.disabled = true;
            }
        }

        function goToStep2() {
            // Populate summary
            document.getElementById('confirm-team').innerText = state.team;
            document.getElementById('confirm-role').innerText = state.role;

            document.getElementById('step-1').classList.add('hidden');
            document.getElementById('step-2').classList.remove('hidden');
        }

        function editConfig() {
            document.getElementById('step-2').classList.add('hidden');
            document.getElementById('step-1').classList.remove('hidden');
        }

        // --- Step 2 Logic ---

        function toggleCheckbox(boxId, iconId) {
            const box = document.getElementById(boxId);
            const icon = document.getElementById(iconId);
            
            // Check current state by class presence
            const isChecked = box.classList.contains('bg-gray-900');

            if (!isChecked) {
                // Check
                box.classList.remove('border-gray-300');
                box.classList.add('bg-gray-900', 'border-gray-900');
                icon.classList.remove('opacity-0', 'scale-75');
            } else {
                // Uncheck
                box.classList.remove('bg-gray-900', 'border-gray-900');
                box.classList.add('border-gray-300');
                icon.classList.add('opacity-0', 'scale-75');
            }
        }

        function copyLink() {
            navigator.clipboard.writeText("boom.co/invite/x8z9-q2p4-m5n6");
            showToast("Link copied to clipboard");
        }

        function finishProcess() {
            // In a real app, this would trigger API calls
            const waChecked = document.getElementById('wa-check').classList.contains('bg-gray-900');
            
            if (waChecked) {
                // Simulate deep link
                window.open('https://wa.me/?text=Join%20my%20team%20on%20Boom!', '_blank');
            }
            
            showToast("Invite sent successfully");
            
            // Reset UI after delay (optional)
            setTimeout(() => {
                // Logic to close modal usually goes here
            }, 2000);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.querySelector('span').innerText = msg;
            toast.classList.remove('opacity-0', 'translate-y-2');
            
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 3000);
        }
    </script>
</body>
