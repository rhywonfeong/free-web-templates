    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Tab Menu Styles */
        .tab-menu {
            position: relative;
        }
        
        .tab-indicator {
            position: absolute;
            bottom: 0;
            height: 2px;
            background-color: #3b82f6; /* Blue-500 */
            transition: all 0.3s ease;
        }
        
        .tab-content {
            display: none;
            height: 300px; /* Fixed height to prevent menu movement */
            overflow-y: auto; /* Allow scrolling if content is taller */
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <!-- Tab Menu -->
        <div class="mb-6">
            <div class="tab-menu flex border-b border-slate-800">
                <button class="tab-btn px-4 py-3 text-blue-400 font-medium flex-1 text-center relative" data-tab="tab1">Tab 1</button>
                <button class="tab-btn px-4 py-3 text-slate-400 font-medium flex-1 text-center relative" data-tab="tab2">Tab 2</button>
                <button class="tab-btn px-4 py-3 text-slate-400 font-medium flex-1 text-center relative" data-tab="tab3">Tab 3</button>
                <div class="tab-indicator"></div>
            </div>
        </div>

        <!-- Tab Content -->
        <div class="tab-content active" id="tab1-content">
            <div class="bg-slate-900 rounded-lg border border-slate-800 p-6">
                <h2 class="text-xl font-semibold mb-4">Tab 1 Content</h2>
                <p class="text-slate-400">This is the content for the first tab. It's kept simple as requested.</p>
            </div>
        </div>

        <div class="tab-content" id="tab2-content">
            <div class="bg-slate-900 rounded-lg border border-slate-800 p-6">
                <h2 class="text-xl font-semibold mb-4">Tab 2 Content</h2>
                <p class="text-slate-400">This is the content for the second tab. All tabs have the same height to prevent menu movement.</p>
            </div>
        </div>

        <div class="tab-content" id="tab3-content">
            <div class="bg-slate-900 rounded-lg border border-slate-800 p-6">
                <h2 class="text-xl font-semibold mb-4">Tab 3 Content</h2>
                <p class="text-slate-400">This is the content for the third tab. The sliding indicator still works smoothly.</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            const tabIndicator = document.querySelector('.tab-indicator');
            
            // Set initial indicator position and width
            const activeTab = document.querySelector('.tab-btn');
            setIndicator(activeTab);
            
            // Add click event listeners to tab buttons
            tabButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Remove active class from all buttons and contents
                    tabButtons.forEach(btn => {
                        btn.classList.remove('text-blue-400');
                        btn.classList.add('text-slate-400');
                    });
                    tabContents.forEach(content => {
                        content.classList.remove('active');
                    });
                    
                    // Add active class to clicked button and corresponding content
                    this.classList.add('text-blue-400');
                    this.classList.remove('text-slate-400');
                    
                    const tabId = this.getAttribute('data-tab');
                    document.getElementById(`${tabId}-content`).classList.add('active');
                    
                    // Update indicator position
                    setIndicator(this);
                });
            });
            
            // Function to set indicator position and width
            function setIndicator(element) {
                const width = element.offsetWidth;
                const left = element.offsetLeft;
                
                tabIndicator.style.width = `${width}px`;
                tabIndicator.style.left = `${left}px`;
            }
            
            // Update indicator position on window resize
            window.addEventListener('resize', function() {
                const activeTab = document.querySelector('.tab-btn.text-blue-400');
                setIndicator(activeTab);
            });
        });
    </script>
</body>
</html>
