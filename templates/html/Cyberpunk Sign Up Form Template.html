<!DOCTYPE html>
<html lang="en"><head><script id="aura-preview-performance-controller">
(function() {
if (window.__auraPreviewPerformanceController) return;
const nativeRequestAnimationFrame = window.requestAnimationFrame
? window.requestAnimationFrame.bind(window)
: function(callback) { return window.setTimeout(function() { callback(Date.now()); }, 16); };
const nativeCancelAnimationFrame = window.cancelAnimationFrame
? window.cancelAnimationFrame.bind(window)
: window.clearTimeout.bind(window);
const nativeSetInterval = window.setInterval.bind(window);
let paused = false;
let nextFrameId = 1;
const frameRecords = new Map();
const pausedFrameCallbacks = new Map();
const style = document.createElement('style');
style.id = 'aura-preview-performance-style';
style.textContent = [
'html[data-aura-preview-paused="true"] *,',
'html[data-aura-preview-paused="true"] *::before,',
'html[data-aura-preview-paused="true"] *::after {',
'  animation-play-state: paused !important;',
'  transition-duration: 0s !important;',
'  scroll-behavior: auto !important;',
'}'
].join('\n');
document.head.appendChild(style);
window.requestAnimationFrame = function(callback) {
const frameId = nextFrameId++;
if (paused) {
pausedFrameCallbacks.set(frameId, callback);
frameRecords.set(frameId, { paused: true });
return frameId;
}
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });
return frameId;
};
window.cancelAnimationFrame = function(frameId) {
const record = frameRecords.get(frameId);
pausedFrameCallbacks.delete(frameId);
if (record && typeof record.nativeFrameId !== 'undefined') {
nativeCancelAnimationFrame(record.nativeFrameId);
}
frameRecords.delete(frameId);
};
window.setInterval = function(callback, delay) {
const args = Array.prototype.slice.call(arguments, 2);
return nativeSetInterval(function() {
if (paused) return;
callback.apply(this, args);
}, delay);
};
const flushPausedFrames = function() {
const callbacks = Array.from(pausedFrameCallbacks.entries());
pausedFrameCallbacks.clear();
callbacks.forEach(function(entry) {
const frameId = entry[0];
const callback = entry[1];
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });
});
};
const setPaused = function(nextPaused) {
const shouldPause = Boolean(nextPaused);
if (paused === shouldPause) return;
paused = shouldPause;
document.documentElement.toggleAttribute('data-aura-preview-paused', paused);
if (!paused) {
flushPausedFrames();
}
};
window.__auraPreviewPerformanceController = {
setPaused: setPaused,
get paused() {
return paused;
}
};
window.addEventListener('message', function(event) {
if (event.source !== window.parent) return;
if (!event.data || event.data.type !== 'aura-preview-performance-mode') return;
setPaused(event.data.paused);
});

<style>
:root {
--bg-page: #0a0c12;
--bg-component: #181c27;
--bg-input: rgba(30, 35, 50, 0.6);
--bg-button-primary: #00f0c0;
--bg-button-primary-hover: #00ffde;
--text-primary: #e0e7ff;
--text-secondary: #a0aed0;
--text-muted: #707a95;
--text-heading: #ffffff;
--border-color: #3a3f5e;
--border-input: #3a3f5e;
--border-radius-base: 6px;
--border-radius-lg: 8px;
--shadow-color-rgb: 0, 240, 192;
--shadow-md: 0 0 18px rgba(var(--shadow-color-rgb), 0.4);
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Fira Code', monospace;
}
body {
background-color: var(--bg-page);
color: var(--text-primary);
min-height: 100vh;
display: grid;
place-items: center;
padding: 20px;
}
.login-form-wrapper {
background-color: var(--bg-component);
padding: 30px 40px;
border-radius: var(--border-radius-lg);
box-shadow: var(--shadow-md);
width: 100%;
max-width: 420px;
border: 1px solid var(--border-color);
transition: all 0.25s;
}
.login-form-title {
font-size: 1.8rem;
font-weight: 600;
color: var(--text-heading);
text-align: center;
margin-bottom: 25px;
}
.social-login-buttons {
display: flex;
flex-direction: column;
gap: 15px;
margin-bottom: 25px;
}
.c-btn-social {
display: flex;
align-items: center;
justify-content: center;
width: 100%;
padding: 12px;
font-size: 0.95rem;
border-radius: var(--border-radius-base);
transition: all 0.15s;
border: 1px solid var(--border-input);
background-color: var(--bg-input);
color: var(--text-secondary);
cursor: pointer;
}
.c-btn-social:hover {
background-color: rgba(50, 55, 70, 0.7);
transform: translateY(-1px);
}
.social-icon {
width: 20px;
height: 20px;
margin-right: 10px;
vertical-align: middle;
}
.c-btn-google {
background-color: #333;
color: #fff;
border-color: #555;
}
.c-btn-google:hover {
background-color: #444;
}
.form-divider {
text-align: center;
margin: 25px 0;
font-size: 0.9rem;
color: var(--text-muted);
display: flex;
align-items: center;
}
.form-divider::before,
.form-divider::after {
content: '';
flex-grow: 1;
height: 1px;
background-color: var(--border-color);
margin: 0 10px;
}
.form-group {
margin-bottom: 20px;
}
.form-group label {
display: block;
font-weight: 500;
margin-bottom: 8px;
color: var(--text-secondary);
font-size: 0.9rem;
}
.form-control {
width: 100%;
padding: 12px 15px;
font-size: 1rem;
border: 1px solid var(--border-input);
border-radius: var(--border-radius-base);
background-color: var(--bg-input);
color: var(--text-primary);
transition: all 0.15s;
}
.form-control:focus {
outline: none;
border-color: var(--bg-button-primary);
box-shadow: 0 0 0 2px rgba(0, 240, 192, 0.5), 0 0 15px rgba(0, 240, 192, 0.5);
}
.form-control::placeholder {
color: var(--text-muted);
opacity: 1;
}
.c-btn {
display: block;
width: 100%;
padding: 12px 15px;
font-size: 1rem;
font-weight: 500;
text-align: center;
border-radius: var(--border-radius-base);
cursor: pointer;
transition: all 0.15s;
border: 1px solid transparent;
position: relative;
overflow: hidden;
}
.c-btn-primary {
background: var(--bg-button-primary);
color: var(--bg-page);
border-color: var(--bg-button-primary);
box-shadow: 0 0 10px rgba(var(--shadow-color-rgb), 0.4), 0 0 20px rgba(var(--shadow-color-rgb), 0.2);
}
.c-btn-primary:hover {
background: var(--bg-button-primary-hover);
box-shadow: 0 0 18px rgba(var(--shadow-color-rgb), 0.6), 0 0 35px rgba(var(--shadow-color-rgb), 0.3);
transform: translateY(-2px) scale(1.03);
}

.login-form-wrapper {
padding: 20px;
}
.form-control,
.c-btn {
font-size: 0.95rem;
padding: 10px 12px;
}
}
