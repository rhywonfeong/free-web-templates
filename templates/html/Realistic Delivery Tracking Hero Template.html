<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realistic Delivery Tracking</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
body {
background-color: #000000;
margin: 0;
overflow: hidden;
}
/* Animation de rotation de la texture terrestre */
@keyframes rotateEarth {
0% { background-position: 0 0; }
100% { background-position: -200% 0; } /* Défilement de la texture */
}
/* Animation de la camionnette sur le chemin */
@keyframes driveRoute {
0% { offset-distance: 0%; opacity: 0; transform: scale(0.8); }
10% { opacity: 1; transform: scale(1); }
90% { opacity: 1; transform: scale(1); }
100% { offset-distance: 100%; opacity: 0; transform: scale(0.8); }
}
/* Le globe lui-même */
.globe-container {
width: 350px;
height: 350px;
border-radius: 50%;
position: relative;
/* Ombre portée externe (lueur atmosphérique) */
box-shadow: 0 0 50px rgba(79, 114, 205, 0.2), -10px -10px 20px rgba(255, 255, 255, 0.05) inset;
background-color: #000510;
transform: translateZ(0); /* Hardware accel */
}
/* La texture de la carte (Image satellite) */
.earth-texture {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
border-radius: 50%;
/* Texture réaliste de la NASA/Wikipedia (Projection équirectangulaire) */
background: url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Earthmap1000x500.jpg/1000px-Earthmap1000x500.jpg');
background-size: 210% 100%; /* Plus large pour permettre le défilement */
opacity: 0.9;
animation: rotateEarth 40s linear infinite;
}
/* Ombre interne pour l'effet sphérique 3D (Terminator line illusion) */
.sphere-shading {
position: absolute;
inset: 0;
border-radius: 50%;
background: radial-gradient(circle at 30% 30%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0.95) 100%);
z-index: 10;
pointer-events: none;
}
/* Reflet atmosphérique brillant sur le bord */
.atmosphere-glow {
position: absolute;
inset: -2px;
border-radius: 50%;
box-shadow: inset 0 0 20px rgba(100, 180, 255, 0.3);
z-index: 20;
pointer-events: none;
}
/* Le véhicule */
.van-wrapper {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 30;
pointer-events: none;
}
.driving-van {
/* Chemin SVG converti en CSS offset-path */
offset-path: path("M 60 220 Q 150 240 250 160 T 400 120");
animation: driveRoute 8s linear infinite;
position: absolute;
}
</style></head>
<body class="w-full h-screen flex items-center justify-center bg-black">

    <!-- Container Principal -->
    <div class="relative flex items-center justify-center">

        <!-- Étoiles en arrière plan (subtil) -->
        <div class="absolute inset-0 w-[800px] h-[800px] -translate-x-1/2 -translate-y-1/2 left-1/2 top-1/2 opacity-30 pointer-events-none" 
             style="background-image: radial-gradient(white 1px, transparent 1px); background-size: 50px 50px;">
        </div>

        <!-- Le Globe -->
        <div class="globe-container">
            <!-- Couche Texture Terre -->
            <div class="earth-texture"></div>
            
            <!-- Couche Ombres (Effet 3D) -->
            <div class="sphere-shading"></div>
            
            <!-- Couche Atmosphère (Lueur bleue) -->
            <div class="atmosphere-glow"></div>

            <!-- Trajectoire et Camionnette -->
            <div class="absolute inset-0 z-30">
                <svg width="100%" height="100%" viewBox="0 0 350 350" class="overflow-visible opacity-60 mix-blend-screen">
                    <!-- Ligne de trajectoire (pointillés blancs subtils) -->
                    <path d="M 60 220 Q 150 240 250 160 T 400 120" 
                          fill="none" 
                          stroke="white" 
                          stroke-width="1.5" 
                          stroke-dasharray="3 4"
                          stroke-linecap="round"
                          class="opacity-40" />
                    
                    <!-- Point de départ -->
                    <circle cx="60" cy="220" r="3" fill="white" class="animate-pulse" />
                    <circle cx="60" cy="220" r="8" stroke="white" stroke-width="0.5" fill="none" class="animate-ping opacity-50" />
                </svg>

                <!-- L'élément Camionnette -->
                <div class="van-wrapper">
                    <div class="driving-van">
                        <!-- Rendu "Réel" de la camionnette: 
                             Utilisation d'un bloc blanc solide avec ombre portée pour simuler un objet physique 3D -->
                        <div class="relative -translate-x-1/2 -translate-y-1/2">
                            <div class="bg-slate-100 text-slate-900 p-1.5 rounded shadow-[0_4px_10px_rgba(0,0,0,0.5)] border border-slate-300 transform -rotate-12 hover:scale-110 transition-transform">
                                <iconify-icon icon="lucide:truck" width="20" height="20" class="block"></iconify-icon>
                            </div>
                            <!-- Petit reflet/phare à l'avant -->
                            <div class="absolute -right-2 top-1/2 -translate-y-1/2 w-6 h-4 bg-white/20 blur-md rounded-full"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
