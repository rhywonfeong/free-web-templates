  <meta charset="UTF-8">

  <style>
    @keyframes tick {
      0% { transform: scale(0); opacity: 0; }

<body class="bg-dark text-white min-h-screen flex items-center justify-center font-manrope p-4">

    <div class="flex items-center gap-3 mb-2">

    <p class="text-sm text-white/70 mb-2">Radar chart: Key Metrics</p>
    <div class="w-60 h-60 mx-auto relative">
      <svg viewBox="0 0 240 240" class="w-full h-full" id="radar-chart">
        <!-- Background radar rings and axes -->
        <g opacity="0.3" stroke="#fff">
          <polygon points="120,30 198,75 198,165 120,210 42,165 42,75" fill="none"/>

          <line x1="42" y1="75" x2="198" y2="165"/>

        </g>
        <!-- Data polygon (orange connected dots) -->

          fill="none" stroke="#F7931A" stroke-width="2"/>
        <!-- Animated dots for metrics -->
        <circle cx="120" cy="45" r="6" fill="#F7931A" class="dot" style="opacity:0"/>
        <circle cx="192" cy="90" r="6" fill="#F7931A" class="dot" style="opacity:0"/>
        <circle cx="177" cy="165" r="6" fill="#F7931A" class="dot" style="opacity:0"/>
        <circle cx="120" cy="195" r="6" fill="#F7931A" class="dot" style="opacity:0"/>

        <!-- Labels -->
        <text x="120" y="22" text-anchor="middle" fill="#fff" font-size="12">Price</text>
        <text x="210" y="82" text-anchor="start" fill="#fff" font-size="12">Volume</text>

        <span class="block font-semibold text-white text-lg animated-num" data-target="29000000000">$0</span>

      </div>
      <div>
        <span class="block text-white/70 text-xs">Tx/24h</span>
        <span class="block font-semibold text-white text-lg animated-num" data-target="320000">0</span>

    </div>
    <script>
      // Animate dots (tick-in)
      window.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.dot').forEach((circle, i) => {
          setTimeout(() => {
            circle.classList.add('tick-anim');
            circle.style.opacity = 1;
          }, i*130+150);
        });

        // Animate numbers
        function animateValue(el, to, decimals, prefix = "", suffix = "") {
          let start = 0;
          let duration = 1200;
          let startTime;

          function step(ts) {
            if(!startTime) startTime = ts;
            let progress = Math.min((ts - startTime) / duration, 1);
            let value = start + (to - start) * progress;

            if (decimals === 0)
              value = Math.round(value);
            else
              value = value.toFixed(decimals);

            if(prefix === "$") {
              // format large numbers for $ (K, M, B)
              if(to >= 1e9)
                value = `$${(value/1e9).toFixed(2)}B`;
              else if(to >= 1e6)
                value = `$${(value/1e6).toFixed(1)}M`;
              else if(to >= 1e3)
                value = `$${(value/1e3).toFixed(0)}K`;
              else
                value = `$${value}`;
            } else if(suffix === "%") {
              value = `${value}%`;
            } else if(suffix === " BTC") {
              value = `${value} BTC`;
            }
            el.textContent = value;

            if (progress < 1) requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        }

        document.querySelectorAll('.animated-num').forEach((el, i) => {
          let to = parseFloat(el.dataset.target);
          let decimals = 0, prefix = "", suffix = "";
          if(i === 0)
            prefix = "$", decimals = 0;
          else if(i === 1 || i === 2)
            prefix = "$", decimals = 0;
          else if(i === 3)
            decimals = 1, suffix = " BTC";
          else if(i === 4)
            decimals = 1, suffix = "%";
          else
            decimals = 0;
          setTimeout(() => animateValue(el, to, decimals, prefix, suffix), i*150+800);
        });
      });
    </script>
  </div>
