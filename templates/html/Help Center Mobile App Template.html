<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Support & Help Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-[#F7F9FC] font-[Inter] text-gray-900 antialiased min-h-screen flex justify-center items-start sm:py-8 sm:bg-gray-100">

    <!-- Mobile Device Simulator Container -->
    <div class="w-full max-w-[375px] bg-[#F7F9FC] min-h-[812px] flex flex-col relative sm:shadow-[0_8px_40px_rgba(0,0,0,0.08)] sm:border sm:border-gray-200 sm:rounded-[2.5rem] overflow-hidden bg-white">
        
        <!-- Top Navigation -->
        <header class="px-5 pt-12 pb-2 flex items-center justify-between bg-white/80 backdrop-blur-md sticky top-0 z-20">
            <button class="w-9 h-9 flex items-center justify-center rounded-full bg-white border border-gray-100 text-gray-600 shadow-sm hover:bg-gray-50 transition-colors focus:outline-none focus:ring-2 focus:ring-gray-200">
                <iconify-icon icon="solar:alt-arrow-left-linear" width="20" height="20" style="stroke-width: 1.5;"></iconify-icon>
            </button>
            <span class="font-medium text-xs tracking-widest text-gray-400 uppercase">K R A</span>
            <div class="w-9"></div> <!-- Spacer for center alignment -->
        </header>

        <!-- Scrollable Content -->
        <main class="flex-1 overflow-y-auto overflow-x-hidden flex flex-col bg-[#F7F9FC]">
            
            <!-- Hero Section -->
            <section class="px-5 pt-6 pb-6 bg-white rounded-b-3xl shadow-[0_2px_10px_rgba(0,0,0,0.02)] z-10 relative">
                <h1 class="text-2xl font-semibold tracking-tight text-gray-900 mb-5">
                    How can we help, Marc?
                </h1>

                <!-- Search Bar -->
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 group-focus-within:text-blue-500 transition-colors">
                        <iconify-icon icon="solar:magnifer-linear" width="18" height="18" style="stroke-width: 1.5;"></iconify-icon>
                    </div>
                    <input type="text" 
                           placeholder="Search for topics (e.g., Payouts, Damaged Items)" 
                           class="w-full pl-10 pr-4 py-3.5 bg-[#F7F9FC] border border-transparent rounded-xl text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:bg-white focus:border-blue-100 focus:ring-4 focus:ring-blue-50 transition-all">
                </div>
            </section>

            <div class="px-5 py-6 flex-1 flex flex-col">
                
                <!-- Primary Action (Live Chat) -->
                <section class="mb-8">
                    <div class="bg-white rounded-[1.25rem] p-5 relative overflow-hidden group cursor-pointer transition-transform hover:scale-[1.01]" 
                         style="box-shadow: 0 4px 20px -2px rgba(0,0,0,0.03), 0 0 0 1px rgba(0,0,0,0.02);">
                        
                        <!-- Soft Glow Background -->
                        <div class="absolute -top-12 -right-12 w-40 h-40 bg-blue-400/10 rounded-full blur-3xl group-hover:bg-blue-400/20 transition-colors duration-500"></div>

                        <div class="relative z-10 flex items-start space-x-4">
                            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-50 to-blue-100 border border-blue-100 flex items-center justify-center flex-shrink-0 text-blue-600 shadow-sm">
                                <iconify-icon icon="solar:chat-round-dots-linear" width="24" height="24" style="stroke-width: 1.5;"></iconify-icon>
                            </div>
                            <div class="pt-1">
                                <h2 class="text-base font-medium text-gray-900 mb-1.5">Live Chat with Admin</h2>
                                <div class="flex items-center space-x-2">
                                    <span class="relative flex h-2 w-2">
                                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                                    </span>
                                    <span class="text-xs text-gray-500 font-medium tracking-wide">Admin is Online - Replies in < 5 mins</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Categorized Help (Bento Grid) -->
                <section class="mb-8">
                    <div class="grid grid-cols-2 gap-3">
                        
                        <!-- Tile 1: Deliveries -->
                        <button class="flex flex-col items-start p-4 bg-white rounded-2xl border border-gray-100 shadow-[0_2px_8px_rgba(0,0,0,0.01)] hover:border-gray-200 hover:shadow-sm transition-all text-left group">
                            <div class="w-9 h-9 rounded-xl bg-orange-50 text-orange-500 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                <iconify-icon icon="solar:box-linear" width="20" height="20" style="stroke-width: 1.5;"></iconify-icon>
                            </div>
                            <span class="text-sm font-medium text-gray-900">Deliveries</span>
                        </button>

                        <!-- Tile 2: Payments -->
                        <button class="flex flex-col items-start p-4 bg-white rounded-2xl border border-gray-100 shadow-[0_2px_8px_rgba(0,0,0,0.01)] hover:border-gray-200 hover:shadow-sm transition-all text-left group">
                            <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-500 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                <iconify-icon icon="solar:wallet-linear" width="20" height="20" style="stroke-width: 1.5;"></iconify-icon>
                            </div>
                            <span class="text-sm font-medium text-gray-900">Payments</span>
                        </button>

                        <!-- Tile 3: App Issues -->
                        <button class="flex flex-col items-start p-4 bg-white rounded-2xl border border-gray-100 shadow-[0_2px_8px_rgba(0,0,0,0.01)] hover:border-gray-200 hover:shadow-sm transition-all text-left group">
                            <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-500 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                <iconify-icon icon="solar:smartphone-linear" width="20" height="20" style="stroke-width: 1.5;"></iconify-icon>
                            </div>
                            <span class="text-sm font-medium text-gray-900">App Issues</span>
                        </button>

                        <!-- Tile 4: Safety -->
                        <button class="flex flex-col items-start p-4 bg-white rounded-2xl border border-gray-100 shadow-[0_2px_8px_rgba(0,0,0,0.01)] hover:border-gray-200 hover:shadow-sm transition-all text-left group">
                            <div class="w-9 h-9 rounded-xl bg-rose-50 text-rose-500 flex items-center justify-center mb-3 group-hover:scale-110 transition-transform">
                                <iconify-icon icon="solar:shield-warning-linear" width="20" height="20" style="stroke-width: 1.5;"></iconify-icon>
                            </div>
                            <span class="text-sm font-medium text-gray-900">Safety</span>
                        </button>

                    </div>
                </section>

                <!-- Top Frequent Questions -->
                <section class="flex-grow pb-8">
                    <h3 class="text-xs font-medium text-gray-400 uppercase tracking-widest mb-3 px-1">Top Questions</h3>
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-[0_2px_8px_rgba(0,0,0,0.01)] overflow-hidden">
                        
                        <!-- Question 1 -->
                        <button class="w-full flex items-center justify-between p-4 border-b border-gray-50 hover:bg-gray-50/80 transition-colors text-left group focus:outline-none focus:bg-gray-50">
                            <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900 transition-colors pr-4">When will my commission be unlocked?</span>
                            <iconify-icon icon="solar:alt-arrow-right-linear" width="18" height="18" class="text-gray-300 group-hover:text-gray-500 transition-colors flex-shrink-0" style="stroke-width: 1.5;"></iconify-icon>
                        </button>

                        <!-- Question 2 -->
                        <button class="w-full flex items-center justify-between p-4 border-b border-gray-50 hover:bg-gray-50/80 transition-colors text-left group focus:outline-none focus:bg-gray-50">
                            <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900 transition-colors pr-4">What to do if a customer doesn't show up?</span>
                            <iconify-icon icon="solar:alt-arrow-right-linear" width="18" height="18" class="text-gray-300 group-hover:text-gray-500 transition-colors flex-shrink-0" style="stroke-width: 1.5;"></iconify-icon>
                        </button>

                        <!-- Question 3 -->
                        <button class="w-full flex items-center justify-between p-4 hover:bg-gray-50/80 transition-colors text-left group focus:outline-none focus:bg-gray-50">
                            <span class="text-sm font-medium text-gray-700 group-hover:text-gray-900 transition-colors pr-4">How to change my Orange Money number?</span>
                            <iconify-icon icon="solar:alt-arrow-right-linear" width="18" height="18" class="text-gray-300 group-hover:text-gray-500 transition-colors flex-shrink-0" style="stroke-width: 1.5;"></iconify-icon>
                        </button>

                    </div>
                </section>

                <!-- Emergency Contact -->
                <section class="mt-auto pt-4 pb-6">
                    <button class="w-full flex items-center justify-center space-x-2.5 py-3.5 bg-gray-100 rounded-xl hover:bg-gray-200 transition-colors text-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-300 focus:ring-offset-2 focus:ring-offset-[#F7F9FC]">
                        <iconify-icon icon="solar:phone-calling-linear" width="18" height="18" style="stroke-width: 1.5;"></iconify-icon>
                        <span class="text-sm font-medium tracking-wide">Urgent? Call our Hotline</span>
                    </button>
                </section>

            </div>
        </main>
    </div>

</body>
</html>
