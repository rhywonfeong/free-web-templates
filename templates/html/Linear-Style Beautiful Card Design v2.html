  <meta charset="UTF-8">
  <title>Linear Style Card</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,600&display=swap" rel="stylesheet">
  <style>
    body {
      background: #f4f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    .linear-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(20, 20, 40, 0.06);
      padding: 32px 40px 28px 40px;
      max-width: 400px;
      width: 100%;
      border: 1px solid #e0e3e8;
      position: relative;
      transition: box-shadow 0.25s;
    }
    .linear-card::before {
      content: '';
      display: block;
      height: 4px;
      width: 54px;
      border-radius: 2px;
      background: linear-gradient(90deg, #7b61ff, #4c8cff 80%);
      position: absolute;
      top: 22px;
      left: 40px;
    }
    .linear-card h2 {
      margin-top: 32px;
      margin-bottom: 14px;
      font-size: 1.6rem;
      font-weight: 600;
      color: #23272f;
      letter-spacing: -1px;
    }
    .linear-card p {
      color: #636871;
      font-size: 1.07rem;
      margin: 0 0 18px 0;
      line-height: 1.6;
    }
    .linear-card .card-btn {
      display: inline-block;
      background: #7b61ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: background 0.18s;
    }
    .linear-card .card-btn:hover {
      background: #6353c9;
    }
  </style>
</head>
<body>
  <div class="linear-card">
    <h2>You're Invited!</h2>
    <p>
      Discover seamless project management with Linear.<br>
      Clean. Fast. Delightful.<br>
      Join our exclusive launch event and experience productivity reimagined.
    </p>
    <a href="#" class="card-btn">Learn More</a>
  </div>
</body>
