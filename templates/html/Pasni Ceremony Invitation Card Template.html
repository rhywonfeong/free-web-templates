<!DOCTYPE html>
<html lang="en">
<head>
<script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasni Ceremony Invitation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Quicksand', sans-serif; }
.font-rounded { font-family: 'Fredoka', sans-serif; }
.font-handwriting { font-family: 'Caveat', cursive; }
/* Smooth floating animation for hanging items */
@keyframes sway {
0%, 100% { transform: rotate(-3deg); }
50% { transform: rotate(3deg); }
}
@keyframes float-y {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(-5px); }
}
.animate-sway { animation: sway 3s ease-in-out infinite; transform-origin: top center; }
.animate-float { animation: float-y 4s ease-in-out infinite; }
/* Dashed border rotation */
@keyframes spin-slow {
from { transform: rotate(0deg); }
to { transform: rotate(360deg); }
}
.animate-spin-slow { animation: spin-slow 20s linear infinite; }
</style></head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-0 sm:p-4">

    <!-- Mobile Card Container -->
    <main class="relative w-full max-w-[420px] min-h-[850px] bg-white sm:rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col items-center text-center">

        <!-- Top Bunting Decoration -->
        <div class="absolute top-0 left-0 right-0 h-16 z-10 flex justify-between px-2 overflow-hidden">
            <!-- Garland Items -->
            <div class="w-full flex justify-between items-start -mt-2">
                <div class="w-8 h-10 bg-rose-200 rounded-b-full mx-1"></div>
                <div class="w-8 h-12 bg-amber-100 rounded-b-full mx-1"></div>
                <div class="w-8 h-8 bg-sky-100 rounded-b-full mx-1"></div>
                <div class="w-8 h-11 bg-rose-100 rounded-b-full mx-1"></div>
                <div class="w-8 h-9 bg-amber-200 rounded-b-full mx-1"></div>
                <div class="w-8 h-12 bg-sky-200 rounded-b-full mx-1"></div>
                <div class="w-8 h-10 bg-rose-200 rounded-b-full mx-1"></div>
            </div>
            <!-- String for garland -->
            <svg class="absolute top-0 left-0 w-full h-10 -z-10 text-gray-300" preserveAspectRatio="none">
                <path d="M0,0 Q50,20 100,0 T200,0 T300,0 T420,0" stroke="currentColor" fill="none" stroke-width="2" />
            </svg>
        </div>

        <!-- Hanging Elements (Stars & Bottles) -->
        <div class="absolute top-0 w-full h-full pointer-events-none z-20">
            
            <!-- Hanging Star Left -->
            <div class="absolute left-8 -top-4 animate-sway" style="animation-delay: 0.5s;">
                <div class="h-24 w-0.5 bg-amber-200 mx-auto"></div>
                <div class="text-amber-300 drop-shadow-sm bg-white rounded-full p-1 border-2 border-amber-100">
                    <i data-lucide="star" class="w-8 h-8 fill-amber-300"></i>
                </div>
            </div>

            <!-- Hanging Bottle Right -->
            <div class="absolute right-8 -top-8 animate-sway" style="animation-delay: 1.2s;">
                <div class="h-32 w-0.5 bg-rose-200 mx-auto"></div>
                <div class="bg-white rounded-xl p-1.5 border-2 border-rose-100 shadow-sm transform rotate-12">
                    <i data-lucide="milk" class="w-8 h-8 text-rose-300 fill-rose-50"></i>
                </div>
            </div>

            <!-- Small Star Middle -->
            <div class="absolute left-1/4 -top-6 animate-sway" style="animation-delay: 2s;">
                <div class="h-16 w-0.5 bg-sky-200 mx-auto"></div>
                <div class="text-sky-300 bg-white rounded-full p-0.5">
                    <i data-lucide="star" class="w-5 h-5 fill-sky-200"></i>
                </div>
            </div>
        </div>

        <!-- Corner Blobs -->
        <div class="absolute top-0 left-0 w-64 h-64 bg-rose-50 rounded-full mix-blend-multiply filter blur-3xl opacity-60 -translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute top-20 right-0 w-72 h-72 bg-amber-50 rounded-full mix-blend-multiply filter blur-3xl opacity-60 translate-x-1/3 -translate-y-1/2"></div>
        <div class="absolute bottom-0 left-0 w-80 h-80 bg-sky-50 rounded-full mix-blend-multiply filter blur-3xl opacity-60 -translate-x-1/4 translate-y-1/4"></div>

        <!-- Main Content Area -->
        <div class="relative z-30 pt-28 px-6 w-full flex flex-col items-center">
            
            <!-- Intro Text -->
            <h3 class="text-gray-500 font-medium tracking-wide text-sm uppercase mb-6 flex items-center gap-2">
                <span class="w-8 h-[1px] bg-gray-300"></span>
                Pasni Ceremony
                <span class="w-8 h-[1px] bg-gray-300"></span>
            </h3>

            <!-- Photo Circle -->
            <div class="relative mb-8 group">
                <!-- Rotating Dashed Border -->
                <div class="absolute inset-0 border-[3px] border-dashed border-amber-300 rounded-full scale-110 animate-spin-slow"></div>
                
                <!-- Inner Photo Container -->
                <div class="w-48 h-48 rounded-full p-2 bg-white shadow-lg relative overflow-hidden ring-4 ring-orange-50">
                    <div class="w-full h-full rounded-full overflow-hidden relative">
                         <img src="https://images.unsplash.com/photo-1555252333-9f8e92e65df4?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Family" class="w-full h-full object-cover">
                    </div>
                </div>

                <!-- Floating Badge -->
                <div class="absolute -bottom-2 right-4 bg-white px-3 py-1 rounded-full shadow-md border border-rose-100 flex items-center gap-1 animate-float">
                    <span class="text-xs font-bold text-rose-400 font-rounded">1st Rice!</span>
                    <i data-lucide="sparkles" class="w-3 h-3 text-amber-400 fill-amber-400"></i>
                </div>
            </div>

            <!-- "A Sweet Celebration of" Text -->
            <div class="relative h-8 w-full mb-2">
                <svg viewBox="0 0 300 50" class="w-full h-full absolute top-0 left-0">
                    <path id="curve" d="M30,40 Q150,5 270,40" fill="transparent"/>
                    <text width="300">
                        <textPath xlink:href="#curve" startOffset="50%" text-anchor="middle" class="font-handwriting text-xl fill-gray-500 font-semibold tracking-wide">
                            A sweet celebration of
                        </textPath>
                    </text>
                </svg>
            </div>

            <!-- Main Name Title -->
            <h1 class="font-rounded text-6xl text-rose-300 font-bold tracking-tight mb-2 drop-shadow-sm leading-tight">
                Srinika Shah
            </h1>

            <!-- Subtitle with Hearts -->
            <div class="flex items-center justify-center gap-3 mb-8">
                <i data-lucide="heart" class="w-4 h-4 text-amber-300 fill-amber-200"></i>
                <span class="text-gray-400 font-medium tracking-widest text-sm uppercase">Rice Feeding</span>
                <i data-lucide="heart" class="w-4 h-4 text-amber-300 fill-amber-200"></i>
            </div>

            <!-- Invitation Body Text -->
            <div class="max-w-xs mx-auto space-y-4 mb-10">
                <p class="text-gray-600 leading-relaxed font-medium">
                    Join us as we celebrate her rice-feeding ceremony. 
                </p>
                <div class="text-sm bg-white/60 backdrop-blur-sm p-4 rounded-2xl border border-rose-100 text-gray-500 shadow-sm">
                    Event details will be lovingly shared personally via message.
                </div>
            </div>

            <!-- Footer -->
            <div class="mb-12 relative">
                <p class="font-handwriting text-3xl text-rose-400 rotate-2">
                    The Shah Family
                </p>
                <div class="absolute -right-6 -top-4">
                    <i data-lucide="flower" class="w-6 h-6 text-sky-200 fill-sky-100 animate-spin-slow"></i>
                </div>
            </div>

        </div>

        <!-- Bottom Decorations -->
        <div class="absolute bottom-0 w-full h-48 pointer-events-none z-20 overflow-hidden">
            <!-- Teddy Bear (Image Placeholder as per style) -->
            <div class="absolute -bottom-4 -left-4 w-32 h-32 transform rotate-12 z-10 filter drop-shadow-lg">
                <!-- Using a cute bear toy image -->
                <img src="https://images.unsplash.com/photo-1559454403-b8fb87521bc7?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" class="w-full h-full object-contain" alt="Teddy Bear">
            </div>

            <!-- Decorative Clouds/Shapes Bottom Right -->
            <div class="absolute -bottom-10 -right-10 w-56 h-56 bg-amber-100/80 rounded-full mix-blend-multiply blur-xl"></div>
            <div class="absolute bottom-8 right-8 text-rose-200 animate-float">
                <i data-lucide="cloud" class="w-12 h-12 fill-white"></i>
            </div>
            <div class="absolute bottom-20 right-20 text-sky-200 animate-float" style="animation-delay: 1.5s;">
                <i data-lucide="music" class="w-6 h-6"></i>
            </div>
        </div>

        <!-- Subtle Pattern Overlay -->
        <div class="absolute inset-0 opacity-[0.4] pointer-events-none z-0" style="background-image: radial-gradient(#FFD1DC 1px, transparent 1px); background-size: 24px 24px;"></div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
