<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
}
/* Custom iridescent shine animation/effect */
.cd-gradient {
background: conic-gradient(
from 225deg at 50% 50%,
#a855f7 0deg,
#3b82f6 60deg,
#06b6d4 110deg,
#e879f9 180deg,
#f472b6 240deg,
#8b5cf6 300deg,
#a855f7 360deg
);
}
</style></head>
<body class="bg-white min-h-screen flex flex-col items-center justify-center p-6 text-neutral-900">

    <!-- Main Layout -->
    <div class="flex flex-col items-center w-full max-w-sm">
        
        <!-- Card Container -->
        <div class="relative w-full bg-neutral-100 rounded-3xl shadow-lg p-8 border border-neutral-200 overflow-hidden">
            
            <!-- Top Left Identifier -->
            <div class="absolute top-6 left-6 text-neutral-400 font-mono text-sm select-none">[u]</div>

            <!-- CD Element -->
            <div class="flex justify-center mt-6 mb-10">
                <div class="relative w-64 h-64 rounded-full shadow-xl flex items-center justify-center group cursor-pointer">
                    
                    <!-- Outer Disc (Holographic Surface) -->
                    <div class="absolute inset-0 rounded-full cd-gradient opacity-90 shadow-inner"></div>
                    
                    <!-- Surface Sheen/Reflection -->
                    <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-white/30 via-transparent to-black/10 pointer-events-none"></div>
                    
                    <!-- Subtle Texture Lines -->
                    <div class="absolute inset-0 rounded-full border-[0.5px] border-white/20"></div>

                    <!-- Inner Hub Assembly -->
                    <!-- Dark Ring -->
                    <div class="absolute w-24 h-24 bg-neutral-900 rounded-full flex items-center justify-center shadow-2xl z-10">
                        <!-- Silver/White Ring -->
                        <div class="w-16 h-16 bg-neutral-200 rounded-full flex items-center justify-center border-2 border-white/50 shadow-sm">
                            <!-- Spindle Hole -->
                            <div class="w-6 h-6 bg-neutral-400/30 rounded-full border border-neutral-400/50 shadow-inner backdrop-blur-sm"></div>
                        </div>
                    </div>
                    
                    <!-- Subtle Rotation Animation on Hover -->
                    <div class="absolute inset-0 rounded-full transition-transform duration-1000 ease-out group-hover:rotate-12"></div>
                </div>
            </div>

            <!-- User Profile Info -->
            <div class="flex flex-col items-center gap-2">
                <div class="flex items-center gap-3">
                    <!-- Avatar -->
                    <img 
                        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?ixlib=rb-4.0.3&auto=format&fit=facearea&facepad=2&w=100&h=100&q=80" 
                        alt="User Avatar" 
                        class="w-7 h-7 rounded-full object-cover ring-2 ring-neutral-100 grayscale-[0.1]"
                    >
                    <!-- Username -->
                    <h2 class="text-xl font-medium text-neutral-900 tracking-tight">alexsmith123</h2>
                </div>
                
                <!-- Join Date -->
                <p class="text-base text-neutral-400 font-normal">Joined 10.10.2025</p>
            </div>
        </div>

        <!-- Edit Profile Action -->
        <button class="mt-8 text-base font-semibold text-neutral-900 hover:text-neutral-600 transition-colors focus:outline-none focus:ring-2 focus:ring-neutral-200 rounded-lg px-4 py-2">
            Edit profile
        </button>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
