<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spot Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script></head>
  <body class="min-h-screen bg-neutral-950 text-neutral-200" style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, Noto Sans, sans-serif;">
    <main class="flex items-start justify-center p-4 sm:p-6">
      <section class="w-full max-w-sm sm:max-w-[560px]">
        <!-- Card -->
        <div class="relative rounded-2xl border border-white/10 bg-neutral-900/70 backdrop-blur shadow-2xl overflow-hidden">
          <!-- Header -->
          <header class="px-4 py-4 sm:py-5 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <button class="h-11 w-11 min-w-11 flex items-center justify-center rounded-lg border border-white/10 bg-neutral-800/70 hover:bg-neutral-800 active:bg-neutral-800/80 transition" aria-label="Back">
                <i data-lucide="chevron-left" class="h-5 w-5 text-neutral-300"></i>
              </button>
              <div>
                <h1 class="text-[22px] sm:text-2xl font-semibold tracking-tight leading-tight">Spot grid</h1>
                <p class="text-sm text-neutral-500">Configure a manual grid strategy</p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button class="hidden sm:inline-flex items-center gap-2 h-11 px-3 rounded-lg border border-white/10 bg-neutral-800/70 hover:bg-neutral-800 active:bg-neutral-800/80 transition text-sm text-neutral-300">
                <i data-lucide="book-open" class="h-4 w-4"></i>
                Quick guide
              </button>
              <button class="h-11 w-11 min-w-11 flex items-center justify-center rounded-lg border border-white/10 bg-neutral-800/70 hover:bg-neutral-800 active:bg-neutral-800/80 transition" aria-label="More">
                <i data-lucide="more-horizontal" class="h-5 w-5 text-neutral-300"></i>
              </button>
            </div>
          </header>

          <!-- Tabs -->
          <div class="px-4">
            <div class="grid grid-cols-2 rounded-lg border border-white/10 bg-neutral-800/70 p-1">
              <button id="tab-ai" class="h-11 rounded-md text-sm text-neutral-400 hover:text-neutral-200 transition">AI strategies</button>
              <button id="tab-manual" class="relative h-11 rounded-md text-sm text-emerald-300">
                Manual
                <span class="absolute left-3 right-3 -bottom-[1px] h-0.5 bg-emerald-400 rounded-full"></span>
              </button>
            </div>
          </div>

          <!-- Form -->
          <form id="gridForm" class="px-4 pt-4 sm:pt-6 pb-28 space-y-5 sm:space-y-6">
            <!-- Pair selector (compact) -->
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <div class="h-8 w-8 rounded-lg overflow-hidden ring-1 ring-white/10">
                  <img src="https://images.unsplash.com/photo-1639322537504-6427a16b0a28?q=80&w=200&auto=format&fit=crop" alt="Asset" class="h-full w-full object-cover">
                </div>
                <div class="leading-tight">
                  <p class="text-sm font-medium tracking-tight">BTC / USDT</p>
                  <p class="text-xs text-neutral-500">Last price <span id="lastPrice" class="text-neutral-300">—</span></p>
                </div>
              </div>
              <button type="button" class="inline-flex items-center gap-2 h-10 px-3 rounded-lg border border-white/10 bg-neutral-800/70 hover:bg-neutral-800 active:bg-neutral-800/80 transition text-sm text-neutral-300">
                <i data-lucide="refresh-cw" class="h-4 w-4"></i>
                Sync
              </button>
            </div>

            <!-- Price range -->
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <label class="text-sm font-medium tracking-tight">Price range (USDT)</label>
                <button type="button" id="autoFill" class="inline-flex items-center gap-1 text-xs text-neutral-400 hover:text-neutral-200 transition">
                  <i data-lucide="sparkles" class="h-4 w-4"></i>
                  AI auto-fill
                </button>
              </div>
              <div class="flex items-center gap-2">
                <div class="relative flex-1">
                  <input id="lower" type="number" inputmode="decimal" placeholder="Lower limit" class="w-full h-11 rounded-lg bg-neutral-800/80 border border-white/10 px-3.5 text-sm text-neutral-200 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-white/20">
                  <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-500">USDT</span>
                </div>
                <span class="text-neutral-500 select-none px-1">—</span>
                <div class="relative flex-1">
                  <input id="upper" type="number" inputmode="decimal" placeholder="Upper limit" class="w-full h-11 rounded-lg bg-neutral-800/80 border border-white/10 px-3.5 text-sm text-neutral-200 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-white/20">
                  <span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-500">USDT</span>
                </div>
              </div>
            </div>

            <!-- Grid quantity -->
            <div class="space-y-2">
              <label class="text-sm font-medium tracking-tight">Grid quantity <span class="text-neutral-500">(2–500)</span></label>
              <div class="relative">
                <input id="grids" type="number" min="2" max="500" step="1" placeholder="2 - 500" class="w-full h-11 rounded-lg bg-neutral-800/80 border border-white/10 px-3.5 text-sm text-neutral-200 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-white/20">
                <div class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xs text-neutral-500">steps</div>
              </div>
              <p id="profitPerGrid" class="text-xs text-neutral-400">
                Profit per grid — 
              </p>
            </div>

            <!-- Investment amount -->
            <div class="space-y-3">
              <label class="text-sm font-medium tracking-tight">Investment amount</label>
              <div class="relative">
                <input id="amount" type="number" min="0" step="0.01" placeholder="≥ 0" class="w-full h-12 rounded-lg bg-neutral-800/80 border border-white/10 pr-24 pl-3.5 text-sm text-neutral-200 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-white/20">
                <!-- Currency dropdown -->
                <div class="absolute right-1.5 top-1/2 -translate-y-1/2">
                  <button id="currencyBtn" type="button" class="inline-flex items-center gap-1 h-9 px-3 rounded-md border border-white/10 bg-neutral-800 hover:bg-neutral-800/90 active:bg-neutral-800/80 transition text-sm text-neutral-200">
                    <span id="currencyLabel">USDT</span>
                    <i data-lucide="chevron-down" class="h-4 w-4 text-neutral-400"></i>
                  </button>
                </div>
                <!-- Menu -->
                <div id="currencyMenu" class="hidden absolute right-1.5 top-[52px] z-20 w-36 rounded-lg border border-white/10 bg-neutral-900 shadow-xl">
                  <button data-currency="USDT" class="w-full text-left px-3 py-2 text-sm text-neutral-300 hover:bg-neutral-800">USDT</button>
                  <button data-currency="USD" class="w-full text-left px-3 py-2 text-sm text-neutral-300 hover:bg-neutral-800">USD</button>
                  <button data-currency="BTC" class="w-full text-left px-3 py-2 text-sm text-neutral-300 hover:bg-neutral-800">BTC</button>
                </div>
              </div>

              <!-- Slider -->
              <div class="px-0">
                <div class="relative">
                  <input id="amountRange" type="range" min="0" max="100" step="1" value="0" class="w-full accent-emerald-400">
                  <!-- ticks -->
                  <div class="mt-2 grid grid-cols-5 text-[10px] text-neutral-500">
                    <span class="text-left">0</span>
                    <span class="text-center">25</span>
                    <span class="text-center">50</span>
                    <span class="text-center">75</span>
                    <span class="text-right">100%</span>
                  </div>
                </div>
                <div class="mt-1.5 flex items-center justify-between text-xs text-neutral-400">
                  <div class="flex items-center gap-2">
                    <div class="h-4 w-4 rounded-[6px] border border-white/10 bg-neutral-800/90 flex items-center justify-center">
                      <i data-lucide="circle" class="h-2.5 w-2.5 text-emerald-300"></i>
                    </div>
                    <span>Allocation <span id="allocPct" class="text-neutral-300">0%</span></span>
                  </div>
                  <div class="flex items-center gap-1">
                    Available <span id="available" class="text-neutral-300">0.00</span> <span id="availCur">USDT</span>
                  </div>
                </div>
              </div>

              <div class="flex items-center justify-between">
                <p class="text-xs text-neutral-500">Min order amount is determined by the exchange.</p>
              </div>
            </div>

            <!-- Advanced settings -->
            <div class="pt-2">
              <button id="advToggle" type="button" class="w-full flex items-center justify-between h-11 px-3 rounded-lg border border-white/10 bg-neutral-800/70 hover:bg-neutral-800 active:bg-neutral-800/80 transition">
                <span class="text-sm font-medium tracking-tight">Advanced settings</span>
                <i id="advIcon" data-lucide="chevron-down" class="h-4 w-4 text-neutral-400"></i>
              </button>

              <div id="advanced" class="hidden mt-3 space-y-4">
                <!-- Reference type -->
                <div class="space-y-2">
                  <label class="text-sm text-neutral-400">Reference price</label>
                  <div class="grid grid-cols-2 rounded-lg border border-white/10 bg-neutral-800/70 p-1">
                    <button type="button" data-ref="last" class="ref-btn h-10 rounded-md text-sm text-emerald-300 relative">
                      Last
                      <span class="absolute left-3 right-3 -bottom-[1px] h-0.5 bg-emerald-400 rounded-full"></span>
                    </button>
                    <button type="button" data-ref="mark" class="ref-btn h-10 rounded-md text-sm text-neutral-400 hover:text-neutral-200">Mark</button>
                  </div>
                </div>

                <!-- Stop loss / Take profit -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div class="space-y-2">
                    <label class="text-sm text-neutral-400">Take-profit price</label>
                    <input id="tp" type="number" inputmode="decimal" placeholder="Optional" class="w-full h-11 rounded-lg bg-neutral-800/80 border border-white/10 px-3.5 text-sm text-neutral-200 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-white/20">
                  </div>
                  <div class="space-y-2">
                    <label class="text-sm text-neutral-400">Stop-loss price</label>
                    <input id="sl" type="number" inputmode="decimal" placeholder="Optional" class="w-full h-11 rounded-lg bg-neutral-800/80 border border-white/10 px-3.5 text-sm text-neutral-200 placeholder-neutral-500 focus:outline-none focus:ring-2 focus:ring-white/20">
                  </div>
                </div>

                <!-- Post-only -->
                <div class="flex items-center gap-2">
                  <input id="postOnly" type="checkbox" class="peer h-5 w-5 rounded-[6px] border border-white/10 bg-neutral-800 appearance-none grid place-content-center transition focus:outline-none focus:ring-2 focus:ring-white/20">
                  <svg class="pointer-events-none absolute h-5 w-5 opacity-0 peer-checked:opacity-100 transition" viewBox="0 0 24 24" fill="none">
                    <path d="M5 12l4 4L19 7" stroke="rgb(110,231,183)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                  </svg>
                  <span class="text-sm text-neutral-300">Post-only</span>
                </div>
              </div>
            </div>
          </form>

          <!-- Sticky footer actions -->
          <div class="pointer-events-none absolute inset-x-0 bottom-0">
            <div class="h-10 bg-gradient-to-t from-neutral-900/90 to-transparent"></div>
          </div>
          <div class="sticky bottom-0 bg-neutral-900/80 backdrop-blur border-t border-white/10 px-4 py-3 sm:py-4">
            <div class="flex items-center gap-3">
              <button id="createBtn" type="button" class="h-11 flex-1 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/15 text-emerald-300 border border-emerald-500/20 hover:border-emerald-500/30 transition text-sm font-medium">
                Create
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      // Initialize icons
      document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons();
      });

      // State
      const availableBalance = 1200.00;
      const last = 64123.45;

      const el = (id) => document.getElementById(id);
      const lastPriceEl = el('lastPrice');
      const availableEl = el('available');
      const availCurEl = el('availCur');
      const amountRange = el('amountRange');
      const amountInput = el('amount');
      const allocPct = el('allocPct');
      const lower = el('lower');
      const upper = el('upper');
      const grids = el('grids');
      const profitPerGrid = el('profitPerGrid');
      const currencyBtn = el('currencyBtn');
      const currencyMenu = el('currencyMenu');
      const currencyLabel = el('currencyLabel');
      const autoFill = el('autoFill');
      const advToggle = el('advToggle');
      const advanced = el('advanced');
      const advIcon = el('advIcon');

      // Seed UI
      lastPriceEl.textContent = last.toLocaleString(undefined, {maximumFractionDigits: 2});
      availableEl.textContent = availableBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});

      // Currency dropdown
      currencyBtn.addEventListener('click', () => {
        currencyMenu.classList.toggle('hidden');
      });
      currencyMenu.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const c = btn.getAttribute('data-currency');
          currencyLabel.textContent = c;
          availCurEl.textContent = c;
          currencyMenu.classList.add('hidden');
        });
      });
      document.addEventListener('click', (e) => {
        if (!currencyBtn.contains(e.target) && !currencyMenu.contains(e.target)) {
          currencyMenu.classList.add('hidden');
        }
      });

      // Advanced toggle
      advToggle.addEventListener('click', () => {
        advanced.classList.toggle('hidden');
        advIcon.setAttribute('data-lucide', advanced.classList.contains('hidden') ? 'chevron-down' : 'chevron-up');
        lucide.createIcons();
      });

      // Reference toggle (tabs)
      document.querySelectorAll('.ref-btn').forEach(b => {
        b.addEventListener('click', () => {
          document.querySelectorAll('.ref-btn').forEach(x => {
            x.classList.remove('text-emerald-300');
            x.classList.add('text-neutral-400');
            const ul = x.querySelector('span');
            if (ul) ul.remove();
          });
          b.classList.remove('text-neutral-400');
          b.classList.add('text-emerald-300');
          const underline = document.createElement('span');
          underline.className = 'absolute left-3 right-3 -bottom-[1px] h-0.5 bg-emerald-400 rounded-full';
          b.appendChild(underline);
        });
      });

      // Auto-fill lower/upper around last price
      autoFill.addEventListener('click', () => {
        const spreadPct = 4 + Math.random() * 6; // 4–10%
        const spread = last * (spreadPct / 100);
        const low = Math.max(0, last - spread);
        const high = last + spread;
        lower.value = low.toFixed(2);
        upper.value = high.toFixed(2);
        computeProfit();
      });

      // Amount slider <-> input sync
      const syncFromRange = () => {
        const pct = Number(amountRange.value);
        const amt = (availableBalance * pct) / 100;
        amountInput.value = amt.toFixed(2);
        allocPct.textContent = pct + '%';
      };
      const syncFromInput = () => {
        const val = Math.max(0, Number(amountInput.value || 0));
        const pct = Math.min(100, Math.round((val / availableBalance) * 100));
        amountRange.value = isFinite(pct) ? pct : 0;
        allocPct.textContent = (isFinite(pct) ? pct : 0) + '%';
      };
      amountRange.addEventListener('input', syncFromRange);
      amountInput.addEventListener('input', syncFromInput);
      syncFromRange();

      // Profit per grid estimate
      function computeProfit() {
        const lo = Number(lower.value);
        const hi = Number(upper.value);
        const n = Number(grids.value);
        if (!lo || !hi || !n || n < 2 || hi <= lo) {
          profitPerGrid.textContent = 'Profit per grid —';
          return;
        }
        const step = (hi - lo) / (n - 1);
        const pct = (step / ((hi + lo) / 2)) * 100; // approx around mid price
        profitPerGrid.innerHTML = 'Profit per grid <span class="text-emerald-300">' + pct.toFixed(2) + '%</span> <span class="text-neutral-500">(~' + step.toFixed(2) + ' USDT)</span>';
      }
      [lower, upper, grids].forEach(i => i.addEventListener('input', computeProfit));

      // Create action
      document.getElementById('createBtn').addEventListener('click', () => {
        // Simple toast
        const toast = document.createElement('div');
        toast.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-sm rounded-xl border border-white/10 bg-neutral-900/95 shadow-xl px-4 py-3 flex items-center gap-3';
        toast.innerHTML = '<i data-lucide="check-circle" class="h-5 w-5 text-emerald-300"></i><div class="text-sm">Grid created (demo). This is a visual prototype.</div>';
        document.body.appendChild(toast);
        lucide.createIcons();
        setTimeout(() => toast.remove(), 3500);
      });
    </script>
  </body>
</html>
