  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Waves Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Waves animation keyframes */
    @keyframes wave-move {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    /* Gradient stroke for lines */
    .wave-gradient {
      stroke: url(#grad);
    }
    /* Animation speed varies per line */
    .wave1 { animation: wave-move 8s linear infinite; }
    .wave2 { animation: wave-move 12s linear infinite; opacity: .7; }
    .wave3 { animation: wave-move 16s linear infinite; opacity: .5;}
  </style>
</head>
<body class="bg-[#fbfafd] min-h-screen flex items-center justify-center">
  <div class="relative w-full max-w-md mx-auto">
    <!-- Waves Background -->
    <div class="absolute inset-0 -z-10 rounded-3xl overflow-hidden">
      <svg width="100%" height="100%" viewBox="0 0 460 260" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
        <defs>
          <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
            <stop stop-color="#7f72ff" />
            <stop offset="1" stop-color="#6ee7b7" />
          </linearGradient>
        </defs>
        <g>
          <g class="wave1">
            <path class="wave-gradient" stroke-width="3" fill="none"
                  d="M0 60 Q 55 40 115 65 Q 175 90 230 55 Q 285 15 340 60 Q 395 105 460 62" />
            <path class="wave-gradient" stroke-width="3" fill="none" 
                  d="M-460 60 Q -405 40 -345 65 Q -285 90 -230 55 Q -175 15 -120 60 Q -65 105 0 62" />
          </g>
          <g class="wave2">
            <path class="wave-gradient" stroke-width="2" fill="none"
                  d="M0 110 Q 60 90 120 115 Q 180 140 230 100 Q 280 60 340 100 Q 400 140 460 105" />
            <path class="wave-gradient" stroke-width="2" fill="none" 
                  d="M-460 110 Q -400 90 -340 115 Q -280 140 -230 100 Q -180 60 -120 100 Q -60 140 0 105" />
          </g>
          <g class="wave3">
            <path class="wave-gradient" stroke-width="1.5" fill="none"
                  d="M0 170 Q 50 150 110 175 Q 170 200 230 160 Q 290 120 350 170 Q 410 220 460 172" />
            <path class="wave-gradient" stroke-width="1.5" fill="none" 
                  d="M-460 170 Q -410 150 -350 175 Q -290 200 -230 160 Q -170 120 -110 170 Q -50 220 0 172" />
          </g>
        </g>
      </svg>
    </div>

    <!-- Card Content -->
    <div class="relative bg-white rounded-3xl shadow-xl overflow-hidden border border-[#ebebef] px-8 pt-10 pb-8">
      <div class="mb-6">
        <span class="inline-block px-3 py-1 text-xs font-medium bg-[#e1e0f6] text-[#6a5cdf] rounded-full">Waves</span>
      </div>
      <h2 class="text-2xl font-bold text-[#282a31] mb-2 tracking-tight">
        Minimal Linear Card
      </h2>
      <p class="text-[#717083] mb-6">
        A minimalistic card featuring animated line waves in a soft, modern style inspired by Linear. Built for clarity and simplicity.
      </p>
      <button class="px-5 py-2 rounded-xl bg-gradient-to-r from-[#7f72ff] to-[#6ee7b7] text-white font-semibold shadow-sm transition hover:scale-105 focus:outline-none">
        Get Started
      </button>
    </div>
  </div>
</body>
