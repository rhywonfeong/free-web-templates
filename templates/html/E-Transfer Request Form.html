<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Send E-Transfer</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f7fafd] min-h-screen flex items-center justify-center">
  <div class="w-[350px] max-w-full bg-white border border-[#e4e8ee] rounded-2xl shadow-sm px-8 py-7 flex flex-col gap-6 font-['Inter']">
    <div>
      <div class="text-2xl font-semibold text-[#212b40] mb-1">Send E-Transfer</div>
      <div class="text-xs text-[#7a859c]">Request money instantly by e-transfer.</div>
    </div>
    <form class="flex flex-col gap-5" autocomplete="off">
      <div class="flex flex-col gap-1">
        <label class="text-xs text-[#4577E3] font-medium" for="recipient">Recipient Email</label>
        <input type="email" id="recipient" placeholder="jane.doe@email.com"
          class="bg-[#f7fafd] border border-[#eaeaef] focus:border-[#4577E3] px-3 py-2 rounded-md outline-none text-base transition" required>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs text-[#4577E3] font-medium" for="amount">Amount</label>
        <input type="number" id="amount" placeholder="0.00"
          class="bg-[#f7fafd] border border-[#eaeaef] focus:border-[#4577E3] px-3 py-2 rounded-md outline-none text-base transition font-medium" min="0" step="any" required>
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs text-[#4577E3] font-medium" for="note">Message <span class="text-gray-400 font-normal">(optional)</span></label>
        <input id="note" type="text" placeholder="eg. Invoice #123 or Thanks!"
          class="bg-[#f7fafd] border border-[#eaeaef] focus:border-[#4577E3] px-3 py-2 rounded-md outline-none text-base transition">
      </div>
      <button type="submit" class="w-full bg-[#4577E3] hover:bg-[#3863c6] text-white rounded-lg py-3 font-semibold mt-2 transition">
        Send Request
      </button>
    </form>
  </div>
</body>
</html>
