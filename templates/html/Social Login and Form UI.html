    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Login Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-style-clay-ui: 'Nunito Sans', sans-serif;
            --font-current-main: var(--font-style-clay-ui);
            --font-current-heading: var(--font-style-clay-ui);
            --font-current-ui: var(--font-style-clay-ui);
            
            --bg-page: #e6e7ee;
            --bg-component: #e6e7ee;
            --bg-button-primary: #5A67D8;
            --bg-button-primary-hover: #4c58bf;
            
            --text-primary: #4A5568;
            --text-secondary: #718096;
            --text-muted: #A0AEC0;
            --text-heading: #2D3748;
            --text-accent: var(--bg-button-primary);
            --text-on-button-primary: #ffffff;
            
            --border-radius-base: 12px;
            --border-radius-lg: 18px;
            
            --shadow-clay-base-rgb: 174, 174, 192;
            --shadow-clay-light-rgb: 255, 255, 255;
            --shadow-clay-component: 8px 8px 16px rgba(var(--shadow-clay-base-rgb), 0.5), -8px -8px 16px rgba(var(--shadow-clay-light-rgb), 0.9);
            --shadow-clay-pressed: inset 5px 5px 10px rgba(var(--shadow-clay-base-rgb), 0.5), inset -5px -5px 10px rgba(var(--shadow-clay-light-rgb), 0.9);
            --shadow-clay-button-hover: inset 3px 3px 6px rgba(var(--shadow-clay-base-rgb), 0.4), inset -3px -3px 6px rgba(var(--shadow-clay-light-rgb), 0.8), 2px 2px 4px rgba(var(--shadow-clay-base-rgb), 0.2), -2px -2px 4px rgba(var(--shadow-clay-light-rgb), 0.5);
            --shadow-clay-button-primary: 6px 6px 12px rgba(var(--shadow-clay-base-rgb), 0.6), -6px -6px 12px rgba(var(--shadow-clay-light-rgb), 1);
            --shadow-clay-button-primary-active: var(--shadow-clay-pressed);
            
            --focus-ring-color: rgba(90, 103, 216, 0.3);
            --focus-ring-width: 2px;
            
            --transition-speed-fast: 0.15s;
            --transition-speed-normal: 0.25s;
            --transition-timing-function: ease-in-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-current-main);
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        
        .login-form-wrapper {
            background-color: var(--bg-component);
            padding: 30px 40px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-clay-component);
            width: 100%;
            max-width: 420px;
            border-color: transparent;
            transition: all var(--transition-speed-normal);
        }
        
        .login-form-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-heading);
            text-align: center;
            margin-bottom: 25px;
        }
        
        .social-login-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .c-btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            border-radius: var(--border-radius-base);
            transition: all var(--transition-speed-fast);
            border-color: transparent;
            background-color: var(--bg-component);
            color: var(--text-secondary);
            box-shadow: var(--shadow-clay-pressed);
            cursor: pointer;
        }
        
        .c-btn-social:hover {
            box-shadow: var(--shadow-clay-button-hover);
        }
        
        .social-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        .form-divider {
            text-align: center;
            margin: 25px 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }
        
        .form-divider::before, .form-divider::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background-color: var(--text-muted);
            margin: 0 10px;
            opacity: 0.3;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border-radius: var(--border-radius-base);
            background-color: var(--bg-component);
            color: var(--text-primary);
            box-shadow: var(--shadow-clay-pressed);
            border-color: transparent;
            transition: all var(--transition-speed-fast);
        }
        
        .form-control:focus {
            outline: none;
            box-shadow: var(--shadow-clay-pressed), 0 0 0 var(--focus-ring-width) var(--focus-ring-color);
        }
        
        .c-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            border-radius: var(--border-radius-base);
            cursor: pointer;
            transition: all var(--transition-speed-fast);
            border-color: transparent;
            position: relative;
            overflow: hidden;
        }
        
        .c-btn-primary {
            background: var(--bg-button-primary);
            color: var(--text-on-button-primary);
            box-shadow: var(--shadow-clay-button-primary);
        }
        
        .c-btn-primary:hover {
            background-color: var(--bg-button-primary-hover);
            box-shadow: 8px 8px 16px rgba(var(--shadow-clay-base-rgb), 0.5), -8px -8px 16px rgba(var(--shadow-clay-light-rgb), 0.9);
        }
        
        .c-btn-primary:active {
            box-shadow: var(--shadow-clay-button-primary-active);
        }
        
        @media (max-width: 480px) {
            .login-form-wrapper {
                padding: 20px;
            }
            
            .form-control, .c-btn {
                font-size: 0.95rem;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="login-form-wrapper">
        <h3 class="login-form-title">Join Instantly</h3>
        <div class="social-login-buttons">
            <button class="c-btn-social c-btn-google">
                <svg class="social-icon" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                </svg>
                Sign in with Google
            </button>
            <button class="c-btn-social">
                <svg class="social-icon" viewBox="0 0 24 24" fill="#1877F2">
                    <path d="M22.675 0h-21.35C.593 0 0 .593 0 1.325v21.351C0 23.407.593 24 1.325 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.732 0 1.325-.593 1.325-1.325V1.325C24 .593 23.407 0 22.675 0z"></path>
                </svg>
                Sign in with Facebook
            </button>
        </div>
        <div class="form-divider">OR USE EMAIL</div>
        <form action="#" method="POST" onsubmit="return false;">
            <div class="form-group">
                <label for="social-email">Email Address</label>
                <input type="email" id="social-email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="c-btn c-btn-primary">Continue</button>
        </form>
    </div>
</body>
</html>
