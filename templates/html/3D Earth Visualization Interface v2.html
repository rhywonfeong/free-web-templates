<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Earth Visualization</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
@keyframes fadeIn {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in {

<body class="bg-black text-white overflow-hidden">
    <div class="relative w-full h-screen">
        <!-- Header -->
        <header class="absolute top-0 left-0 right-0 z-20 p-6 opacity-0 animate-fade-in" style="animation-delay: 0.2s;">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-semibold tracking-tight text-white">Earth</h1>
                    <p class="text-gray-400 text-sm mt-1">Interactive 3D visualization</p>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="resetBtn" class="px-4 py-2 bg-white bg-opacity-10 hover:bg-opacity-20 border border-white border-opacity-20 hover:border-opacity-30 rounded-lg transition-all duration-200 text-sm font-medium flex items-center space-x-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        <span>Reset View</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Controls Panel -->
        <div class="absolute left-6 top-1/2 transform -translate-y-1/2 z-20 opacity-0 animate-fade-in" style="animation-delay: 0.4s;">
            <div class="bg-white bg-opacity-5 backdrop-blur-md border border-white border-opacity-10 rounded-xl p-6 w-64">
                <h3 class="text-lg font-semibold mb-4 tracking-tight">Controls</h3>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Rotation Speed</label>
                        <input type="range" id="rotationSpeed" min="0" max="0.02" step="0.001" value="0.005" 
                               class="w-full h-2 bg-white bg-opacity-10 rounded-lg appearance-none cursor-pointer slider">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Zoom Level</label>
                        <input type="range" id="zoomLevel" min="2" max="8" step="0.1" value="4" 
                               class="w-full h-2 bg-white bg-opacity-10 rounded-lg appearance-none cursor-pointer slider">
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-medium text-gray-300">Auto Rotate</span>
                        <button id="autoRotateToggle" class="relative inline-flex h-6 w-11 items-center rounded-full bg-blue-600 transition-colors focus:outline-none">
                            <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-6"></span>
                        </button>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <span class="text-sm font-medium text-gray-300">Show Atmosphere</span>
                        <button id="atmosphereToggle" class="relative inline-flex h-6 w-11 items-center rounded-full bg-blue-600 transition-colors focus:outline-none">
                            <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-6"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats Panel -->
        <div class="absolute right-6 bottom-6 z-20 opacity-0 animate-fade-in" style="animation-delay: 0.6s;">
            <div class="bg-white bg-opacity-5 backdrop-blur-md border border-white border-opacity-10 rounded-xl p-4">
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div>
                        <div class="text-2xl font-semibold text-blue-400" id="fps">60</div>
                        <div class="text-xs text-gray-400">FPS</div>
                    </div>
                    <div>
                        <div class="text-2xl font-semibold text-green-400" id="triangles">0</div>
                        <div class="text-xs text-gray-400">Triangles</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="absolute inset-0 flex items-center justify-center z-30 bg-black">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
                <p class="text-gray-400">Loading Earth textures...</p>
            </div>
        </div>

        <!-- Three.js Canvas Container -->
        <div id="canvas-container" class="w-full h-full opacity-0" style="transition: opacity 0.8s ease-out;">
        </div>
    </div>

    <script>
        // Wait for all scripts to load
        window.addEventListener('load', function() {
            setTimeout(initApp, 100);
        });

        function initApp() {
            // Three.js setup
            let scene, camera, renderer, earth, atmosphere;
            let autoRotate = true;
            let rotationSpeed = 0.005;
            let frameCount = 0;
            let lastTime = performance.now();

            function init() {
                try {
                    // Create scene
                    scene = new THREE.Scene();
                    
                    // Create camera
                    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                    camera.position.z = 4;
                    
                    // Create renderer
                    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(window.innerWidth, window.innerHeight);
                    renderer.setClearColor(0x000000, 1);
                    document.getElementById('canvas-container').appendChild(renderer.domElement);
                    
                    // Create Earth geometry
                    const geometry = new THREE.SphereGeometry(1, 32, 32);
                    
                    // Earth material with procedural texture
                    const earthMaterial = new THREE.MeshPhongMaterial({
                        map: createEarthTexture(),
                        color: 0x4a90e2
                    });
                    
                    earth = new THREE.Mesh(geometry, earthMaterial);
                    scene.add(earth);
                    
                    // Create atmosphere
                    const atmosphereGeometry = new THREE.SphereGeometry(1.05, 32, 32);
                    const atmosphereMaterial = new THREE.MeshPhongMaterial({
                        color: 0x87CEEB,
                        transparent: true,
                        opacity: 0.1,
                        side: THREE.BackSide
                    });
                    
                    atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
                    scene.add(atmosphere);
                    
                    // Add lighting
                    const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
                    scene.add(ambientLight);
                    
                    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                    directionalLight.position.set(5, 5, 5);
                    scene.add(directionalLight);
                    
                    // Add stars
                    addStars();
                    
                    // Update stats
                    const triangleCount = geometry.attributes.position.count / 3;
                    document.getElementById('triangles').textContent = Math.floor(triangleCount).toLocaleString();
                    
                    // Hide loading and show canvas
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('canvas-container').style.opacity = '1';
                    
                    // Start animation
                    animate();
                    
                } catch (error) {
                    console.error('Error initializing 3D scene:', error);
                    document.getElementById('loading').innerHTML = '<div class="text-center"><p class="text-red-400">Error loading 3D scene</p></div>';
                }
            }

            function createEarthTexture() {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                
                // Create earth-like gradient
                const gradient = ctx.createLinearGradient(0, 0, 0, 128);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(0.3, '#4169E1');
                gradient.addColorStop(0.7, '#228B22');
                gradient.addColorStop(1, '#0066CC');
                
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 256, 128);
                
                // Add landmass patterns
                ctx.fillStyle = '#228B22';
                for (let i = 0; i < 15; i++) {
                    const x = Math.random() * 256;
                    const y = Math.random() * 128;
                    const w = Math.random() * 50 + 10;
                    const h = Math.random() * 30 + 5;
                    ctx.fillRect(x, y, w, h);
                }
                
                return new THREE.CanvasTexture(canvas);
            }

            function addStars() {
                const starsGeometry = new THREE.BufferGeometry();
                const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1 });
                
                const starsVertices = [];
                for (let i = 0; i < 5000; i++) {
                    const x = (Math.random() - 0.5) * 1000;
                    const y = (Math.random() - 0.5) * 1000;
                    const z = (Math.random() - 0.5) * 1000;
                    starsVertices.push(x, y, z);
                }
                
                starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
                const stars = new THREE.Points(starsGeometry, starsMaterial);
                scene.add(stars);
            }

            function animate() {
                requestAnimationFrame(animate);
                
                if (autoRotate && earth) {
                    earth.rotation.y += rotationSpeed;
                    if (atmosphere) atmosphere.rotation.y += rotationSpeed * 0.95;
                }
                
                // Update FPS
                frameCount++;
                const currentTime = performance.now();
                if (currentTime >= lastTime + 1000) {
                    document.getElementById('fps').textContent = frameCount;
                    frameCount = 0;
                    lastTime = currentTime;
                }
                
                if (renderer && scene && camera) {
                    renderer.render(scene, camera);
                }
            }

            // Event listeners
            document.getElementById('rotationSpeed').addEventListener('input', (e) => {
                rotationSpeed = parseFloat(e.target.value);
            });

            document.getElementById('zoomLevel').addEventListener('input', (e) => {
                if (camera) camera.position.z = parseFloat(e.target.value);
            });

            document.getElementById('autoRotateToggle').addEventListener('click', (e) => {
                autoRotate = !autoRotate;
                const button = e.target.closest('button');
                const span = button.querySelector('span');
                if (autoRotate) {
                    button.className = 'relative inline-flex h-6 w-11 items-center rounded-full bg-blue-600 transition-colors focus:outline-none';
                    span.className = 'inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-6';
                } else {
                    button.className = 'relative inline-flex h-6 w-11 items-center rounded-full bg-gray-600 transition-colors focus:outline-none';
                    span.className = 'inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-1';
                }
            });

            document.getElementById('atmosphereToggle').addEventListener('click', (e) => {
                if (atmosphere) atmosphere.visible = !atmosphere.visible;
                const button = e.target.closest('button');
                const span = button.querySelector('span');
                if (atmosphere && atmosphere.visible) {
                    button.className = 'relative inline-flex h-6 w-11 items-center rounded-full bg-blue-600 transition-colors focus:outline-none';
                    span.className = 'inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-6';
                } else {
                    button.className = 'relative inline-flex h-6 w-11 items-center rounded-full bg-gray-600 transition-colors focus:outline-none';
                    span.className = 'inline-block h-4 w-4 transform rounded-full bg-white transition-transform translate-x-1';
                }
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                if (camera) camera.position.set(0, 0, 4);
                if (earth) earth.rotation.set(0, 0, 0);
                if (atmosphere) atmosphere.rotation.set(0, 0, 0);
            });

            // Mouse controls
            let mouseDown = false;
            let mouseX = 0;
            let mouseY = 0;

            document.addEventListener('mousedown', (e) => {
                mouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            document.addEventListener('mouseup', () => {
                mouseDown = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (!mouseDown || !earth) return;
                
                const deltaX = e.clientX - mouseX;
                const deltaY = e.clientY - mouseY;
                
                earth.rotation.y += deltaX * 0.01;
                earth.rotation.x += deltaY * 0.01;
                if (atmosphere) {
                    atmosphere.rotation.y += deltaX * 0.01;
                    atmosphere.rotation.x += deltaY * 0.01;
                }
                
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            // Handle window resize
            window.addEventListener('resize', () => {
                if (camera && renderer) {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });

            // Initialize everything
            init();
        }
    </script>
</body>
