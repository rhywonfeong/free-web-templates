    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Patrick Hand', cursive;
            background-color: #fdfdfa;
            color: #3a3a3a;
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .profile-card {
            max-width: 380px;
            text-align: center;
            background-color: #ffffff;
            border: 2px solid #5a5a5a;
            border-radius: 5px;
            box-shadow: 2px 2px 0 0px #5a5a5a;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .profile-card:hover {
            transform: translate(-3px, -3px);
            box-shadow: 5px 5px 0 0px #5a5a5a;
        }

        .cover-photo {
            height: 120px;
            background-size: cover;
            background-position: center;
            background-image: url('https://images.unsplash.com/photo-1504805572947-34fad45aed93?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=800&q=80');
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            margin-top: -50px;
        }

        .name {
            margin-top: 0.5rem;
            font-size: 1.5rem;
            color: #2a2a2a;
            margin-bottom: 0.8em;
            line-height: 1.3;
        }

        .handle {
            color: #5a5a5a;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 1rem 0;
            border-top: 2px solid #5a5a5a;
            border-bottom: 2px solid #5a5a5a;
        }

        .stat .value {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .stat .label {
            font-size: 0.8rem;
            color: #5a5a5a;
        }

        .actions {
            padding: 1.5rem;
            display: flex;
            gap: 1rem;
        }

        .actions button {
            flex: 1;
            padding: 0.75rem;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
            border: 2px solid #5a5a5a;
            font-family: 'Patrick Hand', cursive;
        }

        .actions button:active {
            transform: scale(0.98);
        }

        .primary {
            background: #5a7d9a;
            color: #fff;
            border-color: #5a7d9a;
        }

        .primary:hover {
            background-color: #4a6d8a;
        }

        .secondary {
            background: transparent;
            color: #3a3a3a;
        }

        .secondary:hover {
            background-color: #f5f5f5;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <div class="profile-card">
        <div class="cover-photo"></div>
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=200&q=80" alt="User Avatar" class="avatar">
        <h3 class="name">Maria Garcia</h3>
        <p class="handle">@mariacreative</p>
        <div class="stats">
            <div class="stat">
                <div class="value">1.2K</div>
                <div class="label">Followers</div>
            </div>
            <div class="stat">
                <div class="value">450</div>
                <div class="label">Following</div>
            </div>
            <div class="stat">
                <div class="value">85</div>
                <div class="label">Posts</div>
            </div>
        </div>
        <div class="actions">
            <button class="secondary">Message</button>
            <button class="primary">Follow</button>
        </div>
    </div>
</body>
</html>
