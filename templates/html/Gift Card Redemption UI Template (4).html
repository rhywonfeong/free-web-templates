<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Redeem Gift Card</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
/* Custom Font Stack for Apple Feel */
body {
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}
/* Floating Animation */
@keyframes float {
0% { transform: translateY(0px) rotateX(0deg); }
50% { transform: translateY(-8px) rotateX(2deg); }
100% { transform: translateY(0px) rotateX(0deg); }
}
.animate-float {
animation: float 6s ease-in-out infinite;
}
/* Hide Scrollbar */
.no-scrollbar::-webkit-scrollbar {
display: none;
}
.no-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
/* Input Reset */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
-webkit-appearance: none;
margin: 0;
}
/* Smooth Fade Transitions */
.fade-enter {
opacity: 0;
transform: translateY(10px);
transition: opacity 0.3s ease, transform 0.3s ease;
}
.fade-enter-active {
opacity: 1;
transform: translateY(0);
}
/* Modal Backdrop Blur */
.backdrop-blur-heavy {
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
}
</style></head>
<body class="bg-black text-white min-h-screen flex flex-col items-center justify-start pt-8 pb-10 px-4 sm:px-0 overflow-x-hidden selection:bg-blue-500/30 selection:text-blue-200">

    <!-- Header: Apple Pay Lockup -->
    <header class="w-full flex justify-center items-center space-x-1 mb-8 opacity-90">
        <iconify-icon icon="fa-brands:apple" width="20" class="text-white pb-1"></iconify-icon>
        <span class="text-lg font-medium tracking-wide">Pay</span>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-sm flex flex-col items-center space-y-8 relative z-10">

        <!-- Animated Gift Card -->
        <div class="w-full aspect-[1.586/1] rounded-2xl bg-gradient-to-br from-[#2c2c2e] via-[#1c1c1e] to-black border border-white/10 shadow-2xl relative overflow-hidden animate-float group cursor-pointer select-none">
            <!-- Subtle Texture/Shine -->
            <div class="absolute inset-0 bg-gradient-to-tr from-white/5 to-transparent pointer-events-none"></div>
            
            <div class="absolute inset-0 p-6 flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-xs font-semibold tracking-widest text-white/40 uppercase">Digital Gift Card</span>
                    <iconify-icon icon="solar:card-linear" width="24" class="text-white/30"></iconify-icon>
                </div>

                <div class="space-y-1">
                    <div class="text-xs text-white/50 font-medium">Balance</div>
                    <!-- Interactive Balance Area -->
                    <div id="balance-container" class="relative flex items-center">
                        <span id="currency-symbol" class="text-2xl font-medium tracking-tight mr-0.5">$</span>
                        
                        <!-- Display Text -->
                        <span id="balance-display" class="text-3xl font-medium tracking-tight text-white transition-opacity duration-200">512.00</span>
                        
                        <!-- Editable Input (Hidden by default) -->
                        <input type="text" id="balance-input" class="absolute left-6 top-0 w-32 bg-transparent text-3xl font-medium tracking-tight text-white outline-none border-none p-0 opacity-0 pointer-events-none focus:ring-0 placeholder-white/20" value="512.00" inputmode="decimal">
                    </div>
                </div>

                <div class="flex justify-end items-center">
                    <span class="text-sm font-mono text-white/40 tracking-widest">•••• 8921</span>
                </div>
            </div>
        </div>

        <!-- Text Content -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-semibold tracking-tight">Redeem Gift Card</h1>
            <p class="text-sm text-neutral-400 font-normal leading-relaxed">Redeem a gift card using Apple Pay.</p>
        </div>

        <!-- Insert Code Section -->
        <div class="w-full space-y-2">
            <label for="gift-code" class="text-xs font-medium text-neutral-500 uppercase tracking-wide ml-1">Insert Code</label>
            <div class="relative w-full flex items-center">
                <input type="text" id="gift-code" 
                    class="w-full bg-[#1c1c1e] text-white text-base rounded-lg py-3 px-4 outline-none border border-transparent focus:border-blue-500/50 focus:bg-[#2c2c2e] transition-all placeholder-neutral-600" 
                    placeholder="Enter gift card code"
                    autocomplete="off">
                
                <!-- Enter Button (Animated) -->
                <button id="enter-btn" class="absolute right-2 bg-white text-black text-sm font-medium px-4 py-1.5 rounded-md opacity-0 translate-x-2 pointer-events-none transition-all duration-300 hover:bg-neutral-200">
                    Enter
                </button>
            </div>
            
            <!-- Dynamic Status Message Area -->
            <div id="status-area" class="h-6 flex items-center justify-center w-full">
                <!-- Loading State -->
                <div id="loading-state" class="hidden flex items-center space-x-2 text-neutral-400">
                    <iconify-icon icon="solar:spinner-linear" class="animate-spin text-lg"></iconify-icon>
                    <span class="text-xs">Checking card information…</span>
                </div>
                <!-- Error State -->
                <div id="error-state" class="hidden text-red-500 text-xs text-center fade-enter-active">
                    This card cannot be used at this moment. Please try another card.
                </div>
            </div>
        </div>

        <!-- Divider with OR (Implicit spacing) -->

        <!-- Use Camera Button -->
        <button id="camera-trigger" class="w-full flex items-center justify-center space-x-2 py-3.5 bg-[#1c1c1e] rounded-xl active:scale-95 transition-transform duration-200 group border border-white/5 hover:border-white/10">
            <iconify-icon icon="solar:camera-linear" class="text-blue-500 text-xl"></iconify-icon>
            <span class="text-blue-500 text-base font-medium">Use Camera</span>
        </button>

    </main>

    <!-- Hidden File Input for Gallery -->
    <input type="file" id="file-input" accept="image/*" class="hidden">

    <!-- Action Sheet / Modal Overlay -->
    <div id="action-sheet" class="fixed inset-0 z-50 hidden">
        <!-- Backdrop -->
        <div id="sheet-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-300 opacity-0"></div>
        
        <!-- Sheet Content -->
        <div id="sheet-content" class="absolute bottom-0 left-0 right-0 sm:bottom-auto sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2 w-full sm:w-80 bg-transparent sm:bg-transparent p-4 transform translate-y-full sm:translate-y-10 transition-transform duration-300 flex flex-col items-center">
            
            <!-- Sheet Options Container -->
            <div class="w-full space-y-2">
                <div class="bg-[#1c1c1e]/90 backdrop-blur-heavy rounded-xl overflow-hidden text-center">
                    <button id="btn-gallery" class="w-full py-4 border-b border-white/10 active:bg-white/10 transition-colors">
                        <span class="text-blue-500 text-base font-normal">Choose from Gallery</span>
                    </button>
                    <button id="btn-photo" class="w-full py-4 active:bg-white/10 transition-colors">
                        <span class="text-blue-500 text-base font-normal">Take Photo</span>
                    </button>
                </div>

                <button id="btn-cancel" class="w-full bg-[#1c1c1e] py-4 rounded-xl font-semibold active:scale-[0.98] transition-transform">
                    <span class="text-blue-500 text-base">Cancel</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const balanceContainer = document.getElementById('balance-container');
            const balanceDisplay = document.getElementById('balance-display');
            const balanceInput = document.getElementById('balance-input');
            const giftInput = document.getElementById('gift-code');
            const enterBtn = document.getElementById('enter-btn');
            const statusArea = document.getElementById('status-area');
            const loadingState = document.getElementById('loading-state');
            const errorState = document.getElementById('error-state');
            
            // Camera / Sheet Elements
            const cameraTrigger = document.getElementById('camera-trigger');
            const actionSheet = document.getElementById('action-sheet');
            const sheetBackdrop = document.getElementById('sheet-backdrop');
            const sheetContent = document.getElementById('sheet-content');
            const btnCancel = document.getElementById('btn-cancel');
            const btnGallery = document.getElementById('btn-gallery');
            const btnPhoto = document.getElementById('btn-photo');
            const fileInput = document.getElementById('file-input');

            // --- 1. Editable Balance Interaction ---
            let lastTap = 0;

            function enableEdit() {
                balanceDisplay.classList.add('opacity-0');
                balanceInput.classList.remove('opacity-0', 'pointer-events-none');
                balanceInput.focus();
                // Select all text
                balanceInput.setSelectionRange(0, balanceInput.value.length);
            }

            function saveEdit() {
                const val = parseFloat(balanceInput.value).toFixed(2);
                if (!isNaN(val)) {
                    balanceDisplay.innerText = val;
                    balanceInput.value = val;
                } else {
                    balanceInput.value = balanceDisplay.innerText;
                }
                balanceDisplay.classList.remove('opacity-0');
                balanceInput.classList.add('opacity-0', 'pointer-events-none');
            }

            // Desktop Double Click
            balanceContainer.addEventListener('dblclick', (e) => {
                e.preventDefault();
                enableEdit();
            });

            // Mobile Double Tap
            balanceContainer.addEventListener('touchend', (e) => {
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    e.preventDefault();
                    enableEdit();
                }
                lastTap = currentTime;
            });

            // Save on Enter or Blur
            balanceInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    balanceInput.blur();
                }
            });
            
            balanceInput.addEventListener('blur', saveEdit);

            // --- 2. Code Input & Enter Logic ---
            
            function resetStatus() {
                loadingState.classList.add('hidden');
                errorState.classList.add('hidden');
                statusArea.classList.remove('hidden');
            }

            giftInput.addEventListener('input', (e) => {
                resetStatus();
                if (e.target.value.length > 0) {
                    enterBtn.classList.remove('opacity-0', 'translate-x-2', 'pointer-events-none');
                } else {
                    enterBtn.classList.add('opacity-0', 'translate-x-2', 'pointer-events-none');
                }
            });

            function processSubmission() {
                // Hide button, blur input
                enterBtn.classList.add('opacity-0', 'translate-x-2', 'pointer-events-none');
                giftInput.blur();
                
                // Show Loading
                loadingState.classList.remove('hidden');
                errorState.classList.add('hidden');

                // Simulate Network Request
                setTimeout(() => {
                    loadingState.classList.add('hidden');
                    errorState.classList.remove('hidden');
                    // Re-show button if text exists
                    if(giftInput.value.length > 0) {
                         enterBtn.classList.remove('opacity-0', 'translate-x-2', 'pointer-events-none');
                    }
                }, 2000);
            }

            enterBtn.addEventListener('click', processSubmission);

            // Allow Enter key in main input
            giftInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && giftInput.value.length > 0) {
                    processSubmission();
                }
            });

            // --- 3. Camera / Action Sheet Logic ---

            function openSheet() {
                resetStatus();
                actionSheet.classList.remove('hidden');
                // Trigger reflow
                void actionSheet.offsetWidth;
                
                sheetBackdrop.classList.remove('opacity-0');
                sheetContent.classList.remove('translate-y-full', 'sm:translate-y-10');
            }

            function closeSheet() {
                sheetBackdrop.classList.add('opacity-0');
                sheetContent.classList.add('translate-y-full', 'sm:translate-y-10');
                
                setTimeout(() => {
                    actionSheet.classList.add('hidden');
                }, 300);
            }

            cameraTrigger.addEventListener('click', openSheet);
            btnCancel.addEventListener('click', closeSheet);
            sheetBackdrop.addEventListener('click', closeSheet);

            // Handle Gallery Selection
            btnGallery.addEventListener('click', () => {
                closeSheet();
                fileInput.click();
            });

            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    // Simulate processing
                    loadingState.classList.remove('hidden');
                    setTimeout(() => {
                        loadingState.classList.add('hidden');
                        errorState.classList.remove('hidden');
                        // Clear input so same file can be selected again
                        fileInput.value = '';
                    }, 2000);
                }
            });

            // Handle Take Photo
            btnPhoto.addEventListener('click', () => {
                closeSheet();
                loadingState.classList.remove('hidden');
                // Simulate camera delay
                setTimeout(() => {
                    loadingState.classList.add('hidden');
                    errorState.classList.remove('hidden');
                }, 2500);
            });
        });
    </script>
</body>
</html>
