<style>
body {
font-family: 'Inter', sans-serif;
}
h1, h2, h3, .brand-font {
font-family: 'Space Grotesk', sans-serif;
}
/* Transitions */
.step {
display: none;
animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.step.active {
display: block;
}
@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}
/* Custom Range Slider for later steps */
input[type=range]::-webkit-slider-thumb {
-webkit-appearance: none;
height: 24px;
width: 24px;
border-radius: 50%;
background: black;
cursor: pointer;
margin-top: -10px;
box-shadow: 0 0 0 4px #fff;
}
input[type=range]::-webkit-slider-runnable-track {
background: #E5E7EB;
border-radius: 2px;
height: 4px;
}
</style></head>
<body class="bg-[#C81018] min-h-screen flex flex-col items-center justify-center p-4 text-stone-900 antialiased selection:bg-black selection:text-white">

                    <div>

                            </div>
                            <input type="text" placeholder="Jane Doe" class="w-full bg-white text-base text-gray-900 placeholder:text-gray-300 border border-gray-200 rounded-xl pl-11 pr-4 py-3.5 focus:border-black focus:ring-0 outline-none transition-all duration-200 font-medium shadow-sm">
                        </div>
                    </div>

                    <!-- Instagram Input -->
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-900 mb-2">Social Handle</label>
                        <div class="relative group">
                            <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:text-black transition-colors">
                                <i data-lucide="instagram" width="20" height="20" stroke-width="1.5"></i>
                            </div>
                            <input type="text" placeholder="@username" class="w-full bg-white text-base text-gray-900 placeholder:text-gray-300 border border-gray-200 rounded-xl pl-11 pr-4 py-3.5 focus:border-black focus:ring-0 outline-none transition-all duration-200 font-medium shadow-sm">
                        </div>
                    </div>
                </div>

                <div class="mt-10">
                    <button onclick="nextStep(2)" class="w-full bg-[#E5E7EB] text-gray-500 border-2 border-transparent hover:border-black/5 rounded-xl py-4 font-bold text-sm tracking-widest uppercase transition-all shadow-[0_5px_0_0_#000000] active:shadow-none active:translate-y-[5px] hover:translate-y-[2px] hover:shadow-[0_3px_0_0_#000000] flex items-center justify-center">
                        Next Step
                    </button>
                </div>
            </div>

            <!-- Step 2: Experience (Adapted Style) -->
            <div class="step" id="step-2">
                <div class="mb-8">
                    <button onclick="nextStep(1)" class="text-gray-400 hover:text-black text-[10px] font-bold tracking-widest uppercase mb-4 flex items-center gap-1 transition-colors">
                        <i data-lucide="arrow-left" width="14" stroke-width="2"></i> Back
                    </button>
                    <h2 class="text-3xl font-semibold tracking-tight text-black mb-2">Revenue</h2>
                    <p class="text-sm text-gray-500 font-medium">Monthly earnings across platforms.</p>
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <label class="cursor-pointer group">
                        <input type="radio" name="revenue" class="peer hidden" value="0-1k">
                        <div class="border border-gray-200 bg-white rounded-xl p-4 flex items-center justify-between transition-all duration-200 peer-checked:border-black peer-checked:bg-gray-50 group-hover:border-gray-300">
                            <span class="font-medium text-gray-900 text-sm">$0 - $1,000</span>
                            <div class="w-4 h-4 rounded-full border border-gray-300 peer-checked:border-black peer-checked:bg-black relative flex items-center justify-center"></div>
                        </div>
                    </label>
                    <label class="cursor-pointer group">
                        <input type="radio" name="revenue" class="peer hidden" value="1k-5k">
                        <div class="border border-gray-200 bg-white rounded-xl p-4 flex items-center justify-between transition-all duration-200 peer-checked:border-black peer-checked:bg-gray-50 group-hover:border-gray-300">
                            <span class="font-medium text-gray-900 text-sm">$1,000 - $5,000</span>
                            <div class="w-4 h-4 rounded-full border border-gray-300 peer-checked:border-black peer-checked:bg-black relative flex items-center justify-center"></div>
                        </div>
                    </label>
                    <label class="cursor-pointer group">
                        <input type="radio" name="revenue" class="peer hidden" value="5k+">
                        <div class="border border-gray-200 bg-white rounded-xl p-4 flex items-center justify-between transition-all duration-200 peer-checked:border-black peer-checked:bg-gray-50 group-hover:border-gray-300">
                            <span class="font-medium text-gray-900 text-sm">$5,000+</span>
                            <div class="w-4 h-4 rounded-full border border-gray-300 peer-checked:border-black peer-checked:bg-black relative flex items-center justify-center"></div>
                        </div>
                    </label>
                </div>

                <div class="mt-10">
                    <button onclick="nextStep(3)" class="w-full bg-[#E5E7EB] text-gray-500 border-2 border-transparent hover:border-black/5 rounded-xl py-4 font-bold text-sm tracking-widest uppercase transition-all shadow-[0_5px_0_0_#000000] active:shadow-none active:translate-y-[5px] hover:translate-y-[2px] hover:shadow-[0_3px_0_0_#000000] flex items-center justify-center">
                        Next Step
                    </button>
                </div>
            </div>

            <!-- Step 3: Goals (Adapted Style) -->
            <div class="step" id="step-3">
                <div class="mb-8">
                    <button onclick="nextStep(2)" class="text-gray-400 hover:text-black text-[10px] font-bold tracking-widest uppercase mb-4 flex items-center gap-1 transition-colors">
                        <i data-lucide="arrow-left" width="14" stroke-width="2"></i> Back
                    </button>
                    <h2 class="text-3xl font-semibold tracking-tight text-black mb-2">Goals</h2>
                    <p class="text-sm text-gray-500 font-medium">What are you looking for?</p>
                </div>

                <div class="grid grid-cols-1 gap-3 mb-8">
                    <label class="cursor-pointer group">
                        <input type="checkbox" name="goals" class="peer hidden" value="management">
                        <div class="border border-gray-200 bg-white rounded-xl p-4 flex items-center gap-4 transition-all duration-200 peer-checked:border-black peer-checked:bg-gray-50 group-hover:border-gray-300">
                            <div class="w-5 h-5 rounded border border-gray-300 peer-checked:bg-black peer-checked:border-black flex items-center justify-center text-white transition-colors">
                                <i data-lucide="check" width="12" stroke-width="3"></i>
                            </div>
                            <span class="font-medium text-gray-900 text-sm">Full Management</span>
                        </div>
                    </label>
                    
                    <label class="cursor-pointer group">
                        <input type="checkbox" name="goals" class="peer hidden" value="marketing">
                        <div class="border border-gray-200 bg-white rounded-xl p-4 flex items-center gap-4 transition-all duration-200 peer-checked:border-black peer-checked:bg-gray-50 group-hover:border-gray-300">
                            <div class="w-5 h-5 rounded border border-gray-300 peer-checked:bg-black peer-checked:border-black flex items-center justify-center text-white transition-colors">
                                <i data-lucide="check" width="12" stroke-width="3"></i>
                            </div>
                            <span class="font-medium text-gray-900 text-sm">Marketing Only</span>
                        </div>
                    </label>

                    <label class="cursor-pointer group">
                        <input type="checkbox" name="goals" class="peer hidden" value="audit">
                        <div class="border border-gray-200 bg-white rounded-xl p-4 flex items-center gap-4 transition-all duration-200 peer-checked:border-black peer-checked:bg-gray-50 group-hover:border-gray-300">
                            <div class="w-5 h-5 rounded border border-gray-300 peer-checked:bg-black peer-checked:border-black flex items-center justify-center text-white transition-colors">
                                <i data-lucide="check" width="12" stroke-width="3"></i>
                            </div>
                            <span class="font-medium text-gray-900 text-sm">Account Audit</span>
                        </div>
                    </label>
                </div>

                <div class="mt-4">
                    <button type="submit" class="w-full bg-black text-white rounded-xl py-4 font-bold text-sm tracking-widest uppercase transition-all shadow-lg hover:bg-gray-900 hover:scale-[1.02] active:scale-[0.98]">
                        Join Now
                    </button>
                </div>
            </div>

            <!-- Card Footer -->
            <div class="mt-10 text-center">
                <p class="text-[10px] font-bold tracking-[0.2em] text-gray-300 uppercase">• Exclusive Agency •</p>
            </div>

        </form>
    </main>

    <!-- Page Footer -->
    <footer class="mt-12 text-center opacity-40 hover:opacity-100 transition-opacity">
        <p class="text-xs text-white font-medium">© 2026 The Girls Club. All rights reserved.</p>
    </footer>

    <script>
        lucide.createIcons();

        function nextStep(stepNumber) {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
            
            const nextStepEl = document.getElementById('step-' + stepNumber);
            if (nextStepEl) {
                nextStepEl.classList.add('active');
            }

            const progress = document.getElementById('progress-bar');
            if (stepNumber === 1) progress.style.width = '33%';
            if (stepNumber === 2) progress.style.width = '66%';
            if (stepNumber === 3) progress.style.width = '100%';
        }
    </script>
</body>
</html>
