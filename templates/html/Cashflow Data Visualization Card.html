  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Minimal Cashflow Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#60a5fa',
            accent: '#a78bfa'
          }
        }
      }
    }
  </script>
</head>
<body class="dark bg-zinc-900 min-h-screen flex items-center justify-center">
  <div class="bg-zinc-800 rounded-xl p-6 w-full max-w-md shadow flex flex-col gap-6">
    <div>
      <h2 class="text-base font-semibold text-zinc-100">Cashflow</h2>
      <p class="text-xs text-zinc-500 mt-1">per <span id="cf-title">6 months</span></p>
    </div>
    <div class="flex gap-2 text-xs" id="cf-tabs">
      <button class="cf-tab px-3 py-1 rounded-md text-zinc-400 hover:bg-zinc-700" data-mode="w">1W</button>
      <button class="cf-tab px-3 py-1 rounded-md text-zinc-400 hover:bg-zinc-700" data-mode="m">1M</button>
      <button class="cf-tab px-3 py-1 rounded-md text-zinc-400 hover:bg-zinc-700" data-mode="q">3M</button>
      <button class="cf-tab px-3 py-1 rounded-md bg-primary/20 text-primary font-medium" data-mode="h">6M</button>
      <button class="cf-tab px-3 py-1 rounded-md text-zinc-400 hover:bg-zinc-700" data-mode="y">1Y</button>
    </div>
    <div class="relative h-36">
      <div class="absolute inset-0 flex items-end gap-5 justify-between px-3 transition-all duration-200" id="cf-canvas">
        <!-- 6M (default) bars will be loaded here -->
      </div>
    </div>
    <div class="flex gap-6 mt-2 text-xs text-zinc-500">
      <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-primary inline-block"></span>Income</span>
      <span class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-accent inline-block"></span>Outcome</span>
    </div>
  </div>
  <script>
    const cfData = {
      w: [
        [33,24,'Mon'],[21,27,'Tue'],[15,10,'Wed'],[23,24,'Thu'],[26,19,'Fri'],[25,23,'Sat'],[28,21,'Sun']
      ],
      m: [
        [60,37,'W1'],[51,48,'W2'],[46,38,'W3'],[57,34,'W4']
      ],
      q: [
        [118,82,'Mar'],[109,97,'Apr'],[128,91,'May']
      ],
      h: [
        [70,40,'Jan'],[52,51,'Feb'],[58,39,'Mar'],[35,66,'Apr'],[50,58,'May'],[73,44,'Jun']
      ],
      y: [
        [38,29,'Jul'],[46,50,'Aug'],[59,39,'Sep'],[77,66,'Oct'],[88,55,'Nov'],[101,82,'Dec']
      ]
    };
    const cfTitle = {w:'week',m:'month',q:'quarter',h:'6 months',y:'year'};
    const renderCF = mode => {
      const s = cfData[mode]||[];
      let html = '';
      for (const [i,o,l] of s)
        html += `<div class="flex flex-col items-center transition-all duration-200">
          <div class="w-2 rounded bg-primary transition-all duration-300" style="height:${i}px"></div>
          <div class="w-2 rounded bg-accent mt-1 transition-all duration-300" style="height:${o}px"></div>
          <span class="text-[10px] mt-2 text-zinc-500">${l}</span>
        </div>`;
      document.getElementById('cf-canvas').innerHTML = html;
      document.getElementById('cf-title').textContent = cfTitle[mode] || '';
    };
    document.querySelectorAll('.cf-tab').forEach(el=>{
      el.addEventListener('click',function(){
        document.querySelectorAll('.cf-tab').forEach(btn=>btn.classList.remove('bg-primary/20','text-primary','font-medium'));
        this.classList.add('bg-primary/20','text-primary','font-medium');
        renderCF(this.dataset.mode);
      });
    });
    renderCF('h');
  </script>
</body>
</html>
