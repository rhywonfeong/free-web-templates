  <meta charset="UTF-8">
  <title>Funky Animated Blob</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes funkyBlob {
      0% {
        border-radius: 55% 45% 60% 40%/55% 60% 40% 45%;
        background-position: 0% 50%;
      }
      25% {
        border-radius: 40% 60% 55% 45%/60% 55% 45% 40%;
        background-position: 100% 0%;
      }
      50% {
        border-radius: 60% 40% 45% 55%/40% 45% 60% 55%;
        background-position: 0% 100%;
      }
      75% {
        border-radius: 55% 45% 50% 50%/45% 55% 50% 50%;
        background-position: 100% 100%;
      }
      100% {
        border-radius: 55% 45% 60% 40%/55% 60% 40% 45%;
        background-position: 0% 50%;
      }
    }
    .funky-blob {
      animation: funkyBlob 4s cubic-bezier(0.76, 0, 0.24, 1) infinite alternate;
      background: linear-gradient(135deg, #f43f5e 0%, #0ea5e9 40%, #a3e635 70%, #f59e42 100%);
      background-size: 200% 200%;
      box-shadow: 0 8px 40px 4px rgba(244,63,94,0.2), 0 2px 20px 4px rgba(14,165,233,0.08);
      filter: blur(0.5px);
    }
    @keyframes waveText {
      0% { transform: translateY(0); }
      20% { transform: translateY(-0.5em); }
      40% { transform: translateY(0.2em); }
      60% { transform: translateY(-0.1em); }
      80% { transform: translateY(0.3em); }
      100% { transform: translateY(0); }
    }
    .wavy span {
      display: inline-block;
      animation: waveText 1.5s infinite;
      color: #0ea5e9;
      font-weight: 700;
    }
    .wavy span:nth-child(2){animation-delay:0.1s;}
    .wavy span:nth-child(3){animation-delay:0.2s;}
    .wavy span:nth-child(4){animation-delay:0.3s;}
    .wavy span:nth-child(5){animation-delay:0.4s;}
    .wavy span:nth-child(6){animation-delay:0.5s;}
    .wavy span:nth-child(7){animation-delay:0.6s;}
    .wavy span:nth-child(8){animation-delay:0.7s;}
    .wavy span:nth-child(9){animation-delay:0.8s;}
    .wavy span:nth-child(10){animation-delay:0.9s;}
    .wavy span:nth-child(11){animation-delay:1s;}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-900 to-fuchsia-900">
  <div class="flex flex-col items-center justify-center space-y-8">
    <div class="relative">
      <div class="funky-blob w-72 h-72 md:w-96 md:h-96"></div>
      <div class="absolute inset-0 flex items-center justify-center">
        <h1 class="text-white text-2xl md:text-4xl font-black tracking-wide drop-shadow-lg wavy select-none">
          <span>F</span><span>u</span><span>n</span><span>k</span><span>y</span>
          <span>&nbsp;</span>
          <span>B</span><span>l</span><span>o</span><span>b</span>
        </h1>
      </div>
    </div>
    <p class="text-fuchsia-200 text-xl font-mono font-semibold animate-pulse">Groove with the blob ✨</p>
  </div>
</body>
</html>
