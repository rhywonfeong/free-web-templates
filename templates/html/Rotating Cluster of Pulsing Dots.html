  <meta charset="UTF-8" />
  <title>Slow Swirling Random Minimal Dots</title>
  <style>
    body {
      background: #000;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dots-container {
      position: relative;
      width: 340px;
      height: 340px;
    }
    .dot {
      position: absolute;
      width: 2.2px;
      height: 2.2px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.65;
      pointer-events: none;
      animation: minipulse 2.6s infinite;
    }
    @keyframes minipulse {
      0%   { transform: scale(0.5); opacity: 0.25; }
      40%  { transform: scale(1.02); opacity: 0.9; }
      80%  { transform: scale(0.5); opacity: 0.45; }
      100% { transform: scale(0.5); opacity: 0.25; }
    }
  </style>
</head>
<body>
  <div class="dots-container" id="dots"></div>
  <script>
    const DOTS = 400;
    const RADIUS = 150;
    const SIZE = 2.2;
    const CENTER = 170;
    const dots = [];
    const container = document.getElementById('dots');
    for (let i = 0; i < DOTS; i++) {
      // Random distance and random angle for each dot
      const r = Math.sqrt(Math.random()) * RADIUS;
      const theta0 = Math.random() * 2 * Math.PI;
      const x = CENTER + r * Math.cos(theta0);
      const y = CENTER + r * Math.sin(theta0);
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.style.left = (x - SIZE/2) + 'px';
      dot.style.top = (y - SIZE/2) + 'px';
      // Spread the pulsing start times
      dot.style.animationDelay = (Math.random()*2).toFixed(2) + 's';
      container.appendChild(dot);
      dots.push({ dom: dot, r, theta0, offset: Math.random()*6.28 });
    }
    // Slower swirl: rotate around center; outer dots can go slower
    function animate(ts) {
      const t = ts / 1000;
      for(let i=0;i<DOTS;i++) {
        const { dom, r, theta0, offset } = dots[i];
        const pct = r / RADIUS;
        // Rotation speed: all slow, even slower as they go outward
        const theta = theta0 + t * (0.18 + 0.18 * (1-pct)) + offset;
        const x = CENTER + r * Math.cos(theta);
        const y = CENTER + r * Math.sin(theta);
        dom.style.left = (x - SIZE/2) + 'px';
        dom.style.top = (y - SIZE/2) + 'px';
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
