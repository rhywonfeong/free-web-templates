<body class="bg-neutral-50 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 font-['Inter',sans-serif] antialiased text-neutral-900 selection:bg-neutral-200">

    <!-- Logo -->
    <div class="mb-10 text-center">
        <span class="font-semibold text-lg tracking-tighter text-neutral-900 uppercase">Wbnr.</span>
    </div>

    <!-- Main Card -->
    <main class="w-full max-w-md bg-white rounded-2xl sm:rounded-3xl shadow-sm ring-1 ring-neutral-200/60 p-6 sm:p-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="mx-auto w-12 h-12 bg-neutral-100 rounded-full flex items-center justify-center mb-5 text-neutral-700">
                <iconify-icon icon="solar:clapperboard-play-linear" width="24" height="24" style="stroke-width: 1.5;"></iconify-icon>
            </div>
            <h1 class="text-2xl font-semibold tracking-tight text-neutral-900 mb-2">Masterclass: Architektura Skali</h1>
            <p class="text-sm text-neutral-500 leading-relaxed">Zdobądź wiedzę na temat budowania skalowalnych systemów. Dołącz do nas na żywo w ten czwartek o 19:00.</p>
        </div>

        <!-- Form -->
        <form action="#" method="POST" class="space-y-5">
            
            <!-- Name Field -->
            <div class="space-y-1.5">
                <label for="name" class="block text-sm font-medium text-neutral-700">Imię i nazwisko</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-neutral-400">
                        <iconify-icon icon="solar:user-linear" width="18" height="18" style="stroke-width: 1.5;"></iconify-icon>
                    </div>
                    <input type="text" id="name" name="name" required placeholder="Jan Kowalski" class="block w-full pl-10 pr-3 py-2.5 bg-white border border-neutral-200 rounded-lg text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-neutral-900 focus:border-neutral-900 transition-shadow">
                </div>
            </div>

            <!-- Email Field -->
            <div class="space-y-1.5">
                <label for="email" class="block text-sm font-medium text-neutral-700">Adres email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-neutral-400">
                        <iconify-icon icon="solar:letter-linear" width="18" height="18" style="stroke-width: 1.5;"></iconify-icon>
                    </div>
                    <input type="email" id="email" name="email" required placeholder="jan@example.com" class="block w-full pl-10 pr-3 py-2.5 bg-white border border-neutral-200 rounded-lg text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-1 focus:ring-neutral-900 focus:border-neutral-900 transition-shadow">
                </div>
            </div>

            <!-- Custom Checkbox -->
            <label class="flex items-start gap-3 cursor-pointer group pt-1">
                <div class="relative flex items-center justify-center w-4 h-4 mt-0.5 shrink-0">
                    <input type="checkbox" required class="peer sr-only">
                    <div class="absolute inset-0 border border-neutral-300 rounded bg-white peer-checked:bg-neutral-900 peer-checked:border-neutral-900 transition-colors group-hover:border-neutral-400 peer-checked:group-hover:border-neutral-900"></div>
                    <iconify-icon icon="solar:check-read-linear" class="absolute text-white opacity-0 peer-checked:opacity-100 transition-opacity z-10" width="14" height="14" style="stroke-width: 1.5;"></iconify-icon>
                </div>
                <span class="text-xs text-neutral-500 leading-relaxed select-none">
                    Zgadzam się na przetwarzanie moich danych osobowych w celu zapisu na wydarzenie oraz akceptuję <a href="#" class="text-neutral-900 hover:text-neutral-600 transition-colors">regulamin</a>.
                </span>
            </label>

            <!-- Submit Button -->
            <div class="pt-2">
                <button type="submit" class="w-full inline-flex items-center justify-center gap-2 bg-neutral-900 text-white rounded-lg py-2.5 px-4 text-sm font-medium hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-neutral-900 transition-all active:scale-[0.98]">
                    Zarezerwuj darmowe miejsce
                    <iconify-icon icon="solar:arrow-right-linear" width="16" height="16" style="stroke-width: 1.5;"></iconify-icon>
                </button>
            </div>
        </form>

        <!-- Footer Info -->
        <div class="mt-8 pt-6 border-t border-neutral-100 flex items-center justify-center gap-2 text-xs text-neutral-400">
            <iconify-icon icon="solar:shield-check-linear" width="16" height="16" style="stroke-width: 1.5;"></iconify-icon>
            <span>Liczba miejsc jest ograniczona do 500 osób.</span>
        </div>

    </main>
