<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minimalist File Manager</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
}
/* View Transition Definitions */
::view-transition-group(*) {
animation-duration: 0.5s;
animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
}
/* Layout Specific Styles controlled via Parent Class */
#file-container.list-view {
display: flex;
flex-direction: column;
gap: 0.5rem;
}
#file-container.grid-view {
display: grid;
grid-template-columns: repeat(1, 1fr);
gap: 1.5rem;
}
@media (min-width: 640px) {
#file-container.grid-view {
grid-template-columns: repeat(2, 1fr);
}
}
@media (min-width: 768px) {
#file-container.grid-view {
grid-template-columns: repeat(3, 1fr);
}
}
/* Card Internal Layouts based on View Mode */
.list-view .file-card {
flex-direction: row;
align-items: center;
padding: 0.75rem 1rem;
}
.grid-view .file-card {
flex-direction: column;
align-items: flex-start;
padding: 1.25rem;
aspect-ratio: 1 / 1; /* Square cards in grid */
}
/* Element visibility/positioning based on view */
.grid-view .file-preview {
width: 100%;
flex: 1;
margin-bottom: 1rem;
background-color: #F9FAFB;
}
.list-view .file-preview {
width: 3rem; /* w-12 */
height: 3rem;
margin-right: 1rem;
background-color: transparent;
}
.grid-view .file-meta-row {
width: 100%;
margin-top: auto;
padding-top: 0.75rem;
border-top: 1px solid #F3F4F6;
}
.list-view .file-meta-row {
margin-left: auto;
width: auto;
border: none;
padding: 0;
}
.grid-view .hide-on-grid { display: none; }
.list-view .hide-on-list { display: none; }
</style></head>
<body class="bg-gray-50/50 text-slate-800 min-h-screen flex items-center justify-center p-6">

    <!-- Widget Wrapper -->
    <div class="w-full max-w-5xl bg-white border border-gray-100 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden flex flex-col max-h-[90vh]">
        
        <!-- Header -->
        <div class="px-8 py-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6 border-b border-gray-100 bg-white/80 backdrop-blur-sm sticky top-0 z-20">
            <div>
                <h1 class="text-xl font-medium tracking-tight text-gray-900 flex items-center gap-2">
                    Project Assets
                    <span class="text-gray-400 text-sm font-normal">4 files</span>
                </h1>
            </div>

            <div class="flex items-center gap-3">
                <!-- View Toggle Buttons -->
                <div class="bg-gray-100/80 p-1 rounded-lg flex items-center gap-1">
                    <button onclick="switchView('list')" id="btn-list" class="p-1.5 rounded-md text-gray-900 bg-white shadow-sm transition-all hover:text-gray-900">
                        <iconify-icon icon="solar:list-linear" width="20" stroke-width="1.5"></iconify-icon>
                    </button>
                    <button onclick="switchView('grid')" id="btn-grid" class="p-1.5 rounded-md text-gray-400 hover:text-gray-600 transition-all">
                        <iconify-icon icon="solar:widget-2-linear" width="20" stroke-width="1.5"></iconify-icon>
                    </button>
                </div>

                <div class="h-5 w-px bg-gray-200 mx-2"></div>

                <button class="flex items-center gap-2 bg-gray-900 hover:bg-black text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-gray-200">
                    <iconify-icon icon="solar:add-circle-linear" width="18" stroke-width="1.5"></iconify-icon>
                    <span>Upload</span>
                </button>
            </div>
        </div>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-8 bg-white relative">
            
            <!-- File Container (Grid/List Target) -->
            <div id="file-container" class="list-view transition-all">

                <!-- File Item 1: Image -->
                <div class="file-card group relative bg-white border border-gray-100 rounded-2xl hover:border-gray-300 hover:shadow-md transition-all duration-300 flex" style="view-transition-name: file-1">
                    
                    <!-- Custom Checkbox -->
                    <div class="absolute top-4 left-4 z-10 opacity-0 group-hover:opacity-100 transition-opacity list-view:static list-view:opacity-100 list-view:mr-4">
                        <div class="w-5 h-5 rounded border border-gray-300 bg-white hover:border-gray-400 cursor-pointer flex items-center justify-center"></div>
                    </div>

                    <!-- Preview/Icon -->
                    <div class="file-preview rounded-xl overflow-hidden flex items-center justify-center border border-gray-100 relative group-hover:bg-gray-50 transition-colors">
                        <div class="absolute inset-0 bg-cover bg-center opacity-90 transition-transform duration-700 group-hover:scale-105" style="background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=300&q=80')"></div>
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors"></div>
                    </div>

                    <!-- File Details -->
                    <div class="flex-1 min-w-0 flex flex-col justify-center">
                        <h3 class="text-sm font-medium text-gray-900 truncate">Dashboard_Mockup_v04.png</h3>
                        <p class="text-xs text-gray-400 mt-0.5">2.4 MB • Added today</p>
                    </div>

                    <!-- Meta/Actions -->
                    <div class="file-meta-row flex items-center justify-between gap-4">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded-full bg-gray-100 border border-white ring-1 ring-gray-100 flex items-center justify-center text-[10px] text-gray-500 font-medium">AM</div>
                            <span class="text-xs text-gray-500 hide-on-grid">Alex M.</span>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-green-500"></span>
                            <button class="text-gray-400 hover:text-red-500 transition-colors p-1 rounded-md hover:bg-red-50">
                                <iconify-icon icon="solar:trash-bin-trash-linear" width="16"></iconify-icon>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- File Item 2: PDF -->
                <div class="file-card group relative bg-white border border-gray-100 rounded-2xl hover:border-gray-300 hover:shadow-md transition-all duration-300 flex" style="view-transition-name: file-2">
                    
                    <div class="absolute top-4 left-4 z-10 opacity-0 group-hover:opacity-100 transition-opacity list-view:static list-view:opacity-100 list-view:mr-4">
                        <div class="w-5 h-5 rounded border border-gray-300 bg-white hover:border-gray-400 cursor-pointer flex items-center justify-center"></div>
                    </div>

                    <div class="file-preview rounded-xl overflow-hidden flex items-center justify-center border border-gray-100 bg-gray-50 text-gray-400 group-hover:text-indigo-500 group-hover:bg-indigo-50/50 transition-colors">
                        <iconify-icon icon="solar:document-text-linear" width="32" class="grid-view:scale-150 transition-transform"></iconify-icon>
                    </div>

                    <div class="flex-1 min-w-0 flex flex-col justify-center">
                        <h3 class="text-sm font-medium text-gray-900 truncate">Q4_Financial_Report.pdf</h3>
                        <p class="text-xs text-gray-400 mt-0.5">845 KB • Yesterday</p>
                    </div>

                    <div class="file-meta-row flex items-center justify-between gap-4">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded-full bg-indigo-100 border border-white ring-1 ring-gray-100 flex items-center justify-center text-[10px] text-indigo-600 font-medium">SJ</div>
                            <span class="text-xs text-gray-500 hide-on-grid">Sarah J.</span>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-green-500"></span>
                            <button class="text-gray-400 hover:text-red-500 transition-colors p-1 rounded-md hover:bg-red-50">
                                <iconify-icon icon="solar:trash-bin-trash-linear" width="16"></iconify-icon>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- File Item 3: ZIP (Selected) -->
                <div class="file-card group relative bg-gray-50/50 border border-indigo-200 rounded-2xl hover:shadow-md transition-all duration-300 flex" style="view-transition-name: file-3">
                    
                    <div class="absolute top-4 left-4 z-10 list-view:static list-view:mr-4">
                        <div class="w-5 h-5 rounded bg-indigo-600 border border-indigo-600 flex items-center justify-center cursor-pointer shadow-sm shadow-indigo-200">
                            <iconify-icon icon="solar:check-read-linear" class="text-white" width="14"></iconify-icon>
                        </div>
                    </div>

                    <div class="file-preview rounded-xl overflow-hidden flex items-center justify-center border border-indigo-100 bg-white text-indigo-500">
                        <iconify-icon icon="solar:box-minimalistic-linear" width="32" class="grid-view:scale-150 transition-transform"></iconify-icon>
                    </div>

                    <div class="flex-1 min-w-0 flex flex-col justify-center">
                        <h3 class="text-sm font-medium text-indigo-900 truncate">Brand_Assets_Export.zip</h3>
                        <p class="text-xs text-indigo-400 mt-0.5">142 MB • 2 days ago</p>
                    </div>

                    <div class="file-meta-row flex items-center justify-between gap-4">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded-full bg-orange-100 border border-white ring-1 ring-gray-100 flex items-center justify-center text-[10px] text-orange-600 font-medium">MK</div>
                            <span class="text-xs text-gray-500 hide-on-grid">Mike K.</span>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-green-500"></span>
                            <button class="text-indigo-300 hover:text-red-500 transition-colors p-1 rounded-md hover:bg-indigo-100">
                                <iconify-icon icon="solar:trash-bin-trash-linear" width="16"></iconify-icon>
                            </button>
                        </div>
                    </div>
                </div>

                 <!-- File Item 4: Code (Error) -->
                 <div class="file-card group relative bg-white border border-red-100 rounded-2xl hover:border-red-200 transition-all duration-300 flex" style="view-transition-name: file-4">
                    
                    <div class="absolute top-4 left-4 z-10 opacity-0 group-hover:opacity-100 transition-opacity list-view:static list-view:opacity-100 list-view:mr-4">
                         <div class="w-5 h-5 rounded border border-gray-300 bg-white hover:border-gray-400 cursor-pointer flex items-center justify-center"></div>
                    </div>

                    <div class="file-preview rounded-xl overflow-hidden flex items-center justify-center border border-red-50 bg-red-50/30 text-red-500">
                        <iconify-icon icon="solar:code-file-linear" width="32" class="grid-view:scale-150 transition-transform"></iconify-icon>
                    </div>

                    <div class="flex-1 min-w-0 flex flex-col justify-center">
                        <h3 class="text-sm font-medium text-gray-900 truncate">main_process_worker.js</h3>
                        <p class="text-xs text-red-500 mt-0.5 flex items-center gap-1">
                            <iconify-icon icon="solar:danger-circle-linear" width="12"></iconify-icon>
                            Upload failed
                        </p>
                    </div>

                    <div class="file-meta-row flex items-center justify-between gap-4">
                        <div class="flex items-center gap-2">
                            <div class="w-6 h-6 rounded-full bg-gray-100 border border-white ring-1 ring-gray-100 flex items-center justify-center text-[10px] text-gray-500 font-medium">SYS</div>
                            <span class="text-xs text-gray-500 hide-on-grid">System</span>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            <button class="text-red-600 hover:text-red-700 text-xs font-medium bg-red-50 px-2 py-1 rounded-md">Retry</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Footer -->
        <div class="p-4 bg-gray-50/80 border-t border-gray-100 text-center">
            <div class="border border-dashed border-gray-300 rounded-xl p-8 hover:bg-gray-100/50 hover:border-gray-400 transition-colors cursor-pointer group">
                <div class="flex flex-col items-center justify-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-white border border-gray-200 shadow-sm flex items-center justify-center text-gray-400 group-hover:text-gray-900 group-hover:scale-110 transition-all">
                        <iconify-icon icon="solar:cloud-upload-linear" width="20"></iconify-icon>
                    </div>
                    <p class="text-sm text-gray-500">Drag files here or <span class="text-gray-900 font-medium cursor-pointer">browse</span></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('file-container');
        const btnList = document.getElementById('btn-list');
        const btnGrid = document.getElementById('btn-grid');

        function switchView(mode) {
            // Check if View Transition API is supported
            if (!document.startViewTransition) {
                updateClasses(mode);
                return;
            }

            document.startViewTransition(() => {
                updateClasses(mode);
            });
        }

        function updateClasses(mode) {
            if (mode === 'list') {
                container.classList.remove('grid-view');
                container.classList.add('list-view');
                
                // Update Button Styles
                btnList.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
                btnList.classList.remove('text-gray-400');
                btnGrid.classList.remove('bg-white', 'shadow-sm', 'text-gray-900');
                btnGrid.classList.add('text-gray-400');
            } else {
                container.classList.remove('list-view');
                container.classList.add('grid-view');

                // Update Button Styles
                btnGrid.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
                btnGrid.classList.remove('text-gray-400');
                btnList.classList.remove('bg-white', 'shadow-sm', 'text-gray-900');
                btnList.classList.add('text-gray-400');
            }
        }
    </script>
</body>
</html>
