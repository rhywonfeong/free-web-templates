  <meta charset="UTF-8">
  <title>Add New Card UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 bg-opacity-70 min-h-screen flex items-center justify-center" style="background-blur:5px;">
  <div class="fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-sm z-10"></div>
  <div class="relative z-20 w-full max-w-md mx-auto">
    <div class="bg-white rounded-2xl shadow-xl p-8 pt-7 relative">
      <!-- Header -->
      <div class="flex justify-between items-start mb-7">
        <h2 class="text-lg font-semibold text-gray-900">Add New Card</h2>
        <button class="p-1.5 rounded-full hover:bg-gray-100 focus:outline-none">
          <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Form Fields -->
      <form class="space-y-5">
        <!-- Name on Card -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Name on Card</label>
          <input type="text" value="Your Name" class="block w-full rounded-lg border border-gray-200 bg-gray-50 focus:border-blue-400 focus:ring-1 focus:ring-blue-200 px-3 py-2 text-sm text-gray-900" />
        </div>
        <!-- Card Number -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Card Number</label>
          <div class="relative flex items-center">
            <input type="text" value="1234 5678 9101 1121" class="block w-full rounded-lg border border-gray-200 bg-gray-50 focus:border-blue-400 focus:ring-1 focus:ring-blue-200 px-3 py-2 text-sm text-gray-900 pr-16" />
            <div class="absolute right-3 top-1/2 -translate-y-1/2 flex items-center space-x-1">
              <!-- Mastercard SVG icon -->
              <span class="inline-flex w-8 h-6 items-center justify-center">
                <svg viewBox="0 0 36 24" class="w-8 h-6">
                  <circle cx="14" cy="12" r="8" fill="#EA001B"/>
                  <circle cx="22" cy="12" r="8" fill="#FFA200" fill-opacity="0.85"/>
                </svg>
              </span>
              <!-- Dropdown arrow -->
              <svg class="w-4 h-4 text-gray-400 ml-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
              </svg>
            </div>
          </div>
        </div>
        <!-- Expiration & CVV -->
        <div class="flex space-x-4">
          <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-1">Expiration Date</label>
            <input type="text" value="12/26" maxlength="5" class="block w-full rounded-lg border border-gray-200 bg-gray-50 focus:border-blue-400 focus:ring-1 focus:ring-blue-200 px-3 py-2 text-sm text-gray-900" />
          </div>
          <div class="flex-1">
            <label class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
            <input type="text" value="123" maxlength="4" class="block w-full rounded-lg border border-gray-200 bg-gray-50 focus:border-blue-400 focus:ring-1 focus:ring-blue-200 px-3 py-2 text-sm text-gray-900" />
          </div>
        </div>

        <!-- Address -->
        <div class="mt-1 rounded-xl border border-gray-200 bg-gray-50 px-4 py-4">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center">
              <!-- Location pin icon -->
              <svg class="w-4 h-4 text-blue-500 mr-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 21s-6-5.686-6-10a6 6 0 1112 0c0 4.314-6 10-6 10z"/><circle cx="12" cy="11" r="2.5" fill="#3B82F6"/>
              </svg>
              <span class="text-sm text-gray-700 font-medium">Autofill verified address</span>
            </div>
            <a href="#" class="text-sm text-blue-600 hover:underline font-medium">Change</a>
          </div>
          <div>
            <p class="text-sm text-gray-900 font-medium mb-1">456 Park Ave, Los Angeles, CA</p>
            <div class="flex items-center space-x-2">
              <span class="text-xs text-gray-500">Post code</span>
              <span class="text-xs text-gray-900 bg-gray-200 px-2 py-0.5 rounded font-medium">90001</span>
            </div>
          </div>
        </div>

        <!-- Confirm Button -->
        <button type="submit" class="w-full mt-2 rounded-lg bg-blue-500 hover:bg-blue-600 transition text-white font-semibold py-2.5 text-base shadow-sm">
          Confirm
        </button>
      </form>
    </div>
  </div>
</body>
</html>
