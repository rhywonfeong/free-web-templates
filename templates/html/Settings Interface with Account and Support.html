<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Settings UI</title>
  <meta name="viewport" content="width=393, initial-scale=1">
  <link href="https://fonts.googleapis.com/css?family=SF+Pro:400,600,700" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .sf-bold { font-family: 'SF Pro', Arial, sans-serif; font-weight: 700;}
    .sf-semi { font-family: 'SF Pro', Arial, sans-serif; font-weight: 600;}
    .sf-regular { font-family: 'SF Pro', Arial, sans-serif; font-weight: 400;}
    .no-scrollbar::-webkit-scrollbar {display:none;}
    .no-scrollbar {scrollbar-width:none;}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-950 to-neutral-800">
  <div id="settings-root" class="w-[380px] flex flex-col rounded-3xl shadow-xl bg-neutral-900/85">
    <!-- Header -->
    <div class="flex items-center justify-between px-7 pt-8 pb-3">
      <h1 class="text-2xl sf-bold text-white tracking-tight">Settings</h1>
      <button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-neutral-700 focus:ring-2 focus:ring-indigo-400 transition outline-none" aria-label="Close Settings">
        <svg width="24" height="24" fill="none" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M6 18L18 6"/></svg>
      </button>
    </div>
    <div class="flex-1 px-4 pb-6 overflow-y-auto no-scrollbar">
      <!-- Account Section -->
      <div class="bg-neutral-800/80 rounded-2xl p-5 mb-5 shadow">
        <h2 class="text-base sf-bold text-white mb-2">Account</h2>
        <ul>
          <li>
            <button class="flex w-full justify-between items-center py-3 rounded-xl hover:bg-indigo-900/10 focus:ring-2 focus:ring-indigo-400 mb-1 transition sf-regular text-white/90 text-[15px] group">
              Personal information
              <svg width="20" height="20" stroke-width="2" stroke="white" fill="none"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </li>
          <li>
            <button class="flex w-full justify-between items-center py-3 rounded-xl hover:bg-indigo-900/10 focus:ring-2 focus:ring-indigo-400 mb-1 transition sf-regular text-white/90 text-[15px] group">
              Notifications
              <svg width="20" height="20" stroke-width="2" stroke="white" fill="none"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </li>
          <li>
            <button class="flex w-full justify-between items-center py-3 rounded-xl hover:bg-indigo-900/10 focus:ring-2 focus:ring-indigo-400 mb-1 transition sf-regular text-white/90 text-[15px] group">
              Payments and payouts
              <svg width="20" height="20" stroke-width="2" stroke="white" fill="none"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </li>
          <li>
            <button class="flex w-full justify-between items-center py-3 rounded-xl hover:bg-indigo-900/10 focus:ring-2 focus:ring-indigo-400 transition sf-regular text-white/90 text-[15px] group">
              Privacy and sharing
              <svg width="20" height="20" stroke-width="2" stroke="white" fill="none"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </li>
        </ul>
      </div>
      <!-- Support Section -->
      <div class="bg-neutral-800/80 rounded-2xl p-5 mb-5 shadow">
        <h2 class="text-base sf-bold text-white mb-2">Support</h2>
        <button class="block w-full text-left p-3 rounded-xl hover:bg-indigo-900/10 focus:ring-2 focus:ring-indigo-400 transition group">
          <div>
            <div class="sf-semi text-[15px] mb-0.5 text-white">Safety Center</div>
            <div class="text-[14px] sf-regular text-white/80 leading-5">Get the support, tools & info you need to be safe.</div>
          </div>
          <svg width="20" height="20" stroke-width="2" stroke="white" fill="none" class="mt-1 float-right"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="block w-full text-left p-3 mt-2 rounded-xl hover:bg-indigo-900/10 focus:ring-2 focus:ring-indigo-400 transition group">
          <div>
            <div class="sf-semi text-[15px] mb-0.5 text-white">Contact Support</div>
            <div class="text-[14px] sf-regular text-white/80 leading-5">Let our team know about your concerns.</div>
          </div>
          <svg width="20" height="20" stroke-width="2" stroke="white" fill="none" class="mt-1 float-right"><path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <!-- Log out Button -->
    <div class="w-full px-9 pb-7">
      <button class="w-full py-2.5 rounded-xl bg-indigo-500 text-white text-base font-semibold shadow-lg hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-300 transition sf-semi">Log out</button>
    </div>
  </div>
</body>
</html>
