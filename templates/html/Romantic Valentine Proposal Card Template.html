<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Halima</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #FAFAFA; /* neutral-50 */
background-image:
radial-gradient(at 0% 0%, rgba(255, 228, 230, 0.3) 0px, transparent 50%),
radial-gradient(at 100% 100%, rgba(225, 29, 72, 0.05) 0px, transparent 50%);
}
.animate-float {
animation: float 6s ease-in-out infinite;
}
@keyframes float {
0% { transform: translateY(0px); }
50% { transform: translateY(-10px); }
100% { transform: translateY(0px); }
}
#no-btn {
transition: all 0.2s ease;
}
</style></head>
<body class="flex flex-col items-center justify-center min-h-screen p-6 text-neutral-900 overflow-hidden relative selection:bg-rose-100 selection:text-rose-600">

    <!-- Decorative Elements -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-rose-200/20 rounded-full blur-3xl mix-blend-multiply filter animate-float"></div>
        <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-rose-300/20 rounded-full blur-3xl mix-blend-multiply filter animate-float" style="animation-delay: 2s;"></div>
    </div>

    <!-- Main Card -->
    <main class="relative z-10 w-full max-w-lg">
        <div class="bg-white/80 backdrop-blur-xl border border-white/50 shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-3xl p-8 md:p-12 transition-all duration-500 ease-out transform hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] ring-1 ring-black/5" id="main-card">
            
            <!-- Question State -->
            <div id="question-state" class="flex flex-col items-center text-center space-y-8 transition-opacity duration-500">
                
                <!-- Profile Picture (User Requested) -->
                <!-- Note: Replace the src below with the actual path to the image of Halima -->
                <div class="relative group">
                    <div class="absolute inset-0 bg-gradient-to-tr from-rose-200 to-rose-100 rounded-full blur-lg opacity-60 animate-pulse group-hover:opacity-80 transition-opacity duration-500"></div>
                    <div class="relative p-1.5 bg-white rounded-full shadow-lg ring-1 ring-black/5">
                        <img 
                            src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=400&h=400&fit=crop" 
                            alt="Halima" 
                            class="w-32 h-32 rounded-full object-cover border border-neutral-100"
                        >
                    </div>
                    <div class="absolute bottom-1 right-1 bg-white rounded-full p-1.5 shadow-md border border-neutral-100">
                         <i data-lucide="heart" class="w-4 h-4 text-rose-500 fill-rose-500"></i>
                    </div>
                </div>

                <!-- Text Content -->
                <div class="space-y-3">
                    <p class="text-sm font-medium tracking-widest text-rose-500 uppercase">A question for</p>
                    <h1 class="text-4xl md:text-5xl font-semibold tracking-tight text-neutral-900">
                        Halima
                    </h1>
                    <p class="text-base text-neutral-500 leading-relaxed max-w-[320px] mx-auto pt-2 font-normal">
                        Life is better with you. Will you be my Valentine, today and forever?
                    </p>
                </div>

                <!-- Actions -->
                <div class="flex flex-col sm:flex-row items-center gap-4 w-full pt-4 relative min-h-[60px]">
                    <button id="yes-btn" class="w-full sm:w-auto flex-1 inline-flex items-center justify-center gap-2.5 px-8 py-3.5 bg-rose-500 hover:bg-rose-600 active:bg-rose-700 text-white text-base font-medium rounded-xl transition-all duration-200 shadow-sm shadow-rose-200 hover:shadow-rose-300 group">
                        <span>Yes, Forever</span>
                        <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-0.5 transition-transform" stroke-width="2"></i>
                    </button>
                    
                    <button id="no-btn" class="w-full sm:w-auto flex-1 inline-flex items-center justify-center gap-2.5 px-8 py-3.5 bg-white border border-neutral-200 text-neutral-600 hover:bg-neutral-50 hover:border-neutral-300 text-base font-medium rounded-xl transition-all duration-200 group">
                        <span>No</span>
                    </button>
                </div>
            </div>

            <!-- Success State (Hidden initially) -->
            <div id="success-state" class="hidden flex-col items-center text-center space-y-6 animate-in fade-in zoom-in duration-500 py-4">
                <div class="size-24 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mb-2 shadow-inner">
                    <i data-lucide="heart" class="w-12 h-12 fill-rose-100" stroke-width="1.5"></i>
                </div>
                <div class="space-y-3">
                    <h2 class="text-3xl font-semibold tracking-tight text-neutral-900">She said Yes!</h2>
                    <p class="text-base text-neutral-500 leading-relaxed">I love you, Halima. <br>Happy Valentine's Day.</p>
                </div>
                <div class="pt-8 w-full border-t border-neutral-100">
                    <div class="flex items-center justify-center gap-6 text-sm text-neutral-400 font-medium">
                        <span class="flex items-center gap-2">
                            <i data-lucide="calendar" class="w-4 h-4"></i>
                            Forever
                        </span>
                        <span class="w-1.5 h-1.5 bg-neutral-200 rounded-full"></span>
                        <span class="flex items-center gap-2">
                            <i data-lucide="heart" class="w-4 h-4"></i>
                            Always
                        </span>
                    </div>
                </div>
            </div>

        </div>
        
        <footer class="mt-8 text-center opacity-40 hover:opacity-100 transition-opacity duration-300">
            <p class="text-sm text-neutral-400 flex items-center justify-center gap-2">
                <i data-lucide="lock" class="w-3 h-3"></i>
                Secured by Love
            </p>
        </footer>
    </main>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const questionState = document.getElementById('question-state');
        const successState = document.getElementById('success-state');
        const mainCard = document.getElementById('main-card');

        // Confetti configuration
        function triggerConfetti() {
            const count = 200;
            const defaults = {
                origin: { y: 0.7 },
                colors: ['#f43f5e', '#fb7185', '#fda4af', '#ffe4e6']
            };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        yesBtn.addEventListener('click', () => {
            questionState.style.opacity = '0';
            questionState.style.transform = 'translateY(-10px)';
            
            setTimeout(() => {
                questionState.classList.add('hidden');
                successState.classList.remove('hidden');
                successState.style.display = 'flex';
                // Re-trigger icon scan for the newly visible content if needed, 
                // though Lucide usually handles initial load. 
                // Just to be safe if content was dynamic:
                lucide.createIcons(); 
                
                triggerConfetti();
                
                let end = Date.now() + 3000;
                let colors = ['#f43f5e', '#ffffff'];

                (function frame() {
                    confetti({
                        particleCount: 2,
                        angle: 60,
                        spread: 55,
                        origin: { x: 0 },
                        colors: colors,
                        zIndex: 999
                    });
                    confetti({
                        particleCount: 2,
                        angle: 120,
                        spread: 55,
                        origin: { x: 1 },
                        colors: colors,
                        zIndex: 999
                    });

                    if (Date.now() < end) {
                        requestAnimationFrame(frame);
                    }
                }());

            }, 400);
        });

        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        if (!isMobile) {
            noBtn.addEventListener('mouseover', moveButton);
        } else {
            noBtn.addEventListener('click', (e) => {
                e.preventDefault();
                moveButton();
            });
        }

        function moveButton() {
            const maxX = 100;
            const maxY = 80;
            
            const randomX = Math.floor(Math.random() * (maxX * 2)) - maxX;
            const randomY = Math.floor(Math.random() * (maxY * 2)) - maxY;

            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            noBtn.style.opacity = '0.8';
        }
    </script>
</body>
</html>
