<html lang="en" class="h-full">
<head>

  <meta charset="UTF-8">
  <title>Shape Match!</title>
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, html { height: 100%; }
    .font-fun { font-family: 'Fredoka', Arial, sans-serif; }
    .pop-in { animation: pop-in 0.7s cubic-bezier(.2,1.8,.5,1) both; }
    @keyframes pop-in {
      0% { transform: scale(0.7) translateY(-20px); opacity:0; }
      75% { transform: scale(1.1) translateY(3px); }
      100% { transform: scale(1) translateY(0); opacity:1; }
    }
    .wiggle { animation: wiggle .5s infinite; }
    @keyframes wiggle {
      0%,100% { transform: rotate(-4deg);}
      25% { transform: rotate(6deg);}
      50% { transform: rotate(-2deg);}
      75% { transform: rotate(4deg);}
    }
    /* Subtle glowing mesh */
    .glow-mesh {
      position: absolute; 
      filter: blur(24px) brightness(1.2);
      opacity: 0.32;
      z-index: 0;
    }
    .drop-glow {
      box-shadow: 0 0 0 4px rgba(99,102,241,0.2),0 2px 16px 0 rgba(99,102,241,0.10);
      transition: box-shadow 0.18s;
    }
    .drop-glow-active {
      box-shadow: 0 0 0 7px #fde68a99,0 2px 24px 0 #fbbf2411;
    }
    .confetti {
      animation: confetti-burst 0.7s both;
    }
    @keyframes confetti-burst {
      0% { opacity: 0; transform: scale(0.8);}
      20% { opacity: 1; }
      80% { opacity: 1;}
      100% { opacity: 0; transform: scale(1.4);}
    }
    .animal-pop {
      animation: animal-pop 0.8s cubic-bezier(.2,1.5,.5,1) both;
    }
    @keyframes animal-pop {
      0% {transform: scale(0.2) rotate(-10deg);}
      65% {transform: scale(1.15) rotate(3deg);}
      100% {transform: scale(1) rotate(0);}
    }
    .dark .confetti { filter: brightness(1.3);}
    .dark .drop-glow-active { box-shadow: 0 0 0 9px #a78bfa99,0 2px 24px 0 #a78bfa11;}
  </style>
</head>
<body class="h-full flex justify-center items-center bg-gradient-to-br from-sky-100 via-rose-50 to-orange-50 dark:from-indigo-950 dark:via-violet-900 dark:to-slate-900 transition-colors duration-500">

  <div class="relative mx-auto w-[390px] h-[844px] rounded-3xl shadow-xl overflow-hidden border-2 border-indigo-200 dark:border-indigo-900 flex flex-col bg-white dark:bg-slate-900 transition-colors duration-500">

    <!-- Top Bar -->
    <div class="flex items-center justify-between px-5 pt-7 pb-2 w-full">
      <span class="block text-2xl md:text-3xl text-indigo-500 dark:text-yellow-200 font-fun font-bold pop-in drop-shadow-sm select-none" style="text-shadow:0 3px 8px #e0e7ff77;">Shape Match!</span>
      <div class="flex items-center space-x-5">
        <div class="flex items-center gap-1 text-lg font-bold text-yellow-400 dark:text-yellow-200 drop-shadow">
          <span>🌟</span><span id="score" class="font-fun">3</span>
        </div>
        <div class="flex items-center gap-1 text-lg text-indigo-400 dark:text-indigo-200">
          <span>⏰</span><span id="timer" class="font-mono font-bold">00:45</span>
        </div>
        <button id="dark-toggle" class="ml-3 p-1 rounded-full shadow hover:bg-indigo-100 dark:hover:bg-indigo-800 transition" aria-label="Toggle dark mode">
          <svg class="w-6 h-6 text-indigo-300 dark:text-indigo-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M12 3v1m0 16v1m8.66-4.66-.7.7m-13.66 0-.7-.7m16.97-6.36h-1m-16 0h-1m13.66 13.66-.7-.7m-13.66 0-.7-.7" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Voice guidance -->
    <div class="relative px-5 pb-1 pt-1 flex items-center gap-2">
      <span class="text-sm font-fun text-indigo-400 dark:text-indigo-200 animate-pulse">🔈 Can you find the triangle?</span>
    </div>

    <!-- Game Area -->
    <div class="flex-1 flex flex-col items-center justify-center relative z-10">
      <!-- Silhouettes (drop zones) -->
      <div class="relative flex flex-wrap justify-center items-end gap-7 mt-8 mb-4 w-full z-10">
        <!-- Circle silhouette -->
        <div class="relative flex flex-col items-center group">
          <div class="glow-mesh left-1/2 top-1/2 w-24 h-24 bg-blue-400 rounded-full -z-10"
               style="left:50%;top:50%;transform:translate(-50%,-50%);"></div>
          <div id="drop-circle" class="w-20 h-20 rounded-full bg-blue-100/60 dark:bg-blue-800/40 border-4 border-dashed border-blue-200 dark:border-blue-500 flex items-center justify-center drop-glow transition-all">
            <svg class="w-14 h-14 opacity-40" fill="none" stroke="#3b82f6" stroke-width="3"><circle cx="28" cy="28" r="25" /></svg>
          </div>
        </div>
        <!-- Square silhouette -->
        <div class="relative flex flex-col items-center group">
          <div class="glow-mesh left-1/2 top-1/2 w-24 h-24 bg-red-400 rounded-xl -z-10"
               style="left:50%;top:50%;transform:translate(-50%,-50%);"></div>
          <div id="drop-square" class="w-20 h-20 rounded-xl bg-red-100/60 dark:bg-red-800/40 border-4 border-dashed border-red-200 dark:border-red-400 flex items-center justify-center drop-glow transition-all">
            <svg class="w-14 h-14 opacity-40" fill="none" stroke="#ef4444" stroke-width="3"><rect x="5" y="5" width="38" height="38" rx="8"/></svg>
          </div>
        </div>
        <!-- Triangle silhouette -->
        <div class="relative flex flex-col items-center group">
          <div class="glow-mesh left-1/2 top-1/2 w-24 h-24 bg-yellow-300 rounded-full -z-10"
               style="left:50%;top:50%;transform:translate(-50%,-50%);"></div>
          <div id="drop-triangle" class="w-20 h-20 rounded-2xl bg-yellow-100/60 dark:bg-yellow-700/50 border-4 border-dashed border-yellow-200 dark:border-yellow-300 flex items-center justify-center drop-glow transition-all">
            <svg class="w-14 h-14 opacity-40" viewBox="0 0 48 48" fill="none" stroke="#fbbf24" stroke-width="3">
              <polygon points="24,8 44,40 4,40" />
            </svg>
          </div>
        </div>
        <!-- Rectangle silhouette -->
        <div class="relative flex flex-col items-center group">
          <div class="glow-mesh left-1/2 top-1/2 w-28 h-16 bg-purple-400 rounded-2xl -z-10"
               style="left:50%;top:50%;transform:translate(-50%,-50%);"></div>
          <div id="drop-rect" class="w-24 h-14 rounded-xl bg-purple-100/60 dark:bg-purple-900/50 border-4 border-dashed border-purple-200 dark:border-purple-400 flex items-center justify-center drop-glow transition-all">
            <svg class="w-16 h-9 opacity-40" fill="none" stroke="#a78bfa" stroke-width="3">
              <rect x="4" y="4" width="56" height="20" rx="7"/>
            </svg>
          </div>
        </div>
      </div>
      <!-- Drag shapes -->
      <div class="relative flex flex-wrap justify-center gap-7 mt-7 mb-3 z-20">
        <!-- Blue Circle -->
        <div draggable="true" class="group relative cursor-pointer focus:outline-none transition-transform hover:scale-110 active:scale-95"
          onmouseenter="this.classList.add('animate-bounce')" onmouseleave="this.classList.remove('animate-bounce')">
          <div class="glow-mesh w-16 h-16 rounded-full bg-blue-300 left-1/2 -top-3" style="left:50%;top:-14px;transform:translate(-50%,0);"></div>
          <div class="w-16 h-16 rounded-full bg-blue-500 shadow-lg border-4 border-blue-300 flex items-center justify-center transition-all duration-200"></div>
        </div>
        <!-- Red Square -->
        <div draggable="true" class="group relative cursor-pointer focus:outline-none transition-transform hover:scale-110 active:scale-95"
          onmouseenter="this.classList.add('animate-bounce')" onmouseleave="this.classList.remove('animate-bounce')">
          <div class="glow-mesh w-16 h-16 rounded-xl bg-red-300 left-1/2 -top-3" style="left:50%;top:-14px;transform:translate(-50%,0);"></div>
          <div class="w-16 h-16 rounded-xl bg-red-500 shadow-lg border-4 border-red-300 flex items-center justify-center transition-all duration-200"></div>
        </div>
        <!-- Yellow Triangle -->
        <div draggable="true" class="group relative cursor-pointer focus:outline-none transition-transform hover:scale-110 active:scale-95"
          onmouseenter="this.classList.add('animate-bounce')" onmouseleave="this.classList.remove('animate-bounce')">
          <div class="glow-mesh w-16 h-16 rounded-full bg-yellow-200 left-1/2 -top-3" style="left:50%;top:-14px;transform:translate(-50%,0);"></div>
          <svg class="w-16 h-16" viewBox="0 0 48 48">
            <polygon points="24,8 44,40 4,40" class="fill-yellow-400 stroke-yellow-300 stroke-4 drop-shadow-lg"/>
          </svg>
        </div>
        <!-- Purple Rectangle -->
        <div draggable="true" class="group relative cursor-pointer focus:outline-none transition-transform hover:scale-110 active:scale-95"
          onmouseenter="this.classList.add('animate-bounce')" onmouseleave="this.classList.remove('animate-bounce')">
          <div class="glow-mesh w-20 h-12 rounded-xl bg-purple-300 left-1/2 -top-3" style="left:50%;top:-12px;transform:translate(-50%,0);"></div>
          <div class="w-20 h-12 rounded-xl bg-purple-500 shadow-lg border-4 border-purple-300 flex items-center justify-center transition-all duration-200"></div>
        </div>
      </div>
      <!-- Start Game Button -->
      <div class="absolute left-0 right-0 mx-auto mt-3 flex justify-center">
        <button class="px-8 py-3 bg-gradient-to-tr from-fuchsia-400 via-indigo-400 to-purple-500 text-white font-fun text-lg rounded-full shadow-xl hover:scale-[1.07] transition-all duration-150 blur-[1.5px] hover:blur-0 hover:wiggle focus:outline-none"
          onclick="this.blur();">
          Start Game
        </button>
      </div>
    </div>

    <!-- Confetti (on correct drop, hidden by default) -->
    <div id="confetti" class="pointer-events-none absolute inset-0 flex justify-center items-center z-40 hidden">
      <svg class="confetti w-40 h-40" viewBox="0 0 160 160">
        <g>
          <circle cx="20" cy="60" r="7" fill="#fbbf24"/>
          <circle cx="80" cy="30" r="10" fill="#3b82f6"/>
          <circle cx="120" cy="90" r="7" fill="#ef4444"/>
          <circle cx="60" cy="120" r="8" fill="#a78bfa"/>
          <circle cx="110" cy="60" r="6" fill="#f472b6"/>
        </g>
      </svg>
    </div>

    <!-- Animated Reward Animal (after all matched, hidden by default) -->
    <div id="animal-reward" class="pointer-events-none absolute inset-0 flex items-center justify-center z-50 hidden">
      <div class="animal-pop bg-white/80 dark:bg-slate-800/90 border-4 border-indigo-200 dark:border-indigo-600 rounded-2xl shadow-2xl px-8 py-7 flex flex-col items-center">
        <span class="text-7xl mb-2 animate-pulse">🦊</span>
        <span class="font-fun text-xl text-indigo-500 dark:text-yellow-200">Great job!</span>
      </div>
    </div>

    <!-- Next/Replay Buttons (hidden by default) -->
    <div id="next-btns" class="absolute bottom-8 left-0 right-0 flex justify-center items-center gap-5 z-30 hidden">
      <button class="px-7 py-2 bg-gradient-to-r from-blue-400 via-indigo-500 to-fuchsia-400 text-white font-fun text-lg rounded-full shadow hover:scale-105 hover:wiggle transition-all duration-150">Replay</button>
      <button class="px-7 py-2 bg-gradient-to-r from-yellow-300 via-pink-400 to-purple-400 text-white font-fun text-lg rounded-full shadow hover:scale-105 hover:wiggle transition-all duration-150">Next Level</button>
    </div>
  </div>

  <script>
    // Simple dark mode toggle
    const html = document.documentElement;
    document.getElementById('dark-toggle').onclick = () => {
      html.classList.toggle('dark');
    };
    // Glow on drop zone when shape is hovered or dragged
    document.querySelectorAll('[draggable=true]').forEach((shape, idx) => {
      shape.addEventListener('dragstart', (e) => {
        document.querySelectorAll('.drop-glow').forEach(dz => dz.classList.add('drop-glow-active'));
        setTimeout(()=>shape.classList.add('scale-90'), 1);
      });
      shape.addEventListener('dragend', (e) => {
        document.querySelectorAll('.drop-glow').forEach(dz => dz.classList.remove('drop-glow-active'));
        shape.classList.remove('scale-90');
      });
    });
    document.querySelectorAll('.drop-glow').forEach(drop => {
      drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drop-glow-active'); });
      drop.addEventListener('dragleave', e => { drop.classList.remove('drop-glow-active'); });
      drop.addEventListener('drop', e => {
        drop.classList.remove('drop-glow-active');
        // feedback: show confetti, fake animal pop, etc
        document.getElementById('confetti').classList.remove('hidden');
        setTimeout(()=>document.getElementById('confetti').classList.add('hidden'),700);
        setTimeout(()=>document.getElementById('animal-reward').classList.remove('hidden'),1100);
        setTimeout(()=>{
          document.getElementById('animal-reward').classList.add('hidden');
          document.getElementById('next-btns').classList.remove('hidden');
        }, 2500);
      });
    });
    // Start Game button
    document.querySelector('button[onclick]').onclick = function(){
      this.classList.add('hidden');
    }
  </script>
</body>
</html>
