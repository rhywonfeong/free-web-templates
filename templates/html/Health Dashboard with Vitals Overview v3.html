<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}
</script>
<meta charset="UTF-8">
<title>PulseMate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.tailwindcss.com"></script></head>

<body class="font-inter bg-gray-50 text-gray-800 antialiased">
  <!-- App Wrapper -->
  <div class="relative w-full max-w-sm sm:max-w-md md:max-w-lg lg:max-w-xl xl:max-w-2xl mx-auto px-4 md:px-6 lg:px-8 pt-6 pb-28 space-y-6">

    <!-- Header -->
    <header class="flex items-center justify-between opacity-0 translate-y-6 transition-all duration-700" data-animate>
      <h1 class="text-2xl tracking-tight font-semibold">PulseMate</h1>
      <button class="p-2 rounded-full hover:bg-gray-100 transition">
        <i data-lucide="bell" class="w-5 h-5"></i>
      </button>
    </header>

    <!-- Vital Stats Card -->
    <section class="bg-white shadow-sm ring-1 ring-gray-200/60 rounded-xl overflow-hidden opacity-0 translate-y-6 transition-all duration-700" data-animate>
      <div class="p-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-indigo-600/10 rounded-full">
            <i data-lucide="heart-pulse" class="w-5 h-5 text-indigo-600"></i>
          </div>
          <div>
            <p class="text-sm text-gray-500">Current Heart Rate</p>
            <p class="text-xl font-semibold tracking-tight">72 bpm</p>
          </div>
        </div>
        <span class="inline-flex items-center text-xs px-2.5 py-0.5 rounded-full bg-green-50 text-green-700">
          Stable
        </span>
      </div>

      <div class="border-t border-dashed border-gray-200"></div>

      <div class="p-4">
        <p class="text-sm mb-2 text-gray-500">Past Week</p>
        <div>
          <div class="relative">
            <canvas id="hrChart" height="140"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- Upcoming Appointment -->
    <section class="bg-white shadow-sm ring-1 ring-gray-200/60 rounded-xl p-4 space-y-4 opacity-0 translate-y-6 transition-all duration-700" data-animate>
      <h2 class="text-lg font-semibold tracking-tight">Next Appointment</h2>
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="p-2 bg-rose-600/10 rounded-full">
            <i data-lucide="stethoscope" class="w-5 h-5 text-rose-600"></i>
          </div>
          <div>
            <p class="text-sm font-medium">Dr. Emily Carter</p>
            <p class="text-xs text-gray-500">Cardiologist • Sep 28, 10:30 AM</p>
          </div>
        </div>
        <button class="text-sm px-3 py-1.5 rounded-md bg-rose-600 text-white hover:bg-rose-700 transition">Reschedule</button>
      </div>
    </section>

    <!-- Medication Reminders -->
    <section class="bg-white shadow-sm ring-1 ring-gray-200/60 rounded-xl p-4 opacity-0 translate-y-6 transition-all duration-700" data-animate>
      <h2 class="text-lg font-semibold tracking-tight mb-4">Today’s Medications</h2>
      <ul class="space-y-3">
        <li class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="p-2 bg-teal-600/10 rounded-full">
              <i data-lucide="pill" class="w-5 h-5 text-teal-600"></i>
            </div>
            <div>
              <p class="text-sm font-medium">Metformin</p>
              <p class="text-xs text-gray-500">08:00 AM</p>
            </div>
          </div>
          <button data-pill class="text-xs font-medium px-3 py-1.5 rounded-md ring-1 ring-gray-300 hover:bg-gray-100 transition">Mark taken</button>
        </li>

        <li class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="p-2 bg-teal-600/10 rounded-full">
              <i data-lucide="pill" class="w-5 h-5 text-teal-600"></i>
            </div>
            <div>
              <p class="text-sm font-medium">Lisinopril</p>
              <p class="text-xs text-gray-500">12:00 PM</p>
            </div>
          </div>
          <button data-pill class="text-xs font-medium px-3 py-1.5 rounded-md ring-1 ring-gray-300 hover:bg-gray-100 transition">Mark taken</button>
        </li>

        <li class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <div class="p-2 bg-teal-600/10 rounded-full">
              <i data-lucide="pill" class="w-5 h-5 text-teal-600"></i>
            </div>
            <div>
              <p class="text-sm font-medium">Atorvastatin</p>
              <p class="text-xs text-gray-500">09:00 PM</p>
            </div>
          </div>
          <button data-pill class="text-xs font-medium px-3 py-1.5 rounded-md ring-1 ring-gray-300 hover:bg-gray-100 transition">Mark taken</button>
        </li>
      </ul>
    </section>
  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-gray-200">
    <div class="max-w-sm sm:max-w-md md:max-w-lg lg:max-w-xl xl:max-w-2xl mx-auto grid grid-cols-5 text-xs">
      <button class="flex flex-col items-center gap-0.5 py-2 text-indigo-600">
        <i data-lucide="home" class="w-5 h-5"></i>
        Home
      </button>
      <button class="flex flex-col items-center gap-0.5 py-2 text-gray-500 hover:text-indigo-600 transition">
        <i data-lucide="activity" class="w-5 h-5"></i>
        Vitals
      </button>
      <button class="flex flex-col items-center gap-0.5 py-2 text-gray-500 hover:text-indigo-600 transition">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        Visits
      </button>
      <button class="flex flex-col items-center gap-0.5 py-2 text-gray-500 hover:text-indigo-600 transition">
        <i data-lucide="pill" class="w-5 h-5"></i>
        Meds
      </button>
      <button class="flex flex-col items-center gap-0.5 py-2 text-gray-500 hover:text-indigo-600 transition">
        <i data-lucide="settings" class="w-5 h-5"></i>
        Settings
      </button>
    </div>
  </nav>

  <!-- Animation & Interaction -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const items = document.querySelectorAll('[data-animate]');
      items.forEach((el, idx) => {
        setTimeout(() => {
          el.classList.remove('opacity-0', 'translate-y-6');
        }, idx * 120);
      });

      const ctx = document.getElementById('hrChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
          datasets: [{
            label: 'Heart Rate',
            data: [72, 70, 75, 73, 71, 74, 72],
            borderColor: '#6366f1',
            backgroundColor: 'rgba(99, 102, 241, 0.1)',
            tension: 0.4,
            pointRadius: 3,
            pointHoverRadius: 4,
            fill: true
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { display: false }, beginAtZero: false },
            x: { grid: { display: false } }
          }
        }
      });

      document.querySelectorAll('[data-pill]').forEach(btn => {
        btn.addEventListener('click', () => {
          const li = btn.closest('li');
          li.classList.add('opacity-50');
          btn.textContent = 'Taken';
          btn.disabled = true;
          btn.classList.add('bg-teal-600', 'text-white', 'ring-0', 'hover:bg-teal-600');
        });
      });

      lucide.createIcons({ attr: { 'stroke-width': 1.5 } });
    });
  </script>
</body>
</html>
