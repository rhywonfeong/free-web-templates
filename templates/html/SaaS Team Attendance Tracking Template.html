    <script>
      // Simple, self-contained Team Attendance (no modals, no backend)

      const EMPLOYEES = [
        { id: "260172", name: "Main" },
        { id: "273150", name: "Vijay Laxmi" },
        { id: "253566", name: "Abdul" },
        { id: "269919", name: "Vadla vishalatha" },
        { id: "260236", name: "Shabbir" },
        { id: "255279", name: "Sonu jitendra" },
        { id: "273004", name: "Silas" },
        { id: "273005", name: "Sushma" },
        { id: "272446", name: "B Ravi" },
        { id: "257689", name: "FAIZ" },
        { id: "258421", name: "Owais" },
        { id: "251178", name: "Ravi Kiran" },
        { id: "244416", name: "Govind" },
        { id: "231352", name: "Gaffar" },
        { id: "264264", name: "Mukesh" }
      ];

      const STORAGE_KEY = "team_attendance_records_v2";

      // In-memory fallback always works even if localStorage fails
      let inMemoryRecords = [];
      let records = [];

      let currentFilter = "today";
      let searchQuery = "";

      function safeLoad() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          if (Array.isArray(parsed)) {
            records = parsed;
          } else {
            records = [];
          }
        } catch (e) {
          records = [];
        }

        // Merge any in-memory records from this session (if any)
        if (inMemoryRecords.length) {
          const existingIds = new Set(records.map(r => r.id));
          inMemoryRecords.forEach(r => {
            if (!existingIds.has(r.id)) records.push(r);
          });
        }

        cleanOldData();
      }

      function safeSave() {
        // Always keep an in-session copy
        inMemoryRecords = [...records];
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
        } catch (e) {
          // Ignore; app must still work
        }
      }

      // IST helpers using Intl (Asia/Kolkata)
      function getISTParts(date = new Date()) {
        const dtf = new Intl.DateTimeFormat("en-US", {
          timeZone: "Asia/Kolkata",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false
        });
        const partsArr = dtf.formatToParts(date);
        const parts = {};
        partsArr.forEach(p => {
          if (p.type !== "literal") parts[p.type] = p.value;
        });
        return {
          year: Number(parts.year),
          month: Number(parts.month),
          day: Number(parts.day),
          hour: Number(parts.hour),
          minute: Number(parts.minute),
          second: Number(parts.second)
        };
      }

      // Convert an IST wall-clock time to an approximate UTC Date for duration math
      // (works reliably for IST since no DST)
      function istPartsToUTCDate({ year, month, day, hour, minute, second }) {
        const utcMs = Date.UTC(year, month - 1, day, hour - 5, minute - 30, second || 0, 0);
        return new Date(utcMs);
      }

      function nowISTParts() {
        return getISTParts(new Date());
      }

      // Attendance day starts at 7:00 AM IST
      function getAttendanceDayKeyFromISTParts(p) {
        // Key: YYYY-MM-DD representing the attendance day start date in IST
        const d = new Date(Date.UTC(p.year, p.month - 1, p.day, 0, 0, 0));
        // If before 7 AM IST, attendance day is previous calendar day
        if (p.hour < 7) {
          d.setUTCDate(d.getUTCDate() - 1);
        }
        const y = d.getUTCFullYear();
        const m = String(d.getUTCMonth() + 1).padStart(2, "0");
        const day = String(d.getUTCDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function getCurrentAttendanceDayKey() {
        return getAttendanceDayKeyFromISTParts(nowISTParts());
      }

      function formatTimeFromISTParts(p) {
        let h = p.hour;
        const m = String(p.minute).padStart(2, "0");
        const s = String(p.second).padStart(2, "0");
        const ampm = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        return `${h}:${m}:${s} ${ampm}`;
      }

      function formatTimeShortFromISTParts(p) {
        let h = p.hour;
        const m = String(p.minute).padStart(2, "0");
        const ampm = h >= 12 ? "PM" : "AM";
        h = h % 12 || 12;
        return `${h}:${m} ${ampm}`;
      }

      function formatDisplayDateFromKey(key) {
        // key = YYYY-MM-DD
        const [y, m, d] = key.split("-").map(Number);
        const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        return `${String(d).padStart(2, "0")} ${months[m - 1]} ${y}`;
      }

      function calculateDuration(loginUTC, logoutUTC) {
        if (!loginUTC || !logoutUTC) return "—";
        const diffMs = new Date(logoutUTC) - new Date(loginUTC);
        if (!(diffMs >= 0)) return "—";
        const hours = Math.floor(diffMs / 3600000);
        const mins = Math.floor((diffMs % 3600000) / 60000);
        return `${hours}h ${mins}m`;
      }

      function cleanOldData() {
        // Keep most recent 30 attendance days based on attendanceDayKey
        const keys = Array.from(new Set(records.map(r => r.attendanceDayKey))).filter(Boolean);
        keys.sort((a, b) => (a < b ? 1 : -1));
        const keep = new Set(keys.slice(0, 30));
        records = records.filter(r => keep.has(r.attendanceDayKey));
        safeSave();
      }

      function getTodayRecord(employeeId) {
        const key = getCurrentAttendanceDayKey();
        return records.find(r => r.employeeId === employeeId && r.attendanceDayKey === key);
      }

      // UI
      function updateClock() {
        const p = nowISTParts();
        const el = document.getElementById("live-time");
        if (el) el.textContent = `${formatTimeFromISTParts(p)}`;
      }

      function setFilter(filter) {
        currentFilter = filter;
        document.getElementById("filter-today").className = filter === "today" ?
          "px-3 py-1.5 text-xs font-medium rounded-lg border bg-neutral-900 text-white border-neutral-900 transition-colors" :
          "px-3 py-1.5 text-xs font-medium rounded-lg border bg-white text-neutral-600 border-neutral-200 hover:bg-neutral-50 transition-colors";
        document.getElementById("filter-7days").className = filter === "7days" ?
          "px-3 py-1.5 text-xs font-medium rounded-lg border bg-neutral-900 text-white border-neutral-900 transition-colors" :
          "px-3 py-1.5 text-xs font-medium rounded-lg border bg-white text-neutral-600 border-neutral-200 hover:bg-neutral-50 transition-colors";
        document.getElementById("filter-30days").className = filter === "30days" ?
          "px-3 py-1.5 text-xs font-medium rounded-lg border bg-neutral-900 text-white border-neutral-900 transition-colors" :
          "px-3 py-1.5 text-xs font-medium rounded-lg border bg-white text-neutral-600 border-neutral-200 hover:bg-neutral-50 transition-colors";
        renderHistory();
      }

      function renderStats() {
        const todayKey = getCurrentAttendanceDayKey();
        const todayRecords = records.filter(r => r.attendanceDayKey === todayKey);
        const working = todayRecords.filter(r => r.status === "Working").length;
        const completed = todayRecords.filter(r => r.status === "Completed").length;

        document.getElementById("stat-total").textContent = String(EMPLOYEES.length);
        document.getElementById("stat-working").textContent = String(working);
        document.getElementById("stat-completed").textContent = String(completed);
      }

      function cardStatusInfo(record) {
        if (!record) {
          return { status: "Not Logged In", statusClass: "bg-neutral-100 text-neutral-600 border-neutral-200", mainBtn: "LOGIN", mainBtnClass: "bg-neutral-900 text-white hover:bg-neutral-800", mainBtnDisabled: false };
        }
        if (record.status === "Working") {
          return { status: "Working", statusClass: "bg-emerald-50 text-emerald-700 border-emerald-100", mainBtn: "LOGOUT", mainBtnClass: "bg-white border border-neutral-200 text-neutral-900 hover:bg-neutral-50", mainBtnDisabled: false };
        }
        return { status: "Completed", statusClass: "bg-blue-50 text-blue-700 border-blue-100", mainBtn: "COMPLETED", mainBtnClass: "bg-neutral-100 text-neutral-500 border border-neutral-200", mainBtnDisabled: true };
      }

      function renderTeam() {
        const grid = document.getElementById("team-grid");
        grid.innerHTML = "";

        EMPLOYEES.forEach(emp => {
          const record = getTodayRecord(emp.id);
          const info = cardStatusInfo(record);

          const card = document.createElement("div");
          card.className = "bg-white border border-neutral-200 rounded-xl p-4 shadow-sm flex flex-col justify-between h-full";

          const loginText = record ? (record.loginDisplay || "—") : "—";
          const logoutText = record ? (record.logoutDisplay || "—") : "—";
          const durationText = (record && record.status === "Completed") ? (record.duration || "—") : "—";

          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start mb-3">
                <div>
                  <h3 class="font-medium text-sm text-neutral-900 leading-tight">${emp.name}</h3>
                  <p class="text-[10px] text-neutral-500 mt-0.5 tracking-wide">ID: ${emp.id}</p>
                </div>
                <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium border ${info.statusClass}">
                  ${info.status}
                </span>
              </div>

              <div class="space-y-1.5 pt-3 border-t border-neutral-100">
                <div class="flex justify-between items-center text-[11px]">
                  <span class="text-neutral-500">Login:</span>
                  <span class="font-medium text-neutral-900" data-login>${loginText}</span>
                </div>
                <div class="flex justify-between items-center text-[11px]">
                  <span class="text-neutral-500">Logout:</span>
                  <span class="font-medium text-neutral-900" data-logout>${logoutText}</span>
                </div>
                <div class="flex justify-between items-center text-[11px]">
                  <span class="text-neutral-500">Duration:</span>
                  <span class="font-medium text-neutral-900" data-duration>${durationText}</span>
                </div>
              </div>

              <div class="mt-4">
                <button type="button" data-main-action class="w-full py-2.5 px-4 rounded-xl text-sm font-medium transition-colors shadow-sm ${info.mainBtnClass}" ${info.mainBtnDisabled ? "disabled" : ""}>
                  ${info.mainBtn}
                </button>
              </div>

              <div class="mt-2" data-forgot-area></div>
            </div>
          `;

          const mainBtn = card.querySelector("[data-main-action]");
          mainBtn.addEventListener("click", () => {
            const rec = getTodayRecord(emp.id);
            if (!rec) {
              doLogin(emp.id, null);
            } else if (rec.status === "Working") {
              doLogout(emp.id);
            }
          });

          const forgotArea = card.querySelector("[data-forgot-area]");
          if (!record) {
            const forgotBtn = document.createElement("button");
            forgotBtn.type = "button";
            forgotBtn.className = "text-xs font-medium text-neutral-500 hover:text-neutral-800 transition-colors";
            forgotBtn.textContent = "Forgot to log in?";
            forgotBtn.addEventListener("click", () => {
              renderForgotFlow(forgotArea, emp.id);
            });
            forgotArea.appendChild(forgotBtn);
          }

          grid.appendChild(card);
        });
      }

      function renderForgotFlow(container, employeeId) {
        container.innerHTML = `
          <div class="mt-2 space-y-2">
            <input type="time" class="w-full px-3 py-2 border border-neutral-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:border-transparent" data-forgot-time>
            <button type="button" class="w-full py-2.5 px-4 bg-neutral-900 text-white rounded-xl text-sm font-medium hover:bg-neutral-800 transition-colors shadow-sm" data-save-forgot>
              SAVE LOGIN
            </button>
          </div>
        `;
        const input = container.querySelector("[data-forgot-time]");
        const btn = container.querySelector("[data-save-forgot]");
        btn.addEventListener("click", () => {
          const val = input.value;
          if (!val) return;
          doLogin(employeeId, val);
        });
      }

      function doLogin(employeeId, manualTimeHHMM) {
        const emp = EMPLOYEES.find(e => e.id === employeeId);
        if (!emp) return;

        const attendanceDayKey = getCurrentAttendanceDayKey();

        // Prevent duplicate record for the same employee & attendance day
        let rec = records.find(r => r.employeeId === employeeId && r.attendanceDayKey === attendanceDayKey);
        if (rec) return;

        let loginParts;
        if (manualTimeHHMM) {
          const [hh, mm] = manualTimeHHMM.split(":").map(Number);
          const nowP = nowISTParts();
          // Use current IST calendar date as baseline for the time picker
          loginParts = { year: nowP.year, month: nowP.month, day: nowP.day, hour: hh, minute: mm, second: 0 };
          // If chosen time is later than now (IST), treat as yesterday
          if (hh > nowP.hour || (hh === nowP.hour && mm > nowP.minute)) {
            const baseUTC = istPartsToUTCDate(loginParts);
            baseUTC.setUTCDate(baseUTC.getUTCDate() - 1);
            const adjP = getISTParts(baseUTC);
            loginParts = { year: adjP.year, month: adjP.month, day: adjP.day, hour: adjP.hour, minute: adjP.minute, second: 0 };
          }
        } else {
          loginParts = nowISTParts();
        }

        const loginUTC = istPartsToUTCDate(loginParts).toISOString();

        rec = {
          id: String(Date.now()) + "_" + employeeId,
          employeeId: emp.id,
          employeeName: emp.name,
          attendanceDayKey,
          attendanceDateDisplay: formatDisplayDateFromKey(attendanceDayKey),
          loginUTC,
          logoutUTC: null,
          loginDisplay: formatTimeShortFromISTParts(loginParts),
          logoutDisplay: "—",
          duration: null,
          status: "Working"
        };

        records.push(rec);
        safeSave();
        renderAll();
      }

      function doLogout(employeeId) {
        const rec = getTodayRecord(employeeId);
        if (!rec || rec.status !== "Working") return;

        const logoutParts = nowISTParts();
        const logoutUTC = istPartsToUTCDate(logoutParts).toISOString();

        rec.logoutUTC = logoutUTC;
        rec.logoutDisplay = formatTimeShortFromISTParts(logoutParts);
        rec.duration = calculateDuration(rec.loginUTC, rec.logoutUTC);
        rec.status = "Completed";

        safeSave();
        renderAll();
      }

      function getFilteredRecords() {
        let filtered = [...records];

        const todayKey = getCurrentAttendanceDayKey();
        const todayUTC = new Date(Date.UTC(...todayKey.split("-").map((n, i) => i === 1 ? Number(n) - 1 : Number(n))));

        if (currentFilter === "today") {
          filtered = filtered.filter(r => r.attendanceDayKey === todayKey);
        } else if (currentFilter === "7days") {
          const limit = new Date(todayUTC);
          limit.setUTCDate(limit.getUTCDate() - 7);
          filtered = filtered.filter(r => {
            const d = new Date(r.attendanceDayKey + "T00:00:00Z");
            return d >= limit;
          });
        } else if (currentFilter === "30days") {
          const limit = new Date(todayUTC);
          limit.setUTCDate(limit.getUTCDate() - 30);
          filtered = filtered.filter(r => {
            const d = new Date(r.attendanceDayKey + "T00:00:00Z");
            return d >= limit;
          });
        }

        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          filtered = filtered.filter(r => r.employeeName.toLowerCase().includes(q) || String(r.employeeId).includes(q));
        }

        filtered.sort((a, b) => (b.loginUTC < a.loginUTC ? -1 : 1));
        return filtered;
      }

      function renderHistory() {
        const tbody = document.getElementById("history-body");
        tbody.innerHTML = "";

        const filtered = getFilteredRecords();
        if (filtered.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-sm text-neutral-500">No attendance records found.</td></tr>`;
          return;
        }

        filtered.forEach(r => {
          const statusColor = r.status === "Working" ? "text-emerald-600" : (r.status === "Completed" ? "text-blue-600" : "text-neutral-600");
          const tr = document.createElement("tr");
          tr.className = "hover:bg-neutral-50/50 transition-colors";
          tr.innerHTML = `
            <td class="px-4 py-3 text-sm text-neutral-500">${r.employeeId}</td>
            <td class="px-4 py-3 text-sm font-medium text-neutral-900">${r.employeeName}</td>
            <td class="px-4 py-3 text-sm text-neutral-600 whitespace-nowrap">${r.attendanceDateDisplay || formatDisplayDateFromKey(r.attendanceDayKey)}</td>
            <td class="px-4 py-3 text-sm text-neutral-900">${r.loginDisplay || "—"}</td>
            <td class="px-4 py-3 text-sm text-neutral-900">${r.logoutDisplay || "—"}</td>
            <td class="px-4 py-3 text-sm text-neutral-600">${r.duration || "—"}</td>
            <td class="px-4 py-3 text-sm font-medium ${statusColor}">${r.status}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      function renderAll() {
        renderStats();
        renderTeam();
        renderHistory();
      }

      // CSV Download with real download + fallback textarea
      function buildCSV() {
        const header = "Employee ID,Employee,Attendance Date,Login Time,Logout Time,Duration,Status";
        const rows = records
          .slice()
          .sort((a, b) => (a.loginUTC < b.loginUTC ? 1 : -1))
          .map(r => {
            const vals = [
              String(r.employeeId),
              r.employeeName,
              r.attendanceDateDisplay || formatDisplayDateFromKey(r.attendanceDayKey),
              r.loginDisplay || "",
              (r.logoutDisplay && r.logoutDisplay !== "—") ? r.logoutDisplay : "",
              r.duration || "",
              r.status || ""
            ];
            // CSV escape
            const esc = (v) => {
              const s = String(v ?? "");
              const quote = String.fromCharCode(34);
              const newline = String.fromCharCode(10);
              const needsQuotes = s.includes(quote) || s.includes(",") || s.includes(newline);
              return needsQuotes ? quote + s.split(quote).join(quote + quote) + quote : s;
            };
            return vals.map(esc).join(",");
          });
        return [header, ...rows].join(String.fromCharCode(10));
      }

      function showCSVFallback(csvContent) {
        // Put fallback right above the history table container
        const historySection = document.querySelector("[data-aura-edit-target='aet-33']");
        if (!historySection) return;

        let box = document.getElementById("csv-fallback");
        if (!box) {
          box = document.createElement("div");
          box.id = "csv-fallback";
          box.className = "bg-white border border-neutral-200 rounded-xl p-4 shadow-sm";
          box.innerHTML = `
            <div class="flex items-center justify-between gap-3 mb-3">
              <div class="text-sm font-medium text-neutral-900">CSV Fallback</div>
              <button type="button" id="copy-csv" class="px-3 py-1.5 text-xs font-medium rounded-lg border bg-white text-neutral-600 border-neutral-200 hover:bg-neutral-50 transition-colors">COPY CSV</button>
            </div>
            <textarea id="csv-text" class="w-full h-48 p-3 text-xs border border-neutral-200 rounded-lg font-mono focus:outline-none focus:ring-2 focus:ring-neutral-900 focus:border-transparent"></textarea>
          `;
          const insertBeforeEl = historySection.querySelector(".bg-white.border.border-neutral-200.rounded-xl.overflow-hidden");
          if (insertBeforeEl) historySection.insertBefore(box, insertBeforeEl);
          else historySection.appendChild(box);

          box.querySelector("#copy-csv").addEventListener("click", async () => {
            const txt = box.querySelector("#csv-text");
            txt.select();
            txt.setSelectionRange(0, txt.value.length);
            try {
              await navigator.clipboard.writeText(txt.value);
            } catch (e) {
              try { document.execCommand("copy"); } catch (e2) {}
            }
          });
        }

        box.querySelector("#csv-text").value = csvContent;
      }

      function downloadCSV() {
        const csvContent = buildCSV();

        // Primary: real client-side download
        try {
          const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "team-attendance.csv";
          link.style.display = "none";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        } catch (e) {
          // If anything fails, show fallback
          showCSVFallback(csvContent);
          return;
        }

        // Fallback: also show textarea so user can copy if browser blocks
        // (kept lightweight; no claim about download success)
        showCSVFallback(csvContent);
      }

      // Expose required globals for inline handlers (filters + download)
      window.setFilter = setFilter;
      window.downloadCSV = downloadCSV;

      // Search
      const searchInput = document.getElementById("search-input");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          searchQuery = e.target.value || "";
          renderHistory();
        });
      }

      // Init
      safeLoad();
      renderAll();
      updateClock();
      setInterval(updateClock, 1000);
    </script>

    <dialog
      id="attendance-dialog"
      class="w-[calc(100%-2rem)] max-w-sm rounded-xl border border-neutral-200 p-6 text-neutral-900 shadow-xl"
      aria-labelledby="attendance-dialog-title"
    >
      <div id="attendance-dialog-content"></div>
    </dialog>
    <script>
      (function () {
        const CYCLE_KEY = STORAGE_KEY + '_first_cycle';
        const dialog = document.getElementById('attendance-dialog');
        const dialogContent = document.getElementById('attendance-dialog-content');
        const cycleSelect = document.getElementById('team-cycle');
        const statusFilters = document.getElementById('team-status-filters');
        let teamStatus = 'All';
        let selectedCycle = getCurrentAttendanceDayKey();
        let observedCycle = selectedCycle;
        let firstCycle;
        try { firstCycle = localStorage.getItem(CYCLE_KEY); } catch (e) {}
        const earliestRecord = records.map(r => r.attendanceDayKey).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k || '')).sort()[0];
        if (!/^\d{4}-\d{2}-\d{2}$/.test(firstCycle || '') || firstCycle > observedCycle) firstCycle = earliestRecord || observedCycle;
        if (earliestRecord && earliestRecord < firstCycle) firstCycle = earliestRecord;
        try { localStorage.setItem(CYCLE_KEY, firstCycle); } catch (e) {}

        function shiftDay(key, amount) {
          const date = new Date(key + 'T00:00:00Z');
          date.setUTCDate(date.getUTCDate() + amount);
          return date.toISOString().slice(0, 10);
        }

        function escapeHTML(value) {
          const entities = { 38: '&amp;', 60: '&lt;', 62: '&gt;', 34: '&quot;', 39: '&#39;' };
          return Array.from(String(value == null ? '' : value), c => entities[c.charCodeAt(0)] || c).join('');
        }

        function recordFor(employeeId, key) {
          return records.find(r => r.employeeId === employeeId && r.attendanceDayKey === key);
        }

        function cycleRows(key) {
          return EMPLOYEES.map(emp => recordFor(emp.id, key) || {
            id: key + '_' + emp.id,
            employeeId: emp.id,
            employeeName: emp.name,
            attendanceDayKey: key,
            attendanceDateDisplay: formatDisplayDateFromKey(key),
            loginUTC: null,
            logoutUTC: null,
            loginDisplay: '—',
            logoutDisplay: '—',
            duration: null,
            status: key < getCurrentAttendanceDayKey() ? 'Absent' : 'Not Logged In'
          });
        }

        cleanOldData = function () {
          const today = getCurrentAttendanceDayKey();
          const cutoff = shiftDay(today, -29);
          records = records.filter(r => r.attendanceDayKey >= cutoff && r.attendanceDayKey <= today);
          safeSave();
        };

        function reconcileCycles() {
          const today = getCurrentAttendanceDayKey();
          const cutoff = shiftDay(today, -29);
          records = records.filter(r => r.attendanceDayKey >= cutoff && r.attendanceDayKey <= today);
          let key = firstCycle < cutoff ? cutoff : firstCycle;
          while (key < today) {
            EMPLOYEES.forEach(emp => {
              const existing = recordFor(emp.id, key);
              if (existing && existing.loginUTC) return;
              if (existing) {
                existing.status = 'Absent';
              } else {
                records.push({ id: key + '_' + emp.id, employeeId: emp.id, employeeName: emp.name,
                  attendanceDayKey: key, attendanceDateDisplay: formatDisplayDateFromKey(key),
                  loginUTC: null, logoutUTC: null, loginDisplay: '—', logoutDisplay: '—', duration: null, status: 'Absent' });
              }
            });
            key = shiftDay(key, 1);
          }
          safeSave();
        }

        getTodayRecord = function (employeeId) {
          const rec = recordFor(employeeId, getCurrentAttendanceDayKey());
          return rec && rec.loginUTC ? rec : undefined;
        };

        function updateCycleChoices() {
          const today = getCurrentAttendanceDayKey();
          const keys = Array.from(new Set([today, ...records.map(r => r.attendanceDayKey)])).sort().reverse();
          if (!keys.includes(selectedCycle)) selectedCycle = today;
          cycleSelect.innerHTML = keys.map(key => '<option value="' + key + '">' + escapeHTML(formatDisplayDateFromKey(key)) + (key === today ? ' · Open' : ' · Closed') + '</option>').join('');
          cycleSelect.value = selectedCycle;
        }

        renderStats = function () {
          const rows = cycleRows(selectedCycle);
          document.getElementById('stat-total').textContent = EMPLOYEES.length;
          document.getElementById('stat-working').textContent = rows.filter(r => r.status === 'Working').length;
          document.getElementById('stat-completed').textContent = rows.filter(r => r.status === 'Completed').length;
          document.getElementById('stat-not-logged-in').textContent = rows.filter(r => r.status === 'Not Logged In').length;
          document.getElementById('stat-absent').textContent = rows.filter(r => r.status === 'Absent').length;
        };

        function statusClass(status) {
          if (status === 'Working') return 'bg-emerald-50 text-emerald-700 border-emerald-100';
          if (status === 'Completed') return 'bg-blue-50 text-blue-700 border-blue-100';
          return 'bg-neutral-100 text-neutral-600 border-neutral-200';
        }

        function button(label, primary, handler) {
          const el = document.createElement('button');
          el.type = 'button';
          el.className = 'px-4 py-2.5 rounded-xl text-sm font-medium transition-colors ' + (primary ? 'bg-neutral-900 text-white hover:bg-neutral-800' : 'bg-white border border-neutral-200 text-neutral-600 hover:bg-neutral-50');
          el.textContent = label;
          el.addEventListener('click', handler);
          return el;
        }

        function showDialog(title, content, actions) {
          dialogContent.innerHTML = '<h2 id="attendance-dialog-title" class="text-xl font-semibold tracking-tight mb-5">' + escapeHTML(title) + '</h2>' + content;
          const footer = document.createElement('div');
          footer.className = 'flex justify-end flex-wrap gap-2 mt-6';
          actions.forEach(action => footer.appendChild(button(action.label, action.primary, action.run)));
          dialogContent.appendChild(footer);
          if (!dialog.open) dialog.showModal();
        }

        function identity(emp) {
          return '<div class="mb-4"><p class="text-xs text-neutral-500 mb-1">Employee</p><p class="text-sm font-medium">' + escapeHTML(emp.name) + '</p><p class="text-xs text-neutral-500 mt-1">ID: ' + escapeHTML(emp.id) + '</p></div>';
        }

        function closeDialog() { dialog.close(); }

        function showEmployee(employeeId, key) {
          const emp = EMPLOYEES.find(e => e.id === employeeId);
          const rec = cycleRows(key).find(r => r.employeeId === employeeId);
          if (!emp || !rec) return;
          let content = identity(emp) + '<p class="text-xs text-neutral-500 mb-1">Status</p><p class="text-sm font-medium mb-4">' + escapeHTML(rec.status) + '</p>';
          if (rec.loginUTC) content += '<p class="text-sm mb-2"><span class="text-neutral-500">Login: </span>' + escapeHTML(rec.loginDisplay) + '</p>';
          if (rec.status === 'Completed') content += '<p class="text-sm mb-2"><span class="text-neutral-500">Logout: </span>' + escapeHTML(rec.logoutDisplay) + '</p><p class="text-sm"><span class="text-neutral-500">Duration: </span>' + escapeHTML(rec.duration || '—') + '</p>';
          if (rec.status === 'Absent') content += '<p class="text-sm text-neutral-500">No login was recorded for this attendance cycle.</p>';
          const actions = [];
          if (key === getCurrentAttendanceDayKey() && rec.status === 'Not Logged In') {
            actions.push({ label: 'LOGIN', primary: true, run: () => requestLogin(employeeId, null) });
            actions.push({ label: 'FORGOT TO LOGIN?', run: () => showManualLogin(employeeId) });
          } else if (key === getCurrentAttendanceDayKey() && rec.status === 'Working') {
            actions.push({ label: 'LOGOUT', primary: true, run: () => requestLogout(employeeId) });
          }
          actions.push({ label: 'CLOSE', run: closeDialog });
          showDialog(emp.name, content, actions);
        }

        renderTeam = function () {
          const grid = document.getElementById('team-grid');
          grid.innerHTML = '';
          Array.from(statusFilters.children).forEach(btn => {
            const active = btn.dataset.status === teamStatus;
            btn.className = 'px-3 py-1.5 text-xs font-medium rounded-lg border transition-colors ' + (active ? 'bg-neutral-900 text-white border-neutral-900' : 'bg-white text-neutral-600 border-neutral-200 hover:bg-neutral-50');
            btn.setAttribute('aria-pressed', String(active));
          });
          const rows = cycleRows(selectedCycle).filter(r => teamStatus === 'All' || r.status === teamStatus);
          rows.forEach(rec => {
            const key = selectedCycle;
            const card = document.createElement('div');
            card.className = 'bg-white border border-neutral-200 rounded-xl p-4 shadow-sm flex flex-col justify-between h-full';
            card.innerHTML = '<div class="flex justify-between items-start gap-2 mb-3"><button type="button" data-employee class="text-left"><h3 class="font-medium text-sm text-neutral-900 leading-tight">' + escapeHTML(rec.employeeName) + '</h3><p class="text-[10px] text-neutral-500 mt-0.5 tracking-wide">ID: ' + escapeHTML(rec.employeeId) + '</p></button><span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium border ' + statusClass(rec.status) + '">' + escapeHTML(rec.status) + '</span></div><div class="space-y-1.5 pt-3 border-t border-neutral-100"><div class="flex justify-between text-[11px]"><span class="text-neutral-500">Login:</span><span class="font-medium">' + escapeHTML(rec.loginDisplay || '—') + '</span></div><div class="flex justify-between text-[11px]"><span class="text-neutral-500">Logout:</span><span class="font-medium">' + escapeHTML(rec.logoutDisplay || '—') + '</span></div><div class="flex justify-between text-[11px]"><span class="text-neutral-500">Duration:</span><span class="font-medium">' + escapeHTML(rec.duration || '—') + '</span></div></div><div class="mt-4" data-actions></div>';
            card.querySelector('[data-employee]').addEventListener('click', () => showEmployee(rec.employeeId, key));
            card.addEventListener('click', event => { if (!event.target.closest('button')) showEmployee(rec.employeeId, key); });
            const area = card.querySelector('[data-actions]');
            const current = key === getCurrentAttendanceDayKey();
            const actionable = current && (rec.status === 'Not Logged In' || rec.status === 'Working');
            const main = button(actionable ? (rec.status === 'Working' ? 'LOGOUT' : 'LOGIN') : 'VIEW DETAILS', rec.status === 'Not Logged In' && current, () => {
              if (!actionable) showEmployee(rec.employeeId, key);
              else if (rec.status === 'Working') requestLogout(rec.employeeId);
              else requestLogin(rec.employeeId, null);
            });
            main.classList.add('w-full', 'shadow-sm');
            area.appendChild(main);
            if (current && rec.status === 'Not Logged In') {
              const forgot = button('Forgot to Login?', false, () => showManualLogin(rec.employeeId));
              forgot.className = 'mt-2 text-xs font-medium text-neutral-500 hover:text-neutral-800 transition-colors';
              area.appendChild(forgot);
            }
            grid.appendChild(card);
          });
          if (!rows.length) grid.innerHTML = '<p class="col-span-full py-4 text-sm text-neutral-500">No employees with this status for the selected attendance cycle.</p>';
        };

        function cycleChanged(expectedKey) {
          if (expectedKey === getCurrentAttendanceDayKey()) return false;
          reconcileCycles();
          selectedCycle = getCurrentAttendanceDayKey();
          observedCycle = selectedCycle;
          renderAll();
          showDialog('Attendance cycle changed', '<p class="text-sm text-neutral-500">A new cycle started at 7:00 AM IST. Nothing was saved. Please select the employee again.</p>', [{ label: 'CLOSE', run: closeDialog }]);
          return true;
        }

        function manualParts(value) {
          const now = nowISTParts();
          const values = value.split(':').map(Number);
          let parts = { year: now.year, month: now.month, day: now.day, hour: values[0], minute: values[1], second: 0 };
          let date = istPartsToUTCDate(parts);
          if (date > new Date()) {
            date.setUTCDate(date.getUTCDate() - 1);
            parts = getISTParts(date);
          }
          if (getAttendanceDayKeyFromISTParts(parts) !== getCurrentAttendanceDayKey()) return null;
          return parts;
        }

        function showManualLogin(employeeId) {
          const emp = EMPLOYEES.find(e => e.id === employeeId);
          if (!emp || getTodayRecord(employeeId)) return;
          const key = getCurrentAttendanceDayKey();
          showDialog('Forgot to Login?', identity(emp) + '<label for="manual-login-time" class="block text-sm text-neutral-600 mb-2">Enter the time you actually entered the store.</label><input id="manual-login-time" type="time" required class="w-full px-3 py-2 border border-neutral-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-neutral-900"><p class="text-xs text-neutral-500 mt-2">Choose a time within the current attendance cycle, starting at 7:00 AM IST.</p><p id="manual-login-error" role="alert" class="text-xs text-red-600 mt-2"></p>', [
            { label: 'CANCEL', run: closeDialog },
            { label: 'CONTINUE', primary: true, run: () => {
              if (cycleChanged(key)) return;
              const input = document.getElementById('manual-login-time');
              if (!input.value || !input.checkValidity()) { input.reportValidity(); return; }
              const parts = manualParts(input.value);
              if (!parts) { document.getElementById('manual-login-error').textContent = 'Choose an actual past time in the current attendance cycle.'; return; }
              requestLogin(employeeId, parts);
            } }
          ]);
        }

        function refreshStoredRecords() {
          safeLoad();
          reconcileCycles();
        }

        function requestLogin(employeeId, manual) {
          const emp = EMPLOYEES.find(e => e.id === employeeId);
          if (!emp || getTodayRecord(employeeId)) return;
          const key = getCurrentAttendanceDayKey();
          const parts = manual || nowISTParts();
          const loginUTC = istPartsToUTCDate(parts).toISOString();
          const display = formatTimeShortFromISTParts(parts);
          showDialog(manual ? 'Confirm Manual Login' : 'Confirm Login', identity(emp) + '<p class="text-xs text-neutral-500 mb-1">' + (manual ? 'Actual login time:' : 'Login time:') + '</p><p class="text-sm font-medium">' + escapeHTML(display) + ' IST</p>' + (manual ? '<p class="text-sm text-neutral-600 mt-4">This will be recorded as your login time.</p>' : ''), [
            { label: 'CANCEL', run: closeDialog },
            { label: 'CONFIRM LOGIN', primary: true, run: () => {
              if (cycleChanged(key)) return;
              refreshStoredRecords();
              if (getTodayRecord(employeeId)) { closeDialog(); renderAll(); return; }
              if (getAttendanceDayKeyFromISTParts(parts) !== key) return;
              records = records.filter(r => !(r.employeeId === employeeId && r.attendanceDayKey === key));
              records.push({ id: String(Date.now()) + '_' + employeeId, employeeId: emp.id, employeeName: emp.name,
                attendanceDayKey: key, attendanceDateDisplay: formatDisplayDateFromKey(key), loginUTC,
                logoutUTC: null, loginDisplay: display, logoutDisplay: '—', duration: null, status: 'Working' });
              safeSave();
              closeDialog();
              renderAll();
            } }
          ]);
        }

        function requestLogout(employeeId) {
          const emp = EMPLOYEES.find(e => e.id === employeeId);
          const rec = getTodayRecord(employeeId);
          if (!emp || !rec || rec.status !== 'Working') return;
          const key = getCurrentAttendanceDayKey();
          const parts = nowISTParts();
          const logoutUTC = istPartsToUTCDate(parts).toISOString();
          const display = formatTimeShortFromISTParts(parts);
          const recordId = rec.id;
          showDialog('Confirm Logout', identity(emp) + '<p class="text-sm mb-4"><span class="text-neutral-500">Login: </span>' + escapeHTML(rec.loginDisplay) + '</p><p class="text-xs text-neutral-500 mb-1">Logout time:</p><p class="text-sm font-medium">' + escapeHTML(display) + ' IST</p>', [
            { label: 'CANCEL', run: closeDialog },
            { label: 'CONFIRM LOGOUT', primary: true, run: () => {
              if (cycleChanged(key)) return;
              refreshStoredRecords();
              const current = getTodayRecord(employeeId);
              if (!current || current.id !== recordId || current.status !== 'Working') { closeDialog(); renderAll(); return; }
              current.logoutUTC = logoutUTC;
              current.logoutDisplay = display;
              current.duration = calculateDuration(current.loginUTC, logoutUTC);
              current.status = 'Completed';
              safeSave();
              closeDialog();
              renderAll();
            } }
          ]);
        }

        doLogin = function (employeeId, manualTime) {
          if (manualTime) {
            const parts = manualParts(manualTime);
            if (parts) requestLogin(employeeId, parts);
          } else requestLogin(employeeId, null);
        };
        doLogout = requestLogout;
        renderForgotFlow = function (container, employeeId) { showManualLogin(employeeId); };

        getFilteredRecords = function () {
          const today = getCurrentAttendanceDayKey();
          const cutoff = shiftDay(today, currentFilter === '7days' ? -6 : currentFilter === '30days' ? -29 : 0);
          let filtered = [...records.filter(r => r.attendanceDayKey !== today), ...cycleRows(today)].filter(r => r.attendanceDayKey >= cutoff && r.attendanceDayKey <= today);
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            filtered = filtered.filter(r => r.employeeName.toLowerCase().includes(q) || String(r.employeeId).includes(q));
          }
          return filtered.sort((a, b) => b.attendanceDayKey.localeCompare(a.attendanceDayKey) || String(b.loginUTC || '').localeCompare(String(a.loginUTC || '')) || a.employeeName.localeCompare(b.employeeName));
        };

        renderHistory = function () {
          const tbody = document.getElementById('history-body');
          const filtered = getFilteredRecords();
          tbody.innerHTML = '';
          if (!filtered.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-sm text-neutral-500">No attendance records found.</td></tr>';
            return;
          }
          filtered.forEach(r => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-neutral-50/50 transition-colors';
            const values = [r.employeeId, r.employeeName, r.attendanceDateDisplay || formatDisplayDateFromKey(r.attendanceDayKey), r.loginDisplay || '—', r.logoutDisplay || '—', r.duration || '—', r.status];
            values.forEach((value, index) => {
              const td = document.createElement('td');
              td.className = 'px-4 py-3 text-sm ' + (index === 1 ? 'font-medium text-neutral-900' : index === 6 ? 'font-medium ' + (r.status === 'Working' ? 'text-emerald-600' : r.status === 'Completed' ? 'text-blue-600' : 'text-neutral-600') : 'text-neutral-600') + (index === 2 ? ' whitespace-nowrap' : '');
              td.textContent = value;
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
        };

        renderAll = function () {
          updateCycleChoices();
          renderStats();
          renderTeam();
          renderHistory();
        };

        buildCSV = function () {
          const today = getCurrentAttendanceDayKey();
          const rows = [...records.filter(r => r.attendanceDayKey !== today), ...cycleRows(today)].sort((a, b) => b.attendanceDayKey.localeCompare(a.attendanceDayKey) || a.employeeName.localeCompare(b.employeeName));
          const csvEscape = value => {
            const text = String(value == null ? '' : value);
            const quote = String.fromCharCode(34);
            const cr = String.fromCharCode(13);
            const lf = String.fromCharCode(10);
            const needsQuotes = text.includes(quote) || text.includes(',') || text.includes(cr) || text.includes(lf);
            return needsQuotes ? quote + text.split(quote).join(quote + quote) + quote : text;
          };
          return ['Employee ID,Employee,Attendance Date,Login Time,Logout Time,Duration,Status', ...rows.map(r => [r.employeeId, r.employeeName, r.attendanceDateDisplay || formatDisplayDateFromKey(r.attendanceDayKey), r.loginUTC ? r.loginDisplay : '', r.logoutUTC ? r.logoutDisplay : '', r.duration || '', r.status].map(csvEscape).join(','))].join(String.fromCharCode(13, 10));
        };

        showCSVFallback = function (content) {
          let box = document.getElementById('csv-fallback');
          if (!box) {
            box = document.createElement('div');
            box.id = 'csv-fallback';
            box.className = 'bg-white border border-neutral-200 rounded-xl p-4 shadow-sm';
            box.innerHTML = '<p class="text-sm text-neutral-600 mb-3">Download unavailable. Copy the CSV below.</p><textarea aria-label="Attendance CSV" class="w-full h-48 p-3 text-xs border border-neutral-200 rounded-lg font-mono"></textarea>';
            const table = document.getElementById('history-body').closest('table').parentElement.parentElement;
            table.before(box);
          }
          box.querySelector('textarea').value = content;
        };

        downloadCSV = function () {
          refreshStoredRecords();
          renderAll();
          const content = buildCSV();
          try {
            const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'team-attendance.csv';
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
          } catch (e) { showCSVFallback(content); }
        };
        window.downloadCSV = downloadCSV;

        statusFilters.addEventListener('click', event => {
          const btn = event.target.closest('button[data-status]');
          if (!btn) return;
          teamStatus = btn.dataset.status;
          renderTeam();
        });
        cycleSelect.addEventListener('change', () => { selectedCycle = cycleSelect.value; renderAll(); });

        function checkCycle() {
          const today = getCurrentAttendanceDayKey();
          if (today === observedCycle) return;
          const viewingCurrent = selectedCycle === observedCycle;
          observedCycle = today;
          refreshStoredRecords();
          if (viewingCurrent) selectedCycle = today;
          if (dialog.open) closeDialog();
          renderAll();
        }
        setInterval(checkCycle, 1000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) checkCycle(); });
        window.addEventListener('storage', event => {
          if (event.key !== STORAGE_KEY && event.key !== CYCLE_KEY && event.key !== null) return;
          safeLoad();
          if (event.key === CYCLE_KEY && event.newValue && event.newValue < firstCycle) firstCycle = event.newValue;
          renderAll();
        });
        reconcileCycles();
        renderAll();
      })();
    </script>

    <script>
      (function () {
        let fallbackURL = null;

        function downloadAttendanceCSV() {
          const rows = getFilteredRecords().map(row => records.find(record => record.employeeId === row.employeeId && record.attendanceDayKey === row.attendanceDayKey)).filter(Boolean);
          let panel = document.getElementById('attendance-csv-export');
          if (fallbackURL) {
            URL.revokeObjectURL(fallbackURL);
            fallbackURL = null;
          }
          if (panel) panel.remove();
          if (!rows.length) {
            alert('No attendance records available.');
            return;
          }

          const csvQuote = String.fromCharCode(34);
          const csvCR = String.fromCharCode(13);
          const csvLF = String.fromCharCode(10);
          const escapeCSV = value => {
            const text = String(value == null ? '' : value);
            const needsQuotes = text.includes(csvQuote) || text.includes(',') || text.includes(csvCR) || text.includes(csvLF);
            return needsQuotes ? csvQuote + text.split(csvQuote).join(csvQuote + csvQuote) + csvQuote : text;
          };
          const csvContent = [
            'Employee ID,Employee,Attendance Date,Login Time,Logout Time,Duration,Status',
            ...rows.map(record => [
              record.employeeId,
              record.employeeName,
              record.attendanceDateDisplay || formatDisplayDateFromKey(record.attendanceDayKey),
              record.loginDisplay === '—' ? '' : record.loginDisplay,
              record.logoutDisplay === '—' ? '' : record.logoutDisplay,
              record.duration === '—' ? '' : record.duration,
              record.status
            ].map(escapeCSV).join(','))
          ].join(csvCR + csvLF);

          try {
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            // Keep a separate URL alive for the manual download fallback.
            fallbackURL = URL.createObjectURL(blob);
            const manualURL = fallbackURL;
            panel = document.createElement('div');
            panel.id = 'attendance-csv-export';
            panel.className = 'bg-white border border-neutral-200 rounded-xl p-4 shadow-sm';
            panel.setAttribute('aria-live', 'polite');
            panel.innerHTML = '<p class="text-sm font-medium text-neutral-900 mb-2">CSV READY</p><p class="text-sm text-neutral-500 mb-3">Your attendance file is ready.</p>';
            const downloadLink = document.createElement('a');
            downloadLink.href = manualURL;
            downloadLink.download = 'team-attendance.csv';
            downloadLink.textContent = 'DOWNLOAD team-attendance.csv';
            downloadLink.className = 'inline-flex items-center px-4 py-2 text-sm font-medium rounded-lg border border-neutral-200 bg-white hover:bg-neutral-50 transition-colors';
            panel.appendChild(downloadLink);
            const message = document.createElement('p');
            message.className = 'text-sm text-neutral-500 mt-3';
            panel.appendChild(message);
            document.getElementById('history-body').closest('table').parentElement.parentElement.before(panel);
            downloadLink.addEventListener('click', () => {
              message.textContent = 'File downloaded successfully.';
              setTimeout(() => {
                URL.revokeObjectURL(manualURL);
                if (fallbackURL === manualURL) fallbackURL = null;
                downloadLink.remove();
              }, 1000);
            }, { once: true });

            const link = document.createElement('a');
            link.href = url;
            link.download = 'team-attendance.csv';
            link.style.display = 'none';
            document.body.appendChild(link);
            try { link.click(); } catch (error) {
              // The visible download link remains available.
            } finally {
              setTimeout(() => {
                URL.revokeObjectURL(url);
                link.remove();
              }, 1000);
            }
          } catch (error) {
            if (fallbackURL) URL.revokeObjectURL(fallbackURL);
            fallbackURL = null;
            if (panel) panel.remove();
            alert('Unable to create the CSV file. Please try again.');
          }
        }

        window.downloadAttendanceCSV = downloadAttendanceCSV;
        downloadCSV = downloadAttendanceCSV;
        window.downloadCSV = downloadAttendanceCSV;
      })();
    </script>
  </body>
