<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black min-h-screen flex flex-col font-sans relative select-none">
  <!-- Header -->
  <div class="flex justify-between items-center pt-8 px-6 pb-2">
    <h1 class="text-4xl font-extrabold text-white tracking-tight rounded-xl">Task</h1>
    <div class="w-12 h-12 bg-neutral-800 rounded-full flex items-center justify-center">
      <span class="text-white text-2xl">😊</span>
    </div>
  </div>
  
  <!-- Main Content -->
  <div id="main-content" class="flex-1 px-6 pb-32">
    <!-- Active Tasks List -->
    <div id="task-list" class="flex flex-col gap-3 mt-4"></div>
    
    <!-- Archive Section -->
    <div class="mt-8" id="archive-section">
      <button id="toggle-archive" class="flex items-center gap-2 focus:outline-none w-full" aria-expanded="true">
        <span class="w-8 h-8 bg-red-600 rounded-full flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" class="mx-auto" viewBox="0 0 20 20">
            <rect x="5" y="9" width="10" height="6" rx="2" fill="#fff"/>
            <rect x="7" y="3" width="6" height="4" rx="1" fill="#fff"/>
          </svg>
        </span>
        <span class="text-white font-semibold text-lg">Archive</span>
        <svg id="archive-chevron" class="ml-1 w-4 h-4 text-white transition-transform duration-150" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div id="archive-list" class="flex flex-col gap-3 mt-4"></div>
    </div>
  </div>

  <!-- Floating Add Button -->
  <button id="add-btn" class="fixed bottom-6 right-6 bg-blue-600 w-16 h-16 rounded-full shadow-lg flex items-center justify-center active:scale-95 transition-transform duration-75 focus:outline-none" aria-label="Add task">
    <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
      <path stroke-linecap="round" d="M12 5v14M5 12h14"/>
    </svg>
  </button>

  <!-- Add Task Modal -->
  <div id="modal-bg" class="fixed inset-0 z-20 flex items-end lg:items-center justify-center bg-black bg-opacity-60 hidden">
    <form id="add-form" class="bg-neutral-900 rounded-2xl px-6 py-5 mb-6 drop-shadow-lg w-full max-w-sm mx-auto flex flex-col gap-5">
      <label class="text-neutral-300 text-lg font-semibold">New Task</label>
      <input id="new-task-input" class="w-full px-4 py-2 rounded-lg bg-neutral-800 text-white focus:outline-none" placeholder="What needs to be done?" maxlength="60" autocomplete="off" required>
      <div class="flex gap-3 justify-end">
        <button type="button" id="cancel-btn" class="bg-neutral-700 text-neutral-300 px-4 py-2 rounded-lg font-semibold hover:bg-neutral-600">Cancel</button>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700">Add</button>
      </div>
    </form>
  </div>

  <script>
    // App state
    let tasks = [
      { text: 'Do more work', done: false },
      { text: 'Do more work', done: false },
      { text: 'Do more work', done: false },
    ];
    let archive = [
      { text: 'Do more work', done: true },
      { text: 'Do more work', done: true },
      { text: 'Do more work', done: true },
    ];
    let archiveOpen = true;

    // Elements
    const taskList = document.getElementById('task-list');
    const archiveList = document.getElementById('archive-list');
    const archiveSection = document.getElementById('archive-section');
    const toggleArchive = document.getElementById('toggle-archive');
    const archiveChevron = document.getElementById('archive-chevron');
    const addBtn = document.getElementById('add-btn');
    const modalBg = document.getElementById('modal-bg');
    const addForm = document.getElementById('add-form');
    const newTaskInput = document.getElementById('new-task-input');
    const cancelBtn = document.getElementById('cancel-btn');

    // Render tasks
    function renderTasks() {
      // Active
      taskList.innerHTML = '';
      tasks.forEach((task, idx) => {
        const node = document.createElement('div');
        node.className = 'flex items-center justify-between bg-neutral-900 rounded-xl px-4 py-3';
        node.innerHTML = `
          <div class="flex items-center gap-3 truncate">
            <span class="text-2xl">🚀</span>
            <span class="text-white text-base font-medium truncate">${task.text}</span>
          </div>
          <button aria-label="Mark as complete" class="flex items-center justify-center w-7 h-7 rounded-full border border-white" style="outline:none">
            <span class="block w-5 h-5"></span>
          </button>
        `;
        // Checkbox click
        node.querySelector('button').onclick = () => {
          archive.unshift({...task, done:true});
          tasks.splice(idx,1);
          renderTasks();
        };
        taskList.appendChild(node);
      });
      // Archive
      archiveList.innerHTML = '';
      archive.forEach((task, idx) => {
        const node = document.createElement('div');
        node.className = 'flex items-center justify-between bg-neutral-900 rounded-xl px-4 py-3';
        node.innerHTML = `
          <div class="flex items-center gap-3 truncate">
            <span class="text-2xl">🚀</span>
            <span class="text-neutral-400 text-base font-medium line-through truncate">${task.text}</span>
          </div>
          <button aria-label="Unarchive" class="flex items-center justify-center w-7 h-7 rounded-full bg-neutral-700 border border-neutral-700" style="outline:none">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </button>
        `;
        node.querySelector('button').onclick = () => {
          tasks.unshift({...task, done: false});
          archive.splice(idx,1);
          renderTasks();
        };
        archiveList.appendChild(node);
      });

      // Archive section visibility
      archiveList.parentElement.classList[
        archive.length ? 'remove' : 'add'
      ]('opacity-60','pointer-events-none');
      archiveList.style.display = archiveOpen ? 'flex' : 'none';
      archiveChevron.style.transform = archiveOpen ? 'rotate(0deg)' : 'rotate(-90deg)';
    }

    // Events
    toggleArchive.onclick = () => {
      archiveOpen = !archiveOpen;
      renderTasks();
    };

    // Add task modal
    addBtn.onclick = () => {
      modalBg.classList.remove('hidden');
      newTaskInput.value = "";
      setTimeout(() => newTaskInput.focus(), 100);
    };
    cancelBtn.onclick = () => modalBg.classList.add('hidden');

    addForm.onsubmit = (e) => {
      e.preventDefault();
      const val = newTaskInput.value.trim();
      if(val) {
        tasks.unshift({text:val, done:false});
        modalBg.classList.add('hidden');
        renderTasks();
      }
    };
    // ESC closes modal
    window.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') modalBg.classList.add('hidden');
      // Quick add with Enter if modal is open and not focused
      if(modalBg && !modalBg.classList.contains('hidden') && e.key === 'Enter' && document.activeElement === newTaskInput) addForm.onsubmit(e);
    });
    modalBg.addEventListener('click', e => { if(e.target === modalBg) modalBg.classList.add('hidden') });

    // Initial render
    renderTasks();
  </script>
</body>
</html>
