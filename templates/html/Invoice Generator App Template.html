<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
}
/* Hide scrollbar for cleaner look in inputs */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
-webkit-appearance: none;
margin: 0;
}
input[type="number"] {
-moz-appearance: textfield;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-[#FAFAFA] text-zinc-900 antialiased min-h-screen flex flex-col selection:bg-zinc-200">

    <!-- Navigation -->
    <nav class="sticky top-0 z-10 border-b border-zinc-200 bg-white/80 backdrop-blur-md">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-zinc-900 text-white rounded-md flex items-center justify-center font-semibold tracking-tighter text-sm">
                    INV
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-zinc-100 border border-zinc-200 text-xs font-medium text-zinc-600">
                    <div class="w-1.5 h-1.5 rounded-full bg-amber-500"></div>
                    Pending
                </span>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 lg:py-12 flex flex-col gap-8">
        
        <!-- Header Section -->
        <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-semibold tracking-tight text-zinc-900">Invoice Generator</h1>
                <p class="text-sm text-zinc-500 mt-1">Create, manage, and send professional invoices.</p>
            </div>
            <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                <button class="flex items-center gap-2 px-4 py-2 bg-white border border-zinc-200 rounded-lg text-sm font-medium text-zinc-700 hover:bg-zinc-50 hover:text-zinc-900 transition-colors focus:outline-none focus:ring-2 focus:ring-zinc-900/20 shadow-sm">
                    <iconify-icon icon="solar:diskette-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                    Save
                </button>
                <button class="flex items-center gap-2 px-4 py-2 bg-white border border-zinc-200 rounded-lg text-sm font-medium text-zinc-700 hover:bg-zinc-50 hover:text-zinc-900 transition-colors focus:outline-none focus:ring-2 focus:ring-zinc-900/20 shadow-sm">
                    <iconify-icon icon="solar:download-minimalistic-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                    PDF
                </button>
            </div>
        </header>

        <!-- Document Editor Card -->
        <div class="bg-white rounded-xl shadow-sm border border-zinc-200 overflow-hidden relative">
            <!-- Decorative top edge -->
            <div class="h-1 w-full bg-gradient-to-r from-zinc-200 via-zinc-400 to-zinc-200 opacity-20"></div>

            <!-- Meta & Client Info -->
            <div class="p-6 sm:p-8 grid md:grid-cols-2 gap-8 lg:gap-12 border-b border-zinc-100">
                
                <!-- Left: Client Info -->
                <div class="flex flex-col gap-4">
                    <h2 class="text-xs font-medium text-zinc-400 uppercase tracking-widest">Bill To</h2>
                    <div class="space-y-3">
                        <div class="relative">
                            <iconify-icon icon="solar:user-linear" stroke-width="1.5" class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-lg"></iconify-icon>
                            <input type="text" placeholder="Client Name" value="Acme Corporation" class="w-full pl-10 pr-3 py-2 bg-zinc-50/50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder:text-zinc-400 focus:outline-none focus:border-zinc-400 focus:ring-1 focus:ring-zinc-400 transition-all hover:bg-zinc-50">
                        </div>
                        <div class="relative">
                            <iconify-icon icon="solar:letter-linear" stroke-width="1.5" class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-lg"></iconify-icon>
                            <input type="email" placeholder="Email Address" value="billing@acmecorp.com" class="w-full pl-10 pr-3 py-2 bg-zinc-50/50 border border-zinc-200 rounded-lg text-sm text-zinc-900 placeholder:text-zinc-400 focus:outline-none focus:border-zinc-400 focus:ring-1 focus:ring-zinc-400 transition-all hover:bg-zinc-50">
                        </div>
                    </div>
                </div>

                <!-- Right: Invoice Details -->
                <div class="flex flex-col gap-4">
                    <h2 class="text-xs font-medium text-zinc-400 uppercase tracking-widest">Details</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1.5">
                            <label class="text-xs font-medium text-zinc-500 block">Invoice Number</label>
                            <div class="relative">
                                <iconify-icon icon="solar:hashtag-linear" stroke-width="1.5" class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-lg"></iconify-icon>
                                <input type="text" value="INV-84920" readonly class="w-full pl-9 pr-3 py-2 bg-zinc-100/50 border border-zinc-200 rounded-lg text-sm text-zinc-600 focus:outline-none cursor-default">
                            </div>
                        </div>
                        <div class="space-y-1.5">
                            <label class="text-xs font-medium text-zinc-500 block">Currency</label>
                            <div class="relative">
                                <iconify-icon icon="solar:wad-of-money-linear" stroke-width="1.5" class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-lg"></iconify-icon>
                                <select class="w-full pl-9 pr-8 py-2 bg-zinc-50/50 border border-zinc-200 rounded-lg text-sm text-zinc-900 appearance-none focus:outline-none focus:border-zinc-400 focus:ring-1 focus:ring-zinc-400 transition-all hover:bg-zinc-50">
                                    <option value="USD">USD ($)</option>
                                    <option value="EUR">EUR (€)</option>
                                    <option value="GBP">GBP (£)</option>
                                </select>
                                <iconify-icon icon="solar:alt-arrow-down-linear" stroke-width="1.5" class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-400 pointer-events-none"></iconify-icon>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Line Items -->
            <div class="p-6 sm:p-8">
                <!-- Table Headers (Hidden on small screens) -->
                <div class="hidden sm:grid grid-cols-12 gap-3 pb-3 border-b border-zinc-100 text-xs font-medium text-zinc-400 uppercase tracking-wider">
                    <div class="col-span-6">Service / Item</div>
                    <div class="col-span-2 text-right">Qty</div>
                    <div class="col-span-3 text-right">Price</div>
                    <div class="col-span-1"></div>
                </div>

                <!-- Items Container -->
                <div class="flex flex-col gap-3 mt-3 sm:mt-4">
                    <!-- Item 1 -->
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-start sm:items-center group">
                        <div class="col-span-1 sm:col-span-6">
                            <input type="text" placeholder="Description of service or product" value="Web App Development - Phase 1" class="w-full px-3 py-2 bg-transparent border border-transparent hover:border-zinc-200 focus:border-zinc-300 focus:bg-white rounded-md text-sm text-zinc-900 placeholder:text-zinc-300 focus:outline-none transition-colors">
                        </div>
                        <div class="col-span-1 sm:col-span-2 flex items-center gap-2 sm:block">
                            <label class="sm:hidden text-xs text-zinc-400 w-12">Qty:</label>
                            <input type="number" placeholder="0" value="1" class="w-full px-3 py-2 bg-transparent border border-transparent hover:border-zinc-200 focus:border-zinc-300 focus:bg-white rounded-md text-sm text-zinc-900 sm:text-right placeholder:text-zinc-300 focus:outline-none transition-colors">
                        </div>
                        <div class="col-span-1 sm:col-span-3 flex items-center gap-2 sm:block relative">
                            <label class="sm:hidden text-xs text-zinc-400 w-12">Price:</label>
                            <span class="absolute left-2 top-1/2 -translate-y-1/2 text-zinc-400 text-sm hidden sm:block pointer-events-none opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity">$</span>
                            <input type="number" placeholder="0.00" value="4500.00" class="w-full px-3 py-2 sm:pl-6 bg-transparent border border-transparent hover:border-zinc-200 focus:border-zinc-300 focus:bg-white rounded-md text-sm text-zinc-900 sm:text-right placeholder:text-zinc-300 focus:outline-none transition-colors">
                        </div>
                        <div class="col-span-1 flex justify-end sm:justify-center">
                            <button class="p-1.5 text-zinc-300 hover:text-red-500 rounded-md hover:bg-red-50 transition-colors focus:outline-none opacity-0 group-hover:opacity-100 focus-within:opacity-100">
                                <iconify-icon icon="solar:trash-bin-trash-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                            </button>
                        </div>
                    </div>

                    <!-- Item 2 -->
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-start sm:items-center group">
                        <div class="col-span-1 sm:col-span-6">
                            <input type="text" placeholder="Description of service or product" value="UI/UX Design Consultation" class="w-full px-3 py-2 bg-transparent border border-transparent hover:border-zinc-200 focus:border-zinc-300 focus:bg-white rounded-md text-sm text-zinc-900 placeholder:text-zinc-300 focus:outline-none transition-colors">
                        </div>
                        <div class="col-span-1 sm:col-span-2 flex items-center gap-2 sm:block">
                            <label class="sm:hidden text-xs text-zinc-400 w-12">Qty:</label>
                            <input type="number" placeholder="0" value="10" class="w-full px-3 py-2 bg-transparent border border-transparent hover:border-zinc-200 focus:border-zinc-300 focus:bg-white rounded-md text-sm text-zinc-900 sm:text-right placeholder:text-zinc-300 focus:outline-none transition-colors">
                        </div>
                        <div class="col-span-1 sm:col-span-3 flex items-center gap-2 sm:block relative">
                            <label class="sm:hidden text-xs text-zinc-400 w-12">Price:</label>
                            <span class="absolute left-2 top-1/2 -translate-y-1/2 text-zinc-400 text-sm hidden sm:block pointer-events-none opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity">$</span>
                            <input type="number" placeholder="0.00" value="150.00" class="w-full px-3 py-2 sm:pl-6 bg-transparent border border-transparent hover:border-zinc-200 focus:border-zinc-300 focus:bg-white rounded-md text-sm text-zinc-900 sm:text-right placeholder:text-zinc-300 focus:outline-none transition-colors">
                        </div>
                        <div class="col-span-1 flex justify-end sm:justify-center">
                            <button class="p-1.5 text-zinc-300 hover:text-red-500 rounded-md hover:bg-red-50 transition-colors focus:outline-none opacity-0 group-hover:opacity-100 focus-within:opacity-100">
                                <iconify-icon icon="solar:trash-bin-trash-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Add Button -->
                <div class="mt-4 border-t border-dashed border-zinc-200 pt-4">
                    <button class="flex items-center gap-2 text-sm font-medium text-zinc-500 hover:text-zinc-900 transition-colors focus:outline-none group">
                        <div class="w-6 h-6 rounded-full bg-zinc-100 flex items-center justify-center group-hover:bg-zinc-200 transition-colors">
                            <iconify-icon icon="solar:add-linear" stroke-width="2" class="text-sm"></iconify-icon>
                        </div>
                        Add Line Item
                    </button>
                </div>
            </div>

            <!-- Summary & Totals -->
            <div class="bg-zinc-50/80 p-6 sm:p-8 border-t border-zinc-200 flex flex-col sm:flex-row justify-between gap-6">
                <!-- Notes -->
                <div class="w-full sm:w-1/2">
                    <label class="text-xs font-medium text-zinc-500 block mb-2">Notes / Payment Terms</label>
                    <textarea placeholder="Thank you for your business." rows="3" class="w-full px-3 py-2 bg-white border border-zinc-200 rounded-lg text-sm text-zinc-700 placeholder:text-zinc-400 focus:outline-none focus:border-zinc-400 focus:ring-1 focus:ring-zinc-400 transition-all resize-none"></textarea>
                </div>

                <!-- Calculation -->
                <div class="w-full sm:w-1/3 flex flex-col gap-3">
                    <div class="flex items-center justify-between text-sm text-zinc-500">
                        <span>Subtotal</span>
                        <span class="font-medium text-zinc-900">$6,000.00</span>
                    </div>
                    <div class="flex items-center justify-between text-sm text-zinc-500">
                        <span>Tax (0%)</span>
                        <span class="font-medium text-zinc-900">$0.00</span>
                    </div>
                    <div class="h-px w-full bg-zinc-200 my-1"></div>
                    <div class="flex items-end justify-between">
                        <span class="text-sm font-medium text-zinc-900">Total Due</span>
                        <span class="text-2xl font-semibold tracking-tight text-zinc-900">USD $6,000.00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Primary Action Bar -->
        <div class="flex flex-col sm:flex-row items-center justify-end gap-3 mt-2">
            <button class="w-full sm:w-auto flex justify-center items-center gap-2 px-6 py-2.5 bg-white border border-zinc-200 rounded-lg text-sm font-medium text-zinc-700 hover:bg-zinc-50 transition-colors focus:outline-none focus:ring-2 focus:ring-zinc-900/20 shadow-sm">
                <iconify-icon icon="solar:letter-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                Send Email
            </button>
            <button class="w-full sm:w-auto flex justify-center items-center gap-2 px-6 py-2.5 bg-zinc-900 border border-zinc-900 rounded-lg text-sm font-medium text-white hover:bg-zinc-800 transition-colors focus:outline-none focus:ring-2 focus:ring-zinc-900/20 shadow-sm shadow-zinc-900/20">
                <iconify-icon icon="solar:card-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                Pay with PayPal
            </button>
        </div>

        <!-- AdSense Placeholder -->
        <div class="mt-8 pt-8 w-full">
            <div class="w-full h-24 rounded-xl border border-dashed border-zinc-300 bg-zinc-50/50 flex flex-col items-center justify-center text-zinc-400 space-y-1">
                <iconify-icon icon="solar:ad-linear" stroke-width="1.5" class="text-xl"></iconify-icon>
                <span class="text-xs font-medium uppercase tracking-widest">Advertisement</span>
            </div>
        </div>

    </main>
</body>
</html>
