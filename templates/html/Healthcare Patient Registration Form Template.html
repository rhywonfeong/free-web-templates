<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Information Entry - E-Medical</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
body { font-family: 'Inter', sans-serif; }
/* Custom date picker icon styling for WebKit */
input[type="date"]::-webkit-calendar-picker-indicator {
opacity: 0;
width: 100%;
height: 100%;
position: absolute;
top: 0;
left: 0;
cursor: pointer;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="antialiased bg-slate-50 text-slate-900 min-h-screen flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 border border-slate-200 rounded-xl flex items-center justify-center shadow-sm bg-white relative overflow-hidden">
                <div class="absolute inset-0 bg-teal-50/50"></div>
                <iconify-icon icon="solar:heart-pulse-linear" class="text-teal-800 relative z-10 text-xl" style="stroke-width: 1.5;"></iconify-icon>
            </div>
            <div>
                <h1 class="text-lg font-semibold tracking-tight text-slate-900 leading-tight">E-Medical</h1>
                <p class="text-xs text-slate-500 font-medium">Healthcare System</p>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <button class="text-slate-500 hover:text-slate-700 transition-colors">
                <iconify-icon icon="solar:bell-bing-linear" class="text-xl" style="stroke-width: 1.5;"></iconify-icon>
            </button>
            <div class="w-9 h-9 rounded-full bg-teal-900 flex items-center justify-center text-white text-sm font-medium shadow-sm">
                JS
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 w-full max-w-4xl mx-auto p-4 md:p-8 lg:py-10">
        
        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex items-center gap-2 text-sm text-slate-500 mb-2">
                <a href="#" class="hover:text-slate-900 transition-colors">Patients</a>
                <iconify-icon icon="solar:alt-arrow-right-linear" class="text-xs"></iconify-icon>
                <span class="text-slate-900 font-medium">New Registration</span>
            </div>
            <h2 class="text-2xl md:text-3xl font-semibold tracking-tight text-slate-900 mb-2">Patient Registration</h2>
            <p class="text-sm text-slate-500">Enter the patient's personal, contact, and medical details below.</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <form class="flex flex-col">
                
                <!-- Section 1: Personal Information -->
                <div class="p-6 md:p-8 border-b border-slate-100">
                    <div class="flex items-center gap-2 mb-6">
                        <div class="w-8 h-8 rounded-lg bg-teal-50 flex items-center justify-center">
                            <iconify-icon icon="solar:user-rounded-linear" class="text-teal-700 text-lg" style="stroke-width: 1.5;"></iconify-icon>
                        </div>
                        <h3 class="text-lg font-semibold tracking-tight text-slate-900">Personal Information</h3>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- First Name -->
                        <div class="flex flex-col gap-1.5">
                            <label for="firstName" class="text-sm font-medium text-slate-700">First Name</label>
                            <input type="text" id="firstName" placeholder="e.g. John" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-900/10 focus:border-teal-900 transition-all text-slate-900 shadow-sm placeholder:text-slate-400">
                        </div>

                        <!-- Last Name -->
                        <div class="flex flex-col gap-1.5">
                            <label for="lastName" class="text-sm font-medium text-slate-700">Last Name</label>
                            <input type="text" id="lastName" placeholder="e.g. Doe" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-900/10 focus:border-teal-900 transition-all text-slate-900 shadow-sm placeholder:text-slate-400">
                        </div>

                        <!-- Date of Birth -->
                        <div class="flex flex-col gap-1.5">
                            <label for="dob" class="text-sm font-medium text-slate-700">Date of Birth</label>
                            <div class="relative flex items-center">
                                <iconify-icon icon="solar:calendar-linear" class="absolute left-3.5 text-slate-400 text-lg pointer-events-none" style="stroke-width: 1.5;"></iconify-icon>
                                <input type="date" id="dob" class="w-full pl-11 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-900/10 focus:border-teal-900 transition-all text-slate-900 shadow-sm text-slate-500 focus:text-slate-900">
                            </div>
                        </div>

                        <!-- Gender -->
                        <div class="flex flex-col gap-1.5">
                            <label for="gender" class="text-sm font-medium text-slate-700">Gender</label>
                            <div class="relative flex items-center">
                                <iconify-icon icon="solar:users-group-rounded-linear" class="absolute left-3.5 text-slate-400 text-lg pointer-events-none z-10" style="stroke-width: 1.5;"></iconify-icon>
                                <select id="gender" class="w-full pl-11 pr-10 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-900/10 focus:border-teal-900 transition-all text-slate-900 shadow-sm appearance-none">
                                    <option value="" disabled selected>Select gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                    <option value="other">Other</option>
                                </select>
                                <iconify-icon icon="solar:alt-arrow-down-linear" class="absolute right-3.5 text-slate-400 text-lg pointer-events-none" style="stroke-width: 1.5;"></iconify-icon>
                            </div>
                        </div>

                        <!-- Blood Group -->
                        <div class="flex flex-col gap-1.5 md:col-span-2 lg:col-span-1">
                            <label for="bloodGroup" class="text-sm font-medium text-slate-700">Blood Group</label>
                            <div class="relative flex items-center">
                                <iconify-icon icon="solar:drop-linear" class="absolute left-3.5 text-slate-400 text-lg pointer-events-none z-10" style="stroke-width: 1.5;"></iconify-icon>
                                <select id="bloodGroup" class="w-full pl-11 pr-10 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-900/10 focus:border-teal-900 transition-all text-slate-900 shadow-sm appearance-none">
                                    <option value="" disabled selected>Select blood group</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                </select>
                                <iconify-icon icon="solar:alt-arrow-down-linear" class="absolute right-3.5 text-slate-400 text-lg pointer-events-none" style="stroke-width: 1.5;"></iconify-icon>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Contact Information -->
                <div class="p-6 md:p-8 border-b border-slate-100">
                    <div class="flex items-center gap-2 mb-6">
                        <div class="w-8 h-8 rounded-lg bg-teal-50 flex items-center justify-center">
                            <iconify-icon icon="solar:phone-calling-linear" class="text-teal-700 text-lg" style="stroke-width: 1.5;"></iconify-icon>
                        </div>
                        <h3 class="text-lg font-semibold tracking-tight text-slate-900">Contact Details</h3>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Phone Number -->
                        <div class="flex flex-col gap-1.5">
                            <label for="phone" class="text-sm font-medium text-slate-700">Phone Number</label>
                            <div class="relative flex items-center">
                                <iconify-icon icon="solar:phone-linear" class="absolute left-3.5 text-slate-400 text-lg pointer-events-none" style="stroke-width: 1.5;"></iconify-icon>
                                <input type="tel" id="phone" placeholder="+1 (555) 000-0000" class="w-full pl-11 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-900/10 focus:border-teal-900 transition-all text-slate-900 shadow-sm placeholder:text-slate-400">
                            </div>
                        </div>

                        <!-- Email Address -->
                        <div class="flex flex-col gap-1.5">
                            <label for="email" class="text-sm font-medium text-slate-700">Email Address <span class="text-slate-400 font-normal">(Optional)</span></label>
                            <div class="relative flex items-center">
                                <iconify-icon icon="solar:letter-linear" class="absolute left-3.5 text-slate-400 text-lg pointer-events-none" style="stroke-width: 1.5;"></iconify-icon>
                                <input type="email" id="email" placeholder="patient@example.com" class="w-full pl-11 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-900/10 focus:border-teal-900 transition-all text-slate-900 shadow-sm placeholder:text-slate-400">
                            </div>
                        </div>

                        <!-- Full Address -->
                        <div class="flex flex-col gap-1.5 md:col-span-2">
                            <label for="address" class="text-sm font-medium text-slate-700">Residential Address</label>
                            <div class="relative flex">
                                <iconify-icon icon="solar:map-point-linear" class="absolute left-3.5 top-3 text-slate-400 text-lg pointer-events-none" style="stroke-width: 1.5;"></iconify-icon>
                                <textarea id="address" rows="3" placeholder="Enter complete address..." class="w-full pl-11 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-900/10 focus:border-teal-900 transition-all text-slate-900 shadow-sm placeholder:text-slate-400 resize-none"></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section 3: Emergency Contact -->
                <div class="p-6 md:p-8">
                    <div class="flex items-center gap-2 mb-6">
                        <div class="w-8 h-8 rounded-lg bg-teal-50 flex items-center justify-center">
                            <iconify-icon icon="solar:shield-warning-linear" class="text-teal-700 text-lg" style="stroke-width: 1.5;"></iconify-icon>
                        </div>
                        <h3 class="text-lg font-semibold tracking-tight text-slate-900">Emergency Contact</h3>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Emergency Contact Name -->
                        <div class="flex flex-col gap-1.5">
                            <label for="emName" class="text-sm font-medium text-slate-700">Contact Name</label>
                            <input type="text" id="emName" placeholder="Full name" class="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-900/10 focus:border-teal-900 transition-all text-slate-900 shadow-sm placeholder:text-slate-400">
                        </div>

                        <!-- Relationship -->
                        <div class="flex flex-col gap-1.5">
                            <label for="emRelation" class="text-sm font-medium text-slate-700">Relationship</label>
                            <div class="relative flex items-center">
                                <select id="emRelation" class="w-full pl-4 pr-10 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-900/10 focus:border-teal-900 transition-all text-slate-900 shadow-sm appearance-none">
                                    <option value="" disabled selected>Select relation</option>
                                    <option value="parent">Parent</option>
                                    <option value="spouse">Spouse</option>
                                    <option value="child">Child</option>
                                    <option value="sibling">Sibling</option>
                                    <option value="friend">Friend</option>
                                    <option value="other">Other</option>
                                </select>
                                <iconify-icon icon="solar:alt-arrow-down-linear" class="absolute right-3.5 text-slate-400 text-lg pointer-events-none" style="stroke-width: 1.5;"></iconify-icon>
                            </div>
                        </div>

                        <!-- Emergency Phone -->
                        <div class="flex flex-col gap-1.5 md:col-span-2 lg:col-span-1">
                            <label for="emPhone" class="text-sm font-medium text-slate-700">Phone Number</label>
                            <div class="relative flex items-center">
                                <iconify-icon icon="solar:phone-linear" class="absolute left-3.5 text-slate-400 text-lg pointer-events-none" style="stroke-width: 1.5;"></iconify-icon>
                                <input type="tel" id="emPhone" placeholder="Emergency phone" class="w-full pl-11 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-teal-900/10 focus:border-teal-900 transition-all text-slate-900 shadow-sm placeholder:text-slate-400">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="bg-slate-50 border-t border-slate-200 p-6 flex flex-col sm:flex-row items-center justify-end gap-3 rounded-b-2xl">
                    <button type="button" class="w-full sm:w-auto px-5 py-2.5 bg-white border border-slate-200 text-slate-700 font-medium rounded-xl hover:bg-slate-50 transition-colors text-sm shadow-sm">
                        Cancel
                    </button>
                    <button type="submit" class="w-full sm:w-auto px-6 py-2.5 bg-teal-900 hover:bg-teal-950 text-white font-medium rounded-xl transition-all text-sm shadow-sm active:scale-[0.98] flex items-center justify-center gap-2">
                        <iconify-icon icon="solar:diskette-linear" class="text-lg"></iconify-icon>
                        Save Patient Record
                    </button>
                </div>

            </form>
        </div>
    </main>

</body>
</html>
