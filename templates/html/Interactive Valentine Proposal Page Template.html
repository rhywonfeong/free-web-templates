<style>
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
}
/* Custom Animations */
@keyframes float {
0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
50% { transform: translateY(-20px) rotate(5deg); opacity: 0.8; }
}
.floating-heart {
animation: float 6s ease-in-out infinite;
}
.delay-100 { animation-delay: 1s; }
.delay-200 { animation-delay: 2s; }
@keyframes heartbeat {
0%, 100% { transform: scale(1); }
50% { transform: scale(1.05); }
}
.animate-heartbeat {
animation: heartbeat 2s ease-in-out infinite;
}
/* Fade transitions */
.fade-enter {
opacity: 0;
transform: scale(0.95);
transition: opacity 0.8s ease-out, transform 0.8s ease-out;
}
.fade-enter-active {
opacity: 1;
transform: scale(1);
}
.hidden-state {
display: none;
opacity: 0;
}
/* Confetti Styling */
.confetti-heart {
position: fixed;
top: -10%;
z-index: 50;
animation: fall linear forwards;
}
@keyframes fall {
to { transform: translateY(110vh) rotate(720deg); }
}
</style></head>
<body class="bg-slate-950 min-h-screen w-full relative overflow-hidden flex flex-col items-center justify-center selection:bg-rose-500/30 selection:text-rose-200">

    <!-- Background Image Layer (Replace src with your uploaded photo URL) -->
    <div class="absolute inset-0 z-0">

        <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/e4420f9a-29c2-4e34-9043-83222233849b_1600w.png" alt="Background Memory" class="w-full h-full object-cover blur-sm scale-105">
        <!-- Dark Pink/Red Overlay -->
        <div class="absolute inset-0 bg-rose-950/60 mix-blend-multiply transition-opacity duration-1000"></div>
        <div class="bg-gradient-to-tr from-white/10 to-white/0 absolute top-0 right-0 bottom-0 left-0"></div>
    </div>

    <!-- Ambient Floating Hearts (Background) -->
    <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[15%] left-[10%] text-rose-300/20 text-6xl floating-heart">
            <iconify-icon icon="solar:heart-linear" stroke-width="1.5"></iconify-icon>
        </div>
        <div class="absolute bottom-[20%] right-[15%] text-rose-300/20 text-5xl floating-heart delay-100">
            <iconify-icon icon="solar:heart-shine-linear" stroke-width="1.5"></iconify-icon>
        </div>
        <div class="absolute top-[40%] right-[20%] text-rose-300/10 text-7xl floating-heart delay-200">
            <iconify-icon icon="solar:cupid-linear" stroke-width="1.5"></iconify-icon>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="flex flex-col text-center w-full max-w-lg z-10 pr-6 pl-6 relative items-center">
        
        <!-- Proposal Section -->
        <div class="flex flex-col transition-all duration-700 ease-in-out items-center" id="proposal-card">
            
            <!-- Animated Icon -->
            <div class="mb-8 p-4 rounded-full bg-white/5 border border-white/10 backdrop-blur-md shadow-2xl shadow-rose-900/50 animate-heartbeat">
                <iconify-icon icon="solar:heart-bold" class="text-4xl text-rose-400" width="36" height="36" style="color: rgb(251, 113, 133);"></iconify-icon>
            </div>

            <!-- Main Question -->
            <h1 class="md:text-6xl leading-tight text-4xl font-medium text-white tracking-tight font-playfair mb-6 drop-shadow-lg">
                Love, will you be my <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-rose-200 via-pink-300 to-rose-200">
                    Valentine?
                </span>
            </h1>

            <p class="text-lg font-light text-rose-100/80 mb-10 max-w-sm leading-relaxed">
                Life is just better with you by my side.
            </p>

            <!-- Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto items-center justify-center relative min-h-[60px]">
                
                <button onclick="handleYes()" class="group sm:w-40 hover:bg-rose-400 shadow-rose-900/40 transition-all duration-300 hover:-translate-y-1 active:scale-95 flex overflow-hidden text-white bg-rose-500 w-full rounded-xl pt-3.5 pb-3.5 relative shadow-lg gap-x-2 gap-y-2 items-center justify-center">
                    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shine_1s_infinite]"></div>
                    <span class="font-medium text-sm tracking-wide">YES 💖</span>
                </button>

                <button id="btn-no" onmouseover="dodgeButton()" onclick="dodgeButton()" class="w-full sm:w-40 py-3.5 bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 text-rose-100 rounded-xl transition-all duration-300 flex items-center justify-center gap-2 active:scale-95" style=" position: fixed; left: 20px; top: 297.622px; z-index: 50;">
                    <span class="font-medium text-sm tracking-wide">Really?</span>
                </button>

            </div>
        </div>

        <!-- Success Section (Hidden initially) -->
        <div class="hidden-state flex flex-col max-w-md mr-auto ml-auto items-center" id="success-card">
            <div class="mb-6 relative">
                <div class="absolute inset-0 bg-rose-500 blur-2xl opacity-20 rounded-full"></div>
                <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3R6eW56bmR6ZzR6eW56bmR6ZzR6eW56bmR6ZzR6eW56bmR6ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/MDJ9IbxxvDUQM/giphy.gif" alt="Happy Cat" class="relative w-32 h-32 object-cover rounded-2xl border-2 border-white/20 shadow-2xl">
            </div>
            
            <h2 class="md:text-5xl text-3xl font-medium text-white tracking-tight mb-6 drop-shadow-md">
                Yay!
            </h2>
            
            <p class="leading-relaxed text-xl font-light text-rose-50 mb-8">
                I love you so much, <span class="font-medium text-rose-300">Tenshi</span> 💕 <br>
                Happy Valentine’s Day.
            </p>

            <div class="flex gap-3">
                <button onclick="window.location.reload()" class="px-6 py-2.5 rounded-lg bg-white/10 border border-white/10 text-xs font-medium text-rose-200 hover:bg-white/20 transition-colors backdrop-blur-sm">
                    Replay Moment
                </button>
            </div>

    </main>

    <!-- Footer -->
    <footer class="absolute bottom-6 w-full text-center z-10">
        <p class="text-xs font-medium tracking-widest text-rose-200/40 uppercase">
            Forever &amp; Always
        </p>
    </footer>

    <!-- Audio (Optional - can add music source here) -->
    
    <script>
        const btnNo = document.getElementById('btn-no');
        const proposalCard = document.getElementById('proposal-card');
        const successCard = document.getElementById('success-card');
        
        let moveCount = 0;
        const noTexts = ["Are you sure?", "Really?", "Don't break my heart!", "Pretty please?", "Last chance!", "Ok, I'll cry..."];

        function dodgeButton() {
            moveCount++;
            
            // 1. Change Text
            const span = btnNo.querySelector('span');
            if (moveCount <= noTexts.length) {
                span.innerText = noTexts[moveCount - 1];
            } else {
                // Eventually just turn it into a Yes button logically
                span.innerText = "YES 💖";
                btnNo.onclick = handleYes;
                btnNo.style.backgroundColor = "#f43f5e"; // rose-500
                btnNo.onmouseover = null;
                return;
            }

            // 2. Shrink slightly
            const currentScale = 1 - (moveCount * 0.05);
            btnNo.style.transform = `scale(${Math.max(0.5, currentScale)})`;

            // 3. Move Randomly
            // Get viewport dimensions
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            
            // Get button dimensions
            const btnRect = btnNo.getBoundingClientRect();
            
            // Calculate safe boundaries (keeping it somewhat on screen)
            const maxLeft = viewportWidth - btnRect.width - 20;
            const maxTop = viewportHeight - btnRect.height - 20;
            
            const newLeft = Math.max(20, Math.random() * maxLeft);
            const newTop = Math.max(20, Math.random() * maxTop);

            btnNo.style.position = 'fixed';
            btnNo.style.left = newLeft + 'px';
            btnNo.style.top = newTop + 'px';
            btnNo.style.zIndex = '50';
        }

        function handleYes() {
            // 1. Transition UI
            proposalCard.style.opacity = '0';
            proposalCard.style.transform = 'translateY(-20px)';
            
            setTimeout(() => {
                proposalCard.style.display = 'none';
                successCard.classList.remove('hidden-state');
                successCard.classList.add('fade-enter');
                
                // Trigger animation start
                requestAnimationFrame(() => {
                    successCard.classList.add('fade-enter-active');
                });
            }, 600);

            // 2. Fire Confetti
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#fb7185', '#f43f5e', '#ffe4e6', '#ffffff'];
            const icons = ['heart-bold', 'heart-shine-linear', 'star-bold'];

            // Create 50 pieces
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti-heart';
                    
                    // Random Icon
                    const icon = icons[Math.floor(Math.random() * icons.length)];
                    confetti.innerHTML = `<iconify-icon icon="solar:${icon}"></iconify-icon>`;
                    
                    // Random Position & Style
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.color = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.fontSize = (Math.random() * 20 + 10) + 'px';
                    confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                    
                    document.body.appendChild(confetti);

                    // Cleanup
                    setTimeout(() => confetti.remove(), 5000);
                }, i * 50);
            }
        }
    </script>

</body></html>
