<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronto Invoice - Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script></head>
<body class="bg-gray-50 font-inter overflow-hidden">
    <!-- iPhone 16 Frame -->
    <div class="flex items-center justify-center min-h-screen bg-gray-900 p-8">
        <div class="relative">
            <!-- iPhone Frame -->
            <div class="w-[390px] h-[844px] bg-black rounded-[60px] p-2 shadow-2xl">
                <!-- Screen -->
                <div class="w-full h-full bg-gray-50 rounded-[50px] overflow-hidden relative">
                    <!-- Dynamic Island -->
                    <div class="absolute top-2 left-1/2 transform -translate-x-1/2 w-32 h-8 bg-black rounded-full z-50"></div>
                    
                    <!-- Safe Area Content -->
                    <div class="pt-16 px-8 h-full flex flex-col">
                        <!-- Logo Section -->
                        <div class="flex-1 flex flex-col items-center justify-center space-y-8 animate-fade-in">
                            <!-- Logo -->
                            <div class="text-center space-y-4 opacity-0 animate-fade-in" style="animation-delay: 0.2s; animation-fill-mode: forwards;">
                                <div class="w-24 h-24 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg">
                                    <i data-lucide="receipt" class="w-12 h-12 text-white"></i>
                                </div>
                                <h1 class="text-2xl font-semibold text-gray-900 tracking-tight">Pronto Invoice</h1>
                            </div>
                            
                            <!-- Hero Image -->
                            <div class="w-80 h-64 relative opacity-0 animate-fade-in" style="animation-delay: 0.4s; animation-fill-mode: forwards;">
                                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=300&fit=crop&crop=face" 
                                     alt="Professional tradesperson" 
                                     class="w-full h-full object-cover rounded-3xl shadow-lg">
                                <div class="absolute inset-0 bg-gradient-to-t from-blue-600/20 to-transparent rounded-3xl"></div>
                            </div>
                        </div>
                        
                        <!-- Content Section -->
                        <div class="flex-1 flex flex-col justify-center space-y-8">
                            <!-- Tagline -->
                            <div class="text-center space-y-4 opacity-0 animate-fade-in" style="animation-delay: 0.6s; animation-fill-mode: forwards;">
                                <h2 class="text-3xl font-semibold text-gray-900 tracking-tight leading-tight">
                                    Send Professional Invoices Quickly and Get Paid Faster
                                </h2>
                                <p class="text-lg text-gray-600 font-normal leading-relaxed">
                                    Perfect for contractors, electricians, plumbers, and small business owners
                                </p>
                            </div>
                            
                            <!-- CTA Buttons -->
                            <div class="space-y-4 opacity-0 animate-fade-in" style="animation-delay: 0.8s; animation-fill-mode: forwards;">
                                <!-- Primary CTA -->
                                <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-4 px-6 rounded-2xl text-lg transition-all duration-200 shadow-md hover:shadow-lg transform hover:scale-[1.02] active:scale-[0.98]">
                                    Create Account
                                </button>
                                
                                <!-- Secondary CTA -->
                                <button class="w-full border border-gray-300 hover:border-gray-400 text-gray-700 hover:text-gray-900 font-medium py-4 px-6 rounded-2xl text-lg transition-all duration-200 hover:bg-gray-50 transform hover:scale-[1.02] active:scale-[0.98]">
                                    Log In
                                </button>
                            </div>
                        </div>
                        
                        <!-- Footer -->
                        <div class="pb-8 opacity-0 animate-fade-in" style="animation-delay: 1.0s; animation-fill-mode: forwards;">
                            <p class="text-sm text-gray-500 text-center font-normal">
                                No social login. No commitment. Cancel anytime.
                            </p>
                        </div>
                    </div>
                    
                    <!-- Home Indicator -->
                    <div class="absolute bottom-2 left-1/2 transform -translate-x-1/2 w-32 h-1 bg-gray-900 rounded-full"></div>
                </div>
            </div>
        </div>
    </div>

    <style>
        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-fade-in {
            animation: fade-in 0.6s ease-out;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Add touch feedback for iOS-like interactions
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.style.transform = 'scale(0.98)';
            });
            
            button.addEventListener('touchend', function() {
                this.style.transform = 'scale(1)';
            });
        });
    </script>
</body>
</html>
