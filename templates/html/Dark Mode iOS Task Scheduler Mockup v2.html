<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Task Scheduling App</title>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .fade-in {
      animation: fadeIn 2s ease-out;
    }
  </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen">

  <!-- iPhone Frame with Dynamic Island -->
  <div class="bg-black rounded-[2rem] p-4 w-[23rem] shadow-2xl relative fade-in">
    <!-- Dynamic Island -->
    <div class="bg-gray-700 rounded-full w-32 h-8 mx-auto mt-2.5"></div>

    <!-- Display Section -->
    <div class="bg-gray-800 rounded-t-2xl mt-2 pb-1 shadow-inner">
      <div class="text-white text-center pt-4 pb-2 text-xl font-semibold">Today's Schedule</div>

      <ul class="divide-y divide-gray-700">
        <li class="p-4 hover:bg-gray-700 transition">
          <h3 class="text-white font-medium">9:00 AM - Team Briefing</h3>
          <p class="text-gray-400 text-sm">Zoom Meeting</p>
        </li>
        <li class="p-4 hover:bg-gray-700 transition">
          <h3 class="text-white font-medium">11:00 AM - Code Review</h3>
          <p class="text-gray-400 text-sm">Office</p>
        </li>
        <li class="p-4 hover:bg-gray-700 transition">
          <h3 class="text-white font-medium">1:00 PM - Lunch with Client</h3>
          <p class="text-gray-400 text-sm">Downtown Café</p>
        </li>
        <li class="p-4 hover:bg-gray-700 transition">
          <h3 class="text-white font-medium">4:00 PM - Presentation Prep</h3>
          <p class="text-gray-400 text-sm">Home Office</p>
        </li>
      </ul>
    </div>

    <!-- Bottom Space Simulation -->
    <div class="bg-gray-800 rounded-b-2xl h-10"></div>
  </div>

</body>
</html>
