  <meta charset="UTF-8">

  <style>
    body { font-family: 'Inter', sans-serif; background: #0a1224; }
    .letter-animate {
      opacity: 0;
      transform: translateY(24px);
      filter: blur(8px);
      display: inline-block;
      animation: letterFadeInUp 0.7s cubic-bezier(.31,1.34,.42,1.01) forwards;
    }
    @keyframes letterFadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }
    .iphone-frame {
      border-radius: 2.5rem;
      box-shadow:
        0 8px 32px 0 rgba(16, 21, 56, 0.35),
        0 2px 8px 0 rgba(0,0,0,0.16);
      border: 7px solid #222932;
      background: #000;
      position: relative;
      width: 390px;
      height: 844px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }
    .notch {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 34px;
      background: #101216;
      border-radius: 18px;
      z-index: 20;
      border: 2px solid #23242a;
      box-shadow: 0 2px 10px rgba(0,0,0,.38);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .frame-buttons {
      position: absolute;
      z-index: 20;
      left: -14px;
      top: 110px;
      width: 6px;
      height: 54px;
      background: #23272c;
      border-radius: 4px;
    }
    .frame-buttons.long { top: 212px; height: 90px; }
    .frame-buttons.right { left: auto; right: -14px; top: 170px; height: 36px; }
    .notch-dot {
      width: 38px;
      height: 8px;
      background: #222325;
      border-radius: 4px;
      margin: 0 6px;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-black p-10">
  <div class="relative flex flex-col items-center justify-center min-h-screen w-full">
    <div class="iphone-frame">
      <div class="notch"><div class="notch-dot"></div></div>
      <div class="frame-buttons"></div>
      <div class="frame-buttons long"></div>
      <div class="frame-buttons right"></div>
      <div id="onboard-vanta" class="absolute inset-0 z-0 pointer-events-none"></div>
      <main class="relative z-10 w-full flex flex-col items-center pt-24 pb-8 px-4 h-full overflow-y-auto">
        <div class="flex flex-col gap-2 items-center">
          <h1 class="text-3xl font-bold text-white mb-1 text-center" id="animated-onboard-title"></h1>

        </div>
        <nav class="mt-10 w-full flex flex-col gap-6">
          <div class="bg-gray-900/80 border border-gray-800 rounded-xl px-5 py-4 flex gap-4 items-center shadow-sm">
            <span class="flex items-center justify-center h-8 w-8 rounded-full bg-blue-600 text-white font-bold text-base">1</span>
            <div>
              <div class="text-white font-semibold text-base">Connect your network</div>
              <div class="text-gray-400 text-xs mt-0.5">Integrate your accounts and data streams securely.</div>
            </div>
          </div>
          <div class="bg-gray-900/80 border border-gray-800 rounded-xl px-5 py-4 flex gap-4 items-center shadow-sm">
            <span class="flex items-center justify-center h-8 w-8 rounded-full bg-blue-600 text-white font-bold text-base">2</span>
            <div>
              <div class="text-white font-semibold text-base">View insights</div>
              <div class="text-gray-400 text-xs mt-0.5">See your live network status and trends instantly.</div>
            </div>
          </div>
          <div class="bg-gray-900/80 border border-gray-800 rounded-xl px-5 py-4 flex gap-4 items-center shadow-sm">
            <span class="flex items-center justify-center h-8 w-8 rounded-full bg-blue-600 text-white font-bold text-base">3</span>
            <div>
              <div class="text-white font-semibold text-base">Take action</div>
              <div class="text-gray-400 text-xs mt-0.5">Manage alerts, settings, and more smartly.</div>
            </div>
          </div>
        </nav>
        <!-- Page indicator dots removed. -->
        <button class="mt-14 w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-700 font-bold text-white text-lg shadow-lg transition active:scale-95">
          Get Started
        </button>
      </main>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      VANTA.NET({
        el: "#onboard-vanta",
        mouseControls: false,
        touchControls: false,
        gyroControls: false,
        minHeight: 300,
        minWidth: 300,
        scale: 1,
        scaleMobile: 1,
        color: 0x60a5fa,
        backgroundColor: 0x0a1224,
        points: 10,
        maxDistance: 20,
        spacing: 18,
        showDots: true
      });
      function animateLetters(elementId, text) {
        const container = document.getElementById(elementId);
        container.innerHTML = "";
        [...text].forEach((char, i) => {
          const span = document.createElement('span');
          span.textContent = char;
          span.className = "letter-animate";
          span.style.animationDelay = (i * 55) + "ms";
          container.appendChild(span);
        });
      }
      animateLetters('animated-onboard-title', 'Welcome!');
    });
  </script>
</body>
