<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>branches</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Quicksand', sans-serif; }
    .farm-title { font-family: 'Amatic SC', cursive; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Amatic+SC&display=swap" rel="stylesheet">
</head>
<body class="bg-white min-h-screen flex flex-col">
  <!-- Navigation -->
  <nav class="w-full flex items-center justify-between p-6">
    <div class="text-2xl font-bold text-green-700 tracking-tight select-none farm-title">branches</div>
    <div class="flex items-center space-x-4">
      <a href="#" class="text-gray-600 font-medium hover:text-green-700 transition">Sign In</a>
      <!-- Menu -->
      <div class="relative">
        <button id="menu-btn" class="inline-flex items-center px-3 py-2 rounded focus:outline-none hover:bg-gray-100" aria-label="Open menu">
          <svg class="w-6 h-6 text-green-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
        <!-- Dropdown Menu -->
        <div id="menu-dropdown" class="hidden absolute right-0 mt-2 w-64 bg-white border border-gray-200 rounded-lg shadow-lg z-50">
          <div class="flex flex-col py-2">
            <a href="#" class="px-6 py-3 hover:bg-gray-50 text-gray-800 font-semibold">White Paper</a>
            <a href="#" class="px-6 py-3 hover:bg-gray-50 text-gray-800 font-semibold">Share Farming Calculator</a>
            <a href="#" class="px-6 py-3 hover:bg-gray-50 text-gray-800 font-semibold">Covered Call Made Easy</a>
            <a href="#" class="px-6 py-3 hover:bg-gray-50 text-gray-800 font-semibold">About Us</a>
          </div>
          <div class="border-t border-gray-200">
            <a href="#" class="block px-6 py-3 text-xs text-gray-500 hover:bg-gray-50">Terms of Service</a>
          </div>
        </div>
      </div>
    </div>
  </nav>
  <!-- Main Content -->
  <main class="flex flex-1 flex-col items-center justify-center px-6">
    <h1 class="farm-title text-5xl sm:text-7xl font-bold text-green-800 mb-4 text-center leading-tight">
      Share Farming,
    </h1>
    <p class="text-lg sm:text-2xl text-gray-700 mb-8 text-center">
      like dividends, but smarter
    </p>
    <a href="#" class="inline-block bg-green-700 text-white px-8 py-3 rounded-full text-lg font-semibold shadow hover:bg-green-800 transition">
      Start Growing Today
    </a>
  </main>
  <script>
    const menuBtn = document.getElementById('menu-btn');
    const menuDropdown = document.getElementById('menu-dropdown');
    menuBtn.addEventListener('click', () => {
      menuDropdown.classList.toggle('hidden');
    });
    document.addEventListener('click', (event) => {
      if (!menuBtn.contains(event.target) && !menuDropdown.contains(event.target)) {
        menuDropdown.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
