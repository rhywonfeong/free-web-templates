<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Photos Hero</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
body {
font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
.letter {
display: inline-block;
opacity: 0;
transform: translateY(10px);
animation: letter-fade 4s infinite linear;
animation-delay: var(--delay);
}
@keyframes letter-fade {
0% {
opacity: 0;
transform: translateY(10px);
}
10% {
opacity: 1;
transform: translateY(0);
}
80% {
opacity: 1;
transform: translateY(0);
}
100% {
opacity: 0;
transform: translateY(-10px);
}
}
@keyframes fadeSlideIn {
0% {
opacity: 0;
transform: translateY(20px);
}
100% {
opacity: 1;
transform: translateY(0);
}
}
@keyframes float1 {
0%, 100% {
transform: translateY(0px) rotate(0deg);
}
50% {
transform: translateY(-20px) rotate(2deg);
}
}
@keyframes float2 {
0%, 100% {
transform: translateY(0px) rotate(0deg);
}
50% {
transform: translateY(-15px) rotate(-2deg);
}
}
@keyframes float3 {
0%, 100% {
transform: translateY(0px) rotate(0deg);
}
50% {
transform: translateY(-25px) rotate(3deg);
}
}
@keyframes float4 {
0%, 100% {
transform: translateY(0px) rotate(0deg);
}
50% {
transform: translateY(-18px) rotate(-1deg);
}
}
.floating-img-1 {
animation: float1 6s ease-in-out infinite;
}
.floating-img-2 {
animation: float2 7s ease-in-out infinite 0.5s;
}
.floating-img-3 {
animation: float3 5.5s ease-in-out infinite 1s;
}
.floating-img-4 {
animation: float4 6.5s ease-in-out infinite 0.75s;
}
.animate-fadeSlideIn {
animation: fadeSlideIn 0.8s ease-out both;
}
.animation-delay-200 {
animation-delay: 0.2s;
}
.animation-delay-300 {
animation-delay: 0.3s;
}
.animation-delay-400 {
animation-delay: 0.4s;
}
.animation-delay-500 {
animation-delay: 0.5s;
}
</style></head>
<body class="bg-black">
  <section class="relative z-10 overflow-hidden w-full max-w-7xl mx-auto mt-6 p-6 sm:p-8 bg-neutral-900/60 border border-white/10 rounded-2xl backdrop-blur" style="height: 500px;">
    <div class="absolute inset-0">
      <div class="flex w-full h-full items-center">
        <!-- Main Content -->
        <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="max-w-2xl">
            <h1 class="text-4xl sm:text-6xl md:text-7xl font-light text-white tracking-tighter max-w-xl leading-[0.95] animate-fadeSlideIn animation-delay-300" id="animated-heading">
              Discover Beautiful Stock Photos
            </h1>
            
            <p class="mt-6 text-base sm:text-lg text-neutral-300 max-w-[60ch] animate-fadeSlideIn animation-delay-400">
              Over 3 million high-quality stock photos from talented photographers worldwide. Free to use for personal and commercial projects.
            </p>

            <div class="mt-6 animate-fadeSlideIn animation-delay-500">
              <div class="flex items-center gap-4">
                <!-- Phone Icon -->
                <a href="tel:+1234567890" class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 ring-1 ring-white/20 shadow-lg hover:shadow-xl transition-all duration-200 hover:-translate-y-0.5">
                  <i data-lucide="phone" class="text-white/90" style="width: 20px; height: 20px;"></i>
                </a>

                <!-- Email Icon -->
                <a href="mailto:hello@example.com" class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 ring-1 ring-white/20 shadow-lg hover:shadow-xl transition-all duration-200 hover:-translate-y-0.5">
                  <i data-lucide="mail" class="text-white/90" style="width: 20px; height: 20px;"></i>
                </a>

                <!-- Facebook Icon -->
                <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 ring-1 ring-white/20 shadow-lg hover:shadow-xl transition-all duration-200 hover:-translate-y-0.5">
                  <i data-lucide="facebook" class="text-white/90" style="width: 20px; height: 20px;"></i>
                </a>

                <!-- Instagram Icon -->
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 ring-1 ring-white/20 shadow-lg hover:shadow-xl transition-all duration-200 hover:-translate-y-0.5">
                  <i data-lucide="instagram" class="text-white/90" style="width: 20px; height: 20px;"></i>
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- Floating Images on the Right -->
        <div class="hidden lg:block absolute top-1/2 right-8 -translate-y-1/2 -translate-x-16 pointer-events-none">
          <div class="relative" style="width: 340px; height: 400px;">
            <!-- Image 1 -->
            <div class="floating-img-1 absolute top-0 right-0 w-32 h-40 rounded-xl ring-2 ring-white/20 shadow-2xl overflow-hidden translate-x-8">
              <img src="https://images.unsplash.com/photo-1682687220742-aba13b6e50ba?w=400&h=500&fit=crop" alt="Floating image 1" class="w-full h-full object-cover">
            </div>

            <!-- Image 2 -->
            <div class="floating-img-2 absolute top-24 right-24 w-36 h-44 rounded-xl ring-2 ring-white/20 shadow-2xl overflow-hidden -translate-x-16">
              <img src="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=400&h=500&fit=crop" alt="Floating image 2" class="w-full h-full object-cover">
            </div>

            <!-- Image 3 -->
            <div class="floating-img-3 absolute right-8 bottom-0 w-28 h-36 rounded-xl ring-2 ring-white/20 shadow-2xl overflow-hidden translate-x-12">
              <img src="https://images.unsplash.com/photo-1635776062043-223faf322554?w=400&h=500&fit=crop" alt="Floating image 3" class="w-full h-full object-cover">
            </div>

            <!-- Image 4 -->
            <div class="floating-img-4 absolute top-32 left-0 w-32 h-40 rounded-xl ring-2 ring-white/20 shadow-2xl overflow-hidden -translate-x-3 translate-y-16">
              <img src="https://images.unsplash.com/photo-1618005198919-d3d4b5a92ead?w=400&h=500&fit=crop" alt="Floating image 4" class="w-full h-full object-cover">
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script>
    (function() {
      const heading = document.getElementById('animated-heading');
      const text = heading.textContent.trim();
      heading.innerHTML = '';
      
      let totalDelay = 0;
      text.split('').forEach((char) => {
        if (char === ' ') {
          heading.appendChild(document.createTextNode(' '));
        } else {
          const span = document.createElement('span');
          span.className = 'letter';
          span.textContent = char;
          span.style.setProperty('--delay', (totalDelay * 0.08) + 's');
          heading.appendChild(span);
          totalDelay++;
        }
      });

      lucide.createIcons();
    })();
  </script>
</body>
</html>
