o" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap"><style id="all-fonts-style-font-space-mono">.font-space-mono { font-family: 'Space Mono', monospace !important; }</style><link id="all-fonts-link-font-quicksand" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-quicksand">.font-quicksand { font-family: 'Quicksand', sans-serif !important; }</style><link id="all-fonts-link-font-nunito" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&amp;display=swap"><style id="all-fonts-style-font-nunito">.font-nunito { font-family: 'Nunito', sans-serif !important; }</style></head>
<body class="font-sans antialiased bg-neutral-50 text-neutral-900 selection:bg-emerald-100 selection:text-emerald-900" style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;">
  <div class="min-h-screen flex pt-4 pr-4 pb-4 pl-4 items-center justify-center">
    <!-- App Shell (Phone-sized) -->
    <div class="w-full max-w-sm overflow-hidden bg-white border-neutral-200 border rounded-3xl shadow-lg">
      <!-- Top Safe Area -->
      <div class="bg-white h-6"></div>

      <!-- Header -->
      <header class="px-5 pt-2 pb-4 bg-white sticky top-0 z-10">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="h-9 w-9 rounded-xl bg-emerald-100 border border-emerald-200 flex items-center justify-center">
              <span class="text-emerald-700 text-sm font-semibold tracking-tight font-sans">GL</span>
            </div>
            <div class="flex flex-col">
              <h1 class="text-[22px] leading-6 tracking-tight font-sans font-semibold">Grocery List</h1>
              <span id="dateLabel" class="text-[12px] text-neutral-500 font-sans">Mon, Sep 8</span>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <button id="clearBought" class="text-[12px] px-3 py-1.5 rounded-lg border border-neutral-200 text-neutral-700 hover:text-emerald-700 hover:border-emerald-200 hover:bg-emerald-50/70 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-300 font-sans">
              Clear bought
            </button>
          </div>
        </div>

        <!-- Stats -->
        <div class="mt-3 flex items-center gap-2 text-[12px]">
          <div class="px-2 py-1 rounded-md bg-neutral-100 text-neutral-700 border border-neutral-200 font-sans">
            <span id="statsTotal" class="font-sans">0</span> items
          </div>
          <div class="px-2 py-1 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200 font-sans">
            <span id="statsBought" class="font-sans">0</span> bought
          </div>
        </div>

        <!-- Divider -->
        <div class="mt-4 h-px bg-neutral-200/80"></div>
      </header>

      <!-- Content -->
      <main class="px-5 pb-28 pt-2">
        <!-- To Buy Section -->
        <section id="sectionToBuy" class="mb-6">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-neutral-700">
                <path d="M6 6h15l-1.5 9h-13z"></path>
                <path d="M6 6l-2-2"></path>
                <circle cx="9" cy="20" r="1"></circle>
                <circle cx="18" cy="20" r="1"></circle>
              </svg>
              <h2 class="text-[15px] font-semibold tracking-tight text-neutral-800 font-sans">To buy</h2>
            </div>
            <span id="countToBuy" class="text-[12px] text-neutral-500 font-sans">0</span>
          </div>
          <ul id="listToBuy" class="space-y-2"></ul>
        </section>

        <!-- Bought Section -->
        <section id="sectionBought" class="mb-2" style="display: none;">
          <div class="flex items-center justify-between mb-2">
            <div class="flex items-center gap-2">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-neutral-700">
                <path d="M20 6L9 17l-5-5"></path>
              </svg>
              <h2 class="text-[15px] font-semibold tracking-tight text-neutral-800 font-sans">Bought</h2>
            </div>
            <span id="countBought" class="text-[12px] text-neutral-500 font-sans">0</span>
          </div>
          <ul id="listBought" class="space-y-2"></ul>
        </section>
      </main>

      <!-- Add Item Bar -->
      <div class="fixed inset-x-0 bottom-0">
        <div class="mx-auto w-full max-w-sm">
          <div class="border-t border-neutral-200 bg-white px-4 pt-3 pb-5 shadow-[0_-6px_20px_-10px_rgba(0,0,0,0.15)]">
            <div class="flex items-center gap-2">
              <div class="flex-1">
                <label for="newItemInput" class="sr-only font-sans">Add a new item</label>
                <div class="flex items-center gap-2 rounded-xl border border-neutral-200 bg-white px-3 py-2 focus-within:border-emerald-300 focus-within:ring-2 focus-within:ring-emerald-200 transition">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-neutral-500">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M21 21l-3.5-3.5"></path>
                  </svg>
                  <input id="newItemInput" type="text" inputmode="text" autocomplete="off" placeholder="Add a new item" class="w-full bg-transparent outline-none text-[15px] placeholder:text-neutral-400 text-neutral-900">
                </div>
              </div>
              <button id="addItemBtn" class="shrink-0 h-11 w-11 rounded-xl bg-emerald-600 text-white flex items-center justify-center hover:bg-emerald-700 active:bg-emerald-800 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-300">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M12 5v14M5 12h14"></path>
                </svg>
              </button>
            </div>
            <p class="mt-2 text-[11px] text-neutral-500 font-sans">Press Enter to add quickly. Tap items to mark as bought.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- App Logic -->
  <script>
    ;(() => {
      const storageKey = 'groceryItems:v1'
      const $ = (sel, parent = document) => parent.querySelector(sel)

      const el = {
        dateLabel: $('#dateLabel'),
        clearBought: $('#clearBought'),
        listToBuy: $('#listToBuy'),
        listBought: $('#listBought'),
        countToBuy: $('#countToBuy'),
        countBought: $('#countBought'),
        statsTotal: $('#statsTotal'),
        statsBought: $('#statsBought'),
        newItemInput: $('#newItemInput'),
        addItemBtn: $('#addItemBtn'),
        sectionBought: $('#sectionBought'),
      }

      const today = new Date()
      const dateFmt = today.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })
      el.dateLabel.textContent = dateFmt

      let items = load() || seed()

      function seed() {
        const defaults = [
          { id: iid(), name: 'Milk', done: false },
          { id: iid(), name: 'Eggs', done: false },
          { id: iid(), name: 'Bread', done: true },
          { id: iid(), name: 'Apples', done: false },
          { id: iid(), name: 'Chicken', done: false },
        ]
        save(defaults)
        return defaults
      }

      function iid() {
        return Math.random().toString(36).slice(2) + Date.now().toString(36)
      }

      function save(list) {
        try { localStorage.setItem(storageKey, JSON.stringify(list)) } catch {}
      }

      function load() {
        try { return JSON.parse(localStorage.getItem(storageKey) || 'null') } catch { return null }
      }

      function render() {
        // Partition
        const toBuy = items.filter(i => !i.done)
        const bought = items.filter(i => i.done)

        // Stats
        el.statsTotal.textContent = items.length
        el.statsBought.textContent = bought.length
        el.countToBuy.textContent = toBuy.length
        el.countBought.textContent = bought.length

        // Toggle bought section visibility
        el.sectionBought.style.display = bought.length ? '' : 'none'

        // Render lists
        el.listToBuy.innerHTML = ''
        el.listBought.innerHTML = ''

        toBuy.forEach(item => el.listToBuy.appendChild(renderItem(item)))
        bought.forEach(item => el.listBought.appendChild(renderItem(item)))
      }

      function renderItem(item) {
        const li = document.createElement('li')
        li.className = 'group rounded-2xl border border-neutral-200 bg-white px-3 py-2.5 flex items-center justify-between shadow-sm hover:shadow-md transition-shadow'

        const left = document.createElement('button')
        left.className = 'flex items-center gap-3 focus:outline-none'
        left.setAttribute('data-action', 'toggle')
        left.setAttribute('data-id', item.id)
        left.setAttribute('aria-pressed', item.done ? 'true' : 'false')

        const check = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
        check.setAttribute('width', '22')
        check.setAttribute('height', '22')
        check.setAttribute('viewBox', '0 0 24 24')
        check.setAttribute('fill', 'none')
        check.setAttribute('stroke', 'currentColor')
        check.setAttribute('stroke-width', '1.5')
        check.classList.add('shrink-0', 'rounded-full', 'transition-colors')

        if (item.done) {
          check.classList.add('text-emerald-600')
          check.innerHTML = '<circle cx="12" cy="12" r="9" stroke="currentColor"></circle><path d="M16 10l-4 4-2-2" stroke="currentColor"></path>'
        } else {
          check.classList.add('text-neutral-400')
          check.innerHTML = '<circle cx="12" cy="12" r="9" stroke="currentColor"></circle>'
        }

        const name = document.createElement('div')
        name.className = 'text-[15px] text-neutral-900'
        name.textContent = item.name

        if (item.done) {
          name.classList.remove('text-neutral-900')
          name.classList.add('text-neutral-500', 'line-through')
        }

        left.appendChild(check)
        left.appendChild(name)

        const right = document.createElement('div')
        right.className = 'flex items-center gap-1.5'

        const del = document.createElement('button')
        del.className = 'p-2 rounded-lg text-neutral-500 hover:text-red-600 hover:bg-red-50 border border-transparent hover:border-red-200 transition-colors focus:outline-none focus:ring-2 focus:ring-red-300'
        del.setAttribute('data-action', 'delete')
        del.setAttribute('data-id', item.id)
        del.setAttribute('aria-label', 'Delete item')

        const trash = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
        trash.setAttribute('width', '18')
        trash.setAttribute('height', '18')
        trash.setAttribute('viewBox', '0 0 24 24')
        trash.setAttribute('fill', 'none')
        trash.setAttribute('stroke', 'currentColor')
        trash.setAttribute('stroke-width', '1.5')
        trash.innerHTML = '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>'
        del.appendChild(trash)

        right.appendChild(del)

        li.appendChild(left)
        li.appendChild(right)

        return li
      }

      function addItem(name) {
        const trimmed = (name || '').trim()
        if (!trimmed) return
        items.unshift({ id: iid(), name: trimmed, done: false })
        save(items)
        render()
      }

      function toggleItem(id) {
        const idx = items.findIndex(i => i.id === id)
        if (idx === -1) return
        items[idx].done = !items[idx].done
        save(items)
        render()
      }

      function deleteItem(id) {
        items = items.filter(i => i.id !== id)
        save(items)
        render()
      }

      // Events
      el.addItemBtn.addEventListener('click', () => {
        addItem(el.newItemInput.value)
        el.newItemInput.value = ''
        el.newItemInput.focus()
      })

      el.newItemInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          addItem(el.newItemInput.value)
          el.newItemInput.value = ''
        }
      })

      // Delegate list interactions
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]')
        if (!btn) return
        const action = btn.getAttribute('data-action')
        const id = btn.getAttribute('data-id')
        if (action === 'toggle') toggleItem(id)
        if (action === 'delete') deleteItem(id)
      })

      el.clearBought.addEventListener('click', () => {
        const hasBought = items.some(i => i.done)
        if (!hasBought) return
        items = items.filter(i => !i.done)
        save(items)
        render()
      })

      // Initial render
      render()
    })()
  </script>
