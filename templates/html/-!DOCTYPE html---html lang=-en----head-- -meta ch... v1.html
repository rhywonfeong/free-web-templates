<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskTune Chat</title>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Vanta -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script></head>

<body class="bg-[#fdfaf7] text-[#1c1c1e] flex min-h-screen flex-col overflow-hidden" style="font-family:'Inter',sans-serif">
  <div id="vanta-bg" class="absolute inset-0 z-0 opacity-80"></div>

  <!-- Wrapper -->
  <div class="relative z-10 flex flex-col w-full max-w-4xl mx-auto h-screen px-4">

    <!-- Header -->
    <header class="flex items-center justify-between py-5">
      <h1 class="text-2xl font-semibold tracking-tight">TaskTune Chat</h1>
      <button class="px-5 py-2 bg-black text-white rounded-full text-sm hover:bg-opacity-90 transition">
        New Chat
      </button>
    </header>

    <!-- Chat Window -->
    <main id="chat-window" class="flex-1 overflow-y-auto space-y-4 pb-6">
      <!-- Example assistant message -->
      <div
        class="p-4 w-fit max-w-[75%]"
        style="background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:1rem;border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 20px rgba(0,0,0,.08);">
        <p class="text-sm">Hey there! Select a task type and start chatting with TaskTune 🚀</p>
      </div>
    </main>

    <!-- Input Area -->
    <div
      class="sticky bottom-4 flex items-center gap-4 p-4"
      style="background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:1rem;border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 20px rgba(0,0,0,.08);">
      <!-- Task Type Selector -->
      <select id="task-type"
        class="px-3 py-2 rounded-md text-sm bg-white border border-gray-300 focus:outline-none">
        <option>Select Task Type</option>
        <option>Chat</option>
        <option>Write</option>
        <option>Code</option>
        <option>Summarize</option>
        <option>Translate</option>
        <option>Extract</option>
        <option>Brainstorm</option>
        <option>Visualize</option>
        <option>Math</option>
        <option>Document Analysis</option>
        <option>Analyze Data</option>
        <option>Chart</option>
        <option>Report</option>
      </select>

      <!-- Input -->
      <input id="user-input" type="text" placeholder="Ask TaskTune anything…"
        class="flex-1 bg-transparent focus:outline-none text-sm">

      <!-- Send -->
      <button id="send-btn"
        class="flex items-center gap-1 px-5 py-2 bg-black text-white rounded-full text-sm hover:bg-opacity-90 transition">
        <span>Send</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 2 11 13"></path>
          <path d="m22 2-7 20-4-9-9-4Z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    // Vanta Fog
    document.addEventListener('DOMContentLoaded', () => {
      VANTA.FOG({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        highlightColor: 0xb5a89c,
        midtoneColor: 0xfdfaf7,
        lowlightColor: 0xcdbeb1,
        baseColor: 0xfdfaf7,
        blurFactor: 0.4,
        speed: 0.5,
        zoom: 0.7
      });
    });

    // Chat Logic
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function addMessage(text, sender = 'user') {
      const msg = document.createElement('div');
      msg.className = `p-4 w-fit max-w-[75%] ${sender === 'user' ? 'self-end bg-black text-white' : ''}`;
      msg.style = "background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:1rem;border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 20px rgba(0,0,0,.08);";
      msg.innerHTML = `<p class="text-sm">${text}</p>`;
      chatWindow.appendChild(msg);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    sendBtn.addEventListener('click', () => {
      const text = userInput.value.trim();
      if (!text) return;

      const task = document.getElementById('task-type').value;
      addMessage(text, 'user');
      userInput.value = '';

      setTimeout(() => {
        addMessage(`TaskTune is processing your ${task !== 'Select Task Type' ? task : 'request'}…`, 'ai');
      }, 600);
    });

    // Enter key support
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });
  </script>
</body>
</html>
