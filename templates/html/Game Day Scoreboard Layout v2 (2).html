<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Nuggets Game Day - Square</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .oswald { font-family: 'Oswald', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.8s ease-out forwards; }
        .animate-scale-in { animation: scaleIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
        .delay-500 { animation-delay: 0.5s; }
        .glass-effect { backdrop-filter: blur(10px); background: rgba(11, 34, 57, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); }
        .text-shadow { text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5); }
        .hover-glow:hover { box-shadow: 0 0 20px rgba(255, 210, 51, 0.3); transition: all 0.3s ease; }
        .square-container { width: 1080px; height: 1080px; }
    </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Oswald&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">
    <div class="square-container relative bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 flex flex-col justify-between p-12">
        <!-- Top Section -->
        <div class="text-center opacity-0 animate-fade-in">
            <div class="w-20 h-20 mx-auto bg-gradient-to-br from-yellow-400 to-orange-500 rounded-xl flex items-center justify-center shadow-xl mb-4">
                <span class="text-slate-900 text-xl font-bold oswald">FN</span>
            </div>
            <h1 class="oswald text-5xl font-bold text-yellow-400 tracking-tight text-shadow">
                GAME DAY
            </h1>
            <div class="w-16 h-1 bg-gradient-to-r from-yellow-400 to-orange-500 mx-auto mt-2 rounded-full"></div>
        </div>

        <!-- Score Section -->
        <div class="flex justify-center gap-6 opacity-0 animate-scale-in delay-200">
            <div class="glass-effect rounded-xl p-4 text-center hover-glow flex-1">
                <div class="oswald text-lg font-semibold text-white mb-1">TEAM 1</div>
                <div class="oswald text-3xl font-bold text-yellow-400">--</div>
            </div>
            <div class="glass-effect rounded-xl p-4 text-center hover-glow flex-1">
                <div class="oswald text-lg font-semibold text-white mb-1">TEAM 2</div>
                <div class="oswald text-3xl font-bold text-yellow-400">--</div>
            </div>
        </div>

        <!-- Player Section -->
        <div class="flex-1 flex flex-col justify-center items-center opacity-0 animate-slide-up delay-300">
            <div class="w-64 h-64 bg-gradient-to-br from-slate-700 to-slate-800 rounded-2xl border-2 border-slate-600 flex items-center justify-center text-slate-400 text-xl oswald font-medium mb-6 shadow-2xl">
                <div>
                    <div class="w-12 h-12 mx-auto mb-2 opacity-50">
                        <i data-lucide="user" class="w-full h-full"></i>
                    </div>
                    PLAYER<br>IMAGE
                </div>
            </div>
            <h2 class="oswald text-4xl font-bold text-yellow-400 tracking-tight text-center text-shadow">
                PLAYER NAME
            </h2>
        </div>

        <!-- Quote Section -->
        <div class="opacity-0 animate-slide-up delay-400">
            <div class="text-center border-t-2 border-yellow-400 pt-6">
                <div class="flex justify-center items-start gap-2 mb-4">
                    <div class="text-yellow-400 text-4xl oswald font-bold">"</div>
                    <div class="oswald text-2xl font-bold text-yellow-400 tracking-tight">
                        FEATURED QUOTE
                    </div>
                </div>
                <p class="text-slate-300 text-lg leading-relaxed max-w-md mx-auto">
                    Add your standout quote or key statistic here.
                </p>
            </div>
        </div>

        <!-- Stats Footer -->
        <div class="grid grid-cols-4 gap-3 opacity-0 animate-fade-in delay-500">
            <div class="glass-effect rounded-lg p-3 text-center">
                <div class="text-xl font-bold text-yellow-400 oswald">--</div>
                <div class="text-xs text-slate-400 oswald">PTS</div>
            </div>
            <div class="glass-effect rounded-lg p-3 text-center">
                <div class="text-xl font-bold text-yellow-400 oswald">--</div>
                <div class="text-xs text-slate-400 oswald">AST</div>
            </div>
            <div class="glass-effect rounded-lg p-3 text-center">
                <div class="text-xl font-bold text-yellow-400 oswald">--</div>
                <div class="text-xs text-slate-400 oswald">REB</div>
            </div>
            <div class="glass-effect rounded-lg p-3 text-center">
                <div class="text-xl font-bold text-yellow-400 oswald">--</div>
                <div class="text-xs text-slate-400 oswald">STL</div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
