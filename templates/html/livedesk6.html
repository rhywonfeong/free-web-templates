<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LDL15 OS</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
<style>
body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; overflow: hidden; }
.font-mono { font-family: 'JetBrains Mono', monospace; }
/* Scrollbars */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
/* Grid */
.app-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem 0.5rem; padding-bottom: 8rem; }
@media (min-width: 640px) { .app-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2rem 1rem; } }
@media (min-width: 768px) { .app-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .app-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
@media (min-width: 1280px) { .app-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
/* Icons */
.ios-icon { width: 60px; height: 60px; border-radius: 14px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 12px rgba(0,0,0,0.5); transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1); }
.ios-icon:active { transform: scale(0.92); }
.app-icon-bg { background: linear-gradient(180deg, #2a2a2a, #111); }
.folder-mini-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px; padding: 7px; width: 100%; height: 100%; }
/* Resizers */
.resizer { position: absolute; z-index: 20; }
.resizer-n { top: -4px; left: 0; right: 0; height: 8px; cursor: n-resize; }
.resizer-e { top: 0; bottom: 0; right: -4px; width: 8px; cursor: e-resize; }
.resizer-s { bottom: -4px; left: 0; right: 0; height: 8px; cursor: s-resize; }
.resizer-w { top: 0; bottom: 0; left: -4px; width: 8px; cursor: w-resize; }
.resizer-nw { top: -4px; left: -4px; width: 12px; height: 12px; cursor: nw-resize; z-index: 30; }
.resizer-ne { top: -4px; right: -4px; width: 12px; height: 12px; cursor: ne-resize; z-index: 30; }
.resizer-sw { bottom: -4px; left: -4px; width: 12px; height: 12px; cursor: sw-resize; z-index: 30; }
.resizer-se { bottom: -4px; right: -4px; width: 12px; height: 12px; cursor: se-resize; z-index: 30; }
[x-cloak] { display: none !important; }
/* Edit Mode Styles */
@keyframes shake {
0%, 100% { transform: rotate(0deg); }
25% { transform: rotate(1.2deg); }
75% { transform: rotate(-1.2deg); }
}
.animate-shake { animation: shake 0.25s infinite ease-in-out; }
.delete-badge { position: absolute; top: -6px; left: -6px; width: 22px; height: 22px; background: rgba(255, 255, 255, 0.8); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 50; box-shadow: 0 2px 5px rgba(0,0,0,0.3); color: #000; cursor: pointer; }
</style></head>
<body class="bg-black text-white h-screen w-full flex flex-col" x-data="livedesk()" @mousemove="handleWindowMove($event)" @mouseup="handleWindowUp($event)" @mouseleave="handleWindowUp($event)">

    <div class="fixed inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-[#1a1a1a] via-black to-black -z-10"></div>
    <div class="fixed inset-0 opacity-20 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] -z-10 mix-blend-overlay"></div>

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 h-12 px-6 flex items-center justify-between z-40 transition-opacity duration-300" :class="holisticViewOpen ? 'opacity-0 pointer-events-none' : 'opacity-100'">
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 text-xs font-semibold tracking-tight text-white/80">
                <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.4)]"></span>
                LDL15 <span x-show="editMode" class="text-red-400 ml-2 animate-pulse font-bold tracking-widest text-[10px]">[EDITING]</span>
            </div>
        </div>
        <div class="flex items-center gap-6">
            <div class="text-right hidden sm:block">
                <div class="text-xs font-semibold tracking-tight text-white" x-text="time"></div>
                <div class="text-[10px] text-white/40 font-medium uppercase tracking-wide" x-text="date"></div>
            </div>
            <button @click="handleProfileClick()" class="w-8 h-8 rounded-full bg-white/10 border border-white/10 overflow-hidden hover:border-white/30 transition-colors">
                <img x-show="user?.photoURL" :src="user?.photoURL" class="w-full h-full object-cover">
                <div x-show="!user?.photoURL" class="w-full h-full flex items-center justify-center text-white/50">
                    <span class="iconify" data-icon="solar:user-circle-bold"></span>
                </div>
            </button>
        </div>
    </header>

    <!-- Snap Preview -->
    <div x-show="snapPreview" class="fixed z-[90] bg-white/10 border border-white/20 backdrop-blur-md rounded-xl pointer-events-none transition-all duration-200" :style="`top: ${snapPreview?.y}px; left: ${snapPreview?.x}px; width: ${snapPreview?.w}px; height: ${snapPreview?.h}px`" x-transition.opacity></div>

    <!-- Windows -->
    <div class="fixed inset-0 z-[100] pointer-events-none overflow-hidden">
        <template x-for="win in windows" :key="win.id">
            <div x-show="!win.minimized" class="absolute bg-[#0f0f0f] border border-white/10 rounded-xl shadow-2xl flex flex-col pointer-events-auto transition-transform" :class="win.snapped ? 'transition-all duration-300' : ''" :style="`top: ${win.y}px; left: ${win.x}px; width: ${win.w}px; height: ${win.h}px; z-index: ${win.zIndex}`" @mousedown="focusWindow(win.id)">
                
                <div class="resizer resizer-n" @mousedown.prevent.stop="startResize($event, win.id, 'n')"></div>
                <div class="resizer resizer-e" @mousedown.prevent.stop="startResize($event, win.id, 'e')"></div>
                <div class="resizer resizer-s" @mousedown.prevent.stop="startResize($event, win.id, 's')"></div>
                <div class="resizer resizer-w" @mousedown.prevent.stop="startResize($event, win.id, 'w')"></div>
                <div class="resizer resizer-nw" @mousedown.prevent.stop="startResize($event, win.id, 'nw')"></div>
                <div class="resizer resizer-ne" @mousedown.prevent.stop="startResize($event, win.id, 'ne')"></div>
                <div class="resizer resizer-sw" @mousedown.prevent.stop="startResize($event, win.id, 'sw')"></div>
                <div class="resizer resizer-se" @mousedown.prevent.stop="startResize($event, win.id, 'se')"></div>

                <div class="h-10 px-4 flex items-center justify-between bg-[#1a1a1a] border-b border-white/5 rounded-t-xl shrink-0 cursor-default select-none" @mousedown="startWindowDrag($event, win.id)" @dblclick="toggleMaximize(win.id)">
                    <div class="flex items-center gap-2 group">
                        <button @click.stop="closeWindow(win.id)" class="w-3 h-3 rounded-full bg-red-500/80 hover:bg-red-500 border border-black/10 transition-colors"></button>
                        <button @click.stop="win.minimized = true" class="w-3 h-3 rounded-full bg-yellow-500/80 hover:bg-yellow-500 border border-black/10 transition-colors"></button>
                        <button @click.stop="toggleMaximize(win.id)" class="w-3 h-3 rounded-full bg-green-500/80 hover:bg-green-500 border border-black/10 transition-colors"></button>
                    </div>
                    <div class="text-xs font-semibold text-gray-400 truncate max-w-[200px]" x-text="win.title"></div>
                    <div class="w-10"></div>
                </div>

                <div class="flex-1 bg-black relative overflow-hidden rounded-b-xl">
                    <div x-show="dragState.isDragging || dragState.isResizing" class="absolute inset-0 z-50 bg-transparent"></div>
                    
                    <template x-if="win.type === 'code'">
                        <div class="w-full h-full relative">
                            <iframe :srcdoc="win.code" class="w-full h-full border-none bg-white"></iframe>
                            <textarea x-show="editMode" x-model="win.code" @input.debounce.500ms="updateAppCode(win.appId, win.code)" class="absolute inset-0 w-full h-full bg-[#111]/95 text-green-400 font-mono text-xs p-4 outline-none resize-none z-10 backdrop-blur-sm border-t border-white/10" spellcheck="false" placeholder="Enter HTML/JS here..."></textarea>
                            <div x-show="editMode" class="absolute top-2 right-2 z-20 text-[10px] text-white/50 bg-black/50 px-2 py-1 rounded">LIVE EDIT</div>
                        </div>
                    </template>

                    <template x-if="win.type !== 'code'">
                        <div class="w-full h-full relative">
                            <iframe :src="win.url" class="w-full h-full border-none"></iframe>
                            <div x-show="editMode" class="absolute inset-0 bg-black/80 flex flex-col items-center justify-center backdrop-blur-sm gap-2">
                                <label class="text-xs text-gray-400 uppercase font-bold">Edit Source URL</label>
                                <input type="text" x-model="win.url" @change="updateAppUrl(win.appId, win.url)" class="bg-transparent border-b border-white/20 text-white text-center w-3/4 outline-none pb-2 font-mono text-sm focus:border-white">
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>

    <!-- Desktop -->
    <main class="absolute inset-0 pt-12 pb-0 overflow-hidden" @touchstart="handleTouchStart" @touchend="handleTouchEnd">
        <div class="h-full w-full relative transition-all duration-500 ease-[cubic-bezier(0.2,0,0,1)]" :class="holisticViewOpen ? 'scale-100 bg-black/80 backdrop-blur-xl z-50' : 'scale-100'">
            
            <div class="h-full w-full" :class="holisticViewOpen ? 'flex flex-wrap items-center justify-center gap-10 overflow-y-auto p-10 pt-20' : 'relative'">
                
                <template x-for="pNum in pageNumbers" :key="pNum">
                    <div class="transition-all duration-500 ease-[cubic-bezier(0.2,0,0,1)]" :class="holisticViewOpen 
                            ? 'relative w-[300px] h-[540px] rounded-[2rem] border border-white/10 bg-[#111] shadow-2xl cursor-pointer hover:-translate-y-4 hover:border-white/30 group' 
                            : (currentPage === pNum ? 'absolute inset-0 overflow-y-auto no-scrollbar' : 'hidden absolute inset-0')" @click="if(holisticViewOpen) { currentPage = pNum; holisticViewOpen = false; }">
                        
                        <div x-show="holisticViewOpen" class="absolute -top-8 left-0 w-full text-center transition-all duration-300 group-hover:-translate-y-1">
                             <input type="text" x-model="pageNames[pNum]" @click.stop="" placeholder="Page Name" class="bg-transparent text-center text-xs font-semibold text-gray-500 uppercase tracking-widest outline-none focus:text-white" :value="getPageName(pNum)">
                        </div>

                        <div :class="holisticViewOpen ? 'w-[360%] h-[360%] origin-top-left scale-[0.277] pointer-events-none p-10 pt-20' : 'max-w-7xl mx-auto min-h-full p-4 md:p-8'">
                            <div class="app-grid sortable-grid" :data-page="pNum">
                                <template x-for="app in getAppsForPage(pNum)" :key="app.id">
                                    <div :data-id="app.id" class="relative flex flex-col items-center gap-2 rounded-xl transition-all cursor-pointer touch-manipulation group select-none app-item" 
                                        :class="editMode ? 'animate-shake' : ''"
                                        @click="handleAppClick($event, app)" @contextmenu.prevent="openContext($event, app)">
                                        
                                        <!-- Edit Mode Delete Badge -->
                                        <div x-show="editMode" @click.stop="deleteApp(app)" class="delete-badge">
                                            <span class="iconify text-xs" data-icon="solar:minus-bold"></span>
                                        </div>

                                        <div class="ios-icon flex flex-col z-10" :class="app.type === 'folder' ? (app.bgColor || 'bg-[#1c1c1e] backdrop-blur-md') : 'app-icon-bg'">
                                            <div class="absolute top-1.5 right-1.5 flex gap-1 z-20">
                                                <div x-show="app.note" class="w-1.5 h-1.5 rounded-full bg-yellow-400 shadow-sm"></div>
                                                <div x-show="app.attachments?.length" class="w-1.5 h-1.5 rounded-full bg-blue-400 shadow-sm"></div>
                                            </div>

                                            <template x-if="app.type === 'folder'">
                                                <div class="folder-mini-grid">
                                                    <template x-for="subApp in (app.items || []).slice(0, 9)" :key="subApp.id">
                                                        <div class="w-full h-full rounded-[3px] overflow-hidden bg-white/10 flex items-center justify-center">
                                                            <template x-if="subApp.icon.includes('data:') || subApp.icon.includes('http')">
                                                                <img :src="subApp.icon" class="w-full h-full object-cover">
                                                            </template>
                                                            <template x-if="!subApp.icon.includes('data:') && !subApp.icon.includes('http')">
                                                                <span class="iconify text-[10px] text-white" :data-icon="subApp.icon"></span>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>

                                            <template x-if="app.type !== 'folder'">
                                                <div class="w-full h-full flex items-center justify-center relative">
                                                    <template x-if="app.icon.includes('data:') || app.icon.includes('http')">
                                                        <img :src="app.icon" class="w-full h-full object-cover pointer-events-none">
                                                    </template>
                                                    <template x-if="!app.icon.includes('data:') && !app.icon.includes('http')">
                                                        <span class="iconify text-[32px] text-gray-200" :data-icon="app.icon"></span>
                                                    </template>
                                                    <div x-show="app.launchMode === 'internal' || app.type === 'code'" class="absolute bottom-1.5 right-1.5 text-white/40">
                                                        <span class="iconify text-[10px]" data-icon="solar:window-frame-bold"></span>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>

                                        <div class="flex flex-col items-center gap-0.5 text-center w-full relative z-20">
                                            <span class="text-[11px] font-medium text-white tracking-tight leading-tight truncate w-20 shadow-black drop-shadow-md outline-none border-b border-transparent transition-colors"
                                                  :class="editMode ? 'cursor-text hover:border-white/50 pointer-events-auto bg-black/20 rounded px-1' : 'pointer-events-none'"
                                                  :contenteditable="editMode"
                                                  x-text="app.name"
                                                  @blur="app.name = $event.target.innerText; saveData()"
                                                  @keydown.enter.prevent="$event.target.blur()"
                                                  @click.stop=""></span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
                
                <button x-show="holisticViewOpen" @click="addPage()" class="w-[300px] h-[540px] rounded-[2rem] border border-dashed border-white/10 bg-transparent flex flex-col items-center justify-center text-white/30 hover:text-white hover:border-white/30 transition-all gap-4">
                    <span class="iconify text-4xl" data-icon="solar:add-circle-bold-duotone"></span>
                    <span class="text-xs font-semibold uppercase tracking-wider">New Page</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Folder Overlay View -->
    <div x-show="folderOpen" class="fixed inset-0 z-[120] flex flex-col items-center justify-center" x-cloak>
        <div class="absolute inset-0 bg-black/60 backdrop-blur-xl" @click="closeFolder()"></div>
        <div class="relative z-10 w-full max-w-[340px]" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-90" x-transition:enter-end="opacity-100 scale-100">
            <div class="mb-6 text-center">
                 <input type="text" x-model="activeFolder && activeFolder.name" :disabled="!editMode" class="bg-transparent text-white text-3xl font-bold text-center outline-none w-full" :class="editMode ? 'border-b border-white/20' : ''">
            </div>
            <div class="bg-[#1c1c1e]/80 backdrop-blur-2xl rounded-[36px] p-6 w-full aspect-square shadow-2xl border border-white/10 ring-1 ring-white/5 overflow-y-auto custom-scrollbar">
                 <div class="grid grid-cols-3 gap-6 auto-rows-min">
                      <template x-for="(item, idx) in (activeFolder ? (activeFolder.items || []) : [])" :key="item.id">
                           <button class="flex flex-col items-center gap-2 group w-full" :class="editMode ? 'animate-shake' : ''" @click="launchApp(item)">
                               <div class="relative w-[60px] h-[60px] rounded-[14px] overflow-hidden flex items-center justify-center bg-[#2c2c2e] border border-white/5 shadow-lg group-active:scale-95 transition-transform">
                                   <!-- Delete Badge in Folder -->
                                   <div x-show="editMode" @click.stop="deleteFromFolder(idx)" class="delete-badge bg-black/80 text-white border border-white/20">
                                       <span class="iconify text-xs" data-icon="solar:minus-bold"></span>
                                   </div>
                                   
                                   <template x-if="item.icon.includes('data:') || item.icon.includes('http')">
                                       <img :src="item.icon" class="w-full h-full object-cover">
                                   </template>
                                   <template x-if="!item.icon.includes('data:') && !item.icon.includes('http')">
                                       <span class="iconify text-3xl text-gray-200" :data-icon="item.icon"></span>
                                   </template>
                               </div>
                               <span class="text-[10px] font-medium text-white text-center truncate w-full" x-text="item.name"></span>
                           </button>
                      </template>
                      
                      <!-- Add Button (Edit Mode Only) -->
                      <button x-show="editMode" @click="selectCreateType('app')" class="flex flex-col items-center gap-2 group w-full">
                           <div class="w-[60px] h-[60px] rounded-[14px] flex items-center justify-center bg-white/5 border border-dashed border-white/30 text-white/50 group-hover:text-white group-hover:border-white/50 transition-all">
                               <span class="iconify text-2xl" data-icon="solar:add-circle-bold"></span>
                           </div>
                           <span class="text-[10px] font-medium text-white/50">Add</span>
                      </button>
                 </div>
            </div>
        </div>
    </div>

    <!-- Dock -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] transition-all duration-500 ease-out" :class="holisticViewOpen ? 'translate-y-40 opacity-0' : 'translate-y-0 opacity-100'">
        <div class="flex items-center gap-1.5 p-2 bg-[#111]/80 backdrop-blur-2xl border border-white/10 rounded-2xl shadow-2xl ring-1 ring-white/5">
            
            <button @click="createMenuOpen = true" class="w-11 h-11 rounded-xl flex items-center justify-center text-white/50 hover:text-white hover:bg-white/10 transition-all active:scale-95 group relative">
                 <span class="iconify text-2xl" data-icon="solar:add-square-bold-duotone"></span>
            </button>

            <button @click="editMode = !editMode" class="w-11 h-11 rounded-xl flex items-center justify-center transition-all active:scale-95 relative" :class="editMode ? 'bg-red-500/20 text-red-400' : 'text-white/50 hover:text-white hover:bg-white/10'">
                <span class="iconify text-xl" data-icon="solar:pen-new-square-bold-duotone"></span>
            </button>

            <div class="w-px h-6 bg-white/10 mx-1"></div>

            <div x-show="windows.length > 0" class="flex items-center gap-1.5">
                <template x-for="win in windows" :key="win.id">
                    <button @click="toggleMinimize(win.id)" class="w-11 h-11 rounded-xl flex items-center justify-center transition-all relative group" :class="win.minimized ? 'opacity-50 hover:bg-white/5' : 'bg-white/10 shadow-inner'">
                        <span class="iconify text-xl" :class="win.minimized ? 'text-gray-400' : 'text-white'" :data-icon="win.icon.includes(':') ? win.icon : 'solar:window-frame-bold-duotone'"></span>
                        <div class="absolute -bottom-1 w-1 h-1 bg-white/50 rounded-full" x-show="!win.minimized"></div>
                        <div class="absolute -top-12 bg-black/90 backdrop-blur-md text-[10px] font-medium text-white px-2 py-1.5 rounded-lg border border-white/10 opacity-0 group-hover:opacity-100 transition-opacity truncate max-w-[120px] pointer-events-none" x-text="win.title"></div>
                    </button>
                </template>
                <div class="w-px h-6 bg-white/10 mx-1"></div>
            </div>

            <div class="flex items-center gap-2 px-2">
                <template x-for="pNum in pageNumbers" :key="pNum">
                    <button @click="currentPage = pNum" class="h-1.5 rounded-full transition-all duration-300" :class="currentPage === pNum ? 'w-6 bg-white shadow-[0_0_10px_rgba(255,255,255,0.5)]' : 'w-1.5 bg-white/20 hover:bg-white/40'"></button>
                </template>
            </div>

            <div class="w-px h-6 bg-white/10 mx-1"></div>

            <button @click="toggleHolistic()" class="w-11 h-11 rounded-xl flex items-center justify-center hover:bg-white/10 transition-all text-white/50 hover:text-white">
                <span class="iconify text-2xl" data-icon="solar:widget-5-bold-duotone"></span>
            </button>
        </div>
    </div>

    <!-- Context Menu -->
    <div x-show="contextOpen" @click.outside="contextOpen = false" class="fixed z-[200] w-56 bg-[#161616]/95 backdrop-blur-xl border border-white/10 rounded-xl shadow-2xl py-1.5 overflow-hidden" :style="`top: ${contextPos.y}px; left: ${contextPos.x}px`" x-transition.opacity.duration.150ms x-cloak>
        <div class="px-3 py-2 border-b border-white/5 mb-1 bg-white/5">
            <div class="text-xs font-semibold text-white truncate" x-text="contextApp?.name"></div>
            <div class="text-[10px] text-gray-500 uppercase tracking-wide mt-0.5" x-text="contextApp?.type"></div>
        </div>
        <button @click="launchApp(contextApp); contextOpen=false" class="w-full px-3 py-2 text-left text-xs font-medium text-white hover:bg-blue-600 flex items-center gap-2.5 group transition-colors">

    <!-- Hidden div for Tailwind scanning -->
    <div class="hidden bg-[#1c1c1e] bg-gray-800 bg-blue-900 bg-purple-900 bg-red-900 bg-emerald-900"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCo0Rq6eABM3Q6le_x9VjskDCCAg1XUl8A",
            authDomain: "livedesklauncher.firebaseapp.com",
            projectId: "livedesklauncher",
            databaseURL: "https://livedesklauncher-default-rtdb.europe-west1.firebasedatabase.app",
            storageBucket: "livedesklauncher.firebasestorage.app",
            messagingSenderId: "719865623018",
            appId: "1:719865623018:web:104315b70c32db5bd4c293",
            measurementId: "G-N1XRVV5SNJ"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        document.addEventListener('alpine:init', () => {
            Alpine.data('livedesk', () => ({
                user: null,
                authModalOpen: false,
                authEmail: '',
                authPassword: '',
                authError: '',
                time: '',
                date: '',
                apps: [],
                pageNames: {},
                currentPage: 0,
                holisticViewOpen: false,
                windows: [],
                activeZIndex: 100,
                snapPreview: null,
                dragState: { isDragging: false, isResizing: false, id: null, type: null, startX: 0, startY: 0, initialRect: {} },
                createMenuOpen: false,
                contextOpen: false,
                contextApp: null,
                contextPos: {x:0, y:0},
                modalOpen: false,
                modalMode: 'add',
                modalTab: 'general',
                modalData: {},
                touchStartY: 0,
                editMode: false,
                folderOpen: false,
                activeFolder: null,

                init() {
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);
                    
                    auth.onAuthStateChanged(u => {
                        this.user = u;
                        if(u) {
                            db.ref(`users/${u.uid}/apps`).on('value', s => this.processApps(s.val() || []));
                            db.ref(`users/${u.uid}/pageNames`).on('value', s => this.pageNames = s.val() || {});
                        } else {
                            const local = localStorage.getItem('ldl_apps');
                            this.processApps(local ? JSON.parse(local) : []);
                        }
                    });
                },

                processApps(data) {
                    if(!data || data.length === 0) {
                        data = [
                            { id: 'sys_1', name: 'Google', url: 'https://www.google.com/webhp?igu=1', icon: 'logos:google-icon', type: 'app', launchMode: 'internal', page: 0, index: 0 },
                            { id: 'sys_2', name: 'App Store', url: 'https://vercel.com', icon: 'solar:shop-bold-duotone', type: 'app', launchMode: 'external', page: 0, index: 1 },
                            // Add a demo folder
                            { id: 'sys_3', name: 'Tools', type: 'folder', page: 0, index: 2, bgColor: 'bg-gray-800', items: [
                                { id: 't_1', name: 'Calculator', icon: 'solar:calculator-minimalistic-bold-duotone', type: 'code', code: '<body style="margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#222;color:white;font-family:sans-serif;"><h1>Calc Demo</h1></body>', launchMode: 'internal' }
                            ]}
                        ];
                    }
                    this.apps = data.map((a,i) => { if(a.index===undefined) a.index=i; return a; })
                        .sort((a,b)=>(a.page||0)-(b.page||0)||a.index-b.index);
                    this.$nextTick(() => this.initSortable());
                },

                updateTime() {
                    const n=new Date();
                    this.time=n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
                    this.date=n.toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short'});
                },

                get pageNumbers() {
                    const max = this.apps.length ? Math.max(...this.apps.map(a=>a.page||0),0) : 0;
                    return Array.from({length:max+1},(_,i)=>i);
                },

                getPageName(i) { return this.pageNames[i] || `Page ${i+1}`; },
                getAppsForPage(p) { return this.apps.filter(a=>(a.page||0)===p).sort((a,b)=>a.index-b.index); },
                
                addPage() {
                    const next = Math.max(...this.pageNumbers) + 1;
                    this.currentPage = next;
                    this.holisticViewOpen = false;
                },

                toggleHolistic() { this.holisticViewOpen = !this.holisticViewOpen; },

                handleTouchStart(e) { this.touchStartY = e.touches[0].clientY; },
                handleTouchEnd(e) {
                    if(this.touchStartY - e.changedTouches[0].clientY > 100) this.holisticViewOpen = true; 
                    if(this.holisticViewOpen && e.changedTouches[0].clientY - this.touchStartY > 100) this.holisticViewOpen = false;
                },

                handleAppClick(e, app) {
                    if(this.editMode) return;
                    if(this.holisticViewOpen) return;
                    if(app.type === 'folder') {
                        this.openFolder(app);
                    } else {
                        this.launchApp(app);
                    }
                },

                openFolder(app) {
                    this.activeFolder = app;
                    if (!this.activeFolder.items) this.activeFolder.items = [];
                    this.folderOpen = true;
                },

                closeFolder() {
                    this.folderOpen = false;
                    setTimeout(() => this.activeFolder = null, 300); // Wait for transition
                    this.saveData(); // Save in case name changed
                },

                deleteFromFolder(index) {
                    if(this.activeFolder && this.activeFolder.items) {
                        this.activeFolder.items.splice(index, 1);
                        this.saveData();
                    }
                },

                launchApp(app) {
                    if(this.editMode) return;
                    if(app.launchMode === 'internal' || app.type === 'code') this.openWindow(app);
                    else window.open(app.url, '_blank');
                    if(this.folderOpen) this.closeFolder();
                },

                openContext(e, app) {
                    e.preventDefault(); e.stopPropagation();
                    let x = e.clientX, y = e.clientY;
                    if(x + 224 > window.innerWidth) x = window.innerWidth - 230;
                    if(y + 200 > window.innerHeight) y = window.innerHeight - 210;
                    this.contextPos = {x, y}; this.contextApp = app; this.contextOpen = true;
                },

                selectCreateType(type) { 
                    this.createMenuOpen = false; 
                    this.openModal('add', { type: type, id: 'item_'+Date.now(), name: '', launchMode: type==='code'?'internal':'external', attachments: [] }); 
                },

                openModal(mode, data) { 
                    this.modalMode = mode; this.modalTab = 'general';
                    this.modalData = data ? JSON.parse(JSON.stringify(data)) : { type:'app', id: 'app_'+Date.now(), attachments: [] }; 
                    if(!this.modalData.attachments) this.modalData.attachments = [];
                    this.modalOpen = true; 
                },

                closeModal() { this.modalOpen = false; },
                addAttachment() { this.modalData.attachments.push({name: 'New Link', url: ''}); },
                
                handleIconUpload(e) {
                    const file = e.target.files[0];
                    if(!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.modalData.icon = e.target.result;
                    };
                    reader.readAsDataURL(file);
                },

                saveModal() {
                    if(this.modalMode === 'add') {
                        if (this.folderOpen && this.activeFolder) {
                             if (!this.activeFolder.items) this.activeFolder.items = [];
                             this.activeFolder.items.push(this.modalData);
                        } else {
                            this.modalData.page = this.currentPage;
                            this.modalData.index = this.apps.filter(a=>(a.page||0)===this.currentPage).length;
                            this.apps.push(this.modalData);
                        }
                    } else {
                        // Handle editing existing item
                        const idx = this.apps.findIndex(a=>a.id===this.modalData.id);
                        if(idx>-1) this.apps[idx] = this.modalData;
                        // Note: deep editing inside folders isn't fully supported in this simple structure yet, 
                        // as context menu on folder items isn't bound to this modal flow directly in this version.
                    }
                    this.saveData(); this.closeModal();
                },

                deleteApp(app) { 
                    if(confirm('Delete ' + app.name + '?')) { 
                        this.apps = this.apps.filter(a=>a.id!==app.id); 
                        this.saveData(); 
                    } 
                },

                updateAppCode(appId, newCode) {
                    const app = this.apps.find(a => a.id === appId);
                    if(app) {
                        app.code = newCode;
                        this.saveData();
                    }
                },

                updateAppUrl(appId, newUrl) {
                     const app = this.apps.find(a => a.id === appId);
                     if(app) {
                         app.url = newUrl;
                         this.saveData();
                     }
                },

                saveData() {
                      if(this.user) {
                        db.ref(`users/${this.user.uid}/apps`).set(this.apps);
                        db.ref(`users/${this.user.uid}/pageNames`).set(this.pageNames);
                      } else {
                        localStorage.setItem('ldl_apps', JSON.stringify(this.apps));
                      }
                      this.$nextTick(() => this.initSortable());
                },

                // Windows Logic
                openWindow(app) {
                    const existing = this.windows.find(w => w.appId === app.id);
                    if (existing) { existing.minimized = false; this.focusWindow(existing.id); return; }
                    
                    const w = window.innerWidth < 768 ? window.innerWidth*0.9 : 900;
                    const h = window.innerHeight < 600 ? window.innerHeight*0.8 : 600;
                    this.activeZIndex++;
                    
                    this.windows.push({
                        id: 'win_' + Date.now(),
                        appId: app.id,
                        title: app.name,
                        url: app.url,
                        icon: app.icon,
                        type: app.type,
                        code: app.code,
                        x: (window.innerWidth-w)/2 + (this.windows.length*20),
                        y: (window.innerHeight-h)/2 + (this.windows.length*20),
                        w: w, h: h,
                        zIndex: this.activeZIndex,
                        minimized: false, maximized: false, snapped: false
                    });
                },

                focusWindow(id) { const w=this.windows.find(x=>x.id===id); if(w) w.zIndex = ++this.activeZIndex; },
                closeWindow(id) { this.windows = this.windows.filter(w=>w.id!==id); },
                
                toggleMinimize(id) { 
                    const w=this.windows.find(x=>x.id===id); 
                    if(w) { 
                        if(w.minimized) { w.minimized=false; this.focusWindow(id); } 
                        else { 
                            if(w.zIndex===this.activeZIndex) w.minimized=true; 
                            else this.focusWindow(id); 
                        } 
                    } 
                },

                toggleMaximize(id) {
                    const w=this.windows.find(x=>x.id===id); if(!w) return;
                    if(w.maximized) {
                        Object.assign(w, w.preMax); w.maximized=false; w.snapped=false;
                    } else {
                        w.preMax={x:w.x,y:w.y,w:w.w,h:w.h};
                        w.x=0; w.y=48; w.w=window.innerWidth; w.h=window.innerHeight-48; // Adjust for header
                        w.maximized=true; w.snapped=true;
                    }
                    this.focusWindow(id);
                },

                startWindowDrag(e, id) {
                    if(e.button!==0)return;
                    const w=this.windows.find(x=>x.id===id);
                    if(!w||w.maximized)return;
                    this.focusWindow(id);
                    this.dragState={isDragging:true, id, startX:e.clientX, startY:e.clientY, initialRect:{x:w.x, y:w.y}};
                },

                startResize(e, id, type) {
                    if(e.button!==0)return;
                    e.stopPropagation();
                    const w=this.windows.find(x=>x.id===id);
                    if(!w||w.maximized)return;
                    this.focusWindow(id);
                    this.dragState={isResizing:true, id, type, startX:e.clientX, startY:e.clientY, initialRect:{x:w.x, y:w.y, w:w.w, h:w.h}};
                },

                handleWindowMove(e) {
                    if(this.dragState.isDragging) {
                        const w=this.windows.find(x=>x.id===this.dragState.id);
                        if(w) {
                            w.x = this.dragState.initialRect.x + (e.clientX - this.dragState.startX);
                            w.y = this.dragState.initialRect.y + (e.clientY - this.dragState.startY);
                            
                            // Snap Preview Logic
                            this.snapPreview = null;
                            const m=10, h=48;
                            if(e.clientY < h+m) this.snapPreview={x:0, y:h, w:window.innerWidth, h:window.innerHeight-h}; // Maximize
                            else if(e.clientX < m) this.snapPreview={x:0, y:h, w:window.innerWidth/2, h:window.innerHeight-h}; // Left
                            else if(e.clientX > window.innerWidth-m) this.snapPreview={x:window.innerWidth/2, y:h, w:window.innerWidth/2, h:window.innerHeight-h}; // Right
                        }
                    } else if(this.dragState.isResizing) {
                        const w=this.windows.find(x=>x.id===this.dragState.id);
                        if(w) {
                            const dx=e.clientX-this.dragState.startX, dy=e.clientY-this.dragState.startY;
                            const r=this.dragState.initialRect, t=this.dragState.type;
                            if(t.includes('e')) w.w = Math.max(300, r.w+dx);
                            if(t.includes('s')) w.h = Math.max(200, r.h+dy);
                            if(t.includes('w')) { w.w = Math.max(300, r.w-dx); w.x = r.x + (r.w - w.w); }
                            if(t.includes('n')) { w.h = Math.max(200, r.h-dy); w.y = r.y + (r.h - w.h); }
                        }
                    }
                },

                handleWindowUp() {
                    if(this.dragState.isDragging && this.snapPreview) {
                        const w=this.windows.find(x=>x.id===this.dragState.id);
                        if(w) {
                            w.preMax={x:w.x,y:w.y,w:w.w,h:w.h};
                            w.x=this.snapPreview.x; w.y=this.snapPreview.y; w.w=this.snapPreview.w; w.h=this.snapPreview.h;
                            w.snapped=true;
                            if(w.w===window.innerWidth) w.maximized=true;
                        }
                    }
                    this.dragState={isDragging:false,isResizing:false};
                    this.snapPreview=null;
                },

                handleProfileClick() {
                    if(this.user) {
                        if(confirm('Log out?')) auth.signOut();
                    } else {
                        this.authModalOpen=true;
                    }
                },

                signInEmail() {
                    this.authError = '';
                    if(!this.authEmail || !this.authPassword) { this.authError = 'Please fill in all fields'; return; }
                    auth.signInWithEmailAndPassword(this.authEmail, this.authPassword)
                        .then(() => { this.authModalOpen = false; this.authEmail=''; this.authPassword=''; })
                        .catch(e => this.authError = e.message.replace('Firebase:', '').trim());
                },

                signUpEmail() {
                    this.authError = '';
                    if(!this.authEmail || !this.authPassword) { this.authError = 'Please fill in all fields'; return; }
                    auth.createUserWithEmailAndPassword(this.authEmail, this.authPassword)
                        .then(() => { this.authModalOpen = false; this.authEmail=''; this.authPassword=''; })
                        .catch(e => this.authError = e.message.replace('Firebase:', '').trim());
                },

                initSortable() {
                    document.querySelectorAll('.sortable-grid').forEach(el => {
                        if (el._sortable) el._sortable.destroy();
                        el._sortable = new Sortable(el, {
                            group: 'apps',
                            animation: 200,
                            delay: 200,
                            delayOnTouchOnly: true,
                            draggable: '.app-item',
                            ghostClass: 'opacity-50',
                            onEnd: (evt) => {
                                const id = evt.item.getAttribute('data-id');
                                const toPage = parseInt(evt.to.getAttribute('data-page'));
                                
                                const app = this.apps.find(a=>a.id===id);
                                if(app) app.page = toPage;

                                // Re-index siblings
                                const kids = Array.from(evt.to.children);
                                kids.forEach((k, i) => {
                                    const a = this.apps.find(x=>x.id===k.getAttribute('data-id'));
                                    if(a) a.index = i;
                                });
                                this.saveData();
                            }
                        });
                    });
                }
            }));
        });
    </script>
</body>
</html>
