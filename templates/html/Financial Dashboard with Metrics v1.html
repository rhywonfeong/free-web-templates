<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClariFi Dashboard</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#FAFBFD] text-[#1A1F36] selection:bg-[#2B5CE6]/20" style="font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif">

  <!-- Header -->
  <header class="flex items-center justify-between px-4 pt-6 pb-4 animate__animated animate__fadeInDown" style="animation-delay:.1s">
    <h1 class="text-[32px] font-semibold tracking-tight">ClariFi</h1>
    <button aria-label="Profile" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/60 backdrop-blur-md border border-white/30 shadow cursor-pointer hover:ring-2 hover:ring-[#2B5CE6]/40 transition">
      <i data-lucide="user" class="text-[#2B5CE6]"></i>
    </button>
  </header>

  <!-- Key Metrics -->
  <section class="px-4 space-y-4 animate__animated animate__fadeInUp" style="animation-delay:.15s">
    <div class="flex flex-col sm:flex-row sm:space-x-4 space-y-4 sm:space-y-0">
      <!-- Total Balance -->
      <div class="flex-1 bg-white/60 backdrop-blur-md border border-white/30 shadow rounded-2xl p-6">
        <p class="text-sm text-[#718096] mb-1">Total Balance</p>
        <p class="text-[24px] font-semibold tracking-tight">$8,450.23</p>
      </div>
      <!-- Credit Score -->
      <div class="flex-1 bg-white/60 backdrop-blur-md border border-white/30 shadow rounded-2xl p-6">
        <p class="text-sm text-[#718096] mb-1">Credit Score</p>
        <p class="text-[24px] font-semibold tracking-tight">743</p>
      </div>
    </div>
  </section>

  <!-- Cards -->
  <main class="px-4 mt-6 pb-24 space-y-6">
    <!-- Spending Breakdown -->
    <div class="bg-white/60 backdrop-blur-md border border-white/30 shadow rounded-2xl p-6 animate__animated animate__fadeInUp" style="animation-delay:.2s">
      <h2 class="text-[18px] font-semibold tracking-tight mb-4">Spending Breakdown</h2>
      <div class="relative w-full h-48">
        <canvas id="spendingChart" class="w-full h-full"></canvas>
      </div>
    </div>

    <!-- Credit Utilization -->
    <div class="bg-white/60 backdrop-blur-md border border-white/30 shadow rounded-2xl p-6 animate__animated animate__fadeInUp" style="animation-delay:.25s">
      <h3 class="text-[18px] font-semibold tracking-tight mb-4">Credit Utilization</h3>
      <div class="flex items-center justify-between mb-2">
        <span class="text-[16px] font-medium">28%</span>
        <span class="text-[14px] text-[#00A76F]">Good</span>
      </div>
      <div class="w-full bg-gray-200/70 h-3 rounded-full overflow-hidden">
        <div class="h-full bg-[#2B5CE6] w-1/3"></div>
      </div>
    </div>

    <!-- Budgeting Progress -->
    <div class="bg-white/60 backdrop-blur-md border border-white/30 shadow rounded-2xl p-6 animate__animated animate__fadeInUp" style="animation-delay:.3s">
      <h3 class="text-[18px] font-semibold tracking-tight mb-4">Budgeting Progress</h3>
      <div class="flex items-center justify-between mb-2">
        <span class="text-[16px] font-medium">$1,200 / $2,000</span>
        <span class="text-[14px] text-[#E53E3E]">60% used</span>
      </div>
      <div class="w-full bg-gray-200/70 h-3 rounded-full overflow-hidden">
        <div class="h-full bg-[#6B5DD3] w-3/5"></div>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 h-16 bg-white/80 backdrop-blur-md border-t border-gray-200 flex justify-around items-center animate__animated animate__fadeInUp" style="animation-delay:.35s">
    <button class="flex flex-col items-center text-[#2B5CE6]">
      <i data-lucide="home" class="w-6 h-6"></i>
      <span class="text-[12px] mt-1">Home</span>
    </button>
    <button class="flex flex-col items-center text-[#718096] hover:text-[#2B5CE6] transition">
      <i data-lucide="bar-chart-3" class="w-6 h-6"></i>
      <span class="text-[12px] mt-1">Insights</span>
    </button>
    <button class="flex flex-col items-center text-[#718096] hover:text-[#2B5CE6] transition">
      <i data-lucide="file-text" class="w-6 h-6"></i>
      <span class="text-[12px] mt-1">Statements</span>
    </button>
    <button class="flex flex-col items-center text-[#718096] hover:text-[#2B5CE6] transition">
      <i data-lucide="user" class="w-6 h-6"></i>
      <span class="text-[12px] mt-1">Profile</span>
    </button>
  </nav>

  <!-- Scripts -->
  <script>
    // Lucide Icons
    lucide.createIcons();

    // Spending Breakdown Chart
    const ctx = document.getElementById('spendingChart').getContext('2d');
    new Chart(ctx, {
      type: 'pie',
      data: {
        labels: ['Rent', 'Groceries', 'Transport', 'Dining', 'Others'],
        datasets: [{
          data: [1200, 450, 150, 320, 180],
          backgroundColor: ['#2B5CE6','#00C896','#6B5DD3','#F6AD55','#718096'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        plugins: {legend: {display:false}},
        animation: {duration:800, easing:'easeInOutCubic'}
      }
    });
  </script>
</body>
</html>
