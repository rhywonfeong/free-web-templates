  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Weather Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }
    .raindrop {
      position: absolute;
      width: 1px;
      background: rgba(255, 255, 255, 0.3);
      top: -100px;
      animation: rain linear infinite;
    }
    @keyframes rain {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 1; }
      95% { opacity: 1; }
      100% { transform: translateY(calc(100vh + 100px)); opacity: 0; }
    }
    .glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-pulse-slow { animation: pulse 3s ease-in-out infinite; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-spin-slow { animation: spin 8s linear infinite; }
  </style>
</head>
<body>
  <div id="rain-container" class="fixed top-0 left-0 w-full h-full"></div>
  
  <div class="flex items-center justify-center min-h-screen p-4 relative z-10">
    <div class="max-w-sm w-full glass rounded-xl overflow-hidden shadow-2xl">
      <!-- Header -->
      <div class="px-6 pt-6 pb-4 border-b border-white/10">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <div class="w-2 h-2 rounded-full bg-blue-400 animate-pulse-slow"></div>
            <h2 class="text-gray-100 font-medium text-sm">San Francisco</h2>
          </div>
          <span class="text-xs text-gray-300">Updated just now</span>
        </div>
      </div>
      
      <!-- Weather Info -->
      <div class="px-6 py-8">
        <div class="flex items-center justify-between">
          <div>
            <div class="flex items-baseline">
              <span class="text-4xl font-light text-white">58°</span>
              <span class="ml-1 text-gray-300 text-sm">F</span>
            </div>
            <p class="text-gray-300 text-sm mt-1">Rainy</p>
          </div>
          
          <!-- Weather Icon -->
          <div class="text-blue-300 animate-float">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-14 h-14">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />
            </svg>
          </div>
        </div>
      </div>
      
      <!-- Stats -->
      <div class="px-6 py-4 bg-white/5 grid grid-cols-3 gap-2 text-center">
        <div class="px-2 py-3">
          <p class="text-xs text-gray-300 uppercase tracking-wide">Humidity</p>
          <p class="text-gray-100 font-medium mt-1">89%</p>
        </div>
        <div class="px-2 py-3">
          <p class="text-xs text-gray-300 uppercase tracking-wide">Wind</p>
          <p class="text-gray-100 font-medium mt-1">12 mph</p>
        </div>
        <div class="px-2 py-3">
          <p class="text-xs text-gray-300 uppercase tracking-wide">Feels like</p>
          <p class="text-gray-100 font-medium mt-1">54°</p>
        </div>
      </div>
      
      <!-- Forecast -->
      <div class="px-6 py-4 border-t border-white/10">
        <div class="grid grid-cols-5 gap-2">
          <div class="text-center">
            <p class="text-xs text-gray-300">Mon</p>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-6 h-6 mx-auto my-1 text-blue-300 animate-float" style="animation-delay: 0.1s">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />
            </svg>
            <p class="text-xs font-medium text-gray-100">56°</p>
          </div>
          <div class="text-center">
            <p class="text-xs text-gray-300">Tue</p>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-6 h-6 mx-auto my-1 text-blue-300 animate-float" style="animation-delay: 0.3s">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />
            </svg>
            <p class="text-xs font-medium text-gray-100">58°</p>
          </div>
          <div class="text-center">
            <p class="text-xs text-gray-300">Wed</p>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-6 h-6 mx-auto my-1 text-gray-300 animate-spin-slow">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
            </svg>
            <p class="text-xs font-medium text-gray-100">65°</p>
          </div>
          <div class="text-center">
            <p class="text-xs text-gray-300">Thu</p>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-6 h-6 mx-auto my-1 text-gray-300 animate-spin-slow" style="animation-delay: 0.2s">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
            </svg>
            <p class="text-xs font-medium text-gray-100">68°</p>
          </div>
          <div class="text-center">
            <p class="text-xs text-gray-300">Fri</p>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-6 h-6 mx-auto my-1 text-gray-300 animate-float" style="animation-delay: 0.5s">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />
            </svg>
            <p class="text-xs font-medium text-gray-100">62°</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const rainContainer = document.getElementById('rain-container');
    const rainCount = 100;
    
    for (let i = 0; i < rainCount; i++) {
      const raindrop = document.createElement('div');
      raindrop.classList.add('raindrop');
      
      raindrop.style.left = `${Math.random() * 100}%`;
      raindrop.style.opacity = Math.random() * 0.4 + 0.1;
      
      const duration = Math.random() * 1 + 0.5;
      raindrop.style.animationDuration = `${duration}s`;
      raindrop.style.animationDelay = `${Math.random() * 2}s`;
      raindrop.style.height = `${Math.random() * 20 + 10}px`;
      
      rainContainer.appendChild(raindrop);
    }
  </script>
</body>
</html>
