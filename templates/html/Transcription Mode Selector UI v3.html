<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8" />
<title>Moteur de Transcription</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.tailwindcss.com"></script></head>

<body class="bg-gray-900 text-gray-100 antialiased font-sans flex items-center justify-center min-h-screen p-6">
  <main class="w-full max-w-xl" aria-labelledby="title">
    <!-- Titre -->
    <h1 id="title"
        class="text-3xl md:text-4xl font-semibold tracking-tight mb-8 opacity-0 translate-y-4 transition duration-700 delay-100">
      Moteur de Transcription
    </h1>

    <!-- Slider -->
    <div id="sliderContainer"
         class="bg-gray-800/60 border border-gray-700 rounded-xl p-6 shadow-lg backdrop-blur-md opacity-0 translate-y-4 transition duration-700 delay-200">
      <div class="relative mb-10">
        <div class="h-1 bg-gray-700 rounded-full"></div>
        <div id="sliderThumb"
             class="absolute -top-2.5 w-6 h-6 bg-indigo-500 rounded-full shadow-lg transform -translate-x-1/2 transition-all duration-300"
             style="left:33.3%"></div>

        <!-- Steps -->
        <div class="flex justify-between mt-4 select-none" role="tablist">
          <button class="step relative group text-xs md:text-sm font-medium focus:outline-none pt-6"
                  data-step="0" role="tab" aria-selected="false">
            <span class="dot absolute left-1/2 -translate-x-1/2 -top-6 w-3 h-3 rounded-full border-2 border-gray-400 bg-gray-800 group-hover:bg-indigo-400 transition"></span>
            Basique
          </button>
          <button class="step relative group text-xs md:text-sm font-medium focus:outline-none pt-6"
                  data-step="1" role="tab" aria-selected="true">
            <span class="dot absolute left-1/2 -translate-x-1/2 -top-6 w-3 h-3 rounded-full border-2 border-gray-400 bg-gray-800 group-hover:bg-indigo-400 transition"></span>
            Précis
          </button>
          <button class="step relative group text-xs md:text-sm font-medium focus:outline-none pt-6"
                  data-step="2" role="tab" aria-selected="false">
            <span class="dot absolute left-1/2 -translate-x-1/2 -top-6 w-3 h-3 rounded-full border-2 border-amber-500 bg-gray-800 group-hover:bg-amber-400 transition"></span>
            <span class="flex items-center gap-1">Temps&nbsp;Réel
              <span class="text-[10px] border border-amber-400 px-1.5 py-0.5 rounded-full">PRO</span>
            </span>
          </button>
          <button class="step relative group text-xs md:text-sm font-medium focus:outline-none pt-6"
                  data-step="3" role="tab" aria-selected="false">
            <span class="dot absolute left-1/2 -translate-x-1/2 -top-6 w-3 h-3 rounded-full border-2 border-amber-500 bg-gray-800 group-hover:bg-amber-400 transition"></span>
            <span class="flex items-center gap-1">Cloud
              <span class="text-[10px] border border-amber-400 px-1.5 py-0.5 rounded-full">PRO</span>
            </span>
          </button>
        </div>
      </div>
    </div>

    <!-- Feedback -->
    <section id="feedback"
             class="space-y-3 bg-gray-800/50 border border-gray-700 rounded-xl p-6 mt-6 opacity-0 translate-y-4 transition duration-700 delay-300"
             aria-live="polite">
      <h2 id="feedbackTitle" class="text-xl font-semibold tracking-tight flex items-center gap-2"></h2>
      <p id="privacy" class="flex items-center gap-2"></p>
      <p id="ideal"   class="flex items-center gap-2"></p>
      <p id="speaker" class="flex items-center gap-2"></p>
      <p id="battery" class="flex items-center gap-2"></p>
      <p id="cost"    class="flex items-center gap-2"></p>
      <button id="upgradeBtn"
              class="hidden mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-md bg-amber-500/10 text-amber-400 border border-amber-500 hover:bg-amber-500/20 transition">
        <i data-lucide="rocket" class="w-4 h-4"></i> Mettre à niveau vers&nbsp;Pro
      </button>
    </section>
  </main>

  <script>
    /* -------------------------  Data & helpers ------------------------- */
    const steps = [
      {
        label: 'Basique',
        privacy: '🔐 100 % Local',
        ideal:   'Réunions possibles ≤ 30 min. 45 min ok mais traitement long.',
        speaker: '🗣️ Diarisation basique (séparation des voix).',
        battery: 'Impact batterie : Faible',
        cost:    'Coût : Inclus',
        pro:     false
      },
      {
        label: 'Précis',
        privacy: '🔐 100 % Local',
        ideal:   'Réunions ≤ 45 min conseillées ; > 1 h très long selon la machine.',
        speaker: '🗣️ Diarisation améliorée (voix plus nettes).',
        battery: 'Impact batterie : Moyen',
        cost:    'Coût : Inclus',
        pro:     false
      },
      {
        label: 'Temps Réel',
        privacy: '🔐 100 % Local',
        ideal:   'Parfait pour réunion live de toute durée (latence < 1 s).',
        speaker: '🗣️ Diarisation avancée et identification en direct.',
        battery: 'Impact batterie : Faible (optimisé)',
        cost:    'Coût : Abonnement Pro requis',
        pro:     true
      },
      {
        label: 'Cloud',
        privacy: '☁️ Chiffrement TLS',
        ideal:   'Excellente précision pour longues sessions multi-langues.',
        speaker: '🗣️ Diarisation + attribution des noms des participants.',
        battery: 'Impact batterie : N/A',
        cost:    'Coût : Abonnement Pro requis',
        pro:     true
      }
    ];

    const positions = ['0%', '33.3%', '66.6%', '100%'];

    /* -------------------------  DOM elements -------------------------- */
    const sliderThumb = document.getElementById('sliderThumb'); // <-- fix
    const stepButtons = document.querySelectorAll('.step');
    const feedbackBox = {
      title:   document.getElementById('feedbackTitle'),
      privacy: document.getElementById('privacy'),
      ideal:   document.getElementById('ideal'),
      speaker: document.getElementById('speaker'),
      battery: document.getElementById('battery'),
      cost:    document.getElementById('cost')
    };
    const upgradeBtn = document.getElementById('upgradeBtn');

    /* -----------------------  Interaction logic ----------------------- */
    function setActive(step) {
      sliderThumb.style.left = positions[step];

      // dots
      document.querySelectorAll('.dot').forEach((dot, idx) => {
        dot.classList.toggle('bg-indigo-500', idx === step && step < 2);
        dot.classList.toggle('bg-amber-500', idx === step && step >= 2);
        dot.classList.toggle('border-indigo-500', idx === step && step < 2);
        dot.classList.toggle('border-amber-500', idx === step && step >= 2);
      });

      // aria-selected
      stepButtons.forEach((btn, idx) => btn.setAttribute('aria-selected', idx === step));

      const d = steps[step];
      feedbackBox.title.innerHTML = `<i data-lucide="sliders" class="w-5 h-5 text-indigo-400"></i>${d.label}`;
      feedbackBox.privacy.textContent = d.privacy;
      feedbackBox.ideal.textContent   = d.ideal;
      feedbackBox.speaker.textContent = d.speaker;
      feedbackBox.battery.textContent = d.battery;
      feedbackBox.cost.textContent    = d.cost;

      upgradeBtn.classList.toggle('hidden', !d.pro);
      upgradeBtn.setAttribute('aria-hidden', d.pro ? 'false' : 'true');

      lucide.createIcons();
    }

    /* ----------------------------  Init ------------------------------- */
    window.addEventListener('DOMContentLoaded', () => {
      // fade-in sequence
      document.querySelectorAll('h1, #sliderContainer, #feedback')
              .forEach((el, i) => {
                el.classList.remove('opacity-0', 'translate-y-4');
                el.style.transitionDelay = `${i * 150}ms`;
              });

      // default step
      setActive(1);
    });

    /* ------------------------  Event binding -------------------------- */
    stepButtons.forEach(btn =>
      btn.addEventListener('click', () => setActive(+btn.dataset.step))
    );

    // keyboard navigation
    document.addEventListener('keydown', e => {
      const keys = ['ArrowLeft', 'ArrowRight'];
      if (!keys.includes(e.key)) return;
      const current = +[...stepButtons].find(b => b.getAttribute('aria-selected') === 'true').dataset.step;
      const next = e.key === 'ArrowRight' ? (current + 1) % steps.length
                                          : (current - 1 + steps.length) % steps.length;
      setActive(next);
    });

    // icons first render
    lucide.createIcons();
  </script>
</body>
</html>
