  <meta charset="UTF-8">
  <title>Login • Interactive Cubes (Monochrome)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      background: #171717;
      font-family: 'Inter', sans-serif;
    }
    .jakarta {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif !important;
      font-weight: 300 !important;
      letter-spacing: -0.03em !important;
    }
    .tight-tracking { letter-spacing: -0.03em; }
    #cubes-canvas { display: block; outline: none; width: 100%; height: 100%; background: transparent; }

<body class="bg-neutral-900 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-5xl mx-auto shadow-xl rounded-2xl bg-neutral-900 flex overflow-hidden">
    <!-- Left Side: Login -->
    <div class="w-1/2 flex flex-col justify-center px-10 py-16">
      <h1 class="jakarta tight-tracking text-white text-[64px] leading-tight mb-6 font-light">
        Welcome<br>Back
      </h1>
      <p class="text-neutral-400 text-[18px] mb-10 font-normal" style="font-family:'Inter',sans-serif;">
        Login to your account to continue
      </p>
      <form class="flex flex-col gap-6">
        <div>
          <label class="block text-neutral-300 text-[15px] mb-2 font-medium" for="email">Email</label>
          <input class="w-full px-4 py-3 rounded-lg bg-neutral-800 border border-neutral-700 text-neutral-100 placeholder-neutral-500 text-[16px] focus:outline-none focus:ring-2 focus:ring-blue-500 transition" type="email" id="email" placeholder="you@email.com" autocomplete="username" />
        </div>
        <div>
          <label class="block text-neutral-300 text-[15px] mb-2 font-medium" for="password">Password</label>
          <input class="w-full px-4 py-3 rounded-lg bg-neutral-800 border border-neutral-700 text-neutral-100 placeholder-neutral-500 text-[16px] focus:outline-none focus:ring-2 focus:ring-blue-500 transition" type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center text-neutral-400 text-[14px] font-normal">
            <input type="checkbox" class="accent-blue-600 mr-2" />
            Remember me
          </label>
          <a href="#" class="text-blue-500 text-[14px] hover:underline">Forgot password?</a>
        </div>
        <button type="submit" class="mt-4 w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-700 text-white text-[16px] font-semibold transition">
          Sign In
        </button>
      </form>
      <div class="mt-8 text-neutral-400 text-[15px]" style="font-family:'Inter',sans-serif;">
        Don't have an account?
        <a href="#" class="text-blue-500 hover:underline">Sign up</a>
      </div>
    </div>
    <!-- Right Side: 3D Cubes -->
    <div class="w-1/2 bg-neutral-800 relative flex items-center justify-center">
      <canvas id="cubes-canvas" class="w-full h-[540px] md:h-[640px] rounded-xl"></canvas>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.154.0/three.min.js"></script>
  <script>
    // Setup
    const canvas = document.getElementById('cubes-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
    renderer.setPixelRatio(window.devicePixelRatio || 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x171717, 15, 30);

    const camera = new THREE.PerspectiveCamera(75, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
    camera.position.z = 15;

    // Particle background
    const particleCount = 1000;
    const particles = new THREE.BufferGeometry();
    const posArr = new Float32Array(particleCount * 3);
    const velocities = [];
    for(let i = 0; i < particleCount; i++) {
      posArr[i*3] = (Math.random()-0.5)*30;
      posArr[i*3+1] = (Math.random()-0.5)*30;
      posArr[i*3+2] = (Math.random()-0.5)*30;
      velocities.push({
        x: (Math.random() - 0.5) * 0.02,
        y: (Math.random() - 0.5) * 0.02,
        z: (Math.random() - 0.5) * 0.02
      });
    }
    particles.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    const particleMaterial = new THREE.PointsMaterial({ color: 0x88ccff, size:0.06, transparent:true, opacity:0.4 });
    const particleSystem = new THREE.Points(particles, particleMaterial);
    scene.add(particleSystem);

    // Grid of Cubes - monochrome
    const cubes = [];
    const gridSize = 5, spacing = 2;
    for(let x=0;x<gridSize;x++) for(let y=0;y<gridSize;y++) for(let z=0;z<gridSize;z++) {
      const geo = new THREE.BoxGeometry(1,1,1);
      // Calculate lightness for subtle difference
      const l = 0.2 + 0.6 * ((x + y + z) / (gridSize*3-3)); // between 0.2 and 0.8
      const gray = new THREE.Color().setHSL(0, 0, l);
      const mat = new THREE.MeshPhongMaterial({
        color: gray,
        shininess: 90,
        transparent: true,
        opacity: 0.82
      });
      const cube = new THREE.Mesh(geo, mat);
      cube.position.x = (x-gridSize/2)*spacing;
      cube.position.y = (y-gridSize/2)*spacing;
      cube.position.z = (z-gridSize/2)*spacing;
      cube.userData = {
        initialScale: 1,
        targetScale: 1,
        initialColor: mat.color.clone(),
        isSelected: false,
        initialX: cube.position.x,
        initialY: cube.position.y,
        initialZ: cube.position.z,
        rotationSpeed: 0.012,
        pulsePhase: Math.random()*Math.PI*2
      };
      scene.add(cube);
      cubes.push(cube);
    }

    // Lighting
    const light1 = new THREE.DirectionalLight(0xffffff, 0.95);
    light1.position.set(1,1,1); scene.add(light1);
    const light2 = new THREE.DirectionalLight(0xffffff, 0.35);
    light2.position.set(-1,-1,-1); scene.add(light2);
    scene.add(new THREE.AmbientLight(0x404040, 0.9));

    // Raycaster
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredCube = null, isPaused = false;

    // Responsive resize for canvas
    function resizeCanvas() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener('resize', resizeCanvas);

    // Mouse event handlers
    function getPointer(event) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((event.clientX-rect.left) / rect.width) * 2 - 1,
        y: -((event.clientY-rect.top) / rect.height) * 2 + 1
      };
    }
    // No instruction bar, but keep the 3D effect
    canvas.addEventListener('mousemove', (event) => {
      const p = getPointer(event);
      mouse.x = p.x; mouse.y = p.y;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(cubes);

      if (hoveredCube && (!intersects.length || intersects[0].object !== hoveredCube)) {
        if (!hoveredCube.userData.isSelected) {
          hoveredCube.material.opacity = 0.82;
          hoveredCube.material.emissive.setHex(0x000000);
        }
        hoveredCube = null;
      }
      if (intersects.length) {
        const cube = intersects[0].object;
        if (cube !== hoveredCube) {
          hoveredCube = cube;
          if (!cube.userData.isSelected) {
            cube.material.opacity = 1;
            cube.material.emissive.setHex(0x232323);
          }
        }
      }
    });
    canvas.addEventListener('click', (event) => {
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(cubes);
      if (intersects.length > 0) {
        const cube = intersects[0].object;
        cube.userData.isSelected = !cube.userData.isSelected;
        if (cube.userData.isSelected) {
          cube.userData.targetScale = 1.47;
          cube.userData.rotationSpeed = 0.07;
          cube.material.color.setHSL(0, 0, 0.95);
          cube.material.opacity = 1;
        } else {
          cube.userData.targetScale = 1;
          cube.userData.rotationSpeed = 0.012;
          cube.material.color.copy(cube.userData.initialColor);
          cube.material.opacity = 0.82;
        }
      }
    });
    canvas.addEventListener('wheel', (event) => {
      camera.position.z = Math.max(5, Math.min(30, camera.position.z + event.deltaY*0.001));
    });
    window.addEventListener('keydown', (event) => {
      if (event.code === 'Space') {
        isPaused = !isPaused;
        if (!isPaused) animate();
      }
    });

    // Animation Loop
    function animate() {
      if (isPaused) return;
      requestAnimationFrame(animate);

      const t = Date.now()*0.001;
      // Particle movement
      const positions = particleSystem.geometry.attributes.position.array;
      for(let i=0;i<particleCount;i++) {
        positions[i*3] += velocities[i].x;
        positions[i*3+1] += velocities[i].y;
        positions[i*3+2] += velocities[i].z;
        if (Math.abs(positions[i*3]) > 15) positions[i*3] = -positions[i*3];
        if (Math.abs(positions[i*3+1]) > 15) positions[i*3+1] = -positions[i*3+1];
        if (Math.abs(positions[i*3+2]) > 15) positions[i*3+2] = -positions[i*3+2];
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;

      cubes.forEach((cube, i) => {
        const offset = i*0.1;
        cube.position.x = cube.userData.initialX + Math.sin(t + offset)*0.52;
        cube.position.y = cube.userData.initialY + Math.cos(t + offset)*0.52;
        const pulse = Math.sin(t*2 + cube.userData.pulsePhase)*0.09;
        const targetScale = cube.userData.targetScale + pulse;
        cube.scale.lerp(new THREE.Vector3(targetScale, targetScale, targetScale), 0.13);
        cube.rotation.x += cube.userData.rotationSpeed;
        cube.rotation.y += cube.userData.rotationSpeed;
      });

      camera.position.x = Math.sin(t*0.5) * 15;
      camera.position.z = Math.cos(t*0.5) * 15;
      camera.lookAt(scene.position);

      renderer.render(scene, camera);
    }

    resizeCanvas();
    animate();
  </script>
</body>
</html>
