<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fale com um especialista em Energia Solar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-neutral-950 flex items-center justify-center min-h-screen font-['Inter']">
  <!-- Overlay -->
  <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-20 animate-fade-in" style="animation-delay: 0ms; opacity: 1; transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);"></div>
  <!-- Popup -->
  <div class="fixed z-30 inset-0 flex items-center justify-center">
    <div class="max-w-md w-full relative flex flex-col gap-6 animate-slide-up-fade bg-[radial-gradient(circle_at_center,var(--tw-gradient-stops))] from-sky-200 to-blue-700 border-neutral-800 border rounded-2xl mr-4 ml-4 pt-8 pr-8 pb-8 pl-8 shadow-2xl" style="animation-delay: 120ms; animation-duration: 600ms; opacity: 1; transform: translateY(0px) scale(1); transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);">
      <!-- Close Button -->
      <button onclick="closePopup()" class="absolute top-4 right-4 p-2 rounded-full hover:bg-neutral-800 focus:outline-none transition-colors" style="animation-delay: 180ms" aria-label="Fechar formulário">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="x" class="lucide lucide-x w-5 h-5 text-neutral-400"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
      </button>
      <!-- Title -->
      <h2 class="md:text-3xl animate-fade-in text-2xl font-semibold text-white tracking-tight mb-1" style="animation-delay: 200ms; opacity: 1; transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);">Receba seu orçamento gratuito em minutos</h2>
      
      <form id="solarForm" class="flex flex-col gap-5 animate-fade-in" style="animation-delay: 300ms; opacity: 1; transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);">
        <!-- Nome -->
        <div class="flex flex-col gap-2">
          <label for="nome" class="text-sm font-bold text-slate-50 shadow">Nome</label>
          <input id="nome" name="nome" type="text" required="" placeholder="Digite o seu nome" class="focus:border-emerald-400 outline-none transition-all placeholder-neutral-500 text-base font-normal text-neutral-100 bg-slate-50 border rounded-lg pt-3 pr-4 pb-3 pl-4" autocomplete="name" oninput="validateForm()">
        </div>
        <!-- Telefone/WhatsApp -->
        <div class="flex flex-col gap-2">
          <label for="telefone" class="text-sm font-medium text-slate-50">Telefone / WhatsApp</label>
          <input id="telefone" name="telefone" type="tel" required="" placeholder="DDD+ número" class="focus:border-emerald-400 outline-none transition-all placeholder-neutral-500 text-base font-normal text-neutral-100 bg-slate-50 border-neutral-700 border rounded-lg pt-3 pr-4 pb-3 pl-4" autocomplete="tel" oninput="validateForm()" pattern="^\d{10,11}$" maxlength="11">
        </div>
        <!-- Cidade -->
        <div class="flex flex-col gap-2">
          <label for="cidade" class="text-sm font-medium text-slate-50">Cidade</label>
          <input id="cidade" name="cidade" type="text" required="" placeholder="Sua cidade" class="focus:border-emerald-400 outline-none transition-all placeholder-neutral-500 text-base font-normal text-neutral-100 bg-slate-50 border-neutral-700 border rounded-lg pt-3 pr-4 pb-3 pl-4" autocomplete="address-level2" oninput="validateForm()">
        </div>
        <div class="h-px bg-neutral-800 my-2"></div>
        <!-- Botão WhatsApp -->
        <button id="whatsappButton" type="button" disabled="" class="flex items-center justify-center gap-3 w-full bg-emerald-500 hover:bg-emerald-600 transition-colors text-white font-semibold text-base px-4 py-3 rounded-xl focus:outline-none shadow-xl hover:shadow-emerald-900/30 disabled:opacity-50 disabled:cursor-not-allowed outline outline-0 hover:outline-2 hover:outline-emerald-400/40 animate-fade-in" style="animation-delay: 350ms; opacity: 1; transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);" onclick="redirectWhatsapp()">
          <i data-lucide="whatsapp" class="w-5 h-5"></i>
          Fale com um especialista agora
        </button>
      </form>
      
    </div>
  </div>
  <script>
    lucide.createIcons();

    // Animation keyframes
    document.querySelectorAll('.animate-fade-in').forEach((el, idx) => {
      el.style.opacity = 0;
      setTimeout(() => {
        el.style.transition = 'opacity 0.5s cubic-bezier(.4,0,.2,1), transform 0.7s cubic-bezier(.4,0,.2,1)';
        el.style.opacity = 1;
      }, idx * 80 + 150);
    });
    document.querySelectorAll('.animate-slide-up-fade').forEach((el, idx) => {
      el.style.opacity = 0;
      el.style.transform = 'translateY(24px) scale(.97)';
      setTimeout(() => {
        el.style.transition = 'opacity 0.7s cubic-bezier(.4,0,.2,1), transform 0.7s cubic-bezier(.4,0,.2,1)';
        el.style.opacity = 1;
        el.style.transform = 'translateY(0) scale(1)';
      }, idx * 80 + 200);
    });

    // Form validation & button activation
    function validateForm() {
      const nome = document.getElementById('nome').value.trim();
      const telefone = document.getElementById('telefone').value.trim();
      const cidade = document.getElementById('cidade').value.trim();
      const telPattern = /^\d{10,11}$/;
      const isFilled = nome.length > 1 && telPattern.test(telefone) && cidade.length > 1;
      document.getElementById('whatsappButton').disabled = !isFilled;
    }

    // WhatsApp redirect with filled info
    function redirectWhatsapp() {
      const nome = encodeURIComponent(document.getElementById('nome').value.trim());
      const telefone = encodeURIComponent(document.getElementById('telefone').value.trim());
      const cidade = encodeURIComponent(document.getElementById('cidade').value.trim());
      const base = 'https://api.whatsapp.com/send/?phone=5531985167248&text=';
      const msg = `Olá, vim pelo site e gostaria de mais informações.%0a%0aNome: ${nome}%0aWhatsApp: ${telefone}%0aCidade: ${cidade}`;
      window.open(`${base}${msg}&type=phone_number&app_absent=0`, '_blank');
    }

    // Close popup
    function closePopup() {
      // Fade out for smooth UX
      document.body.querySelector('.fixed.inset-0.bg-black\\/60').style.opacity = 0;
      document.body.querySelector('.fixed.z-30').style.opacity = 0;
      setTimeout(() => {
        document.body.innerHTML = '';
      }, 400);
    }

    // Enter key submits if all valid
    document.getElementById('solarForm').addEventListener('keydown', function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        if (!document.getElementById('whatsappButton').disabled) redirectWhatsapp();
      }
    });
  </script>
  <style>
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slide-up-fade { from { opacity: 0; transform: translateY(24px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  </style>

</body></html>
