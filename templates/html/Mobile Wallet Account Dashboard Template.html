<body class="bg-slate-100 flex justify-center text-slate-800 selection:bg-purple-200">

    <!-- Mobile App Container -->
    <main class="w-full max-w-md bg-slate-50 min-h-screen relative shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Header -->
        <header class="flex items-center justify-between pt-12 pb-4 px-6 absolute w-full top-0 z-30">
            <button class="w-10 h-10 flex items-center justify-center rounded-full bg-white/90 backdrop-blur-md shadow-sm border border-slate-100/50 text-slate-700 hover:text-purple-600 active:scale-95 transition-all">

            </button>
            
            <div class="bg-white/90 backdrop-blur-md px-4 py-2 rounded-full shadow-sm border border-slate-100/50">
                <h1 class="text-base tracking-tight font-semibold text-purple-600">Add Address</h1>
            </div>
            
            <div class="w-10 h-10"></div> <!-- Spacer for perfect centering -->
        </header>

        <!-- Interactive Map (Top 30%) -->
        <section class="relative w-full h-64 bg-slate-200 shrink-0">
            <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=800&q=80" 
                 alt="Map view" 
                 class="w-full h-full object-cover opacity-80 mix-blend-luminosity">
            
            <!-- Map Overlay Gradient to blend with background -->
            <div class="absolute inset-0 bg-gradient-to-b from-slate-900/10 to-transparent"></div>
            
            <!-- Center Pin -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none mt-8">
                <div class="relative flex flex-col items-center">
                    <div class="absolute w-14 h-14 bg-purple-500/20 rounded-full animate-ping top-[-8px]"></div>
                    <div class="w-10 h-10 bg-purple-600 text-white flex items-center justify-center rounded-full shadow-lg shadow-purple-600/40 z-10 border-2 border-white">
                        <iconify-icon icon="solar:point-on-map-linear" class="text-xl"></iconify-icon>
                    </div>
                    <div class="w-1.5 h-1.5 bg-slate-800 rounded-full mt-1.5 shadow-md"></div>
                </div>
            </div>
            
            <!-- Bottom fade into content -->
            <div class="absolute bottom-0 w-full h-12 bg-gradient-to-t from-slate-50 to-transparent"></div>
        </section>

        <!-- Input Fields Container -->
        <section class="px-6 flex flex-col gap-4 pb-36 overflow-y-auto -mt-2 relative z-20">
            
            <!-- Full Name -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-slate-500 ml-1">Full Name</label>
                <div class="bg-white rounded-xl shadow-sm shadow-slate-200/50 border border-slate-100 px-4 py-3.5 flex items-center gap-3 focus-within:border-purple-400 focus-within:ring-2 focus-within:ring-purple-50 transition-all">
                    <iconify-icon icon="solar:user-rounded-linear" class="text-slate-400 text-lg"></iconify-icon>
                    <input type="text" placeholder="Sarah Amina" class="w-full bg-transparent text-sm font-medium text-slate-800 outline-none placeholder:text-slate-300 placeholder:font-normal">
                </div>
            </div>

            <!-- Phone Number -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-slate-500 ml-1">Phone Number</label>
                <div class="bg-white rounded-xl shadow-sm shadow-slate-200/50 border border-slate-100 px-4 py-3.5 flex items-center gap-3 focus-within:border-purple-400 focus-within:ring-2 focus-within:ring-purple-50 transition-all">
                    <div class="flex items-center gap-1.5 shrink-0">
                        <span class="text-base leading-none">🇨🇲</span>
                        <span class="text-sm font-medium text-slate-600">+237</span>
                        <iconify-icon icon="solar:alt-arrow-down-linear" class="text-slate-400 text-xs ml-0.5"></iconify-icon>
                    </div>
                    <div class="w-px h-5 bg-slate-200 mx-1"></div>
                    <input type="tel" placeholder="6 00 00 00 00" class="w-full bg-transparent text-sm font-medium text-slate-800 outline-none placeholder:text-slate-300 placeholder:font-normal">
                </div>
            </div>

            <!-- Street Address -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-slate-500 ml-1">Street Address / Landmark</label>
                <div class="bg-white rounded-xl shadow-sm shadow-slate-200/50 border border-slate-100 px-4 py-3.5 flex items-center gap-3 focus-within:border-purple-400 focus-within:ring-2 focus-within:ring-purple-50 transition-all">
                    <iconify-icon icon="solar:routing-2-linear" class="text-slate-400 text-lg"></iconify-icon>
                    <input type="text" placeholder="e.g. Opposite Pharmacie Deido" class="w-full bg-transparent text-sm font-medium text-slate-800 outline-none placeholder:text-slate-300 placeholder:font-normal">
                </div>
            </div>

            <!-- City Dropdown -->
            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-slate-500 ml-1">City / Area</label>
                <div class="bg-white rounded-xl shadow-sm shadow-slate-200/50 border border-slate-100 px-4 py-3.5 flex items-center gap-3 relative focus-within:border-purple-400 focus-within:ring-2 focus-within:ring-purple-50 transition-all">
                    <iconify-icon icon="solar:city-linear" class="text-slate-400 text-lg z-10"></iconify-icon>
                    <select required class="w-full bg-transparent text-sm font-medium text-slate-800 outline-none appearance-none cursor-pointer z-10 relative">
                        <option value="" disabled selected hidden>Select City</option>
                        <option value="douala" class="text-slate-800">Douala</option>
                        <option value="yaounde" class="text-slate-800">Yaoundé</option>
                        <option value="bafoussam" class="text-slate-800">Bafoussam</option>
                    </select>
                    <iconify-icon icon="solar:alt-arrow-down-linear" class="text-slate-400 absolute right-4 z-0"></iconify-icon>
                </div>
            </div>

            <!-- Address Type Chips -->
            <div class="flex flex-col gap-2.5 mt-2">
                <label class="text-xs font-medium text-slate-500 ml-1">Address Type</label>
                <div class="flex items-center gap-3">
                    <!-- Selected Chip -->
                    <button class="flex-1 py-3 bg-purple-600 text-white rounded-xl text-xs font-medium flex items-center justify-center gap-2 shadow-sm shadow-purple-200 active:scale-95 transition-all">
                        <iconify-icon icon="solar:home-2-linear" class="text-sm"></iconify-icon> Home
                    </button>
                    <!-- Unselected Chip -->
                    <button class="flex-1 py-3 bg-white text-slate-600 border border-slate-200 rounded-xl text-xs font-medium flex items-center justify-center gap-2 hover:bg-slate-50 active:scale-95 transition-all">
                        <iconify-icon icon="solar:buildings-2-linear" class="text-sm"></iconify-icon> Work
                    </button>
                    <!-- Unselected Chip -->
                    <button class="flex-1 py-3 bg-white text-slate-600 border border-slate-200 rounded-xl text-xs font-medium flex items-center justify-center gap-2 hover:bg-slate-50 active:scale-95 transition-all">
                        <iconify-icon icon="solar:map-point-linear" class="text-sm"></iconify-icon> Other

                </button>
            </div>

        </section>

        <!-- Primary Action Button Container -->
        <div class="fixed bottom-0 w-full max-w-md bg-gradient-to-t from-slate-50 via-slate-50/95 to-transparent pt-12 pb-8 px-6 z-40 pointer-events-none">
