<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gusto - Premium Dining Experience</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Custom Animations */
@keyframes float {
0%, 100% { transform: translateY(0px) rotate(0deg); }
50% { transform: translateY(-20px) rotate(1deg); }
}
@keyframes drift {
0% { transform: translate(0, 0) scale(1); }
33% { transform: translate(30px, -50px) scale(1.1); }
66% { transform: translate(-20px, 20px) scale(0.9); }
100% { transform: translate(0, 0) scale(1); }
}
@keyframes steam {
0% { transform: translateY(0) scale(1); opacity: 0; }
50% { opacity: 0.6; }
100% { transform: translateY(-80px) scale(1.5); opacity: 0; }
}
@keyframes rotate-plate {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
@keyframes fade-in-up {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}
@keyframes camera-pan {
0% { transform: scale(1); }
100% { transform: scale(1.05); }
}
.animate-float { animation: float 8s ease-in-out infinite; }
.animate-drift { animation: drift 20s ease-in-out infinite; }
.animate-steam-1 { animation: steam 3s ease-out infinite; animation-delay: 0s; }
.animate-steam-2 { animation: steam 4s ease-out infinite; animation-delay: 1s; }
.animate-steam-3 { animation: steam 3.5s ease-out infinite; animation-delay: 2s; }
.animate-spin-slow { animation: rotate-plate 60s linear infinite; }
.animate-camera { animation: camera-pan 30s ease-out forwards; }
.glass {
background: rgba(255, 255, 255, 0.03);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(255, 255, 255, 0.08);
box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}
/* Hide scrollbar */
::-webkit-scrollbar { width: 0px; background: transparent; }
body { font-family: 'Inter', sans-serif; }
h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }
</style>
<style>
/* 3D Transform utilities */
</style>
<script>
// Configure Tailwind to include our custom 3D transform utilities
tailwind.config = {
theme: {
extend: {
// Add any custom theme extensions here if needed
}
},
plugins: [
function({ addUtilities }) {
const rotateXUtilities = {};
const rotateYUtilities = {};
const rotateZUtilities = {};
const rotateValues = [0, 5, 10, 15, 20, 30, 45, 75];
// Generate rotate-x utilities
rotateValues.forEach((value) => {
rotateXUtilities[`.rotate-x-${value}`] = {
'--tw-rotate-x': `${value}deg`,
transform: `
translate3d(var(--tw-translate-x, 0), var(--tw-translate-y, 0), var(--tw-translate-z, 0))
rotateX(var(--tw-rotate-x, 0))
rotateY(var(--tw-rotate-y, 0))
rotateZ(var(--tw-rotate-z, 0))
skewX(var(--tw-skew-x, 0))
skewY(var(--tw-skew-y, 0))
scaleX(var(--tw-scale-x, 1))
scaleY(var(--tw-scale-y, 1))
`.replace(/\\s+/g, ' ').trim(),
};
if (value !== 0) {
rotateXUtilities[`.-rotate-x-${value}`] = {
'--tw-rotate-x': `-${value}deg`,
transform: `
translate3d(var(--tw-translate-x, 0), var(--tw-translate-y, 0), var(--tw-translate-z, 0))
rotateX(var(--tw-rotate-x, 0))
rotateY(var(--tw-rotate-y, 0))
rotateZ(var(--tw-rotate-z, 0))
skewX(var(--tw-skew-x, 0))
skewY(var(--tw-skew-y, 0))
scaleX(var(--tw-scale-x, 1))
scaleY(var(--tw-scale-y, 1))
`.replace(/\\s+/g, ' ').trim(),
};
}
});
// Generate rotate-y utilities
rotateValues.forEach((value) => {
rotateYUtilities[`.rotate-y-${value}`] = {
'--tw-rotate-y': `${value}deg`,
transform: `
translate3d(var(--tw-translate-x, 0), var(--tw-translate-y, 0), var(--tw-translate-z, 0))
rotateX(var(--tw-rotate-x, 0))
rotateY(var(--tw-rotate-y, 0))
rotateZ(var(--tw-rotate-z, 0))
skewX(var(--tw-skew-x, 0))
skewY(var(--tw-skew-y, 0))
scaleX(var(--tw-scale-x, 1))
scaleY(var(--tw-scale-y, 1))
`.replace(/\\s+/g, ' ').trim(),
};
if (value !== 0) {
rotateYUtilities[`.-rotate-y-${value}`] = {
'--tw-rotate-y': `-${value}deg`,
transform: `
translate3d(var(--tw-translate-x, 0), var(--tw-translate-y, 0), var(--tw-translate-z, 0))
rotateX(var(--tw-rotate-x, 0))
rotateY(var(--tw-rotate-y, 0))
rotateZ(var(--tw-rotate-z, 0))
skewX(var(--tw-skew-x, 0))
skewY(var(--tw-skew-y, 0))
scaleX(var(--tw-scale-x, 1))
scaleY(var(--tw-scale-y, 1))
`.replace(/\\s+/g, ' ').trim(),
};
}
});
// Generate rotate-z utilities
rotateValues.forEach((value) => {
rotateZUtilities[`.rotate-z-${value}`] = {
'--tw-rotate-z': `${value}deg`,
transform: `
translate3d(var(--tw-translate-x, 0), var(--tw-translate-y, 0), var(--tw-translate-z, 0))
rotateX(var(--tw-rotate-x, 0))
rotateY(var(--tw-rotate-y, 0))
rotateZ(var(--tw-rotate-z, 0))
skewX(var(--tw-skew-x, 0))
skewY(var(--tw-skew-y, 0))
scaleX(var(--tw-scale-x, 1))
scaleY(var(--tw-scale-y, 1))
`.replace(/\\s+/g, ' ').trim(),
};
if (value !== 0) {
rotateZUtilities[`.-rotate-z-${value}`] = {
'--tw-rotate-z': `-${value}deg`,
transform: `
translate3d(var(--tw-translate-x, 0), var(--tw-translate-y, 0), var(--tw-translate-z, 0))
rotateX(var(--tw-rotate-x, 0))
rotateY(var(--tw-rotate-y, 0))
rotateZ(var(--tw-rotate-z, 0))
skewX(var(--tw-skew-x, 0))
skewY(var(--tw-skew-y, 0))
scaleX(var(--tw-scale-x, 1))
scaleY(var(--tw-scale-y, 1))
`.replace(/\\s+/g, ' ').trim(),
};
}
});
// Perspective utilities
const perspectiveUtilities = {
".perspective-none": { perspective: "none" },
".perspective-dramatic": { perspective: "100px" },
".perspective-near": { perspective: "300px" },
".perspective-normal": { perspective: "500px" },
".perspective-midrange": { perspective: "800px" },
".perspective-distant": { perspective: "1200px" },
};
// Transform style utilities
const transformStyleUtilities = {
".transform-style-preserve-3d": { "transform-style": "preserve-3d" },
".transform-style-flat": { "transform-style": "flat" },
};
addUtilities({
...rotateXUtilities,
...rotateYUtilities,
...rotateZUtilities,
...perspectiveUtilities,
...transformStyleUtilities,
});
}
]
};
</script><!-- aura-ga4-start -->

</head>
<body class="bg-[#0f0f11] text-stone-200 h-screen w-full overflow-hidden antialiased selection:bg-orange-500/30">

    <!-- Background Ambiance -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <!-- Terracotta Blur -->
        <div class="absolute top-[-10%] left-[20%] w-[50vw] h-[50vw] bg-orange-900/30 rounded-full blur-[120px] mix-blend-screen animate-drift opacity-60"></div>
        <!-- Olive Green Blur -->
        <div class="absolute bottom-[-10%] right-[10%] w-[40vw] h-[40vw] bg-lime-900/20 rounded-full blur-[100px] mix-blend-screen animate-drift opacity-50" style="animation-delay: -5s;"></div>
        <!-- Cinematic Grain Overlay -->
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMDI1Ii8+Cjwvc3ZnPg==')] opacity-30"></div>
    </div>

    <!-- Main Container simulating camera movement -->
    <div class="relative z-10 w-full h-full flex flex-col animate-camera">
        
        <!-- Navigation -->
        <nav class="w-full px-8 py-6 flex justify-between items-center z-50">
            <!-- Logo -->
            <div class="glass px-5 py-2 rounded-full flex items-center gap-3 fade-in" style="animation: fade-in-up 0.8s ease-out forwards;">
                <span class="text-lg tracking-tight font-semibold text-orange-50">GUSTO</span>
            </div>

            <!-- Menu Links -->
            <div class="hidden md:flex gap-8 items-center glass px-8 py-3 rounded-full text-xs font-medium tracking-wide text-stone-300" style="animation: fade-in-up 0.8s ease-out 0.2s forwards; opacity: 0;">
                <a href="#" class="hover:text-white transition-colors duration-300">MENU</a>
                <a href="#" class="hover:text-white transition-colors duration-300">RESERVATIONS</a>
                <a href="#" class="hover:text-white transition-colors duration-300">CHEF'S TABLE</a>
                <a href="#" class="hover:text-white transition-colors duration-300">STORY</a>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-4" style="animation: fade-in-up 0.8s ease-out 0.4s forwards; opacity: 0;">
                <button class="glass w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/10 transition-colors group">
                    <iconify-icon icon="solar:magnifer-linear" class="text-xl text-stone-300 group-hover:text-white" stroke-width="1.5"></iconify-icon>
                </button>
                <button class="glass w-10 h-10 rounded-full flex items-center justify-center hover:bg-white/10 transition-colors group relative">
                    <div class="absolute top-2 right-2 w-2 h-2 bg-orange-500 rounded-full shadow-[0_0_10px_rgba(249,115,22,0.5)]"></div>
                    <iconify-icon icon="solar:bag-3-linear" class="text-xl text-stone-300 group-hover:text-white" stroke-width="1.5"></iconify-icon>
                </button>
                <button class="glass px-5 py-2 rounded-full flex items-center gap-2 hover:bg-white/10 transition-colors text-xs font-semibold tracking-wide">
                    <span>BOOK TABLE</span>
                </button>
            </div>
        </nav>

        <!-- Hero Content -->
        <main class="flex-1 flex items-center justify-center relative perspective-[1200px]">
            
            <!-- Centerpiece: Pasta Bowl -->
            <div class="relative w-[300px] h-[300px] md:w-[500px] md:h-[500px] flex items-center justify-center animate-float z-20">
                
                <!-- Plate Shadow -->
                <div class="absolute bottom-[-40px] w-[60%] h-[20px] bg-black/60 blur-[30px] rounded-[100%]"></div>
                
                <!-- The Pasta (Image) -->
                <div class="relative w-full h-full rounded-full overflow-hidden shadow-2xl animate-spin-slow ring-1 ring-white/10">
                    <img src="https://images.unsplash.com/photo-1551183053-bf91a1d81141?q=80&w=2032&auto=format&fit=crop" 
                         alt="Fresh Pasta" 
                         class="w-full h-full object-cover scale-110">
                    
                    <!-- Inner Vignette for depth -->
                    <div class="absolute inset-0 bg-radial-gradient(circle, transparent 40%, rgba(0,0,0,0.4) 100%) pointer-events-none"></div>
                </div>

                <!-- Steam Effects -->
                <div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-20 h-20 pointer-events-none">
                    <div class="absolute top-0 left-0 w-16 h-24 bg-white/20 blur-[20px] rounded-full animate-steam-1"></div>
                    <div class="absolute top-4 -left-8 w-12 h-20 bg-white/15 blur-[25px] rounded-full animate-steam-2"></div>
                    <div class="absolute top-2 left-6 w-14 h-28 bg-white/10 blur-[18px] rounded-full animate-steam-3"></div>
                </div>

                <!-- Floating UI Cards (Glassmorphism) -->
                
                <!-- Card 1: Ingredients -->
                <div class="absolute top-0 -left-12 md:-left-32 glass p-4 rounded-2xl flex flex-col gap-2 w-48 backdrop-blur-xl transition-all hover:scale-105 duration-500 cursor-pointer group"
                     style="animation: fade-in-up 1s ease-out 0.5s forwards; opacity: 0;">
                    <div class="flex items-center gap-3 mb-1">
                        <div class="w-8 h-8 rounded-full bg-orange-500/20 flex items-center justify-center text-orange-400">
                            <iconify-icon icon="solar:leaf-linear" width="18" stroke-width="1.5"></iconify-icon>
                        </div>
                        <span class="text-xs font-semibold tracking-wide text-white/90">Fresh Basil</span>
                    </div>
                    <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                        <div class="h-full bg-orange-400 w-[85%]"></div>
                    </div>
                    <p class="text-[10px] text-stone-400 leading-relaxed">Hand-picked from our organic garden this morning.</p>
                </div>

                <!-- Card 2: Rating -->
                <div class="absolute bottom-12 -right-4 md:-right-24 glass p-4 rounded-2xl flex items-center gap-4 w-auto min-w-[180px] transition-all hover:scale-105 duration-500 cursor-pointer"
                     style="animation: fade-in-up 1s ease-out 0.7s forwards; opacity: 0;">
                    <div class="flex flex-col">
                        <span class="text-2xl serif text-white italic">4.9</span>
                        <div class="flex text-orange-400 gap-0.5 text-[10px]">
                            <iconify-icon icon="solar:star-bold"></iconify-icon>
                            <iconify-icon icon="solar:star-bold"></iconify-icon>
                            <iconify-icon icon="solar:star-bold"></iconify-icon>
                            <iconify-icon icon="solar:star-bold"></iconify-icon>
                            <iconify-icon icon="solar:star-bold"></iconify-icon>
                        </div>
                    </div>
                    <div class="h-8 w-[1px] bg-white/10"></div>
                    <div class="flex flex-col">
                        <span class="text-[10px] uppercase tracking-widest text-stone-400 mb-1">Cuisine</span>
                        <span class="text-xs font-medium text-stone-200">Italian Artisan</span>
                    </div>
                </div>

                <!-- Price Tag -->
                <div class="absolute -bottom-8 left-1/2 -translate-x-1/2 glass px-6 py-2 rounded-full flex items-center gap-2 hover:bg-orange-500/20 transition-colors duration-300 cursor-pointer"
                     style="animation: fade-in-up 1s ease-out 0.9s forwards; opacity: 0;">
                     <span class="text-orange-400 text-lg serif italic">$24</span>
                     <span class="w-[1px] h-3 bg-white/20"></span>
                     <span class="text-[10px] uppercase tracking-wider font-medium">Add to Order</span>
                     <iconify-icon icon="solar:arrow-right-linear" class="ml-1 text-xs"></iconify-icon>
                </div>

            </div>

            <!-- Background Typography (behind plate) -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0 select-none">
                <h1 class="text-[15vw] leading-none text-white/[0.03] font-serif italic tracking-tighter blur-[2px]">
                    Arrabiata
                </h1>
            </div>

        </main>

        <!-- Footer / Timeline Strip -->
        <footer class="w-full px-8 py-8 flex justify-between items-end relative z-50">
            <div class="flex flex-col gap-4" style="animation: fade-in-up 1s ease-out 1s forwards; opacity: 0;">
                <div class="flex items-center gap-2 text-xs font-medium tracking-widest text-stone-500 uppercase">
                    <span class="text-orange-500">01</span>
                    <span class="w-8 h-[1px] bg-stone-700"></span>
                    <span>Signature Dish</span>
                </div>
                <h2 class="text-4xl md:text-5xl font-serif text-white/90 leading-tight">
                    Spicy Tomato <br> <span class="text-stone-500 italic">Basilico</span>
                </h2>
            </div>

            <div class="hidden md:flex flex-col items-end gap-6" style="animation: fade-in-up 1s ease-out 1.2s forwards; opacity: 0;">
                <div class="glass p-1 rounded-full flex flex-col gap-2">
                    <button class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center">
                        <iconify-icon icon="solar:arrow-down-linear" width="20" stroke-width="2"></iconify-icon>
                    </button>
                </div>
                <p class="text-[10px] text-stone-400 max-w-[150px] text-right leading-relaxed">
                    Scroll to explore our ingredients and the story behind the dish.
                </p>
            </div>
            
            <!-- Side Scroll Indicators -->
            <div class="absolute right-8 top-1/2 -translate-y-1/2 flex flex-col gap-3">
                <div class="w-1 h-1 bg-white rounded-full"></div>
                <div class="w-1 h-1 bg-white/20 rounded-full"></div>
                <div class="w-1 h-1 bg-white/20 rounded-full"></div>
                <div class="w-1 h-1 bg-white/20 rounded-full"></div>
            </div>
        </footer>

    </div>

</body>
</html>
