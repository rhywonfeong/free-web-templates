<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Skill Assessment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-[#f5f6fa] to-[#e9ecf3] min-h-screen flex items-center justify-center">
  <div class="max-w-xl w-full rounded-3xl px-9 pt-9 pb-8 bg-white/70 border border-[#ececf0] shadow-2xl backdrop-blur-md flex flex-col gap-7 relative overflow-visible">
    <header class="flex flex-col gap-2 items-center pb-2">
      <div class="text-base uppercase tracking-widest font-medium text-gray-400 mb-1">Employee Skill Assessment</div>
      <div class="text-3xl font-semibold text-gray-800 tracking-tight">2024 Overview</div>
    </header>
    <div class="flex flex-col gap-5 pt-2">
      <div class="text-center text-sm text-gray-400 mb-4">Skill scores based on recent performance review</div>
      <div class="flex flex-col gap-5">
        <div class="flex items-center gap-3">
          <div class="w-40 text-right pr-3 text-gray-500 font-medium">Communication</div>
          <div class="flex-1 h-3 rounded-full bg-gray-100 overflow-hidden">
            <div class="h-3 rounded-full bg-gradient-to-r from-[#d1ecfd] via-[#aee9fc] to-[#62c6fa]" style="width:78%"></div>
          </div>
          <div class="ml-3 text-gray-800 font-semibold tabular-nums">78</div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-40 text-right pr-3 text-gray-500 font-medium">Technical Skills</div>
          <div class="flex-1 h-3 rounded-full bg-gray-100 overflow-hidden">
            <div class="h-3 rounded-full bg-gradient-to-r from-[#d1eaff] via-[#bac5fc] to-[#828ffe]" style="width:85%"></div>
          </div>
          <div class="ml-3 text-gray-800 font-semibold tabular-nums">85</div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-40 text-right pr-3 text-gray-500 font-medium">Leadership</div>
          <div class="flex-1 h-3 rounded-full bg-gray-100 overflow-hidden">
            <div class="h-3 rounded-full bg-gradient-to-r from-[#edd7f7] via-[#bcb6ec] to-[#9e8dfc]" style="width:67%"></div>
          </div>
          <div class="ml-3 text-gray-800 font-semibold tabular-nums">67</div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-40 text-right pr-3 text-gray-500 font-medium">Creativity</div>
          <div class="flex-1 h-3 rounded-full bg-gray-100 overflow-hidden">
            <div class="h-3 rounded-full bg-gradient-to-r from-[#fef6e6] via-[#fdecc5] to-[#fed697]" style="width:72%"></div>
          </div>
          <div class="ml-3 text-gray-800 font-semibold tabular-nums">72</div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-40 text-right pr-3 text-gray-500 font-medium">Teamwork</div>
          <div class="flex-1 h-3 rounded-full bg-gray-100 overflow-hidden">
            <div class="h-3 rounded-full bg-gradient-to-r from-[#eafde1] via-[#a1edb6] to-[#36e17c]" style="width:89%"></div>
          </div>
          <div class="ml-3 text-gray-800 font-semibold tabular-nums">89</div>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-40 text-right pr-3 text-gray-500 font-medium">Time Management</div>
          <div class="flex-1 h-3 rounded-full bg-gray-100 overflow-hidden">
            <div class="h-3 rounded-full bg-gradient-to-r from-[#fdedec] via-[#fccec7] to-[#f98181]" style="width:77%"></div>
          </div>
          <div class="ml-3 text-gray-800 font-semibold tabular-nums">77</div>
        </div>
      </div>
    </div>
    <div class="mt-7 flex flex-col items-center space-y-1">
      <div class="text-2xl font-semibold text-gray-700 tracking-tight">
        Average Score:
        <span class="ml-2 bg-gradient-to-bl from-[#aee9fc] via-[#a1edb6] to-[#bcb6ec] bg-clip-text text-transparent font-bold">78</span>
      </div>
      <div class="text-xs text-gray-400 font-medium">All scores out of 100</div>
    </div>
  </div>
</body>
</html>
