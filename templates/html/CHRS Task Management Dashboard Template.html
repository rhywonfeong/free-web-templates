<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #09090b; /* zinc-950 */
}
/* Custom scrollbar for webkit */
::-webkit-scrollbar {
width: 4px;
height: 4px;
}
::-webkit-scrollbar-track {
background: transparent;
}
::-webkit-scrollbar-thumb {
background: #27272a; /* zinc-800 */
border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
background: #3f3f46; /* zinc-700 */
}
iconify-icon {
stroke-width: 1.5;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="text-zinc-400 h-screen flex overflow-hidden selection:bg-zinc-800 selection:text-zinc-100 antialiased">

    <!-- Left Sidebar: Navigation & Storage -->
    <aside class="w-64 border-r border-zinc-800/60 flex flex-col justify-between bg-[#09090b] z-20 hidden md:flex shrink-0">
        <div class="p-4">
            <!-- Logo -->
            <div class="text-lg font-medium tracking-tighter text-zinc-100 mb-8 flex items-center gap-2 px-2">
                <div class="w-5 h-5 rounded flex items-center justify-center bg-zinc-100 text-[#09090b] text-xs font-semibold">C</div>
                CHRS.
            </div>

            <!-- Categories / Navigation -->
            <nav class="space-y-1">
                <a href="#" class="flex items-center justify-between px-2 py-1.5 text-sm font-medium text-zinc-100 bg-zinc-800/40 rounded-md group">
                    <div class="flex items-center gap-2.5">
                        <iconify-icon icon="solar:checklist-minimalistic-linear" class="text-zinc-400 group-hover:text-zinc-100 transition-colors"></iconify-icon>
                        Show Chores
                    </div>
                </a>
                <a href="#" class="flex items-center justify-between px-2 py-1.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/20 rounded-md transition-colors group">
                    <div class="flex items-center gap-2.5">
                        <iconify-icon icon="solar:history-linear"></iconify-icon>
                        History
                    </div>
                </a>
                <a href="#" class="flex items-center justify-between px-2 py-1.5 text-sm font-medium text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/20 rounded-md transition-colors group">
                    <div class="flex items-center gap-2.5">
                        <iconify-icon icon="solar:document-text-linear"></iconify-icon>
                        News
                    </div>
                </a>
            </nav>
        </div>

        <!-- Cloud Storage Info -->
        <div class="p-6 border-t border-zinc-800/60">
            <div class="flex items-center gap-2 mb-3">
                <iconify-icon icon="solar:cloud-linear" class="text-zinc-100"></iconify-icon>
                <span class="text-xs font-medium text-zinc-100">Cloud Storage</span>
            </div>
            <div class="h-1 w-full bg-zinc-800 rounded-full overflow-hidden mb-2">
                <div class="h-full bg-zinc-300 w-1/4 rounded-full relative overflow-hidden">
                    <div class="absolute inset-0 bg-white/20 w-full animate-pulse"></div>
                </div>
            </div>
            <div class="flex items-center justify-between text-xs">
                <span class="text-zinc-500">24.5 GB used</span>
                <span class="text-zinc-300 font-medium tracking-tight">Max. Unlimited</span>
            </div>
        </div>
    </aside>

    <!-- Main Content: Chores List & Actions -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#09090b] relative">
        <!-- Header -->
        <header class="h-14 border-b border-zinc-800/60 flex items-center justify-between px-6 sticky top-0 bg-[#09090b]/80 backdrop-blur-md z-10 shrink-0">
            <div class="flex items-center gap-4">
                <h1 class="text-lg font-medium tracking-tight text-zinc-100">Active Tasks</h1>
            </div>
            <div class="flex items-center gap-3">
                <!-- Filter -->
                <button class="flex items-center gap-2 text-xs font-medium text-zinc-400 hover:text-zinc-100 transition-colors px-3 py-1.5 rounded-md border border-zinc-800 hover:border-zinc-700 bg-zinc-900/50">
                    <iconify-icon icon="solar:sort-from-top-to-bottom-linear"></iconify-icon>
                    Filter A-Z
                </button>
                <!-- Insert -->
                <button class="flex items-center gap-2 text-xs font-medium text-[#09090b] bg-zinc-100 hover:bg-white transition-colors px-3 py-1.5 rounded-md shadow-sm">
                    <iconify-icon icon="solar:add-circle-linear"></iconify-icon>
                    Insert Chores
                </button>
            </div>
        </header>

        <!-- Chores List Area -->
        <div class="flex-1 overflow-y-auto p-6">
            <div class="max-w-3xl mx-auto space-y-1">
                
                <!-- Item 1 -->
                <div class="group flex items-center justify-between p-3 rounded-lg hover:bg-zinc-800/30 border border-transparent hover:border-zinc-800/50 transition-all">
                    <div class="flex items-center gap-4">
                        <label class="relative flex items-center cursor-pointer">
                            <input type="checkbox" class="peer sr-only">
                            <div class="w-4 h-4 border border-zinc-700 rounded-[3px] bg-zinc-900 peer-checked:bg-zinc-100 peer-checked:border-zinc-100 flex items-center justify-center transition-all shadow-sm">
                                <iconify-icon icon="solar:check-read-linear" class="text-[#09090b] opacity-0 peer-checked:opacity-100 text-xs"></iconify-icon>
                            </div>
                        </label>
                        <span class="text-sm font-medium text-zinc-200 select-none">Review server security logs</span>
                    </div>
                    <div class="opacity-0 group-hover:opacity-100 flex items-center gap-1 transition-opacity">
                        <button class="p-1.5 text-zinc-500 hover:text-zinc-200 rounded-md hover:bg-zinc-700/50 transition-colors" title="Edit Chores">
                            <iconify-icon icon="solar:pen-linear"></iconify-icon>
                        </button>
                        <button class="p-1.5 text-zinc-500 hover:text-red-400 rounded-md hover:bg-red-400/10 transition-colors" title="Delete Chores Option">
                            <iconify-icon icon="solar:trash-bin-trash-linear"></iconify-icon>
                        </button>
                    </div>
                </div>

                <!-- Item 2 -->
                <div class="group flex items-center justify-between p-3 rounded-lg hover:bg-zinc-800/30 border border-transparent hover:border-zinc-800/50 transition-all">
                    <div class="flex items-center gap-4">
                        <label class="relative flex items-center cursor-pointer">
                            <input type="checkbox" class="peer sr-only">
                            <div class="w-4 h-4 border border-zinc-700 rounded-[3px] bg-zinc-900 peer-checked:bg-zinc-100 peer-checked:border-zinc-100 flex items-center justify-center transition-all shadow-sm">
                                <iconify-icon icon="solar:check-read-linear" class="text-[#09090b] opacity-0 peer-checked:opacity-100 text-xs"></iconify-icon>
                            </div>
                        </label>
                        <span class="text-sm font-medium text-zinc-200 select-none">Update user documentation</span>
                    </div>
                    <div class="opacity-0 group-hover:opacity-100 flex items-center gap-1 transition-opacity">
                        <button class="p-1.5 text-zinc-500 hover:text-zinc-200 rounded-md hover:bg-zinc-700/50 transition-colors">
                            <iconify-icon icon="solar:pen-linear"></iconify-icon>
                        </button>
                        <button class="p-1.5 text-zinc-500 hover:text-red-400 rounded-md hover:bg-red-400/10 transition-colors">
                            <iconify-icon icon="solar:trash-bin-trash-linear"></iconify-icon>
                        </button>
                    </div>
                </div>

                <!-- Item 3 -->
                <div class="group flex items-center justify-between p-3 rounded-lg hover:bg-zinc-800/30 border border-transparent hover:border-zinc-800/50 transition-all">
                    <div class="flex items-center gap-4">
                        <label class="relative flex items-center cursor-pointer">
                            <input type="checkbox" class="peer sr-only">
                            <div class="w-4 h-4 border border-zinc-700 rounded-[3px] bg-zinc-900 peer-checked:bg-zinc-100 peer-checked:border-zinc-100 flex items-center justify-center transition-all shadow-sm">
                                <iconify-icon icon="solar:check-read-linear" class="text-[#09090b] opacity-0 peer-checked:opacity-100 text-xs"></iconify-icon>
                            </div>
                        </label>
                        <span class="text-sm font-medium text-zinc-200 select-none">Optimize database indexing</span>
                    </div>
                    <div class="opacity-0 group-hover:opacity-100 flex items-center gap-1 transition-opacity">
                        <button class="p-1.5 text-zinc-500 hover:text-zinc-200 rounded-md hover:bg-zinc-700/50 transition-colors">
                            <iconify-icon icon="solar:pen-linear"></iconify-icon>
                        </button>
                        <button class="p-1.5 text-zinc-500 hover:text-red-400 rounded-md hover:bg-red-400/10 transition-colors">
                            <iconify-icon icon="solar:trash-bin-trash-linear"></iconify-icon>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Right Panel: Authentication & Configuration -->
    <aside class="w-80 border-l border-zinc-800/60 bg-[#09090b]/80 p-6 overflow-y-auto hidden lg:block shrink-0 shadow-[-10px_0_30px_-15px_rgba(0,0,0,0.5)]">
        
        <!-- Auth Section -->
        <div class="mb-10">
            <div class="flex items-center gap-2 mb-4 text-zinc-100">
                <iconify-icon icon="solar:user-circle-linear" class="text-lg"></iconify-icon>
                <h2 class="text-sm font-medium tracking-tight">Login / Signup</h2>
            </div>
            <form class="space-y-3">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500">
                        <iconify-icon icon="solar:letter-linear"></iconify-icon>
                    </div>
                    <input type="email" placeholder="Email address" class="w-full bg-[#09090b] border border-zinc-800 rounded-md pl-9 pr-3 py-2 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all shadow-sm">
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-zinc-500">
                        <iconify-icon icon="solar:lock-password-linear"></iconify-icon>
                    </div>
                    <input type="password" placeholder="Password" class="w-full bg-[#09090b] border border-zinc-800 rounded-md pl-9 pr-3 py-2 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all shadow-sm">
                </div>
                <button type="button" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-100 text-xs font-medium py-2.5 rounded-md transition-colors border border-zinc-700 hover:border-zinc-600 shadow-sm">
                    Continue with Email
                </button>
            </form>
        </div>

        <!-- Configuration Section -->
        <div>
            <div class="flex items-center gap-2 mb-4 text-zinc-100 border-t border-zinc-800/60 pt-6">
                <iconify-icon icon="solar:server-square-linear" class="text-lg"></iconify-icon>
                <h2 class="text-sm font-medium tracking-tight">System Configuration</h2>
            </div>
            
            <div class="space-y-5 mb-8">
                <!-- Custom Toggle 1 -->
                <label class="flex items-center justify-between cursor-pointer group">
                    <span class="text-xs font-medium text-zinc-400 group-hover:text-zinc-300 transition-colors select-none">Keep chores on this server</span>
                    <div class="relative flex items-center">
                        <input type="checkbox" class="peer sr-only" checked>
                        <div class="w-8 h-4.5 bg-zinc-800 rounded-full peer-checked:bg-zinc-200 transition-colors border border-zinc-700 peer-checked:border-zinc-200"></div>
                        <div class="absolute left-[2px] top-[2px] w-3.5 h-3.5 bg-zinc-400 rounded-full peer-checked:translate-x-[14px] peer-checked:bg-[#09090b] transition-transform duration-200 ease-in-out shadow-sm"></div>
                    </div>
                </label>

                <!-- Custom Toggle 2 -->
                <label class="flex items-center justify-between cursor-pointer group">
                    <span class="text-xs font-medium text-zinc-400 group-hover:text-zinc-300 transition-colors select-none">Don't confirm any emails</span>
                    <div class="relative flex items-center">
                        <input type="checkbox" class="peer sr-only">
                        <div class="w-8 h-4.5 bg-zinc-800 rounded-full peer-checked:bg-zinc-200 transition-colors border border-zinc-700 peer-checked:border-zinc-200"></div>
                        <div class="absolute left-[2px] top-[2px] w-3.5 h-3.5 bg-zinc-400 rounded-full peer-checked:translate-x-[14px] peer-checked:bg-[#09090b] transition-transform duration-200 ease-in-out shadow-sm"></div>
                    </div>
                </label>

                <!-- Custom Toggle 3 -->
                <label class="flex items-center justify-between cursor-pointer group">
                    <span class="text-xs font-medium text-zinc-400 group-hover:text-zinc-300 transition-colors select-none">Don't import any samples</span>
                    <div class="relative flex items-center">
                        <input type="checkbox" class="peer sr-only" checked>
                        <div class="w-8 h-4.5 bg-zinc-800 rounded-full peer-checked:bg-zinc-200 transition-colors border border-zinc-700 peer-checked:border-zinc-200"></div>
                        <div class="absolute left-[2px] top-[2px] w-3.5 h-3.5 bg-zinc-400 rounded-full peer-checked:translate-x-[14px] peer-checked:bg-[#09090b] transition-transform duration-200 ease-in-out shadow-sm"></div>
                    </div>
                </label>
            </div>

            <!-- Database Action -->
            <button class="w-full flex items-center justify-center gap-2 bg-transparent border border-zinc-800 hover:border-zinc-600 hover:bg-zinc-800/30 text-zinc-300 text-xs font-medium py-2.5 rounded-md transition-all shadow-sm group">
                <iconify-icon icon="solar:database-linear" class="text-zinc-500 group-hover:text-zinc-300 transition-colors"></iconify-icon>
                Create Database
            </button>
        </div>
    </aside>

</body>
</html>
