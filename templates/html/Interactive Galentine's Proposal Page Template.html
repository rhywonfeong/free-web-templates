<html lang="en"><head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galentine's Proposal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
/* Floating Animation */
@keyframes float {
0% { transform: translateY(0px); }
50% { transform: translateY(-8px); }
100% { transform: translateY(0px); }
}
.animate-float { animation: float 3s ease-in-out infinite; }
/* Shake Animation for 'No' */
@keyframes shake {
0%, 100% { transform: translateX(0); }
25% { transform: translateX(-4px); }
75% { transform: translateX(4px); }
}
.animate-shake { animation: shake 0.3s ease-in-out; }
/* Grow Animation */
@keyframes grow {
0% { transform: scale(0.9); opacity: 0; }
100% { transform: scale(1); opacity: 1; }
}
.animate-grow { animation: grow 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
/* Pop In */
@keyframes pop {
0% { transform: scale(0.95) translateY(10px); opacity: 0; }
100% { transform: scale(1) translateY(0); opacity: 1; }
}
.animate-pop { animation: pop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
/* Sway */
@keyframes sway {
0%, 100% { transform: rotate(-5deg); }
50% { transform: rotate(5deg); }
}
.animate-sway { animation: sway 2s ease-in-out infinite; }
</style></head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6 overflow-hidden relative selection:bg-rose-100 selection:text-rose-600">

    <!-- Ambient Background -->
    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-rose-200/40 rounded-full blur-[100px] -translate-y-1/2"></div>
        <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-indigo-200/40 rounded-full blur-[100px] translate-y-1/2"></div>
    </div>

    <!-- Main Card -->
    <main id="main-card" class="relative z-10 w-full max-w-md bg-white/90 backdrop-blur-xl border border-white/60 shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-3xl p-8 md:p-10 transition-all duration-500">
        
        <!-- Question View -->
        <div id="question-state" class="flex flex-col items-center text-center space-y-8">
            <!-- Hero Icon -->
            <div class="relative group cursor-default">
                <div class="absolute inset-0 bg-gradient-to-tr from-rose-200 to-indigo-200 rounded-full blur-xl opacity-40 group-hover:opacity-60 transition-opacity duration-500"></div>
                <div class="relative bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-float">
                    <iconify-icon icon="solar:heart-angle-linear" class="text-5xl text-rose-500"></iconify-icon>
                </div>
                <div class="absolute -right-8 top-0 animate-sway opacity-80">
                    <iconify-icon icon="solar:cupid-linear" class="text-3xl text-slate-400"></iconify-icon>
                </div>
            </div>

            <!-- Text Content -->
            <div class="space-y-2">
                <div class="inline-flex items-center gap-1.5 px-3 py-1 bg-rose-50 border border-rose-100 rounded-full mb-2">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
                    </span>
                    <span class="text-xs font-medium text-rose-600 uppercase tracking-wide">Question for you</span>
                </div>
                <h1 class="text-4xl font-semibold text-slate-900 tracking-tight leading-tight">
                    Will you be my <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-rose-500 to-indigo-600">Galentine?</span>
                </h1>
                <p id="sub-text" class="text-slate-500 font-medium pt-2 transition-colors duration-200">Date - this February?</p>
            </div>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row gap-3 w-full">
                <button id="yes-btn" class="group flex-1 h-12 flex items-center justify-center gap-2 bg-slate-900 hover:bg-slate-800 text-white rounded-xl transition-all shadow-lg shadow-slate-200 hover:shadow-xl active:scale-[0.98]">
                    <span class="font-medium">Yes, let's go</span>
                    <iconify-icon icon="solar:arrow-right-linear" class="text-lg group-hover:translate-x-0.5 transition-transform"></iconify-icon>
                </button>
                
                <button id="no-btn" class="group flex-1 h-12 flex items-center justify-center gap-2 bg-white hover:bg-rose-50 text-slate-600 hover:text-rose-600 border border-slate-200 hover:border-rose-200 rounded-xl transition-all active:scale-[0.98]">
                    <span id="no-text" class="font-medium">No thanks</span>
                </button>
            </div>
        </div>

        <!-- Success View (Hidden initially) -->
        <div id="success-state" class="hidden flex-col items-center w-full space-y-6 animate-pop">
            
            <!-- Dynamic Animation Stage -->
            <div id="gift-stage" class="w-full h-48 bg-slate-50 rounded-2xl border border-dashed border-slate-200 flex flex-col items-center justify-center relative overflow-hidden transition-all duration-300">
                <!-- Initial Success Message -->
                <div class="text-center p-6 animate-grow">
                    <div class="inline-flex items-center justify-center w-12 h-12 bg-green-100 text-green-600 rounded-full mb-3 ring-4 ring-green-50">
                        <iconify-icon icon="solar:check-circle-bold" class="text-2xl"></iconify-icon>
                    </div>
                    <h2 class="text-lg font-semibold text-slate-900 tracking-tight">You're the best!</h2>
                    <p class="text-sm text-slate-500 mt-1">Pick a gift to unwrap</p>
                </div>
            </div>

            <!-- Gift Selection Grid -->
            <div class="grid grid-cols-3 gap-3 w-full">
                <!-- Bouquet Option -->
                <button onclick="revealGift('bouquet')" class="group relative flex flex-col items-center gap-3 p-3 bg-white hover:bg-rose-50 border border-slate-200 hover:border-rose-200 rounded-xl transition-all active:scale-95">
                    <div class="w-10 h-10 flex items-center justify-center bg-rose-100 rounded-full text-rose-600 group-hover:scale-110 transition-transform">
                        <iconify-icon icon="solar:bouquet-linear" class="text-xl"></iconify-icon>
                    </div>
                    <span class="text-xs font-medium text-slate-600 group-hover:text-rose-600">Bouquet</span>
                </button>

                <!-- Teddy Option -->
                <button onclick="revealGift('teddy')" class="group relative flex flex-col items-center gap-3 p-3 bg-white hover:bg-indigo-50 border border-slate-200 hover:border-indigo-200 rounded-xl transition-all active:scale-95">
                    <div class="w-10 h-10 flex items-center justify-center bg-indigo-100 rounded-full text-indigo-600 group-hover:scale-110 transition-transform">
                        <iconify-icon icon="solar:cat-linear" class="text-xl"></iconify-icon>
                    </div>
                    <span class="text-xs font-medium text-slate-600 group-hover:text-indigo-600">Teddy</span>
                </button>

                <!-- Plants Option -->
                <button onclick="revealGift('plants')" class="group relative flex flex-col items-center gap-3 p-3 bg-white hover:bg-emerald-50 border border-slate-200 hover:border-emerald-200 rounded-xl transition-all active:scale-95">
                    <div class="w-10 h-10 flex items-center justify-center bg-emerald-100 rounded-full text-emerald-600 group-hover:scale-110 transition-transform">
                        <iconify-icon icon="solar:leaf-linear" class="text-xl"></iconify-icon>
                    </div>
                    <span class="text-xs font-medium text-slate-600 group-hover:text-emerald-600">Plants</span>
                </button>
            </div>
            
            <p class="text-xs text-slate-400 font-medium">See you soon <span class="text-rose-500">♥</span></p>
        </div>

    </main>

    <script>
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const noText = document.getElementById('no-text');
        const subText = document.getElementById('sub-text');
        const card = document.getElementById('main-card');
        const questionState = document.getElementById('question-state');
        const successState = document.getElementById('success-state');
        const stage = document.getElementById('gift-stage');

        // Handle "No" Interaction
        noBtn.addEventListener('click', () => {
            // Shake animation
            card.classList.remove('animate-shake');
            void card.offsetWidth; 
            card.classList.add('animate-shake');
            
            // Update UI
            noText.innerText = "Try again";
            subText.innerText = "Pretty please?";
            subText.classList.remove('text-slate-500');
            subText.classList.add('text-rose-500');
        });

        // Handle "Yes" Interaction
        yesBtn.addEventListener('click', () => {
            questionState.style.display = 'none';
            successState.classList.remove('hidden');
            successState.classList.add('flex');
            fireConfetti();
        });

        // Gift Logic
        function revealGift(type) {
            stage.innerHTML = '';
            let content = '';
            
            // Remove previous color classes
            stage.className = "w-full h-48 rounded-2xl border border-dashed flex flex-col items-center justify-center relative overflow-hidden transition-all duration-300";

            if (type === 'bouquet') {
                stage.classList.add('bg-rose-50/50', 'border-rose-200');
                content = `
                    <div class="animate-pop flex flex-col items-center">
                        <div class="relative">
                            <iconify-icon icon="solar:bouquet-linear" class="text-7xl text-rose-500 drop-shadow-sm"></iconify-icon>
                            <iconify-icon icon="solar:heart-bold" class="absolute -top-2 -right-2 text-rose-400 text-xl animate-bounce"></iconify-icon>
                            <iconify-icon icon="solar:heart-bold" class="absolute top-1/2 -left-4 text-rose-300 text-sm animate-pulse"></iconify-icon>
                        </div>
                        <p class="mt-4 text-sm font-semibold text-rose-600">A Bouquet for you!</p>
                    </div>
                `;
            } else if (type === 'teddy') {
                stage.classList.add('bg-indigo-50/50', 'border-indigo-200');
                content = `
                    <div class="animate-pop flex flex-col items-center">
                        <div class="flex items-center -space-x-4">
                             <iconify-icon icon="solar:cat-linear" class="text-6xl text-indigo-500 z-10"></iconify-icon>
                             <iconify-icon icon="solar:heart-angle-bold" class="text-4xl text-indigo-300 animate-pulse"></iconify-icon>
                        </div>
                        <p class="mt-4 text-sm font-semibold text-indigo-600">Big Hugs!</p>
                    </div>
                `;
            } else if (type === 'plants') {
                stage.classList.add('bg-emerald-50/50', 'border-emerald-200');
                content = `
                    <div class="animate-pop flex flex-col items-center">
                        <div class="flex items-end gap-2">
                             <iconify-icon icon="solar:leaf-linear" class="text-4xl text-emerald-400 animate-sway" style="animation-delay:0.1s"></iconify-icon>
                             <iconify-icon icon="solar:leaf-bold" class="text-6xl text-emerald-500 animate-sway"></iconify-icon>
                             <iconify-icon icon="solar:leaf-linear" class="text-4xl text-emerald-400 animate-sway" style="animation-delay:0.2s"></iconify-icon>
                        </div>
                        <p class="mt-4 text-sm font-semibold text-emerald-600">Growing Love!</p>
                    </div>
                `;
            }
            stage.innerHTML = content;
        }

        // Simple Confetti
        function fireConfetti() {
            const colors = ['#e11d48', '#4f46e5', '#10b981'];
            for(let i=0; i<30; i++) {
                const conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.width = Math.random() * 6 + 4 + 'px';
                conf.style.height = Math.random() * 6 + 4 + 'px';
                conf.style.background = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = Math.random() * 100 + '%';
                conf.style.top = '-10px';
                conf.style.opacity = '0.8';
                document.body.appendChild(conf);

                conf.animate([
                    { transform: `translateY(0) rotate(0deg)`, opacity: 1 },
                    { transform: `translateY(100vh) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: Math.random() * 2000 + 1500,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                }).onfinish = () => conf.remove();
            }
        }
    </script>
</body></html>
