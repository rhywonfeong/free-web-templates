  <meta charset="UTF-8">

  <title>Interactive Icon Component</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --iconScale: 1;
      --inactiveSize: 78;
      --activeSize: 88;
      --fontFamily: "sohne-var", "Helvetica Neue", "Arial", sans-serif;
    }
    
    .icon-component {
      color: #635bff;
      cursor: pointer;
      font-family: "sohne-var", "Helvetica Neue", "Arial", sans-serif;
      font-weight: 425;
      text-decoration-line: none;
      position: relative;
      width: 120px;
      height: 120px;
    }
    
    .icon {
      border-radius: 8px;
      transform: scale(calc(var(--iconScale)*var(--inactiveSize)/var(--activeSize)));
      transform-box: fill-box;
      transform-origin: center;
      align-items: center;
      display: flex;
      height: calc(1px*var(--activeSize));
      justify-content: center;
      left: calc(50% - 1px*var(--activeSize)/2);
      position: absolute;
      top: calc(50% - 1px*var(--activeSize)/2);
      width: calc(1px*var(--activeSize));
      transition: transform 0.2s ease;
    }
    
    .icon-solid {
      background-color: #fff;
      box-shadow: rgba(50, 50, 93, .25) 0 12.6px 25.2px -11.5733px, rgba(0, 0, 0, .1) 0 7.56px 15.12px -7.56px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    
    .icon-logo {
      transform-origin: center top;
      transform-box: fill-box;
    }
    
    .icon-logo svg {
      display: block;
    }
    
    .icon-label {
      bottom: 0;
      color: #2e3a55;
      font-family: var(--fontFamily);
      font-size: 12px;
      letter-spacing: 0.2px;
      line-height: 15px;
      opacity: 0;
      position: absolute;
      text-align: center;
      width: 100%;
      transition: opacity 0.2s ease;
    }
    
    .icon-component:hover .icon-solid,
    .icon-component:hover .icon-label {
      opacity: 1;
    }
    
    .icon-component:hover .icon {
      transform: scale(1);
    }
    
    @media (pointer:fine) {
      .icon-component {
        color: #0a2540;
      }
    }
    
    *, ::after, ::before {
      box-sizing: border-box;
    }
  </style>
</head>
