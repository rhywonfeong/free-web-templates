<body class="bg-rose-50 min-h-screen flex flex-col items-center justify-center overflow-hidden relative selection:bg-rose-200 selection:text-rose-900">

    <main class="relative z-10 w-full max-w-[480px] p-6">

            <!-- Memory Image -->
            <div class="relative w-full aspect-[4/3] rounded-2xl overflow-hidden bg-rose-100 shadow-inner mb-8 group">

                    onerror="this.src='https://images.unsplash.com/photo-1518568814500-bf0f8d125f46?q=80&w=800&auto=format&fit=crop'"

    <script>
        function sayYes() {
            const btnContainer = document.getElementById("buttons-container");
            const message = document.getElementById("message");
            
            // Graceful exit for buttons
            btnContainer.style.opacity = '0';
            btnContainer.style.transform = 'scale(0.95)';
            btnContainer.style.pointerEvents = 'none';
            
            setTimeout(() => {
                btnContainer.style.display = 'none';
                message.classList.remove('hidden');
                // Force reflow
                void message.offsetWidth;
                message.classList.remove('opacity-0', 'translate-y-4');
                spawnConfetti();
            }, 300);
        }

        function moveButton() {
            const btn = document.getElementById("no-btn");
            
            // Calculate safe area (viewport minus button size and padding)
            const padding = 20;
            const btnWidth = btn.offsetWidth;
            const btnHeight = btn.offsetHeight;
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;
            
            const newX = Math.max(padding, Math.random() * maxX);
            const newY = Math.max(padding, Math.random() * maxY);

            // Use fixed positioning to escape the flex container smoothly
            btn.style.position = "fixed";
            btn.style.transition = "all 0.3s cubic-bezier(0.4, 0, 0.2, 1)";
            btn.style.left = newX + "px";
            btn.style.top = newY + "px";
            
            // Dynamic icon change for fun
            const icons = ['solar:sad-circle-linear', 'solar:confounded-circle-linear', 'solar:expressionless-circle-linear'];
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];
            btn.querySelector('iconify-icon').setAttribute('icon', randomIcon);
        }

        function spawnConfetti() {
            const colors = ['#f43f5e', '#fb7185', '#fda4af', '#ffe4e6'];
            const duration = 3000;
            const end = Date.now() + duration;

            (function frame() {
                const particle = document.createElement('div');
                particle.innerHTML = '❤️';
                particle.style.position = 'fixed';
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.top = '-20px';
                particle.style.fontSize = Math.random() * 20 + 10 + 'px';
                particle.style.zIndex = '100';
                particle.style.opacity = '1';
                particle.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
                particle.style.transition = 'top 2s ease-in, opacity 2s ease-in';
                
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.style.top = '105vh';
                    particle.style.opacity = '0';
                }, 50);

                setTimeout(() => particle.remove(), 2000);

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
