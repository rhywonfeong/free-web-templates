<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

  <meta charset="UTF-8">
  <title>Event Modal – Segment Accent On Click</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#17181A] flex items-center justify-center min-h-screen">
  <div
    style="border-radius:40px; border:1px solid #000; background:#000;"
    class="w-full max-w-[390px] shadow-lg flex flex-col pb-6 pt-4"
  >
    <div class="flex items-center justify-end px-6 pt-2 pb-2">
      <div class="flex-1 text-center text-[#FCFCFC] font-semibold text-lg select-none">New Event</div>
      <button type="button" class="rounded-lg p-2 ml-auto hover:bg-[#1B1D22]"
        onclick="document.body.firstElementChild.style.display='none'">
        <svg width="18" height="18" fill="none" viewBox="0 0 18 18">
          <path d="M4 4l10 10M14 4l-10 10" stroke="#BBC3C9" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <!-- Segmented control -->
    <div class="w-full px-5 mb-2">
      <div id="catWrap" class="flex gap-2 w-full overflow-x-auto snap-x">
        <button type="button"
          class="cat-btn shrink-0 px-4 py-1 rounded-md font-medium transition
            bg-[#00BAF4] border border-[#00BAF4] text-[#000] ring-1 ring-[#00BAF4] font-semibold
          "
          data-cat="Personal">Personal</button>
        <button type="button"
          class="cat-btn shrink-0 px-4 py-1 rounded-md font-medium transition
            bg-[#1B1D22] border border-[#22262F] text-[#BBC3C9]
          "
          data-cat="Work">Work</button>
        <button type="button"
          class="cat-btn shrink-0 px-4 py-1 rounded-md font-medium transition
            bg-[#1B1D22] border border-[#22262F] text-[#BBC3C9]
          "
          data-cat="Family">Family</button>
        <button type="button"
          class="cat-btn shrink-0 px-4 py-1 rounded-md font-medium transition
            bg-[#1B1D22] border border-[#22262F] text-[#BBC3C9]
          "
          data-cat="Health">Health</button>
      </div>
      <input type="hidden" id="category" name="category" value="Personal">
    </div>
    <form id="eventForm" class="flex flex-col" autocomplete="off">
      <div class="px-6 pt-2 flex flex-col gap-3">
        <div class="bg-[#1B1D22] rounded-lg">
          <input name="title" required minlength="2" class="w-full text-base font-semibold bg-transparent text-[#FCFCFC] border-0 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#00BAF4] placeholder-[#535D6C]" placeholder="Title">
        </div>
        <div class="bg-[#1B1D22] rounded-lg">
          <input name="location" class="w-full text-base bg-transparent text-[#FCFCFC] border-0 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#00BAF4] placeholder-[#535D6C]" placeholder="Location">
        </div>
      </div>
      <div class="flex gap-3 px-6 pt-2">
        <div class="flex-1 flex flex-col gap-2">
          <label class="block text-xs text-[#727C8C] ml-1 mb-1">Start</label>
          <div class="bg-[#1B1D22] rounded-lg flex items-center px-3 py-2">
            <input required name="startDate" type="date" value="2024-08-28" class="bg-transparent outline-none w-24 text-[#FCFCFC] text-[15px]" style="color-scheme:dark;">
          </div>
          <div class="bg-[#1B1D22] rounded-lg flex items-center px-3 py-2">
            <input id="startTime" required name="startTime" type="time" value="10:00" class="bg-transparent outline-none w-16 text-[#FCFCFC] text-[15px]" style="color-scheme:dark;">
          </div>
        </div>
        <div class="flex-1 flex flex-col gap-2">
          <label class="block text-xs text-[#727C8C] ml-1 mb-1">End</label>
          <div class="bg-[#1B1D22] rounded-lg flex items-center px-3 py-2">
            <input required name="endDate" type="date" value="2024-08-28" class="bg-transparent outline-none w-24 text-[#FCFCFC] text-[15px]" style="color-scheme:dark;">
          </div>
          <div class="bg-[#1B1D22] rounded-lg flex items-center px-3 py-2">
            <input id="endTime" required name="endTime" type="time" value="11:00" class="bg-transparent outline-none w-16 text-[#FCFCFC] text-[15px]" style="color-scheme:dark;">
          </div>
        </div>
      </div>
      <div class="flex items-center justify-between mt-3 px-6">
        <span class="text-[#FCFCFC] text-[16px] font-medium">All day</span>
        <label class="inline-flex relative items-center cursor-pointer">
          <input type="checkbox" id="allDay" name="allDay" class="sr-only peer">
          <div class="w-11 h-6 bg-[#191D22] border border-[#31343F] peer-focus:outline-none rounded-full peer peer-checked:bg-[#00BAF4] transition-all"></div>
          <div class="absolute left-0.5 top-1/2 -translate-y-1/2 w-5 h-5 bg-[#1B1D22] border border-[#31343F] rounded-full transition-all peer-checked:translate-x-5"></div>
        </label>
      </div>
      <div class="flex flex-col gap-3 px-6 pt-4">
        <div class="bg-[#1B1D22] rounded-lg">
          <input name="url" type="url" class="w-full text-base bg-transparent text-[#FCFCFC] border-0 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#00BAF4] placeholder-[#535D6C]" placeholder="Add URL">
        </div>
        <div class="bg-[#1B1D22] rounded-lg">
          <textarea name="notes" rows="2" class="w-full text-base bg-transparent text-[#FCFCFC] border-0 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#00BAF4] placeholder-[#535D6C] resize-none" placeholder="Notes"></textarea>
        </div>
        <div class="flex gap-3 mt-1 items-center bg-[#1B1D22] rounded-lg px-3 py-2">
          <label class="flex items-center text-[#00BAF4] hover:text-[#00BAF4]/80 text-sm cursor-pointer">
            <svg width="18" height="18" fill="none" viewBox="0 0 18 18" class="mr-1">
              <path d="M7.5 11.5l7-7M7.5 11.5H4v-3.5" stroke="#00BAF4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Add File
            <input name="attachments" id="attachments" type="file" multiple hidden>
          </label>
          <div id="fileList" class="text-xs text-[#00BAF4]"></div>
        </div>
      </div>
      <div class="flex items-center justify-between gap-2 px-6 py-4">
        <span class="text-[#C2C6CB] text-[15px]">Add Invitees</span>
        <button type="button" id="addInviteeBtn" class="bg-[#00BAF4] hover:bg-[#0998C0] text-white rounded-md w-9 h-9 flex items-center justify-center transition">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div id="inviteesList" class="px-6 flex flex-wrap gap-2"></div>
      <div class="px-6 flex gap-3 mt-4">
        <button type="submit" class="flex-1 bg-[#00BAF4] hover:bg-[#0998C0] text-black font-semibold py-3 rounded-md text-[17px] transition">Create</button>
        <button type="button" class="flex-1 bg-[#1B1D22] hover:bg-[#23262F] text-[#BBC3C9] border border-[#31343F] font-semibold py-3 rounded-md text-[17px] transition">List</button>
      </div>
    </form>
    <div class="flex justify-center mt-6"><div class="w-[120px] h-1.5 bg-[#31343F] rounded-full"></div></div>
  </div>
  <script>
    // Only clicked/selected segment uses accent fill
    document.querySelectorAll('.cat-btn').forEach((btn, idx, all)=>{
      btn.addEventListener('click', function () {
        all.forEach(b => {
          b.classList.remove(
            "bg-[#00BAF4]", "ring-1", "ring-[#00BAF4]", "border-[#00BAF4]", "text-[#000]", "font-semibold"
          );
          b.classList.add(
            "bg-[#1B1D22]", "border-[#22262F]", "text-[#BBC3C9]"
          );
        });
        btn.classList.remove("bg-[#1B1D22]", "border-[#22262F]", "text-[#BBC3C9]");
        btn.classList.add("bg-[#00BAF4]", "ring-1", "ring-[#00BAF4]", "border-[#00BAF4]", "text-[#000]", "font-semibold");
        document.getElementById('category').value = btn.dataset.cat;
      });
    });
    document.getElementById('allDay').addEventListener('change', function() {
      const dis = this.checked;
      document.getElementById('startTime').disabled = dis;
      document.getElementById('endTime').disabled = dis;
      document.getElementById('startTime').classList.toggle('opacity-40',dis);
      document.getElementById('endTime').classList.toggle('opacity-40',dis);
    });
    document.getElementById('attachments').addEventListener('change', function () {
      let s = '';
      if (this.files.length)
        Array.from(this.files).forEach(f=>s+=`<span>${f.name}</span> `);
      document.getElementById('fileList').innerHTML = s;
    });
    const invitees = [];
    function renderInvitees() {
      const list = document.getElementById('inviteesList');
      list.innerHTML = '';
      invitees.forEach((mail,i) => {
        const badge = document.createElement('span');
        badge.className = "flex items-center px-3 py-1 rounded bg-[#191D22] text-[#00BAF4] border border-[#00BAF4] text-sm";
        badge.innerHTML = `${mail}<button type="button" class="ml-1" onclick='invitees.splice(${i},1);renderInvitees();'><svg width="14" height="14" fill="none" viewBox="0 0 18 18"><path d="M4 4l10 10M14 4l-10 10" stroke="#00BAF4" stroke-width="1.5" stroke-linecap="round"/></svg></button>`;
        list.appendChild(badge);
      });
    }
    document.getElementById('addInviteeBtn').onclick = () => {
      let email = prompt("Enter email address:");
      if(email && /\S+@\S+\.\S+/.test(email)) { invitees.push(email); renderInvitees(); }
      else if(email) alert("Invalid email");
    };
    document.getElementById('eventForm').onsubmit = e=>{e.preventDefault();alert('Event created!');};
  </script>
</body>
</html>
