    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DesignForge Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=-apple-system,BlinkMacSystemFont,Segoe+UI,Roboto,sans-serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            min-height: 100vh;
            min-width: 100vw;
        }
        .mac-window {
            background: #2d2d2d;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }
        .mac-titlebar {
            background: linear-gradient(180deg, #3a3a3a 0%, #2d2d2d 100%);
            height: 52px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            padding: 0 20px;
            -webkit-app-region: drag;
        }
        .traffic-lights {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }
        .traffic-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 0.5px solid rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .traffic-light.close {
            background: linear-gradient(135deg, #ff5f57 0%, #ff3b30 100%);
        }
        .traffic-light.minimize {
            background: linear-gradient(135deg, #ffbd2e 0%, #ff9500 100%);
        }
        .traffic-light.maximize {
            background: linear-gradient(135deg, #28ca42 0%, #30d158 100%);
        }
        .traffic-light:hover {
            transform: scale(1.1);
            filter: brightness(1.1);
        }
        .mac-toolbar {
            background: linear-gradient(180deg, #3a3a3a 0%, #333333 100%);
            border-bottom: 1px solid rgba(0, 0, 0, 0.2);
            height: 48px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }
        .toolbar-segment {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
        }
        .toolbar-divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.1);
        }
        .mac-button {
            background: linear-gradient(180deg, #4a4a4a 0%, #3a3a3a 100%);
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            color: #ffffff;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.5);
        }
        .mac-button:hover {
            background: linear-gradient(180deg, #5a5a5a 0%, #4a4a4a 100%);
        }
        .mac-button:active {
            background: linear-gradient(180deg, #3a3a3a 0%, #2a2a2a 100%);
            transform: translateY(1px);
        }
        .mac-button.primary {
            background: linear-gradient(180deg, #007aff 0%, #0056cc 100%);
            border-color: #0056cc;
        }
        .mac-button.primary:hover {
            background: linear-gradient(180deg, #1e8eff 0%, #0066dd 100%);
        }
        .sidebar-mac {
            background: linear-gradient(180deg, #2a2a2a 0%, #242424 100%);
            border-right: 1px solid rgba(0, 0, 0, 0.3);
            width: 72px;
        }
        .sidebar-tool {
            width: 48px;
            height: 48px;
            margin: 6px auto;
            background: linear-gradient(180deg, #3a3a3a 0%, #2d2d2d 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .sidebar-tool:hover {
            background: linear-gradient(180deg, #4a4a4a 0%, #3d3d3d 100%);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .sidebar-tool.active {
            background: linear-gradient(180deg, #007aff 0%, #0056cc 100%);
            border-color: #0056cc;
            box-shadow: 0 0 0 1px rgba(0, 122, 255, 0.3);
        }
        .canvas-area-mac {
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 8px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }
        .grid-overlay {
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .properties-panel {
            background: linear-gradient(180deg, #2a2a2a 0%, #242424 100%);
            border-left: 1px solid rgba(0, 0, 0, 0.3);
            width: 280px;
        }
        .panel-section {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
        }
        .mac-input {
            background: #1a1a1a;
            border: 1px solid #404040;
            border-radius: 4px;
            color: #ffffff;
            padding: 6px 8px;
            font-size: 13px;
            width: 100%;
        }
        .mac-input:focus {
            outline: none;
            border-color: #007aff;
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
        }
        .selection-ring {
            animation: selection-pulse 2s ease-in-out infinite;
            border: 2px dashed #007aff;
        }
        @keyframes selection-pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        .status-bar {
            background: linear-gradient(180deg, #333333 0%, #2a2a2a 100%);
            border-top: 1px solid rgba(0, 0, 0, 0.3);
            height: 28px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            font-size: 12px;
            color: #a0a0a0;
        }
    </style>
</head>
<body>
    <!-- macOS Window Frame -->
    <div class="mac-window w-full h-full max-w-screen max-h-screen">
        <!-- Title Bar -->
        <div class="mac-titlebar">
            <div class="traffic-lights">
                <div class="traffic-light close"></div>
                <div class="traffic-light minimize"></div>
                <div class="traffic-light maximize"></div>
            </div>
            <div class="flex-1 text-center">
                <span class="text-white text-sm font-medium">DesignForge Studio — Untitled Project</span>
            </div>
            <div class="w-60"></div>
        </div>

        <!-- Toolbar -->
        <div class="mac-toolbar">
            <div class="toolbar-segment">
                <button class="mac-button">
                    <i class="fas fa-file mr-1"></i>New
                </button>
                <button class="mac-button">
                    <i class="fas fa-folder-open mr-1"></i>Open
                </button>
                <button class="mac-button primary">
                    <i class="fas fa-save mr-1"></i>Save
                </button>
            </div>
            
            <div class="toolbar-divider"></div>
            
            <div class="toolbar-segment">
                <button class="mac-button">
                    <i class="fas fa-undo"></i>
                </button>
                <button class="mac-button">
                    <i class="fas fa-redo"></i>
                </button>
            </div>
            
            <div class="toolbar-divider"></div>
            
            <div class="toolbar-segment">
                <button class="mac-button">
                    <i class="fas fa-copy mr-1"></i>Copy
                </button>
                <button class="mac-button">
                    <i class="fas fa-paste mr-1"></i>Paste
                </button>
            </div>
            
            <div class="flex-1"></div>
            
            <div class="toolbar-segment">
                <span class="text-white text-sm">100%</span>
                <button class="mac-button">
                    <i class="fas fa-search-plus"></i>
                </button>
                <button class="mac-button">
                    <i class="fas fa-search-minus"></i>
                </button>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex h-full">
            <!-- Left Sidebar -->
            <div class="sidebar-mac flex flex-col py-4">
                <div class="text-center mb-4">
                    <div class="text-white text-lg font-bold">DF</div>
                </div>
                
                <div class="sidebar-tool active">
                    <i class="fas fa-mouse-pointer"></i>
                </div>
                <div class="sidebar-tool">
                    <i class="fas fa-square"></i>
                </div>
                <div class="sidebar-tool">
                    <i class="fas fa-circle"></i>
                </div>
                <div class="sidebar-tool">
                    <i class="fas fa-font"></i>
                </div>
                <div class="sidebar-tool">
                    <i class="fas fa-paint-brush"></i>
                </div>
                <div class="sidebar-tool">
                    <i class="fas fa-vector-square"></i>
                </div>
                
                <div class="flex-1"></div>
                
                <div class="sidebar-tool">
                    <i class="fas fa-layer-group"></i>
                </div>
                <div class="sidebar-tool">
                    <i class="fas fa-cog"></i>
                </div>
            </div>

            <!-- Canvas Area -->
            <div class="flex-1 p-6 bg-gray-800">
                <div class="canvas-area-mac w-full h-full relative overflow-hidden">
                    <!-- Grid Background -->
                    <div class="absolute inset-0 grid-overlay"></div>
                    
                    <!-- Design Elements -->
                    <div class="absolute top-16 left-16 w-32 h-24 bg-gradient-to-br from-blue-500 to-blue-700 rounded-lg shadow-lg"></div>
                    <div class="absolute top-32 right-24 w-48 h-16 bg-gradient-to-r from-purple-500 to-pink-500 rounded-lg shadow-lg flex items-center justify-center text-white font-medium">
                        Sample Text Element
                    </div>
                    <div class="absolute bottom-24 left-1/3 w-20 h-20 bg-gradient-to-br from-green-500 to-emerald-600 rounded-full shadow-lg"></div>
                    
                    <!-- Selection Ring -->
                    <div class="absolute top-32 right-24 w-48 h-16 selection-ring rounded-lg pointer-events-none"></div>
                </div>
            </div>

            <!-- Right Properties Panel -->
            <div class="properties-panel">
                <div class="panel-section">
                    <h3 class="text-white font-medium text-sm mb-3">Transform</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="text-gray-300 text-xs block mb-1">Position</label>
                            <div class="flex gap-2">
                                <input class="mac-input text-xs" placeholder="X: 120" />
                                <input class="mac-input text-xs" placeholder="Y: 80" />
                            </div>
                        </div>
                        <div>
                            <label class="text-gray-300 text-xs block mb-1">Size</label>
                            <div class="flex gap-2">
                                <input class="mac-input text-xs" placeholder="W: 200" />
                                <input class="mac-input text-xs" placeholder="H: 150" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3 class="text-white font-medium text-sm mb-3">Appearance</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="text-gray-300 text-xs block mb-1">Fill</label>
                            <div class="flex items-center gap-2">
                                <div class="w-6 h-6 bg-gradient-to-br from-purple-500 to-pink-500 rounded border border-gray-600"></div>
                                <span class="text-white text-xs">Gradient</span>
                            </div>
                        </div>
                        <div>
                            <label class="text-gray-300 text-xs block mb-1">Opacity</label>
                            <input type="range" class="w-full" min="0" max="100" value="100" />
                        </div>
                    </div>
                </div>

                <div class="panel-section flex-1">
                    <h3 class="text-white font-medium text-sm mb-3">Layers</h3>
                    <div class="space-y-1">
                        <div class="bg-gray-700/50 rounded p-2 flex items-center gap-2 text-xs">
                            <i class="fas fa-eye text-blue-400 w-3"></i>
                            <span class="text-white flex-1">Rectangle</span>
                            <i class="fas fa-lock text-gray-500 w-3"></i>
                        </div>
                        <div class="bg-blue-600/30 border border-blue-500 rounded p-2 flex items-center gap-2 text-xs">
                            <i class="fas fa-eye text-blue-400 w-3"></i>
                            <span class="text-white flex-1">Text Layer</span>
                        </div>
                        <div class="bg-gray-700/50 rounded p-2 flex items-center gap-2 text-xs">
                            <i class="fas fa-eye text-blue-400 w-3"></i>
                            <span class="text-white flex-1">Circle</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span>Canvas: 1920×1080px</span>
            <span class="mx-2">•</span>
            <span>Selection: Text Layer</span>
            <div class="flex-1"></div>
            <span>Ready</span>
        </div>
    </div>
</body>
