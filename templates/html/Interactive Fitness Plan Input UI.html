  <meta charset="UTF-8">
  <title>Apple Style Fitness Plan – Polished Slider</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin:0;}
    input[type=number] { -moz-appearance: textfield; }
    input[readonly] { pointer-events:none; user-select:none; background:transparent;}
    /* Slider styles */
    .slider-container {
      position: relative;
      width: 100%;
      height: 28px;
      display: flex;
      align-items: center;
    }
    .slider-track-bg {
      width: 100%;
      height: 12px;
      border-radius: 9999px;
      background: #f4f6fa;
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      z-index: 1;
      box-shadow: 0 1px 2px 0 #0001;
    }
    .slider-track-bar {
      position: absolute;
      height: 12px;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      border-radius: 9999px;
      background: linear-gradient(90deg, #a5d8ff 0%, #3b82f6 50%, #2563eb 100%);
      z-index: 2;
      transition: width 0.2s;
      box-shadow: 0 2px 8px 0 #2563eb22;
    }
    .bpm-slider {
      position: absolute;
      width: 100%;
      height: 28px;
      left: 0; top: 0;
      background: transparent;
      outline: none;
      margin: 0;
      z-index: 5;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
    }
    .bpm-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 32px;
      width: 32px;
      background: #fff;
      border: 4px solid #2563eb;
      border-radius: 50%;
      box-shadow: 0 4px 24px 0 #2563eb22, 0 1px 8px #3b82f626;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .bpm-slider:focus::-webkit-slider-thumb {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 5px #a5d8ff85, 0 4px 24px #2563eb22;
    }
    .bpm-slider::-moz-range-thumb {
      height: 32px;
      width: 32px;
      background: #fff;
      border: 4px solid #2563eb;
      border-radius: 50%;
      box-shadow: 0 4px 24px 0 #2563eb22, 0 1px 8px #3b82f626;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .bpm-slider:focus::-moz-range-thumb {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 5px #a5d8ff95, 0 4px 24px #2563eb22;
    }
    .bpm-slider::-ms-thumb {
      height: 32px;
      width: 32px;
      background: #fff;
      border: 4px solid #2563eb;
      border-radius: 50%;
      box-shadow: 0 4px 24px 0 #2563eb22, 0 1px 8px #3b82f626;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .bpm-slider:focus::-ms-thumb {
      border-color: #1d4ed8;
      box-shadow: 0 0 0 5px #a5d8ff65, 0 4px 24px #2563eb22;
    }
    .bpm-slider::-webkit-slider-runnable-track {
      height: 28px;
      background: transparent;
    }
    .bpm-slider::-moz-range-track { background: transparent; height: 28px;}
    .bpm-slider::-ms-fill-lower { background: transparent; }
    .bpm-slider::-ms-fill-upper { background: transparent; }
    .bpm-slider:focus { outline: none; }
    button:focus { outline: none; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-white min-h-screen flex items-center justify-center font-sans antialiased">
  <main class="bg-white max-w-md w-full rounded-3xl shadow-2xl px-8 py-10 flex flex-col gap-8 border border-gray-100">
    <header>
      <h1 class="text-[2rem] font-bold text-gray-900 tracking-tight mb-1">Push Yourself <span class="text-blue-500">Harder</span></h1>
      <p class="text-gray-500 text-base leading-snug">Progress is the sum of small efforts, repeated every day.</p>
    </header>
    <section class="flex flex-col gap-6">
      <h2 class="text-lg font-semibold text-gray-800">Plan Your Training</h2>
      <p class="text-sm text-gray-500 mb-2 border-l-4 border-blue-100 pl-3 py-1">Stay consistent. Make excellence a habit.</p>
      <div class="grid grid-cols-2 gap-5 mb-4">
        <!-- Age -->
        <div>
          <div class="text-xs text-gray-400 tracking-widest uppercase flex justify-center mb-1">Age</div>
          <div class="flex items-center justify-center bg-gray-50 rounded-xl border border-gray-100 py-3">
            <button id="age-dec" class="text-xl font-light px-2 text-blue-400 focus:bg-blue-100 rounded-full transition" type="button" aria-label="Decrease age">&minus;</button>
            <input id="age-input" type="number" min="10" max="99" value="21"
              class="w-12 mx-1 text-center text-xl font-semibold text-gray-900 bg-transparent border-0"
              readonly aria-label="Age" />
            <button id="age-inc" class="text-xl font-light px-2 text-blue-400 focus:bg-blue-100 rounded-full transition" type="button" aria-label="Increase age">&plus;</button>
          </div>
          <div id="age-feedback" class="text-xs text-red-400 text-center h-4"></div>
        </div>
        <!-- Height -->
        <div>
          <div class="text-xs text-gray-400 tracking-widest uppercase flex justify-center mb-1">Height</div>
          <div class="flex items-center justify-center bg-gray-50 rounded-xl border border-gray-100 py-3">
            <button id="height-dec" class="text-xl font-light px-2 text-blue-400 focus:bg-blue-100 rounded-full transition" type="button" aria-label="Decrease height">&minus;</button>
            <input id="height-input" type="number" min="100" max="250" value="160"
              class="w-14 mx-1 text-center text-xl font-semibold text-gray-900 bg-transparent border-0"
              readonly aria-label="Height" />
            <span class="ml-1 text-xs text-gray-400">cm</span>
            <button id="height-inc" class="text-xl font-light px-2 text-blue-400 focus:bg-blue-100 rounded-full transition" type="button" aria-label="Increase height">&plus;</button>
          </div>
          <div id="height-feedback" class="text-xs text-red-400 text-center h-4"></div>
        </div>
      </div>
      <!-- BPM -->
      <div>
        <div class="flex items-center justify-between text-xs text-gray-400 mb-2">
          <span>BPM</span>
          <span id="bpm-value" class="text-gray-600 font-semibold">89</span>
        </div>
        <div class="slider-container mb-2">
          <div class="slider-track-bg"></div>
          <div id="bpm-bar" class="slider-track-bar" style="width:29%"></div>
          <input id="bpm-slider" type="range" min="60" max="160" value="89" step="1"
            class="bpm-slider" aria-label="BPM" />
        </div>
      </div>
    </section>
    <div class="flex flex-col gap-3 mt-4">
      <button id="get-started-btn"
        class="w-full py-3 rounded-full bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-semibold shadow disabled:opacity-40 disabled:cursor-not-allowed focus:ring-2 focus:ring-blue-300 focus:ring-offset-2 transition select-none"
        disabled
      >Get Started</button>
    </div>
  </main>
  <script>
    // Grab elements
    const ageInput = document.getElementById('age-input');
    const ageFeedback = document.getElementById('age-feedback');
    const ageDec = document.getElementById('age-dec');
    const ageInc = document.getElementById('age-inc');
    const heightInput = document.getElementById('height-input');
    const heightFeedback = document.getElementById('height-feedback');
    const heightDec = document.getElementById('height-dec');
    const heightInc = document.getElementById('height-inc');
    const bpmSlider = document.getElementById('bpm-slider');
    const bpmValue = document.getElementById('bpm-value');
    const bpmBar = document.getElementById('bpm-bar');
    const getStartedBtn = document.getElementById('get-started-btn');

    function clamp(val, min, max) {
      val = parseInt(val);
      if (isNaN(val)) return min;
      return Math.max(min, Math.min(max, val));
    }
    function validateInputs() {
      let valid = true;
      const age = parseInt(ageInput.value) || 0;
      if (age < 10 || age > 99) {
        ageFeedback.textContent = "Age 10–99";
        valid = false;
      } else {
        ageFeedback.textContent = "";
      }
      const height = parseInt(heightInput.value) || 0;
      if (height < 100 || height > 250) {
        heightFeedback.textContent = "100–250";
        valid = false;
      } else {
        heightFeedback.textContent = "";
      }
      getStartedBtn.disabled = !valid;
      return valid;
    }
    // Age controls
    ageInc.addEventListener('click', () => {
      let v = clamp(Number(ageInput.value) + 1, 10, 99);
      ageInput.value = v;
      validateInputs();
    });
    ageDec.addEventListener('click', () => {
      let v = clamp(Number(ageInput.value) - 1, 10, 99);
      ageInput.value = v;
      validateInputs();
    });
    // Height controls
    heightInc.addEventListener('click', () => {
      let v = clamp(Number(heightInput.value) + 1, 100, 250);
      heightInput.value = v;
      validateInputs();
    });
    heightDec.addEventListener('click', () => {
      let v = clamp(Number(heightInput.value) - 1, 100, 250);
      heightInput.value = v;
      validateInputs();
    });
    // BPM Slider
    function setBpmBar(val) {
      let percent = ((val - 60) / 100) * 100;
      percent = Math.max(0, Math.min(100, percent));
      bpmBar.style.width = percent + "%";
    }
    bpmSlider.addEventListener('input', () => {
      bpmValue.textContent = bpmSlider.value;
      setBpmBar(bpmSlider.value);
    });
    // Initial render
    setBpmBar(bpmSlider.value);
    validateInputs();
  </script>
</body>
</html>
