    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Plasma Effect Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes plasma1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(50px, -30px) rotate(90deg) scale(1.2); }
            50% { transform: translate(-20px, 40px) rotate(180deg) scale(0.8); }
            75% { transform: translate(-40px, -20px) rotate(270deg) scale(1.1); }
        }
        
        @keyframes plasma2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); }
            33% { transform: translate(-60px, 50px) rotate(120deg) scale(1.3); }
            66% { transform: translate(40px, -60px) rotate(240deg) scale(0.7); }
        }
        
        @keyframes wave1 {
            0% { d: path('M0,50 Q25,10 50,50 T100,50'); }
            50% { d: path('M0,50 Q25,90 50,50 T100,50'); }
            100% { d: path('M0,50 Q25,10 50,50 T100,50'); }
        }
        
        @keyframes colorShift {
            0% { filter: hue-rotate(0deg) saturate(100%) brightness(1); }
            25% { filter: hue-rotate(90deg) saturate(150%) brightness(1.2); }
            50% { filter: hue-rotate(180deg) saturate(200%) brightness(0.8); }
            75% { filter: hue-rotate(270deg) saturate(120%) brightness(1.1); }
            100% { filter: hue-rotate(360deg) saturate(100%) brightness(1); }
        }
        
        .plasma-layer {
            mix-blend-mode: screen;
            animation: colorShift 8s ease-in-out infinite;
        }
        
        .wave-line {
            animation: plasma1 12s ease-in-out infinite;
        }
        
        .wave-line:nth-child(2n) {
            animation: plasma2 10s ease-in-out infinite reverse;
        }
        
        .wave-line:nth-child(3n) {
            animation: plasma1 15s ease-in-out infinite;
            animation-delay: -2s;
        }
    </style>
</head>
<body class="bg-black min-h-screen overflow-hidden">
    <div class="relative w-full h-screen">
        <!-- Control Panel -->
        <div class="absolute top-4 left-4 z-50 bg-gray-900/80 backdrop-blur-sm p-4 rounded-lg border border-gray-700">
            <h3 class="text-white text-sm font-bold mb-3">Plasma Controls</h3>
            <div class="space-y-2">
                <label class="flex items-center space-x-2">
                    <span class="text-xs text-gray-300 w-16">Speed:</span>
                    <input type="range" min="0.5" max="3" step="0.1" value="1" class="w-20 h-1 bg-gray-600 rounded-lg" id="speedControl">
                </label>
                <label class="flex items-center space-x-2">
                    <span class="text-xs text-gray-300 w-16">Intensity:</span>
                    <input type="range" min="0.3" max="2" step="0.1" value="1" class="w-20 h-1 bg-gray-600 rounded-lg" id="intensityControl">
                </label>
                <label class="flex items-center space-x-2">
                    <span class="text-xs text-gray-300 w-16">Waves:</span>
                    <input type="range" min="3" max="12" step="1" value="6" class="w-20 h-1 bg-gray-600 rounded-lg" id="waveControl">
                </label>
                <button class="text-xs bg-purple-600 hover:bg-purple-700 px-3 py-1 rounded text-white" onclick="randomizeEffect()">Randomize</button>
            </div>
        </div>

        <!-- Plasma Background Layers -->
        <div class="plasma-layer absolute inset-0 opacity-80">
            <div class="absolute inset-0 bg-gradient-radial from-purple-500/60 via-blue-600/40 to-transparent"
                 style="animation: plasma1 20s ease-in-out infinite;"></div>
        </div>
        
        <div class="plasma-layer absolute inset-0 opacity-70">
            <div class="absolute inset-0 bg-gradient-radial from-pink-500/50 via-cyan-500/30 to-transparent"
                 style="animation: plasma2 18s ease-in-out infinite reverse;"></div>
        </div>
        
        <div class="plasma-layer absolute inset-0 opacity-60">
            <div class="absolute inset-0 bg-gradient-radial from-orange-500/40 via-green-500/25 to-transparent"
                 style="animation: plasma1 25s ease-in-out infinite; animation-delay: -5s;"></div>
        </div>

        <!-- Wavy Lines Container -->
        <div id="wavyLinesContainer" class="absolute inset-0">
            <!-- Horizontal Wavy Lines -->
            <svg class="wave-line absolute inset-0 w-full h-full opacity-60" viewBox="0 0 100 100" preserveAspectRatio="none">
                <path d="M0,20 Q25,5 50,20 T100,20" stroke="url(#grad1)" stroke-width="0.3" fill="none" opacity="0.8"/>
                <path d="M0,40 Q25,25 50,40 T100,40" stroke="url(#grad2)" stroke-width="0.4" fill="none" opacity="0.7"/>
                <path d="M0,60 Q25,45 50,60 T100,60" stroke="url(#grad3)" stroke-width="0.3" fill="none" opacity="0.6"/>
                <path d="M0,80 Q25,65 50,80 T100,80" stroke="url(#grad4)" stroke-width="0.5" fill="none" opacity="0.5"/>
                <defs>
                    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0"/>
                        <stop offset="50%" style="stop-color:#00ffff;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#ffff00;stop-opacity:0"/>
                    </linearGradient>
                    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#ff4500;stop-opacity:0"/>
                        <stop offset="50%" style="stop-color:#9400d3;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#00ff7f;stop-opacity:0"/>
                    </linearGradient>
                    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#1e90ff;stop-opacity:0"/>
                        <stop offset="50%" style="stop-color:#ff1493;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
                    </linearGradient>
                    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:#32cd32;stop-opacity:0"/>
                        <stop offset="50%" style="stop-color:#ff6347;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#4169e1;stop-opacity:0"/>
                    </linearGradient>
                </defs>
            </svg>

            <!-- Vertical Wavy Lines -->
            <svg class="wave-line absolute inset-0 w-full h-full opacity-50" viewBox="0 0 100 100" preserveAspectRatio="none" style="animation-delay: -3s;">
                <path d="M20,0 Q5,25 20,50 T20,100" stroke="url(#vgrad1)" stroke-width="0.3" fill="none" opacity="0.8"/>
                <path d="M40,0 Q25,25 40,50 T40,100" stroke="url(#vgrad2)" stroke-width="0.4" fill="none" opacity="0.7"/>
                <path d="M60,0 Q45,25 60,50 T60,100" stroke="url(#vgrad3)" stroke-width="0.3" fill="none" opacity="0.6"/>
                <path d="M80,0 Q65,25 80,50 T80,100" stroke="url(#vgrad4)" stroke-width="0.5" fill="none" opacity="0.5"/>
                <defs>
                    <linearGradient id="vgrad1" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ff69b4;stop-opacity:0"/>
                        <stop offset="50%" style="stop-color:#00ced1;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#98fb98;stop-opacity:0"/>
                    </linearGradient>
                    <linearGradient id="vgrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:0"/>
                        <stop offset="50%" style="stop-color:#8a2be2;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#00fa9a;stop-opacity:0"/>
                    </linearGradient>
                    <linearGradient id="vgrad3" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#dc143c;stop-opacity:0"/>
                        <stop offset="50%" style="stop-color:#00bfff;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#ffff00;stop-opacity:0"/>
                    </linearGradient>
                    <linearGradient id="vgrad4" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#7fff00;stop-opacity:0"/>
                        <stop offset="50%" style="stop-color:#ff4500;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#9370db;stop-opacity:0"/>
                    </linearGradient>
                </defs>
            </svg>

            <!-- Diagonal Wavy Lines -->
            <svg class="wave-line absolute inset-0 w-full h-full opacity-40" viewBox="0 0 100 100" preserveAspectRatio="none" style="animation-delay: -6s;">
                <path d="M0,0 Q25,25 50,0 T100,0" stroke="url(#dgrad1)" stroke-width="0.2" fill="none" opacity="0.9" transform="rotate(45 50 50)"/>
                <path d="M0,25 Q25,50 50,25 T100,25" stroke="url(#dgrad2)" stroke-width="0.3" fill="none" opacity="0.8" transform="rotate(45 50 50)"/>
                <path d="M0,50 Q25,75 50,50 T100,50" stroke="url(#dgrad3)" stroke-width="0.2" fill="none" opacity="0.7" transform="rotate(45 50 50)"/>
                <path d="M0,75 Q25,100 50,75 T100,75" stroke="url(#dgrad4)" stroke-width="0.4" fill="none" opacity="0.6" transform="rotate(45 50 50)"/>
                <defs>
                    <linearGradient id="dgrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#ff1493;stop-opacity:0"/>
                        <stop offset="50%" style="stop-color:#00ffff;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
                    </linearGradient>
                    <linearGradient id="dgrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#32cd32;stop-opacity:0"/>
                        <stop offset="50%" style="stop-color:#ff6347;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#9370db;stop-opacity:0"/>
                    </linearGradient>
                    <linearGradient id="dgrad3" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#ff8c00;stop-opacity:0"/>
                        <stop offset="50%" style="stop-color:#1e90ff;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#ff69b4;stop-opacity:0"/>
                    </linearGradient>
                    <linearGradient id="dgrad4" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#7fff00;stop-opacity:0"/>
                        <stop offset="50%" style="stop-color:#dc143c;stop-opacity:1"/>
                        <stop offset="100%" style="stop-color:#00ced1;stop-opacity:0"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- Plasma Noise Overlay -->
        <div class="absolute inset-0 opacity-30 mix-blend-overlay"
             style="background-image: 
                radial-gradient(circle at 20% 30%, rgba(255,0,255,0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0,255,255,0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(255,255,0,0.3) 0%, transparent 50%),
                radial-gradient(circle at 90% 20%, rgba(255,100,0,0.3) 0%, transparent 50%);
             animation: plasma2 30s ease-in-out infinite;">
        </div>

        <!-- Procedural Particle Effects -->
        <div class="absolute inset-0">
            <div class="absolute w-2 h-2 bg-white rounded-full opacity-80" style="left: 10%; top: 20%; animation: plasma1 8s ease-in-out infinite;"></div>
            <div class="absolute w-3 h-3 bg-cyan-400 rounded-full opacity-60" style="left: 30%; top: 60%; animation: plasma2 12s ease-in-out infinite;"></div>
            <div class="absolute w-1 h-1 bg-pink-400 rounded-full opacity-90" style="left: 70%; top: 30%; animation: plasma1 6s ease-in-out infinite reverse;"></div>
            <div class="absolute w-2 h-2 bg-yellow-400 rounded-full opacity-70" style="left: 80%; top: 80%; animation: plasma2 10s ease-in-out infinite;"></div>
            <div class="absolute w-1 h-1 bg-green-400 rounded-full opacity-85" style="left: 50%; top: 10%; animation: plasma1 14s ease-in-out infinite;"></div>
        </div>
    </div>

    <script>
        function randomizeEffect() {
            const plasmaLayers = document.querySelectorAll('.plasma-layer > div');
            const waveLines = document.querySelectorAll('.wave-line');
            
            plasmaLayers.forEach(layer => {
                const randomDuration = (Math.random() * 20 + 10) + 's';
                const randomDelay = (Math.random() * -10) + 's';
                layer.style.animationDuration = randomDuration;
                layer.style.animationDelay = randomDelay;
            });
            
            waveLines.forEach(line => {
                const randomDuration = (Math.random() * 10 + 8) + 's';
                const randomDelay = (Math.random() * -8) + 's';
                line.style.animationDuration = randomDuration;
                line.style.animationDelay = randomDelay;
            });
        }
        
        document.getElementById('speedControl').addEventListener('input', function(e) {
            const speed = e.target.value;
            document.querySelectorAll('[style*="animation"]').forEach(el => {
                el.style.animationDuration = (15 / speed) + 's';
            });
        });
        
        document.getElementById('intensityControl').addEventListener('input', function(e) {
            const intensity = e.target.value;
            document.querySelectorAll('.plasma-layer').forEach(el => {
                el.style.opacity = intensity * 0.8;
            });
        });
        
        setInterval(randomizeEffect, 15000);
    </script>
</body>
</html>
