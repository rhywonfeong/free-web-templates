<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Wheel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
}
/* Smooth, bouncy easing for the wheel */
.spin-transition {
transition: transform 5s cubic-bezier(0.2, 0.8, 0.1, 1);
}
/* Custom scrollbar for clean look */
::-webkit-scrollbar {
width: 4px;
height: 4px;
}
::-webkit-scrollbar-track {
background: transparent;
}
::-webkit-scrollbar-thumb {
background: rgba(244, 114, 182, 0.2);
border-radius: 10px;
}
::-webkit-scrollbar-thumb:hover {
background: rgba(244, 114, 182, 0.4);
}
/* Modal Animation */
.modal-enter {
opacity: 0;
transform: scale(0.95) translateY(10px);
}
.modal-enter-active {
opacity: 1;
transform: scale(1) translateY(0);
transition: opacity 400ms ease-out, transform 400ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
/* Floating animation for aesthetic */
@keyframes float {
0% { transform: translateY(0px); }
50% { transform: translateY(-10px); }
100% { transform: translateY(0px); }
}
.animate-float {
animation: float 6s ease-in-out infinite;
}
/* Confetti particle base */
.confetti {
position: absolute;
width: 8px;
height: 8px;
background-color: #f472b6;
opacity: 0;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());

</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col relative overflow-x-hidden selection:bg-rose-200">
    
    <!-- Background Decor (Soft Gradients) -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-[20%] -left-[10%] w-[70%] aspect-square rounded-full bg-rose-200/30 blur-[100px]"></div>
        <div class="absolute top-[20%] -right-[20%] w-[60%] aspect-square rounded-full bg-fuchsia-200/30 blur-[100px]"></div>
        <div class="absolute -bottom-[20%] left-[20%] w-[80%] aspect-square rounded-full bg-pink-100/40 blur-[120px]"></div>
    </div>

    <!-- Header -->
    <header class="relative z-10 w-full max-w-5xl mx-auto px-6 py-8 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-rose-400 to-fuchsia-500 text-white flex items-center justify-center text-xs tracking-tight font-medium shadow-md shadow-rose-200">
                Hauyn
            </div>
            <h1 class="text-lg tracking-tight font-medium text-slate-700">Hôm nay sẽ gặp may mắn gì nào</h1>
        </div>
        <div class="flex items-center gap-4">
            <button class="w-8 h-8 rounded-full bg-white/50 backdrop-blur-sm border border-white/60 flex items-center justify-center text-slate-500 hover:text-rose-500 hover:bg-white transition-colors shadow-sm">
                <iconify-icon icon="solar:moon-linear" width="16" height="16"></iconify-icon>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 w-full max-w-5xl mx-auto px-4 md:px-6 flex-1 flex flex-col lg:flex-row gap-8 lg:gap-16 pb-12">
        
        <!-- Left Column: The Wheel -->
        <section class="flex-1 flex flex-col items-center justify-center pt-4 lg:pt-12">
            
            <div class="relative w-full max-w-[320px] md:max-w-[400px] aspect-square animate-float" style="animation-duration: 8s;">
                <!-- Outer Ring -->
                <div class="absolute inset-0 rounded-full bg-white/40 backdrop-blur-md border border-white/60 shadow-2xl shadow-rose-200/40 p-3">
                    
                    <!-- Wheel Container -->
                    <div class="relative w-full h-full rounded-full border-4 border-white shadow-inner bg-slate-100 overflow-hidden">
                        
                        <!-- Rotating Element -->
                        <div id="wheel" class="absolute inset-0 w-full h-full rounded-full spin-transition" style="background: conic-gradient(#f472b6 0deg 72deg, #c084fc 72deg 144deg, #fbbf24 144deg 216deg, #38bdf8 216deg 288deg, #a3e635 288deg 360deg);">
                            <!-- Text labels will be injected here via JS -->
                        </div>

                    </div>

                    <!-- Center Button -->
                    <button id="spin-btn" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[22%] aspect-square rounded-full bg-white shadow-xl flex flex-col items-center justify-center gap-0.5 z-20 group transition-transform active:scale-95 hover:scale-105 border-2 border-rose-50">
                        <span class="text-xl group-hover:rotate-12 transition-transform duration-300">💫</span>
                        <span class="text-xs font-medium text-rose-500 tracking-tight">Quay</span>
                    </button>
                    
                    <!-- Inner decoration ring -->
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[28%] aspect-square rounded-full border border-white/50 z-10 pointer-events-none"></div>

                    <!-- Pointer -->
                    <div class="absolute -top-4 left-1/2 -translate-x-1/2 z-30 drop-shadow-md">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-white">
                            <path d="M12 2L2 20L12 16L22 20L12 2Z" fill="currentColor" stroke="#f472b6" stroke-width="2" stroke-linejoin="round"></path>
                        </svg>
                    </div>

                </div>
            </div>

            <!-- Cute subtext -->
            <p class="mt-10 text-sm text-slate-400 font-normal tracking-tight text-center max-w-xs">
                Chạm vào nút để xem hôm nay chúng mình làm gì nhé 💝
            </p>

        </section>

        <!-- Right Column: Config & History -->
        <section class="flex-[0.8] w-full flex flex-col">
            
            <!-- Tabs -->
            <div class="flex items-center gap-1 p-1 bg-white/40 backdrop-blur-md rounded-2xl border border-white/50 w-full max-w-sm mx-auto lg:mx-0 shadow-sm mb-6">
                <button id="tab-config" class="flex-1 py-2 text-sm font-medium rounded-xl transition-all bg-white text-rose-600 shadow-sm">
                    Cấu hình
                </button>
                <button id="tab-history" class="flex-1 py-2 text-sm font-medium rounded-xl transition-all text-slate-500 hover:text-slate-700">
                    Lịch sử
                </button>
            </div>

            <!-- Content Area -->
            <div class="relative flex-1 bg-white/60 backdrop-blur-xl border border-white/60 rounded-[2rem] shadow-xl shadow-slate-200/50 p-6 overflow-hidden flex flex-col h-[400px] lg:h-auto">
                
                <!-- Configuration Panel -->
                <div id="panel-config" class="flex flex-col h-full transition-opacity duration-300">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-base tracking-tight font-medium text-slate-700">Tùy chọn vòng quay</h2>
                        <span id="item-count" class="text-xs font-medium text-rose-500 bg-rose-50 px-2 py-1 rounded-lg">5/10</span>
                    </div>

                    <div id="config-list" class="flex-1 overflow-y-auto pr-2 space-y-3 pb-4">
                        <!-- Items injected via JS -->
                    </div>

                    <div class="pt-4 mt-auto border-t border-slate-100">
                        <button id="add-item-btn" class="w-full py-2.5 rounded-xl border border-dashed border-rose-300 text-rose-500 text-sm font-medium flex items-center justify-center gap-2 hover:bg-rose-50 hover:border-rose-400 transition-colors bg-white/50">
                            <iconify-icon icon="solar:add-circle-linear" width="18" height="18"></iconify-icon>
                            Thêm lựa chọn mới
                        </button>
                    </div>
                </div>

                <!-- History Panel (Hidden by default) -->
                <div id="panel-history" class="absolute inset-0 p-6 flex flex-col h-full opacity-0 pointer-events-none transition-opacity duration-300">
                    <h2 class="text-base tracking-tight font-medium text-slate-700 mb-4">Lịch sử quay</h2>
                    
                    <div id="history-list" class="flex-1 overflow-y-auto pr-2 space-y-3">
                        <!-- Empty State -->
                        <div class="h-full flex flex-col items-center justify-center text-slate-400 gap-3 opacity-50">
                            <iconify-icon icon="solar:history-linear" width="32" height="32"></iconify-icon>
                            <p class="text-sm">Chưa có lượt quay nào</p>
                        </div>
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- Result Modal Overlay -->
    <div id="result-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/20 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <!-- Confetti Container -->
        <div id="confetti-container" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
        
        <!-- Modal Content -->
        <div id="modal-content" class="relative w-full max-w-sm bg-white rounded-[2.5rem] p-8 shadow-2xl border border-white/50 text-center transform scale-95 transition-transform duration-300">
            
            <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-24 h-24 bg-gradient-to-tr from-rose-100 to-fuchsia-100 rounded-full border-4 border-white shadow-lg flex items-center justify-center text-4xl">
                🎉
            </div>

            <div class="mt-8 space-y-2">
                <p class="text-sm text-slate-500 font-medium tracking-tight">Kết quả của bạn là</p>
                <h3 id="result-text" class="text-xl font-semibold text-slate-800 tracking-tight leading-snug">
                    Bạn phải ôm mình 10 cái 🤗
                </h3>
            </div>

            <button id="close-modal" class="mt-8 w-full py-3.5 bg-gradient-to-r from-rose-400 to-fuchsia-400 text-white rounded-2xl text-sm font-medium shadow-md shadow-rose-200 hover:shadow-lg hover:-translate-y-0.5 transition-all active:translate-y-0">
                Chấp nhận nha 💖
            </button>
        </div>
    </div>

    <script>
        // --- State Management ---
        const PRESET_COLORS = ['#f472b6', '#c084fc', '#fbbf24', '#38bdf8', '#a3e635', '#fb7185', '#818cf8', '#34d399', '#facc15', '#60a5fa'];
        
        let state = {
            isSpinning: false,
            currentRotation: 0,
            segments: [
                { id: '1', label: 'Ôm mình 10 cái 🤗', color: PRESET_COLORS[0] },
                { id: '2', label: 'Đi ăn đồ nướng 🥩', color: PRESET_COLORS[1] },
                { id: '3', label: 'Xem một bộ phim 🍿', color: PRESET_COLORS[2] },
                { id: '4', label: 'Massage 15 phút 💆', color: PRESET_COLORS[3] },
                { id: '5', label: 'Được một điều ước ✨', color: PRESET_COLORS[4] }
            ],
            history: []
        };

        // --- DOM Elements ---
        const wheelEl = document.getElementById('wheel');
        const spinBtn = document.getElementById('spin-btn');
        const configListEl = document.getElementById('config-list');
        const historyListEl = document.getElementById('history-list');
        const itemCountEl = document.getElementById('item-count');
        const addItemBtn = document.getElementById('add-item-btn');
        
        const tabConfig = document.getElementById('tab-config');
        const tabHistory = document.getElementById('tab-history');
        const panelConfig = document.getElementById('panel-config');
        const panelHistory = document.getElementById('panel-history');

        const modalOverlay = document.getElementById('result-modal');
        const modalContent = document.getElementById('modal-content');
        const resultTextEl = document.getElementById('result-text');
        const closeModalBtn = document.getElementById('close-modal');
        const confettiContainer = document.getElementById('confetti-container');

        // --- Initialization ---
        function init() {
            renderWheel();
            renderConfig();
            setupEventListeners();
        }

        // --- Rendering Logic ---
        function renderWheel() {
            const numSegments = state.segments.length;
            const sliceAngle = 360 / numSegments;
            
            // Build Conic Gradient
            let gradientStr = '';
            let currentAngle = 0;
            
            state.segments.forEach((seg, index) => {
                const nextAngle = currentAngle + sliceAngle;
                gradientStr += `${seg.color} ${currentAngle}deg ${nextAngle}deg${index < numSegments - 1 ? ', ' : ''}`;
                currentAngle = nextAngle;
            });
            
            wheelEl.style.background = `conic-gradient(${gradientStr})`;

            // Add Text Labels inside Wheel
            wheelEl.innerHTML = '';
            const radius = 50; // percentage to place text
            
            state.segments.forEach((seg, index) => {
                const rotation = (index * sliceAngle) + (sliceAngle / 2);
                
                const label = document.createElement('div');
                label.className = 'absolute top-1/2 left-1/2 -translate-y-1/2 origin-left text-white font-medium text-xs tracking-tight whitespace-nowrap drop-shadow-md pointer-events-none';
                // Adjust typography scale based on segment count
                if(numSegments > 8) label.classList.replace('text-xs', 'text-[10px]');
                
                // Position logic: rotate from center, move out by width percentage
                label.style.transform = `rotate(${rotation - 90}deg) translateX(30px)`;
                label.style.width = '45%';
                label.style.textAlign = 'center';
                
                // Truncate text visually
                const textSpan = document.createElement('span');
                textSpan.className = 'block truncate px-2';
                textSpan.textContent = seg.label;
                
                label.appendChild(textSpan);
                wheelEl.appendChild(label);
            });

            // Update Add Button State
            itemCountEl.textContent = `${numSegments}/10`;
            addItemBtn.disabled = numSegments >= 10;
            addItemBtn.style.opacity = numSegments >= 10 ? '0.5' : '1';
        }

        function renderConfig() {
            configListEl.innerHTML = '';
            state.segments.forEach((seg, index) => {
                const item = document.createElement('div');
                item.className = 'group flex items-center gap-3 p-2.5 bg-white rounded-2xl border border-slate-100 shadow-sm transition-all hover:border-rose-200';
                
                // Color indicator (simulated picker)
                const colorDiv = document.createElement('div');
                colorDiv.className = 'w-8 h-8 rounded-xl shrink-0 cursor-pointer border border-black/5 shadow-inner transition-transform active:scale-90 relative overflow-hidden';
                colorDiv.style.backgroundColor = seg.color;
                // Add a tiny icon inside color div on hover
                colorDiv.innerHTML = `<div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity bg-black/10"><iconify-icon icon="solar:palette-linear" width="14" class="text-white"></iconify-icon></div>`;
                colorDiv.onclick = () => changeColor(index);

                // Input
                const input = document.createElement('input');
                input.type = 'text';
                input.value = seg.label;
                input.className = 'flex-1 min-w-0 bg-transparent text-sm font-medium text-slate-700 focus:outline-none focus:text-rose-600 transition-colors placeholder:text-slate-300';
                input.placeholder = 'Nhập nội dung...';
                input.onchange = (e) => updateLabel(index, e.target.value);

                // Delete Button
                const delBtn = document.createElement('button');
                delBtn.className = `w-8 h-8 flex items-center justify-center rounded-xl text-slate-300 hover:text-red-500 hover:bg-red-50 transition-colors ${state.segments.length <= 2 ? 'opacity-30 cursor-not-allowed' : ''}`;
                delBtn.innerHTML = '<iconify-icon icon="solar:trash-bin-trash-linear" width="16"></iconify-icon>';
                delBtn.disabled = state.segments.length <= 2;
                delBtn.onclick = () => removeSegment(index);

                item.appendChild(colorDiv);
                item.appendChild(input);
                item.appendChild(delBtn);
                configListEl.appendChild(item);
            });
        }

        function renderHistory() {
            if (state.history.length === 0) return; // Keep empty state
            
            historyListEl.innerHTML = '';
            // Render latest first
            [...state.history].reverse().forEach((item) => {
                const el = document.createElement('div');
                el.className = 'flex items-center gap-4 p-3.5 bg-white rounded-2xl border border-slate-100 shadow-sm';
                
                const timeStr = new Date(item.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                el.innerHTML = `
                    <div class="w-10 h-10 rounded-full flex items-center justify-center shrink-0 border-2 border-white shadow-sm" style="background-color: ${item.color}20; color: ${item.color}">
                        <iconify-icon icon="solar:star-fall-linear" width="20"></iconify-icon>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-slate-700 truncate">${item.label}</p>
                        <p class="text-xs text-slate-400 mt-0.5">${timeStr}</p>
                    </div>
                `;
                historyListEl.appendChild(el);
            });
        }

        // --- Logic Actions ---
        function changeColor(index) {
            // Simple cycle through preset colors
            const currentColor = state.segments[index].color;
            let nextIndex = PRESET_COLORS.indexOf(currentColor) + 1;
            if (nextIndex >= PRESET_COLORS.length) nextIndex = 0;
            
            state.segments[index].color = PRESET_COLORS[nextIndex];
            renderConfig();
            renderWheel();
        }

        function updateLabel(index, newLabel) {
            if (!newLabel.trim()) newLabel = 'Trống';
            state.segments[index].label = newLabel;
            renderWheel();
        }

        function removeSegment(index) {
            if (state.segments.length <= 2) return; // Minimum 2
            state.segments.splice(index, 1);
            renderConfig();
            renderWheel();
        }

        function addSegment() {
            if (state.segments.length >= 10) return; // Maximum 10
            
            // Pick a color not recently used if possible
            const usedColors = state.segments.map(s => s.color);
            const availableColors = PRESET_COLORS.filter(c => !usedColors.includes(c));
            const newColor = availableColors.length > 0 ? availableColors[0] : PRESET_COLORS[Math.floor(Math.random() * PRESET_COLORS.length)];

            state.segments.push({
                id: Date.now().toString(),
                label: 'Lựa chọn mới',
                color: newColor
            });
            renderConfig();
            renderWheel();
            // Scroll to bottom
            configListEl.scrollTop = configListEl.scrollHeight;
        }

        function spinWheel() {
            if (state.isSpinning) return;
            state.isSpinning = true;
            spinBtn.classList.add('scale-95', 'opacity-80');

            const numSegments = state.segments.length;
            const sliceAngle = 360 / numSegments;
            
            // Determine winning segment (random)
            const winningIndex = Math.floor(Math.random() * numSegments);
            const winner = state.segments[winningIndex];

            // Calculate rotation
            // We want the center of the winning slice to align with the pointer (top, 270deg relative to standard 0deg right)
            // Wait, pointer is at top (which is -90deg or 270deg relative to center right).
            // Conic gradient starts at top (12 o'clock = 0deg). Pointer is at 12 o'clock.
            // Winning slice start = winningIndex * sliceAngle.
            // Winning slice center = (winningIndex * sliceAngle) + (sliceAngle / 2).
            // To bring this center to 0deg (top), we need to rotate backwards by that amount.
            // Let's add multiple full spins (e.g., 5-8 spins)
            const spins = 5 + Math.floor(Math.random() * 4); // 5 to 8 spins
            const baseRotation = spins * 360;
            
            // The slice to land on at the top (0deg).
            // Since we rotate the wheel clockwise, we subtract the angle to bring it top.
            // Wait, standard CSS transform rotate is clockwise.
            // If pointer is at 0deg (top), and we want slice N to be at top.
            // Slice N center angle is N*sliceAngle + sliceAngle/2.
            // So we need to rotate by: baseRotation + (360 - (N*sliceAngle + sliceAngle/2)).
            const targetAngle = 360 - ((winningIndex * sliceAngle) + (sliceAngle / 2));
            
            // Add a slight random offset within the slice so it doesn't land exactly center every time
            const randomOffset = (Math.random() * (sliceAngle * 0.6)) - (sliceAngle * 0.3);
            
            const finalRotation = state.currentRotation + baseRotation + targetAngle + randomOffset;

            // Apply rotation
            wheelEl.style.transform = `rotate(${finalRotation}deg)`;
            state.currentRotation = finalRotation;

            // Wait for transition to end
            setTimeout(() => {
                state.isSpinning = false;
                spinBtn.classList.remove('scale-95', 'opacity-80');
                
                // Add to history
                state.history.push({
                    ...winner,
                    timestamp: new Date().getTime()
                });
                renderHistory();

                // Show Modal
                showModal(winner);

            }, 5000); // matches CSS transition duration
        }

        // --- UI Interactions ---
        function switchTab(tab) {
            if (tab === 'config') {
                tabConfig.classList.add('bg-white', 'text-rose-600', 'shadow-sm');
                tabConfig.classList.remove('text-slate-500');
                tabHistory.classList.remove('bg-white', 'text-rose-600', 'shadow-sm');
                tabHistory.classList.add('text-slate-500');
                
                panelHistory.classList.add('opacity-0', 'pointer-events-none');
                panelHistory.classList.remove('relative');
                panelHistory.classList.add('absolute');
                
                panelConfig.classList.remove('opacity-0', 'pointer-events-none', 'absolute');
                panelConfig.classList.add('relative');
            } else {
                tabHistory.classList.add('bg-white', 'text-rose-600', 'shadow-sm');
                tabHistory.classList.remove('text-slate-500');
                tabConfig.classList.remove('bg-white', 'text-rose-600', 'shadow-sm');
                tabConfig.classList.add('text-slate-500');

                panelConfig.classList.add('opacity-0', 'pointer-events-none');
                panelConfig.classList.remove('relative');
                panelConfig.classList.add('absolute');
                
                panelHistory.classList.remove('opacity-0', 'pointer-events-none', 'absolute');
                panelHistory.classList.add('relative');
            }
        }

        function showModal(winner) {
            resultTextEl.textContent = winner.label;
            modalOverlay.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('scale-95');
            createConfetti();
        }

        function hideModal() {
            modalOverlay.classList.add('opacity-0', 'pointer-events-none');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                confettiContainer.innerHTML = '';
            }, 300);
        }

        function createConfetti() {
            const colors = ['#f472b6', '#fbbf24', '#38bdf8', '#a3e635', '#c084fc'];
            for (let i = 0; i < 50; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti rounded-full';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Random starting position near center
                const startX = 50 + (Math.random() * 10 - 5);
                const startY = 50 + (Math.random() * 10 - 5);
                
                // Random end position
                const tx = (Math.random() - 0.5) * 400; // pixels
                const ty = (Math.random() - 0.5) * 400; // pixels
                
                conf.style.left = `${startX}%`;
                conf.style.top = `${startY}%`;
                
                const duration = 1000 + Math.random() * 1000;
                
                conf.animate([
                    { transform: 'translate(0, 0) scale(0) rotate(0deg)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(1) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: duration,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
                    fill: 'forwards'
                });
                
                confettiContainer.appendChild(conf);
            }
        }

        function setupEventListeners() {
            addItemBtn.addEventListener('click', addSegment);
            spinBtn.addEventListener('click', spinWheel);
            
            tabConfig.addEventListener('click', () => switchTab('config'));
            tabHistory.addEventListener('click', () => switchTab('history'));
            
            closeModalBtn.addEventListener('click', hideModal);
        }

        // Run
        document.addEventListener('DOMContentLoaded', init);

    </script>

</body></html>
