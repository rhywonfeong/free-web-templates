  <body class="antialiased sm:p-8 md:py-16 text-black font-sans bg-zinc-50 pt-4 pr-4 pb-4 pl-4">

        <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/5feef13b-77da-4ad0-b9a4-71b3b24ded39_320w.png" alt="Mai Nami Logo" class="h-8 w-auto mx-auto mb-4 object-contain">
        <h1 class="sm:text-3xl text-2xl tracking-tight mb-2 font-bold text-[#782616]">
          How did you like the Hair Pudding?
        </h1>
        <p class="text-base max-w-sm mx-auto text-zinc-500">

      <!-- Survey Form -->

        <input type="hidden" name="$fields" value="TextureRating,PackagingRating,SmellRating,EffectRating,FeedbackComments">

        <!-- Texture Rating -->

            </label>
            <label class="relative flex cursor-pointer">

              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">

            <label class="relative flex cursor-pointer">

            </label>
            <label class="relative flex cursor-pointer">
              <input type="radio" name="PackagingRating" value="2" class="peer sr-only">
              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">

            <label class="relative flex cursor-pointer">

              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">

            <label class="relative flex cursor-pointer">
              <input type="radio" name="PackagingRating" value="4" class="peer sr-only">
              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">

        <div>

            Smell

          <div class="grid grid-cols-5 gap-2 sm:gap-3">
            <label class="relative flex cursor-pointer">
              <input type="radio" name="SmellRating" value="1" class="peer sr-only" required="">
              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">

            </label>
            <label class="relative flex cursor-pointer">
              <input type="radio" name="SmellRating" value="2" class="peer sr-only">
              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">
                2
              </div>
            </label>
            <label class="relative flex cursor-pointer">
              <input type="radio" name="SmellRating" value="3" class="peer sr-only">
              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">
                3
              </div>
            </label>
            <label class="relative flex cursor-pointer">
              <input type="radio" name="SmellRating" value="4" class="peer sr-only">
              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">
                4
              </div>
            </label>
            <label class="relative flex cursor-pointer">
              <input type="radio" name="SmellRating" value="5" class="peer sr-only">
              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">
                5
              </div>
            </label>
          </div>
          <div class="flex justify-between text-sm mt-2 px-1 text-zinc-400">
            <span>Too strong/weak</span>
            <span>Just right</span>
          </div>
        </div>

        <!-- Finished Effect Rating -->
        <div>
          <label class="flex items-center text-base font-normal mb-3 text-zinc-800">
            <i data-lucide="sparkles" stroke-width="1.5" class="w-5 h-5 mr-2 text-zinc-400"></i>
            Finished Effect on Hair
          </label>
          <div class="grid grid-cols-5 gap-2 sm:gap-3">
            <label class="relative flex cursor-pointer">
              <input type="radio" name="EffectRating" value="1" class="peer sr-only" required="">
              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">
                1
              </div>
            </label>
            <label class="relative flex cursor-pointer">
              <input type="radio" name="EffectRating" value="2" class="peer sr-only">
              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">
                2
              </div>
            </label>
            <label class="relative flex cursor-pointer">
              <input type="radio" name="EffectRating" value="3" class="peer sr-only">
              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">
                3
              </div>
            </label>
            <label class="relative flex cursor-pointer">
              <input type="radio" name="EffectRating" value="4" class="peer sr-only">
              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">
                4
              </div>
            </label>
            <label class="relative flex cursor-pointer">
              <input type="radio" name="EffectRating" value="5" class="peer sr-only">
              <div class="w-full flex items-center justify-center py-2.5 rounded-lg border bg-white text-base font-normal peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-offset-2 transition-all duration-200 border-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 peer-checked:border-zinc-900 peer-checked:bg-zinc-900 peer-focus-visible:ring-zinc-900">
                5
              </div>
            </label>
          </div>
          <div class="flex justify-between text-sm mt-2 px-1 text-zinc-400">
            <span>Not what I wanted</span>
            <span>Looks amazing</span>
          </div>
        </div>

        <hr class="border-zinc-100">

        <!-- Comments -->
        <div>
          <label for="FeedbackComments" class="flex items-center text-base font-normal mb-2 text-zinc-800">
            <i data-lucide="file-text" stroke-width="1.5" class="w-5 h-5 mr-2 text-zinc-400"></i>
            Any additional thoughts?
          </label>
          <textarea id="FeedbackComments" name="FeedbackComments" rows="3" class="w-full bg-white border rounded-xl p-3.5 text-base focus:outline-none focus:ring-2 transition-all duration-200 resize-none shadow-sm border-zinc-200 text-zinc-900 placeholder-zinc-400 focus:ring-zinc-900/10 focus:border-zinc-900" placeholder="Tell us what you loved or what could be better..."></textarea>
        </div>

        <!-- Dynamic Messages -->
        <div class="klaviyo_messages hidden">
          <div class="success_message text-base font-normal border p-4 rounded-xl text-center hidden mb-4 text-zinc-800 bg-zinc-50 border-zinc-200"></div>
          <div class="error_message text-base font-normal border p-4 rounded-xl text-center hidden mb-4 text-zinc-600 bg-zinc-50 border-zinc-100"></div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button type="submit" class="flex transition-all duration-200 active:scale-[0.98] outline-none focus-visible:ring-2 focus-visible:ring-offset-2 hover:bg-[#782616]/90 focus-visible:ring-[#782616] text-base font-normal text-white font-dm-sans bg-[#782616] w-full rounded-xl pt-3.5 pr-4 pb-3.5 pl-4 shadow-sm items-center justify-center">
            Submit Responses
            <i data-lucide="arrow-right" stroke-width="1.5" class="ml-2 w-5 h-5 opacity-70"></i>
          </button>

      </form>
    </main>

    <script>
      // Initialize Icons
      lucide.createIcons();
    </script>

    <!-- Subscription JavaScript -->
    <script type="text/javascript" src="//www.klaviyo.com/media/js/public/klaviyo_subscribe.js"></script>
    <script type="text/javascript">
      KlaviyoSubscribe.attachToForms('#klaviyo_survey_form', {
          hide_form_on_success: true,
          success_message: "Thank you for your feedback! Your responses have been saved.",
          success: function ($form) {}
      });

      document.addEventListener('DOMContentLoaded', function() {
          const urlParams = new URLSearchParams(window.location.search);
          const emailParam = urlParams.get('email') || urlParams.get('_kx');
          if(emailParam) {
              const emailInput = document.getElementById('k_id_email');
              if(emailInput) {
                  emailInput.value = emailParam;
                  if(emailParam.includes('@')) {
                      emailInput.setAttribute('readonly', 'true');
                      emailInput.classList.add('bg-zinc-50', 'text-black', 'cursor-not-allowed');
                  }
              }
          }
      });
    </script>
  
</body></html>
