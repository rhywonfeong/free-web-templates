    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serene - Meditation App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .dynamic-island {
            border-radius: 20px;
            height: 34px;
            width: 120px;
            background-color: #000;
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
        }
        .iphone-frame {
            border-radius: 50px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .progress-ring {
            transform: rotate(-90deg);
        }
        .breathe-animation {
            animation: breathe 5s infinite ease-in-out;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="iphone-frame bg-black w-[320px] h-[650px]">
        <!-- Dynamic Island -->
        <div class="dynamic-island"></div>
        
        <!-- App Content -->
        <div class="h-full w-full bg-gradient-to-b from-gray-900 to-black text-white pt-16 px-6 pb-6 flex flex-col">
            <!-- Top Bar -->
            <div class="flex justify-between items-center mt-4">
                <div class="text-sm font-light opacity-80">Welcome back</div>
                <div class="h-8 w-8 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500"></div>
            </div>
            
            <!-- App Name -->
            <h1 class="text-xl font-medium mt-4">Serene</h1>
            
            <!-- Main Content -->
            <div class="flex-1 flex flex-col items-center justify-center">

                <div class="relative">
                    <!-- Outer Ring -->
                    <svg class="progress-ring" width="220" height="220">
                        <circle class="opacity-10" cx="110" cy="110" r="100" stroke="#fff" stroke-width="2" fill="transparent"/>
                        <circle cx="110" cy="110" r="100" stroke="url(#gradient)" stroke-width="2" fill="transparent" stroke-dasharray="628" stroke-dashoffset="157"/>
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#4F46E5" />
                                <stop offset="100%" stop-color="#A855F7" />
                            </linearGradient>
                        </defs>
                    </svg>
                    
                    <!-- Inner Circle -->
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="breathe-animation h-32 w-32 rounded-full bg-gradient-to-r from-indigo-500/20 to-purple-500/20 flex items-center justify-center">
                            <div class="text-center">
                                <div class="text-3xl font-light">12:34</div>
                                <div class="text-xs opacity-70 mt-1">Breathe in</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Session Info -->
                <div class="mt-10 w-full">
                    <h3 class="text-sm font-medium">Daily Calm</h3>
                    <p class="text-xs opacity-70 mt-1">Guided meditation for focus</p>
                    <div class="mt-2 h-1 w-full bg-white/10 rounded-full">
                        <div class="h-full w-3/4 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full"></div>
                    </div>
                </div>
            </div>
            
            <!-- Bottom Navigation -->
            <div class="flex justify-around items-center py-5 border-t border-white/10">
                <div class="flex flex-col items-center">
                    <div class="h-6 w-6 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full"></div>
                    <span class="text-xs mt-1 opacity-70">Home</span>
                </div>
                <div class="flex flex-col items-center opacity-50">
                    <div class="h-6 w-6 rounded-full border border-white/30"></div>
                    <span class="text-xs mt-1">Meditate</span>

                <div class="flex flex-col items-center opacity-50">
                    <div class="h-6 w-6 rounded-full border border-white/30"></div>
                    <span class="text-xs mt-1">Sleep</span>
                </div>
                <div class="flex flex-col items-center opacity-50">
                    <div class="h-6 w-6 rounded-full border border-white/30"></div>
                    <span class="text-xs mt-1">Profile</span>
                </div>
            </div>
        </div>
