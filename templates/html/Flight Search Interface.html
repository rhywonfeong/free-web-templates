    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Inter',sans-serif;background-color:#f0f2f5}
        .glass-effect{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(20px)}
        .radio-circle{width:16px;height:16px;border-radius:50%;border:1px solid rgba(255,255,255,0.7);position:relative}
        .radio-circle.selected::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background-color:#3399ff;top:50%;left:50%;transform:translate(-50%,-50%)}
        .autocomplete{position:absolute;background:rgba(45,55,72,0.95);border:1px solid rgba(255,255,255,0.1);width:100%;max-height:200px;overflow-y:auto;z-index:10;border-radius:0.5rem;margin-top:0.5rem}
        .autocomplete-item{padding:0.5rem 1rem;cursor:pointer}
        .autocomplete-item:hover{background:rgba(255,255,255,0.1)}
    </style>
</head>
<body class="min-h-screen bg-gray-900 text-white flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-gray-900 rounded-lg p-5 glass-effect">
        <!-- Flight Type Selection -->
        <div class="mb-5">
            <div class="flex space-x-5">
                <div class="flex items-center space-x-2">
                    <div class="radio-circle selected" id="roundtrip" onclick="toggleTripType('round')"></div>
                    <span class="text-white">Roundtrip</span>
                </div>
                <div class="flex items-center space-x-2">
                    <div class="radio-circle" id="oneway" onclick="toggleTripType('one')"></div>
                    <span class="text-white">One way</span>
                </div>
            </div>
        </div>

        <!-- From/To Fields -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
            <div class="bg-opacity-10 bg-white border border-white border-opacity-10 rounded-lg p-2 flex items-center relative">
                <div class="p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </div>
                <div class="ml-2 flex-grow">
                    <div class="text-gray-400 text-xs">From</div>
                    <input type="text" id="from-input" placeholder="City or Airport" class="bg-transparent text-white text-base focus:outline-none w-full" value="" oninput="handleFromInput(this.value)">
                </div>
                <div id="from-autocomplete" class="autocomplete hidden"></div>
            </div>
            
            <div class="bg-opacity-10 bg-white border border-white border-opacity-10 rounded-lg p-2 flex items-center relative">
                <div class="p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </div>
                <div class="ml-2 flex-grow">
                    <div class="text-gray-400 text-xs">To</div>
                    <input type="text" id="to-input" placeholder="City or Airport" class="bg-transparent text-white text-base focus:outline-none w-full" value="" oninput="handleToInput(this.value)">
                </div>
                <div id="to-autocomplete" class="autocomplete hidden"></div>
            </div>
        </div>

        <!-- Date Fields -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
            <div class="bg-opacity-10 bg-white border border-white border-opacity-10 rounded-lg p-2 flex items-center cursor-pointer" onclick="toggleDatePicker('depart')">
                <div class="p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div class="ml-2">
                    <div class="text-gray-400 text-xs">Depart</div>
                    <div class="text-white text-base" id="depart-date"></div>
                </div>
            </div>
            
            <div id="return-date-container" class="bg-opacity-10 bg-white border border-white border-opacity-10 rounded-lg p-2 flex items-center cursor-pointer" onclick="toggleDatePicker('return')">
                <div class="p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div class="ml-2">
                    <div class="text-gray-400 text-xs">Return</div>
                    <div class="text-white text-base" id="return-date"></div>
                </div>
            </div>
        </div>

        <!-- Class and Travelers -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
            <div class="bg-opacity-10 bg-white border border-white border-opacity-10 rounded-lg p-2 flex items-center cursor-pointer" onclick="toggleClassDropdown()">
                <div class="p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <div class="ml-2 flex-grow">
                    <div class="text-gray-400 text-xs">Class</div>
                    <div class="text-white text-base" id="selected-class">Economy</div>
                </div>
                <div class="p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </div>
            </div>
            
            <div class="bg-opacity-10 bg-white border border-white border-opacity-10 rounded-lg p-2 flex items-center cursor-pointer" onclick="toggleTravelersDropdown()">
                <div class="p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <div class="ml-2 flex-grow">
                    <div class="text-gray-400 text-xs">Travellers</div>
                    <div class="text-white text-base" id="selected-travelers">1 Traveller</div>
                </div>
                <div class="p-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </div>
            </div>
        </div>

        <!-- Search Button -->
        <div class="flex justify-center">
            <button class="bg-blue-500 text-white font-medium py-2 px-4 rounded-lg shadow-lg hover:bg-blue-600 transition duration-300" id="searchBtn">
                Search Flights
            </button>
        </div>
    </div>

    <!-- Class Dropdown (Initially Hidden) -->
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-10 hidden" id="classDropdown">
        <div class="bg-gray-900 rounded-lg w-80 glass-effect">
            <div class="p-4 border-b border-white border-opacity-10">
                <h2 class="text-xl font-medium">Select Class</h2>
            </div>
            <div class="p-4">
                <div class="space-y-3">
                    <div class="flex items-center cursor-pointer" onclick="selectClass('Economy')">
                        <div class="radio-circle selected mr-3" id="economy-class"></div>
                        <span>Economy</span>
                    </div>
                    <div class="flex items-center cursor-pointer" onclick="selectClass('Premium Economy')">
                        <div class="radio-circle mr-3" id="premium-economy-class"></div>
                        <span>Premium Economy</span>
                    </div>
                    <div class="flex items-center cursor-pointer" onclick="selectClass('Business')">
                        <div class="radio-circle mr-3" id="business-class"></div>
                        <span>Business</span>
                    </div>
                    <div class="flex items-center cursor-pointer" onclick="selectClass('First Class')">
                        <div class="radio-circle mr-3" id="first-class"></div>
                        <span>First Class</span>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-white border-opacity-10 flex justify-end">
                <button class="bg-blue-500 text-white font-medium py-2 px-4 rounded-lg" onclick="closeClassDropdown()">Done</button>
            </div>
        </div>
    </div>

    <!-- Travelers Dropdown (Initially Hidden) -->
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-10 hidden" id="travelersDropdown">
        <div class="bg-gray-900 rounded-lg w-80 glass-effect">
            <div class="p-4 border-b border-white border-opacity-10">
                <h2 class="text-xl font-medium">Select Travelers</h2>
            </div>
            <div class="p-4">
                <div class="flex items-center justify-between mb-4">
                    <span>Number of Travelers</span>
                    <div class="flex items-center space-x-3">
                        <button class="w-8 h-8 rounded-full bg-opacity-10 bg-white border border-white border-opacity-10 flex items-center justify-center" onclick="decreaseTravelers()">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
                            </svg>
                        </button>
                        <span id="travelers-count">1</span>
                        <button class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center" onclick="increaseTravelers()">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <div class="p-4 border-t border-white border-opacity-10 flex justify-end">
                <button class="bg-blue-500 text-white font-medium py-2 px-4 rounded-lg" onclick="closeTravelersDropdown()">Done</button>
            </div>
        </div>
    </div>

    <!-- Date Picker Modal (Initially Hidden) -->
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-10 hidden" id="datePickerModal">
        <div class="bg-gray-900 rounded-lg max-w-md w-full glass-effect p-4">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center space-x-2">
                    <select id="month-selector" class="bg-gray-800 text-white rounded px-2 py-1" onchange="changeMonth()">
                        <option value="0">January</option><option value="1">February</option><option value="2">March</option>
                        <option value="3">April</option><option value="4">May</option><option value="5">June</option>
                        <option value="6">July</option><option value="7">August</option><option value="8">September</option>
                        <option value="9">October</option><option value="10">November</option><option value="11">December</option>
                    </select>
                    <select id="year-selector" class="bg-gray-800 text-white rounded px-2 py-1" onchange="changeYear()"></select>
                </div>
                <button class="text-white" onclick="closeDatePicker()">Done</button>
            </div>
            
            <div class="grid grid-cols-7 gap-2 text-center mb-2">
                <div class="text-gray-400 text-xs">SUN</div><div class="text-gray-400 text-xs">MON</div>
                <div class="text-gray-400 text-xs">TUE</div><div class="text-gray-400 text-xs">WED</div>
                <div class="text-gray-400 text-xs">THU</div><div class="text-gray-400 text-xs">FRI</div>
                <div class="text-gray-400 text-xs">SAT</div>
            </div>
            
            <div id="calendar-days" class="grid grid-cols-7 gap-2 text-center"></div>
        </div>
    </div>

    <script>
        // Cities database for autocomplete
        const cities = [
            "New York, USA", "London, UK", "Paris, France", "Tokyo, Japan", "Sydney, Australia", 
            "Dubai, UAE", "Singapore", "Hong Kong", "Berlin, Germany", "Rome, Italy",
            "Madrid, Spain", "Toronto, Canada", "Montreal, Canada", "Vancouver, Canada", "Los Angeles, USA",
            "Chicago, USA", "Miami, USA", "San Francisco, USA", "Amsterdam, Netherlands", "Bangkok, Thailand",
            "Beijing, China", "Shanghai, China", "Mumbai, India", "Delhi, India", "Cairo, Egypt",
            "Cape Town, South Africa", "Moscow, Russia", "Istanbul, Turkey", "Seoul, South Korea", "Mexico City, Mexico"
        ];
        
        // Global variables
        let currentDateType = 'depart';
        let today = new Date();
        let selectedDepartDate = new Date();
        let selectedReturnDate = new Date();
        selectedReturnDate.setDate(today.getDate() + 7);
        
        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            initYearSelector();
            updateDateDisplay();
            
            // Close dropdowns when clicking outside
            document.addEventListener('click', function(event) {
                const fromAutocomplete = document.getElementById('from-autocomplete');
                const toAutocomplete = document.getElementById('to-autocomplete');
                const fromInput = document.getElementById('from-input');
                const toInput = document.getElementById('to-input');
                
                if (!fromInput.contains(event.target) && !fromAutocomplete.contains(event.target)) {
                    fromAutocomplete.classList.add('hidden');
                }
                
                if (!toInput.contains(event.target) && !toAutocomplete.contains(event.target)) {
                    toAutocomplete.classList.add('hidden');
                }
            });
        });
        
        function updateDateDisplay() {
            document.getElementById('depart-date').textContent = formatDate(selectedDepartDate);
            document.getElementById('return-date').textContent = formatDate(selectedReturnDate);
        }
        
        // Initialize year selector
        function initYearSelector() {
            const yearSelector = document.getElementById('year-selector');
            const currentYear = new Date().getFullYear();
            for (let year = currentYear; year <= currentYear + 5; year++) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearSelector.appendChild(option);
            }
        }
        
        // Toggle trip type
        function toggleTripType(type) {
            const roundtrip = document.getElementById('roundtrip');
            const oneway = document.getElementById('oneway');
            const returnDateContainer = document.getElementById('return-date-container');
            
            if (type === 'round') {
                roundtrip.classList.add('selected');
                oneway.classList.remove('selected');
                returnDateContainer.classList.remove('hidden');
            } else {
                oneway.classList.add('selected');
                roundtrip.classList.remove('selected');
                returnDateContainer.classList.add('hidden');
            }
        }
        
        // Autocomplete for From input
        function handleFromInput(value) {
            const autocomplete = document.getElementById('from-autocomplete');
            if (value.length < 2) {
                autocomplete.classList.add('hidden');
                return;
            }
            
            const matches = cities.filter(city => 
                city.toLowerCase().includes(value.toLowerCase())
            );
            
            renderAutocomplete(autocomplete, matches, 'from');
        }
        
        // Autocomplete for To input
        function handleToInput(value) {
            const autocomplete = document.getElementById('to-autocomplete');
            if (value.length < 2) {
                autocomplete.classList.add('hidden');
                return;
            }
            
            const matches = cities.filter(city => 
                city.toLowerCase().includes(value.toLowerCase())
            );
            
            renderAutocomplete(autocomplete, matches, 'to');
        }
        
        // Render autocomplete results
        function renderAutocomplete(container, matches, type) {
            container.innerHTML = '';
            
            if (matches.length === 0) {
                container.classList.add('hidden');
                return;
            }
            
            matches.slice(0, 5).forEach(city => {
                const item = document.createElement('div');
                item.className = 'autocomplete-item';
                item.textContent = city;
                item.onclick = function() {
                    document.getElementById(`${type}-input`).value = city;
                    container.classList.add('hidden');
                };
                container.appendChild(item);
            });
            
            container.classList.remove('hidden');
        }
        
        // Class dropdown
        function toggleClassDropdown() {
            document.getElementById('classDropdown').classList.toggle('hidden');
        }
        
        function closeClassDropdown() {
            document.getElementById('classDropdown').classList.add('hidden');
        }
        
        function selectClass(className) {
            document.getElementById('selected-class').textContent = className;
            
            // Update radio buttons
            document.querySelectorAll('#classDropdown .radio-circle').forEach(circle => {
                circle.classList.remove('selected');
            });
            
            let id;
            switch(className) {
                case 'Economy': id = 'economy-class'; break;
                case 'Premium Economy': id = 'premium-economy-class'; break;
                case 'Business': id = 'business-class'; break;
                case 'First Class': id = 'first-class'; break;
            }
            
            document.getElementById(id).classList.add('selected');
        }
        
        // Travelers dropdown
        function toggleTravelersDropdown() {
            document.getElementById('travelersDropdown').classList.toggle('hidden');
        }
        
        function closeTravelersDropdown() {
            document.getElementById('travelersDropdown').classList.add('hidden');
            updateTravelersText();
        }
        
        function increaseTravelers() {
            const countElement = document.getElementById('travelers-count');
            let count = parseInt(countElement.textContent);
            if (count < 9) {
                countElement.textContent = count + 1;
            }
        }
        
        function decreaseTravelers() {
            const countElement = document.getElementById('travelers-count');
            let count = parseInt(countElement.textContent);
            if (count > 1) {
                countElement.textContent = count - 1;
            }
        }
        
        function updateTravelersText() {
            const count = document.getElementById('travelers-count').textContent;
            document.getElementById('selected-travelers').textContent = count + (count === '1' ? ' Traveller' : ' Travellers');
        }
        
        // Date picker
        function toggleDatePicker(type) {
            currentDateType = type;
            const datePickerModal = document.getElementById('datePickerModal');
            datePickerModal.classList.toggle('hidden');
            
            // Set current month based on selected date
            const date = type === 'depart' ? selectedDepartDate : selectedReturnDate;
            
            // Update month and year selectors
            document.getElementById('month-selector').value = date.getMonth();
            document.getElementById('year-selector').value = date.getFullYear();
            
            updateCalendar(date.getFullYear(), date.getMonth());
        }
        
        function changeMonth() {
            const monthSelector = document.getElementById('month-selector');
            const yearSelector = document.getElementById('year-selector');
            updateCalendar(parseInt(yearSelector.value), parseInt(monthSelector.value));
        }
        
        function changeYear() {
            const monthSelector = document.getElementById('month-selector');
            const yearSelector = document.getElementById('year-selector');
            updateCalendar(parseInt(yearSelector.value), parseInt(monthSelector.value));
        }
        
        function closeDatePicker() {
            document.getElementById('datePickerModal').classList.add('hidden');
        }
        
        function updateCalendar(year, month) {
            const calendarDays = document.getElementById('calendar-days');
            calendarDays.innerHTML = '';
            
            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // Add empty cells for days before the first day of month
            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'text-gray-500 text-sm py-2';
                calendarDays.appendChild(emptyCell);
            }
            
            // Add days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dayCell = document.createElement('div');
                dayCell.className = 'text-white text-sm py-2 cursor-pointer hover:bg-blue-500 hover:bg-opacity-30 rounded-full';
                dayCell.textContent = day;
                
                // Check if this day is selected
                const currentDateObj = new Date(year, month, day);
                const departDateObj = new Date(selectedDepartDate.getFullYear(), selectedDepartDate.getMonth(), selectedDepartDate.getDate());
                const returnDateObj = new Date(selectedReturnDate.getFullYear(), selectedReturnDate.getMonth(), selectedReturnDate.getDate());
                
                if (
                    (currentDateType === 'depart' && currentDateObj.getTime() === departDateObj.getTime()) ||
                    (currentDateType === 'return' && currentDateObj.getTime() === returnDateObj.getTime())
                ) {
                    dayCell.className = 'relative text-sm py-2';
                    dayCell.innerHTML = `
                        <div class="w-8 h-8 bg-blue-500 rounded-full absolute left-1/2 top-1/2 transform -translate-x-1/2 -translate-y-1/2"></div>
                        <span class="relative z-10 text-white">${day}</span>
                    `;
                }
                
                // Check if date is in the past
                if (currentDateObj < new Date(today.getFullYear(), today.getMonth(), today.getDate())) {
                    dayCell.className = 'text-gray-500 text-sm py-2';
                    dayCell.style.cursor = 'not-allowed';
                } else {
                    dayCell.onclick = function() {
                        selectDate(new Date(year, month, day));
                    };
                }
                
                calendarDays.appendChild(dayCell);
            }
        }
        
        function selectDate(newDate) {
            if (currentDateType === 'depart') {
                selectedDepartDate = newDate;
                document.getElementById('depart-date').textContent = formatDate(newDate);
                
                // If return date is before depart date, update return date
                if (selectedReturnDate < selectedDepartDate) {
                    const newReturnDate = new Date(selectedDepartDate);
                    newReturnDate.setDate(newReturnDate.getDate() + 7);
                    selectedReturnDate = newReturnDate;
                    document.getElementById('return-date').textContent = formatDate(newReturnDate);
                }
            } else {
                // Ensure return date is not before depart date
                if (newDate >= selectedDepartDate) {
                    selectedReturnDate = newDate;
                    document.getElementById('return-date').textContent = formatDate(newDate);
                } else {
                    alert('Return date cannot be before departure date');
                }
            }
            
            closeDatePicker();
        }
        
        function formatDate(date) {
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${monthNames[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
        }
    </script>
</body>
