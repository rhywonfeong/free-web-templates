    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Black Hole Visualization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .slider { -webkit-appearance: none; appearance: none; background: #374151; outline: none; border-radius: 4px; }
        .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: #f59e0b; cursor: pointer; border-radius: 50%; }
        .slider::-moz-range-thumb { width: 16px; height: 16px; background: #f59e0b; cursor: pointer; border-radius: 50%; border: none; }
    </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
</head>
<body class="bg-black overflow-hidden">
    <div id="container"></div>
    
    <!-- Control Panel -->
    <div class="absolute top-6 left-6 bg-gray-900/90 backdrop-blur-md border border-gray-700/50 rounded-xl p-5 text-white w-72">
        <h2 class="text-lg font-semibold mb-4 tracking-tight">Black Hole Parameters</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-gray-300 mb-2">Accretion Rate</label>
                <input type="range" id="accretionRate" min="0.1" max="3" step="0.1" value="1.5" class="slider w-full h-2">
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-2">Disk Temperature</label>
                <input type="range" id="temperature" min="0.5" max="2.5" step="0.1" value="1.8" class="slider w-full h-2">
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-2">Spin Rate</label>
                <input type="range" id="spinRate" min="0" max="2" step="0.1" value="0.8" class="slider w-full h-2">
            </div>
            <div>
                <label class="block text-sm text-gray-300 mb-2">Camera Distance</label>
                <input type="range" id="cameraDistance" min="20" max="80" step="5" value="40" class="slider w-full h-2">
            </div>
        </div>
    </div>

    <!-- Info Panel -->
    <div class="absolute bottom-6 right-6 bg-gray-900/90 backdrop-blur-md border border-gray-700/50 rounded-xl p-5 text-white max-w-sm">
        <h3 class="text-base font-semibold mb-3 tracking-tight">Kerr Black Hole</h3>
        <div class="space-y-2 text-sm text-gray-300">
            <p><span class="text-orange-400">Schwarzschild Radius:</span> 3.0 units</p>
            <p><span class="text-orange-400">Photon Sphere:</span> 4.5 units</p>
            <p><span class="text-orange-400">Ergosphere:</span> Dynamic</p>
            <p><span class="text-blue-400">Relativistic Jets:</span> Active</p>
        </div>
    </div>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000010, 1);
        document.getElementById('container').appendChild(renderer.domElement);

        // Create the 3D black hole sphere (event horizon)
        const blackHoleGeometry = new THREE.SphereGeometry(3, 64, 64);
        const blackHoleMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vPosition;
                varying vec3 vNormal;
                void main() {
                    vPosition = position;
                    vNormal = normal;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                varying vec3 vPosition;
                varying vec3 vNormal;
                void main() {
                    vec3 viewDir = normalize(cameraPosition - vPosition);
                    float fresnel = 1.0 - abs(dot(viewDir, vNormal));
                    
                    // Hawking radiation glow (very subtle)
                    float hawking = fresnel * 0.05 * (sin(time * 2.0) * 0.5 + 0.5);
                    vec3 color = vec3(0.1, 0.05, 0.2) * hawking;
                    
                    gl_FragColor = vec4(color, 1.0 - fresnel * 0.9);
                }
            `,
            uniforms: {
                time: { value: 0 }
            },
            transparent: true,
            side: THREE.BackSide
        });
        const blackHole = new THREE.Mesh(blackHoleGeometry, blackHoleMaterial);
        scene.add(blackHole);

        // Photon sphere (gravitational lensing)
        const photonSphereGeometry = new THREE.SphereGeometry(4.5, 64, 64);
        const photonSphereMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vPosition;
                varying vec3 vNormal;
                void main() {
                    vPosition = position;
                    vNormal = normal;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                varying vec3 vPosition;
                varying vec3 vNormal;
                void main() {
                    vec3 viewDir = normalize(cameraPosition - vPosition);
                    float fresnel = pow(1.0 - abs(dot(viewDir, vNormal)), 2.0);
                    
                    float flicker = sin(time * 3.0 + vPosition.x * 2.0) * 0.3 + 0.7;
                    vec3 color = vec3(1.0, 0.7, 0.3) * fresnel * flicker * 0.4;
                    
                    gl_FragColor = vec4(color, fresnel * 0.3);
                }
            `,
            uniforms: {
                time: { value: 0 }
            },
            transparent: true,
            side: THREE.FrontSide,
            blending: THREE.AdditiveBlending
        });
        const photonSphere = new THREE.Mesh(photonSphereGeometry, photonSphereMaterial);
        scene.add(photonSphere);

        // 3D Accretion disk (torus shape for proper 3D effect)
        const diskGeometry = new THREE.TorusGeometry(12, 4, 16, 100);
        const diskMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vPosition;
                varying vec3 vNormal;
                varying vec2 vUv;
                void main() {
                    vPosition = position;
                    vNormal = normal;
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform float accretionRate;
                uniform float temperature;
                uniform float spinRate;
                varying vec3 vPosition;
                varying vec3 vNormal;
                varying vec2 vUv;
                
                void main() {
                    float dist = length(vPosition.xz);
                    float angle = atan(vPosition.z, vPosition.x);
                    
                    // Spiral pattern
                    float spiral = sin(angle * 4.0 + time * spinRate * 2.0 + dist * 0.3) * 0.5 + 0.5;
                    
                    // Temperature gradient (hotter closer to center)
                    float temp = (20.0 - dist) / 15.0;
                    temp = pow(temp, 0.8) * temperature;
                    
                    // Doppler shift simulation
                    float doppler = sin(angle + time * spinRate) * 0.4 + 0.6;
                    
                    // Color based on temperature
                    vec3 color;
                    if (temp > 1.8) {
                        color = mix(vec3(1.0, 0.9, 0.8), vec3(0.8, 0.9, 1.0), (temp - 1.8) * 2.0);
                    } else if (temp > 1.0) {
                        color = mix(vec3(1.0, 0.6, 0.2), vec3(1.0, 0.9, 0.8), (temp - 1.0) * 1.25);
                    } else {
                        color = mix(vec3(0.8, 0.1, 0.0), vec3(1.0, 0.6, 0.2), temp);
                    }
                    
                    color *= doppler;
                    
                    // Turbulence
                    float turbulence = sin(time * 1.5 + dist * 2.0 + angle * 6.0) * 0.3 + 0.7;
                    
                    float brightness = spiral * accretionRate * temp * turbulence;
                    brightness *= smoothstep(0.0, 0.3, abs(vPosition.y / 4.0));
                    
                    gl_FragColor = vec4(color * brightness, brightness * 0.9);
                }
            `,
            uniforms: {
                time: { value: 0 },
                accretionRate: { value: 1.5 },
                temperature: { value: 1.8 },
                spinRate: { value: 0.8 }
            },
            transparent: true,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide
        });
        const disk = new THREE.Mesh(diskGeometry, diskMaterial);
        disk.rotation.x = Math.PI / 2;
        scene.add(disk);

        // 3D Relativistic jets
        const jetGeometry = new THREE.ConeGeometry(0.5, 60, 8);
        const jetMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vPosition;
                varying float vDistance;
                void main() {
                    vPosition = position;
                    vDistance = length(position);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                varying vec3 vPosition;
                varying float vDistance;
                void main() {
                    float intensity = 1.0 / (1.0 + vDistance * 0.02);
                    float flicker = sin(time * 4.0 + vPosition.y * 0.1) * 0.3 + 0.7;
                    
                    vec3 color = vec3(0.3, 0.6, 1.0) * intensity * flicker;
                    gl_FragColor = vec4(color, intensity * 0.7);
                }
            `,
            uniforms: {
                time: { value: 0 }
            },
            transparent: true,
            blending: THREE.AdditiveBlending
        });

        const jet1 = new THREE.Mesh(jetGeometry, jetMaterial);
        jet1.position.y = 30;
        scene.add(jet1);

        const jet2 = new THREE.Mesh(jetGeometry, jetMaterial);
        jet2.position.y = -30;
        jet2.rotation.x = Math.PI;
        scene.add(jet2);

        // 3D Star field
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 15000;
        const positions = new Float32Array(starsCount * 3);
        const colors = new Float32Array(starsCount * 3);
        const sizes = new Float32Array(starsCount);

        for (let i = 0; i < starsCount; i++) {
            // Spherical distribution
            const radius = 200 + Math.random() * 800;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            
            positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i * 3 + 2] = radius * Math.cos(phi);
            
            const colorType = Math.random();
            if (colorType > 0.9) {
                colors[i * 3] = 0.7 + Math.random() * 0.3;
                colors[i * 3 + 1] = 0.7 + Math.random() * 0.3;
                colors[i * 3 + 2] = 1.0;
            } else if (colorType > 0.8) {
                colors[i * 3] = 1.0;
                colors[i * 3 + 1] = 0.8 + Math.random() * 0.2;
                colors[i * 3 + 2] = 0.6 + Math.random() * 0.2;
            } else {
                colors[i * 3] = 0.8 + Math.random() * 0.2;
                colors[i * 3 + 1] = 0.8 + Math.random() * 0.2;
                colors[i * 3 + 2] = 0.8 + Math.random() * 0.2;
            }
            
            sizes[i] = Math.random() * 3 + 1;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        starsGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const starsMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                attribute float size;
                varying vec3 vColor;
                void main() {
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;
                    float alpha = 1.0 - smoothstep(0.0, 0.5, dist);
                    gl_FragColor = vec4(vColor, alpha);
                }
            `,
            transparent: true,
            vertexColors: true,
            blending: THREE.AdditiveBlending
        });

        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // Camera setup
        let cameraDistance = 40;
        camera.position.set(0, 10, cameraDistance);
        camera.lookAt(0, 0, 0);

        let time = 0;
        let autoRotate = true;

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            // Update all shader uniforms
            blackHoleMaterial.uniforms.time.value = time;
            photonSphereMaterial.uniforms.time.value = time;
            diskMaterial.uniforms.time.value = time;
            jetMaterial.uniforms.time.value = time;

            // Rotate black hole and accretion disk
            const spinRate = diskMaterial.uniforms.spinRate.value;
            blackHole.rotation.y += spinRate * 0.01;
            disk.rotation.z += spinRate * 0.02;

            // Auto-rotate camera
            if (autoRotate) {
                const angle = time * 0.2;
                camera.position.x = Math.sin(angle) * cameraDistance;
                camera.position.z = Math.cos(angle) * cameraDistance;
                camera.position.y = Math.sin(time * 0.1) * 10 + 5;
                camera.lookAt(0, 0, 0);
            }

            // Subtle jet animation
            jet1.rotation.y += 0.005;
            jet2.rotation.y -= 0.005;

            renderer.render(scene, camera);
        }

        // Controls
        document.getElementById('accretionRate').addEventListener('input', (e) => {
            diskMaterial.uniforms.accretionRate.value = parseFloat(e.target.value);
        });

        document.getElementById('temperature').addEventListener('input', (e) => {
            diskMaterial.uniforms.temperature.value = parseFloat(e.target.value);
        });

        document.getElementById('spinRate').addEventListener('input', (e) => {
            diskMaterial.uniforms.spinRate.value = parseFloat(e.target.value);
        });

        document.getElementById('cameraDistance').addEventListener('input', (e) => {
            cameraDistance = parseFloat(e.target.value);
        });

        // Mouse interaction
        let mouseDown = false;
        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousedown', (e) => {
            mouseDown = true;
            autoRotate = false;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        document.addEventListener('mouseup', () => {
            mouseDown = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (mouseDown) {
                const deltaX = e.clientX - mouseX;
                const deltaY = e.clientY - mouseY;
                
                const spherical = new THREE.Spherical();
                spherical.setFromVector3(camera.position);
                spherical.theta -= deltaX * 0.01;
                spherical.phi += deltaY * 0.01;
                spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
                
                camera.position.setFromSpherical(spherical);
                camera.lookAt(0, 0, 0);
                
                mouseX = e.clientX;
                mouseY = e.clientY;
            }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
    </script>
</body>
