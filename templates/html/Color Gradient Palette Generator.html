    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Palette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function generateGradient() {
            const startColor = document.getElementById('startColor').value;
            const endColor = document.getElementById('endColor').value;
            const numColors = parseInt(document.getElementById('numColors').value);
            
            const gradientContainer = document.getElementById('gradientContainer');
            gradientContainer.innerHTML = '';
            
            for (let i = 0; i < numColors; i++) {
                const div = document.createElement('div');
                div.className = 'h-full';
                div.style.flex = '1';
                div.style.backgroundColor = interpolateColor(startColor, endColor, i / (numColors - 1));
                gradientContainer.appendChild(div);
            }
        }
        
        function interpolateColor(color1, color2, factor) {
            const r1 = parseInt(color1.substring(1, 3), 16);
            const g1 = parseInt(color1.substring(3, 5), 16);
            const b1 = parseInt(color1.substring(5, 7), 16);
            
            const r2 = parseInt(color2.substring(1, 3), 16);
            const g2 = parseInt(color2.substring(3, 5), 16);
            const b2 = parseInt(color2.substring(5, 7), 16);
            
            const r = Math.round(r1 + factor * (r2 - r1));
            const g = Math.round(g1 + factor * (g2 - g1));
            const b = Math.round(b1 + factor * (b2 - b1));
            
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }
        
        function randomizeColors() {
            const randomColor = () => `#${Math.floor(Math.random()*16777215).toString(16).padStart(6, '0')}`;
            document.getElementById('startColor').value = randomColor();
            document.getElementById('endColor').value = randomColor();
            generateGradient();
        }
        
        function exportPalette() {
            const startColor = document.getElementById('startColor').value;
            const endColor = document.getElementById('endColor').value;
            const numColors = parseInt(document.getElementById('numColors').value);
            
            let colors = [];
            for (let i = 0; i < numColors; i++) {
                colors.push(interpolateColor(startColor, endColor, i / (numColors - 1)));
            }
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(colors));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "colorup-palette.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-2xl">
        <h1 class="text-2xl font-bold text-center mb-2">Gradient Palette</h1>
        <p class="text-gray-500 text-center mb-6">Create a gradient palette between two colors.</p>
        
        <div id="gradientContainer" class="w-full h-32 rounded-lg flex mb-6 overflow-hidden shadow-md"></div>
        
        <div class="flex flex-wrap items-center gap-4">
            <div class="flex items-center">
                <div class="w-8 h-8 rounded border border-gray-300 mr-2 overflow-hidden">
                    <input type="color" id="startColor" value="#F5E6AD" class="w-10 h-10 -ml-1 -mt-1 cursor-pointer" oninput="generateGradient()">
                </div>
                <input type="text" id="startColorText" value="#F5E6AD" class="w-24 px-2 py-1 border border-gray-300 rounded" 
                       oninput="document.getElementById('startColor').value = this.value; generateGradient()">
            </div>
            
            <div class="flex items-center">
                <div class="w-8 h-8 rounded border border-gray-300 mr-2 overflow-hidden">
                    <input type="color" id="endColor" value="#F13C77" class="w-10 h-10 -ml-1 -mt-1 cursor-pointer" oninput="generateGradient()">
                </div>
                <input type="text" id="endColorText" value="#F13C77" class="w-24 px-2 py-1 border border-gray-300 rounded"
                       oninput="document.getElementById('endColor').value = this.value; generateGradient()">
            </div>
            
            <div class="flex items-center">
                <label for="numColors" class="mr-2 text-sm">Number of colors:</label>
                <input type="number" id="numColors" min="2" max="20" value="7" class="w-16 px-2 py-1 border border-gray-300 rounded"
                       oninput="generateGradient()">
            </div>
            
            <button onclick="randomizeColors()" class="px-4 py-1 border border-gray-300 rounded hover:bg-gray-100">
                Random
            </button>
            
            <button onclick="exportPalette()" class="ml-auto px-4 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 flex items-center">
                Export
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                </svg>
            </button>
        </div>
    </div>
    
    <script>
        // Initialize gradient on page load
        document.addEventListener('DOMContentLoaded', generateGradient);
        
        // Sync text inputs with color inputs
        document.getElementById('startColor').addEventListener('input', function() {
            document.getElementById('startColorText').value = this.value;
        });
        
        document.getElementById('endColor').addEventListener('input', function() {
            document.getElementById('endColorText').value = this.value;
        });
    </script>
</body>
</html>
