<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Processing your request</title>
<!-- Inter Tight font -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#FAFBFE] text-[#404040] flex flex-col items-center justify-center min-h-screen px-6" style="font-family:'Inter Tight',sans-serif;">

  <!-- Card -->
  <div class="w-full max-w-md bg-white shadow-xl rounded-xl p-8 flex flex-col items-center gap-6">

    <!-- Badge -->
    <div class="w-14 h-14 bg-[#1888FF]/10 flex items-center justify-center rounded-full">
      <i data-lucide="shield-check" class="w-7 h-7 text-[#1888FF]" aria-hidden="true"></i>
    </div>

    <!-- Title -->
    <h1 class="text-2xl tracking-tight font-semibold text-center">
      Processing your request
    </h1>

    <!-- Subtitle -->
    <p class="text-sm leading-relaxed text-center max-w-xs">
      We’re running a few checks to personalize your offer. This will only take a moment—please keep this window open.
    </p>

    <!-- Progress bar -->
    <div class="w-full h-1 bg-gray-200 rounded-full overflow-hidden" aria-hidden="true">
      <div id="progressBar" class="h-full bg-[#1888FF] transition-all duration-100 ease-linear" style="width:0%"></div>
    </div>

    <!-- 3-step status -->
    <div class="w-full flex items-start justify-between pt-2">

      <!-- Step 1 -->
      <div id="step1"
           class="flex flex-col items-center gap-2 opacity-0 translate-y-2 transform-gpu transition-all duration-500 ease-out">
        <div class="w-10 h-10 bg-[#1888FF]/10 flex items-center justify-center rounded-full">
          <i data-lucide="file-text" class="w-5 h-5 text-[#1888FF]" aria-label="Verifying data"></i>
        </div>
        <span class="text-xs font-medium text-center w-20 leading-tight">Verifying data</span>
      </div>

      <!-- Step 2 -->
      <div id="step2"
           class="flex flex-col items-center gap-2 opacity-0 translate-y-2 transform-gpu transition-all duration-500 ease-out">
        <div class="w-10 h-10 bg-[#1888FF]/10 flex items-center justify-center rounded-full">
          <i data-lucide="search" class="w-5 h-5 text-[#1888FF]" aria-label="Finding best option"></i>
        </div>
        <span class="text-xs font-medium text-center w-20 leading-tight">Finding best option</span>
      </div>

      <!-- Step 3 -->
      <div id="step3"
           class="flex flex-col items-center gap-2 opacity-0 translate-y-2 transform-gpu transition-all duration-500 ease-out">
        <div class="w-10 h-10 bg-[#1888FF]/10 flex items-center justify-center rounded-full">
          <i data-lucide="check-circle" class="w-5 h-5 text-[#1888FF]" aria-label="Generating offer"></i>
        </div>
        <span class="text-xs font-medium text-center w-20 leading-tight">Generating offer</span>
      </div>
    </div>

    <!-- Divider -->
    <hr class="w-full border-gray-200">

    <!-- Reminder -->
    <p class="text-xs text-gray-500 text-center max-w-xs">
      Please don’t refresh or close this tab—your personalized options will appear automatically.
    </p>
  </div>

  <script>
    lucide.createIcons();

    const progressBar = document.getElementById('progressBar');
    const steps = [
      { el: document.getElementById('step1'), threshold: 34 },
      { el: document.getElementById('step2'), threshold: 67 },
      { el: document.getElementById('step3'), threshold: 100 }
    ];

    let progress = 0;
    const interval = setInterval(() => {
      progress += 1;                 // 1 % every 100 ms → 10 s total
      progressBar.style.width = progress + '%';

      steps.forEach(step => {
        if (progress >= step.threshold && step.el.classList.contains('opacity-0')) {
          step.el.classList.remove('opacity-0', 'translate-y-2');
          step.el.classList.add('opacity-100', 'translate-y-0');
        }
      });

      if (progress >= 100) clearInterval(interval);
    }, 100);
  </script>
</body>
</html>
