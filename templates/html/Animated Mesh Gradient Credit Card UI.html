  <meta charset="UTF-8">
  <meta name="viewport" content="width=320, initial-scale=1.0">
  <title>Mesh Gradient Credit Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            mesh1: "moveMesh1 28s ease-in-out infinite",
            mesh2: "moveMesh2 32s linear infinite",
            mesh3: "moveMesh3 26s ease-in-out infinite"
          },
          keyframes: {
            moveMesh1: {
              "0%":   { transform: "translate(0, 0) scale(1)" },
              "50%":  { transform: "translate(50px, 20px) scale(1.1)" },
              "100%": { transform: "translate(0, 0) scale(1)" }
            },
            moveMesh2: {
              "0%":   { transform: "translate(0, 0) scale(1)" },
              "50%":  { transform: "translate(-40px, 30px) scale(1.15)" },
              "100%": { transform: "translate(0, 0) scale(1)" }
            },
            moveMesh3: {
              "0%":   { transform: "translate(0, 0) scale(1)" },
              "50%":  { transform: "translate(20px, -40px) scale(1.08)" },
              "100%": { transform: "translate(0, 0) scale(1)" }
            }
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --c1: 18,113,255;
      --c2: 221,74,255;
      --c3: 100,220,255;
      --c4: 200,50,50;
      --c5: 180,180,50;
      --cchip: #d3cfcf;
      --card-radius: 24px;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-900">
  <div class="relative w-[300px] h-[180px] rounded-[var(--card-radius)] shadow-2xl overflow-hidden">
    <!-- Mesh Gradient Layers -->
    <div class="absolute inset-0">
      <div class="absolute w-[220px] h-[180px] -left-10 -top-6 rounded-full opacity-70 z-0 animate-mesh1"
        style="background:radial-gradient(circle at 60% 40%,rgba(var(--c1),0.6) 0%,rgba(var(--c1),0) 75%);mix-blend-mode:hard-light;">
      </div>
      <div class="absolute w-[265px] h-[140px] left-12 top-6 rounded-full opacity-70 z-0 animate-mesh2"
        style="background:radial-gradient(circle at 40% 70%,rgba(var(--c2),0.5) 0%,rgba(var(--c2),0) 95%);mix-blend-mode:hard-light;">
      </div>
      <div class="absolute w-[196px] h-[196px] left-10 -bottom-10 rounded-full opacity-70 z-0 animate-mesh3"
        style="background:radial-gradient(circle at 80% 80%,rgba(var(--c3),0.8) 0%,rgba(var(--c3),0) 100%);mix-blend-mode:hard-light;">
      </div>
      <div class="absolute w-[150px] h-[120px] left-32 top-0 rounded-full opacity-50"
        style="background:radial-gradient(circle at 40% 60%,rgba(var(--c4),0.5) 0%,rgba(var(--c4),0) 80%);mix-blend-mode:hard-light;">
      </div>
      <div class="absolute w-[180px] h-[70px] left-14 bottom-0 rounded-full opacity-60"
        style="background:radial-gradient(circle at 60% 40%,rgba(var(--c5),0.45) 0%,rgba(var(--c5),0) 85%);mix-blend-mode:hard-light;">
      </div>
    </div>
    <!-- Glass overlay for the card look -->
    <div class="absolute inset-0 rounded-[var(--card-radius)] bg-white/10 backdrop-blur-[2px] z-10"></div>
    <!-- Card contents -->
    <div class="absolute inset-0 px-6 pt-5 pb-4 flex flex-col justify-between z-20 text-white h-full">
      <div class="flex flex-row justify-between items-start">
        <!-- Chip Icon -->
        <div class="w-9 h-6 rounded bg-[#cececf] bg-gradient-to-tr from-[#d6d6db] to-[#b7b2a5] 
                    flex items-center justify-center shadow-md border border-white/20">
          <svg viewBox="0 0 36 24" width="32" height="18" fill="none">
            <rect x="2" y="3" width="32" height="18" rx="3" fill="#aeaba7" />
            <rect x="11" y="7" width="14" height="10" rx="1.5" fill="#dedadc" />
            <rect x="16" y="8" width="4" height="8" rx="1" fill="#beb7b1" />
          </svg>
        </div>
        <!-- Card Logo, for example a "VISA" type mark -->
        <div class="w-12 flex justify-end">
          <div class="flex items-center gap-1">
            <span class="text-lg font-extrabold tracking-wide">VISA</span>
          </div>
        </div>
      </div>
      <!-- Card Number -->
      <div class="text-xl sm:text-2xl font-semibold tracking-widest text-white text-center select-none drop-shadow font-mono mt-2 mb-2">
        4920&nbsp;1234&nbsp;5678&nbsp;9012
      </div>
      <!-- Names etc -->
      <div class="flex flex-row text-xs justify-between pt-1">
        <div class="flex flex-col">
          <span class="opacity-80 tracking-widest">CARD HOLDER</span>
          <span class="font-medium text-sm tracking-wide uppercase">ALEX VARGAS</span>
        </div>
        <div class="flex flex-col items-end">
          <span class="opacity-80 tracking-widest">EXPIRES</span>
          <span class="font-medium text-sm tracking-wide">09/28</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
