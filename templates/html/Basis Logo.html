<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BASIS – Logo Showcase</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Libraries -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <style>
    /* Sharper electric neon */
    @keyframes neonPulse{
      0%,100%{filter:drop-shadow(0 0 4px #3b82f6) drop-shadow(0 0 12px #0ea5e9);}
      50%      {filter:drop-shadow(0 0 2px #3b82f6) drop-shadow(0 0 6px #0ea5e9);}
    }
    @keyframes riseFade{
      0%{opacity:0;transform:translateY(40px) scale(.94)}
      100%{opacity:1;transform:translateY(0) scale(1)}
    }

    /* Grid + Radial stay unchanged for subtle depth */
    body::before{
      content:"";position:fixed;inset:0;z-index:-3;
      background:
        repeating-linear-gradient(0deg,transparent 0 23px,#3341550a 24px 24.5px),
        repeating-linear-gradient(90deg,transparent 0 23px,#3341550a 24px 24.5px);
      pointer-events:none;
    }
    body::after{
      content:"";position:fixed;inset:0;z-index:-4;
      background:radial-gradient(circle at 50% 40%,rgba(59,130,246,.22) 0%,transparent 55%);
      pointer-events:none;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
  <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-black text-white font-[Inter] antialiased overflow-x-hidden">
  <!-- NAV -->
  <header class="fixed top-0 inset-x-0 z-50 backdrop-blur-md/5">
    <div class="mx-auto max-w-7xl flex items-center justify-between px-6 py-4">
      <a href="#" class="text-2xl font-semibold tracking-tight hover:opacity-90 transition">BASIS</a>
      <nav class="hidden md:flex gap-10 text-sm font-medium">
        <a href="#" class="group">Products<span class="block h-px w-0 bg-blue-500 transition-all group-hover:w-full"></span></a>
        <a href="#" class="group">Science<span class="block h-px w-0 bg-blue-500 transition-all group-hover:w-full"></span></a>
        <a href="#" class="group">Stories<span class="block h-px w-0 bg-blue-500 transition-all group-hover:w-full"></span></a>
      </nav>
      <button id="menuBtn" class="md:hidden p-2"><i data-lucide="menu" class="w-6 h-6"></i></button>
    </div>
    <!-- Mobile panel -->
    <div id="mobileNav" class="fixed inset-0 bg-black/90 backdrop-blur-md flex-col items-center justify-center gap-10 text-xl font-medium hidden">
      <button class="absolute top-6 right-6 p-2" id="closeMenu"><i data-lucide="x" class="w-7 h-7"></i></button>
      <a href="#" class="hover:text-sky-400" style="animation:riseFade .4s .05s both">Products</a>
      <a href="#" class="hover:text-sky-400" style="animation:riseFade .4s .15s both">Science</a>
      <a href="#" class="hover:text-sky-400" style="animation:riseFade .4s .25s both">Stories</a>
    </div>
  </header>

  <!-- HERO -->
  <section class="relative flex flex-col items-center justify-center text-center min-h-screen pt-32 px-6">
    <div id="particles-js" class="absolute inset-0 -z-10"></div>

    <h1 id="logo"
        class="select-none text-[clamp(64px,14vw,200px)] font-semibold tracking-tight bg-clip-text text-transparent bg-gradient-to-b from-sky-300 via-sky-400 to-blue-600"
        style="animation:neonPulse 7s ease-in-out infinite, riseFade .8s .1s both">
      BASIS
    </h1>

    <p class="max-w-xl mt-8 leading-relaxed text-sky-200/90 text-lg"
       style="animation:riseFade .8s .3s both">
      Precision skincare, powered by biomechanics &amp; performance science.
    </p>
  </section>

  <!-- FOOTER -->
  <footer class="border-t border-white/10">
    <div class="mx-auto max-w-7xl px-6 py-16 flex flex-col md:flex-row items-center justify-between gap-6">
      <p class="text-sm text-gray-400">&copy; 2024 Basis Labs. All rights reserved.</p>
      <nav class="flex gap-8 text-sm text-gray-300">
        <a href="#" class="hover:text-white">Privacy</a>
        <a href="#" class="hover:text-white">Terms</a>
        <a href="#" class="hover:text-white">Support</a>
      </nav>
    </div>
  </footer>

  <script>
    // Mobile nav
    menuBtn.addEventListener('click',()=>mobileNav.classList.remove('hidden'));
    closeMenu.addEventListener('click',()=>mobileNav.classList.add('hidden'));

    // Icons
    lucide.createIcons();

    // Particles
    particlesJS('particles-js',{
      particles:{number:{value:60,density:{enable:true,value_area:800}},
      color:{value:"#3b82f6"},shape:{type:"circle"},
      opacity:{value:0.2},size:{value:2,random:true},
      line_linked:{enable:true,distance:150,color:"#3b82f6",opacity:0.35,width:1},
      move:{enable:true,speed:1.4,out_mode:"out"}},
      interactivity:{events:{onhover:{enable:true,mode:"grab"}}},
      retina_detect:true
    });

    // 3-D logo
    const logo=document.getElementById('logo');
    window.addEventListener('mousemove',e=>{
      const{innerWidth:w,innerHeight:h}=window;
      const x=(e.clientX-w/2)/(w/2),
            y=(e.clientY-h/2)/(h/2);
      logo.style.transform=`rotateY(${x*12}deg) rotateX(${y*-12}deg)`;
    });
    window.addEventListener('mouseleave',()=>logo.style.transform='rotateY(0deg) rotateX(0deg)');
  </script>
</body>
</html>
