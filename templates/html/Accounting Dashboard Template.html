<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickBooks App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
body { font-family: 'Inter', sans-serif; }
iconify-icon { stroke-width: 1.5; }
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-gray-50/50 text-gray-900 min-h-screen p-4 sm:p-6 md:p-10 flex flex-col items-center justify-center antialiased selection:bg-gray-200">

    <div class="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        
        <!-- Login Activity Card -->
        <div class="col-span-1 lg:col-span-4 bg-white rounded-2xl border border-orange-200/60 shadow-sm p-6 sm:p-8">
            <div class="mb-8">
                <div class="w-10 h-10 bg-orange-900 rounded-lg flex items-center justify-center mb-6">
                    <span class="text-white text-lg font-semibold tracking-tighter">QB</span>
                </div>
                <h1 class="text-xl font-semibold tracking-tight">Sign In</h1>
                <p class="text-sm text-orange-500 mt-1.5">Access your dashboard.</p>
            </div>
            
            <form class="space-y-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-orange-600 uppercase tracking-wider">Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <iconify-icon icon="solar:letter-linear" class="text-orange-400 text-lg"></iconify-icon>
                        </div>
                        <input type="email" value="vasudevnain983@gmail.com" class="w-full bg-white border border-orange-200 rounded-xl pl-10 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-900/10 focus:border-orange-900 transition-all placeholder-orange-400" placeholder="name@example.com">
                    </div>
                </div>
                
                <div class="space-y-1.5">
                    <label class="text-xs font-medium text-orange-600 uppercase tracking-wider">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <iconify-icon icon="solar:lock-password-linear" class="text-orange-400 text-lg"></iconify-icon>
                        </div>
                        <input type="password" value="Vasudev@7976" class="w-full bg-white border border-orange-200 rounded-xl pl-10 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-900/10 focus:border-orange-900 transition-all placeholder-orange-400" placeholder="••••••••">
                    </div>
                </div>
                
                <button type="button" class="w-full bg-orange-900 text-white rounded-xl px-4 py-2.5 text-sm font-medium hover:bg-orange-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-900 transition-all mt-4">
                    Login
                </button>
            </form>
        </div>

        <!-- Home Activity Card -->
        <div class="col-span-1 lg:col-span-4 bg-white rounded-2xl border border-orange-200/60 shadow-sm p-6 sm:p-8 flex flex-col h-full min-h-[400px]">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold tracking-tight">Parties</h2>
                <button class="p-1.5 text-orange-400 hover:text-orange-900 rounded-lg hover:bg-orange-50 transition-colors focus:outline-none focus:ring-2 focus:ring-orange-900/10">
                     <iconify-icon icon="solar:magnifer-linear" class="text-lg"></iconify-icon>
                </button>
            </div>
            
            <div class="space-y-1.5 flex-1">
                <button class="w-full flex items-center justify-between p-3 rounded-xl hover:bg-orange-50 focus:bg-orange-50 transition-colors border border-transparent focus:border-orange-200 outline-none group text-left">
                    <div class="flex items-center gap-3.5">
                        <div class="w-9 h-9 rounded-full bg-orange-100 flex items-center justify-center text-orange-500 group-hover:text-orange-900 group-hover:bg-white border border-transparent group-hover:border-orange-200 group-focus:border-orange-200 transition-all">
                            <iconify-icon icon="solar:cup-hot-linear" class="text-lg"></iconify-icon>
                        </div>
                        <span class="text-sm font-medium text-orange-900">Little Espresso Cafe</span>
                    </div>
                    <iconify-icon icon="solar:alt-arrow-right-linear" class="text-orange-300 group-hover:text-orange-900 transition-colors"></iconify-icon>
                </button>
                
                <button class="w-full flex items-center justify-between p-3 rounded-xl hover:bg-orange-50 focus:bg-orange-50 transition-colors border border-transparent focus:border-orange-200 outline-none group text-left">
                    <div class="flex items-center gap-3.5">
                         <div class="w-9 h-9 rounded-full bg-orange-100 flex items-center justify-center text-orange-500 group-hover:text-orange-900 group-hover:bg-white border border-transparent group-hover:border-orange-200 group-focus:border-orange-200 transition-all">
                            <iconify-icon icon="solar:confetti-linear" class="text-lg"></iconify-icon>
                        </div>
                        <span class="text-sm font-medium text-orange-900">The PartY Room</span>
                    </div>
                    <iconify-icon icon="solar:alt-arrow-right-linear" class="text-orange-300 group-hover:text-orange-900 transition-colors"></iconify-icon>
                </button>
                
                <button class="w-full flex items-center justify-between p-3 rounded-xl hover:bg-orange-50 focus:bg-orange-50 transition-colors border border-transparent focus:border-orange-200 outline-none group text-left">
                    <div class="flex items-center gap-3.5">
                         <div class="w-9 h-9 rounded-full bg-orange-100 flex items-center justify-center text-orange-500 group-hover:text-orange-900 group-hover:bg-white border border-transparent group-hover:border-orange-200 group-focus:border-orange-200 transition-all">
                            <iconify-icon icon="solar:basketball-linear" class="text-lg"></iconify-icon>
                        </div>
                        <span class="text-sm font-medium text-orange-900">SportsCo Melton</span>
                    </div>
                    <iconify-icon icon="solar:alt-arrow-right-linear" class="text-orange-300 group-hover:text-orange-900 transition-colors"></iconify-icon>
                </button>
            </div>
        </div>

        <!-- Party Details & Settings Column -->
        <div class="col-span-1 lg:col-span-4 flex flex-col gap-6">
            
            <!-- Party Activity Card -->
            <div class="bg-white rounded-2xl border border-orange-200/60 shadow-sm p-6 sm:p-8">
                <div class="flex items-center gap-2 mb-6">
                     <button class="p-1.5 -ml-1.5 text-orange-400 hover:text-orange-900 rounded-lg hover:bg-orange-50 transition-colors focus:outline-none">
                         <iconify-icon icon="solar:arrow-left-linear" class="text-xl"></iconify-icon>
                     </button>
                     <h2 class="text-xl font-semibold tracking-tight truncate">Little Espresso Cafe</h2>
                </div>

                <div class="border-2 border-dashed border-orange-200 hover:border-orange-300 rounded-xl p-8 flex flex-col items-center justify-center text-center bg-orange-50/50 hover:bg-orange-50 transition-all cursor-pointer group outline-none focus-within:ring-2 focus-within:ring-orange-900/10 focus-within:border-orange-400">
                    <input type="file" class="sr-only" id="file-upload">
                    <label for="file-upload" class="cursor-pointer flex flex-col items-center">
                        <div class="w-12 h-12 rounded-full bg-white border border-orange-200 shadow-sm flex items-center justify-center text-orange-600 mb-4 group-hover:-translate-y-1 transition-transform duration-300">
                            <iconify-icon icon="solar:upload-minimalistic-linear" class="text-2xl"></iconify-icon>
                        </div>
                        <span class="text-sm font-medium text-orange-900 mb-1">Attach PDF / Photo</span>
                        <span class="text-xs text-orange-500">Supports .pdf, .jpg, .png</span>
                    </label>
                </div>
            </div>

            <!-- Settings Activity Card -->
            <div class="bg-white rounded-2xl border border-orange-200/60 shadow-sm p-6 sm:p-8">
                <h2 class="text-xl font-semibold tracking-tight mb-5">Settings</h2>
                
                <div class="space-y-5">
                    <div class="flex items-center justify-between group cursor-pointer">
                        <div class="flex items-center gap-3 text-sm font-medium text-orange-700 group-hover:text-orange-900 transition-colors">
                            <div class="w-8 h-8 rounded-lg bg-orange-50 border border-orange-100 flex items-center justify-center text-orange-500">
                                <iconify-icon icon="solar:global-linear" class="text-lg"></iconify-icon>
                            </div>
                            Language Option
                        </div>
                        <span class="text-xs font-medium text-orange-600 bg-orange-100/80 border border-orange-200/50 px-2.5 py-1 rounded-md">English</span>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3 text-sm font-medium text-orange-700">
                            <div class="w-8 h-8 rounded-lg bg-orange-50 border border-orange-100 flex items-center justify-center text-orange-500">
                                <iconify-icon icon="solar:moon-linear" class="text-lg"></iconify-icon>
                            </div>
                            Dark Mode
                        </div>
                        <label class="relative flex items-center cursor-pointer">
                          <input type="checkbox" class="sr-only peer">
                          <div class="w-9 h-5 bg-orange-200 rounded-full peer peer-focus:ring-2 peer-focus:ring-orange-900/10 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-orange-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-orange-900"></div>
                        </label>
                    </div>

                    <div class="pt-2">
                        <button class="w-full flex items-center justify-center gap-2 bg-white border border-orange-200 text-orange-900 rounded-xl px-4 py-2.5 text-sm font-medium hover:bg-orange-50 focus:outline-none focus:ring-2 focus:ring-orange-900/10 transition-all shadow-sm">
                            <iconify-icon icon="solar:add-square-linear" class="text-lg text-orange-500"></iconify-icon>
                            Add Party
                        </button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>


</body></html>
