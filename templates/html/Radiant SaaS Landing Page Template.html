<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiant</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
body { font-family: 'Inter', sans-serif; }
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>

</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-white min-h-screen text-neutral-900 antialiased selection:bg-purple-200">
    
    <main class="w-full max-w-[1440px] mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Hero Card -->
        <div class="relative overflow-hidden rounded-[2rem] sm:rounded-[3rem] w-full"
             style="background: linear-gradient(to bottom right, #fdf1cd 0%, #ffdbcf 25%, #f3a9df 55%, #a66cf5 80%, #7d33f2 100%);">

            <!-- Decorative Grid Crosses -->
            <div class="absolute inset-0 pointer-events-none">
                <!-- Top Row -->
                <svg class="absolute top-10 left-10 w-3.5 h-3.5 text-black/10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>
                <svg class="absolute top-10 left-[33%] w-3.5 h-3.5 text-black/10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>
                <svg class="absolute top-10 right-[33%] w-3.5 h-3.5 text-black/10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>
                <svg class="absolute top-10 right-10 w-3.5 h-3.5 text-black/10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>

                <!-- Middle Row -->
                <svg class="absolute top-1/2 left-10 w-3.5 h-3.5 text-black/10 -translate-y-1/2" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>
                <svg class="absolute top-1/2 left-[33%] w-3.5 h-3.5 text-black/10 -translate-y-1/2" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>
                <svg class="absolute top-1/2 right-[33%] w-3.5 h-3.5 text-black/10 -translate-y-1/2" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>
                <svg class="absolute top-1/2 right-10 w-3.5 h-3.5 text-black/10 -translate-y-1/2" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>

                <!-- Bottom Row -->
                <svg class="absolute bottom-10 left-10 w-3.5 h-3.5 text-black/10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>
                <svg class="absolute bottom-10 left-[33%] w-3.5 h-3.5 text-black/10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>
                <svg class="absolute bottom-10 right-[33%] w-3.5 h-3.5 text-black/10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>
                <svg class="absolute bottom-10 right-10 w-3.5 h-3.5 text-black/10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2v12M2 8h12"/></svg>
            </div>

            <!-- Card Content Container -->
            <div class="relative flex flex-col px-6 py-8 sm:px-10 sm:py-10 lg:px-16 lg:py-12">
                
                <!-- Header -->
                <header class="flex items-center justify-between w-full">
                    
                    <!-- Left Side -->
                    <div class="flex items-center gap-6 z-10">
                        <!-- Logo -->
                        <div class="flex items-center gap-2.5">
                            <svg viewBox="0 0 24 24" class="w-6 h-6 text-neutral-950" fill="currentColor">
                                <circle cx="12" cy="12" r="1.5" />
                                <circle cx="12" cy="4.5" r="1.2" />
                                <circle cx="12" cy="19.5" r="1.2" />
                                <circle cx="4.5" cy="12" r="1.2" />
                                <circle cx="19.5" cy="12" r="1.2" />
                                <circle cx="6.7" cy="6.7" r="1.2" />
                                <circle cx="17.3" cy="17.3" r="1.2" />
                                <circle cx="6.7" cy="17.3" r="1.2" />
                                <circle cx="17.3" cy="6.7" r="1.2" />
                            </svg>
                            <span class="font-medium text-lg tracking-tight text-neutral-950">Radiant</span>
                        </div>

                        <!-- Pill (Desktop Only) -->
                        <div class="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-full bg-black/5 border border-black/5 hover:bg-black/10 transition-colors cursor-pointer">
                            <span class="text-xs text-neutral-700 font-normal">Radiant raises $100M Series A from Tailwind Ventures</span>
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-neutral-400" stroke-width="1.5"></i>
                        </div>
                    </div>

                    <!-- Navigation (Desktop Only) -->
                    <nav class="hidden lg:flex items-center gap-8 text-base font-normal text-neutral-800 z-10">
                        <a href="#" class="hover:text-neutral-950 transition-colors">Pricing</a>
                        <a href="#" class="hover:text-neutral-950 transition-colors">Company</a>
                        <a href="#" class="hover:text-neutral-950 transition-colors">Blog</a>
                        <a href="#" class="hover:text-neutral-950 transition-colors">Login</a>
                    </nav>

                    <!-- Mobile Menu Icon -->
                    <button class="lg:hidden p-2 -mr-2 text-neutral-950 z-10" aria-label="Menu">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9h16.5m-16.5 6.75h16.5" />
                        </svg>
                    </button>
                </header>

                <!-- Hero Text & Actions -->
                <div class="flex flex-col justify-center max-w-[800px] mt-24 sm:mt-32 lg:mt-40 mb-16 sm:mb-24 lg:mb-32 z-10">
                    <h1 class="text-6xl sm:text-7xl lg:text-[6.5rem] leading-[1.05] tracking-tight font-medium text-neutral-950">
                        Close every deal.
                    </h1>
                    <p class="mt-6 sm:mt-8 text-xl sm:text-2xl text-neutral-800 font-normal leading-relaxed max-w-lg">
                        Radiant helps you sell more by revealing sensitive information about your customers.
                    </p>
                    <div class="mt-8 sm:mt-10 flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
                        <button class="w-full sm:w-auto bg-neutral-950 text-white rounded-full px-7 py-3 text-base font-normal hover:bg-neutral-800 transition-colors flex items-center justify-center">
                            Get started
                        </button>
                        <button class="w-full sm:w-auto bg-white/30 text-neutral-950 border border-white/40 backdrop-blur-md shadow-sm rounded-full px-7 py-3 text-base font-normal hover:bg-white/40 transition-colors flex items-center justify-center">
                            See pricing
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Logo Cloud Section -->
        <div class="mt-16 sm:mt-24 mb-16 flex flex-wrap justify-center items-center gap-x-12 gap-y-10 sm:gap-x-16 lg:gap-x-24 px-4">
            
            <!-- SavvyCal -->
            <div class="flex items-center gap-2.5 text-neutral-900 opacity-90 grayscale hover:grayscale-0 transition-all cursor-pointer">
                <div class="bg-neutral-900 text-white rounded-md w-7 h-7 flex items-center justify-center font-bold text-sm tracking-tighter">S</div>
                <span class="font-medium text-xl tracking-tight">SavvyCal</span>
            </div>

            <!-- Laravel -->
            <div class="flex items-center gap-2 text-neutral-900 opacity-90 grayscale hover:grayscale-0 transition-all cursor-pointer">
                <svg class="w-7 h-7" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3">
                    <path d="M32 8 L56 22 L56 46 L32 60 L8 46 L8 22 Z" />
                    <path d="M32 8 L32 34 L56 22" />
                    <path d="M8 22 L32 34 L32 60" />
                </svg>
                <span class="font-medium text-xl tracking-tight">Laravel</span>
            </div>

            <!-- Tuple -->
            <div class="flex items-center gap-2.5 text-neutral-900 opacity-90 grayscale hover:grayscale-0 transition-all cursor-pointer">
                <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4 6h16v4H4z" />
                    <path d="M10 10h4v10h-4z" />
                </svg>
                <span class="font-medium text-base tracking-widest uppercase">TUPLE</span>
            </div>

            <!-- Transistor -->
            <div class="flex items-center gap-2 text-neutral-900 opacity-90 grayscale hover:grayscale-0 transition-all cursor-pointer">
                <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M6 12h6" />
                    <path d="M12 8v8" />
                </svg>
                <span class="font-medium text-xl tracking-tight">Transistor</span>
            </div>

            <!-- Statamic -->
            <div class="flex items-center gap-2 text-neutral-900 opacity-90 grayscale hover:grayscale-0 transition-all cursor-pointer">
                <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6zm4 4h-2v-2h2v2zm0-4h-2V7h2v6z" opacity="0" />
                    <path d="M15.5 8c-1.5 0-2.5 1-2.5 2.5v3c0 1.5-1 2.5-2.5 2.5S8 15 8 13.5v-3C8 9 9 8 10.5 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
                <span class="font-medium text-xl tracking-tight">statamic</span>
            </div>

        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
