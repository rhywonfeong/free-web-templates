  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Снижение за туманностью — Космическое приложение</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at 60% 40%, #254b85 0%, #0c1933 45%, #090f1a 100%);
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
      overflow-x: hidden;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.6;
      animation: twinkle 8s infinite ease-in-out;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.4;}
      50% { opacity: 1;}
    }
    /* Nebula glow effect */
    .nebula {
      position: absolute;
      width: 600px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(44,77,255,0.12) 0%, rgba(86,92,154,0.11) 41%, rgba(24,62,186,0.10) 100%);
      filter: blur(36px);
      z-index: 10;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="relative overflow-hidden">

  <!-- Stars -->
  <div id="stars"></div>
  <!-- Nebula overlays -->
  <div class="nebula" style="top:20%; left:-10%;"></div>
  <div class="nebula" style="top:60%; left:60%;"></div>

  <!-- Main container -->
  <div class="relative min-h-screen flex flex-col justify-center items-center z-20 px-6 py-10">
    <header class="mb-10 text-center">
      <h1 class="text-4xl md:text-6xl font-extrabold text-blue-200 drop-shadow-lg tracking-wide animate-pulse">
        Снижение за&nbsp;туманностью
      </h1>
      <p class="mt-4 text-lg md:text-xl text-blue-100/80">
        Навигатор вашего звездолёта сканирует окрестности туманности и готовит безопасное снижение.
      </p>
    </header>
    <main class="w-full max-w-xl bg-gradient-to-br from-blue-950/80 via-blue-900/60 to-black/90 rounded-3xl shadow-2xl border border-blue-900/70 p-8 backdrop-blur-md">
      <form class="flex flex-col gap-5">
        <label class="flex flex-col gap-2">
          <span class="text-blue-200 font-bold uppercase tracking-wide">Точка захода</span>
          <input type="text" placeholder="Введите координаты (например, X:120, Y:44)" class="bg-transparent border-b border-blue-700 text-blue-100 placeholder-blue-400 outline-none px-2 py-2 focus:border-blue-300 transition"/>
        </label>
        <label class="flex flex-col gap-2">
          <span class="text-blue-200 font-bold uppercase tracking-wide">Уровень снижения</span>
          <select class="bg-transparent border-b border-blue-700 text-blue-100 outline-none px-2 py-2 focus:border-blue-300 transition">
            <option class="bg-blue-950" value="">Выберите уровень</option>
            <option class="bg-blue-950" value="smooth">Плавное</option>
            <option class="bg-blue-950" value="rapid">Быстрое</option>
            <option class="bg-blue-950" value="stealth">Скрытое</option>
          </select>
        </label>
        <button type="submit" class="mt-4 bg-gradient-to-r from-blue-600 via-indigo-500 to-blue-900 text-blue-50 font-bold tracking-wide py-3 rounded-xl shadow-lg transition hover:from-blue-500 hover:to-indigo-700 hover:scale-105 duration-200">
          Начать снижение
        </button>
      </form>
    </main>
    <footer class="mt-14 text-blue-200/60 text-sm text-center opacity-80">
      &copy; 2024 Станция "Глубокий Космос" — Все права защищены
    </footer>
  </div>

  <script>
    // Generate stars for background
    const starsContainer = document.getElementById('stars');
    const count = 90;
    for (let i = 0; i < count; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2 + 1;
      star.style.width = size + 'px';
      star.style.height = size + 'px';
      star.style.top = Math.random() * 100 + '%';
      star.style.left = Math.random() * 100 + '%';
      star.style.opacity = Math.random() * 0.8 + 0.2;
      star.style.animationDuration = (Math.random() * 5 + 6) + 's';
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
