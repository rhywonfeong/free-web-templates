  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starlite Cinema Movie Ticket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: #14121a;
      font-family: 'Inter', sans-serif;
    }
    .ticket-dotted-border {
      border-right: 6px dotted rgba(100, 116, 139, 0.25);
    }
    .circle-cutout::before,
    .circle-cutout::after {
      content: "";
      position: absolute;
      background-color: #14121a;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      right: -14px;
      z-index: 10;
    }
    .circle-cutout::before {
      top: -14px;
    }
    .circle-cutout::after {
      bottom: -14px;
    }
    .big-circle-cutout::before,
    .big-circle-cutout::after {
      content: "";
      position: absolute;
      background-color: #14121a;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      left: -22px;
      z-index: 10;
    }
    .big-circle-cutout::before {
      top: -18px;
    }
    .big-circle-cutout::after {
      bottom: -18px;
    }
    .writing-vertical-rl {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }
    .manrope {
      font-family: 'Manrope', sans-serif;
    }
    .custom-shadow {
      box-shadow: 0px 0px 0px 1px rgba(0,0,0,0.13),
                  0px 1px 1px -0.5px rgba(0,0,0,0.13),
                  0px 3px 3px -1.5px rgba(0,0,0,0.13),
                  0px 6px 6px -3px rgba(0,0,0,0.13),
                  0px 12px 12px -6px rgba(0,0,0,0.13),
                  0px 24px 24px -12px rgba(0,0,0,0.13);
    }
    .barcode {
      background: repeating-linear-gradient(
        90deg,
        #eab308 0 2px,
        #fff0 2px 6px
      );
      height: 40px;
      width: 100%;
      border-radius: 6px;
      margin: 0 auto;
    }
    .neon {
      text-shadow: 0 0 8px #eab308, 0 0 2px #fff;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-5 bg-[#14121a]">
  <main class="bg-gradient-to-br from-[#181624] to-[#23203a] text-gray-100 w-full max-w-[600px] grid grid-cols-[106px_1fr] rounded-xl overflow-hidden custom-shadow border border-[#22213a]">
    <!-- Cinema Branding Section -->
    <section class="relative writing-vertical-rl text-center p-2.5 ticket-dotted-border circle-cutout bg-gradient-to-b from-[#23203a] to-[#181624]">
      <div class="relative h-full flex flex-col justify-between items-center">
        <h3 class="text-xl neon text-yellow-400 manrope font-extrabold uppercase tracking-wider mb-4 mt-10">Starlite Cinema</h3>
        <div class="text-xs text-yellow-200 tracking-widest mb-3 uppercase font-semibold">Admit One</div>
        <p class="text-[13px] tracking-[7px] font-medium py-3.5 text-center relative text-yellow-300/70">#2024-0051</p>
      </div>
    </section>

    <!-- Main Ticket Section -->
    <section class="p-2.5 flex flex-col justify-between">
      <!-- TOP: Movie & Patron -->
      <section class="flex flex-row justify-between items-center border-b border-[#22213a] pb-2">
        <div>
          <h2 class="text-lg manrope font-bold uppercase tracking-wider neon text-yellow-300">OPPENHEIMER</h2>
          <div class="flex items-center mt-1 space-x-2">
            <span class="text-[13px] text-yellow-200 font-semibold uppercase bg-yellow-900/30 px-2 py-0.5 rounded">IMAX</span>
            <span class="text-xs text-gray-300">2h 59m</span>
          </div>
        </div>
        <div class="text-right">
          <span class="block text-xs text-gray-400 uppercase">Patron</span>
          <span class="block text-base font-bold manrope tracking-wide text-gray-100">Alex Morgan</span>
        </div>
      </section>

      <!-- MID: Details -->
      <section class="grid grid-cols-2 gap-3 py-3 border-b border-[#22213a]">
        <div>
          <span class="block uppercase text-xs text-gray-400 font-semibold">Date</span>
          <span class="block text-lg font-bold manrope text-yellow-300">14 Jun 2024</span>
        </div>
        <div>
          <span class="block uppercase text-xs text-gray-400 font-semibold">Showtime</span>
          <span class="block text-lg font-bold manrope text-yellow-200">7:20 PM</span>
        </div>
        <div>

          <span class="block text-lg font-bold manrope text-gray-100">3</span>

        </div>
        <div>
          <span class="block uppercase text-xs text-gray-400 font-semibold">Type</span>
          <span class="block text-lg font-bold manrope text-gray-100">Adult</span>
        </div>
      </section>

      <!-- BOTTOM: Barcode & Notes -->
      <section class="flex flex-row items-end pt-4 pb-2">
        <div class="w-5/6">
          <div class="barcode"></div>
          <div class="text-[11px] text-gray-400 mt-2 tracking-wide">
            Please arrive 10 min before showtime.<br>
            Enjoy the show!
          </div>
        </div>
        <div class="w-1/6 flex flex-col items-end justify-end">
          <span class="block text-[10px] text-gray-400 font-semibold uppercase mb-1">Ref</span>
          <span class="manrope font-bold text-xs text-yellow-300 tracking-wider">MVTK-8NX</span>
        </div>
      </section>
    </section>
  </main>
