<script>document.addEventListener('click', event => {

const href = anchor?.getAttribute('href');
if (event.defaultPrevented || !href?.startsWith('#')) return;
event.preventDefault();
if (href === '#') { window.scrollTo({top: 0, behavior: 'smooth'}); return; }
try {
const id = decodeURIComponent(href.slice(1));
const target = document.getElementById(id) || document.getElementsByName(id)[0];
target?.scrollIntoView({behavior: 'smooth', block: 'start'});
} catch { /* Invalid fragments remain in the saved document. */ }
});</script>
<script>document.addEventListener('click', event => {
if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
const anchor = event.target.closest?.('a[href]');
if (!anchor || anchor.hasAttribute('download')) return;
const target = anchor.getAttribute('target')?.toLowerCase();
if (target && target !== '_self' && target !== '_top') return;
try {
const destination = new URL(anchor.href, document.baseURI);
const base = new URL(document.baseURI);
if (!['http:', 'https:'].includes(destination.protocol) || destination.origin === base.origin) return;
event.preventDefault();
window.open(destination.href, '_blank', 'noopener,noreferrer');
} catch { /* Leave invalid links to the browser. */ }
}, true);</script></head>

    <script>
      // --- State Management ---
      const state = {
          scene: 0,
          sfx: true,
          flowersFound: 0,
          gardenMessages: [
              "You deserve nice things, even on ordinary days.",
              "You have made it through days you once thought would be difficult to handle.",
              "You don't have to be productive every minute to be worthy of rest.",
              "Your little efforts count, even when nobody notices them.",
              "You're allowed to be proud of the person you're becoming."
          ],
          flowerEmojis: ['🌷', '🌻', '🌸', '🌼', '💐']
      };

      // --- Audio/SFX Engine (Web Audio API - Non-blocking/No external files) ---
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      function playTone(freq, type, duration, vol=0.1) {
          if (!state.sfx || audioCtx.state === 'suspended') return;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
      }

      const sfx = {
          pop: () => playTone(600, 'sine', 0.1, 0.1),
          bloom: () => {
              playTone(400, 'sine', 0.2, 0.05);
              setTimeout(() => playTone(600, 'sine', 0.3, 0.05), 100);
              setTimeout(() => playTone(800, 'sine', 0.4, 0.05), 200);
          },
          sparkle: () => {
              for(let i=0; i<3; i++) {
                  setTimeout(() => playTone(1200 + (i*200), 'triangle', 0.1, 0.02), i*50);
              }
          },
          success: () => {
              playTone(523.25, 'sine', 0.2); // C5
              setTimeout(() => playTone(659.25, 'sine', 0.2), 150); // E5
              setTimeout(() => playTone(783.99, 'sine', 0.4), 300); // G5
          }
      };

      function toggleSFX() {
          state.sfx = !state.sfx;
          document.getElementById('sfx-icon').setAttribute('icon', state.sfx ? 'solar:volume-loud-linear' : 'solar:volume-cross-linear');
          if(state.sfx && audioCtx.state === 'suspended') audioCtx.resume();
      }

      // --- Cursor Trail ---
      let lastMove = 0;
      document.addEventListener('mousemove', (e) => {
          if (Date.now() - lastMove > 55) {
              const sparkles = ['✨', '🌸', '🤍', '🦋'];
              const el = document.createElement('div');
              el.className = 'sparkle';
              el.innerText = sparkles[Math.floor(Math.random() * sparkles.length)];
              el.style.left = `${e.clientX}px`;
              el.style.top = `${e.clientY}px`;
              document.body.appendChild(el);
              setTimeout(() => el.remove(), 1000);
              lastMove = Date.now();
          }
      });

      // --- DOM Utilities ---
      const container = document.getElementById('scene-container');

      function transitionTo(renderFunc) {
          if(audioCtx.state === 'suspended' && state.sfx) audioCtx.resume();
          container.style.opacity = 0;
          setTimeout(() => {
              container.innerHTML = '';
              renderFunc();
              container.style.opacity = 1;
          }, 520);
      }

      function createButton(text, onClick, icon = '', extraClass = '') {
          const variant = (extraClass || '').includes('btn-') ? '' : 'btn-primary';
          return `
              <button onclick="${onClick}" class="btn-glass ${variant} group ${extraClass}">
                  <span class="btn-spark"></span>
                  <span class="flex items-center gap-2">
                      ${text}
                      ${icon ? `<iconify-icon icon="${icon}" class="text-lg text-white/90 group-hover:scale-110 transition-transform"></iconify-icon>` : ''}
                  </span>
              </button>
          `;
      }

      function spawnParticles(x, y, emojis) {
          for(let i=0; i<10; i++) {
              const p = document.createElement('div');
              p.innerText = emojis[Math.floor(Math.random() * emojis.length)];
              p.style.position = 'fixed';
              p.style.left = x + 'px';
              p.style.top = y + 'px';
              p.style.fontSize = '1.2rem';
              p.style.pointerEvents = 'none';
              p.style.zIndex = '1000';
              p.style.transition = 'all 1s cubic-bezier(0.25, 1, 0.5, 1)';
              p.style.filter = 'drop-shadow(0 14px 22px rgba(200, 76, 120, 0.18))';

              const angle = Math.random() * Math.PI * 2;
              const distance = 50 + Math.random() * 100;
              const tx = Math.cos(angle) * distance;
