<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rule Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
theme: {
extend: {
fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
keyframes: {
fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
slideIn: { '0%': { opacity: 0, transform: 'translateY(8px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
},
animation: {
fadeIn: 'fadeIn .3s ease-in-out',
slideIn: 'slideIn .3s ease-in-out',
}
}
}
}
</script>
<script src="https://unpkg.com/lucide@latest"></script></head>

<body class="bg-gray-50 text-gray-900 font-sans antialiased leading-relaxed">
  <!-- Main wrapper -->
  <div class="min-h-screen flex flex-col">
    <main class="flex-1 flex justify-center">
      <div class="w-full max-w-5xl px-4 py-12 space-y-8">
        <!-- Card -->
        <section class="bg-white shadow-sm rounded-xl border border-gray-200 p-8 animate-fadeIn">
          <h1 class="text-2xl font-semibold tracking-tight text-gray-900 mb-6">Where should this rule apply?</h1>

          <!-- Radio Group -->
          <div class="space-y-4">
            <!-- Option 1 -->
            <label class="flex items-start space-x-3 cursor-pointer">
              <input id="opt-current" type="radio" name="productScope" class="mt-1.5 h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600">
              <div>
                <span class="font-medium">Current product only – FL HO3 Nexus</span>
                <div id="panel-current" class="pl-8 mt-4 hidden">
                  <!-- Policy scope -->
                  <fieldset class="space-y-3">
                    <legend class="text-sm font-medium text-gray-700 mb-1">Policy scope</legend>
                    <div class="space-y-2">
                      <label class="flex items-center space-x-2">
                        <input type="radio" name="policyScopeCurrent" value="new" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600">
                        <span>New policies only</span>
                      </label>
                      <label class="flex items-center space-x-2">
                        <input type="radio" name="policyScopeCurrent" value="all" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600">
                        <span>All active policies</span>
                      </label>
                      <label class="flex items-center space-x-2">
                        <input id="current-spec-ver" type="radio" name="policyScopeCurrent" value="versions" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600">
                        <span>Specific versions</span>
                      </label>
                    </div>
                  </fieldset>

                  <!-- Version list -->
                  <div id="current-versions-panel" class="mt-4 hidden">
                    <h3 class="text-sm font-medium text-gray-700 mb-2">Select versions</h3>
                    <div class="space-y-2 border border-gray-200 rounded-lg p-3 max-h-56 overflow-y-auto">
                      <!-- Sample versions -->
                      <label class="flex items-center justify-between p-2 rounded-md hover:bg-blue-50">
                        <div class="flex items-center space-x-2">
                          <input type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600 checked:bg-blue-600 version-checkbox">
                          <span class="text-sm">v3.2 – Effective 01 / 01 / 2025</span>
                        </div>
                        <span class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded">CURRENT</span>
                      </label>
                      <label class="flex items-center justify-between p-2 rounded-md hover:bg-blue-50">
                        <div class="flex items-center space-x-2">
                          <input type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600 version-checkbox">
                          <span class="text-sm">v3.1 – Effective 07 / 01 / 2024</span>
                        </div>
                        <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded">ACTIVE</span>
                      </label>
                      <label class="flex items-center justify-between p-2 rounded-md hover:bg-blue-50">
                        <div class="flex items-center space-x-2">
                          <input type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600 version-checkbox" checked>
                          <span class="text-sm">v2.9 – Effective 01 / 01 / 2024</span>
                        </div>
                        <span class="text-xs bg-gray-100 text-gray-700 px-2 py-0.5 rounded">ACTIVE</span>
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            </label>

            <!-- Divider -->
            <div class="border-t border-dashed border-gray-200"></div>

            <!-- Option 2 -->
            <label class="flex items-start space-x-3 cursor-pointer">
              <input id="opt-all" type="radio" name="productScope" class="mt-1.5 h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600">
              <div class="w-full">
                <span class="font-medium">All active products</span>
                <p class="text-gray-500 text-sm">127 products across 12 states</p>
                <div id="panel-all" class="pl-8 mt-4 hidden">
                  <!-- Policy scope -->
                  <fieldset class="space-y-3">
                    <legend class="text-sm font-medium text-gray-700 mb-1">Policy scope</legend>
                    <div class="space-y-2">
                      <label class="flex items-center space-x-2">
                        <input type="radio" name="policyScopeAll" value="new" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600">
                        <span>New policies only</span>
                      </label>
                      <label class="flex items-center space-x-2">
                        <input type="radio" name="policyScopeAll" value="all" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600">
                        <span>All active policies</span>
                      </label>
                      <label class="flex items-center space-x-2">
                        <input id="all-spec-ver" type="radio" name="policyScopeAll" value="versions" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600">
                        <span>Specific versions</span>
                      </label>
                    </div>
                  </fieldset>

                  <!-- Version explorer -->
                  <div id="all-versions-explorer" class="mt-4 hidden">
                    <!-- Sticky quick bar -->
                    <div class="sticky top-0 bg-white z-10 py-2 border-b border-gray-200 flex items-center space-x-3">
                      <div class="relative flex-1 max-w-sm">
                        <span class="absolute left-2 top-2.5 text-gray-400"><i data-lucide="search" class="w-4 h-4 stroke-1.5"></i></span>
                        <input id="searchInput" type="text" placeholder="Search states or products" class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
                      </div>
                      <button id="expandCollapseBtn" class="text-sm text-gray-600 hover:text-gray-900 px-2 py-1 rounded-md flex items-center space-x-1">
                        <i data-lucide="chevron-down" class="w-4 h-4 stroke-1.5"></i><span>Expand all</span>
                      </button>
                      <button id="selectCurrentBtn" class="text-sm text-gray-600 hover:text-gray-900 px-2 py-1 rounded-md">Select current versions</button>
                      <button id="clearBtn" class="text-sm text-gray-600 hover:text-gray-900 px-2 py-1 rounded-md">Clear</button>
                    </div>

                    <!-- Summary banner -->
                    <div id="summaryBanner" class="sticky top-10 bg-blue-50 text-blue-800 text-sm px-3 py-1.5 rounded-md my-2 hidden"></div>

                    <!-- Explorer list -->
                    <div id="stateList" class="space-y-2 max-h-[34rem] overflow-y-auto pr-2 animate-slideIn">
                      <!-- States and products injected here -->
                    </div>
                  </div>
                </div>
              </div>
            </label>

            <!-- Divider -->
            <div class="border-t border-dashed border-gray-200"></div>

            <!-- Option 3 -->
            <label class="flex items-start space-x-3 cursor-pointer">
              <input id="opt-specific" type="radio" name="productScope" class="mt-1.5 h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600">
              <div class="w-full">
                <span class="font-medium">Select specific products</span>
                <div id="panel-specific" class="pl-8 mt-4 hidden">
                  <!-- Quick action bar -->
                  <div class="sticky top-0 bg-white z-10 py-2 border-b border-gray-200 flex items-center space-x-3">
                    <div class="relative flex-1 max-w-sm">
                      <span class="absolute left-2 top-2.5 text-gray-400"><i data-lucide="search" class="w-4 h-4 stroke-1.5"></i></span>
                      <input id="searchInput2" type="text" placeholder="Search states or products" class="w-full pl-8 pr-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
                    </div>
                    <button id="selectCurrentBtn2" class="text-sm text-gray-600 hover:text-gray-900 px-2 py-1 rounded-md">Select current versions</button>
                    <button id="clearBtn2" class="text-sm text-gray-600 hover:text-gray-900 px-2 py-1 rounded-md">Clear</button>
                  </div>

                  <!-- Selection summary floating toggle -->
                  <button id="toggleFloatSummary" class="fixed bottom-24 right-4 bg-blue-600 text-white rounded-full shadow-lg p-3 hover:bg-blue-700 focus:outline-none">
                    <i data-lucide="list" class="w-5 h-5 stroke-1.5"></i>
                  </button>

                  <!-- Floating summary panel -->
                  <div id="floatSummary" class="fixed bottom-0 right-0 w-80 max-w-full bg-white border-t border-l border-gray-200 shadow-2xl rounded-tl-xl rounded-tr-none p-4 space-y-3 translate-y-full transition-transform duration-300">
                    <div class="flex justify-between items-center">
                      <h2 class="font-medium">Selection summary</h2>
                      <button id="closeFloatSummary" class="text-gray-500 hover:text-gray-700">
                        <i data-lucide="x" class="w-4 h-4 stroke-1.5"></i>
                      </button>
                    </div>
                    <div id="floatSummaryBody" class="text-sm text-gray-700"></div>
                  </div>

                  <!-- Tree -->
                  <div id="treeContainer" class="space-y-2 max-h-[34rem] overflow-y-auto pr-2 animate-slideIn">
                    <!-- Tree nodes injected here -->
                  </div>
                </div>
              </div>
            </label>
          </div>
        </section>
      </div>
    </main>

    <!-- Fixed summary bar -->
    <footer class="sticky bottom-0 bg-white border-t border-gray-200 px-6 py-4 flex items-center justify-between">
      <div class="text-sm text-gray-700"><span id="footerCount">0</span> items selected</div>
      <div class="space-x-3">
        <button id="reviewBtn" class="text-sm text-gray-600 hover:text-gray-900">Review selection</button>
        <button id="applyBtn" class="bg-blue-600 text-white text-sm font-medium px-4 py-2 rounded shadow-sm disabled:opacity-50" disabled>Apply rule</button>
      </div>
    </footer>
  </div>

  <!-- Template for tree nodes -->
  <template id="stateTemplate">
    <div class="border border-gray-200 rounded-lg">
      <!-- State header -->
      <div class="flex items-center justify-between px-3 py-2 bg-gray-50 hover:bg-gray-100 cursor-pointer state-header">
        <div class="flex items-center space-x-2">
          <input type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600 state-checkbox">
          <i data-lucide="chevron-right" class="w-4 h-4 stroke-1.5 transition-transform"></i>
          <span class="text-sm font-medium state-name"></span>
        </div>
        <span class="text-xs text-gray-500 state-count"></span>
      </div>
      <!-- Product list -->
      <div class="state-products pl-7 hidden"></div>
    </div>
  </template>

  <template id="productTemplate">
    <div class="border-t border-gray-200 product-node">
      <div class="flex items-center justify-between px-3 py-2 hover:bg-gray-50 cursor-pointer product-header">
        <div class="flex items-center space-x-2">
          <input type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600 product-checkbox">
          <i data-lucide="chevron-right" class="w-3.5 h-3.5 stroke-1.5 transition-transform"></i>
          <span class="text-sm product-name"></span>
        </div>
        <span class="text-xs text-gray-500 product-count"></span>
      </div>
      <div class="product-versions pl-7 hidden"></div>
    </div>
  </template>

  <template id="versionTemplate">
    <label class="flex items-center justify-between px-3 py-1.5 hover:bg-blue-50 rounded-md version-line">
      <div class="flex items-center space-x-2">
        <input type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 focus:ring-blue-600 version-checkbox-single">
        <span class="text-sm version-label"></span>
      </div>
      <span class="text-xs badge px-2 py-0.5 rounded"></span>
    </label>
  </template>

  <script>
    lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });

    /* ----- Expansion toggles for the three main options ----- */
    const radioCurrent = document.getElementById('opt-current');
    const radioAll = document.getElementById('opt-all');
    const radioSpecific = document.getElementById('opt-specific');
    const panelCurrent = document.getElementById('panel-current');
    const panelAll = document.getElementById('panel-all');
    const panelSpecific = document.getElementById('panel-specific');

    [radioCurrent, radioAll, radioSpecific].forEach(r => {
      r.addEventListener('change', () => {
        panelCurrent.classList.toggle('hidden', !radioCurrent.checked);
        panelAll.classList.toggle('hidden', !radioAll.checked);
        panelSpecific.classList.toggle('hidden', !radioSpecific.checked);
        updateApplyBtnState();
      });
    });

    /* ----- Specific versions toggle Current Product ----- */
    document.getElementById('current-spec-ver').addEventListener('change', e => {
      document.getElementById('current-versions-panel').classList.toggle('hidden', !e.target.checked);
    });

    /* ----- Specific versions toggle All Products ----- */
    document.getElementById('all-spec-ver').addEventListener('change', e => {
      document.getElementById('all-versions-explorer').classList.toggle('hidden', !e.target.checked);
    });

    /* ----- Sample data ----- */
    const sampleData = [
      {
        state: 'FL',
        name: 'Florida',
        products: [
          {
            id: 'FL-HO3',
            name: 'HO3 – Nexus Admitted',
            versions: [
              { id: 'v3.2', text: 'v3.2 – Eff 01 / 01 / 25', status: 'CURRENT' },
              { id: 'v3.1', text: 'v3.1 – Eff 07 / 01 / 24', status: 'ACTIVE' },
              { id: 'v2.9', text: 'v2.9 – Eff 01 / 01 / 24', status: 'ACTIVE' }
            ]
          },
          {
            id: 'FL-HO6',
            name: 'HO6 – Nexus Admitted',
            versions: [
              { id: 'v1.1', text: 'v1.1 – Eff 07 / 01 / 24', status: 'CURRENT' }
            ]
          }
        ]
      },
      {
        state: 'CA',
        name: 'California',
        products: [
          {
            id: 'CA-DP3',
            name: 'DP3 – Tower Standard',
            versions: [
              { id: 'v2.5', text: 'v2.5 – Eff 02 / 01 / 24', status: 'CURRENT' }
            ]
          }
        ]
      }
    ];

    /* ----- Build All-versions Explorer (Option 2) ----- */
    const stateList = document.getElementById('stateList');
    buildTree(sampleData, stateList, false);

    /* ----- Build Specific-product Tree (Option 3) ----- */
    const treeContainer = document.getElementById('treeContainer');
    buildTree(sampleData, treeContainer, true);

    function buildTree(data, container, includeTriState) {
      data.forEach(state => {
        const stateTpl = document.getElementById('stateTemplate').content.cloneNode(true);
        const header = stateTpl.querySelector('.state-header');
        const stateCheck = stateTpl.querySelector('.state-checkbox');
        const chevron = stateTpl.querySelector('.state-header i');
        stateTpl.querySelector('.state-name').textContent = `${state.state} ${state.name}`;
        stateTpl.querySelector('.state-count').textContent = `${state.products.length} products`;
        const productList = stateTpl.querySelector('.state-products');

        /* Populate products */
        state.products.forEach(prod => {
          const prodTpl = document.getElementById('productTemplate').content.cloneNode(true);
          prodTpl.querySelector('.product-name').textContent = prod.name;
          prodTpl.querySelector('.product-count').textContent = `${prod.versions.length} versions`;
          const prodCheck = prodTpl.querySelector('.product-checkbox');
          const prodChevron = prodTpl.querySelector('.product-header i');
          const versionList = prodTpl.querySelector('.product-versions');

          /* Populate versions */
          prod.versions.forEach(ver => {
            const verTpl = document.getElementById('versionTemplate').content.cloneNode(true);
            verTpl.querySelector('.version-label').textContent = ver.text;
            const badge = verTpl.querySelector('.badge');
            badge.textContent = ver.status;
            if (ver.status === 'CURRENT') {
              badge.classList.add('bg-blue-100', 'text-blue-800');
            } else {
              badge.classList.add('bg-gray-100', 'text-gray-700');
            }
            const verCheck = verTpl.querySelector('.version-checkbox-single');

            /* Checkbox events */
            verCheck.addEventListener('change', () => {
              syncUp(prodCheck, versionList.querySelectorAll('input'));
              syncUp(stateCheck, productList.querySelectorAll('.product-checkbox'));
              updateCounts();
            });

            versionList.appendChild(verTpl);
          });

          /* Product expand/collapse */
          prodTpl.querySelector('.product-header').addEventListener('click', e => {
            if (e.target.tagName !== 'INPUT') {
              versionList.classList.toggle('hidden');
              prodChevron.classList.toggle('rotate-90');
            }
          });

          /* Product checkbox propagate */
          prodCheck.addEventListener('change', () => {
            versionList.querySelectorAll('input').forEach(v => v.checked = prodCheck.checked);
            syncUp(stateCheck, productList.querySelectorAll('.product-checkbox'));
            updateCounts();
          });

          productList.appendChild(prodTpl);
        });

        /* State expand/collapse */
        header.addEventListener('click', e => {
          if (e.target.tagName !== 'INPUT') {
            productList.classList.toggle('hidden');
            chevron.classList.toggle('rotate-90');
          }
        });

        /* State checkbox propagate */
        stateCheck.addEventListener('change', () => {
          productList.querySelectorAll('input').forEach(p => p.checked = stateCheck.checked);
          updateCounts();
        });

        container.appendChild(stateTpl);
      });
    }

    /* ----- Helper: sync up parent checkbox (basic tri-state) ----- */
    function syncUp(parentChk, childChks) {
      const all = [...childChks];
      const allChecked = all.every(c => c.checked);
      const noneChecked = all.every(c => !c.checked);
      parentChk.indeterminate = !allChecked && !noneChecked;
      parentChk.checked = allChecked;
    }

    /* ----- Counts & summary ----- */
    const footerCount = document.getElementById('footerCount');
    const summaryBanner = document.getElementById('summaryBanner');
    const floatSummaryBody = document.getElementById('floatSummaryBody');

    function updateCounts() {
      const selected = document.querySelectorAll('#stateList input:checked, #treeContainer input:checked').length;
      footerCount.textContent = selected;
      document.getElementById('applyBtn').disabled = selected === 0;
      if (summaryBanner) {
        summaryBanner.textContent = `${selected} versions selected`;
        summaryBanner.classList.toggle('hidden', selected === 0);
      }
      floatSummaryBody.textContent = `${selected} versions selected across the explorer.`;
    }

    /* ----- Expand all / Collapse all ----- */
    const expandCollapseBtn = document.getElementById('expandCollapseBtn');
    let allExpanded = false;
    expandCollapseBtn.addEventListener('click', () => {
      allExpanded = !allExpanded;
      document.querySelectorAll('#stateList .state-products, #stateList .product-versions').forEach(el => {
        el.classList.toggle('hidden', !allExpanded);
      });
      document.querySelectorAll('#stateList .state-header i, #stateList .product-header i').forEach(i => {
        i.classList.toggle('rotate-90', allExpanded);
      });
      expandCollapseBtn.querySelector('span').textContent = allExpanded ? 'Collapse all' : 'Expand all';
    });

    /* ----- Search filter (debounced) ----- */
    function debounce(fn, wait = 300) {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn.apply(this, args), wait);
      };
    }
    document.getElementById('searchInput').addEventListener('input', debounce(filterExplorer));
    function filterExplorer(e) {
      const term = e.target.value.toLowerCase();
      stateList.querySelectorAll('.state-products, .product-versions').forEach(el => el.classList.remove('hidden'));
      stateList.querySelectorAll('.state-header, .product-header, .version-line').forEach(node => {
        const txt = node.textContent.toLowerCase();
        node.parentElement.classList.toggle('hidden', !txt.includes(term));
      });
    }

    /* ----- Floating summary panel ----- */
    const toggleFloatSummary = document.getElementById('toggleFloatSummary');
    const floatSummary = document.getElementById('floatSummary');
    const closeFloatSummary = document.getElementById('closeFloatSummary');
    toggleFloatSummary.addEventListener('click', () => floatSummary.classList.toggle('translate-y-full'));
    closeFloatSummary.addEventListener('click', () => floatSummary.classList.add('translate-y-full'));

    /* ----- Enable Apply button when selection made ----- */
    function updateApplyBtnState() {
      const selected = document.querySelector('input[name="productScope"]:checked');
      document.getElementById('applyBtn').disabled = !selected;
    }

    /* ----- Initial counts ----- */
    updateCounts();
  </script>
</body>
</html>
