<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gradient Waves Background</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script></head>
<body class="min-h-dvh w-full overflow-hidden text-slate-200 antialiased selection:bg-white/20 selection:text-white" style="background:#000; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, Apple Color Emoji, Segoe UI Emoji, Segoe UI Symbol;">
  <!-- Top Control Bar -->
  <header class="pointer-events-auto fixed inset-x-0 top-0 z-20 border-b border-white/10 bg-black/20 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
      <div class="flex items-center gap-3">
        <div class="flex h-8 w-8 items-center justify-center rounded-md border border-white/15 bg-white/5 text-white/90 shadow-sm ring-1 ring-inset ring-white/10">
          <span class="text-[11px] font-semibold tracking-tight">GW</span>
        </div>
        <div class="flex flex-col">
          <h1 class="text-[22px] leading-tight tracking-tight font-semibold text-white">Gradient Waves</h1>
          <p class="text-[12px] text-white/60 -mt-0.5">GPU fragment shader background</p>
        </div>
      </div>
      <div class="relative flex items-center gap-2">
        <button id="pauseBtn" aria-label="Pause animation" title="Pause (P or Space)" class="group inline-flex items-center gap-2 rounded-md border border-white/15 bg-white/5 px-3.5 py-2 text-sm font-medium text-white/90 outline-none ring-1 ring-inset ring-white/10 transition-all duration-300 hover:bg-white/10 hover:text-white hover:shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/30 active:scale-[0.98]" aria-pressed="false">
          <i id="pauseIcon" data-lucide="pause" class="h-[18px] w-[18px]"></i>
          <span class="tracking-tight">Pause</span>
        </button>
        <button id="copyBtn" aria-label="Copy fragment shader" title="Copy shader (C)" class="group inline-flex items-center gap-2 rounded-md border border-white/15 bg-white/5 px-3.5 py-2 text-sm font-medium text-white/90 outline-none ring-1 ring-inset ring-white/10 transition-all duration-300 hover:bg-white/10 hover:text-white hover:shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/30 active:scale-[0.98]">
          <i data-lucide="copy" class="h-[18px] w-[18px]"></i>
          <span class="tracking-tight">Copy shader</span>
        </button>
        <a href="#" class="hidden sm:inline-flex items-center gap-2 rounded-md border border-white/15 bg-white/5 px-3.5 py-2 text-sm font-medium text-white/90 outline-none ring-1 ring-inset ring-white/10 transition-all duration-300 hover:bg-white/10 hover:text-white hover:shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/30 active:scale-[0.98]">
          <i data-lucide="code-2" class="h-[18px] w-[18px]"></i>
          <span class="tracking-tight">Fragment</span>
        </a>

        <!-- Settings -->
        <button id="settingsBtn" aria-haspopup="dialog" aria-expanded="false" class="inline-flex items-center gap-2 rounded-md border border-white/15 bg-white/5 px-3.5 py-2 text-sm font-medium text-white/90 outline-none ring-1 ring-inset ring-white/10 transition-all duration-300 hover:bg-white/10 hover:text-white hover:shadow-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/30 active:scale-[0.98]">
          <i data-lucide="sliders-horizontal" class="h-[18px] w-[18px]"></i>
          <span class="tracking-tight">Settings</span>
        </button>

        <!-- Settings Panel -->
        <div id="settingsPanel" class="absolute right-0 top-[calc(100%+8px)] z-30 hidden w-[320px] rounded-xl border border-white/10 bg-black/70 p-4 text-white/90 shadow-2xl backdrop-blur-md ring-1 ring-inset ring-white/15 transition-all duration-200 ease-out sm:w-[380px]">
          <div class="flex items-center justify-between">
            <h2 class="text-[15px] font-semibold tracking-tight text-white">Appearance</h2>
            <button id="closeSettings" class="rounded-md border border-white/10 bg-white/5 p-1.5 text-white/70 hover:text-white hover:bg-white/10 transition" aria-label="Close settings">
              <i data-lucide="x" class="h-[16px] w-[16px]"></i>
            </button>
          </div>

          <div class="mt-3 space-y-4">
            <!-- Colors -->
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <p class="text-[12px] text-white/70">Colors</p>
                <button id="resetColors" class="text-[12px] rounded-md border border-white/10 bg-white/5 px-2 py-1 text-white/70 hover:text-white hover:bg-white/10 transition">Reset</button>
              </div>
              <div class="grid grid-cols-4 gap-2">
                <!-- A -->
                <div class="flex flex-col items-center gap-1">
                  <div class="relative">
                    <div id="colorABox" class="h-9 w-9 rounded-md border border-white/20 ring-1 ring-inset ring-white/10 shadow-sm" style="background-color: rgb(26,51,204);"></div>
                    <input id="colorAInput" type="color" class="absolute inset-0 opacity-0 cursor-pointer" aria-label="Pick color A" value="#1a33cc" />
                  </div>
                  <span class="text-[11px] text-white/60 tracking-tight">A</span>
                </div>
                <!-- B -->
                <div class="flex flex-col items-center gap-1">
                  <div class="relative">
                    <div id="colorBBox" class="h-9 w-9 rounded-md border border-white/20 ring-1 ring-inset ring-white/10 shadow-sm" style="background-color: rgb(204,26,128);"></div>
                    <input id="colorBInput" type="color" class="absolute inset-0 opacity-0 cursor-pointer" aria-label="Pick color B" value="#cc1a80" />
                  </div>
                  <span class="text-[11px] text-white/60 tracking-tight">B</span>
                </div>
                <!-- C -->
                <div class="flex flex-col items-center gap-1">
                  <div class="relative">
                    <div id="colorCBox" class="h-9 w-9 rounded-md border border-white/20 ring-1 ring-inset ring-white/10 shadow-sm" style="background-color: rgb(26,204,153);"></div>
                    <input id="colorCInput" type="color" class="absolute inset-0 opacity-0 cursor-pointer" aria-label="Pick color C" value="#1acc99" />
                  </div>
                  <span class="text-[11px] text-white/60 tracking-tight">C</span>
                </div>
                <!-- D -->
                <div class="flex flex-col items-center gap-1">
                  <div class="relative">
                    <div id="colorDBox" class="h-9 w-9 rounded-md border border-white/20 ring-1 ring-inset ring-white/10 shadow-sm" style="background-color: rgb(240,184,32);"></div>
                    <input id="colorDInput" type="color" class="absolute inset-0 opacity-0 cursor-pointer" aria-label="Pick color D" value="#f0b820" />
                  </div>
                  <span class="text-[11px] text-white/60 tracking-tight">D</span>
                </div>
              </div>
            </div>

            <div class="h-px w-full bg-white/10"></div>

            <!-- Speed -->
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <p class="text-[12px] text-white/70">Speed</p>
                <span id="speedValue" class="text-[12px] text-white/60 tabular-nums">1.00x</span>
              </div>
              <div class="relative h-8 select-none">
                <div class="absolute left-0 right-0 top-1/2 h-1.5 -translate-y-1/2 rounded-full bg-white/10"></div>
                <div id="speedFill" class="absolute left-0 top-1/2 h-1.5 -translate-y-1/2 rounded-full bg-white/40"></div>
                <div id="speedKnob" class="absolute top-1/2 h-4 w-4 -translate-y-1/2 rounded-full border border-white/30 bg-white/80 shadow-sm"></div>
                <input id="speedRange" type="range" min="0" max="2" step="0.05" value="1" class="absolute inset-0 h-full w-full cursor-pointer opacity-0" aria-label="Speed" />
              </div>
            </div>

            <!-- Grain -->
            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <p class="text-[12px] text-white/70">Grain</p>
                <span id="grainValue" class="text-[12px] text-white/60 tabular-nums">0.10</span>
              </div>
              <div class="relative h-8 select-none">
                <div class="absolute left-0 right-0 top-1/2 h-1.5 -translate-y-1/2 rounded-full bg-white/10"></div>
                <div id="grainFill" class="absolute left-0 top-1/2 h-1.5 -translate-y-1/2 rounded-full bg-white/40"></div>
                <div id="grainKnob" class="absolute top-1/2 h-4 w-4 -translate-y-1/2 rounded-full border border-white/30 bg-white/80 shadow-sm"></div>
                <input id="grainRange" type="range" min="0" max="0.5" step="0.01" value="0.10" class="absolute inset-0 h-full w-full cursor-pointer opacity-0" aria-label="Grain" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Toast -->
  <div id="toast" class="pointer-events-none fixed inset-x-0 bottom-6 z-20 mx-auto hidden w-full max-w-sm items-center justify-center px-4 sm:flex" role="status" aria-live="polite">
    <div class="flex w-full items-center gap-2 rounded-lg border border-white/10 bg-white/10 px-4 py-2.5 text-sm text-white/90 shadow-lg backdrop-blur-md ring-1 ring-inset ring-white/15">
      <i data-lucide="check" class="h-[18px] w-[18px] text-emerald-300"></i>
      <span class="tracking-tight">Fragment shader copied</span>
    </div>
  </div>

  <!-- Shaders -->
  <script id="fragmentShader" type="x-shader/x-fragment">
    precision highp float;

    uniform float u_time;
    uniform vec2 u_resolution;

    uniform vec3 u_colorA;
    uniform vec3 u_colorB;
    uniform vec3 u_colorC;
    uniform vec3 u_colorD;

    uniform float u_speed;
    uniform float u_grain;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    float noise(vec2 x) {
      vec2 i = floor(x);
      vec2 f = fract(x);
      // Four corners in 2D of a tile
      float a = hash(i);
      float b = hash(i + vec2(1.0, 0.0));
      float c = hash(i + vec2(0.0, 1.0));
      float d = hash(i + vec2(1.0, 1.0));
      // Cubic Hermine curve
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
    }

    void main() {
      vec2 uv = gl_FragCoord.xy / u_resolution.xy;
      vec2 p = uv * 2.0 - 1.0;

      float s = max(u_speed, 0.0);

      float wave1 = sin(p.x * 3.0 + u_time * 0.6 * s) * 0.3;
      float wave2 = cos(p.y * 2.0 - u_time * 0.4 * s) * 0.3;
      float pattern = wave1 + wave2;
      float t = smoothstep(-1.0, 1.0, pattern);

      vec3 color = mix(u_colorA, u_colorB, t);

      float t2 = 0.5 + 0.5 * sin(u_time * 0.25 * s);
      color = mix(color, u_colorC, t2 * 0.6);

      float n = noise(p * 3.5 + u_time * 0.2 * s);
      color = mix(color, u_colorD, n * 0.45);

      // Subtle vignette for depth
      float vignette = smoothstep(1.2, 0.2, length(p));
      color *= mix(0.85, 1.0, vignette);

      // Film grain (time-evolving, per-pixel)
      float g = (hash(gl_FragCoord.xy + u_time * 60.0 * s) - 0.5) * (u_grain * 2.0);
      color += g;

      color = clamp(color, 0.0, 1.0);
      gl_FragColor = vec4(color, 1.0);
    }
  </script>

  <script id="vertexShader" type="x-shader/x-vertex">
    void main() {
      gl_Position = vec4(position, 1.0);
    }
  </script>

  <!-- Three.js init -->
  <script>
    // Icons
    window.lucide && window.lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });

    // Three.js scene
    const scene = new THREE.Scene();
    const camera = new THREE.Camera();
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.domElement.style.position = 'fixed';
    renderer.domElement.style.top = '0';
    renderer.domElement.style.left = '0';
    renderer.domElement.style.width = '100%';
    renderer.domElement.style.height = '100%';
    renderer.domElement.style.display = 'block';
    renderer.domElement.style.pointerEvents = 'none';
    renderer.domElement.setAttribute('aria-hidden', 'true');
    document.body.appendChild(renderer.domElement);

    const uniforms = {
      u_time: { value: 0.0 },
      u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      u_colorA: { value: new THREE.Color('#1a33cc') },  // was vec3(0.1,0.2,0.8)
      u_colorB: { value: new THREE.Color('#cc1a80') },  // was vec3(0.8,0.1,0.5)
      u_colorC: { value: new THREE.Color('#1acc99') },  // was vec3(0.1,0.8,0.6)
      u_colorD: { value: new THREE.Color('#f0b820') },  // new extra color
      u_speed:  { value: 1.0 },
      u_grain:  { value: 0.10 }
    };

    const material = new THREE.ShaderMaterial({
      uniforms,
      vertexShader: document.getElementById('vertexShader').textContent,
      fragmentShader: document.getElementById('fragmentShader').textContent
    });

    const geometry = new THREE.PlaneGeometry(2, 2);
    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    let isPaused = false;
    let autoPaused = false;
    let startTime = performance.now();
    let pauseOffset = 0;

    function renderFrame(now) {
      const elapsed = isPaused ? pauseOffset : (now - startTime);
      uniforms.u_time.value = elapsed * 0.001;
      renderer.render(scene, camera);
      requestAnimationFrame(renderFrame);
    }
    requestAnimationFrame(renderFrame);

    function resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h, false);
      uniforms.u_resolution.value.set(w, h);
    }
    window.addEventListener('resize', resize, { passive: true });

    // Controls
    const pauseBtn = document.getElementById('pauseBtn');
    const pauseIcon = document.getElementById('pauseIcon');
    const copyBtn = document.getElementById('copyBtn');
    const toast = document.getElementById('toast');

    function updatePauseUI() {
      pauseBtn.setAttribute('aria-pressed', isPaused ? 'true' : 'false');
      pauseBtn.querySelector('span').textContent = isPaused ? 'Resume' : 'Pause';
      pauseBtn.setAttribute('aria-label', isPaused ? 'Resume animation' : 'Pause animation');
      pauseIcon.setAttribute('data-lucide', isPaused ? 'play' : 'pause');
      window.lucide && window.lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
    }

    function pause() {
      if (!isPaused) {
        isPaused = true;
        pauseOffset = performance.now() - startTime;
        updatePauseUI();
      }
    }

    function resume() {
      if (isPaused) {
        isPaused = false;
        startTime = performance.now() - pauseOffset;
        updatePauseUI();
      }
    }

    function togglePause() {
      isPaused ? resume() : pause();
    }

    pauseBtn.addEventListener('click', () => {
      togglePause();
    });

    copyBtn.addEventListener('click', async () => {
      const src = document.getElementById('fragmentShader').textContent.trim();
      try {
        await navigator.clipboard.writeText(src);
        showToast();
      } catch (e) {
        showToast('Copy failed');
      }
    });

    let toastTimer;
    function showToast(message) {
      if (message) toast.querySelector('span').textContent = message;
      toast.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('hidden');
        toast.querySelector('span').textContent = 'Fragment shader copied';
      }, 1800);
    }

    // Settings panel
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const closeSettings = document.getElementById('closeSettings');

    function openSettings() {
      settingsPanel.classList.remove('hidden');
      settingsBtn.setAttribute('aria-expanded', 'true');
    }
    function closeSettingsPanel() {
      settingsPanel.classList.add('hidden');
      settingsBtn.setAttribute('aria-expanded', 'false');
    }
    settingsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const expanded = settingsBtn.getAttribute('aria-expanded') === 'true';
      expanded ? closeSettingsPanel() : openSettings();
    });
    closeSettings.addEventListener('click', (e) => {
      e.stopPropagation();
      closeSettingsPanel();
    });
    document.addEventListener('click', (e) => {
      if (!settingsPanel.classList.contains('hidden')) {
        const within = settingsPanel.contains(e.target) || settingsBtn.contains(e.target);
        if (!within) closeSettingsPanel();
      }
    });

    // Color controls
    const colorInputs = [
      { input: document.getElementById('colorAInput'), box: document.getElementById('colorABox'), uniformKey: 'u_colorA' },
      { input: document.getElementById('colorBInput'), box: document.getElementById('colorBBox'), uniformKey: 'u_colorB' },
      { input: document.getElementById('colorCInput'), box: document.getElementById('colorCBox'), uniformKey: 'u_colorC' },
      { input: document.getElementById('colorDInput'), box: document.getElementById('colorDBox'), uniformKey: 'u_colorD' },
    ];

    function hexToThreeColor(hex) {
      return new THREE.Color(hex);
    }

    colorInputs.forEach(({ input, box, uniformKey }) => {
      input.addEventListener('input', () => {
        box.style.backgroundColor = input.value;
        uniforms[uniformKey].value = hexToThreeColor(input.value);
      });
    });

    document.getElementById('resetColors').addEventListener('click', () => {
      const defaults = ['#1a33cc', '#cc1a80', '#1acc99', '#f0b820'];
      colorInputs.forEach((c, i) => {
        c.input.value = defaults[i];
        c.box.style.backgroundColor = defaults[i];
        uniforms[c.uniformKey].value = hexToThreeColor(defaults[i]);
      });
    });

    // Custom slider helpers
    function initSlider(rangeEl, fillEl, knobEl, min, max, onChange) {
      function update() {
        const val = parseFloat(rangeEl.value);
        const pct = (val - min) / (max - min);
        fillEl.style.width = (pct * 100) + '%';
        knobEl.style.left = 'calc(' + (pct * 100) + '% - 8px)';
        onChange(val);
      }
      rangeEl.addEventListener('input', update);
      update();
    }

    // Speed slider
    const speedRange = document.getElementById('speedRange');
    const speedFill = document.getElementById('speedFill');
    const speedKnob = document.getElementById('speedKnob');
    const speedValue = document.getElementById('speedValue');

    initSlider(speedRange, speedFill, speedKnob, parseFloat(speedRange.min), parseFloat(speedRange.max), (val) => {
      uniforms.u_speed.value = val;
      speedValue.textContent = val.toFixed(2) + 'x';
    });

    // Grain slider
    const grainRange = document.getElementById('grainRange');
    const grainFill = document.getElementById('grainFill');
    const grainKnob = document.getElementById('grainKnob');
    const grainValue = document.getElementById('grainValue');

    initSlider(grainRange, grainFill, grainKnob, parseFloat(grainRange.min), parseFloat(grainRange.max), (val) => {
      uniforms.u_grain.value = val;
      grainValue.textContent = val.toFixed(2);
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'p' || e.code === 'Space') {
        e.preventDefault();
        togglePause();
      } else if (key === 'c') {
        copyBtn.click();
      } else if (key === 's') {
        const expanded = settingsBtn.getAttribute('aria-expanded') === 'true';
        expanded ? closeSettingsPanel() : openSettings();
      }
    });

    // Auto-pause on window blur/focus (non-intrusive)
    window.addEventListener('blur', () => {
      if (!isPaused) {
        autoPaused = true;
        pause();
      }
    });
    window.addEventListener('focus', () => {
      if (autoPaused) {
        autoPaused = false;
        resume();
      }
    });

    // Respect reduced motion
    const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) {
      isPaused = true;
      pauseOffset = performance.now() - startTime;
      updatePauseUI();
    } else {
      updatePauseUI();
    }

    // Initial size
    resize();
  </script>
</body>
</html>
