    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-primary-mono: 'Fira Code', monospace;
            --font-current-main: var(--font-primary-mono);
            --font-current-heading: var(--font-primary-mono);
            --font-current-ui: var(--font-primary-mono);
            
            --bg-page: #0a0c12;
            --bg-component: #181c27;
            --bg-input: rgba(30, 35, 50, 0.6);
            --bg-button-primary: #00f0c0;
            --bg-button-primary-hover: #00ffde;
            
            --text-primary: #e0e7ff;
            --text-secondary: #a0aed0;
            --text-muted: #707a95;
            --text-heading: #ffffff;
            --text-accent: var(--bg-button-primary);
            --text-on-button-primary: #0a0c12;
            --text-input: #e0e7ff;
            --text-error: #ff4757;
            
            --border-color: #3a3f5e;
            --border-input: #3a3f5e;
            --border-input-focus: var(--text-accent);
            --border-button-primary: var(--bg-button-primary);
            
            --border-radius-base: 6px;
            --border-radius-lg: 8px;
            
            --shadow-color-rgb: 0, 240, 192;
            --shadow-opacity-md: 0.4;
            --shadow-md: 0 0 18px rgba(var(--shadow-color-rgb), var(--shadow-opacity-md));
            
            --focus-ring-color: rgba(0, 240, 192, 0.5);
            --focus-ring-width: 2px;
            
            --transition-speed-fast: 0.15s;
            --transition-speed-normal: 0.25s;
            --transition-timing-function: ease-in-out;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        body {
            font-family: var(--font-current-main);
            background-color: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .login-form-wrapper {
            background-color: var(--bg-component);
            padding: 30px 40px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
            transition: all var(--transition-speed-normal);
        }

        .login-form-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: var(--text-accent);
            color: var(--text-on-button-primary);
            border-radius: 50%;
            margin: 0 auto 20px;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
            transition: all var(--transition-speed-normal);
        }

        .login-form-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-heading);
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border: 1px solid var(--border-input);
            border-radius: var(--border-radius-base);
            background-color: var(--bg-input);
            color: var(--text-input);
            transition: all var(--transition-speed-fast);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--border-input-focus);
            box-shadow: 0 0 0 var(--focus-ring-width) var(--focus-ring-color), 0 0 15px var(--focus-ring-color);
        }

        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 1;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .form-check-label {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .form-check-input {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid var(--border-input);
            border-radius: var(--border-radius-base);
            margin-right: 8px;
            cursor: pointer;
            position: relative;
            background-color: var(--bg-input);
            transition: background-color var(--transition-speed-fast), border-color var(--transition-speed-fast);
        }

        .form-check-input:checked {
            background-color: var(--text-accent);
            border-color: var(--text-accent);
        }

        .form-check-input:checked::before {
            content: '✔';
            color: var(--text-on-button-primary);
            font-size: 12px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.1);
            line-height: 1;
            font-weight: bold;
        }

        .form-link {
            color: var(--text-accent);
            text-decoration: none;
            font-weight: 500;
        }

        .form-link:hover {
            text-decoration: underline;
            color: var(--bg-button-primary-hover);
        }

        .c-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            border-radius: var(--border-radius-base);
            cursor: pointer;
            transition: all var(--transition-speed-fast);
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .c-btn-primary {
            background: var(--bg-button-primary);
            color: var(--text-on-button-primary);
            border-color: var(--border-button-primary);
            box-shadow: 0 0 10px rgba(var(--shadow-color-rgb), 0.4), 0 0 20px rgba(var(--shadow-color-rgb), 0.2);
        }

        .c-btn-primary:hover {
            background: var(--bg-button-primary-hover);
            box-shadow: 0 0 18px rgba(var(--shadow-color-rgb), 0.6), 0 0 35px rgba(var(--shadow-color-rgb), 0.3);
            transform: translateY(-2px) scale(1.03);
        }

        .form-footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        @media (max-width: 480px) {
            .login-form-wrapper {
                padding: 20px;
            }
            .form-control, .c-btn {
                font-size: 0.95rem;
                padding: 10px 12px;
            }
            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="login-form-wrapper">
        <a href="#" class="login-form-logo">L</a>
        <h3 class="login-form-title">Welcome Back!</h3>
        <form action="#" method="POST" onsubmit="return false;">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-options">
                <label class="form-check-label" for="remember">
                    <input type="checkbox" id="remember" name="remember" class="form-check-input">
                    Remember me
                </label>
                <a href="#" class="form-link">Forgot password?</a>
            </div>
            <button type="submit" class="c-btn c-btn-primary">Sign In</button>
            <p class="form-footer-text">
                Don't have an account? <a href="#" class="form-link">Sign up</a>
            </p>
        </form>
    </div>
</body>
</html>
