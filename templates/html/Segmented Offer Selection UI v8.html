<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartOfferSwitcher</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script></head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen p-6 sm:p-10 text-gray-900" style="font-family:'Inter',sans-serif">

  <!-- Toast -->
  <div id="toast" class="fixed top-4 inset-x-0 flex justify-center pointer-events-none">
    <div class="flex gap-2 items-center bg-[#009CA3] text-white px-4 py-3 rounded-lg shadow-lg opacity-0 scale-95 transition-all duration-300">
      <i data-lucide="check-circle" class="w-5 h-5"></i>
      <span class="text-sm">Added to cart!</span>
    </div>
  </div>

  <!-- Card -->
  <section aria-label="SmartOfferSwitcher"
           class="w-full max-w-sm bg-white border border-gray-200 rounded-2xl shadow-sm flex flex-col gap-6 px-6 py-8">
    
    <!-- Segmented control -->
    <div id="tablist" role="tablist"
         class="relative flex bg-gray-100 rounded-lg p-1 text-[14px] font-[500]">
      <span id="segHighlight" class="absolute top-1 bottom-1 left-1 w-1/3 rounded-md bg-white shadow transition-all duration-300"></span>
      
      <button role="tab" data-tab="packs" aria-selected="true"
              class="tab relative z-10 flex-1 py-2 rounded-md text-center transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009CA3]">
        Discount Packs
      </button>
      <button role="tab" data-tab="bogo" aria-selected="false"
              class="tab relative z-10 flex-1 py-2 rounded-md text-center transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009CA3]">
        BOGO
      </button>
      <button role="tab" data-tab="mix" aria-selected="false"
              class="tab relative z-10 flex-1 py-2 rounded-md text-center transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009CA3]">
        Mix &amp; Match
      </button>
    </div>

    <!-- Divider -->
    <div class="border-t border-gray-100"></div>

    <!-- Step 1 -->
    <div class="flex flex-col gap-5" id="step1">
      <h2 class="text-[20px] leading-[24px] font-[600] tracking-tight">Step&nbsp;1</h2>
      
      <!-- Packs radios -->
      <fieldset id="packsOptions" class="flex flex-col gap-4">
        <label class="flex items-center justify-between gap-3 p-3 border rounded-lg cursor-pointer transition hover:shadow-sm">
          <div class="flex items-center gap-3">
            <input type="radio" name="packs" value="2pack" class="accent-[#009CA3] focus:ring-0">
            <span>2-Pack</span>
          </div>
          <span class="text-gray-500 text-sm">-5&nbsp;%</span>
        </label>

        <label class="flex items-center justify-between gap-3 p-3 border rounded-lg cursor-pointer transition hover:shadow-sm">
          <div class="flex items-center gap-3">
            <input type="radio" name="packs" value="3pack" class="accent-[#009CA3] focus:ring-0">
            <span>3-Pack</span>
          </div>
          <span class="text-gray-500 text-sm">-10&nbsp;%</span>
        </label>
      </fieldset>

      <!-- BOGO radios -->
      <fieldset id="bogoOptions" class="hidden flex flex-col gap-4">
        <label class="flex items-center justify-between gap-3 p-3 border rounded-lg cursor-pointer transition hover:shadow-sm">
          <div class="flex items-center gap-3">
            <input type="radio" name="bogo" value="b1g1" class="accent-[#009CA3] focus:ring-0">
            <span>B1G1 Free</span>
          </div>
          <i data-lucide="percent" class="w-4 h-4 text-gray-400"></i>
        </label>

        <label class="flex items-center justify-between gap-3 p-3 border rounded-lg cursor-pointer transition hover:shadow-sm">
          <div class="flex items-center gap-3">
            <input type="radio" name="bogo" value="b1g150" class="accent-[#009CA3] focus:ring-0">
            <span>B1G1 50&nbsp;% Off</span>
          </div>
          <i data-lucide="percent" class="w-4 h-4 text-gray-400"></i>
        </label>

        <label class="flex items-center justify-between gap-3 p-3 border rounded-lg cursor-pointer transition hover:shadow-sm">
          <div class="flex items-center gap-3">
            <input type="radio" name="bogo" value="b2g1" class="accent-[#009CA3] focus:ring-0">
            <span>B2G1 Free</span>
          </div>
          <i data-lucide="percent" class="w-4 h-4 text-gray-400"></i>
        </label>
      </fieldset>

      <!-- Mix product cards -->
      <div id="mixOptions" class="hidden">
        <div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
          <!-- Card template -->
          <div class="productCard relative cursor-pointer bg-white border rounded-xl overflow-hidden transition shadow-sm hover:shadow-md focus-within:ring-2 focus-within:ring-[#009CA3]">
            <img src="https://picsum.photos/300?1" alt="Choco Cookies"
                 class="w-full aspect-square object-cover">
            <div class="p-3 flex flex-col gap-1">
              <span class="text-sm font-[500] truncate">Choco Cookies</span>
              <span class="text-xs text-gray-500">20&nbsp;EGP</span>
            </div>
            <button class="addChip absolute bottom-2 right-2 w-8 h-8 rounded-full bg-[#009CA3] text-white flex items-center justify-center transition hover:scale-105 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="productCard relative cursor-pointer bg-white border rounded-xl overflow-hidden transition shadow-sm hover:shadow-md focus-within:ring-2 focus-within:ring-[#009CA3]">
            <img src="https://picsum.photos/300?2" alt="Vanilla Wafers"
                 class="w-full aspect-square object-cover">
            <div class="p-3 flex flex-col gap-1">
              <span class="text-sm font-[500] truncate">Vanilla Wafers</span>
              <span class="text-xs text-gray-500">18&nbsp;EGP</span>
            </div>
            <button class="addChip absolute bottom-2 right-2 w-8 h-8 rounded-full bg-[#009CA3] text-white flex items-center justify-center transition hover:scale-105 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="productCard relative cursor-pointer bg-white border rounded-xl overflow-hidden transition shadow-sm hover:shadow-md focus-within:ring-2 focus-within:ring-[#009CA3]">
            <img src="https://picsum.photos/300?3" alt="Strawberry Bites"
                 class="w-full aspect-square object-cover">
            <div class="p-3 flex flex-col gap-1">
              <span class="text-sm font-[500] truncate">Strawberry Bites</span>
              <span class="text-xs text-gray-500">22&nbsp;EGP</span>
            </div>
            <button class="addChip absolute bottom-2 right-2 w-8 h-8 rounded-full bg-[#009CA3] text-white flex items-center justify-center transition hover:scale-105 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white">
              <i data-lucide="plus" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Divider -->
    <div class="border-t border-gray-100"></div>

    <!-- Step 2 -->
    <div id="qtyWrapper" class="flex flex-col gap-5">
      <h2 class="text-[20px] leading-[24px] font-[600] tracking-tight">Step&nbsp;2</h2>
      <div class="flex items-center gap-5">
        <button id="minusQty" aria-label="Decrease quantity"
                class="w-9 h-9 flex items-center justify-center border rounded-full hover:bg-gray-100 active:scale-95 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009CA3]">
          <i data-lucide="minus" class="w-4 h-4"></i>
        </button>
        <input id="qtyInput" type="text" value="1"
               class="w-12 text-center border rounded-md py-1 focus:outline-none focus:ring-2 focus:ring-[#009CA3]">
        <button id="plusQty" aria-label="Increase quantity"
                class="w-9 h-9 flex items-center justify-center border rounded-full hover:bg-gray-100 active:scale-95 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009CA3]">
          <i data-lucide="plus" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Action -->
    <button id="actionBtn"
            class="h-11 w-full bg-[#009CA3] text-white rounded-lg font-[500] hover:bg-[#03868c] active:scale-95 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#009CA3]">
      Add&nbsp;bundle
    </button>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      /* Tabs */
      const tabs = document.querySelectorAll('.tab');
      const highlight = document.getElementById('segHighlight');
      const sections = {
        packs: document.getElementById('packsOptions'),
        bogo:  document.getElementById('bogoOptions'),
        mix:   document.getElementById('mixOptions')
      };
      const qtyWrapper = document.getElementById('qtyWrapper');
      const actionBtn  = document.getElementById('actionBtn');
      const labels = { packs:'Add bundle', bogo:'Add promo', mix:'Add mix' };
      let current = 'packs';

      tabs.forEach((btn,idx)=>{
        btn.addEventListener('click',()=>{
          if(btn.dataset.tab===current) return;
          setActiveTab(btn.dataset.tab, idx);
        });
      });

      function setActiveTab(tab, idx=0){
        current = tab;
        tabs.forEach(b=>{
          const active = b.dataset.tab===tab;
          b.setAttribute('aria-selected',active);
          b.classList.toggle('text-[#009CA3]',!active);
          b.classList.toggle('text-gray-900',active);
        });
        highlight.style.transform = `translateX(${idx*100}%)`;
        for(const key in sections){
          sections[key].classList.toggle('hidden',key!==tab);
        }
        qtyWrapper.classList.toggle('hidden',tab!=='packs');
        actionBtn.textContent = labels[tab];
      }
      setActiveTab('packs',0);

      /* Quantity */
      const qtyInput=document.getElementById('qtyInput');
      document.getElementById('plusQty').onclick=()=>updateQty(1);
      document.getElementById('minusQty').onclick=()=>updateQty(-1);
      function updateQty(delta){
        let v=parseInt(qtyInput.value||1,10);
        v=Math.max(1,Math.min(99,v+delta));
        qtyInput.value=v;
      }

      /* Toast */
      const toastWrapper=document.getElementById('toast').firstElementChild;
      let toastTimeout;
      function showToast(msg){
        toastWrapper.querySelector('span').textContent=msg;
        toastWrapper.classList.remove('opacity-0','scale-95');
        clearTimeout(toastTimeout);
        toastTimeout=setTimeout(()=>toastWrapper.classList.add('opacity-0','scale-95'),3000);
      }

      /* Product card interactions */
      document.querySelectorAll('.addChip').forEach(btn=>{
        btn.addEventListener('click',(e)=>{
          e.stopPropagation();
          const card=btn.closest('.productCard');
          const isSelected=card.classList.toggle('ring-2');
          btn.innerHTML=isSelected?'<i data-lucide="check" class="w-4 h-4"></i>':'<i data-lucide="plus" class="w-4 h-4"></i>';
          lucide.createIcons({icons:['check','plus']});
          showToast(isSelected?'Added to cart!':'Removed');
        });
      });
    });
  </script>
</body>
</html>
