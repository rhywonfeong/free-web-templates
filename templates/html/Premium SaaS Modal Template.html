<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Diamond</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-zinc-50 min-h-screen flex items-center justify-center p-4 antialiased text-zinc-900">

    <div class="max-w-sm w-full bg-white rounded-2xl border border-zinc-200 shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-8 flex flex-col items-center text-center">
        
        <!-- Animated SVG Diamond -->
        <div class="flex w-32 h-32 mb-8 items-center justify-center">
            <svg viewBox="-5 -5 110 110" class="overflow-visible w-[128px] h-[128px]" xmlns="http://www.w3.org/2000/svg" stroke-width="2" data-icon-replaced="true" style="width: 128px; height: 128px; color: rgb(230, 25, 139)">
                <g class="">
                    <!-- Gentle floating animation for the entire group -->
                    <animateTransform attributeName="transform" type="translate" values="0,2; 0,-2; 0,2" dur="4s" repeatCount="indefinite"></animateTransform>
                    
                    <!-- Sparkles / Rays -->
                    <!-- Left Ray -->
                    <line x1="28" y1="22" x2="16" y2="10" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
                        <animate attributeName="opacity" values="0.1; 1; 0.1" dur="2s" begin="0s" repeatCount="indefinite"></animate>
                    </line>
                    <!-- Center Ray -->
                    <line x1="50" y1="17" x2="50" y2="2" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
                        <animate attributeName="opacity" values="0.1; 1; 0.1" dur="2s" begin="0.6s" repeatCount="indefinite"></animate>
                    </line>
                    <!-- Right Ray -->
                    <line x1="72" y1="22" x2="84" y2="10" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
                        <animate attributeName="opacity" values="0.1; 1; 0.1" dur="2s" begin="1.2s" repeatCount="indefinite"></animate>
                    </line>

                    <!-- Mask for the diamond cutouts -->
                    <mask id="diamond-cuts">
                        <!-- Solid white makes everything visible -->
                        <rect x="-10" y="-10" width="120" height="120" fill="white"></rect>
                        <!-- Black lines create the transparent gaps -->
                        <line x1="0" y1="50" x2="100" y2="50" stroke="black" stroke-width="3.5"></line>
                        <line x1="32.5" y1="20" x2="52.5" y2="100" stroke="black" stroke-width="3.5"></line>
                        <line x1="67.5" y1="20" x2="47.5" y2="100" stroke="black" stroke-width="3.5"></line>
                    </mask>

                    <!-- Diamond Polygon -->
                    <polygon points="25,30 75,30 90,50 50,92 10,50" fill="currentColor" mask="url(#diamond-cuts)" class=""></polygon>
                </g>
            </svg>
        </div>

        <h2 class="text-2xl font-semibold tracking-tight text-zinc-900 mb-3">
            Premium Unlocked
        </h2>
        
        <p class="text-lg text-zinc-500 mb-8 leading-relaxed">
            You now have access to limitless integrations, priority support, and advanced analytics.
        </p>

        <!-- Custom Toggle -->
        <div class="flex items-center justify-between w-full p-4 mb-8 rounded-xl border border-zinc-100 bg-zinc-50/80">
            <span class="text-base font-medium text-zinc-700">Auto-renew subscription</span>
            <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" value="" class="sr-only peer" checked="">
                <div class="w-11 h-6 bg-zinc-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-zinc-900"></div>
            </label>
        </div>

        <button class="w-full flex items-center justify-center py-3 px-4 bg-zinc-900 text-white rounded-lg font-medium text-base hover:bg-zinc-800 transition-colors focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:ring-offset-2">
            Go to Dashboard
            <i data-lucide="arrow-right" class="w-5 h-5 ml-2" stroke-width="1.5"></i>
        </button>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>

</body></html>
