<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ThoughtJot AI • Prototype</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.tailwindcss.com"></script></head>

<body class="antialiased font-sans bg-gradient-to-br from-[#e3e8ff] via-[#f5f2ff] to-[#fff] text-neutral-900 selection:bg-neutral-900/10 tracking-tight relative overflow-hidden">

<!-- ===== MAIN SCREENS ===== -->
<main class="relative z-0">

  <!-- Record Screen (default) -->
  <section id="recordScreen" class="screen min-h-screen flex flex-col items-center justify-center gap-14 px-6">

    <!-- Floating radial nav (visible on ALL screens) -->
    <div id="radialNav" class="fixed inset-0 flex items-center justify-center pointer-events-none z-40">
      <div class="relative">

        <!-- Central Record Button -->
        <button id="recordBtn"
          class="relative z-10 pointer-events-auto bg-white/20 backdrop-blur-md border border-white/30 shadow-xl text-white p-14 sm:p-16 rounded-full focus:outline-none"
          aria-label="Start recording">
          <span class="absolute inset-0 rounded-full bg-white/30 animate-ping" style="animation-duration:3.5s"></span>
          <span class="absolute inset-0 rounded-full bg-white/20 animate-ping" style="animation-duration:5s"></span>
          <i data-lucide="mic" class="relative w-10 h-10 stroke-[1.5]"></i>
        </button>

        <!-- Orbiting buttons -->
        <div class="absolute inset-0 flex items-center justify-center animate-spin" style="animation-duration:22s">
          <!-- Ideas / Thoughts -->
          <button data-target="ideasScreen"
            class="orbitBtn pointer-events-auto absolute -top-24 left-1/2 -translate-x-1/2 bg-white/30 backdrop-blur-md border border-white/40 shadow text-white p-4 rounded-full hover:bg-white/40 focus:outline-none"
            aria-label="Ideas">
            <i data-lucide="list" class="w-5 h-5 stroke-[1.5]"></i>
          </button>
          <!-- Settings -->
          <button data-target="settingsScreen"
            class="orbitBtn pointer-events-auto absolute top-24 left-1/2 -translate-x-1/2 bg-white/30 backdrop-blur-md border border-white/40 shadow text-white p-4 rounded-full hover:bg-white/40 focus:outline-none"
            aria-label="Settings">
            <i data-lucide="settings" class="w-5 h-5 stroke-[1.5]"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Motivational text (now pushed below record button) -->
    <div class="text-center space-y-2 animate-[fadeIn_.8s_ease-out_.4s_both] mt-64 sm:mt-72">
      <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-neutral-800">Capture the moment</h1>
      <p class="text-neutral-600 text-sm sm:text-base">Tap the glowing mic, speak, and let inspiration flow.</p>
    </div>

  </section>

  <!-- Ideas / Thoughts Screen -->
  <section id="ideasScreen" class="screen min-h-screen hidden flex flex-col gap-6 px-4 py-6 animate-[fadeIn_.6s_ease-out_.2s_both]">

    <!-- Header -->
    <header class="flex items-center justify-between">
      <h2 class="text-xl font-semibold tracking-tight">Ideas</h2>
      <button data-target="recordScreen" class="text-neutral-500 hover:text-neutral-800 transition focus:outline-none">
        <i data-lucide="x" class="w-6 h-6 stroke-[1.5]"></i>
      </button>
    </header>

    <!-- Ideas list -->
    <div class="flex-1 overflow-y-auto space-y-4">
      <!-- Example idea -->
      <article class="rounded-xl border border-neutral-200 bg-white/60 backdrop-blur p-4 flex items-start gap-3 hover:shadow-sm transition">
        <div class="rounded-lg bg-indigo-500/10 p-3">
          <i data-lucide="sparkles" class="w-5 h-5 stroke-[1.5] text-indigo-600"></i>
        </div>
        <div class="flex-1">
          <h4 class="font-medium mb-1 leading-tight">AI-powered pitch deck generator</h4>
          <p class="text-sm text-neutral-600 line-clamp-2">“What if founders could just speak their idea and instantly get a polished slide deck…”</p>
          <div class="flex items-center gap-2 mt-2 text-xs text-neutral-500">
            <span>2 min ago</span>
            <span class="w-1 h-1 rounded-full bg-neutral-300"></span>
            <span>1:14 audio</span>
          </div>
        </div>
      </article>
      <!-- More ideas could be appended here -->
    </div>

  </section>

  <!-- Settings Screen -->
  <section id="settingsScreen" class="screen min-h-screen hidden flex flex-col gap-6 px-4 py-6 animate-[fadeIn_.6s_ease-out_.2s_both]">

    <!-- Header -->
    <header class="flex items-center justify-between">
      <h2 class="text-xl font-semibold tracking-tight">Settings</h2>
      <button data-target="recordScreen" class="text-neutral-500 hover:text-neutral-800 transition focus:outline-none">
        <i data-lucide="x" class="w-6 h-6 stroke-[1.5]"></i>
      </button>
    </header>

    <!-- Settings list -->
    <div class="rounded-2xl border border-neutral-200 bg-white/60 backdrop-blur divide-y divide-neutral-200 overflow-hidden">
      <div class="flex items-center justify-between p-5 hover:bg-neutral-50/60 transition">
        <span class="font-medium">Profile</span>
        <i data-lucide="chevron-right" class="w-4 h-4 stroke-[1.5] text-neutral-400"></i>
      </div>
      <div class="flex items-center justify-between p-5 hover:bg-neutral-50/60 transition">
        <span class="font-medium">Billing</span>
        <i data-lucide="chevron-right" class="w-4 h-4 stroke-[1.5] text-neutral-400"></i>
      </div>
      <div class="flex items-center justify-between p-5 hover:bg-neutral-50/60 transition">
        <span class="font-medium">Help & Feedback</span>
        <i data-lucide="chevron-right" class="w-4 h-4 stroke-[1.5] text-neutral-400"></i>
      </div>
    </div>

  </section>

</main>

<!-- ===== Overlay while Recording ===== -->
<div id="overlay" class="fixed inset-0 bg-white/80 backdrop-blur-lg flex flex-col items-center justify-center gap-10 opacity-0 pointer-events-none transition-opacity duration-500 z-50">
  <div class="flex flex-col items-center gap-6">
    <div class="relative">
      <span class="absolute inset-0 rounded-full animate-ping bg-neutral-900/30" style="animation-duration:2.5s"></span>
      <span class="absolute inset-0 rounded-full animate-ping bg-neutral-900/20" style="animation-duration:4s"></span>
      <div class="relative bg-neutral-900 text-white p-8 rounded-full">
        <i data-lucide="mic" class="w-10 h-10 stroke-[1.5]"></i>
      </div>
    </div>
    <p class="text-lg font-medium">Listening…</p>
    <button id="stopRecord"
      class="flex items-center gap-2 bg-neutral-900 text-white px-8 py-3 rounded-full shadow hover:bg-neutral-800 transition focus:outline-none">
      <i data-lucide="square" class="w-5 h-5 stroke-[1.5]"></i>
      Stop
    </button>
  </div>
</div>

<!-- ===== JS ===== -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  lucide.createIcons();

  /* ---------- Screen Switcher ---------- */
  const switchTo = id => {
    document.querySelectorAll(".screen").forEach(el =>
      el.classList.toggle("hidden", el.id !== id)
    );
  };
  document.querySelectorAll("[data-target]").forEach(btn => {
    btn.addEventListener("click", () => switchTo(btn.dataset.target));
  });

  /* ---------- Recording Overlay ---------- */
  const overlay = document.getElementById("overlay");
  const showOverlay = () => {
    overlay.classList.remove("pointer-events-none");
    overlay.style.opacity = 1;
  };
  const hideOverlay = () => {
    overlay.style.opacity = 0;
    setTimeout(() => overlay.classList.add("pointer-events-none"), 500);
  };
  document.getElementById("recordBtn").onclick = showOverlay;
  document.getElementById("stopRecord").onclick = hideOverlay;

  /* ---------- Swipe / Key Navigation ---------- */
  let startX = 0, startY = 0;
  const handleMove = (endX, endY) => {
    const dx = endX - startX;
    const dy = endY - startY;
    if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0)       switchTo("ideasScreen");     // swipe left
      else if (dx > 0)  switchTo("settingsScreen");  // swipe right
    }
  };

  document.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  });
  document.addEventListener("touchend", e => {
    handleMove(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  });

  /* Keyboard arrows as fallback */
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft")  switchTo("ideasScreen");
    if (e.key === "ArrowRight") switchTo("settingsScreen");
  });
});
</script>

</body>
</html>
