/* Base Settings */
:root { font-family: 'Inter', sans-serif; }
/* -----------------------------------------------------------------
1. Animated Shiny CTA Button Styles
----------------------------------------------------------------- */
@property --gradient-angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@property --gradient-angle-offset { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@property --gradient-percent { syntax: "<percentage>"; initial-value: 20%; inherits: false; }
@property --gradient-shine { syntax: "<color>"; initial-value: #8484ff; inherits: false; }
.shiny-cta {
--gradient-angle: 0deg;
--gradient-angle-offset: 0deg;
--gradient-percent: 20%;
--gradient-shine: #8484ff;
--shadow-size: 2px;
position: relative;
overflow: hidden;
border-radius: 9999px;
padding: 1rem 2rem;
font-weight: 500;
color: #ffffff;
background: linear-gradient(#000000, #000000) padding-box,
conic-gradient(from calc(var(--gradient-angle) - var(--gradient-angle-offset)), transparent 0%, #1d4ed8 5%, var(--gradient-shine) 15%, #1d4ed8 30%, transparent 40%, transparent 100%) border-box;
border: 2px solid transparent;
box-shadow: inset 0 0 0 1px #1a1818;
outline: none;
transition: --gradient-angle-offset 800ms cubic-bezier(0.25, 1, 0.5, 1),
--gradient-percent 800ms cubic-bezier(0.25, 1, 0.5, 1),
--gradient-shine 800ms cubic-bezier(0.25, 1, 0.5, 1),
box-shadow 0.3s;
cursor: pointer;
isolation: isolate;
outline-offset: 4px;
z-index: 0;
animation: border-spin 2.5s linear infinite;
}
@keyframes border-spin { to { --gradient-angle: 360deg; } }
.shiny-cta:active { transform: translateY(1px); }
.shiny-cta::before {
content: ''; pointer-events: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 0;
--size: calc(100% - 6px); --position: 2px; --space: 4px; width: var(--size); height: var(--size);
background: radial-gradient(circle at var(--position) var(--position), white 0.5px, transparent 0) padding-box;
background-size: var(--space) var(--space); background-repeat: space;
mask-image: conic-gradient(from calc(var(--gradient-angle) + 45deg), black, transparent 10% 90%, black);
border-radius: inherit; opacity: 0.4;
}
.shiny-cta::after {
content: ''; pointer-events: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1;
width: 100%; aspect-ratio: 1;
background: linear-gradient(-50deg, transparent, #1d4ed8, transparent);
mask-image: radial-gradient(circle at bottom, transparent 40%, black);
opacity: 0.6; animation: shimmer 4s linear infinite;
}
.shiny-cta span { position: relative; z-index: 2; display: inline-block; }
.shiny-cta span::before {
content: ''; pointer-events: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: -1;
--size: calc(100% + 1rem); width: var(--size); height: var(--size);
box-shadow: inset 0 -1ex 2rem 4px #1d4ed8; opacity: 0; border-radius: inherit;
transition: opacity 800ms cubic-bezier(0.25, 1, 0.5, 1); animation: breathe 4.5s linear infinite;
}
@keyframes shimmer { to { transform: translate(-50%, -50%) rotate(360deg);} }
@keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(1);} 50% { transform: translate(-50%, -50%) scale(1.20);} }
/* -----------------------------------------------------------------
2. Gradient Pill Button Styles
----------------------------------------------------------------- */
[style*="--border-gradient"]::before {
content: ""; position: absolute; inset: 0; padding: 1px;

.btn-gen::before {

.btn-gen::after {

.btn-letter {

    <script>
        const textInput = document.getElementById('textInput');
        const colorInput = document.getElementById('colorInput');
        const body = document.getElementById('pageBody');
        const dynamicElements = document.querySelectorAll('.dynamic-text');
        const splitContainer1 = document.getElementById('splitText1');
        const splitContainer2 = document.getElementById('splitText2');

        // Initial State
        const DEFAULT_TEXT = "Insert Text";

        function updateUI(text) {
            const displayText = text.trim() === "" ? DEFAULT_TEXT : text;

            // Update simple text buttons
            dynamicElements.forEach(el => {
                el.textContent = displayText;
            });

            // Update Complex Split Text Button
            updateSplitButton(displayText);
        }

        function updateSplitButton(text) {
            if (!splitContainer1 || !splitContainer2) return;
            
            // Clear current letters
            splitContainer1.innerHTML = '';
            splitContainer2.innerHTML = '';

            const chars = text.split('');
            chars.forEach((char, index) => {
                const span1 = document.createElement('span');
                span1.className = 'btn-letter';
                span1.innerHTML = char === ' ' ? '&nbsp;' : char;
                span1.style.animationDelay = `${index * 0.05}s`;

                const span2 = span1.cloneNode(true);

                splitContainer1.appendChild(span1);
                splitContainer2.appendChild(span2);
            });
        }

        async function copyCode(btn, elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;

            // Get HTML and clean it up slightly
            // We use firstElementChild to grab the button itself, not the wrapper
            let htmlToCopy = el.firstElementChild ? el.firstElementChild.outerHTML : el.innerHTML;
            
            // Very basic formatter to make it not a single line string if copied from inspect
            htmlToCopy = htmlToCopy.replace(/></g, '>\n<');

            try {
                await navigator.clipboard.writeText(htmlToCopy);
                
                // Visual Feedback
                const originalContent = btn.innerHTML;
                const checkIcon = `<svg class="w-3.5 h-3.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
                
                btn.innerHTML = `${checkIcon}<span>Copied!</span>`;
                btn.classList.remove('text-zinc-500');
                btn.classList.add('text-emerald-400');
                
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.add('text-zinc-500');
                    btn.classList.remove('text-emerald-400');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy', err);
            }
        }

        // Event Listeners
        textInput.addEventListener('input', (e) => updateUI(e.target.value));
        colorInput.addEventListener('input', (e) => {
            body.style.backgroundColor = e.target.value;
        });

        // Initialize
        updateUI("");
    </script>
</body>
</html>
