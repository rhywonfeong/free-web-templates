<title>Animated Glowing Border Button</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes glowing-button-85 {
0% { background-position: 0 0; }
50% { background-position: 400% 0; }
100% { background-position: 0 0; }
}
.glowing-border::before {
content: "";
background: linear-gradient(45deg, #D4ACFF, #EF9829, #6AD9FF, #D4ACFF, #EF9829, #6AD9FF, #D4ACFF);
position: absolute;
top: -2px;
left: -2px;
background-size: 400%;
z-index: -1;
filter: blur(8px);
-webkit-filter: blur(8px);
width: calc(100% + 4px);
height: calc(100% + 4px);
animation: glowing-button-85 20s linear infinite;
transition: opacity 0.3s ease-in-out;
border-radius: 10px;
opacity: 0.8;
}
.glowing-border::after {
z-index: -1;
content: "";
position: absolute;
width: 100%;
height: 100%;
background: #B1FA63;
left: 0;
top: 0;
border-radius: 10px;
}
</style></head>
