<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editorial Hero Layout</title>
<!-- Fonts: Playfair Display & Instrument Serif -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Iconify -->
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
<!-- Tailwind Config -->
<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
fontFamily: {
heading: ['"Playfair Display"', 'serif'],
body: ['"Instrument Serif"', 'serif'],
},
letterSpacing: {
tighter: '-0.04em',
tight: '-0.02em',
}
}
}
}
</script>
<style>
/* Custom overrides for specific inputs to ensure flat style */
input[type="checkbox"] {
appearance: none;
background-color: transparent;
margin: 0;
}
/* Subtle texture for the background */
.bg-noise {
background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
}
</style></head>
<body class="bg-neutral-950 min-h-screen flex items-center justify-center p-4 md:p-8 antialiased selection:bg-neutral-700 selection:text-white">

    <!-- Card Container -->
    <main class="relative w-full max-w-6xl aspect-[4/5] md:aspect-[16/9] lg:aspect-[21/9] bg-neutral-900 border border-neutral-800 flex flex-col overflow-hidden group">
        
        <!-- Background Accents -->
        <div class="absolute top-0 right-0 w-1/2 h-full bg-neutral-800/10 pointer-events-none skew-x-12 translate-x-20"></div>
        <div class="absolute inset-0 bg-noise opacity-20 pointer-events-none mix-blend-overlay"></div>

        <!-- Navigation -->
        <header class="relative z-10 w-full px-6 py-6 md:px-10 md:py-8 flex justify-between items-center border-b border-neutral-800/50">
            <!-- Logo -->
            <div class="flex items-center gap-2">
                <span class="font-heading font-medium tracking-tighter text-2xl text-neutral-100">
                    AESTHETE
                </span>
            </div>

            <!-- Desktop Nav -->
            <nav class="hidden md:flex items-center gap-8">
                <a href="#" class="font-body text-xl text-neutral-400 hover:text-neutral-100 transition-colors italic">Journal</a>
                <a href="#" class="font-body text-xl text-neutral-400 hover:text-neutral-100 transition-colors italic">Collections</a>
                <a href="#" class="font-body text-xl text-neutral-400 hover:text-neutral-100 transition-colors italic">Atelier</a>
            </nav>

            <!-- Actions -->
            <div class="flex items-center gap-4">
                <button class="text-neutral-400 hover:text-white transition-colors">
                    <span class="iconify" data-icon="lucide:search" data-width="20" data-height="20" style="stroke-width: 1.5;"></span>
                </button>
                <button class="text-neutral-400 hover:text-white transition-colors md:hidden">
                    <span class="iconify" data-icon="lucide:menu" data-width="24" data-height="24" style="stroke-width: 1.5;"></span>
                </button>
                <a href="#" class="hidden md:flex items-center gap-2 font-body text-lg text-neutral-100 border border-neutral-700 px-4 py-1.5 hover:bg-neutral-800 transition-colors">
                    Sign In
                </a>
            </div>
        </header>

        <!-- Hero Content -->
        <div class="relative z-10 flex-1 flex flex-col justify-center px-6 md:px-10 lg:px-16">
            <div class="max-w-3xl">
                <!-- Tagline -->
                <div class="flex items-center gap-3 mb-6">
                    <span class="h-px w-8 bg-neutral-600"></span>
                    <span class="font-body text-lg md:text-xl text-neutral-400 uppercase tracking-widest">Autumn / Winter '24</span>
                </div>

                <!-- Headline -->
                <h1 class="font-heading text-5xl md:text-7xl lg:text-8xl text-neutral-100 leading-[0.95] tracking-tight mb-8">
                    <span class="italic font-normal opacity-80 block mb-2">Refined</span>
                    <span class="font-medium">SIMPLICITY.</span>
                </h1>

                <!-- Body Text -->
                <p class="font-body text-2xl md:text-3xl text-neutral-400 leading-snug max-w-xl mb-10 italic opacity-90">
                    We curate the silence between the noise. A digital sanctuary for the modern minimalist seeking depth in a flat world.
                </p>

                <!-- Custom Interactive Component (Newsletter/Action) -->
                <div class="flex flex-col md:flex-row items-start md:items-center gap-6">
                    
                    <!-- Primary Button -->
                    <button class="group relative px-8 py-4 bg-neutral-100 text-neutral-950 font-body text-xl italic overflow-hidden transition-all hover:pr-12">
                        <span class="relative z-10">Explore Collection</span>
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition-all duration-300 transform group-hover:translate-x-0 -translate-x-4">
                            <span class="iconify" data-icon="lucide:arrow-right" data-width="18"></span>
                        </span>
                    </button>

                    <!-- Secondary Link -->
                    <button class="flex items-center gap-3 text-neutral-400 hover:text-white transition-colors group">
                        <div class="w-10 h-10 border border-neutral-700 flex items-center justify-center rounded-full group-hover:border-neutral-500 transition-colors">
                            <span class="iconify" data-icon="lucide:play" data-width="14" class="ml-0.5"></span>
                        </div>
                        <span class="font-body text-xl">Watch Film</span>
                    </button>
                </div>
            </div>

            <!-- Custom Controls (Decorative UI elements) -->
            <div class="absolute bottom-8 right-8 md:bottom-12 md:right-12 flex flex-col gap-6 items-end hidden md:flex">
                
                <!-- Custom Checkbox -->
                <label class="flex items-center gap-3 cursor-pointer group">
                    <span class="font-body text-lg text-neutral-500 group-hover:text-neutral-300 transition-colors">Dark Mode</span>
                    <div class="relative w-5 h-5 border border-neutral-600 flex items-center justify-center">
                        <input type="checkbox" checked class="peer w-full h-full absolute inset-0 opacity-0 cursor-pointer">
                        <span class="w-3 h-3 bg-neutral-200 opacity-0 peer-checked:opacity-100 transition-opacity"></span>
                    </div>
                </label>

                <!-- Custom Slider Indicator -->
                <div class="flex items-center gap-4">
                    <span class="font-body text-lg text-neutral-500">01</span>
                    <div class="w-24 h-px bg-neutral-800 relative">
                        <div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/3 h-0.5 bg-neutral-200"></div>
                    </div>
                    <span class="font-body text-lg text-neutral-300">04</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
