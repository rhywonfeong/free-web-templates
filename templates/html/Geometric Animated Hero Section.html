  <meta charset="UTF-8">
  <title>Geometric Hero Composition</title>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <style>
    :root {
      --color-1: #abedd8;
      --color-2: #46cdcf;
      --color-3: #3d84a8;
      --color-4: #000; /* changed to black */
      --base-size: 55vmin;
      --length: 101;
      --half: 50;
      --gap-size: calc(var(--base-size) / var(--half));
      --gap-dist: calc(var(--base-size) / var(--length));
      --angle: 75deg;
      --time: 2.5s;
      --ratio-a: 0.5;
      --ratio-b: 0.25;
      --ratio-s: 1.5;
      --dist-v: 10vh;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100vw;
      height: 100vh;
      background: var(--color-4);
      overflow: hidden;
      margin: 0;
      padding: 0;
      perspective: 440vmin;
      animation: reveal 2.5s ease-in-out forwards;
      position: relative;
      min-height: 100vh;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }
    section {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: anim-v 20s ease-in-out infinite alternate;
      perspective: inherit;
      transform-style: preserve-3d;
      width: 100vw;
      height: 100vh;
    }
    ul {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      list-style: none;
      transform-style: preserve-3d;
      animation: anim-r 20s linear infinite;
      width: var(--base-size);
      height: var(--base-size);
      padding: 0;
      margin: 0;
    }
    li {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-style: preserve-3d;
      animation: anim-h 2.5s var(--delay, 0s) ease-in-out infinite alternate;
      box-shadow: 0 0 2.75vmin 0.6875vmin rgba(61,132,168,0.25) inset;
      border-radius: 50%;
      will-change: transform;
      background: none;
    }
    li::before,
    li::after      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none;
      border-radius: 50%;
    }
    li::after {
      animation: anim-s 2.5s ease-in-out infinite alternate;
      box-shadow: 0 0 1.375vmin 0.34375vmin rgba(70,205,207,0.25) inset;
      background: none;
    }
    li::before {
      animation: anim-spin 2.5s var(--delay, 0s) linear infinite;
      box-shadow: 0 0 .6875vmin 0.171875vmin rgba(171,237,216,0.75) inset;
      background: none;
    }
    @keyframes anim-v {
      0%   { transform: translate3d(0, 10vh, 0); }
      100% { transform: translate3d(0,-10vh, 0) rotate3d(0,0,1,90deg);}
    }
    @keyframes anim-h {
      0%   { transform: translate(-50%, -50%) translate3d(0,0,0);}
      100% { transform: translate(-50%, -50%) translate3d(0,0,var(--dist,0));}
    }
    @keyframes anim-spin {
      0% { transform: translate(-50%,-50%) rotate(0deg);}
      100% { transform: translate(-50%,-50%) rotate(360deg);}
    }
    @keyframes anim-s {
      0% { transform: translate(-50%,-50%) scale3d(1,1,1);}
      100% { transform: translate(-50%,-50%) scale3d(1.5,1.5,1.5);}
    }
    @keyframes reveal {
      0% { opacity: 0;}
      100% { opacity: 1;}
    }
    @keyframes anim-r {
      0% { transform: rotate3d(1,1,0,75deg) rotate3d(0,0,-1,0deg);}
      100% { transform: rotate3d(1,1,0,75deg) rotate3d(0,0,-1,360deg);}
    }
    .hero-content {
      z-index: 10;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      text-align: center;
      pointer-events: auto;
    }
    .hero-headline {
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      font-size: clamp(2.5rem, 5vw, 5rem);
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin-bottom: 1rem;
      text-shadow: 0 2px 32px rgba(17,45,78,0.6), 0 1px 0 #46cdcf99;
      filter: drop-shadow(0 2px 16px #3d84a899);
    }
    .hero-subtext {
      font-size: clamp(1.1rem, 2vw, 2rem);
      color: rgba(255,255,255,0.6);
      font-weight: 400;
      margin-bottom: 2.5rem;
      max-width: 36rem;
      text-shadow: 0 1px 12px #112d4e77;
    }
    .hero-button {
      font-size: 1.25rem;
      padding: 0.8em 2.2em;
      border-radius: 9999px;
      font-weight: 700;
      color: #112d4e;
      background: linear-gradient(90deg, #46cdcf 0%, #abedd8 100%);
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 24px #3d84a877, 0 1px 0 #46cdcf44;
      transition: transform 0.12s, box-shadow 0.12s, background 0.2s;
      outline: none;
    }
    .hero-button:hover, .hero-button:focus {
      transform: scale(1.05);
      box-shadow: 0 4px 36px #3d84a899, 0 2px 0 #abedd888;
      background: linear-gradient(90deg, #abedd8 0%, #46cdcf 100%);
    }
    @media (max-width: 700px) {
      .hero-headline { font-size: 2rem; }
      .hero-subtext { font-size: 1rem; }
      .hero-content { padding: 1.5rem 1rem; }
    }
  </style>

<body>
  <div class="hero-bg">
    <section aria-hidden="true">
      <ul id="orbit-list"></ul>
    </section>
  </div>
  <main class="hero-content">
    <h1 class="hero-headline">Inspire with Geometry</h1>
    <p class="hero-subtext">
      Dynamic, animated geometric shapes for stunning hero sections. Elevate your design—make a bold first impression.
    </p>
    <button class="hero-button">Get Started</button>
  </main>
  <script>
    const baseSize = 55; // vmin
    const length = 101;
    const half = Math.floor(length / 2);
    const gapDist = baseSize / length;
    const gapSize = baseSize / half;
    const time = 2.5;
    const delay = time / half;
    const ratioA = 0.5;
    const ratioB = 0.25;

    const ul = document.getElementById('orbit-list');
    function setLiStyles(li, index, sign = 1, step = 0) {
      const d = sign * (index * gapDist * 1.75);
      const size = baseSize - gapSize * (index - 1);
      li.style.setProperty('--delay', (delay * index) + 's');
      li.style.setProperty('--dist', d + 'vmin');
      li.style.width = size + 'vmin';
      li.style.height = size + 'vmin';
      li.style.setProperty('--after-size', (size * ratioA) + 'vmin');
      li.style.setProperty('--before-size', (size * ratioB) + 'vmin');
      li.style.zIndex = 10 + (sign * index);
      li.innerHTML = '';
      li.style.setProperty('--li-index', index);
    }
    for(let i=1; i<=half; ++i) {
      let li = document.createElement('li');
      setLiStyles(li, i, 1, 0);
      li.style.position = 'absolute';
      li.style.top = '50%';
      li.style.left = '50%';
      li.style.setProperty('--size', (baseSize - gapSize * (i - 1)) + 'vmin');
      li.style.setProperty('--after-size', ((baseSize - gapSize * (i - 1)) * ratioA) + 'vmin');
      li.style.setProperty('--before-size', ((baseSize - gapSize * (i - 1)) * ratioB) + 'vmin');
      ul.appendChild(li);
    }
    for(let i=1; i<=half; ++i) {
      let li = document.createElement('li');
      setLiStyles(li, i, -1, half);
      li.style.position = 'absolute';
      li.style.top = '50%';
      li.style.left = '50%';
      li.style.setProperty('--size', (baseSize - gapSize * (i - 1)) + 'vmin');
      li.style.setProperty('--after-size', ((baseSize - gapSize * (i - 1)) * ratioA) + 'vmin');
      li.style.setProperty('--before-size', ((baseSize - gapSize * (i - 1)) * ratioB) + 'vmin');
      ul.appendChild(li);
    }
    const style = document.createElement('style');
    style.innerHTML = `
      ul#orbit-list li::after {
        width: var(--after-size, 0);
        height: var(--after-size, 0);
        left: 50%;
        top: 50%;
        position: absolute;
      }
      ul#orbit-list li::before {
        width: var(--before-size, 0);
        height: var(--before-size, 0);
        left: 50%;
        top: 50%;
        position: absolute;
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
