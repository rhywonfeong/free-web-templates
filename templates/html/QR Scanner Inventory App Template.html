<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master QR Scanner</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}
/* Custom Animations */
@keyframes scan {
0% { top: 0%; opacity: 0; }
10% { opacity: 1; }
90% { opacity: 1; }
100% { top: 100%; opacity: 0; }
}
@keyframes breathe {
0%, 100% {
transform: scale(1);
box-shadow: 0 0 15px rgba(139, 92, 246, 0.2);
}
50% {
transform: scale(1.03);
box-shadow: 0 0 30px rgba(139, 92, 246, 0.6);
}
}
@keyframes slideUp {
from { transform: translateY(100%); opacity: 0; }
to { transform: translateY(0); opacity: 1; }
}
@keyframes pulse-check {
0% { transform: scale(0.9); opacity: 0.8; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
70% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}
.animate-scan { animation: scan 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
.animate-breathe { animation: breathe 3s ease-in-out infinite; }
.animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.animate-pulse-check { animation: pulse-check 2s infinite; }
/* Hide scrollbar for clean UI */
.hide-scroll::-webkit-scrollbar { display: none; }
.hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-zinc-950 text-zinc-200 h-screen w-full overflow-hidden flex justify-center items-center selection:bg-violet-500/30">

    <!-- Mobile Device Mockup Container -->
    <div class="relative w-full max-w-md h-full sm:h-[90vh] sm:rounded-[40px] sm:border-[8px] sm:border-zinc-900 overflow-hidden shadow-2xl bg-black">
        
        <!-- 1. The Scanner View (Active Camera Background) -->
        <!-- Simulated camera feed with dark gradient overlay for text readability -->
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=800&auto=format&fit=crop" alt="Warehouse Camera Feed" class="w-full h-full object-cover opacity-50 saturate-50 blur-[1px]">
            <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-black/90"></div>
        </div>

        <!-- Top Controls -->
        <div class="absolute top-0 left-0 right-0 p-6 flex justify-between items-center z-20">
            <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-white hover:bg-white/20 transition-colors">
                <iconify-icon icon="solar:multiply-linear" stroke-width="1.5" class="text-xl"></iconify-icon>
            </button>
            <button class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md border border-white/20 flex items-center justify-center text-white hover:bg-white/20 transition-colors">
                <iconify-icon icon="solar:flashlight-linear" stroke-width="1.5" class="text-xl"></iconify-icon>
            </button>
        </div>

        <!-- The Scanner Overlay (Shifted up to balance with drawer) -->
        <div class="absolute inset-0 flex items-center justify-center z-10 pb-40 pointer-events-none">
            <div class="relative w-64 h-64 animate-breathe">
                <!-- Glowing Border -->
                <div class="absolute inset-0 border border-violet-500/50 rounded-[32px]"></div>
                
                <!-- Corner Framing Accents -->
                <div class="absolute top-0 left-0 w-8 h-8 border-t-[3px] border-l-[3px] border-violet-400 rounded-tl-[32px]"></div>
                <div class="absolute top-0 right-0 w-8 h-8 border-t-[3px] border-r-[3px] border-violet-400 rounded-tr-[32px]"></div>
                <div class="absolute bottom-0 left-0 w-8 h-8 border-b-[3px] border-l-[3px] border-violet-400 rounded-bl-[32px]"></div>
                <div class="absolute bottom-0 right-0 w-8 h-8 border-b-[3px] border-r-[3px] border-violet-400 rounded-br-[32px]"></div>
                
                <!-- Scanning Line -->
                <div class="absolute left-4 right-4 h-[2px] bg-violet-400 rounded-full shadow-[0_0_12px_#a78bfa] animate-scan z-10"></div>
            </div>
        </div>

        <!-- 2. The Post-Scan "Success" Drawer -->
        <div class="absolute bottom-0 left-0 right-0 h-[65%] bg-zinc-950/70 backdrop-blur-2xl border-t border-white/10 rounded-t-[32px] flex flex-col z-30 animate-slide-up shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
            
            <!-- Drawer Handle -->
            <div class="w-full flex justify-center pt-3 pb-2">
                <div class="w-12 h-1 bg-white/20 rounded-full"></div>
            </div>

            <div class="flex-1 overflow-y-auto hide-scroll pb-28 px-5">
                <!-- Header: Detection Success -->
                <div class="flex flex-col items-center mt-2 mb-6 text-center">
                    <div class="w-12 h-12 rounded-full bg-green-500/20 flex items-center justify-center mb-3 animate-pulse-check border border-green-500/30">
                        <iconify-icon icon="solar:check-circle-linear" stroke-width="2" class="text-2xl text-green-400 drop-shadow-[0_0_8px_rgba(74,222,128,0.8)]"></iconify-icon>
                    </div>
                    <h2 class="text-xl font-semibold text-white tracking-tight mb-4">Cargo #KOLI-05 Detected!</h2>
                    
                    <!-- Summary Chips -->
                    <div class="flex flex-wrap justify-center gap-2">
                        <div class="bg-white/5 border border-white/10 rounded-full px-3 py-1.5 flex items-center gap-1.5 text-xs text-zinc-300">
                            <iconify-icon icon="solar:box-linear" stroke-width="1.5" class="text-zinc-400"></iconify-icon>
                            <span>42 Items</span>
                        </div>
                        <div class="bg-white/5 border border-white/10 rounded-full px-3 py-1.5 flex items-center gap-1.5 text-xs text-zinc-300">
                            <iconify-icon icon="solar:weight-linear" stroke-width="1.5" class="text-zinc-400"></iconify-icon>
                            <span>125 kg</span>
                        </div>
                        <div class="bg-white/5 border border-white/10 rounded-full px-3 py-1.5 flex items-center gap-1.5 text-xs text-zinc-300">
                            <iconify-icon icon="solar:plain-2-linear" stroke-width="1.5" class="text-zinc-400"></iconify-icon>
                            <span>Air Cargo</span>
                        </div>
                    </div>
                </div>

                <!-- 3. The Synced List -->
                <div class="space-y-3">
                    
                    <!-- Item Card 1 -->
                    <div class="bg-white/[0.03] border border-white/[0.08] rounded-2xl p-4 flex flex-col gap-4 relative overflow-hidden group hover:bg-white/[0.05] transition-colors">
                        <!-- Top: Identity & Status -->
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2.5">
                                <span class="text-sm font-medium text-white tracking-tight">#KLI-8942</span>
                                <div class="bg-white text-black px-1.5 py-0.5 rounded text-[10px] tracking-tight font-medium">SHEIN</div>
                            </div>
                            <div class="bg-violet-500/15 border border-violet-500/20 text-violet-300 text-xs px-2.5 py-1 rounded-full flex items-center gap-1">
                                <div class="w-1.5 h-1.5 rounded-full bg-violet-400"></div>
                                New Arrival
                            </div>
                        </div>

                        <!-- Middle: Customer Brief -->
                        <div class="flex items-center gap-3">
                            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=100&auto=format&fit=crop" alt="Customer" class="w-8 h-8 rounded-full object-cover ring-2 ring-white/10">
                            <span class="text-sm text-zinc-300 font-medium">Aisha Khan</span>
                        </div>

                        <!-- Bottom: AI Storage Recommendation -->
                        <div class="bg-violet-900/20 border border-violet-500/30 rounded-xl p-3 flex items-center gap-2.5 mt-1">
                            <iconify-icon icon="solar:magic-stick-3-linear" stroke-width="1.5" class="text-violet-400 text-base"></iconify-icon>
                            <span class="text-xs text-violet-200 font-medium tracking-tight">Assign to: Shelf A-4, Bin 12</span>
                        </div>
                    </div>

                    <!-- Item Card 2 -->
                    <div class="bg-white/[0.03] border border-white/[0.08] rounded-2xl p-4 flex flex-col gap-4 relative overflow-hidden group hover:bg-white/[0.05] transition-colors">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2.5">
                                <span class="text-sm font-medium text-white tracking-tight">#KLI-8945</span>
                                <div class="bg-orange-500 text-white px-1.5 py-0.5 rounded text-[10px] tracking-tight font-medium">TEMU</div>
                            </div>
                            <div class="bg-violet-500/15 border border-violet-500/20 text-violet-300 text-xs px-2.5 py-1 rounded-full flex items-center gap-1">
                                <div class="w-1.5 h-1.5 rounded-full bg-violet-400"></div>
                                New Arrival
                            </div>
                        </div>

                        <div class="flex items-center gap-3">
                            <img src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?q=80&w=100&auto=format&fit=crop" alt="Customer" class="w-8 h-8 rounded-full object-cover ring-2 ring-white/10">
                            <span class="text-sm text-zinc-300 font-medium">Zain Ahmed</span>
                        </div>

                        <div class="bg-violet-900/20 border border-violet-500/30 rounded-xl p-3 flex items-center gap-2.5 mt-1">
                            <iconify-icon icon="solar:magic-stick-3-linear" stroke-width="1.5" class="text-violet-400 text-base"></iconify-icon>
                            <span class="text-xs text-violet-200 font-medium tracking-tight">Assign to: Shelf B-1, Bin 08</span>
                        </div>
                    </div>

                </div>
            </div>

            <!-- 4. The Final Action (Sticky Bottom) -->
            <div class="absolute bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-zinc-950 via-zinc-950/90 to-transparent pt-12 z-40 rounded-b-[40px]">
                <button class="w-full bg-violet-600 hover:bg-violet-500 active:scale-[0.98] text-white font-medium text-sm py-4 rounded-2xl shadow-[0_4px_20px_rgba(124,58,237,0.4)] transition-all duration-200 flex items-center justify-center gap-2">
                    <iconify-icon icon="solar:server-square-update-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                    Confirm & Add to Inventory
                </button>
            </div>
        </div>

    </div>
</body>
</html>
