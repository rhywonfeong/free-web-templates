  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Drawing Canvas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-4xl w-full bg-white/10 backdrop-blur-xl rounded-2xl overflow-hidden shadow-2xl border border-white/20">
    <div class="relative">
      <div class="absolute top-3 left-4 z-10">
        <h2 class="text-2xl font-bold text-white">Creative Canvas</h2>
        <p class="text-white/70 text-sm">Express yourself through art</p>
      </div>
      <div class="absolute top-3 right-4 z-10 flex space-x-2">
        <button id="clearBtn" class="bg-red-500/80 hover:bg-red-600/80 text-white px-3 py-1 rounded-lg text-sm">Clear</button>
        <button id="downloadBtn" class="bg-green-500/80 hover:bg-green-600/80 text-white px-3 py-1 rounded-lg text-sm">Download</button>
      </div>
      <canvas
        id="drawingCanvas"
        class="w-full h-[400px] bg-white/5 backdrop-blur-sm"
        width="1000"
        height="800"
      ></canvas>
    </div>
    <div class="p-5 bg-black/40">
      <div class="flex flex-wrap gap-3 mb-4">
        <div class="flex flex-col items-center">
          <label class="text-white/70 text-xs mb-1">Brush Size</label>
          <input type="range" id="brushSize" min="1" max="50" value="5" class="w-32">
        </div>
        <div class="flex flex-col items-center">
          <label class="text-white/70 text-xs mb-1">Opacity</label>
          <input type="range" id="opacity" min="1" max="100" value="100" class="w-32">
        </div>
        <div class="flex flex-col items-center">
          <label class="text-white/70 text-xs mb-1">Color</label>
          <input type="color" id="colorPicker" value="#ffffff" class="h-8 w-16 bg-transparent border-0">
        </div>
      </div>
      
      <div class="grid grid-cols-6 gap-2 mt-4">
        <button class="color-btn w-8 h-8 rounded-full bg-white" data-color="#ffffff"></button>
        <button class="color-btn w-8 h-8 rounded-full bg-red-500" data-color="#ef4444"></button>
        <button class="color-btn w-8 h-8 rounded-full bg-orange-500" data-color="#f97316"></button>
        <button class="color-btn w-8 h-8 rounded-full bg-yellow-400" data-color="#facc15"></button>
        <button class="color-btn w-8 h-8 rounded-full bg-green-500" data-color="#22c55e"></button>
        <button class="color-btn w-8 h-8 rounded-full bg-blue-500" data-color="#3b82f6"></button>
        <button class="color-btn w-8 h-8 rounded-full bg-indigo-500" data-color="#6366f1"></button>
        <button class="color-btn w-8 h-8 rounded-full bg-purple-500" data-color="#a855f7"></button>
        <button class="color-btn w-8 h-8 rounded-full bg-pink-500" data-color="#ec4899"></button>
        <button class="color-btn w-8 h-8 rounded-full bg-gray-500" data-color="#6b7280"></button>
        <button class="color-btn w-8 h-8 rounded-full bg-black" data-color="#000000"></button>
        <button class="color-btn w-8 h-8 rounded-full bg-gradient-to-r from-pink-500 to-purple-500" data-color="rainbow"></button>
      </div>
      
      <div class="mt-4 pt-4 border-t border-white/10">
        <p class="text-white/70 text-sm">Create beautiful artwork with this simple drawing tool. Adjust brush size, opacity, and choose from various colors to express your creativity.</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const canvas = document.getElementById('drawingCanvas');
      const ctx = canvas.getContext('2d');
      const brushSizeInput = document.getElementById('brushSize');
      const opacityInput = document.getElementById('opacity');
      const colorPicker = document.getElementById('colorPicker');
      const clearBtn = document.getElementById('clearBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const colorBtns = document.querySelectorAll('.color-btn');
      
      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;
      let hue = 0;
      
      // Initialize canvas with a transparent background
      ctx.fillStyle = 'rgba(0, 0, 0, 0)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      function startDrawing(e) {
        isDrawing = true;
        [lastX, lastY] = getCoordinates(e);
      }
      
      function stopDrawing() {
        isDrawing = false;
      }
      
      function draw(e) {
        if (!isDrawing) return;
        
        const [currentX, currentY] = getCoordinates(e);
        const brushSize = brushSizeInput.value;
        const opacity = opacityInput.value / 100;
        let color = colorPicker.value;
        
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.lineWidth = brushSize;
        
        if (color === 'rainbow') {
          ctx.strokeStyle = `hsla(${hue}, 100%, 50%, ${opacity})`;
          hue = (hue + 1) % 360;
        } else {
          const r = parseInt(color.substr(1, 2), 16);
          const g = parseInt(color.substr(3, 2), 16);
          const b = parseInt(color.substr(5, 2), 16);
          ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${opacity})`;
        }
        
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(currentX, currentY);
        ctx.stroke();
        
        [lastX, lastY] = [currentX, currentY];
      }
      
      function getCoordinates(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        if (e.type.includes('touch')) {
          return [
            (e.touches[0].clientX - rect.left) * scaleX,
            (e.touches[0].clientY - rect.top) * scaleY
          ];
        }
        
        return [
          (e.clientX - rect.left) * scaleX,
          (e.clientY - rect.top) * scaleY
        ];
      }
      
      function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      
      function downloadCanvas() {
        const link = document.createElement('a');
        link.download = 'my-artwork.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      }
      
      // Event listeners
      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseout', stopDrawing);
      
      // Touch support
      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        startDrawing(e);
      });
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        draw(e);
      });
      canvas.addEventListener('touchend', stopDrawing);
      
      clearBtn.addEventListener('click', clearCanvas);
      downloadBtn.addEventListener('click', downloadCanvas);
      
      // Color buttons
      colorBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const selectedColor = btn.getAttribute('data-color');
          if (selectedColor === 'rainbow') {
            colorPicker.value = '#ffffff';
            colorPicker.setAttribute('data-rainbow', 'true');
          } else {
            colorPicker.value = selectedColor;
            colorPicker.removeAttribute('data-rainbow');
          }
        });
      });
    });
  </script>
</body>
</html>
