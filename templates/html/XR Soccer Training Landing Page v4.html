<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIAN – XR Soccer Training</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script></head>

<body class="font-sans antialiased bg-black text-white selection:bg-green-600 selection:text-black vsc-initialized" style="font-family:'Inter',sans-serif;"><div class="spline-container fixed top-0 w-full h-screen -z-10"><iframe src="https://my.spline.design/chips-Lpmy2Q4HrMAxwGztMvtaZdY0" frameborder="0" width="100%" height="100%"></iframe></div>
  <!-- HERO -->
  <section class="relative h-screen w-full flex items-center">
    <!-- Background -->
    <img src="https://images.unsplash.com/photo-1546717003-caee5f93a9db?w=800&amp;q=80" alt="Aerial view of a soccer field at sunset" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-gradient-to-l from-black/70 via-black/40 to-transparent"></div>

    <!-- Copy -->
    <div class="relative z-10 max-w-6xl mx-auto px-6 md:px-12">
      <h1 data-animate="" class="text-6xl md:text-8xl font-semibold uppercase mb-4 opacity-0 translate-y-4 transition-all duration-700 delay-100" style="letter-spacing:.15em;">GAIAN</h1>
      <p data-animate="" class="md:text-2xl opacity-0 transition-all duration-700 delay-200 text-xl font-medium text-slate-50 tracking-tight translate-y-4">Powered by YUR®</p>
    </div>
  </section>

  <!-- STRATEGIC PARTNERS + TRACTION -->
  <section class="relative md:py-24 overflow-hidden bg-zinc-900 pt-16 pb-16">
    <!-- Overlay Call-out -->
    

    <!-- Columns -->
    <div class="max-w-6xl grid grid-cols-1 md:grid-cols-3 gap-12 md:px-12 mr-auto ml-auto pr-6 pl-6">
      <!-- YUR Partnership -->
      <div data-animate="" class="group hover:border-green-500 hover:shadow-lg transition-all duration-300 opacity-0 bg-white/5 border-white/10 border rounded-xl pt-6 pr-6 pb-6 pl-6 backdrop-blur-md translate-y-4">
        <div class="flex mb-4 items-center justify-center">
          <i data-lucide="handshake" class="w-6 h-6 text-green-400 stroke-[1.5]"></i>
          <h4 class="text-lg font-medium tracking-tight text-left">About YUR®</h4>
        </div>
        <ul class="text-sm text-white/80 space-y-1">
          <li class="text-center">Responsible for building the XR soccer demo with PORTAL insoles</li>
          
          <li class="text-xs text-center">Launch partner for Quest 3 &amp; Vision Pro</li>
          
        </ul>
      </div>

      <!-- Hardware Lab -->
      

      <!-- Apple Vision Pro -->
      <div data-animate="" class="group hover:border-green-500 hover:shadow-lg transition-all duration-300 opacity-0 bg-white/5 border-white/10 border rounded-xl pt-6 pr-6 pb-6 pl-6 backdrop-blur-md translate-y-4">
        <div class="flex items-center space-x-3 mb-4">
          <i data-lucide="apple" class="w-6 h-6 text-green-400 stroke-[1.5]"></i>
          <h4 class="text-lg font-medium tracking-tight">Apple Vision Pro Integration</h4>
        </div>
        <ul class="text-sm text-white/80 text-center space-y-1">
          <li class="text-center">Wireless peripheral support for AVP</li>
          <li class="text-center">Native motion tracking &amp; haptics</li>
        </ul>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.remove('opacity-0', 'translate-y-4', 'translate-x-8');
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('[data-animate]').forEach(el => observer.observe(el));
    });
  </script>

</body></html>
