  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Progress Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes growUp {
      from { height: 0; }
      to { height: var(--final-height); }
    }
    @keyframes drawLine {
      from { stroke-dashoffset: 300; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.5s ease-out forwards;
      opacity: 0;
    }
    .animate-grow-up {
      animation: growUp 0.8s ease-out forwards;
    }
    .animate-draw-line {
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
      animation: drawLine 1.5s ease-out forwards;
    }
    .animate-pop-in {
      animation: popIn 0.5s ease-out forwards;
      transform-origin: center;
      opacity: 0;
    }
    .gradient-button {
      background: linear-gradient(135deg, #8B5CF6 0%, #3B82F6 100%);
      transition: all 0.3s ease;
    }
    .gradient-button:hover {
      background: linear-gradient(135deg, #7C3AED 0%, #2563EB 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
    }
  </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-sm bg-gray-800/90 backdrop-blur-lg rounded-2xl border border-gray-700/40 shadow-lg p-4">
    <!-- Header title -->
    <div class="flex items-center justify-between mb-6 animate-fade-in" style="animation-delay: 0.1s;">
      <h2 class="text-xl font-bold -tracking-tight text-gray-100">Course Progress</h2>
    </div>

    <!-- Chart -->
    <div class="relative h-[150px] mb-6">
      <!-- Y Axis Labels -->
      <div class="absolute left-0 top-0 h-full flex flex-col justify-between text-xs font-bold text-gray-400">
        <span class="animate-fade-in" style="animation-delay: 0.3s;">100%</span>
        <span class="animate-fade-in" style="animation-delay: 0.4s;">50%</span>
        <span class="animate-fade-in" style="animation-delay: 0.5s;">0%</span>
      </div>

      <!-- Grid Lines -->
      <div class="absolute left-[55px] right-0 top-[6px] h-[126px] flex flex-col justify-between">

      </div>

      <!-- Chart Content -->
      <div class="absolute left-[55px] right-0 top-[6px] h-[126px]">
        <!-- Bar Chart -->
        <div class="absolute inset-0 flex items-end justify-between">
          <div class="w-3 bg-gray-600 rounded-sm animate-grow-up" style="--final-height: 63px; animation-delay: 1.0s;"></div>
          <div class="w-3 bg-gray-600 rounded-sm animate-grow-up" style="--final-height: 87px; animation-delay: 1.1s;"></div>
          <div class="w-3 bg-gray-600 rounded-sm animate-grow-up" style="--final-height: 51px; animation-delay: 1.2s;"></div>
          <div class="w-3 bg-gray-600 rounded-sm animate-grow-up" style="--final-height: 74px; animation-delay: 1.3s;"></div>
          <div class="w-3 bg-gray-600 rounded-sm animate-grow-up" style="--final-height: 45px; animation-delay: 1.4s;"></div>
          <div class="w-3 bg-gray-600 rounded-sm animate-grow-up" style="--final-height: 69px; animation-delay: 1.5s;"></div>
          <div class="w-3 bg-purple-500 rounded-sm animate-grow-up" style="--final-height: 87px; animation-delay: 1.6s;"></div>
          <div class="w-3 bg-gray-600 rounded-sm animate-grow-up" style="--final-height: 57px; animation-delay: 1.7s;"></div>
          <div class="w-3 bg-gray-600 rounded-sm animate-grow-up" style="--final-height: 74px; animation-delay: 1.8s;"></div>
          <div class="w-3 bg-gray-600 rounded-sm animate-grow-up" style="--final-height: 45px; animation-delay: 1.9s;"></div>
        </div>

        <!-- Line Chart -->
        <svg class="absolute inset-0" viewBox="0 0 220 126" preserveAspectRatio="none">
          <path 
            d="M10,80 L40,55 L70,95 L100,80 L130,100 L160,82 L190,50 L220,65"

          <!-- Data Points -->
          <circle cx="10" cy="80" r="3" fill="#1E293B" stroke="#A855F7" class="animate-pop-in" style="animation-delay: 2.3s;"></circle>

          <circle cx="70" cy="95" r="3" fill="#1E293B" stroke="#A855F7" class="animate-pop-in" style="animation-delay: 2.5s;"></circle>
          <circle cx="100" cy="80" r="3" fill="#1E293B" stroke="#A855F7" class="animate-pop-in" style="animation-delay: 2.6s;"></circle>
          <circle cx="130" cy="100" r="3" fill="#1E293B" stroke="#A855F7" class="animate-pop-in" style="animation-delay: 2.7s;"></circle>
          <circle cx="160" cy="82" r="3" fill="#1E293B" stroke="#A855F7" class="animate-pop-in" style="animation-delay: 2.8s;"></circle>
          <circle cx="190" cy="50" r="3" fill="#1E293B" stroke="#A855F7" class="animate-pop-in" style="animation-delay: 2.9s;"></circle>
          <circle cx="220" cy="65" r="3" fill="#1E293B" stroke="#A855F7" class="animate-pop-in" style="animation-delay: 3.0s;"></circle>
        </svg>
      </div>

      <!-- Tooltip with Code Icon -->
      <div class="absolute top-0 right-[80px] bg-gray-700/90 backdrop-blur-lg border border-gray-600/40 rounded-lg shadow-lg p-1 flex items-center gap-1 animate-fade-in" style="animation-delay: 3.2s;">
        <div class="w-5 h-5 flex items-center justify-center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 8L3 12L7 16M17 8L21 12L17 16M14 4L10 20" stroke="#A855F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <p class="text-sm font-semibold text-gray-100">5 lessons</p>
          <p class="text-xs text-gray-300">CSS Animation Module</p>
        </div>
      </div>
    </div>

    <!-- Performance Indicator -->
    <div class="flex items-center gap-2 mb-6 animate-fade-in" style="animation-delay: 3.4s;">
      <span class="text-xl font-bold text-gray-100">75%</span>
      <p class="text-sm text-gray-300 leading-tight">
        You're completing lessons 75%

    <button class="w-full gradient-button text-white font-bold py-2.5 px-4 rounded-lg shadow-lg transition-all animate-fade-in" style="animation-delay: 3.6s;">
      Continue Learning
    </button>
