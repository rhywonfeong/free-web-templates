  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angle - Get Started</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>

<body class="bg-gray-50 text-gray-900">
  <header class="bg-white border-b border-gray-100">
    <div class="container mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="#" class="text-2xl font-bold text-indigo-600">angle</a>
        <div class="flex items-center space-x-4">
          <a href="#" class="text-sm font-medium text-gray-700 hover:text-indigo-600">Need help?</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-6 py-12 max-w-5xl">
    <div class="text-center mb-12">
      <h1 class="text-3xl font-bold mb-3">Welcome to Angle</h1>
      <p class="text-xl text-gray-600">Let's get you set up in just a few steps</p>
    </div>
    
    <!-- Progress Steps -->
    <div class="flex justify-between items-center mb-12 relative">
      <div class="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-1 bg-gray-200 z-0"></div>
      <div class="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-1 bg-indigo-600 z-0" style="width: 33%"></div>
      
      <div class="z-10 flex flex-col items-center">
        <div class="w-10 h-10 rounded-full bg-indigo-600 flex items-center justify-center text-white font-medium mb-2">1</div>
        <span class="text-sm font-medium text-indigo-600">Account</span>
      </div>
      
      <div class="z-10 flex flex-col items-center">
        <div class="w-10 h-10 rounded-full bg-white border-2 border-gray-200 flex items-center justify-center text-gray-400 font-medium mb-2">2</div>
        <span class="text-sm font-medium text-gray-400">Preferences</span>
      </div>
      
      <div class="z-10 flex flex-col items-center">
        <div class="w-10 h-10 rounded-full bg-white border-2 border-gray-200 flex items-center justify-center text-gray-400 font-medium mb-2">3</div>
        <span class="text-sm font-medium text-gray-400">Project</span>
      </div>
    </div>
    
    <!-- Form Card -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 mb-8">
      <h2 class="text-xl font-semibold mb-6">Create your account</h2>
      
      <form class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First name</label>
            <input type="text" id="firstName" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none">
          </div>
          
          <div>
            <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last name</label>
            <input type="text" id="lastName" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none">
          </div>
        </div>
        
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Work email</label>
          <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none">
        </div>
        
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <div class="relative">
            <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none">
            <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="mt-2 flex items-center gap-2">
            <div class="h-1 w-1/4 bg-red-400 rounded"></div>
            <div class="h-1 w-1/4 bg-gray-200 rounded"></div>
            <div class="h-1 w-1/4 bg-gray-200 rounded"></div>
            <div class="h-1 w-1/4 bg-gray-200 rounded"></div>
            <span class="text-xs text-gray-500 ml-2">Weak</span>
          </div>
        </div>
        
        <div>
          <label for="company" class="block text-sm font-medium text-gray-700 mb-1">Company name</label>
          <input type="text" id="company" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none">
        </div>
        
        <div>
          <label for="size" class="block text-sm font-medium text-gray-700 mb-1">Company size</label>
          <select id="size" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none">
            <option value="">Select an option</option>
            <option value="1-10">1-10 employees</option>
            <option value="11-50">11-50 employees</option>
            <option value="51-200">51-200 employees</option>
            <option value="201-500">201-500 employees</option>
            <option value="501+">501+ employees</option>
          </select>
        </div>
      </form>
    </div>
    
    <div class="flex items-center justify-between">
      <a href="#" class="text-indigo-600 font-medium hover:text-indigo-700">
        <i class="fas fa-arrow-left mr-2"></i> Back
      </a>
      <button class="px-6 py-3 bg-indigo-600 text-white rounded-md font-medium hover:bg-indigo-700">
        Continue <i class="fas fa-arrow-right ml-2"></i>
      </button>
    </div>
  </main>
  
  <footer class="mt-auto py-6">
    <div class="container mx-auto px-6">
      <div class="flex flex-col md:flex-row justify-between items-center">
        <p class="text-sm text-gray-500">© 2023 Angle. All rights reserved.</p>
        <div class="flex space-x-6 mt-4 md:mt-0">
          <a href="#" class="text-sm text-gray-500 hover:text-indigo-600">Terms</a>
          <a href="#" class="text-sm text-gray-500 hover:text-indigo-600">Privacy</a>
          <a href="#" class="text-sm text-gray-500 hover:text-indigo-600">Contact</a>
        </div>
      </div>
    </div>
  </footer>
</body>
</html>
