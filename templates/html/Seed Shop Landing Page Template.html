<meta charset="utf-8" />

<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes crazyGlow {
0% {
transform: scale(1) rotate(0deg);
box-shadow: 0 0 20px rgba(34, 197, 94, 0.8), 0 0 40px rgba(34, 197, 94, 0.6), 0 0 60px rgba(34, 197, 94, 0.4);
filter: brightness(1) hue-rotate(0deg);
border-color: rgb(34, 197, 94);
}
10% {
transform: scale(1.08) rotate(-3deg);
box-shadow: 0 0 50px rgba(251, 191, 36, 1), 0 0 100px rgba(251, 191, 36, 0.8), 0 0 150px rgba(251, 191, 36, 0.6);
filter: brightness(1.8) hue-rotate(45deg);
border-color: rgb(251, 191, 36);
}
20% {
transform: scale(0.98) rotate(3deg);
box-shadow: 0 0 50px rgba(249, 115, 22, 1), 0 0 100px rgba(249, 115, 22, 0.8), 0 0 150px rgba(249, 115, 22, 0.6);
filter: brightness(1.6) hue-rotate(90deg);
border-color: rgb(249, 115, 22);
}
30% {
transform: scale(1.1) rotate(-5deg);
box-shadow: 0 0 60px rgba(236, 72, 153, 1), 0 0 120px rgba(236, 72, 153, 0.8), 0 0 180px rgba(236, 72, 153, 0.6);
filter: brightness(2) hue-rotate(135deg);
border-color: rgb(236, 72, 153);
}
40% {
transform: scale(0.95) rotate(5deg);
box-shadow: 0 0 60px rgba(147, 51, 234, 1), 0 0 120px rgba(147, 51, 234, 0.8), 0 0 180px rgba(147, 51, 234, 0.6);
filter: brightness(1.7) hue-rotate(180deg);
border-color: rgb(147, 51, 234);
}
50% {
transform: scale(1.12) rotate(-6deg);
box-shadow: 0 0 70px rgba(59, 130, 246, 1), 0 0 140px rgba(59, 130, 246, 0.8), 0 0 210px rgba(59, 130, 246, 0.6);
filter: brightness(2.2) hue-rotate(225deg);
border-color: rgb(59, 130, 246);
}
60% {
transform: scale(0.97) rotate(6deg);
box-shadow: 0 0 60px rgba(14, 165, 233, 1), 0 0 120px rgba(14, 165, 233, 0.8), 0 0 180px rgba(14, 165, 233, 0.6);
filter: brightness(1.9) hue-rotate(270deg);
border-color: rgb(14, 165, 233);
}
70% {
transform: scale(1.09) rotate(-4deg);
box-shadow: 0 0 50px rgba(34, 197, 94, 1), 0 0 100px rgba(34, 197, 94, 0.8), 0 0 150px rgba(34, 197, 94, 0.6);
filter: brightness(2) hue-rotate(315deg);
border-color: rgb(34, 197, 94);
}
80% {
transform: scale(0.96) rotate(4deg);
box-shadow: 0 0 50px rgba(251, 191, 36, 1), 0 0 100px rgba(251, 191, 36, 0.8), 0 0 150px rgba(251, 191, 36, 0.6);
filter: brightness(1.8) hue-rotate(360deg);
border-color: rgb(251, 191, 36);
}
90% {
transform: scale(1.05) rotate(-2deg);
box-shadow: 0 0 40px rgba(249, 115, 22, 0.9), 0 0 80px rgba(249, 115, 22, 0.7), 0 0 120px rgba(249, 115, 22, 0.5);
filter: brightness(1.5) hue-rotate(0deg);
border-color: rgb(249, 115, 22);
}
100% {
transform: scale(1) rotate(0deg);
box-shadow: none;
filter: brightness(1) hue-rotate(0deg);
}
}
@keyframes emojiDance {
0%, 100% {
transform: translateY(0) scale(1) rotate(0deg);
}
10% {
transform: translateY(-40px) scale(2) rotate(30deg);
}
20% {
transform: translateY(15px) scale(1.7) rotate(-30deg);
}
30% {
transform: translateY(-35px) scale(2.2) rotate(45deg);
}
40% {
transform: translateY(10px) scale(1.8) rotate(-45deg);
}
50% {
transform: translateY(-50px) scale(2.5) rotate(60deg);
}
60% {
transform: translateY(5px) scale(2) rotate(-60deg);
}
70% {
transform: translateY(-30px) scale(2.1) rotate(35deg);
}
80% {
transform: translateY(12px) scale(1.6) rotate(-35deg);
}
90% {
transform: translateY(-20px) scale(1.5) rotate(20deg);
}
}
.crazy-glow-effect {
animation: crazyGlow 1.5s ease-in-out;
position: relative;
z-index: 20;
}
.emoji-dance {
animation: emojiDance 1.5s ease-in-out;
display: inline-block;
position: relative;
z-index: 30;
}
</style></head>
<body class="min-h-screen bg-green-800 antialiased" style="font-family: 'Comic Neue', cursive; font-weight: 700;">
  <!-- Header -->
  <header class="bg-green-900 border-b-4 border-green-950 p-4 flex items-center justify-between">
    <button class="bg-amber-700 border-4 border-amber-900 px-4 py-2 hover:bg-amber-600">
      <i data-lucide="menu" class="size-6 text-amber-100"></i>
    </button>

    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-amber-600 border-4 border-amber-900 px-5 py-2">
        <i data-lucide="coins" class="size-7 text-amber-100"></i>
        <span id="coins" class="text-2xl text-amber-100">1,234</span>
      </div>
      <button class="bg-green-600 border-4 border-green-950 px-4 py-2 hover:bg-green-500">
        <i data-lucide="plus" class="size-6 text-green-100"></i>
      </button>
    </div>
  </header>

  <!-- Main Shop -->
  <main class="mx-auto w-full max-w-4xl px-4 py-6">
    <div class="bg-green-700 border-4 border-green-950">
      <!-- Shop header -->
      <div class="bg-green-600 border-b-4 border-green-950 px-6 py-6">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-4">
            <div class="bg-green-800 border-4 border-green-950 p-3">
              <i data-lucide="sprout" class="size-10 text-green-100"></i>
            </div>
            <div>
              <h1 class="text-4xl text-green-50">SEED SHOP</h1>
              <p class="text-green-100 text-lg mt-1">Choose your seeds wisely!</p>
            </div>
          </div>
          <button id="closeShop" class="bg-red-700 hover:bg-red-600 border-4 border-red-950 text-red-50 p-3">
            <i data-lucide="x" class="size-7"></i>
          </button>
        </div>

        <!-- Restock timer -->
        <div class="mt-4 flex items-center justify-center gap-3 bg-green-800 border-4 border-green-950 px-5 py-3">
          <i data-lucide="clock" class="size-6 text-green-100"></i>
          <span class="text-green-100 text-xl">NEXT RESTOCK: <span id="timer">14:52</span></span>
          <button id="restock" class="ml-2 bg-amber-600 hover:bg-amber-500 border-4 border-amber-900 text-amber-50 px-4 py-2">
            <i data-lucide="refresh-cw" class="inline size-5 -mt-0.5"></i> RESTOCK
          </button>
        </div>
      </div>

      <!-- Tabs -->
      <div class="flex items-center gap-2 px-6 py-4 bg-green-700 border-b-4 border-green-950">
        <button class="flex-1 bg-green-600 border-4 border-green-950 text-green-50 px-6 py-3 text-lg hover:bg-green-500">
          <i data-lucide="leaf" class="inline size-5 -mt-0.5 mr-1"></i> ALL SEEDS
        </button>
        <button class="flex-1 bg-green-800 border-4 border-green-950 text-green-100 px-6 py-3 text-lg hover:bg-green-700">
          <i data-lucide="sparkles" class="inline size-5 -mt-0.5 mr-1"></i> SPECIAL
        </button>
        <button class="flex-1 bg-green-800 border-4 border-green-950 text-green-100 px-6 py-3 text-lg hover:bg-green-700">
          <i data-lucide="heart" class="inline size-5 -mt-0.5 mr-1"></i> FAVORITES
        </button>
      </div>

      <!-- Search bar -->
      <div class="px-6 py-4 bg-green-700">
        <div class="flex items-center gap-3 bg-green-800 border-4 border-green-950 px-5 py-3">
          <i data-lucide="search" class="size-6 text-green-300"></i>
          <input id="search" type="text" placeholder="SEARCH FOR SEEDS..." class="flex-1 bg-transparent text-green-50 placeholder-green-300 focus:outline-none text-lg">
        </div>
      </div>

      <!-- Seeds List -->
      <div id="list" class="p-6 space-y-3 max-h-[60vh] overflow-y-auto bg-green-700">
        <!-- Items injected here -->
      </div>
    </div>
  </main>

  <!-- Toast notifications -->
  <div id="toasts" class="pointer-events-none fixed top-20 right-4 z-50 space-y-3"></div>

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    const el = {
      list: document.getElementById('list'),
      coins: document.getElementById('coins'),
      timer: document.getElementById('timer'),
      restock: document.getElementById('restock'),
      closeShop: document.getElementById('closeShop'),
      search: document.getElementById('search'),
      toasts: document.getElementById('toasts'),
    };

    const rarityColors = {
      "Common": { bg: "bg-stone-600", border: "border-stone-900", text: "text-stone-100" },
      "Uncommon": { bg: "bg-green-700", border: "border-green-950", text: "text-green-100" },
      "Rare": { bg: "bg-blue-700", border: "border-blue-950", text: "text-blue-100" },
      "Epic": { bg: "bg-purple-700", border: "border-purple-950", text: "text-purple-100" },
      "Legendary": { bg: "bg-amber-600", border: "border-amber-950", text: "text-amber-100" },
    };

    const baseSeeds = [
      { id: "tomato", name: "TOMATO", emoji: "🍅", price: 25, rarity: "Common", growTime: "2m" },
      { id: "carrot", name: "CARROT", emoji: "🥕", price: 30, rarity: "Common", growTime: "3m" },
      { id: "corn", name: "CORN", emoji: "🌽", price: 50, rarity: "Uncommon", growTime: "5m" },
      { id: "strawberry", name: "STRAWBERRY", emoji: "🍓", price: 75, rarity: "Uncommon", growTime: "6m" },
      { id: "pumpkin", name: "PUMPKIN", emoji: "🎃", price: 150, rarity: "Rare", growTime: "10m" },
      { id: "watermelon", name: "WATERMELON", emoji: "🍉", price: 200, rarity: "Rare", growTime: "12m" },
      { id: "eggplant", name: "EGGPLANT", emoji: "🍆", price: 350, rarity: "Epic", growTime: "18m" },
      { id: "sunflower", name: "SUNFLOWER", emoji: "🌻", price: 500, rarity: "Epic", growTime: "25m" },
      { id: "rainbow", name: "RAINBOW PLANT", emoji: "🌈", price: 1500, rarity: "Legendary", growTime: "45m" },
    ];

    let seeds = [];
    let user = { coins: 1234 };
    let ui = { q: "" };

    function formatCoins(v) {
      return v.toLocaleString();
    }

    function restockSeeds() {
      seeds = baseSeeds.map(s => {
        const stock = Math.floor(Math.random() * 15) + 5;
        return { ...s, stock };
      });
    }

    function render() {
      let items = seeds.filter(s => s.name.toLowerCase().includes(ui.q));

      el.list.innerHTML = items.map(s => {
        const colors = rarityColors[s.rarity];
        return `
          <div id="seed-${s.id}" class="flex items-center gap-4 ${colors.bg} border-4 ${colors.border} p-4 hover:opacity-90 transition-all">
            <div class="text-5xl flex-shrink-0"><span id="emoji-${s.id}">${s.emoji}</span></div>
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-2">
                <h3 class="text-2xl ${colors.text}">${s.name}</h3>
                <div class="bg-amber-800 border-2 ${colors.border} ${colors.text} px-3 py-1 text-xs">
                  ${s.rarity.toUpperCase()}
                </div>
              </div>
              <div class="flex items-center gap-4 text-sm ${colors.text}">
                <div class="flex items-center gap-1">
                  <i data-lucide="clock" class="size-4"></i>
                  <span>${s.growTime}</span>
                </div>
                <div class="flex items-center gap-1">
                  <i data-lucide="package" class="size-4"></i>
                  <span>${s.stock} LEFT</span>
                </div>
              </div>
            </div>
            <div class="flex items-center gap-3 flex-shrink-0">
              <div class="flex items-center gap-2 bg-amber-700 border-4 border-amber-950 px-4 py-2">
                <i data-lucide="coins" class="size-5 text-amber-100"></i>
                <span class="text-xl text-amber-100">${formatCoins(s.price)}</span>
              </div>
              <button data-id="${s.id}" class="buy bg-green-600 hover:bg-green-500 border-4 border-green-950 text-green-50 px-6 py-2 disabled:bg-stone-600 disabled:border-stone-900" ${s.stock <= 0 ? 'disabled' : ''}>
                <i data-lucide="shopping-cart" class="inline size-5 -mt-0.5"></i> BUY
              </button>
            </div>
          </div>
        `;
      }).join("");

      el.coins.textContent = formatCoins(user.coins);

      document.querySelectorAll('button.buy').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const seed = seeds.find(s => s.id === id);
          if (!seed) return;

          if (seed.stock <= 0) return toast("OUT OF STOCK!", "alert-triangle", "bg-red-700 border-red-950");
          if (user.coins < seed.price) return toast("NOT ENOUGH COINS!", "circle-slash", "bg-red-700 border-red-950");

          user.coins -= seed.price;
          seed.stock -= 1;

          // Add crazy glow effect to the seed card
          const seedCard = document.getElementById(`seed-${id}`);
          const emojiEl = document.getElementById(`emoji-${id}`);
          
          if (seedCard) {
            // Remove class if already present
            seedCard.classList.remove('crazy-glow-effect');
            // Force reflow
            void seedCard.offsetWidth;
            // Add class
            seedCard.classList.add('crazy-glow-effect');
            setTimeout(() => {
              seedCard.classList.remove('crazy-glow-effect');
            }, 1500);
          }

          if (emojiEl) {
            // Remove class if already present
            emojiEl.classList.remove('emoji-dance');
            // Force reflow
            void emojiEl.offsetWidth;
            // Add class
            emojiEl.classList.add('emoji-dance');
            setTimeout(() => {
              emojiEl.classList.remove('emoji-dance');
            }, 1500);
          }

          toast(`BOUGHT ${seed.name}! ${seed.emoji}`, "check-circle-2", "bg-green-600 border-green-950");
          
          // Delay render to allow animation to play
          setTimeout(() => render(), 1500);
        });
      });

      if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
    }

    function toast(msg, icon = "bell", colors = "bg-stone-700 border-stone-950") {
      const id = 't' + Math.random().toString(36).slice(2);
      const node = document.createElement('div');
      node.id = id;
      node.className = `pointer-events-auto flex items-center gap-3 ${colors} border-4 text-white px-5 py-3 text-lg`;
      node.innerHTML = `<i data-lucide="${icon}" class="size-6"></i><span>${msg}</span>`;
      el.toasts.appendChild(node);
      if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
      setTimeout(() => {
        node.style.transition = 'all 0.3s';
        node.style.opacity = '0';
        node.style.transform = 'translateX(100px)';
        setTimeout(() => node.remove(), 300);
      }, 2500);
    }

    let remaining = 892;

    function updateTimer() {
      const m = String(Math.floor(remaining / 60)).padStart(2, '0');
      const s = String(remaining % 60).padStart(2, '0');
      el.timer.textContent = `${m}:${s}`;
      remaining = Math.max(0, remaining - 1);
      if (remaining === 0) {
        toast("NEW SEEDS AVAILABLE!", "sprout", "bg-green-600 border-green-950");
        restockSeeds();
        render();
        remaining = 900;
      }
    }

    setInterval(updateTimer, 1000);

    el.restock.addEventListener('click', () => {
      restockSeeds();
      render();
      remaining = 900;
      toast("SHOP RESTOCKED!", "refresh-cw", "bg-green-600 border-green-950");
    });

    el.closeShop.addEventListener('click', () => {
      toast("THANKS FOR SHOPPING!", "heart", "bg-amber-600 border-amber-950");
    });

    el.search.addEventListener('input', (e) => {
      ui.q = e.target.value.trim().toLowerCase();
      render();
    });

    restockSeeds();
    render();
    updateTimer();

    if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
  </script>
</body>
