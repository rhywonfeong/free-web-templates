<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>路桥工程建管平台 - 登录</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {

<body class="h-screen w-full flex overflow-hidden bg-white text-slate-600">

    <!-- Left Section: Realistic Suspension Bridge Background -->
    <!-- Note: This section is hidden on mobile (w < 1024px) via 'hidden lg:flex' -->
    <div class="relative hidden lg:flex lg:w-7/12 bg-slate-800 flex-col justify-between overflow-hidden group">
        
        <!-- Background Image: High Contrast Bridge Construction -->
        <div class="absolute inset-0 z-0">
            <img 
                src="https://images.unsplash.com/photo-1545558014-8692077e9b5c?q=80&w=2500&auto=format&fit=crop" 
                alt="Bridge Construction" 
                class="w-full h-full object-cover object-center transition-transform duration-[20s] ease-in-out group-hover:scale-105"
            >
        </div>

        <!-- Gradient Overlays - Adjusted for better visibility -->
        <!-- Blue tint -->
        <div class="absolute inset-0 z-10 bg-blue-900/30 mix-blend-multiply"></div>
        <!-- Gradient from bottom for text readability -->
        <div class="absolute inset-0 z-10 bg-gradient-to-t from-slate-900/90 via-slate-900/40 to-transparent"></div>

        <!-- Content Overlay -->
        <div class="relative z-20 p-12 flex flex-col h-full justify-between">
            <div class="flex items-center gap-2">
                <div class="h-8 w-8 bg-white/10 backdrop-blur-md border border-white/20 rounded-md flex items-center justify-center text-white font-bold text-sm tracking-tighter">
                    RB
                </div>
                <span class="text-white font-semibold tracking-tight text-sm text-shadow-sm">R&B ENGINEERING</span>
            </div>
            
            <div class="max-w-md">
                <div class="mb-6 inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-blue-500/20 border border-blue-400/20 backdrop-blur-sm">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                    </span>
                    <span class="text-[10px] font-medium text-blue-100 uppercase tracking-wide">System Online</span>
                </div>
                <h1 class="text-4xl font-semibold text-white tracking-tight mb-4 drop-shadow-lg">
                    智慧建管 <br> 
                    <span class="text-blue-200">连接未来</span>
                </h1>
                <p class="text-slate-200 text-sm leading-relaxed font-medium drop-shadow-md">
                    全生命周期工程管理解决方案，赋能跨海大桥建设，提升工程质量与安全管理效率。
                </p>
            </div>
            
            <div class="flex items-center justify-between border-t border-white/10 pt-6">
                <div class="text-xs text-slate-300 font-medium">
                    © 2024 路桥建设集团. All Rights Reserved.
                </div>
                <!-- Location Label -->
                <div class="flex items-center gap-1.5 px-3 py-1 bg-black/30 backdrop-blur-md rounded-full border border-white/10 text-[10px] text-slate-200">
                    <iconify-icon icon="lucide:map-pin" width="10" height="10"></iconify-icon>
                    <span>跨海大桥施工现场 - 标段 A2</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Right Section: Login Form -->
    <div class="w-full lg:w-5/12 flex items-center justify-center bg-white relative">
        <div class="w-full max-w-sm px-8">
            
            <!-- Mobile Logo (Visible only on small screens) -->
            <div class="lg:hidden flex items-center gap-2 mb-8">
                <div class="h-8 w-8 bg-slate-900 rounded-md flex items-center justify-center text-white font-bold text-sm">RB</div>
                <span class="font-semibold text-slate-900 tracking-tight">R&B ENGINEERING</span>
            </div>

            <div class="mb-10">
                <h2 class="text-2xl font-semibold text-slate-900 tracking-tight mb-2">欢迎回来</h2>
                <p class="text-sm text-slate-500">请输入您的账号和密码以进入建管平台</p>
            </div>

            <form action="#" method="POST" class="space-y-5">
                <!-- Username Input -->
                <div class="group">
                    <label for="username" class="block text-xs font-medium text-slate-700 mb-1.5">账号 / 工号</label>
                    <div class="relative">
                        <input 
                            type="text" 
                            id="username" 
                            class="peer w-full bg-slate-50 text-sm text-slate-900 border border-slate-200 rounded-lg px-3 py-2.5 pl-10 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all duration-200"
                            placeholder="user@example.com"
                        >
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 peer-focus:text-blue-500 transition-colors">
                            <iconify-icon icon="lucide:user" width="16" height="16" stroke-width="1.5"></iconify-icon>
                        </div>
                    </div>
                </div>

                <!-- Password Input -->
                <div class="group">
                    <div class="flex items-center justify-between mb-1.5">
                        <label for="password" class="block text-xs font-medium text-slate-700">密码</label>
                    </div>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            class="peer w-full bg-slate-50 text-sm text-slate-900 border border-slate-200 rounded-lg px-3 py-2.5 pl-10 placeholder-slate-400 outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all duration-200"
                            placeholder="••••••••"
                        >
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 peer-focus:text-blue-500 transition-colors">
                            <iconify-icon icon="lucide:lock" width="16" height="16" stroke-width="1.5"></iconify-icon>
                        </div>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center space-x-2 cursor-pointer group">
                        <div class="relative flex items-center">
                            <input type="checkbox" class="peer appearance-none h-4 w-4 border border-slate-300 rounded bg-white checked:bg-slate-900 checked:border-slate-900 transition-colors focus:ring-2 focus:ring-offset-1 focus:ring-slate-500/20" />
                            <iconify-icon icon="lucide:check" class="absolute left-0.5 top-0.5 text-white opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" width="12" height="12" stroke-width="3"></iconify-icon>
                        </div>
                        <span class="text-xs text-slate-600 font-medium group-hover:text-slate-800 transition-colors">记住我</span>
                    </label>
                    
                    <a href="#" class="text-xs font-medium text-blue-600 hover:text-blue-700 hover:underline transition-all">忘记密码?</a>
                </div>

                <!-- Submit Button -->
                <button type="button" class="w-full bg-slate-900 hover:bg-slate-800 text-white text-sm font-medium py-2.5 rounded-lg shadow-sm hover:shadow-md transition-all duration-200 flex items-center justify-center gap-2 active:scale-[0.98]">
                    <span>立即登录</span>
                    <iconify-icon icon="lucide:arrow-right" width="16" height="16" stroke-width="1.5"></iconify-icon>
                </button>

                <!-- Divider -->
                <div class="relative py-2">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-slate-100"></div>
                    </div>
                    <div class="relative flex justify-center text-xs">
                        <span class="px-2 bg-white text-slate-400">其他登录方式</span>
                    </div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" class="flex items-center justify-center gap-2 px-4 py-2 border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-all duration-200 text-xs font-medium group">
                        <iconify-icon icon="ri:wechat-fill" class="text-slate-400 group-hover:text-[#07C160] transition-colors" width="18" height="18"></iconify-icon>
                        <span>微信登录</span>
                    </button>
                    <button type="button" class="flex items-center justify-center gap-2 px-4 py-2 border border-slate-200 rounded-lg text-slate-600 hover:bg-slate-50 hover:border-slate-300 transition-all duration-200 text-xs font-medium group">
                        <iconify-icon icon="ri:dingding-fill" class="text-slate-400 group-hover:text-[#0089FF] transition-colors" width="18" height="18"></iconify-icon>
                        <span>钉钉登录</span>
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center">
                <p class="text-xs text-slate-400">
                    还未注册? <a href="#" class="text-slate-700 font-medium hover:underline">联系管理员</a>
                </p>
            </div>
        </div>

        <!-- Footer for form side -->
        <div class="absolute bottom-6 w-full text-center px-8">
            <p class="text-[10px] text-slate-300 font-medium tracking-tight">
                SECURE PLATFORM V2.4.0
            </p>
        </div>
    </div>
