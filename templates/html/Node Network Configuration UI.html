    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Node Configuration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="relative w-[600px] h-[600px]">
        <!-- Center Node -->
        <div class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-20 h-20 rounded-full bg-blue-500 flex items-center justify-center shadow-lg shadow-blue-500/50 z-10 border-4 border-blue-300">
            <span class="text-white font-bold">Hub</span>
        </div>
        
        <!-- Outer Nodes -->
        <!-- Node 1 (Top) -->
        <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-16 h-16 rounded-full bg-purple-500 flex items-center justify-center shadow-lg shadow-purple-500/50 z-10 border-2 border-purple-300">
            <span class="text-white font-bold">1</span>
        </div>
        
        <!-- Node 2 (Top Right) -->
        <div class="absolute top-[75px] right-[75px] w-16 h-16 rounded-full bg-pink-500 flex items-center justify-center shadow-lg shadow-pink-500/50 z-10 border-2 border-pink-300">
            <span class="text-white font-bold">2</span>
        </div>
        
        <!-- Node 3 (Right) -->
        <div class="absolute top-1/2 right-0 transform -translate-y-1/2 w-16 h-16 rounded-full bg-red-500 flex items-center justify-center shadow-lg shadow-red-500/50 z-10 border-2 border-red-300">
            <span class="text-white font-bold">3</span>
        </div>
        
        <!-- Node 4 (Bottom Right) -->
        <div class="absolute bottom-[75px] right-[75px] w-16 h-16 rounded-full bg-orange-500 flex items-center justify-center shadow-lg shadow-orange-500/50 z-10 border-2 border-orange-300">
            <span class="text-white font-bold">4</span>
        </div>
        
        <!-- Node 5 (Bottom) -->
        <div class="absolute bottom-0 left-1/2 transform -translate-x-1/2 w-16 h-16 rounded-full bg-yellow-500 flex items-center justify-center shadow-lg shadow-yellow-500/50 z-10 border-2 border-yellow-300">
            <span class="text-white font-bold">5</span>
        </div>
        
        <!-- Node 6 (Bottom Left) -->
        <div class="absolute bottom-[75px] left-[75px] w-16 h-16 rounded-full bg-green-500 flex items-center justify-center shadow-lg shadow-green-500/50 z-10 border-2 border-green-300">
            <span class="text-white font-bold">6</span>
        </div>
        
        <!-- Node 7 (Left) -->
        <div class="absolute top-1/2 left-0 transform -translate-y-1/2 w-16 h-16 rounded-full bg-teal-500 flex items-center justify-center shadow-lg shadow-teal-500/50 z-10 border-2 border-teal-300">
            <span class="text-white font-bold">7</span>
        </div>
        
        <!-- Node 8 (Top Left) -->
        <div class="absolute top-[75px] left-[75px] w-16 h-16 rounded-full bg-cyan-500 flex items-center justify-center shadow-lg shadow-cyan-500/50 z-10 border-2 border-cyan-300">
            <span class="text-white font-bold">8</span>
        </div>
        
        <!-- Connector Lines -->
        <svg class="absolute inset-0 w-full h-full" viewBox="0 0 600 600">
            <!-- Connecting lines from center to each node -->
            <line x1="300" y1="300" x2="300" y2="0" class="stroke-purple-400 stroke-2" />
            <line x1="300" y1="300" x2="525" y2="75" class="stroke-pink-400 stroke-2" />
            <line x1="300" y1="300" x2="600" y2="300" class="stroke-red-400 stroke-2" />
            <line x1="300" y1="300" x2="525" y2="525" class="stroke-orange-400 stroke-2" />
            <line x1="300" y1="300" x2="300" y2="600" class="stroke-yellow-400 stroke-2" />
            <line x1="300" y1="300" x2="75" y2="525" class="stroke-green-400 stroke-2" />
            <line x1="300" y1="300" x2="0" y2="300" class="stroke-teal-400 stroke-2" />
            <line x1="300" y1="300" x2="75" y2="75" class="stroke-cyan-400 stroke-2" />
            
            <!-- Outer connector ring -->
            <path d="M300,0 L525,75 L600,300 L525,525 L300,600 L75,525 L0,300 L75,75 Z" 
                  class="fill-none stroke-blue-300 stroke-2 opacity-30" />
                  
            <!-- Animated pulse ring -->
            <circle cx="300" cy="300" r="250" class="fill-none stroke-blue-400 stroke-1 opacity-50">
                <animate attributeName="r" from="150" to="280" dur="3s" repeatCount="indefinite" />
                <animate attributeName="opacity" from="0.7" to="0" dur="3s" repeatCount="indefinite" />
            </circle>
        </svg>
        
        <!-- Animated Connector Dots -->
        <svg class="absolute inset-0 w-full h-full" viewBox="0 0 600 600">
            <!-- Line 1 (Center to Top) -->
            <circle class="fill-purple-500">
                <animate attributeName="cx" values="300;300" dur="6s" repeatCount="indefinite" />
                <animate attributeName="cy" values="300;0" dur="6s" repeatCount="indefinite" />
                <animate attributeName="r" values="3;3" dur="6s" repeatCount="indefinite" />
            </circle>
            
            <!-- Line 2 (Center to Top Right) -->
            <circle class="fill-pink-500">
                <animate attributeName="cx" values="300;525" dur="6s" repeatCount="indefinite" />
                <animate attributeName="cy" values="300;75" dur="6s" repeatCount="indefinite" />
                <animate attributeName="r" values="3;3" dur="6s" repeatCount="indefinite" />
            </circle>
            
            <!-- Additional animated dots for other lines -->
            <circle class="fill-red-500">
                <animate attributeName="cx" values="300;600" dur="6s" repeatCount="indefinite" />
                <animate attributeName="cy" values="300;300" dur="6s" repeatCount="indefinite" />
                <animate attributeName="r" values="3;3" dur="6s" repeatCount="indefinite" />
            </circle>
            
            <circle class="fill-orange-500">
                <animate attributeName="cx" values="300;525" dur="6s" repeatCount="indefinite" />
                <animate attributeName="cy" values="300;525" dur="6s" repeatCount="indefinite" />
                <animate attributeName="r" values="3;3" dur="6s" repeatCount="indefinite" />
            </circle>
            
            <circle class="fill-yellow-500">
                <animate attributeName="cx" values="300;300" dur="6s" repeatCount="indefinite" />
                <animate attributeName="cy" values="300;600" dur="6s" repeatCount="indefinite" />
                <animate attributeName="r" values="3;3" dur="6s" repeatCount="indefinite" />
            </circle>
            
            <circle class="fill-green-500">
                <animate attributeName="cx" values="300;75" dur="6s" repeatCount="indefinite" />
                <animate attributeName="cy" values="300;525" dur="6s" repeatCount="indefinite" />
                <animate attributeName="r" values="3;3" dur="6s" repeatCount="indefinite" />
            </circle>
            
            <circle class="fill-teal-500">
                <animate attributeName="cx" values="300;0" dur="6s" repeatCount="indefinite" />
                <animate attributeName="cy" values="300;300" dur="6s" repeatCount="indefinite" />
                <animate attributeName="r" values="3;3" dur="6s" repeatCount="indefinite" />
            </circle>
            
            <circle class="fill-cyan-500">
                <animate attributeName="cx" values="300;75" dur="6s" repeatCount="indefinite" />
                <animate attributeName="cy" values="300;75" dur="6s" repeatCount="indefinite" />
                <animate attributeName="r" values="3;3" dur="6s" repeatCount="indefinite" />
            </circle>
        </svg>
    </div>
</body>
</html>
