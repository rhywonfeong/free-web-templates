    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smooth Rotating Lines Grid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .line {
        width: 18px;
        height: 1px;
        background: #fff;
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 9999px;
        pointer-events: none;
        transition: height 0.18s cubic-bezier(.4,0,.2,1), background 0.18s;
        will-change: transform;
      }
    </style>
  </head>
  <body class="bg-black min-h-screen w-full flex items-center justify-center overflow-hidden">
    <div id="lines" class="absolute left-1/2 top-1/2"></div>
    <script>
      const ROWS = 32, COLS = 32, GAP = 14;
      const root = document.getElementById('lines');
      const lines = [];
      for(let y = -ROWS/2; y < ROWS/2; y++) {
        for(let x = -COLS/2; x < COLS/2; x++) {
          const div = document.createElement('div');
          div.className = "line";
          div.style.transform = `translate(${x*GAP}px,${y*GAP}px) rotate(0deg)`;
          root.appendChild(div);
          lines.push({el: div, x, y});
        }
      }

      function animate() {
        const now = performance.now() * 0.001;
        for (const {el, x, y} of lines) {
          // Smooth trig-based wave, no jumps or resets
          const angle = Math.sin(now + x*0.18 + y*0.23) * 70;
          el.style.transform = `translate(${x*GAP}px,${y*GAP}px) rotate(${angle}deg)`;
        }
        requestAnimationFrame(animate);
      }
      animate();
    </script>
  </body>
