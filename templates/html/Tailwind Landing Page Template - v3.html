<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kids Music Player</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-200 via-yellow-100 to-blue-100 flex flex-col items-center justify-center">
  <header class="mb-8 text-center">
    <h1 class="text-4xl font-extrabold text-pink-600 drop-shadow-lg">🎶 Music Fun Zone 🎶</h1>
    <p class="text-xl text-blue-700 mt-2 font-medium">Sing, Play & Learn!</p>
  </header>
  <main class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md flex flex-col gap-8">
    <!-- Song Display -->
    <div class="flex flex-col items-center gap-4">
      <img src="https://images.unsplash.com/photo-1464983953574-0892a716854b?auto=format&fit=crop&w=300&q=80" alt="Album Art" class="w-32 h-32 rounded-full border-4 border-yellow-300 shadow-lg">
      <div class="text-center">
        <h2 class="text-2xl font-bold text-pink-700">Twinkle Twinkle Little Star</h2>
        <p class="text-lg text-blue-800">by <span class="font-medium">Kids Choir</span></p>
      </div>
    </div>
    <!-- Progress & Controls -->
    <div>
      <div class="flex items-center gap-2 mb-2">
        <span class="text-xs text-blue-500 font-mono">1:15</span>
        <div class="h-2 flex-1 bg-yellow-200 rounded-full overflow-hidden">
          <div class="h-full w-2/3 bg-pink-400"></div>
        </div>
        <span class="text-xs text-blue-500 font-mono">2:43</span>
      </div>
      <div class="flex justify-center items-center gap-6 mt-3">
        <button class="p-3 rounded-full bg-blue-200 hover:bg-blue-300 text-blue-600 text-2xl shadow">⏮️</button>
        <button class="p-4 rounded-full bg-pink-400 hover:bg-pink-500 text-white text-3xl shadow-lg">▶️</button>
        <button class="p-3 rounded-full bg-blue-200 hover:bg-blue-300 text-blue-600 text-2xl shadow">⏭️</button>
      </div>
    </div>
    <!-- Music Theory Tip -->
    <section class="mt-4 bg-yellow-100 border-l-4 border-yellow-400 rounded-lg p-4 flex items-center gap-4 animate-pulse">
      <span class="text-3xl">💡</span>
      <div>
        <h3 class="text-lg font-semibold text-yellow-700">Music Theory Tip!</h3>
        <p class="text-blue-800 text-sm">This song uses the C major scale. Can you sing along using Do, Re, Mi, Fa, So?</p>
      </div>
    </section>
    <!-- Playlist (for kids to choose songs) -->
    <div>
      <h4 class="text-pink-600 mt-2 mb-2 font-bold">Playlist:</h4>
      <ul class="flex gap-3 overflow-x-auto scrollbar-hide pb-2">
        <li>
          <button class="bg-yellow-200 rounded-xl px-4 py-2 font-semibold text-blue-800 shadow border-2 border-yellow-300 hover:bg-yellow-300 transition">ABC Song</button>
        </li>
        <li>
          <button class="bg-blue-200 rounded-xl px-4 py-2 font-semibold text-pink-700 shadow border-2 border-blue-300 hover:bg-blue-300 transition">Baa Baa Black Sheep</button>
        </li>
        <li>
          <button class="bg-pink-200 rounded-xl px-4 py-2 font-semibold text-blue-800 shadow border-2 border-pink-300 hover:bg-pink-300 transition">Old MacDonald</button>
        </li>
        <li>
          <button class="bg-green-200 rounded-xl px-4 py-2 font-semibold text-yellow-700 shadow border-2 border-green-300 hover:bg-green-300 transition">Mary Had a Little Lamb</button>
        </li>
      </ul>
    </div>
  </main>
  <footer class="mt-8 text-xs text-blue-400 text-center">
    © 2024 Music Fun Zone for Kids
  </footer>
</body>
</html>
