<meta charset="UTF-8">

<style>
/* Base styles */
body {
font-family: 'Inter', system-ui, -apple-system, sans-serif;
background-color: #020205;
}
/* Custom Keyframes for the dynamic background */
@keyframes drift {
0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
33% { transform: translate(30px, -50px) scale(1.1); opacity: 0.6; }
66% { transform: translate(-20px, 20px) scale(0.9); opacity: 0.4; }
100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
}
.animate-drift-slow { animation: drift 15s ease-in-out infinite; }
.animate-drift-fast { animation: drift 10s ease-in-out infinite reverse; }
/* Subtle grid background */
.bg-grid {
background-size: 50px 50px;
background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
}
/* Glass effect for nav button */
.glass-btn {
background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
}
.glass-btn:hover {
background: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.08) 100%);
}
/*
SHINY CTA BUTTON STYLES
Integrated from request
*/
@property --gradient-angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@property --gradient-angle-offset { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@property --gradient-percent { syntax: "<percentage>"; initial-value: 20%; inherits: false; }
@property --gradient-shine { syntax: "<color>"; initial-value: #8484ff; inherits: false; }
.shiny-cta {
--gradient-angle: 0deg;
--gradient-angle-offset: 0deg;
--gradient-percent: 20%;
--gradient-shine: #8484ff;
--shadow-size: 2px;
position: relative;
overflow: hidden;
border-radius: 9999px; /* Pill shape */
padding: 0.875rem 2rem; /* Adjusted to match input height (py-3.5 approx) */
font-size: 1rem;
line-height: 1.5;
font-weight: 600;
color: #ffffff;
background: linear-gradient(#000000, #000000) padding-box,
conic-gradient(from calc(var(--gradient-angle) - var(--gradient-angle-offset)),
transparent 0%, #1d4ed8 5%, var(--gradient-shine) 15%, #1d4ed8 30%, transparent 40%, transparent 100%) border-box;
border: 1px solid transparent;
box-shadow: inset 0 0 0 1px #1a1818;
outline: none;
transition: --gradient-angle-offset 800ms cubic-bezier(0.25, 1, 0.5, 1),
--gradient-percent 800ms cubic-bezier(0.25, 1, 0.5, 1),
--gradient-shine 800ms cubic-bezier(0.25, 1, 0.5, 1),
box-shadow 0.3s;
cursor: pointer;
isolation: isolate;
outline-offset: 4px;
font-family: inherit;
z-index: 0;
animation: border-spin 2.5s linear infinite;
}
@keyframes border-spin {
to { --gradient-angle: 360deg; }
}
.shiny-cta:active { transform: translateY(1px); }
.shiny-cta::before {
content: '';
pointer-events: none;
position: absolute;
left: 50%; top: 50%;
transform: translate(-50%, -50%);
z-index: 0;
--size: calc(100% - 6px);
--position: 2px;
--space: 4px;
width: var(--size); height: var(--size);
background: radial-gradient(circle at var(--position) var(--position), white 0.5px, transparent 0) padding-box;
background-size: var(--space) var(--space);
background-repeat: space;
mask-image: conic-gradient(from calc(var(--gradient-angle) + 45deg), black, transparent 10% 90%, black);
border-radius: inherit;
opacity: 0.4;
}
.shiny-cta::after {
content: '';
pointer-events: none;
position: absolute;
left: 50%; top: 50%;
transform: translate(-50%, -50%);
z-index: 1;
width: 100%; aspect-ratio: 1;
background: linear-gradient(-50deg, transparent, #1d4ed8, transparent);
mask-image: radial-gradient(circle at bottom, transparent 40%, black);
opacity: 0.6;
animation: shimmer 4s linear infinite;
}
.shiny-cta span {
position: relative;
z-index: 2;
display: inline-flex;
align-items: center;
gap: 0.5rem;
}
/* Inner glow effect on text/span */
.shiny-cta span::before {
content: '';
pointer-events: none;
position: absolute;
left: 50%; top: 50%;
transform: translate(-50%, -50%);
z-index: -1;
--size: calc(100% + 1rem);
width: var(--size); height: var(--size);
box-shadow: inset 0 -1ex 2rem 4px #1d4ed8;
opacity: 0;
border-radius: inherit;
transition: opacity 800ms cubic-bezier(0.25, 1, 0.5, 1);
animation: breathe 4.5s linear infinite;
}
@keyframes shimmer { to { transform: translate(-50%, -50%) rotate(360deg); } }
@keyframes breathe {
0%, 100% { transform: translate(-50%, -50%) scale(1); }
50% { transform: translate(-50%, -50%) scale(1.20); }
}
</style></head>
<body class="text-white min-h-screen flex flex-col relative overflow-hidden">

    <!-- Main Content -->
    <main class="relative z-10 flex-grow flex flex-col items-center justify-center px-4 pt-20 pb-32 w-full max-w-7xl mx-auto">

            <!-- CTA Form -->

    </main>

    <!-- Script to initialize icons -->
    <script>
        lucide.createIcons();
