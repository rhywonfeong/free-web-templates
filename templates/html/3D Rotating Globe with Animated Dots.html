  <meta charset="UTF-8">
  <title>3D Globe Breathing White Dots</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .globe-container {
      perspective: 1200px;
      width: 340px;
      height: 340px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
    }
    .dot {
      position: absolute;
      border-radius: 9999px;
      background: #fff;
      opacity: 0.25;
      width: 1.5px;
      height: 1.5px;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      transition:
        opacity 0.8s cubic-bezier(.19,1,.22,1),
        transform 0.8s cubic-bezier(.19,1,.22,1);
      will-change: opacity, transform;
      pointer-events: none;
      box-shadow: none;
    }
    .dot.active {
      opacity: 1;
      background: #fff;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="globe-container" id="globe"></div>
  <script>
    const N = 250, R = 140;
    const globe = document.getElementById('globe');
    const dots = [];
    const positions = [];
    for (let i=0; i<N; i++) {
      const y = 1 - (i / (N - 1)) * 2;
      const radius = Math.sqrt(1 - y*y);
      const theta = Math.PI * (3 - Math.sqrt(5)) * i;
      const x = Math.cos(theta) * radius;
      const z = Math.sin(theta) * radius;
      positions.push({x, y, z});
      const dot = document.createElement('div');
      dot.className = 'dot';
      globe.appendChild(dot);
      dots.push(dot);
    }
    function randomBreathing() {
      dots.forEach(dot => dot.classList.remove('active'));
      const n = Math.floor(N/5 + Math.random()*N/8);
      const indices = Array.from({length:N}, (_,i)=>i);
      for (let i=0; i<n; ++i) {
        const idx = indices.splice(Math.floor(Math.random()*indices.length),1)[0];
        dots[idx].classList.add('active');
      }
    }
    randomBreathing();
    setInterval(randomBreathing, 1400);
    let start;
    function animate(ts) {
      if (!start) start = ts;
      const t = (ts-start) / 1400;
      const ry = t * 0.44;
      const rx = Math.sin(t*0.35) * 0.28;
      const sinRy = Math.sin(ry), cosRy = Math.cos(ry);
      const sinRx = Math.sin(rx), cosRx = Math.cos(rx);
      for (let i=0; i<N; i++) {
        let {x, y, z} = positions[i];
        let x1 = cosRy*x - sinRy*z;
        let z1 = sinRy*x + cosRy*z;
        let y1 = cosRx*y - sinRx*z1;
        let z2 = sinRx*y + cosRx*z1;
        const persp = 350/(350+z2*R);
        const px = x1 * R * persp;
        const py = y1 * R * persp;
        let scale = 1;
        if(dots[i].classList.contains('active')) {
          scale = 2+0.08*Math.sin(ts/450+i);
        }
        dots[i].style.transform =
          `translate(-50%,-50%) translate(${px}px,${py}px) scale(${scale})`;
        dots[i].style.zIndex = 100+Math.round(z2*100);
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
