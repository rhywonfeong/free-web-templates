<body class="bg-zinc-100 antialiased text-zinc-900 selection:bg-emerald-500 selection:text-white" style="font-family: 'Inter', sans-serif;">
    
    <main class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative sm:border-x border-zinc-200 flex flex-col overflow-hidden">
        
        <!-- Header -->
        <header class="pt-12 pb-6 px-6 flex justify-between items-center bg-white z-10 relative">
            <div class="text-xl font-semibold tracking-tighter text-zinc-900">BMICALC</div>
            <button class="w-10 h-10 rounded-full bg-zinc-50 border border-zinc-200 flex items-center justify-center text-zinc-600 transition-colors hover:bg-zinc-100">
                <iconify-icon icon="solar:hamburger-menu-linear" width="20" stroke-width="1.5"></iconify-icon>
            </button>
        </header>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto pb-24 px-6 flex flex-col gap-8">
            
            <!-- Result Card -->
            <section class="bg-zinc-950 rounded-[28px] p-7 text-white relative overflow-hidden shadow-lg shadow-emerald-900/5 border border-zinc-800">
                <!-- Decorative background glow -->
                <div class="absolute top-0 right-0 w-40 h-40 bg-emerald-500 rounded-full blur-[64px] opacity-20 -mr-10 -mt-10 pointer-events-none"></div>
                
                <div class="relative z-10">
                    <h2 class="text-sm font-medium text-zinc-400 mb-2">Your Current BMI</h2>
                    
                    <div class="flex items-baseline gap-3 mb-2">
                        <span class="text-6xl font-semibold tracking-tighter text-white">22.5</span>
                        <div class="bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-md text-xs font-medium border border-emerald-500/20">
                            Normal
                        </div>
                    </div>
                    
                    <p class="text-sm text-zinc-400 mb-8 leading-relaxed">
                        You have a healthy body weight. Maintain your current lifestyle to stay in shape!
                    </p>
                    
                    <!-- BMI Scale Gauge -->
                    <div class="space-y-3">
                        <div class="w-full h-2 bg-zinc-800 rounded-full overflow-hidden flex">
                            <div class="h-full bg-sky-400 w-1/4"></div>
                            <div class="h-full bg-emerald-400 w-[35%] relative">
                                <!-- Indicator Dot -->
                                <div class="absolute top-1/2 left-[40%] -translate-x-1/2 -translate-y-1/2 w-3.5 h-3.5 bg-white border-2 border-emerald-500 rounded-full shadow-sm z-10"></div>
                            </div>
                            <div class="h-full bg-amber-400 w-[20%]"></div>
                            <div class="h-full bg-rose-400 w-[20%]"></div>
                        </div>
                        <div class="flex justify-between text-xs text-zinc-500 font-medium px-1">
                            <span>15</span>
                            <span>18.5</span>
                            <span>25</span>
                            <span>30</span>
                            <span>40</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Inputs Section -->
            <section class="flex flex-col gap-5">
                
                <!-- Height Input -->
                <div class="bg-zinc-50 border border-zinc-200/80 rounded-[24px] p-5 transition-all focus-within:border-emerald-500 focus-within:ring-4 focus-within:ring-emerald-500/10 focus-within:bg-white shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <label for="height" class="text-sm font-medium text-zinc-500">Height</label>
                        <span class="text-xs font-medium text-zinc-500 bg-zinc-200/50 px-2.5 py-1.5 rounded-lg">cm</span>
                    </div>
                    
                    <div class="flex items-end justify-center gap-1 mb-4">
                        <input id="height" type="text" inputmode="decimal" value="175" class="w-full text-center bg-transparent text-5xl font-semibold tracking-tighter text-zinc-900 outline-none p-0 border-none" style="max-width: 140px;">
                    </div>
                    
                    <!-- Custom Visual Slider -->
                    <div class="relative h-12 flex items-center justify-center">
                        <div class="absolute w-full h-1.5 bg-zinc-200 rounded-full"></div>
                        <div class="absolute left-0 h-1.5 bg-emerald-500 rounded-full" style="width: 65%;"></div>

                        </div>
                    </div>
                </div>

                <!-- Weight Input -->
                <div class="bg-zinc-50 border border-zinc-200/80 rounded-[24px] p-5 transition-all focus-within:border-emerald-500 focus-within:ring-4 focus-within:ring-emerald-500/10 focus-within:bg-white shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <label for="weight" class="text-sm font-medium text-zinc-500">Weight</label>
                        <div class="flex bg-zinc-200/50 rounded-lg p-0.5">
                            <button class="text-xs font-medium text-zinc-900 bg-white shadow-sm px-3 py-1 rounded-md">kg</button>
                            <button class="text-xs font-medium text-zinc-500 px-3 py-1 rounded-md hover:text-zinc-700">lb</button>
                        </div>
                    </div>
                    
                    <div class="flex items-end justify-center gap-1 mb-4">
                        <input id="weight" type="text" inputmode="decimal" value="68" class="w-full text-center bg-transparent text-5xl font-semibold tracking-tighter text-zinc-900 outline-none p-0 border-none" style="max-width: 140px;">
                    </div>
                    
                    <!-- Custom Visual Slider -->
                    <div class="relative h-12 flex items-center justify-center">
                        <div class="absolute w-full h-1.5 bg-zinc-200 rounded-full"></div>
                        <div class="absolute left-0 h-1.5 bg-emerald-500 rounded-full" style="width: 45%;"></div>
                        <!-- Slider Thumb -->
                        <div class="absolute w-6 h-6 bg-white border border-zinc-200 rounded-full shadow-[0_2px_8px_rgba(0,0,0,0.08)] flex items-center justify-center cursor-pointer hover:scale-110 transition-transform" style="left: 45%; transform: translateX(-50%);">
                            <div class="w-2 h-2 bg-emerald-500 rounded-full"></div>
                        </div>
                    </div>
                </div>

            </section>

            <!-- Calculate Button -->

            </button>

        </div>

        <!-- Bottom Navigation -->
