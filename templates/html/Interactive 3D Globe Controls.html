  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Globe</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-5xl w-full bg-gray-800 rounded-xl overflow-hidden shadow-lg flex flex-col md:flex-row">
    <!-- Globe Container -->
    <div class="w-full md:w-1/2 relative flex items-center justify-center" style="min-height: 500px;">
      <canvas
        id="cobe"
        style="width: 100%; height: 100%; max-width: 500px; max-height: 500px;"
        width="1000"
        height="1000"
      ></canvas>
    </div>
    
    <!-- Controls Section -->
    <div class="w-full md:w-1/2 p-6 overflow-y-auto bg-gray-800 text-white">
      <h2 class="text-xl font-medium text-white mb-4">Globe Controls</h2>
      
      <div class="space-y-4">
        <div>
          <div class="flex justify-between text-sm mb-1">
            <label class="text-gray-300">Phi (Rotation)</label>
            <span id="phiValue" class="text-white">0</span>
          </div>
          <input type="range" id="phi" min="0" max="6.28" step="0.1" value="0" 
                 class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
        </div>
        
        <div>
          <div class="flex justify-between text-sm mb-1">
            <label class="text-gray-300">Theta (Tilt)</label>
            <span id="thetaValue" class="text-white">0</span>
          </div>
          <input type="range" id="theta" min="-1.57" max="1.57" step="0.1" value="0" 
                 class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
        </div>
        
        <div>
          <div class="flex justify-between text-sm mb-1">
            <label class="text-gray-300">Scale</label>
            <span id="scaleValue" class="text-white">1.0</span>
          </div>
          <input type="range" id="scale" min="0.5" max="2.0" step="0.1" value="1.0" 
                 class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
        </div>
        
        <div>
          <div class="flex justify-between text-sm mb-1">
            <label class="text-gray-300">Diffuse</label>
            <span id="diffuseValue" class="text-white">1.2</span>
          </div>
          <input type="range" id="diffuse" min="0.5" max="2.5" step="0.1" value="1.2" 
                 class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
        </div>
        
        <div>
          <div class="flex justify-between text-sm mb-1">
            <label class="text-gray-300">Map Brightness</label>
            <span id="brightnessValue" class="text-white">6</span>
          </div>
          <input type="range" id="mapBrightness" min="1" max="10" step="0.5" value="6" 
                 class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
        </div>
        
        <div class="pt-4 border-t border-gray-600">
          <div class="mb-3">
            <span class="text-sm text-gray-300 block mb-2">Base Color</span>
            <div class="flex flex-wrap gap-2">
              <button data-color="white" class="w-6 h-6 rounded-full bg-white border-2 border-gray-600"></button>
              <button data-color="blue" class="w-6 h-6 rounded-full bg-blue-500 border-2 border-gray-600"></button>
              <button data-color="green" class="w-6 h-6 rounded-full bg-green-500 border-2 border-gray-600"></button>
              <button data-color="purple" class="w-6 h-6 rounded-full bg-purple-500 border-2 border-gray-600"></button>
              <button data-color="red" class="w-6 h-6 rounded-full bg-red-500 border-2 border-gray-600"></button>
              <button data-color="indigo" class="w-6 h-6 rounded-full bg-indigo-500 border-2 border-gray-600"></button>
              <button data-color="teal" class="w-6 h-6 rounded-full bg-teal-500 border-2 border-gray-600"></button>
              <input type="color" id="customBaseColor" class="w-6 h-6 rounded-full border-2 border-gray-600 cursor-pointer" value="#ffffff" title="Custom Color">
            </div>
          </div>
          
          <div class="mb-3">
            <span class="text-sm text-gray-300 block mb-2">Marker Color</span>
            <div class="flex flex-wrap gap-2">
              <button data-marker="pink" class="w-6 h-6 rounded-full bg-pink-500 border-2 border-gray-600"></button>
              <button data-marker="orange" class="w-6 h-6 rounded-full bg-orange-500 border-2 border-gray-600"></button>
              <button data-marker="cyan" class="w-6 h-6 rounded-full bg-cyan-500 border-2 border-gray-600"></button>
              <button data-marker="yellow" class="w-6 h-6 rounded-full bg-yellow-500 border-2 border-gray-600"></button>
              <button data-marker="lime" class="w-6 h-6 rounded-full bg-lime-500 border-2 border-gray-600"></button>
              <button data-marker="violet" class="w-6 h-6 rounded-full bg-violet-500 border-2 border-gray-600"></button>
              <button data-marker="rose" class="w-6 h-6 rounded-full bg-rose-500 border-2 border-gray-600"></button>
              <input type="color" id="customMarkerColor" class="w-6 h-6 rounded-full border-2 border-gray-600 cursor-pointer" value="#ff80ff" title="Custom Color">
            </div>
          </div>
          
          <div class="mb-3">
            <span class="text-sm text-gray-300 block mb-2">Glow Color</span>
            <div class="flex flex-wrap gap-2">
              <button data-glow="white" class="w-6 h-6 rounded-full bg-white border-2 border-gray-600"></button>
              <button data-glow="blue" class="w-6 h-6 rounded-full bg-blue-300 border-2 border-gray-600"></button>
              <button data-glow="green" class="w-6 h-6 rounded-full bg-green-300 border-2 border-gray-600"></button>
              <button data-glow="purple" class="w-6 h-6 rounded-full bg-purple-300 border-2 border-gray-600"></button>
              <button data-glow="amber" class="w-6 h-6 rounded-full bg-amber-300 border-2 border-gray-600"></button>
              <button data-glow="emerald" class="w-6 h-6 rounded-full bg-emerald-300 border-2 border-gray-600"></button>
              <button data-glow="sky" class="w-6 h-6 rounded-full bg-sky-300 border-2 border-gray-600"></button>
              <input type="color" id="customGlowColor" class="w-6 h-6 rounded-full border-2 border-gray-600 cursor-pointer" value="#ffffff" title="Custom Color">
            </div>
          </div>
        </div>
        
        <div class="pt-4 border-t border-gray-600 flex justify-between items-center">
          <div class="flex space-x-2">
            <button id="lightMode" class="p-2 bg-gray-700 border border-gray-600 rounded-md text-gray-300 hover:bg-gray-600" title="Light Mode">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"></path>
              </svg>
            </button>
            <button id="darkMode" class="p-2 bg-blue-600 border border-blue-500 rounded-md text-white" title="Dark Mode">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
              </svg>
            </button>
          </div>
          
          <button id="reset" class="px-3 py-1 bg-gray-700 border border-gray-600 rounded-md text-gray-300 hover:bg-gray-600">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import createGlobe from 'https://cdn.skypack.dev/cobe'

    let canvas = document.getElementById("cobe")
    
    // Globe state - these variables control the globe
    let globeConfig = {
      phi: 0,
      theta: 0,
      dark: 1,
      diffuse: 1.2,
      scale: 1,
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [1, 1, 1],
      markerColor: [1, 0.5, 1],
      glowColor: [1, 1, 1],
      rotationSpeed: 0.005,
      autoRotate: true
    }
    
    // Color presets
    const colors = {
      white: [1, 1, 1],
      blue: [0.3, 0.5, 1],
      green: [0.2, 0.8, 0.3],
      purple: [0.7, 0.3, 0.9],
      red: [1, 0.2, 0.2],
      indigo: [0.4, 0.2, 0.8],
      teal: [0.2, 0.7, 0.7]
    }
    
    const markerColors = {
      pink: [1, 0.5, 1],
      orange: [1, 0.6, 0.3],
      cyan: [0.3, 0.8, 1],
      yellow: [1, 0.9, 0.3],
      lime: [0.5, 1, 0.2],
      violet: [0.8, 0.4, 1],
      rose: [1, 0.4, 0.6]
    }
    
    const glowColors = {
      white: [1, 1, 1],
      blue: [0.5, 0.7, 1],
      green: [0.6, 1, 0.6],
      purple: [0.8, 0.6, 1],
      amber: [1, 0.9, 0.5],
      emerald: [0.4, 1, 0.7],
      sky: [0.5, 0.8, 1]
    }
    
    // Helper function to convert hex to RGB array
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)
      return result ? [
        parseInt(result[1], 16) / 255,
        parseInt(result[2], 16) / 255,
        parseInt(result[3], 16) / 255
      ] : [1, 1, 1]
    }
    
    // Initialize globe
    const globe = createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 1000,
      height: 1000,
      phi: globeConfig.phi,
      theta: globeConfig.theta,
      dark: globeConfig.dark,
      diffuse: globeConfig.diffuse,
      scale: globeConfig.scale,
      mapSamples: globeConfig.mapSamples,
      mapBrightness: globeConfig.mapBrightness,
      baseColor: globeConfig.baseColor,
      markerColor: globeConfig.markerColor,
      glowColor: globeConfig.glowColor,
      markers: [
        { location: [37.7595, -122.4367], size: 0.05 },
        { location: [40.7128, -74.006], size: 0.05 },
        { location: [51.5074, -0.1278], size: 0.05 },
        { location: [35.6762, 139.6503], size: 0.05 },
      ],
      onRender: (state) => {
        if (globeConfig.autoRotate) {
          globeConfig.phi += globeConfig.rotationSpeed
        }
        state.phi = globeConfig.phi
        state.theta = globeConfig.theta
        state.dark = globeConfig.dark
        state.diffuse = globeConfig.diffuse
        state.scale = globeConfig.scale
        state.mapBrightness = globeConfig.mapBrightness
        state.baseColor = globeConfig.baseColor
        state.markerColor = globeConfig.markerColor
        state.glowColor = globeConfig.glowColor
      },
    })
    
    // Update UI display values
    function updateUI() {
      document.getElementById('phiValue').textContent = globeConfig.phi.toFixed(1)
      document.getElementById('thetaValue').textContent = globeConfig.theta.toFixed(1)
      document.getElementById('scaleValue').textContent = globeConfig.scale.toFixed(1)
      document.getElementById('diffuseValue').textContent = globeConfig.diffuse.toFixed(1)
      document.getElementById('brightnessValue').textContent = globeConfig.mapBrightness.toFixed(1)
    }
    
    // Control event listeners
    document.getElementById('phi').addEventListener('input', function(e) {
      globeConfig.phi = parseFloat(e.target.value)
      globeConfig.autoRotate = false
      updateUI()
    })
    
    document.getElementById('theta').addEventListener('input', function(e) {
      globeConfig.theta = parseFloat(e.target.value)
      updateUI()
    })
    
    document.getElementById('scale').addEventListener('input', function(e) {
      globeConfig.scale = parseFloat(e.target.value)
      updateUI()
    })
    
    document.getElementById('diffuse').addEventListener('input', function(e) {
      globeConfig.diffuse = parseFloat(e.target.value)
      updateUI()
    })
    
    document.getElementById('mapBrightness').addEventListener('input', function(e) {
      globeConfig.mapBrightness = parseFloat(e.target.value)
      updateUI()
    })
    
    // Color control functions
    function updateColorButtons(type, selected) {
      document.querySelectorAll(`[data-${type}]`).forEach(btn => {
        btn.style.borderColor = btn.getAttribute(`data-${type}`) === selected ? '#3b82f6' : '#4b5563'
        btn.style.borderWidth = btn.getAttribute(`data-${type}`) === selected ? '3px' : '2px'
      })
    }
    
    // Color button event listeners
    document.querySelectorAll('[data-color]').forEach(button => {
      button.addEventListener('click', function() {
        const colorName = this.getAttribute('data-color')
        globeConfig.baseColor = colors[colorName]
        updateColorButtons('color', colorName)
      })
    })
    
    document.querySelectorAll('[data-marker]').forEach(button => {
      button.addEventListener('click', function() {
        const colorName = this.getAttribute('data-marker')
        globeConfig.markerColor = markerColors[colorName]
        updateColorButtons('marker', colorName)
      })
    })
    
    document.querySelectorAll('[data-glow]').forEach(button => {
      button.addEventListener('click', function() {
        const colorName = this.getAttribute('data-glow')
        globeConfig.glowColor = glowColors[colorName]
        updateColorButtons('glow', colorName)
      })
    })
    
    // Custom color inputs
    document.getElementById('customBaseColor').addEventListener('input', function(e) {
      globeConfig.baseColor = hexToRgb(e.target.value)
      document.querySelectorAll('[data-color]').forEach(btn => {
        btn.style.borderColor = '#4b5563'
        btn.style.borderWidth = '2px'
      })
    })
    
    document.getElementById('customMarkerColor').addEventListener('input', function(e) {
      globeConfig.markerColor = hexToRgb(e.target.value)
      document.querySelectorAll('[data-marker]').forEach(btn => {
        btn.style.borderColor = '#4b5563'
        btn.style.borderWidth = '2px'
      })
    })
    
    document.getElementById('customGlowColor').addEventListener('input', function(e) {
      globeConfig.glowColor = hexToRgb(e.target.value)
      document.querySelectorAll('[data-glow]').forEach(btn => {
        btn.style.borderColor = '#4b5563'
        btn.style.borderWidth = '2px'
      })
    })
    
    // Mode toggle buttons
    document.getElementById('lightMode').addEventListener('click', function() {
      globeConfig.dark = 0
      this.classList.add('bg-blue-600', 'border-blue-500', 'text-white')
      this.classList.remove('bg-gray-700', 'border-gray-600', 'text-gray-300')
      document.getElementById('darkMode').classList.remove('bg-blue-600', 'border-blue-500', 'text-white')
      document.getElementById('darkMode').classList.add('bg-gray-700', 'border-gray-600', 'text-gray-300')
    })
    
    document.getElementById('darkMode').addEventListener('click', function() {
      globeConfig.dark = 1
      this.classList.add('bg-blue-600', 'border-blue-500', 'text-white')
      this.classList.remove('bg-gray-700', 'border-gray-600', 'text-gray-300')
      document.getElementById('lightMode').classList.remove('bg-blue-600', 'border-blue-500', 'text-white')
      document.getElementById('lightMode').classList.add('bg-gray-700', 'border-gray-600', 'text-gray-300')
    })
    
    // Reset functionality
    document.getElementById('reset').addEventListener('click', function() {
      globeConfig = {
        phi: 0,
        theta: 0,
        dark: 1,
        diffuse: 1.2,
        scale: 1,
        mapSamples: 16000,
        mapBrightness: 6,
        baseColor: [1, 1, 1],
        markerColor: [1, 0.5, 1],
        glowColor: [1, 1, 1],
        rotationSpeed: 0.005,
        autoRotate: true
      }
      
      document.getElementById('phi').value = globeConfig.phi
      document.getElementById('theta').value = globeConfig.theta
      document.getElementById('scale').value = globeConfig.scale
      document.getElementById('diffuse').value = globeConfig.diffuse
      document.getElementById('mapBrightness').value = globeConfig.mapBrightness
      
      updateColorButtons('color', 'white')
      updateColorButtons('marker', 'pink')
      updateColorButtons('glow', 'white')
      
      document.getElementById('darkMode').classList.add('bg-blue-600', 'border-blue-500', 'text-white')
      document.getElementById('darkMode').classList.remove('bg-gray-700', 'border-gray-600', 'text-gray-300')
      document.getElementById('lightMode').classList.remove('bg-blue-600', 'border-blue-500', 'text-white')
      document.getElementById('lightMode').classList.add('bg-gray-700', 'border-gray-600', 'text-gray-300')
      
      updateUI()
    })
    
    // Initialize UI
    updateColorButtons('color', 'white')
    updateColorButtons('marker', 'pink')
    updateColorButtons('glow', 'white')
    updateUI()
  </script>
</body>
