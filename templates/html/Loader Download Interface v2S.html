<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Скачать лоадер</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }
    @keyframes fadeInUp {
      0% {opacity:0; transform:translateY(32px);}
      100% {opacity:1; transform:translateY(0);}
    }
    .fade-in-up {animation:fadeInUp 0.7s cubic-bezier(.4,0,.2,1) forwards;}
    .glass {
      background: rgba(36,28,62,0.7);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1.5px solid rgba(120,53,255,0.18);
      box-shadow: 0 8px 32px rgba(86,45,186,0.13);
    }
    .loader {
      border: 4px solid #7c3aed30;
      border-top: 4px solid #a78bfa;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1.1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% {transform:rotate(0deg);}
      100% {transform:rotate(360deg);}
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen w-full bg-gradient-to-br from-[#1e183b] via-[#251e4b] to-[#3c217a] flex items-center justify-center px-4">
  <!-- Particles BG -->
  <div id="particles-js" class="fixed inset-0 z-0 pointer-events-none"></div>

  <main class="relative z-10 w-full max-w-md">
    <div class="glass p-8 sm:p-10 w-full flex flex-col items-center gap-8 fade-in-up" style="animation-delay:0.15s">
      <h2 class="text-3xl tracking-tight font-semibold text-white fade-in-up" style="animation-delay:0.25s">
        Скачать лоадер
      </h2>
      <p class="text-base text-violet-100 font-normal text-center fade-in-up" style="animation-delay:0.35s">
        Нажмите кнопку ниже, чтобы скачать лоадер.<br>Загрузка начнётся автоматически.
      </p>
      <button 
        id="download-btn"
        type="button"
        class="w-full py-3 flex items-center justify-center rounded-xl bg-gradient-to-tr from-[#a78bfa] via-[#8b5cf6] to-[#6d28d9] font-semibold text-lg tracking-tight text-white shadow-lg hover:from-[#c4b5fd] hover:to-[#7c3aed] hover:ring-2 hover:ring-violet-400/60 transition-all duration-150 outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 fade-in-up"
        style="animation-delay:0.5s"
      >
        <span class="mr-2">Скачать лоадер</span>
        <i class="lucide lucide-download" style="width:22px;height:22px"></i>
      </button>
      <div id="spinner-container" class="flex flex-col items-center gap-2 fade-in-up" style="animation-delay:0.7s">
        <div id="spinner" class="loader"></div>
        <span class="text-violet-200 text-sm font-medium mt-2">Готовим загрузку...</span>
      </div>
    </div>
    <div class="w-full flex justify-center mt-8 fade-in-up" style="animation-delay:1s">
      <div class="text-xs text-violet-300/60 font-medium tracking-wide">
        Файл безопасен. Проверено антивирусом.
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    // Lucide icons
    lucide.createIcons();

    // ParticlesJS
    particlesJS("particles-js", {
      particles: {
        number: { value: 28, density: { enable: true, value_area: 800 } },
        color: { value: "#a78bfa" },
        shape: { type: "circle" },
        opacity: { value: 0.09, random: true },
        size: { value: 4, random: true },
        line_linked: { enable: true, distance: 140, color: "#7c3aed", opacity: 0.13, width: 1 },
        move: { enable: true, speed: 1.1, direction: "none", random: false, straight: false, out_mode: "out" }
      },
      interactivity: {
        detect_on: "canvas",
        events: { onhover: { enable: true, mode: "repulse" }, onclick: { enable: false } },
        modes: { repulse: { distance: 82, duration: 0.3 } }
      },
      retina_detect: true
    });

    // Sequential fade in (stagger effect)
    document.querySelectorAll('.fade-in-up').forEach((el, idx) => {
      setTimeout(() => el.style.opacity = 1, 200 + idx * 120);
    });

    // Button click: imitate download and show spinner
    const btn = document.getElementById('download-btn');
    const spinnerContainer = document.getElementById('spinner-container');
    btn.addEventListener('click', () => {
      btn.disabled = true;
      btn.innerHTML = '<span class="mr-2">Загрузка...</span><i class="lucide lucide-loader-2 animate-spin" style="width:22px;height:22px"></i>';
      lucide.createIcons();
      spinnerContainer.style.display = 'flex';
      // Simulating loader download
      setTimeout(() => {
        spinnerContainer.innerHTML = '<div class="text-green-400 flex items-center gap-2 font-semibold text-lg"><i class="lucide lucide-check-circle" style="width:24px;height:24px"></i>Лоадер скачан!</div>';
        lucide.createIcons();
        btn.innerHTML = '<span class="mr-2">Скачать снова</span><i class="lucide lucide-download" style="width:22px;height:22px"></i>';
        btn.disabled = false;
        // Actual file download (demo, replace link with real file)
        const a = document.createElement('a');
        a.href = 'https://example.com/loader.exe';
        a.download = 'loader.exe';
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }, 2700);
    });
  </script>
</body>
</html>
