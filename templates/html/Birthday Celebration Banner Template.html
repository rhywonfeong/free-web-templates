<html lang="es"><head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<title>Banner Cumpleaños Rocketers</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;500;600&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* Custom Float Animation for Balloons */
@keyframes float-balloon {
0%, 100% { transform: translateY(0) rotate(0deg); }
50% { transform: translateY(-15px) rotate(2deg); }
}
.animate-float-balloon {
animation: float-balloon 5s ease-in-out infinite;
}
</style></head>
<body class="min-h-screen flex items-center justify-center font-sans bg-slate-950 pt-4 pr-4 pb-4 pl-4">
  
  <div class="w-full max-w-5xl">
    <!-- Banner Container: 820x312 Aspect Ratio -->
    <div class="relative w-full rounded-2xl overflow-hidden shadow-2xl ring-1 ring-white/10 group" style="aspect-ratio: 820 / 312; background-color: #0B1E3D;">
      
      <!-- 1. Background Layers (Dark Blue base + Violet/Nebula) -->
      <div class="absolute inset-0">
        <!-- Base Gradient -->
        <div class="absolute inset-0 bg-[#0B1E3D]"></div>
        
        <!-- Soft Nebulas (Violet & Blue) -->
        <div class="absolute -top-[50%] -left-[20%] w-[80%] h-[150%] rounded-full opacity-60 mix-blend-screen blur-3xl" style="background: radial-gradient(circle, #6A4C93 0%, transparent 70%);"></div>
        <div class="absolute -bottom-[50%] -right-[20%] w-[80%] h-[150%] rounded-full opacity-40 mix-blend-screen blur-3xl" style="background: radial-gradient(circle, #4c1d95 0%, transparent 70%);"></div>
        
        <!-- Starfield & Sparkles -->
        <div class="absolute inset-0" style="background-image: 
            radial-gradient(1px 1px at 15% 15%, #FFFFFF 100%, transparent),
            radial-gradient(1.5px 1.5px at 25% 75%, #C0C0C0 100%, transparent),
            radial-gradient(2px 2px at 60% 20%, #FFD700 100%, transparent),
            radial-gradient(1px 1px at 80% 80%, #FFFFFF 100%, transparent),
            radial-gradient(1.5px 1.5px at 10% 90%, #C0C0C0 100%, transparent),
            radial-gradient(1px 1px at 90% 10%, #FFFFFF 100%, transparent);
            background-size: 50% 50%;">
        </div>
      </div>

      <!-- 2. Floating Background Elements -->
      <div class="absolute inset-0 z-10 pointer-events-none">
        
        <!-- UPDATED: Balloons (Left) - More detail and vibrant -->
        <div class="absolute left-4 top-4 sm:left-12 sm:top-8 animate-float-balloon origin-bottom">
           <svg width="140" height="180" viewBox="0 0 140 180" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-2xl">
              <defs>
                 <!-- Gold Gradient -->
                 <radialGradient id="grad-gold" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(35 35) rotate(45) scale(50)">
                    <stop offset="0%" stop-color="#FFF5C2"></stop>
                    <stop offset="30%" stop-color="#FFD700"></stop>
                    <stop offset="100%" stop-color="#B8860B"></stop>
                 </radialGradient>
                 <!-- Violet Gradient -->
                 <radialGradient id="grad-violet" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(90 40) rotate(45) scale(55)">
                    <stop offset="0%" stop-color="#D8B4FE"></stop>
                    <stop offset="30%" stop-color="#6A4C93"></stop>
                    <stop offset="100%" stop-color="#3B2160"></stop>
                 </radialGradient>
                 <!-- Silver Gradient -->
                 <radialGradient id="grad-silver" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(60 60) rotate(45) scale(45)">
                    <stop offset="0%" stop-color="#FFFFFF"></stop>
                    <stop offset="30%" stop-color="#E2E8F0"></stop>
                    <stop offset="100%" stop-color="#64748B"></stop>
                 </radialGradient>
              </defs>

              <!-- Strings (Curved ribbons) -->
              <path d="M70 110 Q 70 140 60 170" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" fill="none"></path>
              <path d="M40 95 Q 50 140 60 170" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" fill="none"></path>
              <path d="M100 95 Q 80 140 60 170" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5" fill="none"></path>

              <!-- Balloon 3: Silver (Back/Center) -->
              <g transform="translate(60, 60)">
                 <path d="M0 0 C-20 0 -22 30 -2 45 L0 48 L2 45 C22 30 20 0 0 0Z" fill="url(#grad-silver)"></path>
                 <!-- Highlight -->
                 <ellipse cx="-8" cy="10" rx="4" ry="8" transform="rotate(-30)" fill="white" fill-opacity="0.4" filter="blur(1px)"></ellipse>
              </g>

              <!-- Balloon 2: Gold (Left) -->
              <g transform="translate(35, 35) rotate(-10)">
                 <path d="M0 0 C-25 0 -28 35 -3 55 L0 58 L3 55 C28 35 25 0 0 0Z" fill="url(#grad-gold)"></path>
                 <!-- Highlight -->
                 <ellipse cx="-10" cy="12" rx="5" ry="10" transform="rotate(-30)" fill="white" fill-opacity="0.5" filter="blur(1px)"></ellipse>
              </g>

              <!-- Balloon 1: Violet (Right/Front) -->
              <g transform="translate(90, 40) rotate(10)">
                 <path d="M0 0 C-26 0 -29 36 -3 56 L0 59 L3 56 C29 36 26 0 0 0Z" fill="url(#grad-violet)"></path>
                 <!-- Highlight -->
                 <ellipse cx="-10" cy="12" rx="6" ry="12" transform="rotate(-30)" fill="white" fill-opacity="0.4" filter="blur(1px)"></ellipse>
              </g>
              
              <!-- Sparkles around balloons -->
              <circle cx="20" cy="20" r="1.5" fill="#FFD700" class="animate-pulse"></circle>
              <circle cx="120" cy="30" r="1" fill="#FFFFFF" class="animate-ping"></circle>
           </svg>
        </div>

        <!-- Space Cake Illustration (Right) -->
        <div class="absolute right-6 bottom-8 sm:right-16 sm:bottom-12">
          <div class="relative transform rotate-6 hover:rotate-0 transition-transform duration-700 drop-shadow-2xl">
             <!-- SVG Cake Illustration -->
             <svg width="100" height="100" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Shadow below -->
                <ellipse cx="100" cy="170" rx="70" ry="10" fill="black" fill-opacity="0.3" filter="blur(5px)"></ellipse>
                
                <!-- Cake Base Body (Violet) -->
                <path d="M50 110 L50 150 C50 170 150 170 150 150 L150 110" fill="#6A4C93" stroke="#583B80" stroke-width="2"></path> 
                
                <!-- Cake Top Surface (Darker Violet) -->
                <ellipse cx="100" cy="110" rx="50" ry="20" fill="#583B80"></ellipse>
                
                <!-- Icing/Frosting (Silver/White Dripping) -->
                <path d="M50 110 C50 90 150 90 150 110 C150 118 142 112 138 125 C134 138 124 118 115 130 C106 142 94 118 85 130 C76 142 66 118 62 125 C58 132 50 118 50 110 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"></path>
                
                <!-- Candle (White) -->
                <rect x="95" y="60" width="10" height="50" rx="2" fill="url(#candle-gradient)"></rect>
                
                <!-- Flame (Gold Animated) -->
                <path d="M100 20 Q 115 45 100 55 Q 85 45 100 20" fill="#FFD700" class="animate-pulse" filter="drop-shadow(0 0 8px #FFD700)">
                    <animate attributeName="d" values="M100 20 Q 115 45 100 55 Q 85 45 100 20; M100 15 Q 118 45 100 55 Q 82 45 100 15; M100 20 Q 115 45 100 55 Q 85 45 100 20" dur="1.5s" repeatCount="indefinite"></animate>
                </path>
                
                <!-- Definitions -->
                <defs>
                   <linearGradient id="candle-gradient" x1="100" y1="60" x2="100" y2="110" gradientUnits="userSpaceOnUse">
                      <stop stop-color="#FFFFFF"></stop>
                      <stop offset="1" stop-color="#94a3b8"></stop>
                   </linearGradient>
                </defs>
             </svg>
          </div>
        </div>
      </div>

      <!-- 3. Spaceship & Trail (Center/Background) -->
      <div class="absolute inset-0 flex items-center justify-center z-0 overflow-visible">
        <div class="relative w-full h-full">
           <!-- Rocket Container (Tilted) -->
           <div class="absolute left-[50%] top-[55%] -translate-x-1/2 -translate-y-1/2 rotate-[-15deg] w-40 h-40 flex items-center justify-center">
              
              <!-- Confetti Trail (Simulated with particles) -->
              <div class="absolute top-24 left-1/2 -translate-x-1/2 w-2 h-32 origin-top transform rotate-12 opacity-80">
                 <!-- Streamers -->
                 <div class="absolute top-0 left-0 w-1 h-20 bg-gradient-to-b from-[#FFD700] to-transparent rotate-12"></div>
                 <div class="absolute top-2 -left-4 w-1 h-24 bg-gradient-to-b from-[#6A4C93] to-transparent -rotate-6"></div>
                 <div class="absolute top-0 left-4 w-1 h-16 bg-gradient-to-b from-[#C0C0C0] to-transparent rotate-3"></div>
                 
                 <!-- Particles/Confetti -->
                 <span class="absolute top-10 left-6 w-1.5 h-1.5 bg-[#FFD700] rounded-sm rotate-45 animate-pulse"></span>
                 <span class="absolute top-16 -left-8 w-1 h-2 bg-[#C0C0C0] rotate-12"></span>
                 <span class="absolute top-20 left-0 w-2 h-2 bg-[#6A4C93] rounded-full"></span>
                 <span class="absolute top-8 -left-2 w-1.5 h-1.5 bg-white rounded-full shadow-[0_0_5px_white]"></span>
              </div>

              <!-- Spaceship Body -->
              <div class="relative z-10 filter drop-shadow-[0_0_15px_rgba(255,215,0,0.2)]">
                 <!-- Fins -->
                 <div class="absolute bottom-0 left-[-12px] w-6 h-10 bg-[#6A4C93] rounded-bl-full transform -skew-x-12 border-l border-white/20"></div>
                 <div class="absolute bottom-0 right-[-12px] w-6 h-10 bg-[#6A4C93] rounded-br-full transform skew-x-12 border-r border-white/20"></div>
                 
                 <!-- Main Hull (Metallic Silver) -->
                 <div class="w-16 h-24 bg-gradient-to-r from-[#C0C0C0] via-white to-[#C0C0C0] rounded-[50%_50%_10%_10%] relative overflow-hidden shadow-inner">
                    <!-- Metal shine -->
                    <div class="absolute inset-0 bg-gradient-to-tr from-black/20 to-transparent"></div>
                 </div>

                 <!-- Window -->
                 <div class="absolute top-6 left-1/2 -translate-x-1/2 w-8 h-8 bg-[#0B1E3D] rounded-full border-2 border-[#C0C0C0] shadow-md overflow-hidden">
                    <div class="absolute top-1 right-2 w-2 h-2 bg-white rounded-full opacity-80"></div>
                 </div>

                 <!-- Thruster Flame -->
                 <div class="absolute -bottom-8 left-1/2 -translate-x-1/2 w-6 h-10 bg-gradient-to-t from-transparent via-[#FFD700] to-white rounded-b-full blur-[2px] opacity-90 animate-pulse"></div>
              </div>
           </div>
        </div>
      </div>

      <!-- 4. Text Content (Centered Overlay) -->
      <div class="flex z-30 absolute top-0 right-0 bottom-0 left-0 items-center justify-center">
        <!-- Text Container: Limited height approx 150px as requested -->
        <div class="w-full max-w-2xl px-6 text-center flex flex-col items-center justify-center" style="max-height: 160px;">
          
          <!-- Main Title -->
          <h1 class="relative text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)] leading-tight" style="font-family: 'Outfit', sans-serif;">
            <span class="bg-clip-text text-transparent font-newsreader bg-gradient-to-r from-white via-[#FFD700] to-white">
              ¡Feliz Cumpleaños Rocketers!
            </span>
          </h1>

          <!-- Subtitle -->
          <div class="mt-3 inline-flex items-center gap-2 bg-[#0B1E3D]/60 backdrop-blur-sm px-4 py-1.5 rounded-full border border-white/10 shadow-lg">
            <iconify-icon icon="solar:star-shine-linear" class="text-[#FFD700]" width="16" height="16"></iconify-icon>
            <p class="sm:text-base text-sm font-medium text-[#C0C0C0] tracking-wide" style="font-family: 'Outfit', sans-serif">
              Celebrando otro año de aventuras estelares
            </p>
            <iconify-icon icon="solar:star-shine-linear" class="text-[#FFD700]" width="16" height="16"></iconify-icon>
          </div>

        </div>
      </div>

      <!-- Decorative Overlays -->
      <div class="absolute top-4 right-6 animate-pulse opacity-70">
        <iconify-icon icon="solar:stars-linear" class="text-white" width="24" height="24"></iconify-icon>
      </div>
      <div class="absolute bottom-6 left-8 animate-pulse opacity-50 delay-700">
        <iconify-icon icon="solar:planet-2-linear" class="text-[#C0C0C0]" width="20" height="20"></iconify-icon>
      </div>
      
    </div>
  </div>


</body></html>
