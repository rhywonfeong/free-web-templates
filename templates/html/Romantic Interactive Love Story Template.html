<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under The Same Stars ✨</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* Custom Keyframes */
@keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
@keyframes float-slow { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-15px) rotate(2deg); } }
@keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
@keyframes shoot { 0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; } 100% { transform: translateX(-300px) translateY(300px) rotate(-45deg); opacity: 0; } }
@keyframes rise { 0% { bottom: -10%; opacity: 0; } 20% { opacity: 0.8; } 100% { bottom: 120%; opacity: 0; } }
@keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
@keyframes heartbeat { 0% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } 60% { transform: scale(1); } }
@keyframes bloom-rotate { from { transform: rotate(0deg) scale(0); opacity: 0; } to { transform: rotate(360deg) scale(1); opacity: 1; } }
.font-hand { font-family: 'Dancing Script', cursive; }
.font-ui { font-family: 'Inter', sans-serif; }
.animate-float { animation: float 4s ease-in-out infinite; }
.animate-float-slow { animation: float-slow 6s ease-in-out infinite; }
.animate-twinkle { animation: twinkle 3s ease-in-out infinite; }
.animate-rise { animation: rise 15s linear infinite; }
.animate-flicker { animation: flicker 2s infinite; }
.animate-heartbeat { animation: heartbeat 3s ease-in-out infinite; }
/* Star Background */
.star { position: absolute; background: white; border-radius: 50%; }
.shooting-star {
position: absolute;
width: 100px;
height: 2px;
background: linear-gradient(90deg, white, transparent);
opacity: 0;
z-index: 0;
}
/* Lantern Styling */
.lantern-bg {
position: absolute;
background: radial-gradient(circle, #fcd34d 0%, #fbbf24 40%, rgba(251, 191, 36, 0) 70%);
border-radius: 50%;
pointer-events: none;
mix-blend-mode: screen;
}
/* Final Flower Styling */
.flower-layer { transform-origin: center; opacity: 0; transition: all 2s cubic-bezier(0.4, 0, 0.2, 1); }
.bloomed .flower-layer { opacity: 1; transform: scale(1) rotate(0deg); }
.bloomed .layer-1 { transition-delay: 0.2s; }
.bloomed .layer-2 { transition-delay: 0.5s; }
.bloomed .layer-3 { transition-delay: 0.8s; }
.bloomed .layer-4 { transition-delay: 1.1s; }
.bloomed .center-core { transition-delay: 1.4s; animation: flicker 3s infinite; }
/* Custom UI */
.glass-panel {
background: rgba(15, 23, 42, 0.6);
backdrop-filter: blur(16px);
border: 1px solid rgba(255, 255, 255, 0.1);
box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}
</style></head>
<body class="bg-slate-950 min-h-screen font-ui text-white overflow-hidden relative selection:bg-rose-500/30">

    <!-- Background Layers -->
    <div id="stars-container" class="absolute inset-0 pointer-events-none z-0"></div>
    <div id="lanterns-container" class="absolute inset-0 pointer-events-none z-0 overflow-hidden"></div>
    
    <!-- Vignette -->
    <div class="absolute inset-0 pointer-events-none z-10 bg-[radial-gradient(circle_at_center,transparent_0%,#020617_100%)]"></div>

    <!-- Music Toggle -->
    <button id="music-toggle" class="fixed top-6 right-6 z-50 bg-white/10 backdrop-blur-md p-3 rounded-full hover:bg-white/20 transition-all border border-white/10 text-rose-200">
        <span class="iconify" data-icon="lucide:music" data-width="20" data-height="20"></span>
    </button>
    <audio id="bg-music" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-dreaming-big-31.mp3" type="audio/mp3">
    </audio>

    <main class="relative z-20 flex flex-col items-center justify-center min-h-screen w-full px-6">

        <!-- STAGE 1: INTRO (Floating Heart) -->
        <section id="stage-intro" class="flex flex-col items-center w-full max-w-md transition-all duration-1000">
            <div class="relative w-64 h-64 mb-8 flex items-center justify-center animate-float-slow">
                <!-- Glowing Aura -->
                <div class="absolute w-48 h-48 bg-rose-500/20 rounded-full blur-[60px] animate-pulse"></div>
                
                <!-- Floating 3D Heart -->
                <div class="relative w-40 h-40 animate-heartbeat drop-shadow-[0_0_25px_rgba(244,63,94,0.5)]">
                    <svg viewBox="0 0 24 24" class="w-full h-full text-rose-500 overflow-visible">
                        <defs>
                            <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#be123c;stop-opacity:1" />
                            </linearGradient>
                            <filter id="glow">
                                <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" 
                              fill="url(#heartGradient)" filter="url(#glow)" />
                    </svg>
                    <!-- Shine reflection -->
                    <div class="absolute top-4 right-8 w-6 h-6 bg-white/40 blur-md rounded-full"></div>
                </div>
            </div>

            <div class="glass-panel p-8 rounded-3xl text-center w-full max-w-sm animate-float">
                <h1 class="font-hand text-4xl text-rose-200 mb-2 tracking-wide">My Love</h1>
                <p class="text-rose-100/70 text-sm font-light leading-relaxed mb-6">Even when miles apart, my heart beats only for you.</p>
                <button onclick="goToStage('stage-ldr')" class="group px-6 py-3 bg-gradient-to-r from-rose-500 to-rose-600 rounded-full font-medium shadow-lg shadow-rose-900/50 hover:shadow-rose-900/80 transition-all hover:-translate-y-1 w-full flex items-center justify-center gap-2">
                    <span class="tracking-wide text-sm">Begin Journey</span>
                    <span class="iconify group-hover:translate-x-1 transition-transform" data-icon="lucide:arrow-right"></span>
                </button>
            </div>
        </section>

        <!-- STAGE 2: LDR CONNECTION -->
        <section id="stage-ldr" class="hidden flex-col items-center w-full max-w-md">
            <div class="glass-panel w-full p-8 rounded-3xl mb-4 relative overflow-hidden">
                <h2 class="text-center font-medium text-rose-100 mb-8 tracking-tight">Connecting Hearts...</h2>
                
                <!-- Map Viz -->
                <div class="h-32 w-full relative mb-6">
                    <!-- Point A -->
                    <div class="absolute left-[10%] top-[40%] flex flex-col items-center z-10">
                        <div class="w-3 h-3 bg-white rounded-full animate-ping absolute opacity-50"></div>
                        <div class="w-3 h-3 bg-white rounded-full relative shadow-[0_0_10px_white]"></div>
                        <span class="text-[10px] mt-2 text-slate-400 font-medium">Me</span>
                    </div>
                    <!-- Point B -->
                    <div class="absolute right-[10%] top-[40%] flex flex-col items-center z-10">
                        <div class="w-3 h-3 bg-rose-400 rounded-full animate-ping absolute opacity-50"></div>
                        <div class="w-3 h-3 bg-rose-400 rounded-full relative shadow-[0_0_10px_#fb7185]"></div>
                        <span class="text-[10px] mt-2 text-rose-300 font-medium">You</span>
                    </div>
                    <!-- Connection Line (SVG) -->
                    <svg class="absolute inset-0 w-full h-full pointer-events-none">
                        <path id="connection-line" d="M50,45 Q150,-10 270,45" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" class="opacity-50" />
                        <path id="active-line" d="M50,45 Q150,-10 270,45" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="300" stroke-dashoffset="300" />
                    </svg>
                    <!-- Plane Icon -->
                    <div id="plane" class="absolute left-[10%] top-[40%] -ml-3 -mt-3 text-white transition-all duration-[2000ms] ease-in-out opacity-0">
                        <span class="iconify rotate-45" data-icon="lucide:plane" data-width="24"></span>
                    </div>
                </div>

                <button onclick="connectHearts()" id="connect-btn" class="w-full py-3 border border-rose-500/30 text-rose-300 rounded-xl hover:bg-rose-500/10 transition-colors text-sm font-medium">
                    Bridge the Distance
                </button>
            </div>
        </section>

        <!-- STAGE 3: DO YOU KNOW (What I Like) -->
        <section id="stage-know" class="hidden flex-col items-center w-full max-w-md">
            <div class="mb-4">
                <span class="text-xs font-semibold tracking-widest text-purple-300 uppercase">Do you know?</span>
            </div>
            
            <div id="card-stack" class="relative w-full h-64">
                <!-- Dynamic Content via JS -->
            </div>

            <div class="flex gap-4 mt-6 w-full">
                <button onclick="nextReason()" class="flex-1 py-3 bg-white text-slate-900 rounded-full font-medium text-sm shadow-lg hover:bg-rose-50 transition-colors">
                    Next <span class="ml-1">→</span>
                </button>
            </div>
        </section>

        <!-- STAGE 4: LANTERN WISH (Rapunzel Scene) -->
        <section id="stage-lantern" class="hidden flex-col items-center w-full max-w-md text-center">
            <h2 class="font-hand text-3xl text-amber-200 mb-2">Make a Wish</h2>
            <p class="text-slate-300 text-xs mb-8">Tap the lantern to release it to me.</p>

            <div class="relative h-64 w-full flex items-end justify-center pb-4">
                <!-- Boat Graphic -->
                <div class="absolute bottom-0 w-32 h-8 bg-slate-800 rounded-b-full border-b border-slate-700 z-10 flex justify-center items-center">
                    <div class="w-24 h-1 bg-slate-900/50 absolute top-1 rounded-full"></div>
                </div>
                <!-- Interactive Lantern -->
                <div id="main-lantern" onclick="releaseLantern()" class="cursor-pointer relative z-20 transition-transform duration-300 hover:scale-105 group">
                    <div class="w-16 h-24 bg-gradient-to-b from-amber-100 via-amber-400 to-orange-500 rounded-t-xl rounded-b-md shadow-[0_0_30px_rgba(251,191,36,0.6)] flex items-center justify-center relative">
                        <!-- Glow -->
                        <div class="absolute inset-0 bg-amber-300 blur-xl opacity-20 group-hover:opacity-40 transition-opacity"></div>
                        <span class="iconify text-amber-900/50" data-icon="lucide:flame" data-width="24"></span>
                    </div>
                </div>
                <!-- Water Reflection -->
                <div class="absolute -bottom-4 w-full h-4 bg-gradient-to-b from-slate-800/50 to-transparent blur-sm"></div>
            </div>
        </section>

        <!-- STAGE 5: FINAL (Magical Flower) -->
        <section id="stage-final" class="hidden flex-col items-center justify-center text-center w-full max-w-md">
            
            <!-- Magical Flower SVG -->
            <div class="relative w-72 h-72 mb-8 flex items-center justify-center">
                <!-- Aura -->
                <div class="absolute w-56 h-56 bg-pink-500/20 rounded-full blur-[80px] animate-pulse"></div>
                
                <svg viewBox="0 0 200 200" class="w-full h-full overflow-visible bloomed" id="final-flower">
                    <defs>
                        <linearGradient id="petalGradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#fff1f2" />
                            <stop offset="50%" stop-color="#fda4af" />
                            <stop offset="100%" stop-color="#e11d48" />
                        </linearGradient>
                        <filter id="softGlow">
                            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <g transform="translate(100,100)">
                        <!-- Layer 1 (Outer) -->
                        <g class="flower-layer layer-1">
                            <path d="M0,0 C-40,-50 -50,-80 0,-90 C50,-80 40,-50 0,0" fill="url(#petalGradient)" opacity="0.9" transform="rotate(0) scale(1)"/>
                            <path d="M0,0 C-40,-50 -50,-80 0,-90 C50,-80 40,-50 0,0" fill="url(#petalGradient)" opacity="0.9" transform="rotate(60) scale(1)"/>
                            <path d="M0,0 C-40,-50 -50,-80 0,-90 C50,-80 40,-50 0,0" fill="url(#petalGradient)" opacity="0.9" transform="rotate(120) scale(1)"/>
                            <path d="M0,0 C-40,-50 -50,-80 0,-90 C50,-80 40,-50 0,0" fill="url(#petalGradient)" opacity="0.9" transform="rotate(180) scale(1)"/>
                            <path d="M0,0 C-40,-50 -50,-80 0,-90 C50,-80 40,-50 0,0" fill="url(#petalGradient)" opacity="0.9" transform="rotate(240) scale(1)"/>
                            <path d="M0,0 C-40,-50 -50,-80 0,-90 C50,-80 40,-50 0,0" fill="url(#petalGradient)" opacity="0.9" transform="rotate(300) scale(1)"/>
                        </g>
                        
                        <!-- Layer 2 (Middle) -->
                        <g class="flower-layer layer-2">
                             <path d="M0,0 C-30,-40 -40,-60 0,-70 C40,-60 30,-40 0,0" fill="url(#petalGradient)" opacity="0.95" transform="rotate(30) scale(0.8)"/>
                             <path d="M0,0 C-30,-40 -40,-60 0,-70 C40,-60 30,-40 0,0" fill="url(#petalGradient)" opacity="0.95" transform="rotate(90) scale(0.8)"/>
                             <path d="M0,0 C-30,-40 -40,-60 0,-70 C40,-60 30,-40 0,0" fill="url(#petalGradient)" opacity="0.95" transform="rotate(150) scale(0.8)"/>
                             <path d="M0,0 C-30,-40 -40,-60 0,-70 C40,-60 30,-40 0,0" fill="url(#petalGradient)" opacity="0.95" transform="rotate(210) scale(0.8)"/>
                             <path d="M0,0 C-30,-40 -40,-60 0,-70 C40,-60 30,-40 0,0" fill="url(#petalGradient)" opacity="0.95" transform="rotate(270) scale(0.8)"/>
                             <path d="M0,0 C-30,-40 -40,-60 0,-70 C40,-60 30,-40 0,0" fill="url(#petalGradient)" opacity="0.95" transform="rotate(330) scale(0.8)"/>
                        </g>

                         <!-- Layer 3 (Inner) -->
                        <g class="flower-layer layer-3">
                             <path d="M0,0 C-20,-30 -25,-45 0,-50 C25,-45 20,-30 0,0" fill="#fb7185" transform="rotate(0) scale(0.6)"/>
                             <path d="M0,0 C-20,-30 -25,-45 0,-50 C25,-45 20,-30 0,0" fill="#fb7185" transform="rotate(72) scale(0.6)"/>
                             <path d="M0,0 C-20,-30 -25,-45 0,-50 C25,-45 20,-30 0,0" fill="#fb7185" transform="rotate(144) scale(0.6)"/>
                             <path d="M0,0 C-20,-30 -25,-45 0,-50 C25,-45 20,-30 0,0" fill="#fb7185" transform="rotate(216) scale(0.6)"/>
                             <path d="M0,0 C-20,-30 -25,-45 0,-50 C25,-45 20,-30 0,0" fill="#fb7185" transform="rotate(288) scale(0.6)"/>
                        </g>

                        <!-- Center Core -->
                        <g class="flower-layer center-core">
                            <circle r="8" fill="#fef9c3" filter="url(#softGlow)" />
                            <circle r="4" fill="#fcd34d" opacity="0.8" />
                        </g>
                    </g>
                </svg>
            </div>

            <div class="glass-panel p-8 rounded-2xl border-white/5 shadow-2xl animate-float">
                <h1 class="font-hand text-4xl text-transparent bg-clip-text bg-gradient-to-r from-rose-200 via-pink-300 to-purple-200 mb-4 leading-tight">
                    I Love You
                </h1>
                
                <p class="text-slate-300 text-sm font-light leading-relaxed opacity-90 max-w-xs mx-auto mb-6">
                    "This flower might not be real and just virtual, but my love is real."
                </p>

                <div class="grid grid-cols-2 gap-3 w-full">
                    <button class="py-3 px-4 bg-white/5 hover:bg-white/10 rounded-xl flex items-center justify-center gap-2 transition-colors border border-white/5" onclick="alert('Virtual Hug Sent! 🫂')">
                        <span class="iconify text-rose-300" data-icon="lucide:smile"></span>
                        <span class="text-xs font-medium">Send Hug</span>
                    </button>
                    <button class="py-3 px-4 bg-white/5 hover:bg-white/10 rounded-xl flex items-center justify-center gap-2 transition-colors border border-white/5" onclick="alert('Virtual Kiss Sent! 💋')">
                        <span class="iconify text-rose-300" data-icon="lucide:heart"></span>
                        <span class="text-xs font-medium">Send Kiss</span>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        // --- Setup Background ---
        const starContainer = document.getElementById('stars-container');
        const lanternContainer = document.getElementById('lanterns-container');

        // Create Static Stars
        for(let i=0; i<100; i++) {
            const s = document.createElement('div');
            s.className = 'star animate-twinkle';
            s.style.width = Math.random() * 2 + 1 + 'px';
            s.style.height = s.style.width;
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.animationDelay = Math.random() * 5 + 's';
            s.style.opacity = Math.random();
            starContainer.appendChild(s);
        }

        // Shooting Star Logic
        setInterval(() => {
            const shoot = document.createElement('div');
            shoot.className = 'shooting-star';
            shoot.style.top = Math.random() * 50 + '%';
            shoot.style.left = Math.random() * 100 + '%';
            shoot.style.animation = 'shoot 2s linear forwards';
            starContainer.appendChild(shoot);
            setTimeout(() => shoot.remove(), 2000);
        }, 4000);

        // Background Lanterns
        function createBgLantern() {
            const l = document.createElement('div');
            l.className = 'lantern-bg animate-rise';
            const size = Math.random() * 10 + 4;
            l.style.width = size + 'px';
            l.style.height = (size * 1.5) + 'px';
            l.style.left = Math.random() * 100 + '%';
            l.style.animationDuration = (Math.random() * 10 + 15) + 's';
            l.style.opacity = Math.random() * 0.5 + 0.2;
            lanternContainer.appendChild(l);
            
            setTimeout(() => l.remove(), 25000); 
        }
        setInterval(createBgLantern, 2000);

        // --- Navigation Logic ---
        function goToStage(id) {
            document.querySelectorAll('section').forEach(el => {
                if(!el.classList.contains('hidden')) {
                    el.style.opacity = '0';
                    setTimeout(() => el.classList.add('hidden'), 500);
                }
            });
            
            const next = document.getElementById(id);
            setTimeout(() => {
                next.classList.remove('hidden');
                next.classList.add('flex'); 
                void next.offsetWidth; 
                next.style.opacity = '1';
                
                if(id === 'stage-know') initCardStack();
                if(id === 'stage-final') triggerFlowerBloom();
            }, 500);
        }

        function triggerFlowerBloom() {
            // Reset animation
            const flower = document.getElementById('final-flower');
            flower.classList.remove('bloomed');
            void flower.offsetWidth;
            flower.classList.add('bloomed');
        }

        // --- Stage 2: LDR Connect ---
        function connectHearts() {
            const line = document.getElementById('active-line');
            const plane = document.getElementById('plane');
            
            line.style.transition = 'stroke-dashoffset 2s ease-in-out';
            line.style.strokeDashoffset = '0';
            
            plane.style.opacity = '1';
            plane.style.transition = 'all 2s ease-in-out';
            plane.style.left = '90%'; 
            plane.style.top = '40%'; 

            document.getElementById('connect-btn').innerText = "Connected ❤️";
            document.getElementById('connect-btn').classList.add('bg-rose-500/20', 'border-rose-500');

            setTimeout(() => {
                confetti({
                    particleCount: 60,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#f43f5e', '#fb7185']
                });
                setTimeout(() => goToStage('stage-know'), 1500);
            }, 2100);
        }

        // --- Stage 3: Do You Know Cards ---
        const reasons = [
            { text: "Your smile lights up my darkest nights.", icon: "lucide:sun" },
            { text: "Even across the distance, I feel your warmth.", icon: "lucide:flame" },
            { text: "I love how strong you are for both of us.", icon: "lucide:shield" },
            { text: "Hearing your voice is my favorite sound.", icon: "lucide:mic" },
            { text: "I'm counting down the seconds to hold you.", icon: "lucide:clock" }
        ];
        let cardIndex = 0;

        function initCardStack() {
            renderCard(0);
        }

        function renderCard(index) {
            const container = document.getElementById('card-stack');
            const content = reasons[index];
            
            const html = `
                <div class="absolute inset-0 glass-panel rounded-3xl p-8 flex flex-col items-center justify-center text-center transition-all duration-500 transform animate-in fade-in slide-in-from-bottom-4">
                    <div class="w-12 h-12 bg-rose-500/20 rounded-full flex items-center justify-center mb-4 text-rose-300">
                        <span class="iconify" data-icon="${content.icon}" data-width="24"></span>
                    </div>
                    <p class="text-lg font-medium text-slate-100 leading-snug">"${content.text}"</p>
                    <span class="absolute bottom-6 text-xs text-slate-500 font-mono">${index + 1} / ${reasons.length}</span>
                </div>
            `;
            container.innerHTML = html;
        }

        function nextReason() {
            if (cardIndex < reasons.length - 1) {
                cardIndex++;
                renderCard(cardIndex);
            } else {
                goToStage('stage-lantern');
            }
        }

        // --- Stage 4: Lantern Release ---
        function releaseLantern() {
            const lantern = document.getElementById('main-lantern');
            
            lantern.style.transition = "all 3s ease-in";
            lantern.style.transform = "translateY(-600px) scale(0.5)";
            lantern.style.opacity = "0";

            confetti({
                particleCount: 50,
                spread: 60,
                origin: { y: 0.8 },
                colors: ['#fbbf24', '#f59e0b'],
                shapes: ['circle'],
                scalar: 0.8
            });

            setTimeout(() => {
                goToStage('stage-final');
                setInterval(createBgLantern, 200); 
            }, 1500);
        }

        // --- Audio Control ---
        const audio = document.getElementById('bg-music');
        const btn = document.getElementById('music-toggle');
        let playing = false;
        
        btn.addEventListener('click', () => {
            if(!playing) {
                audio.volume = 0.4;
                audio.play();
                btn.innerHTML = '<span class="iconify animate-spin" data-icon="lucide:disc-3" data-width="20"></span>';
                btn.classList.add('bg-rose-500', 'border-rose-500', 'text-white');
                btn.classList.remove('bg-white/10');
            } else {
                audio.pause();
                btn.innerHTML = '<span class="iconify" data-icon="lucide:music" data-width="20"></span>';
                btn.classList.remove('bg-rose-500', 'border-rose-500', 'text-white', 'animate-spin');
                btn.classList.add('bg-white/10');
            }
            playing = !playing;
        });
