    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple-Style Toggle Switches</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .toggle-checkbox:checked {
            right: 0;
            border-color: #68D391;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #68D391;
        }
        .toggle-checkbox {
            transition: all 0.3s ease-in-out;
        }
        .toggle-label {
            transition: background-color 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-semibold text-gray-800 mb-6">Settings</h1>
        
        <div class="space-y-6">
            <!-- Toggle 1 -->
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-gray-800 font-medium">Airplane Mode</h2>
                    <p class="text-gray-500 text-sm">Disable wireless connections</p>
                </div>
                <div class="relative">
                    <input type="checkbox" id="toggle1" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-gray-300 appearance-none cursor-pointer focus:outline-none" />
                    <label for="toggle1" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer w-12"></label>
                </div>
            </div>
            
            <!-- Toggle 2 -->
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-gray-800 font-medium">Wi-Fi</h2>
                    <p class="text-gray-500 text-sm">Connected to Home Network</p>
                </div>
                <div class="relative">
                    <input type="checkbox" id="toggle2" checked class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-gray-300 appearance-none cursor-pointer focus:outline-none" />
                    <label for="toggle2" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer w-12"></label>
                </div>
            </div>
            
            <!-- Toggle 3 -->
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-gray-800 font-medium">Bluetooth</h2>
                    <p class="text-gray-500 text-sm">Discoverable to nearby devices</p>
                </div>
                <div class="relative">
                    <input type="checkbox" id="toggle3" checked class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-gray-300 appearance-none cursor-pointer focus:outline-none" />
                    <label for="toggle3" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer w-12"></label>
                </div>
            </div>
            
            <!-- Toggle 4 -->
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-gray-800 font-medium">Do Not Disturb</h2>
                    <p class="text-gray-500 text-sm">Silence notifications</p>
                </div>
                <div class="relative">
                    <input type="checkbox" id="toggle4" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-gray-300 appearance-none cursor-pointer focus:outline-none" />
                    <label for="toggle4" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer w-12"></label>
                </div>
            </div>
            
            <!-- Toggle 5 -->
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-gray-800 font-medium">Dark Mode</h2>
                    <p class="text-gray-500 text-sm">Use dark system appearance</p>
                </div>
                <div class="relative">
                    <input type="checkbox" id="toggle5" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-gray-300 appearance-none cursor-pointer focus:outline-none" />
                    <label for="toggle5" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer w-12"></label>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Add toggle sound effect (optional)
        const toggles = document.querySelectorAll('.toggle-checkbox');
        toggles.forEach(toggle => {
            toggle.addEventListener('change', () => {
                // You could add a subtle click sound here
                console.log(`Toggle switched: ${toggle.id} is now ${toggle.checked ? 'ON' : 'OFF'}`);
            });
        });
    </script>
</body>
</html>
