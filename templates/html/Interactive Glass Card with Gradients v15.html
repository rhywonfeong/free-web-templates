<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Dual Gradients – Glass Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@100;400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',ui-sans-serif,system-ui;background:#0f172a;}
    .gradient-wrap{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
    .gradient,.gradient-white{position:absolute;width:200%;height:200%;left:-50%;top:-50%;transition:background .08s;}
    .gradient{background:radial-gradient(circle at var(--x,50%) var(--y,50%),#3b82f6 0%,rgba(59,130,246,0) 60%);filter:blur(80px) saturate(1.4);}
    .gradient-white{background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.8) 0%,rgba(255,255,255,0) 60%);filter:blur(120px) saturate(1.1);mix-blend-mode:overlay;}
    .card{position:relative;z-index:1;width:20rem;height:12rem;background:rgba(255,255,255,.12);backdrop-filter:blur(16px) saturate(2);-webkit-backdrop-filter:blur(16px) saturate(2);border-radius:1.25rem;transform:rotate(52.5deg);}
    .card::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(125deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,0) 60%);opacity:.25;}
    @media(max-width:420px){.card{width:18rem;height:10rem;}}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Manrope&display=swap" rel="stylesheet">
  <style>
      /* Custom font utilities */
      .font-manrope { font-family: 'Manrope', sans-serif !important; }
    </style>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center gap-12 relative overflow-hidden px-4">
  <div class="gradient-wrap" aria-hidden="true">
    <div class="gradient"></div>
    <div class="gradient-white"></div>
  </div>

  <h1 class="relative z-10 text-white text-[96px] leading-none font-thin tracking-tight font-['Manrope',_sans-serif]" tabindex="-1">
    Explore&nbsp;Possibilities
  </h1>

  <div class="card focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-400" tabindex="0" aria-label="Decorative glass card with dual gradients"></div>

  <script>
    const gradients = document.querySelectorAll('.gradient, .gradient-white');
    window.addEventListener('pointermove', e=>{
      const x = (e.clientX / innerWidth) * 100;
      const y = (e.clientY / innerHeight) * 100;
      gradients.forEach(g=>{
        g.style.setProperty('--x', `${x}%`);
        g.style.setProperty('--y', `${y}%`);
      });
    },{passive:true});
  </script>
</body>
</html>
