  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Material Onboarding</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f5f7fa;
    }
    .option-btn.selected {
      background-color: #f0f4ff;
      border-color: #6366f1;
      color: #6366f1;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gray-50">
  <div class="w-full max-w-4xl bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow duration-300 overflow-hidden">
    <div class="p-6 md:p-8">
      <!-- Header -->
      <div class="flex justify-between items-center mb-8">
        <div class="text-xl font-medium text-gray-800">Material</div>
        <button class="text-sm text-indigo-600 hover:text-indigo-800 transition-colors font-medium">Skip</button>
      </div>
      
      <!-- Content -->
      <div class="grid md:grid-cols-2 gap-8 items-center">
        <!-- Left: Image -->
        <div class="order-2 md:order-1 flex justify-center">
          <div class="relative w-full max-w-md aspect-square rounded-lg overflow-hidden bg-indigo-50 flex items-center justify-center">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80" alt="Onboarding visual" class="w-full h-full object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-indigo-900/30 to-transparent"></div>
          </div>
        </div>
        
        <!-- Right: Form -->
        <div class="order-1 md:order-2">
          <div class="flex space-x-2 mb-6">
            <div class="h-1 w-8 rounded-full bg-indigo-600"></div>
            <div class="h-1 w-6 rounded-full bg-gray-200"></div>
            <div class="h-1 w-6 rounded-full bg-gray-200"></div>
            <div class="h-1 w-6 rounded-full bg-gray-200"></div>
          </div>
          
          <h1 class="text-2xl md:text-3xl font-light mb-4 text-gray-800">Discover your creative <span class="font-medium">potential</span></h1>
          
          <p class="text-gray-600 mb-6 text-base">
            Welcome to a new way of bringing your ideas to life. Our platform helps you transform concepts into reality.
          </p>
          
          <!-- Form -->
          <div class="space-y-5 mb-6">
            <div>
              <label class="block text-gray-700 text-sm font-medium mb-2">What should we call you?</label>
              <input 
                type="text" 
                class="w-full bg-gray-50 border border-gray-200 rounded-md px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500"
                placeholder="Your name"
                id="userName"
              />
            </div>
            
            <div>
              <label class="block text-gray-700 text-sm font-medium mb-2">What brings you here today?</label>
              <div class="grid grid-cols-2 gap-2" id="options-container">
                <button class="option-btn text-left px-4 py-3 border border-gray-200 rounded-md bg-white hover:bg-gray-50 transition-colors" data-value="personal">
                  <span class="text-sm font-medium text-gray-800">Personal projects</span>
                </button>
                <button class="option-btn text-left px-4 py-3 border border-gray-200 rounded-md bg-white hover:bg-gray-50 transition-colors" data-value="work">
                  <span class="text-sm font-medium text-gray-800">Work & business</span>
                </button>
                <button class="option-btn text-left px-4 py-3 border border-gray-200 rounded-md bg-white hover:bg-gray-50 transition-colors" data-value="education">
                  <span class="text-sm font-medium text-gray-800">Education</span>
                </button>
                <button class="option-btn text-left px-4 py-3 border border-gray-200 rounded-md bg-white hover:bg-gray-50 transition-colors" data-value="exploring">
                  <span class="text-sm font-medium text-gray-800">Just exploring</span>
                </button>
              </div>
              <input type="hidden" id="selectedOption" value="">
            </div>
          </div>
          
          <!-- Navigation -->
          <div class="flex space-x-3">
            <button id="continueBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded-md py-2.5 font-medium transition-colors opacity-50 cursor-not-allowed">
              Continue
            </button>
            <button class="w-10 flex items-center justify-center bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-md">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>
          
          <!-- Terms notice moved below the second column -->
          <div class="mt-6 text-gray-500 text-xs">
            <p>By continuing, you agree to our <a href="#" class="text-indigo-600 hover:underline">Terms of Service</a> and <a href="#" class="text-indigo-600 hover:underline">Privacy Policy</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // Handle option selection
    const optionButtons = document.querySelectorAll('.option-btn');
    const selectedOptionInput = document.getElementById('selectedOption');
    const continueBtn = document.getElementById('continueBtn');
    const userName = document.getElementById('userName');
    
    function checkFormValidity() {
      if (userName.value.trim() !== '' && selectedOptionInput.value !== '') {
        continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      } else {
        continueBtn.classList.add('opacity-50', 'cursor-not-allowed');
      }
    }
    
    optionButtons.forEach(button => {
      button.addEventListener('click', () => {
        optionButtons.forEach(btn => btn.classList.remove('selected'));
        button.classList.add('selected');
        selectedOptionInput.value = button.dataset.value;
        checkFormValidity();
      });
    });
    
    userName.addEventListener('input', checkFormValidity);
    
    continueBtn.addEventListener('click', () => {
      if (userName.value.trim() !== '' && selectedOptionInput.value !== '') {
        alert(`Thanks, ${userName.value}! You selected: ${selectedOptionInput.value}`);
      }
    });
  </script>
</body>
</html>
