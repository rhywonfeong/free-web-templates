<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" />
<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover"
/>
<title>Inbox • Health</title>
<meta name="color-scheme" content="light dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap"
rel="stylesheet"
/>
<script src="https://cdn.tailwindcss.com"></script></head>
  <body
    class="antialiased bg-slate-50 text-slate-800 selection:bg-slate-900 selection:text-white dark:bg-slate-950 dark:text-slate-100"
    style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;"
  >
    <div class="pointer-events-none fixed inset-0 opacity-[0.6]">
      <div class="absolute inset-0 bg-[radial-gradient(900px_300px_at_50%_-100px,rgba(30,64,175,0.05),transparent)] dark:bg-[radial-gradient(900px_300px_at_50%_-100px,rgba(148,163,184,0.08),transparent)]"></div>
    </div>

    <div class="min-h-dvh flex items-start justify-center">
      <main class="w-full max-w-md mx-auto px-4 pt-6 pb-28 sm:pt-8">

        <!-- Top App Bar -->
        <header
          class="relative flex items-center justify-between bg-white dark:bg-slate-900 rounded-2xl shadow-sm ring-1 ring-slate-200 dark:ring-slate-800 px-4 py-3 mb-5 opacity-0 translate-y-2 transition duration-700 ease-out"
          data-animate
        >
          <button
            id="logoBtn"
            class="h-9 w-9 flex items-center justify-center rounded-xl ring-1 ring-slate-200 dark:ring-slate-800 hover:ring-slate-300 dark:hover:ring-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
            title="Home"
            aria-label="Go to Home"
          >
            <div class="h-6 w-6 rounded-md bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center text-[11px] tracking-tight">
              HC
            </div>
          </button>
          <div class="text-center">
            <h1 class="text-[18px] tracking-tight font-semibold text-slate-900 dark:text-white">Inbox</h1>
          </div>
          <div class="flex items-center gap-1.5">
            <button
              id="searchIconBtn"
              class="h-9 w-9 flex items-center justify-center rounded-xl ring-1 ring-slate-200 dark:ring-slate-800 hover:ring-slate-300 dark:hover:ring-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
              title="Search"
              aria-label="Search"
            >
              <i data-lucide="search" class="h-5 w-5 text-slate-700 dark:text-slate-200"></i>
            </button>
            <button
              id="notifBtn"
              class="relative h-9 w-9 flex items-center justify-center rounded-xl ring-1 ring-slate-200 dark:ring-slate-800 hover:ring-slate-300 dark:hover:ring-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
              title="Notifications"
              aria-label="Notifications"
            >
              <i data-lucide="bell" class="h-5 w-5 text-slate-700 dark:text-slate-200"></i>
              <span id="notifDot" class="absolute -top-0.5 -right-0.5 h-2.5 w-2.5 rounded-full bg-blue-600 ring-2 ring-white dark:ring-slate-900 hidden"></span>
            </button>
          </div>
        </header>

        <!-- Search & Filters -->
        <section
          class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm ring-1 ring-slate-200 dark:ring-slate-800 p-4 mb-5 opacity-0 translate-y-2 transition duration-700 ease-out delay-100"
          data-animate
          aria-labelledby="search-title"
        >
          <h2 id="search-title" class="sr-only">Search and filters</h2>
          <div class="flex items-center gap-2">
            <div class="relative flex-1">
              <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4.5 w-4.5 text-slate-500"></i>
              <input
                id="searchInput"
                type="search"
                class="w-full h-11 pl-10 pr-10 rounded-xl border-0 ring-1 ring-slate-200 dark:ring-slate-800 focus:ring-2 focus:ring-blue-600 bg-white dark:bg-slate-900 text-base text-slate-900 dark:text-slate-100 placeholder-slate-400 transition"
                placeholder="Search by doctor’s name or specialty"
                aria-label="Search conversations by doctor's name or specialty"
              />
              <button
                id="clearSearch"
                class="absolute right-2 top-1/2 -translate-y-1/2 h-8 w-8 rounded-lg hidden items-center justify-center ring-1 ring-slate-200 dark:ring-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
                aria-label="Clear search"
              >
                <i data-lucide="x" class="h-4 w-4 text-slate-600"></i>
              </button>
            </div>
            <div class="relative">
              <button
                id="filterBtn"
                class="h-11 px-3 rounded-xl ring-1 ring-slate-200 dark:ring-slate-800 text-slate-700 dark:text-slate-200 text-sm hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-2 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
                aria-haspopup="menu"
                aria-expanded="false"
                aria-controls="filterMenu"
                title="Filters"
              >
                <i data-lucide="filter" class="h-4.5 w-4.5"></i>
                <span id="filterLabel">All</span>
              </button>
              <div
                id="filterMenu"
                class="hidden absolute right-0 mt-2 w-56 bg-white dark:bg-slate-900 rounded-xl shadow-lg ring-1 ring-slate-200 dark:ring-slate-800 p-2 z-20"
                role="menu"
                aria-label="Filter conversations"
              >
                <button data-filter="all" class="w-full h-10 px-3 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-between">
                  <span>All</span>
                  <i data-lucide="check" class="h-4 w-4 opacity-0"></i>
                </button>
                <button data-filter="unread" class="w-full h-10 px-3 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-between">
                  <span>Unread</span>
                  <i data-lucide="check" class="h-4 w-4 opacity-0"></i>
                </button>
                <button data-filter="starred" class="w-full h-10 px-3 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-between">
                  <span>Starred</span>
                  <i data-lucide="check" class="h-4 w-4 opacity-0"></i>
                </button>
                <button data-filter="archived" class="w-full h-10 px-3 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-between">
                  <span>Archived</span>
                  <i data-lucide="check" class="h-4 w-4 opacity-0"></i>
                </button>
                <div class="my-2 h-px bg-slate-100 dark:bg-slate-800"></div>
                <button data-unread-top class="w-full h-10 px-3 rounded-lg text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-between">
                  <span>Unread on top</span>
                  <span class="inline-flex h-5 w-9 items-center rounded-full bg-slate-200 dark:bg-slate-800 relative">
                    <span id="unreadToggleKnob" class="h-4 w-4 rounded-full bg-white dark:bg-slate-700 shadow absolute left-0.5 transition-all"></span>
                  </span>
                </button>
              </div>
            </div>
          </div>

          <!-- Optional Categories -->
          <div class="mt-3 flex items-center gap-1.5">
            <button data-cat="all" class="h-8 px-3 rounded-full text-xs ring-1 ring-slate-200 dark:ring-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400">All</button>
            <button data-cat="doctors" class="h-8 px-3 rounded-full text-xs ring-1 ring-slate-200 dark:ring-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400">Doctors</button>
            <button data-cat="staff" class="h-8 px-3 rounded-full text-xs ring-1 ring-slate-200 dark:ring-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400">Staff</button>
            <button data-cat="alerts" class="h-8 px-3 rounded-full text-xs ring-1 ring-slate-200 dark:ring-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400">System Alerts</button>
          </div>
        </section>

        <!-- Conversation List -->
        <section
          class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm ring-1 ring-slate-200 dark:ring-slate-800 p-1 mb-6 opacity-0 translate-y-2 transition duration-700 ease-out delay-150"
          data-animate
          aria-labelledby="conv-title"
        >
          <h2 id="conv-title" class="sr-only">Conversations</h2>

          <div id="emptyState" class="hidden p-6 text-center">
            <img
              src="https://images.unsplash.com/photo-1621619856624-42fd193a0661?w=1080&q=80"
              alt=""
              class="mx-auto h-28 w-28 rounded-2xl object-cover ring-1 ring-slate-200 dark:ring-slate-800 mb-3 opacity-90"
            />
            <h3 class="text-[18px] tracking-tight font-semibold text-slate-900 dark:text-white">No messages yet</h3>
            <p class="text-sm text-slate-600 dark:text-slate-400 mt-1">Your conversations will appear here after you connect with a doctor.</p>
            <div class="mt-4">
              <button
                id="emptyNewMsg"
                class="h-11 px-4 rounded-xl bg-blue-600 text-white text-sm font-medium tracking-tight hover:opacity-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
              >
                Start a new message
              </button>
            </div>
          </div>

          <ul id="convList" role="list" class="divide-y divide-slate-100 dark:divide-slate-800">
            <!-- Conversation rows injected here -->
          </ul>
        </section>

        <!-- Bulk actions bar (appears in selection mode) -->
        <div id="bulkBar" class="hidden sticky bottom-4">
          <div class="mx-auto w-full max-w-md">
            <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-sm ring-1 ring-slate-200 dark:ring-slate-800 p-2 flex items-center justify-between">
              <div class="flex items-center gap-2 pl-1">
                <span id="selectedCount" class="text-sm text-slate-700 dark:text-slate-200">0 selected</span>
              </div>
              <div class="flex items-center gap-2">
                <button id="bulkRead" class="h-10 px-3 rounded-xl ring-1 ring-slate-200 dark:ring-slate-800 text-slate-700 dark:text-slate-200 text-sm hover:bg-slate-50 dark:hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400">
                  <span class="inline-flex items-center gap-2"><i data-lucide="mail-open" class="h-4 w-4"></i>Mark read</span>
                </button>
                <button id="bulkArchive" class="h-10 px-3 rounded-xl ring-1 ring-slate-200 dark:ring-slate-800 text-slate-700 dark:text-slate-200 text-sm hover:bg-slate-50 dark:hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400">
                  <span class="inline-flex items-center gap-2"><i data-lucide="archive" class="h-4 w-4"></i>Archive</span>
                </button>
                <button id="bulkDelete" class="h-10 px-3 rounded-xl bg-rose-600 text-white text-sm font-medium tracking-tight hover:opacity-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-rose-400">
                  <span class="inline-flex items-center gap-2"><i data-lucide="trash-2" class="h-4 w-4"></i>Delete</span>
                </button>
                <button id="bulkCancel" class="h-10 px-3 rounded-xl ring-1 ring-slate-200 dark:ring-slate-800 text-slate-700 dark:text-slate-200 text-sm hover:bg-slate-50 dark:hover:bg-slate-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400">
                  Cancel
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- FAB -->
        <div id="fabWrap" class="fixed right-4 bottom-4 sm:right-6 sm:bottom-6">
          <button
            id="newMsgBtn"
            class="h-12 px-4 rounded-xl bg-blue-600 text-white text-sm font-medium tracking-tight shadow-lg hover:opacity-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400 inline-flex items-center gap-2"
            aria-label="New message"
            title="New Message"
          >
            <i data-lucide="message-square-plus" class="h-5 w-5"></i>
            New Message
          </button>
        </div>

        <!-- Spacer -->
        <div class="h-4"></div>
      </main>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      // Icons
      function paintIcons(root = document) {
        lucide.createIcons({ attrs: { 'stroke-width': 1.5 }, node: root });
      }

      // Reveal animations
      function reveal() {
        document.querySelectorAll('[data-animate]').forEach((el, idx) => {
          requestAnimationFrame(() => {
            el.classList.remove('opacity-0', 'translate-y-2');
            el.classList.add('opacity-100', 'translate-y-0');
          });
        });
      }

      // Utility: relative time
      function relativeTime(ts) {
        const now = Date.now();
        const diff = Math.max(0, now - ts);
        const sec = Math.round(diff / 1000);
        const min = Math.round(sec / 60);
        const hr = Math.round(min / 60);
        const day = Math.round(hr / 24);
        const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
        if (sec < 45) return rtf.format(-sec, 'seconds');
        if (min < 45) return rtf.format(-min, 'minutes');
        if (hr < 24) return rtf.format(-hr, 'hours');
        if (day <= 7) return rtf.format(-day, 'days');
        const d = new Date(ts);
        const opts = { month: 'short', day: 'numeric' };
        if (d.getFullYear() !== new Date().getFullYear()) opts['year'] = 'numeric';
        return d.toLocaleDateString(undefined, opts);
      }

      // State
      const state = {
        search: '',
        filter: 'all', // all | unread | starred | archived
        category: 'all', // all | doctors | staff | alerts
        unreadOnTop: true,
        selectionMode: false,
        selected: new Set(),
        conversations: [
          {
            id: '1',
            name: 'Dr. Sarah Khan',
            specialty: 'Dermatologist',
            avatar: 'https://images.unsplash.com/photo-1550831107-1553da8c8464?q=80&w=800&auto=format&fit=crop',
            lastMessage: 'Please continue the ointment for 7 days and avoid direct sun exposure.',
            ts: Date.now() - 1000 * 60 * 60 * 2, // 2h ago
            unread: 2,
            pinned: true,
            starred: true,
            type: 'doctors',
            archived: false,
            receipt: 'read' // sent | delivered | read
          },
          {
            id: '2',
            name: 'Clinic Front Desk',
            specialty: 'Reception',
            avatar: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=800&auto=format&fit=crop',
            lastMessage: 'Your lab reports are ready for download. Let us know if you have questions.',
            ts: Date.now() - 1000 * 60 * 50, // 50m ago
            unread: 0,
            pinned: false,
            starred: false,
            type: 'staff',
            archived: false,
            receipt: 'delivered'
          },
          {
            id: '3',
            name: 'Dr. Meera Kapoor',
            specialty: 'Cardiologist',
            avatar: 'https://images.unsplash.com/photo-1550534791-2677533605a1?q=80&w=800&auto=format&fit=crop',
            lastMessage: 'How are you feeling after the new dosage? Any dizziness or fatigue?',
            ts: Date.now() - 1000 * 60 * 60 * 26, // ~1d ago
            unread: 1,
            pinned: false,
            starred: false,
            type: 'doctors',
            archived: false,
            receipt: 'sent'
          },
          {
            id: '4',
            name: 'Health System',
            specialty: 'System Alert',
            avatar: 'https://images.unsplash.com/photo-1611162618071-b39a2ec1f9ff?q=80&w=800&auto=format&fit=crop',
            lastMessage: 'Your appointment with Dr. Rao has been confirmed for Sep 12, 10:30 AM.',
            ts: Date.now() - 1000 * 60 * 60 * 50,
            unread: 0,
            pinned: false,
            starred: false,
            type: 'alerts',
            archived: false,
            receipt: 'delivered'
          },
          {
            id: '5',
            name: 'Dr. Luis Ortega',
            specialty: 'Orthopedic Surgeon',
            avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=800&auto=format&fit=crop',
            lastMessage: 'X-ray looks good. Start light mobility exercises—sharing a guide shortly.',
            ts: Date.now() - 1000 * 60 * 5, // 5m
            unread: 0,
            pinned: false,
            starred: true,
            type: 'doctors',
            archived: false,
            receipt: 'read'
          },
          {
            id: '6',
            name: 'Nursing Team',
            specialty: 'Care Coordination',
            avatar: 'https://images.unsplash.com/photo-1551836022-d5d88e9218df?q=80&w=800&auto=format&fit=crop',
            lastMessage: 'Checking in about your home BP readings this week.',
            ts: Date.now() - 1000 * 60 * 60 * 5,
            unread: 3,
            pinned: false,
            starred: false,
            type: 'staff',
            archived: false,
            receipt: 'delivered'
          },
          {
            id: '7',
            name: 'Dr. Aisha Noor',
            specialty: 'Pediatrician',
            avatar: 'https://images.unsplash.com/photo-1547425260-76bcadfb4f2c?q=80&w=800&auto=format&fit=crop',
            lastMessage: 'Happy to hear the fever resolved. Keep monitoring fluids.',
            ts: Date.now() - 1000 * 60 * 60 * 72,
            unread: 0,
            pinned: false,
            starred: false,
            type: 'doctors',
            archived: true,
            receipt: 'read'
          }
        ]
      };

      // DOM refs
      const convList = document.getElementById('convList');
      const emptyState = document.getElementById('emptyState');
      const filterBtn = document.getElementById('filterBtn');
      const filterMenu = document.getElementById('filterMenu');
      const filterLabel = document.getElementById('filterLabel');
      const searchInput = document.getElementById('searchInput');
      const searchIconBtn = document.getElementById('searchIconBtn');
      const clearSearch = document.getElementById('clearSearch');
      const notifDot = document.getElementById('notifDot');

      const bulkBar = document.getElementById('bulkBar');
      const selectedCount = document.getElementById('selectedCount');
      const bulkCancel = document.getElementById('bulkCancel');
      const bulkArchive = document.getElementById('bulkArchive');
      const bulkDelete = document.getElementById('bulkDelete');
      const bulkRead = document.getElementById('bulkRead');

      const fabWrap = document.getElementById('fabWrap');
      const newMsgBtn = document.getElementById('newMsgBtn');
      const emptyNewMsg = document.getElementById('emptyNewMsg');

      // Categories
      const catButtons = Array.from(document.querySelectorAll('[data-cat]'));

      // Init
      document.addEventListener('DOMContentLoaded', () => {
        paintIcons(document);
        reveal();
        initFilters();
        render();
        updateNotifDot();
        // Focus search from top icon
        searchIconBtn.addEventListener('click', () => searchInput.focus());
      });

      function updateNotifDot() {
        const hasUnread = state.conversations.some(c => !c.archived && c.unread > 0);
        notifDot.classList.toggle('hidden', !hasUnread);
      }

      // Filter dropdown
      function initFilters() {
        filterBtn.addEventListener('click', () => {
          const expanded = filterBtn.getAttribute('aria-expanded') === 'true';
          filterBtn.setAttribute('aria-expanded', String(!expanded));
          filterMenu.classList.toggle('hidden', expanded);
        });
        document.addEventListener('click', (e) => {
          if (!filterMenu.contains(e.target) && !filterBtn.contains(e.target)) {
            filterBtn.setAttribute('aria-expanded', 'false');
           Menu.classList.add('hidden');
          }
        });
        filterMenu.querySelectorAll('button[data-filter]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.filter = btn.dataset.filter;
            filterLabel.textContent = btn.textContent.trim();
            filterBtn.setAttribute('aria-expanded', 'false');
            filterMenu.classList.add('hidden');
            render();
          });
        });
        // Unread on top toggle
        filterMenu.querySelector('[data-unread-top]').addEventListener('click', () => {
          state.unreadOnTop = !state.unreadOnTop;
          const knob = document.getElementById('unreadToggleKnob');
          knob.style.left = state.unreadOnTop ? '1.25rem' : '0.125rem';
          render();
        });

        // Categories
        catButtons.forEach(btn => {
          btn.addEventListener('click', () => {
            state.category = btn.dataset.cat;
            catButtons.forEach(b => b.classList.remove('bg-blue-50','dark:bg-slate-800/60','text-blue-700','dark:text-blue-400','ring-blue-200','dark:ring-slate-700'));
            btn.classList.add('bg-blue-50','dark:bg-slate-800/60','text-blue-700','dark:text-blue-400','ring-blue-200','dark:ring-slate-700');
            render();
          });
        });
        // Set default selected style
        const defaultCat = catButtons.find(b => b.dataset.cat === 'all');
        if (defaultCat) defaultCat.click();
      }

      // Search
      searchInput.addEventListener('input', () => {
        state.search = searchInput.value;
        clearSearch.classList.toggle('hidden', !state.search);
        render();
      });
      clearSearch.addEventListener('click', () => {
        searchInput.value = '';
        state.search = '';
        clearSearch.classList.add('hidden');
        render();
        searchInput.focus();
      });

      // FAB and empty state button
      function startNewMessage() {
        alert('Open doctor search to start a secure conversation.');
      }
      newMsgBtn.addEventListener('click', startNewMessage);
      emptyNewMsg.addEventListener('click', startNewMessage);

      // Selection mode controls
      function enterSelection(id) {
        state.selectionMode = true;
        state.selected.add(id);
        bulkBar.classList.remove('hidden');
        fabWrap.classList.add('hidden');
        updateSelectedCount();
        render(); // re-render to show checkboxes
      }
      function exitSelection() {
        state.selectionMode = false;
        state.selected.clear();
        bulkBar.classList.add('hidden');
        fabWrap.classList.remove('hidden');
        updateSelectedCount();
        render();
      }
      function updateSelectedCount() {
        selectedCount.textContent = `${state.selected.size} selected`;
      }
      bulkCancel.addEventListener('click', exitSelection);
      bulkArchive.addEventListener('click', () => {
        state.conversations.forEach(c => {
          if (state.selected.has(c.id)) c.archived = true;
        });
        exitSelection();
      });
      bulkDelete.addEventListener('click', () => {
        if (!confirm('Delete selected conversations? This cannot be undone.')) return;
        state.conversations = state.conversations.filter(c => !state.selected.has(c.id));
        exitSelection();
      });
      bulkRead.addEventListener('click', () => {
        state.conversations.forEach(c => {
          if (state.selected.has(c.id)) c.unread = 0;
        });
        exitSelection();
      });

      // Render list
      function visibleConversations() {
        const q = state.search.trim().toLowerCase();
        return state.conversations
          .filter(c => {
            if (state.category !== 'all' && c.type !== state.category) return false;
            if (state.filter === 'unread' && c.unread === 0) return false;
            if (state.filter === 'starred' && !c.starred) return false;
            if (state.filter === 'archived' && !c.archived) return false;
            if (state.filter !== 'archived' && c.archived) return false;
            if (q && !(c.name.toLowerCase().includes(q) || c.specialty.toLowerCase().includes(q))) return false;
            return true;
          })
          .sort((a, b) => {
            // Pinned first
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;
            // Optional: unread on top
            if (state.unreadOnTop) {
              if (a.unread > 0 && b.unread === 0) return -1;
              if (a.unread === 0 && b.unread > 0) return 1;
            }
            // Newest first
            return b.ts - a.ts;
          });
      }

      function render() {
        const items = visibleConversations();
        convList.innerHTML = '';
        if (items.length === 0) {
          emptyState.classList.remove('hidden');
          return;
        }
        emptyState.classList.add('hidden');

        items.forEach((c, idx) => {
          const li = document.createElement('li');
          li.setAttribute('role', 'listitem');
          li.className = 'relative';
          li.dataset.id = c.id;

          // Swipe backgrounds
          const bg = document.createElement('div');
          bg.className = 'absolute inset-0 rounded-xl mx-1 my-1 overflow-hidden';
          bg.innerHTML = `
            <div class="absolute inset-0 flex items-center justify-between px-4">
              <div class="flex items-center gap-2 text-emerald-50">
                <div class="h-9 w-9 rounded-lg bg-emerald-600 flex items-center justify-center shadow-sm"><i data-lucide="mail-check" class="h-5 w-5 text-white"></i></div>
                <span class="text-sm text-emerald-700/90 dark:text-emerald-300/90">Mark ${c.unread > 0 ? 'read' : 'unread'}</span>
              </div>
              <div class="flex items-center gap-2">
                <div class="h-9 w-9 rounded-lg bg-amber-500 flex items-center justify-center shadow-sm"><i data-lucide="archive" class="h-5 w-5 text-white"></i></div>
                <div class="h-9 w-9 rounded-lg bg-rose-600 flex items-center justify-center shadow-sm"><i data-lucide="trash-2" class="h-5 w-5 text-white"></i></div>
              </div>
            </div>
          `;

          // Foreground card (draggable)
          const row = document.createElement('div');
          row.className = 'relative mx-1 my-1 bg-white dark:bg-slate-900 rounded-xl ring-1 ring-slate-200 dark:ring-slate-800 p-3 flex items-start gap-3 transition transform will-change-transform select-none';
          row.tabIndex = 0;

          // Selection checkbox (custom)
          const selWrap = document.createElement('button');
          selWrap.className = 'shrink-0 mt-0.5 h-9 w-9 rounded-lg ring-1 ring-slate-200 dark:ring-slate-800 bg-white dark:bg-slate-900 hidden items-center justify-center focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400';
          selWrap.innerHTML = '<i data-lucide="check" class="h-5 w-5 text-white hidden"></i>';
          selWrap.setAttribute('aria-pressed', 'false');

          // Avatar
          const avatar = document.createElement('img');
          avatar.src = c.avatar;
          avatar.alt = `${c.name} avatar`;
          avatar.className = 'h-11 w-11 rounded-xl object-cover ring-1 ring-slate-200 dark:ring-slate-800';

          // Content
          const content = document.createElement('div');
          content.className = 'min-w-0 flex-1';
          const nameRow = document.createElement('div');
          nameRow.className = 'flex items-center gap-2';
          const name = document.createElement('div');
          name.className = 'truncate text-[15px] font-semibold tracking-tight text-slate-900 dark:text-white';
          name.textContent = c.name;
          const dot = document.createElement('span');
          dot.className = 'h-1.5 w-1.5 rounded-full bg-slate-400';
          const spec = document.createElement('div');
          spec.className = 'truncate text-sm text-slate-600 dark:text-slate-400';
          spec.textContent = c.specialty;
          const rightCol = document.createElement('div');
          rightCol.className = 'shrink-0 ml-auto flex items-center gap-2';
          const ts = document.createElement('time');
          ts.className = 'text-xs text-slate-500';
          ts.dateTime = new Date(c.ts).toISOString();
          ts.textContent = relativeTime(c.ts);

          // Unread badge / count
          const unreadBadge = document.createElement('div');
          if (c.unread > 0) {
            unreadBadge.className = 'h-5 min-w-[1.25rem] px-1 rounded-full bg-blue-600 text-white text-[11px] flex items-center justify-center';
            unreadBadge.textContent = c.unread > 9 ? '9+' : String(c.unread);
          } else {
            unreadBadge.className = 'h-2 w-2 rounded-full bg-slate-300 dark:bg-slate-700';
          }

          // Pin / Star
          const pinBtn = document.createElement('button');
          pinBtn.className = 'h-8 w-8 rounded-lg ring-1 ring-slate-200 dark:ring-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-center focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400';
          pinBtn.title = c.pinned ? 'Unpin' : 'Pin';
          pinBtn.innerHTML = `<i data-lucide="pin" class="h-4 w-4 ${c.pinned ? 'text-blue-600' : 'text-slate-600'}"></i>`;

          const starBtn = document.createElement('button');
          starBtn.className = 'h-8 w-8 rounded-lg ring-1 ring-slate-200 dark:ring-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-center focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-400';
          starBtn.title = c.starred ? 'Unstar' : 'Star';
          starBtn.innerHTML = `<i data-lucide="star" class="h-4 w-4 ${c.starred ? 'text-amber-500' : 'text-slate-600'}"></i>`;

          // Message preview + receipts
          const msgRow = document.createElement('div');
          msgRow.className = 'mt-1 flex items-center gap-2';
          const preview = document.createElement('p');
          preview.className = `truncate text-[13.5px] ${c.unread ? 'text-slate-900 dark:text-slate-100' : 'text-slate-600 dark:text-slate-400'}`;
          preview.textContent = c.lastMessage;
          const receipt = document.createElement('div');
          receipt.className = 'shrink-0';
          let receiptIcon = 'check';
          let receiptColor = 'text-slate-500';
          if (c.receipt === 'delivered') { receiptIcon = 'check-check'; receiptColor = 'text-slate-500'; }
          if (c.receipt === 'read') { receiptIcon = 'check-check'; receiptColor = 'text-blue-600'; }
          receipt.innerHTML = `<i data-lucide="${receiptIcon}" class="h-4 w-4 ${receiptColor}"></i>`;

          // Assemble name row
          nameRow.appendChild(name);
          nameRow.appendChild(dot);
          nameRow.appendChild(spec);
          rightCol.appendChild(ts);
          rightCol.appendChild(unreadBadge);
          rightCol.appendChild(pinBtn);
          rightCol.appendChild(starBtn);
          nameRow.appendChild(rightCol);

          // Assemble content
          msgRow.appendChild(receipt);
          msgRow.appendChild(preview);
          content.appendChild(nameRow);
          content.appendChild(msgRow);

          // Accessiblity label
          const sr = document.createElement('span');
          sr.className = 'sr-only';
          sr.textContent = `${c.unread > 0 ? 'Unread' : 'Read'} message from ${c.name}, ${relativeTime(c.ts)}. ${c.lastMessage}`;

          // Append children
          row.appendChild(sr);
          row.appendChild(selWrap);
          row.appendChild(avatar);
          row.appendChild(content);

          // Swipe handling
          let startX = 0;
          let currentX = 0;
          let dragging = false;
          let locked = false;

          function onStart(clientX) {
            dragging = true;
            startX = clientX;
            currentX = startX;
            row.style.transition = 'none';
          }
          function onMove(clientX) {
            if (!dragging) return;
            currentX = clientX;
            const dx = currentX - startX;
            if (!locked) {
              // small threshold to start
              if (Math.abs(dx) > 4) locked = true;
            }
            if (!locked) return;
            // limit swipe distance
            const translate = Math.max(Math.min(dx, 96), -128);
            row.style.transform = `translateX(${translate}px)`;
          }
          function onEnd() {
            if (!dragging) return;
            dragging = false;
            locked = false;
            const dx = currentX - startX;
            row.style.transition = 'transform 200ms ease';
            // Commit thresholds
            if (dx > 80) {
              // mark read/unread toggle
              c.unread = c.unread > 0 ? 0 : 1;
              updateNotifDot();
              render();
              return;
            }
            if (dx < -100) {
              // Archive by default on strong left swipe
              c.archived = true;
              render();
              return;
            }
            if (dx < -60) {
              // Softer left -> confirm action
              const action = confirm('Archive this conversation?\nPress Cancel to Delete instead.');
              if (action) c.archived = true;
              else {
                if (confirm('Delete this conversation permanently?')) {
                  state.conversations = state.conversations.filter(x => x.id !== c.id);
                }
              }
              render();
              return;
            }
            row.style.transform = 'translateX(0px)';
          }

          // Mouse + touch bindings
          row.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX), { passive: true });
          row.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX), { passive: true });
          row.addEventListener('touchend', onEnd);
          row.addEventListener('mousedown', (e) => onStart(e.clientX));
          window.addEventListener('mousemove', (e) => onMove(e.clientX));
          window.addEventListener('mouseup', onEnd);

          // Tap open
          row.addEventListener('click', (e) => {
            // If click on a control, don't open
            const control = e.target.closest('button');
            if (control) return;
            if (state.selectionMode) {
              toggleSelect(c.id, selWrap);
            } else {
              openThread(c);
            }
          });

          // Long press for selection mode
          let lpTimer = null;
          row.addEventListener('pointerdown', () => {
            lpTimer = setTimeout(() => {
              enterSelection(c.id);
            }, 450);
          });
          row.addEventListener('pointerup', () => clearTimeout(lpTimer));
          row.addEventListener('pointerleave', () => clearTimeout(lpTimer));

          // Selection checkbox behavior
          function toggleSelect(id, el) {
            if (!state.selectionMode) return;
            if (state.selected.has(id)) state.selected.delete(id);
            else state.selected.add(id);
            updateSelectedCount();
            // Visual state
            const icon = el.querySelector('[data-lucide="check"]');
            const active = state.selected.has(id);
            el.setAttribute('aria-pressed', String(active));
            if (active) {
              el.classList.add('bg-blue-600','ring-blue-600');
              if (icon) icon.classList.remove('hidden');
            } else {
              el.classList.remove('bg-blue-600','ring-blue-600');
              if (icon) icon.classList.add('hidden');
            }
          }
          selWrap.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleSelect(c.id, selWrap);
          });

          // Pin & Star toggles
          pinBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            c.pinned = !c.pinned;
            render();
          });
          starBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            c.starred = !c.starred;
            render();
          });

          // Show selection UI if in selection mode
          if (state.selectionMode) {
            selWrap.classList.remove('hidden');
            // Update selected visuals
            if (state.selected.has(c.id)) {
              selWrap.classList.add('bg-blue-600','ring-blue-600');
              const icon = selWrap.querySelector('[data-lucide="check"]');
              icon && icon.classList.remove('hidden');
            }
          } else {
            selWrap.classList.add('hidden');
          }

          // ARIA label
          row.setAttribute('aria-label', `${c.unread > 0 ? 'Unread' : 'Read'} message from ${c.name}, ${relativeTime(c.ts)}`);

          li.appendChild(bg);
          li.appendChild(row);
          convList.appendChild(li);

          // Animate in with small stagger
          row.classList.add('opacity-0', 'translate-y-1');
          setTimeout(() => {
            row.classList.add('transition', 'duration-500');
            row.classList.remove('opacity-0', 'translate-y-1');
            row.classList.add('opacity-100', 'translate-y-0');
          }, 40 * idx);

          paintIcons(li);
        });
      }

      function openThread(conv) {
        // Mark as read upon open
        if (conv.unread > 0) {
          conv.unread = 0;
          updateNotifDot();
          render();
        }
        alert(`Open secure chat with ${conv.name}.`);
      }
    </script>
  </body>
</html>
