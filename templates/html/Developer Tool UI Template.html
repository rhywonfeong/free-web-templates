<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resource Injector</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<body class="bg-black text-white min-h-screen flex items-center justify-center p-6 selection:bg-white selection:text-black antialiased" style="font-family: 'Inter', sans-serif;">
    
    <div class="w-full max-w-md space-y-8">
        
        <header class="space-y-1.5">
            <h1 class="text-base font-semibold tracking-tight text-white">MI</h1>
            <p class="text-sm text-white/60">Generate structural injection wrappers.</p>
        </header>

        <main class="space-y-5">
            <div class="space-y-2">
                <label for="resourceName" class="block text-xs font-medium text-white/80">Resource Name</label>
                <input type="text" id="resourceName" placeholder="any" class="w-full bg-black border border-white rounded-md px-3 py-2 text-sm text-white focus:outline-none focus:ring-1 focus:ring-white transition-colors placeholder:text-white/40">
            </div>

            <div class="space-y-2">
                <label for="triggerData" class="block text-xs font-medium text-white/80">Trigger</label>
                <textarea id="triggerData" rows="3" placeholder="TriggerEvent('...')" class="w-full bg-black border border-white rounded-md px-3 py-2 text-sm text-white font-mono focus:outline-none focus:ring-1 focus:ring-white transition-colors placeholder:text-white/40 resize-none"></textarea>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <button id="genBtn" class="flex-1 bg-white text-black py-2 rounded-md text-sm font-medium hover:bg-white/90 transition-colors flex items-center justify-center gap-2">
                    Generate
                </button>
                <button id="copyBtn" class="flex-1 bg-black border border-white text-white py-2 rounded-md text-sm font-medium hover:bg-white/10 transition-colors flex items-center justify-center gap-2">
                    <iconify-icon icon="solar:copy-linear" stroke-width="1.5" class="text-base"></iconify-icon>
                    Copy
                </button>
            </div>
        </main>

        <div class="pt-6 border-t border-white">
            <pre id="resultOutput" class="text-sm text-white/50 font-mono whitespace-pre-wrap break-all transition-colors duration-300">Awaiting input parameters...</pre>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const resInput = document.getElementById('resourceName');
            const trigInput = document.getElementById('triggerData');
            const output = document.getElementById('resultOutput');
            const genBtn = document.getElementById('genBtn');
            const copyBtn = document.getElementById('copyBtn');

            function generateResult() {
                let resource = resInput.value.trim();
                let trigger = trigInput.value.trim();
                
                if (!resource) resource = "any";
                if (!trigger) trigger = "/* insert trigger */";

                const generatedCode = `MachoInjectResource("${resource}", [[\n${trigger}\n]])`;

                output.textContent = generatedCode;
                output.classList.remove('text-white/50');
                output.classList.add('text-white');
            }

            genBtn.addEventListener('click', generateResult);

            copyBtn.addEventListener('click', async () => {
                const textToCopy = output.textContent;
                if (textToCopy === 'Awaiting input parameters...') return;

                try {
                    await navigator.clipboard.writeText(textToCopy);
                    const originalContent = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<iconify-icon icon="solar:check-read-linear" stroke-width="1.5" class="text-base"></iconify-icon> Copied';
                    
                    setTimeout(() => {
                        copyBtn.innerHTML = originalContent;
                    }, 2000);
                } catch (err) {
                    console.error('Failed to copy text: ', err);
                }
            });
        });
    </script>
</body>
</html>
