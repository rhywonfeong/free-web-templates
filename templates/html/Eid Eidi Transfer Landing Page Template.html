            </div>

            <!-- Form -->
            <form id="eidiForm" class="glass-panel rounded-3xl p-6 md:p-8 space-y-5 relative overflow-hidden" onsubmit="handleSend(event)">
                <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-emerald-500/50 to-transparent"></div>

                <!-- Sender -->
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider ml-1">From</label>
                    <div class="input-group flex items-center gap-3 bg-slate-950/50 border border-slate-800 rounded-2xl px-4 py-3 transition-all duration-300">
                        <div class="w-7 h-7 rounded-full bg-emerald-500/10 flex items-center justify-center">
                            <iconify-icon icon="solar:user-circle-linear" class="text-emerald-400 text-lg"></iconify-icon>
                        </div>
                        <input type="tel" id="sender" placeholder="03XXXXXXXXX" required pattern="[0-9]{11}" class="bg-transparent border-none outline-none text-slate-200 text-sm w-full placeholder-slate-700 font-medium tracking-wide">
                    </div>
                </div>

                <!-- Receiver -->
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider ml-1">To</label>
                    <div class="input-group flex items-center gap-3 bg-slate-950/50 border border-slate-800 rounded-2xl px-4 py-3 transition-all duration-300">
                        <div class="w-7 h-7 rounded-full bg-amber-500/10 flex items-center justify-center">
                            <iconify-icon icon="solar:gift-linear" class="text-amber-400 text-lg"></iconify-icon>
                        </div>
                        <input type="tel" id="receiver" placeholder="03XXXXXXXXX" required pattern="[0-9]{11}" class="bg-transparent border-none outline-none text-slate-200 text-sm w-full placeholder-slate-700 font-medium tracking-wide">
                    </div>
                </div>

                <!-- Amount -->
                <div class="space-y-2">

                    <div class="grid grid-cols-2 gap-2.5">
                        <button type="button" onclick="selectAmount(1000, this)" class="amount-btn bg-slate-900/40 border border-slate-800 rounded-xl py-3.5 hover:bg-slate-800/40 transition-all duration-300 group">
                            <span class="text-sm font-semibold text-slate-300 group-hover:text-amber-400 transition-colors">Rs. 1000</span>
                        </button>
                        <button type="button" onclick="selectAmount(2000, this)" class="amount-btn bg-slate-900/40 border border-slate-800 rounded-xl py-3.5 hover:bg-slate-800/40 transition-all duration-300 group">
                            <span class="text-sm font-semibold text-slate-300 group-hover:text-amber-400 transition-colors">Rs. 2000</span>
                        </button>
                        <button type="button" onclick="selectAmount(5000, this)" class="amount-btn bg-slate-900/40 border border-slate-800 rounded-xl py-3.5 hover:bg-slate-800/40 transition-all duration-300 group">
                            <span class="text-sm font-semibold text-slate-300 group-hover:text-amber-400 transition-colors">Rs. 5000</span>
                        </button>
                        <button type="button" onclick="selectAmount(10000, this)" class="amount-btn bg-slate-900/40 border border-slate-800 rounded-xl py-3.5 hover:bg-slate-800/40 transition-all duration-300 group">
                            <span class="text-sm font-semibold text-slate-300 group-hover:text-amber-400 transition-colors">Rs. 10k</span>
                        </button>
                    </div>
                    <input type="hidden" id="selectedAmount">
                    <p id="amountError" class="text-[10px] text-red-400 hidden mt-1 flex items-center gap-1 pl-1">
                        <iconify-icon icon="solar:danger-circle-linear"></iconify-icon> Please select an amount

                <!-- Submit Button -->

                    <div class="relative bg-slate-950 rounded-xl py-3.5 px-6 flex items-center justify-center gap-2 transition-all group-hover:bg-slate-900">

                </button>
            </form>
        </div>

        <!-- VIEW 2: Processing (Hidden) -->
        <div id="view-loading" class="hidden-view view-section flex-col items-center justify-center text-center space-y-6 py-10">

            <div class="space-y-1">

                <p class="text-sm text-slate-400">Processing your Eidi transfer...</p>
            </div>
        </div>

        <!-- VIEW 3: Celebration Success (Hidden) -->
        <div id="view-success" class="hidden-view view-section flex-col items-center justify-center text-center w-full">
            <div class="animate-pop w-full">
                <div class="glass-panel rounded-3xl p-8 w-full flex flex-col items-center relative overflow-hidden">
                    <!-- Glow effect -->
                    <div class="absolute inset-0 bg-gradient-to-b from-emerald-500/10 to-amber-500/10 pointer-events-none"></div>
                    
                    <div class="w-20 h-20 bg-gradient-to-tr from-emerald-500 to-teal-400 rounded-full flex items-center justify-center shadow-[0_0_30px_rgba(16,185,129,0.4)] mb-6 animate-float">
                        <iconify-icon icon="solar:check-circle-bold" class="text-white text-4xl"></iconify-icon>
                    </div>

                    <h2 class="text-4xl font-arabic text-amber-400 mb-2 drop-shadow-md">عيد مبارك</h2>

                    <p class="text-slate-400 text-sm mb-8 max-w-[200px] leading-relaxed">May your sacrifice be accepted and your life be filled with joy.</p>

                    <!-- Decorative Animals on Card -->
                    <div class="flex items-center gap-4 mb-8 text-3xl">
                        <span class="animate-bounce" style="animation-delay: 0.1s">🐐</span>
                        <span class="animate-bounce" style="animation-delay: 0.3s">🐑</span>
                        <span class="animate-bounce" style="animation-delay: 0.5s">🐐</span>
                    </div>

                    <button onclick="resetForm()" class="w-full bg-slate-800/50 border border-slate-700 text-slate-300 py-3 rounded-xl text-sm font-medium hover:bg-slate-800 transition-colors flex items-center justify-center gap-2">

                        Send Another Eidi
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        let currentAmount = 0;

        function selectAmount(amount, btn) {
            currentAmount = amount;
            document.getElementById('selectedAmount').value = amount;
            
            document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('amountError').classList.add('hidden');
        }

        // Confetti Engine
        function fireConfetti() {
            const colors = ['#10B981', '#F59E0B', '#3B82F6', '#EC4899', '#ffffff'];
            const container = document.getElementById('confetti-container');
            container.innerHTML = ''; // clear previous

            // Create explosion
            for (let i = 0; i < 60; i++) {
                const conf = document.createElement('div');
                conf.classList.add('confetti');
                
                // Random styles
                const bg = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100 + '%';
                const animDuration = (Math.random() * 2 + 2) + 's'; // 2-4s
                const delay = (Math.random() * 0.5) + 's';
                
                conf.style.backgroundColor = bg;
                conf.style.left = left;
                conf.style.top = '-10px';
                conf.style.animationDuration = animDuration;
                conf.style.animationDelay = delay;
                
                // Random rotation start
                conf.style.transform = `rotate(${Math.random() * 360}deg)`;

                container.appendChild(conf);
            }
        }

        function switchView(hideId, showId) {
            const hideEl = document.getElementById(hideId);
            const showEl = document.getElementById(showId);

            hideEl.style.opacity = '0';
            hideEl.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                hideEl.classList.add('hidden-view');
                showEl.classList.remove('hidden-view');
                
                // Trigger reflow
                void showEl.offsetWidth;
                
                showEl.style.opacity = '1';
                showEl.style.transform = 'scale(1)';
            }, 500);
        }

        function handleSend(e) {
            e.preventDefault();
            
            if (!currentAmount) {
                document.getElementById('amountError').classList.remove('hidden');
                return;
            }

            // 1. Switch to Loading
            switchView('view-form', 'view-loading');

            // 2. Simulate App Processing (2 seconds)
            setTimeout(() => {
                // In real scenario: window.location.href = 'easypaisa://...';
                
                // 3. Simulate Return & Success
                switchView('view-loading', 'view-success');
                
                // 4. Blast Confetti
                setTimeout(() => {
                    fireConfetti();
                    // Play a second burst slightly later
                    setTimeout(fireConfetti, 1500);
                }, 400);

            }, 2500);
        }

        function resetForm() {
            document.getElementById('eidiForm').reset();
            currentAmount = 0;
            document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('confetti-container').innerHTML = '';
            
            switchView('view-success', 'view-form');
        }
    </script>
</body>
