n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "dark-premium", "name": "The Dark Premium", "category": "Foundational", "description": "Inverted palette - the entire email lives in dark navy. Stats, insights, premium feel.", "useFor": "Weekly recaps, data-driven insights, power-user emails", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Your week in Nurturely</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-40 { padding-left: 24px !important; padding-right: 24px !important; }\n      .h1 { font-size: 30px !important; }\n      .stat-grid td { display:block !important; width:100% !important; padding:6px 0 !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#050510; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    Your week in Nurturely \u2014 sends, replies, and what's worth your attention.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#050510;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 40px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#0A0A1A; border-radius:16px; overflow:hidden; border:1px solid rgba(124,58,237,0.15);\">\n\n          <!-- Top brand row -->\n          <tr>\n            <td style=\"padding: 28px 40px 0;\" class=\"px-40\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td valign=\"middle\" width=\"36\">\n                    <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"32\" height=\"32\" style=\"display:block; border-radius:7px; border:0;\">\n                  </td>\n                  <td valign=\"middle\" style=\"padding-left:12px;\">\n                    <span style=\"color:#ffffff; font-size:14px; font-weight:700;\">Nurturely</span>\n                  </td>\n                  <td valign=\"middle\" align=\"right\" style=\"text-align:right;\">\n                    <span style=\"color:#B794F4; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:600; letter-spacing:1px;\">WEEK 12 \u00b7 2026</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Hero -->\n          <tr>\n            <td style=\"padding: 40px 40px 8px;\" class=\"px-40\">\n              <div style=\"color:#B794F4; font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; margin-bottom:14px;\">\n                \u25cf &nbsp;Your Week, Recapped\n              </div>\n              <h1 class=\"h1\" style=\"margin:0 0 14px; color:#ffffff; font-size:34px; font-weight:800; line-height:1.15; letter-spacing:-0.025em;\">\n                Quiet week, real motion.\n              </h1>\n              <p style=\"margin:0; color:#9b97c0; font-size:15px; line-height:1.65;\">\n                {{contact.first_name}}, here's what your system did over the last seven days.\n              </p>\n            </td>\n          </tr>\n\n          <!-- Stat grid -->\n          <tr>\n            <td style=\"padding: 32px 40px 0;\" class=\"px-40\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" class=\"stat-grid\">\n                <tr>\n                  <td valign=\"top\" width=\"50%\" style=\"padding-right:8px;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#15102e; border:1px solid rgba(124,58,237,0.25); border-radius:12px;\">\n                      <tr>\n                        <td style=\"padding:20px 22px;\">\n                          <div style=\"color:#B794F4; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px;\">\n                            Sends\n                          </div>\n                          <div style=\"color:#ffffff; font-size:34px; font-weight:800; line-height:1; letter-spacing:-0.02em;\">\n                            247\n                          </div>\n                          <div style=\"color:#86EFAC; font-size:12px; font-weight:600; margin-top:6px;\">\u2191 18% vs last week</div>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"top\" width=\"50%\" style=\"padding-left:8px;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#15102e; border:1px solid rgba(124,58,237,0.25); border-radius:12px;\">\n                      <tr>\n                        <td style=\"padding:20px 22px;\">\n                          <div style=\"color:#B794F4; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px;\">\n                            Open Rate\n                          </div>\n                          <div style=\"color:#ffffff; font-size:34px; font-weight:800; line-height:1; letter-spacing:-0.02em;\">\n                            42%\n                          </div>\n                          <div style=\"color:#86EFAC; font-size:12px; font-weight:600; margin-top:6px;\">\u2191 4 pts vs last week</div>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                </tr>\n                <tr><td colspan=\"2\" style=\"height:14px; line-height:14px; font-size:0;\">&nbsp;</td></tr>\n                <tr>\n                  <td valign=\"top\" width=\"50%\" style=\"padding-right:8px;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#15102e; border:1px solid rgba(124,58,237,0.25); border-radius:12px;\">\n                      <tr>\n                        <td style=\"padding:20px 22px;\">\n                          <div style=\"color:#B794F4; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px;\">\n                            Replies\n                          </div>\n                          <div style=\"color:#ffffff; font-size:34px; font-weight:800; line-height:1; letter-spacing:-0.02em;\">\n                            31\n                          </div>\n                          <div style=\"color:#9b97c0; font-size:12px; font-weight:600; margin-top:6px;\">12.5% reply rate</div>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"top\" width=\"50%\" style=\"padding-left:8px;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#15102e; border:1px solid rgba(124,58,237,0.25); border-radius:12px;\">\n                      <tr>\n                        <td style=\"padding:20px 22px;\">\n                          <div style=\"color:#B794F4; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px;\">\n                            New Contacts\n                          </div>\n                          <div style=\"color:#ffffff; font-size:34px; font-weight:800; line-height:1; letter-spacing:-0.02em;\">\n                            +52\n                          </div>\n                          <div style=\"color:#9b97c0; font-size:12px; font-weight:600; margin-top:6px;\">from your forms</div>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Insight card -->\n          <tr>\n            <td style=\"padding: 32px 40px 0;\" class=\"px-40\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-image:linear-gradient(135deg, rgba(124,58,237,0.18) 0%, rgba(124,58,237,0.06) 100%); border:1px solid rgba(183,148,244,0.3); border-radius:12px;\">\n                <tr>\n                  <td style=\"padding:24px 26px;\">\n                    <div style=\"color:#FCD34D; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:10px;\">\n                      \u2605 &nbsp;What's Worth Your Attention\n                    </div>\n                    <h3 style=\"margin:0 0 10px; color:#ffffff; font-size:18px; font-weight:700; line-height:1.35;\">\n                      Tuesday at 10:14 AM was your best sending window.\n                    </h3>\n                    <p style=\"margin:0; color:#c0b8db; font-size:14px; line-height:1.6;\">\n                      Three of your top four opens this week came from messages sent within that hour. Worth testing as your default for next week's campaigns.\n                    </p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- CTA -->\n          <tr>\n            <td style=\"padding: 32px 40px 0; text-align:center;\" class=\"px-40\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n                <tr>\n                  <td align=\"center\" style=\"border-radius:10px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4 0%, #7C3AED 55%, #6D28D9 100%);\">\n                    <a href=\"https://app.nurturelycrm.com/analytics\" style=\"display:inline-block; padding:14px 32px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:10px; letter-spacing:0.02em;\">\n                      View full report &nbsp;\u2192\n                    </a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Closing -->\n          <tr>\n            <td style=\"padding: 36px 40px 36px;\" class=\"px-40\">\n              <div style=\"border-top:1px solid rgba(124,58,237,0.15); padding-top:20px;\">\n                <p style=\"margin:0; color:#6b6580; font-size:13px; line-height:1.65; font-style:italic;\">\n                  We send this every Monday morning. Reply with feedback &mdash; we read every one.\n                </p>\n              </div>\n            </td>\n          </tr>\n\n        </table>\n\n        <!-- Footer -->\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 20px 40px; text-align:center;\" class=\"px-40\">\n              <div style=\"color:#5a5670; font-size:11px; line-height:1.7;\">\n                Nurturely CRM &nbsp;\u00b7&nbsp; Pomona, CA &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#B794F4; text-decoration:none;\">Unsubscribe</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "memo", "name": "The Memo", "category": "Editorial", "description": "Cream paper, serif typography, drop cap, dateline. Reads like a quiet letter from a thoughtful guide.", "useFor": "Long-form nurture letters, founder thoughts, philosophy pieces", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>The Nurturely Memo</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-56 { padding-left: 28px !important; padding-right: 28px !important; }\n      .h1 { font-size: 30px !important; line-height: 1.15 !important; }\n      .dropcap { font-size: 52px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#F2EFE7; font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    A short note for your third day with Nurturely.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#F2EFE7;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 40px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#FAF9F6; border-radius:4px;\">\n\n          <!-- Masthead -->\n          <tr>\n            <td style=\"padding: 36px 56px 0;\" class=\"px-56\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td valign=\"middle\" width=\"40\">\n                    <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"36\" height=\"36\" style=\"display:block; border-radius:8px; border:0;\">\n                  </td>\n                  <td valign=\"middle\" style=\"padding-left:14px;\">\n                    <div style=\"font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase;\">\n                      The Nurturely Memo\n                    </div>\n                    <div style=\"font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; color:#6b6b80; font-size:13px; font-style:italic; margin-top:2px;\">\n                      Issue No. 01 &nbsp;\u00b7&nbsp; Day Three\n                    </div>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Top rule -->\n          <tr>\n            <td style=\"padding: 24px 56px 0;\" class=\"px-56\">\n              <div style=\"height:1px; background:#0A0A1A; line-height:1px; font-size:0; opacity:0.85;\">&nbsp;</div>\n              <div style=\"height:4px; line-height:4px; font-size:0;\">&nbsp;</div>\n              <div style=\"height:1px; background:#0A0A1A; line-height:1px; font-size:0; opacity:0.3;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Headline -->\n          <tr>\n            <td style=\"padding: 40px 56px 0;\" class=\"px-56\">\n              <div style=\"font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:18px;\">\n                A short letter for your third day\n              </div>\n              <h1 class=\"h1\" style=\"margin:0; color:#0A0A1A; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:38px; font-weight:500; line-height:1.12; letter-spacing:-0.015em;\">\n                Three days in. Here's what we hope you're starting to feel.\n              </h1>\n            </td>\n          </tr>\n\n          <!-- Lead w/ drop cap -->\n          <tr>\n            <td style=\"padding: 32px 56px 0;\" class=\"px-56\">\n              <p style=\"margin:0; color:#1a1a2e; font-size:17px; line-height:1.7;\">\n                <span class=\"dropcap\" style=\"float:left; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:64px; line-height:0.85; font-weight:500; color:#7C3AED; padding:6px 10px 0 0;\">B</span>y now, {{contact.first_name}}, you've logged in a few times. Maybe poked at the contact list, opened a campaign, clicked around the pipeline view. That's exactly where you should be &mdash; not mastery, not even confidence yet. Just <em>familiarity</em>.\n              </p>\n            </td>\n          </tr>\n\n          <!-- Body -->\n          <tr>\n            <td style=\"padding: 24px 56px 0;\" class=\"px-56\">\n              <p style=\"margin:0 0 22px; color:#1a1a2e; font-size:17px; line-height:1.7;\">\n                The first three days with any new system are quietly disorienting. You're learning a new vocabulary, a new place where things live. The buttons aren't intuitive yet. That's not a flaw &mdash; it's the entry fee for software that actually does something.\n              </p>\n              <p style=\"margin:0; color:#1a1a2e; font-size:17px; line-height:1.7;\">\n                If you've sent your first message, that's the win. If you've added a contact manually just to see what happens, that's the win. If you've just logged in and stared at the dashboard wondering where to start &mdash; honestly, that's also the win.\n              </p>\n            </td>\n          </tr>\n\n          <!-- Pull quote -->\n          <tr>\n            <td style=\"padding: 40px 56px;\" class=\"px-56\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td style=\"border-left:3px solid #7C3AED; padding:8px 0 8px 22px;\">\n                    <p style=\"margin:0; color:#0A0A1A; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:22px; font-style:italic; line-height:1.45; font-weight:500;\">\n                      \"Familiarity comes first. Mastery comes from doing the thing 100 times. Day three is for getting comfortable being a beginner.\"\n                    </p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Section break -->\n          <tr>\n            <td align=\"center\" style=\"padding: 0 56px;\" class=\"px-56\">\n              <div style=\"color:#7C3AED; font-size:18px; letter-spacing:8px; line-height:1;\">\n                &middot; &middot; &middot;\n              </div>\n            </td>\n          </tr>\n\n          <!-- Section 2 -->\n          <tr>\n            <td style=\"padding: 36px 56px 0;\" class=\"px-56\">\n              <h2 style=\"margin:0 0 16px; color:#0A0A1A; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:24px; font-weight:500; line-height:1.3; letter-spacing:-0.01em;\">\n                What we'd quietly recommend for the next few days\n              </h2>\n              <p style=\"margin:0 0 14px; color:#1a1a2e; font-size:17px; line-height:1.7;\">\n                Send one campaign. Even a tiny one &mdash; ten people, three sentences. The whole system clicks once you've watched a message go out and a reply come back.\n              </p>\n              <p style=\"margin:0 0 14px; color:#1a1a2e; font-size:17px; line-height:1.7;\">\n                Build one pipeline stage. You don't need the full sales process mapped &mdash; just two columns and a card. You'll see why everything else is structured the way it is.\n              </p>\n              <p style=\"margin:0; color:#1a1a2e; font-size:17px; line-height:1.7;\">\n                Don't worry about the rest yet. There's no prize for finishing the dashboard tour in week one.\n              </p>\n            </td>\n          </tr>\n\n          <!-- Closing -->\n          <tr>\n            <td style=\"padding: 44px 56px;\" class=\"px-56\">\n              <div style=\"height:1px; background:#0A0A1A; line-height:1px; font-size:0; opacity:0.15; margin-bottom:24px;\">&nbsp;</div>\n              <p style=\"margin:0 0 18px; color:#4a4a5e; font-size:15px; line-height:1.65; font-style:italic;\">\n                We'll be in your inbox again in a few days with another short note. Until then, keep poking around &mdash; that's the work.\n              </p>\n              <p style=\"margin:0; color:#0A0A1A; font-size:15px; line-height:1.6;\">\n                Yours,<br>\n                <span style=\"font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-style:italic; font-size:17px;\">The Nurturely Team</span>\n              </p>\n            </td>\n          </tr>\n\n        </table>\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 20px 56px; text-align:center;\" class=\"px-56\">\n              <div style=\"font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; color:#9999aa; font-size:11px; line-height:1.7; letter-spacing:0.5px;\">\n                THE NURTURELY MEMO &nbsp;\u00b7&nbsp; POMONA, CA<br>\n                <a href=\"#\" style=\"color:#7C3AED; text-decoration:none;\">Unsubscribe</a> &nbsp;\u00b7&nbsp; <a href=\"https://nurturelycrm.com\" style=\"color:#7C3AED; text-decoration:none;\">nurturelycrm.com</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "note", "name": "The Note", "category": "Editorial", "description": "Stripped down. White, no chrome, looks like a real human typed it in their inbox.", "useFor": "Personal check-ins, soft re-engagement, casual one-offs", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>A quick note</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-48 { padding-left: 28px !important; padding-right: 28px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    Quick thought I wanted to share with you.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#ffffff;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 56px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"540\" class=\"container\" style=\"max-width:540px;\">\n\n          <!-- Tiny brand mark -->\n          <tr>\n            <td style=\"padding: 0 48px 36px;\" class=\"px-48\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td valign=\"middle\" width=\"22\">\n                    <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"20\" height=\"20\" style=\"display:block; border-radius:5px; border:0;\">\n                  </td>\n                  <td valign=\"middle\" style=\"padding-left:8px;\">\n                    <span style=\"color:#9999aa; font-size:12px; font-weight:600; letter-spacing:0.5px;\">Nurturely</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- The note itself -->\n          <tr>\n            <td style=\"padding: 0 48px;\" class=\"px-48\">\n              <p style=\"margin:0 0 20px; color:#0A0A1A; font-size:17px; line-height:1.7; font-weight:500;\">\n                Hey {{contact.first_name}},\n              </p>\n              <p style=\"margin:0 0 20px; color:#1a1a2e; font-size:16px; line-height:1.75;\">\n                Quick thought I wanted to share &mdash; one of our customers, Maya, mentioned something on a call last week that stuck with me.\n              </p>\n              <p style=\"margin:0 0 20px; color:#1a1a2e; font-size:16px; line-height:1.75;\">\n                She said she'd been running her business for eight years before getting Nurturely, and the thing that surprised her wasn't the new features she'd unlock. It was how much <em>energy</em> she got back. Not having to remember to follow up. Not having to wonder which lead she'd already messaged. The mental load she didn't even know she'd been carrying.\n              </p>\n              <p style=\"margin:0 0 20px; color:#1a1a2e; font-size:16px; line-height:1.75;\">\n                That's the part nobody talks about. Software doesn't just save time &mdash; the right software gives you back attention.\n              </p>\n              <p style=\"margin:0 0 28px; color:#1a1a2e; font-size:16px; line-height:1.75;\">\n                Hope wherever you are with your setup right now, you're starting to feel a little of that too.\n              </p>\n\n              <p style=\"margin:0 0 4px; color:#0A0A1A; font-size:16px; line-height:1.6;\">\n                Pro\n              </p>\n              <p style=\"margin:0; color:#9999aa; font-size:13px; line-height:1.5;\">\n                Nurturely CRM\n              </p>\n            </td>\n          </tr>\n\n          <!-- Minimal footer -->\n          <tr>\n            <td style=\"padding: 56px 48px 0;\" class=\"px-48\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0; margin-bottom:16px;\">&nbsp;</div>\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7; letter-spacing:0.3px;\">\n                You're receiving this because you're part of Nurturely. <a href=\"#\" style=\"color:#9999aa; text-decoration:underline;\">Unsubscribe</a>.\n              </div>\n            </td>\n          </tr>\n\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "quote", "name": "The Quote", "category": "Editorial", "description": "Hero serif quote on dark navy. Brand-identity moment where typography is the design.", "useFor": "Testimonials, philosophy snippets, identity moments", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>A word from one of our own</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-56 { padding-left: 28px !important; padding-right: 28px !important; }\n      .h1 { font-size: 28px !important; line-height: 1.2 !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#050510; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    Words from one of our own. Worth the 30 seconds.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#050510;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 40px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#0A0A1A; border-radius:14px; overflow:hidden; border:1px solid rgba(124,58,237,0.18);\">\n\n          <!-- Tiny brand row -->\n          <tr>\n            <td style=\"padding: 32px 56px 0;\" class=\"px-56\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td valign=\"middle\" width=\"26\">\n                    <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"24\" height=\"24\" style=\"display:block; border-radius:6px; border:0;\">\n                  </td>\n                  <td valign=\"middle\" style=\"padding-left:10px;\">\n                    <span style=\"color:#ffffff; font-size:13px; font-weight:700;\">Nurturely</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Eyebrow -->\n          <tr>\n            <td style=\"padding: 48px 56px 0;\" class=\"px-56\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase;\">\n                In Their Own Words\n              </div>\n            </td>\n          </tr>\n\n          <!-- BIG SERIF QUOTE -->\n          <tr>\n            <td style=\"padding: 20px 56px 0;\" class=\"px-56\">\n              <!-- Decorative quote mark -->\n              <div style=\"color:#7C3AED; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:88px; line-height:0.7; font-weight:500; margin-bottom:0;\">\n                &ldquo;\n              </div>\n              <h1 class=\"h1\" style=\"margin:-12px 0 0; color:#ffffff; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:34px; font-weight:500; line-height:1.3; letter-spacing:-0.01em; font-style:italic;\">\n                Nurturely didn't just save me time. It gave me back the attention I'd been losing without realizing it.\n              </h1>\n            </td>\n          </tr>\n\n          <!-- Attribution -->\n          <tr>\n            <td style=\"padding: 32px 56px 0;\" class=\"px-56\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td valign=\"middle\">\n                    <!-- Avatar -->\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                      <tr>\n                        <td align=\"center\" valign=\"middle\" width=\"44\" height=\"44\" style=\"width:44px; height:44px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4, #7C3AED); border-radius:50%; text-align:center; vertical-align:middle; color:#ffffff; font-size:15px; font-weight:700; line-height:44px;\">\n                          MR\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"middle\" style=\"padding-left:14px;\">\n                    <div style=\"color:#ffffff; font-size:15px; font-weight:700; line-height:1.3;\">Maya Rodriguez</div>\n                    <div style=\"color:#9b97c0; font-size:13px; line-height:1.4; margin-top:2px;\">Founder, Westside Wellness &nbsp;\u00b7&nbsp; Customer since 2024</div>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Divider -->\n          <tr>\n            <td style=\"padding: 36px 56px 0;\" class=\"px-56\">\n              <div style=\"height:1px; background:rgba(124,58,237,0.2); line-height:1px; font-size:0;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Short context paragraph -->\n          <tr>\n            <td style=\"padding: 28px 56px 0;\" class=\"px-56\">\n              <p style=\"margin:0; color:#9b97c0; font-size:14px; line-height:1.7;\">\n                Maya runs a wellness studio in Long Beach with 800+ active clients. She switched to Nurturely after eight years of patching together five different tools. We share her story because it might sound familiar.\n              </p>\n            </td>\n          </tr>\n\n          <!-- CTA -->\n          <tr>\n            <td style=\"padding: 32px 56px 44px;\" class=\"px-56\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td style=\"border-radius:8px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4 0%, #7C3AED 55%, #6D28D9 100%);\">\n                    <a href=\"https://nurturelycrm.com/stories/maya-rodriguez\" style=\"display:inline-block; padding:12px 26px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:8px; letter-spacing:0.02em;\">\n                      Read Maya's full story &nbsp;\u2192\n                    </a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n        </table>\n\n        <!-- Footer -->\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 20px 56px; text-align:center;\" class=\"px-56\">\n              <div style=\"color:#5a5670; font-size:11px; line-height:1.7;\">\n                Nurturely CRM &nbsp;\u00b7&nbsp; Pomona, CA &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#B794F4; text-decoration:none;\">Unsubscribe</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "manifesto", "name": "The Manifesto", "category": "Editorial", "description": "Massive typographic statement. Words dominate. Brand-defining moment.", "useFor": "Brand declarations, anniversary, year-end, big announcements", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>What we believe</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-48 { padding-left: 28px !important; padding-right: 28px !important; }\n      .manifesto { font-size: 56px !important; line-height: 1 !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#F2EFE7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    Software shouldn't make you feel small. Read why.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#F2EFE7;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 0;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#FAF9F6;\">\n\n          <!-- Brand row -->\n          <tr>\n            <td style=\"padding: 40px 48px 0;\" class=\"px-48\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td valign=\"middle\" width=\"28\">\n                    <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"26\" height=\"26\" style=\"display:block; border-radius:6px; border:0;\">\n                  </td>\n                  <td valign=\"middle\" style=\"padding-left:10px;\">\n                    <span style=\"color:#0A0A1A; font-size:13px; font-weight:700;\">Nurturely</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Eyebrow -->\n          <tr>\n            <td style=\"padding: 80px 48px 0;\" class=\"px-48\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase;\">\n                What We Believe\n              </div>\n            </td>\n          </tr>\n\n          <!-- MANIFESTO STATEMENT -->\n          <tr>\n            <td style=\"padding: 28px 48px 0;\" class=\"px-48\">\n              <h1 class=\"manifesto\" style=\"margin:0; color:#0A0A1A; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:72px; font-weight:500; line-height:0.98; letter-spacing:-0.035em;\">\n                Software<br>\n                shouldn't<br>\n                make you<br>\n                feel <span style=\"color:#7C3AED; font-style:italic;\">small.</span>\n              </h1>\n            </td>\n          </tr>\n\n          <!-- Long thin rule -->\n          <tr>\n            <td style=\"padding: 80px 48px 0;\" class=\"px-48\">\n              <div style=\"height:1px; background:#0A0A1A; line-height:1px; font-size:0; opacity:0.8; width:60px;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Supporting body -->\n          <tr>\n            <td style=\"padding: 32px 48px 0;\" class=\"px-48\">\n              <p style=\"margin:0 0 22px; color:#1a1a2e; font-size:17px; line-height:1.7;\">\n                We've all used the platforms that try to do everything. The ones with 200 features you'll never touch, training programs that require a certification, and dashboards that need a dashboard to understand.\n              </p>\n              <p style=\"margin:0 0 22px; color:#1a1a2e; font-size:17px; line-height:1.7;\">\n                The promise is power. The reality is intimidation.\n              </p>\n              <p style=\"margin:0; color:#1a1a2e; font-size:17px; line-height:1.7; font-weight:500;\">\n                We built Nurturely for the other direction. For business owners who shouldn't have to feel inadequate just to manage their own customers.\n              </p>\n            </td>\n          </tr>\n\n          <!-- Three principles -->\n          <tr>\n            <td style=\"padding: 56px 48px 0;\" class=\"px-48\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:24px;\">\n                Three Things We Hold To\n              </div>\n\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td style=\"padding:0 0 24px;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                      <tr>\n                        <td width=\"60\" valign=\"top\">\n                          <div style=\"color:#7C3AED; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:32px; font-weight:500; line-height:1; font-style:italic;\">i.</div>\n                        </td>\n                        <td valign=\"top\" style=\"padding-top:6px;\">\n                          <h3 style=\"margin:0 0 6px; color:#0A0A1A; font-size:17px; font-weight:700; line-height:1.3;\">\n                            The tool serves you, not the other way around.\n                          </h3>\n                          <p style=\"margin:0; color:#4a4a5e; font-size:14px; line-height:1.65;\">\n                            You shouldn't have to rearrange your business to fit our software.\n                          </p>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                </tr>\n\n                <tr>\n                  <td style=\"padding:0 0 24px;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                      <tr>\n                        <td width=\"60\" valign=\"top\">\n                          <div style=\"color:#7C3AED; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:32px; font-weight:500; line-height:1; font-style:italic;\">ii.</div>\n                        </td>\n                        <td valign=\"top\" style=\"padding-top:6px;\">\n                          <h3 style=\"margin:0 0 6px; color:#0A0A1A; font-size:17px; font-weight:700; line-height:1.3;\">\n                            Simple isn't dumb. Simple is hard.\n                          </h3>\n                          <p style=\"margin:0; color:#4a4a5e; font-size:14px; line-height:1.65;\">\n                            We spend more time removing features than adding them.\n                          </p>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                </tr>\n\n                <tr>\n                  <td>\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                      <tr>\n                        <td width=\"60\" valign=\"top\">\n                          <div style=\"color:#7C3AED; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:32px; font-weight:500; line-height:1; font-style:italic;\">iii.</div>\n                        </td>\n                        <td valign=\"top\" style=\"padding-top:6px;\">\n                          <h3 style=\"margin:0 0 6px; color:#0A0A1A; font-size:17px; font-weight:700; line-height:1.3;\">\n                            Support is a feature, not a tax.\n                          </h3>\n                          <p style=\"margin:0; color:#4a4a5e; font-size:14px; line-height:1.65;\">\n                            Real humans, no tickets, no waiting on hold.\n                          </p>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Closing -->\n          <tr>\n            <td style=\"padding: 64px 48px 56px;\" class=\"px-48\">\n              <div style=\"height:1px; background:#0A0A1A; line-height:1px; font-size:0; opacity:0.15; margin-bottom:28px;\">&nbsp;</div>\n              <p style=\"margin:0 0 6px; color:#0A0A1A; font-size:15px; line-height:1.6; font-weight:500;\">\n                Thanks for building with us.\n              </p>\n              <p style=\"margin:0; color:#4a4a5e; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:16px; font-style:italic;\">\n                The Nurturely Team\n              </p>\n            </td>\n          </tr>\n\n        </table>\n\n        <!-- Footer -->\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 20px 48px; text-align:center;\" class=\"px-48\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7; letter-spacing:0.3px;\">\n                NURTURELY CRM &nbsp;\u00b7&nbsp; POMONA, CA &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#7C3AED; text-decoration:none;\">Unsubscribe</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "founder", "name": "The Founder", "category": "Personal", "description": "Formal letterhead with personal long-form copy. Cursive signature. From the desk of...", "useFor": "Milestone announcements, vision casting, personal company news", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>A note from Pro</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-56 { padding-left: 28px !important; padding-right: 28px !important; }\n      .h1 { font-size: 28px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#F2EFE7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    A personal note from Pro. Worth the read.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#F2EFE7;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 40px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#FAF9F6;\">\n\n          <!-- Letterhead -->\n          <tr>\n            <td style=\"padding: 44px 56px 0;\" class=\"px-56\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td valign=\"middle\">\n                    <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"38\" height=\"38\" style=\"display:block; border-radius:8px; border:0;\">\n                  </td>\n                  <td valign=\"middle\" align=\"right\">\n                    <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase;\">\n                      From the Desk Of\n                    </div>\n                    <div style=\"color:#0A0A1A; font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; font-style:italic; font-size:16px; margin-top:2px;\">\n                      Pro Hurd\n                    </div>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Double rule -->\n          <tr>\n            <td style=\"padding: 28px 56px 0;\" class=\"px-56\">\n              <div style=\"height:1px; background:#0A0A1A; line-height:1px; font-size:0; opacity:0.85;\">&nbsp;</div>\n              <div style=\"height:3px; line-height:3px; font-size:0;\">&nbsp;</div>\n              <div style=\"height:1px; background:#0A0A1A; line-height:1px; font-size:0; opacity:0.3;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Date line -->\n          <tr>\n            <td style=\"padding: 36px 56px 0;\" class=\"px-56\">\n              <div style=\"font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; color:#6b6b80; font-size:14px; font-style:italic;\">\n                Pomona, CA &nbsp;&middot;&nbsp; May 14, 2026\n              </div>\n            </td>\n          </tr>\n\n          <!-- Salutation -->\n          <tr>\n            <td style=\"padding: 32px 56px 0;\" class=\"px-56\">\n              <p style=\"margin:0; color:#0A0A1A; font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; font-size:20px; font-weight:500; line-height:1.4;\">\n                Dear {{contact.first_name}},\n              </p>\n            </td>\n          </tr>\n\n          <!-- Body \u2014 long form personal letter -->\n          <tr>\n            <td style=\"padding: 24px 56px 0;\" class=\"px-56\">\n\n              <p style=\"margin:0 0 22px; color:#1a1a2e; font-size:16px; line-height:1.8;\">\n                I've been sitting on this email for a few weeks now, not quite sure how to write it. So I'll just say it plain &mdash; we hit a milestone last week that I never thought I'd see in my lifetime, let alone in the first two years of building Nurturely.\n              </p>\n\n              <p style=\"margin:0 0 22px; color:#1a1a2e; font-size:16px; line-height:1.8;\">\n                <strong>1,000 active customers.</strong>\n              </p>\n\n              <p style=\"margin:0 0 22px; color:#1a1a2e; font-size:16px; line-height:1.8;\">\n                If you're reading this, you're one of them. And the only reason this number exists at all is because of decisions you made &mdash; the moment you signed up, the time you stuck with us through a feature that didn't work the way you hoped, the call you took when our support team reached out, the friend you told who became customer 743.\n              </p>\n\n              <p style=\"margin:0 0 22px; color:#1a1a2e; font-size:16px; line-height:1.8;\">\n                I didn't start this company because I wanted to build software. I started it because I watched small business owners in my community spend years getting overcharged and under-served by tools that were built for enterprises and sold to entrepreneurs. I wanted to build something that respected the people using it.\n              </p>\n\n              <p style=\"margin:0 0 22px; color:#1a1a2e; font-size:16px; line-height:1.8;\">\n                I don't know if we always get it right. I know we don't. But I want you to know that every email we send, every feature we ship, every support ticket we answer &mdash; we're trying to live up to the trust you put in us when you chose us.\n              </p>\n\n              <p style=\"margin:0; color:#1a1a2e; font-size:16px; line-height:1.8;\">\n                So &mdash; thank you. From me, from my team, from everyone who shows up to build this thing every day.\n              </p>\n\n            </td>\n          </tr>\n\n          <!-- Signoff -->\n          <tr>\n            <td style=\"padding: 36px 56px 0;\" class=\"px-56\">\n              <p style=\"margin:0 0 14px; color:#0A0A1A; font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; font-size:17px; font-style:italic;\">\n                With real gratitude,\n              </p>\n\n              <!-- \"Signature\" stylized -->\n              <div style=\"color:#0A0A1A; font-family:'Snell Roundhand','Apple Chancery','Brush Script MT', cursive; font-size:36px; line-height:1; letter-spacing:-0.01em; margin-bottom:8px;\">\n                Pro Hurd\n              </div>\n\n              <p style=\"margin:0; color:#6b6b80; font-size:13px; line-height:1.5;\">\n                Founder &amp; CEO &nbsp;&middot;&nbsp; Nurturely CRM\n              </p>\n            </td>\n          </tr>\n\n          <!-- Footer rule -->\n          <tr>\n            <td style=\"padding: 52px 56px 36px;\" class=\"px-56\">\n              <div style=\"height:1px; background:#0A0A1A; line-height:1px; font-size:0; opacity:0.15; margin-bottom:16px;\">&nbsp;</div>\n              <p style=\"margin:0; color:#9999aa; font-size:12px; line-height:1.6; font-style:italic;\">\n                P.S. &mdash; If there's anything we could be doing better, I genuinely want to know. Hit reply. I read every one.\n              </p>\n            </td>\n          </tr>\n\n        </table>\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 20px 56px; text-align:center;\" class=\"px-56\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7; letter-spacing:0.3px;\">\n                NURTURELY CRM &nbsp;\u00b7&nbsp; POMONA, CA &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#7C3AED; text-decoration:none;\">Unsubscribe</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "spotlight", "name": "The Spotlight", "category": "Personal", "description": "Profile card with avatar, stats, quote. Customer or team story as the centerpiece.", "useFor": "Customer success features, team intros, partner highlights", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Meet Marcus</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-48 { padding-left: 28px !important; padding-right: 28px !important; }\n      .h1 { font-size: 32px !important; }\n      .stat-row td { display:block !important; width:100% !important; padding:6px 0 !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#f4f4f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    Meet Marcus \u2014 the story behind how he scaled to 2,400 contacts.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#f4f4f8;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 40px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 4px 20px rgba(13,13,35,0.06);\">\n\n          <!-- Brand row -->\n          <tr>\n            <td style=\"padding: 24px 48px 0;\" class=\"px-48\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td valign=\"middle\" width=\"26\">\n                    <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"24\" height=\"24\" style=\"display:block; border-radius:6px; border:0;\">\n                  </td>\n                  <td valign=\"middle\" style=\"padding-left:10px;\">\n                    <span style=\"color:#0A0A1A; font-size:13px; font-weight:700;\">Nurturely</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Eyebrow -->\n          <tr>\n            <td style=\"padding: 44px 48px 0; text-align:center;\" class=\"px-48\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase;\">\n                Customer Spotlight &nbsp;\u00b7&nbsp; No. 04\n              </div>\n            </td>\n          </tr>\n\n          <!-- Big avatar -->\n          <tr>\n            <td style=\"padding: 32px 48px 0; text-align:center;\" class=\"px-48\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n                <tr>\n                  <td align=\"center\" valign=\"middle\" width=\"120\" height=\"120\" style=\"width:120px; height:120px; background:#0A0A1A; background-image:linear-gradient(135deg, #B794F4 0%, #7C3AED 45%, #4c1d95 100%); border-radius:50%; text-align:center; vertical-align:middle;\">\n                    <span style=\"color:#ffffff; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:48px; font-weight:500; line-height:120px; letter-spacing:-0.02em;\">M</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Name + title -->\n          <tr>\n            <td style=\"padding: 24px 48px 0; text-align:center;\" class=\"px-48\">\n              <h1 class=\"h1\" style=\"margin:0 0 6px; color:#0A0A1A; font-size:34px; font-weight:800; line-height:1.15; letter-spacing:-0.025em;\">\n                Marcus Chen\n              </h1>\n              <div style=\"color:#6b6b80; font-size:15px; line-height:1.5;\">\n                Real Estate Broker &nbsp;\u00b7&nbsp; Riverside, CA\n              </div>\n            </td>\n          </tr>\n\n          <!-- Pull quote -->\n          <tr>\n            <td style=\"padding: 36px 48px 0;\" class=\"px-48\">\n              <p style=\"margin:0; color:#0A0A1A; font-family:'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-size:22px; font-style:italic; line-height:1.5; font-weight:500; text-align:center;\">\n                \"I was running my business out of a spreadsheet and three group chats. Nurturely is the first system that actually fit how I work, not how someone thought I should work.\"\n              </p>\n            </td>\n          </tr>\n\n          <!-- Stats row -->\n          <tr>\n            <td style=\"padding: 40px 48px 0;\" class=\"px-48\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" class=\"stat-row\" style=\"background:#fafaff; border-radius:12px;\">\n                <tr>\n                  <td valign=\"middle\" align=\"center\" style=\"padding:20px 12px; border-right:1px solid #ececf0;\">\n                    <div style=\"color:#0A0A1A; font-size:24px; font-weight:800; line-height:1; letter-spacing:-0.02em;\">\n                      2,400+\n                    </div>\n                    <div style=\"color:#6b6b80; font-size:12px; font-weight:600; margin-top:6px; letter-spacing:0.3px;\">Contacts</div>\n                  </td>\n                  <td valign=\"middle\" align=\"center\" style=\"padding:20px 12px; border-right:1px solid #ececf0;\">\n                    <div style=\"color:#0A0A1A; font-size:24px; font-weight:800; line-height:1; letter-spacing:-0.02em;\">\n                      14\n                    </div>\n                    <div style=\"color:#6b6b80; font-size:12px; font-weight:600; margin-top:6px; letter-spacing:0.3px;\">Pipelines</div>\n                  </td>\n                  <td valign=\"middle\" align=\"center\" style=\"padding:20px 12px;\">\n                    <div style=\"color:#0A0A1A; font-size:24px; font-weight:800; line-height:1; letter-spacing:-0.02em;\">\n                      3x\n                    </div>\n                    <div style=\"color:#6b6b80; font-size:12px; font-weight:600; margin-top:6px; letter-spacing:0.3px;\">Conversion</div>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Body story -->\n          <tr>\n            <td style=\"padding: 36px 48px 0;\" class=\"px-48\">\n              <p style=\"margin:0 0 18px; color:#1a1a2e; font-size:15px; line-height:1.75;\">\n                Before Nurturely, Marcus was juggling Google Sheets, three group chats, and a paper notebook. He'd lost track of which leads he'd contacted and which were still warm. The follow-up was where everything was breaking down.\n              </p>\n              <p style=\"margin:0; color:#1a1a2e; font-size:15px; line-height:1.75;\">\n                Two months after switching, his close rate tripled. Not because he was working harder &mdash; because nothing was falling through the cracks anymore. The system did what he kept telling himself he'd \"get to.\"\n              </p>\n            </td>\n          </tr>\n\n          <!-- CTA -->\n          <tr>\n            <td style=\"padding: 36px 48px 44px; text-align:center;\" class=\"px-48\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n                <tr>\n                  <td align=\"center\" style=\"border-radius:10px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4 0%, #7C3AED 55%, #6D28D9 100%);\">\n                    <a href=\"https://nurturelycrm.com/stories/marcus-chen\" style=\"display:inline-block; padding:14px 32px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:10px; letter-spacing:0.02em;\">\n                      Read Marcus's full story &nbsp;\u2192\n                    </a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n        </table>\n\n        <!-- Footer -->\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 18px 48px; text-align:center;\" class=\"px-48\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7;\">\n                Customer Spotlight &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Unsubscribe</a> &nbsp;\u00b7&nbsp; <a href=\"https://nurturelycrm.com\" style=\"color:#9999aa; text-decoration:none;\">nurturelycrm.com</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "postcard", "name": "The Postcard", "category": "Promotional", "description": "Big visual hero takes 60% of email. Minimal copy. Two sentences max. Quiet celebration.", "useFor": "Milestones, emotional moments, big single-visual reveals", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Look at what you've built.</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-48 { padding-left: 28px !important; padding-right: 28px !important; }\n      .h1 { font-size: 36px !important; }\n      .hero-svg { height: 280px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#f4f4f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    Day 7. Pause for a moment and look at what you've quietly built.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#f4f4f8;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 40px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#ffffff; border-radius:18px; overflow:hidden; box-shadow:0 4px 28px rgba(13,13,35,0.08);\">\n\n          <!-- Hero illustration (SVG-based, scales without external image) -->\n          <tr>\n            <td style=\"padding:0; line-height:0; font-size:0;\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#0A0A1A; background-image:linear-gradient(150deg, #0A0A1A 0%, #1a0b3d 45%, #4c1d95 85%, #7C3AED 100%);\">\n                <tr>\n                  <td align=\"center\" valign=\"middle\" class=\"hero-svg\" style=\"height:380px; padding:40px 0;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n                      <tr>\n                        <td align=\"center\">\n                          <!-- Big stylized \"7\" with glow circle -->\n                          <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n                            <tr>\n                              <td align=\"center\" valign=\"middle\" width=\"200\" height=\"200\" style=\"width:200px; height:200px; background:rgba(183,148,244,0.12); border:1px solid rgba(183,148,244,0.3); border-radius:50%; text-align:center; vertical-align:middle;\">\n                                <div style=\"color:#ffffff; font-family:'Iowan Old Style','Palatino Linotype', Georgia, serif; font-size:120px; font-weight:500; line-height:1; letter-spacing:-0.04em;\">\n                                  7\n                                </div>\n                              </td>\n                            </tr>\n                          </table>\n                          <div style=\"margin-top:24px; color:#B794F4; font-size:12px; font-weight:700; letter-spacing:4px; text-transform:uppercase;\">\n                            Days In\n                          </div>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Headline + minimal copy -->\n          <tr>\n            <td style=\"padding: 48px 48px 8px; text-align:center;\" class=\"px-48\">\n              <h1 class=\"h1\" style=\"margin:0 0 22px; color:#0A0A1A; font-size:42px; font-weight:800; line-height:1.1; letter-spacing:-0.03em;\">\n                Look at what you've<br>quietly built.\n              </h1>\n              <p style=\"margin:0 auto; color:#4a4a5e; font-size:17px; line-height:1.65; max-width:420px;\">\n                One week ago, your CRM was empty. Today, your contacts are in, your pipelines are live, and your first campaign has already gone out. That's not nothing &mdash; that's a system.\n              </p>\n            </td>\n          </tr>\n\n          <!-- CTA -->\n          <tr>\n            <td style=\"padding: 36px 48px 0; text-align:center;\" class=\"px-48\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n                <tr>\n                  <td align=\"center\" style=\"border-radius:10px; background:#0A0A1A;\">\n                    <a href=\"https://app.nurturelycrm.com/dashboard\" style=\"display:inline-block; padding:16px 36px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-siz font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:8px;\">\n                      Annual Plan\n                    </div>\n                    <div style=\"color:#0A0A1A; font-size:30px; font-weight:800; line-height:1; letter-spacing:-0.02em;\">\n                      $1,252\n                    </div>\n                    <div style=\"color:#10B981; font-size:12px; font-weight:700; margin-top:6px;\">You save $536</div>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- What's included -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px;\">\n                What's Included\n              </div>\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr><td style=\"padding:5px 0; color:#1a1a2e; font-size:15px; line-height:1.55;\">\n                  <span style=\"color:#10B981; font-weight:800; margin-right:10px;\">\u2713</span>Everything in your current plan, locked at 2026 pricing\n                </td></tr>\n                <tr><td style=\"padding:5px 0; color:#1a1a2e; font-size:15px; line-height:1.55;\">\n                  <span style=\"color:#10B981; font-weight:800; margin-right:10px;\">\u2713</span>One free strategy call with our success team\n                </td></tr>\n                <tr><td style=\"padding:5px 0; color:#1a1a2e; font-size:15px; line-height:1.55;\">\n                  <span style=\"color:#10B981; font-weight:800; margin-right:10px;\">\u2713</span>Priority support for the entire year\n                </td></tr>\n                <tr><td style=\"padding:5px 0; color:#1a1a2e; font-size:15px; line-height:1.55;\">\n                  <span style=\"color:#10B981; font-weight:800; margin-right:10px;\">\u2713</span>No price increases if we raise our rates next year\n                </td></tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- CTA -->\n          <tr>\n            <td style=\"padding: 40px 44px 0; text-align:center;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n                <tr>\n                  <td align=\"center\" style=\"border-radius:10px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4 0%, #7C3AED 55%, #6D28D9 100%); box-shadow:0 10px 24px rgba(124,58,237,0.3);\">\n                    <a href=\"#\" style=\"display:inline-block; padding:18px 40px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:16px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:10px; letter-spacing:0.02em;\">\n                      Upgrade to annual &nbsp;\u2192\n                    </a>\n                  </td>\n                </tr>\n              </table>\n              <div style=\"margin-top:14px; color:#9999aa; font-size:13px; line-height:1.5;\">\n                Offer ends Friday, May 17 at 11:59 PM PT\n              </div>\n            </td>\n          </tr>\n\n          <!-- Fine print -->\n          <tr>\n            <td style=\"padding: 36px 44px 36px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0; margin-bottom:16px;\">&nbsp;</div>\n              <p style=\"margin:0; color:#9999aa; font-size:12px; line-height:1.6;\">\n                Discount applies to your first annual billing cycle. Renews at standard annual rate. Cancel anytime. Questions? Reply to this email.\n              </p>\n            </td>\n          </tr>\n\n        </table>\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 18px 44px; text-align:center;\" class=\"px-44\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7;\">\n                Nurturely CRM &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Unsubscribe</a> &nbsp;\u00b7&nbsp; <a href=\"https://nurturelycrm.com\" style=\"color:#9999aa; text-decoration:none;\">nurturelycrm.com</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "invite", "name": "The Invite", "category": "Promotional", "description": "Event invitation. Massive serif date block as visual identity. Structured event details.", "useFor": "Webinars, office hours, workshops, beta launches", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>You're invited</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-44 { padding-left: 24px !important; padding-right: 24px !important; }\n      .h1 { font-size: 28px !important; }\n      .date-num { font-size: 84px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#f4f4f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    You're invited \u2014 Pipeline Design Office Hours, June 6 at 11 AM PT.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#f4f4f8;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 40px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\" ng>\n                        </td>\n                        <td style=\"padding:6px 0; color:#1a1a2e; font-size:14px; line-height:1.5;\">\n                          11:00 AM &mdash; 11:45 AM &nbsp;<span style=\"color:#9999aa;\">PT</span>\n                        </td>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px 0; color:#6b6b80; font-size:13px; line-height:1.5;\" width=\"100\">\n                          <strong style=\"color:#0A0A1A; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; font-size:11px;\">Format</strong>\n                        </td>\n                        <td style=\"padding:6px 0; color:#1a1a2e; font-size:14px; line-height:1.5;\">\n                          Live on Zoom &nbsp;<span style=\"color:#9999aa;\">\u00b7 Link sent after RSVP</span>\n                        </td>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px 0; color:#6b6b80; font-size:13px; line-height:1.5;\" width=\"100\">\n                          <strong style=\"color:#0A0A1A; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; font-size:11px;\">Seats</strong>\n                        </td>\n                        <td style=\"padding:6px 0; color:#1a1a2e; font-size:14px; line-height:1.5;\">\n                          6 total &nbsp;<span style=\"color:#10B981; font-weight:600;\">\u00b7 4 still available</span>\n                        </td>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px 0; color:#6b6b80; font-size:13px; line-height:1.5;\" width=\"100\">\n                          <strong style=\"color:#0A0A1A; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; font-size:11px;\">Cost</strong>\n                        </td>\n                        <td style=\"padding:6px 0; color:#1a1a2e; font-size:14px; line-height:1.5;\">\n                          Free for Nurturely customers\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- What to expect -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px;\">\n                What To Expect\n              </div>\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr><td style=\"padding:5px 0; color:#1a1a2e; font-size:15px; line-height:1.55;\">\n                  <span style=\"color:#7C3AED; font-weight:700; margin-right:10px;\">\u2192</span>15 minutes of live pipeline teardowns\n                </td></tr>\n                <tr><td style=\"padding:5px 0; color:#1a1a2e; font-size:15px; line-height:1.55;\">\n                  <span style=\"color:#7C3AED; font-weight:700; margin-right:10px;\">\u2192</span>20 minutes of open Q&amp;A on your specific setup\n                </td></tr>\n                <tr><td style=\"padding:5px 0; color:#1a1a2e; font-size:15px; line-height:1.55;\">\n                  <span style=\"color:#7C3AED; font-weight:700; margin-right:10px;\">\u2192</span>Recording sent to everyone who RSVPs\n                </td></tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- CTA -->\n          <tr>\n            <td style=\"padding: 36px 44px 0; text-align:center;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n                <tr>\n                  <td align=\"center\" style=\"border-radius:10px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4 0%, #7C3AED 55%, #6D28D9 100%); box-shadow:0 8px 20px rgba(124,58,237,0.25);\">\n                    <a href=\"#\" style=\"display:inline-block; padding:16px 36px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:15px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:10px; letter-spacing:0.02em;\">\n                      Save my seat &nbsp;\u2192\n                    </a>\n                  </td>\n                </tr>\n              </table>\n              <div style=\"margin-top:14px;\">\n                <a href=\"#\" style=\"color:#7C3AED; font-size:13px; font-weight:600; text-decoration:none;\">+ Add to Calendar</a>\n              </div>\n            </td>\n          </tr>\n\n          <!-- Closing -->\n          <tr>\n            <td style=\"padding: 44px 44px 36px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0; margin-bottom:18px;\">&nbsp;</div>\n              <p style=\"margin:0; color:#9999aa; font-size:13px; line-height:1.6;\">\n                Can't make it? We'll send the recording to everyone who RSVPs &mdash; even if you miss it live.\n              </p>\n            </td>\n          </tr>\n\n        </table>\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 18px 44px; text-align:center;\" class=\"px-44\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7;\">\n                Nurturely CRM &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Unsubscribe</a> &nbsp;\u00b7&nbsp; <a href=\"https://nurturelycrm.com\" style=\"color:#9999aa; text-decoration:none;\">nurturelycrm.com</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "feature-release", "name": "The Feature Release", "category": "Product", "description": "Big launch announcement. Dark gradient hero, three-column highlights, beta tester quote.", "useFor": "Major feature launches, public releases, big product moments", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Now live \u2014 Pipeline Templates</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-44 { padding-left: 24px !important; padding-right: 24px !important; }\n      .h1 { font-size: 30px !important; }\n      .hero-title { font-size: 44px !important; }\n      .three-col td { display:block !important; width:100% !important; padding:8px 0 !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#f4f4f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    Pipeline Templates are live. 12 ready-made pipelines, zero setup.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#f4f4f8;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 32px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#ffffff; border-radius:14px; overflow:hidden; border:1px solid #ececf0;\">\n\n          <!-- Brand row -->\n          <tr>\n            <td style=\"padding: 22px 44px;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td valign=\"middle\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing
