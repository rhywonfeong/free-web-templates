=\"0\" border=\"0\">\n                      <tr>\n                        <td valign=\"middle\" width=\"26\">\n                          <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"24\" height=\"24\" style=\"display:block; border-radius:6px; border:0;\">\n                        </td>\n                        <td valign=\"middle\" style=\"padding-left:10px;\">\n                          <span style=\"color:#0A0A1A; font-size:13px; font-weight:700;\">Nurturely</span>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"middle\" align=\"right\">\n                    <span style=\"display:inline-block; padding:4px 10px; background:#e8f7ed; color:#10B981; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:10px; font-weight:700; border-radius:5px; letter-spacing:0.5px;\">\u25cf NOW LIVE</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Hero banner -->\n          <tr>\n            <td style=\"padding:0; line-height:0; font-size:0;\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#0A0A1A; background-image:linear-gradient(135deg, #0A0A1A 0%, #1a0b3d 40%, #4c1d95 80%, #7C3AED 100%);\">\n                <tr>\n                  <td style=\"padding: 60px 44px 56px; text-align:center;\" class=\"px-44\">\n                    <div style=\"color:#B794F4; font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; margin-bottom:18px;\">\n                      Just Launched &nbsp;\u00b7&nbsp; May 14\n                    </div>\n                    <h1 class=\"hero-title\" style=\"margin:0 0 16px; color:#ffffff; font-size:52px; font-weight:800; line-height:1.05; letter-spacing:-0.03em;\">\n                      Pipeline<br>Templates.\n                    </h1>\n                    <p style=\"margin:0 auto; color:#c0b8db; font-size:16px; line-height:1.6; max-width:380px;\">\n                      12 ready-made pipelines for every industry. Zero setup. Just pick, plug, run.\n                    </p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Pitch paragraph -->\n          <tr>\n            <td style=\"padding: 44px 44px 0;\" class=\"px-44\">\n              <p style=\"margin:0; color:#1a1a2e; font-size:16px; line-height:1.7;\">\n                We heard you. The biggest blocker for new customers was staring at an empty pipeline view, wondering where to start. So we built every pipeline we've ever seen work &mdash; and dropped them straight into your system.\n              </p>\n            </td>\n          </tr>\n\n          <!-- Three column highlights -->\n          <tr>\n            <td style=\"padding: 40px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" class=\"three-col\">\n                <tr>\n                  <td valign=\"top\" width=\"33%\" style=\"padding-right:14px;\">\n                    <div style=\"background:#fafaff; border:1px solid #ececf0; border-radius:10px; padding:18px;\">\n                      <div style=\"color:#7C3AED; font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; font-size:36px; font-weight:500; line-height:1; letter-spacing:-0.02em; margin-bottom:10px;\">12</div>\n                      <div style=\"color:#0A0A1A; font-size:13px; font-weight:700; margin-bottom:4px;\">Industry templates</div>\n                      <div style=\"color:#6b6b80; font-size:12px; line-height:1.5;\">Real estate, fitness, services, retail, more.</div>\n                    </div>\n                  </td>\n                  <td valign=\"top\" width=\"33%\" style=\"padding:0 7px;\">\n                    <div style=\"background:#fafaff; border:1px solid #ececf0; border-radius:10px; padding:18px;\">\n                      <div style=\"color:#7C3AED; font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; font-size:36px; font-weight:500; line-height:1; letter-spacing:-0.02em; margin-bottom:10px;\">0</div>\n                      <div style=\"color:#0A0A1A; font-size:13px; font-weight:700; margin-bottom:4px;\">Setup required</div>\n                      <div style=\"color:#6b6b80; font-size:12px; line-height:1.5;\">Pre-built stages, statuses, automations.</div>\n                    </div>\n                  </td>\n                  <td valign=\"top\" width=\"33%\" style=\"padding-left:14px;\">\n                    <div style=\"background:#fafaff; border:1px solid #ececf0; border-radius:10px; padding:18px;\">\n                      <div style=\"color:#7C3AED; font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; font-size:36px; font-weight:500; line-height:1; letter-spacing:-0.02em; margin-bottom:10px;\">\u221e</div>\n                      <div style=\"color:#0A0A1A; font-size:13px; font-weight:700; margin-bottom:4px;\">Customizable</div>\n                      <div style=\"color:#6b6b80; font-size:12px; line-height:1.5;\">Start with a template, make it yours.</div>\n                    </div>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- CTA section -->\n          <tr>\n            <td style=\"padding: 44px 44px 0; text-align:center;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n                <tr>\n                  <td align=\"center\" style=\"border-radius:10px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4 0%, #7C3AED 55%, #6D28D9 100%); box-shadow:0 10px 24px rgba(124,58,237,0.3);\">\n                    <a href=\"#\" style=\"display:inline-block; padding:16px 36px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:15px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:10px; letter-spacing:0.02em;\">\n                      Browse templates &nbsp;\u2192\n                    </a>\n                  </td>\n                </tr>\n              </table>\n              <div style=\"margin-top:14px;\">\n                <a href=\"#\" style=\"color:#6b6b80; font-size:13px; font-weight:600; text-decoration:none;\">Watch the 60-second demo \u2192</a>\n              </div>\n            </td>\n          </tr>\n\n          <!-- Quote pull -->\n          <tr>\n            <td style=\"padding: 44px 44px 0;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0; margin-bottom:28px;\">&nbsp;</div>\n              <p style=\"margin:0 0 12px; color:#0A0A1A; font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; font-size:18px; font-style:italic; line-height:1.5; font-weight:500;\">\n                \"I literally clicked the real estate template and was up and running in 4 minutes. This should have existed two years ago.\"\n              </p>\n              <p style=\"margin:0; color:#6b6b80; font-size:13px;\">\n                &mdash; Sarah K., beta tester\n              </p>\n            </td>\n          </tr>\n\n          <!-- Closing -->\n          <tr>\n            <td style=\"padding: 36px 44px 36px;\" class=\"px-44\">\n              <p style=\"margin:0; color:#9999aa; font-size:13px; line-height:1.6;\">\n                Available now in your account. Just head to Pipelines and click \"New from template.\"\n              </p>\n            </td>\n          </tr>\n\n        </table>\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 18px 44px; text-align:center;\" class=\"px-44\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7;\">\n                Nurturely CRM &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Unsubscribe</a> &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Changelog</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "product-update", "name": "The Product Update", "category": "Product", "description": "Linear/Vercel style. Slim purple strip, mono accents, UI preview blocks, keyboard shortcuts.", "useFor": "Minor feature drops, technical updates, changelog announcements", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>New in Nurturely \u00b7 Smart Lists</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-44 { padding-left: 24px !important; padding-right: 24px !important; }\n      .h1 { font-size: 26px !important; }\n      .feat-grid td { display:block !important; width:100% !important; padding:0 0 16px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#f4f4f8; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    Smart Lists \u2014 auto-update segments without writing a single rule.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#f4f4f8;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 32px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#ffffff; border-radius:14px; overflow:hidden; border:1px solid #ececf0;\">\n\n          <!-- Slim brand strip -->\n          <tr>\n            <td style=\"background: #7C3AED; background-image: linear-gradient(90deg, #B794F4 0%, #7C3AED 50%, #6D28D9 100%); height:3px; line-height:3px; font-size:0;\">&nbsp;</td>\n          </tr>\n\n          <!-- Header row -->\n          <tr>\n            <td style=\"padding: 22px 44px;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td valign=\"middle\" width=\"32\">\n                    <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"28\" height=\"28\" style=\"display:block; border-radius:6px; border:0;\">\n                  </td>\n                  <td valign=\"middle\" style=\"padding-left:12px;\">\n                    <span style=\"color:#0A0A1A; font-size:14px; font-weight:700; letter-spacing:-0.01em;\">Nurturely CRM</span>\n                  </td>\n                  <td valign=\"middle\" align=\"right\" style=\"text-align:right;\">\n                    <span style=\"display:inline-block; padding:4px 10px; background:#f0ebfb; color:#6D28D9; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:700; border-radius:5px; letter-spacing:0.5px;\">v2.4 \u00b7 NEW</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Divider -->\n          <tr>\n            <td style=\"padding: 0 44px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Feature header -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px;\">\n                Feature Drop\n              </div>\n              <h1 class=\"h1\" style=\"margin:0 0 14px; color:#0A0A1A; font-size:32px; font-weight:700; line-height:1.15; letter-spacing:-0.025em;\">\n                Smart Lists are here.\n              </h1>\n              <p style=\"margin:0; color:#4a4a5e; font-size:15px; line-height:1.6;\">\n                Auto-updating contact segments. Set the criteria once. Your list rebuilds itself in real time as contacts match or unmatch.\n              </p>\n            </td>\n          </tr>\n\n          <!-- Visual mockup placeholder (UI preview block) -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#fafaff; border:1px solid #ececf0; border-radius:10px;\">\n                <tr>\n                  <td style=\"padding:20px 22px;\">\n\n                    <!-- Mock window title bar -->\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"margin-bottom:14px;\">\n                      <tr>\n                        <td valign=\"middle\">\n                          <span style=\"color:#0A0A1A; font-size:13px; font-weight:600;\">\u26a1 &nbsp;High-Value Leads</span>\n                        </td>\n                        <td valign=\"middle\" align=\"right\">\n                          <span style=\"display:inline-block; padding:2px 8px; background:#e8f7ed; color:#10B981; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:700; border-radius:4px;\">\u25cf LIVE</span>\n                        </td>\n                      </tr>\n                    </table>\n\n                    <!-- Mock rule rows -->\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                      <tr>\n                        <td style=\"padding:6px 0; color:#6b6b80; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:12px; line-height:1.5;\">\n                          <span style=\"color:#7C3AED;\">if</span> deal_value <span style=\"color:#7C3AED;\">&gt;</span> <span style=\"color:#10B981;\">5000</span>\n                        </td>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px 0; color:#6b6b80; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:12px; line-height:1.5;\">\n                          <span style=\"color:#7C3AED;\">and</span> last_opened <span style=\"color:#7C3AED;\">&lt;</span> <span style=\"color:#10B981;\">7 days</span>\n                        </td>\n                      </tr>\n                      <tr>\n                        <td style=\"padding:6px 0; color:#6b6b80; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:12px; line-height:1.5;\">\n                          <span style=\"color:#7C3AED;\">and</span> tags <span style=\"color:#7C3AED;\">includes</span> <span style=\"color:#10B981;\">\"qualified\"</span>\n                        </td>\n                      </tr>\n                    </table>\n\n                    <div style=\"margin-top:14px; padding-top:12px; border-top:1px solid #ececf0; color:#9999aa; font-size:12px;\">\n                      <strong style=\"color:#0A0A1A;\">47 contacts match</strong> &nbsp;\u00b7&nbsp; updates in real time\n                    </div>\n\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Feature grid -->\n          <tr>\n            <td style=\"padding: 32px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" class=\"feat-grid\">\n                <tr>\n                  <td valign=\"top\" width=\"33%\" style=\"padding-right:16px;\">\n                    <div style=\"color:#7C3AED; font-size:18px; margin-bottom:6px;\">\u25c6</div>\n                    <div style=\"color:#0A0A1A; font-size:14px; font-weight:700; margin-bottom:4px;\">Real-time sync</div>\n                    <div style=\"color:#6b6b80; font-size:13px; line-height:1.5;\">Lists update the instant a contact matches.</div>\n                  </td>\n                  <td valign=\"top\" width=\"33%\" style=\"padding:0 8px;\">\n                    <div style=\"color:#7C3AED; font-size:18px; margin-bottom:6px;\">\u25c7</div>\n                    <div style=\"color:#0A0A1A; font-size:14px; font-weight:700; margin-bottom:4px;\">Stack any field</div>\n                    <div style=\"color:#6b6b80; font-size:13px; line-height:1.5;\">Tags, custom fields, behavior &mdash; mix freely.</div>\n                  </td>\n                  <td valign=\"top\" width=\"33%\" style=\"padding-left:16px;\">\n                    <div style=\"color:#7C3AED; font-size:18px; margin-bottom:6px;\">\u25c8</div>\n                    <div style=\"color:#0A0A1A; font-size:14px; font-weight:700; margin-bottom:4px;\">Pipe to campaigns</div>\n                    <div style=\"color:#6b6b80; font-size:13px; line-height:1.5;\">Drop a Smart List into any automation.</div>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- CTA -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"border-radius:8px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4 0%, #7C3AED 55%, #6D28D9 100%);\">\n                    <a href=\"https://app.nurturelycrm.com/lists/new\" style=\"display:inline-block; padding:13px 28px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:8px;\">\n                      Try Smart Lists &nbsp;\u2192\n                    </a>\n                  </td>\n                  <td style=\"padding-left:14px;\">\n                    <a href=\"#\" style=\"font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; font-weight:600; color:#6b6b80; text-decoration:none;\">Read the docs \u2192</a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Hotkey footer -->\n          <tr>\n            <td style=\"padding: 32px 44px 36px;\" class=\"px-44\">\n              <div style=\"background:#fafaff; border:1px solid #ececf0; border-radius:8px; padding:14px 18px;\">\n                <span style=\"color:#6b6b80; font-size:13px;\">Pro tip: Press</span>\n                <span style=\"display:inline-block; padding:2px 7px; margin:0 4px; background:#0A0A1A; color:#ffffff; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:600; border-radius:4px;\">\u2318</span><span style=\"display:inline-block; padding:2px 7px; margin:0 4px 0 0; background:#0A0A1A; color:#ffffff; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:600; border-radius:4px;\">L</span>\n                <span style=\"color:#6b6b80; font-size:13px;\">anywhere in the app to jump to your Lists.</span>\n              </div>\n            </td>\n          </tr>\n\n        </table>\n\n        <!-- Footer -->\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 18px 44px; text-align:center;\" class=\"px-44\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7;\">\n                Nurturely CRM &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Unsubscribe</a> &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Changelog</a> &nbsp;\u00b7&nbsp; <a href=\"https://nurturelycrm.com\" style=\"color:#9999aa; text-decoration:none;\">nurturelycrm.com</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "feature-education", "name": "The Feature Education", "category": "Product", "description": "Did you know style. Surfaces hidden features customers don't realize they have.", "useFor": "Existing feature spotlights, usage education, adoption pushes", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Did you know \u2014 Nurturely auto-tags birthdays</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-44 { padding-left: 24px !important; padding-right: 24px !important; }\n      .h1 { font-size: 28px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#f4f4f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    A Nurturely feature you might not be using \u2014 but should be.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#f4f4f8;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 32px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#ffffff; border-radius:14px; overflow:hidden; border:1px solid #ececf0;\">\n\n          <!-- Brand row -->\n          <tr>\n            <td style=\"padding: 22px 44px;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td valign=\"middle\" width=\"26\">\n                    <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"24\" height=\"24\" style=\"display:block; border-radius:6px; border:0;\">\n                  </td>\n                  <td valign=\"middle\" style=\"padding-left:10px;\">\n                    <span style=\"color:#0A0A1A; font-size:13px; font-weight:700;\">Nurturely</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <tr>\n            <td style=\"padding: 0 44px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Big eyebrow -->\n          <tr>\n            <td style=\"padding: 56px 44px 0; text-align:center;\" class=\"px-44\">\n              <div style=\"display:inline-block; padding:8px 18px; background:#f0ebfb; border-radius:100px;\">\n                <span style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase;\">\n                  Did You Know\n                </span>\n              </div>\n            </td>\n          </tr>\n\n          <!-- Question hook -->\n          <tr>\n            <td style=\"padding: 32px 44px 0; text-align:center;\" class=\"px-44\">\n              <h1 class=\"h1\" style=\"margin:0 0 18px; color:#0A0A1A; font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; font-size:32px; font-weight:500; line-height:1.25; letter-spacing:-0.015em; font-style:italic;\">\n                Your CRM already knows<br>everyone's birthday.\n              </h1>\n              <p style=\"margin:0 auto; color:#4a4a5e; font-size:15px; line-height:1.65; max-width:440px;\">\n                You just have to ask. {{contact.first_name}}, here's a Nurturely feature 73% of customers don't realize they have.\n              </p>\n            </td>\n          </tr>\n\n          <!-- The reveal box -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#fafaff; border:1px solid #ececf0; border-radius:12px;\">\n                <tr>\n                  <td style=\"padding: 28px 30px;\">\n                    <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px;\">\n                      The Feature\n                    </div>\n                    <h3 style=\"margin:0 0 14px; color:#0A0A1A; font-size:20px; font-weight:700; line-height:1.3; letter-spacing:-0.015em;\">\n                      Smart Date Tags\n                    </h3>\n                    <p style=\"margin:0 0 18px; color:#4a4a5e; font-size:14px; line-height:1.7;\">\n                      Any time you add a date field to a contact &mdash; birthday, anniversary, contract renewal, lease expiration &mdash; Nurturely auto-creates a tag and a calendar trigger. You can build automations off it without lifting a finger.\n                    </p>\n\n                    <!-- Use case examples -->\n                    <div style=\"background:#ffffff; border:1px solid #ececf0; border-radius:8px; padding:16px 18px;\">\n                      <div style=\"color:#0A0A1A; font-size:12px; font-weight:700; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:10px;\">What you can do with it</div>\n                      <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                        <tr><td style=\"padding:4px 0; color:#1a1a2e; font-size:13px; line-height:1.5;\">\n                          <span style=\"color:#7C3AED; font-weight:700; margin-right:8px;\">\u2192</span>Send automatic birthday messages\n                        </td></tr>\n                        <tr><td style=\"padding:4px 0; color:#1a1a2e; font-size:13px; line-height:1.5;\">\n                          <span style=\"color:#7C3AED; font-weight:700; margin-right:8px;\">\u2192</span>Trigger renewal reminders 30 days out\n                        </td></tr>\n                        <tr><td style=\"padding:4px 0; color:#1a1a2e; font-size:13px; line-height:1.5;\">\n                          <span style=\"color:#7C3AED; font-weight:700; margin-right:8px;\">\u2192</span>Build \"anniversary of first purchase\" campaigns\n                        </td></tr>\n                        <tr><td style=\"padding:4px 0; color:#1a1a2e; font-size:13px; line-height:1.5;\">\n                          <span style=\"color:#7C3AED; font-weight:700; margin-right:8px;\">\u2192</span>Surface clients you haven't touched in 90 days\n                        </td></tr>\n                      </table>\n                    </div>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Why it matters -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px;\">\n                Why It Matters\n              </div>\n              <p style=\"margin:0 0 16px; color:#1a1a2e; font-size:15px; line-height:1.7;\">\n                Most CRMs treat dates like data. They sit in a column and do nothing. Nurturely treats every date as a relationship moment &mdash; a chance to show up at exactly the right time, without you having to remember.\n              </p>\n              <p style=\"margin:0; color:#1a1a2e; font-size:15px; line-height:1.7;\">\n                The customers who use this feature send 4.2x more birthday/anniversary touches per month than ones who don't. Their reply rates on those touches are 38% higher than any other campaign type.\n              </p>\n            </td>\n          </tr>\n\n          <!-- CTA -->\n          <tr>\n            <td style=\"padding: 40px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"border-radius:8px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4 0%, #7C3AED 55%, #6D28D9 100%);\">\n                    <a href=\"#\" style=\"display:inline-block; padding:14px 28px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:8px;\">\n                      Set up Smart Date Tags &nbsp;\u2192\n                    </a>\n                  </td>\n                  <td style=\"padding-left:14px;\">\n                    <a href=\"#\" style=\"font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; font-weight:600; color:#6b6b80; text-decoration:none;\">Read the full guide \u2192</a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Closing -->\n          <tr>\n            <td style=\"padding: 40px 44px 36px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0; margin-bottom:16px;\">&nbsp;</div>\n              <p style=\"margin:0; color:#9999aa; font-size:13px; line-height:1.6;\">\n                One feature you didn't know you had, every Wednesday. Reply with topics you'd like us to cover.\n              </p>\n            </td>\n          </tr>\n\n        </table>\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 18px 44px; text-align:center;\" class=\"px-44\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7;\">\n                Nurturely Education &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Unsubscribe</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "roadmap", "name": "The Roadmap", "category": "Product", "description": "Public roadmap preview. Color-coded status pills: Shipped, In Progress, Exploring.", "useFor": "Quarterly roadmap updates, transparency comms, beta announcements", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>What's coming to Nurturely</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-44 { padding-left: 24px !important; padding-right: 24px !important; }\n      .h1 { font-size: 28px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#f4f4f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    What we're building next. A quick look at Nurturely's roadmap.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#f4f4f8;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 32px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#ffffff; border-radius:14px; overflow:hidden; border:1px solid #ececf0;\">\n\n          <!-- Brand row -->\n          <tr>\n            <td style=\"padding: 22px 44px;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td valign=\"middle\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                      <tr>\n                        <td valign=\"middle\" width=\"26\">\n                          <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"24\" height=\"24\" style=\"display:block; border-radius:6px; border:0;\">\n                        </td>\n                        <td valign=\"middle\" style=\"padding-left:10px;\">\n                          <span style=\"color:#0A0A1A; font-size:13px; font-weight:700;\">Nurturely</span>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"middle\" align=\"right\">\n                    <span style=\"color:#9999aa; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:600; letter-spacing:1px;\">Q2 ROADMAP \u00b7 2026</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <tr>\n            <td style=\"padding: 0 44px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Hero -->\n          <tr>\n            <td style=\"padding: 40px 44px 0;\" class=\"px-44\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:14px;\">\n                What's Coming Next\n              </div>\n              <h1 class=\"h1\" style=\"margin:0 0 14px; color:#0A0A1A; font-size:32px; font-weight:800; line-height:1.2; letter-spacing:-0.025em;\">\n                The roadmap, opened up.\n              </h1>\n              <p style=\"margin:0; color:#4a4a5e; font-size:15px; line-height:1.65;\">\n                A look at what we're working on right now, what's coming soon, and what's already shipped. Updated quarterly.\n              </p>\n            </td>\n          </tr>\n\n          <!-- SHIPPED section -->\n          <tr>\n            <td style=\"padding: 40px 44px 0;\" class=\"px-44\">\n              <div style=\"margin-bottom:18px;\">\n                <span style=\"display:inline-block; padding:5px 12px; background:#e8f7ed; color:#065f46; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:700; border-radius:5px; letter-spacing:0.5px;\">\u25cf SHIPPED \u00b7 APRIL</span>\n              </div>\n\n              <!-- Item -->\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#fafaff; border:1px solid #ececf0; border-radius:10px; margin-bottom:10px;\">\n                <tr>\n                  <td style=\"padding:18px 22px;\">\n                    <h3 style=\"margin:0 0 6px; color:#0A0A1A; font-size:15px; font-weight:700; line-height:1.3;\">Smart Lists</h3>\n                    <p style=\"margin:0; color:#6b6b80; font-size:13px; line-height:1.55;\">Auto-updating segments that rebuild as contacts match your rules.</p>\n                  </td>\n                </tr>\n              </table>\n\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#fafaff; border:1px solid #ececf0; border-radius:10px;\">\n                <tr>\n                  <td style=\"padding:18px 22px;\">\n                    <h3 style=\"margin:0 0 6px; color:#0A0A1A; font-size:15px; font-weight:700; line-height:1.3;\">Pipeline Templates</h3>\n                    <p style=\"margin:0; color:#6b6b80; font-size:13px; line-height:1.55;\">12 ready-made pipelines across industries. Zero setup.</p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- IN PROGRESS section -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <div style=\"margin-bottom:18px;\">\n                <span style=\"display:inline-block; padding:5px 12px; background:#fef3c7; color:#92400e; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:700; border-radius:5px; letter-spacing:0.5px;\">\u25d0 IN PROGRESS \u00b7 NOW</span>\n              </div>\n\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#fffaeb; border:1px solid #fcd9a6; border-radius:10px; margin-bottom:10px;\">\n                <tr>\n                  <td style=\"padding:18px 22px;\">\n                    <h3 style=\"margin:0 0 6px; color:#0A0A1A; font-size:15px; font-weight:700; line-height:1.3;\">AI Reply Drafts</h3>\n                    <p style=\"margin:0; color:#78350f; font-size:13px; line-height:1.55;\">Suggested responses based on conversation history. Beta opens in late May.</p>\n                  </td>\n                </tr>\n              </table>\n\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#fffaeb; border:1px solid #fcd9a6; border-radius:10px;\">\n                <tr>\n                  <td style=\"padding:18px 22px;\">\n                    <h3 style=\"margin:0 0 6px; color:#0A0A1A; font-size:15px; font-weight:700; line-height:1.3;\">Mobile App (iOS + Android)</h3>\n                    <p style=\"margin:0; color:#78350f; font-size:13px; line-height:1.55;\">Full Nurturely on your phone. Public beta planned for June.</p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- COMING SOON section -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <div style=\"margin-bottom:18px;\">\n                <span style=\"display:inline-block; padding:5px 12px; background:#f0ebfb; color:#5b21b6; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:700; border-radius:5px; letter-spacing:0.5px;\">\u25cb EXPLORING \u00b7 Q3</span>\n              </div>\n\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#faf8ff; border:1px dashed #d4c4f0; border-radius:10px; margin-bottom:10px;\">\n                <tr>\n                  <td style=\"padding:18px 22px;\">\n                    <h3 style=\"margin:0 0 6px; color:#0A0A1A; font-size:15px; font-weight:700; line-height:1.3;\">Multi-currency support</h3>\n                    <p style=\"margin:0; color:#6b6b80; font-size:13px; line-height:1.55;\">For customers operating across regions. Still in design.</p>\n                  </td>\n                </tr>\n              </table>\n\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#faf8ff; border:1px dashed #d4c4f0; border-radius:10px;\">\n                <tr>\n                  <td style=\"padding:18px 22px;\">\n                    <h3 style=\"margin:0 0 6px; color:#0A0A1A; font-size:15px; font-weight:700; line-height:1.3;\">Custom Reporting Builder</h3>\n                    <p style=\"margin:0; color:#6b6b80; font-size:13px; line-height:1.55;\">Build any dashboard you want from any data we collect. Researching.</p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Feedback CTA -->\n          <tr>\n            <td style=\"padding: 40px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#0A0A1A; background-image:linear-gradient(135deg, #0A0A1A 0%, #1a0b3d 60%, #2d1a5a 100%); border-radius:12px;\">\n                <tr>\n                  <td style=\"padding:24px 28px;\">\n                    <div style=\"color:#B794F4; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:8px;\">\n                      Have Input?\n                    </div>\n                    <h3 style=\"margin:0 0 10px; color:#ffffff; font-size:17px; font-weight:700; line-height:1.3;\">\n                      We build what you tell us to.\n                    </h3>\n                    <p style=\"margin:0 0 16px; color:#c0b8db; font-size:14px; line-height:1.6;\">\n                      Every roadmap item came from a customer asking for it. Reply with what you'd build next if it were up to you.\n                    </p>\n                    <a href=\"#\" style=\"display:inline-block; color:#ffffff; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4, #7C3AED); padding:11px 22px; border-radius:8px; font-size:13px; font-weight:700; text-decoration:none;\">\n                      Submit a feature request &nbsp;\u2192\n                    </a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Closing -->\n          <tr>\n            <td style=\"padding: 36px 44px 36px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0; margin-bottom:16px;\">&nbsp;</div>\n              <p style=\"margin:0; color:#9999aa; font-size:13px; line-height:1.6;\">\n                Next roadmap update: August. We'll send a fresh one every quarter.\n              </p>\n            </td>\n          </tr>\n\n        </table>\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 18px 44px; text-align:center;\" class=\"px-44\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7;\">\n                Nurturely Roadmap &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Unsubscribe</a> &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Full Roadmap</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "how-to", "name": "The How-To", "category": "Education", "description": "Compact 3-step quick fix. Dark visual hero showing time to completion. Pro tip callout.", "useFor": "Quick-win tutorials, single-task guides, daily tips", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>How to: import contacts in 90 seconds</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-44 { padding-left: 24px !important; padding-right: 24px !important; }\n      .h1 { font-size: 26px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#f4f4f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    Import contacts in under 90 seconds. Three clicks.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#f4f4f8;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 32px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#ffffff; border-radius:14px; overflow:hidden; border:1px solid #ececf0;\">\n\n          <!-- Brand row -->\n          <tr>\n            <td style=\"padding: 22px 44px;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td valign=\"middle\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                      <tr>\n                        <td valign=\"middle\" width=\"26\">\n                          <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"24\" height=\"24\" style=\"display:block; border-radius:6px; border:0;\">\n                        </td>\n                        <td valign=\"middle\" style=\"padding-left:10px;\">\n                          <span style=\"color:#0A0A1A; font-size:13px; font-weight:700;\">Nurturely</span>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"middle\" align=\"right\">\n                    <span style=\"color:#9999aa; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:600;\">90 SEC READ</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <tr>\n            <td style=\"padding: 0 44px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Hero -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:12px;\">\n                How To\n              </div>\n              <h1 class=\"h1\" style=\"margin:0 0 12px; color:#0A0A1A; font-size:30px; font-weight:800; line-height:1.2; letter-spacing:-0.025em;\">\n                Import all your contacts in under 90 seconds.\n              </h1>\n              <p style=\"margin:0; color:#6b6b80; font-size:14px; line-height:1.6;\">\n                One file, three clicks, done. Here's the move.\n              </p>\n            </td>\n          </tr>\n\n          <!-- Visual placeholder for screenshot/GIF -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#0A0A1A; background-image:linear-gradient(135deg, #1a0b3d 0%, #2d1a5a 100%); border-radius:10px;\">\n                <tr>\n                  <td style=\"padding: 36px 24px; text-align:center;\">\n                    <div style=\"display:inline-block; padding:6px 12px; background:rgba(255,255,255,0.08); border:1px solid rgba(183,148,244,0.3); border-radius:6px; color:#B794F4; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:600; letter-spacing:0.5px; margin-bottom:18px;\">\n                      contacts.csv &nbsp;\u2192 &nbsp;Nurturely\n                    </div>\n                    <div style=\"color:#ffffff; font-size:32px; font-weight:800; line-height:1; letter-spacing:-0.02em;\">\n                      0:00 &nbsp;<span style=\"color:rgba(255,255,255,0.3);\">\u2192</span>&nbsp; 1:30\n                    </div>\n                    <div style=\"color:#9b97c0; font-size:12px; margin-top:10px;\">Avg. completion time</div>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- The 3 quick steps -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td style=\"padding-bottom:18px;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                      <tr>\n                        <td width=\"38\" valign=\"top\">\n                          <div style=\"color:#7C3AED; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:18px; font-weight:700;\">01</div>\n                        </td>\n                        <td valign=\"top\">\n                          <h3 style=\"margin:0 0 4px; color:#0A0A1A; font-size:16px; font-weight:700; line-height:1.3;\">\n                            Open Contacts \u2192 click \"Import\"\n                          </h3>\n                          <p style=\"margin:0; color:#6b6b80; font-size:13px; line-height:1.5;\">\n                            Top right corner. Purple button. Can't miss it.\n                          </p>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                </tr>\n                <tr>\n                  <td style=\"padding-bottom:18px;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                      <tr>\n                        <td width=\"38\" valign=\"top\">\n                          <div style=\"color:#7C3AED; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:18px; font-weight:700;\">02</div>\n                        </td>\n                        <td valign=\"top\">\n                          <h3 style=\"margin:0 0 4px; color:#0A0A1A; font-size:16px; font-weight:700; line-height:1.3;\">\n                            Drop your CSV file in\n                          </h3>\n                          <p style=\"margin:0; color:#6b6b80; font-size:13px; line-height:1.5;\">\n                            We auto-detect your columns. Just confirm the mapping looks right.\n                          </p>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                </tr>\n                <tr>\n                  <td>\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                      <tr>\n                        <td width=\"38\" valign=\"top\">\n                          <div style=\"color:#7C3AED; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:18px; font-weight:700;\">03</div>\n                        </td>\n                        <td valign=\"top\">\n                          <h3 style=\"margin:0 0 4px; color:#0A0A1A; font-size:16px; font-weight:700; line-height:1.3;\">\n                            Hit \"Import\"\n                          </h3>\n                          <p style=\"margin:0; color:#6b6b80; font-size:13px; line-height:1.5;\">\n                            Done. Your contacts are in. Go send something.\n                          </p>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Pro tip callout -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#fffaf0; border:1px solid #fcd9a6; border-radius:8px;\">\n                <tr>\n                  <td style=\"padding:14px 18px;\">\n                    <p style=\"margin:0; color:#7c2d12; font-size:13px; line-height:1.6;\">\n                      <strong style=\"color:#9a3412;\">Pro tip:</strong> &nbsp;If you have over 5,000 contacts, split into multiple CSVs. Imports run faster in batches.\n                    </p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- CTA -->\n          <tr>\n            <td style=\"padding: 32px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                <tr>\n                  <td align=\"center\" style=\"border-radius:8px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4 0%, #7C3AED 55%, #6D28D9 100%);\">\n                    <a href=\"#\" style=\"display:inline-block; padding:12px 24px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:8px;\">\n                      Open Contacts &nbsp;\u2192\n                    </a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Closing -->\n          <tr>\n            <td style=\"padding: 36px 44px 36px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0; margin-bottom:16px;\">&nbsp;</div>\n              <p style=\"margin:0; color:#9999aa; font-size:13px; line-height:1.6;\">\n                Stuck? Hit the chat widget in your dashboard. We'll walk you through it.\n              </p>\n            </td>\n          </tr>\n\n        </table>\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 18px 44px; text-align:center;\" class=\"px-44\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7;\">\n                Nurturely Quick Tips &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Unsubscribe</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "tutorial", "name": "The Tutorial", "category": "Education", "description": "Step-by-step walkthrough. 5 numbered black badges, pseudo-code tips, keyboard chips.", "useFor": "Full tutorials, feature walkthroughs, comprehensive setup guides", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Build your first automation in 5 minutes</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-44 { padding-left: 24px !important; padding-right: 24px !important; }\n      .h1 { font-size: 28px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#f4f4f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    Five minutes. Five steps. Your first automation, live.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#f4f4f8;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 32px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#ffffff; border-radius:14px; overflow:hidden; border:1px solid #ececf0;\">\n\n          <!-- Brand row + read time -->\n          <tr>\n            <td style=\"padding: 22px 44px;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td valign=\"middle\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                      <tr>\n                        <td valign=\"middle\" width=\"26\">\n                          <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"24\" height=\"24\" style=\"display:block; border-radius:6px; border:0;\">\n                        </td>\n                        <td valign=\"middle\" style=\"padding-left:10px;\">\n                          <span style=\"color:#0A0A1A; font-size:13px; font-weight:700;\">Nurturely</span>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"middle\" align=\"right\">\n                    <span style=\"color:#9999aa; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:600;\">5 MIN READ</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <tr>\n            <td style=\"padding: 0 44px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Hero -->\n          <tr>\n            <td style=\"padding: 40px 44px 0;\" class=\"px-44\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:14px;\">\n                Tutorial &nbsp;\u00b7&nbsp; Automations\n              </div>\n              <h1 class=\"h1\" style=\"margin:0 0 14px; color:#0A0A1A; font-size:32px; font-weight:800; line-height:1.2; letter-spacing:-0.025em;\">\n                Build your first automation in 5 minutes.\n              </h1>\n              <p style=\"margin:0; color:#4a4a5e; font-size:15px; line-height:1.65;\">\n                We'll set up a simple \"new lead \u2192 text within 5 minutes\" workflow. Once you've done one, you can build any of them.\n              </p>\n            </td>\n          </tr>\n\n          <!-- Step 01 -->\n          <tr>\n            <td style=\"padding: 40px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td width=\"56\" valign=\"top\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                      <tr>\n                        <td align=\"center\" valign=\"middle\" width=\"40\" height=\"40\" style=\"width:40px; height:40px; background:#0A0A1A; border-radius:50%; text-align:center; vertical-align:middle; color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:15px; font-weight:800; line-height:38px;\">\n                          01\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"top\" style=\"padding-top:6px;\">\n                    <h3 style=\"margin:0 0 8px; color:#0A0A1A; font-size:18px; font-weight:700; line-height:1.3; letter-spacing:-0.01em;\">\n                      Go to Automations \u2192 New Workflow\n                    </h3>\n                    <p style=\"margin:0 0 12px; color:#4a4a5e; font-size:14px; line-height:1.65;\">\n                      Click the lightning bolt icon in your left sidebar. Hit the purple \"+ New Workflow\" button in the top right.\n                    </p>\n                    <div style=\"background:#fafaff; border:1px solid #ececf0; border-radius:6px; padding:8px 12px; color:#6b6b80; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:12px;\">\n                      <span style=\"color:#7C3AED;\">tip:</span> Press <span style=\"display:inline-block; padding:1px 6px; background:#0A0A1A; color:#ffffff; border-radius:3px; font-size:11px;\">\u2318A</span> to jump there from anywhere.\n                    </div>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Step 02 -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td width=\"56\" valign=\"top\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                      <tr>\n                        <td align=\"center\" valign=\"middle\" width=\"40\" height=\"40\" style=\"width:40px; height:40px; background:#0A0A1A; border-radius:50%; text-align:center; vertical-align:middle; color:#ffffff; font-size:15px; font-weight:800; line-height:38px;\">\n                          02\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"top\" style=\"padding-top:6px;\">\n                    <h3 style=\"margin:0 0 8px; color:#0A0A1A; font-size:18px; font-weight:700; line-height:1.3; letter-spacing:-0.01em;\">\n                      Pick your trigger: \"New Contact Created\"\n                    </h3>\n                    <p style=\"margin:0; color:#4a4a5e; font-size:14px; line-height:1.65;\">\n                      Triggers are the \"when this happens\" half of automation. Choose <strong style=\"color:#0A0A1A;\">New Contact Created</strong> from the list. This fires every time someone new gets added to your CRM.\n                    </p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Step 03 -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td width=\"56\" valign=\"top\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                      <tr>\n                        <td align=\"center\" valign=\"middle\" width=\"40\" height=\"40\" style=\"width:40px; height:40px; background:#0A0A1A; border-radius:50%; text-align:center; vertical-align:middle; color:#ffffff; font-size:15px; font-weight:800; line-height:38px;\">\n                          03\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"top\" style=\"padding-top:6px;\">\n                    <h3 style=\"margin:0 0 8px; color:#0A0A1A; font-size:18px; font-weight:700; line-height:1.3; letter-spacing:-0.01em;\">\n                      Add a delay: 5 minutes\n                    </h3>\n                    <p style=\"margin:0; color:#4a4a5e; font-size:14px; line-height:1.65;\">\n                      Click \"+ Add Action\" and choose <strong style=\"color:#0A0A1A;\">Wait</strong>. Set it to 5 minutes. This gives the lead a moment before they hear from you &mdash; less robotic.\n                    </p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Step 04 -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td width=\"56\" valign=\"top\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                      <tr>\n                        <td align=\"center\" valign=\"middle\" width=\"40\" height=\"40\" style=\"width:40px; height:40px; background:#0A0A1A; border-radius:50%; text-align:center; vertical-align:middle; color:#ffffff; font-size:15px; font-weight:800; line-height:38px;\">\n                          04\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"top\" style=\"padding-top:6px;\">\n                    <h3 style=\"margin:0 0 8px; color:#0A0A1A; font-size:18px; font-weight:700; line-height:1.3; letter-spacing:-0.01em;\">\n                      Add an action: Send SMS\n                    </h3>\n                    <p style=\"margin:0; color:#4a4a5e; font-size:14px; line-height:1.65;\">\n                      Click \"+ Add Action\" again. Choose <strong style=\"color:#0A0A1A;\">Send SMS</strong>. Write something short and human &mdash; first name merge, your name, one question. That's it.\n                    </p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Step 05 -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td width=\"56\" valign=\"top\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                      <tr>\n                        <td align=\"center\" valign=\"middle\" width=\"40\" height=\"40\" style=\"width:40px; height:40px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4, #7C3AED); border-radius:50%; text-align:center; vertical-align:middle; color:#ffffff; font-size:15px; font-weight:800; line-height:38px;\">\n                          05\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"top\" style=\"padding-top:6px;\">\n                    <h3 style=\"margin:0 0 8px; color:#0A0A1A; font-size:18px; font-weight:700; line-height:1.3; letter-spacing:-0.01em;\">\n                      Toggle the switch. You're live.\n                    </h3>\n                    <p style=\"margin:0; color:#4a4a5e; font-size:14px; line-height:1.65;\">\n                      Flip the toggle in the top right from <em>Draft</em> to <strong style=\"color:#10B981;\">Live</strong>. Your next new lead gets your message 5 minutes after they hit your system.\n                    </p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- CTA -->\n          <tr>\n            <td style=\"padding: 44px 44px 0; text-align:center;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n                <tr>\n                  <td align=\"center\" style=\"border-radius:10px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4 0%, #7C3AED 55%, #6D28D9 100%);\">\n                    <a href=\"https://app.nurturelycrm.com/automations/new\" style=\"display:inline-block; padding:14px 32px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:10px; letter-spacing:0.02em;\">\n                      Open Automations &nbsp;\u2192\n                    </a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Closing -->\n          <tr>\n            <td style=\"padding: 36px 44px 36px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0; margin-bottom:18px;\">&nbsp;</div>\n              <p style=\"margin:0; color:#9999aa; font-size:13px; line-height:1.65;\">\n                Stuck on any step? Reply to this email or hit the chat widget &mdash; we'll walk you through it.\n              </p>\n            </td>\n          </tr>\n\n        </table>\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 18px 44px; text-align:center;\" class=\"px-44\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7;\">\n                Nurturely Tutorials &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Unsubscribe</a> &nbsp;\u00b7&nbsp; <a href=\"https://nurturelycrm.com\" style=\"color:#9999aa; text-decoration:none;\">nurturelycrm.com</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "power-tip", "name": "The Power Tip", "category": "Education", "description": "Single insight email. Amber accent treatment. Hero keyboard shortcut chips on dark.", "useFor": "Daily/weekly power tips, single-shortcut shares, hidden gem features", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>The keyboard shortcut nobody uses</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-44 { padding-left: 24px !important; padding-right: 24px !important; }\n      .h1 { font-size: 24px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#f4f4f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    One small Nurturely trick that will save you 5 minutes every day.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#f4f4f8;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 40px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"540\" class=\"container\" style=\"max-width:540px; background-color:#ffffff; border-radius:14px; overflow:hidden; border:1px solid #ececf0;\">\n\n          <!-- Brand row -->\n          <tr>\n            <td style=\"padding: 22px 44px;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td valign=\"middle\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                      <tr>\n                        <td valign=\"middle\" width=\"26\">\n                          <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"24\" height=\"24\" style=\"display:block; border-radius:6px; border:0;\">\n                        </td>\n                        <td valign=\"middle\" style=\"padding-left:10px;\">\n                          <span style=\"color:#0A0A1A; font-size:13px; font-weight:700;\">Nurturely</span>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"middle\" align=\"right\">\n                    <span style=\"display:inline-block; padding:4px 10px; background:#fef3c7; color:#92400e; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:10px; font-weight:700; border-radius:5px; letter-spacing:0.5px;\">\ud83d\udca1 TIP No. 14</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <tr>\n            <td style=\"padding: 0 44px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Amber accent header -->\n          <tr>\n            <td style=\"padding: 32px 44px 0;\" class=\"px-44\">\n              <div style=\"color:#d97706; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:14px;\">\n                Power Tip &nbsp;\u00b7&nbsp; Wednesday Edition\n              </div>\n              <h1 class=\"h1\" style=\"margin:0 0 14px; color:#0A0A1A; font-size:28px; font-weight:800; line-height:1.25; letter-spacing:-0.02em;\">\n                The keyboard shortcut nobody uses.\n              </h1>\n              <p style=\"margin:0; color:#4a4a5e; font-size:15px; line-height:1.65;\">\n                It'll save you ~5 minutes a day. Tested, measured, real.\n              </p>\n            </td>\n          </tr>\n\n          <!-- THE TIP - dramatic centerpiece -->\n          <tr>\n            <td style=\"padding: 32px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#0A0A1A; border-radius:12px;\">\n                <tr>\n                  <td style=\"padding:36px 30px; text-align:center;\">\n                    <div style=\"color:#fcd34d; font-size:10px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:18px;\">\n                      \u2605 &nbsp;The Shortcut\n                    </div>\n\n                    <!-- Keyboard chips -->\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n                      <tr>\n                        <td align=\"center\" valign=\"middle\" style=\"padding:0 4px;\">\n                          <div style=\"display:inline-block; padding:14px 20px; background:#ffffff; color:#0A0A1A; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:22px; font-weight:700; border-radius:8px; box-shadow:0 4px 0 rgba(183,148,244,0.4);\">\n                            \u2318\n                          </div>\n                        </td>\n                        <td align=\"center\" valign=\"middle\" style=\"padding:0 6px;\">\n                          <span style=\"color:#9999aa; font-size:20px;\">+</span>\n                        </td>\n                        <td align=\"center\" valign=\"middle\" style=\"padding:0 4px;\">\n                          <div style=\"display:inline-block; padding:14px 20px; background:#ffffff; color:#0A0A1A; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:22px; font-weight:700; border-radius:8px; box-shadow:0 4px 0 rgba(183,148,244,0.4);\">\n                            K\n                          </div>\n                        </td>\n                      </tr>\n                    </table>\n\n                    <div style=\"color:#ffffff; font-size:17px; font-weight:600; margin-top:24px; line-height:1.4;\">\n                      Opens the universal command bar from <em style=\"color:#B794F4; font-style:normal;\">anywhere</em> in Nurturely.\n                    </div>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- What it does -->\n          <tr>\n            <td style=\"padding: 32px 44px 0;\" class=\"px-44\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:14px;\">\n                What It Does\n              </div>\n              <p style=\"margin:0 0 14px; color:#1a1a2e; font-size:15px; line-height:1.7;\">\n                One shortcut. Search every contact, jump to any page, fire off a new email, create a deal, log a call. No clicking through menus, no hunting for the right tab.\n              </p>\n              <p style=\"margin:0; color:#1a1a2e; font-size:15px; line-height:1.7;\">\n                Power users use it 200+ times a week. Most customers don't know it exists.\n              </p>\n            </td>\n          </tr>\n\n          <!-- Try it now -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#fffaeb; border-left:3px solid #d97706; border-radius:6px;\">\n                <tr>\n                  <td style=\"padding:14px 18px;\">\n                    <p style=\"margin:0; color:#78350f; font-size:13px; line-height:1.6;\">\n                      <strong style=\"color:#451a03;\">Try it right now:</strong> &nbsp;Open Nurturely. Press <span style=\"display:inline-block; padding:1px 6px; margin:0 2px; background:#0A0A1A; color:#ffffff; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; border-radius:3px;\">\u2318K</span>. Type the name of any contact. Hit enter. You're there.\n                    </p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Closing -->\n          <tr>\n            <td style=\"padding: 36px 44px 36px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0; margin-bottom:16px;\">&nbsp;</div>\n              <p style=\"margin:0; color:#9999aa; font-size:13px; line-height:1.65; font-style:italic;\">\n                One small Nurturely trick, every Wednesday. Forward this to someone who needs it.\n              </p>\n            </td>\n          </tr>\n\n        </table>\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"540\" class=\"container\" style=\"max-width:540px;\">\n          <tr>\n            <td style=\"padding: 18px 44px; text-align:center;\" class=\"px-44\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7;\">\n                Power Tip \u00b7 Nurturely &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Unsubscribe</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "brief", "name": "The Brief", "category": "Informational", "description": "Multi-section digest. 4 numbered items with rules between. 90-second scannable read.", "useFor": "Weekly/monthly digests, multi-topic roundups, news summaries", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>The Nurturely Brief</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-44 { padding-left: 24px !important; padding-right: 24px !important; }\n      .h1 { font-size: 28px !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#f4f4f8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    Four short things worth your attention this week.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#f4f4f8;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 32px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #ececf0;\">\n\n          <!-- Header strip -->\n          <tr>\n            <td style=\"background:#0A0A1A; padding: 22px 44px;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=
