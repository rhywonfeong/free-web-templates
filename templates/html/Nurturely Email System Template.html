\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td valign=\"middle\" width=\"30\">\n                    <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"26\" height=\"26\" style=\"display:block; border-radius:6px; border:0;\">\n                  </td>\n                  <td valign=\"middle\" style=\"padding-left:11px;\">\n                    <div style=\"color:#ffffff; font-size:13px; font-weight:700; letter-spacing:-0.01em;\">The Nurturely Brief</div>\n                    <div style=\"color:#B794F4; font-size:11px; font-weight:600; letter-spacing:1px; margin-top:1px;\">Week 12 &nbsp;\u00b7&nbsp; May 14, 2026</div>\n                  </td>\n                  <td valign=\"middle\" align=\"right\" style=\"text-align:right;\">\n                    <span style=\"color:#9b97c0; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:600;\">04 ITEMS</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Intro -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:14px;\">\n                This Week's Brief\n              </div>\n              <h1 class=\"h1\" style=\"margin:0 0 12px; color:#0A0A1A; font-size:30px; font-weight:800; line-height:1.2; letter-spacing:-0.02em;\">\n                Four short things worth your attention.\n              </h1>\n              <p style=\"margin:0; color:#6b6b80; font-size:14px; line-height:1.6;\">\n                A 90-second read. Skim what's relevant, skip the rest.\n              </p>\n            </td>\n          </tr>\n\n          <!-- Item 01 -->\n          <tr>\n            <td style=\"padding: 36px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td width=\"44\" valign=\"top\">\n                    <div style=\"color:#7C3AED; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:13px; font-weight:700; letter-spacing:1px;\">01</div>\n                  </td>\n                  <td valign=\"top\">\n                    <div style=\"color:#9999aa; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;\">\n                      Product\n                    </div>\n                    <h3 style=\"margin:0 0 8px; color:#0A0A1A; font-size:17px; font-weight:700; line-height:1.35; letter-spacing:-0.01em;\">\n                      Smart Lists are live for everyone\n                    </h3>\n                    <p style=\"margin:0 0 10px; color:#4a4a5e; font-size:14px; line-height:1.6;\">\n                      Auto-updating segments that rebuild themselves as contacts match your rules. No more manually exporting and re-uploading.\n                    </p>\n                    <a href=\"#\" style=\"color:#7C3AED; font-size:13px; font-weight:700; text-decoration:none;\">Try it now \u2192</a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Divider -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Item 02 -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td width=\"44\" valign=\"top\">\n                    <div style=\"color:#7C3AED; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:13px; font-weight:700; letter-spacing:1px;\">02</div>\n                  </td>\n                  <td valign=\"top\">\n                    <div style=\"color:#9999aa; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;\">\n                      Workshop\n                    </div>\n                    <h3 style=\"margin:0 0 8px; color:#0A0A1A; font-size:17px; font-weight:700; line-height:1.35; letter-spacing:-0.01em;\">\n                      Pipeline design office hours &mdash; Thursday, 11 AM PT\n                    </h3>\n                    <p style=\"margin:0 0 10px; color:#4a4a5e; font-size:14px; line-height:1.6;\">\n                      Bring your messy pipeline. Our team will refactor it live alongside two other customers. Free, 45 minutes, max 6 seats.\n                    </p>\n                    <a href=\"#\" style=\"color:#7C3AED; font-size:13px; font-weight:700; text-decoration:none;\">Reserve a seat \u2192</a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Divider -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Item 03 -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td width=\"44\" valign=\"top\">\n                    <div style=\"color:#7C3AED; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:13px; font-weight:700; letter-spacing:1px;\">03</div>\n                  </td>\n                  <td valign=\"top\">\n                    <div style=\"color:#9999aa; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;\">\n                      Read\n                    </div>\n                    <h3 style=\"margin:0 0 8px; color:#0A0A1A; font-size:17px; font-weight:700; line-height:1.35; letter-spacing:-0.01em;\">\n                      The 5-touch rule (and why most businesses break it)\n                    </h3>\n                    <p style=\"margin:0 0 10px; color:#4a4a5e; font-size:14px; line-height:1.6;\">\n                      Customers say no four times before they say yes. Here's how to build a follow-up sequence that doesn't feel like nagging.\n                    </p>\n                    <a href=\"#\" style=\"color:#7C3AED; font-size:13px; font-weight:700; text-decoration:none;\">Read the breakdown \u2192</a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Divider -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0;\">&nbsp;</div>\n            </td>\n          </tr>\n\n          <!-- Item 04 -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td width=\"44\" valign=\"top\">\n                    <div style=\"color:#7C3AED; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:13px; font-weight:700; letter-spacing:1px;\">04</div>\n                  </td>\n                  <td valign=\"top\">\n                    <div style=\"color:#9999aa; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;\">\n                      Heads-Up\n                    </div>\n                    <h3 style=\"margin:0 0 8px; color:#0A0A1A; font-size:17px; font-weight:700; line-height:1.35; letter-spacing:-0.01em;\">\n                      Scheduled maintenance &mdash; Sunday, 2 AM PT\n                    </h3>\n                    <p style=\"margin:0 0 10px; color:#4a4a5e; font-size:14px; line-height:1.6;\">\n                      We're upgrading our SMS infrastructure. Expect roughly 15 minutes of message delays. No data impact. We'll post status updates live.\n                    </p>\n                    <a href=\"#\" style=\"color:#7C3AED; font-size:13px; font-weight:700; text-decoration:none;\">View status page \u2192</a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Closing -->\n          <tr>\n            <td style=\"padding: 40px 44px 36px;\" class=\"px-44\">\n              <div style=\"height:1px; background:#ececf0; line-height:1px; font-size:0; margin-bottom:20px;\">&nbsp;</div>\n              <p style=\"margin:0; color:#9999aa; font-size:13px; line-height:1.65;\">\n                See you next Monday. Reply with anything you'd like us to cover &mdash; we read every email.\n              </p>\n            </td>\n          </tr>\n\n        </table>\n\n        <!-- Footer -->\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 18px 44px; text-align:center;\" class=\"px-44\">\n              <div style=\"color:#9999aa; font-size:11px; line-height:1.7;\">\n                The Nurturely Brief &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#9999aa; text-decoration:none;\">Unsubscribe</a> &nbsp;\u00b7&nbsp; <a href=\"https://nurturelycrm.com\" style=\"color:#9999aa; text-decoration:none;\">nurturelycrm.com</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}, {"id": "yearly", "name": "The Yearly", "category": "Informational", "description": "Annual recap. Massive serif year as anchor. Standout stat + grid. Your biggest day highlight.", "useFor": "Year-in-review, customer anniversaries, milestone summaries", "html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <title>Your 2026 in Nurturely</title>\n  <style>\n    @media only screen and (max-width: 620px) {\n      .container { width: 100% !important; }\n      .px-44 { padding-left: 24px !important; padding-right: 24px !important; }\n      .h1 { font-size: 38px !important; }\n      .big-stat { font-size: 56px !important; }\n      .stat-grid td { display:block !important; width:100% !important; padding:8px 0 !important; }\n    }\n  </style>\n</head>\n<body style=\"margin:0; padding:0; background-color:#050510; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;\">\n\n  <div style=\"display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent; height:0; width:0;\">\n    A year of nurturing. Here's what you built with us.\n  </div>\n\n  <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background-color:#050510;\">\n    <tr>\n      <td align=\"center\" style=\"padding: 40px 16px;\">\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px; background-color:#0A0A1A; border-radius:16px; overflow:hidden; border:1px solid rgba(124,58,237,0.18);\">\n\n          <!-- Brand row -->\n          <tr>\n            <td style=\"padding: 28px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td valign=\"middle\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n                      <tr>\n                        <td valign=\"middle\" width=\"28\">\n                          <img src=\"https://assets.cdn.filesafe.space/1O9H1Ne3FMQKe9wivdSH/media/6a039b5082125b98748b2086.png\" alt=\"Nurturely\" width=\"26\" height=\"26\" style=\"display:block; border-radius:6px; border:0;\">\n                        </td>\n                        <td valign=\"middle\" style=\"padding-left:10px;\">\n                          <span style=\"color:#ffffff; font-size:13px; font-weight:700;\">Nurturely</span>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"middle\" align=\"right\">\n                    <span style=\"color:#B794F4; font-family:'SF Mono', Menlo, Consolas, monospace; font-size:11px; font-weight:600; letter-spacing:1px;\">YEAR IN REVIEW</span>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Hero with massive year -->\n          <tr>\n            <td style=\"padding: 60px 44px 0; text-align:center;\" class=\"px-44\">\n              <div style=\"color:#7C3AED; font-size:11px; font-weight:700; letter-spacing:3px; text-transform:uppercase; margin-bottom:18px;\">\n                {{contact.first_name}}'s Year With Nurturely\n              </div>\n\n              <div style=\"color:#ffffff; font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; font-size:120px; font-weight:500; line-height:0.95; letter-spacing:-0.05em; margin-bottom:18px;\">\n                2026\n              </div>\n\n              <h1 class=\"h1\" style=\"margin:0 0 16px; color:#ffffff; font-size:42px; font-weight:800; line-height:1.15; letter-spacing:-0.03em;\">\n                You did a lot this year.\n              </h1>\n              <p style=\"margin:0 auto; color:#9b97c0; font-size:16px; line-height:1.65; max-width:440px;\">\n                Twelve months of nurturing, sending, growing. Here's what your year actually looked like.\n              </p>\n            </td>\n          </tr>\n\n          <!-- Big standout stat -->\n          <tr>\n            <td style=\"padding: 60px 44px 0; text-align:center;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\" width=\"100%\" style=\"background-image:linear-gradient(135deg, rgba(124,58,237,0.22) 0%, rgba(124,58,237,0.06) 100%); border:1px solid rgba(183,148,244,0.3); border-radius:14px;\">\n                <tr>\n                  <td style=\"padding:36px 24px; text-align:center;\">\n                    <div style=\"color:#B794F4; font-size:11px; font-weight:700; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:14px;\">\n                      Messages Sent\n                    </div>\n                    <div class=\"big-stat\" style=\"color:#ffffff; font-size:84px; font-weight:800; line-height:1; letter-spacing:-0.04em;\">\n                      12,847\n                    </div>\n                    <div style=\"color:#86EFAC; font-size:13px; font-weight:600; margin-top:14px;\">\n                      \u2191 240% more than 2025\n                    </div>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Stat grid -->\n          <tr>\n            <td style=\"padding: 16px 44px 0;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" class=\"stat-grid\">\n                <tr>\n                  <td valign=\"top\" width=\"33%\" style=\"padding-right:8px; padding-top:16px;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#15102e; border:1px solid rgba(124,58,237,0.25); border-radius:12px;\">\n                      <tr>\n                        <td style=\"padding:20px 18px; text-align:center;\">\n                          <div style=\"color:#B794F4; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;\">Replies</div>\n                          <div style=\"color:#ffffff; font-size:30px; font-weight:800; line-height:1; letter-spacing:-0.02em;\">1,604</div>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"top\" width=\"33%\" style=\"padding:16px 8px 0;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#15102e; border:1px solid rgba(124,58,237,0.25); border-radius:12px;\">\n                      <tr>\n                        <td style=\"padding:20px 18px; text-align:center;\">\n                          <div style=\"color:#B794F4; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;\">Contacts</div>\n                          <div style=\"color:#ffffff; font-size:30px; font-weight:800; line-height:1; letter-spacing:-0.02em;\">+892</div>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                  <td valign=\"top\" width=\"33%\" style=\"padding-left:8px; padding-top:16px;\">\n                    <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\" style=\"background:#15102e; border:1px solid rgba(124,58,237,0.25); border-radius:12px;\">\n                      <tr>\n                        <td style=\"padding:20px 18px; text-align:center;\">\n                          <div style=\"color:#B794F4; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-bottom:6px;\">Deals Won</div>\n                          <div style=\"color:#ffffff; font-size:30px; font-weight:800; line-height:1; letter-spacing:-0.02em;\">$184K</div>\n                        </td>\n                      </tr>\n                    </table>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Highlight moment -->\n          <tr>\n            <td style=\"padding: 40px 44px 0;\" class=\"px-44\">\n              <div style=\"color:#FCD34D; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin-bottom:12px;\">\n                \u2605 &nbsp;Your Biggest Day\n              </div>\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"100%\">\n                <tr>\n                  <td valign=\"middle\" width=\"100\">\n                    <div style=\"color:#7C3AED; font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; font-size:54px; font-weight:500; line-height:1; letter-spacing:-0.03em;\">\n                      Oct\n                    </div>\n                    <div style=\"color:#ffffff; font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; font-size:54px; font-weight:500; line-height:1; letter-spacing:-0.03em;\">\n                      14\n                    </div>\n                  </td>\n                  <td valign=\"middle\" style=\"padding-left:20px;\">\n                    <p style=\"margin:0; color:#ffffff; font-size:16px; line-height:1.6;\">\n                      You sent <strong>284 messages</strong> in one afternoon and closed <strong>three new deals</strong> by the end of the week. Whatever you did that day, do it again.\n                    </p>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Thank you -->\n          <tr>\n            <td style=\"padding: 48px 44px 0; text-align:center;\" class=\"px-44\">\n              <div style=\"height:1px; background:rgba(124,58,237,0.2); line-height:1px; font-size:0; margin-bottom:36px;\">&nbsp;</div>\n              <p style=\"margin:0; color:#ffffff; font-family:'Iowan Old Style','Palatino Linotype', Palatino, Georgia, serif; font-size:22px; font-style:italic; line-height:1.5; font-weight:500;\">\n                \"Thank you for trusting us with your business this year. Here's to whatever you build next.\"\n              </p>\n              <p style=\"margin:18px 0 0; color:#9b97c0; font-size:13px;\">\n                &mdash; The Nurturely Team\n              </p>\n            </td>\n          </tr>\n\n          <!-- CTA -->\n          <tr>\n            <td style=\"padding: 40px 44px 0; text-align:center;\" class=\"px-44\">\n              <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\">\n                <tr>\n                  <td align=\"center\" style=\"border-radius:10px; background:#7C3AED; background-image:linear-gradient(135deg, #B794F4 0%, #7C3AED 55%, #6D28D9 100%);\">\n                    <a href=\"#\" style=\"display:inline-block; padding:14px 32px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; font-size:14px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:10px; letter-spacing:0.02em;\">\n                      See your full report &nbsp;\u2192\n                    </a>\n                  </td>\n                </tr>\n              </table>\n            </td>\n          </tr>\n\n          <!-- Closing space -->\n          <tr>\n            <td style=\"padding: 44px 44px 36px;\" class=\"px-44\">\n              <div style=\"height:1px; background:rgba(124,58,237,0.15); line-height:1px; font-size:0;\">&nbsp;</div>\n            </td>\n          </tr>\n\n        </table>\n\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" width=\"600\" class=\"container\" style=\"max-width:600px;\">\n          <tr>\n            <td style=\"padding: 20px 44px; text-align:center;\" class=\"px-44\">\n              <div style=\"color:#5a5670; font-size:11px; line-height:1.7;\">\n                Nurturely CRM &nbsp;\u00b7&nbsp; Pomona, CA &nbsp;\u00b7&nbsp; <a href=\"#\" style=\"color:#B794F4; text-decoration:none;\">Unsubscribe</a>\n              </div>\n            </td>\n          </tr>\n        </table>\n\n      </td>\n    </tr>\n  </table>\n\n</body>\n</html>\n"}]</script>

  <script>
    (function() {
      'use strict';

      var STYLES = JSON.parse(document.getElementById('styles-data').textContent);
      var CATEGORIES = ['Foundational', 'Editorial', 'Personal', 'Promotional', 'Product', 'Education', 'Informational'];

      var selectedId = 'dark';

      function findStyle(id) {
        for (var i = 0; i < STYLES.length; i++) {
          if (STYLES[i].id === id) return STYLES[i];
        }
        return STYLES[0];
      }

      function renderSidebar() {
        var nav = document.getElementById('nav');
        nav.innerHTML = '';

        CATEGORIES.forEach(function(cat) {
          var inCat = STYLES.filter(function(s) { return s.category === cat; });
          if (inCat.length === 0) return;

          var group = document.createElement('div');
          group.className = 'nav-group';

          var label = document.createElement('div');
          label.className = 'nav-cat';
          label.textContent = cat;
          group.appendChild(label);

          inCat.forEach(function(style) {
            var btn = document.createElement('button');
            btn.className = 'nav-item' + (style.id === selectedId ? ' active' : '');
            btn.textContent = style.name;
            btn.setAttribute('data-id', style.id);
            btn.addEventListener('click', function() {
              selectStyle(style.id);
            });
            group.appendChild(btn);
          });

          nav.appendChild(group);
        });

        document.getElementById('meta-count').textContent =
          STYLES.length + ' named templates \u00B7 Same brand DNA';
      }

      function renderMain() {
        var style = findStyle(selectedId);
        document.getElementById('topbar-cat').textContent = style.category;
        document.getElementById('topbar-name').textContent = style.name;
        document.getElementById('topbar-use').textContent = style.useFor;
        document.getElementById('description').textContent = style.description;

        var iframe = document.getElementById('preview');
        iframe.setAttribute('srcdoc', style.html);
        iframe.setAttribute('title', style.name);
      }

      function updateActiveNav() {
        var items = document.querySelectorAll('.nav-item');
        for (var i = 0; i < items.length; i++) {
          if (items[i].getAttribute('data-id') === selectedId) {
            items[i].classList.add('active');
          } else {
            items[i].classList.remove('active');
          }
        }
      }

      function selectStyle(id) {
        selectedId = id;
        updateActiveNav();
        renderMain();
      }

      function copyHTML() {
        var style = findStyle(selectedId);
        var copiedEl = document.getElementById('copied');

        function showCopied() {
          copiedEl.classList.add('show');
          setTimeout(function() { copiedEl.classList.remove('show'); }, 1800);
        }

        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(style.html).then(showCopied).catch(fallbackCopy);
        } else {
          fallbackCopy();
        }

        function fallbackCopy() {
          var ta = document.createElement('textarea');
          ta.value = style.html;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          ta.style.top = '0';
          ta.style.left = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          try {
            document.execCommand('copy');
            showCopied();
          } catch (err) {
            alert('Copy failed. Your browser may not allow clipboard access.');
          }
          document.body.removeChild(ta);
        }
      }

      document.getElementById('copy-btn').addEventListener('click', copyHTML);

      // Keyboard nav: up/down arrows to navigate styles
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        e.preventDefault();
        var idx = STYLES.findIndex(function(s) { return s.id === selectedId; });
        if (e.key === 'ArrowDown') idx = (idx + 1) % STYLES.length;
        else idx = (idx - 1 + STYLES.length) % STYLES.length;
        selectStyle(STYLES[idx].id);
      });

      // Initial render
      renderSidebar();
      renderMain();
    })();
  </script>

</body></html>
