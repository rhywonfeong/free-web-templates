<body class="min-h-screen flex items-center justify-center bg-zinc-900 pt-4 pr-4 pb-4 pl-4" style="font-family: 'Inter', sans-serif;">
    
    <div class="relative bg-gradient-to-br from-zinc-950-zinc-900 to-zinc-950 overflow-hidden" style="width: 970px; height: 250px; border-radius: 16px;">
        
        <!-- Background Pattern -->
        <div class="absolute inset-0 opacity-5">
            <div class="absolute inset-0" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 32px 32px;"></div>
        </div>
        
        <!-- Gradient Orbs -->
        <div class="absolute -top-20 -left-20 w-64 h-64 bg-violet-600 rounded-full opacity-20 &lt;/div&gt; &lt;div class=" absolute="" -bottom-20="" -right-20="" w-64="" h-64="" bg-blue-600="" rounded-full="" opacity-20="" blur-3xl"=""></div>
        
        <!-- Content Container -->
        <div class="relative h-full flex">
            
            <!-- Left Section -->
            <div class="flex flex-col justify-center pl-10 pr-6 w-64 flex-shrink-0">
                <span class="text-violet-400 text-xs font-medium tracking-wide uppercase mb-2">New Collection</span>
                <h2 class="text-white text-2xl font-semibold tracking-tight leading-tight mb-3">Discover Premium Products</h2>
                <p class="text-zinc-400 text-xs leading-relaxed mb-4">Curated selection of modern essentials for your lifestyle.</p>
                <button class="group flex items-center gap-2 bg-white-xs font-medium px-4 py-2 rounded-lg w-fit hover:bg-zinc-100 transition-all duration-300">
                    Shop Now
                    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" width="14" height="14" viewBox="0 0 24 24" data-icon="lucide:arrow-right" data-width="14" style="stroke-width: 1.5;"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7-7l7 7l-7 7"></path></svg>
                </button>
            </div>
            
            <!-- -->
            <div class="flex-1 flex items-center overflow-hidden relative">
                
                <!-- Fade Edges -->
                <div class="absolute left-0 top-0 bottom-0 w-16 bg-gradient-to-r from-zinc-950 to-transparent z-10 pointer-events-none"></div>

                <!-- Carousel Track -->

                        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" width="16" height="16" viewBox="0 0 24 24" data-icon="lucide:chevron-left" data-width="16" style="stroke-width: 1.5;"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 18l-6-6l6-6"></path></svg>
                    </button>
                    <button id="nextBtn" class="w-8 h-8 rounded-full bg-white/10 backdrop-blur-sm border border-white/10 flex items-center justify-center text-white hover:bg-white/20 transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" role="img" width="16" height="16" viewBox="0 0 24 24" data-icon="lucide:chevron-right" data-width="16" style="stroke-width: 1.5; color: rgb(255, 255, 255); width: 16px; height: 16px;" class="w-[16px] h-[16px]" stroke-width="2" data-icon-replaced="true"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 18l6-6l-6-6"></path></svg>
                    </button>
                </div>
                
                <!-- Progress Dots -->

                    <div class="dot w-6 h-1 rounded-full bg-white/30 transition-all duration-500" data-index="0"></div>
                    <div class="dot w-1.5 h-1 rounded-full bg-white/30 transition-all duration-500" data-index="1"></div>
                    <div class="dot w-1.5 h-1 rounded-full bg-white/30 transition-all duration-500" data-index="2"></div>
                    <div class="dot w-1.5 h-1 rounded-full bg-white/30 transition-all duration-500" data-index="3"></div>
                </div>
            
        
        <!-- Logo -->
        <div class="absolute top-4 right-6 text-white text-sm font-semibold tracking-tighter">
            STORE<span class="text-violet-400">.</span>
        </div>
    </div>

    <script>
        const products = [
            { name: 'Wireless Earbuds', price: '$129', color: 'from-violet-500 to-violet-700', icon: 'lucide:headphones' },
            { name: 'Smart Watch', price: '$299', color: 'from-blue-500 to-blue-700', icon: 'lucide:watch' },
            { name: 'Leather Bag', price: '$189', color: 'from-amber-500 to-amber-700', icon: 'lucide:briefcase' },
            { name: 'Sunglasses', price: '$149', color: 'from-rose-500 to-rose-700', icon: 'lucide:glasses' },
            { name: 'Sneakers', price: '$179', color: 'from-emerald-500 to-emerald-700', icon: 'lucide:footprints' },
            { name: 'Backpack', price: '$99', color: 'from-cyan-500 to-cyan-700', icon: 'lucide:pack' },
            { name: 'Camera', price: '$449', color: 'from-pink-500 to-pink-700', icon: 'lucide:camera' },
            { name: 'Speakers', price: '$199', color: 'from-indigo-500 to-indigo-700', icon: 'lucide:speaker' }
        ];
        
        const carousel = document.getElementById('carousel');
        const allProducts = [...products, ...products, ...products];
        
        allProducts.forEach((product, index) => {
            const item = document.createElement('div');
            item.className = 'flex-shrink-0 w-36 group cursor-pointer';
            item.innerHTML = `
                <div class="relative bg-gradient-to-br ${product.color} rounded-xl p-4 h-32 flex items-center justify-center mb-2 overflow-hidden transition-all duration-500 group-hover:scale-105 group-hover:shadow-lg group-hover:shadow-${product.color.split('-')[1]}-500/20">
                    <div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    <span class="iconify text-white/90 transition-transform duration-500 group-hover:scale-110" data-icon="${product.icon}" data-width="40" style="stroke-width: 1.5;"></span>
                </div>
                <h3 class="text-white text-xs font-medium truncate">${product.name}</h3>
                <p class="text-zinc-400 text-xs">${product.price}</p>
            `;
            carousel.appendChild(item);
        });
        
        let currentIndex = products.length;
        const itemWidth = 160;
        let isAnimating = false;
        let autoplayInterval;
        
        carousel.style.transform = `translateX(-${currentIndex * itemWidth}px)`;
        
        function updateDots() {
            const actualIndex = currentIndex % products.length;
            const dotGroup = Math.floor(actualIndex / 2);
            document.querySelectorAll('.dot').forEach((dot, i) => {
                if (i === dotGroup) {
                    dot.classList.add('w-6', 'bg-white');
                    dot.classList.remove('w-1.5', 'bg-white/30');
                } else {
                    dot.classList.remove('w-6', 'bg-white');
                    dot.classList.add('w-1.5', 'bg-white/30');
                }
            });
        }
        
        function slide(direction) {
            if (isAnimating) return;
            isAnimating = true;
            
            currentIndex += direction;
            carousel.style.transform = `translateX(-${currentIndex * itemWidth}px)`;
            
            setTimeout(() => {
                if (currentIndex >= products.length * 2) {
                    carousel.style.transition = 'none';
                    currentIndex = products.length;
                    carousel.style.transform = `translateX(-${currentIndex * itemWidth}px)`;
                    setTimeout(() => {
                        carousel.style.transition = 'transform 700ms cubic-bezier(0.25, 0.1, 0.25, 1)';
                    }, 50);
                } else if (currentIndex < products.length) {
                    carousel.style.transition = 'none';
                    currentIndex = products.length * 2 - 1;
                    carousel.style.transform = `translateX(-${currentIndex * itemWidth}px)`;
                    setTimeout(() => {
                        carousel.style.transition = 'transform 700ms cubic-bezier(0.25, 0.1, 0.25, 1)';
                    }, 50);
                }
                isAnimating = false;
                updateDots();
            }, 700);
        }
        
        document.getElementById('nextBtn').addEventListener('click', () => {
            slide(1);
            resetAutoplay();
        });
        
        document.getElementById('prevBtn').addEventListener('click', () => {
            slide(-1);
            resetAutoplay();
        });
        
        function startInterval = setInterval(() => slide(1), 3000);
        }
        
        function resetAutoplay() {
            clearInterval(autoplayInterval);
            startAutoplay();
        }
        
        startAutoplay();
        updateDots();
        
        carousel.parentElement.addEventListener('mouseenter', () => clearInterval(autoplayInterval));
        carousel.parentElement.addEventListener('mouseleave', startAutoplay);
    </script>
