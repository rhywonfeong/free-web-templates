<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adapted Hero Section (Staggered Fades)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.tailwindcss.com"></script></head>

<body class="flex items-center justify-center min-h-screen" style="
    margin:0;
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    background:linear-gradient(to bottom,#f4f4f4,#dfdfdf);
    color:#1f2937;
  ">
  <!-- Card Container -->
  <div style="
      width:100%;
      max-width:48rem;
      background:linear-gradient(to bottom,#f7f1ee,#f7f7ee);
      border-radius:1rem;
      box-shadow:0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -4px rgba(0,0,0,0.1);
      display:flex;
      flex-direction:column;
      position:relative;
    ">
    <!-- Company Info (top-right) -->
    <div class="fade-after-logo" style="position: absolute; top: 1rem; right: 1.25rem; text-align: right; line-height: 1.25; opacity: 0; transition: opacity 1.2s ease;">
      <div style="font-size:1rem; font-weight:500;">ROSE CITY FILM TRUCKS LLC</div>
      <div style="font-size:0.875rem; color:#6b7280;">6500 NE Portland Hwy, Portland, OR 97218</div>
      <div style="font-size:0.875rem; color:#6b7280;">(323) 829-0080</div>
    </div>

    <!-- Main -->
    <main style="flex:1; padding:1.5rem;">
      <!-- Logo -->
      <div style="display:flex; justify-content:center; margin-bottom:1.5rem;">
        <img id="logoImage" src="https://rosecity.b-cdn.net/logo_wide_transparent00.png" alt="Rose City Film Trucks Logo" style="max-width:100%; height:auto; object-fit:contain; opacity:0; transition:opacity 1.2s ease;" class="pt-14 pb-0">
      </div>

      <!-- Nav + Button Row -->
      <header class="fade-nav" style="margin-bottom: 2rem; position: relative; opacity:0; transition: opacity 1.2s ease;">
        <nav style="display:flex; justify-content:center; gap:2rem; font-size:0.875rem; padding:0.5rem 0; margin:0 auto; width:fit-content;">
          <a href="#" style="text-decoration:none; color:inherit;" class="text-lg font-bold">Fleet &amp; Rates</a>
          <a href="#" style="text-decoration:none; color:inherit;" class="text-lg font-bold">Policies</a>
          <a href="#" style="text-decoration:none; color:inherit;" class="text-lg font-bold">About</a>
          <a href="#" style="text-decoration:none; color:inherit;" class="text-lg font-bold">Contact</a>
        </nav>

        <!-- Call-to-action -->
        <button style="position: absolute; right: 0px; top: 50%; transform: translateY(-50%); font-size: 0.875rem; font-weight: 500; color:#fff; background:#111827; padding:0.65rem 1.25rem; border:0; border-radius:9999px; cursor:pointer;" onmouseover="this.style.background='#1f2937'" onmouseout="this.style.background='#111827'">
          Book NOW
        </button>
      </header>

      <!-- Features Grid -->
      <section class="fade-after-logo" style="display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); max-width: 64rem; margin: 0 auto; opacity:0; transition:opacity 1.2s ease;">
        <!-- Feature placeholders -->
      </section>
    </main>

    <!-- Divider -->
    <div class="fade-after-logo" style="height:1px; background:rgba(0,0,0,0.08); opacity:0; transition:opacity 1.2s ease;"></div>

    <!-- Footer -->
    <footer class="fade-after-logo" style="padding:1.25rem; text-align:center; font-size:0.875rem; color:#6b7280; opacity:0; transition:opacity 1.2s ease;">© 2025 ROSE CITY FILM TRUCKS LLC. All rights reserved.</footer>
  </div>

  <script>
    lucide.createIcons({ attrs: { "stroke-width": 1.5 } });

    window.addEventListener('load', () => {
      const logo  = document.getElementById('logoImage');
      const nav   = document.querySelector('.fade-nav');
      const rest  = document.querySelectorAll('.fade-after-logo');

      // 0–0.2 s : keep card blank
      setTimeout(() => logo.style.opacity = 1, 200);            // fade logo for 1.2 s (0.2→1.4 s)
      setTimeout(() => {
        nav.style.opacity = 1;                                  // fade all remaining elements together
        rest.forEach(el => el.style.opacity = 1);
      }, 1400);                                                 // 1.4→2.6 s
    });
  </script>
</body></html>
