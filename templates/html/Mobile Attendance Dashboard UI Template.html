<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
}
</style></head>
<body class="bg-gray-50 text-zinc-900">

    <!-- Mobile Container -->
    <div class="max-w-md mx-auto min-h-screen pb-12">
        
        <!-- Header -->
        <header class="sticky top-0 z-20 bg-gray-50/90 backdrop-blur-md px-5 py-4 flex items-center gap-4 border-b border-gray-200/50">
            <button class="p-1 -ml-1 text-zinc-500 hover:text-zinc-900 transition-colors">
                <i data-lucide="chevron-left" class="w-6 h-6"></i>
            </button>
            <h1 class="text-lg font-semibold tracking-tight text-zinc-900">Attendance</h1>
        </header>

        <main class="px-5 pt-6 space-y-6">

            <!-- Switching Tabs -->
            <div class="bg-gray-200/60 p-1 rounded-xl flex items-center text-sm font-medium">
                <button class="flex-1 bg-white text-zinc-900 shadow-sm rounded-lg py-2.5 transition-all duration-200">
                    Detailed Attendance
                </button>
                <button class="flex-1 text-zinc-500 hover:text-zinc-900 py-2.5 transition-colors duration-200">
                    Overview
                </button>
            </div>

            <!-- Date Selector Card -->
            <div class="bg-white rounded-2xl p-4 shadow-[0_2px_8px_-2px_rgba(0,0,0,0.05)] border border-gray-100 flex items-center justify-between cursor-pointer active:scale-[0.99] transition-transform">
                <div class="flex items-center gap-3.5">
                    <div class="bg-zinc-50 p-2 rounded-lg border border-zinc-100">
                        <i data-lucide="calendar" class="w-5 h-5 text-zinc-500"></i>
                    </div>
                    <span class="text-base font-medium text-zinc-900">December 2025</span>
                </div>
                <i data-lucide="chevron-down" class="w-5 h-5 text-zinc-400"></i>
            </div>

            <!-- Current Month Stats Grid -->
            <div class="grid grid-cols-2 gap-4">
                
                <!-- Card 1: Sick Leave -->
                <div class="bg-white p-4 rounded-2xl shadow-[0_2px_8px_-2px_rgba(0,0,0,0.05)] border border-gray-100 flex flex-col justify-between h-40">
                    <div class="flex items-start gap-3">
                        <div class="text-rose-500 bg-rose-50 p-1.5 rounded-lg">
                            <i data-lucide="frown" class="w-5 h-5"></i>
                        </div>
                        <span class="text-sm font-semibold text-zinc-900 pt-0.5 leading-tight">Sick Leave</span>
                    </div>
                    
                    <div class="space-y-3">
                        <div class="flex justify-between items-end text-sm">
                            <span class="text-zinc-500">Used</span>
                            <span class="font-semibold text-zinc-900">2/2 days</span>
                        </div>
                        <div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-rose-500 w-full rounded-full"></div>
                        </div>
                        <p class="text-xs font-medium text-rose-600">Monthly limit reached</p>
                    </div>
                </div>

                <!-- Card 2: Annual Leave -->
                <div class="bg-white p-4 rounded-2xl shadow-[0_2px_8px_-2px_rgba(0,0,0,0.05)] border border-gray-100 flex flex-col justify-between h-40">
                    <div class="flex items-start gap-3">
                        <div class="text-indigo-500 bg-indigo-50 p-1.5 rounded-lg">
                            <i data-lucide="calendar-check" class="w-5 h-5"></i>
                        </div>
                        <span class="text-sm font-semibold text-zinc-900 pt-0.5 leading-tight">Annual Leave</span>
                    </div>
                    
                    <div class="space-y-3">
                        <div class="flex justify-between items-end text-sm">
                            <span class="text-zinc-500">Used</span>
                            <span class="font-semibold text-zinc-900">2/2 days</span>
                        </div>
                        <div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-indigo-500 w-full rounded-full"></div>
                        </div>
                        <p class="text-xs font-medium text-zinc-400">Monthly limit reached</p>
                    </div>
                </div>

                <!-- Card 3: Work from Home -->
                <div class="bg-white p-4 rounded-2xl shadow-[0_2px_8px_-2px_rgba(0,0,0,0.05)] border border-gray-100 flex flex-col justify-between h-40">
                    <div class="flex items-start gap-3">
                        <div class="text-sky-500 bg-sky-50 p-1.5 rounded-lg">
                            <i data-lucide="home" class="w-5 h-5"></i>
                        </div>
                        <span class="text-sm font-semibold text-zinc-900 pt-0.5 leading-tight">Work from Home</span>
                    </div>
                    
                    <div class="space-y-3">
                        <div class="flex justify-between items-end text-sm">
                            <span class="text-zinc-500">Used</span>
                            <span class="font-semibold text-zinc-900">2/6 days</span>
                        </div>
                        <div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-sky-500 w-1/3 rounded-full"></div>
                        </div>
                        <p class="text-xs font-medium text-zinc-500">4 days remaining</p>
                    </div>
                </div>

                <!-- Card 4: Field Visit -->
                <div class="bg-white p-4 rounded-2xl shadow-[0_2px_8px_-2px_rgba(0,0,0,0.05)] border border-gray-100 flex flex-col justify-between h-40">
                    <div class="flex items-start gap-3">
                        <div class="text-emerald-500 bg-emerald-50 p-1.5 rounded-lg">
                            <i data-lucide="map-pin" class="w-5 h-5"></i>
                        </div>
                        <span class="text-sm font-semibold text-zinc-900 pt-0.5 leading-tight">Field Visit</span>
                    </div>
                    
                    <div class="space-y-3">
                        <div class="flex justify-between items-end text-sm">
                            <span class="text-zinc-500">Used</span>
                            <span class="font-semibold text-zinc-900">2/10 days</span>
                        </div>
                        <div class="h-1.5 w-full bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full bg-emerald-500 w-1/5 rounded-full"></div>
                        </div>
                        <p class="text-xs font-medium text-zinc-500">8 days remaining</p>
                    </div>
                </div>

            </div>

            <!-- Remaining Yearly Balance Section -->
            <div class="pt-2">
                <h2 class="text-lg font-semibold tracking-tight text-zinc-900 mb-4 px-1">Remaining Yearly Balance</h2>
                
                <div class="grid grid-cols-2 gap-4">
                    
                    <!-- Balance Card 1 -->
                    <div class="bg-white p-4 rounded-2xl shadow-[0_1px_3px_rgba(0,0,0,0.05)] border border-gray-100 flex items-center justify-between">
                        <div class="flex flex-col gap-1">
                            <span class="text-sm font-medium text-zinc-500">Sick Leave</span>
                            <span class="text-2xl font-semibold tracking-tight text-zinc-900">8</span>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-rose-50 flex items-center justify-center text-rose-500">
                            <i data-lucide="frown" class="w-5 h-5"></i>
                        </div>
                    </div>

                    <!-- Balance Card 2 -->
                    <div class="bg-white p-4 rounded-2xl shadow-[0_1px_3px_rgba(0,0,0,0.05)] border border-gray-100 flex items-center justify-between">
                        <div class="flex flex-col gap-1">
                            <span class="text-sm font-medium text-zinc-500">Annual Leave</span>
                            <span class="text-2xl font-semibold tracking-tight text-zinc-900">12</span>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-500">
                            <i data-lucide="calendar-check" class="w-5 h-5"></i>
                        </div>
                    </div>

                    <!-- Balance Card 3 -->
                    <div class="bg-white p-4 rounded-2xl shadow-[0_1px_3px_rgba(0,0,0,0.05)] border border-gray-100 flex items-center justify-between">
                        <div class="flex flex-col gap-1">
                            <span class="text-sm font-medium text-zinc-500">WFH</span>
                            <span class="text-2xl font-semibold tracking-tight text-zinc-900">9</span>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-sky-50 flex items-center justify-center text-sky-500">
                            <i data-lucide="home" class="w-5 h-5"></i>
                        </div>
                    </div>

                    <!-- Balance Card 4 -->
                    <div class="bg-white p-4 rounded-2xl shadow-[0_1px_3px_rgba(0,0,0,0.05)] border border-gray-100 flex items-center justify-between">
                        <div class="flex flex-col gap-1">
                            <span class="text-sm font-medium text-zinc-500">Field Visit</span>
                            <span class="text-2xl font-semibold tracking-tight text-zinc-900">5</span>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-500">
                            <i data-lucide="map-pin" class="w-5 h-5"></i>
                        </div>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <script>
        lucide.createIcons({
            attrs: {
                strokeWidth: 1.5
            }
        });
    </script>
</body>
</html>
