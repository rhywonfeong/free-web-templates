    :root {
      --color-1: #abedd8;
      --color-2: #46cdcf;
      --color-3: #3d84a8;
      --color-4: #112d4e;
      --base-size: 55vmin;
      --length: 101;
      --half: 50;
      --gap-size: calc(var(--base-size) / var(--half));
      --gap-dist: calc(var(--base-size) / var(--length));
      --angle: 75deg;

      --ratio-a: 0.5;
      --ratio-b: 0.25;
      --ratio-s: 1.5;
      --dist-v: 10vh;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--color-4);
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .iphone-mockup {
      position: relative;
      width: 390px;
      height: 844px;
      background: #ececec;
      border-radius: 44px;
      box-shadow: 0 12px 54px 0 #112d4e44, 0 2px 8px 0 #112d4e22;
      border: 4px solid #d1d5db;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      padding: 0;
    }
    .iphone-mockup::before {
      content: "";
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 24px;
      background: #1c1c1e;
      border-radius: 13px;
      z-index: 15;
      box-shadow: 0 1px 3px #0003;
    }
    .iphone-mockup::after {
      content: "";
      position: absolute;
      top: 33px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 3.5px;
      background: #333;
      border-radius: 2px;
      opacity: .14;
      z-index: 16;
    }
    .iphone-btn.side {
      position: absolute;
      right: -6px;
      top: 100px;
      width: 3px;
      height: 50px;
      background: #c4c4c4;
      border-radius: 4px;
      z-index: 20;
      opacity: .6;
    }
    .iphone-btn.volup, .iphone-btn.voldown {
      position: absolute;
      left: -6px;
      width: 3px;
      height: 36px;
      background: #c4c4c4;
      border-radius: 4px;
      z-index: 20;
      opacity: .6;
    }
    .iphone-btn.volup { top: 92px; }
    .iphone-btn.voldown { top: 144px; }
    .iphone-mockup-inner {
      position: absolute;
      inset: 0;
      background: #000;
      border-radius: 40px;
      overflow: hidden;
      z-index: 1;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    .iphone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
      border-radius: 36px;
      overflow: hidden;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 0 19px;
      z-index: 20;
      pointer-events: none;
      font-family: 'SF Pro Display', 'Segoe UI', Arial, sans-serif;

      user-select: none;

      background: transparent;

    .status-bar-time {

      font-size: 1.01rem;
      color: #fff;
      text-shadow: 0 1px 4px #000a;
    }
    .status-bar-icons {

      align-items: center;
      gap: 11px;

    .home-indicator-wrap {
      pointer-events: none;
      position: absolute;
      bottom: 17px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 20;
    }
    .home-indicator {
      width: 110px;
      height: 5px;
      border-radius: 3px;
      background: #fff;
      opacity: .62;
      box-shadow: 0 1px 10px #0003, 0 0.5px 1.5px #fff3;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
    }
    .hero-bg section {
      display: flex;
      align-items: center;
      justify-content: center;
      animation: anim-v 20s ease-in-out infinite alternate;
      perspective: inherit;
      transform-style: preserve-3d;
      width: 100%;
      height: 100%;
    }
    .hero-bg ul {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      list-style: none;
      transform-style: preserve-3d;
      animation: anim-r 20s linear infinite;
      width: var(--base-size);
      height: var(--base-size);
      padding: 0;
      margin: 0;
    }
    .hero-bg li {
      position: absolute;
      top: 50%;
      left: 50%;
      transform-style: preserve-3d;
      animation: anim-h 2.5s var(--delay, 0s) ease-in-out infinite alternate;
      box-shadow: 0 0 2.75vmin 0.6875vmin rgba(61,132,168,0.25) inset;
      border-radius: 50%;
      will-change: transform;
      background: none;
    }
    .hero-bg li::before,
    .hero-bg li::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-50%);
      pointer-events: none;
      border-radius: 50%;
    }
    .hero-bg li::after {
      animation: anim-s 2.5s ease-in-out infinite alternate;
      box-shadow: 0 0 1.375vmin 0.34375vmin rgba(70,205,207,0.25) inset;
      background: none;
      width: var(--after-size, 0);
      height: var(--after-size, 0);
    }
    .hero-bg li::before {
      animation: anim-spin 2.5s var(--delay, 0s) linear infinite;
      box-shadow: 0 0 .6875vmin 0.171875vmin rgba(171,237,216,0.75) inset;
      background: none;
      width: var(--before-size, 0);
      height: var(--before-size, 0);
    }
    @keyframes anim-v {
      0%   { transform: translate3d(0, 10vh, 0); }
      100% { transform: translate3d(0,-10vh, 0) rotate3d(0,0,1,90deg);}
    }
    @keyframes anim-h {
      0%   { transform: translate(-50%, -50%) translate3d(0,0,0);}
      100% { transform: translate(-50%, -50%) translate3d(0,0,var(--dist,0));}
    }
    @keyframes anim-spin {
      0% { transform: translate(-50%,-50%) rotate(0deg);}
      100% { transform: translate(-50%,-50%) rotate(360deg);}
    }
    @keyframes anim-s {
      0% { transform: translate(-50%,-50%) scale3d(1,1,1);}
      100% { transform: translate(-50%,-50%) scale3d(1.5,1.5,1.5);}
    }
    @keyframes anim-r {
      0% { transform: rotate3d(1,1,0,75deg) rotate3d(0,0,-1,0deg);}
      100% { transform: rotate3d(1,1,0,75deg) rotate3d(0,0,-1,360deg);}
    }
    @keyframes reveal {
      0% { opacity: 0;}
      100% { opacity: 1;}
    }
    .hero-content {
      z-index: 10;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      width: 100%;
      text-align: center;
      pointer-events: auto;
      padding: 0 1.2rem;
    }
    .hero-headline {
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
      font-size: clamp(2.2rem, 6vw, 2.6rem);
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.03em;
      line-height: 1.13;
      margin-bottom: 1rem;
      text-shadow: 0 2px 32px rgba(17,45,78,0.6), 0 1px 0 #46cdcf99;
      filter: drop-shadow(0 2px 16px #3d84a899);
    }
    .hero-subtext {
      font-size: 0.96rem;
      color: rgba(255,255,255,0.6);
      font-weight: 400;
      margin-bottom: 2.2rem;
      padding-bottom: 1.5rem;
      max-width: 92%;
      text-shadow: 0 1px 12px #112d4e77;
      line-height: 1.44;
      padding-left: 0.8rem;
      padding-right: 0.8rem;
      margin-left: auto;
      margin-right: auto;
      letter-spacing: 0.01em;
    }
    .hero-button {
      font-size: 1.12rem;
      padding: 0.8em 2.2em;
      border-radius: 9999px;
      font-weight: 700;
      color: #112d4e;
      background: linear-gradient(90deg, #46cdcf 0%, #abedd8 100%);
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 24px #3d84a877, 0 1px 0 #46cdcf44;
      transition: transform 0.12s, box-shadow 0.12s, background 0.2s;
      outline: none;
    }
    .hero-button:hover, .hero-button:focus {
      transform: scale(1.05);
      box-shadow: 0 4px 36px #3d84a899, 0 2px 0 #abedd888;
      background: linear-gradient(90deg, #abedd8 0%, #46cdcf 100%);
    }
    @media (max-width: 500px) {
      .iphone-mockup { width: 97vw; height: 78vw; min-width: 0; min-height: 0; }
      .hero-headline { font-size: 1.22rem; }
      .hero-subtext { font-size: .82rem; max-width: 97%; padding-left: .3rem; padding-right: .3rem;}
      .hero-content { padding: 1.5rem 0.3rem; }
      .status-bar { font-size: .95rem; padding-left: 8px; padding-right: 8px; }
      .home-indicator { width: 64vw; max-width: 110px; }
    }
  </style>
</head>
<body>

    <div class="iphone-btn side"></div>

            <svg width="22" height="13" viewBox="0 0 22 13" fill="none" xmlns="http://www.w3.org/2000/svg">

  <script>
    // Set current time for status bar (optional, fallback to 9:41)
    let now = new Date();
    let hh = now.getHours();
    let mm = now.getMinutes();
    if (hh < 10) hh = '0'+hh;
    if (mm < 10) mm = '0'+mm;
    document.getElementById('statusTime').textContent = `${hh}:${mm}`;

    // Animated geometric hero
    const baseSize = 55; // vmin
    const length = 101;
    const half = Math.floor(length / 2);
    const gapDist = baseSize / length;
    const gapSize = baseSize / half;
    const time = 2.5;
    const delay = time / half;
    const ratioA = 0.5;
    const ratioB = 0.25;

    const ul = document.getElementById('orbit-list');
    function setLiStyles(li, index, sign = 1, step = 0) {
      const d = sign * (index * gapDist * 1.75);
      const size = baseSize - gapSize * (index - 1);
      li.style.setProperty('--delay', (delay * index) + 's');
      li.style.setProperty('--dist', d + 'vmin');
      li.style.width = size + 'vmin';
      li.style.height = size + 'vmin';
      li.style.setProperty('--after-size', (size * ratioA) + 'vmin');
      li.style.setProperty('--before-size', (size * ratioB) + 'vmin');
      li.style.zIndex = 10 + (sign * index);
      li.innerHTML = '';
      li.style.setProperty('--li-index', index);
    }
    for(let i=1; i<=half; ++i) {
      let li = document.createElement('li');
      setLiStyles(li, i, 1, 0);
      li.style.position = 'absolute';
      li.style.top = '50%';
      li.style.left = '50%';
      li.style.setProperty('--size', (baseSize - gapSize * (i - 1)) + 'vmin');
      li.style.setProperty('--after-size', ((baseSize - gapSize * (i - 1)) * ratioA) + 'vmin');
      li.style.setProperty('--before-size', ((baseSize - gapSize * (i - 1)) * ratioB) + 'vmin');
      ul.appendChild(li);
    }
    for(let i=1; i<=half; ++i) {
      let li = document.createElement('li');
      setLiStyles(li, i, -1, half);
      li.style.position = 'absolute';
      li.style.top = '50%';
      li.style.left = '50%';
      li.style.setProperty('--size', (baseSize - gapSize * (i - 1)) + 'vmin');
      li.style.setProperty('--after-size', ((baseSize - gapSize * (i - 1)) * ratioA) + 'vmin');
      li.style.setProperty('--before-size', ((baseSize - gapSize * (i - 1)) * ratioB) + 'vmin');
      ul.appendChild(li);
    }
  </script>
