@keyframes liquid-rotate {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
.liquid-layer {
animation: liquid-drift 10s ease-in-out infinite alternate;
}

            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="component" class="lucide lucide-component text-neutral-600 w-5 h-5"><path d="M15.536 11.293a1 1 0 0 0 0 1.414l2.376 2.377a1 1 0 0 0 1.414 0l2.377-2.377a1 1 0 0 0 0-1.414l-2.377-2.377a1 1 0 0 0-1.414 0z"></path><path d="M2.297 11.293a1 1 0 0 0 0 1.414l2.377 2.377a1 1 0 0 0 1.414 0l2.377-2.377a1 1 0 0 0 0-1.414L6.088 8.916a1 1 0 0 0-1.414 0z"></path><path d="M8.916 17.912a1 1 0 0 0 0 1.415l2.377 2.376a1 1 0 0 0 1.414 0l2.377-2.376a1 1 0 0 0 0-1.415l-2.377-2.376a1 1 0 0 0-1.414 0z"></path><path d="M8.916 4.674a1 1 0 0 0 0 1.414l2.377 2.376a1 1 0 0 0 1.414 0l2.377-2.376a1 1 0 0 0 0-1.414l-2.377-2.377a1 1 0 0 0-1.414 0z"></path></svg>

    <main class="z-10 flex flex-col gap-12 relative gap-x-12 gap-y-12 items-center">

        <div class="group relative w-full">
            <!-- Glow effect behind button -->
            <div class="-inset-1 group-hover:opacity-40 transition duration-1000 bg-gradient-to-r from-blue-100 to-purple-100 opacity-0 rounded-full absolute blur"></div>

                        inset 0 1px 1px rgba(255,255,255,0.9),

                ">
                
                <!-- 1. Background Layer: Fallback Gradients (Generative Liquid) -->
                <div class="liquid-fallback absolute inset-[-50%] bg-neutral-100 z-0">
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[200%] h-[200%] liquid-layer">
                        <div class="blob absolute top-0 left-0 w-full h-full bg-gradient-to-br from-blue-200/20 via-purple-100/30 to-transparent rounded-full animate-[spin_10s_linear_infinite]"></div>
                        <div class="blob absolute top-10 left-10 w-full h-full bg-gradient-to-tl from-pink-100/30 via-transparent to-blue-100/20 rounded-full animate-[spin_15s_linear_infinite_reverse]"></div>
                    </div>
                </div>

                <!-- 2. Camera Layer: The "Real" Liquid Refraction -->
                <!-- Note: This video element will capture the camera feed if permitted -->

            <div class="flex items-center gap-2">
                <input type="checkbox" id="camera-toggle" class="peer appearance-none w-9 h-5 bg-neutral-200 rounded-full checked:bg-neutral-800 cursor-pointer transition-colors relative after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all checked:after:translate-x-4 shadow-inner">
                <label for="camera-toggle" class="text-xs font-medium text-neutral-500 select-none cursor-pointer">Enable Camera Refraction</label>

        </div>

        <div class="max-w-xs text-center">

                Privacy Note: Video is processed locally via CSS filters.
            </p>
        </div>

    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Elements
        const toggle = document.getElementById('camera-toggle');
        const videos = [
            document.getElementById('video-feed-1'),
            document.getElementById('video-feed-2')
        ];
        
        let stream = null;

        // Camera Logic
        async function startCamera() {
            try {
                // Constraints per TDD (Low res for performance/blur)
                const constraints = {
                    video: {
                        facingMode: 'environment',
                        width: { ideal: 320 },
                        height: { ideal: 240 },
                        frameRate: { ideal: 15 } 
                    }
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                videos.forEach(video => {
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        video.play();
                        // Fade in video, hide fallback visually by overlaying
                        video.classList.remove('opacity-0');
                        video.classList.add('opacity-40'); // Keep it subtle
                    };
                });

            } catch (err) {
                console.error("Camera access denied or error:", err);
                toggle.checked = false;
                alert("Camera access is required for the liquid refraction effect. Please allow access or enjoy the generative fallback.");
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            videos.forEach(video => {
                video.srcObject = null;
                video.classList.remove('opacity-40');
                video.classList.add('opacity-0');
            });
        }

        // Toggle Handler
        toggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                startCamera();
            } else {
                stopCamera();
            }
        });

        // Mouse Movement Parallax (Subtle environmental motion)
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;

            videos.forEach(video => {
                // Slight opposite movement to create depth
                video.style.transform = `scale(1.5) translate(${x}px, ${y}px)`;
            });
        });

    </script>
