    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#0a0c12',
                            component: '#181c27',
                            input: 'rgba(30, 35, 50, 0.6)',
                            accent: '#00f0c0',
                            accentHover: '#00ffde',
                            text: '#e0e7ff',
                            secondary: '#a0aed0',
                            muted: '#707a95',
                            border: '#3a3f5e'
                        }
                    },
                    fontFamily: {
                        mono: ['Fira Code', 'monospace']
                    },
                    boxShadow: {
                        'glow': '0 0 18px rgba(0, 240, 192, 0.4)',
                        'glow-hover': '0 0 35px rgba(0, 240, 192, 0.6)'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cyber-bg font-mono text-cyber-text m-0 min-h-screen grid place-items-center p-5">
    <div class="flex rounded-lg overflow-hidden shadow-glow border border-cyber-border w-full max-w-5xl">
        <!-- Left Panel with Image -->
        <div class="flex-1 relative bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8YWJzdHJhY3QlMjBkYXJrJTIwbmVvbnxlbnwwfHwwfHx8MA%3D%3D&auto=format&fit=crop&w=800&q=80');">
            <!-- Dark overlay for better contrast -->
            <div class="absolute inset-0 bg-gradient-to-b from-black/50 to-black/70 z-0"></div>
            
            <!-- Content with improved contrast -->
            <div class="relative z-10 flex flex-col items-center justify-center h-full text-center p-10">
                <h3 class="text-2xl font-semibold text-white mb-4">Unlock The Future</h3>
                <p class="text-gray-100">Experience seamless access to next-generation tools and insights.</p>
            </div>
        </div>
        
        <!-- Right Panel with Form -->
        <div class="flex-[1.2] bg-cyber-component p-10">
            <h3 class="text-2xl font-semibold text-white text-center mb-6">Access Your Portal</h3>
            
            <form action="#" method="POST" onsubmit="return false;">
                <div class="mb-5">
                    <label for="email" class="block text-cyber-secondary font-medium mb-2">Operator ID</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="w-full bg-cyber-input text-cyber-text border border-cyber-border rounded-md px-4 py-3 focus:outline-none focus:border-cyber-accent focus:ring-2 focus:ring-cyber-accent/30"
                        placeholder="Enter your Operator ID" 
                        required
                    >
                </div>
                
                <div class="mb-5">
                    <label for="password" class="block text-cyber-secondary font-medium mb-2">Auth Key</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="w-full bg-cyber-input text-cyber-text border border-cyber-border rounded-md px-4 py-3 focus:outline-none focus:border-cyber-accent focus:ring-2 focus:ring-cyber-accent/30"
                        placeholder="Enter your Auth Key" 
                        required
                    >
                </div>
                
                <div class="flex justify-between items-center mb-6 text-sm">
                    <label class="flex items-center text-cyber-secondary cursor-pointer">
                        <input type="checkbox" name="remember" class="mr-2 appearance-none w-4 h-4 border border-cyber-border rounded bg-cyber-input checked:bg-cyber-accent relative">
                        <span>Secure session</span>
                    </label>
                    <a href="#" class="text-cyber-accent hover:text-cyber-accentHover">Auth Issues?</a>
                </div>
                
                <button 
                    type="submit" 
                    class="w-full bg-cyber-accent text-cyber-bg py-3 rounded-md font-medium shadow-glow hover:bg-cyber-accentHover hover:shadow-glow-hover transition-all duration-300 hover:scale-[1.02] hover:-translate-y-0.5"
                >
                    Connect
                </button>
                
                <p class="text-center mt-6 text-sm text-cyber-secondary">
                    Need clearance? <a href="#" class="text-cyber-accent hover:text-cyber-accentHover">Request Access</a>
                </p>
            </form>
        </div>
    </div>
</body>
</html>
