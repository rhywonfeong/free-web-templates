<body class="bg-gray-100 min-h-screen p-4 font-sans">
    <div class="max-w-md mx-auto animate-3d">
        <!-- Main Card Container -->

            <!-- Header Section -->
            <div class="p-6 pb-4">
                <div class="flex items-center justify-between mb-6">
