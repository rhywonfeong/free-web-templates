<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS UI Mockups</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><!-- aura-ga4-start -->

<body class="bg-slate-50 text-slate-900 min-h-screen p-4 sm:p-8 lg:p-12 flex flex-col items-center justify-center antialiased selection:bg-blue-100 selection:text-blue-900" style="font-family: 'Inter', sans-serif;">

    <!-- Logo Header (Letter only, tight tracking) -->
    <header class="w-full max-w-5xl mb-8 flex items-center px-1">
        <div class="text-lg font-medium tracking-tighter text-slate-900 flex items-center gap-1.5 cursor-pointer">
            <div class="w-6 h-6 bg-blue-600 text-white flex items-center justify-center rounded-md text-xs shadow-sm shadow-blue-600/20">E</div>
            EVNT
        </div>
    </header>

    <!-- 2x2 Grid Container -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full max-w-5xl">

        <!-- Top Left: Create a project modal snippet -->
        <div class="bg-white rounded-2xl shadow-[0_2px_8px_-4px_rgba(0,0,0,0.05)] border border-slate-200/60 p-6 sm:p-8 flex flex-col gap-6 w-full h-full relative overflow-hidden group">
            <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-blue-500/0 via-blue-500/10 to-blue-500/0 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            
            <h2 class="text-xl font-medium tracking-tight text-slate-900">New Project</h2>
            
            <div class="flex flex-col gap-5 flex-1">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-medium text-slate-500">Project Name</label>
                    <input type="text" placeholder="e.g., Annual Tech Summit" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm text-slate-900 placeholder-slate-400 shadow-[0_1px_2px_rgba(0,0,0,0.02)] focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-medium text-slate-500">Event Date</label>
                    <div class="relative flex items-center">
                        <iconify-icon icon="solar:calendar-linear" class="absolute left-3 text-slate-400 text-base pointer-events-none"></iconify-icon>
                        <input type="text" value="Oct 12 - Oct 15, 2024" class="w-full bg-white border border-slate-200 rounded-lg pl-9 pr-3 py-2 text-sm text-slate-900 placeholder-slate-400 shadow-[0_1px_2px_rgba(0,0,0,0.02)] focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all cursor-pointer" readonly>
                    </div>
                </div>
            </div>

            <div class="mt-2 pt-4 border-t border-slate-100/80">
                <button class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2.5 rounded-lg transition-colors shadow-sm shadow-blue-600/20 flex items-center justify-center gap-2">
                    Create Project
                    <iconify-icon icon="solar:arrow-right-linear" class="text-base"></iconify-icon>
                </button>
            </div>
        </div>

        <!-- Top Right: Add experiences app-store style menu -->
        <div class="bg-white rounded-2xl shadow-[0_2px_8px_-4px_rgba(0,0,0,0.05)] border border-slate-200/60 p-6 sm:p-8 flex flex-col gap-6 w-full h-full">
            <div class="flex items-center justify-between">
                <h2 class="text-xl font-medium tracking-tight text-slate-900">Add Experiences</h2>
                <button class="text-xs font-medium text-slate-400 hover:text-slate-600 transition-colors flex items-center gap-1">
                    Library <iconify-icon icon="solar:alt-arrow-right-linear"></iconify-icon>
                </button>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <!-- Mini Card 1 -->
                <div class="group border border-slate-100 bg-slate-50/30 rounded-xl p-4 flex flex-col items-center text-center gap-2.5 hover:border-blue-200 hover:bg-blue-50/20 transition-all cursor-pointer hover:shadow-sm">
                    <div class="h-10 w-10 rounded-full bg-white border border-slate-100 shadow-sm flex items-center justify-center text-slate-500 group-hover:text-blue-600 group-hover:border-blue-100 transition-colors">
                        <iconify-icon icon="solar:laptop-linear" class="text-xl"></iconify-icon>
                    </div>
                    <span class="text-sm font-medium text-slate-800 tracking-tight mt-1">Webpage</span>
                    <button class="mt-auto h-7 w-7 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-all">
                        <iconify-icon icon="solar:plus-linear" class="text-sm"></iconify-icon>
                    </button>
                </div>

                <!-- Mini Card 2 -->
                <div class="group border border-slate-100 bg-slate-50/30 rounded-xl p-4 flex flex-col items-center text-center gap-2.5 hover:border-blue-200 hover:bg-blue-50/20 transition-all cursor-pointer hover:shadow-sm">
                    <div class="h-10 w-10 rounded-full bg-white border border-slate-100 shadow-sm flex items-center justify-center text-slate-500 group-hover:text-blue-600 group-hover:border-blue-100 transition-colors">
                        <iconify-icon icon="solar:camera-linear" class="text-xl"></iconify-icon>
                    </div>
                    <span class="text-sm font-medium text-slate-800 tracking-tight mt-1">Photo Booth</span>
                    <button class="mt-auto h-7 w-7 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-all">
                        <iconify-icon icon="solar:plus-linear" class="text-sm"></iconify-icon>
                    </button>
                </div>

                <!-- Mini Card 3 -->
                <div class="group border border-slate-100 bg-slate-50/30 rounded-xl p-4 flex flex-col items-center text-center gap-2.5 hover:border-blue-200 hover:bg-blue-50/20 transition-all cursor-pointer hover:shadow-sm">
                    <div class="h-10 w-10 rounded-full bg-white border border-slate-100 shadow-sm flex items-center justify-center text-slate-500 group-hover:text-blue-600 group-hover:border-blue-100 transition-colors">
                        <iconify-icon icon="solar:clipboard-list-linear" class="text-xl"></iconify-icon>
                    </div>
                    <span class="text-sm font-medium text-slate-800 tracking-tight mt-1">Lead Capture</span>
                    <button class="mt-auto h-7 w-7 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-blue-600 group-hover:text-white transition-all">
                        <iconify-icon icon="solar:plus-linear" class="text-sm"></iconify-icon>
                    </button>
                </div>
            </div>
        </div>

        <!-- Bottom Left: Connect everything node-builder -->
        <div class="bg-white rounded-2xl shadow-[0_2px_8px_-4px_rgba(0,0,0,0.05)] border border-slate-200/60 p-6 sm:p-8 flex flex-col w-full h-full min-h-[320px] relative overflow-hidden bg-[radial-gradient(#e2e8f0_1px,transparent_1px)] [background-size:16px_16px]">
            <div class="absolute inset-0 bg-white/70"></div> <!-- Fade grid slightly -->
            <h2 class="text-xl font-medium tracking-tight text-slate-900 absolute top-6 left-6 sm:top-8 sm:left-8 z-20">Workflow Map</h2>

            <div class="absolute inset-0 top-16 z-0">
                <!-- SVG Connections mapping exactly to absolute percentages of the nodes -->
                <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none">
                    <!-- Pastel Pink Connection -->
                    <path d="M 25 50 C 50 50, 50 30, 75 30" fill="none" stroke="#fbcfe8" stroke-width="2" vector-effect="non-scaling-stroke"></path>
                    <circle cx="25" cy="50" r="4" fill="#fbcfe8" vector-effect="non-scaling-stroke" class="origin-center scale-[0.5]"></circle>
                    <circle cx="75" cy="30" r="4" fill="#fbcfe8" vector-effect="non-scaling-stroke" class="origin-center scale-[0.5]"></circle>
                    
                    <!-- Bright Blue Connection -->
                    <path d="M 25 50 C 50 50, 50 70, 75 70" fill="none" stroke="#60a5fa" stroke-width="2" vector-effect="non-scaling-stroke"></path>
                    <circle cx="75" cy="70" r="4" fill="#60a5fa" vector-effect="non-scaling-stroke" class="origin-center scale-[0.5]"></circle>
                </svg>

                <!-- Registration Node (Input) -->
                <div class="absolute left-[25%] top-[50%] -translate-x-1/2 -translate-y-1/2 bg-white border border-slate-200 shadow-sm rounded-lg py-2 pl-2 pr-4 flex items-center gap-2 z-10 w-max cursor-move hover:border-blue-300 transition-colors group">
                    <div class="bg-slate-50 border border-slate-100 text-slate-500 rounded-md w-7 h-7 flex items-center justify-center group-hover:text-blue-500 group-hover:bg-blue-50 transition-colors">
                        <iconify-icon icon="solar:user-plus-linear" class="text-sm"></iconify-icon>
                    </div>
                    <span class="text-xs font-medium text-slate-700">Registration</span>
                    <!-- Output Port -->
                    <div class="absolute right-0 top-1/2 -translate-y-1/2 translate-x-[50%] w-2.5 h-2.5 bg-white border-[2px] border-slate-300 rounded-full group-hover:border-blue-400 transition-colors"></div>
                </div>

                <!-- Interactive Wall Node (Output 1) -->
                <div class="absolute left-[75%] top-[30%] -translate-x-1/2 -translate-y-1/2 bg-white border border-pink-100 shadow-sm rounded-lg py-2 pl-2 pr-4 flex items-center gap-2 z-10 w-max cursor-move hover:border-pink-300 transition-colors group">
                    <!-- Input Port -->
                    <div class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-[50%] w-2.5 h-2.5 bg-white border-[2px] border-pink-300 rounded-full"></div>
                    <div class="bg-pink-50 border border-pink-100 text-pink-500 rounded-md w-7 h-7 flex items-center justify-center">
                        <iconify-icon icon="solar:gallery-wide-linear" class="text-sm"></iconify-icon>
                    </div>
                    <span class="text-xs font-medium text-slate-700">Interactive Wall</span>
                </div>

                <!-- Email Node (Output 2) -->
                <div class="absolute left-[75%] top-[70%] -translate-x-1/2 -translate-y-1/2 bg-white border border-blue-100 shadow-sm rounded-lg py-2 pl-2 pr-4 flex items-center gap-2 z-10 w-max cursor-move hover:border-blue-300 transition-colors group">
                    <!-- Input Port -->
                    <div class="absolute left-0 top-1/2 -translate-y-1/2 -translate-x-[50%] w-2.5 h-2.5 bg-white border-[2px] border-blue-400 rounded-full"></div>
                    <div class="bg-blue-50 border border-blue-100 text-blue-600 rounded-md w-7 h-7 flex items-center justify-center">
                        <iconify-icon icon="solar:letter-linear" class="text-sm"></iconify-icon>
                    </div>
                    <span class="text-xs font-medium text-slate-700">Email Sequence</span>
                </div>
            </div>
        </div>

        <!-- Bottom Right: Publish and monitor dashboard -->
        <div class="bg-white rounded-2xl shadow-[0_2px_8px_-4px_rgba(0,0,0,0.05)] border border-slate-200/60 p-6 sm:p-8 flex flex-col gap-6 w-full h-full justify-between">
            <div>
                <div class="flex items-center gap-3 mb-8">
                    <div class="flex items-center gap-2 bg-pink-50/80 border border-pink-100/50 text-pink-600 px-2.5 py-1 rounded-full text-[10px] font-medium tracking-wide uppercase">
                        <span class="relative flex h-1.5 w-1.5">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-pink-500"></span>
                        </span>
                        Live
                    </div>
                    <span class="text-xs font-medium text-slate-400">Project Status: <span class="text-slate-700">Published</span></span>
                </div>

                <div class="flex flex-col gap-1.5">
                    <h3 class="text-xs font-medium text-slate-500">Total Event Engagement</h3>
                    <div class="flex items-baseline gap-3">
                        <span class="text-4xl font-medium tracking-tight text-slate-900">12,482</span>
                        <span class="text-xs font-medium text-blue-600 flex items-center gap-0.5 bg-blue-50/50 border border-blue-100/50 px-1.5 py-0.5 rounded-md">
                            <iconify-icon icon="solar:trend-up-linear"></iconify-icon>
                            14%
                        </span>
                    </div>
                </div>
            </div>

            <!-- Mini Bar Chart -->
            <div class="flex items-end justify-between h-28 gap-1 sm:gap-1.5 mt-4 pt-4 border-t border-slate-100/80">
                <!-- Context/Background bars (Light Gray/Blue tint) -->
                <div class="w-full bg-slate-100 rounded-t-sm h-[30%] hover:bg-slate-200 transition-colors"></div>
                <div class="w-full bg-slate-100 rounded-t-sm h-[45%] hover:bg-slate-200 transition-colors"></div>
                <div class="w-full bg-slate-100 rounded-t-sm h-[25%] hover:bg-slate-200 transition-colors"></div>
                <div class="w-full bg-slate-100 rounded-t-sm h-[55%] hover:bg-slate-200 transition-colors"></div>
                <div class="w-full bg-slate-100 rounded-t-sm h-[40%] hover:bg-slate-200 transition-colors"></div>
                
                <!-- Active Data bars (Vibrant Blue) -->
                <div class="w-full bg-blue-500/90 rounded-t-sm h-[70%] hover:bg-blue-600 transition-colors shadow-[0_-2px_6px_rgba(59,130,246,0.15)]"></div>
                <div class="w-full bg-blue-500/90 rounded-t-sm h-[85%] hover:bg-blue-600 transition-colors shadow-[0_-2px_6px_rgba(59,130,246,0.15)]"></div>
                <div class="w-full bg-blue-500/90 rounded-t-sm h-[60%] hover:bg-blue-600 transition-colors shadow-[0_-2px_6px_rgba(59,130,246,0.15)]"></div>
                <div class="w-full bg-blue-500/90 rounded-t-sm h-[90%] hover:bg-blue-600 transition-colors shadow-[0_-2px_6px_rgba(59,130,246,0.15)]"></div>
                <div class="w-full bg-blue-600 rounded-t-sm h-[100%] hover:bg-blue-700 transition-colors shadow-[0_-2px_10px_rgba(37,99,235,0.25)] relative group cursor-pointer">
                    <!-- Subtle highlight on top edge for depth -->
                    <div class="absolute inset-x-0 top-0 h-[1px] bg-white/30 rounded-t-sm"></div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
