<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Calculator</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Iconify/Lucide -->
<script src="https://unpkg.com/lucide@latest"></script>
<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
fontFamily: {
sans: ['Inter', 'sans-serif'],
},
colors: {
background: '#09090b', // Zinc 950
surface: '#18181b', // Zinc 900
border: '#27272a', // Zinc 800
primary: '#fafafa', // Zinc 50
secondary: '#a1a1aa', // Zinc 400
accent: '#3f3f46', // Zinc 700
},

'slide-down': 'slideDown 0.15s ease-out',
},
keyframes: {

'100%': { opacity: '1' },
},

'0%': { opacity: '0', transform: 'translateY(-4px)' },

</script>
<style>
/* Custom Scrollbar for Dropdowns */
.custom-scrollbar::-webkit-scrollbar {
width: 6px;
}
.custom-scrollbar::-webkit-scrollbar-track {
background: transparent;
}
.custom-scrollbar::-webkit-scrollbar-thumb {

border-radius: 20px;
}

input[type=number]::-webkit-inner-spin-button,

}

<body class="bg-background text-zinc-300 min-h-screen flex items-center justify-center p-4 selection:bg-zinc-700 selection:text-white antialiased">

    <!-- Ambient Background Glow -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-indigo-500/5 blur-[120px]"></div>
        <div class="absolute top-[20%] right-[10%] w-[30%] h-[30%] rounded-full bg-violet-500/5 blur-[100px]"></div>
    </div>

    <!-- Main Card -->
    <main class="relative w-full max-w-md bg-zinc-900/40 backdrop-blur-xl border border-white/5 rounded-2xl shadow-2xl shadow-black overflow-hidden ring-1 ring-white/5">
        
        <!-- Header -->
        <div class="px-6 pt-8 pb-4">
            <div class="flex items-center gap-3 mb-2">
                <div class="size-8 rounded-lg bg-gradient-to-br from-zinc-100 to-zinc-400 flex items-center justify-center shadow-lg shadow-white/10">
                    <span class="font-semibold text-zinc-900 text-lg tracking-tighter">1M</span>
                </div>
                <h1 class="text-lg font-medium tracking-tight text-white">Rate Calculator</h1>
            </div>
            <p class="text-sm text-secondary">Real-time exchange rates for gift cards.</p>
        </div>

        <div class="px-6 pb-8 space-y-6">
            
            <!-- Currency Tabs -->
            <div class="space-y-2">
                <label class="text-xs font-medium text-secondary ml-1">Payout Currency</label>
                <div class="grid grid-cols-4 gap-1 p-1 bg-surface/80 rounded-lg border border-border">
                    <button class="currency-tab relative flex items-center justify-center py-1.5 text-xs font-medium rounded-md transition-all duration-200 text-secondary hover:text-white focus:outline-none" data-currency="NGN">
                        <span class="relative z-10">NGN</span>
                        <div class="active-bg absolute inset-0 bg-accent/40 rounded-md hidden"></div>
                    </button>
                    <button class="currency-tab relative flex items-center justify-center py-1.5 text-xs font-medium rounded-md transition-all duration-200 text-secondary hover:text-white focus:outline-none" data-currency="GHS">
                        <span class="relative z-10">GHS</span>
                        <div class="active-bg absolute inset-0 bg-accent/40 rounded-md hidden"></div>
                    </button>
                    <button class="currency-tab relative flex items-center justify-center py-1.5 text-xs font-medium rounded-md transition-all duration-200 text-secondary hover:text-white focus:outline-none" data-currency="KES">
                        <span class="relative z-10">KES</span>
                        <div class="active-bg absolute inset-0 bg-accent/40 rounded-md hidden"></div>
                    </button>
                    <button class="currency-tab relative flex items-center justify-center py-1.5 text-xs font-medium rounded-md transition-all duration-200 text-secondary hover:text-white focus:outline-none" data-currency="USD">
                        <span class="relative z-10">USD</span>
                        <div class="active-bg absolute inset-0 bg-accent/40 rounded-md hidden"></div>
                    </button>
                </div>
            </div>

            <!-- Gift Card Selection (Custom Searchable Dropdown) -->
            <div class="space-y-2 relative z-30">
                <label class="text-xs font-medium text-secondary ml-1">Gift Card</label>
                
                <div class="relative group" id="card-dropdown-container">
                    <!-- Trigger -->
                    <button id="card-trigger" class="w-full flex items-center justify-between bg-surface/50 border border-border hover:border-zinc-700 text-zinc-200 text-sm rounded-lg px-3 py-2.5 transition-colors focus:outline-none focus:ring-1 focus:ring-zinc-600 focus:border-zinc-600">
                        <span id="card-selected-text" class="truncate text-secondary">Select provider...</span>
                        <i data-lucide="chevron-down" class="size-4 text-zinc-500 transition-transform duration-200 group-focus-within:rotate-180"></i>
                    </button>

                    <!-- Dropdown Body -->
                    <div id="card-list-wrapper" class="absolute hidden top-full left-0 right-0 mt-1.5 bg-zinc-900 border border-border rounded-lg shadow-xl overflow-hidden animate-slide-down">
                        <div class="p-2 border-b border-border sticky top-0 bg-zinc-900">
                            <div class="relative">
                                <i data-lucide="search" class="absolute left-2.5 top-1/2 -translate-y-1/2 size-3.5 text-zinc-500"></i>
                                <input type="text" id="card-search" placeholder="Search cards..." class="w-full bg-surface border border-transparent focus:border-zinc-700 rounded-md py-1.5 pl-8 pr-3 text-xs text-zinc-200 placeholder-zinc-600 focus:outline-none transition-colors">
                            </div>
                        </div>
                        <ul id="card-list" class="max-h-56 overflow-y-auto custom-scrollbar p-1">
                            <!-- Items populated by JS -->
                            <li class="px-3 py-2 text-xs text-zinc-500 text-center">Loading cards...</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Sub Category Selection -->
            <div class="space-y-2 relative z-20">
                <label class="text-xs font-medium text-secondary ml-1">Sub Category</label>
                
                <div class="relative group" id="sub-dropdown-container">
                    <!-- Trigger -->
                    <button id="sub-trigger" class="w-full flex items-center justify-between bg-surface/50 border border-border hover:border-zinc-700 text-zinc-200 text-sm rounded-lg px-3 py-2.5 transition-colors focus:outline-none focus:ring-1 focus:ring-zinc-600 focus:border-zinc-600 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        <span id="sub-selected-text" class="truncate text-secondary">Select type...</span>
                        <i data-lucide="chevron-down" class="size-4 text-zinc-500 transition-transform duration-200"></i>
                    </button>

                    <!-- Dropdown Body -->
                    <div id="sub-list-wrapper" class="absolute hidden top-full left-0 right-0 mt-1.5 bg-zinc-900 border border-border rounded-lg shadow-xl overflow-hidden animate-slide-down">
                        <div class="p-2 border-b border-border sticky top-0 bg-zinc-900">
                            <div class="relative">
                                <i data-lucide="search" class="absolute left-2.5 top-1/2 -translate-y-1/2 size-3.5 text-zinc-500"></i>
                                <input type="text" id="sub-search" placeholder="Search types..." class="w-full bg-surface border border-transparent focus:border-zinc-700 rounded-md py-1.5 pl-8 pr-3 text-xs text-zinc-200 placeholder-zinc-600 focus:outline-none transition-colors">
                            </div>
                        </div>
                        <ul id="sub-list" class="max-h-56 overflow-y-auto custom-scrollbar p-1">
                            <!-- Items populated by JS -->
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Amount Input -->
            <div class="space-y-2 z-10 relative">
                <label class="text-xs font-medium text-secondary ml-1">Card Amount</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="dollar-sign" class="size-3.5 text-zinc-500 group-focus-within:text-zinc-300 transition-colors"></i>
                    </div>
                    <input type="number" id="amount-input" class="block w-full bg-surface/50 border border-border text-zinc-200 text-sm rounded-lg pl-9 pr-3 py-2.5 placeholder-zinc-600 focus:outline-none focus:border-zinc-600 focus:ring-1 focus:ring-zinc-600 transition-colors" placeholder="0.00">
                </div>
            </div>

            <!-- Result Row -->
            <div class="grid grid-cols-2 gap-4 pt-2">
                <!-- Current Rate -->
                <div class="flex flex-col gap-1 p-3 rounded-lg border border-border bg-gradient-to-b from-surface/50 to-transparent">
                    <span class="text-[10px] uppercase tracking-wider font-semibold text-zinc-500">Current Rate</span>
                    <div class="flex items-baseline gap-1">
                        <span id="display-rate" class="text-lg font-medium text-white tracking-tight">0.00</span>
                        <span id="rate-currency-label" class="text-xs text-zinc-500">/ $</span>
                    </div>
                </div>

                <!-- Total Value -->
                <div class="flex flex-col gap-1 p-3 rounded-lg border border-indigo-500/20 bg-gradient-to-br from-indigo-500/5 to-transparent relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-3 opacity-20">
                         <i data-lucide="wallet" class="size-8 text-indigo-500"></i>
                    </div>
                    <span class="text-[10px] uppercase tracking-wider font-semibold text-indigo-400">Total Value</span>
                    <div class="flex items-baseline gap-1 z-10">
                        <span id="display-total" class="text-lg font-medium text-indigo-100 tracking-tight">0.00</span>
                        <span id="total-currency-label" class="text-xs text-indigo-300">NGN</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Status Bar / Footer -->
        <div class="bg-surface/30 px-6 py-3 border-t border-white/5 flex items-center justify-between text-[10px] text-zinc-600">
            <div class="flex items-center gap-1.5">
                <div class="size-1.5 rounded-full bg-emerald-500/50 animate-pulse"></div>
                <span>Live Rates</span>
            </div>
            <span>Encrypted Connection</span>
        </div>

    </main>

    <script>
        // --- State Management ---
        const state = {
            currency: 'NGN',
            ratesData: [],
            selectedCardId: null,
            selectedSubId: null,
            amount: 0
        };

        // --- DOM Elements ---
        const els = {
            currencyTabs: document.querySelectorAll('.currency-tab'),
            cardTrigger: document.getElementById('card-trigger'),
            cardListWrapper: document.getElementById('card-list-wrapper'),
            cardList: document.getElementById('card-list'),
            cardSearch: document.getElementById('card-search'),
            cardSelectedText: document.getElementById('card-selected-text'),
            
            subTrigger: document.getElementById('sub-trigger'),
            subListWrapper: document.getElementById('sub-list-wrapper'),
            subList: document.getElementById('sub-list'),
            subSearch: document.getElementById('sub-search'),
            subSelectedText: document.getElementById('sub-selected-text'),
            
            amountInput: document.getElementById('amount-input'),
            
            displayRate: document.getElementById('display-rate'),
            displayTotal: document.getElementById('display-total'),
            totalCurrencyLabel: document.getElementById('total-currency-label')
        };

        // --- Logic ---

        async function init() {
            lucide.createIcons();
            setupEventListeners();
            selectCurrency('NGN');
            
            try {
                // Use a CORS proxy to bypass browser restriction
                const targetUrl = 'https://1minutepay.yuyu.ng/wp-content/uploads/one_minute_pay_test.giftcards.json';
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);
                
                const response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const json = await response.json();
                state.ratesData = normalizeData(json);
                renderCardList(state.ratesData);
                
            } catch (error) {
                console.error("Failed to load rates via proxy, using fallback", error);
                
                // Fallback Data
                const fallbackData = [
                    {
                        "id": 1, "title": "Apple iTunes",
                        "data": [{ "id": "it-1", "title": "USA (Physical)", "rate": 1100 }, { "id": "it-2", "title": "USA (E-Code)", "rate": 1050 }]
                    },
                    {
                        "id": 2, "title": "Steam Wallet",
                        "data": [{ "id": "st-1", "title": "USA", "rate": 1150 }, { "id": "st-2", "title": "UK", "rate": 1400 }]
                    },
                    {
                        "id": 3, "title": "Google Play",
                        "data": [{ "id": "gp-1", "title": "USA", "rate": 1120 }]
                    },
                    {
                        "id": 4, "title": "Amazon",
                        "data": [{ "id": "am-1", "title": "USA (Cash Receipt)", "rate": 1080 }]
                    }
                ];
                state.ratesData = normalizeData(fallbackData);
                renderCardList(state.ratesData);
            }
        }

        function normalizeData(json) {
            // Check for wrapped data structure
            let data = Array.isArray(json) ? json : (json.data || []);
            
            return data.map((item, index) => {
                const name = item.title || item.name || item.service_name || "Unknown Card";
                // Ensure ID is treated as a string to match dropdown logic later
                const id = String(item.id !== undefined ? item.id : index);
                
                // Defensive check for subtypes arrays
                const rawSubtypes = item.data || item.subtypes || item.products || [];
                
                const subtypes = rawSubtypes.map((sub, sIndex) => {
                    return {
                        id: String(sub.id || `${id}-${sIndex}`),
                        name: sub.title || sub.name || "Standard",
                        rate: parseFloat(sub.rate || sub.sell_rate || sub.price || 0)
                    };
                });

                return { id, name, subtypes };
            }).sort((a, b) => a.name.localeCompare(b.name));
        }

        function setupEventListeners() {
            // Currency Tabs
            els.currencyTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    selectCurrency(tab.dataset.currency);
                });
            });

            // Card Dropdown Logic
            setupDropdown(
                els.cardTrigger, 
                els.cardListWrapper, 
                els.cardSearch, 
                els.cardList, 
                () => state.ratesData, // Data source
                (item) => { // On Select
                    state.selectedCardId = item.id;
                    els.cardSelectedText.textContent = item.name;
                    els.cardSelectedText.classList.replace('text-secondary', 'text-white');
                    
                    // Reset Subtype
                    state.selectedSubId = null;
                    els.subSelectedText.textContent = "Select type...";
                    els.subSelectedText.classList.replace('text-white', 'text-secondary');
                    els.subTrigger.disabled = false;
                    
                    // Clear previous sub-list items
                    els.subList.innerHTML = '';
                    
                    calculate();
                }
            );

            // Subtype Dropdown Logic
            setupDropdown(
                els.subTrigger, 
                els.subListWrapper, 
                els.subSearch, 
                els.subList, 
                () => { // Data source
                    // Convert both to string to ensure matching works regardless of data type
                    const card = state.ratesData.find(c => String(c.id) === String(state.selectedCardId));
                    return card ? card.subtypes : [];
                }, 
                (item) => { // On Select
                    state.selectedSubId = item.id;
                    els.subSelectedText.textContent = item.name;
                    els.subSelectedText.classList.replace('text-secondary', 'text-white');
                    calculate();
                }
            );

            // Amount Input
            els.amountInput.addEventListener('input', (e) => {
                state.amount = parseFloat(e.target.value) || 0;
                calculate();
            });

            // Close dropdowns on outside click
            document.addEventListener('click', (e) => {
                if(!els.cardTrigger.contains(e.target) && !els.cardListWrapper.contains(e.target)) {
                    els.cardListWrapper.classList.add('hidden');
                }
                if(!els.subTrigger.contains(e.target) && !els.subListWrapper.contains(e.target)) {
                    els.subListWrapper.classList.add('hidden');
                }
            });
        }

        function setupDropdown(trigger, wrapper, searchInput, listEl, getDataSource, onSelect) {
            trigger.addEventListener('click', () => {
                if (trigger.disabled) return;
                
                // Hide other dropdown if open
                if (trigger === els.cardTrigger) els.subListWrapper.classList.add('hidden');
                if (trigger === els.subTrigger) els.cardListWrapper.classList.add('hidden');

                const isHidden = wrapper.classList.contains('hidden');
                
                if (isHidden) {
                    wrapper.classList.remove('hidden');
                    searchInput.value = '';
                    searchInput.focus();
                    // Load data fresh
                    filterList(listEl, getDataSource(), '', onSelect, wrapper);
                } else {
                    wrapper.classList.add('hidden');
                }
            });

            searchInput.addEventListener('input', (e) => {
                filterList(listEl, getDataSource(), e.target.value, onSelect, wrapper);
            });
        }

        function filterList(listElement, data, query, onSelect, wrapper) {
            listElement.innerHTML = '';
            
            if (!data || data.length === 0) {
                 listElement.innerHTML = `<li class="px-3 py-2 text-xs text-secondary text-center">No types available</li>`;
                 return;
            }

            const filtered = data.filter(item => item.name.toLowerCase().includes(query.toLowerCase()));

            if (filtered.length === 0) {
                listElement.innerHTML = `<li class="px-3 py-2 text-xs text-secondary text-center">No results found</li>`;
                return;
            }

            filtered.forEach(item => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between px-3 py-2 text-xs text-zinc-300 hover:bg-zinc-800 hover:text-white rounded-md cursor-pointer transition-colors";
                
                // Item Name
                const nameSpan = document.createElement('span');
                nameSpan.textContent = item.name;
                li.appendChild(nameSpan);

                // Optional: Show rate if available
                if(item.rate !== undefined) {
                    const rateSpan = document.createElement('span');
                    rateSpan.className = "text-[10px] text-zinc-500 font-mono";
                    rateSpan.textContent = item.rate;
                    li.appendChild(rateSpan);
                }

                li.addEventListener('click', () => {
                    onSelect(item);
                    wrapper.classList.add('hidden');
                });
                listElement.appendChild(li);
            });
        }

        function renderCardList(data) {
             // Initial load is handled by the click event, but we can verify data exists here
             // console.log("Data loaded:", data.length);
        }

        function selectCurrency(currency) {
            state.currency = currency;
            els.totalCurrencyLabel.textContent = currency;
            
            els.currencyTabs.forEach(tab => {
                const isActive = tab.dataset.currency === currency;
                const bg = tab.querySelector('.active-bg');
                
                if (isActive) {
                    bg.classList.remove('hidden');
                    tab.classList.replace('text-secondary', 'text-white');
                } else {
                    bg.classList.add('hidden');
                    tab.classList.replace('text-white', 'text-secondary');
                }
            });
            
            calculate();
        }

        function calculate() {
            let rate = 0;
            let total = 0;

            if (state.selectedCardId && state.selectedSubId) {
                // Use robust string comparison
                const card = state.ratesData.find(c => String(c.id) === String(state.selectedCardId));
                const sub = card ? card.subtypes.find(s => String(s.id) === String(state.selectedSubId)) : null;
                
                if (sub) {
                    let baseRate = sub.rate;

                    // Simple conversion logic (mock)
                    if (state.currency === 'NGN') {
                        rate = baseRate;
                    } else {
                        if (state.currency === 'GHS') rate = baseRate * 0.012; 
                        if (state.currency === 'KES') rate = baseRate * 0.15; 
                        if (state.currency === 'USD') rate = baseRate / 1500; 
                    }
                }
            }

            total = rate * state.amount;

            els.displayRate.textContent = rate.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            els.displayTotal.textContent = total.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
