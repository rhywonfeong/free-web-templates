<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}
</script>
<meta charset="UTF-8">
<title>TrulyYou – Step 4</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script></head>

<body class="font-[Inter] antialiased min-h-screen flex items-center justify-center overflow-x-hidden"
      style="background:linear-gradient(135deg,var(--c1,#1c1523),var(--c2,#16121d)); color:var(--fg,#f5f3fb)">

  <!-- Soft grain overlay -->
  <div class="pointer-events-none fixed inset-0 -z-20 opacity-40"
       style="background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22128%22 height=%22128%22 viewBox=%220 0 128 128%22><filter id=%22noise%22><feTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%224%22 /></filter><rect width=%22128%22 height=%22128%22 filter=%22url(%23noise)%22 /></svg>');"></div>

  <!-- Glow orbs -->
  <div class="pointer-events-none absolute -z-10 inset-0">
    <div class="absolute -top-10 left-1/3 w-60 h-60 bg-white/5 blur-3xl rounded-full animate-pulse"></div>
    <div class="absolute bottom-0 right-6 w-40 h-40 bg-white/10 blur-2xl rounded-full animate-ping delay-1000"></div>
  </div>

  <!-- Card -->
  <main class="relative w-full max-w-md mx-auto px-5 sm:px-8 py-12 space-y-10 backdrop-blur-xl bg-white/5/10 rounded-3xl shadow-xl border border-white/10">

    <!-- Progress -->
    <div class="flex items-center gap-3">
      <div class="flex-1 h-1 rounded-full bg-white/10 overflow-hidden">
        <div class="h-full bg-amber-200 animate-[progress_1.5s_ease-out_forwards]"></div>
      </div>
      <span class="text-xs tracking-tight text-amber-100 whitespace-nowrap">Step 4 of 4</span>
    </div>

    <!-- Header -->
    <header class="text-center space-y-3">
      <h1 class="text-[28px] sm:text-3xl font-semibold tracking-tight"
          style="color:var(--accent,#fde68a)">Help us understand the real you.</h1>
      <p class="text-sm leading-relaxed text-white/80">
        You can share a life experience, a challenge you’ve overcome, a recurring feeling, or a moment that
        shaped you. This helps TrulyYou offer insights that feel deeply personal and emotionally aligned.
      </p>
    </header>

    <!-- Text area -->
    <div class="relative">
      <textarea id="story"
        class="w-full h-64 sm:h-72 resize-none rounded-2xl bg-white/5 p-5 leading-relaxed text-[15px] placeholder-white/40 focus:outline-none focus:ring-2 focus:ring-amber-200/60 focus:ring-offset-[color:var(--ringOffset,#1c1523)]"
        placeholder="I’ve always struggled to trust myself…"></textarea>

      <button type="button" aria-label="Record voice"
        class="absolute bottom-4 right-4 h-12 w-12 rounded-full bg-white/10 backdrop-blur-sm flex items-center justify-center text-white hover:bg-white/15 active:scale-95 transition">
        <i data-lucide="mic" class="h-5 w-5"></i>
      </button>
    </div>

    <!-- CTA -->
    <button id="finishBtn" type="button"
      class="group relative w-full py-3 rounded-2xl bg-amber-200 text-[#18120f] font-medium tracking-tight shadow-lg focus:outline-none active:scale-95">
      Finish Onboarding
      <span class="absolute inset-0 rounded-2xl border border-amber-200/40 opacity-0 group-hover:opacity-100 transition"/>
    </button>
  </main>

  <!-- Scripts -->
  <script>
    // Load lucide icons
    lucide.createIcons();

    // Color logic from stored selection
    (function () {
      const qp = new URLSearchParams(location.search);
      const stored = localStorage.getItem('colors') || '';
      const chosen = (qp.get('colors') || stored).split(',').filter(Boolean);
      let [c1,c2] = ['#1c1523','#16121d'];
      if (chosen.length === 1) {
        c1 = chosen[0];
        c2 = tinycolor(chosen[0]).lighten(8).toString();
      } else if (chosen.length >= 2) { [c1,c2] = chosen; }
      document.documentElement.style.setProperty('--c1', c1);
      document.documentElement.style.setProperty('--c2', c2);
      document.documentElement.style.setProperty('--ringOffset', c1);
      const accent = tinycolor.mix(c1, c2, 25).lighten(20).toString();
      document.documentElement.style.setProperty('--accent', accent);
      document.documentElement.style.setProperty('--fg',
        tinycolor.mix('#ffffff', tinycolor.average([c1,c2])).isLight() ? '#1a151d' : '#f5f3fb');
    })();

    // TinyColor loader
    (function(){const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/tinycolor/1.4.2/tinycolor.min.js';document.head.appendChild(s)})();

    // Staggered fade-in
    document.querySelectorAll('main > *').forEach((el,i)=>{
      el.style.opacity=0;el.style.transform='translateY(12px)';
      setTimeout(()=>{el.style.transition='all .7s';el.style.opacity=1;el.style.transform='none';},150+i*120);
    });

    // CTA pulse
    setInterval(()=>document.getElementById('finishBtn').classList.toggle('animate-pulse'),3200);

    // Fake submit
    document.getElementById('finishBtn').addEventListener('click',()=>alert('Thank you for sharing!'));
  </script>

  <!-- Animations -->
  <style>
    @keyframes progress{from{width:0}to{width:100%}}
  </style>
</body>
</html>
