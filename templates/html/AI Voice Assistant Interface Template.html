}
@keyframes blink {

50% { opacity: 0; }
}
.animate-wave-active {
animation: wave-active 0.8s ease-in-out infinite;
}
.cursor-blink {
animation: blink 1s step-end infinite;
}
.ring-pulse {

      </div>

        <div class="absolute inset-0 rounded-full border border-cyan-500/20 ring-pulse"></div>
        <div class="absolute inset-4 rounded-full border border-indigo-500/20 ring-pulse [animation-delay:0.5s]"></div>

        <div class="relative w-28 h-28 bg-gradient-to-b rounded-full border flex items-center justify-center nova-glow overflow-hidden z-10 from-zinc-800 to-zinc-950 border-zinc-700/50">
          <div class="flex items-center justify-center gap-[3px] h-8">
            <!-- Active Voice Waveform -->
            <div class="w-[3px] rounded-full animate-wave-active [animation-duration:0.6s] bg-cyan-400"></div>
            <div class="w-[3px] rounded-full animate-wave-active [animation-delay:0.1s] [animation-duration:0.9s] bg-cyan-400"></div>

          </div>
          <div class="absolute inset-0 bg-gradient-to-t from-cyan-500/10 to-transparent pointer-events-none"></div>
        </div>
      </div>

      <div class="w-full flex flex-col items-center gap-6">

        <p class="text-zinc-500 text-sm font-medium tracking-tight">

        <!-- AI Response (Active) -->
        <div class="text-center space-y-2 max-w-2xl">

        <div class="mt-4 flex flex-col gap-2 w-full max-w-sm">

          <div class="glass-panel rounded-lg p-3 flex items-center gap-3 border-l-2 border-l-cyan-500">
            <div class="h-8 w-8 rounded bg-cyan-500/10 flex items-center justify-center shrink-0 text-cyan-400">

            </div>
            <div class="flex-1 min-w-0">

                  Nova Assistant
                </span>
                <span class="text-[10px] font-medium animate-pulse text-cyan-400">
                  Listening
                </span>
              </div>
              <div class="w-full rounded-full h-1 bg-zinc-800">
                <div class="bg-cyan-500 h-1 rounded-full w-[100%]"></div>
              </div>
            </div>
          </div>

        </div>

          </div>
          <p class="text-[10px] uppercase tracking-widest font-medium text-zinc-600">
            Auto-scroll: On
          </p>
        </div>
      </div>
    </footer>
