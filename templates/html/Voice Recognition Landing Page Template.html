<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magical Words</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #000;
}
/* Floating Hearts Animation */
@keyframes floatHeart {
0% {
bottom: -20px;
opacity: 0;
transform: scale(var(--scale)) translateX(0) rotate(0deg);
}
15% {
opacity: 0.9;
}
85% {
opacity: 0.9;
}
100% {
bottom: 100%;
opacity: 0;
transform: scale(var(--scale)) translateX(var(--drift)) rotate(var(--rotation));
}
}
.heart {
position: absolute;
color: #0047AB; /* Cobalt Blue */
animation: floatHeart var(--duration) linear infinite;
animation-delay: var(--delay);
opacity: 0;
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-black text-white antialiased min-h-screen flex items-center justify-center selection:bg-white/20 selection:text-white overflow-hidden">

    <main class="w-full max-w-2xl px-6 relative h-screen flex flex-col items-center justify-center">

        <!-- Initial & Listening State -->
        <div id="state-initial" class="absolute inset-0 flex flex-col items-center justify-center transition-all duration-700 ease-in-out opacity-100 z-10">
            
            <div class="flex flex-col items-center text-center space-y-3 sm:space-y-4 mb-10 sm:mb-12">
                <p class="text-xs text-neutral-400 tracking-wide font-medium">Make sure you’re in a quiet area</p>
                <h1 class="text-2xl sm:text-3xl md:text-4xl font-medium tracking-tight text-neutral-100">Tell me those 3 magical words</h1>
            </div>

            <div class="flex items-center gap-3 sm:gap-4">
                <button id="btn-start" class="group relative px-6 py-2.5 rounded-full text-xs font-medium tracking-widest uppercase border border-neutral-800 bg-neutral-900/50 text-neutral-300 hover:bg-neutral-800 hover:text-white hover:border-neutral-700 transition-all duration-300 disabled:opacity-0 disabled:pointer-events-none flex items-center gap-2">
                    <iconify-icon icon="solar:mic-linear" class="text-base"></iconify-icon>
                    Start
                </button>
                
                <button id="btn-stop" disabled class="group relative px-6 py-2.5 rounded-full text-xs font-medium tracking-widest uppercase border border-transparent text-neutral-600 transition-all duration-300 disabled:opacity-50 disabled:pointer-events-none flex items-center gap-2">
                    <div id="recording-dot" class="w-1.5 h-1.5 rounded-full bg-red-500 opacity-0 transition-opacity duration-300"></div>
                    Stop / Submit
                </button>
            </div>
            
        </div>

        <!-- Success State -->
        <div id="state-success" class="absolute inset-0 flex flex-col items-center justify-center transition-all duration-700 ease-in-out opacity-0 pointer-events-none z-0">
            
            <div class="relative w-48 h-64 sm:w-56 sm:h-72 mb-8 sm:mb-10 rounded-2xl bg-neutral-900 overflow-hidden border border-neutral-800 flex items-center justify-center shadow-2xl">
                <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/1c4f0f65-083f-4410-9978-f6e1e109cf00_800w.png" alt="Atom" class="absolute inset-0 w-full h-full object-cover z-20" />
                
                <!-- Floating Hearts Overlay -->
                <div class="absolute inset-0 z-30 pointer-events-none" aria-hidden="true">
                    <iconify-icon icon="solar:heart-bold" class="heart text-sm" style="left: 15%; --scale: 0.8; --duration: 4.5s; --delay: 0s; --drift: 15px; --rotation: 10deg;"></iconify-icon>
                    <iconify-icon icon="solar:heart-bold" class="heart text-base" style="left: 35%; --scale: 1.1; --duration: 5.2s; --delay: 1.2s; --drift: -10px; --rotation: -15deg;"></iconify-icon>
                    <iconify-icon icon="solar:heart-bold" class="heart text-xs" style="left: 55%; --scale: 0.9; --duration: 3.8s; --delay: 2.5s; --drift: 20px; --rotation: 5deg;"></iconify-icon>
                    <iconify-icon icon="solar:heart-bold" class="heart text-sm" style="left: 75%; --scale: 1.2; --duration: 4.8s; --delay: 0.5s; --drift: -15px; --rotation: -5deg;"></iconify-icon>
                    <iconify-icon icon="solar:heart-bold" class="heart text-xs" style="left: 25%; --scale: 0.7; --duration: 5.5s; --delay: 3s; --drift: 5px; --rotation: 12deg;"></iconify-icon>
                    <iconify-icon icon="solar:heart-bold" class="heart text-sm" style="left: 85%; --scale: 1; --duration: 4.2s; --delay: 1.8s; --drift: -8px; --rotation: -10deg;"></iconify-icon>
                    <iconify-icon icon="solar:heart-bold" class="heart text-base" style="left: 45%; --scale: 0.8; --duration: 6s; --delay: 0.2s; --drift: 12px; --rotation: 8deg;"></iconify-icon>
                    <iconify-icon icon="solar:heart-bold" class="heart text-xs" style="left: 65%; --scale: 1.1; --duration: 5.8s; --delay: 3.5s; --drift: -12px; --rotation: 15deg;"></iconify-icon>
                </div>
            </div>
            
            <h2 class="text-xl sm:text-2xl md:text-3xl font-medium tracking-tight text-white">ATOM LOVES YOU TOO</h2>
        </div>

        <!-- Failure State -->
        <div id="state-failure" class="absolute inset-0 flex flex-col items-center justify-center transition-all duration-700 ease-in-out opacity-0 pointer-events-none z-0">
            <h2 class="text-2xl sm:text-3xl font-medium tracking-tight text-white mb-8 sm:mb-10">YOU’RE NOT ATOM</h2>
            
            <button id="btn-retry" class="px-8 py-3 rounded-full text-xs font-medium tracking-widest uppercase border border-neutral-800 bg-transparent text-neutral-400 hover:bg-neutral-900 hover:text-white hover:border-neutral-600 transition-all duration-300">
                Try Again
            </button>
        </div>

        <!-- System Error State -->
        <div id="state-error" class="absolute inset-0 flex flex-col items-center justify-center transition-all duration-700 ease-in-out opacity-0 pointer-events-none z-0">
            <p id="error-message" class="text-sm sm:text-base text-neutral-400 font-medium tracking-wide text-center px-6"></p>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // UI Elements
            const stateInitial = document.getElementById('state-initial');
            const stateSuccess = document.getElementById('state-success');
            const stateFailure = document.getElementById('state-failure');
            const stateError = document.getElementById('state-error');
            const errorMessage = document.getElementById('error-message');

            const btnStart = document.getElementById('btn-start');
            const btnStop = document.getElementById('btn-stop');
            const btnRetry = document.getElementById('btn-retry');
            const recordingDot = document.getElementById('recording-dot');

            // Speech Variables
            let recognition = null;
            let capturedText = "";
            let isListening = false;
            const MAGIC_PHRASE = "I LOVE ATOM";
            const MAGIC_PHRASE_ALT = "I LOVE ADAM"; // Common speech-to-text transcription

            // State Management Helper
            const showState = (targetStateId) => {
                const states = ['state-initial', 'state-success', 'state-failure', 'state-error'];
                
                states.forEach(id => {
                    const el = document.getElementById(id);
                    if (id === targetStateId) {
                        el.classList.remove('opacity-0', 'pointer-events-none', 'z-0');
                        el.classList.add('opacity-100', 'z-10');
                    } else {
                        el.classList.remove('opacity-100', 'z-10');
                        el.classList.add('opacity-0', 'pointer-events-none', 'z-0');
                    }
                });
            };

            const displayError = (msg) => {
                errorMessage.textContent = msg;
                showState('state-error');
            };

            const resetUI = () => {
                capturedText = "";
                btnStart.disabled = false;
                btnStart.classList.remove('opacity-0');
                
                btnStop.disabled = true;
                btnStop.classList.remove('text-white', 'border-neutral-700', 'bg-neutral-900/50');
                btnStop.classList.add('text-neutral-600', 'border-transparent');
                
                recordingDot.classList.remove('opacity-100', 'animate-pulse');
                recordingDot.classList.add('opacity-0');
            };

            // Initialize Web Speech API
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                displayError("Voice recognition is not supported in this browser");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            // Speech Event Handlers
            recognition.onstart = () => {
                isListening = true;
                
                // Style START button (hide gracefully)
                btnStart.disabled = true;
                btnStart.classList.add('opacity-0');
                
                // Style STOP button (active)
                btnStop.disabled = false;
                btnStop.classList.remove('text-neutral-600', 'border-transparent');
                btnStop.classList.add('text-white', 'border-neutral-700', 'bg-neutral-900/50', 'hover:border-neutral-500');
                
                // Recording indicator
                recordingDot.classList.remove('opacity-0');
                recordingDot.classList.add('opacity-100', 'animate-pulse');
            };

            recognition.onresult = (event) => {
                let currentTranscript = "";
                for (let i = 0; i < event.results.length; i++) {
                    currentTranscript += event.results[i][0].transcript;
                }
                capturedText = currentTranscript;
            };

            recognition.onerror = (event) => {
                isListening = false;
                if (event.error === 'not-allowed') {
                    displayError("Microphone access is required");
                } else if (event.error !== 'no-speech') {
                    resetUI();
                }
            };

            recognition.onend = () => {
                // If it ends automatically (e.g., silence), process what we have.
                if (isListening) {
                    isListening = false;
                    evaluateSpeech();
                }
            };

            // Evaluation Logic
            const evaluateSpeech = () => {
                // Strip punctuation and extra spaces for a cleaner match
                const normalizedText = capturedText
                    .toUpperCase()
                    .replace(/[.,!?]/g, '')
                    .replace(/\s+/g, ' ')
                    .trim();
                
                // Use includes to be more forgiving, and check for the "Adam" homophone
                if (normalizedText.includes(MAGIC_PHRASE) || normalizedText.includes(MAGIC_PHRASE_ALT)) {
                    showState('state-success');
                } else {
                    showState('state-failure');
                }
                
                // Keep buttons in reset visual state in the background
                setTimeout(resetUI, 500); 
            };

            // Interactions
            btnStart.addEventListener('click', () => {
                capturedText = "";
                try {
                    recognition.start();
                } catch (e) {
                    // Prevent crash if already started
                }
            });

            btnStop.addEventListener('click', () => {
                if (isListening) {
                    isListening = false;
                    recognition.stop();
                    evaluateSpeech();
                }
            });

            btnRetry.addEventListener('click', () => {
                resetUI();
                showState('state-initial');
            });
        });
    </script>
</body>
</html>
