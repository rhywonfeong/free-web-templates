<html lang="en" class="antialiased">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Timer</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* Custom Range Slider Styling for Webkit */
input[type=range] {
-webkit-appearance: none;
background: transparent;
}
input[type=range]::-webkit-slider-thumb {
-webkit-appearance: none;
height: 24px;
width: 24px;
border-radius: 50%;
background: currentColor;
cursor: pointer;
margin-top: -10px;
box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}
input[type=range]::-webkit-slider-runnable-track {
width: 100%;
height: 4px;
cursor: pointer;
background: rgba(120, 113, 108, 0.2);
border-radius: 2px;
}
input[type=range]:focus {
outline: none;
}
/* Fade Animation Classes */
.fade-enter {
opacity: 0;
transform: translateY(10px);
}
.fade-enter-active {
opacity: 1;
transform: translateY(0);
transition: opacity 500ms ease, transform 500ms cubic-bezier(0.2, 0.8, 0.2, 1);
}
.fade-exit {
opacity: 1;
transform: scale(1);
}
.fade-exit-active {
opacity: 0;
transform: scale(0.95);
transition: opacity 300ms ease, transform 300ms ease;
}
/* Circular Progress Rotation */
.progress-ring__circle {
transition: stroke-dashoffset 0.35s;
transform: rotate(-90deg);
transform-origin: 50% 50%;
}
body {
font-family: 'Geist', sans-serif;
}
h1, h2, h3, .serif {
font-family: 'Lora', serif;
}
</style></head>
<body class="bg-stone-100 dark:bg-[#1c1c1e] text-stone-800 dark:text-stone-200 min-h-screen flex items-center justify-center transition-colors duration-500 overflow-hidden relative selection:bg-stone-300 dark:selection:bg-stone-700">

    <!-- Background Decoration -->
    <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-stone-200/50 dark:bg-stone-800/20 rounded-full blur-[120px] opacity-70"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-stone-300/40 dark:bg-stone-800/20 rounded-full blur-[120px] opacity-70"></div>
    </div>

    <!-- Main Card -->
    <main id="app-container" class="relative z-10 w-full max-w-md p-6 sm:p-8 mx-4 fade-enter">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-12">
            <div class="flex items-center gap-2">
                <span class="text-sm font-medium tracking-tighter uppercase text-stone-500 dark:text-stone-400">Chronos</span>
            </div>
            <button onclick="toggleTheme()" class="text-stone-400 hover:text-stone-600 dark:hover:text-stone-200 transition-colors">
                <iconify-icon icon="solar:sun-2-linear" width="24" stroke-width="1.5" class="block dark:hidden"></iconify-icon>
                <iconify-icon icon="solar:moon-linear" width="24" stroke-width="1.5" class="hidden dark:block"></iconify-icon>
            </button>
        </header>

        <!-- Setup View -->
        <div id="setup-view" class="flex flex-col items-center justify-center w-full transition-opacity duration-300">
            <h1 class="text-5xl md:text-6xl font-medium tracking-tight text-center mb-2 text-stone-900 dark:text-stone-50">Focus</h1>
            <p class="text-xl md:text-2xl text-stone-500 dark:text-stone-400 font-normal mb-10 text-center serif italic">How long do you have?</p>

            <!-- Time Display Large -->
            <div class="relative mb-12 group cursor-pointer">
                <div class="text-7xl md:text-8xl font-medium serif text-stone-800 dark:text-stone-100 tracking-tight transition-all" id="time-preview">
                    25<span class="text-3xl align-top text-stone-400 font-sans font-light ml-1">m</span>
                </div>
            </div>

            <!-- Slider Control -->
            <div class="w-full px-4 mb-10">
                <input type="range" min="1" max="300" value="25" class="w-full h-2 bg-stone-200 rounded-lg appearance-none cursor-pointer dark:bg-stone-800 text-stone-800 dark:text-stone-200 accent-stone-800" id="time-slider">
                <div class="flex justify-between mt-3 text-xs text-stone-400 font-medium">
                    <span>1m</span>
                    <span>5h</span>
                </div>
            </div>

            <!-- Quick Presets -->
            <div class="flex gap-3 mb-12 justify-center flex-wrap">
                <button onclick="setPreset(15)" class="px-5 py-2 rounded-full border border-stone-200 dark:border-stone-800 hover:bg-white dark:hover:bg-stone-800 hover:shadow-md transition-all text-sm font-medium text-stone-600 dark:text-stone-300 bg-stone-50/50 dark:bg-stone-900/50 backdrop-blur-sm">15m</button>
                <button onclick="setPreset(25)" class="px-5 py-2 rounded-full border border-stone-200 dark:border-stone-800 hover:bg-white dark:hover:bg-stone-800 hover:shadow-md transition-all text-sm font-medium text-stone-600 dark:text-stone-300 bg-stone-50/50 dark:bg-stone-900/50 backdrop-blur-sm">25m</button>
                <button onclick="setPreset(60)" class="px-5 py-2 rounded-full border border-stone-200 dark:border-stone-800 hover:bg-white dark:hover:bg-stone-800 hover:shadow-md transition-all text-sm font-medium text-stone-600 dark:text-stone-300 bg-stone-50/50 dark:bg-stone-900/50 backdrop-blur-sm">1h</button>
            </div>

            <!-- Start Button -->
            <button onclick="startTimer()" class="group relative inline-flex items-center justify-center w-20 h-20 rounded-full bg-stone-900 dark:bg-stone-100 text-stone-100 dark:text-stone-900 shadow-lg hover:scale-105 active:scale-95 transition-all duration-300">
                <iconify-icon icon="solar:play-linear" width="32" stroke-width="1.5" class="ml-1"></iconify-icon>
            </button>
        </div>

        <!-- Timer Active View -->
        <div id="active-view" class="hidden flex-col items-center justify-center w-full relative">
            
            <!-- Progress Circle -->
            <div class="relative w-64 h-64 md:w-80 md:h-80 mb-10 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                    <!-- Track -->
                    <circle class="text-stone-200 dark:text-stone-800" stroke-width="3" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" />
                    <!-- Progress -->
                    <circle id="progress-ring" class="text-stone-800 dark:text-stone-200 progress-ring__circle" stroke-width="3" stroke-linecap="round" stroke="currentColor" fill="transparent" r="45" cx="50" cy="50" />
                </svg>
                
                <!-- Time Display -->
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <h2 id="timer-display" class="text-6xl md:text-7xl font-medium serif text-stone-900 dark:text-stone-100 tracking-tight tabular-nums">25:00</h2>
                    <span id="end-time-display" class="text-stone-400 dark:text-stone-500 text-sm mt-2 font-medium flex items-center gap-1">
                        <iconify-icon icon="solar:bell-linear" width="14"></iconify-icon>
                        <span id="end-time-text">--:--</span>
                    </span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-8">
                <button onclick="resetTimer()" class="p-4 rounded-full text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 transition-all active:scale-95">
                    <iconify-icon icon="solar:stop-linear" width="28" stroke-width="1.5"></iconify-icon>
                </button>

                <button id="play-pause-btn" onclick="togglePause()" class="w-20 h-20 rounded-full bg-stone-900 dark:bg-stone-100 text-stone-100 dark:text-stone-900 shadow-lg hover:scale-105 active:scale-95 transition-all duration-300 flex items-center justify-center">
                    <iconify-icon id="pause-icon" icon="solar:pause-linear" width="32" stroke-width="1.5"></iconify-icon>
                    <iconify-icon id="play-icon" icon="solar:play-linear" width="32" stroke-width="1.5" class="hidden ml-1"></iconify-icon>
                </button>

                <button onclick="addMinute()" class="p-4 rounded-full text-stone-400 hover:text-stone-600 dark:hover:text-stone-300 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 transition-all active:scale-95">
                    <iconify-icon icon="solar:add-circle-linear" width="28" stroke-width="1.5"></iconify-icon>
                </button>
            </div>
        </div>

    </main>

    <script>
        // DOM Elements
        const appContainer = document.getElementById('app-container');
        const setupView = document.getElementById('setup-view');
        const activeView = document.getElementById('active-view');
        const timeSlider = document.getElementById('time-slider');
        const timePreview = document.getElementById('time-preview');
        const timerDisplay = document.getElementById('timer-display');
        const endTimeText = document.getElementById('end-time-text');
        const progressRing = document.getElementById('progress-ring');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const pauseIcon = document.getElementById('pause-icon');
        const playIcon = document.getElementById('play-icon');

        // State
        let totalSeconds = 25 * 60;
        let remainingSeconds = totalSeconds;
        let interval = null;
        let isPaused = false;
        
        // Ring Setup
        const radius = progressRing.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
        progressRing.style.strokeDashoffset = 0;

        // Init Animation
        setTimeout(() => {
            appContainer.classList.add('fade-enter-active');
        }, 100);

        // Slider Logic
        timeSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            updatePreview(val);
        });

        function updatePreview(minutes) {
            let displayHTML = '';
            if (minutes < 60) {
                displayHTML = `${minutes}<span class="text-3xl align-top text-stone-400 font-sans font-light ml-1">m</span>`;
            } else {
                const h = Math.floor(minutes / 60);
                const m = minutes % 60;
                if (m === 0) {
                    displayHTML = `${h}<span class="text-3xl align-top text-stone-400 font-sans font-light ml-1">h</span>`;
                } else {
                    displayHTML = `${h}<span class="text-3xl align-top text-stone-400 font-sans font-light mx-1">h</span>${m}<span class="text-3xl align-top text-stone-400 font-sans font-light ml-1">m</span>`;
                }
            }
            timePreview.innerHTML = displayHTML;
        }

        function setPreset(minutes) {
            timeSlider.value = minutes;
            updatePreview(minutes);
        }

        function setProgress(percent) {
            const offset = circumference - (percent / 100) * circumference;
            progressRing.style.strokeDashoffset = offset;
        }

        function formatTime(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;

            if (h > 0) {
                return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateEndTime() {
            const now = new Date();
            const end = new Date(now.getTime() + remainingSeconds * 1000);
            endTimeText.textContent = end.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function startTimer() {
            const minutes = parseInt(timeSlider.value);
            totalSeconds = minutes * 60;
            remainingSeconds = totalSeconds;
            isPaused = false;

            // UI Transition
            setupView.classList.add('fade-exit-active');
            setTimeout(() => {
                setupView.classList.add('hidden');
                setupView.classList.remove('fade-exit-active');
                activeView.classList.remove('hidden');
                activeView.classList.add('fade-enter');
                setTimeout(() => activeView.classList.add('fade-enter-active'), 10);
            }, 300);

            updateTimerDisplay();
            updateEndTime();
            
            clearInterval(interval);
            interval = setInterval(tick, 1000);
        }

        function tick() {
            if (!isPaused) {
                remainingSeconds--;
                updateTimerDisplay();
                if (remainingSeconds <= 0) {
                    clearInterval(interval);
                    // Timer finished logic could go here (sound, etc)
                }
            }
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = formatTime(remainingSeconds);
            const percent = (remainingSeconds / totalSeconds) * 100;
            setProgress(100 - percent); // Invert for fill effect or normal for empty effect
            // Actually, usually countdowns remove the ring.
            // Let's make the ring shrink:
            progressRing.style.strokeDashoffset = circumference - (percent / 100) * circumference;
        }

        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                pauseIcon.classList.add('hidden');
                playIcon.classList.remove('hidden');
                timerDisplay.classList.add('opacity-50');
                endTimeText.textContent = "Paused";
            } else {
                pauseIcon.classList.remove('hidden');
                playIcon.classList.add('hidden');
                timerDisplay.classList.remove('opacity-50');
                updateEndTime();
            }
        }

        function resetTimer() {
            clearInterval(interval);
            
            // UI Transition Back
            activeView.classList.remove('fade-enter', 'fade-enter-active');
            activeView.classList.add('fade-exit-active');
            
            setTimeout(() => {
                activeView.classList.add('hidden');
                activeView.classList.remove('fade-exit-active');
                setupView.classList.remove('hidden');
                setupView.classList.add('fade-enter');
                setTimeout(() => setupView.classList.add('fade-enter-active'), 10);
            }, 300);

            // Reset State
            setProgress(0);
            pauseIcon.classList.remove('hidden');
            playIcon.classList.add('hidden');
            timerDisplay.classList.remove('opacity-50');
        }

        function addMinute() {
            remainingSeconds += 60;
            totalSeconds += 60;
            updateTimerDisplay();
            updateEndTime();
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        // Initialize display
        updatePreview(25);
    </script>
</body>
</html>
