  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap">
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
    }
    .hero-text {
      background: linear-gradient(to right, #fff, #ccc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 1px;
      bottom: -2px;
      left: 0;
      background: linear-gradient(90deg, #3B82F6 0%, #EC4899 100%);
      transition: width 0.3s ease;
    }
    .nav-link:hover::after {
      width: 100%;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen">
  <!-- Navigation -->
  <header class="fixed w-full z-50 bg-black/80 backdrop-blur-sm">
    <div class="container mx-auto px-6">
      <nav class="py-4 flex justify-between items-center">
        <a href="#" class="text-xl font-bold tracking-wider">DESIGN<span class="text-blue-500">.</span></a>
        
        <!-- Mobile menu button -->
        <button id="mobile-menu-button" class="md:hidden text-white">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        
        <!-- Desktop Navigation -->
        <div class="hidden md:flex space-x-8">
          <a href="#" class="nav-link relative text-sm tracking-wider hover:text-gray-300 transition">Work</a>
          <a href="#" class="nav-link relative text-sm tracking-wider hover:text-gray-300 transition">Services</a>

        </div>
      </nav>
    </div>
    
    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="hidden md:hidden bg-black/95 backdrop-blur-md">
      <div class="container mx-auto px-6 py-4 flex flex-col space-y-4">
        <a href="#" class="text-sm tracking-wider py-2 border-b border-gray-800">Work</a>
        <a href="#" class="text-sm tracking-wider py-2 border-b border-gray-800">Services</a>

        <a href="#" class="text-sm tracking-wider py-2">Contact</a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section id="hero" class="relative h-screen flex items-center">
    <div id="vanta-bg" class="absolute inset-0 z-0"></div>
    <div class="container mx-auto px-6 relative z-10">
      <div class="max-w-5xl mx-auto text-center">
        <h1 class="hero-text text-6xl sm:text-7xl md:text-8xl lg:text-9xl font-black tracking-tight mb-6 leading-[0.9] px-4">MINIMALIST</h1>
        <p class="text-gray-300 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed mt-8 px-4">

        </p>
        <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4 px-4">

            Get In Touch
          </a>
        </div>
      </div>
    </div>
    <div class="absolute bottom-10 left-1/2 transform -translate-x-1/2 animate-bounce">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
      </svg>
    </div>
  </section>

  <script>
    // Mobile menu toggle
    document.getElementById('mobile-menu-button').addEventListener('click', function() {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });

    // Initialize wave background
    document.addEventListener('DOMContentLoaded', function() {
      VANTA.WAVES({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0x050505,
        shininess: 30.00,
        waveHeight: 15.00,
        waveSpeed: 0.75,
        zoom: 0.65
      });
    });
  </script>
