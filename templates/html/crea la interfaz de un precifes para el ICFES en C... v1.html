<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precifes ICFES Gen Z</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    function selectArea(area) {
      document.querySelectorAll('.area-card').forEach(el => el.classList.remove('border-indigo-600', 'ring-2', 'bg-indigo-50'));
      document.getElementById('area-'+area).classList.add('border-indigo-600','ring-2','bg-indigo-50');
      document.getElementById('start-btn').disabled = false;
      document.getElementById('start-btn').classList.remove('opacity-50','cursor-not-allowed');
    }
  </script>
  <style>
    body { font-family: 'Montserrat', sans-serif;}
  </style>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-indigo-100 to-pink-100 min-h-screen">
  <div class="max-w-2xl mx-auto py-10 px-4">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div class="flex items-center gap-3">
        <span class="ph-bold ph-lightbulb text-3xl text-indigo-600"></span>
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">Precifes ICFES</h1>
      </div>
      <button class="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white rounded-full font-semibold shadow hover:bg-indigo-700 transition">
        <span class="ph-bold ph-user-circle"></span>
        Perfil
      </button>
    </div>
    <!-- Progress Bar -->
    <div class="mb-8">
      <div class="flex justify-between items-center mb-1">
        <span class="text-sm font-medium text-indigo-700">Progreso</span>
        <span class="text-xs font-bold text-indigo-700">40%</span>
      </div>
      <div class="w-full bg-indigo-200 rounded-full h-3">
        <div class="bg-indigo-500 h-3 rounded-full" style="width: 40%"></div>
      </div>
      <div class="text-xs text-gray-400 mt-1">¡Vas por buen camino! 💪</div>
    </div>
    <!-- Areas -->
    <div class="mb-8">
      <h2 class="text-xl font-semibold text-gray-800 mb-3">Elige el área para practicar</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
        <button id="area-matematicas" onclick="selectArea('matematicas')" class="area-card group rounded-lg border-2 border-transparent bg-white shadow hover:shadow-lg transition p-4 flex flex-col items-center gap-2 cursor-pointer">
          <span class="ph-bold ph-function text-3xl text-pink-500 group-hover:scale-110 transition"></span>
          <span class="font-bold text-gray-800">Matemáticas</span>
        </button>
        <button id="area-lectura" onclick="selectArea('lectura')" class="area-card group rounded-lg border-2 border-transparent bg-white shadow hover:shadow-lg transition p-4 flex flex-col items-center gap-2 cursor-pointer">
          <span class="ph-bold ph-book-open-text text-3xl text-indigo-500 group-hover:scale-110 transition"></span>
          <span class="font-bold text-gray-800">Lectura Crítica</span>
        </button>
        <button id="area-ciencias" onclick="selectArea('ciencias')" class="area-card group rounded-lg border-2 border-transparent bg-white shadow hover:shadow-lg transition p-4 flex flex-col items-center gap-2 cursor-pointer">
          <span class="ph-bold ph-flask text-3xl text-green-500 group-hover:scale-110 transition"></span>
          <span class="font-bold text-gray-800">Ciencias</span>
        </button>
        <button id="area-sociales" onclick="selectArea('sociales')" class="area-card group rounded-lg border-2 border-transparent bg-white shadow hover:shadow-lg transition p-4 flex flex-col items-center gap-2 cursor-pointer">
          <span class="ph-bold ph-globe-hemisphere-west text-3xl text-yellow-500 group-hover:scale-110 transition"></span>
          <span class="font-bold text-gray-800">Sociales</span>
        </button>
        <button id="area-ingles" onclick="selectArea('ingles')" class="area-card group rounded-lg border-2 border-transparent bg-white shadow hover:shadow-lg transition p-4 flex flex-col items-center gap-2 cursor-pointer">
          <span class="ph-bold ph-translate text-3xl text-blue-500 group-hover:scale-110 transition"></span>
          <span class="font-bold text-gray-800">Inglés</span>
        </button>
      </div>
    </div>
    <!-- Start Button -->
    <div class="flex flex-col items-center space-y-2">
      <button id="start-btn" class="w-full sm:w-auto px-8 py-3 bg-indigo-600 text-white font-bold rounded-full shadow-lg transition hover:bg-indigo-700 opacity-50 cursor-not-allowed" disabled>
        <span class="inline-flex items-center gap-2">
          <span class="ph-bold ph-play-circle"></span> ¡Comenzar simulacro!
        </span>
      </button>
      <span class="text-sm text-gray-500">¡Demuestra lo que sabes! 🚀</span>
    </div>
    <!-- Footer -->
    <div class="mt-12 text-xs text-gray-400 text-center">
      Precifes ICFES para Gen Z &copy; 2024 <span class="ph ph-heart text-pink-400"></span>
    </div>
  </div>
</body>
</html>
