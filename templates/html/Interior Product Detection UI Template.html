<body class="bg-neutral-50 text-neutral-900 min-h-[100dvh] flex items-start lg:items-center justify-center p-0 lg:p-12">

                    <span class="hidden sm:inline">Save</span>
                </button>
                <button class="px-2 lg:px-3 py-1.5 rounded-md border border-neutral-200 text-xs font-medium text-neutral-600 hover:border-neutral-300 hover:bg-neutral-50 hover:text-neutral-900 transition-all flex items-center gap-2">

                        <span class="px-2.5 py-1 rounded border border-neutral-200 bg-white text-[11px] text-neutral-600 hover:border-neutral-400 hover:text-neutral-900 cursor-pointer transition-colors">Scandinavian</span>
                        <span class="px-2.5 py-1 rounded border border-neutral-200 bg-white text-[11px] text-neutral-600 hover:border-neutral-400 hover:text-neutral-900 cursor-pointer transition-colors">Living Room</span>
