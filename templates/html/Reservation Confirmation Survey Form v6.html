<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約確定アンケート</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">
    <div class="max-w-lg mx-auto min-h-screen">
        <!-- ヘッダー -->
        <div class="bg-white border-b border-slate-100 px-6 py-8">
            <div class="text-center">
                <h1 class="text-2xl font-bold text-slate-800 mb-2">予約確定アンケート</h1>
                <p class="text-slate-500 text-sm">ご予約ありがとうございます</p>
            </div>
        </div>

        <div class="px-6 py-8 space-y-8">
            <form class="space-y-8">
                <!-- 生年月日 -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/50">
                    <div class="flex items-center mb-4">
                        <div class="w-2 h-6 bg-gradient-to-b from-blue-500 to-indigo-500 rounded-full mr-3"></div>
                        <label class="text-slate-800 font-semibold">生年月日</label>
                        <span class="text-rose-500 ml-1">*</span>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <select class="w-full px-4 py-3 bg-slate-50 border-0 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-200" required>
                            <option value="">年</option>
                            <option value="2000">2000</option>
                            <option value="1999">1999</option>
                            <option value="1998">1998</option>
                            <option value="1997">1997</option>
                            <option value="1996">1996</option>
                            <option value="1995">1995</option>
                            <option value="1994">1994</option>
                            <option value="1993">1993</option>
                            <option value="1992">1992</option>
                            <option value="1991">1991</option>
                            <option value="1990">1990</option>
                        </select>
                        <select class="w-full px-4 py-3 bg-slate-50 border-0 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-200" required>
                            <option value="">月</option>
                            <option value="01">1月</option>
                            <option value="02">2月</option>
                            <option value="03">3月</option>
                            <option value="04">4月</option>
                            <option value="05">5月</option>
                            <option value="06">6月</option>
                            <option value="07">7月</option>
                            <option value="08">8月</option>
                            <option value="09">9月</option>
                            <option value="10">10月</option>
                            <option value="11">11月</option>
                            <option value="12">12月</option>
                        </select>
                        <select class="w-full px-4 py-3 bg-slate-50 border-0 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-200" required>
                            <option value="">日</option>
                            <option value="01">1日</option>
                            <option value="02">2日</option>
                            <option value="03">3日</option>
                            <option value="04">4日</option>
                            <option value="05">5日</option>
                            <option value="06">6日</option>
                            <option value="07">7日</option>
                            <option value="08">8日</option>
                            <option value="09">9日</option>
                            <option value="10">10日</option>
                            <option value="15">15日</option>
                            <option value="20">20日</option>
                            <option value="25">25日</option>
                            <option value="30">30日</option>
                            <option value="31">31日</option>
                        </select>
                    </div>
                </div>

                <!-- ご職業 -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/50">
                    <div class="flex items-center mb-5">
                        <div class="w-2 h-6 bg-gradient-to-b from-blue-500 to-indigo-500 rounded-full mr-3"></div>
                        <label class="text-slate-800 font-semibold">ご職業</label>
                        <span class="text-rose-500 ml-1">*</span>
                    </div>
                    <div class="space-y-3">
                        <label class="flex items-center p-4 bg-slate-50 hover:bg-blue-50 rounded-xl cursor-pointer transition-all duration-200 group">
                            <input type="radio" name="occupation" value="会社員" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 focus:ring-offset-0" required>
                            <span class="ml-3 text-sm font-medium text-slate-700 group-hover:text-blue-700">会社員</span>
                        </label>
                        <label class="flex items-center p-4 bg-slate-50 hover:bg-blue-50 rounded-xl cursor-pointer transition-all duration-200 group">
                            <input type="radio" name="occupation" value="自営業" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 focus:ring-offset-0" required>
                            <span class="ml-3 text-sm font-medium text-slate-700 group-hover:text-blue-700">自営業</span>
                        </label>
                        <label class="flex items-center p-4 bg-slate-50 hover:bg-blue-50 rounded-xl cursor-pointer transition-all duration-200 group">
                            <input type="radio" name="occupation" value="会社役員・経営者" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 focus:ring-offset-0" required>
                            <span class="ml-3 text-sm font-medium text-slate-700 group-hover:text-blue-700">会社役員・経営者</span>
                        </label>
                        <label class="flex items-center p-4 bg-slate-50 hover:bg-blue-50 rounded-xl cursor-pointer transition-all duration-200 group">
                            <input type="radio" name="occupation" value="専門職" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 focus:ring-offset-0" required>
                            <span class="ml-3 text-sm font-medium text-slate-700 group-hover:text-blue-700">専門職（医師、弁護士など）</span>
                        </label>
                        <label class="flex items-center p-4 bg-slate-50 hover:bg-blue-50 rounded-xl cursor-pointer transition-all duration-200 group">
                            <input type="radio" name="occupation" value="公務員" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 focus:ring-offset-0" required>
                            <span class="ml-3 text-sm font-medium text-slate-700 group-hover:text-blue-700">公務員</span>
                        </label>
                        <label class="flex items-center p-4 bg-slate-50 hover:bg-blue-50 rounded-xl cursor-pointer transition-all duration-200 group">
                            <input type="radio" name="occupation" value="学生" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 focus:ring-offset-0" required>
                            <span class="ml-3 text-sm font-medium text-slate-700 group-hover:text-blue-700">学生</span>
                        </label>
                        <label class="flex items-center p-4 bg-slate-50 hover:bg-blue-50 rounded-xl cursor-pointer transition-all duration-200 group">
                            <input type="radio" name="occupation" value="主婦・主夫" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 focus:ring-offset-0" required>
                            <span class="ml-3 text-sm font-medium text-slate-700 group-hover:text-blue-700">主婦・主夫</span>
                        </label>
                        <label class="flex items-center p-4 bg-slate-50 hover:bg-blue-50 rounded-xl cursor-pointer transition-all duration-200 group">
                            <input type="radio" name="occupation" value="その他" class="w-4 h-4 text-blue-600 border-slate-300 focus:ring-blue-500 focus:ring-offset-0" required>
                            <span class="ml-3 text-sm font-medium text-slate-700 group-hover:text-blue-700">その他</span>
                        </label>
                    </div>
                </div>

                <!-- お勤め先の業種 -->
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200/50">
                    <div class="flex items-center mb-4">
                        <div class="w-2 h-6 bg-gradient-to-b from-slate-400 to-slate-500 rounded-full mr-3"></div>
                        <label class="text-slate-800 font-semibold">お勤め先の業種</label>
                        <span class="text-slate-400 text-sm ml-2">(任意)</span>
                    </div>
                    <select class="w-full px-4 py-4 bg-slate-50 border-0 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition-all duration-200">
                        <option value="">選択してください</option>
                        <option value="製造業">製造業</option>
                        <option value="建設業">建設業</option>
                        <option value="情報通信業">情報通信業</option>
                        <option value="運輸業">運輸業</option>
                        <option value="卸売・小売業">卸売・小売業</option>
                        <option value="金融・保険業">金融・保険業</option>
                        <option value="不動産業">不動産業</option>
                        <option value="飲食・宿泊業">飲食・宿泊業</option>
                        <option value="医療・福祉">医療・福祉</option>
                        <option value="教育">教育</option>
                        <option value="サービス業">サービス業</option>
                        <option value="その他">その他</option>
                    </select>
                </div>

                <!-- 送信ボタン -->
                <div class="pt-4">
                    <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-4 px-6 rounded-2xl transition-all duration-300 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                        送信する
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
