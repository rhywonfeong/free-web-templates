<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body {
font-family: 'Inter', sans-serif;
}
/* Glitch Animation Keyframes - Decreased frequency */
@keyframes glitch-anim-1 {
0%, 90% { clip-path: inset(0 0 0 0); transform: translate(0, 0); opacity: 0; }
91% { clip-path: inset(20% 0 60% 0); transform: translate(-1px, 1px); opacity: 0.8; }
92% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); opacity: 0.8; }
93% { clip-path: inset(40% 0 40% 0); transform: translate(-2px, 0px); opacity: 0.8; }
94% { clip-path: inset(80% 0 5% 0); transform: translate(1px, -1px); opacity: 0.8; }
95% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); opacity: 0.8; }
96% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); opacity: 0.8; }
97%, 100% { clip-path: inset(0 0 0 0); transform: translate(0, 0); opacity: 0; }
}
@keyframes glitch-anim-2 {
0%, 85% { clip-path: inset(0 0 0 0); transform: translate(0, 0); opacity: 0; }
86% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -1px); opacity: 0.8; }
87% { clip-path: inset(30% 0 20% 0); transform: translate(-1px, 1px); opacity: 0.8; }
88% { clip-path: inset(70% 0 10% 0); transform: translate(2px, 0px); opacity: 0.8; }
89% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, 1px); opacity: 0.8; }
90% { clip-path: inset(50% 0 30% 0); transform: translate(1px, -1px); opacity: 0.8; }
91%, 100% { clip-path: inset(0 0 0 0); transform: translate(0, 0); opacity: 0; }
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-[#040804] text-lg min-h-screen flex items-center justify-center p-4 sm:p-8 relative overflow-hidden">
  
  <!-- Ambient Vignette -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_0%,rgba(0,0,0,0.85)_100%)] pointer-events-none z-0"></div>
  
  <!-- Global Scanlines Background -->
  <div class="absolute inset-0 pointer-events-none bg-[repeating-linear-gradient(0deg,transparent,transparent_2px,rgba(0,0,0,0.3)_2px,rgba(0,0,0,0.3)_4px)] z-0"></div>

  <!-- Interactive Button Container -->
  <button class="relative flex items-center justify-center w-full max-w-[640px] px-8 py-5 sm:py-6 bg-[#0a180a] group cursor-pointer border border-green-900/30 hover:bg-[#0d210d] transition-colors duration-300 z-10 active:scale-[0.99]">
    
    <!-- Fine Inner Scanlines Overlay -->
    <div class="absolute inset-0 pointer-events-none bg-[repeating-linear-gradient(0deg,transparent,transparent_1px,rgba(0,0,0,0.5)_1px,rgba(0,0,0,0.5)_2px)] mix-blend-overlay"></div>

    <!-- Corner Brackets -->
    <!-- Top Left -->
    <div class="absolute top-0 left-0 w-5 h-5 sm:w-6 sm:h-6 border-t-[3px] border-l-[3px] border-[#50ff50] [filter:drop-shadow(0_0_6px_rgba(80,255,80,0.6))]"></div>
    <!-- Top Right -->
    <div class="absolute top-0 right-0 w-5 h-5 sm:w-6 sm:h-6 border-t-[3px] border-r-[3px] border-[#50ff50] [filter:drop-shadow(0_0_6px_rgba(80,255,80,0.6))]"></div>
    <!-- Bottom Left -->
    <div class="absolute bottom-0 left-0 w-5 h-5 sm:w-6 sm:h-6 border-b-[3px] border-l-[3px] border-[#50ff50] [filter:drop-shadow(0_0_6px_rgba(80,255,80,0.6))]"></div>
    <!-- Bottom Right -->
    <div class="absolute bottom-0 right-0 w-5 h-5 sm:w-6 sm:h-6 border-b-[3px] border-r-[3px] border-[#50ff50] [filter:drop-shadow(0_0_6px_rgba(80,255,80,0.6))]"></div>

    <!-- Glitching Text Component -->
    <span 
      class="relative z-10 text-xl sm:text-2xl font-medium tracking-tight text-[#50ff50] [text-shadow:0_0_12px_rgba(80,255,80,0.8)] 
      before:content-[attr(data-text)] before:absolute before:-left-[1px] before:top-0 before:w-full before:h-full before:text-[#50ff50] before:[text-shadow:0_0_12px_rgba(80,255,80,0.6)] before:animate-[glitch-anim-1_5s_infinite_linear_alternate-reverse] 
      after:content-[attr(data-text)] after:absolute after:left-[1px] after:top-0 after:w-full after:h-full after:text-[#50ff50] after:[text-shadow:0_0_12px_rgba(80,255,80,0.6)] after:animate-[glitch-anim-2_6s_infinite_linear_alternate-reverse]" 
      data-text="CONTINUE WITH ACCESS CODE"
    >
      CONTINUE WITH ACCESS CODE
    </span>

  </button>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
