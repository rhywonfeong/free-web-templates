  <meta charset="UTF-8">
  <title>Nebula Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0f172a; font-family: 'Space Grotesk', sans-serif;}
    .particle {
      position: absolute;
      background-color: rgba(255,255,255,0.6);
      border-radius: 9999px;
      pointer-events: none;
    }
    .glow-input:focus {
      box-shadow: 0 0 0 2px #a78bfa, 0 0 10px 2px #7c3aed;
      border-color: #a78bfa;
    }
    .glow-btn {
      box-shadow: 0 0 15px 1px rgba(139,92,246,0.22);

      box-shadow: 0 0 24px 2px #a78bfa;
    }
  </style>
</head>
<body class="relative overflow-x-hidden min-h-screen text-gray-300">
  <div id="particles-container" class="fixed inset-0 z-0 pointer-events-none"></div>

  <section class="relative z-10 flex flex-col items-center justify-center min-h-screen px-4">
    <div class="w-full max-w-lg bg-indigo-900/30 border border-indigo-800/50 rounded-2xl shadow-2xl p-10 backdrop-blur-sm flex flex-col items-center text-center">
      <div class="flex items-center mb-8">
        <div class="w-10 h-10 rounded-full bg-gradient-to-r from-purple-600 to-indigo-600 flex items-center justify-center">
          <span class="text-white font-bold text-xl">N</span>
        </div>
        <span class="ml-3 text-white text-2xl font-bold">Nebula</span>
      </div>
      <h2 class="text-3xl font-bold text-white mb-3">Create Your Account</h2>
      <p class="text-gray-400 mb-8">Start your journey with secure, next-gen digital banking. It takes less than a minute!</p>
      <form class="w-full flex flex-col space-y-5">
        <input autocomplete="name" type="text" placeholder="Your Name" class="glow-input px-4 py-3 rounded-lg border border-gray-700 bg-indigo-950/40 text-gray-100 focus:outline-none focus:border-purple-500 transition" required>
        <input autocomplete="email" type="email" placeholder="Email Address" class="glow-input px-4 py-3 rounded-lg border border-gray-700 bg-indigo-950/40 text-gray-100 focus:outline-none focus:border-purple-500 transition" required>
        <input autocomplete="new-password" type="password" placeholder="Password" class="glow-input px-4 py-3 rounded-lg border border-gray-700 bg-indigo-950/40 text-gray-100 focus:outline-none focus:border-purple-500 transition" required>
        <button type="submit" class="glow-btn mt-2 py-3 w-full rounded-lg bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold text-lg tracking-wide hover:from-purple-700 hover:to-indigo-700 transition">
          Create Account
        </button>
      </form>
      <div class="mt-7 text-gray-400 text-sm">
        Already have an account?
        <a href="#" class="text-purple-400 hover:underline ml-1">Sign in</a>
      </div>
    </div>
  </section>
  
  <script>
    // Particle background script
    const container = document.getElementById('particles-container');
    let particles = [];
    function createParticles() {
      particles.forEach(p=>p.el?.remove());
      particles = [];
      for(let i=0;i<40;i++){
        const el=document.createElement('div');
        el.className='particle';
        const sz=Math.random()*2+1.2;
        el.style.width=sz+'px';el.style.height=sz+'px';
        const x=Math.random()*window.innerWidth;
        const y=Math.random()*window.innerHeight;
        el.style.left=x+'px';el.style.top=y+'px';
        const o=Math.random()*0.4+0.15;
        const h=Math.random()*60+220;
        el.style.backgroundColor=`hsla(${h},80%,70%,${o})`;
        container.appendChild(el);
        particles.push({el,x,y,ox:x,oy:y,vx:0,vy:0,speed:Math.random()*0.35+0.15});
      }
    }
    let mx=window.innerWidth/2,my=window.innerHeight/2;
    document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
    function animate(){particles.forEach(p=>{
      const dx=mx-p.x,dy=my-p.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<80){const f=(80-d)/80;
        p.vx-=(dx/d)*f*0.13;
        p.vy-=(dy/d)*f*0.13;
      }
      p.vx+=(p.ox-p.x)*0.01;p.vy+=(p.oy-p.y)*0.01;
      p.vx*=0.95;p.vy*=0.95;
      p.x+=p.vx*p.speed;p.y+=p.vy*p.speed;
      p.el.style.transform=`translate(${p.x-p.ox}px,${p.y-p.oy}px)`;
    });requestAnimationFrame(animate);}
    createParticles(); animate();
    window.addEventListener('resize',createParticles);
  </script>
</body>
</html>
