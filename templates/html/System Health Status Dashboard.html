    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Health Monitor</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --bg-page: #f8f9fa;
            --bg-component: #ffffff;
            --text-primary: #212529;
            --text-secondary: #495057;
            --text-heading: #004085;
            --border-color: #dee2e6;
            --color-success: #28a745;
            --color-warning: #ffc107;
            --color-danger: #dc3545;
            --border-radius: 0.25rem;
            --shadow-md: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 1rem 3rem rgba(0, 0, 0, 0.2);
            --shadow-sm: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.1);
            --transition-normal: 0.2s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: grid;
            place-items: center;
            align-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .dashboard-system-health {
            background-color: var(--bg-component);
            max-width: 700px;
            width: 100%;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
        }

        .dashboard-system-health:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        h3 {
            font-size: 1.4rem;
            color: var(--text-heading);
            margin-bottom: 20px;
            text-align: center;
        }

        .system-health-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .status-card {
            background-color: var(--bg-component);
            padding: 15px 20px;
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: all 0.15s;
        }

        .status-card:hover {
            transform: translateY(-2px) scale(1.01);
            border-color: #007bff;
            box-shadow: var(--shadow-md);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status-name {
            font-weight: 600;
            color: var(--text-heading);
            font-size: 1rem;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid rgba(222, 226, 230, 0.8);
            flex-shrink: 0;
        }

        .status-indicator.operational {
            background-color: var(--color-success);
        }

        .status-indicator.degraded {
            background-color: var(--color-warning);
        }

        .status-indicator.outage {
            background-color: var(--color-danger);
        }

        .status-metric {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            line-height: 1.4;
        }

        .status-metric:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 768px) {
            .system-health-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .dashboard-system-health {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-system-health animate__animated animate__fadeInUp">
        <h3>System Health Monitor</h3>
        <div class="system-health-grid">
            <div class="status-card animate__animated animate__bounceInUp" style="animation-delay: 0.1s;">
                <div class="status-header">
                    <span class="status-name">API Gateway</span>
                    <span class="status-indicator operational"></span>
                </div>
                <div class="status-metric">Uptime: 99.99%</div>
                <div class="status-metric">Latency: 45ms</div>
            </div>
            <div class="status-card animate__animated animate__bounceInUp" style="animation-delay: 0.2s;">
                <div class="status-header">
                    <span class="status-name">User Database</span>
                    <span class="status-indicator operational"></span>
                </div>
                <div class="status-metric">Connections: 150/200</div>
                <div class="status-metric">Queries: 1.2k/s</div>
            </div>
            <div class="status-card animate__animated animate__bounceInUp" style="animation-delay: 0.3s;">
                <div class="status-header">
                    <span class="status-name">Processing Queue</span>
                    <span class="status-indicator degraded"></span>
                </div>
                <div class="status-metric">Messages: 1052</div>
                <div class="status-metric">Consumers: 3/5</div>
            </div>
            <div class="status-card animate__animated animate__bounceInUp" style="animation-delay: 0.4s;">
                <div class="status-header">
                    <span class="status-name">Frontend Servers</span>
                    <span class="status-indicator outage"></span>
                </div>
                <div class="status-metric">CPU: 95% (Avg)</div>
                <div class="status-metric">Active: 1/3</div>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new WOW().init();
        });
    </script>
</body>
</html>
