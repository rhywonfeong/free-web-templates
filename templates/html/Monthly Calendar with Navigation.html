    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Calendar</title>
    <style>
        :root {
            --primary-color: #3395ff;
            --text-color: #ffffff;
            --background-color: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.1);
            --highlight-color: #3395ff;
            --day-hover-color: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #1f1f1f;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calendar-container {
            width: 480px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px;
            box-shadow: 
                0 5px 5px rgba(0, 0, 0, 0.03),
                0 0 2px rgba(0, 0, 0, 0.1),
                0 1px 1px rgba(0, 0, 0, 0.03);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .month-year {
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .month-year:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            width: 32px;
            height: 32px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            font-size: 12px;
            transition: background-color 0.3s;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
            padding: 10px 0;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .day:hover:not(.empty):not(.selected) {
            background-color: var(--day-hover-color);
        }

        .day.today {
            font-weight: 500;
            color: var(--primary-color);
        }

        .day.selected {
            background-color: var(--highlight-color);
            color: white;
        }

        .day.other-month {
            color: rgba(255, 255, 255, 0.3);
        }

        .empty {
            cursor: default;
        }

        /* Date picker dropdown */
        .date-picker-dropdown {
            position: absolute;
            background-color: #2a2a2a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 10;
            display: none;
        }

        .date-picker-dropdown.show {
            display: block;
        }

        .month-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }

        .month-item {
            padding: 8px;
            text-align: center;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .month-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .month-item.active {
            background-color: var(--primary-color);
            color: white;
        }

        .year-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .year-selector .current-year {
            font-weight: 500;
        }

        .year-selector .year-nav {
            cursor: pointer;
            padding: 5px;
            border-radius: 5px;
        }

        .year-selector .year-nav:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .year-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .year-item {
            padding: 8px;
            text-align: center;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .year-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .year-item.active {
            background-color: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <div class="nav-btn" id="prev-month">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="month-year" id="month-year">November 2023</div>
            <div class="nav-btn" id="next-month">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>
        
        <div class="weekdays">
            <div>SUN</div>
            <div>MON</div>
            <div>TUE</div>
            <div>WED</div>
            <div>THU</div>
            <div>FRI</div>
            <div>SAT</div>
        </div>
        
        <div class="days" id="days-container"></div>
    </div>

    <!-- Date picker dropdown -->
    <div class="date-picker-dropdown" id="date-picker">
        <div class="month-grid" id="month-grid">
            <!-- Months will be inserted here by JavaScript -->
        </div>
        <div class="year-selector">
            <div class="year-nav" id="prev-year">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="current-year" id="current-year">2023</div>
            <div class="year-nav" id="next-year">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const daysContainer = document.getElementById('days-container');
            const monthYearDisplay = document.getElementById('month-year');
            const prevMonthBtn = document.getElementById('prev-month');
            const nextMonthBtn = document.getElementById('next-month');
            const datePicker = document.getElementById('date-picker');
            const monthGrid = document.getElementById('month-grid');
            const currentYearDisplay = document.getElementById('current-year');
            const prevYearBtn = document.getElementById('prev-year');
            const nextYearBtn = document.getElementById('next-year');
            
            let currentDate = new Date();
            let selectedDate = null;
            let viewYear = currentDate.getFullYear();
            
            // Month names
            const monthNames = [
                'January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'
            ];
            
            // Initialize month grid
            function initMonthGrid() {
                monthGrid.innerHTML = '';
                for (let i = 0; i < 12; i++) {
                    const monthItem = document.createElement('div');
                    monthItem.classList.add('month-item');
                    if (i === currentDate.getMonth() && viewYear === currentDate.getFullYear()) {
                        monthItem.classList.add('active');
                    }
                    monthItem.textContent = monthNames[i].substring(0, 3);
                    monthItem.addEventListener('click', () => {
                        currentDate.setMonth(i);
                        currentDate.setFullYear(viewYear);
                        datePicker.classList.remove('show');
                        renderCalendar();
                    });
                    monthGrid.appendChild(monthItem);
                }
            }
            
            // Event listeners
            prevMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });
            
            nextMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });
            
            monthYearDisplay.addEventListener('click', (e) => {
                const rect = monthYearDisplay.getBoundingClientRect();
                datePicker.style.top = `${rect.bottom + 10}px`;
                datePicker.style.left = `${rect.left}px`;
                
                viewYear = currentDate.getFullYear();
                currentYearDisplay.textContent = viewYear;
                initMonthGrid();
                
                datePicker.classList.add('show');
                e.stopPropagation();
            });
            
            prevYearBtn.addEventListener('click', () => {
                viewYear--;
                currentYearDisplay.textContent = viewYear;
                initMonthGrid();
            });
            
            nextYearBtn.addEventListener('click', () => {
                viewYear++;
                currentYearDisplay.textContent = viewYear;
                initMonthGrid();
            });
            
            // Close date picker when clicking outside
            document.addEventListener('click', (e) => {
                if (!datePicker.contains(e.target) && e.target !== monthYearDisplay) {
                    datePicker.classList.remove('show');
                }
            });
            
            function renderCalendar() {
                daysContainer.innerHTML = '';
                
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                
                // Update month and year display
                monthYearDisplay.textContent = `${monthNames[month]} ${year}`;
                
                // Get first day of month and last day of month
                const firstDayOfMonth = new Date(year, month, 1);
                const lastDayOfMonth = new Date(year, month + 1, 0);
                
                // Get day of week of first day (0-6, 0 is Sunday)
                const firstDayWeekday = firstDayOfMonth.getDay();
                
                // Get total days in month
                const totalDays = lastDayOfMonth.getDate();
                
                // Get days from previous month to fill first row
                const prevMonthLastDay = new Date(year, month, 0).getDate();
                
                // Get today's date for highlighting
                const today = new Date();
                const isCurrentMonth = today.getMonth() === month && today.getFullYear() === year;
                
                // Add days from previous month
                for (let i = firstDayWeekday - 1; i >= 0; i--) {
                    const dayElement = document.createElement('div');
                    dayElement.classList.add('day', 'other-month');
                    dayElement.textContent = prevMonthLastDay - i;
                    
                    // Add click event for days from previous month
                    dayElement.addEventListener('click', () => {
                        const prevMonth = new Date(year, month - 1, prevMonthLastDay - i);
                        selectDate(prevMonth);
                    });
                    
                    daysContainer.appendChild(dayElement);
                }
                
                // Add days of current month
                for (let day = 1; day <= totalDays; day++) {
                    const dayElement = document.createElement('div');
                    dayElement.classList.add('day');
                    dayElement.textContent = day;
                    
                    // Check if this day is today
                    if (isCurrentMonth && day === today.getDate()) {
                        dayElement.classList.add('today');
                    }
                    
                    // Check if this day is selected
                    if (selectedDate && 
                        selectedDate.getDate() === day && 
                        selectedDate.getMonth() === month && 
                        selectedDate.getFullYear() === year) {
                        dayElement.classList.add('selected');
                    }
                    
                    // Add click event
                    dayElement.addEventListener('click', () => {
                        const clickedDate = new Date(year, month, day);
                        selectDate(clickedDate);
                    });
                    
                    daysContainer.appendChild(dayElement);
                }
                
                // Calculate how many days to add from next month
                const totalCells = 42; // 6 rows x 7 days
                const remainingCells = totalCells - (firstDayWeekday + totalDays);
                
                // Add days from next month
                for (let day = 1; day <= remainingCells; day++) {
                    const dayElement = document.createElement('div');
                    dayElement.classList.add('day', 'other-month');
                    dayElement.textContent = day;
                    
                    // Add click event for days from next month
                    dayElement.addEventListener('click', () => {
                        const nextMonth = new Date(year, month + 1, day);
                        selectDate(nextMonth);
                    });
                    
                    daysContainer.appendChild(dayElement);
                }
            }
            
            function selectDate(date) {
                selectedDate = date;
                
                // Update the current month view if selected date is in a different month
                if (date.getMonth() !== currentDate.getMonth() || 
                    date.getFullYear() !== currentDate.getFullYear()) {
                    currentDate = new Date(date);
                    renderCalendar();
                } else {
                    // Just update the selected day highlight
                    const days = daysContainer.querySelectorAll('.day');
                    days.forEach(day => day.classList.remove('selected'));
                    
                    // Find the day element that matches the selected date
                    const dayElements = Array.from(days).filter(day => !day.classList.contains('other-month'));
                    if (dayElements[date.getDate() - 1]) {
                        dayElements[date.getDate() - 1].classList.add('selected');
                    }
                }
            }
            
            // Initial render
            renderCalendar();
        });
    </script>
</body>
</html>
