/* Center to Corner Blue Animation */
.blue-nebula-container {
position: absolute;
inset: 0;
overflow: hidden;
z-index: 0;
pointer-events: none;
}
.nebula-wave {
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
border-radius: 50%;
background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, rgba(6, 182, 212, 0.1) 40%, transparent 70%);
filter: blur(80px);
animation: expand-wave 10s infinite ease-out;
width: 0;
height: 0;
opacity: 0;
}
.nebula-wave:nth-child(2) {
animation-delay: 3s;
}
.nebula-wave:nth-child(3) {
animation-delay: 6s;
}
@keyframes expand-wave {
0% {
width: 0%;
height: 0%;
opacity: 0.8;
}
100% {
width: 250%; /* Go beyond corners */
height: 250%;
opacity: 0;
}
}
/* Subtle grid */
.grid-bg {
background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
background-size: 80px 80px;
mask-image: radial-gradient(circle at center, black 60%, transparent 100%);
}
/* Smooth text gradient */
