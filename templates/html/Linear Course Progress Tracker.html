  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear Course Progress</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .linear-gradient {
      background: linear-gradient(90deg, #6366F1 0%, #06B6D4 100%);
    }
    .linear-gradient:hover {
      background: linear-gradient(90deg, #8B5CF6 0%, #0EA5E9 100%);
    }
    .step-completed {
      background: #6366F1;
    }
    .step-current {
      background: #06B6D4;
      box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.25);
    }
    .step-upcoming {
      background: #334155;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-950 p-6">
  <div class="w-full max-w-md bg-gray-900/90 rounded-2xl border border-gray-800/50 shadow-xl px-8 py-7">
    <!-- Header -->
    <div class="mb-8 flex items-center justify-between">
      <h1 class="text-2xl font-extrabold tracking-tight text-gray-100">
        Course Progress
      </h1>
      <span class="text-xs font-semibold text-cyan-400/70 bg-gray-800/80 px-3 py-1 rounded-lg">CSS Animation</span>
    </div>

    <!-- Linear Progress Bar with Steps -->
    <div class="w-full flex flex-col gap-6 mb-8">
      <div class="flex items-center justify-between">
        <!-- Steps -->
        <div class="flex-1 flex items-center gap-0.5">
          <!-- Loop steps -->
          <div class="h-3 w-12 rounded-lg step-completed"></div>
          <div class="h-3 w-12 rounded-lg step-completed"></div>
          <div class="h-3 w-12 rounded-lg step-completed"></div>
          <div class="h-3 w-12 rounded-lg step-completed"></div>
          <div class="h-3 w-12 rounded-lg step-current"></div>
          <div class="h-3 w-12 rounded-lg step-upcoming"></div>
          <div class="h-3 w-12 rounded-lg step-upcoming"></div>
        </div>
        <!-- Progress percent -->
        <span class="ml-4 text-lg font-bold text-cyan-400">71%</span>
      </div>
      <!-- Step Labels -->
      <div class="flex items-center justify-between mt-1">
        <span class="text-xs text-gray-400 font-medium">Intro</span>
        <span class="text-xs text-gray-400 font-medium">Transforms</span>
        <span class="text-xs text-gray-400 font-medium">Transitions</span>
        <span class="text-xs text-gray-400 font-medium">Animations</span>
        <span class="text-xs text-gray-100 font-bold">SVG</span>
        <span class="text-xs text-gray-600 font-medium">Puppets</span>
        <span class="text-xs text-gray-600 font-medium">Final</span>
      </div>
    </div>

    <!-- Lesson Progress Details -->
    <div class="flex items-center gap-4 mb-7">
      <!-- Icon -->
      <div class="flex-shrink-0 h-10 w-10 flex items-center justify-center rounded-full linear-gradient">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="7" width="18" height="12" rx="2" fill="#fff" opacity="0.07"/>
          <rect x="7" y="3" width="10" height="18" rx="2" fill="#fff" opacity="0.15"/>
          <path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="text-xl font-semibold text-cyan-400">5/7 Lessons</span>
          <span class="text-[12px] px-2 py-0.5 bg-cyan-400/10 rounded-full text-cyan-300 font-medium">SVG</span>
        </div>
        <div class="text-sm text-gray-400 mt-0.5">You recently completed: "Advanced SVG Path Animation"</div>
      </div>
    </div>

    <!-- Statistic / Motivation -->
    <div class="flex items-center bg-gray-800/80 rounded-xl px-5 py-4 mb-6 border border-gray-700/60 gap-3">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="12" fill="#22D3EE" opacity="0.14"/>
        <path d="M8 13.5l3 3 5-7" stroke="#06B6D4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <span class="text-base font-bold text-cyan-300">Faster than 76% of learners</span>
        <p class="text-xs mt-0.5 text-gray-300">
          Keep this pace for 2 more lessons for a completion bonus!
        </p>
      </div>
    </div>

    <!-- Continue Button -->
    <button class="w-full py-3 mt-1 text-lg font-bold text-white rounded-xl shadow-md linear-gradient transition-all">
      Continue Course
    </button>
  </div>
</body>
</html>
