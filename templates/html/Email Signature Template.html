<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assinatura de Email</title>
<script src="https://cdn.tailwindcss.com"></script><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>

<body class="min-h-screen flex items-center justify-center antialiased font-sans bg-gray-50 pt-8 pr-8 pb-8 pl-8">

    <!-- Container apenas para visualização -->
    <div class="bg-white p-8 border border-gray-200 shadow-sm rounded-xl flex items-center justify-center w-full max-w-xl">
        
        <!-- INÍCIO DA ASSINATURA -->
        <table cellpadding="0" cellspacing="0" border="0" class="font-sans text-gray-600 w-full text-left">
          <tbody class="">
            <tr class="">
              <!-- Coluna Esquerda: Informações -->
              <td valign="top" class="pr-6">
                <table cellpadding="0" cellspacing="0" border="0" class="w-full">
                  <tbody class="">
                    <!-- Nome -->
                    <tr class="">
                      <td class="pb-0.5">
                        <span class="text-base font-semibold text-gray-900 tracking-tight">{{ FULL_NAME }}</span>
                      </td>
                    </tr>
                    
                    <!-- Área -->
                    <tr class="">
                      <td class="text-sm text-gray-500 pb-4">Design Lead | Tech Lead </td>
                    </tr>
                    
                    <!-- Telefone -->
                    <tr class="">
                      <td class="text-sm text-gray-700 pb-1">+55 11 99501-7301</td>
                    </tr>
                    
                    <!-- Site -->
                    <tr class="">
                      <td class="pb-1 text-sm">
                        <a href="#" class="hover:text-blue-800 underline decoration-blue-300 underline-offset-2 transition-colors text-blue-600">www.blueprintt.co</a>
                      </td>
                    </tr>
                    
                    <!-- LinkedIn -->
                    <tr class="">
                      <td class="pb-4 text-sm">
                        <a href="#" class="hover:text-blue-800 underline decoration-blue-300 underline-offset-2 transition-colors text-blue-600">LinkedIn</a>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </td>

              <!-- Coluna Direita: Logo e Texto -->
              <td valign="top" class="border-l border-gray-200 pl-6 w-48">
                <table cellpadding="0" cellspacing="0" border="0" class="w-full">
                  <tbody class="">
                    <tr class="">
                      <td class="pb-3">
                        <img src="https://paginas.blueprintt.co/wp-content/uploads/2026/03/logo-bp-cinza.png" alt="Blueprintt" width="120" style="display: block; max-width: 120px" class="h-auto object-contain">
                      </td>
                    </tr>
                    <tr class="">
                      <td class="color:#5C8CFF; text-sm text-gray-500 pb-4">Conectamos ideias que definem o futuro dos negócios.</td>
                    </tr>
                  </tbody>
                </table>
              </td>
            </tr>
            
            <!-- Link do Evento (Ocupando as duas colunas) -->
            <tr class="">
              <td colspan="2" class="pt-3 border-t border-gray-100 text-sm">
                <a href="#" class="hover:text-gray-600 underline decoration-gray-300 underline-offset-2 transition-colors flex items-center gap-1 font-medium text-gray-900">Próxima Conferência: HR Transformation Summit | 12 Maio</a>
              </td>
            </tr>
          </tbody>
        </table>
        <!-- FIM DA ASSINATURA -->

    </div>
