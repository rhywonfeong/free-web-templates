<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Private-Beta Waitlist</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.tailwindcss.com"></script></head>

<body class="min-h-screen bg-neutral-900 text-neutral-100 font-[Inter] antialiased flex flex-col items-center justify-center">
  <!-- Container -->
  <div id="app" class="w-full max-w-lg px-6 py-10 space-y-8">
    <!-- STEP PANEL -->
    <div id="stepPanel" class="space-y-8">
      <!-- STEP 0 : EMAIL -->
      <section id="stepEmail" class="space-y-6">
        <h1 class="text-3xl tracking-tight font-semibold">Join our private beta</h1>
        <p class="text-neutral-400">Get early access, shape the product, earn referral perks.</p>

        <div class="flex items-center gap-3 border border-neutral-700 rounded-lg px-4 py-3 focus-within:ring-2 focus-within:ring-[#D1FF05] transition">
          <i data-lucide="mail" class="w-5 h-5 text-neutral-500"></i>
          <input id="emailInput" type="email" placeholder="you@example.com"
                 class="flex-1 bg-transparent outline-none placeholder-neutral-600" />
        </div>

        <button id="joinBtn"
                class="w-full bg-[#D1FF05] text-neutral-900 hover:bg-[#c4e604] active:bg-[#b9da04] transition rounded-full py-3 font-medium">
          Join the waitlist
        </button>

        <button id="alreadyBtn" class="mx-auto block text-sm text-neutral-400 hover:text-neutral-200 underline">
          Already signed up? Check status
        </button>
      </section>

      <!-- STEP 1 : SURVEY -->
      <section id="stepSurvey" class="hidden space-y-8">
        <!-- Progress -->
        <div class="w-full bg-neutral-800 rounded-full h-2 overflow-hidden">
          <div id="progressBar" class="bg-[#D1FF05] h-2 transition-all duration-300" style="width:0%"></div>
        </div>

        <!-- Question wrapper -->
        <div id="questionWrapper" class="space-y-6"></div>

        <!-- Navigation -->
        <div class="flex justify-between items-center">
          <button id="prevQ"
                  class="flex items-center gap-1 text-neutral-400 hover:text-neutral-200 disabled:opacity-20">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Back
          </button>
          <button id="nextQ"
                  class="bg-[#D1FF05] text-neutral-900 hover:bg-[#c4e604] active:bg-[#b9da04] transition rounded-full px-5 py-2 font-medium">
            Next
          </button>
        </div>
      </section>
    </div>

    <!-- WAITING ROOM -->
    <section id="waitingRoom" class="hidden space-y-10">
      <div class="space-y-3">
        <h2 class="text-2xl tracking-tight font-semibold">You’re on the list 🎉</h2>
        <p id="signedEmail" class="text-neutral-400 text-sm"></p>
      </div>

      <!-- Referral Link -->
      <div class="space-y-3">
        <h3 class="font-semibold">Your referral link</h3>
        <div class="flex items-center gap-3 border border-neutral-700 rounded-lg px-4 py-3">
          <input id="refLink" class="flex-1 bg-transparent text-sm outline-none" readonly />
          <button id="copyLink"
                  class="text-xs font-medium bg-neutral-800 hover:bg-neutral-700 px-4 py-1.5 rounded-full transition">
            Copy
          </button>
        </div>
      </div>

      <!-- Leaderboard -->
      <div class="space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="font-semibold">Top referrers</h3>
          <canvas id="lbChart" class="max-w-[120px] sm:max-w-[300px]"></canvas>
        </div>
        <div id="lbList" class="space-y-1 text-sm"></div>
      </div>

      <!-- Story ideas -->
      <div class="space-y-3">
        <h3 class="font-semibold">Submit a story idea</h3>
        <textarea id="storyInput" rows="3"
                  class="w-full bg-neutral-800 border border-neutral-700 rounded-lg p-3 placeholder-neutral-500 text-sm outline-none focus:ring-2 focus:ring-[#D1FF05] resize-none"
                  placeholder="Tell us what you'd love to create…"></textarea>
        <button id="storyBtn"
                class="bg-[#D1FF05] text-neutral-900 hover:bg-[#c4e604] active:bg-[#b9da04] transition rounded-full px-5 py-2 font-medium">
          Send
        </button>
      </div>

      <!-- Socials -->
      <div class="flex gap-4 pt-4 border-t border-neutral-800">
        <a href="#" class="hover:text-neutral-300"><i data-lucide="twitter" class="w-5 h-5"></i></a>
        <a href="#" class="hover:text-neutral-300"><i data-lucide="instagram" class="w-5 h-5"></i></a>
        <a href="#" class="hover:text-neutral-300"><i data-lucide="linkedin" class="w-5 h-5"></i></a>
      </div>
    </section>
  </div>

  <!-- SCRIPTS -->
  <script>
    // Helpers
    const qs = (sel) => document.querySelector(sel);
    const qsa = (sel) => [...document.querySelectorAll(sel)];
    const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    /* — STATE — */
    const survey = [
      {
        id: 'contentType',
        q: 'What type of content do you regularly create or want to create?',
        type: 'text',
        placeholder: 'e.g. tutorials, product reviews…'
      },
      {
        id: 'videoMethod',
        q: 'How do you currently make videos?',
        type: 'multi',
        options: ['Phone recording', 'DSLR / mirrorless', 'Screen-record', 'Hiring freelancers', 'I don’t']
      },
      {
        id: 'portfolio',
        q: 'Do you have a website, content channel, or portfolio to share?',
        type: 'text',
        placeholder: 'URL (optional)'
      },
      {
        id: 'challenges',
        q: 'What are your biggest challenges in video creation?',
        type: 'text',
        placeholder: 'Time, budget, editing…'
      },
      {
        id: 'desiredVideo',
        q: 'What kind of video would you most like to create with AI?',
        type: 'text',
        placeholder: 'Short social clip, explainer…'
      },
      {
        id: 'communities',
        q: 'Are you in any creator communities?',
        type: 'text',
        placeholder: 'Discords, forums…'
      }
    ];
    let currentQ = 0;
    const answers = {};
    
    /* — STEP 0 — */
    qs('#joinBtn').onclick = () => {
      const email = qs('#emailInput').value.trim();
      if (!emailRe.test(email)) {
        qs('#emailInput').focus();
        return;
      }
      localStorage.setItem('betaEmail', email);
      showSurvey();
    };

    qs('#alreadyBtn').onclick = () => showWaitingRoom();

    function showSurvey() {
      qs('#stepEmail').classList.add('hidden');
      qs('#stepSurvey').classList.remove('hidden');
      buildQuestion();
    }

    /* — SURVEY FUNCTIONS — */
    function buildQuestion() {
      const wrap = qs('#questionWrapper');
      wrap.innerHTML = '';
      const item = survey[currentQ];
      // Question title
      const h = document.createElement('h2');
      h.className = 'text-xl tracking-tight font-semibold';
      h.textContent = item.q;
      wrap.appendChild(h);

      if (item.type === 'text') {
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = item.placeholder;
        input.value = answers[item.id] || '';
        input.className = 'w-full bg-neutral-800 border border-neutral-700 rounded-lg px-4 py-3 placeholder-neutral-500 outline-none focus:ring-2 focus:ring-[#D1FF05]';
        input.oninput = (e) => (answers[item.id] = e.target.value);
        wrap.appendChild(input);
      }

      if (item.type === 'multi') {
        const group = document.createElement('div');
        group.className = 'grid grid-cols-2 gap-3';
        item.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = opt;
          btn.dataset.val = opt;
          btn.className = 'border border-neutral-700 rounded-lg px-3 py-2 text-sm hover:border-[#D1FF05] transition';
          if ((answers[item.id] || []).includes(opt)) btn.classList.add('bg-[#D1FF05]/20', 'border-[#D1FF05]');
          btn.onclick = () => {
            answers[item.id] = answers[item.id] || [];
            const arr = answers[item.id];
            if (arr.includes(opt)) arr.splice(arr.indexOf(opt), 1);
            else arr.push(opt);
            btn.classList.toggle('bg-[#D1FF05]/20');
            btn.classList.toggle('border-[#D1FF05]');
          };
          group.appendChild(btn);
        });
        wrap.appendChild(group);
      }

      // Progress bar
      const progress = ((currentQ) / survey.length) * 100;
      qs('#progressBar').style.width = `${progress}%`;

      // Prev/Next states
      qs('#prevQ').disabled = currentQ === 0;
      qs('#nextQ').textContent = currentQ === survey.length - 1 ? 'Finish' : 'Next';
    }

    qs('#prevQ').onclick = () => {
      if (currentQ > 0) currentQ--;
      buildQuestion();
    };

    qs('#nextQ').onclick = () => {
      const item = survey[currentQ];
      // quick validation for text field (not mandatory)
      if (item.type === 'text' && !(answers[item.id] || '').trim()) {
        currentQ++;
      } else {
        if (currentQ < survey.length - 1) currentQ++;
        else return finalizeSignup();
      }
      buildQuestion();
    };

    function finalizeSignup() {
      localStorage.setItem('betaSurvey', JSON.stringify(answers));
      showWaitingRoom();
    }

    /* — WAITING ROOM — */
    function showWaitingRoom() {
      qs('#stepPanel').classList.add('hidden');
      qs('#waitingRoom').classList.remove('hidden');

      const email = localStorage.getItem('betaEmail') || 'your@email.com';
      qs('#signedEmail').textContent = email;
      const myCode = email.split('@')[0].replace(/[^a-z0-9]/gi, '').slice(0, 6);
      const refUrl = `${location.origin}${location.pathname}?ref=${myCode}`;
      qs('#refLink').value = refUrl;

      buildLeaderboard(myCode);
    }

    /* — COPY REF LINK — */
    qs('#copyLink').onclick = () => {
      navigator.clipboard.writeText(qs('#refLink').value);
      qs('#copyLink').textContent = 'Copied!';
      setTimeout(() => (qs('#copyLink').textContent = 'Copy'), 1500);
    };

    /* — LEADERBOARD (mock) — */
    function buildLeaderboard(myCode) {
      const mock = [
        { name: 'alex', count: 24 },
        { name: 'jordan', count: 18 },
        { name: myCode, count: 9 },
        { name: 'sam', count: 7 },
        { name: 'lee', count: 4 }
      ];
      // List
      const lbList = qs('#lbList');
      lbList.innerHTML = '';
      mock.forEach((p, i) => {
        const div = document.createElement('div');
        div.innerHTML = `<span class="text-neutral-400 mr-2">#${i + 1}</span>${p.name} <span class="text-neutral-500">– ${p.count}</span>`;
        lbList.appendChild(div);
      });
      // Chart
      const ctx = qs('#lbChart');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: mock.map(p => p.name),
          datasets: [{
            data: mock.map(p => p.count),
            backgroundColor: ['#D1FF05'],
            borderRadius: 4
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { x: { display: false }, y: { display: false } }
        }
      });
    }

    /* — STORY SUBMIT — */
    qs('#storyBtn').onclick = () => {
      const txt = qs('#storyInput').value.trim();
      if (!txt) return;
      qs('#storyInput').value = '';
      qs('#storyBtn').textContent = 'Thanks!';
      setTimeout(() => (qs('#storyBtn').textContent = 'Send'), 1500);
    };

    // Auto-redirect if already signed up
    if (localStorage.getItem('betaEmail')) showWaitingRoom();

    // Activate icons
    lucide.createIcons({ strokeWidth: 1.5 });
  </script>
</body>
</html>
