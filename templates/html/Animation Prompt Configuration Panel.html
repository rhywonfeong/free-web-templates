<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation Prompt Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
  <style>
    body { font-family: 'Geist', sans-serif; }
    .dropdown-item:hover { background-color: rgba(255,255,255,0.1); }
    @keyframes fadeAnim { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideAnim { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes zoomAnim { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes rotateAnim { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes bounceAnim { 0%, 20%, 50%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-15px); } 60% { transform: translateY(-7px); } }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen p-4 text-xs">
  <div class="max-w-md mx-auto bg-zinc-900 rounded-lg shadow-xl overflow-hidden border border-zinc-800">
    <div class="p-4 border-b border-zinc-800">
      <h1 class="text-lg font-medium">Animation Prompt Builder</h1>
    </div>
    
    <div class="p-4 space-y-3">
      <!-- Animation Type -->
      <div>
        <label class="block mb-1 text-xs text-zinc-400">Animation Type</label>
        <div class="relative">
          <button id="typeBtn" class="w-full bg-zinc-800 py-1.5 px-3 rounded text-left flex justify-between items-center text-xs">
            <span id="typeValue">Fade</span>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          <div id="typeDropdown" class="absolute z-10 w-full mt-1 bg-zinc-800 rounded shadow-lg hidden">
            <div class="p-1">
              <div class="px-3 py-1.5 rounded cursor-pointer dropdown-item" data-value="fade">Fade</div>
              <div class="px-3 py-1.5 rounded cursor-pointer dropdown-item" data-value="slide">Slide</div>
              <div class="px-3 py-1.5 rounded cursor-pointer dropdown-item" data-value="zoom">Zoom</div>
              <div class="px-3 py-1.5 rounded cursor-pointer dropdown-item" data-value="rotate">Rotate</div>
              <div class="px-3 py-1.5 rounded cursor-pointer dropdown-item" data-value="bounce">Bounce</div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Duration -->
      <div>
        <label class="block mb-1 text-xs text-zinc-400">Duration (ms)</label>
        <div class="flex items-center">
          <input id="duration" type="range" min="100" max="3000" step="100" value="1000" 
                 class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer">
          <span id="durationValue" class="ml-2 min-w-[50px] text-right text-xs">1000ms</span>
        </div>
      </div>
      
      <!-- Easing -->
      <div>
        <label class="block mb-1 text-xs text-zinc-400">Easing</label>
        <div class="relative">
          <button id="easingBtn" class="w-full bg-zinc-800 py-1.5 px-3 rounded text-left flex justify-between items-center text-xs">
            <span id="easingValue">Ease</span>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </button>
          <div id="easingDropdown" class="absolute z-10 w-full mt-1 bg-zinc-800 rounded shadow-lg hidden">
            <div class="p-1">
              <div class="px-3 py-1.5 rounded cursor-pointer dropdown-item" data-value="linear">Linear</div>
              <div class="px-3 py-1.5 rounded cursor-pointer dropdown-item" data-value="ease">Ease</div>
              <div class="px-3 py-1.5 rounded cursor-pointer dropdown-item" data-value="ease-in">Ease In</div>
              <div class="px-3 py-1.5 rounded cursor-pointer dropdown-item" data-value="ease-out">Ease Out</div>
              <div class="px-3 py-1.5 rounded cursor-pointer dropdown-item" data-value="ease-in-out">Ease In Out</div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Two columns for Delay and Iterations -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block mb-1 text-xs text-zinc-400">Delay (ms)</label>
          <input id="delay" type="number" min="0" max="2000" step="50" value="0" 
                 class="w-full bg-zinc-800 py-1.5 px-3 rounded text-xs">
        </div>
        
        <div>
          <label class="block mb-1 text-xs text-zinc-400">Iterations</label>
          <div class="flex space-x-2 items-center">
            <input id="iterations" type="number" min="1" max="10" value="1" 
                   class="w-full bg-zinc-800 py-1.5 px-3 rounded text-xs">
            <label class="flex items-center text-xs whitespace-nowrap">
              <input id="infinite" type="checkbox" class="mr-1 h-3 w-3">
              ∞
            </label>
          </div>
        </div>
      </div>
      
      <!-- Preview Box -->
      <div class="pt-2">
        <div class="h-28 bg-zinc-800 rounded flex items-center justify-center overflow-hidden">
          <div id="previewElement" class="w-16 h-16 bg-gradient-to-r from-indigo-500 to-purple-500 rounded flex items-center justify-center text-xs">
            Preview
          </div>
        </div>
        <button id="playBtn" class="mt-2 w-full bg-indigo-600 hover:bg-indigo-700 py-1.5 px-3 rounded transition text-xs">
          Play Animation
        </button>
      </div>
      
      <!-- Generated Prompt -->
      <div class="pt-2">
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs text-zinc-400">Generated Prompt</label>
          <button id="copyBtn" class="text-indigo-400 hover:text-indigo-300 text-xs flex items-center">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
            </svg>
            Copy
          </button>
        </div>
        <div class="bg-zinc-950 rounded p-2 h-28 overflow-auto">
          <pre id="output" class="text-emerald-400 text-xs whitespace-pre-wrap"></pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Custom dropdown functionality
    function setupDropdown(btnId, dropdownId, valueId) {
      const btn = document.getElementById(btnId);
      const dropdown = document.getElementById(dropdownId);
      const items = dropdown.querySelectorAll('.dropdown-item');
      const valueDisplay = document.getElementById(valueId);
      
      btn.addEventListener('click', () => {
        dropdown.classList.toggle('hidden');
      });
      
      items.forEach(item => {
        item.addEventListener('click', () => {
          valueDisplay.textContent = item.textContent;
          dropdown.classList.add('hidden');
          updatePrompt();
        });
      });
      
      document.addEventListener('click', (e) => {
        if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
          dropdown.classList.add('hidden');
        }
      });
    }
    
    setupDropdown('typeBtn', 'typeDropdown', 'typeValue');
    setupDropdown('easingBtn', 'easingDropdown', 'easingValue');
    
    // Duration slider
    const duration = document.getElementById('duration');
    const durationValue = document.getElementById('durationValue');
    
    duration.addEventListener('input', () => {
      durationValue.textContent = `${duration.value}ms`;
      updatePrompt();
    });
    
    // Handle infinite checkbox
    const infinite = document.getElementById('infinite');
    const iterations = document.getElementById('iterations');
    
    infinite.addEventListener('change', () => {
      iterations.disabled = infinite.checked;
      updatePrompt();
    });
    
    // Update prompt when inputs change
    document.getElementById('delay').addEventListener('input', updatePrompt);
    iterations.addEventListener('input', updatePrompt);
    
    // Generate prompt based on settings
    function updatePrompt() {
      const type = document.getElementById('typeValue').textContent;
      const durationMs = document.getElementById('duration').value;
      const easing = document.getElementById('easingValue').textContent;
      const delayMs = document.getElementById('delay').value;
      const iterationCount = infinite.checked ? 'infinite' : iterations.value;
      
      const prompt = `Create a ${type.toLowerCase()} animation with:
- Duration: ${durationMs}ms
- Easing: ${easing}
- Delay: ${delayMs}ms
- Iterations: ${iterationCount}

The animation should create a smooth ${type.toLowerCase()} effect that feels natural and enhances user experience.`;
      
      document.getElementById('output').textContent = prompt;
    }
    
    // Play animation preview
    document.getElementById('playBtn').addEventListener('click', () => {
      const element = document.getElementById('previewElement');
      const type = document.getElementById('typeValue').textContent.toLowerCase();
      const durationMs = document.getElementById('duration').value;
      const easing = document.getElementById('easingValue').textContent.toLowerCase().replace(' ', '-');
      const delayMs = document.getElementById('delay').value;
      const iterationCount = infinite.checked ? 'infinite' : iterations.value;
      
      // Reset animation
      element.style.animation = 'none';
      element.offsetHeight; // Trigger reflow
      
      // Apply animation
      let animationName;
      switch(type) {
        case 'fade': animationName = 'fadeAnim'; break;
        case 'slide': animationName = 'slideAnim'; break;
        case 'zoom': animationName = 'zoomAnim'; break;
        case 'rotate': animationName = 'rotateAnim'; break;
        case 'bounce': animationName = 'bounceAnim'; break;
        default: animationName = 'fadeAnim';
      }
      
      element.style.animation = `${animationName} ${durationMs}ms ${easing} ${delayMs}ms ${iterationCount}`;
    });
    
    // Copy button
    document.getElementById('copyBtn').addEventListener('click', () => {
      const text = document.getElementById('output').textContent;
      navigator.clipboard.writeText(text);
      
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerHTML = '<svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>Copied';
      setTimeout(() => {
        copyBtn.innerHTML = '<svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>Copy';
      }, 2000);
    });
    
    // Initialize prompt on load
    updatePrompt();
  </script>
</body>
</html>
