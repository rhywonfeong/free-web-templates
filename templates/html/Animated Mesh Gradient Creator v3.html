  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Mesh Gradient</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .mesh-gradient-container {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    
    .mesh-gradient {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    
    .mesh-point {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.8;
      mix-blend-mode: screen;
      transition: all 2s cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>
<body class="m-0 p-0 bg-black">
  <div class="mesh-gradient-container">
    <div class="mesh-gradient" id="gradient"></div>
  </div>

  <script>
    class MeshGradient {
      constructor(element, options = {}) {
        this.container = element;
        this.points = [];
        this.colors = options.colors || [
          '#ff3366', '#00ccff', '#ffcc33', '#9900ff', '#00ff99'
        ];
        this.pointCount = options.pointCount || 5;
        this.minSize = options.minSize || 300;
        this.maxSize = options.maxSize || 700;
        this.speed = options.speed || 0.005;
        this.animate = options.animate !== false;
        
        this.init();
        if (this.animate) {
          this.startAnimation();
        }
      }
      
      init() {
        // Clear any existing points
        this.container.innerHTML = '';
        this.points = [];
        
        // Create points
        for (let i = 0; i < this.pointCount; i++) {
          const point = document.createElement('div');
          point.classList.add('mesh-point');
          
          // Random position
          const x = Math.random() * 100;
          const y = Math.random() * 100;
          
          // Random size
          const size = this.minSize + Math.random() * (this.maxSize - this.minSize);
          
          // Random color
          const color = this.colors[Math.floor(Math.random() * this.colors.length)];
          
          // Set styles
          point.style.left = `${x}%`;
          point.style.top = `${y}%`;
          point.style.width = `${size}px`;
          point.style.height = `${size}px`;
          point.style.backgroundColor = color;
          
          // Add to DOM
          this.container.appendChild(point);
          
          // Store point data for animation
          this.points.push({
            element: point,
            x, y, size, color,
            vx: Math.random() * 0.2 - 0.1,
            vy: Math.random() * 0.2 - 0.1,
            targetX: x,
            targetY: y
          });
        }
      }
      
      startAnimation() {
        const updatePoints = () => {
          this.points.forEach(point => {
            // Smooth movement towards target
            point.x += (point.targetX - point.x) * this.speed;
            point.y += (point.targetY - point.y) * this.speed;
            
            // Update position
            point.element.style.left = `${point.x}%`;
            point.element.style.top = `${point.y}%`;
            
            // Occasionally set new targets
            if (Math.random() < 0.002) {
              point.targetX = Math.random() * 100;
              point.targetY = Math.random() * 100;
            }
          });
          
          requestAnimationFrame(updatePoints);
        };
        
        updatePoints();
      }
    }
    
    // Initialize the mesh gradient
    const gradient = new MeshGradient(document.getElementById('gradient'), {
      colors: ['#ff3366', '#0099ff', '#ffcc33', '#9900ff', '#00ff99'],
      pointCount: 6,
      minSize: 350,
      maxSize: 800,
      speed: 0.003
    });
    
    // Reinitialize on window resize
    window.addEventListener('resize', () => {
      gradient.init();
    });
  </script>
</body>
</html>
