<meta charset="UTF-8">

<title>Staggered Menu Implementation</title>
<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body {
font-family: 'Inter', sans-serif;
background-color: #0f0f11;
color: white;
overflow-x: hidden;
}
/* Menu Overlay Transition - The background slide */
#menu-overlay {
transition: transform 0.7s cubic-bezier(0.83, 0, 0.17, 1);
}
/* Staggered Item Base State */
.stagger-item {
opacity: 0;
transform: translateY(40px) skewY(2deg);
/* Ensure transitions are applied to these properties */
transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
/* Staggered Item Active State (When menu-open class is present) */
.menu-open .stagger-item {
opacity: 1;
transform: translateY(0) skewY(0);
}
/* Hover link underline animation */
.menu-link span {
position: relative;
}
.menu-link span::after {
content: '';
position: absolute;
left: 0;
bottom: -4px;
width: 0;
height: 2px;
background: currentColor;
transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.menu-link:hover span::after {
width: 100%;
}
</style></head>
<body class="relative min-h-screen w-full selection:bg-indigo-500 selection:text-white">

    <!-- Header -->
    <header class="fixed top-0 left-0 w-full p-8 flex justify-between items-center z-[60] mix-blend-difference pointer-events-none">
        <div class="pointer-events-auto">
            <a href="#" class="text-xl font-medium tracking-tighter text-white uppercase select-none flex items-center gap-2">

        </div>
        
        <!-- Menu Trigger -->
        <div class="pointer-events-auto">
            <button id="menu-toggle" class="group relative w-12 h-12 flex items-center justify-center rounded-full transition-all duration-300 z-[70]" aria-label="Toggle Menu">
                <div class="relative w-6 h-3.5 flex flex-col justify-between items-center overflow-visible">
                    <span class="w-full h-[1.5px] bg-white transition-all duration-300 origin-center menu-line-1"></span>
                    <span class="w-full h-[1.5px] bg-white transition-all duration-300 origin-center menu-line-2"></span>
                </div>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex flex-col items-center justify-center min-h-screen w-full px-6 relative z-10">
        <div class="text-center space-y-8 max-w-2xl animate-fade-in-up">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-white/10 bg-white/5 backdrop-blur-sm text-xs font-medium text-white/70 mb-4">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                Updated v2.0
            </div>
            <h1 class="text-5xl md:text-7xl font-medium tracking-tight text-white leading-[1.1]">
                Staggered<br/><span class="text-white/40">Navigation</span>
            </h1>
            <p class="text-lg text-white/50 font-light max-w-lg mx-auto leading-relaxed tracking-wide">
                Experience smooth, sequenced animations. The menu items cascade in after the background transition completes.
            </p>
            <div class="pt-8">
                <button onclick="document.getElementById('menu-toggle').click()" class="group relative px-6 py-3 rounded-full bg-white text-black text-sm font-medium tracking-wide hover:bg-white/90 transition-all duration-300 overflow-hidden">
                    <span class="relative z-10">Explore Menu</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Full Screen Menu Overlay -->
    <!-- Using a distinct gradient and fixed positioning -->
    <div id="menu-overlay" 
         class="fixed inset-0 w-full h-full z-50 translate-x-full flex flex-col pointer-events-auto"
         style="background: linear-gradient(135deg, #7C3AED 0%, #4F46E5 100%);">
        
        <!-- Decorative huge background text -->
        <div class="absolute right-0 bottom-0 pointer-events-none opacity-10 translate-y-1/3 translate-x-1/4 select-none">
            <span class="text-[40vh] font-bold tracking-tighter leading-none text-black mix-blend-overlay">MENU</span>
        </div>

        <div class="flex-1 flex flex-col justify-center px-8 md:px-24 max-w-7xl w-full mx-auto relative z-10">
            
            <!-- Navigation Links -->
            <nav class="flex flex-col space-y-2 md:space-y-1">
                
                <!-- Item 1 -->
                <div class="stagger-item group block" style="transition-delay: 200ms;">
                    <a href="#" class="menu-link flex items-baseline gap-6 py-2">

                <div class="stagger-item group block" style="transition-delay: 250ms;">
                    <a href="#" class="menu-link flex items-baseline gap-6 py-2">

                    </a>
                </div>

                <!-- Item 3 -->
                <div class="stagger-item group block" style="transition-delay: 300ms;">
                    <a href="#" class="menu-link flex items-baseline gap-6 py-2">

                    </a>
                </div>

                <div class="stagger-item group block" style="transition-delay: 350ms;">
                    <a href="#" class="menu-link flex items-baseline gap-6 py-2">

                    </a>
                </div>

            </nav>
        </div>

        <!-- Footer Info -->
        <div class="px-8 md:px-24 pb-12 w-full max-w-7xl mx-auto relative z-10">
            <div class="stagger-item border-t border-white/20 pt-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-8" style="transition-delay: 450ms;">
                
                <div class="flex gap-8">
                    <a href="#" class="text-white/70 hover:text-white transition-colors flex items-center gap-2 group text-sm tracking-wide font-medium">
                        <span class="iconify w-4 h-4" data-icon="lucide:twitter" data-stroke-width="1.5"></span>
                        Twitter
                    </a>
                    <a href="#" class="text-white/70 hover:text-white transition-colors flex items-center gap-2 group text-sm tracking-wide font-medium">
                        <span class="iconify w-4 h-4" data-icon="lucide:instagram" data-stroke-width="1.5"></span>
                        Instagram
                    </a>
                    <a href="#" class="text-white/70 hover:text-white transition-colors flex items-center gap-2 group text-sm tracking-wide font-medium">
                        <span class="iconify w-4 h-4" data-icon="lucide:mail" data-stroke-width="1.5"></span>
                        Get in touch
                    </a>
                </div>

                <div class="text-white/40 text-xs tracking-wider uppercase font-medium">
                    San Francisco, CA &nbsp;&bull;&nbsp; EST 2024
                </div>
            </div>
        </div>

    </div>

    <script>
        const menuBtn = document.getElementById('menu-toggle');
        const overlay = document.getElementById('menu-overlay');
        const body = document.body;
        const line1 = document.querySelector('.menu-line-1');
        const line2 = document.querySelector('.menu-line-2');
        
        let isMenuOpen = false;

        menuBtn.addEventListener('click', () => {
            isMenuOpen = !isMenuOpen;
            
            if (isMenuOpen) {
                // Open: Slide overlay in, then trigger staggers via class
                overlay.classList.remove('translate-x-full');
                overlay.classList.add('translate-x-0');
                
                // Add delay class slightly after slide starts to ensure smooth stagger entrance
                setTimeout(() => {
                    overlay.classList.add('menu-open');
                }, 50); // Small tick to allow display render
                
                body.style.overflow = 'hidden';
                
                // Hamburger Animation -> X
                line1.style.transform = 'translateY(3.5px) rotate(45deg)';
                line2.style.transform = 'translateY(-3.5px) rotate(-45deg)';
                
            } else {
                // Close: Remove stagger state immediately so they reset for next time
                overlay.classList.remove('menu-open');
                
                // Slide overlay out
                overlay.classList.remove('translate-x-0');
                overlay.classList.add('translate-x-full');
                
                body.style.overflow = '';
                
                // X Animation -> Hamburger
                line1.style.transform = 'translateY(0) rotate(0)';
                line2.style.transform = 'translateY(0) rotate(0)';
            }
        });

        // Close on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isMenuOpen) {
                menuBtn.click();
            }
        });
    </script>
</body>
