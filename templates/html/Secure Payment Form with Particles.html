<!DOCTYPE html>
<html lang="en">
<head>
<script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Form with Particles - Light Mode</title>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    body { font-family: 'Inter', sans-serif; }
    #tsparticles {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
    }
    .input-focus:focus-within {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f6;
    }
    .card-icon {
      transition: all 0.2s ease;
      opacity: 0.5;
    }
    .card-icon.active {
      opacity: 1;
      transform: scale(1.1);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
  <!-- tsParticles Background -->
  <div id="tsparticles"></div>

  <!-- Payment Form Card -->
  <div class="relative z-10 max-w-xl w-full bg-white/90 backdrop-blur-sm rounded-xl overflow-hidden shadow-lg border border-gray-200">
    <!-- Header -->
    <div class="bg-gradient-to-br from-blue-500 to-blue-700 p-6">
      <div class="flex justify-between items-center">
        <div>
          <span class="px-2 py-1 bg-blue-600/70 rounded-full text-xs text-white mb-2 inline-block">SECURE PAYMENT</span>
          <h2 class="text-2xl font-bold text-white">Complete Your Purchase</h2>
        </div>
        <div class="h-12 w-12 rounded-lg bg-blue-600/30 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
          </svg>
        </div>
      </div>
      
      <!-- Order Summary -->
      <div class="mt-5 p-4 bg-white/20 rounded-lg border border-blue-400/30">
        <div class="flex justify-between items-center mb-2">
          <span class="text-sm text-blue-50">Plan</span>
          <span class="text-sm font-medium text-white">Premium Subscription</span>
        </div>
        <div class="flex justify-between items-center mb-2">
          <span class="text-sm text-blue-50">Billing</span>
          <span class="text-sm font-medium text-white">Monthly</span>
        </div>
        <div class="flex justify-between items-center pt-2 border-t border-blue-400/30">
          <span class="text-sm font-medium text-blue-100">Total</span>
          <span class="text-lg font-bold text-white">$29.99/mo</span>
        </div>
      </div>
    </div>
    
    <!-- Payment Form -->
    <div class="p-6 bg-white">
      <form>
        <!-- Payment Method Selection -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2">Payment Method</label>
          <div class="flex space-x-3 mb-4">
            <div class="flex items-center card-icon active">
              <img src="https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/visa.svg" alt="Visa" class="h-8 w-10 object-contain" />
            </div>
            <div class="flex items-center card-icon">
              <img src="https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/mastercard.svg" alt="Mastercard" class="h-8 w-10 object-contain" />
            </div>
            <div class="flex items-center card-icon">
              <img src="https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/americanexpress.svg" alt="American Express" class="h-8 w-10 object-contain" />
            </div>
            <div class="flex items-center card-icon">
              <img src="https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/applepay.svg" alt="Apple Pay" class="h-8 w-10 object-contain" />
            </div>
            <div class="flex items-center card-icon">
              <img src="https://raw.githubusercontent.com/simple-icons/simple-icons/develop/icons/paypal.svg" alt="PayPal" class="h-8 w-10 object-contain" />
            </div>
          </div>
        </div>

        <!-- Card Details -->
        <div class="space-y-4">
          <!-- Card Number -->
          <div>
            <label for="card-number" class="block text-sm font-medium text-gray-700 mb-1">Card Number</label>
            <div class="input-focus relative rounded-lg border border-gray-300 bg-gray-50 focus-within:bg-white">
              <input
                type="text"
                id="card-number"
                placeholder="1234 5678 9012 3456"
                class="w-full px-4 py-3 bg-transparent text-gray-900 placeholder-gray-500 focus:outline-none text-sm"
              />
              <div class="absolute right-3 top-1/2 transform -translate-y-1/2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                  <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                </svg>
              </div>
            </div>
          </div>

          <!-- Card Holder -->
          <div>
            <label for="card-holder" class="block text-sm font-medium text-gray-700 mb-1">Card Holder</label>
            <div class="input-focus rounded-lg border border-gray-300 bg-gray-50 focus-within:bg-white">
              <input
                type="text"
                id="card-holder"
                placeholder="Full Name on Card"
                class="w-full px-4 py-3 bg-transparent text-gray-900 placeholder-gray-500 focus:outline-none text-sm"
              />
            </div>
          </div>

          <!-- Expiry and CVV -->
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="expiry" class="block text-sm font-medium text-gray-700 mb-1">Expiry Date</label>
              <div class="input-focus rounded-lg border border-gray-300 bg-gray-50 focus-within:bg-white">
                <input
                  type="text"
                  id="expiry"
                  placeholder="MM / YY"
                  class="w-full px-4 py-3 bg-transparent text-gray-900 placeholder-gray-500 focus:outline-none text-sm"
                />
              </div>
            </div>
            <div>
              <label for="cvv" class="block text-sm font-medium text-gray-700 mb-1">Security Code</label>
              <div class="input-focus relative rounded-lg border border-gray-300 bg-gray-50 focus-within:bg-white">
                <input
                  type="text"
                  id="cvv"
                  placeholder="CVV"
                  class="w-full px-4 py-3 bg-transparent text-gray-900 placeholder-gray-500 focus:outline-none text-sm"
                />
                <div class="absolute right-3 top-1/2 transform -translate-y-1/2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2h-1V9a1 1 0 00-1-1z" clip-rule="evenodd" />
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <!-- Save Payment Info -->
          <div class="flex items-center pt-2">
            <input id="save-card" type="checkbox" class="h-4 w-4 rounded border-gray-300 bg-gray-100 text-blue-600 focus:ring-blue-500">
            <label for="save-card" class="ml-2 block text-sm text-gray-600">
              Save my payment information for future purchases
            </label>
          </div>
        </div>

        <!-- Terms and Privacy -->
        <div class="mt-6 text-xs text-gray-500">
          By completing this purchase, you agree to our <a href="#" class="text-blue-600 hover:text-blue-700">Terms of Service</a> and <a href="#" class="text-blue-600 hover:text-blue-700">Privacy Policy</a>.
        </div>

        <!-- Submit Button -->
        <div class="mt-6 flex items-center justify-between">
          <div class="flex items-center text-sm text-gray-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1.5 text-green-600" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
            </svg>
            Secured by SSL
          </div>
          <button type="submit" class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition flex items-center font-medium shadow-sm">
            Pay $29.99
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-2" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (async () => {
      await tsParticles.load("tsparticles", {
        particles: {
          number: {
            value: 40,
            density: {
              enable: true,
              value_area: 800
            }
          },
          color: {
            value: "#3b82f6"
          },
          shape: {
            type: "circle"
          },
          opacity: {
            value: 0.2,
            random: true
          },
          size: {
            value: 4,
            random: true
          },
          line_linked: {
            enable: true,
            distance: 150,
            color: "#60a5fa",
            opacity: 0.25,
            width: 1
          },
          move: {
            enable: true,
            speed: 1.5,
            direction: "none",
            random: false,
            straight: false,
            out_mode: "out",
            bounce: false
          }
        },
        interactivity: {
          detectsOn: "canvas",
          events: {
            onHover: {
              enable: true,
              mode: "grab"
            },
            onClick: {
              enable: true,
              mode: "push"
            },
            resize: true
          },
          modes: {
            grab: {
              distance: 140,
              line_linked: {
                opacity: 0.5
              }
            },
            push: {
              particles_nb: 3
            }
          }
        },
        detectRetina: true,
        background: {
          color: "#ebf5ff",
          position: "50% 50%",
          repeat: "no-repeat",
          size: "cover"
        }
      });

      // Simple card select implementation
      const cardIcons = document.querySelectorAll('.card-icon');
      cardIcons.forEach(icon => {
        icon.addEventListener('click', () => {
          cardIcons.forEach(i => i.classList.remove('active'));
          icon.classList.add('active');
        });
      });
    })();
  </script>
</body>
</html>
