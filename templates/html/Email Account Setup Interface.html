  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email App Onboarding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="bg-zinc-50 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white rounded-lg shadow-sm max-w-md w-full overflow-hidden border border-zinc-100">
    <!-- Header with progress indicator -->
    <div class="px-6 pt-6 pb-4">
      <div class="flex items-center justify-between mb-1">
        <div class="flex items-center space-x-2">
          <div class="w-6 h-6 bg-blue-600 rounded-full flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3.5 h-3.5 text-white">
              <path d="M1.5 8.67v8.58a3 3 0 003 3h15a3 3 0 003-3V8.67l-8.928 5.493a3 3 0 01-3.144 0L1.5 8.67z" />
              <path d="M22.5 6.908V6.75a3 3 0 00-3-3h-15a3 3 0 00-3 3v.158l9.714 5.978a1.5 1.5 0 001.572 0L22.5 6.908z" />
            </svg>
          </div>
          <h1 class="text-sm font-medium text-zinc-900">Pulse Mail</h1>
        </div>
        <span class="text-xs text-zinc-500">1 of 3</span>
      </div>
      
      <!-- Progress bar -->
      <div class="w-full h-1 bg-zinc-100 rounded-full overflow-hidden">
        <div class="h-full w-1/3 bg-blue-600 rounded-full"></div>
      </div>
    </div>
    
    <!-- Content -->
    <div class="px-6 pb-6">
      <h2 class="text-base font-medium text-zinc-900 mb-1">Set up your account</h2>
      <p class="text-sm text-zinc-500 mb-5">Let's get you started with a personalized email experience</p>
      
      <form class="space-y-4">
        <div>
          <label for="name" class="block text-xs text-zinc-700 mb-1.5">Name</label>
          <input 
            type="text" 
            id="name" 
            class="w-full px-3 py-2 border border-zinc-200 rounded-md text-sm bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Your name"
          >
        </div>
        
        <div>
          <label for="email" class="block text-xs text-zinc-700 mb-1.5">Email address</label>
          <div class="flex">
            <input 
              type="text" 
              id="email" 
              class="w-3/5 px-3 py-2 border-t border-l border-b border-zinc-200 rounded-l-md text-sm bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
              placeholder="username"
            >
            <div class="w-2/5 px-3 py-2 bg-zinc-50 border-t border-r border-b border-zinc-200 rounded-r-md text-sm text-zinc-500 flex items-center">
              @pulse.mail
            </div>
          </div>
        </div>
        
        <div>
          <label for="password" class="block text-xs text-zinc-700 mb-1.5">Password</label>
          <input 
            type="password" 
            id="password" 
            class="w-full px-3 py-2 border border-zinc-200 rounded-md text-sm bg-transparent focus:outline-none focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
            placeholder="Minimum 8 characters"
          >
        </div>
        
        <div class="pt-2">
          <div class="flex items-center space-x-2">
            <input type="checkbox" id="notifications" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-zinc-300 rounded">
            <label for="notifications" class="text-xs text-zinc-700">Enable inbox notifications</label>
          </div>
        </div>
        
        <div class="pt-2">
          <div class="flex items-center space-x-2">
            <input type="checkbox" id="terms" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-zinc-300 rounded">
            <label for="terms" class="text-xs text-zinc-700">
              I agree to the <a href="#" class="text-blue-600 hover:underline">Terms</a> and <a href="#" class="text-blue-600 hover:underline">Privacy Policy</a>
            </label>
          </div>
        </div>
        
        <div class="flex justify-between pt-3">
          <button 
            type="button" 
            class="px-3 py-1.5 text-xs font-medium text-zinc-700 hover:text-zinc-900 focus:outline-none"
          >
            Skip
          </button>
          <button 
            type="submit" 
            class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
          >
            Continue
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
