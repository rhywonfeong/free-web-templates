<html lang="en"><head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Minimal Flap</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
body { font-family: 'Inter', sans-serif; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.glass { background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
/* Custom scrollbar hidden */
::-webkit-scrollbar { display: none; }
</style></head>
<body class="bg-neutral-950 text-neutral-300 h-screen w-screen overflow-hidden flex items-center justify-center selection:bg-white/10 selection:text-white">

    <!-- Game Container -->
    <div class="relative w-full h-full md:max-w-md md:h-[85vh] bg-neutral-900/50 md:rounded-3xl border-0 md:border border-white/5 shadow-2xl shadow-black overflow-hidden flex flex-col">
        
        <!-- Header / HUD -->
        <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-start z-20 pointer-events-none">
            <div class="flex flex-col gap-1">
                <div class="flex items-center gap-2 text-white/90">
                    <div class="h-6 w-6 rounded flex items-center justify-center bg-white/5 border border-white/10 shadow-inner">
                        <span class="font-semibold tracking-tighter text-xs">F</span>
                    </div>
                    <span class="text-sm font-medium tracking-tight">FLAP</span>
                </div>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[0.65rem] uppercase tracking-widest text-neutral-500 font-medium">Score</span>
                <span id="scoreDisplay" class="text-3xl font-light tracking-tighter text-white">0</span>
            </div>
        </div>

        <!-- Canvas Layer -->
        <canvas id="gameCanvas" class="z-10"></canvas>

        <!-- Start Screen UI -->
        <div id="startScreen" class="absolute inset-0 z-30 flex flex-col items-center justify-center glass transition-opacity duration-500">
            <div class="bg-gradient-to-br from-neutral-800 to-neutral-900 border border-white/10 p-1 rounded-2xl shadow-2xl mb-8">
                <div class="bg-neutral-950 rounded-xl p-4 flex items-center justify-center">
                    <iconify-icon icon="solar:gamepad-linear" width="48" height="48" class="text-white" stroke-width="1.5"></iconify-icon>
                </div>
            </div>
            
            <h1 class="text-4xl text-white font-medium tracking-tight mb-2">Ready?</h1>
            <p class="text-sm text-neutral-400 mb-8 font-light tracking-wide">Press Space or Tap to Fly</p>
            
            <button id="startBtn" class="group relative px-6 py-3 bg-white text-black text-sm font-medium rounded-full hover:bg-neutral-200 transition-all active:scale-95 flex items-center gap-2">
                <span>Start Game</span>
                <iconify-icon icon="solar:play-linear" width="18" height="18" stroke-width="1.5" class="group-hover:translate-x-0.5 transition-transform"></iconify-icon>
            </button>
            
            <div class="absolute bottom-8 flex gap-6 text-xs text-neutral-500 font-medium tracking-wide">
                <div class="flex items-center gap-1.5">
                    <iconify-icon icon="solar:mouse-linear" width="14" height="14"></iconify-icon>
                    <span>CLICK</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <iconify-icon icon="solar:keyboard-linear" width="14" height="14"></iconify-icon>
                    <span>SPACE</span>
                </div>
            </div>
        </div>

        <!-- Game Over UI -->
        <div id="gameOverScreen" class="hidden absolute inset-0 z-40 flex flex-col items-center justify-center glass opacity-0 transition-opacity duration-300">
            <div class="w-full max-w-xs bg-neutral-900/90 border border-white/10 rounded-2xl p-6 shadow-2xl backdrop-blur-xl text-center">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-red-500/10 text-red-400 mb-4 border border-red-500/20">
                    <iconify-icon icon="solar:close-circle-linear" width="24" height="24" stroke-width="1.5"></iconify-icon>
                </div>
                
                <h2 class="text-xl text-white font-medium tracking-tight mb-1">Game Over</h2>
                <p class="text-xs text-neutral-400 mb-6">Better luck next time.</p>
                
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="bg-neutral-800/50 rounded-lg p-3 border border-white/5 flex flex-col items-center">
                        <span class="text-[0.6rem] uppercase tracking-widest text-neutral-500 mb-1">Score</span>
                        <span id="finalScore" class="text-xl font-medium text-white tracking-tight">0</span>
                    </div>
                    <div class="bg-neutral-800/50 rounded-lg p-3 border border-white/5 flex flex-col items-center">
                        <span class="text-[0.6rem] uppercase tracking-widest text-neutral-500 mb-1">Best</span>
                        <span id="bestScore" class="text-xl font-medium text-white tracking-tight">0</span>
                    </div>
                </div>

                <button id="restartBtn" class="w-full py-3 bg-white text-black text-sm font-medium rounded-lg hover:bg-neutral-200 transition-colors flex items-center justify-center gap-2">
                    <iconify-icon icon="solar:refresh-linear" width="16" height="16" stroke-width="1.5"></iconify-icon>
                    <span>Try Again</span>
                </button>
            </div>
        </div>
        
    </div>

    <!-- Background Decoration -->
    <div class="fixed inset-0 -z-10 bg-neutral-950">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-neutral-900/30 rounded-full blur-3xl pointer-events-none"></div>
    </div>

    <script>
        // --- Game Logic ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreEl = document.getElementById('finalScore');
        const bestScoreEl = document.getElementById('bestScore');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');

        // Game State
        let frames = 0;
        let score = 0;
        let highScore = localStorage.getItem('flappyHighScore') || 0;
        let animationId;
        let gameSpeed = 2.5; // Slightly faster for cleaner feel
        let isRunning = false;
        let scaleRatio = 1;

        const state = {
            current: 0,
            getReady: 0,
            game: 1,
            over: 2
        };

        // Assets / Style Config
        const colors = {
            bird: '#ffffff',
            pipe: '#262626', // neutral-800
            pipeBorder: '#404040', // neutral-700
            pipeHighlight: '#525252', // neutral-600
        };

        // Resize Handling
        function resize() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // Adjust physics based on screen size (roughly)
            scaleRatio = canvas.height / 600; 
            if (scaleRatio < 0.6) scaleRatio = 0.6;
            if (scaleRatio > 1.2) scaleRatio = 1.2;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Objects ---

        const bird = {
            x: 50,
            y: 150,
            width: 24,
            height: 24, // Square design
            radius: 4, // Rounded corners
            velocity: 0,
            gravity: 0.20,
            jumpStrength: -4.5,
            rotation: 0,
            
            draw: function() {
                // Rotation logic
                if (this.velocity < 0) this.rotation = -25 * Math.PI / 180;
                else if (this.velocity > 0) {
                    this.rotation += 2 * Math.PI / 180;
                    if(this.rotation > 90 * Math.PI / 180) this.rotation = 90 * Math.PI / 180;
                } else {
                    this.rotation = 0;
                }

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Glow effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = "rgba(255, 255, 255, 0.4)";
                
                // Draw rounded rect
                ctx.fillStyle = colors.bird;
                ctx.beginPath();
                ctx.roundRect(-this.width/2, -this.height/2, this.width, this.height, this.radius);
                ctx.fill();

                // Eye (minimal detail)
                ctx.fillStyle = "#171717";
                ctx.beginPath();
                ctx.arc(4, -4, 2, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            },
            
            flap: function() {
                this.velocity = this.jumpStrength * scaleRatio;
            },
            
            update: function() {
                this.velocity += this.gravity * scaleRatio;
                this.y += this.velocity;
                
                // Floor collision
                if (this.y + this.height/2 >= canvas.height) {
                    this.y = canvas.height - this.height/2;
                    gameOver();
                }
                
                // Ceiling collision
                if (this.y - this.height/2 <= 0) {
                    this.y = this.height/2;
                    this.velocity = 0;
                }
            },
            
            reset: function() {
                this.x = canvas.width / 4;
                this.y = canvas.height / 2;
                this.velocity = 0;
                this.rotation = 0;
            }
        };

        const pipes = {
            position: [],
            w: 52,
            gap: 160, // Wider gap for cleaner gameplay
            dx: 0, // Set in update based on speed
            
            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    let topY = p.y;
                    let bottomY = p.y + this.gap;
                    
                    ctx.shadowBlur = 0; // Reset shadow

                    // Top Pipe
                    ctx.fillStyle = colors.pipe;
                    ctx.strokeStyle = colors.pipeBorder;
                    ctx.lineWidth = 1;
                    
                    // Draw main pipe body
                    ctx.fillRect(p.x, 0, this.w, topY);
                    ctx.strokeRect(p.x, -1, this.w, topY + 1); // Border
                    
                    // Cap detail (Vercel style lines)
                    ctx.fillStyle = colors.pipeHighlight;
                    ctx.fillRect(p.x + 10, 0, 1, topY - 10);
                    
                    // Bottom Pipe
                    ctx.fillStyle = colors.pipe;
                    ctx.fillRect(p.x, bottomY, this.w, canvas.height - bottomY);
                    ctx.strokeRect(p.x, bottomY, this.w, canvas.height - bottomY + 1);
                    
                    // Cap detail
                    ctx.fillStyle = colors.pipeHighlight;
                    ctx.fillRect(p.x + 10, bottomY + 10, 1, canvas.height - bottomY - 10);
                }
            },
            
            update: function() {
                this.dx = gameSpeed * scaleRatio;
                
                // Add new pipe
                if (frames % 120 === 0) {
                    // Random height
                    // Min pipe height constraint
                    const minHeight = 50;
                    const maxPos = canvas.height - this.gap - minHeight;
                    const minPos = minHeight;
                    
                    const maxY = Math.random() * (maxPos - minPos) + minPos;
                    
                    this.position.push({
                        x: canvas.width,
                        y: maxY
                    });
                }
                
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    p.x -= this.dx;
                    
                    // Collision Logic (AABB)
                    // Bird Box
                    let bLeft = bird.x - bird.width/2 + 4; // shrink hitbox slightly for fairness
                    let bRight = bird.x + bird.width/2 - 4;
                    let bTop = bird.y - bird.height/2 + 4;
                    let bBottom = bird.y + bird.height/2 - 4;
                    
                    // Pipe Box
                    let pLeft = p.x;
                    let pRight = p.x + this.w;
                    let pTopY = p.y;
                    let pBottomY = p.y + this.gap;
                    
                    // Check Top Pipe
                    if (bRight > pLeft && bLeft < pRight && bTop < pTopY) {
                        gameOver();
                    }
                    // Check Bottom Pipe
                    if (bRight > pLeft && bLeft < pRight && bBottom > pBottomY) {
                        gameOver();
                    }
                    
                    // Score Update
                    if (p.x + this.w < bird.x - bird.width/2 && !p.passed) {
                        score++;
                        p.passed = true;
                        scoreDisplay.innerText = score;
                        // Slight difficulty increase
                        if(score % 10 === 0) gameSpeed += 0.2;
                    }
                    
                    // Remove off-screen pipes
                    if (p.x + this.w <= 0) {
                        this.position.shift();
                        i--; // adjust index
                    }
                }
            },
            
            reset: function() {
                this.position = [];
                this.dx = 2;
                gameSpeed = 2.5;
            }
        };

        const bg = {
            // Subtle grid effect
            draw: function() {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.lineWidth = 1;
                const gridSize = 40;
                
                // Vertical lines moving
                const offset = (frames * (gameSpeed * scaleRatio * 0.5)) % gridSize;
                
                for(let x = -offset; x < canvas.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }
                
                // Horizontal lines (static)
                for(let y = 0; y < canvas.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }
        }

        // --- Control Functions ---

        function init() {
            bird.reset();
            pipes.reset();
            score = 0;
            scoreDisplay.innerText = score;
            frames = 0;
            state.current = state.getReady;
            
            // UI
            startScreen.classList.remove('hidden', 'opacity-0');
            startScreen.style.pointerEvents = "auto";
            gameOverScreen.classList.add('hidden');
            gameOverScreen.classList.remove('flex');
            
            // Draw initial frame
            draw();
        }

        function startGame() {
            state.current = state.game;
            startScreen.classList.add('opacity-0');
            setTimeout(() => {
                startScreen.classList.add('hidden');
                startScreen.style.pointerEvents = "none";
            }, 500);
            bird.flap();
            loop();
        }

        function gameOver() {
            state.current = state.over;
            cancelAnimationFrame(animationId);
            
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('flappyHighScore', highScore);
            }
            
            finalScoreEl.innerText = score;
            bestScoreEl.innerText = highScore;
            
            gameOverScreen.classList.remove('hidden');
            gameOverScreen.classList.add('flex');
            // Force reflow
            void gameOverScreen.offsetWidth; 
            gameOverScreen.classList.remove('opacity-0');
        }

        function loop() {
            update();
            draw();
            if (state.current === state.game) {
                animationId = requestAnimationFrame(loop);
            }
        }

        function update() {
            bird.update();
            pipes.update();
            frames++;
        }

        function draw() {
            // Clear
            ctx.fillStyle = '#0a0a0a'; // match bg-neutral-950
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            bg.draw();
            pipes.draw();
            bird.draw();
        }

        // --- Inputs ---

        function handleInput(e) {
            if(e.type === 'keydown' && e.code !== 'Space') return;
            if(e.type === 'keydown') e.preventDefault(); // stop scrolling

            switch (state.current) {
                case state.getReady:
                    startGame();
                    break;
                case state.game:
                    bird.flap();
                    break;
                case state.over:
                    // Prevent accidental restarts immediately after death
                    // Handled by button mostly, but nice to have key support
                    break;
            }
        }

        // Event Listeners
        window.addEventListener('keydown', handleInput);
        canvas.addEventListener('pointerdown', (e) => {
            handleInput(e);
        });
        
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });
        
        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            // fade out game over
            gameOverScreen.classList.add('opacity-0');
            setTimeout(() => {
                init();
            }, 300);
        });

        // Initialize
        resize(); // Force size calc before init
        init();

    </script>

</body></html>
