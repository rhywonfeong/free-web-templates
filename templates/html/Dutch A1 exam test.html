        const MusicPlayer = () => {
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTrackIndex, setCurrentTrackIndex] = useState(0);
            const [volume, setVolume] = useState(0.5);
            const [isExpanded, setIsExpanded] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                if (audioRef.current) {
                    audioRef.current.volume = volume;
                    if (isPlaying) {
                        const playPromise = audioRef.current.play();
                        if (playPromise !== undefined) {
                            playPromise.catch(error => console.log("Auto-play prevented"));
                        }
                    } else {
                        audioRef.current.pause();
                    }
                }
            }, [isPlaying, volume, currentTrackIndex]);

            const nextTrack = () => setCurrentTrackIndex((prev) => (prev + 1) % musicTracks.length);

            return (
                <div class="fixed bottom-6 right-6 z-50">
                    <audio 
                        ref={audioRef} 
                        src={musicTracks[currentTrackIndex].url} 
                        loop
                        onEnded={nextTrack}
                    />
                    
                    <AnimatePresence>
                        {isExpanded && (
                            <motion.div 
                                initial={{ opacity: 0, scale: 0.9, y: 10 }}
                                animate={{ opacity: 1, scale: 1, y: 0 }}
                                exit={{ opacity: 0, scale: 0.9, y: 10 }}

                                </div>
                                <p class="text-sm font-medium text-slate-900 mb-3 truncate">🎵 {musicTracks[currentTrackIndex].title}</p>
                                
                                <div class="flex items-center gap-2 mb-1">
                                    <Icon icon="solar:volume-small-linear" className="text-slate-400" />
                                    <input 
                                        type="range" 
                                        min="0" max="1" step="0.01" 
                                        value={volume}
                                        onChange={(e) => setVolume(parseFloat(e.target.value))}
                                        class="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"

                        )}

        const KNSGame = ({ mode, onBack, onComplete }) => {
            const [index, setIndex] = useState(0);
            const [selected, setSelected] = useState(null); 
            const [score, setScore] = useState(0);
            const [showFeedback, setShowFeedback] = useState(false);
            const [isFinished, setIsFinished] = useState(false);
            const [timer, setTimer] = useState(0); // Seconds

            const currentQ = knsData[index];

            useEffect(() => {
                let interval;
                if (mode === 'exam' && !isFinished) {
                    interval = setInterval(() => setTimer(t => t + 1), 1000);
                }
                return () => clearInterval(interval);
            }, [mode, isFinished]);

            const handleAnswer = (choiceIdx) => {
                if (showFeedback && mode === 'practice') return;
                
                setSelected(choiceIdx);
                
                if (mode === 'practice') {
                    setShowFeedback(true);
                    if (choiceIdx === currentQ.c) setScore(s => s + 1);
                }
            };

            const handleNext = () => {
                // In Exam mode, score is calculated on 'Next' to prevent changing answer
                if (mode === 'exam') {
                    if (selected === currentQ.c) setScore(s => s + 1);
                }

                if (index < knsData.length - 1) {
                    setIndex(i => i + 1);
                    setSelected(null);
                    setShowFeedback(false);
                } else {
                    // Final Question logic
                    if (mode === 'exam' && selected === currentQ.c) setScore(s => s + 1);
                    setIsFinished(true);
                    onComplete(score + (mode === 'practice' && selected === currentQ.c ? 0 : 0));
                }
            };

            const formatTime = (s) => {
                const mins = Math.floor(s / 60);
                const secs = s % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            if (isFinished) {
                const passed = (score / knsData.length) >= 0.7; // 70% to pass
                return (
                    <div class="p-6 h-full flex flex-col justify-center items-center max-w-md mx-auto text-center">
                        <div class={`w-24 h-24 rounded-full flex items-center justify-center mb-6 ${passed ? 'bg-green-50 text-green-600' : 'bg-red-50 text-red-600'}`}>
                            <Icon icon={passed ? "solar:cup-star-linear" : "solar:close-circle-linear"} className="text-5xl" />
                        </div>
                        <h2 class="text-2xl font-semibold tracking-tight text-slate-900 mb-2">
                            {passed ? "Geslaagd!" : "Niet geslaagd"}
                        </h2>
                        <p class="text-slate-500 mb-8">{passed ? "Gefeliciteerd, u kent de stof goed." : "Blijf oefenen om te slagen."}</p>
                        
                        <div class="grid grid-cols-2 gap-4 w-full mb-8">
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                <p class="text-xs text-slate-400 uppercase font-medium">Score</p>
                                <p class={`text-2xl font-semibold ${passed ? 'text-green-600' : 'text-slate-900'}`}>{score}/{knsData.length}</p>
                            </div>
                            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                                <p class="text-xs text-slate-400 uppercase font-medium">Tijd</p>
                                <p class="text-2xl font-semibold text-slate-900">{formatTime(timer)}</p>
                            </div>
                        </div>
                        <Button onClick={onBack}>Terug naar Dashboard</Button>
                    </div>
                );
            }

            return (
                <div class="p-6 h-full flex flex-col max-w-md mx-auto">
                    {/* Header */}
                    <div class="flex items-center justify-between mb-4">

                        </span>

                    </div>

                                {currentQ.a.map((ans, idx) => {
                                    let stateStyle = "bg-white border-slate-200 text-slate-700 hover:border-blue-300";
                                    
                                    if (mode === 'practice' && showFeedback) {
                                        if (idx === currentQ.c) stateStyle = "bg-green-50 border-green-500 text-green-700";
                                        else if (selected === idx) stateStyle = "bg-red-50 border-red-500 text-red-700";
                                        else stateStyle = "bg-white border-slate-100 text-slate-400 opacity-50";
                                    } else if (selected === idx) {
                                        stateStyle = `${colors.bgBlue} border-transparent text-white shadow-md`;
                                    }

                                    return (
                                        <button
                                            key={idx}
                                            onClick={() => handleAnswer(idx)}
                                            disabled={showFeedback}
                                            class={`w-full p-4 rounded-xl border-2 text-left transition-all duration-200 flex items-center gap-4 ${stateStyle}`}
                                        >
                                            <div class={`w-6 h-6 rounded-full border flex items-center justify-center text-xs flex-shrink-0 font-bold
                                                ${selected === idx || (showFeedback && idx === currentQ.c) ? 'border-current' : 'border-slate-300 text-slate-400'}
                                            `}>
                                                {String.fromCharCode(65 + idx)}
                                            </div>
                                            <span class="font-medium text-sm">{ans}</span>
                                        </button>
                                    )
                                })}
                            </div>
                        </motion.div>
                    </div>

                    {/* Footer Action */}
                    <div class="mt-4 pt-4 border-t border-slate-100 bg-slate-50">
                        <Button 
                            onClick={handleNext} 
                            disabled={selected === null}
                            className={selected === null ? 'opacity-50 cursor-not-allowed' : ''}
                        >
                            {index === knsData.length - 1 ? "Examen Afronden" : "Volgende Vraag"}
                        </Button>
                    </div>
                </div>
            );
        };

        const SpeakingWriting = ({ data, title, onBack, onComplete, part }) => {
            const [index, setIndex] = useState(0);
            const [inputValue, setInputValue] = useState("");
            const [stage, setStage] = useState('input'); // input, checked
            
            const item = data[index];
            const isPart2 = part === 2;

            const checkAnswer = () => {
                if (!inputValue.trim()) return;
                setStage('checked');
            };

            const handleNext = () => {
                setStage('input');
                setInputValue("");
                if (index < data.length - 1) {
                    setIndex(i => i + 1);
                } else {
                    onComplete();
                }
            };

            return (
                <div class="p-6 h-full flex flex-col max-w-md mx-auto relative">
                     {/* Header */}
                     <div class="flex items-center justify-between mb-8 z-10">
                        <div class="flex items-center gap-2">
                             <button onClick={onBack} class="p-2 -ml-2 text-slate-400 hover:text-slate-600">
                                <Icon icon="solar:arrow-left-linear" />
                            </button>
                            <span class="text-sm font-medium text-slate-500">
                                {index + 1} / {data.length}
                            </span>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto no-scrollbar">
                        <div class="bg-white border border-slate-200 rounded-3xl shadow-sm p-6 mb-6 relative overflow-hidden">
                             <div class="absolute top-0 right-0 p-4 opacity-5">
                                <Icon icon={isPart2 ? "solar:pen-new-linear" : "solar:chat-line-linear"} className="text-8xl text-black" />
                            </div>
                            
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                                {isPart2 ? "Maak de zin af" : "Geef antwoord"}
                            </p>
                            
                            <h3 class="text-xl font-semibold tracking-tight text-slate-900 leading-snug">
                                {isPart2 ? item.s : item.q}
                            </h3>
                        </div>

                        <div class="space-y-4">
                            <label class="block text-sm font-medium text-slate-700 ml-1">
                                {isPart2 ? "Maak de zin compleet:" : "Schrijf uw antwoord:"}
                            </label>
                            
                            <textarea 
                                value={inputValue}
                                onChange={(e) => setStage('input') || setInputValue(e.target.value)}
                                placeholder="Typ hier..."
                                disabled={stage === 'checked'}
                                class="w-full p-4 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none text-slate-900 min-h-[120px] resize-none shadow-sm transition-shadow"
                            ></textarea>
                            
                            {stage === 'checked' && (
                                <motion.div 
                                    initial={{ opacity: 0, y: 10 }}
                                    animate={{ opacity: 1, y: 0 }}
                                    class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex gap-3 items-start"
                                >
                                    <Icon icon="solar:info-circle-linear" className="text-blue-600 mt-0.5" />
                                    <div>
                                        <p class="text-xs text-blue-700 font-bold uppercase mb-1">Instructie</p>
                                        <p class="text-slate-700 text-sm">Dit is een open oefening. Controleer zelf of uw zin logisch is en correct Nederlands gebruikt.</p>
                                    </div>
                                </motion.div>
                            )}
                        </div>
                    </div>

                    <div class="mt-6 pt-4 border-t border-slate-100">
                        {stage === 'input' ? (
                            <Button onClick={checkAnswer} disabled={!inputValue.trim()} variant="primary">
                                Controleer
                            </Button>
                        ) : (
                            <Button onClick={handleNext} variant="primary">
                                {index === data.length - 1 ? "Klaar" : "Volgende"}
                            </Button>
                        )}
                    </div>
                </div>
            );
        };

        const Menu = ({ title, options, onBack }) => (
             <div class="p-6 h-full flex flex-col max-w-md mx-auto">
                 <div class="flex items-center justify-between mb-10 mt-4">
                    <div class="flex items-center">
                        <button onClick={onBack} class="p-2 -ml-2 text-slate-400 hover:text-slate-600 mr-4">
                            <Icon icon="solar:arrow-left-linear" />
                        </button>
                        <h1 class="text-2xl font-semibold tracking-tight text-slate-900">{title}</h1>
                    </div>
                 </div>

                 <div class="space-y-4">
                    {options.map((opt, i) => (
                        <motion.div 
                            key={i}
                            initial={{ opacity: 0, y: 10 }}
                            animate={{ opacity: 1, y: 0 }}
                            transition={{ delay: i * 0.1 }}
                        >
                            <Card className="p-0 overflow-hidden cursor-pointer group hover:border-blue-200 transition-colors">
                                <button onClick={opt.action} class="w-full text-left p-6 flex items-center justify-between">
                                    <div class="flex items-center gap-4">
                                        <div class={`w-12 h-12 rounded-xl flex items-center justify-center ${opt.bg} ${opt.color}`}>
                                            <Icon icon={opt.icon} />
                                        </div>
                                        <div>
                                            <h3 class="font-semibold text-slate-900">{opt.label}</h3>
                                            <p class="text-sm text-slate-500">{opt.desc}</p>
                                        </div>
                                    </div>
                                    <Icon icon="solar:alt-arrow-right-linear" className="text-slate-300 group-hover:text-slate-600" />
                                </button>
                            </Card>
                        </motion.div>
                    ))}
                 </div>
             </div>
        );

        // --- Main App ---

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [stats, setStats] = useState({ kns: 0, speaking: 0 });

            useEffect(() => {
                const saved = localStorage.getItem('dutch_a1_stats_v2');
                if (saved) setStats(JSON.parse(saved));
            }, []);

            const updateStats = (category, count) => {
                const newStats = { ...stats, [category]: Math.max(stats[category], count) };
                setStats(newStats);
                localStorage.setItem('dutch_a1_stats_v2', JSON.stringify(newStats));
                setView('dashboard');
            };

            const renderView = () => {
                switch(view) {
                    case 'dashboard':
                        return <Dashboard onNavigate={setView} stats={stats} />;
                    
                    case 'kns-menu':
                        return <Menu 
                            title="KNS Examen"
                            onBack={() => setView('dashboard')}
                            options={[
                                { label: "Oefenmodus", desc: "Feedback na elke vraag", icon: "solar:check-read-linear", bg: "bg-blue-50", color: colors.blue, action: () => setView('kns-practice') },
                                { label: "Examenmodus", desc: "Tijdslimiet, officiële stijl", icon: "solar:stopwatch-linear", bg: "bg-orange-50", color: colors.orange, action: () => setView('kns-exam') }
                            ]}
                        />;
                    
                    case 'kns-practice':
                        return <KNSGame mode="practice" onBack={() => setView('kns-menu')} onComplete={(s) => updateStats('kns', s)} />;
                    
                    case 'kns-exam':
                        return <KNSGame mode="exam" onBack={() => setView('kns-menu')} onComplete={(s) => updateStats('kns', s)} />;

                    case 'speaking-menu':
                        return <Menu 
                            title="Spreken & Schrijven"
                            onBack={() => setView('dashboard')}
                            options={[
                                { label: "Deel 1: Vragen", desc: "Beantwoord persoonlijke vragen", icon: "solar:chat-line-linear", bg: "bg-blue-50", color: colors.blue, action: () => setView('speaking-p1') },
                                { label: "Deel 2: Zinnen", desc: "Maak de zinnen logisch af", icon: "solar:pen-new-linear", bg: "bg-orange-50", color: colors.orange, action: () => setView('speaking-p2') }
                            ]}
                        />;

                    case 'speaking-p1':
                        return <SpeakingWriting 
                            data={speakingP1Data} 
                            title="Spreken Deel 1" 
                            part={1}
                            onBack={() => setView('speaking-menu')}
                            onComplete={() => updateStats('speaking', stats.speaking + 1)} 
                        />;
                    
                    case 'speaking-p2':
                        return <SpeakingWriting 
                            data={speakingP2Data} 
                            title="Spreken Deel 2" 
                            part={2}
                            onBack={() => setView('speaking-menu')}
                            onComplete={() => updateStats('speaking', stats.speaking + 1)}
                        />;

                    default:
                        return <Dashboard onNavigate={setView} stats={stats} />;
                }
            };

            return (
                <div class="h-full w-full font-sans text-base">
                    <MusicPlayer />
                    <AnimatePresence mode="wait">
                        <motion.div 
                            key={view}
                            initial={{ opacity: 0, x: 10 }}
                            animate={{ opacity: 1, x: 0 }}
                            exit={{ opacity: 0, x: -10 }}
                            transition={{ duration: 0.2 }}
                            class="h-full w-full"
                        >
                            {renderView()}
                        </motion.div>
                    </AnimatePresence>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
