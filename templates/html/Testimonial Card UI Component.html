    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonial Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;1,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --font-primary-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-primary-serif: 'Lora', serif;
            --font-current-main: var(--font-primary-sans);
            --font-current-heading: var(--font-primary-sans);
            --font-current-quote: var(--font-primary-serif);
            
            --bg-page: #f8f9fa;
            --bg-component: #ffffff;
            --text-primary: #212529;
            --text-secondary: #495057;
            --text-heading: #004085;
            --text-muted: #6c757d;
            --text-accent: #007bff;
            --text-rating: #ffc107;
            
            --border-color: #dee2e6;
            --border-radius-base: 0.25rem;
            --border-radius-lg: 0.3rem;
            --border-radius-avatar: 50%;
            
            --shadow-color-rgb: 0, 0, 0;
            --shadow-opacity-md: 0.15;
            --shadow-opacity-lg: 0.2;
            --shadow-md: 0 .5rem 1rem rgba(var(--shadow-color-rgb), var(--shadow-opacity-md));
            --shadow-lg: 0 1rem 3rem rgba(var(--shadow-color-rgb), var(--shadow-opacity-lg));
            
            --transition-speed-normal: 0.2s;
            --transition-timing-function: ease-in-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-current-main);
            line-height: 1.6;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
        }

        .testimonial-card {
            background-color: var(--bg-component);
            padding: 25px 30px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            max-width: 450px;
            width: 100%;
            text-align: center;
            transition: transform var(--transition-speed-normal) var(--transition-timing-function), 
                        box-shadow var(--transition-speed-normal) var(--transition-timing-function);
        }

        .testimonial-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .testimonial-avatar {
            width: 80px;
            height: 80px;
            border-radius: var(--border-radius-avatar);
            object-fit: cover;
            margin: 0 auto 15px auto;
            display: block;
            border: 3px solid var(--border-color);
            background-color: var(--bg-component);
            transition: transform var(--transition-speed-normal);
        }

        .testimonial-card:hover .testimonial-avatar {
            transform: scale(1.05);
        }

        .testimonial-rating {
            margin-bottom: 15px;
            color: var(--text-rating);
            font-size: 1.1rem;
        }

        .testimonial-quote {
            font-family: var(--font-current-quote);
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
            margin-bottom: 20px;
            font-style: italic;
            position: relative;
            padding: 0 10px;
        }

        .testimonial-quote::before {
            content: '"';
            font-family: var(--font-current-quote);
            font-size: 2.5em;
            color: var(--text-accent);
            opacity: 0.3;
            position: absolute;
            left: -10px;
            top: -10px;
            line-height: 1;
        }

        .testimonial-quote::after {
            content: '"';
            font-family: var(--font-current-quote);
            font-size: 2.5em;
            color: var(--text-accent);
            opacity: 0.3;
            position: absolute;
            right: -10px;
            bottom: -20px;
            line-height: 1;
        }

        .testimonial-author {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-heading);
            margin-bottom: 3px;
            font-family: var(--font-current-heading);
        }

        .testimonial-author-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: block;
            font-family: var(--font-current-main);
        }
    </style>
</head>
<body>
    <div class="testimonial-card wow animate__animated animate__fadeInUp" data-wow-duration="0.8s">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-4.0.3&amp;ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&amp;auto=format&amp;fit=crop&amp;w=120&amp;q=80" alt="Author Avatar" class="testimonial-avatar">
        <div class="testimonial-rating">★★★★☆</div>
        <blockquote class="testimonial-quote">This service completely transformed our workflow. The efficiency gains are incredible, and the support team is always responsive and helpful. Highly recommended!</blockquote>
        <p class="testimonial-author">Alex Johnson</p>
        <span class="testimonial-author-title">CEO, Tech Innovators Inc.</span>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
    <script>new WOW().init();</script>
</body>
