    <main class="flex-grow flex items-center justify-center w-full px-4 sm:px-6 py-12">
        
        <div class="w-full max-w-sm flex flex-col gap-8">
            <!-- Header Section -->
            <div class="flex flex-col gap-3 text-center items-center">
                <div class="w-12 h-12 rounded-2xl border border-white/[0.1] bg-white/[0.02] flex items-center justify-center mb-2 shadow-[0_0_15px_rgba(34,211,238,0.05)]">

                <!-- Email Field -->
                <div class="flex flex-col gap-2">

                    <div class="relative">

                        </div>

                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">

                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between mt-1">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <div class="relative flex items-center justify-center w-4 h-4">
