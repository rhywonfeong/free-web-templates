    <meta charset="UTF-8">

    <title>Rolling Mountain Gallery with Aurora Effect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes aurora {
            0% {
                transform: translateX(-100%) skewX(-15deg);
                opacity: 0.6;
            }
            25% {
                transform: translateX(-50%) skewX(10deg);
                opacity: 0.8;
            }
            50% {
                transform: translateX(0%) skewX(-5deg);
                opacity: 1;
            }
            75% {
                transform: translateX(50%) skewX(8deg);
                opacity: 0.7;
            }
            100% {
                transform: translateX(100%) skewX(-10deg);
                opacity: 0.5;
            }
        }
        
        @keyframes wave {
            0%, 100% {
                transform: translateY(0px) scaleY(1);
            }
            50% {
                transform: translateY(-20px) scaleY(1.2);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 0.4;
            }
            50% {
                opacity: 0.9;
            }
        }
        
        .aurora-wave {
            animation: aurora 12s ease-in-out infinite;
        }
        
        .aurora-wave:nth-child(2) {
            animation: aurora 15s ease-in-out infinite reverse;
            animation-delay: -2s;
        }
        
        .aurora-wave:nth-child(3) {
            animation: aurora 18s ease-in-out infinite;
            animation-delay: -4s;
        }
        
        .aurora-layer {
            animation: wave 8s ease-in-out infinite, pulse 6s ease-in-out infinite;
        }
        
        .aurora-layer:nth-child(2) {
            animation-delay: -1s, -1.5s;
        }
        
        .aurora-layer:nth-child(3) {
            animation-delay: -2s, -3s;
        }

        .gallery-container {
            perspective: 1000px;
            transform-style: preserve-3d;
        }
        .gallery-cylinder {
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            cursor: grab;
        }
        .gallery-cylinder:active {
            cursor: grabbing;
        }
        .gallery-face {
            backface-visibility: hidden;
        }
        .gallery-spinning {
            animation: spin 20s linear infinite;
        }
        @keyframes spin {
            from { transform: rotateX(0deg); }
            to { transform: rotateX(-360deg); }
        }
        .gradient-top {
            background: linear-gradient(to top, rgba(0,0,0,0) 0%, #111827 100%);
        }
        .gradient-bottom {
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, #111827 100%);
        }
        .glass-frame {
            border: 3px solid rgba(255,255,255,0.35) !important;
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 2px 30px 0 rgba(255,255,255,0.10) inset, 0 1.5px 10px 0 rgba(255,255,255,0.12);
        }
    </style>

<body class="bg-black min-h-screen w-full flex items-center justify-center overflow-hidden">
    <div class="relative flex items-center justify-center w-full h-screen min-h-screen">
        <!-- Aurora Animated Background -->
        <div class="absolute inset-0 overflow-hidden z-0 pointer-events-none">
            <!-- First Aurora Wave -->
            <div class="aurora-wave absolute inset-0">
                <div class="aurora-layer absolute top-1/2 left-0 w-full h-32 opacity-60" style="background: linear-gradient(90deg, #3A29FF 0%, #FF94B4 50%, #FF3232 100%); 
                            filter: blur(20px); 
                            transform: translateY(-50%) rotate(-2deg);">
                </div>
            </div>
            <!-- Second Aurora Wave -->
            <div class="aurora-wave absolute inset-0">
                <div class="aurora-layer absolute top-1/2 left-0 w-full h-24 opacity-50" style="background: linear-gradient(90deg, #FF3232 0%, #3A29FF 50%, #FF94B4 100%); 
                            filter: blur(25px); 
                            transform: translateY(-30px) rotate(1deg);">
                </div>
            </div>
            <!-- Third Aurora Wave -->
            <div class="aurora-wave absolute inset-0">
                <div class="aurora-layer absolute top-1/2 left-0 w-full h-40 opacity-40" style="background: linear-gradient(90deg, #FF94B4 0%, #FF3232 50%, #3A29FF 100%); 
                            filter: blur(30px); 
                            transform: translateY(20px) rotate(-1deg);">
                </div>
            </div>
            <!-- Additional subtle layers for depth -->
            <div class="absolute top-1/3 left-0 w-full h-20 opacity-30 aurora-layer" style="background: radial-gradient(ellipse, #3A29FF 0%, transparent 70%); 
                        filter: blur(40px); 
                        animation-duration: 10s, 8s;">
            </div>
            <div class="absolute bottom-1/3 left-0 w-full h-16 opacity-25 aurora-layer" style="background: radial-gradient(ellipse, #FF94B4 0%, transparent 60%); 
                        filter: blur(35px); 
                        animation-duration: 14s, 9s; 
                        animation-delay: -3s, -2s;">
            </div>
        </div>

        <!-- Rolling Gallery + Gradients -->
        <div class="relative flex flex-col items-center justify-center w-full h-full z-10">
            <!-- Top gradient overlay -->
            <div class="absolute top-0 left-0 w-full h-[120px] z-20 gradient-top"></div>
            <!-- Bottom gradient overlay -->
            <div class="absolute bottom-0 left-0 w-full h-[120px] z-20 gradient-bottom"></div>
            <!-- Gallery container -->
            <div class="flex h-[600px] items-center justify-center gallery-container w-full">
                <div id="galleryCylinder" class="gallery-cylinder flex min-w-[600px] items-center justify-center gallery-spinning" style="height: 2400px; transform: rotateX(0.05deg);"></div>
            </div>
        </div>
    </div>
    <script>
        const IMGS = [
            "https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1444065381814-865dc9da92c0?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1465101046530-73398c7f28ca?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80"
        ];

        class RollingGallery {
            constructor(options = {}) {
                this.autoplay = options.autoplay || true;
                this.pauseOnHover = options.pauseOnHover || true;
                this.images = options.images || IMGS;
                this.cylinder = document.getElementById('galleryCylinder');
                this.rotation = 0;
                this.isDragging = false;
                this.dragStart = 0;
                this.dragFactor = 0.05;
                this.isSmallScreen = window.innerWidth <= 640;
                this.init();
                this.setupEventListeners();
            }

            init() {
                this.updateDimensions();
                this.createGalleryFaces();
                if (this.autoplay) {
                    this.startAutoplay();
                }
            }

            updateDimensions() {
                this.cylinderHeight = this.isSmallScreen ? 1600 : 2000;
                this.faceCount = this.images.length;
                this.faceHeight = (this.cylinderHeight / this.faceCount) * 1.2;
                this.radius = this.cylinderHeight / (2 * Math.PI);
                this.cylinder.style.height = `${this.cylinderHeight}px`;
            }

            createGalleryFaces() {
                this.cylinder.innerHTML = '';
                this.images.forEach((url, i) => {
                    const face = document.createElement('div');
                    face.className = 'gallery-face group absolute flex h-fit items-center justify-center p-[8%] md:p-[6%]';
                    face.style.height = `${this.faceHeight}px`;
                    face.style.transform = `rotateX(${(360 / this.faceCount) * i}deg) translateZ(${this.radius}px)`;

                    // Glass effect frame wrapping the image
                    const glassFrame = document.createElement('div');
                    glassFrame.className = 'glass-frame flex items-center justify-center rounded-[32px] transition-transform duration-300 ease-out group-hover:scale-105 shadow-lg';
                    glassFrame.style.width = '600px';
                    glassFrame.style.height = '240px';
                    glassFrame.style.overflow = 'hidden';

                    const img = document.createElement('img');
                    img.src = url;
                    img.alt = 'mountain gallery';
                    img.className = 'pointer-events-none h-full w-full rounded-[28px] object-cover';
                    img.draggable = false;

                    glassFrame.appendChild(img);
                    face.appendChild(glassFrame);
                    this.cylinder.appendChild(face);
                });
            }

            updateRotation() {
                this.cylinder.style.transform = `rotateX(${this.rotation}deg)`;
            }

            startAutoplay() {
                this.cylinder.classList.add('gallery-spinning');
            }

            stopAutoplay() {
                this.cylinder.classList.remove('gallery-spinning');
            }

            setupEventListeners() {
                this.cylinder.addEventListener('mousedown', this.handleMouseDown.bind(this));
                document.addEventListener('mousemove', this.handleMouseMove.bind(this));
                document.addEventListener('mouseup', this.handleMouseUp.bind(this));
                this.cylinder.addEventListener('touchstart', this.handleTouchStart.bind(this));
                document.addEventListener('touchmove', this.handleTouchMove.bind(this));
                document.addEventListener('touchend', this.handleTouchEnd.bind(this));
                if (this.pauseOnHover) {
                    this.cylinder.addEventListener('mouseenter', () => {
                        if (this.autoplay) this.stopAutoplay();
                    });
                    this.cylinder.addEventListener('mouseleave', () => {
                        if (this.autoplay && !this.isDragging) this.startAutoplay();
                    });
                }
                window.addEventListener('resize', () => {
                    this.isSmallScreen = window.innerWidth <= 640;
                    this.updateDimensions();
                    this.createGalleryFaces();
                });
            }

            handleMouseDown(e) {
                this.isDragging = true;
                this.dragStart = e.clientY;
                this.stopAutoplay();
                e.preventDefault();
            }

            handleMouseMove(e) {
                if (!this.isDragging) return;
                const deltaY = e.clientY - this.dragStart;
                this.rotation += deltaY * this.dragFactor;
                this.updateRotation();
                this.dragStart = e.clientY;
            }

            handleMouseUp() {
                if (!this.isDragging) return;
                this.isDragging = false;
                if (this.autoplay) {
                    setTimeout(() => this.startAutoplay(), 100);
                }
            }

            handleTouchStart(e) {
                this.isDragging = true;
                this.dragStart = e.touches[0].clientY;
                this.stopAutoplay();
                e.preventDefault();
            }

            handleTouchMove(e) {
                if (!this.isDragging) return;
                const deltaY = e.touches[0].clientY - this.dragStart;
                this.rotation += deltaY * this.dragFactor;
                this.updateRotation();
                this.dragStart = e.touches[0].clientY;
                e.preventDefault();
            }

            handleTouchEnd() {
                if (!this.isDragging) return;
                this.isDragging = false;
                if (this.autoplay) {
                    setTimeout(() => this.startAutoplay(), 100);
                }
            }
        }

        new RollingGallery({
            autoplay: true,
            pauseOnHover: true
        });
    </script>
</body></html>
