<!DOCTYPE html>
<html lang="en" class="dark"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERO - 3D Configurator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; color-scheme: dark; }
/* Subtle custom scrollbar for the config panel */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #555; }
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-[#0a0a0a] text-neutral-300 antialiased h-screen flex flex-col overflow-hidden selection:bg-white/20 selection:text-white">

    <!-- Header Navigation -->
    <header class="flex-none flex items-center justify-between px-6 py-4 border-b border-white/5 bg-[#0a0a0a]/80 backdrop-blur-xl relative z-30">
        <div class="flex items-center gap-8">
            <a href="#" class="text-xl font-medium tracking-tighter text-white flex items-center gap-2">
                AERO
            </a>
            <nav class="hidden md:flex items-center gap-6 text-sm">
                <a href="#" class="text-neutral-400 hover:text-white transition-colors">Models</a>
                <a href="#" class="text-white font-medium">Configurator</a>
                <a href="#" class="text-neutral-400 hover:text-white transition-colors">Technology</a>
                <a href="#" class="text-neutral-400 hover:text-white transition-colors">Inventory</a>
            </nav>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <button class="hidden sm:flex items-center gap-2 text-neutral-400 hover:text-white transition-colors">
                <iconify-icon icon="solar:user-linear" width="18" stroke-width="1.5"></iconify-icon>
                <span>Sign In</span>
            </button>
            <button class="md:hidden text-neutral-400 hover:text-white">
                <iconify-icon icon="solar:hamburger-menu-linear" width="24" stroke-width="1.5"></iconify-icon>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col lg:flex-row relative overflow-hidden">
        
        <!-- 3D Viewport Area -->
        <div class="relative flex-1 flex flex-col items-center justify-center bg-[#050505] overflow-hidden" style="background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 60%);">
            
            <!-- Environment / Technical Grid -->
            <div class="absolute inset-0 z-0 opacity-20 pointer-events-none" style="background-image: linear-gradient(to right, rgba(255,255,255,0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.1) 1px, transparent 1px); background-size: 64px 64px;"></div>
            
            <!-- Floor Reflection/Shadow -->
            <div class="absolute bottom-1/4 w-[120%] h-[40%] bg-white/5 rounded-[100%] blur-[80px] pointer-events-none translate-y-1/2"></div>

            <!-- "3D" Model Simulation -->
            <!-- Using a high contrast image to simulate a sleek render -->
            <div class="relative z-10 w-full max-w-5xl px-8 flex items-center justify-center transition-transform duration-700 hover:scale-[1.02] cursor-grab active:cursor-grabbing">
                <img src="https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?q=80&w=2070&auto=format&fit=crop" alt="Car 3D Model" class="filter contrast-125 opacity-90 mix-blend-lighten w-full h-auto object-contain drop-shadow-2xl saturate-50">
            </div>

            <!-- View Controls -->
            <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-2 p-1.5 bg-[#111] border border-white/10 rounded-full shadow-2xl backdrop-blur-md z-20">
                <button class="p-2.5 text-neutral-500 hover:text-white hover:bg-white/5 rounded-full transition-all group relative">
                    <iconify-icon icon="solar:ruler-linear" width="20" stroke-width="1.5"></iconify-icon>
                    <span class="absolute -top-10 left-1/2 -translate-x-1/2 bg-white text-black text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap">Dimensions</span>
                </button>
                <button class="p-2.5 text-neutral-500 hover:text-white hover:bg-white/5 rounded-full transition-all">
                    <iconify-icon icon="solar:sun-linear" width="20" stroke-width="1.5"></iconify-icon>
                </button>
                
                <div class="w-px h-5 bg-white/10 mx-1"></div>
                
                <div class="flex items-center bg-[#1a1a1a] rounded-full p-1 border border-white/5">
                    <button class="px-4 py-1.5 text-xs font-medium bg-white text-black rounded-full shadow-sm">Exterior</button>
                    <button class="hover:text-white transition-colors text-xs font-medium text-neutral-400 rounded-full pt-1.5 pr-4 pb-1.5 pl-4">Interior</button>
                </div>
                
                <div class="w-px h-5 bg-white/10 mx-1"></div>
                
                <button class="p-2.5 text-neutral-500 hover:text-white hover:bg-white/5 rounded-full transition-all group relative">
                    <iconify-icon icon="solar:video-frame-linear" width="20" stroke-width="1.5"></iconify-icon>
                    <span class="absolute -top-10 left-1/2 -translate-x-1/2 bg-white text-black text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap">Cinematic</span>
                </button>
            </div>

            <!-- Contextual Hotspots -->
            <button class="absolute top-[45%] left-[25%] z-20 w-6 h-6 bg-white/10 border border-white/20 rounded-full flex items-center justify-center text-white hover:bg-white hover:text-black hover:scale-110 transition-all cursor-pointer group">
                <span class="w-1.5 h-1.5 bg-current rounded-full"></span>
                <div class="absolute left-8 top-1/2 -translate-y-1/2 w-max px-3 py-1.5 bg-black/90 border border-white/10 backdrop-blur-md rounded text-xs opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-white">Aerodynamic Front Fascia</div>
            </button>
        </div>

        <!-- Configuration Panel (Sidebar) -->
        <aside class="w-full lg:w-[420px] bg-[#0a0a0a] lg:border-l border-white/5 flex flex-col z-30 h-[50vh] lg:h-auto overflow-y-auto relative shadow-[0_-20px_50px_rgba(0,0,0,0.5)] lg:shadow-none">
            
            <div class="p-6 lg:p-8 flex-1 space-y-10">
                
                <!-- Title & Base Price -->
                <div class="space-y-1">
                    <div class="flex items-center gap-2 text-xs text-neutral-500 font-medium uppercase tracking-wider mb-2">
                        <span>Model 01</span>
                        <span class="w-1 h-1 rounded-full bg-neutral-700"></span>
                        <span>Performance</span>
                    </div>
                    <h1 class="text-3xl font-medium tracking-tighter text-white">Aero GT-R</h1>
                    <p class="text-sm text-neutral-400 mt-2">Dual Motor All-Wheel Drive</p>
                </div>

                <!-- Specs Grid -->
                <div class="grid grid-cols-3 gap-4 pb-8 border-b border-white/5">
                    <div class="flex flex-col space-y-1">
                        <span class="text-xl font-medium text-white tracking-tight">2.4s</span>
                        <span class="text-xs text-neutral-500">0-60 mph</span>
                    </div>
                    <div class="flex flex-col space-y-1">
                        <span class="text-xl font-medium text-white tracking-tight">410</span>
                        <span class="text-xs text-neutral-500">Mi Range</span>
                    </div>
                    <div class="flex flex-col space-y-1">
                        <span class="text-xl font-medium text-white tracking-tight">1020</span>
                        <span class="text-xs text-neutral-500">Peak HP</span>
                    </div>
                </div>

                <!-- Customizer: Paint -->
                <div class="space-y-4">
                    <div class="flex items-baseline justify-between">
                        <h2 class="text-sm font-medium text-white">Exterior Paint</h2>
                        <span class="text-xs text-neutral-400">Stealth Grey <span class="text-white ml-1">Included</span></span>
                    </div>
                    <div class="flex flex-wrap gap-4">
                        <label class="cursor-pointer group">
                            <input type="radio" name="paint" class="peer sr-only" checked="">
                            <div class="w-10 h-10 rounded-full bg-[#1c1c1e] ring-1 ring-white/10 peer-checked:ring-white peer-checked:ring-offset-4 peer-checked:ring-offset-[#0a0a0a] transition-all shadow-[inset_0_2px_4px_rgba(255,255,255,0.1)] group-hover:scale-110"></div>
                        </label>
                        <label class="cursor-pointer group">
                            <input type="radio" name="paint" class="peer sr-only">
                            <div class="w-10 h-10 rounded-full bg-[#f4f4f5] ring-1 ring-white/10 peer-checked:ring-white peer-checked:ring-offset-4 peer-checked:ring-offset-[#0a0a0a] transition-all shadow-[inset_0_-2px_4px_rgba(0,0,0,0.1)] group-hover:scale-110"></div>
                        </label>
                        <label class="cursor-pointer group">
                            <input type="radio" name="paint" class="peer sr-only">
                            <div class="w-10 h-10 rounded-full bg-[#030712] ring-1 ring-white/10 peer-checked:ring-white peer-checked:ring-offset-4 peer-checked:ring-offset-[#0a0a0a] transition-all shadow-[inset_0_2px_4px_rgba(255,255,255,0.05)] group-hover:scale-110"></div>
                        </label>
                        <label class="cursor-pointer group">
                            <input type="radio" name="paint" class="peer sr-only">
                            <div class="w-10 h-10 rounded-full bg-[#450a0a] ring-1 ring-white/10 peer-checked:ring-white peer-checked:ring-offset-4 peer-checked:ring-offset-[#0a0a0a] transition-all shadow-[inset_0_2px_4px_rgba(255,255,255,0.1)] group-hover:scale-110"></div>
                        </label>
                    </div>
                </div>

                <!-- Customizer: Wheels -->
                <div class="space-y-4">
                     <div class="flex items-baseline justify-between">
                         <h2 class="text-sm font-medium text-white">Wheels</h2>
                     </div>
                     <div class="grid grid-cols-1 gap-3">
                         <label class="cursor-pointer relative">
                             <input type="radio" name="wheels" class="peer sr-only" checked="">
                             <div class="w-full flex items-center justify-between border border-white/10 rounded-xl p-4 bg-white/[0.01] peer-checked:border-white/40 peer-checked:bg-white/[0.04] transition-all">
                                 <div class="flex items-center gap-4">
                                     <div class="w-12 h-12 rounded-full bg-neutral-900 flex items-center justify-center border border-white/5">
                                         <iconify-icon icon="solar:record-circle-linear" width="24" class="text-neutral-300"></iconify-icon>
                                     </div>
                                     <div class="flex flex-col">
                                         <span class="text-sm text-white font-medium">20" Cyber Wheels</span>
                                         <span class="text-xs text-neutral-500">Optimized for range</span>
                                     </div>
                                 </div>
                                 <span class="text-xs text-neutral-400">Included</span>
                             </div>
                             <!-- Selected Indicator -->
                             <div class="absolute top-4 right-4 w-4 h-4 rounded-full bg-white opacity-0 peer-checked:opacity-100 flex items-center justify-center transition-opacity">
                                 <iconify-icon icon="solar:check-read-linear" width="12" class="text-black"></iconify-icon>
                             </div>
                         </label>

                         <label class="cursor-pointer relative">
                             <input type="radio" name="wheels" class="peer sr-only">
                             <div class="w-full flex items-center justify-between border border-white/10 rounded-xl p-4 bg-white/[0.01] peer-checked:border-white/40 peer-checked:bg-white/[0.04] transition-all">
                                 <div class="flex items-center gap-4">
                                     <div class="w-12 h-12 rounded-full bg-neutral-900 flex items-center justify-center border border-white/5">
                                         <iconify-icon icon="solar:wheel-linear" width="24" class="text-neutral-300"></iconify-icon>
                                     </div>
                                     <div class="flex flex-col">
                                         <span class="text-sm text-white font-medium">22" Forged Turbine</span>
                                         <span class="text-xs text-neutral-500">Maximum performance</span>
                                     </div>
                                 </div>
                                 <span class="text-xs text-white">+$4,500</span>
                             </div>
                              <div class="absolute top-4 right-4 w-4 h-4 rounded-full bg-white opacity-0 peer-checked:opacity-100 flex items-center justify-center transition-opacity">
                                 <iconify-icon icon="solar:check-read-linear" width="12" class="text-black"></iconify-icon>
                             </div>
                         </label>
                     </div>
                </div>

                <!-- Software/Addons (Toggle) -->
                 <div class="space-y-4">
                    <h2 class="text-sm font-medium text-white">Software &amp; Autonomy</h2>
                    <label class="cursor-pointer flex items-start justify-between p-4 border border-white/10 rounded-xl hover:bg-white/[0.02] transition-colors">
                        <div class="flex flex-col pr-4 space-y-1">
                            <span class="text-sm text-white font-medium">Full Autonomous Capability</span>
                            <span class="text-xs text-neutral-500 leading-relaxed">Navigate on Autopilot, Auto Lane Change, Autopark, and Smart Summon.</span>
                            <span class="text-xs text-neutral-300 mt-2 block">+$12,000</span>
                        </div>
                        <div class="relative inline-flex items-center mt-1">
                          <input type="checkbox" class="sr-only peer">
                          <div class="w-9 h-5 bg-neutral-800 border border-white/10 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-neutral-400 after:border-transparent after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-white peer-checked:after:bg-black"></div>
                        </div>
                    </label>
                 </div>

            </div>

            <!-- Sticky Footer Summary -->
            <div class="p-6 lg:p-8 border-t border-white/5 bg-[#0a0a0a]/90 backdrop-blur-xl sticky bottom-0 z-10">
                <div class="flex items-end justify-between mb-5">
                    <div class="flex flex-col">
                        <span class="text-xs text-neutral-500 mb-1">Estimated Delivery: Oct-Nov</span>
                        <span class="text-sm font-medium text-neutral-300">Purchase Price</span>
                    </div>
                    <span class="text-2xl font-medium tracking-tighter text-white">$104,990</span>
                </div>
                <button class="w-full py-3.5 px-4 bg-white text-black text-sm font-medium rounded-lg hover:bg-neutral-200 transition-colors flex justify-center items-center gap-2 group">
                    Continue to Payment
                    <iconify-icon icon="solar:arrow-right-linear" width="18" class="group-hover:translate-x-1 transition-transform"></iconify-icon>
                </button>
            </div>
            
        </aside>
    </main>


</body></html>
