<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
fontFamily: {
sans: ['Manrope', 'sans-serif'],
serif: ['Playfair Display', 'serif'],
mono: ['JetBrains Mono', 'monospace'],

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
body {
background-color: #020617;
background-image:
radial-gradient(at 50% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
radial-gradient(at 100% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 50%);
color: #e2e8f0;
overflow-x: hidden;
}
/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #020617; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #475569; }
/* Glassmorphism Utilities */
.glass-panel {
background: rgba(15, 23, 42, 0.6);
backdrop-filter: blur(12px);
border: 1px solid rgba(255, 255, 255, 0.08);
}
.glass-input {
background: rgba(30, 41, 59, 0.5);
border: 1px solid rgba(255, 255, 255, 0.1);
backdrop-filter: blur(4px);
}
/* Signal Glows */
.glow-green { box-shadow: 0 0 20px -5px rgba(16, 185, 129, 0.3); }
.glow-orange { box-shadow: 0 0 20px -5px rgba(245, 158, 11, 0.3); }
.glow-red { box-shadow: 0 0 20px -5px rgba(244, 63, 94, 0.3); }
.glow-gray { box-shadow: 0 0 20px -5px rgba(148, 163, 184, 0.1); }
/* Smooth transitions */
.card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.card-hover:hover { transform: translateY(-4px); }
/* Select styling reset */
select {
-webkit-appearance: none;
-moz-appearance: none;
appearance: none;
background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
background-position: right 0.5rem center;
background-repeat: no-repeat;
background-size: 1.5em 1.5em;
}
</style></head>
<body class="font-sans antialiased min-h-screen pb-20 selection:bg-cyan-900 selection:text-cyan-50">

    <!-- Hero Section -->
    <header class="relative pt-16 pb-12 px-6 border-b border-white/5">
        <div class="max-w-7xl mx-auto text-center animate-slide-up" style="animation-delay: 0ms;">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs font-medium text-cyan-400 mb-6 backdrop-blur-sm">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                </span>
                LIVE ANALYSIS
            </div>
            
            <h1 class="font-serif text-5xl md:text-7xl font-medium text-white tracking-tight mb-4 leading-tight">
                Lensmen<span class="text-white/40 italic">Data</span>
            </h1>
            
            <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto font-light leading-relaxed mb-8">
                Automated signal analysis & curated verdicts from the archives of Malayalam Cinema.
            </p>

            <div class="flex items-center justify-center gap-2 text-xs text-slate-500 font-mono uppercase tracking-widest">
                <span class="iconify" data-icon="lucide:server" data-width="14"></span>
                <span id="last-updated">Updating...</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 -mt-8 relative z-10">
        
        <!-- Stats Grid -->
        <div id="stats-container" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12 animate-slide-up" style="animation-delay: 100ms;">
            <!-- Stats injected via JS -->
        </div>

        <!-- Filter Bar -->
        <div class="glass-panel rounded-xl p-4 md:p-5 mb-10 sticky top-4 z-40 shadow-2xl shadow-black/50 animate-slide-up" style="animation-delay: 200ms;">
            <div class="flex flex-col xl:flex-row gap-4 justify-between">
                
                <!-- Search & Sort -->
                <div class="flex flex-col md:flex-row gap-3 w-full xl:w-auto flex-shrink-0">
                    <div class="relative group w-full md:w-64">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors">
                            <span class="iconify" data-icon="lucide:search" data-width="16"></span>
                        </span>
                        <input type="text" id="search-input" placeholder="Search title..." 
                            class="w-full pl-10 pr-4 py-2.5 glass-input rounded-lg text-sm text-slate-200 placeholder:text-slate-600 focus:outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/50 transition-all">
                    </div>
                    
                    <div class="flex gap-3">
                        <div class="relative w-1/2 md:w-32">
                            <select id="sort-select" class="w-full pl-3 pr-8 py-2.5 glass-input rounded-lg text-sm text-slate-300 focus:outline-none focus:border-slate-500 cursor-pointer">
                                <option value="newest">Newest</option>
                                <option value="oldest">Oldest</option>
                                <option value="best">Best Signal</option>
                                <option value="worst">Worst Signal</option>
                            </select>
                        </div>
                        <div class="relative w-1/2 md:w-32">
                             <select id="decade-select" class="w-full pl-3 pr-8 py-2.5 glass-input rounded-lg text-sm text-slate-300 focus:outline-none focus:border-slate-500 cursor-pointer">
                                <option value="all">All Decades</option>
                                <option value="2020">2020s</option>
                                <option value="2010">2010s</option>
                                <option value="2000">2000s</option>
                                <option value="1990">1990s</option>
                                <option value="1980">1980s</option>
                                <option value="1970">1970s</option>
                                <option value="1960">1960s</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Signal Toggles -->
                <div class="flex flex-wrap items-center gap-2 w-full xl:justify-end">
                    <span class="text-xs text-slate-500 font-medium uppercase tracking-wider mr-1 hidden md:block">Verdict:</span>
                    
                    <button class="signal-filter px-3 py-1.5 rounded-lg border border-emerald-500/20 bg-emerald-500/10 text-emerald-400 text-xs font-medium hover:bg-emerald-500/20 transition-colors flex items-center gap-1.5 active" data-value="green">
                        <span class="iconify" data-icon="lucide:check" data-width="12"></span> Recommended
                    </button>
                    
                    <button class="signal-filter px-3 py-1.5 rounded-lg border border-amber-500/20 bg-amber-500/10 text-amber-400 text-xs font-medium hover:bg-amber-500/20 transition-colors flex items-center gap-1.5 active" data-value="orange">
                        <span class="iconify" data-icon="lucide:minus" data-width="12"></span> Not Bad
                    </button>
                    
                    <button class="signal-filter px-3 py-1.5 rounded-lg border border-rose-500/20 bg-rose-500/10 text-rose-400 text-xs font-medium hover:bg-rose-500/20 transition-colors flex items-center gap-1.5 active" data-value="red">
                        <span class="iconify" data-icon="lucide:x" data-width="12"></span> Avoid
                    </button>
                    
                    <button class="signal-filter px-3 py-1.5 rounded-lg border border-slate-500/20 bg-slate-500/10 text-slate-400 text-xs font-medium hover:bg-slate-500/20 transition-colors flex items-center gap-1.5 active" data-value="unknown">
                        <span class="iconify" data-icon="lucide:help-circle" data-width="12"></span> N/A
                    </button>
                </div>
            </div>
            
            <!-- Active Filters Summary -->
            <div class="mt-3 pt-3 border-t border-white/5 flex justify-between items-center">
                <div class="text-xs text-slate-500">
                    Showing <span id="filtered-count" class="text-slate-200 font-bold">0</span> of <span id="total-count">0</span> reviews
                </div>
                <button id="reset-filters" class="text-xs text-cyan-400 hover:text-cyan-300 hidden">Reset Filters</button>
            </div>
        </div>

        <!-- Content Grid -->
        <div id="movies-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-slide-up" style="animation-delay: 300ms;">
            <!-- Movies injected via JS -->
        </div>

        <!-- Footer -->
        <footer class="mt-20 pt-10 border-t border-white/5 text-center">
            <h2 class="font-serif text-2xl text-slate-600 mb-4">LENSMEN</h2>
            <p class="text-xs text-slate-500 mb-6">Designed for cinematic analysis. Data sourced from lensmenreviews.com</p>
            <div class="flex justify-center gap-6">
                <a href="#" class="text-slate-600 hover:text-white transition-colors"><span class="iconify" data-icon="lucide:github" data-width="20"></span></a>
                <a href="#" class="text-slate-600 hover:text-white transition-colors"><span class="iconify" data-icon="lucide:twitter" data-width="20"></span></a>
            </div>
        </footer>

    </main>

    <script>
        // --- DATA ---
        const data = {
            "scrape_date": "2025-12-26T12:45:27.107506",
            "base_url": "https://lensmenreviews.com/malayalam/",
            "total_movies": 5,
            "movies": [
                {
                    "title": "Bha Bha Ba Review | This Parallel-Universe Spoof Shouldn’t Have Left That Universe",
                    "url": "https://lensmenreviews.com/bha-bha-ba-malayalam-movie-review-2025/",
                    "year": "December 20, 2025",
                    "signal": "red",
                    "page_number": 1
                },
                {
                    "title": "Kalamkaval Review | Mammootty and Vinayakan Shine in This Satisfactory Reimagination of a Psychopath Story",
                    "url": "https://lensmenreviews.com/kalamkaval-malayalam-movie-review-2025/",
                    "year": "December 5, 2025",
                    "signal": "orange",
                    "page_number": 1
                },
                {
                    "title": "Vilaayath Buddha Review | A Labored Character Drama That Fails to Generate Empathy",
                    "url": "https://lensmenreviews.com/vilaayath-buddha-malayalam-movie-review-2025/",
                    "year": "December 1, 2025",
                    "signal": "red",
                    "page_number": 1
                },
                {
                    "title": "Eko Review | A Modern-Day Masterclass in Building Intrigue",
                    "url": "https://lensmenreviews.com/eko-malayalam-movie-review-2025/",
                    "year": "November 30, 2025",
                    "signal": "green",
                    "page_number": 1
                },
                {
                    "title": "Jacobinte Swargarajyam",
                    "url": "https://lensmenreviews.com/jacobinte-swargarajyam-malayalam-movie-review-2016/",
                    "year": "April 8, 2016",
                    "signal": "unknown",
                    "page_number": 101
                }
            ],
            "statistics": {
                "green": 1,
                "orange": 1,
                "red": 2,
                "unknown": 1
            }
        };

        // --- CONFIG & UTILS ---
        const config = {
            green: { label: 'Recommended', color: 'text-emerald-400', glow: 'glow-green', border: 'border-emerald-500/40', bg: 'bg-emerald-950/30', icon: 'lucide:check-circle-2' },
            orange: { label: 'Not Bad', color: 'text-amber-400', glow: 'glow-orange', border: 'border-amber-500/40', bg: 'bg-amber-950/30', icon: 'lucide:minus-circle' },
            red: { label: 'Avoid', color: 'text-rose-400', glow: 'glow-red', border: 'border-rose-500/40', bg: 'bg-rose-950/30', icon: 'lucide:x-octagon' },
            unknown: { label: 'No Verdict', color: 'text-slate-400', glow: 'glow-gray', border: 'border-slate-700/50', bg: 'bg-slate-900/50', icon: 'lucide:help-circle' }
        };

        const formatDate = (str) => {
            const d = new Date(str);
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        };

        // Parse Year from Date String (e.g., "December 20, 2025" -> 2025)
        const getYearFromDate = (dateStr) => {
            const d = new Date(dateStr);
            return isNaN(d) ? 0 : d.getFullYear();
        };

        // --- STATE ---
        let state = {
            search: '',
            decade: 'all',
            sort: 'newest',
            signals: new Set(['green', 'orange', 'red', 'unknown'])
        };

        // --- RENDERERS ---

        function renderStats() {
            const container = document.getElementById('stats-container');
            container.innerHTML = '';
            
            const stats = [
                { key: 'green', count: data.statistics.green, conf: config.green },
                { key: 'orange', count: data.statistics.orange, conf: config.orange },
                { key: 'red', count: data.statistics.red, conf: config.red },
                { key: 'unknown', count: data.statistics.unknown, conf: config.unknown },
            ];

            stats.forEach(stat => {
                const div = document.createElement('div');
                div.className = `relative overflow-hidden rounded-2xl border ${stat.conf.border} bg-[#0f172a] p-5 flex flex-col justify-between h-32 hover:scale-[1.02] transition-transform duration-300 group cursor-default`;
                
                // Background Glow
                div.innerHTML = `
                    <div class="absolute -right-6 -top-6 w-24 h-24 rounded-full ${stat.conf.bg.replace('/30','')} opacity-20 blur-2xl group-hover:opacity-40 transition-opacity"></div>
                    <div class="flex justify-between items-start z-10">
                        <span class="text-xs font-bold uppercase tracking-widest text-slate-500 group-hover:text-slate-300 transition-colors">${stat.conf.label}</span>
                        <span class="iconify ${stat.conf.color}" data-icon="${stat.conf.icon}" data-width="20"></span>
                    </div>
                    <div class="z-10">
                        <div class="text-4xl font-serif font-medium text-white tracking-tight ${stat.conf.glow}">${stat.count}</div>
                        <div class="w-full bg-slate-800 h-1 mt-3 rounded-full overflow-hidden">
                            <div class="h-full ${stat.conf.bg.replace('/30','')} opacity-80" style="width: ${(stat.count / data.total_movies) * 100}%"></div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderGrid(filteredMovies) {
            const grid = document.getElementById('movies-grid');
            grid.innerHTML = '';

            if (filteredMovies.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-20 text-center border border-dashed border-slate-800 rounded-xl bg-slate-900/50">
                        <span class="iconify mx-auto text-slate-600 mb-3" data-icon="lucide:film" data-width="40"></span>
                        <h3 class="text-slate-400 font-medium">No reviews found</h3>
                        <p class="text-slate-600 text-sm mt-1">Try adjusting your filters</p>
                    </div>
                `;
                return;
            }

            filteredMovies.forEach(movie => {
                const conf = config[movie.signal] || config.unknown;
                
                // Title Split Logic
                let mainTitle = movie.title;
                let subTitle = '';
                if(movie.title.includes('|')) {
                    const parts = movie.title.split('|');
                    mainTitle = parts[0].trim();
                    subTitle = parts[1].trim();
                }

                const card = document.createElement('a');
                card.href = movie.url;
                card.target = "_blank";
                card.className = `group relative flex flex-col h-full bg-[#0f172a] border border-slate-800 rounded-xl overflow-hidden card-hover hover:border-slate-600 hover:shadow-2xl`;
                
                // Card visual indicator strip
                const indicatorColor = conf.color.replace('text-', 'bg-'); // simplistic color swap
                
                card.innerHTML = `
                    <!-- Top Signal Bar -->
                    <div class="h-1 w-full ${indicatorColor} opacity-70 group-hover:opacity-100 shadow-[0_0_10px_rgba(0,0,0,0.5)] transition-all"></div>
                    
                    <div class="p-6 flex flex-col h-full">
                        <div class="flex justify-between items-start mb-4">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider border ${conf.border} ${conf.bg} ${conf.color}">
                                <span class="iconify" data-icon="${conf.icon}" data-width="12"></span>
                                ${conf.label}
                            </span>
                            <span class="text-xs font-mono text-slate-500">${getYearFromDate(movie.year)}</span>
                        </div>

                        <h3 class="font-serif text-xl text-slate-100 font-medium leading-snug mb-2 group-hover:text-cyan-400 transition-colors">
                            ${mainTitle}
                        </h3>
                        
                        ${subTitle ? `<p class="text-sm text-slate-400 leading-relaxed line-clamp-3 mb-6 flex-grow border-l-2 border-slate-800 pl-3 italic">${subTitle}</p>` : '<div class="flex-grow"></div>'}

                        <div class="pt-4 border-t border-slate-800 flex items-center justify-between mt-auto">
                            <span class="text-xs text-slate-500">${formatDate(movie.year)}</span>
                            <span class="flex items-center gap-1 text-xs font-bold text-cyan-500 uppercase tracking-wider group-hover:translate-x-1 transition-transform">
                                Read Review <span class="iconify" data-icon="lucide:arrow-right" data-width="14"></span>
                            </span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- LOGIC ---

        function filterAndRender() {
            let result = data.movies.filter(m => {
                // Search
                const searchMatch = m.title.toLowerCase().includes(state.search.toLowerCase());
                
                // Signal
                const signalMatch = state.signals.has(m.signal);
                
                // Decade
                let decadeMatch = true;
                if(state.decade !== 'all') {
                    const year = getYearFromDate(m.year);
                    const decadeStart = parseInt(state.decade);
                    decadeMatch = year >= decadeStart && year < decadeStart + 10;
                }

                return searchMatch && signalMatch && decadeMatch;
            });

            // Sorting
            result.sort((a, b) => {
                const dateA = new Date(a.year);
                const dateB = new Date(b.year);
                
                if (state.sort === 'newest') return dateB - dateA;
                if (state.sort === 'oldest') return dateA - dateB;
                
                // Custom ranking for "Best/Worst"
                const rank = { green: 3, orange: 2, unknown: 1, red: 0 };
                if (state.sort === 'best') return rank[b.signal] - rank[a.signal];
                if (state.sort === 'worst') return rank[a.signal] - rank[b.signal];
                
                return 0;
            });

            // Update UI
            renderGrid(result);
            document.getElementById('filtered-count').innerText = result.length;
            
            // Show reset button if filtered
            const resetBtn = document.getElementById('reset-filters');
            if(result.length !== data.movies.length) {
                resetBtn.classList.remove('hidden');
            } else {
                resetBtn.classList.add('hidden');
            }
        }

        // --- EVENT LISTENERS ---

        document.getElementById('search-input').addEventListener('input', (e) => {
            state.search = e.target.value;
            filterAndRender();
        });

        document.getElementById('sort-select').addEventListener('change', (e) => {
            state.sort = e.target.value;
            filterAndRender();
        });

        document.getElementById('decade-select').addEventListener('change', (e) => {
            state.decade = e.target.value;
            filterAndRender();
        });

        document.querySelectorAll('.signal-filter').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const val = btn.dataset.value;
                
                // Toggle visual state
                if (state.signals.has(val)) {
                    // Prevent removing the last signal (UX choice)
                    if (state.signals.size > 1) {
                        state.signals.delete(val);
                        btn.classList.remove('active');
                        btn.classList.add('opacity-50', 'grayscale');
                        btn.classList.remove('bg-opacity-10');
                    }
                } else {
                    state.signals.add(val);
                    btn.classList.add('active');
                    btn.classList.remove('opacity-50', 'grayscale');
                }
                filterAndRender();
            });
        });

        document.getElementById('reset-filters').addEventListener('click', () => {
            state.search = '';
            state.decade = 'all';
            state.signals = new Set(['green', 'orange', 'red', 'unknown']);
            document.getElementById('search-input').value = '';
            document.getElementById('decade-select').value = 'all';
            
            document.querySelectorAll('.signal-filter').forEach(btn => {
                btn.classList.add('active');
                btn.classList.remove('opacity-50', 'grayscale');
            });
            
            filterAndRender();
        });

        // --- INIT ---
        document.getElementById('last-updated').innerText = formatDate(data.scrape_date);
        document.getElementById('total-count').innerText = data.total_movies;
        renderStats();
        filterAndRender();

    </script>
</body>
</html>
