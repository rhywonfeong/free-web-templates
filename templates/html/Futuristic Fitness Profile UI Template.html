<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Futuristic Fitness Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
</style></head>
<body class="bg-[#050a08] text-slate-200 min-h-screen relative overflow-x-hidden selection:bg-emerald-500/30 selection:text-emerald-200">

    <!-- Ambient Background Effects -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-3xl h-[500px] bg-emerald-900/20 blur-[120px] rounded-full pointer-events-none -z-10"></div>
    <div class="fixed bottom-0 right-0 w-[300px] h-[300px] bg-emerald-900/10 blur-[100px] rounded-full pointer-events-none -z-10"></div>

    <main class="max-w-md mx-auto px-6 py-10 pb-20 relative z-10">
        
        <!-- Header -->
        <header class="flex justify-center items-center mb-8">
            <h1 class="text-lg font-medium tracking-tight text-white/90">Profile</h1>
        </header>

        <!-- Profile Info -->
        <section class="flex flex-col items-center text-center mb-10">
            <div class="relative group cursor-pointer">
                <!-- Outer Glow Ring -->
                <div class="absolute -inset-1 bg-gradient-to-tr from-emerald-600 to-emerald-900 rounded-full blur opacity-40 group-hover:opacity-75 transition duration-500"></div>
                <!-- Avatar -->
                <div class="relative w-28 h-28 rounded-full p-[2px] bg-gradient-to-b from-emerald-500/20 to-transparent overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
                         alt="User" 
                         class="w-full h-full rounded-full object-cover border-4 border-[#050a08]">
                </div>
                <!-- Status Indicator -->
                <div class="absolute bottom-2 right-2 w-4 h-4 bg-emerald-500 rounded-full border-4 border-[#050a08]"></div>
            </div>

            <h2 class="mt-5 text-3xl font-medium tracking-tight text-white">Jane Doe</h2>
            <p class="text-emerald-400 text-lg font-normal mb-3">@janedoe</p>
            
            <p class="text-slate-400 text-lg leading-relaxed max-w-xs font-light">
                Fitness enthusiast chasing PRs. Building strength one rep at a time. <span class="text-emerald-400 inline-block align-middle"><i data-lucide="sprout" class="w-4 h-4"></i></span>
            </p>
        </section>

        <!-- Stats Grid -->
        <section class="grid grid-cols-2 gap-3 mb-10">
            <!-- Card 1 -->
            <div class="bg-white/[0.03] border border-white/[0.08] backdrop-blur-sm rounded-2xl p-5 flex flex-col items-center justify-center hover:bg-white/[0.06] transition-colors duration-300 group">
                <span class="text-3xl font-medium tracking-tight text-white mb-1 group-hover:scale-105 transition-transform duration-300">180</span>
                <span class="text-xs font-medium tracking-widest uppercase text-slate-500">Following</span>
            </div>
            <!-- Card 2 -->
            <div class="bg-white/[0.03] border border-white/[0.08] backdrop-blur-sm rounded-2xl p-5 flex flex-col items-center justify-center hover:bg-white/[0.06] transition-colors duration-300 group">
                <span class="text-3xl font-medium tracking-tight text-white mb-1 group-hover:scale-105 transition-transform duration-300">210</span>
                <span class="text-xs font-medium tracking-widest uppercase text-slate-500">Followers</span>
            </div>
            <!-- Card 3 -->
            <div class="bg-gradient-to-br from-emerald-950/30 to-emerald-900/10 border border-emerald-500/20 backdrop-blur-sm rounded-2xl p-5 flex flex-col items-center justify-center group relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-emerald-500 to-transparent opacity-50"></div>
                <div class="flex items-center gap-2 mb-1">
                    <i data-lucide="flame" class="w-5 h-5 text-emerald-400 fill-emerald-400/20"></i>
                    <span class="text-3xl font-medium tracking-tight text-emerald-50">24</span>
                </div>
                <span class="text-xs font-medium tracking-widest uppercase text-emerald-500/80">Streak</span>
            </div>
            <!-- Card 4 -->
            <div class="bg-white/[0.03] border border-white/[0.08] backdrop-blur-sm rounded-2xl p-5 flex flex-col items-center justify-center hover:bg-white/[0.06] transition-colors duration-300 group">
                <span class="text-3xl font-medium tracking-tight text-white mb-1 group-hover:scale-105 transition-transform duration-300">152</span>
                <span class="text-xs font-medium tracking-widest uppercase text-slate-500">Workouts</span>
            </div>
        </section>

        <!-- Recent Photos -->
        <section class="mb-10">
            <div class="flex justify-between items-end mb-5">
                <h3 class="text-xl font-medium tracking-tight text-white">Recent Photos</h3>
                <button class="text-sm font-medium text-emerald-400 hover:text-emerald-300 transition-colors">View All</button>
            </div>
            
            <div class="grid grid-cols-3 gap-3">
                <div class="aspect-[3/4] rounded-xl overflow-hidden border border-white/[0.08] group relative cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Workout" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                    <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div>
                </div>
                <div class="aspect-[3/4] rounded-xl overflow-hidden border border-white/[0.08] group relative cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Workout" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                    <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div>
                </div>
                <div class="aspect-[3/4] rounded-xl overflow-hidden border border-white/[0.08] group relative cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1518310383802-640c2de311b2?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80" alt="Workout" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                    <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div>
                </div>
            </div>
        </section>

        <!-- Lifetime Stats -->
        <section class="mb-10">
            <div class="flex justify-between items-end mb-5">
                <h3 class="text-xl font-medium tracking-tight text-white">Lifetime Stats</h3>
            </div>

            <div class="space-y-3">
                <!-- Stat Item 1 -->
                <div class="flex items-center justify-between p-4 rounded-2xl bg-white/[0.03] border border-white/[0.05] hover:bg-white/[0.05] transition-colors">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 flex items-center justify-center border border-emerald-500/20 text-emerald-400">
                            <i data-lucide="dumbbell" class="w-6 h-6"></i>
                        </div>
                        <span class="text-lg font-normal text-slate-300">Total Workouts</span>
                    </div>
                    <span class="text-xl font-medium text-white tracking-tight">152</span>
                </div>

                <!-- Stat Item 2 -->
                <div class="flex items-center justify-between p-4 rounded-2xl bg-white/[0.03] border border-white/[0.05] hover:bg-white/[0.05] transition-colors">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 flex items-center justify-center border border-emerald-500/20 text-emerald-400">
                            <i data-lucide="weight" class="w-6 h-6"></i>
                        </div>
                        <span class="text-lg font-normal text-slate-300">Total Volume</span>
                    </div>
                    <span class="text-xl font-medium text-white tracking-tight">1.9M <span class="text-sm font-normal text-slate-500 ml-1">lbs</span></span>
                </div>

                <!-- Stat Item 3 -->
                <div class="flex items-center justify-between p-4 rounded-2xl bg-white/[0.03] border border-white/[0.05] hover:bg-white/[0.05] transition-colors">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-emerald-500/10 flex items-center justify-center border border-emerald-500/20 text-emerald-400">
                            <i data-lucide="trophy" class="w-6 h-6"></i>
                        </div>
                        <span class="text-lg font-normal text-slate-300">Total PRs</span>
                    </div>
                    <span class="text-xl font-medium text-white tracking-tight">48</span>
                </div>
            </div>
        </section>

        <!-- Achievements -->
        <section class="mb-5">
            <div class="flex justify-between items-end mb-6">
                <h3 class="text-xl font-medium tracking-tight text-white">Achievements</h3>
                <button class="text-sm font-medium text-emerald-400 hover:text-emerald-300 transition-colors">See All</button>
            </div>

            <div class="flex justify-between items-start gap-2">
                <!-- Badge 1 -->
                <div class="flex flex-col items-center gap-3 w-1/4">
                    <div class="relative group">
                        <div class="absolute -inset-2 bg-emerald-500/20 blur-md rounded-full opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="w-16 h-16 rounded-full border border-emerald-500 text-emerald-400 flex items-center justify-center bg-emerald-950/30 relative z-10">
                            <i data-lucide="flame" class="w-8 h-8 fill-current"></i>
                        </div>
                    </div>
                    <span class="text-xs font-medium text-white text-center">7-Day Streak</span>
                </div>

                <!-- Badge 2 -->
                <div class="flex flex-col items-center gap-3 w-1/4">
                    <div class="w-16 h-16 rounded-full border border-white/10 text-slate-400 flex items-center justify-center bg-white/[0.03]">
                        <i data-lucide="biceps-flexed" class="w-8 h-8"></i>
                    </div>
                    <span class="text-xs font-medium text-white text-center">100 Workouts</span>
                </div>

                <!-- Badge 3 -->
                <div class="flex flex-col items-center gap-3 w-1/4">
                    <div class="w-16 h-16 rounded-full border border-white/10 text-slate-400 flex items-center justify-center bg-white/[0.03]">
                        <i data-lucide="badge-check" class="w-8 h-8"></i>
                    </div>
                    <span class="text-xs font-medium text-white text-center">Verified</span>
                </div>

                <!-- Badge 4 (Locked) -->
                <div class="flex flex-col items-center gap-3 w-1/4">
                    <div class="w-16 h-16 rounded-full border border-white/5 text-white/10 flex items-center justify-center bg-white/[0.02]">
                        <i data-lucide="lock" class="w-8 h-8"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-600 text-center">Powerlifter</span>
                </div>
            </div>
        </section>

    </main>

    <script>
        lucide.createIcons({
            attrs: {
                'stroke-width': 1.5
            }
        });
    </script>
</body>
</html>
