<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mobile Finance App</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-gray-100 text-gray-900 antialiased flex items-center justify-center min-h-screen selection:bg-gray-200" style="font-family: 'Inter', sans-serif;">

    <!-- Mobile Device Container -->
    <main class="w-full max-w-md h-[100dvh] bg-gray-50 flex flex-col overflow-hidden shadow-2xl relative sm:ring-1 sm:ring-gray-200 sm:rounded-[2.5rem]">
        
        <!-- Header -->
        <header class="px-6 pt-10 pb-4 flex items-center justify-between bg-gray-50 z-10 relative shrink-0">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-full bg-white border border-gray-200 shadow-sm flex items-center justify-center overflow-hidden">
                    <img src="https://i.pravatar.cc/150?img=32" alt="Profile" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col">
                    <span class="text-xs text-gray-500 font-medium">Good morning</span>
                    <span class="text-base tracking-tighter font-semibold">MNY</span>
                </div>
            </div>
            <button class="w-10 h-10 bg-white border border-gray-200 rounded-full shadow-sm flex items-center justify-center text-gray-600 hover:text-gray-900 transition-colors relative">
                <div class="absolute top-2.5 right-2.5 w-2 h-2 bg-gray-900 rounded-full border-2 border-white"></div>
                <iconify-icon icon="solar:bell-linear" style="stroke-width: 1.5;" class="text-lg"></iconify-icon>
            </button>
        </header>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto pb-32">
            
            <!-- Balance Card -->
            <section class="px-6 py-2 relative z-10">
                <div class="bg-white border border-gray-200 rounded-3xl p-6 shadow-sm flex flex-col gap-8 relative overflow-hidden">
                    <!-- Subtle background decoration -->
                    <div class="absolute top-0 right-0 w-40 h-40 bg-gray-50 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>
                    
                    <div class="z-10 flex flex-col gap-1.5">
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-gray-500 font-medium">Total Balance</span>
                            <iconify-icon icon="solar:eye-linear" style="stroke-width: 1.5;" class="text-gray-400 text-sm cursor-pointer"></iconify-icon>
                        </div>
                        <h1 class="text-4xl font-semibold tracking-tight text-gray-900">$12,480.00</h1>
                        <span class="text-xs text-emerald-600 font-medium bg-emerald-50 px-2 py-1 rounded-md w-fit mt-1">+2.4% from last month</span>
                    </div>

                    <div class="z-10 flex items-center gap-3">
                        <button class="flex-1 bg-gray-900 text-white py-3.5 rounded-2xl text-sm font-medium flex justify-center items-center gap-2 hover:bg-gray-800 active:scale-[0.98] transition-all">
                            <iconify-icon icon="solar:arrow-right-up-linear" style="stroke-width: 1.5;" class="text-base"></iconify-icon>
                            Send
                        </button>
                        <button class="flex-1 bg-white border border-gray-200 shadow-sm text-gray-900 py-3.5 rounded-2xl text-sm font-medium flex justify-center items-center gap-2 hover:bg-gray-50 active:scale-[0.98] transition-all">
                            <iconify-icon icon="solar:arrow-left-down-linear" style="stroke-width: 1.5;" class="text-base"></iconify-icon>
                            Receive
                        </button>
                    </div>
                </div>
            </section>

            <!-- Auto-Save Toggle -->
            <div class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-2xl mx-6 mt-4 mb-2 shadow-sm">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-900">
                        <iconify-icon icon="solar:magic-stick-3-linear" style="stroke-width: 1.5;" class="text-base"></iconify-icon>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-sm font-medium text-gray-900">Smart Savings</span>
                        <span class="text-xs text-gray-500">Auto-invest spare change</span>
                    </div>
                </div>
                <!-- Custom Toggle -->
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" value="" class="sr-only peer" checked="">
                    <div class="w-10 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-gray-900"></div>
                </label>
            </div>

            <!-- Recent Activity -->
            <section class="mt-6 px-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-semibold tracking-tight text-gray-900">Activity</h2>
                    <button class="text-sm text-gray-500 hover:text-gray-900 font-medium transition-colors">See all</button>
                </div>

                <div class="flex flex-col gap-5">
                    <!-- Item 1 -->
                    <div class="flex items-center justify-between group cursor-pointer active:opacity-70 transition-opacity">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center border border-gray-200 text-gray-700 shadow-sm">
                                <iconify-icon icon="solar:cup-hot-linear" style="stroke-width: 1.5;" class="text-xl"></iconify-icon>
                            </div>
                            <div class="flex flex-col gap-0.5">
                                <span class="text-sm font-medium text-gray-900">Coffee Shop</span>
                                <span class="text-xs text-gray-500">Today, 9:41 AM</span>
                            </div>
                        </div>
                        <span class="text-sm font-medium text-gray-900">-$4.50</span>
                    </div>

                    <!-- Item 2 -->
                    <div class="flex items-center justify-between group cursor-pointer active:opacity-70 transition-opacity">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center border border-gray-200 text-gray-700 shadow-sm">
                                <iconify-icon icon="solar:cart-large-linear" style="stroke-width: 1.5;" class="text-xl"></iconify-icon>
                            </div>
                            <div class="flex flex-col gap-0.5">
                                <span class="text-sm font-medium text-gray-900">Grocery Store</span>
                                <span class="text-xs text-gray-500">Yesterday</span>
                            </div>
                        </div>
                        <span class="text-sm font-medium text-gray-900">-$62.00</span>
                    </div>

                    <!-- Item 3 -->
                    <div class="flex items-center justify-between group cursor-pointer active:opacity-70 transition-opacity">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-gray-900 rounded-2xl flex items-center justify-center border border-gray-800 text-white shadow-sm">
                                <iconify-icon icon="solar:wallet-money-linear" style="stroke-width: 1.5;" class="text-xl"></iconify-icon>
                            </div>
                            <div class="flex flex-col gap-0.5">
                                <span class="text-sm font-medium text-gray-900">Salary Deposit</span>
                                <span class="text-xs text-gray-500">Mon, 12 Aug</span>
                            </div>
                        </div>
                        <span class="text-sm font-medium text-emerald-600">+$3,200.00</span>
                    </div>

                    <!-- Item 4 -->
                    <div class="flex items-center justify-between group cursor-pointer active:opacity-70 transition-opacity">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center border border-gray-200 text-gray-700 shadow-sm">
                                <iconify-icon icon="solar:music-note-linear" style="stroke-width: 1.5;" class="text-xl"></iconify-icon>
                            </div>
                            <div class="flex flex-col gap-0.5">
                                <span class="text-sm font-medium text-gray-900">Spotify</span>
                                <span class="text-xs text-gray-500">Sun, 11 Aug</span>
                            </div>
                        </div>
                        <span class="text-sm font-medium text-gray-900">-$10.99</span>
                    </div>

                    <!-- Item 5 -->
                    <div class="flex items-center justify-between group cursor-pointer active:opacity-70 transition-opacity">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center border border-gray-200 text-gray-700 shadow-sm">
                                <iconify-icon icon="solar:smartphone-linear" style="stroke-width: 1.5;" class="text-xl"></iconify-icon>
                            </div>
                            <div class="flex flex-col gap-0.5">
                                <span class="text-sm font-medium text-gray-900">Phone Bill</span>
                                <span class="text-xs text-gray-500">Fri, 9 Aug</span>
                            </div>
                        </div>
                        <span class="text-sm font-medium text-gray-900">-$45.00</span>
                    </div>
                </div>
            </section>
        </div>

        <!-- Bottom Navigation -->
        <nav class="absolute bottom-0 w-full bg-white/80 backdrop-blur-xl border-t border-gray-200 px-8 py-5 pb-8 flex justify-between items-center z-50">
            <button class="text-gray-900 flex flex-col items-center justify-center active:scale-95 transition-transform">
                <iconify-icon icon="solar:home-smile-linear" style="stroke-width: 1.5;" class="text-2xl"></iconify-icon>
            </button>
            <button class="text-gray-400 hover:text-gray-900 flex flex-col items-center justify-center active:scale-95 transition-all">
                <iconify-icon icon="solar:pie-chart-2-linear" style="stroke-width: 1.5;" class="text-2xl"></iconify-icon>
            </button>
            
            <!-- Center Action Button -->
            <button class="relative -top-6 bg-gray-900 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-lg shadow-gray-900/20 hover:bg-gray-800 hover:-translate-y-1 active:scale-95 transition-all">
                <iconify-icon icon="solar:scanner-linear" style="stroke-width: 1.5;" class="text-2xl"></iconify-icon>
            </button>

            <button class="text-gray-400 hover:text-gray-900 flex flex-col items-center justify-center active:scale-95 transition-all">
                <iconify-icon icon="solar:card-linear" style="stroke-width: 1.5;" class="text-2xl"></iconify-icon>
            </button>
            <button class="text-gray-400 hover:text-gray-900 flex flex-col items-center justify-center active:scale-95 transition-all">
                <iconify-icon icon="solar:user-linear" style="stroke-width: 1.5;" class="text-2xl"></iconify-icon>
            </button>
        </nav>
        
    </main>


</body></html>
