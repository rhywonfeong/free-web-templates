<!DOCTYPE html>
<html lang="en" class="antialiased">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consistency | Habit Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
fontFamily: { sans: ['Inter', 'sans-serif'] },
transitionTimingFunction: {
'spring': 'cubic-bezier(0.175, 0.885, 0.32, 1.275)',
}
}
}
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-700 font-sans selection:bg-neutral-200 dark:selection:bg-neutral-800 relative overflow-x-hidden">

    <!-- App Container -->
    <main class="w-full max-w-[880px] bg-white dark:bg-neutral-900 rounded-3xl shadow-[0_8px_40px_rgb(0,0,0,0.04)] dark:shadow-[0_8px_40px_rgb(0,0,0,0.2)] border border-neutral-100 dark:border-neutral-800/60 p-6 md:p-10 relative flex flex-col gap-8 opacity-0 translate-y-8 transition-all duration-1000 ease-out" id="app-card" style="transform: translateY(20px);">
        
        <!-- Header -->
        <header class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-neutral-100 dark:bg-neutral-800/80 flex items-center justify-center shadow-sm">
                    <iconify-icon icon="solar:leaf-linear" stroke-width="1.5" class="text-xl text-neutral-800 dark:text-neutral-200"></iconify-icon>
                </div>
                <h1 class="text-xl md:text-2xl font-medium tracking-tight">Consistency</h1>
            </div>
            <button id="theme-toggle" class="p-2.5 rounded-full hover:bg-neutral-100 dark:hover:bg-neutral-800 transition-all duration-300 text-neutral-400 hover:text-neutral-900 dark:hover:text-white active:scale-95" aria-label="Toggle Dark Mode">
                <iconify-icon icon="solar:moon-linear" stroke-width="1.5" class="text-xl transition-transform duration-500" id="theme-icon"></iconify-icon>
            </button>
        </header>

        <!-- Input Section -->
        <form id="add-form" class="relative group">
            <iconify-icon icon="solar:add-circle-linear" stroke-width="1.5" class="absolute left-4 top-1/2 -translate-y-1/2 text-neutral-400 group-focus-within:text-neutral-900 dark:group-focus-within:text-white transition-colors duration-300 text-lg"></iconify-icon>
            <input type="text" id="habit-input" placeholder="Add a new habit... (Press Enter)" class="w-full bg-neutral-50/50 dark:bg-neutral-950/30 border border-neutral-200 dark:border-neutral-800 rounded-2xl py-3.5 pl-12 pr-4 text-sm font-medium focus:outline-none focus:ring-4 focus:ring-neutral-900/5 dark:focus:ring-white/5 focus:border-neutral-300 dark:focus:border-neutral-700 transition-all duration-300 placeholder:text-neutral-400 dark:placeholder:text-neutral-600 placeholder:font-normal" autocomplete="off">
        </form>

        <!-- Habit Table Area -->
        <div class="w-full overflow-x-auto pb-2 -mx-4 px-4 md:mx-0 md:px-0 scroll-smooth" style="scrollbar-width: none;">
            <div class="min-w-[560px]">
                <!-- Table Header (Days) -->
                <div class="grid grid-cols-[1fr_repeat(7,minmax(32px,40px))] gap-2 md:gap-3 mb-3 px-2 border-b border-neutral-100 dark:border-neutral-800 pb-3">
                    <div class="text-xs font-medium text-neutral-400 dark:text-neutral-500 tracking-wide uppercase">Habit</div>
                    <div class="text-xs font-medium text-neutral-400 dark:text-neutral-500 text-center">M</div>
                    <div class="text-xs font-medium text-neutral-400 dark:text-neutral-500 text-center">T</div>
                    <div class="text-xs font-medium text-neutral-400 dark:text-neutral-500 text-center">W</div>
                    <div class="text-xs font-medium text-neutral-400 dark:text-neutral-500 text-center">T</div>
                    <div class="text-xs font-medium text-neutral-400 dark:text-neutral-500 text-center">F</div>
                    <div class="text-xs font-medium text-neutral-400 dark:text-neutral-500 text-center">S</div>
                    <div class="text-xs font-medium text-neutral-400 dark:text-neutral-500 text-center">S</div>
                </div>

                <!-- Habits List -->
                <div id="habit-list" class="flex flex-col gap-1 min-h-[120px]">
                    <!-- Rows injected by JS -->
                </div>
            </div>
        </div>

        <!-- Footer Stats -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-6 pt-6 border-t border-neutral-100 dark:border-neutral-800 mt-2">
            <div class="flex-1 w-full max-w-sm">
                <div class="flex justify-between items-center mb-2.5">
                    <span class="text-xs font-medium text-neutral-500 dark:text-neutral-400">Weekly Progress</span>
                    <span class="text-xs font-medium tracking-tight" id="progress-text">0%</span>
                </div>
                <div class="h-2 w-full bg-neutral-100 dark:bg-neutral-800/80 rounded-full overflow-hidden shadow-inner">
                    <div id="progress-bar" class="h-full bg-neutral-900 dark:bg-white rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
                </div>
            </div>
            <div class="flex items-center gap-3.5 bg-neutral-50 dark:bg-neutral-800/40 px-4 py-2.5 rounded-2xl border border-neutral-100 dark:border-neutral-800/80 shadow-sm transition-all duration-300 hover:shadow-md">
                <iconify-icon icon="solar:fire-linear" stroke-width="1.5" class="text-orange-500 text-xl"></iconify-icon>
                <div class="flex flex-col">
                    <span class="text-sm font-medium tracking-tight leading-none mb-1" id="streak-count">0 Days</span>
                    <span class="text-[10px] text-neutral-400 dark:text-neutral-500 font-medium uppercase tracking-wide leading-none">Current Streak</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Motivational Overlay -->
    <div id="motivational-overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-white/70 dark:bg-neutral-950/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-1000 ease-in-out">
        <h2 class="text-xl md:text-2xl font-medium tracking-tight text-neutral-900 dark:text-white max-w-md text-center leading-relaxed px-6 transform translate-y-6 transition-transform duration-1000 ease-out" id="overlay-text">
            It's not about intensity — it's about consistency.
        </h2>
    </div>

    <script>
        const STORAGE_KEY = 'premium_habit_tracker_data';
        let habits = [];

        // DOM Elements
        const form = document.getElementById('add-form');
        const input = document.getElementById('habit-input');
        const listContainer = document.getElementById('habit-list');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const streakCount = document.getElementById('streak-count');
        const themeBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlDoc = document.documentElement;

        // --- Core Logic ---

        function init() {
            initTheme();
            const stored = localStorage.getItem(STORAGE_KEY);
            
            // App reveal animation
            setTimeout(() => {
                const card = document.getElementById('app-card');
                card.classList.remove('opacity-0');
                card.style.transform = 'translateY(0)';
            }, 150);

            if (stored) {
                habits = JSON.parse(stored);
                if(habits.length > 0) {
                    renderAll();
                    updateStats();
                } else {
                    runIntroSequence();
                }
            } else {
                runIntroSequence();
            }

            setupEventListeners();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
        }

        // --- Animations & UI ---

        async function runIntroSequence() {
            input.disabled = true;
            checkEmptyState();
            
            await new Promise(r => setTimeout(r, 800));
            
            const defaultHabits = ["Wake up at 05:00 ⏰", "Read 10 pages 📚"];
            
            for (let i = 0; i < defaultHabits.length; i++) {
                const text = defaultHabits[i];
                for (let char of text) {
                    input.value += char;
                    await new Promise(r => setTimeout(r, 30 + Math.random() * 60));
                }
                
                await new Promise(r => setTimeout(r, 300));
                
                const newHabit = { id: Date.now() + i, name: text, days: Array(7).fill(false) };
                habits.push(newHabit);
                saveData();
                appendRow(newHabit, habits.length - 1);
                updateStats();
                checkEmptyState();
                
                input.value = '';
                await new Promise(r => setTimeout(r, 500));
            }

            input.disabled = false;
            input.focus();

            setTimeout(showMotivationOverlay, 600);
        }

        function showMotivationOverlay() {
            const overlay = document.getElementById('motivational-overlay');
            const text = document.getElementById('overlay-text');
            
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            text.classList.remove('translate-y-6');

            setTimeout(() => {
                overlay.classList.add('opacity-0', 'pointer-events-none');
                text.classList.add('translate-y-6');
            }, 3500);
        }

        // --- Rendering ---

        function renderAll() {
            listContainer.innerHTML = '';
            habits.forEach((habit, index) => {
                appendRow(habit, index, false);
            });
            checkEmptyState();
        }

        function appendRow(habit, index, animate = true) {
            const row = document.createElement('div');
            row.className = `habit-row group grid grid-cols-[1fr_repeat(7,minmax(32px,40px))] gap-2 md:gap-3 items-center p-1.5 rounded-2xl hover:bg-neutral-50 dark:hover:bg-neutral-800/30 transition-colors duration-300 border border-transparent hover:border-neutral-100 dark:hover:border-neutral-800/50 ${animate ? 'opacity-0 -translate-y-2' : ''}`;
            row.dataset.index = index;

            let daysHtml = '';
            for (let i = 0; i < 7; i++) {
                const checked = habit.days[i];
                const btnClasses = checked 
                    ? 'bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 border-transparent shadow-sm scale-100'
                    : 'bg-transparent border-neutral-200 dark:border-neutral-700 text-transparent hover:bg-neutral-100 dark:hover:bg-neutral-800 hover:scale-105';
                
                const iconOpacity = checked ? 'opacity-100 scale-100' : 'opacity-0 scale-50';

                daysHtml += `
                    <button class="day-btn w-8 h-8 md:w-10 md:h-10 rounded-xl border flex items-center justify-center transition-all duration-300 ease-spring ${btnClasses}" data-day="${i}" aria-label="Toggle Day ${i+1}">
                        <iconify-icon icon="solar:check-read-linear" stroke-width="2" class="text-base transition-all duration-300 ${iconOpacity}"></iconify-icon>
                    </button>
                `;
            }

            row.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden pr-2 pl-2">
                    <button class="delete-btn opacity-0 group-hover:opacity-100 text-neutral-300 hover:text-red-500 transition-all duration-300 focus:opacity-100 flex-shrink-0" aria-label="Delete habit">
                        <iconify-icon icon="solar:trash-bin-trash-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                    </button>
                    <span class="text-sm font-medium truncate select-none">${habit.name}</span>
                </div>
                ${daysHtml}
            `;

            listContainer.appendChild(row);

            if (animate) {
                requestAnimationFrame(() => {
                    row.style.transition = 'all 0.5s ease-out';
                    row.classList.remove('opacity-0', '-translate-y-2');
                });
            }
        }

        function checkEmptyState() {
            const existingEmpty = document.getElementById('empty-state');
            if (habits.length === 0) {
                if (!existingEmpty) {
                    listContainer.innerHTML = `
                        <div id="empty-state" class="py-10 flex flex-col items-center justify-center text-center gap-3 animate-[fadeIn_0.5s_ease-out]">
                            <div class="w-12 h-12 rounded-2xl bg-neutral-50 dark:bg-neutral-800/50 flex items-center justify-center text-neutral-300 dark:text-neutral-600">
                                <iconify-icon icon="solar:ghost-linear" stroke-width="1.5" class="text-2xl"></iconify-icon>
                            </div>
                            <div>
                                <p class="text-sm font-medium text-neutral-900 dark:text-white">No habits yet</p>
                                <p class="text-xs text-neutral-400 mt-1">Add one above to start building consistency.</p>
                            </div>
                        </div>
                    `;
                }
            } else if (existingEmpty) {
                existingEmpty.remove();
            }
        }

        // --- Interaction & Updates ---

        function handleListClick(e) {
            // Checkbox Toggle
            const dayBtn = e.target.closest('.day-btn');
            if (dayBtn) {
                const row = dayBtn.closest('.habit-row');
                const hIdx = parseInt(row.dataset.index);
                const dIdx = parseInt(dayBtn.dataset.day);
                
                habits[hIdx].days[dIdx] = !habits[hIdx].days[dIdx];
                const isChecked = habits[hIdx].days[dIdx];
                
                // Micro-interaction
                dayBtn.style.transform = 'scale(0.85)';
                setTimeout(() => dayBtn.style.transform = '', 150);

                updateDayUI(dayBtn, isChecked);
                saveData();
                updateStats();
                return;
            }

            // Delete Action
            const deleteBtn = e.target.closest('.delete-btn');
            if (deleteBtn) {
                const row = deleteBtn.closest('.habit-row');
                const hIdx = parseInt(row.dataset.index);
                
                row.style.transition = 'all 0.3s ease-in';
                row.style.opacity = '0';
                row.style.transform = 'scale(0.95)';
                
                setTimeout(() => {
                    habits.splice(hIdx, 1);
                    saveData();
                    renderAll(); 
                    updateStats();
                }, 300);
            }
        }

        function updateDayUI(btn, isChecked) {
            const icon = btn.querySelector('iconify-icon');
            if (isChecked) {
                btn.className = "day-btn w-8 h-8 md:w-10 md:h-10 rounded-xl border flex items-center justify-center transition-all duration-300 ease-spring bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 border-transparent shadow-sm scale-100";
                icon.className = "text-base transition-all duration-300 opacity-100 scale-100";
            } else {
                btn.className = "day-btn w-8 h-8 md:w-10 md:h-10 rounded-xl border flex items-center justify-center transition-all duration-300 ease-spring bg-transparent border-neutral-200 dark:border-neutral-700 text-transparent hover:bg-neutral-100 dark:hover:bg-neutral-800 hover:scale-105";
                icon.className = "text-base transition-all duration-300 opacity-0 scale-50";
            }
        }

        function updateStats() {
            if (habits.length === 0) {
                progressBar.style.width = '0%';
                progressText.textContent = '0%';
                streakCount.textContent = '0 Days';
                return;
            }

            let totalChecked = 0;
            const totalPossible = habits.length * 7;
            let currentStreak = 0;

            habits.forEach(h => {
                totalChecked += h.days.filter(Boolean).length;
            });

            const percent = Math.round((totalChecked / totalPossible) * 100);
            progressBar.style.width = `${percent}%`;
            
            // Animate number
            let start = parseInt(progressText.textContent) || 0;
            animateValue(progressText, start, percent, 600, '%');

            // Streak: Consecutive fully completed days checking right to left (Sun->Mon)
            for (let d = 6; d >= 0; d--) {
                let dayCompleted = true;
                for (let h of habits) {
                    if (!h.days[d]) {
                        dayCompleted = false;
                        break;
                    }
                }
                if (dayCompleted) currentStreak++;
                else break;
            }
            
            streakCount.textContent = `${currentStreak} Day${currentStreak !== 1 ? 's' : ''}`;
        }

        function animateValue(obj, start, end, duration, suffix = '') {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // easeOutQuad
                const easeProgress = progress * (2 - progress); 
                obj.textContent = Math.floor(easeProgress * (end - start) + start) + suffix;
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.textContent = end + suffix;
                }
            };
            window.requestAnimationFrame(step);
        }

        function setupEventListeners() {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const val = input.value.trim();
                if (!val) return;
                
                const newHabit = { id: Date.now(), name: val, days: Array(7).fill(false) };
                habits.push(newHabit);
                saveData();
                appendRow(newHabit, habits.length - 1);
                updateStats();
                checkEmptyState();
                
                input.value = '';
            });

            listContainer.addEventListener('click', handleListClick);
            themeBtn.addEventListener('click', toggleTheme);
        }

        // --- Theme Logic ---

        function initTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlDoc.classList.add('dark');
                themeIcon.setAttribute('icon', 'solar:sun-linear');
            } else {
                htmlDoc.classList.remove('dark');
                themeIcon.setAttribute('icon', 'solar:moon-linear');
            }
        }

        function toggleTheme() {
            themeIcon.style.transform = 'rotate(90deg) scale(0.5)';
            themeIcon.style.opacity = '0';
            
            setTimeout(() => {
                htmlDoc.classList.toggle('dark');
                const isDark = htmlDoc.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                themeIcon.setAttribute('icon', isDark ? 'solar:sun-linear' : 'solar:moon-linear');
                
                themeIcon.style.transform = 'rotate(0deg) scale(1)';
                themeIcon.style.opacity = '1';
            }, 150);
        }

        // Initialize App
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
