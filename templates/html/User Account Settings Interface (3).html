            <div class="bg-[#1e1e3a] rounded-2xl shadow-lg overflow-hidden">

                <button class="setting-item w-full flex justify-between items-center p-4 border-b border-gray-800">

                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center mr-3">
                            <i class="fas fa-moon text-green-400"></i>
                        </div>
                        <span>Dark Mode</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="darkModeToggle" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-500"></div>
                    </label>
                </div>
                
                <div class="flex justify-between items-center p-4 border-b border-gray-800">

            </div>

            </div>
        </div>
    </nav>

    <script>
        // Update clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        }
        setInterval(updateClock, 1000);
        updateClock();
        
        // Setting item click effect
        document.querySelectorAll('.setting-item').forEach(item => {
            item.addEventListener('click', () => {
                item.classList.add('bg-[#252545]');
                setTimeout(() => item.classList.remove('bg-[#252545]'), 200);
            });
        });
        
        // Toggle switches
        document.getElementById('darkModeToggle').addEventListener('change', function() {
            console.log('Dark mode:', this.checked ? 'on' : 'off');
        });
        
        document.getElementById('biometricToggle').addEventListener('change', function() {
            console.log('Biometric login:', this.checked ? 'enabled' : 'disabled');
        });
        
        // Logout button
        document.getElementById('logoutButton').addEventListener('click', () => {
            if (confirm('Are you sure you want to log out?')) {
                console.log('User logged out');
            }
        });
        
        // Back button
        document.getElementById('backButton').addEventListener('click', () => {
            console.log('Back to previous screen');
        });
    </script>
