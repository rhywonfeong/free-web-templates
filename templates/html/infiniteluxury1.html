<body class="bg-zinc-50 text-zinc-900 font-sans antialiased min-h-screen flex flex-col items-center selection:bg-zinc-200">

    <header class="w-full max-w-6xl px-5 py-6 flex justify-between items-center">
        <div class="text-xl tracking-tighter font-medium uppercase">VWR</div>
    </header>

    <main class="w-full max-w-6xl px-5 flex flex-col gap-8 pb-16">
        
        <section class="relative w-full aspect-square md:aspect-video rounded-2xl border border-zinc-200/80 bg-white shadow-sm overflow-hidden flex flex-col">
            <div class="absolute top-4 inset-x-4 flex justify-between items-start z-10 pointer-events-none">
                
                <div class="pointer-events-auto flex items-center gap-1 p-1 bg-white/80 backdrop-blur-md rounded-xl border border-zinc-200/80 shadow-sm">
                    <label class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-zinc-100 cursor-pointer transition-colors text-zinc-500 hover:text-zinc-900">
                        <input type="file" id="glb-upload" accept=".glb" class="hidden" />
                        <iconify-icon icon="solar:upload-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                    </label>
                    <button id="glb-download" disabled class="w-9 h-9 flex items-center justify-center rounded-lg hover:bg-zinc-100 cursor-pointer transition-colors text-zinc-500 hover:text-zinc-900 disabled:opacity-40 disabled:hover:bg-transparent disabled:cursor-not-allowed">
                        <iconify-icon icon="solar:download-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                    </button>
                </div>

                <div class="pointer-events-auto flex items-center gap-3 p-1 px-3.5 h-11 bg-white/80 backdrop-blur-md rounded-xl border border-zinc-200/80 shadow-sm">
                    <iconify-icon icon="solar:sun-linear" stroke-width="1.5" class="text-base text-zinc-400"></iconify-icon>
                    <input type="range" id="light-slider" min="0" max="5" step="0.1" value="2.5" class="w-20 md:w-28 h-1 appearance-none bg-zinc-200 rounded-full outline-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:bg-white [&::-webkit-slider-thumb]:border [&::-webkit-slider-thumb]:border-zinc-300 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:shadow-sm cursor-pointer transition-all">
                </div>
            </div>

            <div id="canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing outline-none"></div>
        </section>

        <section class="w-full flex flex-col gap-5 mt-2">
            <div class="flex items-center justify-between">
                <iconify-icon icon="solar:gallery-minimalistic-linear" stroke-width="1.5" class="text-xl text-zinc-400"></iconify-icon>
                <label class="pointer-events-auto flex items-center justify-center w-10 h-10 bg-white rounded-xl border border-zinc-200/80 shadow-sm hover:bg-zinc-50 cursor-pointer transition-colors text-zinc-600 hover:text-zinc-900">
                    <input type="file" id="image-upload" accept="image/*" multiple class="hidden" />
                    <iconify-icon icon="solar:add-circle-linear" stroke-width="1.5" class="text-xl"></iconify-icon>
                </label>
            </div>
            
            <div id="image-gallery" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 md:gap-4 empty:hidden">
            </div>
        </section>

    </main>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 0.5;
        controls.maxDistance = 50;

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
        directionalLight.position.set(5, 8, 5);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.bias = -0.0001;
        scene.add(directionalLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 1.0);
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);

        let currentModel = null;
        const geometry = new THREE.TorusKnotGeometry(0.8, 0.25, 100, 16);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0xffffff,
            roughness: 0.2,
            metalness: 0.1
        });
        const defaultMesh = new THREE.Mesh(geometry, material);
        defaultMesh.castShadow = true;
        defaultMesh.receiveShadow = true;
        scene.add(defaultMesh);
        currentModel = defaultMesh;

        const planeGeometry = new THREE.PlaneGeometry(100, 100);
        const planeMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, 
            roughness: 1,
            metalness: 0
        });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -1.5;
        plane.receiveShadow = true;
        scene.add(plane);

        window.addEventListener('resize', () => {
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        const lightSlider = document.getElementById('light-slider');
        lightSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            ambientLight.intensity = val;
            directionalLight.intensity = val;
            fillLight.intensity = val * 0.4;
        });

        const uploadInput = document.getElementById('glb-upload');
        const downloadBtn = document.getElementById('glb-download');
        const loader = new GLTFLoader();
        let currentGlbUrl = null;

        uploadInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (currentGlbUrl) URL.revokeObjectURL(currentGlbUrl);
            currentGlbUrl = URL.createObjectURL(file);

            const reader = new FileReader();
            reader.onload = function(event) {
                const contents = event.target.result;
                loader.parse(contents, '', function(gltf) {
                    if (currentModel) scene.remove(currentModel);
                    currentModel = gltf.scene;

                    currentModel.traverse((node) => {
                        if (node.isMesh) {
                            node.castShadow = true;
                            node.receiveShadow = true;
                        }
                    });

                    const box3 = new THREE.Box3().setFromObject(currentModel);
                    const center = box3.getCenter(new THREE.Vector3());
                    const size = box3.getSize(new THREE.Vector3());
                    
                    currentModel.position.x += (currentModel.position.x - center.x);
                    currentModel.position.y += (currentModel.position.y - center.y);
                    currentModel.position.z += (currentModel.position.z - center.z);
                    
                    plane.position.y = -(size.y / 2) - 0.1;

                    const maxDim = Math.max(size.x, size.y, size.z);
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraZ = Math.abs(maxDim / 2 * Math.tan(fov * 2));
                    camera.position.set(0, maxDim * 0.5, cameraZ * 2.5);
                    controls.target.set(0, 0, 0);
                    controls.update();

                    scene.add(currentModel);
                    downloadBtn.disabled = false;
                });
            };
            reader.readAsArrayBuffer(file);
        });

        downloadBtn.addEventListener('click', () => {
            if (!currentGlbUrl) return;
            const a = document.createElement('a');
            a.href = currentGlbUrl;
            a.download = uploadInput.files[0] ? uploadInput.files[0].name : 'model.glb';
            a.click();
        });

        const imageUpload = document.getElementById('image-upload');
        const gallery = document.getElementById('image-gallery');

        imageUpload.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const url = URL.createObjectURL(file);
                const wrapper = document.createElement('div');
                wrapper.className = 'aspect-square rounded-xl bg-white border border-zinc-200/80 shadow-sm overflow-hidden relative group cursor-pointer';

                const img = document.createElement('img');
                img.src = url;
                img.className = 'w-full h-full object-cover transition-transform duration-500 group-hover:scale-105';

                wrapper.appendChild(img);
                gallery.appendChild(wrapper);
            });
            imageUpload.value = '';
        });

    </script>
</body>
