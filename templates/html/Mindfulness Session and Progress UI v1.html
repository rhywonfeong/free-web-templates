<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F6F0E9" />
<title>Tara · Mindful Companion</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script></head>
  <body class="bg-[#F6F0E9] text-[#2C2A28] antialiased selection:bg-[#C8A58A]/20 selection:text-[#2C2A28] min-h-screen flex flex-col" style="font-family: 'Inter', ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial;">
    <!-- App Shell -->
    <div class="w-full max-w-md mx-auto flex-1 flex flex-col pb-28 sm:pb-32">
      <!-- Top App Bar -->
      <header class="px-5 pt-4 pb-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="h-9 w-9 rounded-xl bg-[#7A9E87]/15 border border-black/5 flex items-center justify-center">
            <span class="text-[13px] font-semibold tracking-tight text-[#5E7E6B]" style="font-family:'Fraunces', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif;">T</span>
          </div>
          <div class="flex flex-col">
            <h1 class="text-[18px] leading-tight tracking-tight text-[#2C2A28]" style="font-family:'Fraunces', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif; font-weight:600;">Good morning</h1>
            <p class="text-[13px] text-[#5E5B56]">Here for you, as you are</p>
          </div>
        </div>
        <button class="h-10 w-10 rounded-xl bg-white/60 backdrop-blur border border-black/5 flex items-center justify-center hover:bg-white/70 active:scale-[0.98] transition">
          <i data-lucide="bell" class="w-5 h-5 text-[#6C6A65]"></i>
        </button>
      </header>

      <!-- Content -->
      <main class="px-5 space-y-6">
        <!-- Hero: Today's Session -->
        <section class="rounded-3xl overflow-hidden border border-black/5 bg-white/70 backdrop-blur shadow-sm">
          <div class="relative">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1600&auto=format&fit=crop" alt="Serene misty forest" class="w-full h-44 object-cover" />
            <div class="absolute inset-0 bg-gradient-to-t from-[#F6F0E9] via-[#F6F0E9]/20 to-transparent"></div>
          </div>
          <div class="p-4">
            <div class="mb-1 inline-flex items-center gap-2 text-[12px] text-[#6C6A65]">
              <span class="inline-flex items-center gap-1.5 px-2 py-1 rounded-full bg-[#7A9E87]/10 text-[#5E7E6B] border border-[#7A9E87]/20">Today’s Session</span>
              <span class="inline-flex items-center gap-1.5">
                <i data-lucide="clock" class="w-3.5 h-3.5 text-[#7A9E87]"></i>
                12 min
              </span>
            </div>
            <h2 class="text-[22px] sm:text-[24px] leading-[1.2] tracking-tight text-[#2C2A28]" style="font-family:'Fraunces', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif; font-weight:600;">Grounded Breathing</h2>
            <p class="mt-1 text-[14px] text-[#5E5B56]">Settle your nervous system with a gentle, guided breath practice in nature’s quiet.</p>
            <div class="mt-3 flex items-center gap-3">
              <button class="flex-1 inline-flex items-center justify-center gap-2 h-11 rounded-2xl bg-[#7A9E87] text-white border border-[#5E7E6B]/30 shadow-sm hover:bg-[#6E927A] active:scale-[0.99] transition">
                <i data-lucide="play" class="w-4.5 h-4.5"></i>
                <span class="text-[15px] font-medium">Begin</span>
              </button>
              <button class="h-11 w-11 rounded-2xl bg-white/60 backdrop-blur border border-black/5 flex items-center justify-center hover:bg-white/70 active:scale-[0.98] transition" aria-label="Save for later">
                <i data-lucide="bookmark" class="w-5 h-5 text-[#6C6A65]"></i>
              </button>
            </div>
          </div>
        </section>

        <!-- Quick Tools -->
        <section class="grid grid-cols-2 gap-3">
          <!-- Breath 4-7-8 -->
          <button class="group rounded-2xl p-4 bg-white/70 backdrop-blur border border-black/5 shadow-sm hover:bg-white/80 active:scale-[0.99] transition text-left">
            <div class="flex items-center justify-between">
              <div class="inline-flex items-center gap-2">
                <div class="h-9 w-9 rounded-xl bg-[#7A9E87]/15 border border-[#7A9E87]/25 flex items-center justify-center">
                  <i data-lucide="wind" class="w-5 h-5 text-[#5E7E6B]"></i>
                </div>
                <h3 class="text-[16px] tracking-tight text-[#2C2A28]" style="font-family:'Fraunces', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif; font-weight:600;">Breath 4-7-8</h3>
              </div>
              <span class="text-[12px] text-[#6C6A65]">3 min</span>
            </div>
            <p class="mt-2 text-[13px] text-[#5E5B56]">Steady the mind, lower stress.</p>
          </button>

          <!-- Morning Journal -->
          <button class="group rounded-2xl p-4 bg-white/70 backdrop-blur border border-black/5 shadow-sm hover:bg-white/80 active:scale-[0.99] transition text-left">
            <div class="flex items-center justify-between">
              <div class="inline-flex items-center gap-2">
                <div class="h-9 w-9 rounded-xl bg-[#C8A58A]/15 border border-[#C8A58A]/25 flex items-center justify-center">
                  <i data-lucide="pen-line" class="w-5 h-5 text-[#9A7B62]"></i>
                </div>
                <h3 class="text-[16px] tracking-tight text-[#2C2A28]" style="font-family:'Fraunces', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif; font-weight:600;">Morning Journal</h3>
              </div>
              <span class="text-[12px] text-[#6C6A65]">5 min</span>
            </div>
            <p class="mt-2 text-[13px] text-[#5E5B56]">Clear thoughts, set intention.</p>
          </button>
        </section>

        <!-- Weekly Progress -->
        <section class="rounded-2xl p-4 bg-white/70 backdrop-blur border border-black/5 shadow-sm">
          <div class="flex items-center justify-between">
            <h3 class="text-[17px] tracking-tight text-[#2C2A28]" style="font-family:'Fraunces', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif; font-weight:600;">This Week</h3>
            <span class="text-[12px] text-[#6C6A65]">Mon–Sun</span>
          </div>
          <div class="mt-3 grid grid-cols-2 gap-3">
            <div class="rounded-xl p-3 bg-white/70 border border-black/5">
              <div class="text-[12px] text-[#6C6A65]">Sessions</div>
              <div class="mt-0.5 text-[20px] tracking-tight text-[#2C2A28]" style="font-family:'Fraunces', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif; font-weight:600;">4 / 7</div>
            </div>
            <div class="rounded-xl p-3 bg-white/70 border border-black/5">
              <div class="text-[12px] text-[#6C6A65]">Total time</div>
              <div class="mt-0.5 text-[20px] tracking-tight text-[#2C2A28]" style="font-family:'Fraunces', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif; font-weight:600;">38 min</div>
            </div>
          </div>
          <div class="mt-4">
            <div class="flex items-center justify-between text-[12px] text-[#6C6A65] mb-1.5">
              <span>Progress</span>
              <span>57%</span>
            </div>
            <div class="h-2.5 w-full rounded-full bg-[#7A9E87]/15 overflow-hidden border border-[#7A9E87]/20">
              <div class="h-full w-[57%] bg-[#7A9E87] rounded-full"></div>
            </div>
          </div>
        </section>

        <!-- Paths -->
        <section class="space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-[17px] tracking-tight text-[#2C2A28]" style="font-family:'Fraunces', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif; font-weight:600;">Paths</h3>
            <button class="text-[13px] text-[#5E7E6B] hover:text-[#4F695A] underline underline-offset-4 decoration-[#7A9E87]/50">See all</button>
          </div>

          <!-- Path Card -->
          <button class="w-full rounded-2xl p-4 bg-white/70 backdrop-blur border border-black/5 shadow-sm hover:bg-white/80 active:scale-[0.99] transition">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-2xl bg-[#7A9E87]/15 border border-[#7A9E87]/25 flex items-center justify-center text-[18px]">💗</div>
                <div>
                  <div class="text-[15px] tracking-tight text-[#2C2A28]" style="font-family:'Fraunces', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif; font-weight:600;">Self‑Love</div>
                  <div class="text-[12px] text-[#6C6A65]">8 sessions</div>
                </div>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-[#6C6A65]"></i>
            </div>
          </button>

          <button class="w-full rounded-2xl p-4 bg-white/70 backdrop-blur border border-black/5 shadow-sm hover:bg-white/80 active:scale-[0.99] transition">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-2xl bg-[#C8A58A]/15 border border-[#C8A58A]/25 flex items-center justify-center text-[18px]">🌿</div>
                <div>
                  <div class="text-[15px] tracking-tight text-[#2C2A28]" style="font-family:'Fraunces', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif; font-weight:600;">Grounding</div>
                  <div class="text-[12px] text-[#6C6A65]">12 sessions</div>
                </div>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-[#6C6A65]"></i>
            </div>
          </button>

          <button class="w-full rounded-2xl p-4 bg-white/70 backdrop-blur border border-black/5 shadow-sm hover:bg-white/80 active:scale-[0.99] transition">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="h-10 w-10 rounded-2xl bg-[#9BB7A5]/15 border border-[#9BB7A5]/25 flex items-center justify-center text-[18px]">🌙</div>
                <div>
                  <div class="text-[15px] tracking-tight text-[#2C2A28]" style="font-family:'Fraunces', ui-serif, Georgia, Cambria, 'Times New Roman', Times, serif; font-weight:600;">Sleep</div>
                  <div class="text-[12px] text-[#6C6A65]">6 sessions</div>
                </div>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-[#6C6A65]"></i>
            </div>
          </button>
        </section>

        <div class="h-2"></div>
      </main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="fixed inset-x-0 bottom-0 z-50">
      <div class="mx-auto max-w-md px-4 pb-[calc(env(safe-area-inset-bottom)+8px)]">
        <div class="h-16 rounded-2xl bg-white/70 backdrop-blur-xl border border-black/5 shadow-sm flex items-center justify-around">
          <button class="flex flex-col items-center justify-center gap-1 text-[#5E5B56] hover:text-[#2C2A28] transition">
            <i data-lucide="home" class="w-5 h-5"></i>
            <span class="text-[11px]">Home</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-1 text-[#6C6A65] hover:text-[#2C2A28] transition">
            <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
            <span class="text-[11px]">Stats</span>
          </button>

          <button class="-mt-7 h-14 w-14 rounded-2xl bg-[#7A9E87] text-white border border-[#5E7E6B]/30 shadow-sm flex items-center justify-center hover:bg-[#6E927A] active:scale-95 transition">
            <i data-lucide="plus" class="w-6 h-6"></i>
          </button>

          <button class="flex flex-col items-center justify-center gap-1 text-[#6C6A65] hover:text-[#2C2A28] transition">
            <i data-lucide="search" class="w-5 h-5"></i>
            <span class="text-[11px]">Search</span>
          </button>
          <button class="flex flex-col items-center justify-center gap-1 text-[#6C6A65] hover:text-[#2C2A28] transition">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-[11px]">Profile</span>
          </button>
        </div>
      </div>
    </nav>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
      });
    </script>
  </body>
</html>
