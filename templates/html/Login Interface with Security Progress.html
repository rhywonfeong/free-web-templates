    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Modal - Virtual Card Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gradient-start: #6366f1;
            --gradient-end: #9597ff;
            --white-10: rgba(255, 255, 255, 0.1);
            --white-20: rgba(255, 255, 255, 0.2);
            --white-70: rgba(255, 255, 255, 0.7);
            --white-90: rgba(255, 255, 255, 0.9);
            --slate-50: #f8fafc;
            --slate-500: #64748b;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--slate-50);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            padding: 32px;
            color: white;
            box-shadow: 
                0 10px 15px -3px rgba(0, 0, 0, 0.1),
                0 4px 6px -4px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .login-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .login-title {
            font-size: 18px;
            font-weight: 500;
        }

        .login-badge {
            background-color: var(--white-20);
            color: white;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 9999px;
        }

        .input-container {
            background-color: var(--white-10);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .input-field {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .input-field:last-child {
            margin-bottom: 0;
        }

        .input-icon {
            width: 40px;
            height: 24px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            margin-right: 12px;
        }

        .input-group {
            width: 100%;
        }

        .input-label {
            display: block;
            color: var(--white-70);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .login-input {
            width: 100%;
            background-color: transparent;
            border: none;
            color: white;
            font-size: 14px;
            padding: 4px 0;
            outline: none;
        }

        .login-input::placeholder {
            color: var(--white-70);
        }

        .remember-me {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
        }

        .checkbox-container input {
            margin-right: 8px;
        }

        .checkbox-label {
            font-size: 14px;
            color: var(--white-90);
        }

        .forgot-password {
            color: white;
            font-size: 14px;
            text-decoration: none;
        }

        .login-button {
            width: 100%;
            background-color: white;
            color: var(--slate-800);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 16px;
            transition: background-color 0.2s;
        }

        .login-button:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }

        .signup-link {
            text-align: center;
            font-size: 14px;
            color: var(--white-90);
        }

        .signup-link a {
            color: white;
            font-weight: 500;
            text-decoration: none;
        }

        /* Progress bar styling */
        .progress-container {
            margin-top: 24px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .progress-text {
            font-size: 12px;
            color: var(--white-70);
        }

        .progress-bar {
            height: 6px;
            background-color: var(--white-20);
            border-radius: 9999px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 70%;
            background-color: white;
            border-radius: 9999px;
        }

        .progress-status {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h2 class="login-title">Account Login</h2>
            <span class="login-badge">Secure</span>
        </div>

        <div class="input-container">
            <div class="input-field">
                <div class="input-icon"></div>
                <div class="input-group">
                    <label class="input-label">Email</label>
                    <input type="email" class="login-input" placeholder="your.email@example.com">
                </div>
            </div>
            <div class="input-field">
                <div class="input-icon"></div>
                <div class="input-group">
                    <label class="input-label">Password</label>
                    <input type="password" class="login-input" placeholder="••••••••">
                </div>
            </div>
        </div>

        <div class="remember-me">
            <div class="checkbox-container">
                <input type="checkbox" id="remember">
                <label for="remember" class="checkbox-label">Remember me</label>
            </div>
            <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <button class="login-button">Sign In</button>

        <div class="signup-link">
            Don't have an account? <a href="#">Sign up</a>
        </div>

        <div class="progress-container">
            <div class="progress-label">
                <span class="progress-text">Security level</span>
                <span class="progress-text">Strong</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-status">
                <span class="progress-text">2FA enabled</span>
                <span class="progress-text">70%</span>
            </div>
        </div>
    </div>
</body>
</html>
