      <div class="w-24 h-4 bg-black/80 rounded-b-3xl mt-2"></div>

    <div class="flex-1 flex flex-col">
      <!-- Status Bar -->
      <div class="flex justify-between items-center p-2 text-xs mt-2">

                <i class="fab fa-cc-mastercard text-2xl"></i>
              </div>
              <div class="mt-7 mb-3 text-xl font-semibold tracking-wider">**** 5678</div>
              <div class="flex justify-between items-end">
                <div>
                  <div class="text-xs opacity-70">Card Holder</div>

                </div>

          </button>
          <button class="flex-1 bg-[#eaecf0] rounded-xl py-3 flex flex-col items-center text-sm shadow">
            <i class="fas fa-exchange-alt text-green-500 mb-1"></i> Exchange
          </button>
        </div>
        <!-- Recent Wallet Activity -->
        <div>

            <button class="text-xs text-purple-600">View All</button>

          <span class="text-xs text-gray-400 mt-1">More</span>

  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display:none;}
