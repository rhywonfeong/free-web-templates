    <div

      <div class="p-6 sm:p-12 md:p-16">

              >

                </option>
                <option value="airbank">Air Bank a.s.</option>
                <option value="cs">Česká spořitelna, a.s.</option>
                <option value="csob">ČSOB, a.s.</option>
                <option value="kb">Komerční banka, a.s.</option>

                <iconify-icon

                  width="1.25rem"
                  height="1.25rem"
                ></iconify-icon>
              </div>
            </div>
          </div>

          <div class="flex flex-col gap-1.5 md:gap-2.5">
            <label
              for="product"
              class="font-medium text-gray-700 text-sm md:text-base"
            >
              Vyberte produkt
            </label>
            <div class="relative group">
              <div
                class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400 group-focus-within:text-[#FFA500] transition-colors"

                <iconify-icon

      </div>

      <!-- Optional Footer inside card -->
      <div

        <p class="text-gray-400 text-xs md:text-sm">
          Jeden uživatel může hlasovat pouze jednou.
        </p>
      </div>
    </div>
