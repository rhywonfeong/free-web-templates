<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
}
textarea, .font-mono {
font-family: 'JetBrains Mono', monospace;
}
/* Custom Scrollbar for Editor */
.editor-scroll {
scrollbar-width: thin;
scrollbar-color: #262626 transparent;
}
.editor-scroll::-webkit-scrollbar {

}
.editor-scroll::-webkit-scrollbar-track {

}
.editor-scroll::-webkit-scrollbar-thumb {

border-radius: 4px;
}
</style><!-- aura-ga4-start -->

</head>
<body class="bg-neutral-950 text-neutral-300 h-screen w-screen flex flex-col overflow-hidden antialiased selection:bg-neutral-800 selection:text-white">

  <!-- Header -->
  <header class="h-14 border-b border-neutral-800/80 flex items-center justify-between px-4 bg-neutral-950 shrink-0 z-10 relative">
    <div class="flex items-center gap-4">
      <!-- Logo -->
      <div class="tracking-tighter font-semibold text-lg text-white select-none">HV</div>
      
      <div class="h-4 w-[1px] bg-neutral-800"></div>
      
      <!-- Breadcrumbs -->
      <div class="flex items-center gap-2 text-xs text-neutral-400">
        <div class="flex items-center gap-1.5 hover:text-neutral-200 transition-colors cursor-pointer">
          <iconify-icon icon="solar:folder-linear" stroke-width="1.5" class="text-sm"></iconify-icon>
          <span>Projects</span>
        </div>
        <span class="text-neutral-600">/</span>
        <div class="flex items-center gap-1.5 text-neutral-100 font-medium">
          <iconify-icon icon="solar:document-text-linear" stroke-width="1.5" class="text-sm"></iconify-icon>
          <span>index.html</span>
        </div>
      </div>
    </div>
    
    <!-- Actions -->
    <div class="flex items-center gap-3">
      <button class="flex items-center gap-2 text-xs font-medium text-neutral-400 hover:text-neutral-100 transition-colors px-2.5 py-1.5 rounded-md hover:bg-neutral-900">
        <iconify-icon icon="solar:share-linear" stroke-width="1.5" class="text-sm"></iconify-icon>
        Share
      </button>
      <button class="flex items-center gap-1.5 text-xs font-medium bg-white text-neutral-950 hover:bg-neutral-200 transition-colors px-3 py-1.5 rounded-md shadow-sm">
        <iconify-icon icon="solar:play-linear" stroke-width="1.5" class="text-sm"></iconify-icon>
        Run Code
      </button>
    </div>
  </header>

  <!-- Workspace -->
  <main class="flex-1 flex flex-col lg:flex-row min-h-0 bg-neutral-950">
    
    <!-- Left Pane: Editor -->
    <section class="h-1/2 lg:h-full w-full lg:w-1/2 flex flex-col border-b lg:border-b-0 lg:border-r border-neutral-800/80 bg-[#0a0a0a]">
      <!-- Editor Header -->
      <div class="h-10 border-b border-neutral-800/80 flex items-end bg-neutral-950 shrink-0 px-2 pt-2">
        <div class="flex items-center gap-2 px-4 py-2 bg-[#0a0a0a] border border-neutral-800/80 border-b-0 rounded-t-lg text-xs text-neutral-100 font-medium shadow-[inset_0_1px_0_0_#ffffff20] relative z-10 translate-y-[1px]">
          <iconify-icon icon="solar:document-text-linear" class="text-neutral-400 text-sm" stroke-width="1.5"></iconify-icon>
          index.html
        </div>
        <div class="flex items-center gap-2 px-4 py-2 text-xs text-neutral-500 font-medium hover:text-neutral-300 transition-colors cursor-pointer border border-transparent">
          styles.css
        </div>
      </div>
      
      <!-- Editor Content -->
      <div class="flex-1 flex overflow-auto editor-scroll relative">
        <!-- Line Numbers -->
        <div class="w-12 py-4 text-right pr-4 text-xs font-mono text-neutral-600 border-r border-neutral-800/50 shrink-0 select-none leading-6 bg-[#0a0a0a]">
          <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div><div>7</div><div>8</div><div>9</div><div>10</div>
          <div>11</div><div>12</div><div>13</div><div>14</div><div>15</div><div>16</div><div>17</div><div>18</div><div>19</div><div>20</div>
          <div>21</div><div>22</div><div>23</div><div>24</div><div>25</div><div>26</div><div>27</div><div>28</div><div>29</div><div>30</div>
        </div>
        <!-- Textarea -->
        <textarea class="flex-1 bg-transparent py-4 px-5 text-xs font-mono text-neutral-300 outline-none resize-none leading-6 whitespace-pre placeholder-neutral-700" spellcheck="false" style="min-height: 800px; min-width: 600px;">&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;
  &lt;meta charset="UTF-8"&gt;
  &lt;meta name="viewport" content="width=device-width, initial-scale=1.0"&gt;
  &lt;script src="https://cdn.tailwindcss.com"&gt;&lt;/script&gt;
  &lt;title&gt;HTML Viewer Preview&lt;/title&gt;
&lt;/head&gt;
&lt;body class="bg-[#fafafa] flex items-center justify-center min-h-[calc(100vh-2.5rem)] m-0 font-sans"&gt;
  &lt;div class="bg-white p-8 rounded-2xl shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-neutral-100 text-center max-w-sm w-full"&gt;
    
    &lt;div class="w-12 h-12 bg-neutral-900 rounded-xl mx-auto mb-4 flex items-center justify-center"&gt;
      &lt;svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5"&gt;
        &lt;path d="M10 20L14 4M18 8L22 12L18 16M6 16L2 12L6 8" stroke-linecap="round" stroke-linejoin="round"/&gt;
      &lt;/svg&gt;
    &lt;/div&gt;

    &lt;h1 class="text-2xl font-semibold tracking-tight text-neutral-900 mb-2"&gt;HTML Viewer&lt;/h1&gt;
    &lt;p class="text-sm text-neutral-500 mb-6"&gt;Write your markup on the left and see the rendered result instantly on the right.&lt;/p&gt;
    
    &lt;button class="w-full py-2 bg-neutral-900 hover:bg-neutral-800 text-white text-sm font-medium rounded-lg transition-colors"&gt;
      Get Started
    &lt;/button&gt;
  &lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
      </div>
    </section>

    <!-- Right Pane: Preview -->
    <section class="h-1/2 lg:h-full w-full lg:w-1/2 flex flex-col bg-neutral-950 relative">
      <!-- Preview Header -->
      <div class="h-10 border-b border-neutral-800/80 flex items-center justify-between px-4 bg-neutral-950 shrink-0">
        <div class="flex items-center gap-2 text-xs text-neutral-300 font-medium">
          <iconify-icon icon="solar:eye-linear" stroke-width="1.5" class="text-sm text-neutral-500"></iconify-icon>
          Preview
        </div>
        
        <!-- Controls -->
        <div class="flex items-center gap-4">
          <!-- Auto Run Toggle -->
          <label class="flex items-center gap-2 cursor-pointer">
            <span class="text-xs text-neutral-400 font-medium">Auto Run</span>
            <div class="relative inline-block w-7 h-4 rounded-full bg-neutral-200">
              <div class="absolute left-0.5 top-0.5 w-3 h-3 rounded-full bg-neutral-900 translate-x-3 shadow-sm transition-transform"></div>
            </div>
          </label>
          
          <div class="w-[1px] h-4 bg-neutral-800"></div>

          <!-- Responsive Icons -->
          <div class="flex items-center bg-neutral-900 border border-neutral-800 rounded-md p-0.5">
            <button class="p-1 rounded bg-neutral-800 text-neutral-100 shadow-sm transition-colors flex items-center justify-center">
              <iconify-icon icon="solar:monitor-linear" stroke-width="1.5" class="text-sm"></iconify-icon>
            </button>
            <button class="p-1 rounded text-neutral-500 hover:text-neutral-300 transition-colors flex items-center justify-center">
              <iconify-icon icon="solar:tablet-linear" stroke-width="1.5" class="text-sm"></iconify-icon>
            </button>
            <button class="p-1 rounded text-neutral-500 hover:text-neutral-300 transition-colors flex items-center justify-center">
              <iconify-icon icon="solar:smartphone-linear" stroke-width="1.5" class="text-sm"></iconify-icon>
            </button>
          </div>
          
          <button class="text-neutral-500 hover:text-neutral-200 transition-colors flex items-center justify-center">
            <iconify-icon icon="solar:refresh-linear" stroke-width="1.5" class="text-sm"></iconify-icon>
          </button>
          <button class="text-neutral-500 hover:text-neutral-200 transition-colors flex items-center justify-center">
            <iconify-icon icon="solar:maximize-square-linear" stroke-width="1.5" class="text-sm"></iconify-icon>
          </button>
        </div>
      </div>

      <!-- Preview Canvas Area -->
      <div class="flex-1 p-4 lg:p-8 overflow-auto flex items-center justify-center editor-scroll" style="background-image: radial-gradient(#262626 1px, transparent 1px); background-size: 24px 24px;">
        
        <!-- Rendered Output (Browser Mockup) -->
        <div class="w-full h-full max-w-2xl bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col ring-1 ring-neutral-200/50">
          
          <!-- Mockup Browser Bar -->
          <div class="h-10 bg-white border-b border-neutral-200 flex items-center px-4 gap-4 shrink-0">
            <div class="flex gap-1.5 shrink-0">
              <div class="w-2.5 h-2.5 rounded-full bg-neutral-200"></div>
              <div class="w-2.5 h-2.5 rounded-full bg-neutral-200"></div>
              <div class="w-2.5 h-2.5 rounded-full bg-neutral-200"></div>
            </div>
            <div class="flex-1 bg-neutral-50 border border-neutral-200/80 rounded-md h-6 flex items-center justify-center px-3 text-xs text-neutral-400 font-medium max-w-xs mx-auto">
              <iconify-icon icon="solar:lock-keyhole-linear" class="mr-1.5 text-xs" stroke-width="1.5"></iconify-icon>
              localhost:3000
            </div>
            <div class="w-[42px] shrink-0"></div> <!-- Balancer -->
          </div>
          
          <!-- Mockup Content Area (matches code precisely) -->
          <div class="flex-1 bg-[#fafafa] flex items-center justify-center p-6 relative overflow-auto">
            <div class="bg-white p-8 rounded-2xl shadow-[0_4px_24px_rgba(0,0,0,0.04)] border border-neutral-100 text-center max-w-sm w-full">
              <div class="w-12 h-12 bg-neutral-900 rounded-xl mx-auto mb-4 flex items-center justify-center">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
                  <path d="M10 20L14 4M18 8L22 12L18 16M6 16L2 12L6 8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <h1 class="text-2xl font-semibold tracking-tight text-neutral-900 mb-2">HTML Viewer</h1>
              <p class="text-xs text-neutral-500 mb-6">Write your markup on the left and see the rendered result instantly on the right.</p>
              <button class="w-full py-2 bg-neutral-900 hover:bg-neutral-800 text-white text-xs font-medium rounded-lg transition-colors">
                Get Started
              </button>
            </div>
          </div>
          
        </div>
      </div>
    </section>
  </main>

  <!-- Status Bar -->
  <footer class="h-7 border-t border-neutral-800/80 bg-neutral-950 flex items-center justify-between px-4 text-xs text-neutral-500 shrink-0 z-10">
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-1.5 hover:text-neutral-300 transition-colors cursor-pointer">
        <iconify-icon icon="solar:danger-circle-linear" stroke-width="1.5"></iconify-icon>
        <span>0 Errors</span>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <span class="hover:text-neutral-300 transition-colors cursor-pointer">Ln 23, Col 7</span>
      <span class="hover:text-neutral-300 transition-colors cursor-pointer">UTF-8</span>
      <span class="hover:text-neutral-300 transition-colors cursor-pointer">HTML</span>
    </div>
  </footer>

</body>
</html>
