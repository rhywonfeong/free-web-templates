<meta charset="UTF-8" />

<style>
body {

/* Custom noise utility */
.bg-noise {

  <body
    class="relative min-h-screen overflow-x-hidden text-white selection:bg-orange-500 selection:text-black antialiased"
  >
    <!-- Background Effects -->
    <div class="fixed inset-0 z-0 pointer-events-none">
      <!-- Dark base -->
      <div class="absolute inset-0 bg-black"></div>

      <!-- Aurora/Light Leak Effect -->
      <div
        class="absolute top-[-10%] left-1/2 -translate-x-1/2 w-3/4 h-[120%] bg-gradient-to-b from-red-600 via-orange-600 to-red-900 opacity-60 blur-[100px] sm:blur-[120px]"
      ></div>

      <!-- Secondary glowing spots -->
      <div
        class="absolute top-[20%] left-[30%] w-1/2 h-1/2 bg-orange-500 rounded-full opacity-40 blur-[90px] mix-blend-screen"
      ></div>
      <div
        class="absolute bottom-[10%] right-[20%] w-1/3 h-2/3 bg-red-700 rounded-full opacity-50 blur-[100px] mix-blend-screen"
      ></div>

      <!-- Grain Overlay -->
      <div class="absolute inset-0 bg-noise opacity-30 mix-blend-overlay"></div>

      <!-- Vignette -->
      <div
        class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black opacity-80"
      ></div>
      <div
        class="absolute inset-0 bg-gradient-to-r from-black via-transparent to-black opacity-60"
      ></div>
    </div>

    <!-- Navigation -->
    <nav
      class="relative z-50 flex items-center justify-between px-6 py-6 md:px-10 lg:px-12 w-full"
    >
      <!-- Logo -->
      <div class="flex items-center gap-3 group cursor-pointer">
        <span
          class="text-xl font-medium tracking-tight text-white group-hover:text-gray-200 transition-colors"
        >
          ARAM LABS
        </span>
        <!-- Replaced Asterisk with Logo PNG -->
        <img 
          src="aram-logo.png" 
          alt="Aram Labs Symbol" 
          class="w-8 h-8 object-contain opacity-90 group-hover:opacity-100 transition-opacity"
        />
      </div>

      <!-- Right Menu -->
      <div class="flex items-center gap-6 md:gap-10">
        <!-- Menu Icon -->
        <button
          class="text-white hover:text-orange-500 transition-colors hidden sm:block"
        >
          <i data-lucide="menu" class="w-6 h-6" style="stroke-width: 1.5;"></i>
        </button>

        <!-- Language Selector -->
        <button
          class="flex items-center gap-1 text-lg font-normal text-white hover:text-gray-300 transition-colors"
        >
          <span>EN</span>
          <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400" style="stroke-width: 1.5;"></i>
        </button>

        <!-- CTA Button -->
        <a
          href="#"
          class="bg-white text-black px-5 py-3 rounded text-sm font-medium hover:bg-gray-200 transition-all active:scale-95"
        >
          Contact us
        </a>
      </div>
    </nav>

    <!-- Main Content -->
    <main
      class="relative z-10 flex flex-col justify-center min-h-[85vh] px-6 md:px-10 lg:px-12"
    >
      <div
        class="w-full max-w-7xl mx-auto flex flex-col md:flex-row md:items-end justify-between gap-16 md:gap-0"
      >
        <!-- Hero Title -->
        <div class="w-full md:w-2/3 lg:w-3/4 pt-12 md:pt-0">
          <h1
            class="text-6xl sm:text-7xl md:text-8xl lg:text-9xl font-medium tracking-tight leading-[0.95] text-white"
          >
            A Trusted Partner that
            <br class="hidden md:block" />
            keeps up with
            <br class="hidden md:block" />
            your ambition.
          </h1>
        </div>

        <!-- Description / Footer Text -->
        <div
          class="w-full md:w-1/3 lg:w-1/4 flex flex-col justify-end pb-2 md:pb-4"
        >
          <p
            class="text-lg md:text-xl text-gray-200 font-light leading-relaxed"
          >
            AI-Powered Operations Partner based in Toronto. We design and build
            tools that supercharge your business growth.
          </p>
        </div>
      </div>
    </main>

    <script>
      lucide.createIcons();
