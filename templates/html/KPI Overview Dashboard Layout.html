    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KPI Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --font-main: 'Roboto', sans-serif;
            --bg-page: #f8f9fa;
            --bg-component: #ffffff;
            --bg-card: rgba(0, 0, 0, 0.02);
            --text-primary: #212529;
            --text-secondary: #495057;
            --text-heading: #004085;
            --text-accent: #007bff;
            --border-color: #dee2e6;
            --shadow-color: 0, 0, 0;
            --shadow-md: 0 .5rem 1rem rgba(var(--shadow-color), 0.15);
            --shadow-lg: 0 1rem 3rem rgba(var(--shadow-color), 0.2);
            --shadow-xs: 0 .125rem .25rem rgba(var(--shadow-color), 0.05);
            --border-radius: 0.25rem;
            --color-success: #28a745;
            --color-danger: #dc3545;
            --transition-normal: 0.2s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: grid;
            place-items: center;
            align-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .dashboard-kpi-overview {
            background-color: var(--bg-component);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 600px;
            transition: transform var(--transition-normal) ease-in-out, box-shadow var(--transition-normal) ease-in-out;
        }

        .dashboard-kpi-overview:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .kpi-card-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .kpi-card-row:last-child {
            margin-bottom: 0;
        }

        .kpi-card {
            background-color: var(--bg-card);
            padding: 15px;
            border-radius: var(--border-radius);
            text-align: center;
            flex: 1;
            min-width: 130px;
            border: 1px solid rgba(222, 226, 230, 0.5);
            box-shadow: var(--shadow-xs);
            transition: all 0.2s;
        }

        .kpi-card:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: var(--shadow-md);
            border-color: var(--text-accent);
        }

        .kpi-icon {
            font-size: 1.8rem;
            color: var(--text-accent);
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 3px;
        }

        .kpi-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .kpi-trend {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .kpi-trend.up {
            color: var(--color-success);
        }

        .kpi-trend.down {
            color: var(--color-danger);
        }

        .kpi-trend i {
            margin-right: 3px;
        }

        @media (max-width: 768px) {
            .kpi-card-row {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            .dashboard-kpi-overview {
                padding: 15px;
            }
            .kpi-card {
                min-width: 100%;
                padding: 12px;
            }
            .kpi-value {
                font-size: 1.4rem;
            }
            .kpi-icon {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-kpi-overview animate__animated animate__fadeInUp">
        <div class="kpi-card-row">
            <div class="kpi-card animate__animated animate__zoomIn" style="animation-delay: 0.1s">
                <div class="kpi-icon"><i class="fas fa-users"></i></div>
                <div class="kpi-value">1,234</div>
                <div class="kpi-label">Active Users</div>
                <div class="kpi-trend up"><i class="fas fa-arrow-up"></i> 5.2%</div>
            </div>
            <div class="kpi-card animate__animated animate__zoomIn" style="animation-delay: 0.2s">
                <div class="kpi-icon"><i class="fas fa-dollar-sign"></i></div>
                <div class="kpi-value">$9,876</div>
                <div class="kpi-label">Revenue</div>
                <div class="kpi-trend up"><i class="fas fa-arrow-up"></i> 12.1%</div>
            </div>
        </div>
        <div class="kpi-card-row">
            <div class="kpi-card animate__animated animate__zoomIn" style="animation-delay: 0.3s">
                <div class="kpi-icon"><i class="fas fa-shopping-cart"></i></div>
                <div class="kpi-value">582</div>
                <div class="kpi-label">New Orders</div>
                <div class="kpi-trend down"><i class="fas fa-arrow-down"></i> 1.5%</div>
            </div>
            <div class="kpi-card animate__animated animate__zoomIn" style="animation-delay: 0.4s">
                <div class="kpi-icon"><i class="fas fa-chart-line"></i></div>
                <div class="kpi-value">23.4%</div>
                <div class="kpi-label">Conversion Rate</div>
                <div class="kpi-trend up"><i class="fas fa-arrow-up"></i> 0.8%</div>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new WOW().init();
        });
    </script>
</body>
</html>
