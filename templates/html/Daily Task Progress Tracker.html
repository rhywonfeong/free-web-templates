  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Clean To-Do Progress</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0e1020] min-h-screen flex items-center justify-center">
  <div class="max-w-sm w-full bg-[#151728]/90 rounded-2xl shadow-lg border border-[#24274a] p-8 flex flex-col gap-8">
    <!-- Title -->
    <h1 class="text-xl font-bold text-cyan-300 tracking-wide text-center">Daily Tasks</h1>

    <!-- Progress Steps (Linear) -->
    <div>
      <div class="relative flex items-center mb-3">
        <div class="flex-1 h-1 bg-[#273047] rounded"></div>
        <div class="absolute flex justify-between w-full px-0.5">
          <span class="h-4 w-4 bg-cyan-300 rounded-full shadow-[0_0_8px_1px_#22d3ee]"></span>
          <span class="h-4 w-4 bg-cyan-300 rounded-full shadow-[0_0_8px_1px_#22d3ee]"></span>
          <span class="h-4 w-4 bg-cyan-300 rounded-full shadow-[0_0_8px_1px_#22d3ee]"></span>
          <span class="h-4 w-4 border-2 border-cyan-200 bg-[#151728] rounded-full"></span>
          <span class="h-4 w-4 border border-[#2d354b] bg-[#192037] rounded-full"></span>
          <span class="h-4 w-4 border border-[#2d354b] bg-[#192037] rounded-full"></span>
        </div>
      </div>
      <div class="flex justify-between mt-2 text-xs text-cyan-100/50 font-light px-0.5">
        <span>Wake</span>
        <span>Move</span>
        <span>Emails</span>
        <span class="text-cyan-200 font-medium">Shop</span>
        <span>Read</span>
        <span>Call</span>
      </div>
    </div>

    <!-- Compact Task Detail -->
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 flex items-center justify-center rounded-full bg-cyan-300/10 border border-cyan-300/30">
        <svg class="w-5 h-5 text-cyan-200" fill="none" viewBox="0 0 24 24">
          <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <span class="block text-sm text-cyan-200 font-semibold">3/6 done</span>
        <span class="block text-xs mt-0.5 text-cyan-100/60">Next: Shop</span>
      </div>
      <div class="ml-auto text-xs text-cyan-100/30">Last: Emails</div>
    </div>

    <!-- Progress Bar & Percentage -->
    <div class="flex items-center gap-3">
      <div class="flex-1 h-1.5 rounded-lg bg-[#293047] overflow-hidden">
        <div class="h-1.5 bg-cyan-300 rounded-lg transition-all" style="width:50%"></div>
      </div>
      <span class="text-cyan-200 text-xs font-mono">50%</span>
    </div>

    <!-- Action Button -->
    <button class="mt-2 w-full py-2 text-cyan-950 font-bold rounded-lg bg-cyan-300 hover:bg-cyan-200 transition-all shadow text-base tracking-wide">
      Continue
    </button>
  </div>
</body>
</html>
