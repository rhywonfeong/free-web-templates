    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Patrick Hand', cursive;
            background-color: #fdfdfa;
            color: #3a3a3a;
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .pricing-table {
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: #5a5a5a;
            border: 1px solid #5a5a5a;
            border-radius: 5px;
            overflow: hidden;
        }

        .pricing-plan {
            padding: 2rem;
            background: #ffffff;
            text-align: center;
        }

        .pricing-plan.popular {
            transform: scale(1.05);
            z-index: 1;
            border-radius: 5px;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.15);
        }

        .pricing-plan .name {
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #5a5a5a;
            margin-bottom: 0.8em;
        }

        .pricing-plan .price {
            font-size: 3rem;
            font-weight: 700;
            margin: 0.5rem 0;
            color: #2a2a2a;
        }

        .pricing-plan .price span {
            font-size: 1rem;
            color: #5a5a5a;
        }

        .pricing-plan .features {
            list-style: none;
            margin: 1.5rem 0;
            text-align: left;
        }

        .pricing-plan .features li {
            margin-bottom: 0.75rem;
            color: #5a5a5a;
        }

        .pricing-plan .features li::before {
            content: '✓';
            color: #28a745;
            margin-right: 0.5rem;
        }

        .cta-btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            font-family: 'Patrick Hand', cursive;
            border: 2px solid #5a5a5a;
        }

        .cta-btn:active {
            transform: scale(0.98);
        }

        .primary-cta {
            background: #5a7d9a;
            color: #fff;
            border-color: #5a7d9a;
        }

        .primary-cta:hover {
            background-color: #4a6d8a;
        }

        .secondary-cta {
            background: transparent;
            color: #3a3a3a;
        }

        .secondary-cta:hover {
            background-color: #f5f5f5;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
    <div class="pricing-table">
        <div class="pricing-plan">
            <h4 class="name">Starter</h4>
            <div class="price">$29<span>/mo</span></div>
            <ul class="features">
                <li>10 Projects</li>
                <li>Basic Analytics</li>
                <li>Email Support</li>
            </ul>
            <button class="secondary-cta cta-btn">Choose Plan</button>
        </div>
        <div class="pricing-plan popular">
            <h4 class="name">Pro</h4>
            <div class="price">$59<span>/mo</span></div>
            <ul class="features">
                <li>Unlimited Projects</li>
                <li>Advanced Analytics</li>
                <li>Priority Support</li>
            </ul>
            <button class="primary-cta cta-btn">Choose Plan</button>
        </div>
        <div class="pricing-plan">
            <h4 class="name">Enterprise</h4>
            <div class="price">$99<span>/mo</span></div>
            <ul class="features">
                <li>All Pro Features</li>
                <li>Dedicated Manager</li>
                <li>24/7 Phone Support</li>
            </ul>
            <button class="secondary-cta cta-btn">Choose Plan</button>
        </div>
    </div>
</body>
</html>
