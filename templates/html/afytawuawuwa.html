<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Content</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-4xl bg-white rounded-lg shadow-lg overflow-hidden">
        <div class="p-4 bg-blue-600 text-white">
            <h1 class="text-xl font-bold">Embedded Content</h1>
        </div>
        <div class="p-2">
            <div class="w-full h-[600px] border border-gray-300 rounded">
                <iframe 
                    src="https://sayufaufwtau.netlify.app" 
                    class="w-full h-full"
                    frameborder="0"
                    allowfullscreen
                ></iframe>
            </div>
        </div>
        <div class="p-4 bg-gray-50 text-sm text-gray-600">
            <p>This content is embedded from an external source.</p>
        </div>
    </div>
</body>
</html>
