        </div>
        <div>
          <p class="text-xs text-gray-500 uppercase tracking-wide flex items-center justify-center gap-1">
            <!-- Improved Gate Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

          </p>

        </div>
      </div>
      <!-- Divider -->
      <div class="border-b border-[#23293a] my-5"></div>
      <!-- Status & Seat -->
      <div class="flex items-center justify-between">
        <div>
          <p class="text-xs text-gray-500 uppercase tracking-wide flex items-center gap-1">
            <!-- Improved Status Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-green-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>

              <path d="M5 11a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-8z"/>
              <path d="M8 11V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v6"/>

          </p>
          <span class="inline-block mt-1 px-2 py-1 rounded bg-blue-500/10 text-blue-400 text-xs font-semibold">14A</span>
        </div>
      </div>
      <!-- Divider -->
      <div class="border-b border-[#23293a] my-5"></div>
      <!-- Seat Selection -->
      <div>
        <p class="text-xs text-gray-500 uppercase tracking-wide mb-2 flex items-center gap-1">
          <!-- Improved Seats Map Icon -->
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="1" y="5" width="22" height="14" rx="2" stroke-width="1.5"/>
            <path d="M5 12V8a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v4"/>
            <path d="M14 12V8a1 1 0 0 1 1-1h3a1 1 0 0 1 1 1v4"/>
            <line x1="1" y1="12" x2="23" y2="12"/>

        </p>
        <div id="seatMap" class="grid grid-cols-6 gap-2 mt-1">
          <!-- Row 1 -->
          <button class="seat-btn selected bg-blue-500/20 text-blue-400 font-medium rounded-lg px-0 py-1.5 border-2 border-blue-400" data-seat="14A">14A</button>
          <button class="seat-btn bg-[#23293a] text-gray-400 font-medium rounded-lg px-0 py-1.5 hover:bg-[#2a3349]" data-seat="14B">14B</button>

          <button class="seat-btn bg-[#23293a] text-gray-400 font-medium rounded-lg px-0 py-1.5 hover:bg-[#2a3349]" data-seat="14C">14C</button>
          <button class="seat-btn bg-[#23293a] text-gray-400 font-medium rounded-lg px-0 py-1.5 hover:bg-[#2a3349]" data-seat="14D">14D</button>
          <button class="seat-btn bg-[#23293a] text-gray-400 font-medium rounded-lg px-0 py-1.5 hover:bg-[#2a3349]" data-seat="14E">14E</button>
          <!-- Row 2 -->
          <button class="seat-btn bg-[#23293a] text-gray-400 font-medium rounded-lg px-0 py-1.5 hover:bg-[#2a3349]" data-seat="15A">15A</button>
          <button class="seat-btn bg-[#23293a] text-gray-400 font-medium rounded-lg px-0 py-1.5 hover:bg-[#2a3349]" data-seat="15B">15B</button>
          <span class="col-span-1"></span>
          <button class="seat-btn bg-[#23293a] text-gray-400 font-medium rounded-lg px-0 py-1.5 hover:bg-[#2a3349]" data-seat="15C">15C</button>
          <button class="seat-btn bg-[#23293a] text-gray-400 font-medium rounded-lg px-0 py-1.5 hover:bg-[#2a3349]" data-seat="15D">15D</button>
          <button class="seat-btn bg-[#23293a] text-gray-400 font-medium rounded-lg px-0 py-1.5 hover:bg-[#2a3349]" data-seat="15E">15E</button>
        </div>
        <p class="mt-2 text-xs text-gray-400">Window: A & E, Aisle: B & D</p>

    <!-- Divider -->
    <div class="border-t border-[#23293a]"></div>
    <!-- Footer -->
    <div class="px-8 py-4 bg-[#19213a] flex justify-between items-center">
      <div class="flex items-center gap-2">
        <!-- Improved Boarding Pass Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="2"/>
          <path d="M2 12h20"/>
          <path d="M7 6v12"/>
          <path d="M17 6v12"/>
        </svg>
        <span class="text-xs text-gray-400">Boarding 10:15 AM</span>
      </div>
      <span class="text-xs text-gray-400 flex items-center gap-1">
        <!-- Improved Terminal Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 3v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V3"/>

          <path d="M14 14h.01"/>
        </svg>
        Terminal 3
      </span>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      await tsParticles.load("tsparticles", {
        fpsLimit: 60,
        fullScreen: { enable: true },
        particles: {
          number: { value: 70, density: { enable: true, value_area: 900 } },
          color: { value: ["#60a5fa", "#38bdf8", "#818cf8", "#a5b4fc"] },
          shape: { type: "circle" },
          opacity: {
            value: 0.45,
            random: true,
            anim: { enable: true, speed: 1, opacity_min: 0.12, sync: false }
          },
          size: {
            value: 3,
            random: true,
            anim: { enable: true, speed: 2, size_min: 0.1, sync: false }
          },
          line_linked: {
            enable: true,
            distance: 140,
            color: "#60a5fa",
            opacity: 0.17,
            width: 1
          },
          move: {
            enable: true,
            speed: 0.7,
            direction: "none",
            random: true,
            straight: false,
            out_mode: "out",
            bounce: false
          }
        },
        interactivity: {
          detect_on: "canvas",
          events: {
            onhover: { enable: true, mode: "grab" },
            onclick: { enable: true, mode: "push" },
            resize: true
          },
          modes: {
            grab: { distance: 160, line_linked: { opacity: 0.35 } },
            push: { particles_nb: 3 }
          }
        },
        detectRetina: true
      });

      // Improved seat selection interactivity
      const seats = document.querySelectorAll('.seat-btn');
      seats.forEach(btn => {
        btn.addEventListener('click', function() {
          seats.forEach(b => {
            b.classList.remove('selected', 'bg-blue-500/20', 'text-blue-400', 'border-2', 'border-blue-400');
            b.classList.add('bg-[#23293a]', 'text-gray-400');
          });
          
          // Apply selected state
          btn.classList.remove('bg-[#23293a]', 'text-gray-400');
          btn.classList.add('selected', 'bg-blue-500/20', 'text-blue-400', 'border-2', 'border-blue-400');
          
          // Update the seat info in the status section
          const seatInfo = document.querySelector('.text-xs.font-semibold.text-blue-400');
          if (seatInfo) {
            seatInfo.textContent = btn.dataset.seat;
          }
          
          // Add subtle animation
          btn.animate([
            { transform: 'scale(0.95)' },
            { transform: 'scale(1.05)' },
            { transform: 'scale(1)' }
          ], {
            duration: 300,
            easing: 'ease-out'
          });
        });
      });
    });
  </script>
</body>
