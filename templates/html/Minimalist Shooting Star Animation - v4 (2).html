  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shooting Star Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes shootingStar {
      0% {
        transform: translateX(100%) translateY(-100%) rotate(-45deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      70% {
        opacity: 1;
      }
      100% {
        transform: translateX(-200%) translateY(200%) rotate(-45deg);
        opacity: 0;
      }
    }
    
    .shooting-star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: shootingStar 4s infinite;
    }
    
    .star-tail {
      position: absolute;
      top: 0;
      left: 0;
      width: 40px;
      height: 1px;
      background: linear-gradient(to right, rgba(255,255,255,0.8), rgba(255,255,255,0));
      transform-origin: left center;
      transform: rotate(0deg);
    }
  </style>
</head>
<body class="bg-gray-300 min-h-screen flex items-center justify-center p-4">
  <div class="w-72 h-96 bg-gray-900 rounded-xl shadow-2xl overflow-hidden relative">
    <div class="absolute inset-0 bg-black bg-opacity-80"></div>
    
    <!-- Star field background -->
    <div class="absolute inset-0">
      <div class="absolute h-1 w-1 bg-white rounded-full top-[15%] left-[20%] opacity-70"></div>
      <div class="absolute h-1 w-1 bg-white rounded-full top-[45%] left-[80%] opacity-60"></div>
      <div class="absolute h-1 w-1 bg-white rounded-full top-[65%] left-[35%] opacity-80"></div>
      <div class="absolute h-1 w-1 bg-white rounded-full top-[25%] left-[60%] opacity-50"></div>
      <div class="absolute h-1 w-1 bg-white rounded-full top-[75%] left-[75%] opacity-70"></div>
      <div class="absolute h-[2px] w-[2px] bg-white rounded-full top-[55%] left-[15%] opacity-90"></div>
      <div class="absolute h-[2px] w-[2px] bg-white rounded-full top-[85%] left-[50%] opacity-80"></div>
      <div class="absolute h-[2px] w-[2px] bg-white rounded-full top-[10%] left-[40%] opacity-70"></div>
      <div class="absolute h-[2px] w-[2px] bg-white rounded-full top-[35%] left-[25%] opacity-60"></div>
    </div>
    
    <!-- Shooting star 1 -->
    <div class="shooting-star" style="top: 10%; right: 10%; animation-delay: 0s;">
      <div class="star-tail"></div>
    </div>
    
    <!-- Shooting star 2 -->
    <div class="shooting-star" style="top: 5%; right: 30%; animation-delay: 2s;">
      <div class="star-tail"></div>
    </div>
    
    <!-- Shooting star 3 -->
    <div class="shooting-star" style="top: 15%; right: 50%; animation-delay: 1s;">
      <div class="star-tail"></div>
    </div>
    
    <!-- Card content -->
    <div class="relative z-10 h-full flex flex-col justify-between p-6">
      <div>
        <h3 class="text-white text-xl font-semibold tracking-wider">NIGHT SKY</h3>
        <p class="text-gray-400 mt-2 text-sm">Wishing upon stars</p>
      </div>
      
      <div class="border-t border-gray-700 pt-4">
        <p class="text-gray-300 text-sm">Each shooting star carries a wish across the endless canvas of the night.</p>
        <div class="mt-4 flex justify-end">
          <button class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white text-sm rounded transition duration-300">
            Make a Wish
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
