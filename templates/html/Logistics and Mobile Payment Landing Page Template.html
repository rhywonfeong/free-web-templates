<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding Step 3</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-neutral-950 flex items-center justify-center min-h-screen antialiased text-white selection:bg-emerald-500/30 p-4">

    <!-- Mobile Device Simulator Container -->
    <div class="w-full max-w-[390px] h-[844px] relative overflow-hidden bg-[#0A1A13] sm:rounded-[2.5rem] sm:border sm:border-white/10 sm:shadow-2xl">

        <!-- Ambient Glows -->
        <div class="absolute top-[-10%] right-[-20%] w-96 h-96 bg-emerald-500/20 blur-[100px] rounded-full mix-blend-screen pointer-events-none"></div>
        <div class="absolute top-[20%] left-[-20%] w-72 h-72 bg-orange-500/10 blur-[100px] rounded-full mix-blend-screen pointer-events-none"></div>

        <div class="flex flex-col h-full relative z-10 py-10">

            <!-- Top Section: Visuals -->
            <div class="flex flex-col items-center w-full px-6 gap-8 mt-4">
                
                <!-- Flight Path -->
                <div class="w-full relative flex items-start justify-between">
                    <!-- Left: Factory -->
                    <div class="flex flex-col items-center gap-2 relative z-10">
                        <div class="w-12 h-12 rounded-full bg-orange-950/60 border border-orange-500/20 flex items-center justify-center backdrop-blur-md shadow-[0_0_15px_rgba(234,88,12,0.15)]">
                            <i data-lucide="factory" stroke-width="1.5" class="w-5 h-5 text-orange-400"></i>
                        </div>
                        <span class="text-xs text-white font-medium">Guangzhou</span>
                    </div>

                    <!-- Middle: Line & Plane -->
                    <div class="flex-1 flex flex-col items-center absolute left-12 right-12 top-4">
                        <span class="text-xs text-gray-400 mb-2 font-medium tracking-wide">KOLI Vol N°38</span>
                        <div class="w-full flex items-center justify-center relative">
                            <div class="h-[1px] w-full bg-gradient-to-r from-orange-500/0 via-emerald-500/40 to-blue-500/0"></div>
                            <div class="absolute bg-[#0A1A13] px-2">
                                <i data-lucide="plane" stroke-width="1.5" class="w-6 h-6 text-blue-300 transform -rotate-45 -translate-y-1"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Globe -->
                    <div class="flex flex-col items-center gap-2 relative z-10">
                        <div class="w-12 h-12 rounded-full bg-blue-950/60 border border-blue-500/20 flex items-center justify-center backdrop-blur-md shadow-[0_0_15px_rgba(59,130,246,0.15)]">
                            <i data-lucide="globe" stroke-width="1.5" class="w-5 h-5 text-blue-400"></i>
                        </div>
                        <span class="text-xs text-white font-medium">Dakar</span>
                    </div>
                </div>

                <!-- Livraison Tag -->
                <div class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-black/40 border border-white/5 backdrop-blur-xl shadow-lg mt-2">
                    <i data-lucide="timer" stroke-width="1.5" class="w-4 h-4 text-gray-300"></i>
                    <span class="text-sm font-medium text-emerald-50 tracking-wide">Livraison en 12–18 jours</span>
                </div>

                <!-- Payment Pills Group -->
                <div class="flex flex-col items-center gap-3 w-full">
                    <!-- Row 1 -->
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-black/40 border border-yellow-500/20 backdrop-blur-md">
                            <div class="w-2 h-2 rounded-full bg-yellow-400 shadow-[0_0_8px_rgba(250,204,21,0.6)]"></div>
                            <span class="font-medium text-sm text-yellow-500">Wave</span>
                        </div>
                        <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-black/40 border border-orange-500/20 backdrop-blur-md">
                            <div class="w-2 h-2 rounded-full bg-orange-500 shadow-[0_0_8px_rgba(249,115,22,0.6)]"></div>
                            <span class="font-medium text-sm text-orange-500">Orange Money</span>
                        </div>
                    </div>
                    <!-- Row 2 -->
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-black/40 border border-yellow-400/20 backdrop-blur-md">
                            <div class="w-2 h-2 rounded-full bg-yellow-300 shadow-[0_0_8px_rgba(253,224,71,0.6)]"></div>
                            <span class="font-medium text-sm text-yellow-300">MTN MoMo</span>
                        </div>
                        <div class="flex items-center gap-2 px-4 py-2 rounded-full bg-black/40 border border-emerald-500/20 backdrop-blur-md">
                            <div class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.6)]"></div>
                            <span class="font-medium text-sm text-emerald-400">Flooz</span>
                        </div>
                    </div>
                </div>

                <!-- Info Card -->
                <div class="w-full max-w-[280px] p-4 rounded-2xl bg-black/40 border border-white/5 backdrop-blur-xl flex items-center gap-4 mt-2">
                    <div class="flex-shrink-0">
                        <div class="w-8 h-8 rounded-full bg-red-500/10 flex items-center justify-center border border-red-500/20 shadow-[0_0_10px_rgba(239,68,68,0.1)]">
                            <i data-lucide="map-pin" stroke-width="1.5" class="text-red-500 w-4 h-4"></i>
                        </div>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-sm text-white font-medium">Retrait au point relais</span>
                        <div class="flex items-center gap-1.5 mt-0.5">
                            <span class="text-sm text-gray-400">Scanne ton QR code</span>
                            <i data-lucide="check" stroke-width="1.5" class="w-3.5 h-3.5 text-white"></i>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Bottom Section: Typography & CTA -->
            <div class="mt-auto px-8 pb-6">
                
                <p class="text-xs font-semibold tracking-widest text-emerald-500/80 uppercase mb-4">
                    Slide 03 / 03
                </p>

                <h1 class="text-4xl font-semibold tracking-tight leading-[1.1] text-white mb-6">
                    Paie local.<br/> Reçois<br/> du monde entier.
                </h1>
                
                <p class="text-base text-gray-400 leading-relaxed mb-8 pr-4">
                    Wave, Orange Money, MTN — aucune carte internationale. Ton colis arrive en 12–18 jours, suivi SMS en temps réel.
                </p>

                <div class="flex items-center gap-4">
                    <button class="inline-flex items-center justify-center rounded-full pl-6 pr-5 py-3.5 text-base font-medium text-white transition-opacity hover:opacity-90 bg-gradient-to-r from-emerald-600 to-orange-500/80 shadow-[0_8px_20px_-6px_rgba(16,185,129,0.4)]">
                        Commencer
                        <i data-lucide="arrow-right" stroke-width="1.5" class="ml-2 w-5 h-5"></i>
                    </button>
                </div>

                <!-- Pagination -->
                <div class="flex items-center gap-1.5 mt-8">
                    <div class="w-1.5 h-1.5 rounded-full bg-white/20"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-white/20"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
                </div>

            </div>

        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      lucide.createIcons();
    </script>
</body>
</html>
