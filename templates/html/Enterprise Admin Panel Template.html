  <body
    class="min-h-screen antialiased flex flex-col bg-[#0e2b63] text-white selection:bg-white selection:text-[#0e2b63]"
  >
    <!-- Header with Logo -->
    <header class="p-6 border-b flex items-center w-full border-white/10">
      <div class="font-medium tracking-tighter text-lg text-white">VO</div>
    </header>

    <!-- Main Content -->
    <main
      class="flex-1 w-full max-w-md mx-auto p-6 flex flex-col justify-center pb-20"
    >
      <!-- Title & Description -->
      <div class="mb-10 text-center">
        <h1 class="text-3xl font-medium tracking-tight mb-3 text-white">
          Voice Order
        </h1>
        <p class="text-sm font-normal leading-relaxed text-white/60">
          Click on component below to start recording order.
        </p>
      </div>

      <!-- Active Recorder Component -->
      <div
        class="w-full bg-[#FFFFFF] border border-[#0D2B63]/10 p-8 flex flex-col items-center justify-center relative overflow-hidden shadow-[0_4px_40px_-10px_rgba(13,43,99,0.05)] mb-8"
      >
        <!-- Decorative Pulse Rings -->
        <div
          class="absolute w-36 h-36 bg-[#004F9F]/5 animate-ping"
          style="animation-duration: 3s;"
        ></div>
        <div
          class="absolute w-24 h-24 bg-[#004F9F]/10 animate-ping"
          style="animation-duration: 2s; animation-delay: 0.5s;"
        ></div>

        <!-- Main Record Button -->
        <button
          class="relative z-10 w-20 h-20 bg-[#004F9F] text-[#FFFFFF] flex items-center justify-center shadow-lg shadow-[#004F9F]/20 transition-transform active:scale-95 group"
        >
          <iconify-icon
            icon="solar:microphone-2-linear"
            width="32"
            height="32"
            style="stroke-width: 1.5;"
          ></iconify-icon>
        </button>

        <!-- Recording Status & Stop Option -->
        <div class="mt-8 flex items-center gap-4 relative z-10">
          <div
            class="flex items-center gap-2 bg-[#0D2B63]/5 px-4 py-2 border border-[#0D2B63]/5"
          >
            <div class="w-2 h-2 bg-red-500 animate-pulse"></div>
            <span
              class="text-sm font-medium text-[#0D2B63] tracking-wide w-12 text-center"
            >
              00:14
            </span>
          </div>

          <button
            class="flex items-center gap-1.5 text-xs font-medium text-[#0D2B63]/60 hover:text-[#0D2B63] bg-[#FFFFFF] px-4 py-2 border border-[#0D2B63]/10 shadow-sm transition-colors"
          >
            <iconify-icon
              icon="solar:stop-circle-linear"
              width="18"
              height="18"
              style="stroke-width: 1.5;"
            ></iconify-icon>
            Stop
          </button>
        </div>
      </div>

      <!-- Recorded Audio Display -->
      <div class="w-full flex flex-col gap-3 mb-10">
        <h2
          class="text-xs font-medium uppercase tracking-widest px-2 text-white/40"
        >
          Recorded Order
        </h2>

        <div
          class="bg-[#FFFFFF] border border-[#0D2B63]/10 p-3.5 flex items-center gap-4 shadow-sm hover:border-[#0D2B63]/20 transition-colors group"
        >
          <!-- Play Button -->
          <button
            class="w-10 h-10 shrink-0 bg-[#004F9F] text-[#FFFFFF] flex items-center justify-center shadow-md shadow-[#004F9F]/20 transition-transform active:scale-95"
          >
            <iconify-icon
              icon="solar:play-linear"
              width="20"
              height="20"
              style="stroke-width: 1.5;"
            ></iconify-icon>
          </button>

          <!-- Custom Waveform Display -->
          <div class="flex-1 flex items-end gap-[3px] h-8 pt-1">
            <!-- Played Portion (Solid Blue) -->
            <div class="w-1 bg-[#004F9F]" style="height: 30%"></div>
            <div class="w-1 bg-[#004F9F]" style="height: 60%"></div>
            <div class="w-1 bg-[#004F9F]" style="height: 100%"></div>
            <div class="w-1 bg-[#004F9F]" style="height: 80%"></div>
            <div class="w-1 bg-[#004F9F]" style="height: 40%"></div>
            <div class="w-1 bg-[#004F9F]" style="height: 70%"></div>
            <!-- Unplayed Portion (Faded) -->
            <div class="w-1 bg-[#0D2B63]/10" style="height: 90%"></div>
            <div class="w-1 bg-[#0D2B63]/10" style="height: 50%"></div>
            <div class="w-1 bg-[#0D2B63]/10" style="height: 30%"></div>
            <div class="w-1 bg-[#0D2B63]/10" style="height: 60%"></div>
            <div class="w-1 bg-[#0D2B63]/10" style="height: 100%"></div>
            <div class="w-1 bg-[#0D2B63]/10" style="height: 80%"></div>
            <div class="w-1 bg-[#0D2B63]/10" style="height: 40%"></div>
            <div class="w-1 bg-[#0D2B63]/10" style="height: 70%"></div>
            <div class="w-1 bg-[#0D2B63]/10" style="height: 50%"></div>
            <div class="w-1 bg-[#0D2B63]/10" style="height: 90%"></div>
            <div class="w-1 bg-[#0D2B63]/10" style="height: 60%"></div>
            <div class="w-1 bg-[#0D2B63]/10" style="height: 30%"></div>
          </div>

          <!-- Duration -->
          <div
            class="text-xs font-medium text-[#0D2B63]/60 tracking-wide shrink-0"
          >
            01:23
          </div>

          <!-- Delete Action -->
          <button
            class="shrink-0 w-8 h-8 flex items-center justify-center text-[#0D2B63]/30 hover:text-red-500 hover:bg-red-50 transition-colors"
          >
            <iconify-icon
              icon="solar:trash-bin-trash-linear"
              width="18"
              height="18"
              style="stroke-width: 1.5;"
            ></iconify-icon>
          </button>
        </div>
      </div>

      <!-- Apply Button -->
      <button
        class="w-full py-4 px-6 text-sm font-medium transition-all duration-200 flex items-center justify-center gap-2 group mt-auto bg-white hover:bg-gray-50 text-[#0e2b63] shadow-[0_8px_30px_-8px_rgba(0,0,0,0.2)]"
      >
        <span>Apply Audio &amp; Start Creation</span>
        <iconify-icon
          icon="solar:arrow-right-linear"
          width="18"
          height="18"
          style="stroke-width: 1.5;"
          class="group-hover:translate-x-1 transition-transform"
        ></iconify-icon>
      </button>
    </main>
  </body>
