    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Playful Startup Theme Variables */
            --font-primary: 'Poppins', sans-serif;

            --bg-page-display: #e0e1e9; /* Neutral background for showcasing the dark footer */
            --bg-footer: #2c2c38;
            --bg-footer-blob1: rgba(240, 173, 78, 0.05);
            --bg-footer-blob2: rgba(217, 83, 79, 0.04);
            --bg-footer-star: var(--text-cta-accent);

            --text-cta-accent: #f0ad4e;
            --text-on-dark: #e0e1e9;
            --text-on-dark-muted: #a0a2b3;

            --radius-blobby: 40% 60% 70% 30% / 40% 50% 60% 50%;

            --transition-speed: 0.3s;
            --transition-bounce: cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--bg-page-display);
            line-height: 1.7;
            min-height: 100vh;
            display: flex; /* For centering the footer */
            align-items: center; /* Vertical centering */
            justify-content: center; /* Horizontal centering */
            padding: 20px; /* Some padding around the footer */
        }

        /* --- Footer Styles --- */
        .main-footer {
            background-color: var(--bg-footer);
            color: var(--text-on-dark);
            padding: 70px 40px 50px;
            text-align: center;
            position: relative; 
            overflow: hidden;
            border-radius: 16px; /* Optional: round corners if it's displayed as a "card" */
            width: 100%; /* Allow it to take width */
            max-width: 900px; /* But constrain it */
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .footer-content {
            max-width: 700px; /* Slightly less than footer max-width for internal padding */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            position: relative;
            z-index: 2;
        }
        .footer-logo a {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-cta-accent);
            text-decoration: none;
            transition: text-shadow 0.3s ease, transform 0.3s var(--transition-bounce);
            display: inline-block;
        }
        .footer-logo a:hover {
            transform: scale(1.05) rotate(-2deg);
            text-shadow: 0 0 15px rgba(var(--text-cta-accent), 0.8), 0 0 5px rgba(var(--text-cta-accent),0.5);
        }
        .footer-logo a .exclamation {
            display: inline-block;
            transition: transform 0.3s var(--transition-bounce);
        }
        .footer-logo a:hover .exclamation {
            transform: translateY(-5px) scaleY(1.1) rotate(10deg);
        }

        .footer-links ul {
            list-style: none; padding: 0; display: flex;
            gap: 25px; flex-wrap: wrap; justify-content: center;
        }
        .footer-links a {
            color: var(--text-on-dark-muted); text-decoration: none;
            font-weight: 500;
            transition: color var(--transition-speed) ease, transform var(--transition-speed) ease;
            display: inline-block;
        }
        .footer-links a:hover {
            color: var(--text-cta-accent);
            transform: translateY(-2px);
        }
        .social-links {
            display: flex; gap: 30px; margin-top: 10px;
        }
        .social-links a {
            color: var(--text-on-dark-muted); font-size: 1.6rem; text-decoration: none;
            transition: transform 0.3s var(--transition-bounce), color 0.3s ease, filter 0.3s ease;
            display: inline-block;
        }
        .social-links a:hover {
            transform: scale(1.3) rotate(-15deg) translateY(-3px);
            color: var(--text-cta-accent);
            filter: drop-shadow(0 0 5px rgba(var(--text-cta-accent), 0.7));
        }
        .copyright {
            font-size: 0.9rem; color: var(--text-on-dark-muted);
            margin-top: 20px; opacity: 0.8;
        }

        /* Footer Background Animations */
        .footer-blob {
            position: absolute;
            border-radius: var(--radius-blobby);
            opacity: 0.03;
            filter: blur(30px);
            animation: footer-float 40s infinite ease-in-out alternate;
            z-index: 0;
        }
        .footer-blob.b1 {
            width: 350px; height: 350px; background: var(--bg-footer-blob1);
            top: 10%; left: -10%; animation-duration: 45s;
        }
        .footer-blob.b2 {
            width: 300px; height: 300px; background: var(--bg-footer-blob2);
            bottom: 5%; right: -15%; animation-duration: 55s; animation-delay: -10s;
        }
        @keyframes footer-float {
            0% { transform: translateY(0px) translateX(0px) scale(1); border-radius: var(--radius-blobby); }
            50% { transform: translateY(-20px) translateX(15px) scale(1.1); border-radius: 30% 70% 60% 40% / 50% 40% 60% 50%;}
            100% { transform: translateY(0px) translateX(0px) scale(1); border-radius: var(--radius-blobby); }
        }

        .footer-star {
            position: absolute;
            background-color: var(--bg-footer-star);
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 5s infinite ease-in-out;
            z-index: 0;
        }
        .footer-star.s1 { width: 2px; height: 2px; top: 20%; left: 15%; animation-delay: 0s; }
        .footer-star.s2 { width: 3px; height: 3px; top: 70%; left: 80%; animation-delay: 1.5s; }
        .footer-star.s3 { width: 2px; height: 2px; top: 40%; left: 50%; animation-delay: 3s; }
        .footer-star.s4 { width: 2px; height: 2px; top: 85%; left: 10%; animation-delay: 0.5s; }
        .footer-star.s5 { width: 3px; height: 3px; top: 10%; left: 70%; animation-delay: 2.5s; }

        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }

        /* Responsive adjustments for footer when standalone */
        @media (max-width: 768px) {
            .main-footer { padding: 50px 20px 30px; }
            .footer-logo a { font-size: 2rem; }
            .footer-links ul { gap: 20px; }
            .social-links { gap: 25px; }
            .social-links a { font-size: 1.5rem; }
        }
         @media (max-width: 480px) {
            .footer-links ul { flex-direction: column; gap: 10px; } /* Stack links on very small screens */
         }

    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Current Year for Footer
            const yearSpan = document.getElementById('currentYear');
            if(yearSpan) {
                yearSpan.textContent = new Date().getFullYear();
            }

            // Smooth scroll for any on-page links (only if they point to an ID on this very page)
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    const href = this.getAttribute('href');
                    if (href.startsWith('#') && href.length > 1) {
                        const targetElement = document.querySelector(href);
                        if (targetElement) {
                            e.preventDefault();
                            targetElement.scrollIntoView({ behavior: 'smooth' });
                        }
                    }
                });
            });
        });
    </script>
