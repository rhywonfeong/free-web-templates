  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-['Plus_Jakarta_Sans']">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-lg overflow-hidden">
      <div class="md:flex">
        <!-- Left Column: Login Form -->
        <div class="md:w-3/5 p-8 flex flex-col justify-center">
          <div class="mb-10">
            <h2 class="text-2xl font-bold text-gray-800">Sign in to your account</h2>
            <p class="text-gray-500 mt-2">Welcome back! Please enter your details.</p>
          </div>
          <form class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email address</label>
              <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@email.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
              <div class="relative">
                <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                <button type="button" tabindex="-1" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>
            <div class="flex items-center justify-between">
              <label class="flex items-center">
                <input type="checkbox" class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-0">
                <span class="ml-2 block text-sm text-gray-700">Remember me</span>
              </label>
              <a href="#" class="text-sm text-indigo-600 hover:text-indigo-500 font-medium">Forgot password?</a>
            </div>
            <div class="pt-2">
              <button type="submit" class="w-full bg-indigo-600 text-white py-3 px-4 rounded-lg hover:bg-indigo-700 transition font-medium flex items-center justify-center">
                <span>Sign in</span>
                <i class="fa-solid fa-arrow-right ml-2 text-sm"></i>
              </button>
            </div>
          </form>
          <div class="mt-6 text-center">
            <p class="text-sm text-gray-500">Don't have an account? 
              <a href="#" class="text-indigo-600 hover:text-indigo-500 font-medium">Sign up</a>
            </p>
          </div>
          <div class="mt-6 flex items-center justify-center space-x-4">
            <button class="flex items-center px-4 py-2 border border-gray-200 rounded-lg hover:bg-gray-50 transition">
              <i class="fa-brands fa-google text-red-500 mr-2"></i>
              <span class="text-sm text-gray-700">Google</span>
            </button>
            <button class="flex items-center px-4 py-2 border border-gray-200 rounded-lg hover:bg-gray-50 transition">
              <i class="fa-brands fa-github text-gray-700 mr-2"></i>
              <span class="text-sm text-gray-700">GitHub</span>
            </button>
          </div>
        </div>
        <!-- Right Column: Logo/Welcome -->
        <div class="md:w-2/5 bg-gray-50 p-8 border-l border-gray-200 flex flex-col items-center justify-center text-center">
          <div class="mb-6">
            <img src="https://aurachat.io/logo-aura.svg" alt="AuraChat Logo" class="w-32 h-32 mx-auto filter invert">
          </div>
          <h3 class="text-lg font-semibold text-gray-800 mb-2">Welcome to Dashboard</h3>
          <p class="text-gray-500 mb-4">Access your projects, teams, and payments in one place.</p>
          <div class="flex items-center justify-center space-x-3 mt-6">
            <i class="fa-solid fa-shield-halved text-indigo-500 text-xl"></i>
            <span class="text-xs text-gray-500">Your credentials are encrypted & secure</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
