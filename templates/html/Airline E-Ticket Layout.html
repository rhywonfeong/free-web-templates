    .ticket-dotted-border {

      border-radius: 50%;
      right: -14px;
      z-index: 10;
    }
    .circle-cutout::before {
      top: -14px;
    }
    .circle-cutout::after {
      bottom: -14px;
    }
    .big-circle-cutout::before,
    .big-circle-cutout::after {
      content: "";
      position: absolute;
      background-color: #f5f5f5;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      left: -22px;
      z-index: 10;
    }
    .big-circle-cutout::before {
      top: -18px;
    }
    .big-circle-cutout::after {
      bottom: -18px;
