<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elegant Animated Gradient Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .gradient-border {
      position: relative;
      z-index: 0;
      border-radius: 1rem;
      padding: 2px;
      background: linear-gradient(270deg,
        #a78bfa, #f472b6, #60a5fa, #34d399, #f59e42, #a78bfa);
      background-size: 1200% 1200%;
      animation: gradientBorderMove 8s ease-in-out infinite;
    }
    @keyframes gradientBorderMove {
      0% { background-position: 0% 50%;}
      50% { background-position: 100% 50%;}
      100% { background-position: 0% 50%;}
    }
    .gradient-border .card-inner {
      background: white;
      border-radius: 0.95rem;
      padding: 2rem;
      box-shadow: 0 6px 32px 0 rgba(80, 80, 160, 0.08);
      position: relative;
      z-index: 1;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-gray-100 to-gray-200">
  <div class="gradient-border max-w-sm w-full">
    <div class="card-inner">
      <div class="flex items-center gap-4 mb-4">
        <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Profile" class="w-14 h-14 rounded-full shadow-md border-2 border-white">
        <div>
          <h2 class="text-xl font-semibold text-gray-800">Alex Johnson</h2>
          <p class="text-sm text-gray-500">Product Designer</p>
        </div>
      </div>
      <div class="mb-4">
        <p class="text-gray-600">
          “Design is not just what it looks like and feels like. Design is how it works.”
        </p>
      </div>
      <div class="flex justify-between items-center mt-6">
        <button class="px-4 py-2 rounded-lg bg-indigo-500 text-white font-medium shadow hover:bg-indigo-600 transition">Follow</button>
        <span class="text-xs text-gray-400">Last active 2h ago</span>
      </div>
    </div>
  </div>
</body>
</html>
