  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hiking App Map Component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100 animate__animated animate__fadeIn">
    <!-- Map Header -->
    <div class="flex items-center justify-between px-5 pt-5">
      <div class="flex items-center gap-2">
        <i class="fas fa-hiking text-green-500 text-xl"></i>
        <span class="text-xl font-semibold tracking-tight text-gray-900">Emerald Lake Loop</span>
      </div>
      <button class="text-gray-400 hover:text-teal-500 transition">
        <i class="fas fa-ellipsis-h"></i>
      </button>
    </div>
    <!-- Map Display (SVG Path) -->
    <div class="relative h-56 bg-gradient-to-br from-green-100 to-blue-100 overflow-hidden mt-4">
      <svg class="absolute inset-0 w-full h-full" viewBox="0 0 400 224" fill="none">
        <rect width="400" height="224" rx="16" fill="#E0F2FE"/>
        <polyline points="36,210 110,140 190,170 250,90 310,150 370,80" stroke="#16A34A" stroke-width="5" fill="none" stroke-linecap="round"/>
        <circle cx="36" cy="210" r="8" fill="#22D3EE" stroke="#0369A1" stroke-width="2"/>
        <circle cx="370" cy="80" r="8" fill="#22D3EE" stroke="#0369A1" stroke-width="2"/>
      </svg>
      <span class="absolute left-6 top-7 flex items-center gap-1 text-xs text-gray-800 bg-white/90 rounded px-2 py-0.5 shadow">
        <i class="fas fa-map-marker-alt text-green-500"></i> Trailhead
      </span>
      <span class="absolute right-6 bottom-7 flex items-center gap-1 text-xs text-gray-800 bg-white/90 rounded px-2 py-0.5 shadow">
        <i class="fas fa-flag-checkered text-blue-500"></i> Finish
      </span>
    </div>
    <!-- Trail Stats -->
    <div class="flex justify-around gap-3 py-5 px-5 bg-white">
      <div class="flex flex-col items-center">
        <span class="font-bold text-lg text-green-700">12.5 km</span>
        <span class="text-xs text-gray-500 uppercase tracking-wide mt-0.5">Distance</span>
      </div>
      <div class="flex flex-col items-center">
        <span class="font-bold text-lg text-green-700">620 m</span>
        <span class="text-xs text-gray-500 uppercase tracking-wide mt-0.5">Elev. Gain</span>
      </div>
      <div class="flex flex-col items-center">
        <span class="font-bold text-lg text-green-700">4 h</span>
        <span class="text-xs text-gray-500 uppercase tracking-wide mt-0.5">Est. Time</span>
      </div>
    </div>
    <!-- Quick Info -->
    <div class="flex items-center justify-between px-5 pb-3">
      <div class="flex items-center gap-2 text-sm text-gray-500">
        <i class="fas fa-user text-gray-400"></i>
        Guide: <span class="text-gray-900 font-medium ml-1">Liam Walker</span>
      </div>
      <div class="flex items-center gap-1 text-xs">
        <i class="fas fa-signal text-green-400"></i>
        <span class="text-gray-400">Moderate</span>
      </div>
    </div>
    <!-- Actions -->
    <div class="flex gap-3 px-5 pb-6 pt-2">
      <button class="flex-1 flex items-center justify-center gap-2 bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-lg shadow-lg transition">
        <i class="fas fa-play"></i>
        Start Hike
      </button>
      <button class="flex-1 flex items-center justify-center gap-2 bg-white border border-gray-200 hover:bg-gray-50 text-green-600 font-semibold py-2 rounded-lg shadow transition">
        <i class="fas fa-share-alt"></i>
        Share
      </button>
    </div>
  </div>
</body>
</html>
