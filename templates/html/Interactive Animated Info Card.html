  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { 
      height: 100%; 
      margin: 0;
      background: hsl(256, 18%, 17%);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 400px;
      background-color: hsl(256, 18%, 20%);
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .card-content {
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body class="p-4">
  <div class="card-container rounded-xl shadow-2xl border border-white/10">
    <canvas id="animationCanvas"></canvas>
    <div class="card-content p-8 text-white">
      <h2 class="text-2xl font-semibold mb-4">Digital Experience</h2>
      <p class="text-white/80 mb-6">Transform your workflow with our intuitive platform designed for the modern digital landscape.</p>
      <div class="flex items-center space-x-4">
        <button class="bg-orange-500 hover:bg-orange-600 px-4 py-2 rounded-lg transition-colors">
          Get Started
        </button>
        <a href="#" class="text-orange-300 hover:text-orange-200 transition-colors">Learn more →</a>
      </div>
      <div class="border-t border-white/10 mt-6 pt-4">
        <div class="flex justify-between text-white/70">
          <span>Updated today</span>
          <span>v2.0.4</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('animationCanvas');
    const ctx = canvas.getContext('2d');
    const card = document.querySelector('.card-container');
    
    function resizeCanvas() {
      canvas.width = card.offsetWidth;
      canvas.height = card.offsetHeight;
    }
    
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    
    const width = canvas.width;
    const height = canvas.height;
    const halfWidth = width / 2;
    const halfHeight = height / 2;
    
    const lineCount = 40;
    const color = '#FF694B';
    const offset = Math.PI * 3.5;
    
    ctx.shadowBlur = 10;
    ctx.shadowColor = color;
    ctx.fillStyle = color;
    
    function Line(pos) { this.pos = pos; }
    
    Line.prototype = {
      constructor: Line,
      pos: 0,
      width: halfWidth,
      height: 4,
      range: halfHeight * 0.9,
      
      render: function(ctx, delta) {
        const pos = this.pos;
        const minWidth = (this.width * 0.25);
        const lineWidth = minWidth + (this.width * 0.75 * pos);
        const lineHeight = Math.cos(delta + (pos * offset)) * this.height;
        const x = (width - minWidth) * (1 - pos);
        const y = (Math.sin(delta + (pos * offset)) * (this.range/2 + this.range/2 * pos)) + halfHeight;
        
        ctx.globalAlpha = 0.3 + (0.65 * (1 - pos));
        ctx.beginPath();
        ctx.rect(x, y, lineWidth, lineHeight);
        ctx.closePath();
        ctx.fill();
      }
    };
    
    const lines = [];
    
    for (let i = 0; i < lineCount; i++) {
      lines.push(new Line(i / lineCount));
    }
    
    let wave = 0;
    function render() {
      requestAnimationFrame(render);
      wave += 0.02;
      ctx.clearRect(0, 0, width, height);
      lines.forEach(function(line) { line.render(ctx, wave); });
    }
    
    render();
  </script>
</body>
</html>
