<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
/* Holographic & Core Animations */
@keyframes ripple-expand {
0% { transform: scale(0.5); opacity: 1; border-color: rgba(6, 182, 212, 0.8); }
100% { transform: scale(4.5); opacity: 0; border-color: rgba(6, 182, 212, 0); }
}
@keyframes inner-pulse {
0%, 100% { transform: scale(1); box-shadow: inset 0 0 20px rgba(6, 182, 212, 0.3), 0 0 40px rgba(6, 182, 212, 0.4); }
50% { transform: scale(1.08); box-shadow: inset 0 0 40px rgba(34, 211, 238, 0.6), 0 0 80px rgba(34, 211, 238, 0.8); }
}
@keyframes wave-bounce {
0%, 100% { height: 0.25rem; opacity: 0.4; }
50% { height: 2rem; opacity: 1; }
}
/* Hyper-Active Roaming */
@keyframes roam {
0% { transform: translate(0, 0) scale(1) rotate(0deg); }
25% { transform: translate(25vw, -20vh) scale(0.9) rotate(5deg); }
50% { transform: translate(-20vw, 15vh) scale(1.15) rotate(-5deg); }
75% { transform: translate(-30vw, -15vh) scale(0.95) rotate(3deg); }
100% { transform: translate(0, 0) scale(1) rotate(0deg); }
}
/* Holographic Ring Spins */
@keyframes spin-holo-1 {
from { transform: rotate(0deg) scale(1); }
50% { transform: rotate(180deg) scale(1.05); }
to { transform: rotate(360deg) scale(1); }
}
@keyframes spin-holo-2 {
from { transform: rotate(360deg) scale(1); }
50% { transform: rotate(180deg) scale(0.95); }
to { transform: rotate(0deg) scale(1); }
}
/* Dynamic Moving Code Data Streams */
@keyframes code-float-up {
0% { opacity: 0; transform: translateY(30px) translateX(-10px) scale(0.9); }
20% { opacity: 1; transform: translateY(0px) translateX(0px) scale(1); }
80% { opacity: 1; transform: translateY(-20px) translateX(5px) scale(1); }
100% { opacity: 0; transform: translateY(-40px) translateX(15px) scale(0.9); }
}
@keyframes code-float-down {
0% { opacity: 0; transform: translateY(-30px) translateX(10px) scale(0.9); }
20% { opacity: 1; transform: translateY(0px) translateX(0px) scale(1); }
80% { opacity: 1; transform: translateY(20px) translateX(-5px) scale(1); }
100% { opacity: 0; transform: translateY(40px) translateX(-15px) scale(0.9); }
}
@keyframes code-pulse-lateral {
0% { opacity: 0; transform: translateX(-30px); }
20% { opacity: 1; transform: translateX(0px); }
80% { opacity: 1; transform: translateX(20px); }
100% { opacity: 0; transform: translateX(40px); }
}
/* Base Utility Classes */
.animate-ripple-1 { animation: ripple-expand 2s cubic-bezier(0.1, 0.2, 0.8, 1) infinite; }
.animate-ripple-2 { animation: ripple-expand 2s cubic-bezier(0.1, 0.2, 0.8, 1) infinite; animation-delay: 0.6s; }
.animate-ripple-3 { animation: ripple-expand 2s cubic-bezier(0.1, 0.2, 0.8, 1) infinite; animation-delay: 1.2s; }
.animate-ripple-4 { animation: ripple-expand 2s cubic-bezier(0.1, 0.2, 0.8, 1) infinite; animation-delay: 1.8s; }
.animate-core { animation: inner-pulse 1.5s ease-in-out infinite; }
.animate-roam { animation: roam 15s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
.animate-spin-holo-1 { animation: spin-holo-1 6s linear infinite; }
.animate-spin-holo-2 { animation: spin-holo-2 8s linear infinite; }
.animate-spin-fast { animation: spin-holo-1 3s linear infinite; }
/* Code Streams */
.stream-up-1 { animation: code-float-up 4s ease-in-out infinite; animation-delay: 0s; }
.stream-up-2 { animation: code-float-up 4.5s ease-in-out infinite; animation-delay: 1.5s; }
.stream-down-1 { animation: code-float-down 5s ease-in-out infinite; animation-delay: 0.5s; }
.stream-down-2 { animation: code-float-down 4s ease-in-out infinite; animation-delay: 2s; }
.stream-lat-1 { animation: code-pulse-lateral 3.5s ease-in-out infinite; animation-delay: 1s; }
.stream-lat-2 { animation: code-pulse-lateral 4.2s ease-in-out infinite; animation-delay: 2.5s; }
/* Waveform Visualizer */
.wave-bar { animation: wave-bounce 0.8s ease-in-out infinite; }
.wave-bar:nth-child(1) { animation-delay: 0.0s; }
.wave-bar:nth-child(2) { animation-delay: 0.1s; }
.wave-bar:nth-child(3) { animation-delay: 0.2s; }
.wave-bar:nth-child(4) { animation-delay: 0.3s; }
.wave-bar:nth-child(5) { animation-delay: 0.4s; }
.wave-bar:nth-child(6) { animation-delay: 0.5s; }
.wave-bar:nth-child(7) { animation-delay: 0.6s; }
.wave-bar:nth-child(8) { animation-delay: 0.7s; }
.wave-bar:nth-child(9) { animation-delay: 0.8s; }
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>

</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-slate-950 text-slate-200 h-screen w-full flex flex-col overflow-hidden font-[Inter] antialiased selection:bg-cyan-900 selection:text-white">

    <!-- Header (Icon Only) -->
    <header class="flex w-full max-w-6xl z-30 mr-auto ml-auto pt-6 pr-6 pb-6 pl-6 relative items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-cyan-950 to-slate-900 border border-cyan-800/50 flex items-center justify-center shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                <div class="animate-pulse bg-cyan-300 w-3 h-3 rounded-full shadow-[0_0_10px_rgba(34,211,238,0.8)]">SEAINT</div>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button class="text-cyan-600 hover:text-cyan-300 transition-colors hidden sm:block drop-shadow-[0_0_5px_rgba(6,182,212,0.5)]">
                <iconify-icon icon="solar:widget-5-linear" width="24" stroke-width="1.5"></iconify-icon>
            </button>
        </div>
    </header>

    <!-- Main Visualizer Area -->
    <main class="flex-1 flex flex-col z-10 w-full pr-6 pl-6 relative items-center justify-center">
        
        <!-- Ambient Background Holographic Glow -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-60 mix-blend-screen">
            <div class="w-[50rem] h-[50rem] rounded-full bg-[radial-gradient(circle,rgba(6,182,212,0.15)_0%,rgba(14,165,233,0.05)_30%,transparent_70%)]"></div>
        </div>

        <!-- The Motion Holographic Core (Roaming) -->
        <div class="absolute w-64 h-64 flex items-center justify-center animate-roam z-20 pointer-events-none">
            
            <!-- Listening Holographic Ripples -->
            <div class="absolute inset-0 rounded-full border border-cyan-400/40 animate-ripple-1 shadow-[0_0_20px_rgba(6,182,212,0.2)]"></div>
            <div class="absolute inset-0 rounded-full border border-cyan-400/30 animate-ripple-2 shadow-[0_0_20px_rgba(6,182,212,0.2)]"></div>
            <div class="absolute inset-0 rounded-full border border-sky-400/20 animate-ripple-3 shadow-[0_0_20px_rgba(14,165,233,0.2)]"></div>
            <div class="absolute inset-0 rounded-full border border-teal-400/10 animate-ripple-4"></div>
            
            <!-- Central Core Glow -->
            <div class="absolute w-48 h-48 rounded-full bg-gradient-to-b from-cyan-400/20 to-transparent blur-3xl mix-blend-screen"></div>

            <!-- Orbiting Holographic Rings -->
            <div class="absolute inset-1 rounded-full border-2 border-dashed border-cyan-500/50 animate-spin-holo-1 drop-shadow-[0_0_8px_rgba(34,211,238,0.5)]"></div>
            <div class="absolute inset-6 rounded-full border border-dotted border-sky-400/60 animate-spin-holo-2 drop-shadow-[0_0_5px_rgba(14,165,233,0.4)]"></div>
            <div class="absolute inset-10 rounded-full border border-dashed border-teal-300/30 animate-spin-fast"></div>

            <!-- Intensive Floating Data Streams -->
            
            <!-- Right Cluster -->
            <div class="absolute -right-40 top-0 flex flex-col gap-5 font-mono text-[10px] sm:text-xs z-30">
                <div class="stream-up-1 text-cyan-200 bg-slate-900/60 px-2 py-1.5 rounded backdrop-blur-md border border-cyan-800/80 shadow-[0_0_12px_rgba(6,182,212,0.4)] tracking-widest">
                    0x7F_BUFFER_OVERRIDE
                </div>
                <div class="stream-lat-1 text-sky-100 bg-slate-800/70 px-2 py-1 rounded backdrop-blur-md border border-sky-600/60 shadow-[0_0_15px_rgba(56,189,248,0.5)]">
                    await sys.holo_render()
                </div>
                <div class="stream-down-1 text-teal-300 bg-slate-950/80 px-2 py-1 rounded backdrop-blur-md border border-teal-900 shadow-[0_0_10px_rgba(45,212,191,0.3)]">
                    [1011 0100 1101 0001]
                </div>
            </div>

            <!-- Left Cluster -->
            <div class="absolute -left-48 bottom-10 flex flex-col gap-4 font-mono text-[10px] sm:text-xs z-30">
                <div class="stream-down-2 text-cyan-400 bg-slate-900/70 px-2 py-1 rounded backdrop-blur-md border border-cyan-900 shadow-[0_0_10px_rgba(6,182,212,0.3)]">
                    stream.pipe(ctx.audio)
                </div>
                <div class="stream-lat-2 text-white bg-cyan-950/80 px-2.5 py-1.5 rounded backdrop-blur-md border border-cyan-500/50 shadow-[0_0_20px_rgba(34,211,238,0.6)]">
                    &gt; LOGIC_NODE_ACTIVE
                </div>
                <div class="stream-up-2 text-sky-300 bg-slate-900/80 px-2 py-1 rounded backdrop-blur-md border border-sky-800 shadow-[0_0_8px_rgba(14,165,233,0.3)] tracking-widest">
                    FF:A2:00:1B:C9
                </div>
            </div>

            <!-- Top Cluster -->
            <div class="absolute -top-32 left-10 flex flex-col gap-3 font-mono text-[10px] sm:text-xs z-30">
                <div class="stream-lat-1 text-teal-200 bg-slate-800/50 px-2 py-1 rounded backdrop-blur-md border border-teal-700/50 shadow-[0_0_12px_rgba(45,212,191,0.4)]">
                    mem_alloc: 1024MB
                </div>
                <div class="stream-up-1 text-cyan-300 bg-slate-950/80 px-2 py-1 rounded backdrop-blur-md border border-cyan-900">
                    fn.execute(params)
                </div>
            </div>

            <!-- Interactive Neural Orb -->
            <button class="flex z-10 group animate-core hover:border-cyan-300 transition-all duration-300 cursor-pointer overflow-hidden pointer-events-auto bg-slate-950 w-32 h-32 border-cyan-500/50 border-2 rounded-full relative shadow-[inset_0_2px_30px_rgba(6,182,212,0.4),0_0_50px_rgba(6,182,212,0.5)] items-center justify-center">
                <!-- Inner holographic mesh simulation -->
                <div class="group-hover:opacity-60 transition-opacity duration-500 opacity-40 absolute inset-0 bg-[radial-gradient(circle,rgba(34,211,238,0.2)_10%,transparent_80%)]"></div>
                
                <!-- LLM "Brain" Icons -->
                <iconify-icon icon="solar:cpu-linear" width="44" stroke-width="1.5" class="absolute z-20 text-cyan-100 group-hover:scale-110 group-hover:text-white transition-transform duration-300 drop-shadow-[0_0_15px_rgba(34,211,238,1)]"></iconify-icon>
                <iconify-icon icon="solar:alt-arrow-down-outline" width="64" stroke-width="1.5" class="z-10 animate-spin-holo-2 text-cyan-500/40 absolute drop-shadow-[0_0_8px_rgba(6,182,212,0.5)]"></iconify-icon>
            </button>
        </div>

        <!-- Status Indicator Bottom (Dots Only) -->
        <div class="absolute bottom-32 flex flex-col items-center max-w-2xl w-full z-10">
            <div class="flex items-center gap-4 bg-slate-900/60 border border-cyan-900/50 px-6 py-3 rounded-full backdrop-blur-md shadow-[0_0_20px_rgba(6,182,212,0.15)]">
                <div class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-300 shadow-[0_0_8px_rgba(34,211,238,1)]"></span>
                </div>
                <div class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75" style="animation-delay: 0.2s"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-sky-300 shadow-[0_0_8px_rgba(56,189,248,1)]"></span>
                </div>
                <div class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-teal-400 opacity-75" style="animation-delay: 0.4s"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-teal-300 shadow-[0_0_8px_rgba(45,212,191,1)]"></span>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Control Bar -->
    <footer class="w-full relative z-30 pb-8 px-6">
        <div class="max-w-4xl mx-auto bg-slate-900/70 backdrop-blur-xl border border-cyan-800/40 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-6 shadow-[0_10px_40px_rgba(6,182,212,0.15)]">
            
            <!-- Left Controls: Settings & Visualizer (Icons Only) -->
            <div class="flex items-center gap-6 w-full sm:w-auto justify-between sm:justify-start">
                
                <!-- Custom Dropdown Trigger -->
                <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-slate-950/60 border border-cyan-900/60 hover:border-cyan-500/60 hover:bg-slate-800/80 transition-all group shadow-[0_0_10px_rgba(6,182,212,0.1)] hover:shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                    <iconify-icon icon="solar:tuning-square-2-linear" width="20" stroke-width="1.5" class="text-cyan-500 group-hover:text-cyan-200 drop-shadow-[0_0_5px_rgba(34,211,238,0.3)]"></iconify-icon>
                </button>

                <!-- Autonomous Mode Toggle -->
                <label class="flex items-center gap-3 cursor-pointer group">
                    <div class="relative w-12 h-6 rounded-full bg-slate-950 border border-cyan-800/80 flex items-center px-[3px] shadow-[inset_0_2px_6px_rgba(0,0,0,0.6),0_0_10px_rgba(6,182,212,0.2)]">
                        <!-- Simulated Checked State -->
                        <div class="w-4 h-4 rounded-full bg-cyan-300 shadow-[0_0_10px_rgba(34,211,238,0.8)] transform translate-x-6 transition-transform duration-300 ease-in-out"></div>
                    </div>
                </label>
            </div>

            <!-- Center: Audio Waveform (Holographic Colors) -->
            <div class="flex items-end gap-1.5 h-10 px-4 opacity-90">
                <div class="w-1.5 bg-cyan-900/80 rounded-t-full wave-bar shadow-[0_0_5px_rgba(22,78,99,0.5)]"></div>
                <div class="w-1.5 bg-cyan-700 rounded-t-full wave-bar shadow-[0_0_8px_rgba(14,116,144,0.6)]"></div>
                <div class="w-1.5 bg-cyan-500 rounded-t-full wave-bar shadow-[0_0_10px_rgba(6,182,212,0.8)]"></div>
                <div class="w-1.5 bg-cyan-300 rounded-t-full wave-bar shadow-[0_0_12px_rgba(34,211,238,1)]"></div>
                <div class="w-1.5 bg-white rounded-t-full wave-bar shadow-[0_0_15px_rgba(255,255,255,0.9),0_0_20px_rgba(34,211,238,0.8)]"></div>
                <div class="w-1.5 bg-cyan-300 rounded-t-full wave-bar shadow-[0_0_12px_rgba(34,211,238,1)]"></div>
                <div class="w-1.5 bg-cyan-500 rounded-t-full wave-bar shadow-[0_0_10px_rgba(6,182,212,0.8)]"></div>
                <div class="w-1.5 bg-cyan-700 rounded-t-full wave-bar shadow-[0_0_8px_rgba(14,116,144,0.6)]"></div>
                <div class="w-1.5 bg-cyan-900/80 rounded-t-full wave-bar shadow-[0_0_5px_rgba(22,78,99,0.5)]"></div>
            </div>

            <!-- Right Controls: Actions (Icons Only) -->
            <div class="flex items-center gap-3 w-full sm:w-auto justify-center sm:justify-end">
                <button class="w-10 h-10 rounded-full bg-slate-950 border border-cyan-900/60 flex items-center justify-center text-cyan-600 hover:text-cyan-300 hover:border-cyan-500 hover:bg-slate-800 transition-all shadow-[0_0_10px_rgba(6,182,212,0.1)]">
                    <iconify-icon icon="solar:pause-linear" width="20" stroke-width="1.5"></iconify-icon>
                </button>
                <button class="w-10 h-10 rounded-full bg-slate-950 border border-cyan-900/60 flex items-center justify-center text-rose-500 hover:text-white hover:bg-rose-500/20 hover:border-rose-500/50 transition-all shadow-[0_0_10px_rgba(244,63,94,0.1)]">
                    <iconify-icon icon="solar:stop-linear" width="20" stroke-width="1.5"></iconify-icon>
                </button>
                <div class="w-px h-6 bg-cyan-900/50 mx-1"></div>
                <button class="w-14 h-10 rounded-full bg-gradient-to-r from-cyan-400 to-sky-400 text-slate-950 hover:from-cyan-300 hover:to-sky-300 transition-all flex items-center justify-center shadow-[0_0_20px_rgba(34,211,238,0.4)] hover:shadow-[0_0_30px_rgba(34,211,238,0.6)]">
                    <iconify-icon icon="solar:plain-linear" width="22" stroke-width="1.5"></iconify-icon>
                </button>
            </div>
            
        </div>
    </footer>

</body></html>
