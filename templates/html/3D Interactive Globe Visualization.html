  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Globe Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white/10 backdrop-blur-xl rounded-2xl overflow-hidden shadow-2xl border border-white/20">
    <div class="relative h-64">
      <canvas
        id="cobe"
        style="width: 100%; height: 100%"
        width="1000"
        height="1000"
        class="absolute inset-0"
      ></canvas>
      <div class="absolute top-3 left-4 z-10">
        <h2 class="text-2xl font-bold text-white">Global Network</h2>
        <p class="text-white/70 text-sm">Interactive 3D visualization</p>
      </div>
      <div class="absolute bottom-3 right-4 bg-black/30 backdrop-blur-md rounded-lg p-2 z-10">
        <div class="flex space-x-3 text-xs text-white">
          <div class="flex items-center">
            <span class="w-3 h-3 rounded-full bg-pink-500 mr-1"></span>
            <span>Main Hub</span>
          </div>
          <div class="flex items-center">
            <span class="w-3 h-3 rounded-full bg-blue-400 mr-1"></span>
            <span>Regional Office</span>
          </div>
        </div>
      </div>
    </div>
    <div class="p-5 bg-black/40">
      <div class="flex justify-between text-white/80 text-sm">
        <div>
          <p class="font-medium">San Francisco</p>
          <p class="text-xs text-white/60">Headquarters</p>
        </div>
        <div>
          <p class="font-medium">New York</p>
          <p class="text-xs text-white/60">East Coast Office</p>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-white/10">
        <p class="text-white/70 text-sm">Our global presence spans key strategic locations, enabling us to serve clients worldwide with localized expertise and 24/7 support capabilities.</p>
      </div>
    </div>
  </div>

  <script type="module">
    import createGlobe from 'https://cdn.skypack.dev/cobe'

    let phi = 0
    let canvas = document.getElementById("cobe")

    const globe = createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 1000,
      height: 1000,
      phi: 0,
      theta: 0.2,
      dark: 1,
      diffuse: 1.2,
      scale: 1.1,
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [0.3, 0.3, 0.6],
      markerColor: [1, 0.5, 1],
      glowColor: [0.7, 0.7, 1],
      offset: [0, 0],
      markers: [
        { location: [37.7595, -122.4367], size: 0.06 },
        { location: [40.7128, -74.006], size: 0.03 },
        { location: [51.5074, -0.1278], size: 0.03 },
        { location: [35.6762, 139.6503], size: 0.03 },
      ],
      onRender: (state) => {
        state.phi = phi
        phi += 0.003
      },
    })
  </script>
</body>
</html>
