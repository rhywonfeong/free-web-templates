<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Compare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-blue-100 min-h-screen font-sans">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center text-blue-800 mb-8">Weather Compare</h1>
        
        <!-- Search Section -->
        <div class="flex flex-col md:flex-row gap-4 mb-8">
            <div class="flex-1">
                <div class="relative">
                    <input type="text" placeholder="Enter first location" class="w-full p-3 rounded-lg border border-blue-200 shadow-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" value="New York">
                    <button class="absolute right-2 top-2.5 text-blue-500 hover:text-blue-700">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
            <div class="flex-1">
                <div class="relative">
                    <input type="text" placeholder="Enter second location" class="w-full p-3 rounded-lg border border-blue-200 shadow-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" value="London">
                    <button class="absolute right-2 top-2.5 text-blue-500 hover:text-blue-700">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-6 rounded-lg shadow-md transition duration-200 ease-in-out transform hover:scale-105">
                Compare
            </button>
        </div>
        
        <!-- Weather Cards Section -->
        <div class="flex flex-col md:flex-row gap-6">
            <!-- First Location -->
            <div class="flex-1 bg-white rounded-xl shadow-lg overflow-hidden">
                <div class="bg-gradient-to-r from-blue-500 to-blue-600 p-4">
                    <h2 class="text-xl font-bold text-white">New York, US</h2>
                    <p class="text-blue-100">Monday, June 5</p>
                </div>
                <div class="p-6">
                    <div class="flex items-center justify-between mb-6">
                        <div class="text-5xl font-bold text-gray-800">72°F</div>
                        <div class="text-5xl text-blue-500">
                            <i class="fas fa-cloud-sun"></i>
                        </div>
                    </div>
                    <p class="text-gray-600 mb-4">Partly Cloudy</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex items-center">
                            <i class="fas fa-temperature-high text-orange-500 mr-2"></i>
                            <div>
                                <p class="text-xs text-gray-500">Feels Like</p>
                                <p class="font-medium">75°F</p>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-wind text-blue-500 mr-2"></i>
                            <div>
                                <p class="text-xs text-gray-500">Wind</p>
                                <p class="font-medium">8 mph</p>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-tint text-blue-500 mr-2"></i>
                            <div>
                                <p class="text-xs text-gray-500">Humidity</p>
                                <p class="font-medium">65%</p>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-sun text-yellow-500 mr-2"></i>
                            <div>
                                <p class="text-xs text-gray-500">UV Index</p>
                                <p class="font-medium">5 of 10</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Second Location -->
            <div class="flex-1 bg-white rounded-xl shadow-lg overflow-hidden">
                <div class="bg-gradient-to-r from-indigo-500 to-indigo-600 p-4">
                    <h2 class="text-xl font-bold text-white">London, UK</h2>
                    <p class="text-indigo-100">Monday, June 5</p>
                </div>
                <div class="p-6">
                    <div class="flex items-center justify-between mb-6">
                        <div class="text-5xl font-bold text-gray-800">59°F</div>
                        <div class="text-5xl text-gray-500">
                            <i class="fas fa-cloud-rain"></i>
                        </div>
                    </div>
                    <p class="text-gray-600 mb-4">Light Rain</p>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex items-center">
                            <i class="fas fa-temperature-high text-orange-500 mr-2"></i>
                            <div>
                                <p class="text-xs text-gray-500">Feels Like</p>
                                <p class="font-medium">56°F</p>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-wind text-blue-500 mr-2"></i>
                            <div>
                                <p class="text-xs text-gray-500">Wind</p>
                                <p class="font-medium">12 mph</p>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-tint text-blue-500 mr-2"></i>
                            <div>
                                <p class="text-xs text-gray-500">Humidity</p>
                                <p class="font-medium">78%</p>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <i class="fas fa-sun text-yellow-500 mr-2"></i>
                            <div>
                                <p class="text-xs text-gray-500">UV Index</p>
                                <p class="font-medium">2 of 10</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
