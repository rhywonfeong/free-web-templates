  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .sidebar-transition { transition: width 0.2s ease-out; }
    body { overflow: hidden; }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <div class="p-[60px]">
    <div class="w-[480px] h-[320px] bg-white rounded-lg shadow-lg overflow-hidden flex relative">
      <!-- Sidebar (collapsed by default) -->
      <div id="sidebar" class="sidebar-transition w-12 h-full bg-gray-50 border-r border-gray-200 flex flex-col">
        <!-- Logo area -->
        <div class="p-3 border-b border-gray-200">
          <div class="flex items-center">
            <div class="w-6 h-6 rounded bg-indigo-600 flex items-center justify-center text-white font-bold text-xs">A</div>
            <span id="logo-text" class="ml-2 text-sm font-medium text-gray-800 hidden">Aura</span>
          </div>
        </div>
        
        <!-- Navigation -->
        <nav class="flex-1 pt-2 overflow-y-auto">
          <ul class="px-2">
            <li class="px-2 py-1.5 rounded-md bg-indigo-50 text-indigo-700 text-xs font-medium flex items-center">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
              </svg>
              <span id="home-text" class="ml-2 text-xs hidden">Home</span>
            </li>
            <li class="px-2 py-1.5 mt-1 rounded-md text-gray-600 hover:bg-gray-100 text-xs flex items-center">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"></path>
              </svg>
              <span id="projects-text" class="ml-2 text-xs hidden">Projects</span>
            </li>
            <li class="px-2 py-1.5 mt-1 rounded-md text-gray-600 hover:bg-gray-100 text-xs flex items-center">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"></path>
              </svg>
              <span id="issues-text" class="ml-2 text-xs hidden">Issues</span>
            </li>
            <li class="px-2 py-1.5 mt-1 rounded-md text-gray-600 hover:bg-gray-100 text-xs flex items-center">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"></path>
              </svg>
              <span id="team-text" class="ml-2 text-xs hidden">Team</span>
            </li>
          </ul>
        </nav>
        
        <!-- User profile -->
        <div class="p-3 border-t border-gray-200">
          <div class="flex items-center">
            <div class="w-6 h-6 rounded-full bg-gray-300"></div>
            <span id="user-text" class="ml-2 text-xs font-medium text-gray-700 hidden">Your Name</span>
          </div>
        </div>
      </div>
      
      <!-- Content area -->
      <div class="flex-1 flex flex-col">
        <!-- Header -->
        <div class="h-10 border-b border-gray-200 flex items-center px-4">
          <h1 class="text-sm font-medium text-gray-800">Dashboard</h1>
        </div>
        
        <!-- Main content -->
        <div class="flex-1 p-3 bg-gray-50 overflow-y-auto">
          <div class="bg-white p-3 rounded-lg shadow-sm mb-3">
            <h3 class="text-xs font-medium text-gray-800 mb-2">Recent Activity</h3>
            <p class="text-xs text-gray-600">No recent activity</p>
          </div>
          <div class="bg-white p-3 rounded-lg shadow-sm">
            <h3 class="text-xs font-medium text-gray-800 mb-2">My Tasks</h3>
            <div class="flex items-center py-1.5 border-b border-gray-100">
              <div class="w-3 h-3 rounded-full bg-blue-500 mr-2"></div>
              <p class="text-xs text-gray-700">Design new dashboard</p>
            </div>
            <div class="flex items-center py-1.5">
              <div class="w-3 h-3 rounded-full bg-green-500 mr-2"></div>
              <p class="text-xs text-gray-700">Update sidebar component</p>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Toggle button -->
      <button id="toggle-btn" class="absolute left-12 top-3 bg-gray-100 hover:bg-gray-200 rounded-r-md h-6 w-4 flex items-center justify-center shadow-sm">
        <svg id="toggle-icon" class="w-3 h-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-btn');
    const toggleIcon = document.getElementById('toggle-icon');
    const logoText = document.getElementById('logo-text');
    const homeText = document.getElementById('home-text');
    const projectsText = document.getElementById('projects-text');
    const issuesText = document.getElementById('issues-text');
    const teamText = document.getElementById('team-text');
    const userText = document.getElementById('user-text');
    
    let sidebarExpanded = false;
    
    toggleBtn.addEventListener('click', () => {
      sidebarExpanded = !sidebarExpanded;
      
      if (sidebarExpanded) {
        sidebar.classList.remove('w-12');
        sidebar.classList.add('w-44');
        toggleBtn.classList.remove('left-12');
        toggleBtn.classList.add('left-44');
        toggleIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>';
        
        // Show text
        logoText.classList.remove('hidden');
        homeText.classList.remove('hidden');
        projectsText.classList.remove('hidden');
        issuesText.classList.remove('hidden');
        teamText.classList.remove('hidden');
        userText.classList.remove('hidden');
      } else {
        sidebar.classList.remove('w-44');
        sidebar.classList.add('w-12');
        toggleBtn.classList.remove('left-44');
        toggleBtn.classList.add('left-12');
        toggleIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>';
        
        // Hide text
        logoText.classList.add('hidden');
        homeText.classList.add('hidden');
        projectsText.classList.add('hidden');
        issuesText.classList.add('hidden');
        teamText.classList.add('hidden');
        userText.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
