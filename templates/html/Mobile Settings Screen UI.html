<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=430, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Settings Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body{background:#08081a;}
    .hide-scrollbar::-webkit-scrollbar {display:none;}
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none;}
    input:checked + div { background: linear-gradient(90deg, #a21caf, #6366f1);}
    input:checked + div span { transform: translateX(1.25rem);}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#08081a] text-white">
  <div class="relative w-[390px] max-w-full h-[844px] bg-gradient-to-b from-[#181830] to-[#0a0a17] shadow-xl rounded-[40px] overflow-hidden border-4 border-[#171731] flex flex-col mx-auto">
    <div class="absolute left-1/2 -top-1.5 -translate-x-1/2 z-10 flex items-center justify-center" style="height:44px;">
      <div class="w-24 h-4 bg-black/80 rounded-b-3xl mt-2"></div>
    </div>
    <div class="flex flex-col h-full">
      <!-- Status bar -->
      <div class="flex justify-between items-center p-2 text-xs mt-2 select-none">
        <span id="clock" class="font-mono">9:41</span>
        <div class="flex space-x-1">
          <i class="fas fa-signal"></i>
          <i class="fas fa-wifi"></i>
          <i class="fas fa-battery-three-quarters"></i>
        </div>
      </div>
      <!-- Header -->
      <header class="px-6 py-4">
        <div class="flex justify-between items-center">
          <h1 class="text-2xl font-bold">Settings</h1>
          <button class="h-8 w-8 flex items-center justify-center rounded-full bg-[#1e1e3a] focus:ring-2 focus:ring-purple-400">
            <i class="fas fa-xmark"></i>
          </button>
        </div>
      </header>
      <!-- Profile -->
      <div class="flex flex-col items-center mb-6 px-6">
        <img src="https://randomuser.me/api/portraits/men/32.jpg" class="w-20 h-20 rounded-full border-4 border-[#212143] object-cover"/>
        <div class="mt-3 text-lg font-bold">Your Name</div>
        <div class="text-xs text-white/50">you@email.com</div>
        <button class="mt-3 px-4 py-2 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 font-medium text-white text-sm">Edit Profile</button>
      </div>
      <!-- Settings List -->
      <main class="flex-1 px-6 pb-28 overflow-y-auto hide-scrollbar">
        <div class="space-y-6">
          <!-- Switches -->
          <div class="bg-[#181830] rounded-2xl shadow-lg p-5">
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-4">
                <span class="bg-[#212143] rounded-full p-2"><i class="fa-solid fa-bell text-purple-400"></i></span>
                <div>
                  <div class="font-semibold">Push Notifications</div>
                  <div class="text-xs text-gray-400">Receive important updates</div>
                </div>
              </div>
              <label class="relative">
                <input type="checkbox" class="sr-only peer" checked />
                <div class="w-11 h-6 rounded-full bg-[#222241] flex items-center transition peer-checked:bg-gradient-to-r peer-checked:from-pink-500 peer-checked:to-purple-500">
                  <span class="inline-block w-5 h-5 rounded-full bg-white transition transform translate-x-1 shadow"></span>
                </div>
              </label>
            </div>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-4">
                <span class="bg-[#212143] rounded-full p-2"><i class="fa-solid fa-fingerprint text-blue-400"></i></span>
                <div>
                  <div class="font-semibold">Biometric Login</div>
                  <div class="text-xs text-gray-400">Use Face ID or Fingerprint</div>
                </div>
              </div>
              <label class="relative">
                <input type="checkbox" class="sr-only peer" />
                <div class="w-11 h-6 rounded-full bg-[#222241] flex items-center transition peer-checked:bg-gradient-to-r peer-checked:from-pink-500 peer-checked:to-purple-500">
                  <span class="inline-block w-5 h-5 rounded-full bg-white transition transform translate-x-1 peer-checked:translate-x-6 shadow"></span>
                </div>
              </label>
            </div>
          </div>
          <!-- Section -->
          <div class="bg-[#181830] rounded-2xl shadow-lg p-5 space-y-2">
            <SettingLink icon="user-shield" color="text-indigo-400" label="Privacy & Security" />
            <SettingLink icon="file-invoice-dollar" color="text-pink-400" label="Manage Subscriptions" />
            <SettingLink icon="globe" color="text-green-400" label="Language" />
            <SettingLink icon="moon" color="text-gray-300" label="Dark Mode" last />
          </div>
          <div class="bg-[#181830] rounded-2xl shadow-lg p-5 space-y-2">
            <SettingLink icon="question-circle" color="text-blue-400" label="Help & Support" />
            <SettingLink icon="right-from-bracket" color="text-red-400" label="Logout" last />
          </div>
        </div>
      </main>
      <!-- Bottom nav -->
      <nav class="absolute bottom-0 left-0 right-0 bg-[#151530]/90 rounded-t-3xl py-4 px-6 backdrop-blur-sm" style="z-index:20;">
        <div class="flex justify-between items-center">
          <div class="flex flex-col items-center cursor-pointer">
            <i class="fas fa-dollar-sign text-gray-400"></i>
            <span class="text-xs text-gray-400 mt-1">Finance</span>
          </div>
          <div class="flex flex-col items-center cursor-pointer">
            <i class="fas fa-wallet text-gray-400"></i>
            <span class="text-xs text-gray-400 mt-1">Wallet</span>
          </div>
          <div class="relative -mt-8">
            <button class="w-14 h-14 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center shadow-lg">
              <i class="fas fa-plus text-white text-xl"></i>
            </button>
          </div>
          <div class="flex flex-col items-center cursor-pointer">
            <i class="fas fa-chart-pie text-gray-400"></i>
            <span class="text-xs text-gray-400 mt-1">Stats</span>
          </div>
          <div class="flex flex-col items-center cursor-pointer">
            <i class="fas fa-ellipsis-h text-purple-500"></i>
            <span class="text-xs text-purple-500 mt-1">Settings</span>
            <div class="w-1 h-1 bg-purple-500 rounded-full mt-1"></div>
          </div>
        </div>
      </nav>
    </div>
  </div>
  <script>
    // Time Display
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Setting link renderer (for repeated settings lines)
    function SettingLink({icon, color, label, last = false}) {
      var root = document.currentScript.ownerDocument || document;
      const main = root.querySelector("main");
      // If already rendered, don't do it again
      if (main && !main.querySelector(`[data-label='${label}']`)) {
        const line = document.createElement("div");
        line.className = (last?"pt-2 border-t border-white/10 mt-1 ":"") + ' flex items-center justify-between py-2 px-1 hover:bg-white/5 rounded-lg cursor-pointer transition';
        line.setAttribute('data-label', label);
        line.innerHTML = `
          <div class="flex items-center gap-4">
            <span class="bg-[#212143] rounded-full p-2"><i class="fa-solid fa-${icon} ${color}"></i></span>
            <span>${label}</span>
          </div>
          <i class="fas fa-chevron-right text-xs opacity-40"></i>
        `;
        const section = document.querySelectorAll(".space-y-2");
        // Place in last section if last, otherwise in the right section
        if(section.length > 0) {
          (last ? section[section.length-1] : section[0]).appendChild(line);
        }
      }
    }

    // Render dynamic settings links
    SettingLink({icon:"user-shield",color:"text-indigo-400",label:"Privacy & Security"});
    SettingLink({icon:"file-invoice-dollar",color:"text-pink-400",label:"Manage Subscriptions"});
    SettingLink({icon:"globe",color:"text-green-400",label:"Language"});
    SettingLink({icon:"moon",color:"text-gray-300",label:"Dark Mode",last:true});
    SettingLink({icon:"question-circle",color:"text-blue-400",label:"Help & Support"});
    SettingLink({icon:"right-from-bracket",color:"text-red-400",label:"Logout",last:true});
  </script>
</body>
</html>
