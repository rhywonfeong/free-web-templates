<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalentMap Compass - Create Email Campaign</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
.dialog-enter {
opacity: 0;
transform: scale(0.95);
}
.dialog-enter-active {
opacity: 1;
transform: scale(1);
transition: all 300ms ease-out;
}
.item-enter {
opacity: 0;
transform: translateY(10px);
}
.item-enter-active {
opacity: 1;
transform: translateY(0);
transition: all 200ms ease-out;
}
</style></head>
<body class="bg-black bg-opacity-50 font-['Open_Sans'] flex items-center justify-center min-h-screen p-4" style="font-family: 'Open Sans', sans-serif;">
    <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-[600px] dialog-enter dialog-enter-active">
            <!-- Dialog Header -->
            <div class="px-6 py-4 border-b border-gray-200" style="background-color: #006394;">
                <h2 class="text-xl font-bold text-white tracking-tight" style="opacity: 0.87;">Create an Email Campaign</h2>
            </div>
            
            <!-- Dialog Content -->
            <div class="p-6">
                <!-- Search Bar and Create New Button -->
                <div class="flex gap-2 mb-6">
                    <div class="flex-1 relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="search" class="h-5 w-5 text-gray-500"></i>
                        </div>
                        <input 
                            type="text" 
                            placeholder="Search for Templates" 
                            class="w-full h-14 pl-12 pr-4 rounded-t-md border-0 text-base focus:outline-none focus:ring-2 transition-all duration-200"
                            style="background-color: #F4F4F4; border-bottom: 2px solid transparent; font-size: 16px;"
                            onfocus="this.style.borderBottomColor='#E87424'"
                            onblur="this.style.borderBottomColor='transparent'"
                        >
                    </div>
                    <button class="px-4 h-9 rounded font-semibold text-white text-sm hover:shadow-lg transition-all duration-200 transform hover:scale-105" style="background-color: #E87424; min-width: 120px;">
                        CREATE NEW
                    </button>
                </div>
                
                <!-- Tab Navigation -->
                <div class="border-b border-gray-200 mb-6">
                    <nav class="flex space-x-8 h-12">
                        <button class="relative px-1 py-3 text-sm font-semibold uppercase tracking-wider text-gray-500 hover:text-gray-700 transition-colors duration-200" style="letter-spacing: 1.25px;">
                            TalentMap Templates
                        </button>
                        <button class="relative px-1 py-3 text-sm font-semibold uppercase tracking-wider transition-colors duration-200" style="letter-spacing: 1.25px; color: #E87424;">
                            My Templates
                            <div class="absolute bottom-0 left-0 right-0 h-0.5 rounded-full" style="background-color: #E87424;"></div>
                        </button>
                        <button class="relative px-1 py-3 text-sm font-semibold uppercase tracking-wider text-gray-500 hover:text-gray-700 transition-colors duration-200" style="letter-spacing: 1.25px;">
                            Shared Templates
                        </button>
                    </nav>
                </div>
                
                <!-- Template List -->
                <div class="space-y-2 mb-6">
                    <div class="p-4 rounded-lg hover:bg-gray-50 transition-all duration-200 cursor-pointer group item-enter item-enter-active flex items-center justify-between" style="animation-delay: 100ms;">
                        <div>
                            <h3 class="text-base font-normal text-black mb-1" style="opacity: 0.87;">Employee Engagement</h3>
                            <p class="text-sm text-gray-600" style="opacity: 0.6;">1 Initial, 3 Reminders, 1 Thank you</p>
                        </div>
                        <button class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 p-2 hover:bg-gray-100 rounded" style="color: rgba(0,0,0,0.54);">
                            <i data-lucide="trash-2" class="h-4 w-4"></i>
                        </button>
                    </div>
                    
                    <div class="p-4 rounded-lg hover:bg-gray-50 transition-all duration-200 cursor-pointer group item-enter item-enter-active flex items-center justify-between" style="animation-delay: 200ms;">
                        <div>
                            <h3 class="text-base font-normal text-black mb-1" style="opacity: 0.87;">Employee Onboarding</h3>
                            <p class="text-sm text-gray-600" style="opacity: 0.6;">2 Initial, 2 Reminders, 1 Thank you</p>
                        </div>
                        <button class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 p-2 hover:bg-gray-100 rounded" style="color: rgba(0,0,0,0.54);">
                            <i data-lucide="trash-2" class="h-4 w-4"></i>
                        </button>
                    </div>
                    
                    <div class="p-4 rounded-lg hover:bg-gray-50 transition-all duration-200 cursor-pointer group item-enter item-enter-active flex items-center justify-between" style="animation-delay: 300ms;">
                        <div>
                            <h3 class="text-base font-normal text-black mb-1" style="opacity: 0.87;">Employee Exit</h3>
                            <p class="text-sm text-gray-600" style="opacity: 0.6;">1 Initial, 2 Reminders, 1 Thank you</p>
                        </div>
                        <button class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 p-2 hover:bg-gray-100 rounded" style="color: rgba(0,0,0,0.54);">
                            <i data-lucide="trash-2" class="h-4 w-4"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Dialog Footer -->
            <div class="px-6 py-4 border-t border-gray-200 flex justify-end gap-2">
                <button class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 rounded transition-all duration-200">
                    CANCEL
                </button>
                <button class="px-4 py-2 text-sm font-medium rounded transition-all duration-200 hover:bg-orange-50" style="color: #E87424;">
                    OK
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Add staggered animation to template items
        const items = document.querySelectorAll('.item-enter');
        items.forEach((item, index) => {
            setTimeout(() => {
                item.classList.add('item-enter-active');
            }, index * 100);
        });
        
        // Tab switching functionality
        const tabs = document.querySelectorAll('nav button');
        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                // Remove active state from all tabs
                tabs.forEach(t => {
                    t.style.color = 'rgb(107 114 128)';
                    const indicator = t.querySelector('div');
                    if (indicator) indicator.remove();
                });
                
                // Add active state to clicked tab
                this.style.color = '#E87424';
                const indicator = document.createElement('div');
                indicator.className = 'absolute bottom-0 left-0 right-0 h-0.5 rounded-full';
                indicator.style.backgroundColor = '#E87424';
                this.appendChild(indicator);
            });
        });
    </script>
</body>
</html>
