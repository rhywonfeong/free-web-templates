<body class="bg-gradient-to-br from-slate-900 to-indigo-900 min-h-screen flex items-center justify-center">
  <div class="bg-gradient-to-tr from-indigo-700/90 to-indigo-400/80 rounded-2xl shadow-2xl p-8 max-w-sm w-full relative overflow-hidden font-sans">
    <!-- Heading -->
    <div class="mb-7">
      <h1 class="text-white text-[32px] md:text-[40px] leading-tight font-light tracking-tighter mb-1" style="font-family: 'Inter', sans-serif;">Sign In</h1>
      <div class="text-indigo-100 text-[16px] md:text-[20px] font-light tracking-tight" style="font-family: 'Inter', sans-serif;">Welcome back!</div>
    </div>
    <!-- Login Icon -->
    <div class="flex items-center justify-between mb-9">
      <div class="flex items-center gap-3">
        <span class="w-12 h-12 rounded-full bg-white/70 flex items-center justify-center">
          <svg class="w-7 h-7 text-indigo-700" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24">

    <form class="space-y-6">
      <div>
        <label class="block text-indigo-200 text-xs font-semibold uppercase mb-1 tracking-tight" for="email" style="font-family: 'Inter', sans-serif;">Email</label>
        <input id="email" type="email" autocomplete="username" required placeholder="you@email.com" class="w-full px-4 py-3 rounded-lg bg-indigo-900/60 border border-indigo-700 focus:border-indigo-400 text-white placeholder-indigo-300 text-[16px] font-medium outline-none transition" style="font-family: 'Inter', sans-serif;" />

      <div>

        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-lg bg-indigo-900/60 border border-indigo-700 focus:border-indigo-400 text-white placeholder-indigo-300 text-[16px] font-medium outline-none transition" style="font-family: 'Inter', sans-serif;" />
      </div>
      <div class="flex items-center justify-between -mt-2">
        <label class="flex items-center text-indigo-200 text-xs font-medium gap-2 select-none cursor-pointer" style="font-family: 'Inter', sans-serif;">
          <input type="checkbox" class="accent-indigo-400 rounded focus:ring-transparent" />

        </label>
        <a href="#" class="text-xs text-indigo-200 hover:underline focus:underline transition" style="font-family: 'Inter', sans-serif;">Forgot password?</a>
      </div>
      <button type="submit" class="w-full py-3 rounded-xl font-semibold bg-white/90 hover:bg-white text-indigo-800 hover:shadow-lg transition-all text-[16px] mt-2 shadow" style="font-family: 'Inter', sans-serif;">
