      background: #4e5ba6;

    }
    .slider-thumb::-ms-thumb {
      width: 16px;
      height: 16px;
      background: #4e5ba6;
      border-radius: 50%;
      border: 2px solid #15162a;
    }
    /* Rounded track for range input */
    input[type="range"].slider-thumb {
      height: 12px;
      border-radius: 9999px;
      background: #24263a;
      outline: none;
      padding: 0;
    }
    input[type="range"].slider-thumb::-webkit-slider-runnable-track {
