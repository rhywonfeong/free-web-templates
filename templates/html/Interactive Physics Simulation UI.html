  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MatterJS Physics Sandbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-6xl w-full">
    <div class="grid grid-cols-2 gap-6">
      <!-- Controls Panel -->
      <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 space-y-3">
        <h2 class="text-lg font-semibold text-white mb-3">Physics Controls</h2>
        
        <!-- Custom Example Dropdown -->
        <div class="relative">
          <button id="dropdownBtn" class="w-full bg-gray-700 border border-gray-600 text-white rounded px-3 py-2 text-sm flex items-center justify-between hover:bg-gray-600">
            <span id="selectedExample">Basic Falling Shapes</span>
            <svg class="w-4 h-4 transform transition-transform" id="dropdownArrow" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
          </button>
          <div id="dropdownMenu" class="absolute top-full left-0 w-full bg-gray-700 border border-gray-600 rounded mt-1 z-10 hidden">
            <div class="dropdown-item px-3 py-2 text-sm text-white hover:bg-gray-600 cursor-pointer border-b border-gray-600" data-value="basic">Basic Falling Shapes</div>
            <div class="dropdown-item px-3 py-2 text-sm text-white hover:bg-gray-600 cursor-pointer border-b border-gray-600" data-value="pendulum">Pendulum Chain</div>
            <div class="dropdown-item px-3 py-2 text-sm text-white hover:bg-gray-600 cursor-pointer border-b border-gray-600" data-value="pyramid">Shape Pyramid</div>
            <div class="dropdown-item px-3 py-2 text-sm text-white hover:bg-gray-600 cursor-pointer border-b border-gray-600" data-value="seesaw">Seesaw Physics</div>
            <div class="dropdown-item px-3 py-2 text-sm text-white hover:bg-gray-600 cursor-pointer" data-value="ragdoll">Ragdoll Character</div>
          </div>
        </div>
        
        <!-- Physics Controls Grid -->
        <div class="grid grid-cols-2 gap-4">
          <!-- Gravity -->
          <div>
            <div class="flex justify-between text-sm mb-2">
              <label class="text-gray-300">Gravity</label>
              <span id="gravityValue" class="text-white">1.0</span>
            </div>
            <input type="range" id="gravity" min="0" max="2" step="0.1" value="1" 
                   class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer border border-gray-600">
          </div>
          
          <!-- Air Friction -->
          <div>
            <div class="flex justify-between text-sm mb-2">
              <label class="text-gray-300">Air Friction</label>
              <span id="airFrictionValue" class="text-white">0.01</span>
            </div>
            <input type="range" id="airFriction" min="0" max="0.1" step="0.005" value="0.01" 
                   class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer border border-gray-600">
          </div>
          
          <!-- Restitution -->
          <div>
            <div class="flex justify-between text-sm mb-2">
              <label class="text-gray-300">Bounce</label>
              <span id="restitutionValue" class="text-white">0.8</span>
            </div>
            <input type="range" id="restitution" min="0" max="1" step="0.1" value="0.8" 
                   class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer border border-gray-600">
          </div>
          
          <!-- Friction -->
          <div>
            <div class="flex justify-between text-sm mb-2">
              <label class="text-gray-300">Friction</label>
              <span id="frictionValue" class="text-white">0.1</span>
            </div>
            <input type="range" id="friction" min="0" max="1" step="0.1" value="0.1" 
                   class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer border border-gray-600">
          </div>
        </div>
        
        <!-- Control Buttons -->
        <div class="grid grid-cols-2 gap-2">
          <button id="addShape" class="bg-blue-600 hover:bg-blue-700 border border-blue-500 text-white py-2 px-3 rounded text-sm">
            Add Shape
          </button>
          <button id="reset" class="bg-gray-600 hover:bg-gray-700 border border-gray-500 text-white py-2 px-3 rounded text-sm">
            Reset
          </button>
          <button id="pausePlay" class="bg-green-600 hover:bg-green-700 border border-green-500 text-white py-2 px-3 rounded text-sm">
            Pause
          </button>
          <button id="clearAll" class="bg-red-600 hover:bg-red-700 border border-red-500 text-white py-2 px-3 rounded text-sm">
            Clear
          </button>
        </div>
        
        <!-- Shape Buttons -->
        <div class="border-t border-gray-600 pt-3">
          <label class="block text-sm text-gray-300 mb-2">Add Shapes</label>
          <div class="grid grid-cols-3 gap-2">
            <button class="shape-btn bg-gray-700 hover:bg-gray-600 border border-gray-600 text-white py-2 px-2 rounded text-sm" data-shape="box">Box</button>
            <button class="shape-btn bg-gray-700 hover:bg-gray-600 border border-gray-600 text-white py-2 px-2 rounded text-sm" data-shape="circle">Circle</button>
            <button class="shape-btn bg-gray-700 hover:bg-gray-600 border border-gray-600 text-white py-2 px-2 rounded text-sm" data-shape="triangle">Triangle</button>
          </div>
        </div>
        
        <!-- Stats -->
        <div class="border-t border-gray-600 pt-3 text-sm text-gray-400">
          <div class="flex justify-between">
            <span>Objects: <span id="objectCount" class="text-white">0</span></span>
            <span>FPS: <span id="fpsCounter" class="text-white">60</span></span>
          </div>
        </div>
      </div>
      
      <!-- Canvas Container -->
      <div class="bg-gray-800 border border-gray-700 rounded-lg p-4">
        <canvas id="physics-canvas" width="500" height="600" class="w-full bg-gray-900 rounded border border-gray-700"></canvas>
        <div class="mt-2 text-sm text-gray-400 text-center">
          Click and drag to interact • Mouse wheel to zoom
        </div>
      </div>
    </div>
  </div>

  <script>
    // Matter.js modules
    const Engine = Matter.Engine;
    const Render = Matter.Render;
    const World = Matter.World;
    const Bodies = Matter.Bodies;
    const Body = Matter.Body;
    const Constraint = Matter.Constraint;
    const Mouse = Matter.Mouse;
    const MouseConstraint = Matter.MouseConstraint;

    // Create engine and world
    const engine = Engine.create();
    const world = engine.world;
    
    // Create renderer
    const canvas = document.getElementById('physics-canvas');
    const render = Render.create({
      canvas: canvas,
      engine: engine,
      options: {
        width: 500,
        height: 600,
        wireframes: false,
        background: '#1f2937',
        showAngleIndicator: false,
        showVelocity: false
      }
    });

    // Mouse control
    const mouse = Mouse.create(render.canvas);
    const mouseConstraint = MouseConstraint.create(engine, {
      mouse: mouse,
      constraint: {
        stiffness: 0.2,
        render: { visible: false }
      }
    });
    World.add(world, mouseConstraint);

    // Physics settings
    let physicsSettings = {
      gravity: 1,
      airFriction: 0.01,
      restitution: 0.8,
      friction: 0.1
    };

    let dynamicBodies = [];
    let isPaused = false;

    // Custom dropdown functionality
    const dropdownBtn = document.getElementById('dropdownBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const dropdownArrow = document.getElementById('dropdownArrow');
    const selectedExample = document.getElementById('selectedExample');

    dropdownBtn.addEventListener('click', () => {
      dropdownMenu.classList.toggle('hidden');
      dropdownArrow.classList.toggle('rotate-180');
    });

    document.addEventListener('click', (e) => {
      if (!dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.classList.add('hidden');
        dropdownArrow.classList.remove('rotate-180');
      }
    });

    document.querySelectorAll('.dropdown-item').forEach(item => {
      item.addEventListener('click', (e) => {
        const value = e.target.getAttribute('data-value');
        selectedExample.textContent = e.target.textContent;
        dropdownMenu.classList.add('hidden');
        dropdownArrow.classList.remove('rotate-180');
        examples[value]();
      });
    });

    // Create boundaries
    function createBoundaries() {
      const ground = Bodies.rectangle(250, 590, 510, 20, { 
        isStatic: true,
        render: { fillStyle: '#374151' }
      });
      const leftWall = Bodies.rectangle(5, 300, 20, 600, { 
        isStatic: true,
        render: { fillStyle: '#374151' }
      });
      const rightWall = Bodies.rectangle(495, 300, 20, 600, { 
        isStatic: true,
        render: { fillStyle: '#374151' }
      });
      
      World.add(world, [ground, leftWall, rightWall]);
    }

    // Examples
    const examples = {
      basic() {
        this.clearDynamic();
        for (let i = 0; i < 4; i++) {
          const x = 120 + i * 80;
          const shape = Math.random() > 0.5 ? 'box' : 'circle';
          this.addShape(shape, x, 50);
        }
      },

      pendulum() {
        this.clearDynamic();
        const anchor = Bodies.circle(250, 50, 5, { isStatic: true, render: { fillStyle: '#ef4444' }});
        let lastBody = anchor;
        
        for (let i = 0; i < 6; i++) {
          const body = Bodies.circle(250, 80 + i * 30, 12, {
            render: { fillStyle: `hsl(${i * 60}, 70%, 60%)` }
          });
          
          const constraint = Constraint.create({
            bodyA: lastBody,
            bodyB: body,
            length: 30,
            render: { strokeStyle: '#ffffff', lineWidth: 2 }
          });
          
          dynamicBodies.push(body);
          World.add(world, [body, constraint]);
          lastBody = body;
        }
        World.add(world, anchor);
      },

      pyramid() {
        this.clearDynamic();
        const rows = 6;
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < rows - row; col++) {
            const x = 200 + col * 25 + row * 12.5;
            const y = 450 - row * 25;
            this.addShape('box', x, y, `hsl(${row * 40}, 70%, 60%)`);
          }
        }
      },

      seesaw() {
        this.clearDynamic();
        const seesaw = Bodies.rectangle(250, 350, 150, 8, {
          render: { fillStyle: '#8b5cf6' }
        });
        const pivot = Bodies.circle(250, 358, 5, { isStatic: true });
        const constraint = Constraint.create({
          bodyA: seesaw,
          bodyB: pivot,
          length: 0
        });
        
        dynamicBodies.push(seesaw);
        World.add(world, [seesaw, pivot, constraint]);
        
        for (let i = 0; i < 3; i++) {
          this.addShape('circle', 180 + i * 70, 150);
        }
      },

      ragdoll() {
        this.clearDynamic();
        const head = Bodies.circle(250, 150, 15, { 
          render: { fillStyle: '#fbbf24' }
        });
        const torso = Bodies.rectangle(250, 200, 20, 60, { 
          render: { fillStyle: '#3b82f6' }
        });
        
        const leftArm = Bodies.rectangle(220, 180, 30, 12, { 
          render: { fillStyle: '#10b981' }
        });
        const rightArm = Bodies.rectangle(280, 180, 30, 12, { 
          render: { fillStyle: '#10b981' }
        });
        
        const leftLeg = Bodies.rectangle(235, 260, 12, 40, { 
          render: { fillStyle: '#ef4444' }
        });
        const rightLeg = Bodies.rectangle(265, 260, 12, 40, { 
          render: { fillStyle: '#ef4444' }
        });
        
        const constraints = [
          Constraint.create({ bodyA: head, bodyB: torso, length: 18 }),
          Constraint.create({ bodyA: torso, bodyB: leftArm, length: 18 }),
          Constraint.create({ bodyA: torso, bodyB: rightArm, length: 18 }),
          Constraint.create({ bodyA: torso, bodyB: leftLeg, length: 18 }),
          Constraint.create({ bodyA: torso, bodyB: rightLeg, length: 18 })
        ];
        
        dynamicBodies.push(head, torso, leftArm, rightArm, leftLeg, rightLeg);
        World.add(world, [head, torso, leftArm, rightArm, leftLeg, rightLeg, ...constraints]);
      },

      addShape(type, x = Math.random() * 400 + 50, y = 50, color) {
        let body;
        const options = {
          restitution: physicsSettings.restitution,
          friction: physicsSettings.friction,
          frictionAir: physicsSettings.airFriction,
          render: { fillStyle: color || `hsl(${Math.random() * 360}, 70%, 60%)` }
        };
        
        switch(type) {
          case 'box':
            body = Bodies.rectangle(x, y, 25, 25, options);
            break;
          case 'circle':
            body = Bodies.circle(x, y, 15, options);
            break;
          case 'triangle':
            body = Bodies.polygon(x, y, 3, 18, options);
            break;
        }
        
        dynamicBodies.push(body);
        World.add(world, body);
        this.updateObjectCount();
      },

      clearDynamic() {
        dynamicBodies.forEach(body => World.remove(world, body));
        dynamicBodies = [];
        this.updateObjectCount();
      },

      updateObjectCount() {
        document.getElementById('objectCount').textContent = dynamicBodies.length;
      }
    };

    // Update physics settings
    function updatePhysics() {
      engine.world.gravity.y = physicsSettings.gravity;
      
      dynamicBodies.forEach(body => {
        Body.set(body, 'restitution', physicsSettings.restitution);
        Body.set(body, 'friction', physicsSettings.friction);
        Body.set(body, 'frictionAir', physicsSettings.airFriction);
      });
    }

    // Event listeners
    ['gravity', 'airFriction', 'restitution', 'friction'].forEach(setting => {
      document.getElementById(setting).addEventListener('input', (e) => {
        physicsSettings[setting] = parseFloat(e.target.value);
        const precision = setting === 'airFriction' ? 3 : 1;
        document.getElementById(setting + 'Value').textContent = physicsSettings[setting].toFixed(precision);
        updatePhysics();
      });
    });

    document.getElementById('addShape').addEventListener('click', () => {
      const shapes = ['box', 'circle', 'triangle'];
      examples.addShape(shapes[Math.floor(Math.random() * shapes.length)]);
    });

    document.getElementById('reset').addEventListener('click', () => examples.basic());
    document.getElementById('clearAll').addEventListener('click', () => examples.clearDynamic());

    document.getElementById('pausePlay').addEventListener('click', (e) => {
      isPaused = !isPaused;
      e.target.textContent = isPaused ? 'Play' : 'Pause';
      if (isPaused) {
        Render.stop(render);
        Engine.stop(engine);
      } else {
        Render.run(render);
        Engine.run(engine);
      }
    });

    document.querySelectorAll('.shape-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const shape = e.target.getAttribute('data-shape');
        examples.addShape(shape);
      });
    });

    // FPS counter
    let frameCount = 0;
    let lastTime = performance.now();
    
    function updateFPS() {
      frameCount++;
      const currentTime = performance.now();
      if (currentTime - lastTime >= 1000) {
        document.getElementById('fpsCounter').textContent = frameCount;
        frameCount = 0;
        lastTime = currentTime;
      }
      requestAnimationFrame(updateFPS);
    }

    // Initialize
    createBoundaries();
    examples.basic();
    updateFPS();
    Render.run(render);
    Engine.run(engine);
  </script>
</body>
</html>
