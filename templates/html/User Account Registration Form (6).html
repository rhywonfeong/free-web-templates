  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - AirTravel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'linear-bg': '#10101f',
            'linear-card': '#1a1a1f',
            'linear-accent': '#5e6ad2',
            'linear-subdued': '#8a8f98'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-linear-bg min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-linear-card rounded-lg shadow-lg overflow-hidden">
    <!-- Header -->
    <div class="p-6 border-b border-white/5">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-white text-2xl font-medium">Create Account</h2>
          <p class="text-linear-subdued text-sm mt-1">Join AirTravel to book and manage your trips</p>
        </div>
        <div class="bg-linear-accent/10 p-3 rounded-full">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-linear-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
      </div>
    </div>
    
    <!-- Form -->
    <form class="p-6">
      <div class="space-y-5">
        <!-- Name fields -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-linear-subdued text-sm mb-2" for="first-name">First Name</label>
            <input type="text" id="first-name" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-linear-accent" placeholder="John">
          </div>
          <div>
            <label class="block text-linear-subdued text-sm mb-2" for="last-name">Last Name</label>
            <input type="text" id="last-name" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-linear-accent" placeholder="Doe">
          </div>
        </div>
        
        <!-- Email -->
        <div>
          <label class="block text-linear-subdued text-sm mb-2" for="email">Email Address</label>
          <input type="email" id="email" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-linear-accent" placeholder="john.doe@example.com">
        </div>
        
        <!-- Password -->
        <div>
          <label class="block text-linear-subdued text-sm mb-2" for="password">Password</label>
          <input type="password" id="password" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-linear-accent" placeholder="••••••••">
          <p class="text-linear-subdued text-xs mt-2">Must be at least 8 characters long</p>
        </div>
        
        <!-- Confirm Password -->
        <div>
          <label class="block text-linear-subdued text-sm mb-2" for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-linear-accent" placeholder="••••••••">
        </div>
        
        <!-- Terms and conditions -->
        <div class="flex items-start">
          <input type="checkbox" id="terms" class="mt-1 h-4 w-4 rounded bg-white/5 border-white/10 text-linear-accent focus:ring-linear-accent">
          <label for="terms" class="ml-2 text-sm text-linear-subdued">
            I agree to the <a href="#" class="text-linear-accent hover:underline">Terms of Service</a> and <a href="#" class="text-linear-accent hover:underline">Privacy Policy</a>
          </label>
        </div>
      </div>
      
      <!-- Submit button -->
      <button type="submit" class="w-full bg-linear-accent text-white font-medium py-3 px-4 rounded-lg mt-6 hover:bg-linear-accent/90 transition-colors">
        Create Account
      </button>
    </form>
    
    <!-- Footer -->
    <div class="p-6 border-t border-white/5 bg-[#10101f]/40 text-center">
      <p class="text-linear-subdued">
        Already have an account? <a href="#" class="text-linear-accent hover:underline">Sign In</a>
      </p>
    </div>
  </div>
</body>
</html>
