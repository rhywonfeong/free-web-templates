        body { font-family: 'Inter', sans-serif; }
        
        .light-stick {
            background: linear-gradient(135deg, #1f2937 0%, #374151 50%, #1f2937 100%);
            position: relative;
            overflow: hidden;
        }
        
        .light-glow {
            transition: all 0.3s ease;
            filter: blur(0px);
        }
        
        .pulse { animation: pulse 1s ease-in-out infinite alternate; }
        .strobe { animation: strobe 0.3s linear infinite; }
        .rainbow { animation: rainbow 2s linear infinite; }
        .wave { animation: wave 1.5s ease-in-out infinite; }
        .spin { animation: spin 2s linear infinite; }
        .bounce { animation: bounce 1s ease-in-out infinite; }
        .glow-intense { animation: glowIntense 0.8s ease-in-out infinite alternate; }
        .shake { animation: shake 0.5s ease-in-out infinite; }
        .zoom { animation: zoom 1.2s ease-in-out infinite alternate; }
        .disco { animation: disco 0.4s linear infinite; }
        .breathe { animation: breathe 2s ease-in-out infinite; }
        .lightning { animation: lightning 0.1s linear infinite; }
        .flicker { animation: flicker 0.8s ease-in-out infinite; }
        .spiral { animation: spiral 3s linear infinite; }
        .heartbeat { animation: heartbeat 1.5s ease-in-out infinite; }
        .explosion { animation: explosion 2s ease-in-out infinite; }
        .ripple { animation: ripple 2.5s ease-in-out infinite; }
        .twist { animation: twist 2s ease-in-out infinite; }
        .magnetic { animation: magnetic 1.8s ease-in-out infinite; }
        .plasma { animation: plasma 1.2s ease-in-out infinite; }
        .supernova { animation: supernova 3s ease-in-out infinite; }
        .vortex { animation: vortex 2.5s linear infinite; }
        .hypnotic { animation: hypnotic 4s ease-in-out infinite; }
        
        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }
        
        @keyframes strobe {
            0%, 50% { opacity: 1; }
            25%, 75% { opacity: 0.2; }
        }
        
        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        
        @keyframes wave {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes glowIntense {
            0% { box-shadow: 0 0 30px currentColor, 0 0 60px currentColor; }
            100% { box-shadow: 0 0 80px currentColor, 0 0 120px currentColor, 0 0 160px currentColor; }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        @keyframes zoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        
        @keyframes disco {
            0% { filter: hue-rotate(0deg) brightness(1); }
            25% { filter: hue-rotate(90deg) brightness(1.2); }
            50% { filter: hue-rotate(180deg) brightness(0.8); }
            75% { filter: hue-rotate(270deg) brightness(1.4); }
            100% { filter: hue-rotate(360deg) brightness(1); }
        }
        
        @keyframes breathe {
            0%, 100% { opacity: 0.6; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        
        @keyframes lightning {
            0%, 90%, 100% { opacity: 1; }
            5%, 15%, 25%, 35%, 45% { opacity: 0.1; }
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
            75% { opacity: 0.9; }
        }
        
        @keyframes spiral {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1.05); }
            75% { transform: scale(1.15); }
        }
        
        @keyframes explosion {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes ripple {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
        }
        
        @keyframes twist {
            0%, 100% { transform: rotate(0deg) skew(0deg); }
            50% { transform: rotate(180deg) skew(10deg); }
        }
        
        @keyframes magnetic {
            0%, 100% { transform: translateX(0) scale(1); }
            25% { transform: translateX(10px) scale(1.05); }
            75% { transform: translateX(-10px) scale(0.95); }
        }
        
        @keyframes plasma {
            0%, 100% { filter: blur(0px) hue-rotate(0deg); }
            50% { filter: blur(2px) hue-rotate(180deg); }
        }
        
        @keyframes supernova {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(2); opacity: 0.3; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes vortex {
            0% { transform: rotate(0deg) scale(1); clip-path: circle(50%); }
            50% { transform: rotate(180deg) scale(1.1); clip-path: circle(60%); }
            100% { transform: rotate(360deg) scale(1); clip-path: circle(50%); }
        }
        
        @keyframes hypnotic {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            25% { transform: scale(1.1) rotate(90deg); opacity: 0.8; }
            50% { transform: scale(0.9) rotate(180deg); opacity: 0.6; }
            75% { transform: scale(1.05) rotate(270deg); opacity: 0.9; }
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
            opacity: 0;
        }
        
        .slide-up {
            animation: slideUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .gradient-border {
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899, #10b981, #f59e0b);
            background-size: 400% 400%;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .neon-glow {
            text-shadow: 0 0 10px currentColor, 0 0 20px currentColor, 0 0 30px currentColor;
        }

        .holographic {
            background: linear-gradient(45deg, #ff0080, #00ff80, #8000ff, #ff8000);
            background-size: 400% 400%;
            animation: holographic 2s ease infinite;
        }

        @keyframes holographic {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .laser-beam {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            animation: laserSweep 2s linear infinite;
        }

        @keyframes laserSweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .energy-field {
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            animation: energyPulse 1.5s ease-in-out infinite;
        }

        @keyframes energyPulse {
            0%, 100% { transform: scale(0.8); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: particleFloat 3s linear infinite;
        }

        @keyframes particleFloat {
            0% { transform: translateY(100px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        .matrix-effect {
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 10px,
                rgba(0,255,0,0.1) 10px,
                rgba(0,255,0,0.1) 20px
            );
            animation: matrixScroll 3s linear infinite;
        }

        @keyframes matrixScroll {
            0% { background-position: 0px 0px; }
            100% { background-position: 200px 0px; }
        }

        .fire-effect {
            background: linear-gradient(0deg, #ff4500, #ff6347, #ff8c00, #ffd700);
            animation: fireFlicker 0.5s ease-in-out infinite alternate;
        }

        @keyframes fireFlicker {
            0% { filter: brightness(0.8); }
            100% { filter: brightness(1.2); }
        }

        .water-effect {
            background: linear-gradient(45deg, #00bfff, #1e90ff, #4169e1, #0000ff);
            animation: waterFlow 2s ease-in-out infinite;
        }

        @keyframes waterFlow {
            0%, 100% { filter: blur(0px); }
            50% { filter: blur(1px); }
        }

        .electric-effect {
            background: linear-gradient(135deg, #00ffff, #0080ff, #8000ff, #ff00ff);
            animation: electricSpark 0.3s ease-in-out infinite;
        }

        @keyframes electricSpark {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5); }
        }
    </style>

                                Ocean
                            </button>
                            <button onclick="setGradientColor('galaxy')" class="px-3 py-2 bg-gradient-to-r from-purple-600 via-indigo-600 to-blue-600 text-white font-medium rounded-lg hover:scale-105 transition-transform duration-200 shadow-lg">
                                Galaxy
                            </button>
                        </div>

                        <!-- Custom Color Input -->
                        <div class="flex gap-3 mb-4">
                            <input type="color" id="customColor" class="w-12 h-10 rounded-lg border-2 border-gray-300 cursor-pointer" value="#3b82f6" onchange="setCustomColor()">
                            <button onclick="setCustomColor()" class="flex-1 px-4 py-2 bg-gray-700 text-white font-medium rounded-lg hover:bg-gray-800 transition-colors duration-200">
                                Use Custom Color
                            </button>
                        </div>
                    </div>

                    <!-- Animation Effects -->
                    <div class="mb-8">
                        <label class="block text-sm font-medium text-gray-700 mb-4">Animation Effects</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="setAnimation('pulse')" class="px-3 py-2 bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-600 transition-colors duration-200">
                                Pulse
                            </button>
                            <button onclick="setAnimation('strobe')" class="px-3 py-2 bg-yellow-500 text-white font-medium rounded-lg hover:bg-yellow-600 transition-colors duration-200">
                                Strobe
                            </button>
                            <button onclick="setAnimation('rainbow')" class="px-3 py-2 bg-gradient-to-r from-red-500 to-purple-500 text-white font-medium rounded-lg hover:from-red-600 hover:to-purple-600 transition-colors duration-200">
                                Rainbow
                            </button>
                            <button onclick="setAnimation('wave')" class="px-3 py-2 bg-cyan-500 text-white font-medium rounded-lg hover:bg-cyan-600 transition-colors duration-200">
                                Wave
                            </button>
                            <button onclick="setAnimation('spin')" class="px-3 py-2 bg-green-500 text-white font-medium rounded-lg hover:bg-green-600 transition-colors duration-200">
                                Spin
                            </button>
                            <button onclick="setAnimation('bounce')" class="px-3 py-2 bg-orange-500 text-white font-medium rounded-lg hover:bg-orange-600 transition-colors duration-200">
                                Bounce
                            </button>
                            <button onclick="setAnimation('glow-intense')" class="px-3 py-2 bg-pink-500 text-white font-medium rounded-lg hover:bg-pink-600 transition-colors duration-200">
                                Intense Glow
                            </button>
                            <button onclick="setAnimation('shake')" class="px-3 py-2 bg-red-500 text-white font-medium rounded-lg hover:bg-red-600 transition-colors duration-200">
                                Shake
                            </button>
                            <button onclick="setAnimation('disco')" class="px-3 py-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-medium rounded-lg hover:from-purple-600 hover:to-pink-600 transition-colors duration-200">
                                Disco
                            </button>
                            <button onclick="setAnimation('lightning')" class="px-3 py-2 bg-indigo-500 text-white font-medium rounded-lg hover:bg-indigo-600 transition-colors duration-200">
                                Lightning
                            </button>
                            <button onclick="setAnimation('heartbeat')" class="px-3 py-2 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 transition-colors duration-200">
                                Heartbeat
                            </button>
                            <button onclick="setAnimation('hypnotic')" class="px-3 py-2 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-medium rounded-lg hover:from-indigo-600 hover:to-purple-600 transition-colors duration-200">
                                Hypnotic
                            </button>
                        </div>
                    </div>

                    <!-- Intensity Controls -->
                    <div class="mb-8">
                        <label class="block text-sm font-medium text-gray-700 mb-4">Light Intensity</label>
                        <input type="range" id="intensitySlider" min="10" max="100" value="80" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer mb-4" onchange="updateIntensity(this.value)">
                        <div class="flex justify-between text-sm text-gray-500">
                            <span>Dim</span>
                            <span id="intensityValue">80%</span>
                            <span>Bright</span>
                        </div>
                    </div>

                    <!-- Speed Controls -->
                    <div class="mb-8">
                        <label class="block text-sm font-medium text-gray-700 mb-4">Animation Speed</label>
                        <input type="range" id="speedSlider" min="0.5" max="5" step="0.1" value="1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer mb-4" onchange="updateSpeed(this.value)">
                        <div class="flex justify-between text-sm text-gray-500">
                            <span>Slow</span>
                            <span id="speedValue">1x</span>
                            <span>Fast</span>
                        </div>
                    </div>

                    <!-- Sound Effects Toggle -->
                    <div class="mb-8">
                        <div class="flex items-center justify-between">
                            <label class="text-sm font-medium text-gray-700">Sound Effects</label>
                            <button onclick="toggleSound()" id="soundBtn" class="px-4 py-2 bg-gray-300 text-gray-700 font-medium rounded-lg hover:bg-gray-400 transition-colors duration-200">
                                <i data-lucide="volume-off" class="w-4 h-4 inline mr-1"></i>
                                Off
                            </button>
                        </div>
                    </div>

                    <!-- Preset Modes -->
                    <div class="mb-8">
                        <label class="block text-sm font-medium text-gray-700 mb-4">Preset Modes</label>
                        <div class="grid grid-cols-1 gap-3">
                            <button onclick="setPreset('concert')" class="px-4 py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-medium rounded-lg hover:from-blue-700 hover:to-purple-700 transition-all duration-200 shadow-lg">
                                🎵 Concert Mode
                            </button>
                            <button onclick="setPreset('rave')" class="px-4 py-3 bg-gradient-to-r from-pink-500 to-red-500 text-white font-medium rounded-lg hover:from-pink-600 hover:to-red-600 transition-all duration-200 shadow-lg">
                                🎉 Rave Mode
                            </button>
                            <button onclick="setPreset('chill')" class="px-4 py-3 bg-gradient-to-r from-teal-500 to-cyan-500 text-white font-medium rounded-lg hover:from-teal-600 hover:to-cyan-600 transition-all duration-200 shadow-lg">
                                😌 Chill Mode
                            </button>
                            <button onclick="setPreset('party')" class="px-4 py-3 bg-gradient-to-r from-yellow-500 to-orange-500 text-white font-medium rounded-lg hover:from-yellow-600 hover:to-orange-600 transition-all duration-200 shadow-lg">
                                🎊 Party Mode
                            </button>
                            <button onclick="setPreset('fire')" class="px-4 py-3 bg-gradient-to-r from-red-600 to-orange-600 text-white font-medium rounded-lg hover:from-red-700 hover:to-orange-700 transition-all duration-200 shadow-lg">
                                🔥 Fire Mode
                            </button>
                            <button onclick="setPreset('ice')" class="px-4 py-3 bg-gradient-to-r from-blue-400 to-cyan-400 text-white font-medium rounded-lg hover:from-blue-500 hover:to-cyan-500 transition-all duration-200 shadow-lg">
                                ❄️ Ice Mode
                            </button>
                        </div>
                    </div>

                    <!-- Share Button -->
                    <div class="text-center">
                        <button onclick="shareConfig()" class="px-6 py-3 bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-medium rounded-xl hover:from-indigo-600 hover:to-purple-600 transition-all duration-300 shadow-lg hover:shadow-xl transform hover:scale-105">
                            <i data-lucide="share-2" class="w-4 h-4 inline mr-2"></i>
                            Share Your Creation
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Global variables
        let currentAnimation = 'pulse';
        let currentColor = '#3b82f6';
        let currentGlow = 'rgba(59, 130, 246, 0.6)';
        let intensity = 80;
        let speed = 1;
        let soundEnabled = false;
        let isPlaying = false;
        let megaActive = false;
        let laserActive = false;
        let matrixActive = false;
        let hologramActive = false;
        let multiStickActive = false;

        // Get DOM elements
        const lightHead = document.getElementById('lightHead');
        const statusText = document.getElementById('statusText');
        const modeText = document.getElementById('modeText');
        const energyLevel = document.getElementById('energyLevel');
        const intensityValue = document.getElementById('intensityValue');
        const speedValue = document.getElementById('speedValue');

        // Set color function
        function setColor(color, glow) {
            currentColor = color;
            currentGlow = glow;
            updateLightStick();
            updateStatus('Color Changed', 'Custom');
        }

        // Set gradient color function
        function setGradientColor(type) {
            const gradients = {
                rainbow: {
                    background: 'linear-gradient(135deg, #ff0000, #ff8000, #ffff00, #00ff00, #0080ff, #8000ff)',
                    glow: 'rgba(255, 255, 255, 0.8)'
                },
                sunset: {
                    background: 'linear-gradient(135deg, #ff4500, #ff6347, #ff8c00, #ffd700)',
                    glow: 'rgba(255, 165, 0, 0.8)'
                },
                ocean: {
                    background: 'linear-gradient(135deg, #0080ff, #00bfff, #40e0d0, #00ffff)',
                    glow: 'rgba(0, 191, 255, 0.8)'
                },
                galaxy: {
                    background: 'linear-gradient(135deg, #4c1d95, #5b21b6, #7c3aed, #a855f7)',
                    glow: 'rgba(139, 92, 246, 0.8)'
                }
            };

            if (gradients[type]) {
                lightHead.style.background = gradients[type].background;
                currentGlow = gradients[type].glow;
                updateGlow();
                updateStatus('Gradient Applied', type.charAt(0).toUpperCase() + type.slice(1));
            }
        }

        // Set custom color
        function setCustomColor() {
            const customColor = document.getElementById('customColor').value;
            const r = parseInt(customColor.substr(1, 2), 16);
            const g = parseInt(customColor.substr(3, 2), 16);
            const b = parseInt(customColor.substr(5, 2), 16);
            const glow = `rgba(${r}, ${g}, ${b}, 0.8)`;
            setColor(customColor, glow);
        }

        // Set animation
        function setAnimation(animation) {
            // Remove all animation classes
            const animations = ['pulse', 'strobe', 'rainbow', 'wave', 'spin', 'bounce', 'glow-intense', 'shake', 'zoom', 'disco', 'breathe', 'lightning', 'flicker', 'spiral', 'heartbeat', 'explosion', 'ripple', 'twist', 'magnetic', 'plasma', 'supernova', 'vortex', 'hypnotic'];
            animations.forEach(anim => lightHead.classList.remove(anim));
            
            // Add new animation
            currentAnimation = animation;
            lightHead.classList.add(animation);
            updateStatus('Animation Set', animation.charAt(0).toUpperCase() + animation.slice(1));
        }

        // Update intensity
        function updateIntensity(value) {
            intensity = value;
            intensityValue.textContent = value + '%';
            updateLightStick();
            updateEnergyLevel(value);
        }

        // Update speed
        function updateSpeed(value) {
            speed = value;
            speedValue.textContent = value + 'x';
            lightHead.style.animationDuration = (1 / value) + 's';
        }

        // Update light stick appearance
        function updateLightStick() {
            lightHead.style.background = `linear-gradient(135deg, ${currentColor}, ${adjustBrightness(currentColor, -20)})`;
            updateGlow();
        }

        // Update glow effect
        function updateGlow() {
            const glowIntensity = intensity / 100;
            const baseGlow = 50 * glowIntensity;
            const maxGlow = 100 * glowIntensity;
            lightHead.style.boxShadow = `0 0 ${baseGlow}px ${currentGlow}, 0 0 ${maxGlow}px ${currentGlow}`;
        }

        // Adjust brightness utility
        function adjustBrightness(hex, percent) {
            const num = parseInt(hex.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
        }

        // Update status display
        function updateStatus(status, mode) {
            statusText.textContent = status;
            modeText.textContent = mode;
        }

        // Update energy level
        function updateEnergyLevel(level) {
            energyLevel.textContent = level + '%';
            const color = level > 50 ? 'text-green-400' : level > 25 ? 'text-yellow-400' : 'text-red-400';
            energyLevel.className = color;
        }

        // Randomize function
        function randomize() {
            const colors = ['#ff0000', '#ff4500', '#ffa500', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#8000ff', '#ff1493', '#adff2f'];
            const animations = ['pulse', 'strobe', 'rainbow', 'wave', 'spin', 'bounce', 'disco', 'lightning', 'heartbeat'];
            
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomAnimation = animations[Math.floor(Math.random() * animations.length)];
            const randomIntensity = Math.floor(Math.random() * 90) + 10;
            
            setColor(randomColor, `rgba(${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, 0.8)`);
            setAnimation(randomAnimation);
            updateIntensity(randomIntensity);
            document.getElementById('intensitySlider').value = randomIntensity;
            
            updateStatus('Randomized', 'Random Mode');
        }

        // Toggle play/party mode
        function togglePlay() {
            isPlaying = !isPlaying;
            const playBtn = document.getElementById('playBtn');
            
            if (isPlaying) {
                playBtn.innerHTML = '<i data-lucide="pause" class="w-4 h-4 inline mr-1"></i>Stop';
                playBtn.classList.remove('from-green-500', 'to-emerald-500');
                playBtn.classList.add('from-red-500', 'to-red-600');
                startPartyMode();
            } else {
                playBtn.innerHTML = '<i data-lucide="play" class="w-4 h-4 inline mr-1"></i>Party';
                playBtn.classList.remove('from-red-500', 'to-red-600');
                playBtn.classList.add('from-green-500', 'to-emerald-500');
                stopPartyMode();
            }
            lucide.createIcons();
        }

        // Start party mode
        function startPartyMode() {
            updateStatus('Party Active', 'Party Mode');
            // Rapidly change colors and animations
            setInterval(() => {
                if (isPlaying) randomize();
            }, 2000);
        }

        // Stop party mode
        function stopPartyMode() {
            updateStatus('Party Stopped', 'Standard');
        }

        // Mega mode
        function megaMode() {
            megaActive = !megaActive;
            const megaBtn = document.getElementById('megaBtn');
            
            if (megaActive) {
                megaBtn.textContent = 'MEGA ON';
                lightHead.classList.add('glow-intense', 'zoom');
                updateIntensity(100);
                document.getElementById('intensitySlider').value = 100;
                updateStatus('MEGA MODE', 'Ultra Power');
                createParticles();
            } else {
                megaBtn.innerHTML = '<i data-lucide="zap" class="w-4 h-4 inline mr-1"></i>MEGA';
                lightHead.classList.remove('glow-intense', 'zoom');
                updateStatus('Normal Mode', 'Standard');
                clearParticles();
            }
            lucide.createIcons();
        }

        // Create particle effects
        function createParticles() {
            const particles = document.getElementById('particles');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 3 + 's';
                particles.appendChild(particle);
            }
        }

        // Clear particles
        function clearParticles() {
            document.getElementById('particles').innerHTML = '';
        }

        // Laser mode
        function laserMode() {
            laserActive = !laserActive;
            const laserBtn = document.getElementById('laserBtn');
            const laserBeam = document.getElementById('laserBeam');
            
            if (laserActive) {
                laserBtn.textContent = 'LASER ON';
                laserBeam.classList.add('laser-beam');
                updateStatus('Laser Active', 'Laser Mode');
            } else {
                laserBtn.innerHTML = '<i data-lucide="target" class="w-4 h-4 inline mr-1"></i>Laser';
                laserBeam.classList.remove('laser-beam');
                updateStatus('Laser Off', 'Standard');
            }
            lucide.createIcons();
        }

        // Matrix mode
        function matrixMode() {
            matrixActive = !matrixActive;
            const matrixBtn = document.getElementById('matrixBtn');
            
            if (matrixActive) {
                matrixBtn.textContent = 'MATRIX ON';
                lightHead.classList.add('matrix-effect');
                setColor('#00ff00', 'rgba(0, 255, 0, 0.8)');
                updateStatus('Matrix Active', 'Digital Mode');
            } else {
                matrixBtn.innerHTML = '<i data-lucide="binary" class="w-4 h-4 inline mr-1"></i>Matrix';
                lightHead.classList.remove('matrix-effect');
                updateStatus('Matrix Off', 'Standard');
            }
            lucide.createIcons();
        }

        // Hologram mode
        function hologramMode() {
            hologramActive = !hologramActive;
            const hologramBtn = document.getElementById('hologramBtn');
            
            if (hologramActive) {
                hologramBtn.textContent = 'HOLO ON';
                lightHead.classList.add('holographic');
                updateStatus('Hologram Active', 'Holographic');
            } else {
                hologramBtn.innerHTML = '<i data-lucide="diamond" class="w-4 h-4 inline mr-1"></i>Holo';
                lightHead.classList.remove('holographic');
                updateStatus('Hologram Off', 'Standard');
            }
            lucide.createIcons();
        }

        // Multi-stick mode
        function multiStickMode() {
            multiStickActive = !multiStickActive;
            const multiBtn = document.getElementById('multiBtn');
            const sideSticks = document.getElementById('sideSticks');
            
            if (multiStickActive) {
                multiBtn.textContent = 'MULTI ON';
                sideSticks.style.opacity = '1';
                updateStatus('Multi-Stick', 'Triple Power');
            } else {
                multiBtn.innerHTML = '<i data-lucide="copy" class="w-4 h-4 inline mr-1"></i>Multi';
                sideSticks.style.opacity = '0';
                updateStatus('Single Stick', 'Standard');
            }
            lucide.createIcons();
        }

        // Toggle sound
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const soundBtn = document.getElementById('soundBtn');
            
            if (soundEnabled) {
                soundBtn.innerHTML = '<i data-lucide="volume-2" class="w-4 h-4 inline mr-1"></i>On';
                soundBtn.classList.remove('bg-gray-300', 'text-gray-700');
                soundBtn.classList.add('bg-green-500', 'text-white');
            } else {
                soundBtn.innerHTML = '<i data-lucide="volume-off" class="w-4 h-4 inline mr-1"></i>Off';
                soundBtn.classList.remove('bg-green-500', 'text-white');
                soundBtn.classList.add('bg-gray-300', 'text-gray-700');
            }
            lucide.createIcons();
        }

        // Set preset modes
        function setPreset(preset) {
            const presets = {
                concert: { color: '#3b82f6', animation: 'wave', intensity: 70 },
                rave: { color: '#ff0080', animation: 'strobe', intensity: 100 },
                chill: { color: '#40e0d0', animation: 'breathe', intensity: 40 },
                party: { color: '#ff4500', animation: 'disco', intensity: 90 },
                fire: { color: '#ff4500', animation: 'flicker', intensity: 85 },
                ice: { color: '#00bfff', animation: 'pulse', intensity: 60 }
            };
            
            if (presets[preset]) {
                const p = presets[preset];
                setColor(p.color, `rgba(${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, ${Math.floor(Math.random() * 255)}, 0.8)`);
                setAnimation(p.animation);
                updateIntensity(p.intensity);
                document.getElementById('intensitySlider').value = p.intensity;
                updateStatus(`${preset.charAt(0).toUpperCase() + preset.slice(1)} Mode`, preset.toUpperCase());
            }
        }

        // Reset all
        function resetAll() {
            // Reset all modes
            isPlaying = false;
            megaActive = false;
            laserActive = false;
            matrixActive = false;
            hologramActive = false;
            multiStickActive = false;
            
            // Reset UI
            document.getElementById('playBtn').innerHTML = '<i data-lucide="play" class="w-4 h-4 inline mr-1"></i>Party';
            document.getElementById('megaBtn').innerHTML = '<i data-lucide="zap" class="w-4 h-4 inline mr-1"></i>MEGA';
            document.getElementById('laserBtn').innerHTML = '<i data-lucide="target" class="w-4 h-4 inline mr-1"></i>Laser';
            document.getElementById('matrixBtn').innerHTML = '<i data-lucide="binary" class="w-4 h-4 inline mr-1"></i>Matrix';
            document.getElementById('hologramBtn').innerHTML = '<i data-lucide="diamond" class="w-4 h-4 inline mr-1"></i>Holo';
            document.getElementById('multiBtn').innerHTML = '<i data-lucide="copy" class="w-4 h-4 inline mr-1"></i>Multi';
            
            // Reset light stick
            setColor('#3b82f6', 'rgba(59, 130, 246, 0.6)');
            setAnimation('pulse');
            updateIntensity(80);
            document.getElementById('intensitySlider').value = 80;
            document.getElementById('speedSlider').value = 1;
            updateSpeed(1);
            
            // Clear effects
            clearParticles();
            document.getElementById('laserBeam').classList.remove('laser-beam');
            document.getElementById('sideSticks').style.opacity = '0';
            
            // Remove all classes
            lightHead.className = 'absolute top-0 left-1/2 transform -translate-x-1/2 w-20 h-80 rounded-full border-4 border-white shadow-2xl light-glow pulse';
            
            updateStatus('Reset Complete', 'Standard');
            lucide.createIcons();
        }

        // Share configuration
        function shareConfig() {
            const config = {
                color: currentColor,
                animation: currentAnimation,
                intensity: intensity,
                speed: speed
            };
            
            navigator.clipboard.writeText(JSON.stringify(config)).then(() => {
                alert('Light stick configuration copied to clipboard!');
            }).catch(() => {
                alert('Unable to copy configuration. Please try again.');
            });
        }

        // Initialize the light stick
        document.addEventListener('DOMContentLoaded', function() {
            updateLightStick();
            updateStatus('Ready', 'Standard');
        });
    </script>
</body>
</html>
