<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lead Management Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html { font-family: 'Inter', sans-serif; }
    [x-cloak] { display: none; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div id="app" x-data="leadApp()" x-init="init()" class="min-h-screen flex flex-col">
    <!-- HEADER NAV -->
    <header class="bg-white shadow z-10">
      <nav class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <span class="font-bold text-lg text-blue-600 tracking-tight">LeadManager</span>
        </div>
        <template x-if="user">
          <div class="flex items-center space-x-4">
            <span class="text-gray-600 text-sm">Hi, <span x-text="user.email"></span></span>
            <button @click="logout()" class="text-gray-500 hover:text-blue-600 text-sm">Logout</button>
          </div>
        </template>
      </nav>
    </header>

    <!-- AUTHENTICATION -->
    <main class="flex-1 flex flex-col items-center justify-center" x-show="!user" x-cloak>
      <div class="w-full max-w-sm bg-white p-8 rounded-lg shadow mt-12">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Login</h2>
        <form @submit.prevent="login()" class="space-y-5">
          <div>
            <label class="block text-sm font-medium mb-1">Email</label>
            <input x-model="authEmail" type="email" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200" autocomplete="username">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input x-model="authPassword" type="password" required minlength="1" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-200" autocomplete="current-password">
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded font-semibold hover:bg-blue-700 transition"> 
            Login
          </button>
        </form>
      </div>
    </main>

    <!-- MAIN PLATFORM -->
    <main x-show="user" x-cloak class="flex-1 w-full max-w-7xl mx-auto px-4 py-8 flex flex-col gap-8">
      
      <!-- LEAD CREATION & FILTERS -->
      <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6">
        <!-- Lead Creation Form -->
        <form @submit.prevent="createLead()" class="bg-white rounded-lg shadow px-6 py-4 flex flex-col md:flex-row items-start md:items-end gap-4 w-full md:w-auto md:min-w-[400px]">
          <div>
            <label class="block text-xs font-semibold mb-1">Name <span class="text-red-500">*</span></label>
            <input x-model="newLead.name" required class="border rounded px-2 py-1 w-36 focus:outline-none focus:ring-1 focus:ring-blue-200" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Email <span class="text-red-500">*</span></label>
            <input x-model="newLead.email" required type="email" class="border rounded px-2 py-1 w-40 focus:outline-none focus:ring-1 focus:ring-blue-200" />
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Phone</label>
            <input x-model="newLead.phone" type="tel" class="border rounded px-2 py-1 w-28 focus:outline-none focus:ring-1 focus:ring-blue-200"/>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Company</label>
            <input x-model="newLead.company" class="border rounded px-2 py-1 w-32 focus:outline-none focus:ring-1 focus:ring-blue-200"/>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Source</label>
            <select x-model="newLead.source" class="border rounded px-2 py-1 w-28 focus:outline-none focus:ring-1 focus:ring-blue-200">
              <option>Website</option>
              <option>Referral</option>
              <option>Cold Call</option>
              <option>Event</option>
              <option>Other</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Notes</label>
            <input x-model="newLead.notes" class="border rounded px-2 py-1 w-40 focus:outline-none focus:ring-1 focus:ring-blue-200"/>
          </div>
          <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded font-semibold hover:bg-blue-700 transition">Add</button>
        </form>
        
        <!-- Filters & Search -->
        <div class="flex items-center gap-3">
          <select x-model="filterStatus" class="border rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-200">
            <option value="">All Statuses</option>
            <template x-for="status in statuses" :key="status">
              <option x-text="status"></option>
            </template>
          </select>
          <select x-model="filterSource" class="border rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-200">
            <option value="">All Sources</option>
            <option>Website</option>
            <option>Referral</option>
            <option>Cold Call</option>
            <option>Event</option>
            <option>Other</option>
          </select>
          <input x-model="searchTerm" placeholder="Search by name, email, company..." class="border rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-200 w-56" />
        </div>
      </div>
      
      <!-- KANBAN BOARD -->
      <div class="overflow-x-auto pb-4">
        <div class="flex gap-6 min-w-[800px]">
          <template x-for="status in statuses" :key="status">
            <div class="flex-1 bg-white rounded-lg shadow min-w-[250px] h-[540px] flex flex-col">
              <div class="px-4 py-3 border-b flex items-center justify-between">
                <span class="font-semibold text-gray-700" x-text="status"></span>
                <span class="text-xs text-gray-400" x-text="filteredLeads.filter(l => l.status === status).length"></span>
              </div>
              <!-- Droppable area -->
              <div :id="'droppable-' + status"
                   class="flex-1 px-2 py-2 space-y-3 overflow-y-auto"
                   @dragover.prevent
                   @drop="onDrop($event, status)">
                <template x-for="lead in filteredLeads.filter(l => l.status === status)" :key="lead.id">
                  <div :draggable="true"
                       @dragstart="onDragStart($event, lead.id)"
                       class="bg-blue-50 border border-blue-100 rounded px-3 py-2 cursor-move shadow-sm hover:shadow-md transition relative group"
                       :class="{'ring-2 ring-blue-300': selectedLead && selectedLead.id === lead.id}"
                       @click="viewLead(lead)"
                  >
                    <div class="font-semibold text-blue-700 truncate" x-text="lead.name"></div>
                    <div class="text-xs text-gray-500 truncate" x-text="lead.company"></div>
                    <div class="absolute top-1 right-2 text-gray-400 text-xs group-hover:opacity-100 opacity-0 transition">
                      <svg class="inline w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 12H9m12 0A9 9 0 1 1 3 12a9 9 0 0 1 18 0Z"/></svg>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
      
      <!-- LEAD DETAILS MODAL -->
      <div x-show="selectedLead" x-cloak class="fixed inset-0 z-20 bg-black bg-opacity-40 flex items-center justify-center">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6 relative animate-fade-in">
          <button @click="selectedLead=null" class="absolute top-2 right-3 text-gray-400 hover:text-blue-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
          <h3 class="text-xl font-bold text-blue-700 mb-3" x-text="selectedLead.name"></h3>
          <div class="grid grid-cols-2 gap-3 mb-4 text-sm">
            <div>
              <div class="font-semibold text-gray-600">Email</div>
              <div x-text="selectedLead.email"></div>
            </div>
            <div>
              <div class="font-semibold text-gray-600">Phone</div>
              <div x-text="selectedLead.phone || '-'"></div>
            </div>
            <div>
              <div class="font-semibold text-gray-600">Company</div>
              <div x-text="selectedLead.company || '-'"></div>
            </div>
            <div>
              <div class="font-semibold text-gray-600">Source</div>
              <div x-text="selectedLead.source || '-'"></div>
            </div>
            <div>
              <div class="font-semibold text-gray-600">Status</div>
              <select x-model="selectedLead.status" @change="saveLeadDetails()" class="border rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-200">
                <template x-for="status in statuses" :key="status">
                  <option x-text="status"></option>
                </template>
              </select>
            </div>
            <div>
              <div class="font-semibold text-gray-600">Created</div>
              <div x-text="formatDate(selectedLead.createdAt)"></div>
            </div>
            <div>
              <div class="font-semibold text-gray-600">Updated</div>
              <div x-text="formatDate(selectedLead.updatedAt)"></div>
            </div>
          </div>
          <div>
            <div class="font-semibold text-gray-600 mb-1">Notes</div>
            <textarea x-model="selectedLead.notes" @blur="saveLeadDetails()" class="border rounded px-2 py-1 w-full min-h-[60px] focus:outline-none focus:ring-1 focus:ring-blue-200"></textarea>
          </div>
          <div class="mt-6 flex justify-between items-center">
            <button @click="deleteLead(selectedLead.id)" class="text-red-600 hover:underline text-sm">Delete Lead</button>
            <button @click="selectedLead=null" class="bg-blue-600 text-white px-5 py-2 rounded font-semibold hover:bg-blue-700 transition">Close</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <!-- Alpine.js for reactivity -->
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script>
    function leadApp() {
      return {
        // --- AUTH ---
        authEmail: '',
        authPassword: '',
        user: null,

        // --- LEADS ---
        statuses: ['New', 'Contacted', 'Qualified', 'Lost'],
        leads: [],
        newLead: { name: '', email: '', phone: '', company: '', source: 'Website', notes: '' },

        // --- UI STATE ---
        filterStatus: '',
        filterSource: '',
        searchTerm: '',
        selectedLead: null,
        dragLeadId: null,

        // --- INIT ---
        init() {
          const user = localStorage.getItem('leadUser');
          if (user) {
            this.user = JSON.parse(user);
            this.loadLeads();
          }
        },

        // --- AUTH LOGIC ---
        login() {
          if (!this.authEmail || !this.authPassword) return;
          // Accept any email/password and create session
          this.user = { email: this.authEmail };
          localStorage.setItem('leadUser', JSON.stringify(this.user));
          // Initialize leads for new users
          if (!localStorage.getItem(this.storageKey())) {
            localStorage.setItem(this.storageKey(), JSON.stringify([]));
          }
          this.loadLeads();
        },
        logout() {
          this.user = null;
          localStorage.removeItem('leadUser');
          this.authEmail = '';
          this.authPassword = '';
        },

        // --- LEAD STORAGE ---
        storageKey() {
          return this.user ? `leads_${this.user.email}` : 'leads_demo';
        },
        loadLeads() {
          this.leads = JSON.parse(localStorage.getItem(this.storageKey()) || '[]');
        },
        saveLeads() {
          localStorage.setItem(this.storageKey(), JSON.stringify(this.leads));
        },

        // --- LEAD CREATION ---
        createLead() {
          if (!this.newLead.name.trim() || !this.newLead.email.trim()) return;
          const lead = {
            ...this.newLead,
            id: Date.now() + Math.random().toString(36).substr(2,6),
            status: 'New',
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
          this.leads.push(lead);
          this.saveLeads();
          this.newLead = { name: '', email: '', phone: '', company: '', source: 'Website', notes: '' };
        },

        // --- LEAD DRAG/DROP (KANBAN) ---
        onDragStart(e, leadId) {
          this.dragLeadId = leadId;
        },
        onDrop(e, status) {
          if (!this.dragLeadId) return;
          let idx = this.leads.findIndex(l => l.id === this.dragLeadId);
          if (idx >= 0 && this.leads[idx].status !== status) {
            this.leads[idx].status = status;
            this.leads[idx].updatedAt = new Date().toISOString();
            this.saveLeads();
          }
          this.dragLeadId = null;
        },

        // --- LEAD DETAILS MODAL ---
        viewLead(lead) {
          this.selectedLead = { ...lead };
        },
        saveLeadDetails() {
          let idx = this.leads.findIndex(l => l.id === this.selectedLead.id);
          if (idx >= 0) {
            this.selectedLead.updatedAt = new Date().toISOString();
            this.leads[idx] = { ...this.selectedLead };
            this.saveLeads();
          }
        },
        deleteLead(leadId) {
          this.leads = this.leads.filter(l => l.id !== leadId);
          this.saveLeads();
          this.selectedLead = null;
        },

        // --- FILTERS & SEARCH ---
        get filteredLeads() {
          return this.leads.filter(l => {
            if (this.filterStatus && l.status !== this.filterStatus) return false;
            if (this.filterSource && l.source !== this.filterSource) return false;
            let q = this.searchTerm.trim().toLowerCase();
            if (!q) return true;
            return (
              l.name.toLowerCase().includes(q) ||
              (l.email && l.email.toLowerCase().includes(q)) ||
              (l.company && l.company.toLowerCase().includes(q))
            );
          });
        },

        // --- UTILS ---
        formatDate(dt) {
          if (!dt) return '-';
          const d = new Date(dt);
          return d.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
        }
      }
    }
  </script>
</body>
</html>
