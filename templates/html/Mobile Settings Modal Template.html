<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 md:p-8">

    <!-- Mobile Device Simulator Frame -->
    <div class="relative w-full max-w-[375px] h-[812px] bg-[#F9FAFB] overflow-hidden shadow-2xl rounded-[40px] border-[8px] border-gray-900 ring-1 ring-gray-200 flex flex-col">
        
        <!-- Simulated Background App Screen (Settings) -->
        <div class="flex-1 flex flex-col pt-14 px-5 pb-6">
            <!-- Header -->
            <div class="flex items-center justify-between mb-8">
                <div class="text-xl font-medium tracking-tight text-gray-900">Settings</div>
            </div>

            <!-- Profile Info -->
            <div class="flex flex-col items-center mb-8">
                <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-gray-200 to-gray-100 mb-4 border-4 border-white shadow-sm flex items-center justify-center">
                    <span class="text-gray-500 font-medium text-2xl tracking-tight">JD</span>
                </div>
                <h2 class="text-lg font-medium tracking-tight text-gray-900">John Doe</h2>
                <p class="text-sm text-gray-500 mt-0.5">john.doe@example.com</p>
            </div>

            <!-- Settings List -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200/60 overflow-hidden">
                <div class="flex items-center px-4 py-3.5 border-b border-gray-100">
                    <div class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center mr-3 text-gray-600">
                        <iconify-icon icon="solar:user-linear" class="text-lg" stroke-width="1.5"></iconify-icon>
                    </div>
                    <div class="flex-1 text-sm font-medium text-gray-900">Personal Info</div>
                    <iconify-icon icon="solar:alt-arrow-right-linear" class="text-gray-400 text-lg" stroke-width="1.5"></iconify-icon>
                </div>
                <div class="flex items-center px-4 py-3.5 border-b border-gray-100">
                    <div class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center mr-3 text-gray-600">
                        <iconify-icon icon="solar:bell-linear" class="text-lg" stroke-width="1.5"></iconify-icon>
                    </div>
                    <div class="flex-1 text-sm font-medium text-gray-900">Notifications</div>
                    <iconify-icon icon="solar:alt-arrow-right-linear" class="text-gray-400 text-lg" stroke-width="1.5"></iconify-icon>
                </div>
                <div class="flex items-center px-4 py-3.5">
                    <div class="w-8 h-8 rounded-full bg-gray-50 flex items-center justify-center mr-3 text-gray-600">
                        <iconify-icon icon="solar:shield-keyhole-linear" class="text-lg" stroke-width="1.5"></iconify-icon>
                    </div>
                    <div class="flex-1 text-sm font-medium text-gray-900">Privacy & Security</div>
                    <iconify-icon icon="solar:alt-arrow-right-linear" class="text-gray-400 text-lg" stroke-width="1.5"></iconify-icon>
                </div>
            </div>
            
            <div class="mt-6 bg-white rounded-2xl shadow-sm border border-gray-200/60 overflow-hidden">
                <div class="flex items-center px-4 py-3.5 text-red-600 cursor-pointer">
                    <div class="w-8 h-8 rounded-full bg-red-50 flex items-center justify-center mr-3">
                        <iconify-icon icon="solar:logout-3-linear" class="text-lg" stroke-width="1.5"></iconify-icon>
                    </div>
                    <div class="flex-1 text-sm font-medium">Log Out</div>
                </div>
            </div>
        </div>

        <!-- The Overlay & Modal -->
        <div class="absolute inset-0 z-50 flex items-center justify-center bg-gray-900/40 backdrop-blur-[2px] px-5">
            
            <!-- Modal Card -->
            <div class="w-full bg-white rounded-[24px] p-6 shadow-2xl flex flex-col items-center text-center transform transition-all border border-black/5">
                
                <!-- Icon Container -->
                <div class="w-12 h-12 rounded-full bg-red-100/80 flex items-center justify-center mb-4 ring-8 ring-red-50">
                    <iconify-icon icon="solar:logout-3-linear" class="text-red-600 text-xl" stroke-width="1.5"></iconify-icon>
                </div>

                <!-- Text Content -->
                <h3 class="text-lg font-medium tracking-tight text-gray-900 mb-2">
                    Log out of your account?
                </h3>
                <p class="text-sm text-gray-500 mb-7 leading-relaxed px-2">
                    Are you sure you want to log out? Any unsynced data will be lost and you will need to sign in again.
                </p>

                <!-- Action Buttons -->
                <div class="w-full flex flex-col gap-2.5">
                    <!-- Primary Destructive Action -->
                    <button class="w-full flex items-center justify-center bg-red-600 text-white font-medium text-sm py-3 px-4 rounded-xl hover:bg-red-700 active:bg-red-800 transition-colors duration-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                        Log out
                    </button>
                    
                    <!-- Secondary Cancel Action -->
                    <button class="w-full flex items-center justify-center bg-white text-gray-700 font-medium text-sm py-3 px-4 rounded-xl border border-gray-200 shadow-sm hover:bg-gray-50 active:bg-gray-100 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-gray-200 focus:ring-offset-2">
                        Cancel
                    </button>
                </div>

            </div>
        </div>

        <!-- Simulated Bottom Home Indicator -->
        <div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-gray-900 rounded-full z-50"></div>
    </div>

</body>
</html>
