<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Send Money</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.no-scrollbar::-webkit-scrollbar {
display: none;
}
.no-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
/* Chrome, Safari, Edge, Opera - Remove arrows from number input */
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
-webkit-appearance: none;
margin: 0;
}
/* Firefox - Remove arrows */
input[type=number] {
-moz-appearance: textfield;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-gray-50 font-[Inter] text-gray-900 antialiased min-h-screen flex flex-col selection:bg-red-100 selection:text-red-900">

    <!-- App Header -->
    <header class="bg-white border-b border-gray-200/60 sticky top-0 z-50">
        <div class="max-w-md mx-auto px-5 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="font-semibold text-xl tracking-tighter text-red-700">CB</span>
            </div>
            <div class="flex items-center gap-4">
                <iconify-icon icon="solar:bell-linear" class="text-xl text-gray-500"></iconify-icon>
                <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center border border-gray-200">
                    <iconify-icon icon="solar:user-linear" class="text-gray-600"></iconify-icon>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 w-full max-w-md mx-auto p-5 relative overflow-hidden">
        
        <!-- ==================== SCREEN 1: TRANSFER FORM ==================== -->
        <div id="screen-form" class="transition-all duration-300 transform w-full">
            <div class="mb-6 mt-2">
                <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Send Money</h1>
                <p class="text-sm text-gray-500 mt-1">Interac e-Transfer®</p>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-200/50 p-5 space-y-6">
                
                <!-- Step 1: Bank Selection -->
                <div class="space-y-2 relative">
                    <label for="bankSelect" class="block text-sm font-medium text-gray-700">Recipient Financial Institution</label>
                    <div class="relative">
                        <select id="bankSelect" class="w-full appearance-none rounded-xl border border-gray-300 bg-white px-4 py-3.5 text-sm text-gray-900 focus:border-red-700 focus:outline-none focus:ring-1 focus:ring-red-700 transition-colors cursor-pointer pb-3.5">
                            <option value="" disabled selected>Select a bank...</option>
                            <option value="cibc">CIBC</option>
                            <option value="rbc">RBC Royal Bank</option>
                            <option value="td">TD Canada Trust</option>
                            <option value="scotiabank">Scotiabank</option>
                            <option value="bmo">BMO (Bank of Montreal)</option>
                            <option value="national">National Bank of Canada</option>
                            <option value="simplii">Simplii Financial</option>
                            <option value="tangerine">Tangerine Bank</option>
                            <option value="hsbc">HSBC Canada</option>
                            <option value="laurentian">Laurentian Bank</option>
                            <option value="eq">EQ Bank</option>
                            <option value="motive">Motive Financial</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4">
                            <iconify-icon icon="solar:alt-arrow-down-linear" class="text-gray-400 text-lg"></iconify-icon>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Email Input -->
                <div class="space-y-2 opacity-50 transition-opacity duration-300" id="emailContainer">
                    <label for="emailInput" class="block text-sm font-medium text-gray-700">Recipient Email</label>
                    <div class="relative">
                        <input type="email" id="emailInput" disabled placeholder="example@email.com" class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3.5 text-sm text-gray-900 placeholder-gray-400 focus:border-red-700 focus:outline-none focus:ring-1 focus:ring-red-700 transition-colors disabled:bg-gray-50 disabled:cursor-not-allowed pr-10">
                        <div id="emailSpinner" class="hidden absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
                            <iconify-icon icon="solar:spinner-linear" class="text-gray-400 text-lg animate-spin"></iconify-icon>
                        </div>
                    </div>
                    <!-- Name Reveal -->
                    <div id="recipientNameContainer" class="hidden mt-1 ml-1 transition-opacity duration-700 ease-in-out opacity-0">
                        <span class="text-sm font-medium text-gray-900" id="recipientNameText">Rhonda Yooya</span>
                    </div>
                </div>

                <!-- Step 3: Amount Input -->
                <div class="space-y-2">
                    <label for="amountInput" class="block text-sm font-medium text-gray-700">Amount (CAD)</label>
                    <div class="relative">
                        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4">
                            <span class="text-gray-500 text-sm font-medium">$</span>
                        </div>
                        <input type="number" id="amountInput" placeholder="0.00" step="0.01" min="0.01" class="w-full rounded-xl border border-gray-300 bg-white pl-8 pr-4 py-3.5 text-sm text-gray-900 placeholder-gray-400 focus:border-red-700 focus:outline-none focus:ring-1 focus:ring-red-700 transition-colors">
                    </div>
                </div>

            </div>

            <!-- Continue Button -->
            <div class="mt-8">
                <button id="continueBtn" disabled class="w-full rounded-full bg-red-700 py-3.5 text-sm font-semibold text-white shadow-sm hover:bg-red-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-700 transition-all opacity-50 cursor-not-allowed">
                    Continue
                </button>
            </div>
        </div>

        <!-- ==================== SCREEN 2: PIN INPUT ==================== -->
        <div id="screen-pin" class="hidden absolute inset-0 bg-gray-50 w-full h-[calc(100vh-64px)] z-20 flex flex-col pt-12 px-5">
            <div class="flex flex-col items-center flex-1">
                <h2 class="text-2xl font-semibold tracking-tight text-gray-900">Enter PIN</h2>
                <p class="text-sm text-gray-500 mt-2">To authorize this transfer</p>

                <!-- PIN Dots -->
                <div class="flex gap-4 mt-10 mb-16" id="pinDots">
                    <div class="w-3.5 h-3.5 rounded-full border border-gray-300 transition-colors duration-200"></div>
                    <div class="w-3.5 h-3.5 rounded-full border border-gray-300 transition-colors duration-200"></div>
                    <div class="w-3.5 h-3.5 rounded-full border border-gray-300 transition-colors duration-200"></div>
                    <div class="w-3.5 h-3.5 rounded-full border border-gray-300 transition-colors duration-200"></div>
                </div>

                <!-- Keypad -->
                <div class="grid grid-cols-3 gap-x-8 gap-y-6 max-w-[260px] w-full mx-auto" id="keypad">
                    <button class="keypad-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-medium text-gray-900 mx-auto hover:bg-gray-200 active:bg-gray-300 transition-colors select-none" data-val="1">1</button>
                    <button class="keypad-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-medium text-gray-900 mx-auto hover:bg-gray-200 active:bg-gray-300 transition-colors select-none" data-val="2">2</button>
                    <button class="keypad-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-medium text-gray-900 mx-auto hover:bg-gray-200 active:bg-gray-300 transition-colors select-none" data-val="3">3</button>
                    
                    <button class="keypad-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-medium text-gray-900 mx-auto hover:bg-gray-200 active:bg-gray-300 transition-colors select-none" data-val="4">4</button>
                    <button class="keypad-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-medium text-gray-900 mx-auto hover:bg-gray-200 active:bg-gray-300 transition-colors select-none" data-val="5">5</button>
                    <button class="keypad-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-medium text-gray-900 mx-auto hover:bg-gray-200 active:bg-gray-300 transition-colors select-none" data-val="6">6</button>
                    
                    <button class="keypad-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-medium text-gray-900 mx-auto hover:bg-gray-200 active:bg-gray-300 transition-colors select-none" data-val="7">7</button>
                    <button class="keypad-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-medium text-gray-900 mx-auto hover:bg-gray-200 active:bg-gray-300 transition-colors select-none" data-val="8">8</button>
                    <button class="keypad-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-medium text-gray-900 mx-auto hover:bg-gray-200 active:bg-gray-300 transition-colors select-none" data-val="9">9</button>
                    
                    <div class="w-16 h-16"></div> <!-- Empty space -->
                    <button class="keypad-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl font-medium text-gray-900 mx-auto hover:bg-gray-200 active:bg-gray-300 transition-colors select-none" data-val="0">0</button>
                    <button class="keypad-btn w-16 h-16 rounded-full flex items-center justify-center text-2xl text-gray-700 mx-auto hover:bg-gray-200 active:bg-gray-300 transition-colors select-none" data-val="del">
                        <iconify-icon icon="solar:backspace-linear"></iconify-icon>
                    </button>
                </div>
                
                <div class="mt-auto pb-8 w-full">
                    <button id="cancelPinBtn" class="w-full py-3.5 text-sm font-medium text-gray-600 hover:text-gray-900 transition-colors">Cancel Transfer</button>
                </div>
            </div>
        </div>

        <!-- ==================== SCREEN 3: LOADING ==================== -->
        <div id="screen-loading" class="hidden absolute inset-0 bg-white w-full h-[calc(100vh-64px)] z-30 flex flex-col items-center justify-center px-5">
            <iconify-icon icon="solar:spinner-linear" class="text-red-700 text-4xl animate-spin mb-6"></iconify-icon>
            <p class="text-base font-medium text-gray-900">Processing transfer...</p>
            <p class="text-sm text-gray-500 mt-2 text-center">Please do not close the app.</p>
        </div>

        <!-- ==================== SCREEN 4: ERROR ==================== -->
        <div id="screen-error" class="hidden absolute inset-0 bg-white w-full h-[calc(100vh-64px)] z-40 flex flex-col items-center justify-center px-5 text-center">
            <div class="w-16 h-16 rounded-full bg-red-50 flex items-center justify-center mb-6 border border-red-100">
                <iconify-icon icon="solar:danger-circle-linear" class="text-red-600 text-3xl"></iconify-icon>
            </div>
            <h2 class="text-xl font-semibold tracking-tight text-gray-900 mb-3">Transfer Failed</h2>
            <p class="text-sm text-gray-600 leading-relaxed max-w-[280px]">
                Transfer could not be completed.<br>
                Your account is currently under review.<br>
                Please try again later.
            </p>
            <div class="mt-10 w-full max-w-[280px]">
                <button onclick="window.location.reload()" class="w-full rounded-full bg-gray-100 py-3.5 text-sm font-semibold text-gray-900 hover:bg-gray-200 transition-colors border border-gray-200">
                    Return to Accounts
                </button>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Elements
            const bankSelect = document.getElementById('bankSelect');
            const emailInput = document.getElementById('emailInput');
            const emailContainer = document.getElementById('emailContainer');
            const emailSpinner = document.getElementById('emailSpinner');
            const recipientNameContainer = document.getElementById('recipientNameContainer');
            const amountInput = document.getElementById('amountInput');
            const continueBtn = document.getElementById('continueBtn');
            
            const screenForm = document.getElementById('screen-form');
            const screenPin = document.getElementById('screen-pin');
            const screenLoading = document.getElementById('screen-loading');
            const screenError = document.getElementById('screen-error');
            const cancelPinBtn = document.getElementById('cancelPinBtn');

            // State
            let isNameRevealed = false;
            const targetEmail = 'rhondayooya06@gmail.com';
            
            // Utility: Update Continue Button State
            function updateContinueButton() {
                const hasBank = bankSelect.value !== '';
                const hasEmail = emailInput.value.trim() !== '';
                const hasAmount = parseFloat(amountInput.value) > 0;
                const emailMatches = emailInput.value.trim().toLowerCase() === targetEmail;

                if (hasBank && hasEmail && hasAmount && isNameRevealed && emailMatches) {
                    continueBtn.disabled = false;
                    continueBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    continueBtn.disabled = true;
                    continueBtn.classList.add('opacity-50', 'cursor-not-allowed');
                }
            }

            // Step 1: Bank Selection Logic
            bankSelect.addEventListener('change', () => {
                if (bankSelect.value !== '') {
                    emailInput.disabled = false;
                    emailContainer.classList.remove('opacity-50');
                }
                updateContinueButton();
            });

            // Step 2: Email Logic
            let typingTimer;
            emailInput.addEventListener('input', () => {
                const currentEmail = emailInput.value.trim().toLowerCase();
                
                // Reset state on any input change
                isNameRevealed = false;
                recipientNameContainer.classList.add('hidden');
                recipientNameContainer.classList.remove('opacity-100');
                recipientNameContainer.classList.add('opacity-0');
                updateContinueButton();

                clearTimeout(typingTimer);

                if (currentEmail === targetEmail && bankSelect.value !== '') {
                    // Start verification process
                    emailInput.disabled = true;
                    emailSpinner.classList.remove('hidden');

                    typingTimer = setTimeout(() => {
                        // After 3 seconds
                        emailSpinner.classList.add('hidden');
                        emailInput.disabled = false;
                        isNameRevealed = true;
                        
                        recipientNameContainer.classList.remove('hidden');
                        // Small delay to ensure display:block is rendered before changing opacity for transition
                        setTimeout(() => {
                            recipientNameContainer.classList.remove('opacity-0');
                            recipientNameContainer.classList.add('opacity-100');
                            updateContinueButton();
                        }, 50);

                    }, 3000);
                }
            });

            // Step 3: Amount Logic
            amountInput.addEventListener('input', updateContinueButton);

            // Step 4: Continue Button Click
            continueBtn.addEventListener('click', () => {
                if (!continueBtn.disabled) {
                    screenForm.classList.add('hidden');
                    screenPin.classList.remove('hidden');
                    // Ensure focus is clear
                    document.activeElement.blur();
                }
            });

            // Step 5: PIN Logic
            let currentPin = '';
            const correctPin = '6684';
            const pinDots = document.querySelectorAll('#pinDots div');
            const keypadBtns = document.querySelectorAll('.keypad-btn');

            function updatePinUI() {
                pinDots.forEach((dot, index) => {
                    if (index < currentPin.length) {
                        dot.classList.add('bg-gray-800', 'border-gray-800');
                        dot.classList.remove('border-gray-300');
                    } else {
                        dot.classList.remove('bg-gray-800', 'border-gray-800');
                        dot.classList.add('border-gray-300');
                    }
                });

                if (currentPin.length === 4) {
                    // Disable keypad briefly to prevent extra clicks
                    keypadBtns.forEach(btn => btn.style.pointerEvents = 'none');
                    
                    setTimeout(() => {
                        if (currentPin === correctPin) {
                            // Move to loading
                            screenPin.classList.add('hidden');
                            screenLoading.classList.remove('hidden');
                            startLoadingSequence();
                        } else {
                            // Wrong PIN - clear it
                            currentPin = '';
                            updatePinUI();
                            keypadBtns.forEach(btn => btn.style.pointerEvents = 'auto');
                            // Shake effect could be added here
                        }
                    }, 300);
                }
            }

            keypadBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const val = e.currentTarget.getAttribute('data-val');
                    
                    if (val === 'del') {
                        currentPin = currentPin.slice(0, -1);
                    } else if (currentPin.length < 4) {
                        currentPin += val;
                    }
                    updatePinUI();
                });
            });

            cancelPinBtn.addEventListener('click', () => {
                currentPin = '';
                updatePinUI();
                screenPin.classList.add('hidden');
                screenForm.classList.remove('hidden');
            });

            // Step 6 & 7: Loading and Error Sequence
            function startLoadingSequence() {
                setTimeout(() => {
                    screenLoading.classList.add('hidden');
                    screenError.classList.remove('hidden');
                }, 5000); // 5 seconds processing
            }
        });
    </script>
</body>
</html>
