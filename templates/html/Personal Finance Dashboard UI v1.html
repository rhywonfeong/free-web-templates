<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClariFi – Personal Finance Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'SF Pro Text', 'Roboto', Arial, sans-serif;
      background: #FAFBFD;
    }
    /* Fade-in and slide-up animation for all elements */
    .fade-in {
      opacity: 0;
      transform: translateY(32px) scale(0.98);
      animation: fadeInSlideUp 0.7s cubic-bezier(.44,0,.56,1) forwards;
    }
    .fade-in.delay-1 { animation-delay: 0.08s; }
    .fade-in.delay-2 { animation-delay: 0.16s; }
    .fade-in.delay-3 { animation-delay: 0.24s; }
    .fade-in.delay-4 { animation-delay: 0.32s; }
    .fade-in.delay-5 { animation-delay: 0.40s; }
    .fade-in.delay-6 { animation-delay: 0.48s; }
    @keyframes fadeInSlideUp {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    /* Clay-style phone mockup */
    .mockup {
      background: linear-gradient(160deg, #e7eaf4 65%, #d4d8eb 100%);
      border-radius: 40px;
      box-shadow: 0 4px 36px 8px rgba(23,40,90,0.10), 0 12px 40px 0 rgba(23,46,110,0.18);
      padding: 16px 6px 16px 6px;
      max-width: 420px;
      margin: 40px auto;
      border: 2px solid #f2f3f7;
      position: relative;
      aspect-ratio: 1/2.15;
      min-height: 780px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
    }
    .notch {
      width: 140px;
      height: 30px;
      background: #e3e6f2;
      border-radius: 0 0 20px 20px;
      margin: 0 auto 8px auto;
      box-shadow: 0 2px 6px rgba(24,47,99,0.05);
      position: relative;
      z-index: 2;
    }
    /* Hide scrollbar for transaction list */
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    /* Chart.js tooltip styling */
    .chartjs-tooltip {
      pointer-events: none;
      position: absolute;
      background: #fff;
      color: #1A1F36;
      font-size: 15px;
      font-family: 'SF Pro Text', 'Roboto', Arial, sans-serif;
      border-radius: 12px;
      box-shadow: 0 4px 12px 1px rgba(43,92,230,0.09);
      padding: 8px 14px;
      opacity: 0;
      transition: opacity 0.20s;
      z-index: 10;
      border: 1px solid #E2E8F0;
      font-weight: 500;
    }
    @media (max-width: 460px) {
      .mockup { max-width: 100vw; min-height: 100svh; border-radius: 0; }
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Roboto&display=swap" rel="stylesheet">
  <style>
      /* Custom font utilities */
      .font-roboto { font-family: 'Roboto', sans-serif !important; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-[#FAFBFD]">
  <div class="mockup fade-in delay-1">
    <div class="notch"></div>
    <!-- Header -->
    <nav class="flex items-center justify-between px-5 pt-1 pb-1 fade-in delay-2" aria-label="Main header">
      <span class="flex items-center">
        <span style="font-family:'SF Pro Text','Roboto',sans-serif; font-weight:700; font-size:32px; letter-spacing:-0.03em; color:#1A1F36; line-height:1.1; user-select:none;">
          Clari<span style="color:#2B5CE6;">Fi</span>
        </span>
      </span>
      <button aria-label="Notifications" class="rounded-full hover:bg-[#F7F9FC] focus:outline-none focus:ring-2 focus:ring-[#2B5CE6] transition-colors" style="width:44px; height:44px; display:flex; align-items:center; justify-content:center;">
        <i data-lucide="bell" style="width:28px; height:28px; color:#A5B1C8;"></i>
      </button>
    </nav>
    <!-- Main Content Area -->
    <main class="flex-1 px-5 pt-1 pb-2 flex flex-col">
      <!-- Bar Chart Section -->
      <section class="fade-in delay-3">
        <h2 style="font-size:24px; font-weight:600; letter-spacing:-0.02em; color:#1A1F36; margin-bottom:18px; line-height:1.17; font-family:'SF Pro Text','Roboto',sans-serif;">
          Monthly Spending
        </h2>
        <div class="relative w-full" style="height:186px; border-radius:18px; background:#fff; box-shadow:0 2px 10px 0 rgba(43,92,230,0.04); display:flex; align-items:flex-end; justify-content:center; padding:0 10px 8px 10px;">
          <div style="width:100%; display:flex; flex-direction:column; justify-content:flex-end;">
            <canvas id="spendingChart" style="width:100%; height:140px; max-height:140px; margin-bottom:0; margin-top:8px;"></canvas>
          </div>
          <!-- Custom Tooltip will be injected here -->
          <div id="chart-tooltip" class="chartjs-tooltip"></div>
        </div>
      </section>
      <!-- Key Metrics Cards -->
      <section class="flex gap-4 mt-5 fade-in delay-4" aria-label="Key Financial Metrics">
        <div class="flex-1 bg-white rounded-2xl shadow-sm border border-[#F1F2F6] p-4 flex flex-col min-w-0 hover:border-[#2B5CE6] transition-colors" tabindex="0" style="min-width:0;">
          <span style="font-size:14px; color:#6B7280; font-weight:400; font-family:'SF Pro Text','Roboto',sans-serif; margin-bottom:3px;">Current Balance</span>
          <span style="font-size:18px; font-weight:600; color:#1A1F36; font-family:'SF Pro Text','Roboto',sans-serif; letter-spacing:-0.01em;">$5,230.50</span>
        </div>
        <div class="flex-1 bg-white rounded-2xl shadow-sm border border-[#F1F2F6] p-4 flex flex-col min-w-0 hover:border-[#00C896] transition-colors" tabindex="0" style="min-width:0;">
          <span style="font-size:14px; color:#6B7280; font-weight:400; font-family:'SF Pro Text','Roboto',sans-serif; margin-bottom:3px;">Budget Remaining</span>
          <span style="font-size:18px; font-weight:600; color:#00C896; font-family:'SF Pro Text','Roboto',sans-serif; letter-spacing:-0.01em;">$750.00</span>
        </div>
      </section>
      <!-- Recent Activities -->
      <section class="mt-7 fade-in delay-5 flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-2">
          <h3 style="font-size:18px; font-weight:600; color:#1A1F36; letter-spacing:-0.01em; font-family:'SF Pro Text','Roboto',sans-serif;">Recent Activities</h3>
          <a href="#" style="font-size:16px; color:#2B5CE6; font-weight:400; font-family:'SF Pro Text','Roboto',sans-serif; text-decoration:none;" class="hover:underline">See all</a>
        </div>
        <ul class="hide-scroll flex-1 overflow-y-auto pr-1" aria-label="Recent Transactions" style="scroll-behavior:smooth; max-height:200px;">
          <li class="flex items-center py-3 border-b border-[#F1F2F6] last:border-b-0 group transition-colors hover:bg-[#F7F9FC] rounded-xl px-2 cursor-pointer" tabindex="0">
            <div class="flex-1">
              <span style="font-size:16px; font-weight:400; color:#1A1F36; font-family:'SF Pro Text','Roboto',sans-serif; display:block;">Starbucks</span>
              <span style="font-size:14px; color:#8F9BB3; font-family:'SF Pro Text','Roboto',sans-serif;">Jun 22</span>
            </div>
            <span style="font-size:16px; font-weight:400; color:#1A1F36; font-family:'SF Pro Text','Roboto',sans-serif;">-$5.75</span>
          </li>
          <li class="flex items-center py-3 border-b border-[#F1F2F6] last:border-b-0 group transition-colors hover:bg-[#F7F9FC] rounded-xl px-2 cursor-pointer" tabindex="0">
            <div class="flex-1">
              <span style="font-size:16px; font-weight:400; color:#1A1F36; font-family:'SF Pro Text','Roboto',sans-serif; display:block;">Grocery Store</span>
              <span style="font-size:14px; color:#8F9BB3; font-family:'SF Pro Text','Roboto',sans-serif;">Jun 21</span>
            </div>
            <span style="font-size:16px; font-weight:400; color:#1A1F36; font-family:'SF Pro Text','Roboto',sans-serif;">-$78.20</span>
          </li>
          <li class="flex items-center py-3 border-b border-[#F1F2F6] last:border-b-0 group transition-colors hover:bg-[#F7F9FC] rounded-xl px-2 cursor-pointer" tabindex="0">
            <div class="flex-1">
              <span style="font-size:16px; font-weight:400; color:#1A1F36; font-family:'SF Pro Text','Roboto',sans-serif; display:block;">Netflix</span>
              <span style="font-size:14px; color:#8F9BB3; font-family:'SF Pro Text','Roboto',sans-serif;">Jun 20</span>
            </div>
            <span style="font-size:16px; font-weight:400; color:#1A1F36; font-family:'SF Pro Text','Roboto',sans-serif;">-$15.99</span>
          </li>
          <li class="flex items-center py-3 border-b border-[#F1F2F6] last:border-b-0 group transition-colors hover:bg-[#F7F9FC] rounded-xl px-2 cursor-pointer" tabindex="0">
            <div class="flex-1">
              <span style="font-size:16px; font-weight:400; color:#1A1F36; font-family:'SF Pro Text','Roboto',sans-serif; display:block;">Uber</span>
              <span style="font-size:14px; color:#8F9BB3; font-family:'SF Pro Text','Roboto',sans-serif;">Jun 19</span>
            </div>
            <span style="font-size:16px; font-weight:400; color:#1A1F36; font-family:'SF Pro Text','Roboto',sans-serif;">-$22.50</span>
          </li>
          <li class="flex items-center py-3 border-b border-[#F1F2F6] last:border-b-0 group transition-colors hover:bg-[#F7F9FC] rounded-xl px-2 cursor-pointer" tabindex="0">
            <div class="flex-1">
              <span style="font-size:16px; font-weight:400; color:#1A1F36; font-family:'SF Pro Text','Roboto',sans-serif; display:block;">Spotify</span>
              <span style="font-size:14px; color:#8F9BB3; font-family:'SF Pro Text','Roboto',sans-serif;">Jun 18</span>
            </div>
            <span style="font-size:16px; font-weight:400; color:#1A1F36; font-family:'SF Pro Text','Roboto',sans-serif;">-$9.99</span>
          </li>
        </ul>
      </section>
    </main>
    <!-- Bottom Navigation Bar -->
    <nav class="w-full bg-white border-t border-[#E2E8F0] shadow-sm rounded-b-[36px] px-2 pt-1 pb-1 flex justify-between items-center fade-in delay-6" style="min-height:62px;" aria-label="Bottom navigation">
      <button class="flex flex-col items-center justify-center flex-1 py-1 group focus:outline-none" aria-label="Dashboard" style="min-width:44px;">
        <i data-lucide="pie-chart" style="width:28px; height:28px; color:#2B5CE6; transition:color 0.18s;"></i>
        <span style="font-size:16px; font-weight:500; color:#2B5CE6; font-family:'SF Pro Text','Roboto',sans-serif; margin-top:0.5em; letter-spacing:-0.01em;">Dashboard</span>
      </button>
      <button class="flex flex-col items-center justify-center flex-1 py-1 group focus:outline-none" aria-label="Transactions" style="min-width:44px;">
        <i data-lucide="list" style="width:28px; height:28px; color:#A5B1C8; transition:color 0.18s;" class="group-hover:text-[#2B5CE6]"></i>
        <span style="font-size:16px; font-weight:500; color:#A5B1C8; font-family:'SF Pro Text','Roboto',sans-serif; margin-top:0.5em; letter-spacing:-0.01em;">Transactions</span>
      </button>
      <button class="flex flex-col items-center justify-center flex-1 py-1 group focus:outline-none" aria-label="Budgets" style="min-width:44px;">
        <i data-lucide="wallet" style="width:28px; height:28px; color:#A5B1C8; transition:color 0.18s;" class="group-hover:text-[#2B5CE6]"></i>
        <span style="font-size:16px; font-weight:500; color:#A5B1C8; font-family:'SF Pro Text','Roboto',sans-serif; margin-top:0.5em; letter-spacing:-0.01em;">Budgets</span>
      </button>
      <button class="flex flex-col items-center justify-center flex-1 py-1 group focus:outline-none" aria-label="Profile" style="min-width:44px;">
        <i data-lucide="user" style="width:28px; height:28px; color:#A5B1C8; transition:color 0.18s;" class="group-hover:text-[#2B5CE6]"></i>
        <span style="font-size:16px; font-weight:500; color:#A5B1C8; font-family:'SF Pro Text','Roboto',sans-serif; margin-top:0.5em; letter-spacing:-0.01em;">Profile</span>
      </button>
    </nav>
  </div>
  <script>
    // Lucide icons
    lucide.createIcons();

    // Bar Chart Data
    const ctx = document.getElementById('spendingChart').getContext('2d');
    const spendingCategories = ['Groceries', 'Transport', 'Entertainment', 'Bills'];
    const spendingData = [450, 150, 200, 500];
    const barColors = ['#2B5CE6', '#4B7BF5', '#A5B1C8', '#1A1F36'];

    // Chart.js: Custom tooltip handler
    const externalTooltipHandler = (context) => {
      const {chart, tooltip} = context;
      const tooltipEl = document.getElementById('chart-tooltip');
      if (tooltip.opacity === 0) {
        tooltipEl.style.opacity = 0;
        return;
      }
      if (tooltip.body) {
        const idx = tooltip.dataPoints[0].dataIndex;
        const label = spendingCategories[idx];
        const value = spendingData[idx];
        tooltipEl.innerHTML = `<strong>${label}</strong><br/><span style="color:#2B5CE6;">$${value.toLocaleString()}</span>`;
      }
      const canvasRect = chart.canvas.getBoundingClientRect();
      tooltipEl.style.opacity = 1;
      tooltipEl.style.left = canvasRect.left + window.scrollX + tooltip.caretX - tooltipEl.offsetWidth / 2 + 'px';
      tooltipEl.style.top = canvasRect.top + window.scrollY + tooltip.caretY - tooltipEl.offsetHeight - 16 + 'px';
    };

    // Chart.js Bar Chart
    const spendingChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: spendingCategories,
        datasets: [{
          label: 'Spend',
          data: spendingData,
          backgroundColor: barColors,
          borderRadius: 8,
          borderSkipped: false,
          maxBarThickness: 38,
          minBarLength: 4,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: false,
            external: externalTooltipHandler
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: {
              color: '#8F9BB3',
              font: { family: "'SF Pro Text','Roboto',sans-serif", size: 15, weight: 500 },
            }
          },
          y: {
            beginAtZero: true,
            grid: {
              color: '#F1F2F6',
              borderDash: [2,2]
            },
            ticks: {
              color: '#A5B1C8',
              stepSize: 100,
              font: { family: "'SF Pro Text','Roboto',sans-serif", size: 14 }
            }
          }
        },
        onHover: (e,activeEls) => {
          e.native.target.style.cursor = activeEls.length ? 'pointer' : 'default';
        }
      }
    });

    // Animate fade-in for all .fade-in elements with stagger
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.fade-in').forEach((el) => {
        el.style.visibility = 'visible';
      });
    });

    // Chart tap/click for touch as well as mouse
    document.getElementById('spendingChart').addEventListener('click', function(evt) {
      const points = spendingChart.getElementsAtEventForMode(evt, 'nearest', { intersect: true }, true);
      if (points.length) {
        spendingChart.setActiveElements(points);
        spendingChart.tooltip.setActiveElements(points);
        spendingChart.update();
      }
    });
    // On touch, activate tooltip
    document.getElementById('spendingChart').addEventListener('touchstart', function(evt) {
      evt.preventDefault();
      const touch = evt.touches[0];
      const mouseEvent = new MouseEvent('click', {
        view: window,
        bubbles: true,
        cancelable: true,
        clientX: touch.clientX,
        clientY: touch.clientY
      });
      evt.target.dispatchEvent(mouseEvent);
    });

    // Hide tooltip on tap outside
    document.addEventListener('mousedown', (e) => {
      const chartArea = document.getElementById('spendingChart').getBoundingClientRect();
      const tooltipEl = document.getElementById('chart-tooltip');
      if (!(
        e.clientX >= chartArea.left &&
        e.clientX <= chartArea.right &&
        e.clientY >= chartArea.top &&
        e.clientY <= chartArea.bottom
      )) {
        tooltipEl.style.opacity = 0;
        spendingChart.setActiveElements([]);
        spendingChart.tooltip.setActiveElements([]);
        spendingChart.update();
      }
    });

    // Bottom nav: scale on press, hover color
    document.querySelectorAll('.mockup nav[aria-label="Bottom navigation"] button').forEach(btn => {
      btn.addEventListener('mousedown', () => btn.style.transform = 'scale(0.95)');
      btn.addEventListener('touchstart', () => btn.style.transform = 'scale(0.95)');
      btn.addEventListener('mouseup', () => btn.style.transform = '');
      btn.addEventListener('mouseleave', () => btn.style.transform = '');
      btn.addEventListener('touchend', () => btn.style.transform = '');
      btn.addEventListener('mouseenter', () => {
        const icon = btn.querySelector('i');
        if (icon && icon.style.color !== '#2B5CE6') icon.style.color = '#4B7BF5';
        btn.querySelector('span').style.color = '#4B7BF5';
      });
      btn.addEventListener('mouseleave', () => {
        const icon = btn.querySelector('i');
        if (btn.querySelector('span').textContent === 'Dashboard') {
          icon.style.color = '#2B5CE6';
          btn.querySelector('span').style.color = '#2B5CE6';
        } else {
          icon.style.color = '#A5B1C8';
          btn.querySelector('span').style.color = '#A5B1C8';
        }
      });
    });
  </script>
</body>
</html>
