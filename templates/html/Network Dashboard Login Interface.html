  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Network Visual</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .letter-animate {
      opacity: 0;
      transform: translateY(24px);
      filter: blur(8px);
      display: inline-block;
      animation: letterFadeInUp 0.7s cubic-bezier(.31,1.34,.42,1.01) forwards;
    }
    @keyframes letterFadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }
  </style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center">
  <div class="max-w-3xl w-full relative bg-black/60 rounded-2xl shadow-2xl border border-gray-800 flex flex-col md:flex-row overflow-hidden">
    <!-- Left Column: Login Form -->
    <div class="md:w-1/2 w-full p-8 flex flex-col justify-center z-10 bg-gray-900/80">
      <div class="max-w-sm mx-auto w-full">
        <div class="mb-8 text-center">
          <span class="uppercase text-xs bg-gray-800 px-3 py-1 rounded-full text-gray-400 tracking-wide">Sign in</span>
          <h2 class="text-2xl font-bold text-white mt-4" id="animated-welcome"></h2>
          <p class="text-gray-400 mt-2 text-sm">Log in to your network dashboard</p>
        </div>
        <form class="space-y-5">
          <div>
            <label for="email" class="block text-xs text-gray-300 font-semibold mb-2">Email</label>
            <input id="email" type="email" class="appearance-none w-full px-4 py-2 rounded-md bg-gray-800 border border-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="you@example.com" autocomplete="username">
          </div>
          <div>
            <label for="password" class="block text-xs text-gray-300 font-semibold mb-2">Password</label>
            <input id="password" type="password" class="appearance-none w-full px-4 py-2 rounded-md bg-gray-800 border border-gray-700 text-gray-200 focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="••••••••" autocomplete="current-password">
          </div>
          <div class="flex items-center justify-between">
            <label class="flex items-center text-xs text-gray-400">
              <input type="checkbox" class="accent-blue-500 mr-2">
              Remember me
            </label>
            <a href="#" class="text-xs text-blue-400 hover:underline">Forgot password?</a>
          </div>
          <button type="submit" class="w-full py-2 mt-2 rounded-lg bg-blue-600 hover:bg-blue-700 font-semibold text-white flex items-center justify-center gap-2 transition shadow-md">
            Log In
          </button>
        </form>
        <div class="mt-5 text-center text-xs text-gray-500">
          Don’t have an account?
          <a href="#" class="ml-1 text-blue-400 hover:underline">Sign up</a>
        </div>
      </div>
    </div>
    <!-- Right Column: Visualization -->
    <div class="md:w-1/2 w-full relative min-h-[420px] flex items-center justify-center">
      <div id="vanta-canvas" class="absolute inset-0"></div>
      <div class="relative z-10 flex flex-col items-center justify-center h-full w-full text-white">
        <span class="px-3 py-1 text-xs bg-black/60 rounded-full text-gray-300 tracking-wide">NETWORK VISUAL</span>
        <h2 class="mt-4 text-2xl font-bold" id="animated-title"></h2>
        <p class="mt-2 text-gray-300 text-sm max-w-xs text-center">Visualize your secure, real-time infrastructure from here.</p>
      </div>
    </div>
  </div>
  <script>
    // Vanta Network BG
    document.addEventListener('DOMContentLoaded', function() {
      VANTA.NET({
        el: "#vanta-canvas",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200,
        minWidth: 200,
        scale: 1,
        scaleMobile: 1,
        color: 0x60a5fa,
        backgroundColor: 0x030712,
        points: 14,
        maxDistance: 20,
        spacing: 18,
        showDots: true
      });

      // Animated Letters for title
      function animateLetters(elementId, text) {
        const container = document.getElementById(elementId);
        container.innerHTML = "";
        [...text].forEach((char, i) => {
          const span = document.createElement('span');
          span.textContent = char;
          span.className = "letter-animate";
          span.style.animationDelay = (i * 60) + "ms";
          container.appendChild(span);
        });
      }

      animateLetters('animated-title', 'Network Insights');
      animateLetters('animated-welcome', 'Welcome Back');
    });
  </script>
</body>
</html>
