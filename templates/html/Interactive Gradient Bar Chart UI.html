  <meta charset="UTF-8">
  <title>Gradient Chart Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .active-segment { color: #38bdf8; font-weight: 700; }
    .bar-gradient {
      background: linear-gradient(180deg, #6366f1 0%, #06b6d4 100%);
    }
    .card-gradient-bg {
      background: linear-gradient(130deg, #171717 0%, #242424 60%, #323232 100%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#2622fb] via-[#8156ef] to-[#1e237e]">
  <div class="flex flex-col items-start gap-[10px] w-[390px] rounded-2xl border border-white/10 shadow-2xl px-6 pt-6 pb-5 card-gradient-bg">
    <!-- Segment Control -->
    <div class="flex w-full justify-center gap-2 border border-white/20 rounded-full py-2 px-5 mb-2 bg-white/5">
      <button id="incomeBtn" class="font-sans text-sm px-3 py-1 rounded-lg active-segment transition-colors">Income</button>
      <div class="h-6 w-px bg-white/20 mx-1"></div>
      <button id="spendingBtn" class="font-sans text-sm px-3 py-1 rounded-lg text-white/70 transition-colors">Spending</button>
    </div>
    <!-- Chart -->
    <div class="flex flex-row w-full gap-4 h-56 items-end">
      <!-- Y axis labels only -->
      <div class="flex flex-col justify-between h-full py-2 w-10 mr-1">
        <span class="block text-xs text-white/90">100%</span>
        <span class="block text-xs text-white/70">60%</span>
        <span class="block text-xs text-white/50">20%</span>
        <span class="block text-xs text-white opacity-0 select-none">0%</span>
      </div>
      <div id="bars" class="flex flex-row items-end gap-5 w-full z-10"></div>
    </div>
  </div>
  <script>
    const chartData = {
      Income: [
        { h: 170, label: "JAN", muted: true },
        { h: 130, label: "FEB", muted: false },
        { h: 90,  label: "MAR", muted: true },
        { h: 190, label: "APR", muted: false },
        { h: 140, label: "MAY", muted: false }
      ],
      Spending: [
        { h: 90,  label: "JAN", muted: false },
        { h: 170, label: "FEB", muted: true },
        { h: 55,  label: "MAR", muted: false },
        { h: 140, label: "APR", muted: true },
        { h: 70,  label: "MAY", muted: true }
      ]
    };
    function renderBars(mode) {
      const bars = document.getElementById('bars');
      bars.innerHTML = '';
      chartData[mode].forEach(d => {
        const segment = document.createElement('div');
        segment.className = "flex flex-col items-center";
        segment.innerHTML = `
          <div class="rounded-xl bar-gradient transition-all duration-300"
            style="height:${d.h}px;width:30px;opacity:${d.muted?0.25:1}">
          </div>
          <span class="text-xs text-white/70 mt-2">${d.label}</span>
        `;
        bars.appendChild(segment);
      });
    }
    function setActive(type) {
      document.getElementById('incomeBtn').classList.toggle('active-segment', type === 'Income');
      document.getElementById('incomeBtn').classList.toggle('text-white/70', type !== 'Income');
      document.getElementById('spendingBtn').classList.toggle('active-segment', type === 'Spending');
      document.getElementById('spendingBtn').classList.toggle('text-white/70', type !== 'Spending');
      renderBars(type);
    }
    document.getElementById('incomeBtn').onclick = () => setActive('Income');
    document.getElementById('spendingBtn').onclick = () => setActive('Spending');
    setActive('Income');
  </script>
</body>
</html>
