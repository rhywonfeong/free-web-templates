<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine?</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Outfit', sans-serif;
overflow: hidden;
}
h1, h2, .serif {
font-family: 'Playfair Display', serif;
}
.glass {
background: rgba(255, 255, 255, 0.8);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(255, 255, 255, 0.6);
}
.btn-transition {
transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}
/* Float animation for background hearts */
@keyframes floatUp {
0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
10% { opacity: 0.3; }
90% { opacity: 0.3; }
100% { transform: translateY(-10vh) rotate(20deg); opacity: 0; }
}
.bg-heart {
position: absolute;
animation: floatUp linear infinite;
}
</style></head>
<body class="bg-rose-50 h-screen w-full relative flex items-center justify-center overflow-hidden selection:bg-rose-200 selection:text-rose-900">

    <!-- Ambient Background -->
    <div class="absolute inset-0 pointer-events-none z-0">
        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-white/0 to-rose-100/50"></div>
        <div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] bg-pink-200/30 rounded-full blur-[100px]"></div>
        <div class="absolute top-[40%] right-[0%] w-[40%] h-[40%] bg-rose-200/30 rounded-full blur-[100px]"></div>
        <div id="hearts-container"></div>
    </div>

    <main class="relative z-10 w-full max-w-sm mx-4">
        <!-- Question Card -->
        <div id="card" class="glass rounded-3xl p-8 shadow-2xl shadow-rose-900/10 text-center transition-all duration-500 ease-in-out">
            
            <!-- Icon -->
            <div class="mb-6 inline-flex justify-center items-center relative">
                <div class="absolute inset-0 bg-rose-400 blur-xl opacity-20 rounded-full animate-pulse"></div>
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-rose-50 relative">
                    <iconify-icon icon="solar:heart-angle-linear" width="42" class="text-rose-500"></iconify-icon>
                </div>
            </div>

            <!-- Title -->
            <h1 class="text-3xl text-slate-900 font-medium tracking-tight mb-3 leading-tight">
                Will u bee my valentine my <span class="text-rose-500 italic">little fairy?</span>
            </h1>
            
            <!-- Subtitle -->
            <p class="text-slate-500 text-sm mb-8 font-light leading-relaxed">
                I promise to make it special.
            </p>

            <!-- Buttons -->
            <div class="relative h-12 w-full flex justify-center items-center gap-4">
                
                <!-- Yes Button -->
                <button onclick="sayYes()" class="btn-transition z-10 px-8 py-2.5 bg-slate-900 text-white rounded-full text-sm font-medium hover:bg-rose-600 hover:shadow-lg hover:shadow-rose-500/25 active:scale-95 flex items-center gap-2">
                    <span>Yes</span>
                    <iconify-icon icon="solar:heart-linear" width="16"></iconify-icon>
                </button>

                <!-- No Button (Jumps around) -->
                <button id="noBtn" onmouseover="moveButton()" onfocus="moveButton()" class="btn-transition px-8 py-2.5 bg-white text-slate-600 border border-slate-200 rounded-full text-sm font-medium hover:bg-rose-50 z-20 whitespace-nowrap">
                    No
                </button>
            </div>
        </div>

        <!-- Success Card (Hidden by default) -->
        <div id="success" class="hidden glass rounded-3xl p-8 shadow-2xl shadow-rose-500/20 text-center transform scale-95 opacity-0 transition-all duration-700">
            <div class="mb-6 inline-flex justify-center">
                <div class="bg-gradient-to-tr from-rose-400 to-pink-500 rounded-full p-4 shadow-lg shadow-rose-500/30 text-white animate-bounce">
                    <iconify-icon icon="solar:confetti-minimalistic-linear" width="48"></iconify-icon>
                </div>
            </div>
            <h1 class="text-3xl text-slate-900 font-medium tracking-tight mb-4">
                Yayyyyyyy!
            </h1>
            <p class="text-slate-600 text-sm leading-relaxed mb-6 font-light">
                Hello my valentine, I've planned a date for us on 14th Feb. Hope to see u!
            </p>
            <div class="inline-flex items-center justify-center gap-2 text-xs text-rose-500 font-medium tracking-widest uppercase bg-rose-50 px-4 py-2 rounded-full border border-rose-100">
                <iconify-icon icon="solar:calendar-linear" width="14"></iconify-icon>
                <span>Save the Date</span>
            </div>
        </div>
    </main>

    <script>
        // Background Animation
        const container = document.getElementById('hearts-container');
        const icons = ['solar:heart-linear', 'solar:heart-shine-linear', 'solar:cupid-linear'];
        
        for(let i = 0; i < 12; i++) {
            const heart = document.createElement('div');
            heart.className = 'bg-heart text-rose-300/40';
            heart.innerHTML = `<iconify-icon icon="${icons[Math.floor(Math.random() * icons.length)]}" width="${Math.random() * 20 + 10}"></iconify-icon>`;
            heart.style.left = Math.random() * 100 + '%';
            heart.style.animationDuration = (Math.random() * 5 + 10) + 's';
            heart.style.animationDelay = (Math.random() * 5) + 's';
            container.appendChild(heart);
        }

        // Logic for the jumping "No" button
        const noBtn = document.getElementById('noBtn');
        const phrases = ["u r mean", "try again", "nope", "not that"];
        let phraseIndex = 0;

        function moveButton() {
            // Calculate random position within viewport, keeping padding from edges
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) + 20;

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
            
            // Cycle through text
            noBtn.innerText = phrases[phraseIndex];
            phraseIndex = (phraseIndex + 1) % phrases.length;
            
            // Add slight rotation for chaotic effect
            const rotate = Math.random() * 20 - 10;
            noBtn.style.transform = `rotate(${rotate}deg)`;
        }

        // Handle touch for mobile devices
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        // Yes Button Logic
        function sayYes() {
            const card = document.getElementById('card');
            const success = document.getElementById('success');
            const noButton = document.getElementById('noBtn');

            // Hide No button immediately
            noButton.style.display = 'none';

            // Transition cards
            card.style.opacity = '0';
            card.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                card.style.display = 'none';
                success.classList.remove('hidden');
                
                // Force reflow
                void success.offsetWidth;
                
                success.style.opacity = '1';
                success.style.transform = 'scale(1)';
                
                triggerConfetti();
            }, 300);
        }

        function triggerConfetti() {
            const colors = ['#f43f5e', '#fb7185', '#fda4af'];
            
            const end = Date.now() + 3000;

            (function frame() {
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }
    </script>
</body>
</html>
