    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Mouse Follower</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            overflow: hidden;
            cursor: none; /* Hide the default cursor */
            font-family: Arial, sans-serif;
        }

        .content {
            color: white;
            text-align: center;
            padding-top: 20vh;
        }

        .cursor-follower {
            position: fixed;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            transition: width 0.3s, height 0.3s, background 0.3s;
        }

        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10000;
            transition: width 0.2s, height 0.2s, background 0.2s;
        }

        .particles {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
        }

        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>Mouse Animation Cursor</h1>
        <p>Move your mouse around to see the effect!</p>
    </div>
    <div class="cursor-follower"></div>
    <div class="cursor-dot"></div>
    <div class="particles"></div>

    <script>
        const follower = document.querySelector('.cursor-follower');
        const dot = document.querySelector('.cursor-dot');
        const particles = document.querySelector('.particles');
        
        let mouseX = 0;
        let mouseY = 0;
        let followerX = 0;
        let followerY = 0;
        let dotX = 0;
        let dotY = 0;
        let isClicking = false;
        
        // Create particle pool
        const particlePool = [];
        const PARTICLE_COUNT = 20;
        
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particles.appendChild(particle);
            particlePool.push({
                element: particle,
                x: 0,
                y: 0,
                vx: 0,
                vy: 0,
                age: 0,
                active: false
            });
        }
        
        // Track mouse position
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // Emit particles occasionally during movement
            if (Math.random() > 0.85) {
                emitParticle();
            }
        });
        
        document.addEventListener('mousedown', () => {
            isClicking = true;
            follower.style.width = '35px';
            follower.style.height = '35px';
            follower.style.background = 'rgba(255, 255, 255, 0.2)';
            dot.style.width = '6px';
            dot.style.height = '6px';
            
            // Emit particles on click
            for (let i = 0; i < 8; i++) {
                emitParticle();
            }
        });
        
        document.addEventListener('mouseup', () => {
            isClicking = false;
            follower.style.width = '40px';
            follower.style.height = '40px';
            follower.style.background = 'rgba(255, 255, 255, 0.1)';
            dot.style.width = '8px';
            dot.style.height = '8px';
        });
        
        function emitParticle() {
            // Find an inactive particle
            const particle = particlePool.find(p => !p.active);
            if (!particle) return;
            
            // Activate and position the particle
            particle.active = true;
            particle.age = 0;
            particle.x = mouseX;
            particle.y = mouseY;
            particle.vx = (Math.random() - 0.5) * 4;
            particle.vy = (Math.random() - 0.5) * 4;
            
            // Set initial styles
            particle.element.style.opacity = '1';
            particle.element.style.transform = `translate(${particle.x}px, ${particle.y}px)`;
            particle.element.style.backgroundColor = getRandomColor();
        }
        
        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsla(${hue}, 100%, 70%, 0.8)`;
        }
        
        function updateParticles() {
            particlePool.forEach(particle => {
                if (!particle.active) return;
                
                particle.age++;
                particle.x += particle.vx;
                particle.y += particle.vy;
                
                // Apply gravity
                particle.vy += 0.05;
                
                // Fade out based on age
                const opacity = 1 - (particle.age / 50);
                
                if (opacity <= 0) {
                    // Deactivate
                    particle.active = false;
                    particle.element.style.opacity = '0';
                } else {
                    // Update styles
                    particle.element.style.opacity = opacity.toString();
                    particle.element.style.transform = `translate(${particle.x}px, ${particle.y}px) scale(${opacity})`;
                }
            });
        }
        
        function update() {
            // Smooth follower movement with easing
            followerX += (mouseX - followerX) * 0.1;
            followerY += (mouseY - followerY) * 0.1;
            
            // Dot follows more closely
            dotX += (mouseX - dotX) * 0.3;
            dotY += (mouseY - dotY) * 0.3;
            
            // Apply positions
            follower.style.transform = `translate(${followerX}px, ${followerY}px)`;
            dot.style.transform = `translate(${dotX}px, ${dotY}px)`;
            
            // Update particles
            updateParticles();
            
            requestAnimationFrame(update);
        }
        
        update();
    </script>
</body>
</html>
