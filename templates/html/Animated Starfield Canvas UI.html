    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Stars</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black m-0 p-0 overflow-hidden">
    <div class="relative h-screen w-screen flex items-center justify-center">
        <!-- Canvas Background -->
        <div class="absolute inset-0 bg-gradient-to-br from-gray-900 to-black"></div>
        
        <!-- Stars Container -->
        <div class="relative w-full h-full">
            <!-- Star 1 -->
            <div class="absolute animate-pulse opacity-70" style="top: 40%; left: 30%; transform: rotate(15deg);">
                <svg width="100" height="100" viewBox="0 0 100 100">
                    <path d="M50,10 L61,40 L93,40 L67,60 L78,90 L50,70 L22,90 L33,60 L7,40 L39,40 Z" 
                          class="fill-none stroke-[#9e91bc] stroke-2" 
                          style="animation: dash 4s linear infinite;">
                    </path>
                </svg>
            </div>
            
            <!-- Star 2 -->
            <div class="absolute animate-pulse opacity-60" style="top: 35%; left: 45%; transform: rotate(-10deg);">
                <svg width="140" height="140" viewBox="0 0 100 100">
                    <path d="M50,10 L61,40 L93,40 L67,60 L78,90 L50,70 L22,90 L33,60 L7,40 L39,40 Z" 
                          class="fill-none stroke-[#4a4e7c] stroke-2"
                          style="animation: dash 3s linear infinite;">
                    </path>
                </svg>
            </div>
            
            <!-- Star 3 -->
            <div class="absolute animate-pulse opacity-80" style="top: 50%; left: 55%; transform: rotate(25deg);">
                <svg width="120" height="120" viewBox="0 0 100 100">
                    <path d="M50,10 L61,40 L93,40 L67,60 L78,90 L50,70 L22,90 L33,60 L7,40 L39,40 Z" 
                          class="fill-none stroke-[#6f7db7] stroke-2"
                          style="animation: dash 5s linear infinite;">
                    </path>
                </svg>
            </div>
            
            <!-- More Stars -->
            <div class="absolute animate-pulse opacity-50" style="top: 25%; left: 65%; transform: rotate(-5deg);">
                <svg width="90" height="90" viewBox="0 0 100 100">
                    <path d="M50,10 L61,40 L93,40 L67,60 L78,90 L50,70 L22,90 L33,60 L7,40 L39,40 Z" 
                          class="fill-none stroke-[#9e91bc] stroke-2"
                          style="animation: dash 4.5s linear infinite;">
                    </path>
                </svg>
            </div>
            
            <div class="absolute animate-pulse opacity-40" style="top: 60%; left: 25%; transform: rotate(15deg);">
                <svg width="110" height="110" viewBox="0 0 100 100">
                    <path d="M50,10 L61,40 L93,40 L67,60 L78,90 L50,70 L22,90 L33,60 L7,40 L39,40 Z" 
                          class="fill-none stroke-[#6f7db7] stroke-2"
                          style="animation: dash 3.5s linear infinite;">
                    </path>
                </svg>
            </div>
        </div>
        
        <!-- Glitch Effect Overlay -->
        <div class="absolute inset-0 bg-blue-900/5 mix-blend-overlay pointer-events-none"></div>
    </div>

    <style>
        @keyframes dash {
            to {
                stroke-dashoffset: 1000;
            }
        }
        
        svg path {
            stroke-dasharray: 500;
            stroke-dashoffset: 0;
        }
    </style>
</body>
</html>
