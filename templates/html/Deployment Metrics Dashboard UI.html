  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deployment Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Manrope', sans-serif;
    }
    .pie-segment {
      --percentage: 0;
      --rotation: 0;
      position: absolute;
      width: 100%;
      height: 100%;
      clip-path: polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%, 50% 0%);
      transform: rotate(calc(var(--rotation) * 1deg));
      transition: filter 0.2s ease;
    }
    .pie-segment::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: conic-gradient(from 0deg, currentColor var(--percentage), transparent 0);
    }
    .pie-segment:hover {
      filter: brightness(1.1) saturate(1.1);
      cursor: pointer;
    }
    .legend-item:hover .legend-dot {
      transform: scale(1.2);
    }
    .legend-item {
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .legend-item:hover {
      background-color: #f9fafb;
    }
    .legend-dot {
      transition: transform 0.2s ease;
    }
  </style>
</head>
<body class="bg-[#fafafa] min-h-screen flex items-center justify-center p-6">
  <div class="max-w-md w-full bg-white rounded-xl shadow-[0_4px_24px_rgba(0,0,0,0.05)] p-8">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl font-bold text-gray-900">Deployment Analytics</h2>
      <div class="text-xs font-medium px-2 py-1 bg-blue-50 text-blue-600 rounded-full">Last 30 days</div>
    </div>
    
    <div class="flex items-start justify-between mb-8">
      <div class="space-y-1">
        <p class="text-xs font-medium text-gray-500">Total Deployments</p>
        <p class="text-2xl font-semibold text-gray-900">1,248</p>
        <p class="text-xs text-green-500 flex items-center">
          <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
          </svg>
          12.5% from last month
        </p>
      </div>
      <div class="space-y-1 text-right">
        <p class="text-xs font-medium text-gray-500">Average Build Time</p>
        <p class="text-2xl font-semibold text-gray-900">38s</p>
        <p class="text-xs text-green-500 flex items-center justify-end">
          <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
          </svg>
          8.3% faster
        </p>
      </div>
    </div>
    
    <!-- Pie Chart Container -->
    <div class="relative w-44 h-44 mx-auto mb-8 group">
      <!-- Pie Segments -->
      <div class="pie-segment text-[#0070f3]" style="--percentage: 45%; --rotation: 0" 
           onmouseover="highlightSegment('production')" onmouseout="resetHighlight()"></div>
      <div class="pie-segment text-[#7928ca]" style="--percentage: 25%; --rotation: 162" 
           onmouseover="highlightSegment('preview')" onmouseout="resetHighlight()"></div>
      <div class="pie-segment text-[#50e3c2]" style="--percentage: 20%; --rotation: 252" 
           onmouseover="highlightSegment('development')" onmouseout="resetHighlight()"></div>
      <div class="pie-segment text-[#f5a623]" style="--percentage: 10%; --rotation: 324" 
           onmouseover="highlightSegment('testing')" onmouseout="resetHighlight()"></div>
      
      <!-- Inner Circle for Donut Effect -->
      <div class="absolute inset-0 m-auto w-28 h-28 bg-white rounded-full flex items-center justify-center">
        <div class="text-center">
          <span class="block text-2xl font-bold text-gray-900">94.2%</span>
          <span class="text-xs text-gray-500">Success Rate</span>
        </div>
      </div>
    </div>
    
    <!-- Legend -->
    <div class="grid grid-cols-2 gap-y-4 gap-x-6">
      <div id="production" class="flex items-center p-2 rounded-lg legend-item" 
           onmouseover="highlightSegment('production')" onmouseout="resetHighlight()">
        <div class="w-2.5 h-2.5 rounded-full bg-[#0070f3] mr-2 legend-dot"></div>
        <div>
          <p class="text-sm font-medium text-gray-900">Production</p>
          <p class="text-xs text-gray-500">45% (563)</p>
        </div>
      </div>
      <div id="preview" class="flex items-center p-2 rounded-lg legend-item" 
           onmouseover="highlightSegment('preview')" onmouseout="resetHighlight()">
        <div class="w-2.5 h-2.5 rounded-full bg-[#7928ca] mr-2 legend-dot"></div>
        <div>
          <p class="text-sm font-medium text-gray-900">Preview</p>
          <p class="text-xs text-gray-500">25% (312)</p>
        </div>
      </div>
      <div id="development" class="flex items-center p-2 rounded-lg legend-item" 
           onmouseover="highlightSegment('development')" onmouseout="resetHighlight()">
        <div class="w-2.5 h-2.5 rounded-full bg-[#50e3c2] mr-2 legend-dot"></div>
        <div>
          <p class="text-sm font-medium text-gray-900">Development</p>
          <p class="text-xs text-gray-500">20% (249)</p>
        </div>
      </div>
      <div id="testing" class="flex items-center p-2 rounded-lg legend-item" 
           onmouseover="highlightSegment('testing')" onmouseout="resetHighlight()">
        <div class="w-2.5 h-2.5 rounded-full bg-[#f5a623] mr-2 legend-dot"></div>
        <div>
          <p class="text-sm font-medium text-gray-900">Testing</p>
          <p class="text-xs text-gray-500">10% (124)</p>
        </div>
      </div>
    </div>

    <div class="mt-8 pt-6 border-t border-gray-100">
      <div class="flex justify-between items-center">
        <span class="text-xs text-gray-500">Updated 5 minutes ago</span>
        <button class="text-xs font-medium text-[#0070f3] hover:underline">View detailed report →</button>
      </div>
    </div>
  </div>

  <script>
    function highlightSegment(id) {
      // Reset all items to default
      document.querySelectorAll('.legend-item').forEach(item => {
        item.classList.remove('bg-gray-50');
      });
      
      // Highlight the selected item
      document.getElementById(id).classList.add('bg-gray-50');
    }
    
    function resetHighlight() {
      document.querySelectorAll('.legend-item').forEach(item => {
        item.classList.remove('bg-gray-50');
      });
    }
  </script>
</body>
</html>
