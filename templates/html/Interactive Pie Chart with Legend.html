  <meta charset="UTF-8">
  <title>Pie Chart Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Manrope:400,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 flex items-center justify-center min-h-screen">
  <div class="max-w-xs mx-auto bg-neutral-900 border border-neutral-800 rounded-2xl shadow-2xl p-6 font-manrope">
    <h2 class="text-lg font-semibold text-neutral-100 mb-2">Sales Breakdown</h2>
    <p class="text-sm text-neutral-400 mb-6">June 2024</p>
    <!-- Pie Chart -->
    <div class="flex justify-center items-center mb-8">
      <svg width="150" height="150" viewBox="0 0 40 40">
        <!-- 1st segment: 40% -->
        <circle r="16" cx="20" cy="20" fill="transparent" stroke="#FF3B30" stroke-width="8"
          stroke-dasharray="40 60" stroke-dashoffset="0" />
        <!-- 2nd segment: 28% -->
        <circle r="16" cx="20" cy="20" fill="transparent" stroke="#34C759" stroke-width="8"
          stroke-dasharray="28 72" stroke-dashoffset="-40" />
        <!-- 3rd segment: 22% -->
        <circle r="16" cx="20" cy="20" fill="transparent" stroke="#00C7BE" stroke-width="8"
          stroke-dasharray="22 78" stroke-dashoffset="-68" />
        <!-- 4th segment: 10% -->
        <circle r="16" cx="20" cy="20" fill="transparent" stroke="#FFC800" stroke-width="8"
          stroke-dasharray="10 90" stroke-dashoffset="-90" />
      </svg>
    </div>
    <!-- Legend -->
    <div class="flex flex-col gap-3 mt-3">
      <div class="flex items-center gap-2">
        <span class="block w-3 h-3 rounded-full" style="background:#FF3B30"></span>
        <span class="text-sm text-neutral-100">Product A</span>
        <span class="ml-auto text-sm text-neutral-400">40%</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="block w-3 h-3 rounded-full" style="background:#34C759"></span>
        <span class="text-sm text-neutral-100">Product B</span>
        <span class="ml-auto text-sm text-neutral-400">28%</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="block w-3 h-3 rounded-full" style="background:#00C7BE"></span>
        <span class="text-sm text-neutral-100">Product C</span>
        <span class="ml-auto text-sm text-neutral-400">22%</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="block w-3 h-3 rounded-full" style="background:#FFC800"></span>
        <span class="text-sm text-neutral-100">Product D</span>
        <span class="ml-auto text-sm text-neutral-400">10%</span>
      </div>
    </div>
  </div>
  <style>
    .font-manrope { font-family: 'Manrope', sans-serif; }
  </style>
</body>
</html>
