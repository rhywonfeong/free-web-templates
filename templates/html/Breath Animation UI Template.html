<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Breath Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
<style>
:root {
/* Refined palette for a more modern, fluid look */
--blob-base: #a2d9ff;
--blob-accent-1: #c77dff;
--blob-accent-2: #ff9aa2;
--blob-accent-3: #81f5ff;
--cycle-duration: 6s; /* Total cycle time for perfect sync */
}
/*
Improved Morphing Shape
More organic movement
*/
@keyframes morphShape {
0%   { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: rotate(0deg); }
33%  { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
66%  { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: rotate(360deg); }
}
@keyframes spinColor {
0% { filter: hue-rotate(0deg) blur(12px); }
100% { filter: hue-rotate(360deg) blur(12px); }
}
/*
Improved Breathing Scale
Uses a custom bezier to mimic natural lung expansion/contraction
0-50%: Inhale (Expand)
50-100%: Exhale (Contract)
*/
@keyframes breatheScale {
0% { transform: scale(0.85); }
50% { transform: scale(1.35); }
100% { transform: scale(0.85); }
}
@keyframes breatheGlow {
0% { opacity: 0.3; transform: scale(0.8); }
50% { opacity: 0.7; transform: scale(1.5); }
100% { opacity: 0.3; transform: scale(0.8); }
}
@keyframes floatUp {
0% { transform: translateY(100vh) scale(0); opacity: 0; }
50% { opacity: 0.4; }
100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}
@keyframes textFadeSlide {
0% { opacity: 0; transform: translateY(10px); letter-spacing: 0.2em; }
20% { opacity: 1; transform: translateY(0); letter-spacing: 0.25em; }
80% { opacity: 1; transform: translateY(0); letter-spacing: 0.25em; }
100% { opacity: 0; transform: translateY(-10px); letter-spacing: 0.3em; }
}
/* Layer Styles */
.blob-glow {
background: radial-gradient(circle, var(--blob-accent-3), transparent 70%);
animation: breatheGlow var(--cycle-duration) infinite ease-in-out;
}
.blob-liquid {
background: conic-gradient(from 180deg, var(--blob-base), var(--blob-accent-1), var(--blob-accent-2), var(--blob-accent-3), var(--blob-base));
filter: blur(12px);
/* Combined animations for fluid effect */
animation:
morphShape 12s linear infinite,
spinColor 8s linear infinite,
breatheScale var(--cycle-duration) infinite ease-in-out;
}
.blob-surface {
box-shadow:
inset 10px 10px 20px rgba(255, 255, 255, 0.7),
inset -5px -10px 20px rgba(255, 255, 255, 0.2),
inset -2px -2px 5px rgba(0, 0, 0, 0.05);
mix-blend-mode: overlay;
animation:
morphShape 12s linear infinite,
breatheScale var(--cycle-duration) infinite ease-in-out;
}
.particle {
background: rgba(162, 217, 255, 0.4);
border-radius: 50%;
animation: floatUp 15s linear infinite;
}
/* Text Animation Class */
.text-anim-enter {
animation: textFadeSlide 3s ease-in-out forwards;
}
</style></head>
<body class="bg-[radial-gradient(circle_at_center,_#f8f9fa_0%,_#e6e9ef_100%)] min-h-screen flex flex-col items-center justify-center overflow-hidden font-['Montserrat'] m-0 p-0 text-gray-600 selection:bg-purple-200">

    <!-- Background Ambience -->
    <div id="particles" class="absolute inset-0 w-full h-full pointer-events-none z-0 overflow-hidden"></div>

    <!-- The Liquid Component -->
    <div class="relative w-[240px] h-[240px] flex justify-center items-center z-10 mb-8">
        <!-- Layer A: The Deep Glow -->
        <div class="blob-glow opacity-50 w-[120%] h-[120%] absolute"></div>
        
        <!-- Layer B: The Fluid Color -->
        <div class="blob-liquid absolute w-[200px] h-[200px] opacity-90 rounded-[40%_60%_70%_30%/40%_50%_60%_50%]"></div>
        
        <!-- Layer C: The Glass Surface -->
        <div class="blob-surface absolute w-[200px] h-[200px] z-20 rounded-[40%_60%_70%_30%/40%_50%_60%_50%]"></div>
    </div>

    <!-- UI Text -->
    <div class="z-10 text-center relative h-16 w-full flex flex-col items-center justify-center">
        <!-- Primary Instruction -->
        <div id="main-text" class="uppercase text-3xl font-semibold text-slate-500/90 tracking-[0.25em] font-['Poppins'] absolute transition-all duration-500">
            Inhale
        </div>
    </div>

    <!-- Subtitle / Status -->
    <div class="z-10 mt-8">
        <p class="text-xs font-medium tracking-widest text-slate-400 uppercase opacity-60">
            System Calibrating
        </p>
    </div>

    <script>
        // --- 1. PARTICLE GENERATOR ---
        const particleContainer = document.getElementById('particles');
        const particleCount = 20;

        for(let i=0; i < particleCount; i++) {
            const p = document.createElement('div');
            p.classList.add('particle', 'absolute');
            p.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 4 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.animationDuration = (Math.random() * 10 + 15) + 's'; // Slower, more floaty
            p.style.animationDelay = '-' + (Math.random() * 10) + 's'; // Start immediately at random positions
            p.style.opacity = Math.random() * 0.5;
            particleContainer.appendChild(p);
        }

        // --- 2. BREATH SYNC ENGINE ---
        const mainText = document.getElementById('main-text');
        
        // Cycle Duration in ms (Must match CSS --cycle-duration)
        // 6000ms = 6 seconds total cycle
        // 3000ms Inhale (Expansion), 3000ms Exhale (Contraction)
        const CYCLE_DURATION = 6000; 

        function runBreathCycle() {
            // Phase 1: Inhale (0ms)
            mainText.innerText = "Inhale";
            mainText.style.opacity = '1';
            mainText.style.transform = 'scale(1.1)';
            
            // Phase 2: Exhale (Starts at 50% of cycle)
            setTimeout(() => {
                mainText.innerText = "Exhale";
                mainText.style.transform = 'scale(0.9)';
            }, CYCLE_DURATION / 2);
        }

        // Initial Run
        runBreathCycle();

        // Loop
        setInterval(runBreathCycle, CYCLE_DURATION);

    </script>

</body>
</html>
