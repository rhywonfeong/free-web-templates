                    <div class="w-3 h-4 bg-emerald-400 rounded-full animate-pulse delay-75 shadow-[0_0_15px_rgba(52,211,153,0.8)]"></div>
                    <div class="w-3 h-4 bg-blue-400 rounded-full animate-pulse delay-150 shadow-[0_0_15px_rgba(96,165,250,0.8)]"></div>
                    <div class="w-3 h-4 bg-rose-400 rounded-full animate-pulse delay-300 shadow-[0_0_15px_rgba(251,113,133,0.8)]"></div>
                </div>
            </div>

            <div class="flex-1 w-full flex flex-col items-center justify-center px-8 text-center relative">
                <!-- Date Display -->
                <div class="flex gap-4 mb-12">
                    <div class="bg-amber-50 w-24 h-32 rounded-xl shadow-2xl flex items-center justify-center border-b-4 border-amber-200 transform -rotate-6">
                        <span id="digit-1" class="serif-font text-6xl text-emerald-900 font-medium">0</span>
                    </div>
                    <div class="bg-amber-50 w-24 h-32 rounded-xl shadow-2xl flex items-center justify-center border-b-4 border-amber-200 transform rotate-6">
                        <span id="digit-2" class="serif-font text-6xl text-emerald-900 font-medium">1</span>
                    </div>
                </div>

                <!-- Text Content -->
                <h2 class="serif-font text-3xl text-amber-50 mb-4 tracking-tight">
                    Your Beauty Surprise
                </h2>
                
                <p id="surprise-text" class="text-rose-100 text-lg leading-relaxed font-light mb-8 max-w-[280px]">
                    Get ready for a glow up! Unlock an exclusive 20% discount on all Luxe Lipsticks today.
                </p>

                <!-- Tree decoration -->
                <div class="absolute bottom-24 left-[-40px] opacity-20 rotate-12">
                     <svg class="text-emerald-900 w-48 h-64" viewBox="0 0 100 100" fill="currentColor">
                        <path d="M50 0 L90 80 H10 L50 0 Z"></path>
                    </svg>
                </div>
                <!-- Snowflakes -->
                <div class="absolute top-1/4 right-8 text-white/30">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="snowflake" class="lucide lucide-snowflake w-6 h-6"><path d="m10 20-1.25-2.5L6 18"></path><path d="M10 4 8.75 6.5 6 6"></path><path d="m14 20 1.25-2.5L18 18"></path><path d="m14 4 1.25 2.5L18 6"></path><path d="m17 21-3-6h-4"></path><path d="m17 3-3 6 1.5 3"></path><path d="M2 12h6.5L10 9"></path><path d="m20 10-1.5 2 1.5 2"></path><path d="M22 12h-6.5L14 15"></path><path d="m4 10 1.5 2L4 14"></path><path d="m7 21 3-6-1.5-3"></path><path d="m7 3 3 6h4"></path></svg>
                </div>
                <div class="absolute bottom-1/3 left-8 text-white/20">
                     <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="snowflake" class="lucide lucide-snowflake w-8 h-8"><path d="m10 20-1.25-2.5L6 18"></path><path d="M10 4 8.75 6.5 6 6"></path><path d="m14 20 1.25-2.5L18 18"></path><path d="m14 4 1.25 2.5L18 6"></path><path d="m17 21-3-6h-4"></path><path d="m17 3-3 6 1.5 3"></path><path d="M2 12h6.5L10 9"></path><path d="m20 10-1.5 2 1.5 2"></path><path d="M22 12h-6.5L14 15"></path><path d="m4 10 1.5 2L4 14"></path><path d="m7 21 3-6-1.5-3"></path><path d="m7 3 3 6h4"></path></svg>
                </div>

                <!-- Action Button -->
                <button onclick="closeDay()" class="relative z-10 flex items-center gap-2 bg-amber-50 text-rose-700 px-6 py-3 rounded-full shadow-lg font-medium hover:scale-105 active:scale-95 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-left" class="lucide lucide-arrow-left w-5 h-5"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
                    Back to Calendar
                </button>
            </div>
        </div>

    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Surprises Data
        const surprises = [
            "20% off Luxe Lipsticks",
            "Free Sheet Mask with Order",
            "Buy 1 Get 1 on Nail Enamels",
            "Exclusive: Kay Beauty Preview",
            "500 Bonus Reward Points"
        ];

        // Functions to handle view switching
        function openDay(dayNumber) {
            const calendarView = document.getElementById('calendar-view');
            const revealView = document.getElementById('reveal-view');
            
            // Format Number
            const dayString = dayNumber.toString().padStart(2, '0');
            document.getElementById('digit-1').textContent = dayString[0];
            document.getElementById('digit-2').textContent = dayString[1];
            
            // Randomize text for demo
            const randomText = surprises[Math.floor(Math.random() * surprises.length)];
            document.getElementById('surprise-text').textContent = `Day ${dayNumber} Surprise: ${randomText}. Valid for 24 hours only on the Nykaa App.`;

            // Animation
            revealView.classList.remove('pointer-events-none', 'opacity-0', 'translate-y-full');
            revealView.classList.add('opacity-100', 'translate-y-0');
        }

        function closeDay() {
            const revealView = document.getElementById('reveal-view');
            
            // Animation reverse
            revealView.classList.remove('opacity-100', 'translate-y-0');
            revealView.classList.add('pointer-events-none', 'opacity-0', 'translate-y-full');
        }
    </script>

</body></html>
