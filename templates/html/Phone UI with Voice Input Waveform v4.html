<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Voice Assistant – Phone Mock</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:'Inter',sans-serif}</style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=IBM+Plex+Serif:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@300;400;500;600;700&amp;family=Inter&amp;display=swap" rel="stylesheet">
</head>
<body class="selection:bg-teal-500/40 flex items-center justify-center min-h-screen text-neutral-900 font-[Inter] bg-neutral-100">
  <!-- Phone Frame -->
  <div class="relative w-[280px] sm:w-[320px] md:w-[360px] aspect-[9/19.5] bg-black rounded-[40px] shadow-2xl ring-1 ring-neutral-300">
    <!-- Notch -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-24 h-5 bg-black rounded-b-[14px]"></div>

    <!-- Side Buttons (decorative) -->
    <div class="hidden sm:block absolute -left-1 top-20 w-0.5 h-16 bg-neutral-500/50 rounded"></div>
    <div class="hidden sm:block absolute -right-1 top-32 w-0.5 h-10 bg-neutral-500/50 rounded"></div>

    <!-- Screen -->
    <div class="absolute inset-[12px] bg-neutral-50 rounded-[28px] flex flex-col overflow-hidden">
      <div class="flex-1 flex items-center justify-center px-4">
        <!-- Card -->
        <div class="relative w-full max-w-xs sm:max-w-sm rounded-3xl bg-gradient-to-b from-white via-neutral-50 to-neutral-100 shadow-xl ring-1 ring-neutral-200 overflow-hidden p-6">
          <!-- Chat Bubble -->
          <div class="bg-neutral-100/80 backdrop-blur rounded-xl p-4 ring-1 ring-neutral-200">
            <p class="text-lg sm:text-2xl font-semibold tracking-tight leading-snug">
              What’s the weather
              like today?
            </p>
          </div>

          <!-- Waveform -->
          <div id="wave" class="flex items-end justify-center gap-[2px] mt-12 h-24"><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(20, 184, 166), rgb(14, 165, 233)); height: 20%; transform: scaleY(0.663195);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(6, 182, 212), rgb(99, 102, 241)); height: 20%; transform: scaleY(0.944737);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(14, 165, 233), rgb(234, 179, 8)); height: 20%; transform: scaleY(0.945853);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(99, 102, 241), rgb(249, 115, 22)); height: 20%; transform: scaleY(0.422626);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(234, 179, 8), rgb(20, 184, 166)); height: 20%; transform: scaleY(0.919408);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(249, 115, 22), rgb(6, 182, 212)); height: 20%; transform: scaleY(0.719269);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(20, 184, 166), rgb(14, 165, 233)); height: 20%; transform: scaleY(0.796197);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(6, 182, 212), rgb(99, 102, 241)); height: 20%; transform: scaleY(0.305803);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(14, 165, 233), rgb(234, 179, 8)); height: 20%; transform: scaleY(0.96887);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(99, 102, 241), rgb(249, 115, 22)); height: 20%; transform: scaleY(0.574351);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(234, 179, 8), rgb(20, 184, 166)); height: 20%; transform: scaleY(0.589829);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(249, 115, 22), rgb(6, 182, 212)); height: 20%; transform: scaleY(0.871722);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(20, 184, 166), rgb(14, 165, 233)); height: 20%; transform: scaleY(0.472085);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(6, 182, 212), rgb(99, 102, 241)); height: 20%; transform: scaleY(0.314632);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(14, 165, 233), rgb(234, 179, 8)); height: 20%; transform: scaleY(0.741252);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(99, 102, 241), rgb(249, 115, 22)); height: 20%; transform: scaleY(0.806599);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(234, 179, 8), rgb(20, 184, 166)); height: 20%; transform: scaleY(0.612089);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(249, 115, 22), rgb(6, 182, 212)); height: 20%; transform: scaleY(0.998988);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(20, 184, 166), rgb(14, 165, 233)); height: 20%; transform: scaleY(0.213714);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(6, 182, 212), rgb(99, 102, 241)); height: 20%; transform: scaleY(0.242607);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(14, 165, 233), rgb(234, 179, 8)); height: 20%; transform: scaleY(0.210309);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(99, 102, 241), rgb(249, 115, 22)); height: 20%; transform: scaleY(0.354688);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(234, 179, 8), rgb(20, 184, 166)); height: 20%; transform: scaleY(0.718448);"></div><div class="w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out" style="background: linear-gradient(to top, rgb(249, 115, 22), rgb(6, 182, 212)); height: 20%; transform: scaleY(0.917898);"></div></div>

          <!-- Mic Button -->
          <button id="micBtn" aria-label="Toggle voice input" class="relative block mx-auto mt-12 w-28 h-28 rounded-full bg-gradient-to-b from-teal-500 to-teal-600 flex items-center justify-center shadow-lg active:scale-95 transition focus:outline-none focus:ring-4 focus:ring-teal-400/50">
            <span class="absolute inset-0 rounded-full bg-teal-500/30 animate-ping"></span>
            <span class="absolute inset-0 m-2 rounded-full bg-teal-500/20 animate-ping [animation-delay:.6s]"></span>
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="mic" class="lucide lucide-mic w-10 h-10 text-white relative z-10"><path d="M12 19v3"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><rect x="9" y="2" width="6" height="13" rx="3"></rect></svg>
          </button>
        </div>
      </div>
      <!-- Home Indicator -->
      <div class="h-5 flex items-center justify-center">
        <div class="w-24 h-1.5 bg-neutral-300 rounded-full"></div>
      </div>
    </div>
  </div>

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => lucide.createIcons());

    const waveContainer = document.getElementById('wave');
    const barCount = 24;
    const colors = ['#14b8a6','#06b6d4','#0ea5e9','#6366f1','#eab308','#f97316'];
    for (let i = 0; i < barCount; i++) {
      const bar = document.createElement('div');
      bar.className='w-[3px] origin-bottom rounded-full transition-transform duration-[250ms] ease-in-out';
      bar.style.background=`linear-gradient(to top,${colors[i%colors.length]},${colors[(i+2)%colors.length]})`;
      bar.style.height='20%';
      waveContainer.appendChild(bar);
    }
    let playing=true;
    const animateBars=()=>{if(!playing)return;waveContainer.childNodes.forEach(bar=>{bar.style.transform=`scaleY(${0.2+Math.random()*0.8})`;});};
    setInterval(animateBars,200);
    document.getElementById('micBtn').addEventListener('click',()=>{playing=!playing;if(!playing){waveContainer.childNodes.forEach(bar=>{bar.style.transform='scaleY(0.2)';});}});
  </script>

</body></html>
