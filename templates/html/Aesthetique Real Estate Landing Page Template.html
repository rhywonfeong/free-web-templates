@import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap');
body {
font-family: 'Inter', sans-serif;

color: #ffffff;
overflow: hidden;

/* Abstract Globe Texture Animation */
@keyframes rotateGlobe {
0% { background-position: 0% center; }
100% { background-position: 200% center; }
}
.globe-texture {
background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/World_map_-_low_resolution.svg/2560px-World_map_-_low_resolution.svg.png');
background-size: 200% auto;
background-repeat: repeat-x;
opacity: 0.3;
animation: rotateGlobe 60s linear infinite;
filter: invert(1) brightness(2);
}
/* Globe Sphere Shading */
.globe-sphere {
background: radial-gradient(circle at 30% 30%, rgba(56, 189, 248, 0.1), rgba(0, 0, 0, 1) 70%);
box-shadow: inset -20px -20px 50px rgba(0,0,0,0.9),
inset 10px 10px 30px rgba(255,255,255,0.05),
0 0 50px rgba(56, 189, 248, 0.05);
}
/* Transitions */
.zoom-transition {
transition: transform 1.5s cubic-bezier(0.65, 0, 0.35, 1), opacity 1s ease-in-out;
}
.fade-transition {
transition: opacity 1.2s ease-in-out, transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}
/* Custom UI Elements */
.glass-panel {
background: rgba(255, 255, 255, 0.03);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255, 255, 255, 0.08);
}
.pin-pulse {
animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
}
@keyframes pulse-ring {
0% { transform: scale(0.33); opacity: 1; }
80%, 100% { transform: scale(2); opacity: 0; }
}
/* Clean Scrollbar for lists if needed */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    <script>
        const exploreBtn = document.getElementById('explore-btn');
        const backBtn = document.getElementById('back-btn');
        const mainInterface = document.getElementById('main-interface');
        const globeContainer = document.getElementById('globe-container');
        const searchContainer = document.getElementById('search-container');
        const mapLayer = document.getElementById('map-layer');

        exploreBtn.addEventListener('click', () => {
            // 1. Zoom Globe Effect
            mainInterface.classList.add('scale-[3]', 'opacity-0');
            mainInterface.classList.add('pointer-events-none');
            
            // 2. Hide Search immediately so it doesn't zoom weirdly
            searchContainer.style.opacity = '0';

            // 3. Show Map after short delay
            setTimeout(() => {
                mapLayer.classList.remove('opacity-0', 'pointer-events-none', 'scale-105');
                mapLayer.classList.add('opacity-100', 'pointer-events-auto', 'scale-100');
            }, 800);
        });

        backBtn.addEventListener('click', () => {
            // 1. Hide Map
            mapLayer.classList.remove('opacity-100', 'pointer-events-auto', 'scale-100');
            mapLayer.classList.add('opacity-0', 'pointer-events-none', 'scale-105');

            // 2. Reset Main Interface
            setTimeout(() => {
                mainInterface.classList.remove('scale-[3]', 'opacity-0');
                mainInterface.classList.remove('pointer-events-none');
                searchContainer.style.opacity = '1';
            }, 300);
        });
    </script>
