<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check N Take - Promo Video</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}
/* Video Timeline Keyframes (15s Total) */
@keyframes bgSequence {
0%, 20% { background-color: #0f172a; } /* Scene 1: Dark/Confusion */
23%, 40% { background-color: #f8fafc; } /* Scene 2: Bright Transition */
43%, 60% { background-color: #ecfdf5; } /* Scene 3: Green/Success */
63%, 80% { background-color: #eff6ff; } /* Scene 4: Blue/Trust */
83%, 100% { background-color: #ffffff; } /* Scene 5: Clean/Logo */
}
@keyframes scene1 {
0%, 5% { opacity: 0; transform: scale(0.95); }
10%, 18% { opacity: 1; transform: scale(1); }
22%, 100% { opacity: 0; transform: scale(1.05); visibility: hidden; }
}
@keyframes scene2 {
0%, 18% { opacity: 0; transform: translateY(20px); visibility: hidden; }
22%, 38% { opacity: 1; transform: translateY(0); visibility: visible; }
42%, 100% { opacity: 0; transform: translateY(-20px); visibility: hidden; }
}
@keyframes scene3 {
0%, 38% { opacity: 0; transform: scale(0.8); visibility: hidden; }
42%, 58% { opacity: 1; transform: scale(1); visibility: visible; }
62%, 100% { opacity: 0; transform: scale(1.2); visibility: hidden; }
}
@keyframes scene4 {
0%, 58% { opacity: 0; transform: translateY(20px); visibility: hidden; }
62%, 78% { opacity: 1; transform: translateY(0); visibility: visible; }
82%, 100% { opacity: 0; transform: translateY(-20px); visibility: hidden; }
}
@keyframes scene5 {
0%, 78% { opacity: 0; transform: scale(0.95); visibility: hidden; }
82%, 100% { opacity: 1; transform: scale(1); visibility: visible; }
}
@keyframes scanline {
0% { transform: translateX(-100%); }
100% { transform: translateX(100%); }
}
@keyframes float {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(-10px); }
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 sm:p-8 selection:bg-emerald-100 selection:text-emerald-900">

    <!-- Soft Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <!-- 9:16 Video Container -->
    <div class="relative w-full max-w-[320px] aspect-[9/16] rounded-[2rem] shadow-2xl ring-8 ring-slate-900 overflow-hidden bg-slate-900 flex items-center justify-center group">
        
        <!-- Background Animation Layer -->
        <div class="scene-anim absolute inset-0 w-full h-full" style="animation: bgSequence 15s ease-in-out forwards paused;"></div>

        <!-- Play Overlay (To initialize Audio & Animations due to browser policies) -->
        <div id="playOverlay" class="absolute inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center text-white cursor-pointer transition-opacity duration-500" onclick="startVideo()">
            <div class="w-16 h-16 rounded-full bg-white/10 flex items-center justify-center mb-4 border border-white/20 group-hover:scale-110 group-hover:bg-white/20 transition-all duration-300">
                <iconify-icon icon="solar:play-bold" class="text-2xl ml-1" style="stroke-width: 1.5;"></iconify-icon>
            </div>
            <span class="text-sm font-medium tracking-wide text-slate-200">Tap to Play Video</span>
        </div>

        <!-- Scene 1: Confusion (0s - 3s) -->
        <div class="scene-anim absolute inset-0 flex flex-col items-center justify-center p-8 text-center opacity-0" style="animation: scene1 15s ease-in-out forwards paused;">
            <div class="relative w-32 h-32 mb-6" style="animation: float 4s ease-in-out infinite;">
                <iconify-icon icon="solar:user-speak-linear" class="text-6xl text-slate-400 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2" style="stroke-width: 1.5;"></iconify-icon>
                <iconify-icon icon="solar:question-square-linear" class="text-3xl text-slate-500 absolute top-0 right-0 -rotate-12" style="stroke-width: 1.5;"></iconify-icon>
                <iconify-icon icon="solar:box-linear" class="text-4xl text-slate-600 absolute bottom-0 left-0 rotate-12" style="stroke-width: 1.5;"></iconify-icon>
                <iconify-icon icon="solar:tag-linear" class="text-2xl text-slate-500 absolute bottom-4 right-2 rotate-45" style="stroke-width: 1.5;"></iconify-icon>
            </div>
            <h2 class="text-2xl tracking-tight font-semibold text-slate-200 mb-2">Too many choices?</h2>
            <p class="text-sm text-slate-400">Hard to know what to trust online.</p>
        </div>

        <!-- Scene 2: Check N Take Platform (3s - 6s) -->
        <div class="scene-anim absolute inset-0 flex flex-col items-center justify-center p-8 opacity-0" style="animation: scene2 15s ease-in-out forwards paused;">
            <div class="w-full bg-white rounded-2xl shadow-xl border border-slate-100 p-5 mb-6 relative overflow-hidden">
                <!-- Scanning Effect -->
                <div class="absolute inset-0 w-1/2 bg-gradient-to-r from-transparent via-blue-50/50 to-transparent" style="animation: scanline 2s linear infinite;"></div>
                
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center">
                        <iconify-icon icon="solar:magnifer-linear" class="text-blue-600 text-lg" style="stroke-width: 1.5;"></iconify-icon>
                    </div>
                    <div>
                        <div class="w-24 h-2 bg-slate-100 rounded-full mb-2"></div>
                        <div class="w-16 h-2 bg-slate-100 rounded-full"></div>
                    </div>
                </div>
                <div class="flex gap-1 text-emerald-400 mb-3">
                    <iconify-icon icon="solar:star-bold" class="text-base"></iconify-icon>
                    <iconify-icon icon="solar:star-bold" class="text-base"></iconify-icon>
                    <iconify-icon icon="solar:star-bold" class="text-base"></iconify-icon>
                    <iconify-icon icon="solar:star-bold" class="text-base"></iconify-icon>
                    <iconify-icon icon="solar:star-bold" class="text-base text-slate-200"></iconify-icon>
                </div>
                <div class="w-full h-8 bg-slate-50 rounded-lg flex items-center px-3 gap-2">
                    <iconify-icon icon="solar:shield-check-linear" class="text-emerald-500 text-sm" style="stroke-width: 1.5;"></iconify-icon>
                    <span class="text-xs font-medium text-slate-500">Analyzing reviews...</span>
                </div>
            </div>
        </div>

        <!-- Scene 3: Verification Success (6s - 9s) -->
        <div class="scene-anim absolute inset-0 flex flex-col items-center justify-center text-center opacity-0" style="animation: scene3 15s ease-in-out forwards paused;">
            <div class="relative flex items-center justify-center mb-6">
                <!-- Pulsing Background Rings -->
                <div class="absolute w-24 h-24 bg-emerald-200/50 rounded-full" style="animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;"></div>
                <div class="absolute w-32 h-32 border border-emerald-200 rounded-full" style="animation: ping 2.5s cubic-bezier(0, 0, 0.2, 1) infinite delay-75;"></div>
                
                <!-- Main Check -->
                <div class="relative w-20 h-20 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/30">
                    <iconify-icon icon="solar:check-linear" class="text-white text-4xl" style="stroke-width: 2;"></iconify-icon>
                </div>
            </div>
            <h2 class="text-2xl tracking-tight font-semibold text-emerald-950 mb-1">100% Verified</h2>
            <p class="text-sm text-emerald-700/80 font-medium">Safe to purchase</p>
        </div>

        <!-- Scene 4: Customer Receiving Product (9s - 12s) -->
        <div class="scene-anim absolute inset-0 flex flex-col items-center justify-center text-center opacity-0" style="animation: scene4 15s ease-in-out forwards paused;">
            <div class="relative w-28 h-28 mb-4 flex items-center justify-center" style="animation: float 3s ease-in-out infinite;">
                <!-- Glowing Box Base -->
                <div class="absolute inset-0 bg-blue-200/40 rounded-full blur-xl"></div>
                
                <iconify-icon icon="solar:box-minimalistic-linear" class="text-6xl text-blue-600 relative z-10" style="stroke-width: 1.5;"></iconify-icon>
                
                <!-- Floating Smiley -->
                <div class="absolute -top-2 -right-2 w-10 h-10 bg-white rounded-full shadow-md flex items-center justify-center border border-slate-50 z-20">
                    <iconify-icon icon="solar:emoji-funny-circle-linear" class="text-2xl text-amber-400" style="stroke-width: 1.5;"></iconify-icon>
                </div>
            </div>
            <h2 class="text-2xl tracking-tight font-semibold text-blue-950 mb-1">Buy with Confidence</h2>
            <p class="text-sm text-blue-700/80 font-medium">Exactly what you expect.</p>
        </div>

        <!-- Scene 5: Logo & Tagline (12s - 15s) -->
        <div class="scene-anim absolute inset-0 flex flex-col items-center justify-center text-center bg-white opacity-0 p-8" style="animation: scene5 15s ease-in-out forwards paused;">
            
            <!-- Logo Lockup -->
            <div class="flex items-center justify-center gap-3 group cursor-default mb-6">
                <!-- Visual Mark -->
                <div class="relative flex items-center justify-center w-10 h-10">
                    <div class="absolute top-1 left-1/2 -translate-x-1/2 w-4 h-3 border-2 border-blue-600 rounded-t-full border-b-0"></div>
                    <div class="absolute bottom-1 w-8 h-6 border-2 border-blue-600 rounded-md bg-white"></div>
                    <div class="absolute -right-2 -bottom-1 w-6 h-6 bg-emerald-500 rounded-full flex items-center justify-center border-[2px] border-white z-10">
                        <iconify-icon icon="solar:check-linear" class="text-white text-sm" style="stroke-width: 1.5;"></iconify-icon>
                    </div>
                </div>
                <!-- Typographic Mark -->
                <div class="flex items-baseline gap-1 text-2xl tracking-tighter font-semibold text-slate-900">
                    <span>Check</span>
                    <span class="text-blue-600">N</span>
                    <span>Take</span>
                </div>
            </div>

            <!-- Tagline -->
            <h3 class="text-lg tracking-tight font-medium text-slate-800 mb-8">
                Check First,<br><span class="text-blue-600">Take Smart.</span>
            </h3>

            <!-- Mock CTA -->
            <button class="w-full py-3 px-6 bg-slate-900 hover:bg-slate-800 transition-colors rounded-full text-white text-sm font-medium tracking-wide">
                Start Checking
            </button>
        </div>

    </div>

    <!-- Script to handle Audio/Video start -->
    <script>
        function startVideo() {
            // Hide Overlay
            const overlay = document.getElementById('playOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);

            // Play Music
            const audio = document.getElementById('bgMusic');
            audio.volume = 0.2; // Soft background music
            audio.play().catch(e => console.log("Audio play blocked by browser."));

            // Start CSS Animations
            const animatedElements = document.querySelectorAll('.scene-anim');
            animatedElements.forEach(el => {
                el.style.animationPlayState = 'running';
            });
        }
    </script>
</body>
</html>
