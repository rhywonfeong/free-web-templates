<div class="max-w-md mx-auto bg-gray-900 border border-gray-800 rounded-lg overflow-hidden">
  <!-- Header -->
  <div class="p-4 border-b border-gray-800">
    <div class="flex justify-between items-center">
      <h2 class="text-base font-medium text-white">AI Model Analytics</h2>
      <span class="text-xs font-medium text-gray-400">Last 30 days</span>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="grid grid-cols-3 divide-x divide-gray-800">
    <div class="p-4 text-center">
      <p class="text-xs text-gray-400">Requests</p>
      <p class="mt-1 text-xl font-medium text-white">124.5k</p>
      <div class="mt-1 flex justify-center items-center text-xs text-green-400">
        <svg class="w-3 h-3 mr-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
        </svg>
        <span>12.5%</span>
      </div>
    </div>
    <div class="p-4 text-center">
      <p class="text-xs text-gray-400">Response</p>
      <p class="mt-1 text-xl font-medium text-white">187ms</p>
      <div class="mt-1 flex justify-center items-center text-xs text-red-400">
        <svg class="w-3 h-3 mr-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
        </svg>
        <span>3.2%</span>
      </div>
    </div>
    <div class="p-4 text-center">
      <p class="text-xs text-gray-400">Success</p>
      <p class="mt-1 text-xl font-medium text-white">99.8%</p>
      <div class="mt-1 flex justify-center items-center text-xs text-green-400">
        <svg class="w-3 h-3 mr-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
        </svg>
        <span>0.3%</span>
      </div>
    </div>
  </div>

  <!-- Chart -->
  <div class="px-4 py-3">
    <div class="h-40 bg-gray-900 rounded flex items-end space-x-1">
      <div class="w-1/7 h-[30%] bg-blue-500 bg-opacity-20 border-t border-blue-500 rounded-sm"></div>
      <div class="w-1/7 h-[45%] bg-blue-500 bg-opacity-20 border-t border-blue-500 rounded-sm"></div>
      <div class="w-1/7 h-[60%] bg-blue-500 bg-opacity-20 border-t border-blue-500 rounded-sm"></div>
      <div class="w-1/7 h-[75%] bg-blue-500 bg-opacity-20 border-t border-blue-500 rounded-sm"></div>
      <div class="w-1/7 h-[65%] bg-blue-500 bg-opacity-20 border-t border-blue-500 rounded-sm"></div>
      <div class="w-1/7 h-[80%] bg-blue-500 bg-opacity-20 border-t border-blue-500 rounded-sm"></div>
      <div class="w-1/7 h-[90%] bg-blue-500 bg-opacity-20 border-t border-blue-500 rounded-sm"></div>
    </div>
    <div class="mt-2 flex justify-between text-xs text-gray-500">
      <span>Mon</span>
      <span>Tue</span>
      <span>Wed</span>
      <span>Thu</span>
      <span>Fri</span>
      <span>Sat</span>
      <span>Sun</span>
    </div>
  </div>

  <!-- Model Usage -->
  <div class="p-4 border-t border-gray-800">
    <h3 class="text-xs font-medium text-gray-400 mb-3">MODEL USAGE</h3>
    
    <!-- GPT-4 -->
    <div class="mb-3">
      <div class="flex justify-between items-center mb-1">
        <span class="text-xs text-gray-300">GPT-4</span>
        <span class="text-xs text-gray-300">64.2%</span>
      </div>
      <div class="w-full h-1.5 bg-gray-800 rounded-full overflow-hidden">
        <div class="h-full bg-blue-500 rounded-full" style="width: 64.2%"></div>
      </div>
    </div>
    
    <!-- Claude -->
    <div class="mb-3">
      <div class="flex justify-between items-center mb-1">
        <span class="text-xs text-gray-300">Claude</span>
        <span class="text-xs text-gray-300">27.5%</span>
      </div>
      <div class="w-full h-1.5 bg-gray-800 rounded-full overflow-hidden">
        <div class="h-full bg-purple-500 rounded-full" style="width: 27.5%"></div>
      </div>
    </div>
    
    <!-- Other Models -->
    <div>
      <div class="flex justify-between items-center mb-1">
        <span class="text-xs text-gray-300">Other Models</span>
        <span class="text-xs text-gray-300">8.3%</span>
      </div>
      <div class="w-full h-1.5 bg-gray-800 rounded-full overflow-hidden">
        <div class="h-full bg-gray-500 rounded-full" style="width: 8.3%"></div>
      </div>
    </div>
  </div>
  
  <!-- Footer -->
  <div class="px-4 py-3 bg-gray-950 border-t border-gray-800 flex justify-between items-center">
    <span class="text-xs text-gray-500">Updated 5m ago</span>
    <button class="text-xs text-blue-400 hover:text-blue-300">View details →</button>
  </div>
</div>
