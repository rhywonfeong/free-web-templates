<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Dashboard UI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Vazirmatn', 'Inter', sans-serif;
background-color: #000000;
}
/* Custom Scrollbar for notes if needed */
.no-scrollbar::-webkit-scrollbar {
display: none;
}
.no-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
/* Subtle glow for the clock */
.clock-glow {
text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
}
</style></head>
<body class="text-neutral-300 h-screen w-full overflow-hidden flex flex-col relative selection:bg-neutral-800">

    <!-- Ambient Background Gradients -->
    <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-neutral-900/40 to-transparent pointer-events-none z-0"></div>
    <div class="absolute bottom-0 right-0 w-64 h-64 bg-blue-900/10 rounded-full blur-3xl pointer-events-none z-0"></div>

    <!-- Main Content Wrapper -->
    <main class="relative z-10 flex flex-col h-full max-w-md mx-auto w-full px-6 pt-6 pb-28 justify-between">
        
        <!-- Top Status Bar -->
        <header class="flex justify-between items-center text-xs font-medium text-neutral-500 tracking-wide">
            <div class="flex items-center gap-2">
                <span class="iconify" data-icon="lucide:cloud-moon" data-width="16"></span>
                <span>۱۲°C تهران</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="iconify" data-icon="lucide:wifi" data-width="16"></span>
                <span class="iconify" data-icon="lucide:battery-medium" data-width="16"></span>
            </div>
        </header>

        <!-- Center Clock -->
        <section class="flex flex-col items-center justify-center flex-grow -mt-10">
            <div class="flex items-baseline text-white clock-glow">
                <span class="text-8xl font-light tracking-tighter tabular-nums leading-none">۲۲</span>
                <span class="text-8xl font-thin tracking-tighter opacity-50 animate-pulse pb-4">:</span>
                <span class="text-8xl font-light tracking-tighter tabular-nums leading-none">۴۸</span>
            </div>
            <p class="mt-4 text-neutral-500 text-lg font-normal tracking-wide">پنج‌شنبه، ۲۴ آبان</p>
        </section>

        <!-- Maintenance Notes (Card Style) -->
        <section class="mb-8">
            <div class="bg-neutral-900/50 border border-neutral-800/60 backdrop-blur-sm rounded-2xl p-5 shadow-2xl shadow-black/50">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-medium text-neutral-200 flex items-center gap-2">
                        <span class="iconify text-emerald-500" data-icon="lucide:wrench" data-width="14"></span>
                        سرویس‌های دوره‌ای
                    </h3>
                    <button class="text-xs text-neutral-500 hover:text-white transition-colors">افزودن</button>
                </div>
                
                <div class="space-y-3">
                    <!-- Note Item 1 -->
                    <label class="group flex items-center gap-3 cursor-pointer">
                        <div class="relative w-5 h-5 rounded-md border border-neutral-700 bg-neutral-800 group-hover:border-neutral-500 transition-colors flex items-center justify-center">
                            <!-- Custom check simulation -->
                            <input type="checkbox" class="peer appearance-none w-full h-full absolute inset-0 cursor-pointer">
                            <span class="iconify text-neutral-900 opacity-0 peer-checked:opacity-100 transition-opacity z-10 bg-white rounded-[3px]" data-icon="lucide:check" data-width="14"></span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-sm text-neutral-300 font-normal">تعویض روغن موتور</span>
                            <span class="text-xs text-neutral-600">۱۵۰۰ کیلومتر باقی‌مانده</span>
                        </div>
                    </label>

                    <!-- Note Item 2 -->
                    <label class="group flex items-center gap-3 cursor-pointer">
                        <div class="relative w-5 h-5 rounded-md border border-neutral-700 bg-neutral-800 group-hover:border-neutral-500 transition-colors flex items-center justify-center">
                            <input type="checkbox" checked class="peer appearance-none w-full h-full absolute inset-0 cursor-pointer">
                            <span class="iconify text-black opacity-0 peer-checked:opacity-100 transition-opacity z-10 bg-emerald-400 rounded-[3px]" data-icon="lucide:check" data-width="14"></span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-sm text-neutral-500 line-through decoration-neutral-600">فیلتر هوا</span>
                            <span class="text-xs text-emerald-500/60">انجام شد</span>
                        </div>
                    </label>
                </div>
            </div>
        </section>

        <!-- Main Action Grid (Navigation, Notifications, Music, Calls) -->
        <section class="grid grid-cols-4 gap-4 mb-4">
            <!-- Navigation -->
            <button class="aspect-square rounded-2xl bg-neutral-900/80 border border-neutral-800 hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95 flex flex-col items-center justify-center gap-2 group shadow-lg">
                <span class="iconify text-blue-400 group-hover:text-blue-300 transition-colors" data-icon="lucide:navigation" data-width="26" data-stroke-width="1.5"></span>
                <span class="text-[10px] text-neutral-500 group-hover:text-neutral-300">مسیریابی</span>
            </button>

            <!-- Notifications -->
            <button class="aspect-square rounded-2xl bg-neutral-900/80 border border-neutral-800 hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95 flex flex-col items-center justify-center gap-2 group shadow-lg relative">
                <div class="absolute top-3 right-3 w-2 h-2 bg-red-500 rounded-full shadow-[0_0_8px_rgba(239,68,68,0.6)]"></div>
                <span class="iconify text-neutral-300 group-hover:text-white transition-colors" data-icon="lucide:bell" data-width="26" data-stroke-width="1.5"></span>
                <span class="text-[10px] text-neutral-500 group-hover:text-neutral-300">اعلان‌ها</span>
            </button>

            <!-- Music (Quick Access) -->
            <button class="aspect-square rounded-2xl bg-neutral-900/80 border border-neutral-800 hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95 flex flex-col items-center justify-center gap-2 group shadow-lg">
                <span class="iconify text-purple-400 group-hover:text-purple-300 transition-colors" data-icon="lucide:music" data-width="26" data-stroke-width="1.5"></span>
                <span class="text-[10px] text-neutral-500 group-hover:text-neutral-300">موسیقی</span>
            </button>

            <!-- Calls -->
            <button class="aspect-square rounded-2xl bg-neutral-900/80 border border-neutral-800 hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95 flex flex-col items-center justify-center gap-2 group shadow-lg">
                <span class="iconify text-emerald-400 group-hover:text-emerald-300 transition-colors" data-icon="lucide:phone" data-width="26" data-stroke-width="1.5"></span>
                <span class="text-[10px] text-neutral-500 group-hover:text-neutral-300">تماس‌ها</span>
            </button>
        </section>

    </main>

    <!-- Bottom Floating Music Player -->
    <div class="fixed bottom-0 left-0 w-full z-50">
        <!-- Progress Bar (Slim) -->
        <div class="h-[2px] w-full bg-neutral-900">
            <div class="h-full bg-white w-1/3 shadow-[0_0_10px_rgba(255,255,255,0.5)]"></div>
        </div>
        
        <!-- Player Body -->
        <div class="bg-black/80 backdrop-blur-xl border-t border-white/5 p-4 pb-6 flex items-center justify-between gap-4">
            
            <!-- Album Art & Info -->
            <div class="flex items-center gap-3 flex-1 min-w-0">
                <div class="w-12 h-12 rounded-lg bg-neutral-800 border border-neutral-700/50 flex items-center justify-center overflow-hidden flex-shrink-0 relative group">
                     <!-- Abstract Cover Art Placeholder -->
                    <div class="absolute inset-0 bg-gradient-to-tr from-purple-900 to-blue-900 opacity-80"></div>
                    <span class="iconify text-white/50 relative z-10" data-icon="lucide:music" data-width="20"></span>
                </div>
                <div class="flex flex-col truncate">
                    <span class="text-sm font-medium text-white truncate tracking-tight">شب‌های روشن</span>
                    <span class="text-xs text-neutral-500 truncate mt-0.5">هایده</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center gap-5 pr-2">
                <button class="text-neutral-400 hover:text-white transition-colors active:scale-90">
                    <span class="iconify" data-icon="lucide:skip-forward" data-width="22" data-stroke-width="1.5"></span>
                </button>
                
                <button class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:bg-neutral-200 transition-colors active:scale-95 shadow-[0_0_15px_rgba(255,255,255,0.15)]">
                    <span class="iconify ml-0.5" data-icon="lucide:play" data-width="20" data-stroke-width="1.5" fill="currentColor"></span>
                </button>
                
                <button class="text-neutral-400 hover:text-white transition-colors active:scale-90">
                    <span class="iconify" data-icon="lucide:skip-back" data-width="22" data-stroke-width="1.5"></span>
                </button>
            </div>
        </div>
    </div>

</body>
</html>
