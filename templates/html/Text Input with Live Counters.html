  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Counter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen flex items-center justify-center p-4">
  <div class="w-80 bg-zinc-900 rounded-lg shadow-xl overflow-hidden border border-zinc-800">
    <!-- Header -->
    <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
      <h3 class="text-sm font-medium">Character Counter</h3>
      <button class="text-zinc-400 hover:text-zinc-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    
    <!-- Content -->
    <div class="p-4">
      <div class="mb-3">
        <label for="text-input" class="block text-xs text-zinc-400 mb-1">Enter your text</label>
        <textarea id="text-input" rows="5" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="Start typing here..."></textarea>
      </div>
      
      <!-- Stats Grid -->
      <div class="grid grid-cols-2 gap-2 mb-4">
        <div class="bg-zinc-800/50 p-3 rounded-md">
          <div class="text-[10px] text-zinc-400 mb-1">Characters</div>
          <div class="flex justify-between items-end">
            <span id="char-count" class="text-lg font-medium">0</span>
            <span class="text-xs text-zinc-500">/ <span id="char-limit">280</span></span>
          </div>
          <div class="mt-2 h-1.5 bg-zinc-700 rounded-full overflow-hidden">
            <div id="char-progress" class="h-full bg-indigo-500 rounded-full" style="width: 0%"></div>
          </div>
        </div>
        
        <div class="bg-zinc-800/50 p-3 rounded-md">
          <div class="text-[10px] text-zinc-400 mb-1">Words</div>
          <div class="flex justify-between items-end">
            <span id="word-count" class="text-lg font-medium">0</span>
            <span class="text-xs text-zinc-500">/ <span id="word-limit">50</span></span>
          </div>
          <div class="mt-2 h-1.5 bg-zinc-700 rounded-full overflow-hidden">
            <div id="word-progress" class="h-full bg-indigo-500 rounded-full" style="width: 0%"></div>
          </div>
        </div>
      </div>
      
      <!-- Additional Stats -->
      <div class="grid grid-cols-3 gap-2 mb-4">
        <div class="bg-zinc-800/30 p-2 rounded-md">
          <div class="text-[10px] text-zinc-400 mb-1">Paragraphs</div>
          <div id="paragraph-count" class="text-xs font-medium">0</div>
        </div>
        
        <div class="bg-zinc-800/30 p-2 rounded-md">
          <div class="text-[10px] text-zinc-400 mb-1">Sentences</div>
          <div id="sentence-count" class="text-xs font-medium">0</div>
        </div>
        
        <div class="bg-zinc-800/30 p-2 rounded-md">
          <div class="text-[10px] text-zinc-400 mb-1">Read time</div>
          <div id="read-time" class="text-xs font-medium">0 sec</div>
        </div>
      </div>
      
      <!-- Settings -->
      <div class="mb-4">
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs text-zinc-400">Character limit</label>
          <input type="number" id="char-limit-input" class="w-16 bg-zinc-800 border border-zinc-700 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500" value="280">
        </div>
        
        <div class="flex justify-between items-center">
          <label class="text-xs text-zinc-400">Word limit</label>
          <input type="number" id="word-limit-input" class="w-16 bg-zinc-800 border border-zinc-700 rounded px-2 py-1 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500" value="50">
        </div>
      </div>
      
      <button id="copy-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded text-xs font-medium transition-colors">Copy Text</button>
    </div>
    
    <!-- Footer -->
    <div class="p-3 border-t border-zinc-800 flex justify-between items-center">
      <button id="clear-btn" class="text-xs text-zinc-400 hover:text-zinc-300">Clear</button>
      <button id="save-btn" class="text-xs text-indigo-400 hover:text-indigo-300">Save as Draft</button>
    </div>
  </div>

  <script>
    const textInput = document.getElementById('text-input');
    const charCount = document.getElementById('char-count');
    const wordCount = document.getElementById('word-count');
    const paragraphCount = document.getElementById('paragraph-count');
    const sentenceCount = document.getElementById('sentence-count');
    const readTime = document.getElementById('read-time');
    const charProgress = document.getElementById('char-progress');
    const wordProgress = document.getElementById('word-progress');
    const charLimitDisplay = document.getElementById('char-limit');
    const wordLimitDisplay = document.getElementById('word-limit');
    const charLimitInput = document.getElementById('char-limit-input');
    const wordLimitInput = document.getElementById('word-limit-input');
    const clearBtn = document.getElementById('clear-btn');
    const copyBtn = document.getElementById('copy-btn');
    
    function updateCounts() {
      const text = textInput.value;
      const chars = text.length;
      const words = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
      const paragraphs = text.trim() === '' ? 0 : text.trim().split(/
+/).filter(p => p.trim() !== '').length;
      const sentences = text.trim() === '' ? 0 : text.split(/[.!?]+/).filter(s => s.trim() !== '').length;
      const minutes = Math.ceil(words / 200); // Average reading speed
      
      const charLimit = parseInt(charLimitDisplay.textContent);
      const wordLimit = parseInt(wordLimitDisplay.textContent);
      
      charCount.textContent = chars;
      wordCount.textContent = words;
      paragraphCount.textContent = paragraphs;
      sentenceCount.textContent = sentences;
      readTime.textContent = minutes < 1 ? `${Math.ceil(words / (200/60))} sec` : `${minutes} min`;
      
      // Update progress bars
      const charPercentage = Math.min(100, (chars / charLimit) * 100);
      const wordPercentage = Math.min(100, (words / wordLimit) * 100);
      
      charProgress.style.width = `${charPercentage}%`;
      wordProgress.style.width = `${wordPercentage}%`;
      
      // Change color when approaching limit
      if (charPercentage >= 90) {
        charProgress.classList.remove('bg-indigo-500');
        charProgress.classList.add('bg-amber-500');
      } else {
        charProgress.classList.remove('bg-amber-500');
        charProgress.classList.add('bg-indigo-500');
      }
      
      if (wordPercentage >= 90) {
        wordProgress.classList.remove('bg-indigo-500');
        wordProgress.classList.add('bg-amber-500');
      } else {
        wordProgress.classList.remove('bg-amber-500');
        wordProgress.classList.add('bg-indigo-500');
      }
      
      // Change to red when exceeding limit
      if (chars > charLimit || words > wordLimit) {
        if (chars > charLimit) {
          charProgress.classList.remove('bg-amber-500', 'bg-indigo-500');
          charProgress.classList.add('bg-red-500');
        }
        
        if (words > wordLimit) {
          wordProgress.classList.remove('bg-amber-500', 'bg-indigo-500');
          wordProgress.classList.add('bg-red-500');
        }
      }
    }
    
    textInput.addEventListener('input', updateCounts);
    
    charLimitInput.addEventListener('change', function() {
      charLimitDisplay.textContent = this.value;
      updateCounts();
    });
    
    wordLimitInput.addEventListener('change', function() {
      wordLimitDisplay.textContent = this.value;
      updateCounts();
    });
    
    clearBtn.addEventListener('click', function() {
      textInput.value = '';
      updateCounts();
    });
    
    copyBtn.addEventListener('click', function() {
      textInput.select();
      document.execCommand('copy');
      
      this.textContent = 'Copied!';
      setTimeout(() => {
        this.textContent = 'Copy Text';
      }, 2000);
    });
    
    // Initialize
    updateCounts();
  </script>
</body>
</html>
