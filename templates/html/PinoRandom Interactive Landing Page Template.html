<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pino random</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-neutral-950 text-white min-h-screen flex flex-col relative antialiased selection:bg-purple-500/30">
    
    <!-- Background Effects -->
    <div class="fixed inset-0 z-0 pointer-events-none flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff05_1px,transparent_1px),linear-gradient(to_bottom,#ffffff05_1px,transparent_1px)] bg-[size:4rem_4rem]"></div>
        <div class="absolute w-[40rem] h-[40rem] rounded-full bg-purple-600/10 blur-[100px] mix-blend-screen"></div>
        <div class="absolute w-[30rem] h-[30rem] rounded-full bg-pink-600/5 blur-[80px] mix-blend-screen translate-x-1/2 translate-y-1/4"></div>
    </div>

    <!-- Header / Logo -->
    <header class="relative z-10 w-full p-8 flex justify-center sm:justify-start">
        <div class="text-base font-semibold tracking-tighter text-white uppercase flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-purple-500 shadow-[0_0_10px_rgba(168,85,247,0.8)]"></span>
            PINORANDOM
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center w-full max-w-4xl mx-auto px-6 pb-20">
        
        <!-- Center Button -->
        <div class="relative group mt-10">
            <div class="absolute -inset-4 rounded-full bg-gradient-to-r from-purple-600 to-pink-600 opacity-40 blur-2xl group-hover:opacity-70 group-hover:scale-110 transition-all duration-700"></div>
            <div class="absolute -inset-1 rounded-full bg-gradient-to-b from-purple-400 to-pink-500 opacity-50 blur-md group-hover:opacity-80 transition-all duration-500"></div>
            
            <button id="goBtn" class="relative w-40 h-40 rounded-full bg-gradient-to-b from-purple-600 to-neutral-900 border border-purple-400/50 flex flex-col items-center justify-center shadow-2xl hover:scale-105 active:scale-95 transition-all duration-300">
                <span class="text-5xl font-semibold tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-white to-pink-200 drop-shadow-sm">!GO</span>
            </button>
        </div>

        <!-- Results Container -->
        <div id="results" class="mt-20 grid grid-cols-1 sm:grid-cols-2 gap-6 w-full max-w-2xl opacity-0 transition-opacity duration-500 min-h-[6rem]">
            <!-- Dynamically injected via JS -->
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const firstNames = ["Lilith", "Raven", "Crimson", "Onyx", "Luna", "Belladonna", "Scarlet", "Morgana", "Nyx", "Violet", "Ophelia", "Morticia", "Desdemona", "Lenore", "Carmilla", "Sabrina", "Vesper", "Ashe", "Ember", "Hazel", "Ivy", "Jade", "Winter", "Aurora", "Celeste"];
            const lastNames = ["Nightshade", "Blackwood", "Moon", "Dark", "Shadow", "Sangre", "Mortis", "Veil", "Gloom", "Obsidian", "Blood", "Graves", "Thorn", "Grimm", "Bane", "Crow", "Frost", "Dusk", "Ash", "Storm", "Vamp", "Haze", "Void", "Abyss"];
            
            const gothicNames = [];
            for(let first of firstNames) {
                for(let last of lastNames) {
                    gothicNames.push(`${first} ${last}`);
                }
            }

            const goBtn = document.getElementById('goBtn');
            const results = document.getElementById('results');

            goBtn.addEventListener('click', () => {
                // Fade out current results
                results.classList.remove('opacity-100');
                results.classList.add('opacity-0');

                // Wait for fade out, then update and fade in
                setTimeout(() => {
                    // Shuffle and pick 2 unique names
                    let shuffled = gothicNames.sort(() => 0.5 - Math.random());
                    let selected = shuffled.slice(0, 2);

                    // Render results
                    results.innerHTML = selected.map(name => `
                        <a href="javascript:void(0)" class="relative overflow-hidden rounded-2xl bg-neutral-900/80 backdrop-blur-sm border border-white/5 p-5 hover:border-purple-500/40 hover:bg-neutral-800/80 transition-all duration-300 group flex items-center gap-5 shadow-xl shadow-black/50 cursor-pointer">
                            <div class="absolute inset-0 bg-gradient-to-r from-purple-500/10 via-pink-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                            
                            <div class="relative w-14 h-14 rounded-full bg-neutral-950 border border-white/10 flex items-center justify-center text-purple-500 group-hover:text-pink-400 group-hover:scale-110 group-hover:border-purple-500/30 transition-all duration-300 shrink-0 shadow-inner shadow-black/50">
                                <iconify-icon icon="solar:user-circle-linear" class="text-3xl" style="stroke-width: 1.5;"></iconify-icon>
                            </div>
                            
                            <div class="flex flex-col z-10 w-full">
                                <span class="text-lg font-semibold tracking-tight text-white/90 group-hover:text-white transition-colors truncate">${name}</span>
                                <div class="flex items-center gap-1 mt-0.5">
                                    <span class="text-xs font-medium text-white/40 group-hover:text-pink-300/80 transition-colors uppercase tracking-widest">View Profile</span>
                                    <iconify-icon icon="solar:alt-arrow-right-linear" class="text-xs text-white/20 group-hover:text-pink-300/80 transition-colors group-hover:translate-x-1 duration-300"></iconify-icon>
                                </div>
                            </div>
                        </a>
                    `).join('');

                    // Fade in new results
                    results.classList.remove('opacity-0');
                    results.classList.add('opacity-100');
                }, 300);
            });
        });
    </script>
</body>
</html>
