                        data: market.chartData.map(d => d.volume),
                        backgroundColor: '#22c55e',
                        borderRadius: 2,
                        barPercentage: 0.7,
                        categoryPercentage: 0.7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: (ctx) => ` ${formatCompactNumber(ctx.parsed.y)}`
                            }
                        }
                    },
                    scales: {
                        x: { grid: { color: '#27272a' }, ticks: { color: '#a1a1aa', font: { size: 10 } } },
                        y: {
                            grid: { color: '#27272a' },
                            ticks: { color: '#a1a1aa', font: { size: 10 }, callback: (v) => formatCompactNumber(v) }
                        }
                    }
                }
            });
        }

        // Navigation
        function setActiveTab(tab) {
            const navBtns = document.querySelectorAll('.nav-btn');
            navBtns.forEach(btn => {
                if (btn.dataset.tab === tab) {
                    btn.classList.remove('text-slate-300');
                    btn.classList.add('text-green-400');
                } else {
                    btn.classList.remove('text-green-400');
                    btn.classList.add('text-slate-300');
                }
            });
        }

        // CSV parsing utilities
        function splitCSVLine(line) {
            const cells = [];
            let cur = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        cur += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (ch === ',' && !inQuotes) {
                    cells.push(cur);
                    cur = '';
                } else {
                    cur += ch;
                }
            }
            cells.push(cur);
            return cells;
        }

        function parseCSV(text) {
            const clean = text.replace(/^\uFEFF/, '');
            const lines = clean.split(/\r?\n/).filter(l => l.trim().length > 0);
            if (lines.length === 0) return { headers: [], rows: [] };
            const headers = splitCSVLine(lines[0]).map(h => h.trim());
            const rows = [];
            for (let i = 1; i < lines.length; i++) {
                const values = splitCSVLine(lines[i]).map(v => v.trim());
                if (values.length !== headers.length) continue;
                const obj = {};
                headers.forEach((h, idx) => obj[h] = values[idx]);
                rows.push(obj);
            }
            return { headers, rows };
        }

        // Generate league data from dataset
        async function generateLeagueData() {
            const loadingEl = document.getElementById('loading-leagues');
            const rowsEl = document.getElementById('league-rows');
            
            try {
                const url = 'https://raw.githubusercontent.com/ODUnike/simplifi-dataset/main/main%20dataset.csv';
                const res = await fetch(url, { cache: 'no-cache' });
                if (!res.ok) throw new Error('Failed to load dataset');
                const text = await res.text();
                const { rows } = parseCSV(text);

                // Group by League and calculate statistics
                const leagueStats = {};
                
                rows.forEach(row => {
                    const league = (row['League'] || row['league'] || '').trim();
                    if (!league) return;
                    
                    // Parse numeric values
                    const stake = parseFloat(row['Stake'] || row['stake'] || 0);
                    const odds = parseFloat(row['Odds'] || row['odds'] || 1);
                    
                    // Use overtwo column for win/loss (1 = win, 0 = loss)
                    const overtwoResult = (row['overtwo'] || row['Overtwo'] || '').trim();
                    
                    if (!leagueStats[league]) {
                        leagueStats[league] = {
                            games: 0,
                            wins: 0,
                            losses: 0,
                            totalStake: 0,
                            totalReturn: 0,
                            lastRow: null,
                            matches: []
                        };
                    }
                    
                    const stats = leagueStats[league];
                    stats.games++;
                    stats.totalStake += stake;
                    stats.lastRow = row;
                    stats.matches.push(row);
                    
                    // Calculate win/loss using overtwo column
                    if (overtwoResult === '1') {
                        stats.wins++;
                        stats.totalReturn += stake * (odds - 1);
                    } else if (overtwoResult === '0') {
                        stats.losses++;
                        stats.totalReturn -= stake;
                    }
                });

                // Convert to array and calculate derived metrics
                const leagueArray = Object.entries(leagueStats).map(([league, stats]) => {
                    const profit = stats.totalReturn;
                    const successRate = stats.games > 0 ? (stats.wins / stats.games * 100) : 0;
                    const profitPercent = stats.totalStake > 0 ? (profit / stats.totalStake * 100) : 0;
                    
                    // Market movement metrics
                    const movements = stats.matches
                        .map(m => parseFloat(
                            m['market_movement'] ||
                            m['market movement'] ||
                            m['Market Movement'] ||
                            m['Market movement'] ||
                            'NaN'
                        ))
                        .filter(v => Number.isFinite(v));
                    
                    const firstMovement = movements.length ? movements[0] : 0;
                    const lastMovement = movements.length ? movements[movements.length - 1] : 0;
                    const movementChangePercent = firstMovement !== 0 ? ((lastMovement - firstMovement) / Math.abs(firstMovement)) * 100 : 0;
                    const trend = movementChangePercent >= 0 ? 'up' : 'down';
                    
                    return {
                        league,
                        games: stats.games,
                        wins: stats.wins,
                        losses: stats.losses,
                        successRate,
                        profit,
                        profitPercent,
                        lastMovement,
                        movementChangePercent,
                        trend
                    };
                });

                // Sort by profit (kept as-is to minimize changes)
                leagueArray.sort((a, b) => b.profit - a.profit);

                // Generate HTML for each league
                const html = leagueArray.map(league => {
                    const trendIcon = league.trend === 'up' ? 'trending-up' : 'trending-down';
                    const trendColor = league.trend === 'up' ? 'text-green-400' : 'text-red-400';

                    const lastMovementFormatted = Number(league.lastMovement || 0).toLocaleString('en-US', {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    });
                    const movementPercentFormatted = `${league.movementChangePercent >= 0 ? '+' : ''}${league.movementChangePercent.toFixed(2)}%`;

                    return `
                        <div class="px-4 py-3 flex items-center justify-between hover:bg-neutral-900/40 transition-colors" data-league="${league.league}">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center space-x-2">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" data-lucide="${trendIcon}" class="lucide lucide-${trendIcon} h-4 w-4 ${trendColor}">
                                        ${trendIcon === 'trending-up' ? 
                                            '<path d="M16 7h6v6"></path><path d="m22 7-8.5 8.5-5-5L2 17"></path>' :
                                            '<path d="M16 17h6v-6"></path><path d="m22 17-8.5-8.5-5 5L2 7"></path>'
                                        }
                                    </svg>
                                    <span class="text-sm font-medium text-white truncate">${formatLeagueName(league.league)}</span>
                                </div>
                                <div class="mt-1 text-xs text-gray-400">
                                    <span class="mr-3">Games: <span class="text-slate-300 font-medium">${league.games.toLocaleString()}</span></span>
                                    <span class="mr-3">W: <span class="text-slate-300 font-medium">${league.wins.toLocaleString()}</span></span>
                                    <span class="mr-3">L: <span class="text-slate-300 font-medium">${league.losses.toLocaleString()}</span></span>
                                    <span class="mr-3">Success: <span class="text-slate-300 font-medium">${league.successRate.toFixed(2)}%</span></span>
                                </div>
                            </div>
                            <div class="text-right ml-4">
                                <div class="text-sm font-semibold text-white">${lastMovementFormatted}</div>
                                <div class="text-sm font-semibold ${trendColor}">${movementPercentFormatted}</div>
                                <div class="text-xs ${trendColor}">Season change</div>
                            </div>
                        </div>
                    `;
                }).join('');

                // Update DOM
                loadingEl.classList.add('hidden');
                rowsEl.innerHTML = html;
                rowsEl.classList.remove('hidden');
                
                // Reinitialize lucide icons
                lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });

                // Update Top Gainer with most profitable by last movement
                injectMostProfitableUnderTopGainer(1);
                
            } catch (error) {
                console.error('Error loading league data:', error);
                loadingEl.innerHTML = `
                    <div class="text-center py-8">
                        <div class="text-red-400 text-sm mb-2">Failed to load league data</div>
                        <div class="text-slate-500 text-xs">${error.message}</div>
                    </div>
                `;
            }
        }

        // Update dataset-driven stats: Total Volume (row count) and Active Leagues (unique League)
        async function updateTotalVolumeFromDataset() {
            const totalEl = document.getElementById('total-volume-value');
            const leaguesEl = document.getElementById('active-leagues-value');
            try {
                const url = 'https://raw.githubusercontent.com/ODUnike/simplifi-dataset/main/main%20dataset.csv';
                const res = await fetch(url, { cache: 'no-cache' });
                if (!res.ok) throw new Error('Failed to load dataset');
                const text = await res.text();
                const { rows } = parseCSV(text);

                // Total Volume: total number of rows (games)
                const count = rows.length;
                totalEl.textContent = count.toLocaleString('en-GB');

                // Active Leagues: unique League values
                const leagues = new Set();
                for (const r of rows) {
                    const v = (r['League'] ?? r['league'] ?? '').trim();
                    if (v) leagues.add(v);
                }
                if (leaguesEl) leaguesEl.textContent = leagues.size.toLocaleString('en-GB');
            } catch (e) {
                console.error(e);
                // keep placeholders if failed
            }
        }

        // Update Top Gainer card with the most profitable by last movement:
        // - Shows value as main figure
        // - Shows league name as subline
        function injectMostProfitableUnderTopGainer(limit = 1) {
            try {
                const panel = document.getElementById('capital-panel');
                if (!panel) return;

                const rows = panel.querySelectorAll('.divide-y > div');
                const items = [];
                rows.forEach(row => {
                    const amountEl = row.querySelector('.text-right .text-sm.font-semibold');
                    if (!amountEl) return;
                    const amountNum = parseFloat(amountEl.textContent.replace(/[^-0-9.]/g, ''));
                    if (!Number.isFinite(amountNum)) return;

                    // Prefer raw league from data attribute; fallback to text
                    const rawLeague = (row.dataset.league || '').trim();
                    let name = rawLeague;
                    if (!name) {
                        const nameEl = row.querySelector('span.text-sm.font-medium');
                        name = nameEl ? nameEl.textContent.trim() : '';
                    }
                    if (!name) return;

                    items.push({ name, amount: amountNum });
                });

                if (items.length === 0) return;

                // Sort by highest last movement
                items.sort((a, b) => b.amount - a.amount);
                const top = items.slice(0, Math.max(1, limit));
                const topItem = top[0];

                // Find the Top Gainer card
                const tgCard = Array.from(document.querySelectorAll('.bg-gradient-to-br')).find(card => {
                    const label = card.querySelector('.text-slate-300.text-xs');
                    return label && label.textContent.trim().toLowerCase() === 'top gainer';
                });
                if (!tgCard) return;

                const valueEl = tgCard.querySelector('.text-white.font-semibold.text-lg');
                if (!valueEl) return;

                // Set the main value (with sign and 2 decimals)
                const formattedValue = `${topItem.amount >= 0 ? '+' : ''}${Math.abs(topItem.amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                valueEl.textContent = formattedValue;

                // Update the subline to show league name in neutral color
                let subEl = tgCard.querySelector('.text-xs.font-medium:not(.text-slate-300)');
                if (!subEl) {
                    subEl = document.createElement('div');
                    subEl.className = 'text-xs font-medium mt-1';
                    valueEl.insertAdjacentElement('afterend', subEl);
                }
                subEl.textContent = topItem.name;
                subEl.classList.remove('text-green-400', 'text-red-400');
                subEl.classList.add('text-slate-300');

            } catch (e) {
                console.error(e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateTotalVolumeFromDataset();
            generateLeagueData(); // Generate dynamic league rows
            injectMostProfitableUnderTopGainer(1);
            lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
        });
    </script>
</body></html>
