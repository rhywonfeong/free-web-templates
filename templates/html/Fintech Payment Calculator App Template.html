                        <button type="button" id="btn-inst-3" onclick="selectInstallment(3)" class="inst-btn flex items-center justify-center py-4 lg:py-3.5 rounded-2xl border border-white/5 bg-[#16161A] text-neutral-300 text-sm font-medium transition-all active:scale-95">3x</button>
                        <button type="button" id="btn-inst-4" onclick="selectInstallment(4)" class="inst-btn flex items-center justify-center py-4 lg:py-3.5 rounded-2xl border border-white/5 bg-[#16161A] text-neutral-300 text-sm font-medium transition-all active:scale-95">4x</button>
                        <button type="button" id="btn-inst-5" onclick="selectInstallment(5)" class="inst-btn flex items-center justify-center py-4 lg:py-3.5 rounded-2xl border border-white/5 bg-[#16161A] text-neutral-300 text-sm font-medium transition-all active:scale-95">5x</button>

                        <button type="button" id="btn-inst-7" onclick="selectInstallment(7)" class="inst-btn flex items-center justify-center py-4 lg:py-3.5 rounded-2xl border border-white/5 bg-[#16161A] text-neutral-300 text-sm font-medium transition-all active:scale-95">7x</button>
                        <button type="button" id="btn-inst-8" onclick="selectInstallment(8)" class="inst-btn flex items-center justify-center py-4 lg:py-3.5 rounded-2xl border border-white/5 bg-[#16161A] text-neutral-300 text-sm font-medium transition-all active:scale-95">8x</button>
                        <button type="button" id="btn-inst-9" onclick="selectInstallment(9)" class="inst-btn flex items-center justify-center py-4 lg:py-3.5 rounded-2xl border border-white/5 bg-[#16161A] text-neutral-300 text-sm font-medium transition-all active:scale-95">9x</button>
                        <button type="button" id="btn-inst-10" onclick="selectInstallment(10)" class="inst-btn flex items-center justify-center py-4 lg:py-3.5 rounded-2xl border border-white/5 bg-[#16161A] text-neutral-300 text-sm font-medium transition-all active:scale-95">10x</button>
                        <button type="button" id="btn-inst-11" onclick="selectInstallment(11)" class="inst-btn flex items-center justify-center py-4 lg:py-3.5 rounded-2xl border border-white/5 bg-[#16161A] text-neutral-300 text-sm font-medium transition-all active:scale-95">11x</button>
                        <button type="button" id="btn-inst-12" onclick="selectInstallment(12)" class="inst-btn flex items-center justify-center py-4 lg:py-3.5 rounded-2xl border border-white/5 bg-[#16161A] text-neutral-300 text-sm font-medium transition-all active:scale-95">12x</button>

            </div>
        </section>

        <!-- Right/Bottom Section: Sticky Results -->
        <section class="fixed bottom-0 left-0 right-0 lg:relative lg:w-[400px] xl:w-[460px] bg-[#111114]/80 lg:bg-[#111114] backdrop-blur-2xl lg:backdrop-blur-none border-t lg:border-t-0 lg:border-l border-white/5 p-6 lg:p-12 flex flex-col justify-end lg:justify-center z-20 transition-transform">

            <div class="flex flex-col gap-6 lg:gap-8">

                            <span class="text-sm text-neutral-300">Comissão do consultor</span>

                            <span class="text-sm text-neutral-300">Comissão do credenciado</span>
                        </div>

                    </div>
                </div>

    <script>
        // Taxas maquininha
        const machineRates = [
            0.0918, 0.1093, 0.1195, 0.1297,
            0.1398, 0.1498, 0.1600, 0.1698,
            0.1800, 0.1898, 0.1998, 0.2098
        ];
        // Comissão do consultor por parcela (1x a 12x)
        const consultantRates = [0.0325, 0.035, 0.0375, 0.04, 0.0425, 0.045, 0.0475, 0.05, 0.0525, 0.055, 0.0575, 0.06];
        // Comissão do estabelecimento credenciado por parcela (1x a 12x)
        const establishmentRates = [0.01625, 0.0175, 0.01875, 0.02, 0.02125, 0.0225, 0.02375, 0.025, 0.02625, 0.0275, 0.02875, 0.03];
        const companyRate = 0.10;
        let currentInstallment = 12;

        function getCurrentView() {
            const hash = (location.hash || '#cliente').replace('#', '');
            if (hash === 'consultor') return 'consultor';
            if (hash === 'credenciados') return 'credenciados';
            return 'cliente';
        }

        function renderView(view) {
            const resultConsultor = document.getElementById('result-consultor');
            const resultCredenciados = document.getElementById('result-credenciados');
            const linkCliente = document.getElementById('menu-link-cliente');
            const linkConsultor = document.getElementById('menu-link-consultor');
            const linkCredenciados = document.getElementById('menu-link-credenciados');

            const activeClasses = ['text-[#F5A623]', 'border-[#F5A623]/30'];
            [linkCliente, linkConsultor, linkCredenciados].forEach(link => link.classList.remove(...activeClasses));
            resultConsultor.classList.add('hidden');
            resultCredenciados.classList.add('hidden');

            if (view === 'consultor') {
                resultConsultor.classList.remove('hidden');
                linkConsultor.classList.add(...activeClasses);
            } else if (view === 'credenciados') {
                resultCredenciados.classList.remove('hidden');
                linkCredenciados.classList.add(...activeClasses);
            } else {
                linkCliente.classList.add(...activeClasses);
            }
            calculate();
        }

        function openMenu() {
            const overlay = document.getElementById('menu-overlay');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            overlay.classList.add('opacity-100');
            document.body.style.overflow = 'hidden';
        }

        function closeMenu() {
            const overlay = document.getElementById('menu-overlay');
            overlay.classList.add('opacity-0', 'pointer-events-none');
            overlay.classList.remove('opacity-100');
            document.body.style.overflow = '';
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!location.hash || location.hash === '#') {
                location.hash = 'cliente';
            }
            renderView(getCurrentView());
            selectInstallment(12);

            document.querySelectorAll('#menu-overlay a[href^="#"]').forEach(link => {
                link.addEventListener('click', () => closeMenu());
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    const overlay = document.getElementById('menu-overlay');
                    if (!overlay.classList.contains('pointer-events-none')) closeMenu();
                }
            });
        });

        window.addEventListener('hashchange', () => {
            renderView(getCurrentView());
        });

        function maskCurrency(input) {
            let value = input.value.replace(/\D/g, '');
            if (value === '') value = '0';
            value = parseInt(value, 10) / 100;

            input.value = value.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });

            calculate();
        }

        function selectInstallment(n) {
            currentInstallment = n;

            const activeClasses = ['bg-[#F5A623]', 'text-black', 'border-[#F5A623]'];
            const inactiveClasses = ['bg-[#16161A]', 'text-neutral-300', 'border-white/5'];

            document.querySelectorAll('.inst-btn').forEach(btn => {
                btn.classList.remove(...activeClasses);
                btn.classList.add(...inactiveClasses);
            });

            const activeBtn = document.getElementById('btn-inst-' + n);
            activeBtn.classList.remove(...inactiveClasses);
            activeBtn.classList.add(...activeClasses);

            const taxPercentage = (machineRates[n - 1] * 100).toFixed(2);
            document.getElementById('current-tax-display').innerText = `Taxa: ${taxPercentage}%`;

            calculate();
        }

        function calculate() {
            const input = document.getElementById('calc-amount');
            let cleanValue = input.value.replace(/\D/g, '') / 100;

            if (cleanValue <= 0) cleanValue = 0;

            const rateMaquininha = machineRates[currentInstallment - 1];
            const totalToPass = cleanValue * (1 + rateMaquininha) * (1 + companyRate);
            const installmentValue = totalToPass / currentInstallment;

            const formatCurrency = (val) => val.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            document.getElementById('res-pix').innerText = formatCurrency(cleanValue);
            document.getElementById('res-total').innerText = formatCurrency(totalToPass);
            document.getElementById('res-installment-text').innerText = `${currentInstallment}x de`;
            document.getElementById('res-installment-val').innerText = formatCurrency(installmentValue);

            const view = getCurrentView();
            if (view === 'consultor') {
                const commission = totalToPass * consultantRates[currentInstallment - 1];
                document.getElementById('res-commission').innerText = formatCurrency(commission);
            } else if (view === 'credenciados') {
                const establishment = totalToPass * establishmentRates[currentInstallment - 1];
                document.getElementById('res-establishment').innerText = formatCurrency(establishment);
            }
        }
    </script>
