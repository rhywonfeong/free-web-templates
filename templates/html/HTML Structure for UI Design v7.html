<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Payments Card</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white rounded-xl shadow-lg p-6 w-full max-w-md">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <div class="w-12 h-12 bg-teal-100 rounded-full flex items-center justify-center text-teal-600 font-bold text-xl">
                    15
                </div>
                <div>
                    <div class="text-gray-800 font-semibold">Wednesday</div>
                    <div class="text-gray-500 text-sm">September</div>
                </div>
            </div>
            <div class="text-indigo-600 font-semibold text-sm">Today</div>
        </div>

        <div class="mt-6 border-t pt-4">
            <div class="flex items-center justify-between">
                <div>
                    <div class="text-gray-800 font-semibold">$34,000.00</div>
                    <div class="text-gray-500 text-xs">USD</div>
                </div>
                <div class="flex items-center space-x-1">
                    <span class="w-2 h-2 bg-indigo-600 rounded-full"></span>
                    <span class="text-gray-500 text-sm">International Transfer</span>
                </div>
            </div>
        </div>

        <div class="mt-4 bg-gray-200 rounded-full text-gray-700 text-xs uppercase text-center py-2">
            6 Scheduled Payments
        </div>
    </div>
</body>
</html>
