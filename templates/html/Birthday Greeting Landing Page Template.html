<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@keyframes fall {
0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
10% { opacity: 0.6; }
90% { opacity: 0.6; }
100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}
@keyframes scale-in {
0% { transform: scale(0.95); opacity: 0; }
100% { transform: scale(1); opacity: 1; }
}
@keyframes slide-up {
0% { transform: translateY(20px); opacity: 0; }
100% { transform: translateY(0); opacity: 1; }
}
@keyframes ignite {
0% { transform: translateX(-50%) scale(0); opacity: 0; }
60% { transform: translateX(-50%) scale(1.2); opacity: 1; }
100% { transform: translateX(-50%) scale(1); opacity: 0.9; }
}
@keyframes flicker {
0% { transform: translateX(-50%) scale(1) skewX(0deg); opacity: 0.9; }
25% { transform: translateX(-50%) scale(1.05) skewX(2deg); opacity: 1; }
50% { transform: translateX(-50%) scale(0.95) skewX(-1deg); opacity: 0.8; }
75% { transform: translateX(-50%) scale(1.02) skewX(1deg); opacity: 0.95; }
100% { transform: translateX(-50%) scale(1) skewX(0deg); opacity: 0.9; }
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-pink-50 to-rose-100 min-h-screen flex items-center justify-center relative overflow-hidden font-['Inter',sans-serif] text-slate-800 antialiased selection:bg-rose-200 selection:text-rose-900">

    <!-- Background Confetti / Sparkles -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden">
        <iconify-icon icon="solar:star-fall-linear" class="absolute text-rose-300 text-lg" style="left: 10%; animation: fall 6s linear infinite; animation-delay: 0s;"></iconify-icon>
        <iconify-icon icon="solar:stars-linear" class="absolute text-pink-400 text-sm" style="left: 25%; animation: fall 8s linear infinite; animation-delay: 2s;"></iconify-icon>
        <div class="absolute w-1.5 h-3 bg-rose-200 rounded-full" style="left: 40%; animation: fall 5s linear infinite; animation-delay: 1s;"></div>
        <iconify-icon icon="solar:heart-linear" class="absolute text-rose-300 text-xl" style="left: 60%; animation: fall 7s linear infinite; animation-delay: 3s;"></iconify-icon>
        <div class="absolute w-2 h-2 bg-pink-300 rounded-full" style="left: 75%; animation: fall 6s linear infinite; animation-delay: 0.5s;"></div>
        <iconify-icon icon="solar:star-fall-linear" class="absolute text-rose-400 text-sm" style="left: 85%; animation: fall 9s linear infinite; animation-delay: 4s;"></iconify-icon>
        <div class="absolute w-1 h-4 bg-rose-300 rounded-full" style="left: 90%; animation: fall 7s linear infinite; animation-delay: 2.5s;"></div>
        <iconify-icon icon="solar:stars-linear" class="absolute text-pink-300 text-lg" style="left: 50%; animation: fall 8s linear infinite; animation-delay: 5s;"></iconify-icon>
    </div>

    <!-- Center Card -->
    <main class="relative z-10 w-[90%] max-w-md mx-auto p-10 sm:p-14 bg-white/70 backdrop-blur-xl rounded-3xl shadow-[0_8px_30px_rgb(244,63,94,0.08)] border border-white/60 flex flex-col items-center justify-center text-center opacity-0" style="animation: scale-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;">
        
        <!-- Animated Cake -->
        <div class="relative flex flex-col items-center mb-10 opacity-0" style="animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;">
            
            <!-- Candle Flame -->
            <div class="absolute -top-7 left-1/2 w-3.5 h-5 bg-gradient-to-b from-yellow-100 via-yellow-400 to-orange-500 rounded-full origin-bottom opacity-0 blur-[1px] shadow-[0_0_15px_rgb(250,204,21,0.6)]" style="animation: ignite 0.6s ease-out 1.6s forwards, flicker 0.15s infinite alternate 2.2s;"></div>
            
            <!-- Candle Base -->
            <div class="w-2 h-7 bg-rose-50 border border-rose-200 rounded-t-sm z-10 relative">
                <div class="absolute inset-0 bg-[repeating-linear-gradient(45deg,transparent,transparent_3px,rgba(244,63,94,0.1)_3px,rgba(244,63,94,0.1)_6px)]"></div>
            </div>
            
            <!-- Top Tier -->
            <div class="w-20 h-10 bg-pink-100 rounded-t-xl border-b-[6px] border-pink-200 z-20 relative overflow-hidden shadow-[inset_0_-2px_6px_rgba(255,255,255,0.5)]">
                <!-- Decorative frosting dots -->
                <div class="absolute top-0 w-full flex justify-around px-2 pt-1">
                    <div class="w-2 h-2 bg-white rounded-full opacity-60"></div>
                    <div class="w-2 h-2 bg-white rounded-full opacity-60"></div>
                    <div class="w-2 h-2 bg-white rounded-full opacity-60"></div>
                </div>
            </div>
            
            <!-- Bottom Tier -->
            <div class="w-32 h-14 bg-white rounded-xl shadow-sm z-30 relative border border-rose-50 overflow-hidden flex items-end">
                <!-- Scalloped frosting effect using flex divs -->
                <div class="absolute -top-2 left-0 w-full flex justify-between px-1">
                    <div class="w-5 h-5 bg-pink-100 rounded-full"></div>
                    <div class="w-5 h-5 bg-pink-100 rounded-full"></div>
                    <div class="w-5 h-5 bg-pink-100 rounded-full"></div>
                    <div class="w-5 h-5 bg-pink-100 rounded-full"></div>
                    <div class="w-5 h-5 bg-pink-100 rounded-full"></div>
                    <div class="w-5 h-5 bg-pink-100 rounded-full"></div>
                </div>
                <!-- Bottom detail -->
                <div class="w-full h-2 bg-rose-50 opacity-50"></div>
            </div>
            
            <!-- Cake Plate -->
            <div class="w-40 h-3 bg-slate-100 rounded-full mt-2 shadow-[0_4px_10px_rgba(0,0,0,0.03)] border border-slate-200/50"></div>
        </div>

        <!-- Text Reveal -->
        <div class="space-y-4 opacity-0" style="animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.2s forwards;">
            <div class="flex items-center justify-center gap-2 mb-2 opacity-0" style="animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.4s forwards;">
                <iconify-icon icon="solar:stars-linear" class="text-rose-400"></iconify-icon>
                <span class="text-xs uppercase tracking-[0.2em] text-rose-400 font-medium">Make a wish</span>
                <iconify-icon icon="solar:stars-linear" class="text-rose-400"></iconify-icon>
            </div>
            
            <h1 class="font-['Dancing_Script',cursive] text-5xl sm:text-6xl tracking-tight text-slate-800 font-medium leading-[1.1] drop-shadow-sm">
                Happy Birthday<br>
                <span class="bg-clip-text text-transparent bg-gradient-to-r from-rose-400 to-pink-500">my Love!</span>
            </h1>
            
            <p class="text-sm sm:text-base text-slate-500 font-light max-w-[250px] mx-auto leading-relaxed pt-2 opacity-0" style="animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) 2.8s forwards;">
                Wishing you a day filled with magic, joy, and endless love.
            </p>
        </div>

    </main>


</body></html>
