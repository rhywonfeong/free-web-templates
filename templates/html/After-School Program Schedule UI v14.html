<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Our Programs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen font-sans">
  <header class="py-12">
    <h1 class="text-4xl md:text-5xl font-extrabold text-blue-700 text-center drop-shadow mb-2">Our Programs</h1>
    <p class="text-center text-lg text-gray-500 max-w-2xl mx-auto">Explore our enriching after-school programs designed to inspire and educate.</p>
  </header>
  <div class="max-w-4xl mx-auto mt-2 bg-white shadow-lg rounded-lg overflow-hidden flex flex-col md:flex-row"
    x-data="{
      activeTab: 0,
      dateRange: '8/11 - 12/23',
      showModal: false,
      form: { name: '', email: '', program: '' },
      programs: [
        {
          name: 'Speech & Debate',
          schedule: [
            { time: '4:00pm - 5:00pm', weekdays: ['Mon'], subject: 'Public Speaking' },
            { time: '5:00pm - 6:00pm', weekdays: ['Tue'], subject: 'Speech Analysis' },
            { time: '4:00pm - 5:00pm', weekdays: ['Wed'], subject: 'Argument Construction' },
            { time: '5:00pm - 6:00pm', weekdays: ['Thu'], subject: 'Presentation Skills' },
            { time: '4:00pm - 5:30pm', weekdays: ['Fri'], subject: 'Debate Practice' },
            { time: '10:00am - 11:00am', weekdays: ['Sat'], subject: 'Team Debates' },
            { time: '2:00pm - 3:00pm', weekdays: ['Sun'], subject: 'Impromptu Speaking' }
          ]
        },
        {
          name: 'ELA',
          schedule: [
            { time: '3:30pm - 4:30pm', weekdays: ['Mon'], subject: 'Reading Comprehension' },
            { time: '5:00pm - 6:00pm', weekdays: ['Tue'], subject: 'Literature Circle' },
            { time: '3:30pm - 4:30pm', weekdays: ['Wed'], subject: 'Vocabulary Building' },
            { time: '5:00pm - 6:00pm', weekdays: ['Thu'], subject: 'Critical Thinking' },
            { time: '3:30pm - 4:30pm', weekdays: ['Fri'], subject: 'Grammar Skills' },
            { time: '11:00am - 12:00pm', weekdays: ['Sat'], subject: 'Reading Workshop' },
            { time: '1:00pm - 2:00pm', weekdays: ['Sun'], subject: 'Book Discussion' }
          ]
        },
        {
          name: 'Writing',
          schedule: [
            { time: '5:00pm - 6:00pm', weekdays: ['Mon'], subject: 'Creative Writing' },
            { time: '5:00pm - 6:00pm', weekdays: ['Tue'], subject: 'Storytelling' },
            { time: '6:00pm - 7:00pm', weekdays: ['Wed'], subject: 'Poetry Workshop' },
            { time: '5:00pm - 6:00pm', weekdays: ['Thu'], subject: 'Essay Writing' },
            { time: '4:00pm - 5:00pm', weekdays: ['Fri'], subject: 'Editing Skills' },
            { time: '9:00am - 10:00am', weekdays: ['Sat'], subject: 'Writing Club' },
            { time: '11:00am - 12:00pm', weekdays: ['Sun'], subject: 'Essay Workshop' }
          ]
        },
        {
          name: 'Mandarin',
          schedule: [
            { time: '5:30pm - 6:30pm', weekdays: ['Mon'], subject: 'Beginner Mandarin' },
            { time: '4:30pm - 5:30pm', weekdays: ['Tue'], subject: 'Mandarin Conversation' },
            { time: '5:30pm - 6:30pm', weekdays: ['Wed'], subject: 'Intermediate Mandarin' },
            { time: '4:00pm - 5:00pm', weekdays: ['Thu'], subject: 'Mandarin Reading' },
            { time: '5:30pm - 6:30pm', weekdays: ['Fri'], subject: 'Mandarin Culture' },
            { time: '1:00pm - 2:00pm', weekdays: ['Sat'], subject: 'Mandarin Writing' },
            { time: '10:00am - 11:00am', weekdays: ['Sun'], subject: 'Mandarin Practice' }
          ]
        }
      ],
      weekdays: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],
      weekdayNames: {
        'Mon': 'Monday',
        'Tue': 'Tuesday',
        'Wed': 'Wednesday',
        'Thu': 'Thursday',
        'Fri': 'Friday',
        'Sat': 'Saturday',
        'Sun': 'Sunday'
      },
      scheduleByDay(program) {
        const map = {};
        for(const day of this.weekdays) map[day] = [];
        for(const item of program.schedule) {
          for(const day of item.weekdays) {
            map[day].push({time: item.time, subject: item.subject});
          }
        }
        return map;
      }
    }"
  >
    <!-- Left Tabs -->
    <div class="md:w-1/4 w-full bg-gray-100 flex md:flex-col flex-row md:items-stretch items-center">
      <template x-for="(program, idx) in programs" :key="idx">
        <button
          @click="activeTab = idx"
          class="w-full md:py-6 py-4 px-6 text-left md:text-base text-sm font-semibold border-b md:border-b-0 md:border-r border-gray-200 focus:outline-none transition"
          :class="activeTab === idx ? 'bg-white text-blue-600 md:border-r-4 md:border-blue-600 shadow-sm' : 'text-gray-700 hover:bg-gray-200'"
        >
          <span x-text="program.name"></span>
        </button>
      </template>
    </div>
    <!-- Right Content -->
    <div class="md:w-3/4 w-full p-8">
      <div class="flex items-center gap-4 flex-wrap mb-6">
        <h2 class="text-2xl font-bold text-gray-800" x-text="programs[activeTab].name"></h2>
        <span class="bg-blue-100 text-blue-700 rounded-full px-3 py-1 text-sm font-medium">
          <svg class="inline-block w-4 h-4 mr-1 -mt-1 text-blue-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" /><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span x-text="dateRange"></span>
        </span>
      </div>
      <template x-for="day in weekdays" :key="day">
        <div x-data="{ schedule: scheduleByDay(programs[activeTab])[day] }" x-show="schedule.length > 0" class="mb-8">
          <h3 class="text-lg font-semibold text-blue-700 mb-2" x-text="weekdayNames[day]"></h3>
          <table class="w-full bg-white rounded-lg shadow overflow-hidden mb-2">
            <thead>
              <tr class="bg-blue-50">
                <th class="py-2 px-4 text-left text-sm font-semibold text-gray-700">Time</th>
                <th class="py-2 px-4 text-left text-sm font-semibold text-gray-700">Subject</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(item, i) in schedule" :key="i">
                <tr class="border-b last:border-b-0">
                  <td class="py-2 px-4 text-gray-800" x-text="item.time"></td>
                  <td class="py-2 px-4 text-gray-600" x-text="item.subject"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </template>
    </div>
  </div>

  <!-- Floating Enrollment Button -->
  <button
    @click="showModal = true"
    class="fixed z-30 bottom-6 right-6 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-full shadow-lg font-semibold text-lg transition flex items-center gap-2"
    x-data
    aria-label="Open Enrollment Form"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M12 4v16m8-8H4"/>
    </svg>
    Enrollment Form
  </button>

  <!-- Modal -->
  <div
    x-show="showModal"
    x-transition
    class="fixed inset-0 z-40 flex items-center justify-center bg-black/40"
    style="display: none;"
  >
    <div @click.away="showModal = false" class="bg-white w-full max-w-md rounded-lg shadow-xl p-8 relative">
      <button @click="showModal = false" class="absolute top-2 right-2 text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
      <h3 class="text-2xl font-bold mb-4 text-blue-700">Enrollment Form</h3>
      <form class="space-y-4" @submit.prevent="showModal = false">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Name</label>
          <input type="text" x-model="form.name" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-200">
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Email</label>
          <input type="email" x-model="form.email" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-200">
        </div>
        <div>
          <label class="block text-gray-700 font-medium mb-1">Program</label>
          <select x-model="form.program" required class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-200">
            <option value="" disabled selected>Select a program</option>
            <template x-for="program in programs">
              <option x-text="program.name" :value="program.name"></option>
            </template>
          </select>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white rounded px-4 py-2 font-semibold hover:bg-blue-700 transition">Submit</button>
      </form>
    </div>
  </div>
</body>
</html>
