<style>
/* iOS-like Smoothing & Scroll */
body { -webkit-tap-highlight-color: transparent; user-select: none; overscroll-behavior-y: none; font-family: 'Inter', sans-serif; }

/* Grid Defaults */
.app-grid {

grid-template-columns: repeat(4, minmax(0, 1fr));

padding-bottom: 8rem;
}
@media (min-width: 640px) { .app-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2rem 1rem; } }
@media (min-width: 768px) { .app-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .app-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
/* Icon Styling */
.ios-icon {
width: 3.75rem; height: 3.75rem;
border-radius: 0.85rem;
position: relative;
overflow: hidden;
border: 1px solid rgba(255,255,255,0.08);
box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 4px 12px rgba(0,0,0,0.4);

}
.ios-icon:active { transform: scale(0.95); }
.app-icon-bg { background: linear-gradient(145deg, #1a1a1a, #0a0a0a); }

grid-template-rows: repeat(3, 1fr);

}
.scroll-mask { mask-image: linear-gradient(to bottom, black 85%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%); }
.sortable-ghost { opacity: 0; }
.sortable-drag { opacity: 1; transform: scale(1.1); z-index: 50; }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 0.5rem; }
.custom-scrollbar::-webkit-scrollbar { width: 4px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
.folder-title-input { background: transparent; border: none; font-size: 1.5rem; font-weight: 700; color: white; width: 100%; outline: none; text-align: center; }

<body class="bg-black text-white h-screen w-full overflow-hidden flex flex-col relative">

    <!-- GLOBAL BACKGROUND LAYER (Page Specific Support) -->
    <div class="absolute inset-0 z-0 pointer-events-none overflow-hidden bg-black transition-all duration-500">
        <!-- Render current background (Page Specific) -->
        <template x-if="currentBg">
            <div class="w-full h-full relative">
                <template x-if="currentBg.type === 'video'">
                    <video :src="currentBg.data" autoplay="" loop="" muted="" playsinline="" class="w-full h-full object-cover opacity-60"></video>
                </template>
                <template x-if="currentBg.type === 'image'">
                    <img :src="currentBg.data" class="w-full h-full object-cover opacity-60">
                </template>
                <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-black/20"></div>
            </div>
        </template>
        <template x-if="!currentBg">
             <div class="w-full h-full bg-black"></div>
        </template>
    </div>

    <!-- AUTH MODAL -->
    <div x-show="authModalOpen" x-cloak="" class="fixed inset-0 z-[70] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md" @click="authModalOpen = false" x-transition.opacity=""></div>
        <div class="relative w-full max-w-sm p-8 space-y-8 text-center bg-[#111] border border-gray-800 rounded-3xl shadow-2xl" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-10" x-transition:enter-end="opacity-100 translate-y-0">
            <button @click="authModalOpen = false" class="absolute top-4 right-4 text-gray-500 hover:text-white transition-colors">
                <span class="iconify text-2xl" data-icon="solar:close-circle-bold"></span>
            </button>
            <div class="space-y-2">
                <div class="w-16 h-16 mx-auto rounded-[16px] bg-gradient-to-b from-gray-800 to-black border border-gray-700 flex items-center justify-center shadow-2xl">
                    <span class="iconify text-3xl text-white" data-icon="solar:rocket-2-bold-duotone"></span>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">Sign In</h1>
                <p class="text-xs text-gray-500">Sync your apps across devices</p>
            </div>
            <div class="space-y-4">
                <button @click="signInGoogle" class="w-full py-3 bg-white text-black font-semibold rounded-xl flex items-center justify-center gap-2 hover:bg-gray-200 transition-colors">
                    <span class="iconify text-xl" data-icon="logos:google-icon"></span>
                    <span>Continue with Google</span>
                </button>
                <form @submit.prevent="signInEmail" class="space-y-3">
                    <input type="email" x-model="email" placeholder="Email" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-white outline-none transition-colors">
                    <input type="password" x-model="password" placeholder="Password" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-white outline-none transition-colors">
                    <button type="submit" class="w-full py-3 bg-gray-800 text-white font-medium rounded-xl hover:bg-gray-700 transition-colors">
                        <span x-show="!authLoading">Sign In / Register</span>
                        <span x-show="authLoading" class="iconify animate-spin mx-auto" data-icon="solar:refresh-circle-bold-duotone"></span>
                    </button>
                    <p x-text="authError" class="text-red-500 text-xs h-4"></p>
                </form>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="h-full w-full relative z-10 flex flex-col">
       
        <!-- FIXED HEADER (Reverted to standard v20) -->
        <header class="h-16 px-4 md:px-8 flex items-center justify-between border-b border-white/5 bg-black/60 backdrop-blur-md z-40 shrink-0">
            <div class="flex items-center gap-4">
                <div class="hidden md:flex items-baseline gap-2">
                    <h1 class="text-lg font-bold tracking-tight text-white">LDL15 EXPERIMENTAL</h1>
                    <span class="text-xs text-gray-500 font-mono">v20</span>
                </div>
                <div class="flex bg-gray-900/80 rounded-lg p-1 border border-white/10">
                    <button @click="viewMode = 'grid'; holisticViewOpen = false" :class="viewMode === 'grid' ? 'bg-gray-700 text-white' : 'text-gray-500 hover:text-gray-300'" class="p-1.5 rounded-md transition-colors">
                        <span class="iconify text-lg" data-icon="solar:widget-2-bold-duotone"></span>
                    </button>
                    <button @click="viewMode = 'list'; holisticViewOpen = false" :class="viewMode === 'list' ? 'bg-gray-700 text-white' : 'text-gray-500 hover:text-gray-300'" class="p-1.5 rounded-md transition-colors">
                        <span class="iconify text-lg" data-icon="solar:list-bold-duotone"></span>
                    </button>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right leading-tight hidden sm:block">
                    <div class="text-sm font-bold text-white" x-text="time"></div>
                    <div class="text-[10px] font-medium text-gray-500 uppercase tracking-wide" x-text="date"></div>
                </div>
                <div class="flex items-center gap-3">
                    <button @click="openModal('add')" class="w-8 h-8 rounded-full bg-gray-900/50 border border-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                        <span class="iconify" data-icon="solar:add-circle-bold-duotone"></span>
                    </button>
                    <button @click="handleProfileClick()" class="relative group">
                        <div x-show="user" class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 overflow-hidden border border-white/20 ring-2 ring-green-500/20">
                            <img x-show="user?.photoURL" :src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/917d6f93-fb36-439a-8c48-884b67b35381_1600w.jpg" class="w-full h-full object-cover">
                            <div x-show="!user?.photoURL" class="w-full h-full flex items-center justify-center font-bold text-xs" x-text="user?.email?.[0].toUpperCase()"></div>
                        </div>
                        <div x-show="!user" class="w-9 h-9 rounded-full bg-gray-800 overflow-hidden border border-white/10 flex items-center justify-center hover:bg-gray-700 transition-colors">
                            <span class="iconify text-xl text-gray-400" data-icon="solar:user-circle-bold-duotone"></span>
                        </div>
                    </button>
                </div>
            </div>
        </header>

        <!-- SCROLLABLE CONTENT AREA -->
        <main class="flex-1 relative overflow-hidden" @touchstart="handleTouchStart" @touchend="handleTouchEnd" @contextmenu.prevent="openPageContext($event)">
           
            <!-- GRID VIEW -->
            <div x-show="viewMode === 'grid'" class="h-full w-full relative" x-transition.opacity="">
                <div class="h-full w-full relative transition-all duration-300" :class="holisticViewOpen ? 'z-50 bg-black/60 backdrop-blur-xl overflow-y-auto p-10 pt-20 flex flex-wrap justify-center items-center gap-8' : ''">
                    
                    <template x-for="pNum in pageNumbers" :key="pNum">
                        <div x-show="holisticViewOpen || currentPage === pNum" class="transition-all duration-500 ease-out" :class="holisticViewOpen ? 'relative w-[260px] h-[460px] md:w-[300px] md:h-[530px] rounded-3xl border border-white/10 bg-[#111] shadow-2xl cursor-pointer hover:border-indigo-500/50 hover:shadow-indigo-500/20 hover:-translate-y-2' : 'absolute inset-0 overflow-y-auto no-scrollbar scroll-mask p-4 md:p-8'" @click="if(holisticViewOpen) { currentPage = pNum; holisticViewOpen = false; }">
                            
                             <div x-show="holisticViewOpen" class="absolute top-4 left-0 right-0 text-center z-10 pointer-events-none">
                                <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest bg-black/80 px-3 py-1.5 rounded-full border border-white/10 shadow-lg" x-text="getPageName(pNum)"></span>
                             </div>

                             <div :class="holisticViewOpen ? 'w-[360%] h-[360%] origin-top-left scale-[0.277] pointer-events-none p-10 pt-24' : 'max-w-7xl mx-auto min-h-full'">
                                <!-- Standard Grid -->
                                <div class="app-grid sortable-grid" :data-page="pNum">
                                    <template x-for="app in getAppsForPage(pNum)" :key="app.id">
                                        <div :data-id="app.id" class="relative flex flex-col items-center gap-1.5 rounded-xl transition-all cursor-pointer touch-manipulation group select-none app-item" @click="handleAppClick($event, app)" @contextmenu.prevent.stop="openContext($event, app)">
                                           
                                            <!-- FOLDER -->
                                            <template x-if="app.type === 'folder'">
                                                <div class="ios-icon flex flex-col z-10 p-0 backdrop-blur-md !bg-opacity-50" :class="app.bgColor || 'bg-[#1a1a1a]'">
                                                    <div class="folder-mini-grid">
                                                        <template x-for="subApp in (app.items || []).slice(0, 9)" :key="subApp.id">
                                                            <div class="w-full h-full rounded-[2px] overflow-hidden bg-black/50 flex items-center justify-center">
                                                                 <template x-if="subApp.icon.includes('data:') || subApp.icon.includes('http')">
                                                                    <img :src="subApp.icon" class="w-full h-full object-cover">
                                                                </template>
                                                                <template x-if="!subApp.icon.includes('data:') &amp;&amp; !subApp.icon.includes('http')">
                                                                    <span class="iconify text-[8px] text-white" :data-icon="subApp.icon"></span>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- GALLERY/SYSTEM -->
                                            <template x-if="app.type === 'gallery' || app.id === 'system-gallery'">
                                                 <div class="ios-icon flex flex-col z-10 p-0 bg-[#1a1a1a] overflow-hidden">
                                                     <div x-show="getGalleryPreviews(app.id).length &gt; 0" class="folder-mini-grid">
                                                        <template x-for="item in getGalleryPreviews(app.id)" :key="item.id">
                                                            <div class="w-full h-full rounded-[2px] overflow-hidden bg-gray-900 relative">
                                                                <template x-if="item.type === 'image'">
                                                                    <img :src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/4734259a-bad7-422f-981e-ce01e79184f2_1600w.jpg" class="w-full h-full object-cover opacity-90">
                                                                </template>
                                                                 <template x-if="item.type === 'video'">
                                                                    <div class="w-full h-full flex items-center justify-center bg-gray-800">
                                                                        <video :src="item.data" class="w-full h-full object-cover opacity-60 pointer-events-none" muted=""></video>
                                                                        <span class="iconify text-[8px] text-white absolute z-10" data-icon="solar:play-bold"></span>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                     </div>
                                                     <div x-show="getGalleryPreviews(app.id).length === 0" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-indigo-900/30 to-purple-900/30">
                                                         <span class="iconify text-3xl text-gray-500" :data-icon="app.icon || 'solar:gallery-bold-duotone'"></span>
                                                     </div>
                                                 </div>
                                            </template>

                                            <!-- NORMAL APP -->
                                            <template x-if="app.type !== 'folder' &amp;&amp; app.type !== 'gallery' &amp;&amp; app.id !== 'system-gallery'">
                                                <div class="ios-icon app-icon-bg flex items-center justify-center z-10 relative">
                                                    <template x-if="app.note || (app.attachments &amp;&amp; app.attachments.length)">
                                                        <div class="absolute top-1 right-1 w-3 h-3 bg-yellow-400 rounded-full border border-black z-20 flex items-center justify-center shadow-sm">
                                                             <span class="iconify text-[8px] text-black" data-icon="solar:notes-bold"></span>
                                                        </div>
                                                    </template>
                                                    <template x-if="app.icon.includes('data:') || app.icon.includes('http')">
                                                        <img :src="app.icon" class="w-full h-full object-cover pointer-events-none">
                                                    </template>
                                                    <template x-if="!app.icon.includes('data:') &amp;&amp; !app.icon.includes('http')">
                                                        <span class="iconify text-3xl text-gray-200" :data-icon="app.icon"></span>
                                                    </template>
                                                </div>
                                            </template>

                                            <div class="flex flex-col items-center gap-0.5 text-center">
                                                <span class="text-[0.68rem] font-bold text-white tracking-tight leading-tight truncate w-20" x-text="app.name"></span>
                                                <span :class="categoryColors[app.category] || categoryColors.default" class="text-[0.55rem] font-medium uppercase leading-none truncate w-20" x-text="app.type === 'folder' ? 'Folder' : (app.type === 'gallery' ? 'Gallery' : (app.category || 'App'))"></span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                             </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- LIST VIEW -->
            <div x-show="viewMode === 'list'" class="h-full overflow-y-auto p-4 md:p-8 no-scrollbar pb-32" x-cloak="">
                <div id="list-sortable" class="max-w-4xl mx-auto space-y-3">
                    <template x-for="app in apps" :key="app.id">
                         <div :data-id="app.id" class="flex items-center gap-4 p-3 rounded-2xl bg-gray-900/50 backdrop-blur-md border border-white/5 hover:bg-gray-800 transition-colors group cursor-pointer select-none" @click="handleAppClick($event, app)" @contextmenu.prevent.stop="openContext($event, app)">
                             <div class="w-12 h-12 rounded-[10px] bg-gray-800 flex items-center justify-center overflow-hidden flex-shrink-0 relative border border-white/5">
                                 <template x-if="app.icon.includes('data:') || app.icon.includes('http')"><img :src="app.icon" class="w-full h-full object-cover"></template>
                                 <template x-if="!app.icon.includes('data:') &amp;&amp; !app.icon.includes('http')"><span class="iconify text-xl text-white" :data-icon="app.icon"></span></template>
                             </div>
                             <div class="flex-grow min-w-0">
                                <div class="flex items-center gap-2">
                                    <h3 class="font-bold text-white truncate text-sm" x-text="app.name"></h3>
                                    <span :class="categoryColors[app.category] || categoryColors.default" class="text-[10px] px-1.5 py-0.5 rounded bg-gray-800 border border-gray-700 font-medium uppercase" x-text="app.type === 'folder' ? 'Folder' : app.category"></span>
                                </div>
                                <p class="text-xs text-gray-500 truncate" x-text="app.url"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </main>

        <!-- PAGE BACKGROUND MENU (The "kept" feature) -->
        <div x-show="pageContextOpen" @click.outside="pageContextOpen = false" class="fixed z-[85] w-64 bg-[#111]/90 backdrop-blur-xl border border-gray-800 rounded-xl shadow-2xl py-2 overflow-hidden flex flex-col" :style="`top: ${contextPos.y}px; left: ${contextPos.x}px`" x-transition.opacity="">
            <div class="px-4 py-2 text-[10px] font-bold text-gray-500 uppercase tracking-wider border-b border-gray-800 mb-1">
                Page <span x-text="currentPage + 1"></span> Options
            </div>
            <button @click="openBgModal(); pageContextOpen=false" class="px-4 py-2.5 text-left text-sm text-white hover:bg-indigo-600 flex items-center gap-3">
                <span class="iconify text-lg opacity-70" data-icon="solar:wallpaper-bold-duotone"></span> Change Wallpaper
            </button>
        </div>

        <!-- WALLPAPER MODAL -->
        <div x-show="bgModalOpen" class="fixed inset-0 z-[95] flex items-center justify-center p-4" x-cloak="">
            <div class="absolute inset-0 bg-black/80 backdrop-blur-md" @click="bgModalOpen = false"></div>
            <div class="relative w-full max-w-sm bg-[#111] border border-gray-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col p-6 space-y-4">
                 <div class="flex justify-between items-center">
                    <h2 class="text-lg font-bold text-white">Page Wallpaper</h2>
                    <button @click="bgModalOpen = false" class="text-gray-500 hover:text-white"><span class="iconify text-2xl" data-icon="solar:close-circle-bold"></span></button>
                </div>
                
                <div class="flex gap-4">
                    <label class="flex-1 aspect-video rounded-xl border border-gray-700 bg-gray-900 flex flex-col items-center justify-center cursor-pointer hover:border-indigo-500 transition-colors group overflow-hidden relative">
                        <div x-show="!pageConfigs[currentPage]?.bg" class="flex flex-col items-center">
                            <span class="iconify text-2xl text-gray-500 group-hover:text-white mb-1" data-icon="solar:upload-square-bold-duotone"></span>
                            <span class="text-xs text-gray-400">Upload</span>
                        </div>
                        <!-- Preview -->
                        <template x-if="pageConfigs[currentPage]?.bg">
                            <div class="w-full h-full relative">
                                    <template x-if="pageConfigs[currentPage].bg.type === 'video'"><video :src="pageConfigs[currentPage].bg.data" class="w-full h-full object-cover opacity-50"></video></template>
                                    <template x-if="pageConfigs[currentPage].bg.type === 'image'"><img :src="pageConfigs[currentPage].bg.data" class="w-full h-full object-cover opacity-50"></template>
                                    <button @click.prevent="clearPageBg()" class="absolute top-2 right-2 p-1 bg-red-500 rounded-full text-white"><span class="iconify" data-icon="solar:trash-bin-trash-bold"></span></button>
                            </div>
                        </template>
                        <input type="file" accept="image/*,video/*" @change="uploadBackground($event)" class="hidden">
                    </label>
                </div>
                <p class="text-[10px] text-gray-500 text-center">Right-click empty space to access this again.</p>
            </div>
        </div>

        <!-- APP CREATE/EDIT MODAL -->
        <div x-show="modalOpen" class="fixed inset-0 z-[90] flex items-center justify-center p-4" x-cloak="">
             <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" @click="closeModal"></div>
             <div class="relative w-full max-w-lg bg-[#111] border border-gray-800 rounded-3xl p-6 shadow-2xl flex flex-col gap-4" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-10" x-transition:enter-end="opacity-100 translate-y-0">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-white" x-text="modalMode === 'add' ? 'Add App' : 'Edit App'"></h2>
                    <button @click="closeModal" class="text-gray-500 hover:text-white"><span class="iconify text-2xl" data-icon="solar:close-circle-bold"></span></button>
                </div>
                <div class="space-y-3">
                    <div><label class="text-[10px] uppercase font-bold text-gray-500">Name</label><input type="text" x-model="modalData.name" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white mt-1 focus:border-indigo-500 outline-none"></div>
                    <div><label class="text-[10px] uppercase font-bold text-gray-500">URL</label><input type="text" x-model="modalData.url" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white mt-1 focus:border-indigo-500 outline-none"></div>
                     <div class="flex gap-2">
                        <div class="flex-1"><label class="text-[10px] uppercase font-bold text-gray-500">Icon (Iconify/URL)</label><input type="text" x-model="modalData.icon" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white mt-1 focus:border-indigo-500 outline-none"></div>
                        <div class="w-1/3"><label class="text-[10px] uppercase font-bold text-gray-500">Category</label><input type="text" x-model="modalData.category" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-white mt-1 focus:border-indigo-500 outline-none"></div>
                    </div>
                </div>
                <button @click="saveModal" class="w-full py-3 bg-white text-black font-bold rounded-xl hover:bg-gray-200 mt-2">Save App</button>
             </div>
        </div>

        <!-- FOLDER MODAL -->
        <div x-show="folderModalOpen" class="fixed inset-0 z-[90] flex items-center justify-center p-4" x-cloak="">
            <div class="absolute inset-0 bg-black/80 backdrop-blur-xl" @click="closeFolderModal"></div>
            <div class="relative w-full max-w-2xl bg-[#111] border border-gray-800 rounded-[2rem] p-8 shadow-2xl flex flex-col items-center min-h-[50vh]" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-90" x-transition:enter-end="opacity-100 scale-100">
                <input type="text" x-model="activeFolder.name" class="folder-title-input mb-8" @change="saveSettings()">
                <div class="app-grid w-full">
                    <template x-for="app in activeFolder.items" :key="app.id">
                        <div class="flex flex-col items-center gap-2 group cursor-pointer" @click="handleAppClick($event, app)" @contextmenu.prevent.stop="openContext($event, app)">
                             <div class="w-16 h-16 rounded-2xl bg-[#222] border border-white/10 flex items-center justify-center overflow-hidden hover:scale-105 transition-transform">
                                <template x-if="app.icon.includes('data:') || app.icon.includes('http')"><img :src="app.icon" class="w-full h-full object-cover"></template>
                                <template x-if="!app.icon.includes('data:') &amp;&amp; !app.icon.includes('http')"><span class="iconify text-3xl text-white" :data-icon="app.icon"></span></template>
                             </div>
                             <span class="text-xs text-white truncate w-20 text-center" x-text="app.name"></span>
                        </div>
                    </template>
                </div>
                <button @click="closeFolderModal" class="mt-auto py-3 px-8 bg-gray-800 rounded-full text-white font-bold hover:bg-gray-700 transition-colors">Close Folder</button>
            </div>
        </div>

        <!-- GALLERY MODAL -->
        <div x-show="galleryOpen" class="fixed inset-0 z-[95] bg-black flex flex-col" x-cloak="" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-full" x-transition:enter-end="opacity-100 translate-y-0">
             <div class="h-16 px-6 flex items-center justify-between bg-black/80 backdrop-blur-md border-b border-white/10 shrink-0">
                 <h2 class="text-lg font-bold">Gallery</h2>
                 <div class="flex gap-2">
                     <button @click="triggerGalleryUpload" class="px-4 py-2 bg-white text-black text-xs font-bold rounded-lg">Upload</button>
                     <button @click="galleryOpen=false" class="p-2 bg-gray-800 rounded-lg text-white"><span class="iconify" data-icon="solar:close-circle-bold"></span></button>
                 </div>
                 <input type="file" multiple="" accept="image/*,video/*" class="hidden" id="galleryUpload" @change="handleGalleryUpload">
             </div>
             <div class="flex-1 overflow-y-auto p-4">
                 <div class="gallery-grid">
                     <template x-for="item in galleryItems" :key="item.id">
                         <div class="aspect-square bg-gray-900 rounded-lg overflow-hidden relative group cursor-pointer" @click="viewImage = item">
                             <template x-if="item.type==='image'"><img :src="item.data" class="w-full h-full object-cover"></template>
                             <template x-if="item.type==='video'"><video :src="item.data" class="w-full h-full object-cover opacity-80"></video><span class="iconify absolute inset-0 m-auto text-3xl text-white" data-icon="solar:play-circle-bold"></span></template>
                             <button @click.stop="deleteGalleryItem(item.id)" class="absolute top-1 right-1 p-1 bg-red-500 rounded-full text-white opacity-0 group-hover:opacity-100 transition-opacity"><span class="iconify" data-icon="solar:trash-bin-trash-bold"></span></button>
                         </div>
                     </template>
                 </div>
             </div>
        </div>
        
        <!-- DOCK -->
        <div x-show="viewMode === 'grid'" class="fixed bottom-6 left-0 right-0 z-[60] flex flex-col items-center justify-end gap-4 pointer-events-none" x-cloak="">
             <div x-show="!holisticViewOpen" class="pointer-events-auto flex gap-2 p-2 bg-black/40 backdrop-blur-xl rounded-full border border-white/10 shadow-xl transition-all duration-300">
                <template x-for="pNum in pageNumbers" :key="pNum">
                    <div class="w-2 h-2 rounded-full transition-all duration-300 cursor-pointer shadow-lg flex items-center justify-center" :class="currentPage === pNum ? 'bg-white w-4 shadow-white/50' : 'bg-gray-600 hover:bg-gray-400'" @click="currentPage = pNum"></div>
                </template>
            </div>
            <button @click="toggleHolistic()" class="pointer-events-auto group relative flex items-center justify-center w-14 h-14 bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl hover:bg-white/20 hover:scale-105 active:scale-95 transition-all duration-300 overflow-hidden">
                <span class="iconify text-2xl text-white transition-transform duration-500 relative z-10" :class="holisticViewOpen ? 'rotate-180' : ''" :data-icon="holisticViewOpen ? 'solar:minimize-square-bold-duotone' : 'solar:widget-5-bold-duotone'"></span>
                <div class="absolute inset-0 bg-gradient-to-tr from-indigo-500/30 to-purple-500/30 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            </button>
        </div>
        
        <!-- APP CONTEXT MENU -->
        <div x-show="contextOpen" @click.outside="contextOpen = false" class="fixed z-[85] w-56 bg-[#111] border border-gray-800 rounded-xl shadow-2xl py-1.5 overflow-hidden flex flex-col backdrop-blur-xl" :style="`top: ${contextPos.y}px; left: ${contextPos.x}px`" x-transition.opacity="">
             <button @click="launchApp(contextApp); contextOpen=false" class="px-4 py-2 text-left text-sm text-white hover:bg-indigo-600 flex items-center gap-3">
                <span class="iconify text-lg opacity-70" data-icon="solar:plain-bold-duotone"></span> Open
            </button>
            <div class="h-px bg-gray-800 my-1 mx-2"></div>
            <button @click="openModal('edit', contextApp); contextOpen=false" class="px-4 py-2 text-left text-xs font-medium text-gray-300 hover:bg-gray-800 hover:text-white flex items-center gap-3">
                <span class="iconify text-lg opacity-70" data-icon="solar:pen-bold-duotone"></span> Edit App
            </button>
             <button @click="deleteApp(contextApp); contextOpen=false" class="px-4 py-2 text-left text-xs font-medium text-red-400 hover:bg-red-900/20 hover:text-red-300 flex items-center gap-3">
                <span class="iconify text-lg opacity-70" data-icon="solar:trash-bin-trash-bold-duotone"></span> Delete
            </button>
        </div>
        
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCo0Rq6eABM3Q6le_x9VjskDCCAg1XUl8A", authDomain: "livedesklauncher.firebaseapp.com", projectId: "livedesklauncher", databaseURL: "https://livedesklauncher-default-rtdb.europe-west1.firebasedatabase.app", storageBucket: "livedesklauncher.firebasestorage.app", messagingSenderId: "719865623018", appId: "1:719865623018:web:104315b70c32db5bd4c293" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const DEFAULT_APPS = [
            // PAGE 0: Main
            { id: 'app-01', name: 'Google', url: 'https://google.com', icon: 'logos:google-icon', category: 'Google', page: 0, index: 0 },
            { id: 'app-02', name: 'YouTube', url: 'https://youtube.com', icon: 'logos:youtube-icon', category: 'Google', page: 0, index: 1 },
            { id: 'app-03', name: 'Gmail', url: 'https://mail.google.com', icon: 'logos:google-gmail', category: 'Google', page: 0, index: 2 },
            { id: 'app-04', name: 'Drive', url: 'https://drive.google.com', icon: 'logos:google-drive', category: 'Google', page: 0, index: 3 },
            { id: 'app-05', name: 'Calendar', url: 'https://calendar.google.com', icon: 'logos:google-calendar', category: 'Google', page: 0, index: 4 },
            { id: 'app-06', name: 'Photos', url: 'https://photos.google.com', icon: 'logos:google-photos', category: 'Google', page: 0, index: 5 },
            { id: 'system-gallery', name: 'Gallery', type: 'gallery', icon: 'solar:gallery-bold-duotone', category: 'System', page: 0, index: 6 },
            { id: 'app-08', name: 'Maps', url: 'https://maps.google.com', icon: 'logos:google-maps', category: 'Google', page: 0, index: 7 },
            { id: 'folder-social', name: 'Socials', type: 'folder', bgColor:'bg-indigo-900', items: [
                { id: 's1', name: 'Twitter', url: 'https://twitter.com', icon: 'logos:twitter' },
                { id: 's2', name: 'Instagram', url: 'https://instagram.com', icon: 'skill-icons:instagram' },
                { id: 's3', name: 'LinkedIn', url: 'https://linkedin.com', icon: 'logos:linkedin-icon' },
                { id: 's4', name: 'Reddit', url: 'https://reddit.com', icon: 'logos:reddit-icon' }
            ], page: 0, index: 8, category: 'Folder' },
            { id: 'app-09', name: 'ChatGPT', url: 'https://chat.openai.com', icon: 'simple-icons:openai', category: 'AI', page: 0, index: 9 },

            // PAGE 1: Dev
            { id: 'app-10', name: 'GitHub', url: 'https://github.com', icon: 'logos:github-icon', category: 'Dev', page: 1, index: 0 },
            { id: 'app-11', name: 'Vercel', url: 'https://vercel.com', icon: 'logos:vercel-icon', category: 'Dev', page: 1, index: 1 },
            { id: 'app-12', name: 'Supabase', url: 'https://supabase.com', icon: 'logos:supabase-icon', category: 'Dev', page: 1, index: 2 },
            { id: 'app-13', name: 'Firebase', url: 'https://firebase.google.com', icon: 'logos:firebase', category: 'Dev', page: 1, index: 3 },
            { id: 'app-14', name: 'Tailwind', url: 'https://tailwindcss.com', icon: 'logos:tailwindcss-icon', category: 'Dev', page: 1, index: 4 },
            { id: 'app-15', name: 'React', url: 'https://react.dev', icon: 'logos:react', category: 'Dev', page: 1, index: 5 },
            { id: 'app-16', name: 'Vue', url: 'https://vuejs.org', icon: 'logos:vue', category: 'Dev', page: 1, index: 6 },
            { id: 'app-17', name: 'Svelte', url: 'https://svelte.dev', icon: 'logos:svelte-icon', category: 'Dev', page: 1, index: 7 },
             { id: 'app-18', name: 'Figma', url: 'https://figma.com', icon: 'logos:figma', category: 'Design', page: 1, index: 8 },
            { id: 'app-19', name: 'Linear', url: 'https://linear.app', icon: 'solar:hamburger-menu-bold-duotone', category: 'Productivity', page: 1, index: 9 },

            // PAGE 2: Entertainment
            { id: 'app-20', name: 'Netflix', url: 'https://netflix.com', icon: 'logos:netflix-icon', category: 'Media', page: 2, index: 0 },
            { id: 'app-21', name: 'Spotify', url: 'https://spotify.com', icon: 'logos:spotify-icon', category: 'Media', page: 2, index: 1 },
            { id: 'app-22', name: 'Twitch', url: 'https://twitch.tv', icon: 'logos:twitch', category: 'Media', page: 2, index: 2 },
            { id: 'app-23', name: 'Discord', url: 'https://discord.com', icon: 'logos:discord-icon', category: 'Social', page: 2, index: 3 },
            { id: 'app-24', name: 'Hulu', url: 'https://hulu.com', icon: 'simple-icons:hulu', category: 'Media', page: 2, index: 4 },
            { id: 'app-25', name: 'Disney+', url: 'https://disneyplus.com', icon: 'cib:disney-plus', category: 'Media', page: 2, index: 5 },

             // PAGE 3: Utils
            { id: 'app-30', name: 'Notion', url: 'https://notion.so', icon: 'logos:notion-icon', category: 'Productivity', page: 3, index: 0 },
            { id: 'app-31', name: 'Slack', url: 'https://slack.com', icon: 'logos:slack-icon', category: 'Productivity', page: 3, index: 1 },
            { id: 'app-32', name: 'Zoom', url: 'https://zoom.us', icon: 'logos:zoom-icon', category: 'Productivity', page: 3, index: 2 },
            { id: 'app-33', name: 'Trello', url: 'https://trello.com', icon: 'logos:trello', category: 'Productivity', page: 3, index: 3 },
            { id: 'folder-adobe', name: 'Adobe', type: 'folder', bgColor:'bg-red-900', items: [
                { id: 'a1', name: 'Photoshop', url: 'https://adobe.com', icon: 'logos:adobe-photoshop' },
                { id: 'a2', name: 'Illustrator', url: 'https://adobe.com', icon: 'logos:adobe-illustrator' },
                { id: 'a3', name: 'XD', url: 'https://adobe.com', icon: 'logos:adobe-xd' }
            ], page: 3, index: 4, category: 'Folder' },
        ];

        document.addEventListener('alpine:init', () => {
            Alpine.data('livedesk', () => ({
                user: null, loading: true, authModalOpen: false, email: '', password: '', authError: '', authLoading: false,
                apps: [], pageNames: { 0: 'HOME', 1: 'DEV', 2: 'MEDIA', 3: 'WORK' }, 
                galleryItems: [], 
                
                // Wallpaper Feature State
                pageConfigs: {}, // { 0: { bg: {type, data} } }
                bgModalOpen: false,
                pageContextOpen: false,

                // Core State
                viewMode: 'grid', currentPage: 0, time: '', date: '', holisticViewOpen: false,
                galleryOpen: false, activeGalleryId: null, galleryViewMode: 'grid', viewImage: null,
                contextOpen: false, contextApp: null, contextPos: { x: 0, y: 0 },
                modalOpen: false, modalMode: 'add', modalData: {},
                folderModalOpen: false, activeFolder: { name: '', items: [] },
                categoryColors: { 'Google': 'text-sky-400', 'Dev': 'text-purple-400', 'Media': 'text-pink-400', 'Social': 'text-green-400', 'Productivity': 'text-orange-400', 'System': 'text-white', 'Folder': 'text-gray-400', 'default': 'text-gray-500' },

                init() {
                    this.updateTime(); setInterval(() => this.updateTime(), 1000);
                    
                    const localPageConfigs = localStorage.getItem('ldl_page_configs');
                    if(localPageConfigs) this.pageConfigs = JSON.parse(localPageConfigs);
                    
                    const local = localStorage.getItem('ldl_apps');
                    const initialApps = local ? JSON.parse(local) : DEFAULT_APPS;
                    this.processApps(initialApps);

                    auth.onAuthStateChanged(u => {
                        this.user = u;
                        if (u) {
                            this.authModalOpen = false;
                            db.ref(`users/${u.uid}/apps`).on('value', s => { if(s.val()) this.processApps(s.val()); });
                            db.ref(`users/${u.uid}/pageConfigs`).on('value', s => { if(s.val()) this.pageConfigs = s.val(); });
                        }
                    });
                },

                // Wallpaper Logic
                openPageContext(e) {
                    if(this.holisticViewOpen) return;
                    e.preventDefault();
                    this.contextPos = { x: e.clientX, y: e.clientY };
                    this.pageContextOpen = true;
                },
                openBgModal() {
                    this.bgModalOpen = true;
                },
                getOrCreatePageConfig(p) {
                    if(!this.pageConfigs[p]) this.pageConfigs[p] = { bg: null };
                    return this.pageConfigs[p];
                },
                uploadBackground(e) {
                    const file = e.target.files[0];
                    if(!file) return;
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        const bgData = {
                            type: file.type.startsWith('video') ? 'video' : 'image',
                            data: evt.target.result
                        };
                        this.getOrCreatePageConfig(this.currentPage).bg = bgData;
                        this.saveSettings();
                    };
                    reader.readAsDataURL(file);
                },
                clearPageBg() {
                    if(this.pageConfigs[this.currentPage]) {
                        this.pageConfigs[this.currentPage].bg = null;
                        this.saveSettings();
                    }
                },
                get currentBg() {
                    const pConfig = this.pageConfigs[this.currentPage];
                    return (pConfig && pConfig.bg) ? pConfig.bg : null;
                },

                // Core Logic
                processApps(data) { this.apps = data.sort((a,b) => (a.page||0)-(b.page||0) || a.index-b.index); this.$nextTick(()=>this.initSortable()); },
                updateTime() { const n=new Date(); this.time=n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); this.date=n.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); },
                get pageNumbers() { return [...new Set(this.apps.map(a=>a.page||0)),0,1,2,3].sort((a,b)=>a-b); },
                getAppsForPage(p) { return this.apps.filter(a=>(a.page||0)===p); },
                getPageName(i) { return this.pageNames[i] || `PAGE ${i+1}`; },
                
                saveSettings() {
                    if (this.user) {
                        db.ref(`users/${this.user.uid}/pageConfigs`).set(this.pageConfigs);
                        db.ref(`users/${this.user.uid}/apps`).set(this.apps);
                    } else {
                        localStorage.setItem('ldl_page_configs', JSON.stringify(this.pageConfigs));
                        localStorage.setItem('ldl_apps', JSON.stringify(this.apps));
                    }
                },

                handleAppClick(e,app) { 
                    if(app.type==='folder'){ 
                        this.activeFolder = app; 
                        this.folderModalOpen = true; 
                    } else if (app.type === 'gallery' || app.id === 'system-gallery') {
                        this.activeGalleryId = app.id;
                        this.galleryOpen = true;
                    } else { 
                        window.open(app.url, '_blank'); 
                    } 
                },
                closeFolderModal() { this.folderModalOpen = false; this.saveSettings(); },
                
                // Modals
                openModal(mode, app=null) {
                    this.modalMode = mode;
                    this.modalData = mode === 'edit' ? {...app} : { name:'', url:'', icon:'', category:'', page: this.currentPage, index: this.apps.length };
                    this.modalOpen = true;
                },
                closeModal() { this.modalOpen = false; },
                saveModal() {
                    if(this.modalMode === 'add') {
                        this.modalData.id = 'app-' + Date.now();
                        this.apps.push(this.modalData);
                    } else {
                        const idx = this.apps.findIndex(a=>a.id===this.modalData.id);
                        if(idx !== -1) this.apps[idx] = this.modalData;
                    }
                    this.saveSettings();
                    this.closeModal();
                },
                deleteApp(app) {
                    this.apps = this.apps.filter(a=>a.id!==app.id);
                    this.saveSettings();
                },
                launchApp(app) { this.handleAppClick(null, app); },

                // Gallery Logic
                triggerGalleryUpload() { document.getElementById('galleryUpload').click(); },
                handleGalleryUpload(e) {
                     Array.from(e.target.files).forEach(file => {
                         const reader = new FileReader();
                         reader.onload = (evt) => {
                             this.galleryItems.push({ id: Date.now()+Math.random(), type: file.type.startsWith('video')?'video':'image', data: evt.target.result });
                         };
                         reader.readAsDataURL(file);
                     });
                },
                getGalleryPreviews(id) { return this.galleryItems.slice(0, 9); },

                // Misc
                openContext(e, app) { e.preventDefault(); this.contextPos={x:e.clientX,y:e.clientY}; this.contextApp=app; this.contextOpen=true; },
                signInGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); },
                signInEmail() { auth.signInWithEmailAndPassword(this.email, this.password).catch(()=>{ auth.createUserWithEmailAndPassword(this.email, this.password).catch(e=>this.authError=e.message); }); },
                handleProfileClick() { if(this.user) auth.signOut(); else this.authModalOpen=true; },
                toggleHolistic() { this.holisticViewOpen = !this.holisticViewOpen; },
                
                initSortable() {
                    document.querySelectorAll('.sortable-grid').forEach(el=>{
                        if(el._sortable) el._sortable.destroy();
                        el._sortable = new Sortable(el, { group:'apps', animation:200, draggable:'.app-item', delay:150, delayOnTouchOnly:true, onEnd:(evt)=>{
                             const itemEl = evt.item; const newIds = Array.from(evt.to.children).map(c=>c.dataset.id);
                             this.apps.forEach(a=>{ if(newIds.includes(a.id)) { a.page=parseInt(evt.to.dataset.page); a.index=newIds.indexOf(a.id); } });
                             this.saveSettings();
                        }});
                    });
                }
            }));
        });
    </script>
</body></html>
