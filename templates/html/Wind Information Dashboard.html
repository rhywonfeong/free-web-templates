<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wind Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            blue: {
              50: '#f0f7ff',
              100: '#e0eefe',
              200: '#bae0fd',
              300: '#7dcbfc',
              400: '#39acf7',
              500: '#1a91eb',
              600: '#0c73ca',
              700: '#0e5ca4',
              800: '#144e87',
              900: '#164270',
            },
            secondary: '#7C94B5',
            offwhite: '#f8f8f8'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-offwhite flex items-center justify-center min-h-screen p-4">
  <div class="w-[390px] h-[852px] rounded-3xl overflow-hidden shadow-md">
    <div class="w-full h-full bg-offwhite flex flex-col">
      <!-- Header -->
      <div class="p-6 flex items-center">
        <button class="text-secondary hover:text-blue-800 mr-4">
          <i class="bi bi-chevron-left text-xl"></i>
        </button>
        <h1 class="text-xl font-medium text-blue-800 flex-1 text-center">Wind</h1>
        <button class="text-secondary hover:text-blue-800">
          <i class="bi bi-three-dots-vertical text-xl"></i>
        </button>
      </div>
      
      <div class="flex-1 px-4 pb-4 overflow-y-auto">
        <!-- Current Wind -->
        <div class="bg-white p-5 rounded-2xl mb-4 shadow-sm border border-secondary/20">
          <div class="flex justify-between items-start mb-2">
            <div>
              <h2 class="text-xl font-medium text-blue-800">San Francisco</h2>
              <div class="text-xs text-secondary mt-1">Today, May 15</div>
            </div>
            <div class="flex items-center">
              <i class="bi bi-wind text-secondary mr-1"></i>
              <span class="text-blue-800 font-medium">8 mph</span>
            </div>
          </div>
          
          <div class="mt-6 flex justify-center">
            <div class="relative w-40 h-40">
              <!-- Wind Direction Compass -->
              <svg viewBox="0 0 100 100" class="w-full h-full">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#e0eefe" stroke-width="2" />
                <line x1="50" y1="5" x2="50" y2="15" stroke="#7C94B5" stroke-width="1" />
                <line x1="50" y1="85" x2="50" y2="95" stroke="#7C94B5" stroke-width="1" />
                <line x1="5" y1="50" x2="15" y2="50" stroke="#7C94B5" stroke-width="1" />
                <line x1="85" y1="50" x2="95" y2="50" stroke="#7C94B5" stroke-width="1" />
                <text x="50" y="20" text-anchor="middle" font-size="8" fill="#144e87" font-weight="bold">N</text>
                <text x="50" y="85" text-anchor="middle" font-size="8" fill="#7C94B5">S</text>
                <text x="15" y="52" text-anchor="middle" font-size="8" fill="#7C94B5">W</text>
                <text x="85" y="52" text-anchor="middle" font-size="8" fill="#7C94B5">E</text>
                <!-- Wind direction arrow (NE direction) -->
                <path d="M50,50 L65,35" stroke="#1a91eb" stroke-width="3" stroke-linecap="round" />
                <path d="M65,35 L60,35 L65,30 L70,35 L65,35" fill="#1a91eb" />
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center">
                <div class="text-3xl font-light text-blue-800">8</div>
                <div class="text-sm text-secondary">mph</div>
                <div class="text-xs text-secondary mt-1">NE</div>
              </div>
            </div>
          </div>
          
          <div class="flex justify-between mt-4">
            <div class="text-center">
              <div class="text-xs text-secondary mb-1">Gusts</div>
              <div class="text-sm font-medium text-blue-800">12 mph</div>
            </div>
            <div class="text-center">
              <div class="text-xs text-secondary mb-1">Direction</div>
              <div class="text-sm font-medium text-blue-800">Northeast</div>
            </div>
            <div class="text-center">
              <div class="text-xs text-secondary mb-1">Feels Like</div>
              <div class="text-sm font-medium text-blue-800">66°F</div>
            </div>
          </div>
        </div>
        
        <!-- Hourly Wind -->
        <div class="mb-4">
          <h2 class="text-lg font-medium text-blue-800 mb-3">Hourly Wind</h2>
          <div class="bg-white rounded-2xl shadow-sm border border-secondary/20 p-4">
            <div class="flex overflow-x-auto pb-2 gap-4">
              <div class="flex flex-col items-center min-w-[60px]">
                <div class="text-sm text-secondary mb-2">Now</div>
                <div class="w-8 h-8 flex items-center justify-center bg-blue-50 rounded-full mb-2">
                  <i class="bi bi-arrow-up-right text-blue-600 rotate-45"></i>
                </div>
                <div class="text-xs font-medium text-blue-800">8 mph</div>
              </div>
              
              <div class="flex flex-col items-center min-w-[60px]">
                <div class="text-sm text-secondary mb-2">1 PM</div>
                <div class="w-8 h-8 flex items-center justify-center bg-blue-50 rounded-full mb-2">
                  <i class="bi bi-arrow-up-right text-blue-600 rotate-45"></i>
                </div>
                <div class="text-xs font-medium text-blue-800">9 mph</div>
              </div>
              
              <div class="flex flex-col items-center min-w-[60px]">
                <div class="text-sm text-secondary mb-2">2 PM</div>
                <div class="w-8 h-8 flex items-center justify-center bg-blue-50 rounded-full mb-2">
                  <i class="bi bi-arrow-right text-blue-600"></i>
                </div>
                <div class="text-xs font-medium text-blue-800">10 mph</div>
              </div>
              
              <div class="flex flex-col items-center min-w-[60px]">
                <div class="text-sm text-secondary mb-2">3 PM</div>
                <div class="w-8 h-8 flex items-center justify-center bg-blue-50 rounded-full mb-2">
                  <i class="bi bi-arrow-right text-blue-600"></i>
                </div>
                <div class="text-xs font-medium text-blue-800">12 mph</div>
              </div>
              
              <div class="flex flex-col items-center min-w-[60px]">
                <div class="text-sm text-secondary mb-2">4 PM</div>
                <div class="w-8 h-8 flex items-center justify-center bg-blue-50 rounded-full mb-2">
                  <i class="bi bi-arrow-right text-blue-600"></i>
                </div>
                <div class="text-xs font-medium text-blue-800">11 mph</div>
              </div>
              
              <div class="flex flex-col items-center min-w-[60px]">
                <div class="text-sm text-secondary mb-2">5 PM</div>
                <div class="w-8 h-8 flex items-center justify-center bg-blue-50 rounded-full mb-2">
                  <i class="bi bi-arrow-right text-blue-600 rotate-[330deg]"></i>
                </div>
                <div class="text-xs font-medium text-blue-800">9 mph</div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Daily Wind -->
        <div class="mb-4">
          <h2 class="text-lg font-medium text-blue-800 mb-3">7-Day Wind</h2>
          <div class="bg-white rounded-2xl shadow-sm border border-secondary/20 divide-y divide-secondary/20">
            <div class="p-4 flex items-center">
              <div class="w-20 text-sm text-secondary">Today</div>
              <div class="flex items-center gap-3 flex-1">
                <div class="w-8 h-8 flex items-center justify-center bg-blue-50 rounded-full">
                  <i class="bi bi-arrow-up-right text-blue-600 rotate-45"></i>
                </div>
                <div class="flex-1 h-2 bg-blue-100 rounded-full relative">
                  <div class="absolute inset-y-0 left-0 bg-blue-500 rounded-full" style="width: 40%"></div>
                </div>
                <div class="text-sm font-medium text-blue-800 w-16 text-right">8 mph</div>
              </div>
            </div>
            
            <div class="p-4 flex items-center">
              <div class="w-20 text-sm text-secondary">Mon, May 16</div>
              <div class="flex items-center gap-3 flex-1">
                <div class="w-8 h-8 flex items-center justify-center bg-blue-50 rounded-full">
                  <i class="bi bi-arrow-right text-blue-600"></i>
                </div>
                <div class="flex-1 h-2 bg-blue-100 rounded-full relative">
                  <div class="absolute inset-y-0 left-0 bg-blue-500 rounded-full" style="width: 60%"></div>
                </div>
                <div class="text-sm font-medium text-blue-800 w-16 text-right">12 mph</div>
              </div>
            </div>
            
            <div class="p-4 flex items-center">
              <div class="w-20 text-sm text-secondary">Tue, May 17</div>
              <div class="flex items-center gap-3 flex-1">
                <div class="w-8 h-8 flex items-center justify-center bg-blue-50 rounded-full">
                  <i class="bi bi-arrow-right text-blue-600 rotate-[330deg]"></i>
                </div>
                <div class="flex-1 h-2 bg-blue-100 rounded-full relative">
                  <div class="absolute inset-y-0 left-0 bg-blue-500 rounded-full" style="width: 45%"></div>
                </div>
                <div class="text-sm font-medium text-blue-800 w-16 text-right">9 mph</div>
              </div>
            </div>
            
            <div class="p-4 flex items-center">
              <div class="w-20 text-sm text-secondary">Wed, May 18</div>
              <div class="flex items-center gap-3 flex-1">
                <div class="w-8 h-8 flex items-center justify-center bg-blue-50 rounded-full">
                  <i class="bi bi-arrow-down-right text-blue-600 rotate-45"></i>
                </div>
                <div class="flex-1 h-2 bg-blue-100 rounded-full relative">
                  <div class="absolute inset-y-0 left-0 bg-blue-500 rounded-full" style="width: 35%"></div>
                </div>
                <div class="text-sm font-medium text-blue-800 w-16 text-right">7 mph</div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Wind Map -->
        <div>
          <h2 class="text-lg font-medium text-blue-800 mb-3">Wind Map</h2>
          <div class="bg-white rounded-xl shadow-sm border border-secondary/20 p-4">
            <div class="aspect-video bg-blue-50 rounded-lg relative overflow-hidden mb-3">
              <!-- Simplified wind map visualization -->
              <div class="absolute inset-0 grid grid-cols-8 grid-rows-6">
                <div class="flex items-center justify-center">
                  <i class="bi bi-arrow-right text-blue-300 text-xs rotate-[330deg]"></i>
                </div>
                <div class="flex items-center justify-center">
                  <i class="bi bi-arrow-right text-blue-300 text-xs rotate-[330deg]"></i>
                </div>
                <div class="flex items-center justify-center">
                  <i class="bi bi-arrow-right text-blue-400 text-xs rotate-[345deg]"></i>
                </div>
                <div class="flex items-center justify-center">
                  <i class="bi bi-arrow-right text-blue-400 text-xs rotate-[345deg]"></i>
                </div>
                <div class="flex items-center justify-center">
                  <i class="bi bi-arrow-right text-blue-400 text-xs rotate-0"></i>
                </div>
                <div class="flex items-center justify-center">
                  <i class="bi bi-arrow-right text-blue-400 text-xs rotate-0"></i>
                </div>
                <div class="flex items-center justify-center">
                  <i class="bi bi-arrow-right text-blue-300 text-xs rotate-15"></i>
                </div>
                <div class="flex items-center justify-center">
                  <i class="bi bi-arrow-right text-blue-300 text-xs rotate-15"></i>
                </div>
                <!-- More grid cells with arrows... -->
              </div>
              
              <!-- Location marker -->
              <div class="absolute top-[40%] left-[45%]">
                <div class="h-3 w-3 bg-white ring-2 ring-blue-600 rounded-full"></div>
              </div>
            </div>
            
            <!-- Legend -->
            <div class="flex items-center justify-between">
              <div class="flex-1">
                <div class="h-2 bg-gradient-to-r from-blue-200 via-blue-400 to-blue-700 rounded-full"></div>
                <div class="flex justify-between text-xs mt-1">
                  <span class="text-secondary">Calm</span>
                  <span class="text-secondary">Moderate</span>
                  <span class="text-secondary">Strong</span>
                </div>
              </div>
              <button class="ml-4 text-blue-600 text-sm font-medium">Full Map</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
