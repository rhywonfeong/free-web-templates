    <div class="max-w-md mx-auto w-full relative z-10 flex flex-col min-h-screen p-6">
        
        <!-- Header -->
        <header class="flex justify-between items-center w-full pt-2">
            <i data-lucide="globe" class="w-7 h-7 text-amber-500" stroke-width="1.5"></i>
            <span class="text-base font-semibold text-white tracking-wide">EN</span>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col justify-center pb-12">
            
            <!-- Title -->
            <h1 class="text-5xl font-semibold tracking-tight text-center text-amber-500 mb-14">
                DX Wallet
            </h1>

            <!-- Registration Form -->
            <form class="space-y-5">
                
                <!-- Phone Number -->
                <div class="flex items-center gap-4 bg-[#0f0f11]/80 border border-zinc-800/80 rounded-2xl px-5 h-16 focus-within:border-amber-500/50 focus-within:bg-[#151518] transition-all backdrop-blur-md shadow-sm shadow-black/50">

                    <input type="tel" placeholder="Phone number" class="bg-transparent border-none outline-none w-full text-base text-white placeholder:text-zinc-600 h-full">

                <!-- Password -->
                <div class="flex items-center gap-4 bg-[#0f0f11]/80 border border-zinc-800/80 rounded-2xl px-5 h-16 focus-within:border-amber-500/50 focus-within:bg-[#151518] transition-all backdrop-blur-md shadow-sm shadow-black/50">

                </div>

                <!-- Confirm Password -->
                <div class="flex items-center gap-4 bg-[#0f0f11]/80 border border-zinc-800/80 rounded-2xl px-5 h-16 focus-within:border-amber-500/50 focus-within:bg-[#151518] transition-all backdrop-blur-md shadow-sm shadow-black/50">
                    <i data-lucide="lock" class="w-[22px] h-[22px] text-amber-500" stroke-width="1.5"></i>
                    <input type="password" placeholder="Confirm Password" class="bg-transparent border-none outline-none w-full text-base text-white placeholder:text-zinc-600 h-full">
                </div>

                <!-- Invite Code -->
                <div class="flex items-center gap-4 bg-[#0f0f11]/80 border border-zinc-800/80 rounded-2xl px-5 h-16 focus-within:border-amber-500/50 focus-within:bg-[#151518] transition-all backdrop-blur-md shadow-sm shadow-black/50">
                    <i data-lucide="key" class="w-[22px] h-[22px] text-amber-500" stroke-width="1.5"></i>
                    <input type="text" placeholder="Invite Code (optional)" class="bg-transparent border-none outline-none w-full text-base text-white placeholder:text-zinc-600 h-full">
                </div>

                <!-- Sign Up Button -->
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-semibold py-4 rounded-2xl text-lg transition-colors mt-8 active:scale-[0.98] shadow-lg shadow-amber-500/10">
                    Sign Up
