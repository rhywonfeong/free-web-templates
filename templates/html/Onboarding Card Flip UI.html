    body { font-family: 'Inter', sans-serif; }
    .card-flip-container { perspective: 1200px; }

      transition: transform 0.7s cubic-bezier(.5,.2,.2,1);
      transform-style: preserve-3d;
      position: relative;
      width: 100%; height: 100%;
    }
    .card-flip-container:hover .card-flip-inner,
    .card-flip-container:focus-within .card-flip-inner,
    .card-flip-container.flipped .card-flip-inner {
      transform: rotateY(180deg);
    }
    .card-flip-front, .card-flip-back {
      position: absolute;
      width: 100%; height: 100%; left: 0; top: 0;
      backface-visibility: hidden;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 3px 30px 2px rgba(30,41,59,0.16);
      will-change: transform;
    }
    .card-flip-front { z-index: 2; }
    .card-flip-back {
      transform: rotateY(180deg);

    .card {

      position: relative; overflow: hidden;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50% }
      50% { background-position: 100% 50% }
      100% { background-position: 0% 50% }
    }
    .wave-pattern {
      position: absolute; width: 150%; height: 150%; top: -25%; left: -25%;
      background-image: 
        radial-gradient(circle at 100% 50%, transparent 20%, rgba(255,255,255,0.03) 21%, rgba(255,255,255,0.03) 34%, transparent 35%, transparent),
        radial-gradient(circle at 0% 50%, transparent 20%, rgba(255,255,255,0.03) 21%, rgba(255,255,255,0.03) 34%, transparent 35%, transparent);
      background-size: 50px 100px;
      opacity: 0.3;
      transform: rotate(-5deg);
      animation: waveDrift 20s linear infinite;
    }
    @keyframes waveDrift {
      0% { transform: rotate(-5deg) translateY(0);}
      50% { transform: rotate(-5deg) translateY(10px);}
      100% { transform: rotate(-5deg) translateY(0);}
    }
    .mastercard-logo { position: relative; width: 60px; height: 40px; }
    .mastercard-circle {
      position: absolute; width: 30px; height: 30px; border-radius: 50%; top: 5px;
    }
    .mastercard-red { background-color: #eb001b; right: 0; }
    .mastercard-yellow { background-color: #f79e1b; right: 15px; }
    .mastercard-overlap {
      position: absolute; width: 15px; height: 30px; top: 5px; right: 15px;
      background-color: #ff8000; opacity: 0.7; mix-blend-mode: multiply;
    }
    .chip {
      background: linear-gradient(135deg,#bbb 0%,#eee 50%,#bbb 100%);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .ring-dot {
      box-shadow: 0 0 0 7px rgba(255,255,255,0.17);
    }
    @keyframes fadeUpBlur {
      0% { opacity: 0; transform: translateY(18px); filter: blur(6px);}
      70% { filter: blur(2.5px);}
      100% { opacity:1; transform:translateY(0); filter:blur(0);}
    }
    .fade-up-blur {
      opacity: 0;
      display: inline-block;
    }
    .fade-up-blur.animated {
      animation: fadeUpBlur 0.72s cubic-bezier(.63,0,.19,1) forwards;
    }
    .getstarted-wrapper {
      position: relative;
      display: flex;
      width: 100%;
      justify-content: center;
    }
    .getstarted-anim {
      position: relative;
      width: 200px;
      min-width: 150px;
      padding-left: 24px;
      padding-right: 52px;
      height: 56px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 1.125rem;
      background: #3b82f6; /* light/bright blue */
      transition: background 300ms;
      overflow: hidden;
      box-shadow: 0 3px 30px 2px rgba(30,41,59,0.16);
    }
    .getstarted-anim:hover,
    .getstarted-anim:focus {
      background: #60a5fa;
    }
    .getstarted-anim .slide-text {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transition: transform 300ms cubic-bezier(.45,0,.55,1);
      white-space: nowrap;
    }
    .getstarted-anim:hover .slide-text,
    .getstarted-anim:focus .slide-text {
      /* Slides left by arrow(36px)+gap(8px)=44px, because centering is by left:50% translateX(-50%) */
      transform: translate(calc(-50% - 22px), -50%);
    }
    .getstarted-anim .slide-arrow {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%) translateX(32px);
      opacity: 0;
      transition: 300ms cubic-bezier(.45,0,.55,1);
      display: flex;
      align-items: center;
      pointer-events: none;
    }
    .getstarted-anim:hover .slide-arrow,
    .getstarted-anim:focus .slide-arrow {
      opacity: 1;
      transform: translateY(-50%) translateX(0);
    }
    @media (max-width: 640px) {
      .getstarted-anim { width: 98%; min-width: 0; }
      .getstarted-anim .slide-arrow, .getstarted-anim .slide-text { font-size: 1rem; }
      .getstarted-anim .slide-arrow { right: 8px; }
    }
  </style>

  <script>
    // Animated heading
    const line1 = "All your cards.";
    const line2 = "One place.";
    function animateLine(line, startIndex=0) {
      return line.split("").map((ch, i) => {
        const safeChar = ch === " " ? "&nbsp;" : ch;
        return `<span class="fade-up-blur" style="animation-delay:${(startIndex+i)*60}ms">${safeChar}</span>`;
      }).join("");
    }
    const heading = document.getElementById('animated-heading');
    heading.innerHTML =
      `<span>${animateLine(line1,0)}</span><span>${animateLine(line2, line1.length + 1)}</span>`;
    setTimeout(() => {
      heading.querySelectorAll('.fade-up-blur').forEach(el => el.classList.add('animated'));
    }, 100);

    // Card flip support
    (() => {
      const flipContainer = document.querySelector('.card-flip-container');
      let flipped = false;
      flipContainer.addEventListener('click', function(e) {
        if(window.innerWidth < 768) {
          flipped = !flipped;
          this.classList.toggle('flipped', flipped);
        }
      });
      flipContainer.addEventListener('keydown', function(e) {
        if(e.key === "Escape" && this.classList.contains('flipped')) {
          this.classList.remove('flipped');
        }
      });
    })();
  </script>
