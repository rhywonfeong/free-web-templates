<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" />
<meta
name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover"
/>
<title>Appointment • Medical Records</title>
<meta name="color-scheme" content="light" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin
/>
<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap"
rel="stylesheet"
/>
<script src="https://cdn.tailwindcss.com"></script></head>
  <body
    class="antialiased text-slate-800 bg-slate-50 selection:bg-slate-900 selection:text-white"
    style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;"
  >
    <div class="min-h-dvh flex items-start justify-center">
      <main class="w-full max-w-md mx-auto px-4 pt-6 pb-28 sm:pt-10">

        <!-- Top App Bar -->
        <header
          class="flex items-center justify-between bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 px-4 py-3 mb-5 opacity-0 translate-y-2 transition duration-700 ease-out"
          data-animate
        >
          <div class="flex items-center gap-2">
            <div
              class="h-8 w-8 rounded-xl bg-slate-900 text-white flex items-center justify-center text-sm tracking-tight"
              aria-label="App logo"
            >
              AB
            </div>
            <div class="flex flex-col">
              <span class="text-xs text-slate-500">Appointment</span>
              <span class="text-sm font-medium tracking-tight">Medical Records</span>
            </div>
          </div>
          <button
            id="profileBtn"
            class="h-9 w-9 flex items-center justify-center rounded-xl ring-1 ring-slate-200 hover:ring-slate-300 hover:bg-slate-50 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
            title="Profile"
          >
            <i data-lucide="user" class="h-5 w-5 text-slate-700"></i>
          </button>
        </header>

        <!-- Greeting -->
        <section
          class="mb-4 opacity-0 translate-y-2 transition duration-700 ease-out delay-100"
          data-animate
        >
          <h1 class="text-[22px] leading-tight tracking-tight font-semibold text-slate-900">
            Good Evening, <span id="patientName">Aarav</span>
          </h1>
          <p class="text-sm text-slate-500 mt-1">
            Keep your details up to date for better care.
          </p>
        </section>

        <!-- Self Details Card -->
        <section
          class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-5 mb-6 opacity-0 translate-y-2 transition duration-700 ease-out delay-150"
          data-animate
          aria-labelledby="self-details-title"
        >
          <div class="flex items-center justify-between mb-3">
            <h2 id="self-details-title" class="text-[20px] tracking-tight font-semibold text-slate-900">
              Self Details
            </h2>
            <span class="text-xs text-slate-500">Private</span>
          </div>
          <div class="space-y-4">
            <!-- DOB -->
            <div class="space-y-2">
              <label class="text-[13px] text-slate-600">Date of Birth</label>
              <div class="flex items-center gap-3">
                <input
                  id="dobInput"
                  type="date"
                  class="w-full h-11 rounded-xl border-0 ring-1 ring-slate-200 focus:ring-2 focus:ring-slate-900 bg-white px-3 text-sm text-slate-900 placeholder-slate-400 transition"
                  placeholder="YYYY-MM-DD"
                  aria-describedby="ageParts"
                />
              </div>
              <div id="ageParts" class="text-xs text-slate-500">
                Age: <span id="ageY">–</span>y <span id="ageM">–</span>m <span id="ageD">–</span>d
              </div>
            </div>

            <!-- Height / Weight -->
            <div class="grid grid-cols-2 gap-3">
              <div class="space-y-2">
                <label class="text-[13px] text-slate-600">Height (cm)</label>
                <div class="relative">
                  <input
                    id="heightInput"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    class="w-full h-11 rounded-xl border-0 ring-1 ring-slate-200 focus:ring-2 focus:ring-slate-900 bg-white px-3 text-sm text-slate-900 placeholder-slate-400 transition"
                    placeholder="e.g. 172"
                  />
                  <div class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400">
                    cm
                  </div>
                </div>
              </div>
              <div class="space-y-2">
                <label class="text-[13px] text-slate-600">Weight (kg)</label>
                <div class="relative">
                  <input
                    id="weightInput"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    class="w-full h-11 rounded-xl border-0 ring-1 ring-slate-200 focus:ring-2 focus:ring-slate-900 bg-white px-3 text-sm text-slate-900 placeholder-slate-400 transition"
                    placeholder="e.g. 68.5"
                  />
                  <div class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400">
                    kg
                  </div>
                </div>
              </div>
            </div>

            <!-- BMI -->
            <div class="space-y-2">
              <label class="text-[13px] text-slate-600">BMI</label>
              <div class="flex items-center gap-3">
                <input
                  id="bmiOutput"
                  type="text"
                  class="w-36 h-11 rounded-xl border-0 ring-1 ring-slate-200 bg-slate-50 px-3 text-sm text-slate-900 placeholder-slate-400"
                  placeholder="—"
                  readonly
                />
                <span id="bmiNote" class="text-xs text-slate-500">Auto-calculated</span>
              </div>
            </div>
          </div>
        </section>

        <!-- Medical Records Header -->
        <section
          class="mb-3 opacity-0 translate-y-2 transition duration-700 ease-out delay-200"
          data-animate
        >
          <div class="flex items-center justify-between">
            <h2 class="text-[22px] tracking-tight font-semibold text-slate-900">
              Medical Records
            </h2>
            <button
              id="moreOptionsBtn"
              class="h-9 px-3 rounded-xl ring-1 ring-slate-200 hover:ring-slate-300 hover:bg-white transition text-slate-700 text-xs font-medium"
              title="More options"
            >
              Manage
            </button>
          </div>
          <p class="text-sm text-slate-500 mt-1">Prescriptions and lab reports</p>
        </section>

        <!-- Tabs -->
        <div
          class="bg-white rounded-2xl shadow-sm ring-1 ring-slate-200 p-2 mb-4 flex items-center justify-between gap-1 opacity-0 translate-y-2 transition duration-700 ease-out delay-200"
          data-animate
          role="tablist"
          aria-label="Medical Records Tabs"
        >
          <button
            id="tabPrescriptions"
            role="tab"
            aria-selected="true"
            class="flex-1 h-10 rounded-xl text-sm font-medium tracking-tight px-3 transition outline-none focus-visible:ring-2 focus-visible:ring-slate-400 bg-slate-900 text-white"
          >
            Prescriptions
          </button>
          <button
            id="tabLabs"
            role="tab"
            aria-selected="false"
            class="flex-1 h-10 rounded-xl text-sm font-medium tracking-tight px-3 transition outline-none focus-visible:ring-2 focus-visible:ring-slate-400 text-slate-700 hover:bg-slate-50"
          >
            Lab Reports
          </button>
        </div>

        <!-- Prescriptions Panel -->
        <section
          id="panelPrescriptions"
          role="tabpanel"
          aria-labelledby="tabPrescriptions"
          class="space-y-3 opacity-0 translate-y-2 transition duration-700 ease-out delay-300"
          data-animate
        >
          <div class="flex items-center justify-between">
            <span class="text-[13px] text-slate-500">Your prescriptions</span>
            <button
              id="addPrescriptionBtn"
              class="inline-flex items-center gap-2 h-10 px-3 rounded-xl bg-slate-900 text-white text-sm font-medium tracking-tight hover:opacity-95 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
              title="Add Prescription"
            >
              <i data-lucide="plus" class="h-4 w-4"></i>
              Add Prescription
            </button>
          </div>

          <div id="prescriptionList" class="space-y-3">
            <!-- Cards injected by JS -->
          </div>
        </section>

        <!-- Lab Reports Panel -->
        <section
          id="panelLabs"
          role="tabpanel"
          aria-labelledby="tabLabs"
          class="space-y-3 hidden opacity-0 translate-y-2 transition duration-700 ease-out delay-300"
          data-animate
        >
          <div class="flex items-center justify-between">
            <span class="text-[13px] text-slate-500">Your lab reports</span>
            <button
              id="addLabBtn"
              class="inline-flex items-center gap-2 h-10 px-3 rounded-xl bg-slate-900 text-white text-sm font-medium tracking-tight hover:opacity-95 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
              title="Add Lab Report"
            >
              <i data-lucide="plus" class="h-4 w-4"></i>
              Add Lab Report
            </button>
          </div>

          <div id="labList" class="space-y-3">
            <!-- Cards injected by JS -->
          </div>
        </section>

        <!-- Spacer -->
        <div class="h-8"></div>
      </main>
    </div>

    <!-- Modal (Bottom Sheet) -->
    <div
      id="modalOverlay"
      class="fixed inset-0 z-50 hidden"
      aria-hidden="true"
    >
      <div
        id="modalBackdrop"
        class="absolute inset-0 bg-slate-900/30 backdrop-blur-[2px] opacity-0 transition-opacity duration-300"
      ></div>
      <div
        id="modalSheet"
        class="absolute left-0 right-0 bottom-0 translate-y-full transition-transform duration-300"
      >
        <div class="mx-auto w-full max-w-md px-4 pb-[calc(env(safe-area-inset-bottom)+12px)]">
          <div class="bg-white rounded-2xl shadow-lg ring-1 ring-slate-200 p-4">
            <div class="flex items-center justify-between mb-2">
              <h3 id="modalTitle" class="text-[20px] tracking-tight font-semibold text-slate-900">
                Add Item
              </h3>
              <button
                id="modalClose"
                class="h-9 w-9 rounded-xl flex items-center justify-center ring-1 ring-slate-200 hover:bg-slate-50 hover:ring-slate-300 transition"
                aria-label="Close"
              >
                <i data-lucide="x" class="h-5 w-5 text-slate-700"></i>
              </button>
            </div>
            <p id="modalDescription" class="text-sm text-slate-500 mb-3">Fill the details below.</p>

            <form id="modalForm" class="space-y-3" novalidate>
              <!-- Dynamic Fields -->
            </form>

            <div class="pt-3 mt-2 border-t border-slate-200 flex items-center gap-2">
              <button
                id="modalSave"
                class="flex-1 h-11 rounded-xl bg-slate-900 text-white text-sm font-medium tracking-tight hover:opacity-95 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-400"
              >
                Save
              </button>
              <button
                id="modalCancel"
                class="h-11 px-4 rounded-xl ring-1 ring-slate-200 text-slate-700 text-sm font-medium hover:bg-slate-50"
              >
                Cancel
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Templates -->
    <template id="prescriptionCardTemplate">
      <article class="bg-white rounded-xl shadow-sm ring-1 ring-slate-200 p-4">
        <div class="flex items-start justify-between">
          <div>
            <h4 class="text-[16px] tracking-tight font-semibold text-slate-900">
              <span data-field="doctorName">Doctor Name</span>
            </h4>
            <p class="text-xs text-slate-500 mt-0.5">
              <i data-lucide="calendar" class="inline-block h-3.5 w-3.5 mr-1 -mt-0.5"></i>
              <span data-field="date">—</span>
            </p>
          </div>
          <div data-field="thumbWrap" class="ml-3 shrink-0 hidden">
            <img
              data-field="thumb"
              class="h-12 w-12 rounded-lg object-cover ring-1 ring-slate-200"
              alt="Prescription"
              src=""
            />
          </div>
        </div>
        <div class="mt-3">
          <p
            data-field="desc"
            class="text-sm text-slate-700"
            style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;"
          ></p>
          <button
            data-action="toggleDesc"
            class="mt-1 text-xs text-slate-600 hover:text-slate-900 underline underline-offset-2"
          >
            Read more
          </button>
        </div>
        <div class="mt-3 pt-3 border-t border-slate-200 flex items-center gap-2">
          <button
            data-action="update"
            class="h-9 px-3 rounded-xl ring-1 ring-slate-200 hover:bg-slate-50 text-slate-700 text-sm flex items-center gap-2"
          >
            <i data-lucide="pencil" class="h-4 w-4"></i>
            Update
          </button>
          <button
            data-action="share"
            class="h-9 px-3 rounded-xl ring-1 ring-slate-200 hover:bg-slate-50 text-slate-700 text-sm flex items-center gap-2"
          >
            <i data-lucide="share-2" class="h-4 w-4"></i>
            Share
          </button>
          <button
            data-action="delete"
            class="ml-auto h-9 px-3 rounded-xl ring-1 ring-red-200 text-red-600 hover:bg-red-50 text-sm flex items-center gap-2"
          >
            <i data-lucide="trash-2" class="h-4 w-4"></i>
            Delete
          </button>
        </div>
      </article>
    </template>

    <template id="labCardTemplate">
      <article class="bg-white rounded-xl shadow-sm ring-1 ring-slate-200 p-4">
        <div class="flex items-start justify-between">
          <div>
            <h4 class="text-[16px] tracking-tight font-semibold text-slate-900">
              <span data-field="reportName">Report Name</span>
            </h4>
            <p class="text-xs text-slate-500 mt-0.5">
              <i data-lucide="calendar" class="inline-block h-3.5 w-3.5 mr-1 -mt-0.5"></i>
              <span data-field="date">—</span>
            </p>
          </div>
          <div class="ml-3 shrink-0">
            <div
              data-field="thumbWrap"
              class="h-12 w-12 rounded-lg ring-1 ring-slate-200 overflow-hidden bg-slate-100 flex items-center justify-center"
            >
              <img data-field="thumb" class="h-full w-full object-cover hidden" alt="Report" />
              <i data-lucide="file-text" class="h-5 w-5 text-slate-500"></i>
            </div>
          </div>
        </div>
        <div class="mt-3">
          <p
            data-field="desc"
            class="text-sm text-slate-700"
            style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;"
          ></p>
          <button
            data-action="toggleDesc"
            class="mt-1 text-xs text-slate-600 hover:text-slate-900 underline underline-offset-2"
          >
            Read more
          </button>
        </div>
        <div class="mt-3 pt-3 border-t border-slate-200 flex items-center gap-2">
          <button
            data-action="update"
            class="h-9 px-3 rounded-xl ring-1 ring-slate-200 hover:bg-slate-50 text-slate-700 text-sm flex items-center gap-2"
          >
            <i data-lucide="pencil" class="h-4 w-4"></i>
            Update
          </button>
          <button
            data-action="share"
            class="h-9 px-3 rounded-xl ring-1 ring-slate-200 hover:bg-slate-50 text-slate-700 text-sm flex items-center gap-2"
          >
            <i data-lucide="share-2" class="h-4 w-4"></i>
            Share
          </button>
          <button
            data-action="delete"
            class="ml-auto h-9 px-3 rounded-xl ring-1 ring-red-200 text-red-600 hover:bg-red-50 text-sm flex items-center gap-2"
          >
            <i data-lucide="trash-2" class="h-4 w-4"></i>
            Delete
          </button>
        </div>
      </article>
    </template>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      // Initialize icons helper
      function paintIcons(root = document) {
        lucide.createIcons({
          attrs: { 'stroke-width': 1.5 },
          icons: undefined,
          nameAttr: 'data-lucide',
          attrs: {},
          class: undefined,
          // Re-scan root
          node: root,
        });
      }

      // Animation in
      function reveal() {
        document.querySelectorAll('[data-animate]').forEach((el, i) => {
          requestAnimationFrame(() => {
            el.classList.remove('opacity-0', 'translate-y-2');
            el.classList.add('opacity-100', 'translate-y-0');
          });
        });
      }

      // State
      const state = {
        activeTab: 'prescriptions',
        editingId: null,
        editingType: null,
        items: {
          prescriptions: [
            {
              id: crypto.randomUUID(),
              doctorName: 'Dr. Meera Kapoor',
              description:
                'Take one tablet after meals, twice a day. Stay hydrated and avoid strenuous activity for 48 hours. Follow-up after 1 week or earlier if symptoms worsen.',
              date: '2025-08-02',
              image:
                'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?q=80&w=800&auto=format&fit=crop',
            },
            {
              id: crypto.randomUUID(),
              doctorName: 'Dr. Rohan Iyer',
              description:
                'Topical ointment to be applied sparingly, not more than 3 times daily. Keep out of direct sunlight. Do not mix with other creams.',
              date: '2025-07-21',
              image: '',
            },
          ],
          labs: [
            {
              id: crypto.randomUUID(),
              reportName: 'Complete Blood Count (CBC)',
              description:
                'All parameters within normal range. Mild variations noted in lymphocyte count; no immediate intervention recommended. Review in 6 months.',
              date: '2025-06-14',
              file:
                'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?q=80&w=800&auto=format&fit=crop',
              isImage: true,
            },
            {
              id: crypto.randomUUID(),
              reportName: 'Lipid Profile',
              description:
                'Slightly elevated LDL cholesterol. Recommend dietary changes and increased physical activity. Reassess in 3 months.',
              date: '2025-05-02',
              file: '',
              isImage: false,
            },
          ],
        },
      };

      // DOM refs
      const tabPrescriptions = document.getElementById('tabPrescriptions');
      const tabLabs = document.getElementById('tabLabs');
      const panelPrescriptions = document.getElementById('panelPrescriptions');
      const panelLabs = document.getElementById('panelLabs');

      const prescriptionList = document.getElementById('prescriptionList');
      const labList = document.getElementById('labList');
      const prescriptionTpl = document.getElementById('prescriptionCardTemplate');
      const labTpl = document.getElementById('labCardTemplate');

      const addPrescriptionBtn = document.getElementById('addPrescriptionBtn');
      const addLabBtn = document.getElementById('addLabBtn');

      // Modal refs
      const modalOverlay = document.getElementById('modalOverlay');
      const modalBackdrop = document.getElementById('modalBackdrop');
      const modalSheet = document.getElementById('modalSheet');
      const modalClose = document.getElementById('modalClose');
      const modalCancel = document.getElementById('modalCancel');
      const modalSave = document.getElementById('modalSave');
      const modalTitle = document.getElementById('modalTitle');
      const modalDescription = document.getElementById('modalDescription');
      const modalForm = document.getElementById('modalForm');

      // Self details refs
      const dobInput = document.getElementById('dobInput');
      const ageY = document.getElementById('ageY');
      const ageM = document.getElementById('ageM');
      const ageD = document.getElementById('ageD');
      const heightInput = document.getElementById('heightInput');
      const weightInput = document.getElementById('weightInput');
      const bmiOutput = document.getElementById('bmiOutput');
      const bmiNote = document.getElementById('bmiNote');

      // Helpers
      function fmtDate(dateStr) {
        try {
          const d = new Date(dateStr);
          return d.toLocaleDateString(undefined, {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
          });
        } catch {
          return dateStr;
        }
      }

      function calcAgeParts(dob) {
        if (!(dob instanceof Date) || isNaN(dob)) return { y: '–', m: '–', d: '–' };
        const now = new Date();
        let y = now.getFullYear() - dob.getFullYear();
        let m = now.getMonth() - dob.getMonth();
        let d = now.getDate() - dob.getDate();
        if (d < 0) {
          m -= 1;
          const prevMonthDays = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
          d += prevMonthDays;
        }
        if (m < 0) {
          y -= 1;
          m += 12;
        }
        return { y, m, d };
      }

      function updateAge() {
        const val = dobInput.value;
        if (!val) {
          ageY.textContent = '–'; ageM.textContent = '–'; ageD.textContent = '–';
          return;
        }
        const parts = calcAgeParts(new Date(val + 'T00:00:00'));
        ageY.textContent = parts.y;
        ageM.textContent = parts.m;
        ageD.textContent = parts.d;
      }

      function updateBMI() {
        const h = parseFloat(heightInput.value);
        const w = parseFloat(weightInput.value);
        if (!h || !w || h <= 0 || w <= 0) {
          bmiOutput.value = '';
          bmiNote.textContent = 'Auto-calculated';
          return;
        }
        const bmi = w / Math.pow(h / 100, 2);
        const rounded = Math.round(bmi * 10) / 10;
        bmiOutput.value = String(rounded);
        let note = 'Auto-calculated';
        if (rounded < 18.5) note = 'Underweight';
        else if (rounded < 25) note = 'Healthy';
        else if (rounded < 30) note = 'Overweight';
        else note = 'Obese';
        bmiNote.textContent = note;
      }

      // Rendering
      function renderPrescriptions() {
        prescriptionList.innerHTML = '';
        if (!state.items.prescriptions.length) {
          prescriptionList.innerHTML = `
            <div class="bg-white rounded-xl ring-1 ring-slate-200 p-4 text-center text-sm text-slate-500">No prescriptions yet.</div>
          `;
        }
        state.items.prescriptions.forEach((item) => {
          const card = prescriptionTpl.content.firstElementChild.cloneNode(true);
          card.dataset.id = item.id;
          card.querySelector('[data-field="doctorName"]').textContent = item.doctorName;
          card.querySelector('[data-field="date"]').textContent = fmtDate(item.date);
          const descEl = card.querySelector('[data-field="desc"]');
          descEl.textContent = item.description;
          const toggleBtn = card.querySelector('[data-action="toggleDesc"]');
          let expanded = false;
          toggleBtn.addEventListener('click', () => {
            expanded = !expanded;
            if (expanded) {
              descEl.style.webkitLineClamp = 'unset';
              descEl.style.overflow = 'visible';
              toggleBtn.textContent = 'Show less';
            } else {
              descEl.style.webkitLineClamp = '3';
              descEl.style.overflow = 'hidden';
              toggleBtn.textContent = 'Read more';
            }
          });

          if (item.image) {
            const wrap = card.querySelector('[data-field="thumbWrap"]');
            const img = card.querySelector('[data-field="thumb"]');
            img.src = item.image;
            img.alt = 'Prescription image';
            wrap.classList.remove('hidden');
          }

          card.querySelector('[data-action="update"]').addEventListener('click', () => openModal('prescription', item));
          card.querySelector('[data-action="delete"]').addEventListener('click', () => deleteItem('prescriptions', item.id));
          card.querySelector('[data-action="share"]').addEventListener('click', () => shareItem('Prescription', item.doctorName, item.date));

          prescriptionList.appendChild(card);
          paintIcons(card);
        });
      }

      function renderLabs() {
        labList.innerHTML = '';
        if (!state.items.labs.length) {
          labList.innerHTML = `
            <div class="bg-white rounded-xl ring-1 ring-slate-200 p-4 text-center text-sm text-slate-500">No lab reports yet.</div>
          `;
        }
        state.items.labs.forEach((item) => {
          const card = labTpl.content.firstElementChild.cloneNode(true);
          card.dataset.id = item.id;
          card.querySelector('[data-field="reportName"]').textContent = item.reportName;
          card.querySelector('[data-field="date"]').textContent = fmtDate(item.date);
          const descEl = card.querySelector('[data-field="desc"]');
          descEl.textContent = item.description;
          const toggleBtn = card.querySelector('[data-action="toggleDesc"]');
          let expanded = false;
          toggleBtn.addEventListener('click', () => {
            expanded = !expanded;
            if (expanded) {
              descEl.style.webkitLineClamp = 'unset';
              descEl.style.overflow = 'visible';
              toggleBtn.textContent = 'Show less';
            } else {
              descEl.style.webkitLineClamp = '3';
              descEl.style.overflow = 'hidden';
              toggleBtn.textContent = 'Read more';
            }
          });

          const thumbWrap = card.querySelector('[data-field="thumbWrap"]');
          const img = card.querySelector('[data-field="thumb"]');
          if (item.file && item.isImage) {
            img.src = item.file;
            img.classList.remove('hidden');
            const fileIcon = thumbWrap.querySelector('[data-lucide="file-text"]')?.parentElement;
            if (fileIcon) thumbWrap.removeChild(fileIcon);
          }

          card.querySelector('[data-action="update"]').addEventListener('click', () => openModal('lab', item));
          card.querySelector('[data-action="delete"]').addEventListener('click', () => deleteItem('labs', item.id));
          card.querySelector('[data-action="share"]').addEventListener('click', () => shareItem('Lab Report', item.reportName, item.date));

          labList.appendChild(card);
          paintIcons(card);
        });
      }

      function deleteItem(type, id) {
        const listKey = type === 'labs' ? 'labs' : 'prescriptions';
        state.items[listKey] = state.items[listKey].filter((x) => x.id !== id);
        if (listKey === 'prescriptions') renderPrescriptions();
        else renderLabs();
      }

      async function shareItem(kind, title, date) {
        const text = `${kind}: ${title} • ${fmtDate(date)}`;
        if (navigator.share) {
          try {
            await navigator.share({ title: kind, text });
          } catch (e) {}
        } else {
          await navigator.clipboard.writeText(text);
          alert('Link copied to clipboard.');
        }
      }

      // Tabs
      function setActiveTab(tab) {
        state.activeTab = tab;
        const isPres = tab === 'prescriptions';
        tabPrescriptions.setAttribute('aria-selected', String(isPres));
        tabLabs.setAttribute('aria-selected', String(!isPres));
        tabPrescriptions.className = isPres
          ? 'flex-1 h-10 rounded-xl text-sm font-medium tracking-tight px-3 transition outline-none focus-visible:ring-2 focus-visible:ring-slate-400 bg-slate-900 text-white'
          : 'flex-1 h-10 rounded-xl text-sm font-medium tracking-tight px-3 transition outline-none focus-visible:ring-2 focus-visible:ring-slate-400 text-slate-700 hover:bg-slate-50';
        tabLabs.className = !isPres
          ? 'flex-1 h-10 rounded-xl text-sm font-medium tracking-tight px-3 transition outline-none focus-visible:ring-2 focus-visible:ring-slate-400 bg-slate-900 text-white'
          : 'flex-1 h-10 rounded-xl text-sm font-medium tracking-tight px-3 transition outline-none focus-visible:ring-2 focus-visible:ring-slate-400 text-slate-700 hover:bg-slate-50';

        panelPrescriptions.classList.toggle('hidden', !isPres);
        panelLabs.classList.toggle('hidden', isPres);
      }

      // Modal
      function openModal(kind, data = null) {
        state.editingType = kind; // 'prescription' or 'lab'
        state.editingId = data?.id ?? null;

        // Build form
        modalForm.innerHTML = '';
        if (kind === 'prescription') {
          modalTitle.textContent = state.editingId ? 'Update Prescription' : 'Add Prescription';
          modalDescription.textContent = 'Doctor details, description, date, and optional image.';
          modalForm.appendChild(fieldText('doctorName', 'Doctor Name', data?.doctorName || '', 'text', { required: true }));
          modalForm.appendChild(fieldTextarea('description', 'Description', data?.description || '', { required: true }));
          modalForm.appendChild(fieldDate('date', 'Date', data?.date || '', { required: true }));
          modalForm.appendChild(fieldFile('image', 'Upload Image (jpg/png)', !!data?.image, data?.image || ''));
        } else {
          modalTitle.textContent = state.editingId ? 'Update Lab Report' : 'Add Lab Report';
          modalDescription.textContent = 'Report name, description, date, and file upload.';
          modalForm.appendChild(fieldText('reportName', 'Report Name', data?.reportName || '', 'text', { required: true }));
          modalForm.appendChild(fieldTextarea('description', 'Description', data?.description || '', { required: true }));
          modalForm.appendChild(fieldDate('date', 'Date', data?.date || '', { required: true }));
          modalForm.appendChild(fieldFile('file', 'Upload File (pdf/jpg)', !!data?.file, data?.file || ''));
        }

        // Show modal
        modalOverlay.classList.remove('hidden');
        requestAnimationFrame(() => {
          modalBackdrop.classList.remove('opacity-0');
          modalBackdrop.classList.add('opacity-100');
          modalSheet.classList.remove('translate-y-full');
          modalSheet.classList.add('translate-y-0');
        });
        paintIcons(modalOverlay);
      }

      function closeModal() {
        modalBackdrop.classList.remove('opacity-100');
        modalBackdrop.classList.add('opacity-0');
        modalSheet.classList.remove('translate-y-0');
        modalSheet.classList.add('translate-y-full');
        setTimeout(() => modalOverlay.classList.add('hidden'), 300);
        state.editingId = null;
        state.editingType = null;
      }

      // Field builders
      function wrap(label, inputEl, hint = '') {
        const wrap = document.createElement('div');
        wrap.className = 'space-y-2';
        const lab = document.createElement('label');
        lab.className = 'text-[13px] text-slate-600';
        lab.textContent = label;
        wrap.appendChild(lab);
        wrap.appendChild(inputEl);
        if (hint) {
          const p = document.createElement('p');
          p.className = 'text-xs text-slate-500';
          p.textContent = hint;
          wrap.appendChild(p);
        }
        return wrap;
      }

      function fieldText(name, label, value, type = 'text', opts = {}) {
        const input = document.createElement('input');
        input.type = type;
        input.name = name;
        input.value = value;
        input.placeholder = label;
        input.required = !!opts.required;
        input.className = 'w-full h-11 rounded-xl border-0 ring-1 ring-slate-200 focus:ring-2 focus:ring-slate-900 bg-white px-3 text-sm text-slate-900 placeholder-slate-400 transition';
        return wrap(label, input);
      }

      function fieldTextarea(name, label, value, opts = {}) {
        const ta = document.createElement('textarea');
        ta.name = name;
        ta.value = value;
        ta.placeholder = 'Type here...';
        ta.required = !!opts.required;
        ta.rows = 4;
        ta.className = 'w-full rounded-xl border-0 ring-1 ring-slate-200 focus:ring-2 focus:ring-slate-900 bg-white px-3 py-2 text-sm text-slate-900 placeholder-slate-400 transition';
        return wrap(label, ta);
      }

      function fieldDate(name, label, value, opts = {}) {
        const input = document.createElement('input');
        input.type = 'date';
        input.name = name;
        input.value = value;
        input.required = !!opts.required;
        input.className = 'w-full h-11 rounded-xl border-0 ring-1 ring-slate-200 focus:ring-2 focus:ring-slate-900 bg-white px-3 text-sm text-slate-900 placeholder-slate-400 transition';
        return wrap(label, input);
      }

      function fieldFile(name, label, hasExisting, existingUrl) {
        const div = document.createElement('div');
        const input = document.createElement('input');
        input.type = 'file';
        input.name = name;
        input.accept = name === 'file' ? '.pdf,image/*' : 'image/*';
        input.className = 'block w-full text-sm text-slate-700 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:bg-slate-900 file:text-white file:text-sm hover:file:opacity-95 file:cursor-pointer cursor-pointer';
        const preview = document.createElement('div');
        preview.className = 'mt-2 flex items-center gap-2';
        if (hasExisting && existingUrl) {
          const thumb = document.createElement('img');
          thumb.src = existingUrl;
          thumb.alt = 'Preview';
          thumb.className = 'h-12 w-12 rounded-lg ring-1 ring-slate-200 object-cover';
          preview.appendChild(thumb);
        }
        input.addEventListener('change', (e) => {
          const f = e.target.files?.[0];
          if (!f) return;
          preview.innerHTML = '';
          if (f.type.startsWith('image/')) {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(f);
            img.className = 'h-12 w-12 rounded-lg ring-1 ring-slate-200 object-cover';
            preview.appendChild(img);
          } else {
            const pill = document.createElement('div');
            pill.className = 'h-8 px-3 rounded-full bg-slate-100 text-slate-700 text-xs flex items-center gap-2 ring-1 ring-slate-200';
            const icon = document.createElement('i');
            icon.setAttribute('data-lucide', 'file-text');
            icon.className = 'h-4 w-4';
            const span = document.createElement('span');
            span.textContent = f.name;
            pill.appendChild(icon);
            pill.appendChild(span);
            preview.appendChild(pill);
            paintIcons(pill);
          }
        });
        const container = wrap(label, input);
        container.appendChild(preview);
        return container;
      }

      // Modal save
      modalSave.addEventListener('click', (e) => {
        e.preventDefault();
        const form = new FormData(modalForm);
        const kind = state.editingType;
        if (!kind) return;

        if (kind === 'prescription') {
          const payload = {
            doctorName: String(form.get('doctorName') || '').trim(),
            description: String(form.get('description') || '').trim(),
            date: String(form.get('date') || ''),
            image: '',
          };
          const file = form.get('image');
          if (file && file instanceof File && file.size > 0 && file.type.startsWith('image/')) {
            payload.image = URL.createObjectURL(file);
          }
          if (!payload.doctorName || !payload.description || !payload.date) {
            alert('Please fill all required fields.');
            return;
          }
          if (state.editingId) {
            const idx = state.items.prescriptions.findIndex((x) => x.id === state.editingId);
            if (idx >= 0) state.items.prescriptions[idx] = { ...state.items.prescriptions[idx], ...payload };
          } else {
            state.items.prescriptions.unshift({ id: crypto.randomUUID(), ...payload });
          }
          renderPrescriptions();
        } else {
          const payload = {
            reportName: String(form.get('reportName') || '').trim(),
            description: String(form.get('description') || '').trim(),
            date: String(form.get('date') || ''),
            file: '',
            isImage: false,
          };
          const file = form.get('file');
          if (file && file instanceof File && file.size > 0) {
            payload.file = URL.createObjectURL(file);
            payload.isImage = file.type.startsWith('image/');
          }
          if (!payload.reportName || !payload.description || !payload.date) {
            alert('Please fill all required fields.');
            return;
          }
          if (state.editingId) {
            const idx = state.items.labs.findIndex((x) => x.id === state.editingId);
            if (idx >= 0) state.items.labs[idx] = { ...state.items.labs[idx], ...payload };
          } else {
            state.items.labs.unshift({ id: crypto.randomUUID(), ...payload });
          }
          renderLabs();
        }

        closeModal();
      });

      modalClose.addEventListener('click', closeModal);
      modalCancel.addEventListener('click', (e) => { e.preventDefault(); closeModal(); });
      modalBackdrop.addEventListener('click', closeModal);

      // Tab events
      tabPrescriptions.addEventListener('click', () => setActiveTab('prescriptions'));
      tabLabs.addEventListener('click', () => setActiveTab('labs'));

      // Add buttons
      addPrescriptionBtn.addEventListener('click', () => openModal('prescription'));
      addLabBtn.addEventListener('click', () => openModal('lab'));

      // Self details events
      dobInput.addEventListener('change', updateAge);
      heightInput.addEventListener('input', updateBMI);
      weightInput.addEventListener('input', updateBMI);

      // Init
      document.addEventListener('DOMContentLoaded', () => {
        paintIcons(document);
        reveal();
        renderPrescriptions();
        renderLabs();
        updateAge();
        updateBMI();
      });
    </script>
  </body>
</html>
