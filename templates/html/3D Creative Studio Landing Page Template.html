                // Camera subtle movement
                state.camera.position.x = THREE.MathUtils.lerp(state.camera.position.x, (state.mouse.x * 0.5), 0.05);

            return (

                    <Canvas

                        dpr={[1, 1.5]}

                        <color attach="background" args={['#030303']} />
                        <ScrollControls pages={5} damping={0.15}>
