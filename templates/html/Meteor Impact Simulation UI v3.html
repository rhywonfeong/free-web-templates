    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteor Strike Simulator</title>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes meteor-fall {
            0% { transform: translate(-50%, -200px) rotate(45deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(-50%, 200px) rotate(45deg); opacity: 0; }
        }
        
        @keyframes impact {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        @keyframes earth-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        @keyframes earth-spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        
        @keyframes continents-spin {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-100%); }
        }
        
        @keyframes clouds-spin {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-120%); }
        }
        
        .meteor-trail {
            position: absolute;
            width: 3px;
            height: 30px;
            background: linear-gradient(45deg, #ff6b35 0%, #ff9500 50%, #ffff00 100%);
            border-radius: 50px;
            animation: meteor-fall 1.5s ease-in forwards;
            box-shadow: 0 0 10px #ff6b35;
        }
        
        .impact-effect {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ff6b35 0%, #ff0000 50%, transparent 100%);
            border-radius: 50%;
            animation: impact 0.8s ease-out forwards;
        }
        
        .earth-shake {
            animation: earth-shake 0.5s ease-in-out;
        }
        
        .earth-gradient {
            background: radial-gradient(circle at 30% 30%, #3b82f6, #1d4ed8, #1e40af, #1e3a8a);
            position: relative;
            overflow: hidden;
        }
        
        .earth-continents {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(ellipse 60px 45px at 25% 40%, #22c55e 0%, #16a34a 30%, transparent 60%),
                radial-gradient(ellipse 50px 35px at 70% 25%, #15803d 0%, #166534 20%, transparent 50%),
                radial-gradient(ellipse 55px 60px at 60% 70%, #a3a3a3 0%, #525252 20%, transparent 50%),
                radial-gradient(ellipse 40px 30px at 15% 75%, #22c55e 0%, #15803d 30%, transparent 60%),
                radial-gradient(ellipse 35px 25px at 80% 60%, #a16207 0%, #92400e 20%, transparent 50%),
                radial-gradient(ellipse 45px 40px at 125% 45%, #22c55e 0%, #16a34a 30%, transparent 60%),
                radial-gradient(ellipse 40px 30px at 140% 25%, #15803d 0%, #166534 20%, transparent 50%),
                radial-gradient(ellipse 50px 55px at 130% 70%, #a3a3a3 0%, #525252 20%, transparent 50%);
            animation: continents-spin 20s linear infinite;
            border-radius: 50%;
        }
        
        .earth-clouds {
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(ellipse 50px 20px at 80% 30%, rgba(255,255,255,0.4) 0%, transparent 70%),
                radial-gradient(ellipse 40px 15px at 20% 60%, rgba(255,255,255,0.3) 0%, transparent 60%),
                radial-gradient(ellipse 30px 12px at 45% 20%, rgba(255,255,255,0.2) 0%, transparent 50%),
                radial-gradient(ellipse 35px 18px at 120% 35%, rgba(255,255,255,0.3) 0%, transparent 65%),
                radial-gradient(ellipse 25px 10px at 110% 65%, rgba(255,255,255,0.2) 0%, transparent 55%);
            animation: clouds-spin 15s linear infinite;
            border-radius: 50%;
        }
        
        .earth-container {
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        .earth-sphere {
            transform-style: preserve-3d;
            animation: earth-spin 30s linear infinite;
        }
    </style>

      body { font-family: 'Inter', sans-serif; }

<body class="bg-gray-950 min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
    <!-- Background stars -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-10 left-10 w-1 h-1 bg-white rounded-full opacity-80"></div>
        <div class="absolute top-20 right-20 w-1 h-1 bg-white rounded-full opacity-60"></div>
        <div class="absolute top-32 left-32 w-0.5 h-0.5 bg-white rounded-full opacity-70"></div>
        <div class="absolute bottom-32 right-32 w-1 h-1 bg-white rounded-full opacity-50"></div>
        <div class="absolute bottom-20 left-16 w-0.5 h-0.5 bg-white rounded-full opacity-80"></div>
        <div class="absolute top-40 right-40 w-0.5 h-0.5 bg-white rounded-full opacity-60"></div>
    </div>

    <!-- Header -->
    <div class="text-center mb-8 z-10">
        <h1 class="text-4xl font-semibold text-white mb-2 tracking-tight">Meteor Strike Simulator</h1>
        <p class="text-gray-400 text-lg">Click anywhere on Earth to launch meteors</p>
    </div>

    <!-- Earth Container -->
    <div class="relative z-10 earth-container">
        <div class="earth-sphere">
            <div id="earth" class="w-80 h-80 rounded-full earth-gradient cursor-crosshair relative shadow-2xl shadow-blue-500/20">
                <div class="earth-continents"></div>
                <div class="earth-clouds"></div>
                
                <!-- Earth highlight -->
                <div class="absolute top-8 left-8 w-16 h-16 rounded-full bg-gradient-to-br from-white/30 to-transparent"></div>
            </div>
        </div>
    </div>

    <!-- Stats Panel -->
    <div class="mt-8 bg-gray-900/50 backdrop-blur-sm border border-gray-800 rounded-lg p-6 z-10">
        <div class="flex items-center justify-between space-x-8">
            <div class="text-center">
                <div class="text-2xl font-semibold text-white" id="meteor-count">0</div>
                <div class="text-sm text-gray-400">Meteors Launched</div>
            </div>
            <div class="w-px h-12 bg-gray-700"></div>
            <div class="text-center">
                <div class="text-2xl font-semibold text-red-400" id="impact-count">0</div>
                <div class="text-sm text-gray-400">Impacts</div>
            </div>
            <div class="w-px h-12 bg-gray-700"></div>
            <div class="text-center">
                <button id="pause-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md transition-colors duration-200 border border-blue-500 mr-2">
                    Pause Spin
                </button>
                <button id="reset-btn" class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-white rounded-md transition-colors duration-200 border border-gray-700">
                    Reset
                </button>
            </div>
        </div>
    </div>

    <!-- Instructions -->
    <div class="mt-6 text-center text-gray-500 text-sm z-10">
        <p>Click on different parts of Earth to see meteors strike from space</p>
        <p class="mt-1">Watch as Earth rotates in space</p>
    </div>

    <script>
        let meteorCount = 0;
        let impactCount = 0;
        let isPaused = false;
        
        const earth = document.getElementById('earth');
        const earthSphere = document.querySelector('.earth-sphere');
        const meteorCountEl = document.getElementById('meteor-count');
        const impactCountEl = document.getElementById('impact-count');
        const resetBtn = document.getElementById('reset-btn');
        const pauseBtn = document.getElementById('pause-btn');
        
        function createMeteor(x, y) {
            meteorCount++;
            meteorCountEl.textContent = meteorCount;
            
            const meteor = document.createElement('div');
            meteor.className = 'meteor-trail';
            
            // Position meteor above the click point
            meteor.style.left = x + 'px';
            meteor.style.top = (y - 200) + 'px';
            
            document.body.appendChild(meteor);
            
            // Create impact after delay
            setTimeout(() => {
                createImpact(x, y);
                shakeEarth();
                impactCount++;
                impactCountEl.textContent = impactCount;
            }, 1200);
            
            // Remove meteor after animation
            setTimeout(() => {
                meteor.remove();
            }, 1500);
        }
        
        function createImpact(x, y) {
            const impact = document.createElement('div');
            impact.className = 'impact-effect';
            impact.style.left = (x - 10) + 'px';
            impact.style.top = (y - 10) + 'px';
            
            document.body.appendChild(impact);
            
            setTimeout(() => {
                impact.remove();
            }, 800);
        }
        
        function shakeEarth() {
            earthSphere.classList.add('earth-shake');
            setTimeout(() => {
                earthSphere.classList.remove('earth-shake');
            }, 500);
        }
        
        function toggleSpin() {
            isPaused = !isPaused;
            if (isPaused) {
                earthSphere.style.animationPlayState = 'paused';
                document.querySelector('.earth-continents').style.animationPlayState = 'paused';
                document.querySelector('.earth-clouds').style.animationPlayState = 'paused';
                pauseBtn.textContent = 'Resume Spin';
                pauseBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700', 'border-blue-500');
                pauseBtn.classList.add('bg-green-600', 'hover:bg-green-700', 'border-green-500');
            } else {
                earthSphere.style.animationPlayState = 'running';
                document.querySelector('.earth-continents').style.animationPlayState = 'running';
                document.querySelector('.earth-clouds').style.animationPlayState = 'running';
                pauseBtn.textContent = 'Pause Spin';
                pauseBtn.classList.remove('bg-green-600', 'hover:bg-green-700', 'border-green-500');
                pauseBtn.classList.add('bg-blue-600', 'hover:bg-blue-700', 'border-blue-500');
            }
        }
        
        earth.addEventListener('click', (e) => {
            const rect = earth.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // Calculate distance from center
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;
            const distanceFromCenter = Math.sqrt(
                Math.pow(clickX - rect.width / 2, 2) + 
                Math.pow(clickY - rect.height / 2, 2)
            );
            
            // Only create meteor if click is within Earth's radius
            if (distanceFromCenter <= rect.width / 2) {
                createMeteor(e.clientX, e.clientY);
            }
        });
        
        pauseBtn.addEventListener('click', toggleSpin);
        
        resetBtn.addEventListener('click', () => {
            meteorCount = 0;
            impactCount = 0;
            meteorCountEl.textContent = '0';
            impactCountEl.textContent = '0';
            
            // Remove any existing meteors and impacts
            document.querySelectorAll('.meteor-trail, .impact-effect').forEach(el => {
                el.remove();
            });
        });
        
        // Add some random background meteor activity
        setInterval(() => {
            if (Math.random() < 0.1) { // 10% chance every 2 seconds
                const randomX = Math.random() * window.innerWidth;
                const randomY = Math.random() * window.innerHeight;
                
                // Only if not clicking on Earth
                const earthRect = earth.getBoundingClientRect();
                const distanceFromEarth = Math.sqrt(
                    Math.pow(randomX - (earthRect.left + earthRect.width / 2), 2) + 
                    Math.pow(randomY - (earthRect.top + earthRect.height / 2), 2)
                );
                
                if (distanceFromEarth > earthRect.width / 2 + 50) {
                    const backgroundMeteor = document.createElement('div');
                    backgroundMeteor.className = 'meteor-trail';
                    backgroundMeteor.style.left = randomX + 'px';
                    backgroundMeteor.style.top = (randomY - 200) + 'px';
                    backgroundMeteor.style.opacity = '0.3';
                    
                    document.body.appendChild(backgroundMeteor);
                    
                    setTimeout(() => {
                        backgroundMeteor.remove();
                    }, 1500);
                }
            }
        }, 2000);
    </script>
</body>
