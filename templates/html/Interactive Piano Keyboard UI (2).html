<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Piano Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        .piano-key-pressed { transform: translateY(1px); }
        .recording-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-semibold text-gray-900 tracking-tight mb-2">Piano Studio</h1>
            <p class="text-gray-600">Create beautiful music with our interactive piano keyboard</p>
        </div>

        <!-- Control Panel -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Left Controls -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Octave</label>
                        <div class="relative">
                            <select id="octave-selector" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="1">Octave 1</option>
                                <option value="2">Octave 2</option>
                                <option value="3">Octave 3</option>
                                <option value="4" selected>Octave 4</option>
                                <option value="5">Octave 5</option>
                                <option value="6">Octave 6</option>
                                <option value="7">Octave 7</option>
                            </select>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Waveform</label>
                        <select id="wave-type-selector" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="sine">Sine Wave</option>
                            <option value="square">Square Wave</option>
                            <option value="sawtooth">Sawtooth Wave</option>
                            <option value="triangle">Triangle Wave</option>
                        </select>
                    </div>
                </div>

                <!-- Center Controls -->
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Volume</label>
                        <div class="flex items-center space-x-3">
                            <i data-lucide="volume-2" class="w-4 h-4 text-gray-500"></i>
                            <input type="range" min="0" max="100" value="30" id="volume-slider" class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                            <span id="volume-value" class="text-sm text-gray-600 w-10">30%</span>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Sustain</label>
                        <div class="flex items-center space-x-3">
                            <i data-lucide="clock" class="w-4 h-4 text-gray-500"></i>
                            <input type="range" min="10" max="200" value="50" id="sustain-slider" class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                            <span id="sustain-value" class="text-sm text-gray-600 w-10">0.5s</span>
                        </div>
                    </div>
                </div>

                <!-- Right Controls -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <label class="text-sm font-medium text-gray-700">Show Labels</label>
                        <button id="show-labels" class="relative inline-flex h-6 w-11 items-center rounded-full bg-blue-600 transition-colors duration-200">
                            <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform duration-200 translate-x-6"></span>
                        </button>
                    </div>
                    
                    <div class="flex space-x-2">
                        <button id="record-button" class="flex-1 flex items-center justify-center space-x-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                            <i data-lucide="circle" class="w-4 h-4"></i>
                            <span>Record</span>
                        </button>
                        <button id="play-button" class="flex-1 flex items-center justify-center space-x-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            <i data-lucide="play" class="w-4 h-4"></i>
                            <span>Play</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Status Bar -->
            <div class="mt-6 pt-6 border-t border-gray-200">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="flex items-center space-x-2">
                            <i data-lucide="music" class="w-4 h-4 text-gray-500"></i>
                            <span class="text-sm text-gray-600">Current:</span>
                            <span id="current-note-display" class="text-sm font-medium text-gray-900">No Note</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <i data-lucide="layers" class="w-4 h-4 text-gray-500"></i>
                            <span id="current-octave-display" class="text-sm font-medium text-gray-900">Octave 4</span>
                        </div>
                    </div>
                    <div id="recording-status" class="hidden flex items-center space-x-2 text-red-600">
                        <div class="w-2 h-2 bg-red-600 rounded-full recording-pulse"></div>
                        <span class="text-sm font-medium">Recording...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Piano Container -->
        <div class="bg-gradient-to-b from-gray-800 to-gray-900 rounded-xl shadow-lg p-6 mb-6">
            <div id="piano" class="flex justify-center relative overflow-x-auto">
                <!-- Keys will be generated by JavaScript -->
            </div>
        </div>

        <!-- Instructions -->
        <div class="text-center text-gray-600">
            <p class="text-sm">Click on the piano keys to play notes. Use the controls above to customize your sound and record your compositions.</p>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', function() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            let currentOctave = 4;
            let waveType = 'sine';
            let volume = 0.3;
            let sustain = 0.5;
            let showLabels = true;
            let isRecording = false;
            let recordedNotes = [];
            let recordStartTime = 0;
            
            function playNote(frequency, duration) {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.type = waveType;
                oscillator.frequency.value = frequency;
                
                gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + duration);
                
                return { oscillator, gainNode };
            }
            
            const baseNotes = {
                'C': 261.63, 'C#': 277.18, 'D': 293.66, 'D#': 311.13,
                'E': 329.63, 'F': 349.23, 'F#': 369.99, 'G': 392.00,
                'G#': 415.30, 'A': 440.00, 'A#': 466.16, 'B': 493.88
            };
            
            function getFrequency(note, octave) {
                const baseFreq = baseNotes[note];
                const octaveDiff = octave - 4;
                return baseFreq * Math.pow(2, octaveDiff);
            }
            
            function generatePianoKeys() {
                const piano = document.getElementById('piano');
                piano.innerHTML = '';
                
                const whiteNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
                const blackNotes = ['C#', 'D#', 'F#', 'G#', 'A#'];
                const blackKeyPositions = [32, 80, 176, 224, 272];
                
                const keysContainer = document.createElement('div');
                keysContainer.className = 'relative flex';
                
                // Create white keys
                whiteNotes.forEach((note, index) => {
                    const key = document.createElement('div');
                    key.className = 'w-12 h-40 bg-white border border-gray-300 rounded-b-lg cursor-pointer transition-all duration-75 hover:bg-gray-50 flex items-end justify-center pb-3 text-xs text-gray-600 font-medium shadow-sm';
                    key.setAttribute('data-note', note);
                    if (showLabels) key.textContent = note + currentOctave;
                    keysContainer.appendChild(key);
                });
                
                // Add C for next octave
                const lastKey = document.createElement('div');
                lastKey.className = 'w-12 h-40 bg-white border border-gray-300 rounded-b-lg cursor-pointer transition-all duration-75 hover:bg-gray-50 flex items-end justify-center pb-3 text-xs text-gray-600 font-medium shadow-sm';
                lastKey.setAttribute('data-note', 'C');
                lastKey.setAttribute('data-next-octave', 'true');
                if (showLabels) lastKey.textContent = 'C' + (currentOctave + 1);
                keysContainer.appendChild(lastKey);
                
                // Create black keys
                blackNotes.forEach((note, index) => {
                    const key = document.createElement('div');
                    key.className = 'absolute w-8 h-24 bg-gray-900 rounded-b-lg cursor-pointer transition-all duration-75 hover:bg-gray-800 flex items-end justify-center pb-2 text-xs text-gray-300 font-medium shadow-lg z-10';
                    key.setAttribute('data-note', note);
                    key.style.left = blackKeyPositions[index] + 'px';
                    if (showLabels) key.textContent = note + currentOctave;
                    keysContainer.appendChild(key);
                });
                
                piano.appendChild(keysContainer);
                
                // Add event listeners
                const keys = keysContainer.querySelectorAll('[data-note]');
                keys.forEach(key => {
                    key.addEventListener('mousedown', function(e) {
                        e.preventDefault();
                        const note = this.getAttribute('data-note');
                        const isNextOctave = this.getAttribute('data-next-octave') === 'true';
                        const octave = isNextOctave ? currentOctave + 1 : currentOctave;
                        const frequency = getFrequency(note, octave);
                        
                        this.classList.add('piano-key-pressed');
                        if (this.classList.contains('bg-white')) {
                            this.classList.add('bg-gray-100');
                        } else {
                            this.classList.add('bg-gray-700');
                        }
                        
                        playNote(frequency, sustain);
                        document.getElementById('current-note-display').textContent = note + octave;
                        
                        if (isRecording) {
                            const time = (Date.now() - recordStartTime) / 1000;
                            recordedNotes.push({ note, octave, time, duration: sustain });
                        }
                    });
                    
                    key.addEventListener('mouseup', function() {
                        this.classList.remove('piano-key-pressed');
                        this.classList.remove('bg-gray-100', 'bg-gray-700');
                    });
                    
                    key.addEventListener('mouseleave', function() {
                        this.classList.remove('piano-key-pressed');
                        this.classList.remove('bg-gray-100', 'bg-gray-700');
                    });
                });
            }
            
            generatePianoKeys();
            
            // Event listeners for controls
            document.getElementById('octave-selector').addEventListener('change', function() {
                currentOctave = parseInt(this.value);
                document.getElementById('current-octave-display').textContent = 'Octave ' + currentOctave;
                generatePianoKeys();
            });
            
            document.getElementById('wave-type-selector').addEventListener('change', function() {
                waveType = this.value;
            });
            
            document.getElementById('volume-slider').addEventListener('input', function() {
                volume = this.value / 100;
                document.getElementById('volume-value').textContent = this.value + '%';
            });
            
            document.getElementById('sustain-slider').addEventListener('input', function() {
                sustain = this.value / 100;
                document.getElementById('sustain-value').textContent = sustain.toFixed(1) + 's';
            });
            
            document.getElementById('show-labels').addEventListener('click', function() {
                showLabels = !showLabels;
                if (showLabels) {
                    this.classList.add('bg-blue-600');
                    this.classList.remove('bg-gray-200');
                    this.children[0].classList.add('translate-x-6');
                    this.children[0].classList.remove('translate-x-1');
                } else {
                    this.classList.remove('bg-blue-600');
                    this.classList.add('bg-gray-200');
                    this.children[0].classList.remove('translate-x-6');
                    this.children[0].classList.add('translate-x-1');
                }
                generatePianoKeys();
            });
            
            document.getElementById('record-button').addEventListener('click', function() {
                if (!isRecording) {
                    isRecording = true;
                    recordedNotes = [];
                    recordStartTime = Date.now();
                    this.innerHTML = '<i data-lucide="square" class="w-4 h-4"></i><span>Stop</span>';
                    this.classList.remove('bg-red-600', 'hover:bg-red-700');
                    this.classList.add('bg-red-700', 'hover:bg-red-800');
                    document.getElementById('recording-status').classList.remove('hidden');
                    document.getElementById('play-button').disabled = true;
                } else {
                    isRecording = false;
                    this.innerHTML = '<i data-lucide="circle" class="w-4 h-4"></i><span>Record</span>';
                    this.classList.add('bg-red-600', 'hover:bg-red-700');
                    this.classList.remove('bg-red-700', 'hover:bg-red-800');
                    document.getElementById('recording-status').classList.add('hidden');
                    document.getElementById('play-button').disabled = false;
                }
                lucide.createIcons();
            });
            
            document.getElementById('play-button').addEventListener('click', function() {
                if (recordedNotes.length === 0) return;
                
                this.disabled = true;
                document.getElementById('record-button').disabled = true;
                
                let lastNoteTime = recordedNotes[recordedNotes.length - 1].time + recordedNotes[recordedNotes.length - 1].duration;
                
                recordedNotes.forEach(note => {
                    setTimeout(() => {
                        const frequency = getFrequency(note.note, note.octave);
                        playNote(frequency, note.duration);
                        document.getElementById('current-note-display').textContent = note.note + note.octave;
                    }, note.time * 1000);
                });
                
                setTimeout(() => {
                    this.disabled = false;
                    document.getElementById('record-button').disabled = false;
                    document.getElementById('current-note-display').textContent = 'No Note';
                }, lastNoteTime * 1000 + 100);
            });
        });
    </script>
</body>
</html>
