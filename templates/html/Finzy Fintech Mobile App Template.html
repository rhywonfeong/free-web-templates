<!DOCTYPE html>
<html lang="ru" class="dark">
  <head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fintech Mobile App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link

rel="stylesheet"
/>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
}
/* Hide scrollbar for horizontal scrolling areas */
.hide-scrollbar::-webkit-scrollbar {
display: none;
}
.hide-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
/* Subtle background glow effect */
.bg-glow {

height: 300px;
background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
border-radius: 50%;
pointer-events: none;
z-index: 0;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>

  <body
    class="bg-[#0a0a0c] text-white flex justify-center min-h-screen relative overflow-hidden"
  >
    <!-- Background glows -->
    <div class="bg-glow top-[-100px] left-[-100px]"></div>
    <div class="bg-glow bottom-[200px] right-[-150px] opacity-50"></div>

    <!-- Mobile Device Container -->
    <div
      class="w-full max-w-[400px] relative z-10 flex flex-col h-[100dvh] overflow-y-auto hide-scrollbar pb-24"
    >
      <!-- Status Bar (Simulated) -->
      <div
        class="flex justify-between items-center px-6 pt-4 pb-2 text-sm font-medium"
      >
        <span>9:41</span>
        <div class="flex gap-2 items-center">
          <i data-lucide="signal" class="w-4 h-4"></i>
          <i data-lucide="wifi" class="w-4 h-4"></i>
          <i data-lucide="battery-full" class="w-5 h-5"></i>
        </div>
      </div>

      <!-- Header -->
      <header class="flex justify-between items-center px-5 mt-2">
        <div
          class="w-10 h-10 rounded-full overflow-hidden border border-white/10 ring-2 ring-transparent hover:ring-purple-500/50 transition-all cursor-pointer"
        >
          <img
            src="https://i.pravatar.cc/150?u=a042581f4e29026704d"
            alt="User Avatar"
            class="w-full h-full object-cover"
          />
        </div>
        <div
          class="text-2xl font-semibold italic tracking-tight flex items-center gap-1 cursor-pointer"
        >
          Finzy
        </div>
        <button
          class="relative w-10 h-10 rounded-full bg-white/5 flex items-center justify-center border border-white/5 hover:bg-white/10 transition-colors"
        >
          <i data-lucide="bell" class="w-5 h-5 text-gray-300"></i>
          <span
            class="absolute top-2.5 right-3 w-2 h-2 bg-purple-500 rounded-full border border-[#0a0a0c]"
          ></span>
        </button>
      </header>

      <main class="flex-1 px-5 mt-6 flex flex-col gap-6">
        <!-- Total Balance Card -->
        <section
          class="bg-white/5 backdrop-blur-md rounded-3xl p-6 border border-white/10 relative overflow-hidden shadow-[0_8px_32px_rgba(0,0,0,0.4)]"
        >
          <!-- Inner subtle glow -->
          <div
            class="absolute top-0 right-0 w-32 h-32 bg-purple-600/20 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"
          ></div>

          <div class="flex items-center gap-2 text-gray-400 mb-2">
            <span class="text-base font-normal">Общий баланс</span>
            <button>
              <i
                data-lucide="eye"
                class="w-4 h-4 hover:text-white transition-colors"
              ></i>
            </button>
          </div>

          <div class="flex justify-between items-end mb-2">
            <div class="text-4xl font-semibold tracking-tight">198 213 ₽</div>

            <!-- Currency Toggle -->
            <div
              class="flex bg-black/40 rounded-full p-1 border border-white/5"
            >
              <button
                class="px-3 py-1 rounded-full bg-purple-600 text-sm font-medium text-white shadow-sm"
              >
                ₽
              </button>
              <button
                class="px-3 py-1 rounded-full text-gray-400 hover:text-white text-sm font-normal transition-colors"
              >
                $
              </button>
              <button
                class="px-3 py-1 rounded-full text-gray-400 hover:text-white text-sm font-normal transition-colors"
              >
                USDT
              </button>
            </div>
          </div>

          <div class="text-base text-gray-400">≈ 2 140 USDT</div>
        </section>

        <!-- Quick Actions -->
        <section class="grid grid-cols-4 gap-2 mt-2">
          <!-- Action Item -->
          <button class="flex flex-col items-center gap-3 group">
            <div
              class="w-14 h-14 rounded-2xl bg-purple-600 flex items-center justify-center shadow-[0_4px_12px_rgba(139,92,246,0.3)] group-hover:scale-105 transition-transform"
            >
              <i data-lucide="send" class="w-6 h-6 text-white"></i>
            </div>
            <div class="flex flex-col items-center">
              <span class="text-base font-medium text-gray-100">Отправить</span>
              <span class="text-xs text-gray-500 mt-0.5">Переводы</span>
            </div>
          </button>

          <!-- Action Item -->
          <button class="flex flex-col items-center gap-3 group">
            <div
              class="w-14 h-14 rounded-2xl bg-purple-600 flex items-center justify-center shadow-[0_4px_12px_rgba(139,92,246,0.3)] group-hover:scale-105 transition-transform"
            >
              <i data-lucide="download" class="w-6 h-6 text-white"></i>
            </div>
            <div class="flex flex-col items-center">
              <span class="text-base font-medium text-gray-100">Получить</span>
              <span class="text-xs text-gray-500 mt-0.5">Реквизиты и QR</span>
            </div>
          </button>

          <!-- Action Item -->
          <button class="flex flex-col items-center gap-3 group">
            <div
              class="w-14 h-14 rounded-2xl bg-purple-600 flex items-center justify-center shadow-[0_4px_12px_rgba(139,92,246,0.3)] group-hover:scale-105 transition-transform"
            >
              <i data-lucide="scan-line" class="w-6 h-6 text-white"></i>
            </div>
            <div class="flex flex-col items-center">
              <span class="text-base font-medium text-gray-100">Оплатить</span>
              <span class="text-xs text-gray-500 mt-0.5">QR и счета</span>
            </div>
          </button>

          <!-- Action Item -->
          <button class="flex flex-col items-center gap-3 group">
            <div
              class="w-14 h-14 rounded-2xl bg-purple-600 flex items-center justify-center shadow-[0_4px_12px_rgba(139,92,246,0.3)] group-hover:scale-105 transition-transform"
            >
              <i data-lucide="arrow-right-left" class="w-6 h-6 text-white"></i>
            </div>
            <div class="flex flex-col items-center">
              <span class="text-base font-medium text-gray-100">Обмен</span>
              <span class="text-xs text-gray-500 mt-0.5">Фиат и крипто</span>
            </div>
          </button>
        </section>

        <!-- Cards Section -->
        <section class="mt-4">
          <div class="flex justify-between items-end mb-4">
            <h2 class="text-xl font-semibold tracking-tight text-white">
              Карты
            </h2>
            <a
              href="#"
              class="text-sm font-medium text-purple-500 hover:text-purple-400 flex items-center gap-0.5"
            >
              Все карты
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </a>
          </div>

          <div
            class="flex gap-4 overflow-x-auto hide-scrollbar pb-2 -mx-5 px-5 snap-x"
          >
            <!-- Purple Card -->
            <div
              class="w-64 shrink-0 h-40 bg-gradient-to-br from-violet-700 via-indigo-900 to-slate-900 rounded-2xl p-5 relative overflow-hidden shadow-lg snap-center flex flex-col justify-between border border-white/10"
            >
              <!-- Abstract shapes -->
              <div
                class="absolute -top-10 -right-10 w-32 h-32 bg-purple-500/30 rounded-full blur-2xl"
              ></div>
              <div
                class="absolute bottom-0 left-0 w-24 h-24 bg-blue-500/20 rounded-full blur-xl"
              ></div>

              <div class="flex justify-between items-start relative z-10">
                <span class="text-xl font-semibold italic">Finzy</span>
                <span
                  class="bg-white/10 backdrop-blur-md px-2 py-1 rounded-md text-xs text-white border border-white/10"
                >
                  ₽ карта
                </span>
              </div>

              <div class="relative z-10">
                <div class="flex items-center gap-2 mb-2 text-gray-300">
                  <span class="tracking-widest text-lg mt-1">····</span>
                  <span class="text-base">4545</span>
                </div>
                <div class="flex justify-between items-end">
                  <span class="text-xl font-semibold tracking-tight text-white">
                    12 345 ₽
                  </span>
                  <!-- Simulated Mastercard Logo -->
                  <div class="flex">
                    <div
                      class="w-6 h-6 bg-red-500/80 rounded-full relative z-10 mix-blend-screen"
                    ></div>
                    <div
                      class="w-6 h-6 bg-yellow-500/80 rounded-full -ml-2 relative z-0 mix-blend-screen"
                    ></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Green Card -->
            <div
              class="w-64 shrink-0 h-40 bg-gradient-to-br from-[#0a2e28] via-[#0f443b] to-[#041a16] rounded-2xl p-5 relative overflow-hidden shadow-lg snap-center flex flex-col justify-between border border-white/10"
            >
              <div
                class="absolute -top-5 -right-5 w-28 h-28 bg-emerald-500/20 rounded-full blur-2xl"
              ></div>

              <div class="flex justify-between items-start relative z-10">
                <span class="text-xl font-semibold italic text-gray-200">
                  Finzy
                </span>
                <span
                  class="bg-white/5 backdrop-blur-md px-2 py-1 rounded-md text-xs text-gray-300 border border-white/10"
                >
                  USD карта
                </span>
              </div>

              <div class="relative z-10">
                <div class="flex items-center gap-2 mb-2 text-gray-400">
                  <span class="tracking-widest text-lg mt-1">····</span>
                  <span class="text-base">3459</span>
                </div>
                <div class="flex justify-between items-end">
                  <span
                    class="text-xl font-semibold tracking-tight text-gray-100"
                  >
                    1 200 $
                  </span>
                  <!-- Simulated Visa Logo -->
                  <span
                    class="text-xl font-bold italic tracking-tighter text-white/90"
                  >
                    VISA
                  </span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Assets Section -->
        <section class="mt-4 mb-6">
          <div class="flex justify-between items-end mb-4">
            <h2 class="text-xl font-semibold tracking-tight text-white">
              Активы
            </h2>
            <a
              href="#"
              class="text-sm font-medium text-purple-500 hover:text-purple-400 flex items-center gap-0.5"
            >
              Все активы
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </a>
          </div>

          <!-- Tabs -->
          <div
            class="flex gap-1 bg-white/5 p-1 rounded-full mb-5 border border-white/5 w-fit"
          >
            <button
              class="px-5 py-1.5 rounded-full bg-purple-600 text-sm font-medium text-white shadow-sm"
            >
              Все
            </button>
            <button
              class="px-5 py-1.5 rounded-full text-gray-400 hover:text-white text-sm font-normal transition-colors"
            >
              Крипто
            </button>
            <button
              class="px-5 py-1.5 rounded-full text-gray-400 hover:text-white text-sm font-normal transition-colors"
            >
              Фиат
            </button>
          </div>

          <!-- Asset List -->
          <div class="flex flex-col gap-5">
            <!-- Asset Item: USDT -->
            <div class="flex items-center justify-between group cursor-pointer">
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-full bg-teal-500 flex items-center justify-center"
                >
                  <i
                    data-lucide="circle-dollar-sign"
                    class="w-6 h-6 text-white"
                  ></i>
                </div>
                <div>
                  <h3 class="text-base font-medium text-gray-100">USDT</h3>
                  <p class="text-sm text-gray-500">Tether</p>
                </div>
              </div>

              <div class="flex items-center gap-4 text-right">
                <div>
                  <p class="text-base font-medium text-white">5 540.00</p>
                  <p class="text-sm text-gray-500">≈ 5 540 $</p>
                </div>
                <div class="flex flex-col items-end gap-1 w-20">
                  <span class="text-sm font-medium text-emerald-500">
                    +1.25%
                  </span>
                  <!-- Sparkline Green -->
                  <svg
                    class="w-14 h-6"
                    viewBox="0 0 60 20"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M2 15L15 8L25 12L40 4L58 8"
                      stroke="#10b981"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Asset Item: BTC -->
            <div class="flex items-center justify-between group cursor-pointer">
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-full bg-orange-500 flex items-center justify-center"
                >
                  <i data-lucide="bitcoin" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                  <h3 class="text-base font-medium text-gray-100">BTC</h3>
                  <p class="text-sm text-gray-500">Bitcoin</p>
                </div>
              </div>

              <div class="flex items-center gap-4 text-right">
                <div>
                  <p class="text-base font-medium text-white">0.02415</p>
                  <p class="text-sm text-gray-500">≈ 1 487 $</p>
                </div>
                <div class="flex flex-col items-end gap-1 w-20">
                  <span class="text-sm font-medium text-emerald-500">
                    +0.72%
                  </span>
                  <!-- Sparkline Green -->
                  <svg
                    class="w-14 h-6"
                    viewBox="0 0 60 20"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M2 18L12 10L22 14L38 2L58 6"
                      stroke="#10b981"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Asset Item: ETH -->
            <div class="flex items-center justify-between group cursor-pointer">
              <div class="flex items-center gap-3">
                <div
                  class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center"
                >
                  <svg
                    class="w-6 h-6 text-white"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M12 2L3 11l9 4 9-4-9-9z"></path>
                    <path d="M12 22l-9-9 9-4 9 4-9 9z"></path>
                  </svg>
                </div>
                <div>
                  <h3 class="text-base font-medium text-gray-100">ETH</h3>
                  <p class="text-sm text-gray-500">Ethereum</p>
                </div>
              </div>

              <div class="flex items-center gap-4 text-right">
                <div>
                  <p class="text-base font-medium text-white">0.80</p>
                  <p class="text-sm text-gray-500">≈ 1 280 $</p>
                </div>
                <div class="flex flex-col items-end gap-1 w-20">
                  <span class="text-sm font-medium text-rose-500">-0.18%</span>
                  <!-- Sparkline Red -->
                  <svg
                    class="w-14 h-6"
                    viewBox="0 0 60 20"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M2 2L15 10L25 6L40 16L58 12"
                      stroke="#ef4444"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    ></path>
                    <!-- Subtle red gradient under line -->
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- Bottom Navigation -->
      <nav
        class="absolute bottom-0 left-0 w-full bg-[#0a0a0c]/90 backdrop-blur-xl border-t border-white/10 px-6 pt-3 pb-8 z-50"
      >
        <div class="flex justify-between items-center relative">
          <button class="flex flex-col items-center gap-1 w-16">
            <i
              data-lucide="home"
              class="w-6 h-6 text-purple-500 fill-purple-500/20"
            ></i>
            <span class="text-xs font-medium text-purple-500">Главная</span>
          </button>

          <button class="flex flex-col items-center gap-1 w-16">
            <i
              data-lucide="send"
              class="w-6 h-6 text-gray-500 hover:text-gray-300 transition-colors"
            ></i>
            <span class="text-xs font-normal text-gray-500">Платежи</span>
          </button>

          <!-- Central FAB -->
          <div class="relative flex justify-center w-16">
            <button
              class="w-14 h-14 bg-purple-600 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(139,92,246,0.4)] hover:scale-105 transition-transform"
            >
              <i data-lucide="qr-code" class="w-6 h-6 text-white"></i>
            </button>
          </div>

          <button class="flex flex-col items-center gap-1 w-16">
            <i
              data-lucide="arrow-right-left"
              class="w-6 h-6 text-gray-500 hover:text-gray-300 transition-colors"
            ></i>
            <span class="text-xs font-normal text-gray-500">Обмен</span>
          </button>

          <button class="flex flex-col items-center gap-1 w-16">
            <i
              data-lucide="clock"
              class="w-6 h-6 text-gray-500 hover:text-gray-300 transition-colors"
            ></i>
            <span class="text-xs font-normal text-gray-500">История</span>
          </button>
        </div>
      </nav>
    </div>

    <script>
      // Initialize Lucide icons with custom stroke width
      lucide.createIcons({
          attrs: {
              'stroke-width': 1.5
          }
      });
    </script>
  </body>
