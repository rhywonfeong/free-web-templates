<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accommodation POS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
/* Custom scrollbar for a cleaner look */

<body class="bg-zinc-950 text-zinc-300 h-screen w-screen overflow-hidden flex flex-col antialiased selection:bg-cyan-900 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="h-14 bg-zinc-900 border-b border-zinc-800 flex items-center px-4 shrink-0 gap-4">
        <!-- Utility Icons -->
        <div class="flex items-center gap-4 text-zinc-400">
            <button class="hover:text-white transition-colors"><i data-lucide="settings" class="w-5 h-5"></i></button>
            <button class="hover:text-white transition-colors"><i data-lucide="scan-barcode" class="w-5 h-5"></i></button>
            <button class="hover:text-white transition-colors"><i data-lucide="hash" class="w-5 h-5"></i></button>
            <button class="hover:text-white transition-colors"><i data-lucide="tag" class="w-5 h-5"></i></button>
        </div>

        <!-- Search Bar -->
        <div class="flex items-center flex-1 ml-4 relative">
            <i data-lucide="search" class="w-5 h-5 text-zinc-500 absolute left-0"></i>
            <input type="text" 
                   placeholder="Search services, rooms, or items by name" 
                   class="bg-transparent border-none outline-none text-lg text-white placeholder-zinc-600 w-full pl-8 h-full focus:ring-0">
        </div>
        
        <!-- Window Controls (Mockup) -->
        <div class="flex items-center gap-4 text-zinc-500">
            <i data-lucide="minus" class="w-4 h-4"></i>
            <i data-lucide="square" class="w-4 h-4"></i>
            <i data-lucide="x" class="w-4 h-4 hover:text-red-500 cursor-pointer"></i>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex flex-1 overflow-hidden">
        
        <!-- LEFT PANEL: Receipt / Items -->
        <section class="flex flex-col flex-1 relative border-r border-zinc-800">
            
            <!-- List Header -->
            <div class="grid grid-cols-12 gap-4 px-4 py-3 border-b border-cyan-600 bg-zinc-900/50 text-base font-medium text-white">
                <div class="col-span-6">Product / Service name</div>
                <div class="col-span-2 text-right">Quantity</div>
                <div class="col-span-2 text-right">Price</div>
                <div class="col-span-2 text-right">Amount</div>
            </div>

            <!-- Empty State (Matches Image) -->
            <div class="flex-1 flex flex-col items-center justify-center text-zinc-500 gap-3">
                <div class="opacity-0 animate-[fadeIn_0.5s_ease-in_forwards] flex flex-col items-center">
                    <h2 class="text-2xl text-zinc-400 font-semibold tracking-tight mb-2">No items</h2>
                    <p class="text-lg text-zinc-600 text-center max-w-md">
                        Add accommodation charges, minibar items, or services to receipt using barcode, code or search by pressing F3 button
                    </p>
                </div>
            </div>

            <!-- Footer / Totals -->
            <div class="mt-auto bg-zinc-900 border-t border-zinc-800 p-6">
                <div class="flex flex-col gap-2 max-w-md ml-auto">
                    <div class="flex justify-between text-lg text-zinc-400">
                        <span>Subtotal</span>
                        <span class="font-medium">0.00</span>
                    </div>
                    <div class="flex justify-between text-lg text-zinc-400">
                        <span>Tax</span>
                        <span class="font-medium">0.00</span>
                    </div>
                    <div class="border-t border-zinc-700 my-2"></div>
                    <div class="flex justify-between items-end text-white">
                        <span class="text-xl font-medium">Total</span>
                        <span class="text-3xl font-semibold tracking-tight">0.00</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- RIGHT PANEL: Actions & Keypad -->
        <section class="w-[420px] bg-zinc-925 flex flex-col border-l border-zinc-800 shrink-0">
            
            <!-- Top Action Row -->
            <div class="grid grid-cols-4 h-24 border-b border-zinc-800">
                <button class="flex flex-col items-center justify-center gap-1 hover:bg-zinc-800 transition-colors border-r border-zinc-800 group">
                    <i data-lucide="x" class="w-8 h-8 text-zinc-500 group-hover:text-red-400 font-light"></i>
                    <span class="text-sm text-zinc-500">Delete</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 hover:bg-zinc-800 transition-colors border-r border-zinc-800 relative">
                    <span class="absolute top-1 left-2 text-xs text-zinc-500 font-mono">F3</span>
                    <i data-lucide="search" class="w-7 h-7 text-white"></i>
                    <span class="text-sm text-white">Search</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 hover:bg-zinc-800 transition-colors border-r border-zinc-800 relative">
                    <span class="absolute top-1 left-2 text-xs text-zinc-500 font-mono">F4</span>
                    <i data-lucide="shopping-basket" class="w-7 h-7 text-white"></i>
                    <span class="text-sm text-white">Quantity</span>
                </button>
                <button class="flex flex-col items-center justify-center gap-1 hover:bg-zinc-800 transition-colors relative">
                    <span class="absolute top-1 left-2 text-xs text-zinc-500 font-mono">F8</span>
                    <i data-lucide="plus" class="w-8 h-8 text-white"></i>
                    <span class="text-sm text-white">New sale</span>
                </button>
            </div>

            <!-- Payment Methods Row -->
            <div class="grid grid-cols-3 h-16 border-b border-zinc-800">
                <button class="flex flex-col items-center justify-center relative hover:bg-zinc-800 transition-colors border-r border-zinc-800 border-b-2 border-b-green-600">
                    <span class="absolute top-1 left-1 text-xs text-zinc-500 font-mono">F12</span>
                    <span class="text-base text-white font-medium">Cash</span>
                </button>
                <button class="flex flex-col items-center justify-center hover:bg-zinc-800 transition-colors border-r border-zinc-800 border-b-2 border-b-cyan-600">
                    <span class="text-base text-white font-medium">Card</span>
                </button>
                <button class="flex flex-col items-center justify-center hover:bg-zinc-800 transition-colors border-b-2 border-b-cyan-600">
                    <span class="text-base text-white font-medium">Check</span>
                </button>
            </div>

            <!-- Middle Spacer / Branding -->
            <div class="flex-1 flex flex-col items-center justify-center relative overflow-hidden bg-gradient-to-b from-zinc-900 to-zinc-950">
                <div class="absolute inset-0 flex items-center justify-center opacity-[0.03] pointer-events-none">
                    <!-- Logo Watermark -->
                    <div class="flex flex-col items-center">
                        <i data-lucide="hexagon" class="w-32 h-32 stroke-1"></i>
                        <span class="text-4xl font-semibold tracking-tight mt-4">aronium</span>
                    </div>
                </div>
            </div>

            <!-- Bottom Action Grid -->
            <div class="grid grid-cols-4 grid-rows-4 h-[380px] border-t border-zinc-800">
                
                <!-- Row 1 -->
                <button class="border-r border-b border-zinc-800 hover:bg-zinc-800 flex flex-col items-center justify-center gap-1 group">
                    <i data-lucide="archive" class="w-6 h-6 text-zinc-400 group-hover:text-white"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white">Cash drawer</span>
                </button>
                <button class="border-r border-b border-zinc-800 hover:bg-zinc-800 flex flex-col items-center justify-center gap-1 group relative">
                    <!-- Changed from Dine-in to Room Svc for Accommodation context -->
                    <i data-lucide="concierge-bell" class="w-6 h-6 text-zinc-400 group-hover:text-white"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white">Room Svc</span>
                </button>
                <div class="col-span-2 border-b border-zinc-800 bg-zinc-900/50"></div> <!-- Empty spacer -->

                <!-- Row 2 -->
                <button class="border-r border-b border-zinc-800 hover:bg-zinc-800 flex flex-col items-center justify-center gap-1 group relative">
                    <span class="absolute top-1 left-1 text-[10px] text-zinc-600 font-mono">F2</span>
                    <i data-lucide="percent" class="w-6 h-6 text-zinc-400 group-hover:text-white"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white">Discount</span>
                </button>
                <button class="border-r border-b border-zinc-800 hover:bg-zinc-800 flex flex-col items-center justify-center gap-1 group">
                    <i data-lucide="message-square" class="w-6 h-6 text-zinc-400 group-hover:text-white"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white">Comment</span>
                </button>
                <button class="border-r border-b border-zinc-800 hover:bg-zinc-800 flex flex-col items-center justify-center gap-1 group">
                    <i data-lucide="user" class="w-6 h-6 text-zinc-400 group-hover:text-white"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white">Guest</span>
                </button>
                <button class="border-b border-zinc-800 hover:bg-zinc-800 flex flex-col items-center justify-center gap-1 group">
                    <i data-lucide="more-horizontal" class="w-6 h-6 text-zinc-400 group-hover:text-white"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white">...</span>
                </button>

                <!-- Row 3 -->
                <button class="border-r border-b border-zinc-800 hover:bg-zinc-800 flex flex-col items-center justify-center gap-1 group">
                    <span class="text-xl font-semibold text-white mb-0 leading-none">F9</span>
                    <span class="text-xs text-zinc-300 font-medium">Save sale</span>
                </button>
                <button class="border-r border-b border-zinc-800 hover:bg-zinc-800 flex flex-col items-center justify-center gap-1 group">
                    <i data-lucide="rotate-ccw" class="w-6 h-6 text-zinc-400 group-hover:text-white"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white">Refund</span>
                </button>
                <!-- Large Payment Button -->
                <button class="col-span-2 row-span-1 border-b border-zinc-800 bg-emerald-700 hover:bg-emerald-600 flex flex-col items-center justify-center gap-0 transition-colors">
                    <span class="text-2xl font-bold text-white tracking-tight">F10</span>
                    <span class="text-sm text-emerald-100 font-medium">Payment</span>
                </button>

                <!-- Row 4 -->
                <button class="border-r border-zinc-800 hover:bg-zinc-800 flex flex-col items-center justify-center gap-1 group">
                    <i data-lucide="lock" class="w-6 h-6 text-zinc-400 group-hover:text-white"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white">Lock</span>
                </button>
                <button class="border-r border-zinc-800 hover:bg-zinc-800 flex flex-col items-center justify-center gap-1 group relative">
                    <span class="absolute top-1 left-1 text-[10px] text-zinc-600 font-mono">F7</span>
                    <i data-lucide="arrow-right-left" class="w-6 h-6 text-zinc-400 group-hover:text-white"></i>
                    <span class="text-xs text-zinc-400 group-hover:text-white">Transfer</span>
                </button>
                <button class="border-r border-zinc-800 bg-red-700 hover:bg-red-600 flex flex-col items-center justify-center gap-1 group transition-colors">
                    <i data-lucide="trash-2" class="w-6 h-6 text-white"></i>
                    <span class="text-xs text-white font-medium">Void order</span>
                </button>
                <button class="hover:bg-zinc-800 flex flex-col items-center justify-center gap-1 group">
                    <i data-lucide="more-horizontal" class="w-6 h-6 text-zinc-400 group-hover:text-white"></i>
                </button>
            </div>
        </section>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
