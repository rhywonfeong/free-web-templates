  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Sign Up Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    #vanta-canvas {
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-gray-900 rounded-xl overflow-hidden shadow-2xl border border-gray-800">
    <div class="h-32 relative" id="vanta-canvas">
      <div class="absolute inset-0 bg-gradient-to-b from-transparent to-gray-900/90"></div>
      <div class="absolute top-4 left-4 z-10">
        <span class="px-2 py-1 bg-gray-800/80 rounded-full text-xs text-gray-400 mb-2 inline-block">JOIN NETWORK</span>
        <h2 class="text-2xl font-bold text-white">Sign Up</h2>
        <div class="h-1 w-12 bg-gray-400 mt-2 rounded-full"></div>
      </div>
    </div>
    
    <div class="p-6">
      <form class="space-y-4">
        <div class="space-y-2">
          <label for="name" class="block text-sm font-medium text-gray-300">Full Name</label>
          <input type="text" id="name" name="name" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-gray-500">
        </div>
        
        <div class="space-y-2">
          <label for="email" class="block text-sm font-medium text-gray-300">Email Address</label>
          <input type="email" id="email" name="email" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-gray-500">
        </div>
        
        <div class="space-y-2">
          <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
          <input type="password" id="password" name="password" class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-gray-500">
        </div>
        
        <div class="flex items-center">
          <input id="terms" name="terms" type="checkbox" class="h-4 w-4 bg-gray-800 border-gray-700 rounded text-gray-500 focus:ring-gray-600">
          <label for="terms" class="ml-2 block text-xs text-gray-400">
            I agree to the <a href="#" class="text-gray-300 hover:text-white">Terms of Service</a> and <a href="#" class="text-gray-300 hover:text-white">Privacy Policy</a>
          </label>
        </div>
        
        <div class="pt-2">
          <button type="submit" class="w-full px-4 py-2.5 bg-gray-700 hover:bg-gray-600 text-white rounded-lg transition flex items-center justify-center font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            Create Account
          </button>
        </div>
      </form>
      
      <div class="mt-6 text-center">
        <p class="text-xs text-gray-400">
          Already have an account? <a href="#" class="text-gray-300 hover:text-white">Sign in</a>
        </p>
      </div>
      
      <div class="mt-6 pt-4 border-t border-gray-800">
        <div class="flex items-center justify-center space-x-4">
          <div class="text-xs text-gray-400">Network status:</div>
          <div class="flex items-center">
            <span class="w-2 h-2 rounded-full bg-green-400 mr-1.5"></span>
            <span class="text-xs text-gray-300">Online</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      VANTA.NET({
        el: "#vanta-canvas",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 128,
        minWidth: 200,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0xd1d5db,
        backgroundColor: 0x030712,
        points: 6,
        maxDistance: 15.00,
        spacing: 18.00,
        showDots: true
      });
    });
  </script>
</body>
</html>
