<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Post Design</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"><!-- aura-ga4-start -->

<body class="min-h-screen flex items-center justify-center antialiased font-['Inter'] bg-gray-100 pt-4 pr-4 pb-4 pl-4">

    <!-- Instagram Post Container (Aspect Ratio 4:5 for 1080x1350) -->
    <div class="relative w-full max-w-[540px] aspect-[4/5] bg-white shadow-2xl overflow-hidden flex flex-col justify-between group selection:bg-blue-100 selection:text-blue-700">
        
        <!-- Decorative Background Mesh/Gradient -->
        <div class="absolute inset-0 z-0 opacity-40 pointer-events-none">
            <div class="absolute top-[-10%] right-[-10%] w-3/4 h-3/4 bg-blue-50 rounded-full blur-3xl mix-blend-multiply"></div>
            <div class="absolute bottom-[-10%] left-[-10%] w-3/4 h-3/4 bg-slate-50 rounded-full blur-3xl mix-blend-multiply"></div>
            <!-- Grid Pattern -->
            <div class="absolute inset-0 bg-[linear-gradient(to_right,#f1f5f9_1px,transparent_1px),linear-gradient(to_bottom,#f1f5f9_1px,transparent_1px)] bg-[size:2rem_2rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)]"></div>
        </div>

        <!-- Header: Logo -->
        <div class="z-10 pt-8 pr-10 pl-10 relative">
            <div class="flex gap-x-2 items-center gap-y-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white shadow-sm">
                    <iconify-icon icon="solar:chart-square-linear" width="20" stroke-width="1.5" class=""></iconify-icon>
                </div>
                <span class="uppercase text-sm font-semibold text-slate-900 tracking-tighter">Licita Fácil</span>
            </div>
        </div>

        <!-- Main Content -->
        <div class="relative z-10 px-10 flex-1 flex flex-col justify-center">
            
            <!-- Graphic Element: The "5 Errors" Stack -->
            <div class="mb-10 relative">
                <div class="absolute -left-4 top-0 bottom-0 w-[1px] bg-gradient-to-b from-transparent via-blue-200 to-transparent"></div>
                
                <div class="space-y-3">
                    <!-- Error Item 1 -->
                    <div class="flex gap-3 opacity-100 gap-x-3 gap-y-3 items-center">
                        <div class="w-8 h-8 rounded-full border border-red-100 bg-red-50 flex items-center justify-center text-red-500 shrink-0">
                            <iconify-icon icon="solar:danger-circle-linear" width="16" stroke-width="1.5"></iconify-icon>
                        </div>
                        <div class="h-2 w-24 bg-slate-200 rounded-full"></div>
                    </div>
                    <!-- Error Item 2 -->
                    <div class="flex items-center gap-3 opacity-80">
                        <div class="w-8 h-8 rounded-full border border-slate-100 bg-white flex items-center justify-center text-slate-400 shrink-0">
                            <iconify-icon icon="solar:file-remove-linear" width="16" stroke-width="1.5"></iconify-icon>
                        </div>
                        <div class="h-2 w-32 bg-slate-100 rounded-full"></div>
                    </div>
                    <!-- Error Item 3 -->
                    <div class="flex items-center gap-3 opacity-60">
                        <div class="w-8 h-8 rounded-full border border-slate-100 bg-white flex items-center justify-center text-slate-400 shrink-0">
                            <iconify-icon icon="solar:clock-circle-linear" width="16" stroke-width="1.5"></iconify-icon>
                        </div>
                        <div class="h-2 w-20 bg-slate-100 rounded-full"></div>
                    </div>
                </div>

                <!-- Floating Badge -->
                <div class="absolute right-0 top-1/2 -translate-y-1/2 bg-white border border-slate-100 shadow-xl rounded-lg p-3 flex items-center gap-3 animate-[bounce_3s_infinite]">
                    <div class="bg-blue-50 text-blue-600 rounded-md p-1">
                        <iconify-icon icon="solar:graph-down-linear" width="20" stroke-width="1.5" class=""></iconify-icon>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] uppercase tracking-wide text-slate-400 font-medium">Status</span>
                        <span class="text-xs font-semibold text-slate-900">Desclassificado</span>
                    </div>
                </div>
            </div>

            <!-- Typography -->
            <div class="space-y-6">
                <h1 class="text-4xl md:text-5xl font-semibold text-slate-900 tracking-tight leading-[1.1]">
                    5 erros que fazem <span class="text-blue-600">empresas</span> perderem licitações todos os dias.
                </h1>
                
                <p class="text-lg md:text-xl font-normal text-slate-500 leading-relaxed max-w-sm">
                    Você pode estar cometendo um deles agora sem saber — e isso está custando contratos.
                </p>
            </div>
        </div>

        <!-- Footer / CTA -->
        <div class="relative z-10 p-4">
            <div class="bg-slate-900 rounded-2xl p-6 flex flex-col gap-4 shadow-lg overflow-hidden relative">
                <!-- Abstract shine effect -->
                <div class="absolute top-0 right-0 w-32 h-32 bg-blue-500 rounded-full blur-[60px] opacity-20 translate-x-10 -translate-y-10"></div>
                
                <div class="relative z-10">
                    <div class="flex items-center gap-2 mb-2">
                        <iconify-icon icon="solar:bell-bing-linear" class="text-blue-400" width="18" stroke-width="1.5"></iconify-icon>
                        <span class="text-xs font-medium text-blue-200 uppercase tracking-widest">Ação Necessária</span>
                    </div>
                    <p class="text-base font-medium text-white leading-snug">
                        Descubra onde está o seu gargalo e corrija antes da próxima disputa.
                    </p>
                </div>
                
                <div class="flex items-center justify-between mt-2 pt-4 border-t border-slate-700/50">
                    <span class="text-xs text-slate-400 font-medium">Toque para ler mais</span>
                    <iconify-icon icon="solar:arrow-right-linear" class="text-white" width="20" stroke-width="1.5"></iconify-icon>
                </div>
            </div>
        </div>

    </div>


</body></html>
