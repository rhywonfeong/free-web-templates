<!DOCTYPE html>
<html lang="en">
  <head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leeloo – New Event</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script></head>

  <body
    class="min-h-screen bg-gradient-to-b from-indigo-950 via-indigo-900 to-indigo-950 text-neutral-100 flex items-center justify-center"
  >
    <!-- Backdrop -->
    <div
      class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
    >
      <!-- Modal -->
      <div
        class="w-full max-w-md rounded-3xl bg-neutral-800/90 ring-1 ring-white/10 shadow-2xl p-8 space-y-8"
      >
        <!-- Title -->
        <h2
          class="text-2xl tracking-tight font-semibold text-white flex items-center gap-2"
        >
          <i data-lucide="sparkles" class="w-6 h-6 stroke-indigo-300"></i>
          New Event
        </h2>

        <!-- Form -->
        <form class="space-y-6">
          <!-- Event Name -->
          <div class="space-y-2">
            <label class="font-medium text-sm">Event name</label>
            <div
              class="flex items-center gap-3 bg-neutral-700/60 rounded-xl px-4 py-3 focus-within:ring-2 focus-within:ring-indigo-400 transition"
            >
              <i data-lucide="edit-3" class="w-5 h-5 text-indigo-300"></i>
              <input
                type="text"
                placeholder="Stargazing with friends"
                class="flex-1 bg-transparent outline-none placeholder:text-neutral-400 text-sm"
                required
              />
            </div>
          </div>

          <!-- Date -->
          <div class="space-y-2">
            <label class="font-medium text-sm">Date</label>
            <div
              class="flex items-center gap-3 bg-neutral-700/60 rounded-xl px-4 py-3 focus-within:ring-2 focus-within:ring-indigo-400 transition"
            >
              <i data-lucide="calendar" class="w-5 h-5 text-indigo-300"></i>
              <input
                type="date"
                class="flex-1 bg-transparent outline-none text-sm"
                required
              />
            </div>
          </div>

          <!-- Media upload -->
          <div class="space-y-2">
            <label class="font-medium text-sm">Media (optional)</label>
            <label
              for="media"
              class="group flex flex-col items-center justify-center gap-2 border-2 border-dashed border-indigo-400/40 rounded-xl py-8 cursor-pointer hover:bg-neutral-700/40 transition"
            >
              <i
                data-lucide="upload-cloud"
                class="w-6 h-6 text-indigo-300 group-hover:rotate-6 transition"
              ></i>
              <span class="text-xs text-neutral-400 group-hover:text-neutral-200"
                >Add photo / video</span
              >
              <input id="media" type="file" class="hidden" multiple />
            </label>
          </div>

          <!-- Description -->
          <div class="space-y-2">
            <label class="font-medium text-sm">Comment / description</label>
            <div
              class="bg-neutral-700/60 rounded-xl focus-within:ring-2 focus-within:ring-indigo-400 transition"
            >
              <textarea
                rows="4"
                placeholder="Tell us more about this cosmic occasion…"
                class="w-full bg-transparent resize-none p-4 outline-none placeholder:text-neutral-400 text-sm"
                required
              ></textarea>
            </div>
          </div>

          <!-- Save button -->
          <button
            type="submit"
            class="w-full bg-indigo-500 hover:bg-indigo-400 active:bg-indigo-600 text-white text-sm font-semibold py-3 rounded-xl transition"
          >
            Save
          </button>
        </form>
      </div>
    </div>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        lucide.createIcons({ attrs: { "stroke-width": 1.5 } });
      });
    </script>
  </body>
</html>
