    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0a0c12;
            --bg-component: #181c27;
            --bg-input: rgba(30, 35, 50, 0.6);
            --bg-button-primary: #00f0c0;
            --bg-button-primary-hover: #00ffde;
            
            --text-primary: #e0e7ff;
            --text-secondary: #a0aed0;
            --text-muted: #707a95;
            --text-heading: #ffffff;
            
            --border-color: #3a3f5e;
            --border-input: #3a3f5e;
            --border-input-focus: var(--bg-button-primary);
            
            --border-radius-base: 6px;
            --border-radius-lg: 8px;
            
            --shadow-color-rgb: 0, 240, 192;
            --shadow-md: 0 0 18px rgba(var(--shadow-color-rgb), 0.4);
            
            --focus-ring-color: rgba(0, 240, 192, 0.5);
            --focus-ring-width: 2px;
            
            --transition-speed-fast: 0.15s;
            --transition-speed-normal: 0.25s;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Fira Code', monospace;
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        
        .login-form-wrapper {
            background-color: var(--bg-component);
            padding: 30px 40px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 480px;
            border: 1px solid var(--border-color);
            transition: all var(--transition-speed-normal);
        }
        
        .login-form-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-heading);
            text-align: center;
            margin-bottom: 25px;
        }
        
        .form-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: -20px;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border: 1px solid var(--border-input);
            border-radius: var(--border-radius-base);
            background-color: var(--bg-input);
            color: var(--text-primary);
            transition: all var(--transition-speed-fast);
            font-family: inherit;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--border-input-focus);
            box-shadow: 0 0 0 var(--focus-ring-width) var(--focus-ring-color), 0 0 15px var(--focus-ring-color);
        }
        
        .form-control::placeholder {
            color: var(--text-muted);
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }
        
        .form-link {
            color: var(--bg-button-primary);
            text-decoration: none;
            font-weight: 500;
        }
        
        .form-link:hover {
            text-decoration: underline;
            color: var(--bg-button-primary-hover);
        }
        
        .c-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            border-radius: var(--border-radius-base);
            cursor: pointer;
            transition: all var(--transition-speed-fast);
            border: 1px solid var(--bg-button-primary);
            font-family: inherit;
        }
        
        .c-btn-primary {
            background: var(--bg-button-primary);
            color: var(--bg-page);
            box-shadow: 0 0 10px rgba(var(--shadow-color-rgb), 0.4), 0 0 20px rgba(var(--shadow-color-rgb), 0.2);
        }
        
        .c-btn-primary:hover {
            background: var(--bg-button-primary-hover);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 0 18px rgba(var(--shadow-color-rgb), 0.6), 0 0 35px rgba(var(--shadow-color-rgb), 0.3);
        }
        
        .form-footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        @media (max-width: 480px) {
            .login-form-wrapper {
                padding: 20px;
            }
            
            .form-control, .c-btn {
                font-size: 0.95rem;
                padding: 10px 12px;
            }
            
            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="login-form-wrapper">
        <h3 class="login-form-title">Quick Access</h3>
        <p class="form-subtitle">Sign in to your account below.</p>
        
        <form action="#" method="POST" onsubmit="return false;">
            <div class="form-group">
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>
            
            <div class="form-group">
                <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            
            <div class="form-options">
                <a href="#" class="form-link">Create account</a>
                <a href="#" class="form-link">Need help?</a>
            </div>
            
            <button type="submit" class="c-btn c-btn-primary">Log In</button>
            
            <p class="form-footer-text">
                By signing in, you agree to our <a href="#" class="form-link">Terms</a> &amp; <a href="#" class="form-link">Policy</a>.
            </p>
        </form>
    </div>
</body>
</html>
