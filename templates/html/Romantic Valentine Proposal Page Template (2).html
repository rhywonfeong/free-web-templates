<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Kajal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #0f0c29;
}
.font-romantic {
font-family: 'Playfair Display', serif;
}
.glass-panel {
background: rgba(255, 255, 255, 0.03);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid rgba(255, 255, 255, 0.08);
box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}
.bg-gradient-mesh {
background-image:
radial-gradient(at 0% 0%, hsla(330,80%,30%,1) 0, transparent 50%),
radial-gradient(at 100% 0%, hsla(260,70%,35%,1) 0, transparent 50%),
radial-gradient(at 100% 100%, hsla(330,80%,30%,1) 0, transparent 50%),
radial-gradient(at 0% 100%, hsla(260,70%,35%,1) 0, transparent 50%);
}
.grain {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
pointer-events: none;
z-index: 1;
opacity: 0.06;
background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}
.animate-float {
animation: float 6s ease-in-out infinite;
}
@keyframes float {
0% { transform: translateY(0px); }
50% { transform: translateY(-10px); }
100% { transform: translateY(0px); }
}
.btn-shine {
position: relative;
overflow: hidden;
}
.btn-shine::after {
content: '';
position: absolute;
top: 0;
left: -100%;
width: 50%;
height: 100%;
background: linear-gradient(
to right,
transparent,
rgba(255, 255, 255, 0.3),
transparent
);
transform: skewX(-20deg);
transition: 0.5s;
}
.btn-shine:hover::after {
left: 150%;
transition: 0.7s ease-in-out;
}
.hidden-opacity {
opacity: 0;
pointer-events: none;
transition: opacity 0.5s ease;
}
.visible-opacity {
opacity: 1;
pointer-events: auto;
}
</style></head>
<body class="h-screen w-screen overflow-hidden text-white selection:bg-rose-500 selection:text-white relative">

    <!-- Background Layer -->
    <div class="fixed inset-0 bg-gradient-mesh opacity-70 z-0 scale-110"></div>
    <div class="grain"></div>

    <!-- Main Content -->
    <main class="relative z-10 flex flex-col items-center justify-center h-full w-full px-6">
        
        <!-- Interactive Card -->
        <div id="main-card" class="glass-panel rounded-[2rem] p-8 md:p-14 w-full max-w-lg flex flex-col items-center text-center transition-all duration-700 border-t border-white/10">
            
            <div class="mb-8 animate-float text-rose-300 drop-shadow-[0_0_15px_rgba(253,164,175,0.3)]">
                <iconify-icon icon="solar:heart-angle-linear" width="56" height="56" stroke-width="1.5"></iconify-icon>
            </div>

            <div class="space-y-1 mb-8">
                <p class="text-xs uppercase tracking-[0.2em] text-rose-200/60 font-medium font-sans">A question for</p>
                <h1 class="font-romantic text-6xl md:text-7xl font-medium tracking-tight leading-none bg-clip-text text-transparent bg-gradient-to-b from-white via-rose-100 to-rose-200/80 pb-2 italic">
                    Kajal
                </h1>
            </div>

            <p class="font-romantic text-xl md:text-2xl text-white/80 leading-relaxed mb-12 max-w-sm italic">
                In a world of variables, you are my only constant. Will you be my Valentine?
            </p>

            <!-- Buttons Container: Side by Side -->
            <div class="flex flex-row gap-6 w-full justify-center items-center relative h-14">
                
                <!-- Yes Button -->
                <button id="btn-yes" onclick="acceptProposal()" class="btn-shine group relative min-w-[140px] h-12 rounded-full bg-white text-rose-950 font-medium text-sm hover:scale-105 active:scale-95 transition-all duration-300 shadow-[0_0_30px_-5px_rgba(255,255,255,0.2)] hover:shadow-[0_0_50px_-10px_rgba(244,63,94,0.5)] z-20 flex items-center justify-center gap-2 font-sans tracking-wide">
                    <span>Yes, I will</span>
                    <iconify-icon icon="solar:heart-linear" width="16" class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 -mr-4 group-hover:mr-0"></iconify-icon>
                </button>

                <!-- No Button (The Runner) -->
                <button id="btn-no" class="absolute-fix min-w-[140px] h-12 rounded-full border border-white/10 text-white/50 font-medium text-sm hover:bg-white/5 transition-all duration-300 z-20 backdrop-blur-sm font-sans tracking-wide">
                    No
                </button>
            </div>
        </div>

        <!-- Success Message -->
        <div id="success-overlay" class="absolute inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-2xl hidden-opacity">
            <div class="text-center p-8 animate-float">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-gradient-to-tr from-rose-500 to-purple-600 mb-6 shadow-2xl shadow-rose-500/30">
                    <iconify-icon icon="solar:cupid-linear" width="40" class="text-white"></iconify-icon>
                </div>
                <h2 class="font-romantic text-5xl md:text-6xl font-medium tracking-tight text-white mb-4 italic">She said Yes! 💖</h2>
                <p class="font-sans text-white/60 text-lg font-light tracking-wide">Best decision ever, Kajal.</p>
                <div class="mt-10">
                     <button onclick="location.reload()" class="text-xs text-white/30 hover:text-white transition-colors uppercase tracking-[0.2em] font-sans">Replay</button>
                </div>
            </div>
        </div>

    </main>

    <script>
        const noBtn = document.getElementById('btn-no');
        const yesBtn = document.getElementById('btn-yes');
        const card = document.getElementById('main-card');
        const successOverlay = document.getElementById('success-overlay');

        // Initial check to ensure they are side-by-side (handled by CSS flex),
        // but this logic handles the "running away"
        
        function moveButton() {
            // Get viewport dimensions
            const maxX = window.innerWidth - noBtn.offsetWidth - 50;
            const maxY = window.innerHeight - noBtn.offsetHeight - 50;
            
            // Random coordinates within viewport
            const randomX = Math.max(20, Math.random() * maxX);
            const randomY = Math.max(20, Math.random() * maxY);

            // Change from static/flex to fixed positioning
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
            
            // Visual feedback
            noBtn.style.borderColor = 'rgba(244, 63, 94, 0.3)';
            noBtn.style.color = 'rgba(255, 255, 255, 0.8)';
            noBtn.innerText = "Are you sure? 💔";
        }

        // Trigger on mouse enter (Desktop)
        noBtn.addEventListener('mouseenter', moveButton);
        
        // Trigger on touch start (Mobile)
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveButton();
        });

        // Success Action
        function acceptProposal() {
            // Hide No button
            noBtn.style.display = 'none';
            
            // Fade out main card
            card.style.opacity = '0';
            card.style.transform = 'scale(0.95)';
            
            // Show Success Overlay
            setTimeout(() => {
                successOverlay.classList.remove('hidden-opacity');
                successOverlay.classList.add('visible-opacity');
                createConfetti();
            }, 300);
        }

        function createConfetti() {
            const colors = ['#f43f5e', '#e11d48', '#ffffff', '#fb7185'];
            
            for (let i = 0; i < 120; i++) {
                const confetti = document.createElement('div');
                confetti.style.position = 'fixed';
                confetti.style.width = Math.random() * 6 + 3 + 'px';
                confetti.style.height = Math.random() * 8 + 4 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = -20 + 'px';
                confetti.style.zIndex = '60';
                confetti.style.opacity = '0.9';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                const duration = Math.random() * 2 + 2;
                confetti.style.transition = `top ${duration}s ease-in, opacity ${duration}s ease-in, transform ${duration}s linear`;
                
                document.body.appendChild(confetti);

                // Animation frame
                setTimeout(() => {
                    confetti.style.top = '110vh';
                    confetti.style.opacity = '0';
                    confetti.style.transform = `rotate(${Math.random() * 720}deg)`;
                }, 50);

                setTimeout(() => {
                    confetti.remove();
                }, duration * 1000);
            }
        }
    </script>
</body>
</html>
