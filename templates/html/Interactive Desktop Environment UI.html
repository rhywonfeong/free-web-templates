  <meta charset="UTF-8">

</head>
<body class="bg-gradient-to-br from-blue-400 to-purple-500 h-screen overflow-hidden">
  <!-- Menu Bar -->
  <div class="bg-gray-800 bg-opacity-80 backdrop-blur-md text-white h-7 flex items-center justify-between px-4">
    <div class="flex items-center space-x-4">
      <i class="fa-brands fa-apple"></i>
      <span class="font-semibold">Finder</span>
      <span>File</span>
      <span>Edit</span>
      <span>View</span>
    </div>
    <div class="flex items-center space-x-4">
      <span id="clock">12:00 PM</span>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </div>
  </div>

  <!-- Desktop -->
  <div id="desktop" class="h-[calc(100vh-7rem)] p-4 relative">
    <!-- Desktop Icons -->
    <div class="grid grid-cols-1 gap-6 w-24">
      <div class="flex flex-col items-center cursor-pointer" onclick="openApp('calculator-app')">
        <div class="w-16 h-16 bg-gradient-to-b from-purple-500 to-indigo-600 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-calculator text-white text-3xl"></i>
        </div>
        <span class="text-white text-xs mt-1 text-center">Calculator</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer" onclick="openApp('notes-app')">
        <div class="w-16 h-16 bg-gradient-to-b from-yellow-400 to-yellow-600 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-note-sticky text-white text-3xl"></i>
        </div>
        <span class="text-white text-xs mt-1 text-center">Notes</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer" onclick="openApp('photos-app')">
        <div class="w-16 h-16 bg-gradient-to-b from-blue-400 to-blue-600 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-image text-white text-3xl"></i>
        </div>
        <span class="text-white text-xs mt-1 text-center">Photos</span>
      </div>
    </div>
  </div>

  <!-- Minimized Apps Tray -->
  <div id="minimized-tray" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 flex space-x-2"></div>

  <!-- Calculator App Window -->
  <div id="calculator-app" class="app-window hidden absolute top-20 left-40 w-64 bg-gray-800 rounded-lg shadow-2xl overflow-hidden">
    <div class="bg-gray-700 h-8 flex items-center px-3 cursor-move" id="calculator-header">
      <div class="flex space-x-2">
        <div class="w-3 h-3 rounded-full bg-red-500 cursor-pointer" onclick="closeApp('calculator-app')"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500 cursor-pointer" onclick="minimizeApp('calculator-app')"></div>
        <div class="w-3 h-3 rounded-full bg-green-500 cursor-pointer" onclick="maximizeApp('calculator-app')"></div>
      </div>
      <div class="mx-auto text-sm text-gray-300">Calculator</div>
    </div>
    <div class="p-3">
      <div class="bg-gray-900 text-white text-right p-2 rounded mb-2 h-10" id="calc-display">0</div>
      <div class="grid grid-cols-4 gap-2">
        <button class="bg-gray-600 text-white p-2 rounded" onclick="calcClear()">C</button>
        <button class="bg-gray-600 text-white p-2 rounded" onclick="calcOperation('±')">±</button>
        <button class="bg-gray-600 text-white p-2 rounded" onclick="calcOperation('%')">%</button>
        <button class="bg-orange-500 text-white p-2 rounded" onclick="calcOperation('/')">÷</button>
        <button class="bg-gray-700 text-white p-2 rounded" onclick="calcNumber(7)">7</button>
        <button class="bg-gray-700 text-white p-2 rounded" onclick="calcNumber(8)">8</button>
        <button class="bg-gray-700 text-white p-2 rounded" onclick="calcNumber(9)">9</button>
        <button class="bg-orange-500 text-white p-2 rounded" onclick="calcOperation('*')">×</button>
        <button class="bg-gray-700 text-white p-2 rounded" onclick="calcNumber(4)">4</button>
        <button class="bg-gray-700 text-white p-2 rounded" onclick="calcNumber(5)">5</button>
        <button class="bg-gray-700 text-white p-2 rounded" onclick="calcNumber(6)">6</button>
        <button class="bg-orange-500 text-white p-2 rounded" onclick="calcOperation('-')">−</button>
        <button class="bg-gray-700 text-white p-2 rounded" onclick="calcNumber(1)">1</button>
        <button class="bg-gray-700 text-white p-2 rounded" onclick="calcNumber(2)">2</button>
        <button class="bg-gray-700 text-white p-2 rounded" onclick="calcNumber(3)">3</button>
        <button class="bg-orange-500 text-white p-2 rounded" onclick="calcOperation('+')">+</button>
        <button class="bg-gray-700 text-white p-2 rounded col-span-2" onclick="calcNumber(0)">0</button>
        <button class="bg-gray-700 text-white p-2 rounded" onclick="calcNumber('.')">.</button>
        <button class="bg-orange-500 text-white p-2 rounded" onclick="calcEquals()">=</button>
      </div>
    </div>
  </div>

  <!-- Notes App Window -->
  <div id="notes-app" class="app-window hidden absolute top-40 left-80 w-96 h-80 bg-white rounded-lg shadow-2xl overflow-hidden">
    <div class="bg-gray-200 h-8 flex items-center px-3 cursor-move" id="notes-header">
      <div class="flex space-x-2">
        <div class="w-3 h-3 rounded-full bg-red-500 cursor-pointer" onclick="closeApp('notes-app')"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500 cursor-pointer" onclick="minimizeApp('notes-app')"></div>
        <div class="w-3 h-3 rounded-full bg-green-500 cursor-pointer" onclick="maximizeApp('notes-app')"></div>
      </div>
      <div class="mx-auto text-sm text-gray-600">Notes</div>
    </div>
    <div class="p-3 h-[calc(100%-2rem)]">
      <textarea id="note-content" class="w-full h-full p-2 border border-gray-300 rounded resize-none focus:outline-none focus:ring-2 focus:ring-yellow-400" placeholder="Type your notes here..."></textarea>
    </div>
  </div>

  <!-- Photos App Window -->
  <div id="photos-app" class="app-window hidden absolute top-60 left-60 w-[500px] h-[400px] bg-gray-900 rounded-lg shadow-2xl overflow-hidden">
    <div class="bg-gray-800 h-8 flex items-center px-3 cursor-move" id="photos-header">
      <div class="flex space-x-2">
        <div class="w-3 h-3 rounded-full bg-red-500 cursor-pointer" onclick="closeApp('photos-app')"></div>
        <div class="w-3 h-3 rounded-full bg-yellow-500 cursor-pointer" onclick="minimizeApp('photos-app')"></div>
        <div class="w-3 h-3 rounded-full bg-green-500 cursor-pointer" onclick="maximizeApp('photos-app')"></div>
      </div>
      <div class="mx-auto text-sm text-gray-300">Photos</div>
    </div>
    <div class="p-3 h-[calc(100%-2rem)] flex flex-col">
      <div class="flex-1 flex items-center justify-center bg-black rounded-lg overflow-hidden">
        <img id="current-photo" src="https://source.unsplash.com/random/800x600/?nature" class="max-w-full max-h-full object-contain" />
      </div>
      <div class="flex justify-center mt-3 space-x-4">
        <button onclick="changePhoto('https://source.unsplash.com/random/800x600/?mountains')" class="bg-blue-500 text-white px-3 py-1 rounded">Mountains</button>
        <button onclick="changePhoto('https://source.unsplash.com/random/800x600/?ocean')" class="bg-blue-500 text-white px-3 py-1 rounded">Ocean</button>
        <button onclick="changePhoto('https://source.unsplash.com/random/800x600/?forest')" class="bg-blue-500 text-white px-3 py-1 rounded">Forest</button>
      </div>
    </div>
  </div>

  <!-- Dock -->
  <div class="fixed bottom-2 left-1/2 transform -translate-x-1/2 h-16 bg-white bg-opacity-20 backdrop-blur-lg rounded-2xl px-2 flex items-center space-x-2">
    <div class="w-12 h-12 bg-blue-500 rounded-lg flex items-center justify-center hover:scale-110 transition-transform cursor-pointer" onclick="openApp('photos-app')">
      <i class="fa-solid fa-image text-white text-2xl"></i>
    </div>
    <div class="w-12 h-12 bg-yellow-500 rounded-lg flex items-center justify-center hover:scale-110 transition-transform cursor-pointer" onclick="openApp('notes-app')">
      <i class="fa-solid fa-note-sticky text-white text-2xl"></i>
    </div>
    <div class="w-12 h-12 bg-purple-600 rounded-lg flex items-center justify-center hover:scale-110 transition-transform cursor-pointer" onclick="openApp('calculator-app')">
      <i class="fa-solid fa-calculator text-white text-2xl"></i>
    </div>
  </div>

  <script>
    // Clock functionality
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes();
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const timeString = `${hours}:${minutes.toString().padStart(2, '0')} ${ampm}`;
      document.getElementById('clock').textContent = timeString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Window management
    let windowStates = {
      'calculator-app': { isMaximized: false, prevStyle: {} },
      'notes-app': { isMaximized: false, prevStyle: {} },
      'photos-app': { isMaximized: false, prevStyle: {} }
    };

    function openApp(id) {
      const app = document.getElementById(id);
      app.classList.remove('hidden');
      bringToFront(id);
    }

    function closeApp(id) {
      document.getElementById(id).classList.add('hidden');
      // Remove from minimized tray if it's there
      const minimizedIcon = document.querySelector(`#minimized-tray [data-app="${id}"]`);
      if (minimizedIcon) minimizedIcon.remove();
    }

    function minimizeApp(id) {
      const app = document.getElementById(id);
      app.classList.add('hidden');
      
      // Add to minimized tray
      const tray = document.getElementById('minimized-tray');
      if (!document.querySelector(`#minimized-tray [data-app="${id}"]`)) {
        const icon = document.createElement('div');
        icon.className = 'w-10 h-10 bg-gray-800 bg-opacity-70 rounded-lg flex items-center justify-center cursor-pointer hover:scale-110 transition-transform';
        icon.setAttribute('data-app', id);
        icon.innerHTML = getAppIcon(id);
        icon.onclick = () => {
          app.classList.remove('hidden');
          icon.remove();
          bringToFront(id);
        };
        tray.appendChild(icon);
      }
    }

    function getAppIcon(id) {
      switch(id) {
        case 'calculator-app': return '<i class="fa-solid fa-calculator text-white"></i>';
        case 'notes-app': return '<i class="fa-solid fa-note-sticky text-white"></i>';
        case 'photos-app': return '<i class="fa-solid fa-image text-white"></i>';
        default: return '';
      }
    }

    function maximizeApp(id) {
      const app = document.getElementById(id);
      const state = windowStates[id];
      
      if (!state.isMaximized) {
        // Save current position and size
        state.prevStyle = {
          top: app.style.top,
          left: app.style.left,
          width: app.style.width,
          height: app.style.height
        };
        
        // Maximize
        app.style.top = '7px';
        app.style.left = '0';
        app.style.width = '100%';
        app.style.height = 'calc(100vh - 7px)';
        app.style.borderRadius = '0';
        state.isMaximized = true;
      } else {
        // Restore
        app.style.top = state.prevStyle.top || '40px';
        app.style.left = state.prevStyle.left || '40px';
        app.style.width = state.prevStyle.width || '';
        app.style.height = state.prevStyle.height || '';
        app.style.borderRadius = '0.5rem';
        state.isMaximized = false;
      }
    }

    function bringToFront(id) {
      const windows = document.querySelectorAll('.app-window');
      windows.forEach(win => win.style.zIndex = 5);
      document.getElementById(id).style.zIndex = 10;
    }

    // Make windows draggable
    function makeDraggable(elmnt, header) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      document.getElementById(header).onmousedown = dragMouseDown;

      function dragMouseDown(e) {
        if (windowStates[elmnt].isMaximized) return;
        e = e || window.event;
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.onmouseup = closeDragElement;
        document.onmousemove = elementDrag;
        bringToFront(elmnt);
      }

      function elementDrag(e) {
        e = e || window.event;
        e.preventDefault();
        pos1 = pos3 - e.clientX;
        pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;
        const el = document.getElementById(elmnt);
        el.style.top = (el.offsetTop - pos2) + "px";
        el.style.left = (el.offsetLeft - pos1) + "px";
      }

      function closeDragElement() {
        document.onmouseup = null;
        document.onmousemove = null;
      }
    }

    // Calculator functionality
    let currentValue = '0';
    let prevValue = '0';
    let currentOperation = null;
    let resetDisplay = false;

    function updateCalcDisplay() {
      document.getElementById('calc-display').textContent = currentValue;
    }

    function calcNumber(num) {
      if (currentValue === '0' || resetDisplay) {
        currentValue = num.toString();
        resetDisplay = false;
      } else {
        currentValue += num.toString();
      }
      updateCalcDisplay();
    }

    function calcOperation(op) {
      if (op === '±') {
        currentValue = (parseFloat(currentValue) * -1).toString();
        updateCalcDisplay();
        return;
      }
      
      if (currentOperation !== null) calcEquals();
      prevValue = currentValue;
      currentOperation = op;
      resetDisplay = true;
    }

    function calcEquals() {
      let result;
      const prev = parseFloat(prevValue);
      const current = parseFloat(currentValue);
      
      switch(currentOperation) {
        case '+': result = prev + current; break;
        case '-': result = prev - current; break;
        case '*': result = prev * current; break;
        case '/': result = prev / current; break;
        case '%': result = prev % current; break;
        default: return;
      }
      
      currentValue = result.toString();
      currentOperation = null;
      updateCalcDisplay();
    }

    function calcClear() {
      currentValue = '0';
      prevValue = '0';
      currentOperation = null;
      updateCalcDisplay();
    }

    // Photos functionality
    function changePhoto(src) {
      document.getElementById('current-photo').src = src;
    }

    // Initialize draggable windows
    makeDraggable('calculator-app', 'calculator-header');
    makeDraggable('notes-app', 'notes-header');
    makeDraggable('photos-app', 'photos-header');
  </script>
</body>
</html>
