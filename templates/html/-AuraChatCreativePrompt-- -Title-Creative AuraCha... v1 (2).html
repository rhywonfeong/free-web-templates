<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClariFi – Financial Cosmos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
  <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="min-h-screen font-[Inter] text-white bg-[#0F1419] relative overflow-x-hidden">

  <!-- Particle backdrop -->
  <div id="particles-js" class="absolute inset-0 -z-10"></div>

  <!-- Header -->
  <header class="flex items-center justify-between px-5 pt-6 pb-4">
    <h1 class="text-[28px] font-semibold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-teal-400 to-teal-200">ClariFi</h1>
    <button class="relative p-2 rounded-full backdrop-blur-lg bg-white/5 hover:ring-2 hover:ring-teal-500 transition">
      <i data-lucide="user" class="w-5 h-5 text-teal-300"></i>
    </button>
  </header>

  <!-- Scrollable Metrics Orbs -->
  <section class="px-5">
    <div class="flex space-x-4 overflow-x-auto pb-2">
      <!-- Orb -->
      <button class="shrink-0 h-32 w-32 rounded-full bg-white/5 backdrop-blur-lg flex flex-col items-center justify-center hover:scale-105 transition relative">
        <span class="text-teal-400 text-[18px] font-medium">Balance</span>
        <span class="text-[22px] font-semibold tracking-tight">$8,250</span>
        <span class="absolute inset-0 rounded-full bg-teal-500/20 blur-xl opacity-20 -z-10"></span>
      </button>

      <button class="shrink-0 h-32 w-32 rounded-full bg-white/5 backdrop-blur-lg flex flex-col items-center justify-center hover:scale-105 transition relative">
        <span class="text-teal-400 text-[18px] font-medium">Credit</span>
        <span class="text-[22px] font-semibold tracking-tight">712</span>
        <span class="absolute inset-0 rounded-full bg-teal-500/20 blur-xl opacity-20 -z-10"></span>
      </button>

      <button class="shrink-0 h-32 w-32 rounded-full bg-white/5 backdrop-blur-lg flex flex-col items-center justify-center hover:scale-105 transition relative">
        <span class="text-teal-400 text-[18px] font-medium">Budget</span>
        <span class="text-[22px] font-semibold tracking-tight">62%</span>
        <span class="absolute inset-0 rounded-full bg-teal-500/20 blur-xl opacity-20 -z-10"></span>
      </button>
    </div>
  </section>

  <!-- Cards -->
  <main class="px-5 space-y-4 pt-4 pb-24">

    <!-- Spending Breakdown Card -->
    <div class="rounded-2xl p-5 bg-white/5 backdrop-blur-lg">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-[22px] font-medium tracking-tight">Spending Breakdown</h2>
        <button class="p-1 rounded hover:bg-white/10 transition"><i data-lucide="more-horizontal" class="w-5 h-5"></i></button>
      </div>
      <div>
        <canvas id="spendChart" class="mx-auto max-h-48"></canvas>
      </div>
    </div>

    <!-- Credit Utilization Card -->
    <div class="rounded-2xl p-5 bg-white/5 backdrop-blur-lg">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-[22px] font-medium tracking-tight">Credit Utilization</h2>
        <button class="p-1 rounded hover:bg-white/10 transition"><i data-lucide="trending-up" class="w-5 h-5"></i></button>
      </div>
      <div>
        <canvas id="creditChart" class="mx-auto max-h-40"></canvas>
      </div>
    </div>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 px-6 py-3 bg-white/5 backdrop-blur-lg flex justify-between items-center">
    <button class="flex flex-col items-center gap-1 group">
      <i data-lucide="home" class="w-5 h-5 text-teal-400"></i>
      <span class="text-[12px] text-teal-400">Home</span>
    </button>
    <button class="flex flex-col items-center gap-1 group">
      <i data-lucide="activity" class="w-5 h-5 text-gray-400 group-hover:text-teal-400 transition"></i>
      <span class="text-[12px] text-gray-400 group-hover:text-teal-400 transition">Insights</span>
    </button>
    <button class="flex flex-col items-center gap-1 group">
      <i data-lucide="file-text" class="w-5 h-5 text-gray-400 group-hover:text-teal-400 transition"></i>
      <span class="text-[12px] text-gray-400 group-hover:text-teal-400 transition">Statements</span>
    </button>
    <button class="flex flex-col items-center gap-1 group">
      <i data-lucide="user" class="w-5 h-5 text-gray-400 group-hover:text-teal-400 transition"></i>
      <span class="text-[12px] text-gray-400 group-hover:text-teal-400 transition">Profile</span>
    </button>
  </nav>

  <!-- Scripts -->
  <script>
    // Particles
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 65, "density": { "enable": true, "value_area": 800 } },
        "color": { "value": "#00C896" },
        "opacity": { "value": 0.2, "random": false },
        "size": { "value": 3, "random": true },
        "line_linked": { "enable": false },
        "move": { "enable": true, "speed": 1.2 }
      },
      "interactivity": { "events": { "onhover": { "enable": false } } },
      "retina_detect": true
    });

    // Lucide icons
    lucide.createIcons();

    // Spending Chart
    const spendCtx = document.getElementById('spendChart').getContext('2d');
    new Chart(spendCtx, {
      type: 'doughnut',
      data: {
        labels: ['Housing', 'Food', 'Transport', 'Entertainment', 'Other'],
        datasets: [{
          data: [35, 20, 15, 10, 20],
          backgroundColor: ['#00C896', '#00A97F', '#008F6C', '#00725A', '#005A47'],
          borderWidth: 0
        }]
      },
      options: {
        cutout: '65%',
        plugins: { legend: { display: false } }
      }
    });

    // Credit Utilization Chart
    const creditCtx = document.getElementById('creditChart').getContext('2d');
    new Chart(creditCtx, {
      type: 'line',
      data: {
        labels: ['W1','W2','W3','W4','W5','W6'],
        datasets: [{
          label: 'Utilization %',
          data: [40, 38, 42, 37, 35, 33],
          borderColor: '#00C896',
          backgroundColor: 'rgba(0,200,150,0.1)',
          tension: 0.4,
          fill: true,
          pointRadius: 0
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        scales: {
          x: { display: false },
          y: { display: false, suggestedMin: 0, suggestedMax: 100 }
        }
      }
    });
  </script>
</body>
</html>
