<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bot Selector</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script></head>
  <body class="min-h-screen bg-neutral-950 text-neutral-100 antialiased" style="font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial">
    <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-8">
      <!-- Header -->

      <!-- Controls -->

        <!-- Segmented filter -->

            <span class="font-medium">All</span>
          </button>
          <button data-filter="bullish" class="filter-chip inline-flex items-center gap-2 rounded-full border border-neutral-800 bg-neutral-900/60 px-3.5 py-1.5 text-sm text-neutral-200 hover:bg-neutral-800/60 transition">
            <i data-lucide="trending-up" class="h-4 w-4"></i>
            <span class="font-medium">Bullish</span>
          </button>
          <button data-filter="bearish" class="filter-chip inline-flex items-center gap-2 rounded-full border border-neutral-800 bg-neutral-900/60 px-3.5 py-1.5 text-sm text-neutral-200 hover:bg-neutral-800/60 transition">
            <i data-lucide="trending-down" class="h-4 w-4"></i>
            <span class="font-medium">Bearish</span>
          </button>
          <button data-filter="slicing" class="filter-chip inline-flex items-center gap-2 rounded-full border border-neutral-800 bg-neutral-900/60 px-3.5 py-1.5 text-sm text-neutral-200 hover:bg-neutral-800/60 transition">
            <i data-lucide="scissors" class="h-4 w-4"></i>
            <span class="font-medium">Slicing bots</span>
          </button>
          <button data-filter="sideways" class="filter-chip inline-flex items-center gap-2 rounded-full border border-neutral-800 bg-neutral-900/60 px-3.5 py-1.5 text-sm text-neutral-200 hover:bg-neutral-800/60 transition">
            <i data-lucide="panel-right" class="h-4 w-4"></i>
            <span class="font-medium">Sideways</span>
          </button>
        </div>

        <!-- Search -->
        <div class="md:ml-auto w-full md:w-72">

            <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-neutral-400"></i>
            <input id="search" type="text" placeholder="Search bots..." class="w-full rounded-lg border border-neutral-800 bg-neutral-900/60 pl-9 pr-3 py-2 text-sm text-neutral-200 placeholder:text-neutral-500 focus:outline-none focus:ring-2 focus:ring-purple-500/60 focus:border-transparent" />
          </label>
        </div>

      <!-- Popular bots -->

          <!-- Spot DCA (Martingale) -->
          <button data-bot data-tags="popular,spot,dca,martingale,bearish,slicing" class="group flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-900/60 px-4 py-3 hover:border-neutral-700 hover:bg-neutral-800/60 transition">
            <div class="flex items-center gap-3">

              </div>

          </button>

          <!-- Signal bot -->
          <button data-bot data-tags="popular,signals,automation,bullish,bearish" class="group flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-900/60 px-4 py-3 hover:border-neutral-700 hover:bg-neutral-800/60 transition">

      <!-- Advanced bots -->

        <div class="mb-4">

        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">

            </div>

          <!-- TWAP -->

            <div class="flex items-center gap-3">
              <div class="rounded-lg bg-lime-500/10 p-2 text-lime-400 ring-1 ring-inset ring-lime-500/20">
                <i data-lucide="timer" class="h-5 w-5"></i>
              </div>
              <div class="text-left">

                  <i data-lucide="info" class="h-3.5 w-3.5 text-neutral-500 hover:text-neutral-300 cursor-pointer" data-info="Time-weighted execution that minimizes market impact."></i>

      <!-- Arbitrage bots -->
      <section class="mt-8">
        <div class="mb-4">
          <h2 class="text-lg md:text-xl font-semibold tracking-tight">Arbitrage bots</h2>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          <!-- Smart portfolio -->
          <button data-bot data-tags="arbitrage,portfolio,neutral" class="group flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-900/60 px-4 py-3 hover:border-neutral-700 hover:bg-neutral-800/60 transition">
            <div class="flex items-center gap-3">
              <div class="rounded-lg bg-pink-500/10 p-2 text-pink-400 ring-1 ring-inset ring-pink-500/20">
                <i data-lucide="pie-chart" class="h-5 w-5"></i>
              </div>
              <div class="text-left">
                <div class="flex items-center gap-2">
                  <span class="text-sm font-medium">Smart portfolio</span>
                  <i data-lucide="info" class="h-3.5 w-3.5 text-neutral-500 hover:text-neutral-300 cursor-pointer" data-info="Optimizes weights across assets for risk-adjusted returns."></i>
                </div>
                <p class="text-xs text-neutral-400">Rebalance • Risk parity</p>
              </div>
            </div>
            <i data-lucide="chevron-right" class="h-4 w-4 text-neutral-500 group-hover:text-neutral-300"></i>
          </button>

          <!-- Arbitrage -->
          <button data-bot data-tags="arbitrage,sideways,neutral" class="group flex items-center justify-between rounded-xl border border-neutral-800 bg-neutral-900/60 px-4 py-3 hover:border-neutral-700 hover:bg-neutral-800/60 transition">
            <div class="flex items-center gap-3">
              <div class="rounded-lg bg-sky-500/10 p-2 text-sky-400 ring-1 ring-inset ring-sky-500/20">
                <i data-lucide="arrow-left-right" class="h-5 w-5"></i>
              </div>
              <div class="text-left">
                <div class="flex items-center gap-2">
                  <span class="text-sm font-medium">Arbitrage</span>
                  <i data-lucide="info" class="h-3.5 w-3.5 text-neutral-500 hover:text-neutral-300 cursor-pointer" data-info="Exploits price inefficiencies between markets or pairs."></i>
                </div>
                <p class="text-xs text-neutral-400">Neutral • Market spreads</p>
              </div>
            </div>
            <i data-lucide="chevron-right" class="h-4 w-4 text-neutral-500 group-hover:text-neutral-300"></i>
          </button>
        </div>
      </section>

      <!-- Tooltip -->
      <div id="tooltip" class="pointer-events-none fixed z-50 hidden max-w-xs rounded-md border border-neutral-800 bg-neutral-900/95 px-3 py-2 text-xs text-neutral-200 shadow-lg ring-1 ring-white/5"></div>
    </div>

    <script>
      // Initialize icons
      lucide.createIcons();

      // State
      const chips = Array.from(document.querySelectorAll('.filter-chip'));
      const cards = Array.from(document.querySelectorAll('[data-bot]'));
      const search = document.getElementById('search');
      const tooltip = document.getElementById('tooltip');

      // Default active chip: All
      const setActiveChip = (value) => {
        chips.forEach(chip => {
          const active = chip.getAttribute('data-filter') === value;
          chip.setAttribute('data-active', active ? 'true' : 'false');
          if (active) {
            chip.classList.add('ring-purple-500/60','bg-neutral-800/70');
          } else {
            chip.classList.remove('ring-purple-500/60','bg-neutral-800/70');
          }
        });
      };
      setActiveChip('all');

      let currentFilter = 'all';
      let searchTerm = '';

      const normalize = (s) => s.toLowerCase().trim();

      const applyFilters = () => {
        cards.forEach(card => {
          const tags = (card.dataset.tags || '').split(',').map(normalize);
          const title = normalize(card.querySelector('span.text-sm.font-medium')?.textContent || '');
          const matchesFilter = currentFilter === 'all' ? true : tags.includes(currentFilter);
          const matchesSearch = searchTerm ? (title.includes(searchTerm)) : true;
          const show = matchesFilter && matchesSearch;
          card.style.display = show ? '' : 'none';
        });
      };

      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          currentFilter = chip.getAttribute('data-filter');
          setActiveChip(currentFilter);
          applyFilters();
        });
      });

      search.addEventListener('input', (e) => {
        searchTerm = normalize(e.target.value);
        applyFilters();
      });

      // Simple tooltip for info icons
      let tooltipHideTimeout;
      const showTooltip = (el, text) => {
        tooltip.textContent = text;
        tooltip.classList.remove('hidden');
        const rect = el.getBoundingClientRect();
        const ttRect = tooltip.getBoundingClientRect();
        const top = window.scrollY + rect.top - ttRect.height - 8;
        const left = Math.min(
          window.scrollX + rect.left,
          window.scrollX + window.innerWidth - ttRect.width - 12
        );
        tooltip.style.top = `${top}px`;
        tooltip.style.left = `${left}px`;
      };
      const hideTooltip = () => {
        tooltip.classList.add('hidden');
      };

      document.querySelectorAll('[data-info]').forEach(icon => {
        icon.addEventListener('mouseenter', () => {
          clearTimeout(tooltipHideTimeout);
          showTooltip(icon, icon.getAttribute('data-info'));
        });
        icon.addEventListener('mouseleave', () => {
          tooltipHideTimeout = setTimeout(hideTooltip, 120);
        });
        icon.addEventListener('click', (e) => {
          e.stopPropagation();
          clearTimeout(tooltipHideTimeout);
          showTooltip(icon, icon.getAttribute('data-info'));
          tooltipHideTimeout = setTimeout(hideTooltip, 1600);
        });
      });

      // Card selection handler (placeholder action)
      cards.forEach(card => {
        card.addEventListener('click', () => {
          const name = card.querySelector('span.text-sm.font-medium')?.textContent?.trim() || 'Bot';
          console.log('Selected:', name);
          // Integrate navigation or modal open here
        });
      });
    </script>
  </body>
