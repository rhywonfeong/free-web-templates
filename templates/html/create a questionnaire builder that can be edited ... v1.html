<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Questionnaire Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-2xl p-6 bg-white rounded-lg shadow-lg"
       x-data="questionnaireBuilder()" x-init="initSortable()">
    <h2 class="text-2xl font-bold mb-4 text-gray-800">Questionnaire Builder</h2>
    <div>
      <template x-for="(q, i) in questions" :key="q.id">
        <div class="mb-3 bg-gray-50 border rounded shadow flex items-start group" :data-id="q.id">
          <div class="cursor-move px-2 py-3 flex items-center text-gray-400 hover:text-blue-500">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/>
            </svg>
          </div>
          <div class="flex-1 px-4 py-3">
            <input
              class="w-full border-b bg-transparent outline-none text-lg font-medium text-gray-700 focus:border-blue-400"
              type="text"
              x-model="q.text"
              placeholder="Type your question here..."
            >
            <select class="mt-2 p-2 border rounded w-full"
                    x-model="q.type">
              <option value="text">Short Answer</option>
              <option value="textarea">Paragraph</option>
              <option value="radio">Multiple Choice</option>
              <option value="checkbox">Checkboxes</option>
            </select>
            <div x-show="q.type === 'radio' || q.type === 'checkbox'" class="mt-2 space-y-2">
              <template x-for="(option, oi) in q.options" :key="oi">
                <div class="flex items-center space-x-2">
                  <input
                    class="border px-2 py-1 flex-1 rounded"
                    type="text"
                    x-model="q.options[oi]"
                    placeholder="Option..."
                  >
                  <button @click="removeOption(i, oi)" class="text-red-500 hover:text-red-700" title="Remove option">
                    &times;
                  </button>
                </div>
              </template>
              <button @click="addOption(i)" class="text-blue-500 text-sm hover:underline mt-1">
                + Add Option
              </button>
            </div>
          </div>
          <button @click="removeQuestion(i)" class="p-3 text-gray-400 hover:text-red-600 focus:outline-none" title="Remove question">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </template>
    </div>
    <button @click="addQuestion()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded mt-3 w-full font-semibold">
      + Add Question
    </button>
    <hr class="my-6">
    <h3 class="text-xl font-bold mb-2 text-gray-800">Preview</h3>
    <form @submit.prevent class="space-y-4">
      <template x-for="q in questions" :key="q.id">
        <div>
          <label class="block font-medium text-gray-700 mb-1" x-text="q.text"></label>
          <template x-if="q.type === 'text'">
            <input type="text" class="border p-2 rounded w-full" disabled>
          </template>
          <template x-if="q.type === 'textarea'">
            <textarea class="border p-2 rounded w-full" rows="2" disabled></textarea>
          </template>
          <template x-if="q.type === 'radio'">
            <div>
              <template x-for="(option, oi) in q.options" :key="oi">
                <label class="inline-flex items-center mr-4">
                  <input type="radio" :name="'q'+q.id" disabled>
                  <span class="ml-2" x-text="option"></span>
                </label>
              </template>
            </div>
          </template>
          <template x-if="q.type === 'checkbox'">
            <div>
              <template x-for="(option, oi) in q.options" :key="oi">
                <label class="inline-flex items-center mr-4">
                  <input type="checkbox" :name="'q'+q.id" disabled>
                  <span class="ml-2" x-text="option"></span>
                </label>
              </template>
            </div>
          </template>
        </div>
      </template>
    </form>
  </div>
  <script>
    function questionnaireBuilder() {
      return {
        questions: [
          {
            id: Date.now(),
            text: 'What is your name?',
            type: 'text',
            options: [],
          }
        ],
        addQuestion() {
          this.questions.push({
            id: Date.now() + Math.random(),
            text: '',
            type: 'text',
            options: [],
          });
        },
        removeQuestion(i) {
          this.questions.splice(i, 1);
        },
        addOption(qIdx) {
          this.questions[qIdx].options.push('');
        },
        removeOption(qIdx, oIdx) {
          this.questions[qIdx].options.splice(oIdx, 1);
        },
        initSortable() {
          const el = this.$root.querySelector('[x-data] > div');
          Sortable.create(el, {
            handle: '.cursor-move',
            animation: 150,
            onEnd: evt => {
              const moved = this.questions.splice(evt.oldIndex, 1)[0];
              this.questions.splice(evt.newIndex, 0, moved);
            }
          });
        }
      }
    }
  </script>
</body>
</html>
