<body class="bg-gray-900 text-white overflow-x-hidden">

  <div class="relative min-h-screen flex items-center justify-center overflow-hidden">

    </div>
    
    <!-- Content container -->
    <div class="container mx-auto px-6 relative z-10 flex flex-col lg:flex-row items-center gap-12">
      <!-- Text content -->
      <div class="lg:w-1/2 text-center lg:text-left">
        <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold mb-6 leading-tight">
          <span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">Experience</span> the future of technology

          <button class="px-8 py-3 border border-gray-700 rounded-full font-medium hover:bg-gray-800 transition-all duration-300">

          </button>
        </div>
        
        <!-- Stats -->

          <div class="text-center">

        </div>
      </div>

        <!-- Main device -->
        <div class="relative z-20 transform transition-all duration-500 hover:scale-105 hover:rotate-1">

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-6deg); }
      50% { transform: translateY(-10px) rotate(-6deg); }
    }
    @keyframes float-delayed {
      0%, 100% { transform: translateY(0) rotate(12deg); }
      50% { transform: translateY(-10px) rotate(12deg); }
    }
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
    .animate-float-delayed {
      animation: float-delayed 6s ease-in-out infinite;
      animation-delay: 2s;
    }
