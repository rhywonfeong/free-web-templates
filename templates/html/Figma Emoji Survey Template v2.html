<!DOCTYPE html>
<html lang="en">
<head>
<script>

  <meta charset="UTF-8">
  <title>Satisfaction Survey</title>
  <meta name="viewport" content="width=450, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f6fa;
      min-height: 100vh;
      margin: 0;
    }
    .star.selected {
      color: #10b981;
      transform: scale(1.1);
    }
    ::placeholder { color: #9CA3AF; }
    input[type="file"] { display: none; }
  </style>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const ratingItems = document.querySelectorAll('[data-rating]');
      let selected = -1;
      ratingItems.forEach((el, idx) => {
        el.addEventListener('click', () => {
          selected = idx;
          ratingItems.forEach((item, i) => {
            if (i <= idx) item.classList.add('selected');
            else item.classList.remove('selected');
          });
          document.getElementById('rating-input').value = idx + 1;
        });
      });

      // Screenshot file button
      document.getElementById('ss-btn').addEventListener('click', () => {
        document.getElementById('ss-input').click();
      });
      document.getElementById('ss-input').addEventListener('change', (e) => {
        let label = document.getElementById('ss-label');
        if (e.target.files.length) label.innerText = "Screenshot added";
        else label.innerText = "Add Screenshot";
      });

      // Voice record pseudo functionality
      let rec = false;
      const recBtn = document.getElementById('rec-btn');
      recBtn.addEventListener('click', () => {
        rec = !rec;
        if (rec) {
          recBtn.classList.add('bg-red-500');
          recBtn.classList.remove('bg-gray-100');
          recBtn.querySelector('i').classList.replace('fa-microphone', 'fa-stop');
          recBtn.querySelector('span').textContent = "Recording...";
        } else {
          recBtn.classList.remove('bg-red-500');
          recBtn.classList.add('bg-gray-100');
          recBtn.querySelector('i').classList.replace('fa-stop', 'fa-microphone');
          recBtn.querySelector('span').textContent = "Record Voice";
        }
      });
    });
  </script>
</head>
<body class="flex justify-center items-start p-6 bg-[#f5f6fa]">
  <main class="w-[450px] h-[1000px] bg-white rounded-3xl shadow-lg flex flex-col gap-6 px-8 py-10 mx-auto">
    <!-- Header -->
    <section class="flex flex-col gap-2 items-center">
      <h1 class="text-3xl font-semibold text-gray-900">Customer Satisfaction Survey</h1>
      <p class="text-base text-gray-600 text-center">We value your feedback! Please tell us how satisfied you are with our service today.</p>
    </section>
    <!-- Rating -->
    <section class="flex flex-col gap-3 mt-4">
      <label class="text-lg font-medium text-gray-800 mb-2" for="rating-input">How do you feel about your experience?</label>
      <div class="flex flex-row justify-center items-center gap-6 px-4 py-4 bg-gray-50 rounded-xl">
        <!-- 5 emojis (sad to happy) -->
        <button
          type="button"
          data-rating="1"
          aria-label="Very Dissatisfied"
          class="star transition text-3xl bg-white rounded-full shadow-sm hover:ring-2 hover:ring-red-400 px-3 py-2"
        >😭</button>
        <button
          type="button"
          data-rating="2"
          aria-label="Dissatisfied"
          class="star transition text-3xl bg-white rounded-full shadow-sm hover:ring-2 hover:ring-orange-400 px-3 py-2"
        >😞</button>
        <button
          type="button"
          data-rating="3"
          aria-label="Neutral"
          class="star transition text-3xl bg-white rounded-full shadow-sm hover:ring-2 hover:ring-yellow-400 px-3 py-2"
        >😐</button>
        <button
          type="button"
          data-rating="4"
          aria-label="Satisfied"
          class="star transition text-3xl bg-white rounded-full shadow-sm hover:ring-2 hover:ring-green-400 px-3 py-2"
        >😊</button>
        <button
          type="button"
          data-rating="5"
          aria-label="Very Satisfied"
          class="star transition text-3xl bg-white rounded-full shadow-sm hover:ring-2 hover:ring-emerald-400 px-3 py-2"
        >😁</button>
      </div>
      <input id="rating-input" type="hidden" name="rating" value="">
    </section>
    <!-- Feedback -->
    <section class="flex flex-col gap-2 mt-1">
      <label for="feedback" class="text-lg font-medium text-gray-800 mb-2">Additional feedback</label>
      <textarea
        id="feedback"
        name="feedback"
        rows="5"
        class="resize-none w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-emerald-400 focus:ring-2 focus:ring-emerald-100 text-gray-800 shadow-sm"
        placeholder="Let us know what we did well or how we can improve..."
      ></textarea>
    </section>
    <!-- Tools: Screenshot & Voice Recording -->
    <section class="flex flex-row gap-4 my-2 justify-center">
      <!-- Screenshot -->
      <div class="flex flex-row items-center gap-2 bg-gray-100 rounded-xl px-4 py-2 shadow-sm">
        <input type="file" id="ss-input" accept="image/*">
        <button type="button" id="ss-btn" class="flex items-center gap-1 p-0 hover:text-emerald-600">
          <i class="fa-regular fa-image text-2xl"></i>
          <span id="ss-label" class="font-medium text-gray-700">Add Screenshot</span>
        </button>
      </div>
      <!-- Voice Recording -->
      <button
        type="button"
        id="rec-btn"
        class="flex flex-row items-center gap-2 bg-gray-100 hover:bg-red-100 transition rounded-xl px-4 py-2 shadow-sm"
      >
        <i class="fa-solid fa-microphone text-xl text-emerald-500"></i>
        <span class="font-medium text-gray-700">Record Voice</span>
      </button>
    </section>
    <!-- Submit -->
    <section class="flex flex-col mt-auto">
      <button
        type="submit"
        class="w-full py-4 rounded-2xl bg-gray-900 text-white font-semibold text-lg shadow-md hover:bg-emerald-600 transition"
      >
        Submit Feedback
      </button>
    </section>
  </main>
</body>
</html>
