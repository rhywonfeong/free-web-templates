  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            linear: {
              bg: '#101014',
              card: '#1a1a1f',
              accent: '#5e6ad2',
              text: '#e2e2e2',
              subdued: '#8a8f98'
            }
          }
        }
      }
    }
  </script>

<body class="bg-linear-bg text-linear-text p-6 flex items-center justify-center min-h-screen font-sans antialiased">
  <div class="max-w-md w-full">
    <!-- Flight Card -->
    <div class="bg-linear-card rounded-xl overflow-hidden border border-white/5 shadow-xl">
      <!-- Card Header -->
      <div class="p-5 flex justify-between items-center border-b border-white/5">
        <div>
          <h3 class="font-medium text-sm">Flight Details</h3>
          <p class="text-linear-subdued text-xs">Confirmation #A12BCD</p>
        </div>
        <div class="bg-linear-accent/10 text-linear-accent px-3 py-1 rounded-full text-xs font-medium">
          Confirmed
        </div>
      </div>
      
      <!-- Flight Route -->
      <div class="p-5 flex items-center justify-between">
        <div class="text-center">
          <p class="text-2xl font-semibold">SFO</p>
          <p class="text-linear-subdued text-xs mt-1">San Francisco</p>
        </div>
        
        <div class="flex-1 flex flex-col items-center px-4">
          <div class="w-full flex items-center">
            <div class="h-[1px] flex-1 bg-white/10"></div>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-linear-subdued mx-2 rotate-90" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
            </svg>
            <div class="h-[1px] flex-1 bg-white/10"></div>
          </div>
          <p class="text-linear-subdued text-xs mt-1">4h 35m</p>
        </div>
        
        <div class="text-center">
          <p class="text-2xl font-semibold">NYC</p>
          <p class="text-linear-subdued text-xs mt-1">New York</p>
        </div>
      </div>
      
      <!-- Flight Details -->
      <div class="p-5 grid grid-cols-3 gap-4 border-t border-white/5">
        <div>
          <p class="text-linear-subdued text-xs">Date</p>
          <p class="font-medium mt-1">Nov 24, 2023</p>
        </div>
        <div>
          <p class="text-linear-subdued text-xs">Departure</p>
          <p class="font-medium mt-1">07:45 AM</p>
        </div>
        <div>
          <p class="text-linear-subdued text-xs">Arrival</p>
          <p class="font-medium mt-1">04:20 PM</p>
        </div>
      </div>
      
      <!-- Passenger Info -->
      <div class="p-5 flex justify-between items-center border-t border-white/5">
        <div>
          <p class="text-linear-subdued text-xs">Passenger</p>
          <p class="font-medium mt-1">Alex Morgan</p>
        </div>
        <div>
          <p class="text-linear-subdued text-xs">Seat</p>
          <p class="font-medium mt-1 text-center">14A</p>
        </div>
        <div>
          <p class="text-linear-subdued text-xs">Class</p>
          <p class="font-medium mt-1">Business</p>
        </div>
      </div>
      
      <!-- Card Footer -->
      <div class="p-5 flex justify-between items-center border-t border-white/5 bg-linear-bg/40">
        <div class="flex items-center">
          <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center mr-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-linear-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <div>
            <p class="text-xs text-linear-subdued">Check-in opens</p>
            <p class="text-sm font-medium">24h before departure</p>
          </div>
        </div>
        <button class="bg-linear-accent hover:bg-linear-accent/90 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
          Manage
        </button>
      </div>
    </div>
  </div>
</body>
</html>
