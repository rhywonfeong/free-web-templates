<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dream Stay Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
* { font-family: 'Inter', sans-serif;}
@keyframes fadeInUp { 0% {opacity:0;transform:translateY(24px)} 100% {opacity:1;transform:translateY(0)} }
.animate-fadeInUp { animation: fadeInUp 0.55s cubic-bezier(0.23,1,0.32,1) forwards; opacity:0;}
</style></head>
<body class="bg-gray-50 text-gray-900 min-h-screen antialiased flex flex-col items-center justify-between sm:justify-start relative">

  <!-- Main Wrapper -->
  <div class="w-full max-w-sm flex flex-col items-center pt-8 pb-36 px-2 sm:px-0">

    <!-- Search Card -->
    <section class="w-full">
      <div class="bg-white rounded-3xl shadow px-5 sm:px-6 py-6 animate-fadeInUp" style="animation-delay:0.1s;">
        <h1 class="text-[1.55rem] sm:text-2xl font-medium tracking-tight leading-tight mb-7 animate-fadeInUp" style="animation-delay:0.15s;">
          Find Your <span class="font-semibold">Dream Stay</span>
        </h1>
        <!-- Location -->
        <button class="group w-full flex items-center justify-between bg-gray-100 hover:bg-gray-200 outline-none focus-visible:ring-2 focus-visible:ring-lime-300 rounded-full px-5 py-3 mb-4 transition animate-fadeInUp" style="animation-delay:0.22s;">
          <span class="flex items-center gap-3 text-gray-500 group-hover:text-gray-700 transition">
            <i data-lucide="map-pin" class="w-5 h-5"></i>
            <span class="text-sm sm:text-base">Add your location</span>
          </span>
          <i data-lucide="chevron-down" class="w-5 h-5 text-gray-400"></i>
        </button>
        <!-- Date -->
        <button class="group w-full flex items-center justify-between bg-gray-100 hover:bg-gray-200 outline-none focus-visible:ring-2 focus-visible:ring-lime-300 rounded-full px-5 py-3 mb-4 transition animate-fadeInUp" style="animation-delay:0.27s;">
          <span class="flex items-center gap-3 text-gray-500 group-hover:text-gray-700 transition">
            <i data-lucide="calendar" class="w-5 h-5"></i>
            <span class="text-sm sm:text-base">Check In - Check Out</span>
          </span>
          <i data-lucide="chevron-down" class="w-5 h-5 text-gray-400"></i>
        </button>
        <!-- Guests & Price -->
        <div class="flex gap-2 mb-6 animate-fadeInUp" style="animation-delay:0.32s;">
          <button class="group flex-1 flex items-center justify-between bg-gray-100 hover:bg-gray-200 outline-none focus-visible:ring-2 focus-visible:ring-lime-300 rounded-full px-5 py-3 transition">
            <span class="flex items-center gap-3 text-gray-500 group-hover:text-gray-700 transition">
              <i data-lucide="users" class="w-5 h-5"></i>
              <span class="text-sm sm:text-base">Guest</span>
            </span>
            <i data-lucide="chevron-down" class="w-5 h-5 text-gray-400"></i>
          </button>
          <button class="group flex-1 flex items-center justify-between bg-gray-100 hover:bg-gray-200 outline-none focus-visible:ring-2 focus-visible:ring-lime-300 rounded-full px-5 py-3 transition">
            <span class="flex items-center gap-3 text-gray-500 group-hover:text-gray-700 transition">
              <i data-lucide="wallet" class="w-5 h-5"></i>
              <span class="text-sm sm:text-base">Price</span>
            </span>
            <i data-lucide="chevron-down" class="w-5 h-5 text-gray-400"></i>
          </button>
        </div>
        <!-- Categories -->
        <div class="flex flex-wrap gap-2 mb-8 animate-fadeInUp" style="animation-delay:0.37s;">
          <button data-category class="bg-lime-300 text-black font-semibold rounded-full px-4 py-2 text-sm shadow-sm transition border border-transparent hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-300">Villa</button>
          <button data-category class="border border-gray-200 text-gray-700 rounded-full px-4 py-2 text-sm transition hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-300">Hotel</button>
          <button data-category class="border border-gray-200 text-gray-700 rounded-full px-4 py-2 text-sm transition hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-300">Apartment</button>
          <button data-category class="border border-gray-200 text-gray-700 rounded-full px-4 py-2 text-sm transition hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-300">Resport</button>
          <button data-category class="border border-gray-200 text-gray-700 rounded-full px-4 py-2 text-sm transition hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-300">Eco-Lodge</button>
          <button data-category class="border border-gray-200 text-gray-700 rounded-full px-4 py-2 text-sm transition hover:bg-gray-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-300">Campsite</button>
        </div>
        <!-- Search Button -->
        <button class="w-full bg-lime-400 hover:bg-lime-500 active:bg-lime-600 text-black font-semibold rounded-full py-3 text-lg transition shadow-md animate-fadeInUp" style="animation-delay:0.42s;">
          Search
        </button>
      </div>
      <!-- Special Offer -->
      <div class="mt-10 animate-fadeInUp" style="animation-delay:0.55s;">
        <h2 class="text-lg sm:text-xl font-medium tracking-tight mb-4">Today’s Special Offer 🎉</h2>
        <div class="relative rounded-3xl overflow-hidden shadow-md group">
          <img src="https://images.unsplash.com/photo-1621619856624-42fd193a0661?w=1080&q=80" alt="Special offer" class="w-full h-56 object-cover scale-100 group-hover:scale-105 transition duration-300">
          <button class="absolute top-3 right-3 bg-white/80 backdrop-blur-md rounded-full p-2 hover:bg-lime-100 transition outline-none focus-visible:ring-2 focus-visible:ring-lime-300 border border-white shadow">
            <i data-lucide="heart" class="w-5 h-5 text-gray-700"></i>
          </button>
        </div>
      </div>
    </section>
  </div>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 inset-x-0 bg-white shadow-[0_-2px_16px_rgba(0,0,0,0.05)] flex items-center justify-between px-5 py-4 sm:px-10 rounded-t-3xl max-w-sm mx-auto border-t border-gray-100 z-20 animate-fadeInUp" style="animation-delay:0.7s;">
    <button data-nav class="flex flex-col items-center gap-1 text-gray-400 hover:text-black transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-300">
      <i data-lucide="home" class="w-6 h-6"></i>
    </button>
    <button class="flex items-center gap-2 bg-black text-white px-7 py-3 rounded-full shadow-lg hover:bg-gray-900 transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-300">
      <i data-lucide="search" class="w-5 h-5"></i>
      <span class="font-medium">Search</span>
    </button>
    <button data-nav class="flex flex-col items-center gap-1 text-gray-400 hover:text-black transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-300">
      <i data-lucide="heart" class="w-6 h-6"></i>
    </button>
    <button data-nav class="flex flex-col items-center gap-1 text-gray-400 hover:text-black transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-lime-300">
      <i data-lucide="user" class="w-6 h-6"></i>
    </button>
  </nav>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons({strokeWidth:1.5});
      // Animate on load (staggered)
      [...document.querySelectorAll('.animate-fadeInUp')].forEach((el, i) => {
        setTimeout(()=>{el.style.opacity=1;el.style.animationPlayState='running';}, i*70+100);
      });

      // Category toggle
      document.querySelectorAll('[data-category]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-category]').forEach(b => {
            b.classList.remove('bg-lime-300','text-black','font-semibold','shadow-sm','border-transparent');
            b.classList.add('border','border-gray-200','text-gray-700');
          });
          btn.classList.remove('border','border-gray-200','text-gray-700');
          btn.classList.add('bg-lime-300','text-black','font-semibold','shadow-sm','border-transparent');
        });
      });
      // Bottom nav active state
      document.querySelectorAll('[data-nav]').forEach(icon => {
        icon.addEventListener('click', () => {
          document.querySelectorAll('[data-nav]').forEach(i => i.classList.add('text-gray-400'));
          icon.classList.remove('text-gray-400');
          icon.classList.add('text-black');
        });
      });
    });
  </script>
</body>
</html>
