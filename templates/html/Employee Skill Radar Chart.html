<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>Employee Skill Assessment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-neutral-950 via-neutral-900 to-neutral-800 min-h-screen flex items-center justify-center">
  <div class="max-w-2xl w-full rounded-3xl p-8 bg-white/5 border border-white/10 shadow-2xl backdrop-blur-2xl flex flex-col gap-8 relative">
    <header class="flex flex-col gap-2 items-center">
      <h2 class="text-3xl font-bold text-white tracking-tight">Employee Skill Assessment</h2>
      <p class="text-center text-white/60 text-lg font-medium">2024 Competency Radar</p>
    </header>
    <div class="w-full flex justify-center items-center">
      <div class="relative w-[480px] h-[480px]">
        <svg id="radar" width="480" height="480" viewBox="0 0 480 480" class="block select-none"></svg>
      </div>
    </div>
    <div class="flex flex-row justify-between items-center mt-7">
      <div>
        <div class="text-5xl font-bold text-cyan-400" id="avgScore">–</div>
        <div class="text-sm text-white/60 tracking-wide font-semibold uppercase">Avg. Skill Score</div>
      </div>
      <button id="viewData" class="font-bold text-base px-6 py-3 rounded-xl bg-white/10 border border-cyan-400/30 text-cyan-400 hover:bg-cyan-400/10 hover:text-cyan-300 shadow transition">Raw Data</button>
    </div>
    <div id="modal" class="fixed hidden inset-0 bg-black/70 flex items-center justify-center z-50">
      <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl px-12 py-10 shadow-2xl max-w-md mx-auto relative">
        <button id="closeModal" class="absolute right-8 top-5 text-white text-3xl hover:text-cyan-400 font-bold">&times;</button>
        <h3 class="text-2xl font-bold text-cyan-400 mb-5">Skill Scores</h3>
        <table class="w-full text-left text-xl text-white mb-3">
          <thead>
            <tr><th class="font-medium pb-3">Skill</th><th class="font-medium pb-3 text-right">Score</th></tr>
          </thead>
          <tbody id="modalTable"></tbody>
        </table>
        <div class="w-full mt-5 text-right text-cyan-400 font-bold text-xl">Avg: <span id="modalAvg"></span></div>
      </div>
    </div>
    <script>
      // Data and dimensions
      const skills = [
        { skill: "Communication",    score: 78 },
        { skill: "Technical Skills", score: 85 },
        { skill: "Leadership",       score: 67 },
        { skill: "Creativity",       score: 72 },
        { skill: "Teamwork",         score: 89 },
        { skill: "Time Management",  score: 77 }
      ];
      const N = skills.length, MAX = 100;
      // SVG geometry
      const SVG_SIZE = 480,   // SVG & container dimensions
            CX = SVG_SIZE/2, CY = SVG_SIZE/2,
            RAD = 180,
            MIN_R = 55,
            LABEL_MARGIN = 48, // How far labels are beyond main radius (increase for safety)
            LABEL_R = RAD + LABEL_MARGIN;

      function polar(i, r) {
        const a = (2 * Math.PI) * (i / N) - Math.PI/2;
        return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
      }
      function drawRadar() {
        const svg = document.getElementById('radar');
        svg.innerHTML = '';
        // Grid circles
        [0.25,0.5,0.75,1].forEach(f=>{
          svg.innerHTML += `<circle cx="${CX}" cy="${CY}" r="${MIN_R+f*(RAD-MIN_R)}"
           fill="none" stroke="#e5e7eb" stroke-dasharray="2 5" stroke-width="1" opacity="0.13"/>`
        });
        // Axes
        for(let i=0;i<N;++i){
          const [x,y] = polar(i, RAD);
          svg.innerHTML += `<line x1="${CX}" y1="${CY}" x2="${x}" y2="${y}" stroke="#e5e7eb" stroke-width="1.2" opacity="0.18"/>`
        }
        // Radar polygon
        const pts = skills.map((d,i)=>polar(i,MIN_R+Math.max(0,Math.min(d.score/MAX,1))*(RAD-MIN_R)));
        svg.innerHTML += `
          <polygon points="${pts.map(p=>p.join(',')).join(' ')}"
            fill="#67e8f94a" stroke="#00e9ea" stroke-width="2.2" stroke-linejoin="round" opacity="0.98"/>`;
        // Points and labels
        pts.forEach((p,i)=>{
          svg.innerHTML += `<circle cx="${p[0]}" cy="${p[1]}" r="10" fill="#101420" stroke="#06b6d4" stroke-width="2.5"/>`;
          // Outward label, subtle, never cropped
          const [lx,ly]=polar(i,LABEL_R);
          svg.innerHTML += `<text x="${lx}" y="${ly}" text-anchor="middle" alignment-baseline="middle"
            font-size="1rem" font-weight="500" fill="#a1a1aa"
            style="letter-spacing:0.01em;font-family:inherit;dominant-baseline:middle;">${skills[i].skill}</text>`;
        });
      }
      drawRadar();
      function mean(arr) {return arr.reduce((a,b)=>a+b,0)/arr.length;}
      document.getElementById('avgScore').textContent = mean(skills.map(d=>d.score)).toFixed(1);
      document.getElementById('viewData').onclick = ()=>{
        document.getElementById('modal').classList.remove('hidden');
        document.getElementById('modalTable').innerHTML =
          skills.map(d=>`<tr>
            <td class="py-2">${d.skill}</td>
            <td class="py-2 text-right font-bold">${d.score}</td>
          </tr>`).join('');
        document.getElementById('modalAvg').textContent = mean(skills.map(d=>d.score)).toFixed(1);
      };
      document.getElementById('closeModal').onclick = ()=>{document.getElementById('modal').classList.add('hidden');};
      document.getElementById('modal').onclick = e=>{if(e.target.id==='modal') document.getElementById('modal').classList.add('hidden');};
    </script>
  </div>
</body>
</html>
