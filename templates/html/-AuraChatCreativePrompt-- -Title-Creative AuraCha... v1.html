<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClariFi Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen w-full bg-[#0F1419] text-white font-sans relative overflow-x-hidden selection:bg-[#00C896]/60 selection:text-white">

  <!-- Particle Stars -->
  <div id="particles-js" class="absolute inset-0 -z-10"></div>

  <!-- Header -->
  <header class="flex items-center justify-between px-5 pt-6 pb-4">
    <h1 class="text-3xl font-semibold tracking-tight" style="color:#00C896;">ClariFi</h1>
    <button aria-label="profile" class="relative">
      <img src="https://source.unsplash.com/48x48/?face" alt="User Avatar" class="h-10 w-10 rounded-full ring-2 ring-[#00C896]/60 object-cover"/>
    </button>
  </header>

  <!-- Scrollable Content -->
  <main class="pb-28 space-y-6 px-4">

    <!-- Key Metrics Orbs -->
    <section class="grid grid-cols-2 gap-4">
      <!-- Total Balance -->
      <button id="balanceOrb" class="relative aspect-square rounded-full bg-white/5 backdrop-blur-lg ring-1 ring-white/10 overflow-hidden transition-all duration-300 ease-in-out hover:ring-[#00C896]/70 active:scale-95">
        <div class="absolute inset-0 bg-gradient-to-br from-white/10 via-white/5 to-transparent mix-blend-overlay pointer-events-none"></div>
        <div class="flex flex-col items-center justify-center h-full space-y-1">
          <span class="text-sm text-white/70">Total Balance</span>
          <span class="text-2xl font-semibold tracking-tight">$8,420</span>
        </div>
      </button>
      <!-- Credit Score -->
      <button id="creditOrb" class="relative aspect-square rounded-full bg-white/5 backdrop-blur-lg ring-1 ring-white/10 overflow-hidden transition-all duration-300 ease-in-out hover:ring-[#00C896]/70 active:scale-95">
        <div class="absolute inset-0 bg-gradient-to-br from-white/10 via-white/5 to-transparent mix-blend-overlay pointer-events-none"></div>
        <div class="flex flex-col items-center justify-center h-full space-y-1">
          <span class="text-sm text-white/70">Credit Score</span>
          <span class="text-2xl font-semibold tracking-tight">712</span>
        </div>
      </button>
      <!-- Spending -->
      <button id="spendingOrb" class="relative aspect-square rounded-full bg-white/5 backdrop-blur-lg ring-1 ring-white/10 overflow-hidden transition-all duration-300 ease-in-out hover:ring-[#00C896]/70 active:scale-95 col-span-2">
        <div class="absolute inset-0 bg-gradient-to-br from-white/10 via-white/5 to-transparent mix-blend-overlay pointer-events-none"></div>
        <div class="flex flex-col items-center justify-center h-full space-y-1">
          <span class="text-sm text-white/70">Monthly Spend</span>
          <span class="text-2xl font-semibold tracking-tight">$1,320</span>
        </div>
      </button>
    </section>

    <!-- Liquid Glass Cards -->
    <section class="space-y-4">

      <!-- Spending Breakdown Card -->
      <div class="relative rounded-3xl p-5 bg-white/5 backdrop-blur-lg ring-1 ring-white/10 overflow-hidden">
        <div class="absolute -top-16 -left-16 w-60 h-60 rounded-full bg-[#00C896]/20 blur-3xl"></div>
        <h2 class="text-xl font-semibold tracking-tight mb-4 flex items-center gap-2">
          <i data-lucide="activity" class="w-5 h-5" style="color:#00C896;"></i>
          Spending Breakdown
        </h2>
        <div class="flex items-center justify-center">
          <canvas id="spendChart" class="max-w-[220px]"></canvas>
        </div>
        <ul class="mt-5 grid grid-cols-2 gap-3 text-sm">
          <li class="flex items-center gap-2">
            <span class="inline-block w-3 h-3 rounded-full" style="background:#00C896;"></span>
            Groceries
          </li>
          <li class="flex items-center gap-2">
            <span class="inline-block w-3 h-3 rounded-full bg-blue-500"></span>
            Utilities
          </li>
          <li class="flex items-center gap-2">
            <span class="inline-block w-3 h-3 rounded-full bg-indigo-500"></span>
            Rent
          </li>
          <li class="flex items-center gap-2">
            <span class="inline-block w-3 h-3 rounded-full bg-rose-500"></span>
            Dining
          </li>
        </ul>
      </div>

      <!-- Credit Utilization Card -->
      <div class="relative rounded-3xl p-5 bg-white/5 backdrop-blur-lg ring-1 ring-white/10 overflow-hidden">
        <div class="absolute -bottom-16 -right-16 w-60 h-60 rounded-full bg-[#00C896]/20 blur-3xl"></div>
        <h2 class="text-xl font-semibold tracking-tight mb-4 flex items-center gap-2">
          <i data-lucide="credit-card" class="w-5 h-5" style="color:#00C896;"></i>
          Credit Utilization
        </h2>
        <div class="flex items-center justify-center">
          <canvas id="creditChart" class="max-w-[260px]"></canvas>
        </div>
      </div>

    </section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[90%] max-w-sm rounded-full bg-white/5 backdrop-blur-lg ring-1 ring-white/10 flex justify-around py-3">
    <button class="group flex flex-col items-center gap-1">
      <i data-lucide="home" class="w-5 h-5 text-white/70 group-hover:text-[#00C896] transition-colors"></i>
      <span class="text-[11px] group-hover:text-[#00C896]">Home</span>
    </button>
    <button class="group flex flex-col items-center gap-1">
      <i data-lucide="bar-chart-2" class="w-5 h-5 text-white/70 group-hover:text-[#00C896] transition-colors"></i>
      <span class="text-[11px] group-hover:text-[#00C896]">Insights</span>
    </button>
    <button class="group flex flex-col items-center gap-1">
      <i data-lucide="file-text" class="w-5 h-5 text-white/70 group-hover:text-[#00C896] transition-colors"></i>
      <span class="text-[11px] group-hover:text-[#00C896]">Statements</span>
    </button>
    <button class="group flex flex-col items-center gap-1">
      <i data-lucide="user" class="w-5 h-5 text-white/70 group-hover:text-[#00C896] transition-colors"></i>
      <span class="text-[11px] group-hover:text-[#00C896]">Profile</span>
    </button>
  </nav>

  <!-- Scripts -->
  <script>
    // ParticlesJS
    particlesJS("particles-js", {
      "particles": {
        "number": { "value": 60, "density": { "enable": true, "value_area": 800 }},
        "color": { "value": "#ffffff" },
        "shape": { "type": "circle" },
        "opacity": { "value": 0.15, "random": true },
        "size": { "value": 2, "random": true },
        "move": { "enable": true, "speed": 0.4 }
      },
      "interactivity": { "detect_on": "canvas", "events": { "onhover": { "enable": false } } },
      "retina_detect": true
    });

    // Lucide Icons
    lucide.createIcons();

    // Chart.js – Spending Breakdown
    const spendCtx = document.getElementById('spendChart').getContext('2d');
    new Chart(spendCtx, {
      type: 'doughnut',
      data: {
        labels: ['Groceries','Utilities','Rent','Dining'],
        datasets: [{
          data: [320, 150, 600, 250],
          backgroundColor: ['#00C896','rgba(59,130,246,0.8)','rgba(99,102,241,0.8)','rgba(244,63,94,0.8)'],
          borderWidth: 0
        }]
      },
      options: {
        cutout: '68%',
        plugins: { legend: { display:false } },
        layout:{padding:0}
      }
    });

    // Chart.js – Credit Utilization Line
    const creditCtx = document.getElementById('creditChart').getContext('2d');
    new Chart(creditCtx, {
      type: 'line',
      data: {
        labels: ['Jan','Feb','Mar','Apr','May','Jun'],
        datasets: [{
          data: [35,40,38,34,30,28],
          tension: 0.4,
          borderColor: '#00C896',
          borderWidth: 2,
          fill: true,
          backgroundColor: 'rgba(0,200,150,0.08)',
          pointRadius: 0
        }]
      },
      options: {
        plugins:{ legend:{display:false} },
        scales:{ x:{display:false}, y:{display:false}}
      }
    });
  </script>
</body>
</html>
