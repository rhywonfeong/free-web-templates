  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Popover</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen flex items-center justify-center p-4">
  <!-- Payment Popover -->
  <div class="w-80 bg-zinc-900 rounded-lg shadow-xl overflow-hidden border border-zinc-800">
    <!-- Header -->
    <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
      <h3 class="text-sm font-medium">Payment Details</h3>
      <button class="text-zinc-400 hover:text-zinc-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    
    <!-- Payment Summary -->
    <div class="p-4 bg-zinc-800/50">
      <div class="flex justify-between mb-2">
        <span class="text-xs text-zinc-400">Subscription Plan</span>
        <span class="text-xs">Premium Monthly</span>
      </div>
      <div class="flex justify-between mb-2">
        <span class="text-xs text-zinc-400">Billing Cycle</span>
        <span class="text-xs">Monthly</span>
      </div>
      <div class="flex justify-between font-medium">
        <span class="text-xs">Total Due Today</span>
        <span class="text-xs">$15.99</span>
      </div>
    </div>
    
    <!-- Payment Form -->
    <form class="p-4">
      <!-- Card Number -->
      <div class="mb-3">
        <label for="cardNumber" class="block text-xs text-zinc-400 mb-1">Card Number</label>
        <div class="relative">
          <input type="text" id="cardNumber" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="1234 5678 9012 3456">
          <div class="absolute right-3 top-2">
            <svg class="w-4 h-4 text-zinc-400" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <rect x="2" y="5" width="20" height="14" rx="2" stroke-width="2"/>
              <line x1="2" y1="10" x2="22" y2="10" stroke-width="2"/>
            </svg>
          </div>
        </div>
      </div>
      
      <!-- Card Details (Expiry and CVC) -->
      <div class="flex space-x-3 mb-3">
        <div class="w-1/2">
          <label for="expiry" class="block text-xs text-zinc-400 mb-1">Expiry Date</label>
          <input type="text" id="expiry" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="MM/YY">
        </div>
        <div class="w-1/2">
          <label for="cvc" class="block text-xs text-zinc-400 mb-1">CVC</label>
          <input type="text" id="cvc" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="123">
        </div>
      </div>
      
      <!-- Name on Card -->
      <div class="mb-4">
        <label for="nameOnCard" class="block text-xs text-zinc-400 mb-1">Name on Card</label>
        <input type="text" id="nameOnCard" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500" placeholder="John Doe">
      </div>
      
      <!-- Save Card Toggle -->
      <div class="flex items-center mb-4">
        <input type="checkbox" id="saveCard" class="w-3 h-3 text-indigo-600 bg-zinc-800 border-zinc-700 rounded focus:ring-indigo-500">
        <label for="saveCard" class="ml-2 text-xs text-zinc-400">Save card for future payments</label>
      </div>
      
      <!-- Payment Button -->
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded text-xs font-medium transition-colors">Pay $15.99</button>
    </form>
    
    <!-- Footer -->
    <div class="p-3 border-t border-zinc-800 flex justify-center items-center">
      <div class="text-[10px] text-zinc-500 flex items-center">
        <svg class="w-3 h-3 mr-1" viewBox="0 0 24 24" fill="none">
          <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2"/>
          <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Secure payment processed by Stripe
      </div>
    </div>
  </div>
</body>
</html>
