<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet"><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body style="font-family: 'Inter', sans-serif;" class="bg-zinc-950 text-zinc-50 h-screen w-screen flex flex-col overflow-hidden antialiased selection:bg-zinc-800 selection:text-zinc-100">

    <!-- Header Navigation -->
    <header class="flex items-center justify-between px-4 sm:px-6 py-3 border-b border-zinc-800/60 bg-zinc-950 shrink-0 z-10">
        <div class="flex items-center gap-4">
            <!-- Minimal Logo -->
            <div class="flex items-center justify-center w-8 h-8 rounded-md bg-zinc-50 text-zinc-950 shadow-sm">
                <span class="text-xs font-medium tracking-tighter">DM</span>
            </div>
            
            <div class="h-4 w-px bg-zinc-800 hidden sm:block"></div>
            
            <nav class="hidden sm:flex items-center gap-6 text-sm">
                <a href="#" class="text-zinc-100 font-medium transition-colors">Overview</a>
                <a href="#" class="text-zinc-500 hover:text-zinc-300 font-normal transition-colors">Documentation</a>
                <a href="#" class="text-zinc-500 hover:text-zinc-300 font-normal transition-colors">Settings</a>
            </nav>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden sm:flex items-center px-2.5 py-1.5 bg-zinc-900 border border-zinc-800 rounded-md text-xs font-normal text-zinc-400 gap-2">
                <span class="flex h-2 w-2 rounded-full bg-emerald-500/80 shadow-[0_0_8px_rgba(16,185,129,0.4)]"></span>
                System Operational
            </div>
            
            <button class="flex items-center justify-center w-8 h-8 rounded text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition-all">
                <iconify-icon icon="solar:bell-linear" width="20" height="20" style="stroke-width: 1.5px;"></iconify-icon>
            </button>
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-zinc-800 to-zinc-700 border border-zinc-600/50"></div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col overflow-hidden relative p-2 sm:p-4 lg:p-8 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-zinc-900/40 via-zinc-950 to-zinc-950">
        
        <!-- Header Text (Visible mainly on larger screens for context) -->
        <div class="mb-6 hidden sm:block px-2">
            <h1 class="text-2xl font-medium tracking-tight text-zinc-100">Application Viewer</h1>
            <p class="text-sm font-normal text-zinc-500 mt-1">Interacting with remote instance securely.</p>
        </div>

        <!-- Browser/App Frame -->
        <div class="flex-1 flex flex-col w-full max-w-7xl mx-auto rounded-xl border border-zinc-800/80 bg-zinc-900/30 shadow-2xl overflow-hidden backdrop-blur-sm relative z-0">
            
            <!-- Window Controls Bar -->
            <div class="h-12 bg-zinc-900/90 border-b border-zinc-800/60 flex items-center justify-between px-4 shrink-0">
                <div class="flex items-center gap-2.5 w-1/3">
                    <div class="w-3 h-3 rounded-full bg-zinc-700/50 border border-zinc-600/30"></div>
                    <div class="w-3 h-3 rounded-full bg-zinc-700/50 border border-zinc-600/30"></div>
                    <div class="w-3 h-3 rounded-full bg-zinc-700/50 border border-zinc-600/30"></div>
                </div>
                
                <!-- URL Bar -->
                <div class="flex-1 max-w-md flex items-center justify-center">
                    <div class="flex items-center gap-2 px-3 py-1.5 rounded-md bg-zinc-950/50 border border-zinc-800/80 text-xs font-normal text-zinc-400 w-full sm:w-auto shadow-inner">
                        <iconify-icon icon="solar:lock-keyhole-linear" width="14" height="14" style="stroke-width: 1.5px;"></iconify-icon>
                        <span class="truncate">dogeminer2.com</span>
                    </div>
                </div>
                
                <div class="w-1/3 flex justify-end gap-2 text-zinc-500">
                    <button class="hover:text-zinc-200 transition-colors p-1" title="Refresh">
                        <iconify-icon icon="solar:refresh-linear" width="18" height="18" style="stroke-width: 1.5px;"></iconify-icon>
                    </button>
                    <button class="hover:text-zinc-200 transition-colors p-1 hidden sm:block" title="Expand">
                        <iconify-icon icon="solar:maximize-square-linear" width="18" height="18" style="stroke-width: 1.5px;"></iconify-icon>
                    </button>
                </div>
            </div>

            <!-- Iframe Container -->
            <div class="flex-1 relative bg-[#1c1c1c]">
                <!-- Loading State placeholder (simulated) -->
                <div class="absolute inset-0 flex items-center justify-center -z-10 bg-zinc-900">
                    <iconify-icon icon="solar:spinner-linear" class="animate-spin text-zinc-700" width="24" height="24"></iconify-icon>
                </div>
                
                <iframe 
                    src="https://dogeminer2.com" 
                    class="absolute inset-0 w-full h-full border-none"
                    title="Embedded Application"
                    allowfullscreen>
                </iframe>
            </div>
        </div>
        
        <!-- Subtle bottom glow -->
        <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-3/4 h-24 bg-zinc-800/10 blur-[100px] pointer-events-none -z-10"></div>
    </main>

</body>
</html>
