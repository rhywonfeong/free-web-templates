    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Art Templates</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            cursor: crosshair;
        }
        .template-btn {
            transition: all 0.3s ease;
        }
        .template-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .template-btn.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
        }
    </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Compact Left Panel -->
    <div class="fixed top-2 left-2 z-50 glass-effect p-3 rounded-lg text-white w-48">
        <h2 class="text-sm font-bold mb-2">Art Studio</h2>
        
        <!-- Mini Templates -->
        <div class="mb-3">
            <div class="grid grid-cols-2 gap-1 text-xs">
                <button class="template-btn p-2 rounded text-center" data-template="flower">🌸 Flower</button>
                <button class="template-btn p-2 rounded text-center" data-template="spiral">🌀 Spiral</button>
                <button class="template-btn p-2 rounded text-center" data-template="mandala">🔆 Mandala</button>
                <button class="template-btn p-2 rounded text-center" data-template="crystal">💎 Crystal</button>
                <button class="template-btn p-2 rounded text-center" data-template="forest">🌲 Forest</button>
                <button class="template-btn p-2 rounded text-center" data-template="abstract">🎨 Abstract</button>
            </div>
        </div>

        <!-- Mini Colors -->
        <div class="mb-2">
            <div class="grid grid-cols-6 gap-1">
                <div class="w-4 h-4 rounded cursor-pointer bg-red-500" data-color="#ef4444"></div>
                <div class="w-4 h-4 rounded cursor-pointer bg-blue-500" data-color="#3b82f6"></div>
                <div class="w-4 h-4 rounded cursor-pointer bg-green-500" data-color="#10b981"></div>
                <div class="w-4 h-4 rounded cursor-pointer bg-yellow-500" data-color="#f59e0b"></div>
                <div class="w-4 h-4 rounded cursor-pointer bg-purple-500" data-color="#8b5cf6"></div>
                <div class="w-4 h-4 rounded cursor-pointer bg-pink-500" data-color="#ec4899"></div>
            </div>
        </div>

        <!-- Mini Buttons -->
        <div class="space-y-1 text-xs">
            <button id="randomizeBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-2 py-1 rounded">Randomize</button>
            <button id="resetTemplateBtn" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white px-2 py-1 rounded">Reset</button>
            <button id="saveBtn" class="w-full bg-green-600 hover:bg-green-700 text-white px-2 py-1 rounded">Save</button>
        </div>
    </div>

    <!-- Tiny Info Panel -->
    <div class="fixed top-2 right-2 z-50 glass-effect p-2 rounded-lg text-white text-xs">
        <div>Template: <span id="currentTemplate">None</span></div>
        <div>Count: <span id="elementCount">0</span></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer;
        let currentTemplate = null;
        let templateElements = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 10);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 5, 5);
            scene.add(directionalLight);
            
            setupEventListeners();
            animate();
        }
        
        function setupEventListeners() {
            document.querySelectorAll('[data-template]').forEach(btn => {
                btn.addEventListener('click', () => {
                    loadTemplate(btn.dataset.template);
                    document.querySelectorAll('.template-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            
            document.querySelectorAll('[data-color]').forEach(btn => {
                btn.addEventListener('click', () => recolorTemplate());
            });
            
            document.getElementById('randomizeBtn').addEventListener('click', randomizeColors);
            document.getElementById('resetTemplateBtn').addEventListener('click', () => loadTemplate(currentTemplate));
            document.getElementById('saveBtn').addEventListener('click', saveArtwork);
            
            let mouseDown = false;
            renderer.domElement.addEventListener('mousedown', () => mouseDown = true);
            renderer.domElement.addEventListener('mouseup', () => mouseDown = false);
            renderer.domElement.addEventListener('mousemove', (e) => {
                if (mouseDown) updateCamera(e);
            });
            renderer.domElement.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.position.multiplyScalar(1 + e.deltaY * 0.001);
                camera.position.clampLength(5, 20);
            });
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function loadTemplate(type) {
            clearScene();
            currentTemplate = type;
            document.getElementById('currentTemplate').textContent = type;
            
            switch(type) {
                case 'flower': createFlower(); break;
                case 'spiral': createSpiral(); break;
                case 'mandala': createMandala(); break;
                case 'crystal': createCrystal(); break;
                case 'forest': createForest(); break;
                case 'abstract': createAbstract(); break;
            }
            
            document.getElementById('elementCount').textContent = templateElements.length;
        }
        
        function createFlower() {
            const colors = ['#ff69b4', '#ffb6c1', '#ff1493'];
            
            // Tiny trunk
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.15, 1),
                new THREE.MeshLambertMaterial({ color: '#8b4513' })
            );
            trunk.position.y = -0.5;
            scene.add(trunk);
            templateElements.push(trunk);
            
            // Mini blossoms
            for (let i = 0; i < 15; i++) {
                const blossom = new THREE.Mesh(
                    new THREE.SphereGeometry(0.05, 6, 6),
                    new THREE.MeshLambertMaterial({ color: colors[i % colors.length] })
                );
                
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 1 + 0.3;
                
                blossom.position.set(
                    Math.cos(angle) * radius,
                    Math.random() * 1 + 0.2,
                    Math.sin(angle) * radius
                );
                
                scene.add(blossom);
                templateElements.push(blossom);
            }
        }
        
        function createSpiral() {
            for (let i = 0; i < 30; i++) {
                const t = i / 30;
                const angle = t * Math.PI * 4;
                const radius = t * 2;
                
                const particle = new THREE.Mesh(
                    new THREE.SphereGeometry(0.03 + t * 0.05, 6, 6),
                    new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(t, 0.8, 0.6) })
                );
                
                particle.position.set(
                    Math.cos(angle) * radius,
                    (t - 0.5) * 2,
                    Math.sin(angle) * radius
                );
                
                scene.add(particle);
                templateElements.push(particle);
            }
        }
        
        function createMandala() {
            for (let layer = 0; layer < 3; layer++) {
                const count = 4 + layer * 2;
                const radius = 0.5 + layer * 0.4;
                
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const cube = new THREE.Mesh(
                        new THREE.BoxGeometry(0.1, 0.1, 0.1),
                        new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(layer / 3, 0.8, 0.6) })
                    );
                    
                    cube.position.set(
                        Math.cos(angle) * radius,
                        0,
                        Math.sin(angle) * radius
                    );
                    
                    scene.add(cube);
                    templateElements.push(cube);
                }
            }
        }
        
        function createCrystal() {
            for (let i = 0; i < 8; i++) {
                const crystal = new THREE.Mesh(
                    new THREE.OctahedronGeometry(Math.random() * 0.2 + 0.1),
                    new THREE.MeshLambertMaterial({ color: '#00ffff', transparent: true, opacity: 0.8 })
                );
                
                crystal.position.set(
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2
                );
                
                scene.add(crystal);
                templateElements.push(crystal);
            }
        }
        
        function createForest() {
            for (let i = 0; i < 10; i++) {
                const tree = new THREE.Mesh(
                    new THREE.ConeGeometry(0.15, Math.random() * 0.8 + 0.5),
                    new THREE.MeshLambertMaterial({ color: '#228b22' })
                );
                
                tree.position.set(
                    (Math.random() - 0.5) * 3,
                    0,
                    (Math.random() - 0.5) * 3
                );
                
                scene.add(tree);
                templateElements.push(tree);
            }
        }
        
        function createAbstract() {
            const shapes = ['sphere', 'cube', 'tetrahedron'];
            
            for (let i = 0; i < 10; i++) {
                const shape = shapes[Math.floor(Math.random() * shapes.length)];
                let geometry;
                const size = Math.random() * 0.15 + 0.05;
                
                switch(shape) {
                    case 'sphere': geometry = new THREE.SphereGeometry(size); break;
                    case 'cube': geometry = new THREE.BoxGeometry(size, size, size); break;
                    case 'tetrahedron': geometry = new THREE.TetrahedronGeometry(size); break;
                }
                
                const mesh = new THREE.Mesh(
                    geometry,
                    new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.7, 0.6) })
                );
                
                mesh.position.set(
                    (Math.random() - 0.5) * 2.5,
                    (Math.random() - 0.5) * 2,
                    (Math.random() - 0.5) * 2.5
                );
                
                scene.add(mesh);
                templateElements.push(mesh);
            }
        }
        
        function recolorTemplate() {
            templateElements.forEach(element => {
                if (element.material) {
                    element.material.color.setHSL(Math.random(), 0.7, 0.6);
                }
            });
        }
        
        function randomizeColors() {
            templateElements.forEach(element => {
                if (element.material) {
                    element.material.color.setHSL(Math.random(), 0.8, 0.6);
                }
            });
        }
        
        function clearScene() {
            templateElements.forEach(element => scene.remove(element));
            templateElements = [];
        }
        
        function updateCamera(event) {
            const deltaX = event.movementX * 0.01;
            const deltaY = event.movementY * 0.01;
            
            const spherical = new THREE.Spherical();
            spherical.setFromVector3(camera.position);
            spherical.theta -= deltaX;
            spherical.phi += deltaY;
            spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
            
            camera.position.setFromSpherical(spherical);
            camera.lookAt(0, 0, 0);
        }
        
        function saveArtwork() {
            const link = document.createElement('a');
            link.download = `${currentTemplate || 'artwork'}.png`;
            link.href = renderer.domElement.toDataURL();
            link.click();
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (currentTemplate === 'mandala') {
                templateElements.forEach(element => {
                    element.rotation.y += 0.01;
                });
            }
            
            renderer.render(scene, camera);
        }
        
        init();
    </script>
</body>
</html>
