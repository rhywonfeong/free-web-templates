    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Data Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        
        .checkbox-custom {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid #cfcfcf;
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fff;
        }
        
        .checkbox-custom:hover {
            border-color: #4862a6;
            background: #f8fbfe;
        }
        
        .checkbox-custom:checked {
            background: #4862a6;
            border-color: #4862a6;
        }
        
        .checkbox-custom:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 2px;
            width: 4px;
            height: 8px;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        
        .action-bar-enter {
            animation: slideDown 0.2s ease-out forwards;
        }
        
        .action-bar-exit {
            animation: slideUp 0.2s ease-out forwards;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideUp {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-10px);
            }
        }
        
        .table-row {
            transition: all 0.15s ease;
            background: #fff;
            border: 1px solid transparent;
        }
        
        .table-row:hover {
            background: #f8fbfe;
            border-color: #ecf3f9;
        }
        
        .table-row.selected {
            background: #eff7fd;
            border-color: #4862a6;
            border-left: 3px solid #4862a6;
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .status-active {
            background: #d6dfff;
            color: #4862a6;
            border: 1px solid #4862a6;
        }
        
        .status-completed {
            background: #eaffdd;
            color: #3bcb41;
            border: 1px solid #3bcb41;
        }
        
        .status-planned {
            background: #ffd5b6;
            color: #ff8a00;
            border: 1px solid #ff8a00;
        }
        
        .progress-bar {
            background: linear-gradient(90deg, #4862a6, #1853c7);
        }
        
        .btn-primary {
            background: #4862a6;
            color: #fff;
            border: 1px solid #4862a6;
        }
        
        .btn-primary:hover {
            background: #1853c7;
            border-color: #1853c7;
        }
        
        .btn-secondary {
            background: #e1e4e9;
            color: #686D70;
            border: 1px solid #cfcfcf;
        }
        
        .btn-secondary:hover {
            background: #ecf3f9;
            color: #4862a6;
            border-color: #4862a6;
        }
    </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
</head>
<body style="background-color: #fff;" class="min-h-screen">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-8 fade-in">
            <h1 class="text-3xl font-semibold tracking-tight" style="color: #212121;">データ管理</h1>
            <p class="mt-2" style="color: #686D70;">プロジェクトとメンバーの一覧表示</p>
        </div>

        <!-- Action Bar (Hidden by default) -->
        <div id="actionBar" class="hidden mb-6">
            <div class="border rounded-xl shadow-sm p-4" style="background-color: #fff; border-color: #cfcfcf;">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <span id="selectedCount" class="text-sm font-medium" style="color: #4862a6;">0</span>
                        <span class="text-sm" style="color: #686D70;">項目を選択中</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="deleteSelected()" class="inline-flex items-center px-4 py-2 text-sm font-medium rounded-lg btn-primary transition-colors duration-200">
                            <i data-lucide="trash-2" class="w-4 h-4 mr-2"></i>
                            削除
                        </button>
                        <button onclick="clearSelection()" class="inline-flex items-center px-3 py-2 rounded-lg btn-secondary transition-colors duration-200">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Table Container -->
        <div class="rounded-xl shadow-lg border overflow-hidden fade-in" style="background-color: #fff; border-color: #cfcfcf; animation-delay: 0.1s">
            <!-- Table Header -->
            <div class="px-6 py-4 border-b" style="background-color: #fafafa; border-color: #cfcfcf;">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <input type="checkbox" id="selectAll" class="checkbox-custom" onchange="toggleSelectAll()">
                        <h3 class="text-lg font-medium" style="color: #212121;">プロジェクト一覧</h3>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button class="p-2 rounded-lg transition-colors duration-200" style="color: #81819E;" onmouseover="this.style.color='#4862a6'; this.style.backgroundColor='#f8fbfe'" onmouseout="this.style.color='#81819E'; this.style.backgroundColor='transparent'">
                            <i data-lucide="filter" class="w-4 h-4"></i>
                        </button>
                        <button class="p-2 rounded-lg transition-colors duration-200" style="color: #81819E;" onmouseover="this.style.color='#4862a6'; this.style.backgroundColor='#f8fbfe'" onmouseout="this.style.color='#81819E'; this.style.backgroundColor='transparent'">
                            <i data-lucide="download" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="w-full" style="background-color: #fff;">
                    <thead style="background-color: #fafafa;">
                        <tr>
                            <th class="w-12 px-6 py-3"></th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider" style="color: #686D70;">プロジェクト</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider" style="color: #686D70;">担当者</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider" style="color: #686D70;">ステータス</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider" style="color: #686D70;">進捗</th>
                            <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider" style="color: #686D70;">期限</th>
                            <th class="w-16 px-6 py-3"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y" style="background-color: #fff; --tw-divide-opacity: 1; --tw-divide-color: #cfcfcf;">
                        <!-- Table rows will be generated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const tableData = [
            { id: 1, project: "ECサイト リニューアル", assignee: "田中 太郎", status: "進行中", progress: 75, deadline: "2024-02-15", avatar: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=32&h=32&fit=crop&crop=face" },
            { id: 2, project: "モバイルアプリ開発", assignee: "佐藤 花子", status: "完了", progress: 100, deadline: "2024-01-30", avatar: "https://images.unsplash.com/photo-1494790108755-2616b612b1ab?w=32&h=32&fit=crop&crop=face" },
            { id: 3, project: "データベース最適化", assignee: "鈴木 一郎", status: "計画中", progress: 25, deadline: "2024-03-10", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=32&h=32&fit=crop&crop=face" },
            { id: 4, project: "APIドキュメント作成", assignee: "山田 美咲", status: "進行中", progress: 60, deadline: "2024-02-28", avatar: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=32&h=32&fit=crop&crop=face" },
            { id: 5, project: "セキュリティ監査", assignee: "高橋 健太", status: "進行中", progress: 40, deadline: "2024-03-15", avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=32&h=32&fit=crop&crop=face" }
        ];

        let selectedItems = new Set();

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            tableData.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.className = 'table-row fade-in';
                tr.style.animationDelay = `${0.2 + index * 0.05}s`;
                
                const statusConfig = {
                    '進行中': { class: 'status-active', icon: 'play-circle' },
                    '完了': { class: 'status-completed', icon: 'check-circle' },
                    '計画中': { class: 'status-planned', icon: 'clock' }
                };

                const config = statusConfig[row.status];

                tr.innerHTML = `
                    <td class="px-6 py-4">
                        <input type="checkbox" class="checkbox-custom row-checkbox" data-id="${row.id}" onchange="toggleRow(${row.id})">
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-medium" style="color: #212121;">${row.project}</div>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-3">
                            <img class="w-8 h-8 rounded-full ring-2" src="${row.avatar}" alt="" style="--tw-ring-color: #cfcfcf;">
                            <span style="color: #686D70;">${row.assignee}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center px-2.5 py-1 text-xs font-medium rounded-full ${config.class}">
                            <i data-lucide="${config.icon}" class="w-3 h-3 mr-1.5"></i>
                            ${row.status}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center space-x-3">
                            <div class="w-full rounded-full h-2" style="background-color: #e1e4e9;">
                                <div class="progress-bar h-2 rounded-full transition-all duration-300" style="width: ${row.progress}%"></div>
                            </div>
                            <span class="text-sm min-w-[3rem] font-medium" style="color: #686D70;">${row.progress}%</span>
                        </div>
                    </td>
                    <td class="px-6 py-4 font-mono text-sm" style="color: #686D70;">${row.deadline}</td>
                    <td class="px-6 py-4">
                        <button class="p-1 rounded transition-colors duration-200" style="color: #81819E;" onmouseover="this.style.color='#4862a6'; this.style.backgroundColor='#f8fbfe'" onmouseout="this.style.color='#81819E'; this.style.backgroundColor='transparent'">
                            <i data-lucide="more-horizontal" class="w-4 h-4"></i>
                        </button>
                    </td>
                `;
                
                tbody.appendChild(tr);
            });

            lucide.createIcons();
        }

        function toggleRow(id) {
            const row = document.querySelector(`tr:has([data-id="${id}"])`);
            
            if (selectedItems.has(id)) {
                selectedItems.delete(id);
                row.classList.remove('selected');
            } else {
                selectedItems.add(id);
                row.classList.add('selected');
            }
            
            updateActionBar();
            updateSelectAllState();
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.row-checkbox');
            
            if (selectAll.checked) {
                tableData.forEach(row => selectedItems.add(row.id));
                checkboxes.forEach(cb => {
                    cb.checked = true;
                    const row = cb.closest('tr');
                    row.classList.add('selected');
                });
            } else {
                selectedItems.clear();
                checkboxes.forEach(cb => {
                    cb.checked = false;
                    const row = cb.closest('tr');
                    row.classList.remove('selected');
                });
            }
            
            updateActionBar();
        }

        function updateSelectAllState() {
            const selectAll = document.getElementById('selectAll');
            const totalItems = tableData.length;
            
            if (selectedItems.size === 0) {
                selectAll.checked = false;
                selectAll.indeterminate = false;
            } else if (selectedItems.size === totalItems) {
                selectAll.checked = true;
                selectAll.indeterminate = false;
            } else {
                selectAll.checked = false;
                selectAll.indeterminate = true;
            }
        }

        function updateActionBar() {
            const actionBar = document.getElementById('actionBar');
            const selectedCount = document.getElementById('selectedCount');
            
            selectedCount.textContent = selectedItems.size;
            
            if (selectedItems.size > 0) {
                if (actionBar.classList.contains('hidden')) {
                    actionBar.classList.remove('hidden');
                    actionBar.classList.add('action-bar-enter');
                }
            } else {
                actionBar.classList.add('action-bar-exit');
                setTimeout(() => {
                    actionBar.classList.add('hidden');
                    actionBar.classList.remove('action-bar-exit', 'action-bar-enter');
                }, 200);
            }
        }

        function deleteSelected() {
            if (confirm(`選択した${selectedItems.size}件の項目を削除しますか？`)) {
                alert(`${selectedItems.size}件を削除しました`);
                clearSelection();
            }
        }

        function clearSelection() {
            selectedItems.clear();
            document.querySelectorAll('.row-checkbox').forEach(cb => {
                cb.checked = false;
                cb.closest('tr').classList.remove('selected');
            });
            updateActionBar();
            updateSelectAllState();
        }

        // Initialize
        renderTable();
        lucide.createIcons();
    </script>
</body>
</html>
