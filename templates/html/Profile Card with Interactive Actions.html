  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dating App Profile Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>

  <style>
    body { font-family: 'Roboto', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-pink-50 to-fuchsia-100 flex items-center justify-center px-4 py-10">
  <div class="max-w-2xl w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 flex flex-col md:flex-row animate__animated animate__fadeIn">
    <!-- Profile photo & slideshow -->
    <div class="relative md:w-1/2 flex-shrink-0 bg-gradient-to-br from-pink-100 to-pink-200 flex items-center justify-center p-6 animate__animated animate__fadeInLeft" style="animation-delay: .2s;">
      <img src="https://randomuser.me/api/portraits/women/82.jpg" alt="Profile" class="rounded-xl object-cover w-72 h-80 shadow-lg border-4 border-white">
      <span class="absolute left-6 bottom-6 bg-white/80 rounded-xl px-3 py-1 text-xs font-medium text-gray-700 flex items-center gap-1 shadow">
        <i class="fas fa-map-marker-alt text-pink-400"></i> 2 miles away
      </span>
      <span class="absolute top-6 right-6 bg-white/90 rounded-full p-2 shadow text-fuchsia-500">
        <i class="fas fa-bolt"></i>
      </span>
    </div>
    <!-- Profile content/statistics -->
    <div class="flex-1 flex flex-col p-7 gap-6 animate__animated animate__fadeInRight" style="animation-delay: .3s;">
      <div>
        <div class="flex items-center gap-3">
          <span class="text-2xl font-bold text-fuchsia-700">Samantha, 28</span>
          <span class="bg-fuchsia-100 text-fuchsia-600 text-xs font-semibold px-2 rounded">Verified <i class="fas fa-check-circle ml-1"></i></span>
        </div>
        <div class="text-gray-500 mt-1 flex items-center gap-2 text-sm">
          <i class="fas fa-briefcase"></i> UX Designer • <i class="fas fa-graduation-cap"></i> NYU
        </div>
        <p class="mt-4 text-gray-700 leading-relaxed">
          Lover of coffee shops, indie music, and spontaneous city adventures.
          Looking for someone to explore the best brunch spots with and laugh until it hurts.
        </p>
      </div>
      <div class="flex gap-3">
        <div class="flex flex-col items-center bg-fuchsia-50 p-3 rounded-lg flex-1 shadow-sm">
          <i class="fas fa-music text-fuchsia-400 text-xl mb-1"></i>
          <span class="text-xs text-gray-500 uppercase">Favorite Song</span>
          <span class="font-semibold text-fuchsia-700 text-sm mt-1">"Sunflower"</span>
        </div>
        <div class="flex flex-col items-center bg-fuchsia-50 p-3 rounded-lg flex-1 shadow-sm">
          <i class="fas fa-heart text-rose-400 text-xl mb-1"></i>
          <span class="text-xs text-gray-500 uppercase">Looking For</span>
          <span class="font-semibold text-fuchsia-700 text-sm mt-1">Serious</span>
        </div>
        <div class="flex flex-col items-center bg-fuchsia-50 p-3 rounded-lg flex-1 shadow-sm">
          <i class="fas fa-paw text-pink-400 text-xl mb-1"></i>
          <span class="text-xs text-gray-500 uppercase">Pet</span>
          <span class="font-semibold text-fuchsia-700 text-sm mt-1">Dog</span>
        </div>
      </div>
      <div class="flex justify-between gap-3">
        <button class="flex-1 flex items-center justify-center gap-2 bg-rose-100 hover:bg-rose-200 text-rose-500 font-bold py-2 rounded-lg shadow transition animate__animated animate__fadeInUp" style="animation-delay: .5s;">
          <i class="fas fa-times text-lg"></i> Pass
        </button>
        <button class="flex-1 flex items-center justify-center gap-2 bg-fuchsia-500 hover:bg-fuchsia-600 text-white font-bold py-2 rounded-lg shadow-lg transition animate__animated animate__fadeInUp" style="animation-delay: .6s;">
          <i class="fas fa-heart text-lg"></i> Like
        </button>
        <button class="flex-1 flex items-center justify-center gap-2 bg-white border border-gray-200 hover:bg-gray-50 text-fuchsia-500 font-bold py-2 rounded-lg shadow transition animate__animated animate__fadeInUp" style="animation-delay: .7s;">
          <i class="fas fa-star text-lg"></i> Super Like
        </button>
      </div>
    </div>
  </div>
