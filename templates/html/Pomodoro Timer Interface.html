  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Pomodoro Timer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
  <style>
    body { font-family: 'Geist', sans-serif; }
    .progress-ring__circle {
      transition: stroke-dashoffset 0.3s;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen p-4 text-xs flex items-center justify-center">
  <div class="max-w-md w-full bg-zinc-900 rounded-lg shadow-xl overflow-hidden border border-zinc-800">
    <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
      <h1 class="text-lg font-medium">Pomodoro Timer</h1>
      <div class="flex space-x-2">
        <button id="settingsBtn" class="text-zinc-400 hover:text-zinc-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
        </button>
        <button id="historyBtn" class="text-zinc-400 hover:text-zinc-200">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </button>
      </div>
    </div>
    
    <div class="p-6">
      <!-- Timer Display -->
      <div class="flex justify-center mb-6">
        <div class="relative">
          <svg class="w-48 h-48" viewBox="0 0 100 100">
            <circle class="text-zinc-800" stroke-width="4" stroke="currentColor" fill="transparent" r="42" cx="50" cy="50"/>
            <circle id="progress-ring" class="text-indigo-500 progress-ring__circle" stroke-width="4" stroke="currentColor" fill="transparent" r="42" cx="50" cy="50" stroke-dasharray="264" stroke-dashoffset="0"/>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <div id="timer" class="text-4xl font-light">25:00</div>
            <div id="status" class="text-xs text-zinc-400 mt-1">FOCUS</div>
          </div>
        </div>
      </div>
      
      <!-- Controls -->
      <div class="flex justify-center space-x-4 mb-6">
        <button id="startBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white py-2 px-6 rounded-full text-xs flex items-center justify-center transition">
          <svg id="startIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <svg id="pauseIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </button>
        <button id="resetBtn" class="bg-zinc-800 hover:bg-zinc-700 text-white py-2 px-6 rounded-full text-xs flex items-center justify-center transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
          </svg>
        </button>
        <button id="skipBtn" class="bg-zinc-800 hover:bg-zinc-700 text-white py-2 px-6 rounded-full text-xs flex items-center justify-center transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>
          </svg>
        </button>
      </div>
      
      <!-- Session Type Selector -->
      <div class="flex justify-center space-x-2">
        <button id="focusBtn" class="bg-indigo-500 text-white py-1 px-4 rounded-full text-xs">Focus</button>
        <button id="shortBreakBtn" class="bg-zinc-800 hover:bg-zinc-700 text-white py-1 px-4 rounded-full text-xs">Short Break</button>
        <button id="longBreakBtn" class="bg-zinc-800 hover:bg-zinc-700 text-white py-1 px-4 rounded-full text-xs">Long Break</button>
      </div>
    </div>
    
    <!-- Settings Panel (Hidden by default) -->
    <div id="settingsPanel" class="hidden p-4 border-t border-zinc-800">
      <h2 class="text-sm font-medium mb-3">Timer Settings</h2>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block mb-1 text-xs text-zinc-400">Focus Time (min)</label>
          <input id="focusTime" type="number" min="1" max="60" value="25" class="w-full bg-zinc-800 py-1.5 px-3 rounded text-xs">
        </div>
        <div>
          <label class="block mb-1 text-xs text-zinc-400">Short Break (min)</label>
          <input id="shortBreakTime" type="number" min="1" max="30" value="5" class="w-full bg-zinc-800 py-1.5 px-3 rounded text-xs">
        </div>
        <div>
          <label class="block mb-1 text-xs text-zinc-400">Long Break (min)</label>
          <input id="longBreakTime" type="number" min="1" max="60" value="15" class="w-full bg-zinc-800 py-1.5 px-3 rounded text-xs">
        </div>
        <div>
          <label class="block mb-1 text-xs text-zinc-400">Sessions Before Long Break</label>
          <input id="sessionsCount" type="number" min="1" max="10" value="4" class="w-full bg-zinc-800 py-1.5 px-3 rounded text-xs">
        </div>
      </div>
      <div class="mt-3 flex justify-end">
        <button id="saveSettingsBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white py-1.5 px-3 rounded text-xs">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    // DOM Elements
    const timer = document.getElementById('timer');
    const status = document.getElementById('status');
    const progressRing = document.getElementById('progress-ring');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const skipBtn = document.getElementById('skipBtn');
    const focusBtn = document.getElementById('focusBtn');
    const shortBreakBtn = document.getElementById('shortBreakBtn');
    const longBreakBtn = document.getElementById('longBreakBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsPanel = document.getElementById('settingsPanel');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const startIcon = document.getElementById('startIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    
    // Timer variables
    let timerInterval;
    let timeLeft;
    let totalTime;
    let isRunning = false;
    let currentMode = 'focus';
    let sessionsCompleted = 0;
    
    // Timer settings (in minutes)
    let settings = {
      focusTime: 25,
      shortBreakTime: 5,
      longBreakTime: 15,
      sessionsBeforeLongBreak: 4
    };
    
    // Initialize timer
    function initTimer(mode) {
      currentMode = mode;
      clearInterval(timerInterval);
      isRunning = false;
      
      // Update button states
      startIcon.classList.remove('hidden');
      pauseIcon.classList.add('hidden');
      
      // Set time based on mode
      switch(mode) {
        case 'focus':
          totalTime = settings.focusTime * 60;
          status.textContent = 'FOCUS';
          progressRing.style.stroke = '#6366f1'; // indigo-500
          focusBtn.classList.add('bg-indigo-500');
          focusBtn.classList.remove('bg-zinc-800', 'hover:bg-zinc-700');
          shortBreakBtn.classList.remove('bg-indigo-500');
          shortBreakBtn.classList.add('bg-zinc-800', 'hover:bg-zinc-700');
          longBreakBtn.classList.remove('bg-indigo-500');
          longBreakBtn.classList.add('bg-zinc-800', 'hover:bg-zinc-700');
          break;
        case 'shortBreak':
          totalTime = settings.shortBreakTime * 60;
          status.textContent = 'SHORT BREAK';
          progressRing.style.stroke = '#10b981'; // emerald-500
          focusBtn.classList.remove('bg-indigo-500');
          focusBtn.classList.add('bg-zinc-800', 'hover:bg-zinc-700');
          shortBreakBtn.classList.add('bg-indigo-500');
          shortBreakBtn.classList.remove('bg-zinc-800', 'hover:bg-zinc-700');
          longBreakBtn.classList.remove('bg-indigo-500');
          longBreakBtn.classList.add('bg-zinc-800', 'hover:bg-zinc-700');
          break;
        case 'longBreak':
          totalTime = settings.longBreakTime * 60;
          status.textContent = 'LONG BREAK';
          progressRing.style.stroke = '#3b82f6'; // blue-500
          focusBtn.classList.remove('bg-indigo-500');
          focusBtn.classList.add('bg-zinc-800', 'hover:bg-zinc-700');
          shortBreakBtn.classList.remove('bg-indigo-500');
          shortBreakBtn.classList.add('bg-zinc-800', 'hover:bg-zinc-700');
          longBreakBtn.classList.add('bg-indigo-500');
          longBreakBtn.classList.remove('bg-zinc-800', 'hover:bg-zinc-700');
          break;
      }
      
      timeLeft = totalTime;
      updateTimerDisplay();
      updateProgressRing();
    }
    
    // Update timer display
    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      timer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }
    
    // Update progress ring
    function updateProgressRing() {
      const circumference = 2 * Math.PI * 42;
      const offset = circumference - (timeLeft / totalTime) * circumference;
      progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
      progressRing.style.strokeDashoffset = offset;
    }
    
    // Start/pause timer
    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        startIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
      } else {
        isRunning = true;
        startIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        
        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimerDisplay();
          updateProgressRing();
          
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            playAlarm();
            
            if (currentMode === 'focus') {
              sessionsCompleted++;
              if (sessionsCompleted % settings.sessionsBeforeLongBreak === 0) {
                initTimer('longBreak');
              } else {
                initTimer('shortBreak');
              }
            } else {
              initTimer('focus');
            }
          }
        }, 1000);
      }
    }
    
    // Reset timer
    function resetTimer() {
      initTimer(currentMode);
    }
    
    // Skip to next timer
    function skipTimer() {
      if (currentMode === 'focus') {
        if (sessionsCompleted % settings.sessionsBeforeLongBreak === settings.sessionsBeforeLongBreak - 1) {
          initTimer('longBreak');
        } else {
          initTimer('shortBreak');
        }
      } else {
        initTimer('focus');
      }
    }
    
    // Play alarm sound
    function playAlarm() {
      // You could add a sound here
      console.log('Time is up!');
    }
    
    // Save settings
    function saveSettings() {
      settings.focusTime = parseInt(document.getElementById('focusTime').value) || 25;
      settings.shortBreakTime = parseInt(document.getElementById('shortBreakTime').value) || 5;
      settings.longBreakTime = parseInt(document.getElementById('longBreakTime').value) || 15;
      settings.sessionsBeforeLongBreak = parseInt(document.getElementById('sessionsCount').value) || 4;
      
      // Save to localStorage
      localStorage.setItem('pomodoroSettings', JSON.stringify(settings));
      
      // Reset timer with new settings
      initTimer(currentMode);
      
      // Hide settings panel
      settingsPanel.classList.add('hidden');
    }
    
    // Load settings from localStorage
    function loadSettings() {
      const savedSettings = localStorage.getItem('pomodoroSettings');
      if (savedSettings) {
        settings = JSON.parse(savedSettings);
        
        // Update input fields
        document.getElementById('focusTime').value = settings.focusTime;
        document.getElementById('shortBreakTime').value = settings.shortBreakTime;
        document.getElementById('longBreakTime').value = settings.longBreakTime;
        document.getElementById('sessionsCount').value = settings.sessionsBeforeLongBreak;
      }
    }
    
    // Event listeners
    startBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', resetTimer);
    skipBtn.addEventListener('click', skipTimer);
    focusBtn.addEventListener('click', () => initTimer('focus'));
    shortBreakBtn.addEventListener('click', () => initTimer('shortBreak'));
    longBreakBtn.addEventListener('click', () => initTimer('longBreak'));
    settingsBtn.addEventListener('click', () => settingsPanel.classList.toggle('hidden'));
    saveSettingsBtn.addEventListener('click', saveSettings);
    
    // Initialize
    loadSettings();
    initTimer('focus');
  </script>
</body>
</html>
