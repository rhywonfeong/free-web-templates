<style>
body {
font-family: 'Inter', -apple-system, sans-serif;
background-color: #000000;
overflow: hidden;
}
/* Ambient Background Particles */
.particle-bg {
background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
background-size: 40px 40px;
animation: particle-drift 20s linear infinite;
}
/* Glass / Material Styles */
.glass-panel {
background: rgba(20, 20, 20, 0.6);
backdrop-filter: blur(40px) saturate(180%);
-webkit-backdrop-filter: blur(40px) saturate(180%);
border: 1px solid rgba(255, 255, 255, 0.1);
box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
}
.hud-card {
background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
border: 1px solid rgba(255,255,255,0.08);
position: relative;
overflow: hidden;
}
/* Animations */
@keyframes particle-drift {
0% { transform: translateY(0) translateX(0); }
100% { transform: translateY(-40px) translateX(-20px); }
}
@keyframes hud-shake {
0%, 100% { transform: translate(0, 0); }
10% { transform: translate(-1px, -1px); }
20% { transform: translate(1px, 0px); }
30% { transform: translate(-1px, 1px); }
40% { transform: translate(1px, -1px); }
50% { transform: translate(-1px, 0); }
60% { transform: translate(0, 1px); }
70% { transform: translate(1px, 0); }
80% { transform: translate(-1px, -1px); }
90% { transform: translate(0, 1px); }
}
@keyframes pulse-glow {
0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.1); opacity: 1; }
50% { text-shadow: 0 0 20px rgba(255,255,255,0.3); opacity: 0.9; }
}
@keyframes heartbeat-spike {
0% { transform: scaleY(1); }
10% { transform: scaleY(3); background-color: #FF3B30; box-shadow: 0 0 15px #FF3B30; }
20% { transform: scaleY(1); }
100% { transform: scaleY(1); }
}
@keyframes scan-sweep {
0% { top: -10%; opacity: 0; }
10% { opacity: 1; }
90% { opacity: 1; }
100% { top: 110%; opacity: 0; }
}
@keyframes glitch-slide {
0% { transform: translateX(-100%); opacity: 0; }
10% { transform: translateX(0); opacity: 1; }
12% { transform: translateX(-5px) skewX(-10deg); filter: invert(1); }
14% { transform: translateX(5px) skewX(10deg); filter: invert(0); }
16% { transform: translateX(0); }
100% { transform: translateX(0); opacity: 1; }
}
@keyframes ticker-fade {
0%, 45% { opacity: 1; transform: translateY(0); }
49% { opacity: 0; transform: translateY(-20px); }
50% { opacity: 0; transform: translateY(20px); }
55%, 100% { opacity: 1; transform: translateY(0); }
}
@keyframes graph-draw {
0% { stroke-dashoffset: 1000; }
100% { stroke-dashoffset: 0; }
}
@keyframes eye-move {
0%, 100% { transform: translateX(0); }
20% { transform: translateX(-8px); }
40% { transform: translateX(8px); }
60% { transform: translateX(0); }
}
@keyframes blink {
0%, 48%, 52%, 100% { height: 12px; }
50% { height: 2px; }
}
.animate-hud-shake { animation: hud-shake 10s infinite ease-in-out; }
.animate-pulse-glow { animation: pulse-glow 3s infinite ease-in-out; }
.animate-scan { animation: scan-sweep 2s infinite linear; }
.animate-glitch-enter { animation: glitch-slide 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.animate-eye { animation: eye-move 4s infinite steps(10); }
.animate-blink { animation: blink 4s infinite; }
/* Typography adjustments for massive scale */
.font-massive {
font-size: 8rem;
line-height: 0.8;
letter-spacing: -0.05em;
}
/* Utility */
.text-neon-blue { color: #007AFF; text-shadow: 0 0 20px rgba(0, 122, 255, 0.5); }
.text-neon-green { color: #30D158; text-shadow: 0 0 20px rgba(48, 209, 88, 0.5); }
.text-neon-red { color: #FF3B30; text-shadow: 0 0 20px rgba(255, 59, 48, 0.5); }
.text-neon-orange { color: #FF9F0a; text-shadow: 0 0 20px rgba(255, 159, 10, 0.5); }
.scan-line-overlay {
background: linear-gradient(to bottom, transparent, rgba(0, 122, 255, 0.2), transparent);
height: 20%;
width: 100%;
position: absolute;
left: 0;
pointer-events: none;
mix-blend-mode: overlay;
}
.ticker-number::after {
content: "1";
position: absolute;
left: 0;
top: 0;
animation: ticker-fade 2s infinite reverse;
}
.ticker-number span {
animation: ticker-fade 2s infinite;
display: block;
}
</style></head>
