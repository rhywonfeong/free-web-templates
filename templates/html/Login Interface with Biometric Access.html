    <div class="login-card glass-effect bg-gradient-to-br from-white/15 to-white/5 border border-white/20 overflow-hidden fade-in">

                <div class="flex items-center justify-center gap-2 mt-2">
                    <div class="status-indicator"></div>
                    <span class="text-xs text-blue-300 font-mono font-geist">SYSTEM ONLINE</span>
                </div>
            </div>
            
            <!-- Login Form -->
            <form class="space-y-6 slide-up" style="animation-delay: 0.2s">
                <!-- Username Field -->
                <div class="space-y-2">
                    <label class="text-sm text-neutral-300 font-medium flex items-center gap-2 font-geist">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="user" class="lucide lucide-user w-4 h-4"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        Agent ID
                    </label>
                    <input type="text" class="input-field w-full text-white placeholder-neutral-400" placeholder="Enter agent identifier" id="username">
                </div>
                
                <!-- Password Field -->
                <div class="space-y-2">
                    <label class="text-sm text-neutral-300 font-medium flex items-center gap-2 font-geist">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="lock" class="lucide lucide-lock w-4 h-4"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        Access Code
                    </label>
                    <div class="relative">
                        <input type="password" class="input-field w-full text-white placeholder-neutral-400" placeholder="Enter access code" id="password">
                        <button type="button" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-neutral-400 hover:text-white transition-colors" onclick="togglePassword()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="eye" class="lucide lucide-eye w-4 h-4" id="password-toggle"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>
                
                <!-- Divider -->
                <div class="card-divider w-full my-6"></div>
                
                <!-- Biometric Authentication -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="biometric-scanner" onclick="startBiometricScan()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="fingerprint" class="lucide lucide-fingerprint w-5 h-5 text-green-400"><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path><path d="M14 13.12c0 2.38 0 6.38-1 8.88"></path><path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path><path d="M2 12a10 10 0 0 1 18-6"></path><path d="M2 16h.01"></path><path d="M21.8 16c.2-2 .131-5.354 0-6"></path><path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"></path><path d="M8.65 22c.21-.66.45-1.32.57-2"></path><path d="M9 6.8a6 6 0 0 1 9 5.2v2"></path></svg>
                        </div>
                        <div>
                            <p class="text-sm text-neutral-300 font-geist">Biometric Scan</p>
                            <p class="text-xs text-neutral-500 font-geist">Optional verification</p>
                        </div>
                    </div>
                    <span class="text-xs text-blue-300 font-mono font-geist" id="biometric-status">READY</span>
                </div>
                
                <!-- Login Button -->
                <button type="submit" class="login-button w-full text-white font-medium relative overflow-hidden" onclick="handleLogin(event)">
                    <span class="relative z-10 flex items-center justify-center gap-2 font-geist" id="login-content">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="log-in" class="lucide lucide-log-in w-4 h-4"><path d="m10 17 5-5-5-5"></path><path d="M15 12H3"></path><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path></svg>

                            <span class="font-geist">NASA-NET</span>
                        </div>
                    </div>
                    <div class="text-center mt-3">
                        <p class="text-xs text-neutral-500 font-mono font-geist">Houston Mission Control • Sector 7</p>
                    </div>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
        
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                toggleIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
        
        // Biometric scan simulation
        function startBiometricScan() {
            const scanner = document.querySelector('.biometric-scanner');
            const status = document.getElementById('biometric-status');
            
            scanner.style.borderColor = 'rgba(245, 158, 11, 0.5)';
            scanner.style.background = 'rgba(245, 158, 11, 0.1)';
            status.textContent = 'SCANNING...';
            status.style.color = '#f59e0b';
            
            setTimeout(() => {
                scanner.style.borderColor = 'rgba(16, 185, 129, 0.5)';
                scanner.style.background = 'rgba(16, 185, 129, 0.1)';
                status.textContent = 'VERIFIED';
                status.style.color = '#10b981';
                
                setTimeout(() => {
                    status.textContent = 'READY';
                    status.style.color = '#10b981';
                }, 2000);
            }, 2000);
        }
        
        // Handle login
        function handleLogin(event) {
            event.preventDefault();
            
            const loginContent = document.getElementById('login-content');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                // Show error state
                loginContent.innerHTML = '<i data-lucide="x-circle" class="w-4 h-4"></i> Access Denied';
                loginContent.parentElement.style.background = 'linear-gradient(135deg, rgba(239, 68, 68, 0.8), rgba(220, 38, 38, 0.8))';
                
                setTimeout(() => {
                    loginContent.innerHTML = '<i data-lucide="log-in" class="w-4 h-4"></i> Initiate Access';
                    loginContent.parentElement.style.background = 'linear-gradient(135deg, rgba(56, 189, 248, 0.8), rgba(59, 130, 246, 0.8))';
                    lucide.createIcons();
                }, 2000);
                return;
            }
            
            // Show loading state
            loginContent.innerHTML = '<div class="loading-spinner"></div> Authenticating...';
            loginContent.parentElement.style.background = 'linear-gradient(135deg, rgba(245, 158, 11, 0.8), rgba(217, 119, 6, 0.8))';
            
            setTimeout(() => {
                // Show success state
                loginContent.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4"></i> Access Granted';
                loginContent.parentElement.style.background = 'linear-gradient(135deg, rgba(16, 185, 129, 0.8), rgba(5, 150, 105, 0.8))';
                lucide.createIcons();
                
                // Redirect after success
                setTimeout(() => {
                    window.location.href = '#dashboard';
                }, 1500);
            }, 2000);
        }
        
        // Add enter key support for login
        document.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                handleLogin(event);
            }
        });
        
        // Auto-focus username field
        document.getElementById('username').focus();
    </script>
