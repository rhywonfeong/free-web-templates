<meta charset="UTF-8">

<title>Aurora Background</title>

<body class="h-full w-full m-0 p-0 relative bg-black font-sans text-lg text-white antialiased">
    
    <canvas id="aurora-canvas" class="absolute inset-0 block h-full w-full"></canvas>

    <script>
        const canvas = document.getElementById('aurora-canvas');
        const gl = canvas.getContext('webgl2', { 
            alpha: true, 
            premultipliedAlpha: true, 
            antialias: true 
        });

        if (!gl) {
            console.error("WebGL 2.0 is required but not supported by your browser.");
        }

        const vsSource = `#version 300 es
        in vec2 position;
        void main() {
            gl_Position = vec4(position, 0.0, 1.0);
        }`;

        const fsSource = `#version 300 es
        precision highp float;

        uniform float uTime;
        uniform float uAmplitude;
        uniform vec3 uColorStops[3];
        uniform vec2 uResolution;
        uniform float uBlend;

        out vec4 fragColor;

        vec3 permute(vec3 x) {
            return mod(((x * 34.0) + 1.0) * x, 289.0);
        }

        float snoise(vec2 v){
            const vec4 C = vec4(
                0.211324865405187, 0.366025403784439,
                -0.577350269189626, 0.024390243902439
            );
            vec2 i  = floor(v + dot(v, C.yy));
            vec2 x0 = v - i + dot(i, C.xx);
            vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec4 x12 = x0.xyxy + C.xxzz;
            x12.xy -= i1;
            i = mod(i, 289.0);

            vec3 p = permute(
                permute(i.y + vec3(0.0, i1.y, 1.0))
                + i.x + vec3(0.0, i1.x, 1.0)
            );

            vec3 m = max(
                0.5 - vec3(
                    dot(x0, x0),
                    dot(x12.xy, x12.xy),
                    dot(x12.zw, x12.zw)
                ), 
                0.0
            );
            m = m * m;
            m = m * m;

            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);

            vec3 g;
            g.x  = a0.x  * x0.x  + h.x  * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
        }

        struct ColorStop {
            vec3 color;
            float position;
        };

        #define COLOR_RAMP(colors, factor, finalColor) {              \\
            int index = 0;                                            \\
            for (int i = 0; i < 2; i++) {                             \\
                ColorStop currentColor = colors[i];                   \\
                bool isInBetween = currentColor.position <= factor;   \\
                index = int(mix(float(index), float(i), float(isInBetween))); \\
            }                                                         \\
            ColorStop currentColor = colors[index];                   \\
            ColorStop nextColor = colors[index + 1];                  \\
            float range = nextColor.position - currentColor.position; \\
            float lerpFactor = (factor - currentColor.position) / range; \\
            finalColor = mix(currentColor.color, nextColor.color, lerpFactor); \\
        }

        void main() {
            vec2 uv = gl_FragCoord.xy / uResolution;
            
            ColorStop colors[3];
            colors[0] = ColorStop(uColorStops[0], 0.0);
            colors[1] = ColorStop(uColorStops[1], 0.5);
            colors[2] = ColorStop(uColorStops[2], 1.0);
            
            vec3 rampColor;
            COLOR_RAMP(colors, uv.x, rampColor);
            
            float height = snoise(vec2(uv.x * 2.0 + uTime * 0.1, uTime * 0.25)) * 0.5 * uAmplitude;
            height = exp(height);
            height = (uv.y * 2.0 - height + 0.2);
            float intensity = 0.6 * height;
            
            float midPoint = 0.20;
            float auroraAlpha = smoothstep(midPoint - uBlend * 0.5, midPoint + uBlend * 0.5, intensity);
            
            vec3 auroraColor = intensity * rampColor;
            
            fragColor = vec4(auroraColor * auroraAlpha, auroraAlpha);
        }`;

        function compileShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        const vertexShader = compileShader(gl.VERTEX_SHADER, vsSource);
        const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fsSource);

        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error(gl.getProgramInfoLog(program));
        }

        const positions = new Float32Array([
            -1.0, -1.0,
             3.0, -1.0,
            -1.0,  3.0
        ]);

        const positionBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

        const positionAttributeLocation = gl.getAttribLocation(program, "position");
        gl.enableVertexAttribArray(positionAttributeLocation);
        gl.vertexAttribPointer(positionAttributeLocation, 2, gl.FLOAT, false, 0, 0);

        const uTimeLoc = gl.getUniformLocation(program, "uTime");
        const uAmplitudeLoc = gl.getUniformLocation(program, "uAmplitude");
        const uColorStopsLoc = gl.getUniformLocation(program, "uColorStops");
        const uResolutionLoc = gl.getUniformLocation(program, "uResolution");
        const uBlendLoc = gl.getUniformLocation(program, "uBlend");

        // Updated configuration with colors sampled from the provided image
        const config = {
            colorStops: ['#16113b', '#55bae3', '#2245e6'],
            amplitude: 1.0,
            blend: 0.5,
            speed: 1.0
        };

        function hexToRgb(hex) {
            let r = 0, g = 0, b = 0;
            if (hex.length === 4) {
                r = parseInt(hex[1] + hex[1], 16);
                g = parseInt(hex[2] + hex[2], 16);
                b = parseInt(hex[3] + hex[3], 16);
            } else if (hex.length === 7) {
                r = parseInt(hex.substring(1, 3), 16);
                g = parseInt(hex.substring(3, 5), 16);
                b = parseInt(hex.substring(5, 7), 16);
            }
            return [r / 255, g / 255, b / 255];
        }

        const colorStopsFlat = new Float32Array(9);
        function updateColors() {
            let offset = 0;
            for (let hex of config.colorStops) {
                const rgb = hexToRgb(hex);
                colorStopsFlat[offset++] = rgb[0];
                colorStopsFlat[offset++] = rgb[1];
                colorStopsFlat[offset++] = rgb[2];
            }
        }
        updateColors();

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.clearColor(0, 0, 0, 0);

        let startTime = performance.now();

        function render(now) {
            const time = (now - startTime) * 0.001; 

            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.useProgram(program);

            gl.uniform1f(uTimeLoc, time * config.speed); 
            gl.uniform1f(uAmplitudeLoc, config.amplitude);
            gl.uniform1f(uBlendLoc, config.blend);
            gl.uniform2f(uResolutionLoc, canvas.width, canvas.height);
            gl.uniform3fv(uColorStopsLoc, colorStopsFlat);

            gl.drawArrays(gl.TRIANGLES, 0, 3);

            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
