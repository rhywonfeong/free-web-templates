<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ввод ключа — Минимализм</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body {
      font-family: 'Inter', system-ui, sans-serif;
    }
    @keyframes fadeInUp {
      0% {opacity:0; transform:translateY(24px);}
      100% {opacity:1; transform:translateY(0);}
    }
    @keyframes fadeIn {
      0% {opacity:0;}
      100% {opacity:1;}
    }
    .fade-in-up {animation:fadeInUp 0.8s cubic-bezier(.4,0,.2,1) forwards;}
    .fade-in {animation:fadeIn 0.8s cubic-bezier(.4,0,.2,1) forwards;}
    .glass {
      background: rgba(36,28,62,0.7);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      border: 1.5px solid rgba(120,53,255,0.3);
      box-shadow: 0 8px 32px rgba(86,45,186,0.18);
    }
    .border-gradient {
      border-image: linear-gradient(90deg, #a78bfa 15%, #7c3aed 100%) 1;
    }
    /* Loader */
    .loader {
      border: 3px solid #ede9fe;
      border-top: 3px solid #a78bfa;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% {transform:rotate(0deg);}
      100% {transform:rotate(360deg);}
    }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen w-full bg-gradient-to-br from-[#1e183b] via-[#251e4b] to-[#3c217a] flex items-center justify-center px-4">
  <!-- Particles JS BG -->
  <div id="particles-js" class="fixed inset-0 z-0 pointer-events-none"></div>

  <main class="relative z-10 w-full max-w-md">
    <div class="glass p-8 sm:p-10 w-full flex flex-col items-center gap-8 fade-in-up" style="animation-delay:0.15s">
      <div class="w-16 h-16 flex items-center justify-center bg-gradient-to-tr from-[#a78bfa] via-[#8b5cf6] to-[#6d28d9] rounded-full shadow-md fade-in-up" style="animation-delay:0.25s">
        <i id="key-icon" class="lucide lucide-key text-white" style="width:32px;height:32px"></i>
      </div>
      <h2 class="text-3xl tracking-tight font-semibold text-white fade-in-up" style="animation-delay:0.35s">
        Введите ключ доступа
      </h2>
      <p class="text-base text-violet-100 font-normal text-center fade-in-up" style="animation-delay:0.45s">
        Для продолжения работы введите свой персональный ключ. Безопасно и конфиденциально.
      </p>
      <!-- Input + Button -->
      <form id="key-form" class="w-full flex flex-col gap-5 fade-in-up" style="animation-delay:0.65s" autocomplete="off">
        <div class="relative">
          <input 
            id="key-input"
            type="text"
            placeholder="Ваш ключ..."
            required
            class="w-full px-5 py-3 rounded-xl bg-gradient-to-br from-[#29225a]/60 to-[#1e183b]/60 border-2 border-transparent border-gradient text-white text-[1.07rem] font-medium focus:outline-none focus:ring-2 focus:ring-violet-400 focus:border-violet-500 transition placeholder-violet-400/80 shadow-sm"
            style="backdrop-filter: blur(8px);"
          />
          <span class="absolute right-4 top-1/2 -translate-y-1/2 text-violet-300 pointer-events-none">
            <i class="lucide lucide-lock" style="width:20px;height:20px"></i>
          </span>
        </div>
        <button 
          id="submit-btn"
          type="submit"
          class="w-full py-3 flex items-center justify-center rounded-xl bg-gradient-to-tr from-[#a78bfa] via-[#8b5cf6] to-[#6d28d9] font-semibold text-lg tracking-tight text-white shadow-lg hover:from-[#c4b5fd] hover:to-[#7c3aed] hover:ring-2 hover:ring-violet-400/60 transition-all duration-150 outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2"
        >
          <span class="mr-2">Продолжить</span>
          <i class="lucide lucide-arrow-right" style="width:22px;height:22px"></i>
        </button>
        <div id="loader" class="loader mt-3" style="display:none;"></div>
      </form>
    </div>
    <div class="w-full flex justify-center mt-8 fade-in-up" style="animation-delay:0.95s">
      <div class="text-xs text-violet-300/60 font-medium tracking-wide">
        Ваш ключ никому не передаётся
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script>
    // Lucide icons
    lucide.createIcons();

    // ParticlesJS
    particlesJS("particles-js", {
      particles: {
        number: { value: 38, density: { enable: true, value_area: 800 } },
        color: { value: "#a78bfa" },
        shape: { type: "circle" },
        opacity: { value: 0.13, random: true },
        size: { value: 4, random: true },
        line_linked: { enable: true, distance: 150, color: "#7c3aed", opacity: 0.18, width: 1 },
        move: { enable: true, speed: 1.3, direction: "none", random: false, straight: false, out_mode: "out" }
      },
      interactivity: {
        detect_on: "canvas",
        events: { onhover: { enable: true, mode: "repulse" }, onclick: { enable: false } },
        modes: { repulse: { distance: 90, duration: 0.4 } }
      },
      retina_detect: true
    });

    // Sequential fade in (stagger effect)
    document.querySelectorAll('.fade-in-up').forEach((el, idx) => {
      setTimeout(() => el.style.opacity = 1, 200 + idx * 120);
    });

    // Loader logic
    const form = document.getElementById('key-form');
    const btn = document.getElementById('submit-btn');
    const loader = document.getElementById('loader');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      btn.disabled = true;
      loader.style.display = 'block';
      setTimeout(() => {
        loader.style.display = 'none';
        btn.disabled = false;
        // Here you can add further logic (success, error, etc)
      }, 2200);
    });
  </script>
</body>
</html>
