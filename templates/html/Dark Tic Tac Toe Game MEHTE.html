<body class="min-h-screen flex flex-col antialiased selection:bg-neutral-800 selection:text-white text-neutral-200 bg-[#0a0a0a]" style="font-family: 'Inter', sans-serif;">

    <header class="flex text-green-600 w-full max-w-2xl border-neutral-900 border-b mr-auto ml-auto pt-9 pr-9 pb-8 pl-20 items-center justify-between">MEHTA SAHEB KA SEXY KHILONA BY YOHU.</header>

    <main class="flex-1 flex flex-col pt-12 pr-6 pb-12 pl-6 items-center justify-center">
        <div class="text-center mb-10 h-16 flex flex-col justify-center">
            <h2 class="transition-colors duration-300 text-2xl font-semibold text-orange-500 tracking-tight" id="statusMessage">Player X's turn</h2>
            <p id="subStatusMessage" class="text-sm text-neutral-500 mt-1 h-5">First to connect 3 wins</p>
        </div>

        <div class="relative group">
            <div class="absolute -inset-0.5 bg-gradient-to-b from-neutral-800 to-neutral-900 rounded-2xl blur opacity-30 group-hover:opacity-50 transition duration-1000"></div>
            <div class="relative bg-[#0f0f0f] p-3 rounded-2xl border border-neutral-800/80 shadow-2xl">
                <div class="grid grid-cols-3 gap-2 w-full max-w-[280px] sm:max-w-[320px] aspect-square" id="board">
                    <!-- Row 1 -->
                    <button class="cell sm:w-24 sm:h-24 hover:bg-neutral-900 hover:border-neutral-700 transition-all duration-200 flex focus:outline-none focus:ring-1 focus:ring-neutral-600 focus:bg-neutral-900 text-5xl font-light bg-[#141414] w-20 h-20 border-neutral-800/50 border rounded-xl items-center justify-center" data-index="0"></button>
                    <button class="cell w-20 h-20 sm:w-24 sm:h-24 bg-[#141414] rounded-xl border border-neutral-800/50 hover:bg-neutral-900 hover:border-neutral-700 transition-all duration-200 flex items-center justify-center text-5xl font-light focus:outline-none focus:ring-1 focus:ring-neutral-600 focus:bg-neutral-900" data-index="1"></button>
                    <button class="cell sm:w-24 sm:h-24 hover:bg-neutral-900 hover:border-neutral-700 transition-all duration-200 flex focus:outline-none focus:ring-1 focus:ring-neutral-600 focus:bg-neutral-900 text-5xl font-light bg-[#141414] w-20 h-20 border-neutral-800/50 border rounded-xl items-center justify-center" data-index="2"></button>
                    <!-- Row 2 -->
                    <button class="cell sm:w-24 sm:h-24 hover:bg-neutral-900 hover:border-neutral-700 transition-all duration-200 flex focus:outline-none focus:ring-1 focus:ring-neutral-600 focus:bg-neutral-900 text-5xl font-light bg-[#141414] w-20 h-20 border-neutral-800/50 border rounded-xl items-center justify-center" data-index="3"></button>
                    <button class="cell sm:w-24 sm:h-24 hover:bg-neutral-900 hover:border-neutral-700 transition-all duration-200 flex focus:outline-none focus:ring-1 focus:ring-neutral-600 focus:bg-neutral-900 text-5xl font-light bg-[#141414] w-20 h-20 border-neutral-800/50 border rounded-xl items-center justify-center" data-index="4"></button>
                    <button class="cell w-20 h-20 sm:w-24 sm:h-24 bg-[#141414] rounded-xl border border-neutral-800/50 hover:bg-neutral-900 hover:border-neutral-700 transition-all duration-200 flex items-center justify-center text-5xl font-light focus:outline-none focus:ring-1 focus:ring-neutral-600 focus:bg-neutral-900" data-index="5"></button>
                    <!-- Row 3 -->
                    <button class="cell sm:w-24 sm:h-24 hover:bg-neutral-900 hover:border-neutral-700 transition-all duration-200 flex focus:outline-none focus:ring-1 focus:ring-neutral-600 focus:bg-neutral-900 text-5xl font-light bg-[#141414] w-20 h-20 border-neutral-800/50 border rounded-xl items-center justify-center" data-index="6"></button>
                    <button class="cell w-20 h-20 sm:w-24 sm:h-24 bg-[#141414] rounded-xl border border-neutral-800/50 hover:bg-neutral-900 hover:border-neutral-700 transition-all duration-200 flex items-center justify-center text-5xl font-light focus:outline-none focus:ring-1 focus:ring-neutral-600 focus:bg-neutral-900" data-index="7"></button>
                    <button class="cell w-20 h-20 sm:w-24 sm:h-24 bg-[#141414] rounded-xl border border-neutral-800/50 hover:bg-neutral-900 hover:border-neutral-700 transition-all duration-200 flex items-center justify-center text-5xl font-light focus:outline-none focus:ring-1 focus:ring-neutral-600 focus:bg-neutral-900" data-index="8"></button>
                </div>
            </div>
        </div>

        <div class="mt-12">
            <button class="group flex gap-2 hover:bg-white transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-neutral-500 focus:ring-offset-2 focus:ring-offset-[#0a0a0a] active:scale-95 text-sm font-medium text-neutral-950 bg-neutral-100 rounded-full pt-2.5 pr-5 pb-2.5 pl-5 gap-x-2 gap-y-2 items-center" id="resetBtn">
                <iconify-icon icon="solar:restart-linear" stroke-width="1.5" class="text-lg group-hover:-rotate-90 transition-transform duration-300"></iconify-icon>
                Restart Game
            </button>
        </div>
    </main>

    <footer class="py-6 text-center text-xs text-neutral-600 font-medium">
        Play against a friend.
    </footer>

    <script>
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('statusMessage');
        const subStatusText = document.getElementById('subStatusMessage');
        const resetBtn = document.getElementById('resetBtn');
        const scoreXDisplay = document.getElementById('scoreXValue');
        const scoreODisplay = document.getElementById('scoreOValue');

        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let scoreX = 0;
        let scoreO = 0;

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
            [0, 4, 8], [2, 4, 6]             // Diagonals
        ];

        function handleCellClick(e) {
            const cell = e.target;
            const index = cell.getAttribute('data-index');

            if (board[index] !== '' || !gameActive) return;

            board[index] = currentPlayer;
            cell.innerText = currentPlayer;
            
            // Minimalist styling for X and O
            if (currentPlayer === 'X') {
                cell.classList.add('text-neutral-100');
                cell.classList.remove('text-neutral-500');
            } else {
                cell.classList.add('text-neutral-500');
                cell.classList.remove('text-neutral-100');
            }

            // Subtle animation on placement
            cell.style.transform = 'scale(0.95)';
            setTimeout(() => {
                cell.style.transform = 'scale(1)';
            }, 100);

            checkWin();
        }

        function checkWin() {
            let roundWon = false;
            let winningCells = [];

            for (let i = 0; i < winConditions.length; i++) {
                const [a, b, c] = winConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    roundWon = true;
                    winningCells = [a, b, c];
                    break;
                }
            }

            if (roundWon) {
                statusText.innerText = `Player ${currentPlayer} wins!`;
                statusText.classList.add('text-white');
                subStatusText.innerText = 'Game over';
                gameActive = false;
                
                // Highlight winning cells
                winningCells.forEach(index => {
                    cells[index].classList.remove('bg-[#141414]', 'border-neutral-800/50');
                    cells[index].classList.add('bg-neutral-800', 'border-neutral-600');
                });

                if (currentPlayer === 'X') {
                    scoreX++;
                    scoreXDisplay.innerText = scoreX;
                } else {
                    scoreO++;
                    scoreODisplay.innerText = scoreO;
                }
                return;
            }

            if (!board.includes('')) {
                statusText.innerText = 'Draw!';
                subStatusText.innerText = 'No one wins this round';
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusText.innerText = `Player ${currentPlayer}'s turn`;
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            statusText.innerText = `Player X's turn`;
            statusText.classList.remove('text-white');
            subStatusText.innerText = 'First to connect 3 wins';

            cells.forEach(cell => {
                cell.innerText = '';
                cell.classList.remove('text-neutral-100', 'text-neutral-500', 'bg-neutral-800', 'border-neutral-600');
                cell.classList.add('bg-[#141414]', 'border-neutral-800/50');
            });
        }

        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetBtn.addEventListener('click', resetGame);
    </script>

</body></html>
