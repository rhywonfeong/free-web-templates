<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Relaxation App</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #0F111A; /* Outer background for desktop viewing */
-webkit-tap-highlight-color: transparent;
}
/* Hide scrollbar for clean look */
::-webkit-scrollbar {
display: none;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="text-white antialiased flex justify-center min-h-screen">

    <!-- Mobile Device Container Wrapper -->
    <div class="relative w-full max-w-md bg-[#181A2F] min-h-screen overflow-x-hidden shadow-2xl overflow-y-auto pb-24" id="app-container">

        <!-- Splash Screen Overlay -->
        <div id="splash-screen" class="absolute inset-0 z-50 bg-[#181A2F] flex flex-col items-center justify-center transition-opacity duration-1000 ease-in-out">
            <div class="relative mb-8">
                <div class="absolute inset-0 bg-purple-500 blur-3xl opacity-40 rounded-full"></div>
                <div class="w-24 h-24 relative z-10 rounded-[2rem] bg-gradient-to-br from-[#8B5CF6] via-[#6366F1] to-[#F59E0B] flex items-center justify-center shadow-lg">
                    <i data-lucide="moon" class="w-10 h-10 text-white stroke-[1.5] fill-white/20"></i>
                </div>
            </div>
            <h1 class="text-3xl font-medium tracking-tight text-white mb-3">Lumina</h1>
            <p class="text-lg text-indigo-200/80 font-medium">Sleep & Relax</p>
        </div>

        <!-- Main Content (Hidden initially) -->
        <div id="main-content" class="opacity-0 transition-opacity duration-1000 ease-in-out">
            
            <!-- Hero Section -->
            <div class="relative h-[40vh] w-full">
                <!-- Landscape Image Placeholder (using a beautiful sunset/mountain vibe) -->
                <div class="absolute inset-0 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1506744626753-eda8151a74a0?q=80&w=1000&auto=format&fit=crop');"></div>
                
                <!-- Top Actions -->
                <div class="absolute top-10 right-6 flex gap-3 z-20">
                    <button class="w-11 h-11 rounded-full bg-white/10 backdrop-blur-md border border-white/10 flex items-center justify-center transition-transform active:scale-95">
                        <i data-lucide="search" class="w-5 h-5 text-white stroke-[1.5]"></i>
                    </button>
                    <button class="w-11 h-11 rounded-full bg-white/10 backdrop-blur-md border border-white/10 flex items-center justify-center transition-transform active:scale-95">
                        <i data-lucide="menu" class="w-5 h-5 text-white stroke-[1.5]"></i>
                    </button>
                </div>
            </div>

            <!-- Tab Navigation (Overlapping) -->
            <div class="relative flex h-16 w-full -mt-4">
                <!-- Active Tab -->
                <div class="w-[42%] h-full bg-[#181A2F] relative z-20 rounded-tr-[2.5rem] flex items-center px-8 shadow-[10px_0_20px_-10px_rgba(0,0,0,0.4)]">
                    <span class="text-white text-lg font-medium tracking-tight">stories</span>
                </div>
                <!-- Inactive Tabs Container -->
                <div class="flex-1 h-full bg-[#24263D] relative z-10 flex items-center justify-around pl-6 -ml-8 rounded-tl-[2rem]">
                    <span class="text-indigo-200/60 text-base font-medium transition-colors hover:text-white cursor-pointer">Narrators</span>
                    <span class="text-indigo-200/60 text-base font-medium transition-colors hover:text-white cursor-pointer">Favorites</span>
                </div>
            </div>

            <!-- Content Grid -->
            <div class="px-5 pt-8 grid grid-cols-2 gap-x-4 gap-y-8">
                
                <!-- Card 1 -->
                <div class="flex flex-col gap-3 group cursor-pointer">
                    <div class="relative aspect-[4/5] rounded-[2rem] overflow-hidden bg-[#24263D]">
                        <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/917d6f93-fb36-439a-8c48-884b67b35381_1600w.jpg" alt="Ethereal nature" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#181A2F]/80 via-transparent to-transparent"></div>
                        <!-- Play Button -->
                        <div class="absolute top-4 left-4 w-10 h-10 rounded-full bg-black/30 backdrop-blur-md border border-white/10 flex items-center justify-center">
                            <i data-lucide="play" class="w-4 h-4 text-white fill-white ml-0.5"></i>
                        </div>
                    </div>
                    <div class="px-1">
                        <h3 class="text-lg font-medium text-white tracking-tight mb-1">Mystic Forest</h3>
                        <p class="text-sm text-indigo-200/60 font-medium">4 Hours • Deep Sleep</p>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="flex flex-col gap-3 group cursor-pointer">
                    <div class="relative aspect-[4/5] rounded-[2rem] overflow-hidden bg-[#24263D]">
                        <img src="https://images.unsplash.com/photo-1518467166778-b88f373ffec7?q=80&w=600&auto=format&fit=crop" alt="Ocean whale" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#181A2F]/80 via-transparent to-transparent"></div>
                        <div class="absolute top-4 left-4 w-10 h-10 rounded-full bg-black/30 backdrop-blur-md border border-white/10 flex items-center justify-center">
                            <i data-lucide="play" class="w-4 h-4 text-white fill-white ml-0.5"></i>
                        </div>
                    </div>
                    <div class="px-1">
                        <h3 class="text-lg font-medium text-white tracking-tight mb-1">Ocean Song</h3>
                        <p class="text-sm text-indigo-200/60 font-medium">4 Hours • Relaxation</p>
                    </div>
                </div>

                <!-- Card 3 -->
                <div class="flex flex-col gap-3 group cursor-pointer">
                    <div class="relative aspect-[4/5] rounded-[2rem] overflow-hidden bg-[#24263D]">
                        <img src="https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?q=80&w=600&auto=format&fit=crop" alt="Campfire" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#181A2F]/80 via-transparent to-transparent"></div>
                        <div class="absolute top-4 left-4 w-10 h-10 rounded-full bg-black/30 backdrop-blur-md border border-white/10 flex items-center justify-center">
                            <i data-lucide="play" class="w-4 h-4 text-white fill-white ml-0.5"></i>
                        </div>
                    </div>
                    <div class="px-1">
                        <h3 class="text-lg font-medium text-white tracking-tight mb-1">Night Embers</h3>
                        <p class="text-sm text-indigo-200/60 font-medium">4 Hours • Calm</p>
                    </div>
                </div>

                <!-- Card 4 -->
                <div class="flex flex-col gap-3 group cursor-pointer">
                    <div class="relative aspect-[4/5] rounded-[2rem] overflow-hidden bg-[#24263D]">
                        <img src="https://images.unsplash.com/photo-1534880606858-29b0e8a24e8d?q=80&w=600&auto=format&fit=crop" alt="Tent under stars" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90">
                        <div class="absolute inset-0 bg-gradient-to-t from-[#181A2F]/80 via-transparent to-transparent"></div>
                        <div class="absolute top-4 left-4 w-10 h-10 rounded-full bg-black/30 backdrop-blur-md border border-white/10 flex items-center justify-center">
                            <i data-lucide="play" class="w-4 h-4 text-white fill-white ml-0.5"></i>
                        </div>
                    </div>
                    <div class="px-1">
                        <h3 class="text-lg font-medium text-white tracking-tight mb-1">Starry Night</h3>
                        <p class="text-sm text-indigo-200/60 font-medium">4 Hours • Sleep Aid</p>
                    </div>
                </div>

            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 w-full max-w-md bg-[#0F111A]/95 backdrop-blur-xl border-t border-white/5 pt-4 pb-6 px-6 flex justify-between items-end z-40 rounded-t-[2rem]">
            
            <!-- Active Item -->
            <button class="flex flex-col items-center gap-1.5 w-16">
                <div class="relative">
                    <i data-lucide="flame" class="w-6 h-6 text-[#FBBF24] fill-[#FBBF24] stroke-[1.5] relative z-10"></i>
                    <div class="absolute inset-0 bg-[#FBBF24] blur-lg opacity-40 rounded-full z-0 translate-y-1"></div>
                </div>
                <span class="text-[13px] font-medium text-white tracking-tight">Stories</span>
            </button>

            <!-- Inactive Items -->
            <button class="flex flex-col items-center gap-1.5 w-16 group">
                <i data-lucide="sliders-horizontal" class="w-6 h-6 text-indigo-200/50 stroke-[1.5] transition-colors group-hover:text-white"></i>
                <span class="text-[13px] font-medium text-indigo-200/50 transition-colors group-hover:text-white tracking-tight">Create</span>
            </button>

            <button class="flex flex-col items-center gap-1.5 w-16 group">
                <i data-lucide="cloud" class="w-6 h-6 text-indigo-200/50 stroke-[1.5] transition-colors group-hover:text-white"></i>
                <span class="text-[13px] font-medium text-indigo-200/50 transition-colors group-hover:text-white tracking-tight">Sounds</span>
            </button>

            <button class="flex flex-col items-center gap-1.5 w-16 group">
                <i data-lucide="sparkles" class="w-6 h-6 text-indigo-200/50 stroke-[1.5] transition-colors group-hover:text-white"></i>
                <span class="text-[13px] font-medium text-indigo-200/50 transition-colors group-hover:text-white tracking-tight">Meditate</span>
            </button>

            <button class="flex flex-col items-center gap-1.5 w-16 group">
                <i data-lucide="user" class="w-6 h-6 text-indigo-200/50 stroke-[1.5] transition-colors group-hover:text-white"></i>
                <span class="text-[13px] font-medium text-indigo-200/50 transition-colors group-hover:text-white tracking-tight">Profile</span>
            </button>
        </nav>

    </div>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Splash Screen Logic
        document.addEventListener('DOMContentLoaded', () => {
            const splashScreen = document.getElementById('splash-screen');
            const mainContent = document.getElementById('main-content');

            // Simulate loading time then transition
            setTimeout(() => {
                splashScreen.classList.add('opacity-0');
                
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                    mainContent.classList.remove('opacity-0');
                    mainContent.classList.add('opacity-100');
                }, 1000); // Wait for fade out
                
            }, 1800); // Time splash screen is visible
        });
    </script>
</body>
</html>
