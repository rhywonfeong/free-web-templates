<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Slot Interface</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}
/* Slot Reel Animation Blur */
.blur-reel {
filter: blur(4px);
animation: scroll 0.1s linear infinite;
}
@keyframes scroll {
0% { transform: translateY(0); }
100% { transform: translateY(-50%); }
}
/* Custom Scrollbar hide */
.no-scrollbar::-webkit-scrollbar {
display: none;
}
.no-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
/* Win Animation */
@keyframes pulse-gold {
0%, 100% { box-shadow: 0 0 0 0px rgba(234, 179, 8, 0); }
50% { box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.2); }
}
.win-glow {
animation: pulse-gold 1.5s ease-in-out infinite;
border-color: rgba(234, 179, 8, 0.5) !important;
background-color: rgba(234, 179, 8, 0.05);
}
.symbol-bounce {
animation: bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes bounce {
0% { transform: scale(0.8); opacity: 0.5; }
100% { transform: scale(1); opacity: 1; }
}
</style></head>
<body class="bg-zinc-950 text-zinc-300 min-h-screen flex flex-col items-center justify-center p-4 selection:bg-zinc-800">

    <!-- Header / Nav -->
    <header class="w-full max-w-3xl flex justify-between items-center mb-8">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-gradient-to-br from-zinc-100 to-zinc-500 rounded-lg flex items-center justify-center shadow-lg shadow-zinc-900/50">
                <span class="font-bold text-zinc-950 text-xs tracking-tighter">SL</span>
            </div>
            <span class="font-semibold text-zinc-100 tracking-tight text-sm">SLOTLABS</span>
        </div>

        <!-- Balance Badge -->
        <div class="group relative bg-zinc-900/50 border border-zinc-800 rounded-full px-4 py-1.5 flex items-center gap-3 backdrop-blur-md transition-all hover:border-zinc-700">
            <div class="flex items-center gap-1.5">
                <i data-lucide="wallet" class="w-3.5 h-3.5 text-zinc-500"></i>
                <span class="text-xs font-medium text-zinc-500 uppercase tracking-wide">Balance</span>
            </div>
            <div class="h-3 w-px bg-zinc-800"></div>
            <span class="text-sm font-semibold text-zinc-100 tabular-nums tracking-tight" id="balance-display">$1,000.00</span>
            
            <!-- Added Funds Toast (Hidden by default) -->
            <div id="win-toast" class="absolute -bottom-8 left-1/2 -translate-x-1/2 text-emerald-400 text-xs font-bold opacity-0 transition-all duration-500 pointer-events-none whitespace-nowrap">
                + $0.00
            </div>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-3xl relative">
        <!-- Decoration Gradients -->
        <div class="absolute -top-20 -left-20 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -right-20 w-64 h-64 bg-emerald-500/5 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Slot Machine Frame -->
        <div class="relative bg-zinc-900 border border-zinc-800 rounded-2xl p-1 shadow-2xl shadow-black ring-1 ring-white/5 overflow-hidden">
            
            <!-- Glass Overlay/Reflection -->
            <div class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent pointer-events-none z-20 rounded-xl"></div>
            
            <!-- Reels Container -->
            <div class="bg-zinc-950 rounded-xl border border-zinc-800/50 overflow-hidden relative" style="height: 320px;">
                <!-- Payline Indicators (Subtle) -->
                <div class="absolute inset-y-0 left-0 w-2 z-10 bg-gradient-to-r from-zinc-950 to-transparent"></div>
                <div class="absolute inset-y-0 right-0 w-2 z-10 bg-gradient-to-l from-zinc-950 to-transparent"></div>
                
                <!-- Grid Overlay for rows -->
                <div class="absolute inset-0 pointer-events-none z-10 flex flex-col justify-between py-2">
                    <div class="h-px w-full bg-gradient-to-r from-transparent via-zinc-800/30 to-transparent top-[33%] absolute"></div>
                    <div class="h-px w-full bg-gradient-to-r from-transparent via-zinc-800/30 to-transparent top-[66%] absolute"></div>
                </div>

                <!-- The 5 Reels -->
                <div class="grid grid-cols-5 h-full w-full" id="slots-grid">
                    <!-- Reels inserted by JS -->
                </div>
                
                <!-- Win Overlay -->
                <div id="game-message" class="absolute inset-0 flex items-center justify-center z-30 pointer-events-none opacity-0 transition-opacity duration-300">
                    <div class="bg-zinc-950/80 backdrop-blur-sm border border-zinc-700 px-6 py-3 rounded-full shadow-2xl transform scale-90 transition-transform duration-300" id="message-box">
                        <span class="text-2xl font-semibold text-white tracking-tight" id="message-text">Big Win!</span>
                    </div>
                </div>
            </div>

            <!-- Controls Section -->
            <div class="mt-1 bg-zinc-900 rounded-xl border-t border-zinc-800/50 p-4 sm:p-6 flex flex-col sm:flex-row gap-6 justify-between items-center relative z-20">
                
                <!-- Bet Controls -->
                <div class="flex flex-col gap-2 w-full sm:w-auto">
                    <span class="text-xs font-medium text-zinc-500 uppercase tracking-wider ml-1">Bet Amount</span>
                    <div class="flex items-center bg-zinc-950 rounded-lg p-1 border border-zinc-800 shadow-inner">
                        <button onclick="adjustBet(-10)" class="w-10 h-10 flex items-center justify-center rounded-md hover:bg-zinc-800 text-zinc-400 hover:text-white transition-colors disabled:opacity-50" id="btn-minus">
                            <i data-lucide="minus" class="w-4 h-4"></i>
                        </button>
                        <div class="w-24 text-center font-medium text-zinc-200 tabular-nums text-lg" id="bet-amount">$10</div>
                        <button onclick="adjustBet(10)" class="w-10 h-10 flex items-center justify-center rounded-md hover:bg-zinc-800 text-zinc-400 hover:text-white transition-colors disabled:opacity-50" id="btn-plus">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Spin Button -->
                <button onclick="spin()" id="spin-btn" class="w-full sm:w-auto flex-1 max-w-xs group relative overflow-hidden rounded-xl bg-zinc-100 px-8 py-4 transition-all hover:scale-[1.02] active:scale-[0.98] disabled:opacity-70 disabled:hover:scale-100">
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-zinc-300/50 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <div class="relative flex items-center justify-center gap-3">
                        <span class="font-semibold text-zinc-900 text-lg tracking-tight">Spin Reel</span>
                        <i data-lucide="refresh-cw" class="w-5 h-5 text-zinc-900 transition-transform duration-700 group-hover:rotate-180" id="spin-icon"></i>
                    </div>
                </button>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="mt-6 flex justify-between items-center text-xs text-zinc-600 px-2">
            <p>Provably Fair &bull; RNG Certified</p>
            <div class="flex gap-4">
                <span class="hover:text-zinc-400 cursor-pointer transition-colors">History</span>
                <span class="hover:text-zinc-400 cursor-pointer transition-colors">Rules</span>
            </div>
        </div>

    </main>

    <script>
        // Init Icons
        lucide.createIcons();

        // Game State
        const symbols = [
            { id: 'gem', icon: 'gem', color: 'text-indigo-400', weight: 1, val: 50 },
            { id: 'crown', icon: 'crown', color: 'text-amber-400', weight: 2, val: 20 },
            { id: 'zap', icon: 'zap', color: 'text-yellow-300', weight: 3, val: 10 },
            { id: 'star', icon: 'star', color: 'text-purple-400', weight: 4, val: 5 },
            { id: 'clover', icon: 'clover', color: 'text-emerald-400', weight: 5, val: 3 },
            { id: 'circle', icon: 'circle-dashed', color: 'text-zinc-600', weight: 6, val: 1 } // Low value
        ];

        let balance = 1000;
        let currentBet = 10;
        let isSpinning = false;
        const rows = 3;
        const cols = 5;

        // DOM Elements
        const gridEl = document.getElementById('slots-grid');
        const balanceEl = document.getElementById('balance-display');
        const betEl = document.getElementById('bet-amount');
        const spinBtn = document.getElementById('spin-btn');
        const spinIcon = document.getElementById('spin-icon');
        const winToast = document.getElementById('win-toast');
        const msgEl = document.getElementById('game-message');
        const msgText = document.getElementById('message-text');
        const msgBox = document.getElementById('message-box');

        // Helper: Weighted Random
        function getRandomSymbol() {
            const totalWeight = symbols.reduce((acc, s) => acc + s.weight, 0);
            let random = Math.random() * totalWeight;
            for (const s of symbols) {
                if (random < s.weight) return s;
                random -= s.weight;
            }
            return symbols[symbols.length - 1];
        }

        // Initialize Grid
        function initGrid() {
            gridEl.innerHTML = '';
            for (let i = 0; i < cols; i++) {
                const col = document.createElement('div');
                col.className = 'border-r border-zinc-800/30 last:border-0 flex flex-col items-center justify-around relative bg-zinc-950 overflow-hidden';
                col.id = `reel-${i}`;
                
                // Create a container for the strip of icons
                const strip = document.createElement('div');
                strip.className = 'flex flex-col items-center justify-around w-full h-full transition-transform duration-100 ease-linear';
                strip.id = `strip-${i}`;

                // Fill with initial random symbols
                for(let r=0; r<rows; r++) {
                    const sym = getRandomSymbol();
                    const cell = createCell(sym);
                    strip.appendChild(cell);
                }
                
                col.appendChild(strip);
                gridEl.appendChild(col);
            }
            lucide.createIcons();
        }

        function createCell(symbol) {
            const cell = document.createElement('div');
            cell.className = `h-1/3 w-full flex items-center justify-center ${symbol.color}`;
            cell.innerHTML = `<i data-lucide="${symbol.icon}" class="w-8 h-8 sm:w-10 sm:h-10 opacity-90 filter drop-shadow-lg symbol-bounce"></i>`;
            return cell;
        }

        function updateUI() {
            balanceEl.innerText = `$${balance.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
            betEl.innerText = `$${currentBet}`;
            if(balance < currentBet) {
                balanceEl.classList.add('text-red-400');
            } else {
                balanceEl.classList.remove('text-red-400');
            }
        }

        function adjustBet(amount) {
            if (isSpinning) return;
            if (currentBet + amount >= 10 && currentBet + amount <= balance) {
                currentBet += amount;
                updateUI();
            } else if (currentBet + amount >= 10 && balance >= 10) {
                 // allow bet adjustment even if exceeds balance, validation happens on spin
                 if(currentBet + amount > 10) currentBet += amount;
                 updateUI();
            }
        }

        function showToast(amount) {
            winToast.innerText = `+ $${amount.toFixed(2)}`;
            winToast.classList.remove('opacity-0', 'translate-y-2');
            winToast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                winToast.classList.add('opacity-0', 'translate-y-2');
                winToast.classList.remove('opacity-100', 'translate-y-0');
            }, 2000);
        }

        function showMessage(text, type = 'win') {
            msgText.innerText = text;
            msgEl.classList.remove('opacity-0', 'pointer-events-none');
            msgBox.classList.remove('scale-90');
            msgBox.classList.add('scale-100');
            
            if(type === 'win') {
                msgText.classList.add('text-amber-400');
            } else {
                msgText.classList.remove('text-amber-400');
            }

            setTimeout(() => {
                msgEl.classList.add('opacity-0', 'pointer-events-none');
                msgBox.classList.add('scale-90');
                msgBox.classList.remove('scale-100');
            }, 2000);
        }

        async function spin() {
            if (isSpinning) return;
            if (balance < currentBet) {
                showMessage("Insufficient Funds", "error");
                return;
            }

            isSpinning = true;
            balance -= currentBet;
            updateUI();
            
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50');
            spinIcon.classList.add('animate-spin');

            // Generate results beforehand
            const finalGrid = [];
            for(let c=0; c<cols; c++) {
                const colRes = [];
                for(let r=0; r<rows; r++) colRes.push(getRandomSymbol());
                finalGrid.push(colRes);
            }

            // Animate Reels
            const promises = [];
            for (let i = 0; i < cols; i++) {
                promises.push(new Promise(resolve => {
                    const strip = document.getElementById(`strip-${i}`);
                    const reel = document.getElementById(`reel-${i}`);
                    
                    // Add blur class
                    reel.classList.add('blur-reel'); // CSS animation
                    
                    // Delay stopping
                    setTimeout(() => {
                        reel.classList.remove('blur-reel');
                        
                        // Replace content
                        strip.innerHTML = '';
                        for(let r=0; r<rows; r++) {
                            const sym = finalGrid[i][r];
                            strip.appendChild(createCell(sym));
                        }
                        lucide.createIcons();
                        resolve();
                    }, 500 + (i * 150)); // Staggered stop
                }));
            }

            await Promise.all(promises);

            checkWin(finalGrid);
            
            isSpinning = false;
            spinBtn.disabled = false;
            spinBtn.classList.remove('opacity-50');
            spinIcon.classList.remove('animate-spin');
        }

        function checkWin(grid) {
            let totalWin = 0;
            let winDetails = [];

            // Simple Logic: Check 3 horizontal lines (Paylines)
            // Row 0
            for (let r = 0; r < rows; r++) {
                // Check matches starting from col 0
                let firstSym = grid[0][r];
                let matchCount = 1;
                
                for (let c = 1; c < cols; c++) {
                    if (grid[c][r].id === firstSym.id) {
                        matchCount++;
                    } else {
                        break;
                    }
                }

                if (matchCount >= 3) {
                    // Calculate Win
                    const winAmount = currentBet * firstSym.val * (matchCount - 2); 
                    totalWin += winAmount;
                    winDetails.push({ row: r, count: matchCount });
                    
                    // Highlight Row
                    for(let c=0; c<matchCount; c++) {
                         const strip = document.getElementById(`strip-${c}`);
                         strip.children[r].classList.add('win-glow'); // Highlight winning cells
                    }
                }
            }

            if (totalWin > 0) {
                balance += totalWin;
                showToast(totalWin);
                
                if (totalWin > currentBet * 10) {
                    showMessage("MEGA WIN!");
                } else {
                    showMessage("WINNER!");
                }
                updateUI();
            }
        }

        // Init
        initGrid();
        updateUI();

    </script>
</body>
