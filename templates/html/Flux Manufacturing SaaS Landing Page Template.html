<style>
body { font-family: 'Inter', sans-serif; }
/* Custom scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #020617; }

/* Subtle Grid Background */
.bg-grid {
background-size: 40px 40px;

/* 3D Transform for Hero Dashboard */

transform: perspective(1000px) rotateX(2deg) translateY(0);

.transition-blur {

<script>
tailwind.config = {
theme: {
extend: {
colors: {
slate: {

}

function toggleLogin(show) {
const modal = document.getElementById('loginModal');
const mainContent = document.getElementById('mainContent');
if (show) {
modal.classList.remove('hidden');
modal.classList.add('flex');
// Add blur and disable interaction on background
mainContent.classList.add('blur-[2px]', 'pointer-events-none', 'select-none', 'opacity-50');
} else {
modal.classList.add('hidden');
modal.classList.remove('flex');
// Remove blur and restore interaction
mainContent.classList.remove('blur-[2px]', 'pointer-events-none', 'select-none', 'opacity-50');
}
}
</script></head>
<body class="bg-slate-950 text-slate-400 antialiased selection:bg-indigo-500/30 selection:text-indigo-200 overflow-x-hidden relative">

                    <path d="M12 24C15.24 24 17.96 22.93 19.93 21.11L16.37 18.39C15.26 19.14 13.8 19.64 12 19.64C8.83 19.64 6.14 17.5 5.18 14.64L5.01 14.65L1.39 17.38L1.33 17.52C3.33 21.46 7.42 24 12 24Z" fill="#34A853"/>
