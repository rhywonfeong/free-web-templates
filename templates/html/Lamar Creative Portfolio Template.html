        <!-- Dragging Interactivity Script -->
        <script>
          (function() {
              const section = document.querySelector('[data-element-id="aura-emsig0db95tngvin"]');
              if (!section) return;
              const pills = section.querySelectorAll('.draggable-pill');

              pills.forEach(pill => {
                  let isDragging = false;
                  let startX, startY, initialLeft, initialTop;

                  const onStart = (e) => {
                      if(e.button !== 0 && e.type !== 'touchstart') return;
                      isDragging = true;

                      // Pause the floating animation during drag
                      pill.style.animationPlayState = 'paused';
                      pill.style.cursor = 'grabbing';

                      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                      startX = clientX;
                      startY = clientY;

                      const rect = pill.getBoundingClientRect();
                      const sectionRect = section.getBoundingClientRect();

                      initialLeft = rect.left - sectionRect.left;
                      initialTop = rect.top - sectionRect.top;

                      // Bring the active dragged pill to the top layer
                      pills.forEach(p => p.style.zIndex = '10');
                      pill.style.zIndex = '20';
                  };

                  const onMove = (e) => {
                      if (!isDragging) return;
                      e.preventDefault();

                      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                      const deltaX = clientX - startX;
                      const deltaY = clientY - startY;

                      // Override positioning relative to standard flow to absolute coordinates
                      pill.style.left = `${initialLeft + deltaX}px`;
                      pill.style.top = `${initialTop + deltaY}px`;
                      pill.style.right = 'auto';
                      pill.style.bottom = 'auto';
                  };

                  const onEnd = () => {
                      if (!isDragging) return;
                      isDragging = false;

                      // Resume float animation smoothly
                      pill.style.animationPlayState = 'running';
                      pill.style.cursor = 'grab';
                  };

                  pill.addEventListener('mousedown', onStart);
                  pill.addEventListener('touchstart', onStart, { passive: false });

                  window.addEventListener('mousemove', onMove, { passive: false });
                  window.addEventListener('touchmove', onMove, { passive: false });

                  window.addEventListener('mouseup', onEnd);
                  window.addEventListener('touchend', onEnd);
              });
          })();
        </script>

          (function() {
              const container = document.getElementById('gallery-container');
              if (!container) return;

              const cards = container.querySelectorAll('.gallery-card');

              // Initialize base indices and state
              cards.forEach((card, index) => {
                  card.style.zIndex = index + 1;
                  card.dataset.baseZIndex = index + 1;
                  card.dataset.active = 'false';

                  card.addEventListener('click', (e) => {
                      e.stopPropagation();

                      const isCurrentlyActive = card.dataset.active === 'true';

                      // Reset all cards to their initial staggered positions
                      cards.forEach(c => {
                          c.dataset.active = 'false';
                          const bx = parseFloat(c.dataset.x);
                          const by = parseFloat(c.dataset.y);
                          const bz = parseFloat(c.dataset.z);
                          c.style.transform = `translate3d(calc(-50% + ${bx}px), calc(-50% + ${by}px), ${bz}px) scale(1)`;
                          c.style.zIndex = c.dataset.baseZIndex;
                      });

                      if (!isCurrentlyActive) {
                          // Activate clicked card - pop it up and slightly out
                          card.dataset.active = 'true';
                          const bx = parseFloat(card.dataset.x);
                          const by = parseFloat(card.dataset.y);
                          const bz = parseFloat(card.dataset.z);

                          // Move UP visually on Y axis, out on Z axis, and scale slightly
                          card.style.transform = `translate3d(calc(-50% + ${bx - 10}px), calc(-50% + ${by - 160}px), ${bz + 150}px) scale(1.05)`;
                          card.style.zIndex = 100;
                      }
                  });
              });

              // Click outside gallery to reset
              document.getElementById('interactive-gallery').addEventListener('click', () => {
                   cards.forEach(c => {
                       c.dataset.active = 'false';
                       const bx = parseFloat(c.dataset.x);

                       const bz = parseFloat(c.dataset.z);
                       c.style.transform = `translate3d(calc(-50% + ${bx}px), calc(-50% + ${by}px), ${bz}px) scale(1)`;
                       c.style.zIndex = c.dataset.baseZIndex;
                   });
              });
          })();
        </script>

    <script>
      // Initialize Lucide Icons
      lucide.createIcons();

      /* --- 1. Works Section Data & Logic --- */
      const worksData = {
          "2022": { category: "Furniture", group: "HTL GROUP", items: ["Product Catalog Layout", "Poster & Key Visual", "Photographer"] },
          "2023": { category: "Branding", group: "STUDIO ORA", items: ["Visual Identity System", "Editorial Layout Design", "Spatial Signage"] },
          "2024": { category: "Packaging", group: "NEO BOTANICS", items: ["Eco Packaging Suite", "3D Bottle Rendering", "Motion Typography"] },
          "2025": { category: "Digital", group: "LUMEN TECH", items: ["Interactive Web Design", "Brand Strategy", "UI Design System"] },
          "2026": { category: "Exhibition", group: "ART MUSEUM", items: ["Curation Visuals", "Interactive Installation", "Limited Print Series"] }
      };

      const yearBtns = document.querySelectorAll('.year-btn');
      const worksContent = document.getElementById('works-content');
      const catEl = document.getElementById('work-category');
      const groupEl = document.getElementById('work-group');
      const listEl = document.getElementById('work-list');

      function renderWorks(year) {
          const data = worksData[year];

          // Fade out
          worksContent.classList.remove('opacity-100');
          worksContent.classList.add('opacity-0');

          setTimeout(() => {
              // Update text
              catEl.textContent = data.category;
              groupEl.textContent = data.group;

              // Build list items (text-base for body text 1 size bigger)
              listEl.innerHTML = data.items.map((item, index) => `
                  <div class="flex items-start border-b border-gray-800 py-3 w-full">
                      <span class="w-6 text-sm font-semibold text-gray-300 mt-0.5">${index + 1}</span>
                      <span class="text-base text-gray-100 flex-1 leading-snug">${item}</span>
                  </div>
              `).join('');

              // Add ellipsis row as per visual
              listEl.innerHTML += `
                  <div class="flex items-start py-3 w-full">
                      <span class="text-base text-gray-500">...</span>
                  </div>
              `;

              // Fade in
              worksContent.classList.remove('opacity-0');
              worksContent.classList.add('opacity-100');
          }, 300); // Wait for fade out
      }

      yearBtns.forEach(btn => {
          btn.addEventListener('click', () => {
              const selectedYear = btn.getAttribute('data-year');

              // Reset styles for all buttons
              yearBtns.forEach(b => {
                  b.classList.remove('text-4xl', 'text-white', 'font-semibold');
                  b.classList.add('text-2xl', 'text-gray-500', 'font-normal');
              });

              // Apply active styles
              btn.classList.remove('text-2xl', 'text-gray-500', 'font-normal');
              btn.classList.add('text-4xl', 'text-white', 'font-semibold');

              renderWorks(selectedYear);
          });
      });

      // Initial render
      renderWorks("2022");


      /* --- 2. Scroll Spy Navigation --- */
      const sections = document.querySelectorAll('section');
      const navLinks = document.querySelectorAll('.nav-link');

      const observerOptions = {
          root: null,
          rootMargin: '-50% 0px -50% 0px', // Trigger when section is in the middle of viewport
          threshold: 0
      };

      const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
              if (entry.isIntersecting) {
                  const currentId = entry.target.getAttribute('id');

                  navLinks.forEach(link => {
                      link.classList.remove('text-black', 'font-semibold');
                      link.classList.add('text-gray-400', 'font-normal');

                      if (link.getAttribute('data-target') === currentId) {
                          link.classList.remove('text-gray-400', 'font-normal');
                          link.classList.add('text-black', 'font-semibold');
                      }
                  });
              }
          });
      }, observerOptions);

      sections.forEach(section => observer.observe(section));


      /* --- 3. Draggable Floating Pills --- */
      const pills = document.querySelectorAll('.draggable-pill');
      const introSection = document.getElementById('intro');

      pills.forEach(pill => {
          let isDragging = false;
          let currentX;
          let currentY;
          let initialX;
          let initialY;
          let xOffset = 0;
          let yOffset = 0;

          function dragStart(e) {
              if (e.type === "touchstart") {
                  initialX = e.touches[0].clientX - xOffset;
                  initialY = e.touches[0].clientY - yOffset;
              } else {
                  initialX = e.clientX - xOffset;
                  initialY = e.clientY - yOffset;
              }

              if (e.target === pill) {
                  isDragging = true;
                  // Pause animation to prevent jumping while dragging
                  pill.style.animationPlayState = 'paused';
              }
          }

          function dragEnd(e) {
              initialX = currentX;
              initialY = currentY;
              isDragging = false;
              // Resume floating animation from new position
              pill.style.animationPlayState = 'running';
          }

          function drag(e) {
              if (isDragging) {
                  e.preventDefault(); // Prevent scrolling on touch devices while dragging

                  if (e.type === "touchmove") {
                      currentX = e.touches[0].clientX - initialX;
                      currentY = e.touches[0].clientY - initialY;
                  } else {
                      currentX = e.clientX - initialX;
                      currentY = e.clientY - initialY;
                  }

                  xOffset = currentX;
                  yOffset = currentY;

                  setTranslate(currentX, currentY, pill);
              }
          }

          function setTranslate(xPos, yPos, el) {
              el.style.transform = `translate3d(${xPos}px, ${yPos}px, 0)`;
          }

          // Touch events
          pill.addEventListener("touchstart", dragStart, { passive: false });
          document.addEventListener("touchend", dragEnd, { passive: false });
          document.addEventListener("touchmove", drag, { passive: false });

          // Mouse events
          pill.addEventListener("mousedown", dragStart);
          document.addEventListener("mouseup", dragEnd);
          document.addEventListener("mousemove", drag);
      });
    </script>
