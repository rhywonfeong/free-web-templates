<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Lists</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script></head>
<body class="bg-white text-gray-900 antialiased">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="border-b border-gray-200">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 sm:py-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 bg-gray-900 rounded-lg flex items-center justify-center">
                            <span class="text-white text-sm font-semibold tracking-tight">SL</span>
                        </div>
                        <h1 class="text-xl sm:text-2xl font-semibold tracking-tight">Shopping Lists</h1>
                    </div>
                    <button onclick="showNewListModal()" class="flex items-center gap-2 px-4 py-2 bg-gray-900 text-white rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">New List</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
            <div id="listsContainer" class="space-y-4">
                <!-- Lists will be added here -->
            </div>
            
            <div id="emptyState" class="text-center py-16">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-100 rounded-full mb-4">
                    <i data-lucide="shopping-cart" class="w-8 h-8 text-gray-400"></i>
                </div>
                <h2 class="text-lg font-semibold mb-2">No shopping lists yet</h2>
                <p class="text-gray-500 text-sm mb-6">Create your first shopping list to get started</p>
                <button onclick="showNewListModal()" class="inline-flex items-center gap-2 px-4 py-2 bg-gray-900 text-white rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    Create List
                </button>
            </div>
        </main>
    </div>

    <!-- New List Modal -->
    <div id="newListModal" class="hidden fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between p-6 border-b border-gray-200">
                <h3 class="text-lg font-semibold">Create New List</h3>
                <button onclick="hideNewListModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">List Title</label>
                <input type="text" id="newListTitle" placeholder="e.g., Weekly Groceries" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
            </div>
            <div class="flex items-center justify-end gap-3 p-6 border-t border-gray-200">
                <button onclick="hideNewListModal()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-gray-900 transition-colors">Cancel</button>
                <button onclick="createList()" class="px-4 py-2 bg-gray-900 text-white rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors">Create List</button>
            </div>
        </div>
    </div>

    <!-- Add Item Modal -->
    <div id="addItemModal" class="hidden fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between p-6 border-b border-gray-200">
                <h3 class="text-lg font-semibold" id="itemModalTitle">Add Item</h3>
                <button onclick="hideAddItemModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Item Name</label>
                    <input type="text" id="itemName" placeholder="e.g., Milk" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Quantity</label>
                    <input type="text" id="itemQuantity" placeholder="e.g., 2 liters" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                    <select id="itemCategory" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent bg-white">
                        <option value="uncategorized">Uncategorized</option>
                        <option value="produce">Produce</option>
                        <option value="dairy">Dairy</option>
                        <option value="meat">Meat & Seafood</option>
                        <option value="bakery">Bakery</option>
                        <option value="pantry">Pantry</option>
                        <option value="frozen">Frozen</option>
                        <option value="beverages">Beverages</option>
                        <option value="snacks">Snacks</option>
                        <option value="household">Household</option>
                        <option value="personal">Personal Care</option>
                    </select>
                </div>
            </div>
            <div class="flex items-center justify-end gap-3 p-6 border-t border-gray-200">
                <button onclick="hideAddItemModal()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:text-gray-900 transition-colors">Cancel</button>
                <button onclick="saveItem()" class="px-4 py-2 bg-gray-900 text-white rounded-lg text-sm font-medium hover:bg-gray-800 transition-colors" id="saveItemBtn">Add Item</button>
            </div>
        </div>
    </div>

    <script>
        let lists = [];
        let currentListId = null;
        let currentEditingItemId = null;
        let draggedElement = null;

        // Initialize
        function init() {
            loadLists();
            renderLists();
            lucide.createIcons();
        }

        // Local Storage
        function saveLists() {
            localStorage.setItem('shoppingLists', JSON.stringify(lists));
        }

        function loadLists() {
            const saved = localStorage.getItem('shoppingLists');
            if (saved) {
                lists = JSON.parse(saved);
            }
        }

        // List Management
        function showNewListModal() {
            document.getElementById('newListModal').classList.remove('hidden');
            document.getElementById('newListTitle').value = '';
            document.getElementById('newListTitle').focus();
        }

        function hideNewListModal() {
            document.getElementById('newListModal').classList.add('hidden');
        }

        function createList() {
            const title = document.getElementById('newListTitle').value.trim();
            if (!title) return;

            const newList = {
                id: Date.now(),
                title: title,
                items: [],
                created: new Date().toISOString()
            };

            lists.unshift(newList);
            saveLists();
            renderLists();
            hideNewListModal();
            lucide.createIcons();
        }

        function deleteList(listId) {
            if (confirm('Are you sure you want to delete this list?')) {
                lists = lists.filter(l => l.id !== listId);
                saveLists();
                renderLists();
                lucide.createIcons();
            }
        }

        // Item Management
        function showAddItemModal(listId) {
            currentListId = listId;
            currentEditingItemId = null;
            document.getElementById('itemModalTitle').textContent = 'Add Item';
            document.getElementById('saveItemBtn').textContent = 'Add Item';
            document.getElementById('itemName').value = '';
            document.getElementById('itemQuantity').value = '';
            document.getElementById('itemCategory').value = 'uncategorized';
            document.getElementById('addItemModal').classList.remove('hidden');
            document.getElementById('itemName').focus();
        }

        function showEditItemModal(listId, itemId) {
            const list = lists.find(l => l.id === listId);
            const item = list.items.find(i => i.id === itemId);
            
            currentListId = listId;
            currentEditingItemId = itemId;
            document.getElementById('itemModalTitle').textContent = 'Edit Item';
            document.getElementById('saveItemBtn').textContent = 'Save Changes';
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemQuantity').value = item.quantity;
            document.getElementById('itemCategory').value = item.category;
            document.getElementById('addItemModal').classList.remove('hidden');
            document.getElementById('itemName').focus();
        }

        function hideAddItemModal() {
            document.getElementById('addItemModal').classList.add('hidden');
            currentListId = null;
            currentEditingItemId = null;
        }

        function saveItem() {
            const name = document.getElementById('itemName').value.trim();
            if (!name) return;

            const quantity = document.getElementById('itemQuantity').value.trim();
            const category = document.getElementById('itemCategory').value;

            const list = lists.find(l => l.id === currentListId);

            if (currentEditingItemId) {
                // Edit existing item
                const item = list.items.find(i => i.id === currentEditingItemId);
                item.name = name;
                item.quantity = quantity;
                item.category = category;
            } else {
                // Add new item
                const newItem = {
                    id: Date.now(),
                    name: name,
                    quantity: quantity,
                    category: category,
                    checked: false
                };
                list.items.push(newItem);
            }

            saveLists();
            renderLists();
            hideAddItemModal();
            lucide.createIcons();
        }

        function toggleItem(listId, itemId) {
            const list = lists.find(l => l.id === listId);
            const item = list.items.find(i => i.id === itemId);
            item.checked = !item.checked;
            saveLists();
            renderLists();
            lucide.createIcons();
        }

        function deleteItem(listId, itemId) {
            const list = lists.find(l => l.id === listId);
            list.items = list.items.filter(i => i.id !== itemId);
            saveLists();
            renderLists();
            lucide.createIcons();
        }

        // Drag and Drop
        function handleDragStart(e, listId, itemId) {
            draggedElement = { listId, itemId };
            e.target.style.opacity = '0.4';
        }

        function handleDragEnd(e) {
            e.target.style.opacity = '1';
        }

        function handleDragOver(e) {
            e.preventDefault();
            return false;
        }

        function handleDrop(e, listId, targetItemId) {
            e.preventDefault();
            if (!draggedElement || draggedElement.listId !== listId) return;

            const list = lists.find(l => l.id === listId);
            const draggedIndex = list.items.findIndex(i => i.id === draggedElement.itemId);
            const targetIndex = list.items.findIndex(i => i.id === targetItemId);

            if (draggedIndex !== targetIndex) {
                const [removed] = list.items.splice(draggedIndex, 1);
                list.items.splice(targetIndex, 0, removed);
                saveLists();
                renderLists();
                lucide.createIcons();
            }

            draggedElement = null;
        }

        // Category Helpers
        const categoryColors = {
            uncategorized: 'bg-gray-100 text-gray-700',
            produce: 'bg-green-100 text-green-700',
            dairy: 'bg-blue-100 text-blue-700',
            meat: 'bg-red-100 text-red-700',
            bakery: 'bg-yellow-100 text-yellow-700',
            pantry: 'bg-orange-100 text-orange-700',
            frozen: 'bg-cyan-100 text-cyan-700',
            beverages: 'bg-purple-100 text-purple-700',
            snacks: 'bg-pink-100 text-pink-700',
            household: 'bg-indigo-100 text-indigo-700',
            personal: 'bg-teal-100 text-teal-700'
        };

        const categoryLabels = {
            uncategorized: 'Uncategorized',
            produce: 'Produce',
            dairy: 'Dairy',
            meat: 'Meat & Seafood',
            bakery: 'Bakery',
            pantry: 'Pantry',
            frozen: 'Frozen',
            beverages: 'Beverages',
            snacks: 'Snacks',
            household: 'Household',
            personal: 'Personal Care'
        };

        // Render
        function renderLists() {
            const container = document.getElementById('listsContainer');
            const emptyState = document.getElementById('emptyState');

            if (lists.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            container.innerHTML = lists.map(list => {
                const totalItems = list.items.length;
                const checkedItems = list.items.filter(i => i.checked).length;
                
                return `
                    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden hover:border-gray-300 transition-colors">
                        <div class="p-4 sm:p-6 border-b border-gray-200">
                            <div class="flex items-start justify-between gap-4">
                                <div class="flex-1 min-w-0">
                                    <h2 class="text-lg font-semibold mb-1 truncate">${list.title}</h2>
                                    <p class="text-sm text-gray-500">${checkedItems} of ${totalItems} completed</p>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button onclick="showAddItemModal(${list.id})" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors">
                                        <i data-lucide="plus" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="deleteList(${list.id})" class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="divide-y divide-gray-100">
                            ${list.items.length === 0 ? `
                                <div class="p-8 text-center">
                                    <p class="text-sm text-gray-500">No items yet. Add your first item to get started.</p>
                                </div>
                            ` : list.items.map(item => `
                                <div 
                                    class="flex items-center gap-3 p-4 hover:bg-gray-50 transition-colors cursor-move group"
                                    draggable="true"
                                    ondragstart="handleDragStart(event, ${list.id}, ${item.id})"
                                    ondragend="handleDragEnd(event)"
                                    ondragover="handleDragOver(event)"
                                    ondrop="handleDrop(event, ${list.id}, ${item.id})"
                                >
                                    <button onclick="toggleItem(${list.id}, ${item.id})" class="flex-shrink-0 w-5 h-5 rounded border-2 ${item.checked ? 'bg-gray-900 border-gray-900' : 'border-gray-300 hover:border-gray-400'} flex items-center justify-center transition-colors">
                                        ${item.checked ? '<i data-lucide="check" class="w-3 h-3 text-white"></i>' : ''}
                                    </button>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center gap-2 mb-1">
                                            <span class="text-sm font-medium ${item.checked ? 'line-through text-gray-400' : 'text-gray-900'}">${item.name}</span>
                                            ${item.quantity ? `<span class="text-xs text-gray-500">${item.quantity}</span>` : ''}
                                        </div>
                                        ${item.category !== 'uncategorized' ? `
                                            <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${categoryColors[item.category]}">${categoryLabels[item.category]}</span>
                                        ` : ''}
                                    </div>
                                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button onclick="event.stopPropagation(); showEditItemModal(${list.id}, ${item.id})" class="p-1.5 text-gray-400 hover:text-gray-600 hover:bg-white rounded transition-colors">
                                            <i data-lucide="pencil" class="w-4 h-4"></i>
                                        </button>
                                        <button onclick="event.stopPropagation(); deleteItem(${list.id}, ${item.id})" class="p-1.5 text-gray-400 hover:text-red-600 hover:bg-white rounded transition-colors">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                        <div class="p-1.5 text-gray-300 cursor-move">
                                            <i data-lucide="grip-vertical" class="w-4 h-4"></i>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Event Listeners
        document.getElementById('newListModal').addEventListener('click', hideNewListModal);
        document.getElementById('addItemModal').addEventListener('click', hideAddItemModal);
        
        document.getElementById('newListTitle').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createList();
        });
        
        document.getElementById('itemName').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveItem();
        });

        // Initialize app
        init();
    </script>
</body>
</html>
