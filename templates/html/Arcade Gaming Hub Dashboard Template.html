<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
}
/* Custom scrollbar for iframe if needed, though mostly handled by embedded site */
::-webkit-scrollbar {
width: 8px;
height: 8px;
}
::-webkit-scrollbar-track {
background: transparent;
}
::-webkit-scrollbar-thumb {
background: #3f3f46;
border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
background: #52525b;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-zinc-950 text-zinc-300 h-screen w-screen overflow-hidden flex flex-col md:flex-row antialiased selection:bg-zinc-800 selection:text-white">

    <!-- Sidebar / Topbar -->
    <aside class="w-full md:w-64 flex-shrink-0 border-b md:border-b-0 md:border-r border-zinc-800/60 bg-zinc-950/80 backdrop-blur-md flex flex-col z-20">
        <!-- Logo Area -->
        <div class="h-14 flex items-center px-4 border-b border-zinc-800/60">
            <div class="flex items-center gap-2 text-zinc-100">
                <iconify-icon icon="solar:ghost-linear" style="stroke-width: 1.5;" class="text-lg"></iconify-icon>
                <span class="text-base font-semibold tracking-tight uppercase">Arcade</span>
            </div>
        </div>

        <!-- Navigation Options -->
        <nav class="flex-1 p-3 space-y-1 overflow-x-auto md:overflow-x-hidden md:overflow-y-auto flex md:flex-col items-center md:items-stretch gap-2 md:gap-0">
            <div class="text-xs font-medium text-zinc-500 uppercase tracking-widest px-2 mb-2 hidden md:block mt-2">Library</div>
            
            <!-- Option 1: Doge Miner -->
            <button onclick="loadGame('https://dogeminer.se', this)" class="nav-item group w-auto md:w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg bg-zinc-800/80 text-zinc-100 transition-all duration-200 text-left flex-shrink-0">
                <div class="w-6 h-6 flex items-center justify-center rounded-md bg-zinc-700/50 text-zinc-300 group-hover:text-zinc-100 transition-colors">
                    <iconify-icon icon="solar:gamepad-charge-linear" style="stroke-width: 1.5;" class="text-base"></iconify-icon>
                </div>
                <span class="font-medium">Doge Miner</span>
            </button>

            <!-- Option 2: Space Bar Clicker -->
            <button onclick="loadGame('https://play.js13kgames.com/spacebar-clicker/', this)" class="nav-item group w-auto md:w-full flex items-center gap-3 px-3 py-2 text-sm rounded-lg text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/40 transition-all duration-200 text-left flex-shrink-0">
                <div class="w-6 h-6 flex items-center justify-center rounded-md bg-zinc-800/0 group-hover:bg-zinc-700/50 text-zinc-500 group-hover:text-zinc-300 transition-colors">
                    <iconify-icon icon="solar:keyboard-linear" style="stroke-width: 1.5;" class="text-base"></iconify-icon>
                </div>
                <span class="font-medium">Space Bar Clicker</span>
            </button>
        </nav>

        <!-- User/Footer Area (Cosmetic) -->
        <div class="p-4 border-t border-zinc-800/60 hidden md:block">
            <div class="flex items-center gap-3 px-2 py-1.5 rounded-md hover:bg-zinc-800/40 transition-colors cursor-pointer text-sm text-zinc-400">
                <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-zinc-700 to-zinc-500"></div>
                <span class="truncate font-medium">Guest User</span>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-[calc(100vh-auto)] md:h-full relative bg-zinc-950">
        <!-- Top Toolbar -->
        <header class="h-14 flex-shrink-0 border-b border-zinc-800/60 flex items-center justify-between px-6 bg-zinc-950/80 backdrop-blur-md z-10">
            <div class="flex items-center gap-2 text-sm text-zinc-400">
                <span id="current-game-title" class="text-zinc-100 font-medium">Doge Miner</span>
                <span class="px-1.5 py-0.5 rounded bg-zinc-800/50 text-xs border border-zinc-700/50 text-zinc-500">Playing</span>
            </div>
            <div class="flex items-center gap-4">
                <button class="text-zinc-500 hover:text-zinc-300 transition-colors flex items-center justify-center" title="Fullscreen" onclick="toggleFullscreen()">
                    <iconify-icon icon="solar:maximize-linear" style="stroke-width: 1.5;" class="text-lg"></iconify-icon>
                </button>
            </div>
        </header>

        <!-- Embed Container -->
        <div class="flex-1 p-2 md:p-6 overflow-hidden flex flex-col relative group">
            <div class="absolute inset-0 bg-gradient-to-b from-zinc-900/20 to-transparent pointer-events-none"></div>
            
            <div id="frame-container" class="w-full h-full rounded-lg md:rounded-xl border border-zinc-800/80 bg-black overflow-hidden shadow-2xl relative ring-1 ring-white/5 transition-all duration-300">
                
                <!-- Loading State (Briefly visible during load) -->
                <div id="loading-overlay" class="absolute inset-0 bg-zinc-950 flex flex-col items-center justify-center z-10 transition-opacity duration-300 pointer-events-none">
                    <iconify-icon icon="solar:spinner-linear" class="text-2xl text-zinc-500 animate-spin mb-3"></iconify-icon>
                    <span class="text-xs text-zinc-500 font-medium uppercase tracking-widest">Connecting</span>
                </div>

                <iframe 
                    id="game-frame" 
                    src="https://dogeminer.se" 
                    class="w-full h-full border-none opacity-0 transition-opacity duration-500 ease-in-out" 
                    allow="autoplay; fullscreen" 
                    sandbox="allow-scripts allow-same-origin allow-popups allow-forms">
                </iframe>
            </div>
        </div>
    </main>

    <script>
        const iframe = document.getElementById('game-frame');
        const loader = document.getElementById('loading-overlay');
        const titleSpan = document.getElementById('current-game-title');
        const frameContainer = document.getElementById('frame-container');

        // Handle iframe load event to hide loader
        iframe.onload = function() {
            loader.style.opacity = '0';
            iframe.style.opacity = '1';
        };

        function loadGame(url, element) {
            // Show loader
            iframe.style.opacity = '0';
            loader.style.opacity = '1';
            
            // Extract title from span inside button
            const title = element.querySelector('span.font-medium').innerText;
            
            // Update source and title
            setTimeout(() => {
                iframe.src = url;
                titleSpan.innerText = title;
            }, 300); // slight delay for visual smoothness

            // Reset all nav items
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                // Remove active classes
                item.classList.remove('bg-zinc-800/80', 'text-zinc-100');
                item.classList.add('text-zinc-400', 'hover:text-zinc-200', 'hover:bg-zinc-800/40');
                
                // Reset icon background
                const iconBg = item.querySelector('div');
                iconBg.classList.remove('bg-zinc-700/50', 'text-zinc-300');
                iconBg.classList.add('bg-zinc-800/0', 'text-zinc-500');
            });

            // Set active classes on clicked element
            element.classList.remove('text-zinc-400', 'hover:text-zinc-200', 'hover:bg-zinc-800/40');
            element.classList.add('bg-zinc-800/80', 'text-zinc-100');
            
            const activeIconBg = element.querySelector('div');
            activeIconBg.classList.remove('bg-zinc-800/0', 'text-zinc-500');
            activeIconBg.classList.add('bg-zinc-700/50', 'text-zinc-300');
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (frameContainer.requestFullscreen) {
                    frameContainer.requestFullscreen();
                } else if (frameContainer.webkitRequestFullscreen) { /* Safari */
                    frameContainer.webkitRequestFullscreen();
                } else if (frameContainer.msRequestFullscreen) { /* IE11 */
                    frameContainer.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) { /* IE11 */
                    document.msExitFullscreen();
                }
            }
        }
        
        // Initial manual trigger for load state if needed
        setTimeout(() => {
             if(iframe.contentDocument && iframe.contentDocument.readyState === 'complete') {
                 loader.style.opacity = '0';
                 iframe.style.opacity = '1';
             }
        }, 1000);
    </script>
</body>
</html>
