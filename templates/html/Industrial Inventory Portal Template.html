<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAD SOAPS — Inventory</title>
<style>
:root{
--bg:#0d0d0d;--s1:#141414;--s2:#1c1c1c;--bdr:#2a2a2a;
--gold:#c9a84c;--gold2:#e8c96a;
--txt:#e8e8e8;--txt2:#888;--txt3:#555;
--red:#e05555;--red2:rgba(224,85,85,.12);
--green:#4caf7a;--green2:rgba(76,175,122,.12);
--yellow:#e0a030;--yellow2:rgba(224,160,48,.12);
--blue:#4a9ede;--r:10px;
--font:'Segoe UI',system-ui,sans-serif
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:14px;min-height:100vh}
/* ── LOGIN ────────────────────────────────────── */
#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999}
.lbox{background:var(--s1);border:1px solid var(--bdr);border-radius:20px;padding:44px 40px;width:340px;text-align:center}
.llogo{font-size:11px;letter-spacing:4px;color:var(--txt3);text-transform:uppercase;margin-bottom:6px}
.ltitle{font-size:28px;font-weight:800;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
.lsub{font-size:11px;color:var(--txt3);letter-spacing:2px;text-transform:uppercase;margin-bottom:32px}
.role-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:20px}
.rb{padding:10px 4px;background:var(--s2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt3);cursor:pointer;font-size:10px;font-weight:700;letter-spacing:.5px;text-align:center;transition:all .2s;user-select:none;line-height:1.3}
.rb.active{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold)}
.lbox input[type=password]{width:100%;background:var(--s2);border:1px solid var(--bdr);color:var(--txt);border-radius:10px;padding:13px 16px;font-size:14px;outline:none;margin-bottom:10px;text-align:center;letter-spacing:3px;font-family:var(--font)}
.lbox input:focus{border-color:var(--gold)}
.lbtn{width:100%;background:var(--gold);color:#000;border:none;border-radius:10px;padding:13px;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:1px}
.lbtn:hover{background:var(--gold2)}
.lerr{color:var(--red);font-size:12px;margin-top:10px;min-height:18px}
/* ── APP SHELL ────────────────────────────────── */
.header{background:var(--s1);border-bottom:1px solid var(--bdr);padding:0 24px;display:flex;align-items:center;gap:12px;height:58px;position:sticky;top:0;z-index:100}
.logo{font-size:15px;font-weight:800;color:var(--gold);letter-spacing:2px;white-space:nowrap}
.logo-sub{font-size:10px;color:var(--txt3);letter-spacing:2px;text-transform:uppercase;margin-left:4px;font-weight:400}
.rpill{padding:3px 12px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;white-space:nowrap}
.rpill-manager{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.3)}
.rpill-office{background:rgba(74,158,222,.1);color:var(--blue);border:1px solid rgba(74,158,222,.25)}
.rpill-field{background:rgba(76,175,122,.1);color:var(--green);border:1px solid rgba(76,175,122,.25)}
.sw{flex:1;max-width:320px;position:relative}
.sw input{width:100%;background:var(--s2);border:1px solid var(--bdr);border-radius:20px;padding:7px 14px 7px 32px;color:var(--txt);font-size:13px;outline:none}
.sw input:focus{border-color:var(--gold)}
.sw::before{content:'⌕';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--txt3)}
.hb{padding:6px 14px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.hbg{background:var(--gold);color:#000}.hbg:hover{background:var(--gold2)}
.hbo{background:transparent;color:var(--txt2);border:1px solid var(--bdr)}.hbo:hover{border-color:var(--gold);color:var(--gold)}
/* ── NAV ──────────────────────────────────────── */
.nav{background:var(--s1);border-bottom:1px solid var(--bdr);padding:0 24px;display:flex;overflow-x:auto;gap:2px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.ni{padding:13px 14px;font-size:11px;font-weight:700;color:var(--txt3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;letter-spacing:.5px;text-transform:uppercase;user-select:none;flex-shrink:0}
.ni:hover{color:var(--txt)}.ni.active{color:var(--gold);border-bottom-color:var(--gold)}
.nbadge{display:inline-block;background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:10px;padding:1px 5px;margin-left:4px;vertical-align:middle}
.ybadge{display:inline-block;background:var(--yellow);color:#000;font-size:9px;font-weight:700;border-radius:10px;padding:1px 5px;margin-left:4px;vertical-align:middle}
/* ── MAIN ─────────────────────────────────────── */
.main{padding:24px;max-width:1400px}
.view{display:none}.view.active{display:block}
/* ── STATS BAR ────────────────────────────────── */
.stats{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap}
.sc{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 20px;display:flex;flex-direction:column;gap:4px;min-width:120px}
.sc .lbl{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:1px}
.sc .val{font-size:24px;font-weight:800;line-height:1}
.vr{color:var(--red)}.vg{color:var(--green)}.vy{color:var(--yellow)}.vgold{color:var(--gold)}
/* ── SECTION HEADER ───────────────────────────── */
.sec-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;margin-top:8px}
.sec-hdr h3{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt2)}
.sec-hdr .sec-line{flex:1;height:1px;background:var(--bdr)}
.sec-hdr .sec-count{font-size:10px;color:var(--txt3);background:var(--s2);border:1px solid var(--bdr);border-radius:10px;padding:2px 8px}
/* ── REORDER GRID ─────────────────────────────── */
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-bottom:24px}
/* ── CARD ─────────────────────────────────────── */
.rc{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:border-color .15s}
.rc:hover{border-color:#3a3a3a}
.rc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.rc.crit::before{background:var(--red)}
.rc.low::before{background:var(--yellow)}
.rc.own::before{background:var(--gold)}
.c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.c-name{font-size:14px;font-weight:700;line-height:1.3;color:var(--txt)}
.c-tag{font-size:9px;font-weight:700;letter-spacing:.5px;padding:3px 8px;border-radius:10px;white-space:nowrap;flex-shrink:0}
.tag-crit{background:var(--red2);color:var(--red);border:1px solid rgba(224,85,85,.25)}
.tag-low{background:var(--yellow2);color:var(--yellow);border:1px solid rgba(224,160,48,.25)}
.tag-own{background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.2)}
.c-meta{font-size:11px;color:var(--txt3)}
.c-nums{display:flex;gap:12px;align-items:center}
.c-have{font-size:20px;font-weight:800;color:var(--txt)}
.c-have span{font-size:11px;font-weight:400;color:var(--txt3);margin-left:2px}
.c-need{font-size:12px;color:var(--txt3)}
.c-need strong{color:var(--red);font-size:14px}
.c-bar{height:4px;background:var(--s2);border-radius:2px;overflow:hidden}
.c-fill{height:100%;border-radius:2px;transition:width .3s}
.fill-crit{background:var(--red)}.fill-low{background:var(--yellow)}.fill-own{background:var(--gold)}
.c-actions{display:flex;gap:7px;align-items:center}
.qadj{display:flex;align-items:center;gap:0;background:var(--s2);border:1px solid var(--bdr);border-radius:7px;overflow:hidden}
.adjb{background:none;border:none;color:var(--txt2);cursor:pointer;font-size:16px;line-height:1;padding:5px 10px;font-weight:700;transition:.1s}
.adjb:hover{background:var(--bdr);color:var(--gold)}
.adjv{font-weight:700;min-width:28px;text-align:center;font-size:13px;padding:5px 2px}
.ordb{flex:1;padding:7px 12px;border-radius:7px;border:none;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.3px;transition:.15s;white-space:nowrap}
.btn-order{background:rgba(224,85,85,.15);color:var(--red);border:1px solid rgba(224,85,85,.3)}.btn-order:hover{background:rgba(224,85,85,.25)}
.btn-notify{background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.25)}.btn-notify:hover{background:rgba(201,168,76,.2)}
.btn-done{background:var(--green2);color:var(--green);border:1px solid rgba(76,175,122,.25);font-size:10px}
.c-lc{font-size:10px;color:var(--txt3)}
/* ── TABLE ────────────────────────────────────── */
.tw{background:var(--s1);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden}
.tbar{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bdr);flex-wrap:wrap}
.tbar h3{font-size:14px;font-weight:700}
.cnt{font-size:12px;color:var(--txt3)}
.fsel{background:var(--s2);border:1px solid var(--bdr);color:var(--txt2);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer;outline:none}
.fsel:focus{border-color:var(--gold)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{background:var(--s2);color:var(--txt3);font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:9px 14px;text-align:left;font-weight:700;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--txt)}
thead th.sa::after{content:' ↑';color:var(--gold)}
thead th.sd::after{content:' ↓';color:var(--gold)}
td{padding:9px 14px;border-top:1px solid var(--bdr);vertical-align:middle;font-size:13px}
tr:hover td{background:rgba(255,255,255,.015)}
.qc{display:flex;align-items:center;gap:5px}
.qv{font-weight:700;min-width:28px}
.qi{background:var(--s2);border:1px solid var(--bdr);color:var(--txt);border-radius:5px;padding:3px 7px;width:60px;font-size:13px;display:none}
.qi:focus{outline:none;border-color:var(--gold)}
.eb{background:none;border:none;cursor:pointer;color:var(--txt3);font-size:11px;padding:2px 5px;border-radius:3px}
.eb:hover{color:var(--gold)}
.sv{background:var(--green);border:none;cursor:pointer;color:#fff;font-size:11px;padding:3px 8px;border-radius:5px;display:none;font-weight:700}
.cv{background:var(--s2);border:1px solid var(--bdr);cursor:pointer;color:var(--txt3);font-size:11px;padding:3px 7px;border-radius:5px;display:none}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700}
.bok{background:var(--green2);color:var(--green)}.blow{background:rgba(224,160,48,.1);color:var(--yellow)}.bcrit{background:var(--red2);color:var(--red)}
.bzone{background:rgba(74,158,222,.08);color:var(--blue)}.bcat{background:rgba(201,168,76,.06);color:var(--gold)}
/* ── LOG ──────────────────────────────────────── */
.le{padding:11px 18px;border-bottom:1px solid var(--bdr);display:flex;gap:12px;font-size:12px;align-items:center;flex-wrap:wrap}
.lt{color:var(--txt3);white-space:nowrap;min-width:140px;font-size:11px}
.lu{color:var(--gold);margin-left:auto;font-size:10px;font-weight:700;text-transform:uppercase}
.lempty{padding:48px;text-align:center;color:var(--txt3)}
/* ── MODAL ────────────────────────────────────── */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;align-items:center;justify-content:center}
.mo.open{display:flex}
.mb{background:var(--s1);border:1px solid var(--bdr);border-radius:14px;padding:26px;width:90%;max-width:460px;max-height:85vh;overflow-y:auto}
.mb h3{font-size:15px;font-weight:700;color:var(--gold);margin-bottom:20px}
.mr{margin-bottom:14px}
.mr label{display:block;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.mr input,.mr select{width:100%;background:var(--s2);border:1px solid var(--bdr);color:var(--txt);border-radius:7px;padding:9px 12px;font-size:13px;outline:none}
.mr input:focus,.mr select:focus{border-color:var(--gold)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mac{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.empty{text-align:center;padding:56px;color:var(--txt3)}
.empty-ico{font-size:32px;margin-bottom:10px}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
@media(max-width:640px){.main{padding:14px}.stats{gap:6px}.sc{min-width:100px;padding:12px 14px}}
</style>

</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="lbox">
    <div class="llogo">Marine &amp; Auto Detailing</div>
    <div class="ltitle">MAD SOAPS</div>
    <div class="lsub">Inventory Portal</div>
    <div class="role-row">
      <div class="rb active" data-role="manager">Manager</div>
      <div class="rb" data-role="office-admin">Office<br>Admin</div>
      <div class="rb" data-role="field-director">Field<br>Director</div>
    </div>
    <input type="password" id="pwIn" placeholder="Password">
    <button class="lbtn" id="loginBtn">ENTER</button>
    <div class="lerr" id="lerr"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="header">
    <div class="logo">MAD SOAPS <span class="logo-sub">Inventory</span></div>
    <div class="rpill" id="rpill"></div>
    <div class="sw" style="margin-left:8px"><input type="text" id="gsearch" placeholder="Search inventory..."></div>
    <div style="display:flex;gap:8px;margin-left:auto">
      <button class="hb hbo" id="addBtn" style="display:none">+ Add</button>
      <button class="hb hbo" id="exportBtn">Export</button>
      <button class="hb hbo" id="logoutBtn">Sign Out</button>
    </div>
  </div>
  <div class="nav" id="navBar"></div>
  <div class="main" id="mainArea"></div>
</div>

<!-- ADD MODAL -->
<div class="mo" id="addModal">
  <div class="mb">
    <h3>+ Add New Item</h3>
    <div class="mr"><label>Item Name</label><input id="nName" placeholder="Item name"></div>
    <div class="mr"><label>Category / Section</label>
      <select id="nSection">
        <option>Chemicals</option><option>Compounds</option><option>Equipment</option>
        <option>Machines</option><option>Pads</option><option>Consumables</option><option>Administration</option>
      </select>
    </div>
    <div class="mr"><label>Brand</label><input id="nBrand" placeholder="Brand or N/A"></div>
    <div class="twocol">
      <div class="mr"><label>Qty on Hand</label><input id="nQty" type="number" min="0" placeholder="0"></div>
      <div class="mr"><label>Min Stock</label><input id="nMin" type="number" min="0" placeholder="0"></div>
    </div>
    <div class="mr"><label>Supplier</label><input id="nSupp" placeholder="Supplier name"></div>
    <div class="mr"><label>Location</label><input id="nLoc" placeholder="Shelf, bin, rack..."></div>
    <div class="mr"><label>Order Link</label><input id="nLink" placeholder="https://..."></div>
    <div class="mac">
      <button class="hb hbo" id="cancelAddBtn">Cancel</button>
      <button class="hb hbg" id="confirmAddBtn">Add Item</button>
    </div>
  </div>
</div>

<!-- SEARCH MODAL -->
<div class="mo" id="srchModal">
  <div class="mb" style="max-width:600px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h3 style="margin:0">Search Results</h3>
      <button class="hb hbo" id="closeSrchBtn">✕</button>
    </div>
    <div id="srchOut"></div>
