<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mini app monday</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .fade-in { animation: fadeIn 0.18s ease; }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-gray-900 via-black to-gray-800 min-h-screen flex items-center justify-center">
  <!-- Mobile Device Mockup -->
  <div class="relative w-[370px] h-[770px] rounded-[40px] shadow-2xl border-2 border-gray-800 bg-black flex flex-col overflow-hidden">
    <!-- Notch -->
    <div class="absolute left-1/2 -translate-x-1/2 top-2 w-24 h-2 rounded-xl bg-gray-700 opacity-60 z-10"></div>

    <!-- Top Bar -->
    <div class="flex items-center justify-between px-4 pt-5 pb-3 bg-gradient-to-r from-gray-900 to-gray-800 shadow">
      <div class="flex items-center gap-2">
        <button class="text-gray-300 bg-gray-700 bg-opacity-40 rounded-full p-1 hover:bg-opacity-60">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="w-5 h-5"><path d="M15 18l-6-6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="text-white text-lg font-semibold tracking-tight">mini app monday</span>
      </div>
      <div>
        <img src="https://i.imgur.com/6VBx3io.png" alt="Luciano" class="w-8 h-8 rounded-full ring-2 ring-gray-900 border border-gray-700 shadow">
      </div>
    </div>

    <!-- Main content area -->
    <main class="flex-1 px-3 pb-28 pt-2 overflow-y-auto relative">
      <!-- Thread / Intro -->
      <div class="bg-gray-900 rounded-2xl shadow mb-4 px-4 py-3 border border-gray-800">
        <div class="flex items-center gap-3 mb-2">
          <img src="https://i.imgur.com/6VBx3io.png" alt="Luciano" class="w-8 h-8 rounded-full border border-gray-700">
          <div>
            <span class="font-semibold text-gray-200 text-sm">Luciano</span>
            <div class="text-xs text-gray-500">@luciano</div>
          </div>
        </div>
        <p class="text-sm text-gray-300 leading-[1.45]">
          ✨ Welcome to <span class="font-semibold text-purple-400">mini app monday</span>! Discover two awesome Farcaster Mini Apps this week: tap a card for details and try them out!
        </p>
      </div>

      <!-- Mini Apps Feed -->
      <div class="flex flex-col gap-4">
        <!-- Card 1: Farfaucet -->
        <button onclick="openModal(0)" class="text-left bg-gray-900 rounded-2xl shadow border border-gray-800 px-4 py-3 transition hover:ring-2 hover:ring-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 w-full relative group">
          <span class="absolute inset-0"></span>
          <div class="flex items-center gap-3">
            <img src="https://pbs.twimg.com/profile_images/1759655992154720256/rx3B_1VR_400x400.jpg" alt="Farfaucet" class="w-10 h-10 rounded-lg border border-gray-700 bg-black">
            <div class="flex-1">
              <div class="font-semibold text-gray-100 text-base group-hover:text-purple-400">Farfaucet</div>
              <div class="flex flex-wrap gap-2 mt-1">
                <span class="bg-purple-900 text-purple-300 text-xs px-2 py-0.5 rounded">#Utility</span>
                <span class="bg-gray-800 text-gray-400 text-xs px-2 py-0.5 rounded">hot</span>
              </div>
            </div>
          </div>
          <p class="text-gray-300 text-sm mt-2">
            🚰 Instantly claim free testnet tokens on Farcaster. One tap, no hassle.
          </p>
        </button>
        <!-- Card 2: DegenStats -->
        <button onclick="openModal(1)" class="text-left bg-gray-900 rounded-2xl shadow border border-gray-800 px-4 py-3 transition hover:ring-2 hover:ring-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 w-full relative group">
          <span class="absolute inset-0"></span>
          <div class="flex items-center gap-3">
            <img src="https://pbs.twimg.com/profile_images/1728514314305255424/0wqQXy0H_400x400.jpg" alt="DegenStats" class="w-10 h-10 rounded-lg border border-gray-700 bg-black">
            <div class="flex-1">
              <div class="font-semibold text-gray-100 text-base group-hover:text-purple-400">DegenStats</div>
              <div class="flex flex-wrap gap-2 mt-1">
                <span class="bg-purple-900 text-purple-300 text-xs px-2 py-0.5 rounded">#Analytics</span>
                <span class="bg-gray-800 text-gray-400 text-xs px-2 py-0.5 rounded">new</span>
              </div>
            </div>
          </div>
          <p class="text-gray-300 text-sm mt-2">
            📈 Track your $DEGEN performance, wallet leaderboards, and community analytics.
          </p>
        </button>
      </div>
    </main>
    
    <!-- Comment/Action Bar - now INSIDE the device mockup -->
    <div class="absolute left-0 bottom-0 w-full px-3 pb-5 pt-2 bg-gradient-to-t from-black via-black/80 to-transparent">
      <div class="flex items-center bg-gray-900 border border-gray-800 rounded-full shadow px-3 py-2 gap-2">
        <img src="https://i.imgur.com/6VBx3io.png" alt="Luciano" class="w-8 h-8 rounded-full border border-gray-700">
        <input 
          class="flex-1 bg-transparent outline-none text-sm placeholder:text-gray-500 text-gray-200 px-1"
          placeholder="Share your thoughts..." 
        />
        <button class="bg-purple-700 hover:bg-purple-800 text-white rounded-full px-4 py-1.5 text-sm font-semibold shadow">
          Post
        </button>
      </div>
    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="hidden fade-in absolute inset-0 z-40 flex items-center justify-center bg-black/60">
      <div id="modal-card" class="bg-gray-900 rounded-2xl border border-gray-800 shadow-xl w-[90%] max-w-sm p-6 relative">
        <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-200 rounded-full p-1">
          <svg width="20" height="20" fill="none" stroke="currentColor"><path d="M6 6l8 8M6 14L14 6" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <!-- Modal content injected here -->
        <div id="modal-content"></div>
      </div>
    </div>
  </div>
  <script>
    const apps = [
      {
        name: "Farfaucet",
        url: "https://farfaucet.xyz/",
        img: "https://pbs.twimg.com/profile_images/1759655992154720256/rx3B_1VR_400x400.jpg",
        tags: ['#Utility', 'hot'],
        tagStyles: ['bg-purple-900 text-purple-300', 'bg-gray-800 text-gray-400'],
        desc: "🚰 Instantly claim free testnet tokens on Farcaster. One tap, no hassle.",
        details: "Farfaucet makes it easy to get testnet tokens for development or demoing on Farcaster. Fast, free, and easy to use.",
        tagLabels: ['#Utility', 'hot']
      },
      {
        name: "DegenStats",
        url: "https://degenstats.xyz/",
        img: "https://pbs.twimg.com/profile_images/1728514314305255424/0wqQXy0H_400x400.jpg",
        tags: ['#Analytics', 'new'],
        tagStyles: ['bg-purple-900 text-purple-300', 'bg-gray-800 text-gray-400'],
        desc: "📈 Track your $DEGEN performance, wallet leaderboards, and community analytics.",
        details: "DegenStats offers in-depth analytics for $DEGEN holders, including wallet rankings, performance charts, and community stats.",
        tagLabels: ['#Analytics', 'new']
      }
    ];

    function openModal(index) {
      const app = apps[index];
      document.getElementById('modal-content').innerHTML = `
        <div class="flex items-center gap-4 mb-3">
          <img src="${app.img}" class="w-12 h-12 rounded-xl border border-gray-700 bg-black" alt="${app.name}">
          <div>
            <div class="font-semibold text-gray-100 text-lg">${app.name}</div>
            <div class="flex gap-2 mt-1">
              ${app.tagLabels.map((tag, i) =>
                `<span class="${app.tagStyles[i]} text-xs px-2 py-0.5 rounded">${tag}</span>`
              ).join('')}
            </div>
          </div>
        </div>
        <p class="text-gray-300 text-sm mb-4">${app.details}</p>
        <a href="${app.url}" target="_blank" class="block w-full text-center bg-purple-700 hover:bg-purple-800 text-white font-semibold rounded-full py-2 text-base shadow transition">
          🚀 Launch ${app.name}
        </a>
      `;
      document.getElementById('modal-overlay').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
      document.body.style.overflow = '';
    }
    // Close modal on Escape key
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });
    // Prevent scroll on modal open
    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target.id === 'modal-overlay') closeModal();
    });
  </script>
</body>
</html>
