<meta charset="UTF-8">

<title>My Pets – Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@keyframes bounce {
0%, 20%, 53%, 80%, 100% {
transform: translateY(0);
}
40%, 43% {
transform: translateY(-10px);
}
70% {
transform: translateY(-5px);
}
90% {
transform: translateY(-2px);
}
}
.animate-bounce {
animation: bounce 2s infinite;
}
@keyframes spin {
from {
transform: rotate(0deg);
}
to {
transform: rotate(360deg);
}
}
.gear-icon {
transition: transform 0.3s ease;
}
.gear-icon:hover {
animation: spin 3s linear infinite;
}
</style></head>

<body class="min-h-screen flex items-center justify-center selection:bg-orange-200 text-[#1b1b1b] bg-[#fff9f4]">

  <!-- Phone Shell -->
  <div class="relative w-[390px] max-w-full h-[844px] bg-gradient-to-b from-[#fff4e8] to-[#ffe6d1] shadow-xl rounded-[40px] overflow-hidden border-4 border-[#ffd7b5] flex flex-col mx-auto">

    <!-- Dynamic Notch -->
    <div class="absolute left-1/2 -top-1.5 -translate-x-1/2 z-10 flex items-center justify-center" style="height:44px;">
      <div class="w-24 h-4 rounded-b-3xl mt-2 bg-black/10"></div>
    </div>

    <!-- Content Wrapper -->
    <div class="flex-1 flex flex-col">

      <!-- Status Bar -->
      <div class="flex justify-between items-center px-3 py-1 text-xs mt-2">
        <span id="clock" class="font-medium">12:10</span>
        <div class="flex space-x-1 opacity-80">

          <i data-lucide="wifi" class="w-4 h-4"></i>

        <h1 class="text-3xl font-semibold tracking-tight">My Pets</h1>
        <button class="h-10 w-10 flex items-center justify-center rounded-full bg-[#ffe8d8] hover:bg-[#ffd9c0] transition-colors" aria-label="Settings">
          <i data-lucide="settings" class="w-5 h-5 text-orange-500 gear-icon"></i>
        </button>
      </header>

      <!-- Main -->
      <main class="px-6 pb-24 flex-1 overflow-y-auto space-y-8">

        <!-- Fun Fact Banner -->
        <div class="w-full rounded-2xl p-0.5 bg-gradient-to-r from-orange-400 to-amber-500">

            <div class="h-12 w-12 flex items-center justify-center rounded-full bg-gradient-to-br from-orange-400 to-amber-500">
              <i data-lucide="sparkles" class="w-6 h-6 text-white"></i>
            </div>
            <div class="flex flex-col text-start">
              <span class="text-lg font-semibold text-gray-900 tracking-tight">Fun Fact!</span>
              <span class="text-sm text-gray-600">Your pets have been fed 47 times this month</span>
            </div>
          </div>
        </div>

        <!-- Pets Grid -->
        <section class="space-y-4">
          <h2 class="text-lg font-semibold tracking-tight">Your Pets</h2>
          <div class="grid grid-cols-2 gap-4">
            
            <!-- Pet Card - Luna -->
            <button onclick="alert('Luna selected!')" class="group flex flex-col items-center p-4 rounded-2xl bg-white/60 hover:bg-white/80 transition-all hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-orange-400">
              <div class="w-16 h-16 rounded-full bg-gradient-to-br from-gray-300 to-gray-500 mb-3 overflow-hidden border-2 border-white shadow-sm">
                <div class="w-full h-full bg-gradient-to-br from-slate-400 to-slate-600 flex items-center justify-center">
                  <i data-lucide="cat" class="w-8 h-8 text-white"></i>
                </div>
              </div>
              <span class="text-sm font-medium text-gray-900">Luna</span>
            </button>

            <!-- Pet Card - Max -->
            <button onclick="alert('Max selected!')" class="group flex flex-col items-center p-4 rounded-2xl bg-white/60 hover:bg-white/80 transition-all hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-orange-400">
              <div class="w-16 h-16 rounded-full bg-gradient-to-br from-amber-300 to-amber-600 mb-3 overflow-hidden border-2 border-white shadow-sm">
                <div class="w-full h-full bg-gradient-to-br from-amber-400 to-amber-700 flex items-center justify-center">
                  <i data-lucide="dog" class="w-8 h-8 text-white"></i>
                </div>
              </div>
              <span class="text-sm font-medium text-gray-900">Max</span>
            </button>

            <!-- Pet Card - Bella -->

                  <i data-lucide="rabbit" class="w-8 h-8 text-white"></i>
                </div>
              </div>
              <span class="text-sm font-medium text-gray-900">Bella</span>
            </button>

            <!-- Pet Card - Charlie -->
            <button onclick="alert('Charlie selected!')" class="group flex flex-col items-center p-4 rounded-2xl bg-white/60 hover:bg-white/80 transition-all hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-orange-400">
              <div class="w-16 h-16 rounded-full bg-gradient-to-br from-green-300 to-green-500 mb-3 overflow-hidden border-2 border-white shadow-sm">
                <div class="w-full h-full bg-gradient-to-br from-green-400 to-green-600 flex items-center justify-center">
                  <i data-lucide="bird" class="w-8 h-8 text-white"></i>
                </div>
              </div>
              <span class="text-sm font-medium text-gray-900">Charlie</span>
            </button>

            <!-- Pet Card - Milo -->
            <button onclick="alert('Milo selected!')" class="group flex flex-col items-center p-4 rounded-2xl bg-white/60 hover:bg-white/80 transition-all hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-orange-400">
              <div class="w-16 h-16 rounded-full bg-gradient-to-br from-orange-300 to-orange-500 mb-3 overflow-hidden border-2 border-white shadow-sm">
                <div class="w-full h-full bg-gradient-to-br from-orange-400 to-orange-600 flex items-center justify-center">
                  <i data-lucide="fish" class="w-8 h-8 text-white"></i>
                </div>
              </div>
              <span class="text-sm font-medium text-gray-900">Milo</span>
            </button>

            <!-- Add Pet Card -->
            <button onclick="alert('Add new pet!')" class="group flex flex-col items-center p-4 rounded-2xl bg-white/40 hover:bg-white/60 transition-all hover:scale-[1.02] focus:outline-none focus:ring-2 focus:ring-orange-400 border-2 border-dashed border-gray-300">
              <div class="w-16 h-16 rounded-full bg-gradient-to-br from-gray-100 to-gray-200 mb-3 flex items-center justify-center border-2 border-dashed border-gray-300">
                <i data-lucide="plus" class="w-8 h-8 text-gray-400 group-hover:text-gray-600 transition-colors"></i>
              </div>
              <span class="text-sm font-medium text-gray-500 group-hover:text-gray-700 transition-colors">Add Pet</span>
            </button>

          </div>
        </section>

      </main>
    </div>

    <!-- Bottom Navigation -->
    <nav class="absolute bottom-0 inset-x-0 rounded-t-3xl py-4 px-6 backdrop-blur bg-white/90">
      <div class="flex justify-around items-center">
        <button class="flex flex-col items-center opacity-100">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span class="text-xs mt-1">Home</span>

        <button class="flex flex-col items-center opacity-60">

  <!-- Scripts -->
  <script>
    // Live clock
    const updateClock = () => {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    };
    setInterval(updateClock, 1000); updateClock();

    // Render lucide icons
    lucide.createIcons();
  </script>

</body></html>
