  <head><script id="aura-preview-performance-controller">
(function() {
if (window.__auraPreviewPerformanceController) return;
const nativeRequestAnimationFrame = window.requestAnimationFrame
? window.requestAnimationFrame.bind(window)
: function(callback) { return window.setTimeout(function() { callback(Date.now()); }, 16); };
const nativeCancelAnimationFrame = window.cancelAnimationFrame
? window.cancelAnimationFrame.bind(window)
: window.clearTimeout.bind(window);
const nativeSetInterval = window.setInterval.bind(window);
let paused = false;
let nextFrameId = 1;
const frameRecords = new Map();
const pausedFrameCallbacks = new Map();
const style = document.createElement('style');
style.id = 'aura-preview-performance-style';
style.textContent = [
'html[data-aura-preview-paused="true"] *,',
'html[data-aura-preview-paused="true"] *::before,',
'html[data-aura-preview-paused="true"] *::after {',
'  animation-play-state: paused !important;',
'  transition-duration: 0s !important;',
'  scroll-behavior: auto !important;',
'}'
].join('\n');
document.head.appendChild(style);
window.requestAnimationFrame = function(callback) {
const frameId = nextFrameId++;
if (paused) {
pausedFrameCallbacks.set(frameId, callback);
frameRecords.set(frameId, { paused: true });
return frameId;
}
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });

};
window.cancelAnimationFrame = function(frameId) {
const record = frameRecords.get(frameId);
pausedFrameCallbacks.delete(frameId);
if (record && typeof record.nativeFrameId !== 'undefined') {
nativeCancelAnimationFrame(record.nativeFrameId);
}
frameRecords.delete(frameId);
};
window.setInterval = function(callback, delay) {
const args = Array.prototype.slice.call(arguments, 2);
return nativeSetInterval(function() {
if (paused) return;
callback.apply(this, args);
}, delay);
};
const flushPausedFrames = function() {
const callbacks = Array.from(pausedFrameCallbacks.entries());
pausedFrameCallbacks.clear();
callbacks.forEach(function(entry) {
const frameId = entry[0];
const callback = entry[1];
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });
});
};
const setPaused = function(nextPaused) {
const shouldPause = Boolean(nextPaused);
if (paused === shouldPause) return;
paused = shouldPause;
document.documentElement.toggleAttribute('data-aura-preview-paused', paused);
if (!paused) {
flushPausedFrames();
}
};

setPaused: setPaused,

return paused;
}
};
window.addEventListener('message', function(event) {
if (event.source !== window.parent) return;
if (!event.data || event.data.type !== 'aura-preview-performance-mode') return;
setPaused(event.data.paused);
});

<style>
/* CSS Base y Tokens de Diseño */
@theme {
--font-sans: 'Inter', sans-serif;
--color-background: #FFFFFF;
--color-foreground: #111111;
--color-muted: #666666;
--color-border: #EAEAEA;
--color-accent: #F5F5F5;
}
/* Utilidades Masonry para el layout tipo Pinterest */
.masonry-grid {
column-count: 2;
column-gap: 1.5rem;
width: 100%;
}
@media (min-width: 640px) { .masonry-grid { column-count: 3; } }
@media (min-width: 1024px) { .masonry-grid { column-count: 4; } }
@media (min-width: 1280px) { .masonry-grid { column-count: 5; } }
.masonry-item {
break-inside: avoid;
margin-bottom: 1.5rem;
transform-origin: center top;
will-change: transform, opacity;
}
/* Renderizado Pixelado puro para imágenes/canvas */
.pixelated {
image-rendering: pixelated;
image-rendering: -moz-crisp-edges;
image-rendering: crisp-edges;
}
/* Ocultar scrollbar pero permitir scroll */
::-webkit-scrollbar {
width: 0px;
background: transparent;
}
/* Contenedor del Hero Animation */
#hero-canvas {
perspective: 1000px;
transform-style: preserve-3d;
}
.pixel-block {
position: absolute;
will-change: transform, opacity;
box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
}
/* Custom Checkbox Toggles */
.filter-toggle input:checked + div {
background-color: #111111;
color: #FFFFFF;
border-color: #111111;
}
</style>

    <!-- Script de Animación (Anime.js v4 según requerimientos) -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
          const grid = document.getElementById('gallery-grid');
          const itemsCount = 25;
          const heights = [240, 320, 400, 280, 450, 200];
          const colors = ['#FF595E', '#FFCA3A', '#8AC926', '#1982C4', '#6A4C93', '#111111', '#EAEAEA'];

          for (let i = 0; i < itemsCount; i++) {
              const height = heights[Math.floor(Math.random() * heights.length)];
              const mainColor = colors[Math.floor(Math.random() * colors.length)];
              const isDark = mainColor === '#111111' || mainColor === '#6A4C93' || mainColor === '#1982C4';

              let pixelsHTML = '';
              const gridSize = 8;
              for(let p = 0; p < gridSize * gridSize; p++) {
                  const opacity = Math.random() > 0.6 ? 1 : (Math.random() > 0.3 ? 0.5 : 0);
                  pixelsHTML += '<div style="background-color: ' + (isDark ? '#FFF' : '#111') + '; opacity: ' + opacity + '; width: 100%; height: 100%;"></div>';
              }

              const item = document.createElement('div');
              item.className = 'masonry-item relative group rounded-md overflow-hidden border border-[#EAEAEA] bg-[#F5F5F5] cursor-pointer animate-[fadeInUp_0.8s_ease-out_forwards]';
              item.style.opacity = '0';
              item.style.animationDelay = ((i % 10) * 100) + 'ms';
              item.innerHTML = '<div class="w-full relative flex items-center justify-center overflow-hidden transition-transform duration-500 ease-out group-hover:scale-[1.03]" style="height: ' + height + 'px; background-color: ' + mainColor + '"><div class="w-24 h-24 grid grid-cols-8 grid-rows-8 gap-0 mix-blend-overlay opacity-30">' + pixelsHTML + '</div></div><div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-between p-4 pointer-events-none"><div class="flex justify-end"><button class="bg-white text-[#111111] text-xs font-medium px-3 py-1.5 rounded-full pointer-events-auto hover:bg-[#F5F5F5] transition-colors flex items-center gap-1 shadow-sm"><iconify-icon icon="solar:bookmark-linear" width="14"></iconify-icon> Guardar</button></div><div class="flex items-center justify-between pointer-events-auto"><div class="flex items-center gap-2"><div class="w-6 h-6 rounded-full bg-white flex items-center justify-center text-[10px] font-medium text-[#111111]">' + String.fromCharCode(65 + Math.floor(Math.random() * 26)) + '</div><span class="text-xs font-medium text-white">Artis_' + i + '</span></div><button class="w-6 h-6 rounded-full bg-white/20 text-white flex items-center justify-center backdrop-blur-sm hover:bg-white/40 transition-colors"><iconify-icon icon="solar:arrow-right-up-linear" width="12"></iconify-icon></button></div></div>';
              grid.appendChild(item);
          }

          const heroCanvas = document.getElementById('hero-canvas');
          const numPixels = 80;

          for(let i=0; i < numPixels; i++) {
              const p = document.createElement('div');
              const size = Math.random() > 0.8 ? 16 : 8;
              p.className = 'pixel-block rounded-sm animate-[fadeIn_1.5s_ease-out_forwards]';
              p.style.width = size + 'px';
              p.style.height = size + 'px';
              p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

              const endX = (Math.random() - 0.5) * 400;
              const endY = (Math.random() - 0.5) * 300;

              p.style.transform = 'translate3d(' + endX + 'px, ' + endY + 'px, 0px) rotate(' + (Math.random() * 360) + 'deg)';
              p.style.opacity = '0';
              p.style.animationDelay = (Math.random() * 1000) + 'ms';

              heroCanvas.appendChild(p);
          }
      });

      const style = document.createElement('style');
      style.textContent = '@keyframes scrolldown { 0% { transform: translateY(-100%); } 50% { transform: translateY(0); } 100% { transform: translateY(100%); } } @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } } @keyframes fadeIn { 0% { opacity: 0; transform: scale(0); } 100% { opacity: 0.5; transform: scale(1); } }';
      document.head.appendChild(style);
    </script>
