  <body class="">
    <header

    >
      <div class="flex items-center gap-4">
        <div
          class="w-9 h-9 rounded-xl bg-white text-black flex items-center justify-center shadow-sm"
        >
          <i data-lucide="audio-lines" class="w-5 h-5"></i>
        </div>
        <div class="">
          <h1 class="text-[15px] font-semibold tracking-tight text-zinc-100">
            Speech to Text
          </h1>
          <p class="text-[12px] text-zinc-500 font-medium mt-0.5">
            Studio-grade transcription
          </p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button
          class="flex items-center gap-2 px-3 py-1.5 text-[13px] font-medium text-zinc-400 hover:text-zinc-100 hover:bg-white/5 rounded-lg transition-all border border-transparent hover:border-white/10"
        >
          <i data-lucide="copy" class="w-4 h-4"></i>

        </button>

        >
          <i data-lucide="download" class="w-4 h-4"></i>
          Download
        </button>

            >

            </h3>
            <p
              class="text-[13px] sm:text-[14px] text-zinc-500 text-center max-w-sm leading-relaxed"
            >
              Drag and drop your files here, or click to browse. Supports MP3,
              WAV, M4A, and MP4.
            </p>
          </div>
        </div>
      </div>

      <div
        class="absolute bottom-10 left-1/2 -translate-x-1/2 w-full max-w-[560px] px-6 z-50"
      >
        <div

        >
          <!-- Left Section -->
          <div class="flex-1 flex items-center gap-3 sm:gap-5 pl-3 sm:pl-5">

                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"

                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>

              class="bg-white text-black w-12 h-12 sm:w-14 sm:h-14 rounded-full shadow-[0_4px_20px_rgba(255,255,255,0.2)] hover:bg-zinc-100 hover:scale-105 hover:shadow-[0_4px_24px_rgba(255,255,255,0.3)] transition-all duration-300 flex items-center justify-center relative z-10 group"
            >

                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"

                stroke-width="2"

              class="text-zinc-400 hover:text-white transition-colors"

                xmlns="http://www.w3.org/2000/svg"

                fill="none"
                stroke="currentColor"
                stroke-width="2"

                stroke-linejoin="round"
