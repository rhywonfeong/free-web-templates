<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Inventory</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.no-scrollbar::-webkit-scrollbar {
display: none;
}
.no-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-[#E5E5E5] flex items-center justify-center min-h-screen antialiased text-gray-900" style="font-family: 'Plus Jakarta Sans', sans-serif;">

    <!-- Mobile Device Container -->
    <div class="w-full max-w-[375px] h-[812px] bg-[#F9F9FB] relative shadow-[0_20px_40px_-15px_rgba(0,0,0,0.1)] sm:rounded-[2.5rem] overflow-hidden flex flex-col ring-1 ring-gray-200/50">
        
        <!-- Header & Search -->
        <header class="pt-14 pb-4 px-6 bg-[#F9F9FB]/80 backdrop-blur-xl sticky top-0 z-30">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-medium tracking-tight text-gray-900">Hub Inventory</h1>
                <div class="w-9 h-9 rounded-full bg-white shadow-sm ring-1 ring-black/[0.04] flex items-center justify-center cursor-pointer hover:bg-gray-50 transition-colors">
                    <iconify-icon icon="solar:bell-linear" class="text-gray-600" width="20"></iconify-icon>
                </div>
            </div>
            
            <div class="relative group">
                <iconify-icon icon="solar:magnifer-linear" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-lg group-focus-within:text-gray-900 transition-colors"></iconify-icon>
                <input type="text" placeholder="Search cargo ID..." class="w-full bg-white ring-1 ring-black/[0.04] rounded-2xl py-3.5 pl-10 pr-4 text-sm font-medium text-gray-900 placeholder:text-gray-400 placeholder:font-normal focus:outline-none focus:ring-1 focus:ring-gray-900 focus:shadow-sm transition-all shadow-[0_2px_8px_-4px_rgba(0,0,0,0.02)]">
            </div>
        </header>

        <!-- Main Content -->
        <main class="px-6 pt-2 pb-28 flex-1 overflow-y-auto no-scrollbar">
            
            <div class="flex items-center justify-between mb-4 mt-2">
                <h2 class="text-sm font-medium text-gray-500">Active Shipments</h2>
                <button class="text-xs font-medium text-gray-900 hover:text-gray-600 transition-colors">See all</button>
            </div>

            <div class="grid grid-cols-2 gap-3.5">
                
                <!-- Premium Dark Card (Primary Action/Active) -->
                <div class="col-span-2 bg-[#0A0A0A] rounded-[1.5rem] p-5 shadow-lg cursor-pointer hover:bg-[#111] transition-all duration-300 relative overflow-hidden flex flex-col justify-between min-h-[160px] ring-1 ring-white/10">
                    
                    <div class="flex justify-between items-start relative z-10 mb-6">
                        <div class="flex items-center gap-3.5">
                            <div class="w-10 h-10 rounded-full bg-white/10 text-white flex items-center justify-center backdrop-blur-md">
                                <iconify-icon icon="solar:airplane-linear" width="20" stroke-width="1.5"></iconify-icon>
                            </div>
                            <div>
                                <h3 class="text-lg font-medium tracking-tight text-white">#KOLI-05</h3>
                                <p class="text-xs text-white/60 font-medium mt-0.5">Air Freight</p>
                            </div>
                        </div>
                        <span class="inline-flex items-center px-2.5 py-1 rounded-full bg-white/10 text-white/90 text-xs font-medium backdrop-blur-md">
                            42 Items
                        </span>
                    </div>

                    <div class="flex justify-between items-end relative z-10">
                        <div>
                            <p class="text-xs text-white/50 mb-1 font-medium">Arrival Time</p>
                            <p class="text-sm font-medium text-white">Today, 09:15 AM</p>
                        </div>
                        
                        <div class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full backdrop-blur-md">
                            <span class="relative flex h-1.5 w-1.5">
                              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                              <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
                            </span>
                            <span class="text-xs font-medium text-white tracking-tight">Sorting</span>
                        </div>
                    </div>
                </div>

                <!-- Light Minimal Card 1 -->
                <div class="col-span-1 bg-white rounded-[1.5rem] p-4 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.02)] ring-1 ring-black/[0.04] cursor-pointer hover:ring-black/[0.08] hover:shadow-sm transition-all duration-300 flex flex-col justify-between aspect-square group">
                    <div class="flex justify-between items-start mb-2">
                        <div class="w-8 h-8 rounded-full bg-[#F7F7F8] text-gray-700 flex items-center justify-center">
                            <iconify-icon icon="solar:ship-linear" width="16" stroke-width="1.5"></iconify-icon>
                        </div>
                        <iconify-icon icon="solar:arrow-right-up-linear" class="text-gray-300 group-hover:text-gray-900 transition-colors" width="16"></iconify-icon>
                    </div>
                    <div>
                        <h3 class="text-base font-medium tracking-tight text-gray-900">#KOLI-04</h3>
                        <p class="text-xs text-gray-500 font-normal mt-0.5 mb-3">15 Items left</p>
                        <div class="flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-gray-900"></span>
                            <span class="text-xs font-medium text-gray-900">Almost Cleared</span>
                        </div>
                    </div>
                </div>

                <!-- Light Minimal Card 2 (Alert) -->
                <div class="col-span-1 bg-white rounded-[1.5rem] p-4 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.02)] ring-1 ring-amber-500/20 cursor-pointer hover:ring-amber-500/40 hover:shadow-sm transition-all duration-300 flex flex-col justify-between aspect-square group">
                    <div class="flex justify-between items-start mb-2">
                        <div class="w-8 h-8 rounded-full bg-amber-50 text-amber-600 flex items-center justify-center">
                            <iconify-icon icon="solar:box-minimalistic-linear" width="16" stroke-width="1.5"></iconify-icon>
                        </div>
                        <iconify-icon icon="solar:arrow-right-up-linear" class="text-gray-300 group-hover:text-gray-900 transition-colors" width="16"></iconify-icon>
                    </div>
                    <div>
                        <h3 class="text-base font-medium tracking-tight text-gray-900">#KOLI-02</h3>
                        <p class="text-xs text-gray-500 font-normal mt-0.5 mb-3">Action Required</p>
                        <div class="flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                            <span class="text-xs font-medium text-amber-700">Overdue</span>
                        </div>
                    </div>
                </div>

                <!-- Minimal Add Button -->
                <div class="col-span-2 mt-2 group cursor-pointer">
                    <div class="bg-transparent border border-dashed border-gray-300 rounded-[1.25rem] p-4 flex items-center justify-center gap-2 text-gray-500 hover:bg-white hover:border-gray-400 hover:text-gray-900 transition-all duration-300 shadow-sm">
                        <iconify-icon icon="solar:add-circle-linear" width="18" stroke-width="1.5"></iconify-icon>
                        <span class="text-sm font-medium tracking-tight">Register New Cargo</span>
                    </div>
                </div>

            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="absolute bottom-0 w-full bg-white/90 backdrop-blur-xl border-t border-black/[0.04] pb-8 pt-4 px-8 flex justify-between items-center z-40">
            <!-- Home -->
            <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-900 transition-colors group">
                <iconify-icon icon="solar:home-2-linear" width="22" stroke-width="1.5" class="group-hover:-translate-y-0.5 transition-transform"></iconify-icon>
                <span class="text-[0.65rem] font-medium">Home</span>
            </button>
            
            <!-- Scan -->
            <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-900 transition-colors group">
                <iconify-icon icon="solar:scanner-linear" width="22" stroke-width="1.5" class="group-hover:-translate-y-0.5 transition-transform"></iconify-icon>
                <span class="text-[0.65rem] font-medium">Scan</span>
            </button>
            
            <!-- Inventory (Active) -->
            <button class="flex flex-col items-center gap-1 text-gray-900 transition-colors relative">
                <div class="absolute -top-4 left-1/2 -translate-x-1/2 w-8 h-0.5 bg-gray-900 rounded-b-full"></div>
                <iconify-icon icon="solar:box-linear" width="22" stroke-width="1.5"></iconify-icon>
                <span class="text-[0.65rem] font-medium">Inventory</span>
            </button>
            
            <!-- Profile -->
            <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-gray-900 transition-colors group">
                <iconify-icon icon="solar:user-linear" width="22" stroke-width="1.5" class="group-hover:-translate-y-0.5 transition-transform"></iconify-icon>
                <span class="text-[0.65rem] font-medium">Profile</span>
            </button>
        </nav>

    </div>


</body></html>
