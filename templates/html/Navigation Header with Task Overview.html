    <style>
        :root {
            --color-selection-bg: color-mix(in lch, #5e6ad2, #000 10%);
            --color-selection-text: #fff;
            --focus-ring-offset: 2px;
            --focus-ring-width: 2px;
            --focus-ring-color: #5e6ad2;
            --color-selection-dim: color-mix(in lch, #5e6ad2, transparent 80%);
            --color-text-tertiary: #8a8f98;
            --text-small-letter-spacing: -0.013em;
            --text-small-line-height: calc(20 / 14);
            --text-small-size: 0.875rem;
        }

        ::selection, img::selection {
            background-repeat: repeat;
            color: var(--color-selection-text);
        }

        ::selection {
            background: var(--color-selection-bg);
        }

        img::selection {
            background: var(--color-selection-dim);
        }

        * {
            outline: transparent;
        }

        :focus:not(:focus-visible) {
            outline: medium currentcolor;
        }

        :focus-visible {
            outline: var(--focus-ring-width) solid var(--focus-ring-color);
            outline-offset: var(--focus-ring-offset);
        }

        body {
            color: #f7f8f8;
            font-family: "Inter Variable", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Open Sans", "Helvetica Neue", sans-serif;
            line-height: 1.5;
        }

        .tertiary-text {
            color: var(--color-text-tertiary);
            font-size: var(--text-small-size);
            letter-spacing: var(--text-small-letter-spacing);
            line-height: var(--text-small-line-height);
