    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- Reusable HLS Video Component ---
        const HlsVideo = ({ src, className, style }) => {
            const videoRef = useRef(null);

            useEffect(() => {
                const video = videoRef.current;
                if (!video) return;

                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = src;
                } else if (Hls.isSupported()) {
                    const hls = new Hls({ startLevel: 2 });
                    hls.loadSource(src);
                    hls.attachMedia(video);
                    return () => hls.destroy();
                }
            }, [src]);

            return (
                <video 
                    ref={videoRef} 
                    autoPlay 
                    loop 
                    muted 
                    playsInline 
                    className={className} 
                    style={style} 
                />
            );
        };

        // --- Animated BlurText Component ---
        const BlurText = ({ text, delayOffset = 0, className = "" }) => {
            const words = text.split(" ");
            
            return (
                <motion.h1
                    initial="hidden"
                    whileInView="visible"
                    viewport={{ once: true, margin: "-50px" }}
                    className={className}
                >
                    {words.map((word, i) => (
                        <motion.span
                            key={i}
                            className="inline-block mr-[0.25em]"
                            variants={{
                                hidden: { filter: 'blur(10px)', opacity: 0, y: 50 },
                                visible: {
                                    filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                                    opacity: [0, 0.5, 1],
                                    y: [50, -5, 0],
                                    transition: { 
                                        delay: delayOffset + (i * 0.15), 
                                        duration: 0.7, 
                                        times: [0, 0.5, 1],
                                        ease: "easeOut"
                                    }
                                }
                            }}
                        >
                            {word}
                        </motion.span>
                    ))}
                </motion.h1>
            );
        };
