  <meta charset="UTF-8">
  <title>Minimal Sphere Card with Mesh Gradient</title>

    body { font-family: 'Geist Mono', monospace;}

<body class="min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-neutral-100">
  <!-- Mesh Gradient Background -->
  <div class="pointer-events-none absolute inset-0 -z-10">
    <div class="absolute w-[60vw] h-[50vw] left-[-15vw] top-[-10vw]">
      <div class="absolute w-[30vw] h-[28vw] rounded-full blur-[60px] opacity-80"
        style="background: linear-gradient(to right, #ff2222, transparent); left: 3vw; top: 3vw; rotate: 45deg;"></div>
      <div class="absolute w-[26vw] h-[32vw] rounded-full blur-[44px] opacity-70 bg-[#ff9900]"
        style="left: 22vw; top: 5vw; rotate: -45deg;"></div>
      <div class="absolute w-[21vw] h-[19vw] rounded-full blur-[36px] opacity-60 bg-white mix-blend-overlay"
        style="left: 25vw; top: -4vw;"></div>
      <div class="absolute w-[23vw] h-[22vw] rounded-full blur-[32px] opacity-60"
        style="background: linear-gradient(to right, #bd0000, transparent); left: 10vw; top: 22vw;"></div>
    </div>
  </div>

  <!-- Instruction Text -->
  <div class="mb-8 text-center">
    <span class="inline-block text-sm md:text-base text-neutral-500 font-semibold tracking-wide px-4 py-2 bg-white/80 rounded-lg shadow-sm border border-neutral-200">
      Mouse over to view 3D effect
    </span>
  </div>

  <!-- Tilt Container -->
  <div class="perspective">
    <div class="tilt-card relative w-[41vmin] h-[56vmin] flex flex-col justify-between rounded-2xl bg-white overflow-hidden z-10 custom-shadow">
      <!-- Top Text Row -->
      <div class="flex justify-between items-start px-5 pt-4 text-[1.05rem] text-neutral-800 z-20 relative bg-transparent">
        <div>
          <div class="font-bold">Sphere</div>
          <div class="text-xs opacity-75">Minimalistic Card</div>
        </div>
        <div class="font-bold text-base">0008</div>
      </div>
      <!-- Divider Top -->
      <div class="absolute left-6 right-6 top-[5.9vmin] h-px bg-neutral-200/80 z-20"></div>
      <!-- Center Sphere SVG -->
      <div class="flex-1 flex items-center justify-center relative z-10">
        <svg class="w-[26vmin] h-[26vmin]" viewBox="0 0 200 200" fill="none">
          <circle cx="100" cy="100" r="94" stroke="#18181b" stroke-width="2" />
          <ellipse cx="100" cy="100" rx="94" ry="30" stroke="#18181b" stroke-width="1" fill="none"/>
          <ellipse cx="100" cy="100" rx="94" ry="55" stroke="#18181b" stroke-width="1" fill="none" opacity="0.7"/>
          <ellipse cx="100" cy="100" rx="94" ry="80" stroke="#18181b" stroke-width="1" fill="none" opacity="0.35"/>
          <ellipse cx="100" cy="100" rx="30" ry="94" stroke="#18181b" stroke-width="1" fill="none"/>
          <ellipse cx="100" cy="100" rx="55" ry="94" stroke="#18181b" stroke-width="1" fill="none" opacity="0.7"/>
          <ellipse cx="100" cy="100" rx="80" ry="94" stroke="#18181b" stroke-width="1" fill="none" opacity="0.35"/>
          <line x1="100" y1="6" x2="100" y2="194" stroke="#18181b" stroke-width="1" stroke-dasharray="7 3" opacity="0.5"/>
          <line x1="6" y1="100" x2="194" y2="100" stroke="#18181b" stroke-width="1" stroke-dasharray="7 3" opacity="0.5"/>
        </svg>
      </div>
      <!-- Divider Bottom -->
      <div class="absolute left-6 right-6 bottom-[5.9vmin] h-px bg-neutral-200/80 z-20"></div>
      <!-- Bottom Text Row -->
      <div class="flex justify-between items-end px-5 pb-4 text-[1.05rem] text-neutral-800 z-20 relative bg-transparent">
        <div class="text-xs">@mengto</div>
        <div></div>
      </div>
    </div>
  </div>
  <script>
    // 3D Tilt Effect
    const card = document.querySelector('.tilt-card');
    const maxTilt = 18; // degrees

    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width/2;
      const centerY = rect.height/2;

      const rotateX = ((y - centerY) / centerY) * -maxTilt;
      const rotateY = ((x - centerX) / centerX) * maxTilt;

      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    card.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });

    card.addEventListener('mouseenter', () => {
      card.style.transition = 'transform 0.25s cubic-bezier(.23,1.01,.32,1)';
    });
  </script>
