<style>
body {
font-family: 'Nunito', sans-serif;
}
.no-scrollbar::-webkit-scrollbar {
display: none;
}
.no-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
/* Liquid Wave Animation */
@keyframes wave {
0%, 100% { transform: translateY(0px) rotate(0deg); }
50% { transform: translateY(8px) rotate(2deg); }
}
.animate-wave {
animation: wave 4s ease-in-out infinite;
}
/* Floating Bubbles Background */
@keyframes float {
0% { transform: translate(0px, 0px); }
50% { transform: translate(10px, -20px); }
100% { transform: translate(0px, 0px); }
}
.animate-float {
animation: float 6s ease-in-out infinite;
}
.animate-float-delayed {
animation: float 8s ease-in-out infinite 1s;
}
/* Glossy Glass Effect */
.glass-panel {
background: rgba(255, 255, 255, 0.25);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(255, 255, 255, 0.4);
box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
}
.glass-button {
background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.4));
backdrop-filter: blur(10px);
border: 1px solid rgba(255, 255, 255, 0.6);
box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05), inset 0 2px 5px rgba(255,255,255,0.8);
}
.liquid-bubble {
box-shadow: inset 0 0 20px rgba(255,255,255,0.5), inset 10px 10px 30px rgba(255,255,255,0.4), 0 10px 20px rgba(6,182,212,0.3);
}

<body class="bg-gradient-to-br from-indigo-300 via-purple-300 to-pink-300 min-h-screen flex items-center justify-center overflow-hidden selection:bg-pink-300 selection:text-indigo-900">

                <div class="text-center">

                                <stop offset="100%" stop-color="#3b82f6" /> <!-- blue -->
                            </linearGradient>
                        </defs>
                    </svg>
                    
                    <!-- Inner Liquid Content -->
                    <div class="absolute inset-8 rounded-full bg-gradient-to-b from-blue-100/50 to-blue-200/50 shadow-[inset_0_4px_10px_rgba(255,255,255,0.8)] backdrop-blur-sm flex flex-col items-center justify-center animate-wave overflow-hidden border-4 border-white/40">

                        <h1 class="text-5xl font-black text-indigo-900 tracking-tight drop-shadow-sm">74<span class="text-2xl">%</span></h1>
                        <p class="text-sm font-bold text-indigo-500/80 mt-1">1,850 ml</p>
                    </div>
                </div>

                </div>

                <div class="space-y-3">
                    <!-- Item 1 -->

                        <div class="flex items-center gap-4">

                            </div>
                            <div>

                            </div>
                        </div>
                        <span class="text-sm font-extrabold text-orange-500 bg-white/50 px-3 py-1 rounded-lg shadow-sm">+300ml</span>
                    </div>

                    <!-- Item 3 -->
                    <div class="glass-panel p-3 rounded-2xl flex items-center justify-between hover:bg-white/40 transition-colors cursor-pointer">
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-blue-100 flex items-center justify-center text-blue-500">
                                <span class="iconify" data-icon="lucide:glass-water" data-width="20" data-stroke-width="2"></span>
                            </div>
                            <div>
                                <p class="text-base font-bold text-indigo-900">Water</p>
                                <p class="text-xs font-semibold text-indigo-400">8:00 AM</p>
                            </div>
                        </div>
                        <span class="text-sm font-extrabold text-blue-600 bg-white/50 px-3 py-1 rounded-lg shadow-sm">+500ml</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Glass Dock -->
        <nav class="absolute bottom-6 left-4 right-4 z-20">

                <button class="group flex flex-col items-center justify-center gap-1 w-12 h-12 rounded-2xl text-indigo-400 hover:text-indigo-600 hover:bg-white/50 transition-all duration-300 hover:-translate-y-1">
                    <span class="iconify" data-icon="lucide:trophy" data-width="24" data-stroke-width="2.5"></span>

                <button class="group flex flex-col items-center justify-center gap-1 w-12 h-12 rounded-2xl text-indigo-400 hover:text-indigo-600 hover:bg-white/50 transition-all duration-300 hover:-translate-y-1">
                    <span class="iconify" data-icon="lucide:user" data-width="24" data-stroke-width="2.5"></span>
                </button>

            </div>
        </nav>

    </div>
