    <meta charset="UTF-8">

    <title>Traffic Sources Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --font-main: 'Roboto', sans-serif;
            --bg-page: #121212;
            --bg-component: #2a2a2a;
            --text-primary: #e0e0e0;
            --text-heading: #ffffff;
            --border-color: #444444;
            --text-accent: #007bff;
            --color-info: #17a2b8;
            --color-warning: #ffc107;
            --color-success: #28a745;
            --border-radius-lg: 0.5rem;
            --shadow-md: 0 .5rem 1rem rgba(0, 0, 0, 0.1);
            --transition-speed-normal: 0.2s;
            --transition-timing-function: ease-in-out;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .dashboard-widget {
            background-color: var(--bg-component);
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: transform var(--transition-speed-normal) var(--transition-timing-function), 
                        box-shadow var(--transition-speed-normal) var(--transition-timing-function);
            padding: 25px;
            max-width: 400px;
            min-height: 350px;
        }

        .dashboard-widget:hover {
            transform: translateY(-5px);
            box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.15);
        }

        .widget-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 20px;
        }

        canvas {
            max-height: 300px;
        }
    </style>
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Roboto&display=swap" rel="stylesheet">

<body>
    <div class="dashboard-widget wow animate__animated animate__pulse">
        <h3 class="widget-title">Traffic Sources</h3>
        <canvas data-chart="donut"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
    <script>
        function initChart() {
            const canvas = document.querySelector('[data-chart="donut"]');
            const ctx = canvas.getContext('2d');
            
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Organic', 'Direct', 'Referral', 'Social'],
                    datasets: [{
                        data: [300, 50, 100, 80],
                        backgroundColor: ['#007bff', '#17a2b8', '#ffc107', '#28a745'],
                        borderWidth: 0,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#e0e0e0'
                            }
                        }
                    }
                }
            });
        }

        new WOW().init();
        document.addEventListener('DOMContentLoaded', initChart);
    </script>
</body>
</html>
