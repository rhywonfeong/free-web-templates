<body class="bg-black text-white/90 font-sans h-screen w-screen overflow-hidden select-none" x-data="auraApp()" x-init="initApp()">

    <!-- Background Ambient -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-0 left-0 w-full h-1/3 bg-gradient-to-b from-zinc-900/20 to-transparent"></div>

    <!-- Auth / Status (Hidden mostly, handles logic) -->
    <div class="fixed top-4 right-4 z-50 flex items-center gap-2" x-cloak x-show="!user">
        <button @click="signIn" class="text-xs font-semibold bg-white/10 hover:bg-white/20 backdrop-blur-md px-3 py-1.5 rounded-full transition-colors border border-white/5">
            Sign In

    <!-- Main Container -->
    <main class="relative h-full w-full flex flex-col pt-12">
        
        <!-- Header -->
        <header class="px-6 mb-4 flex justify-between items-end">
            <h1 class="text-3xl font-semibold tracking-tight text-white leading-none">Aura</h1>

        <!-- Scrollable Grid Area -->

                <!-- App Items -->
                <template x-for="(app, index) in apps" :key="app.id">
                    <div class="flex flex-col items-center gap-2 group cursor-pointer relative" :data-id="app.id" @click="launch(app)">
                        <!-- Delete Action (Long press simulation via hover/ui for desktop, custom context for mobile could be added) -->
                        <button @click.stop="removeApp(app.id)" class="absolute -top-1 -right-1 z-10 bg-red-500/80 text-white rounded-full p-0.5 opacity-0 group-hover:opacity-100 transition-opacity" title="Remove">
                            <span class="iconify w-3 h-3" data-icon="solar:trash-bin-trash-bold-duotone"></span>
                        </button>

                        <div class="app-card w-16 h-16 rounded-[1.2rem] bg-zinc-900/60 border border-white/5 shadow-lg flex items-center justify-center text-3xl text-white/80 group-hover:bg-zinc-800/80 group-hover:text-white group-hover:shadow-white/5 transition-all relative overflow-hidden">
                            <!-- Subtle sheen -->
                            <div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <span class="iconify relative z-10" :data-icon="app.icon"></span>
                        </div>
                        <span class="text-[10px] font-medium tracking-wide text-white/50 group-hover:text-white/80 truncate w-full text-center" x-text="app.name"></span>
                    </div>
                </template>

            </div>

            <!-- Ghost Slots (Bottom Fade) -->
            <div class="grid grid-cols-5 md:grid-cols-8 lg:grid-cols-10 gap-x-2 gap-y-6 mt-6 opacity-30 ghost-fade pointer-events-none mx-auto max-w-7xl">
                <template x-for="i in 15">
                    <div class="flex flex-col items-center gap-2">
                        <div class="w-16 h-16 rounded-[1.2rem] bg-zinc-900/30 border border-white/5"></div>
                        <div class="h-2 w-8 bg-zinc-900/30 rounded-full"></div>
                    </div>
                </template>
            </div>
        </div>

    </main>

    <!-- Floating Action Button -->
    <div class="fixed bottom-8 left-0 right-0 flex justify-center z-40 pointer-events-none">

            <span class="iconify w-6 h-6" data-icon="solar:add-circle-bold-duotone"></span>
        </button>
    </div>

    <!-- Add App Modal -->
    <div x-show="modalOpen" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-black/80 backdrop-blur-sm" x-cloak>
        <div @click.outside="closeModal" class="bg-zinc-950 border border-white/10 rounded-3xl p-6 w-full max-w-sm shadow-2xl transform transition-all">
            <h2 class="text-lg font-semibold text-white mb-6 tracking-tight flex items-center gap-2">
                <span class="iconify text-zinc-400" data-icon="solar:widget-add-bold-duotone"></span>
                Add Application
            </h2>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] uppercase tracking-wider text-zinc-500 font-bold ml-1">App Name</label>
                    <input x-model="newApp.name" type="text" placeholder="e.g. Dribbble" class="w-full bg-zinc-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white/30 focus:bg-zinc-900 transition-colors placeholder-zinc-700">
                </div>
                
                <div>
                    <label class="text-[10px] uppercase tracking-wider text-zinc-500 font-bold ml-1">URL</label>
                    <input x-model="newApp.url" type="url" placeholder="https://..." class="w-full bg-zinc-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white/30 focus:bg-zinc-900 transition-colors placeholder-zinc-700">
                </div>

                <div>
                    <label class="text-[10px] uppercase tracking-wider text-zinc-500 font-bold ml-1">Icon (Solar Name)</label>
                    <div class="flex gap-2">
                        <input x-model="newApp.icon" type="text" placeholder="solar:basketball-bold-duotone" class="w-full bg-zinc-900/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-white/30 focus:bg-zinc-900 transition-colors placeholder-zinc-700">
                        <div class="w-12 h-11 rounded-xl bg-zinc-900 border border-white/10 flex items-center justify-center shrink-0">
                            <span class="iconify text-xl text-white/80" :data-icon="newApp.icon || 'solar:question-circle-bold-duotone'"></span>
                        </div>
                    </div>
                    <a href="https://icon-sets.iconify.design/solar/?query=bold+duotone" target="_blank" class="text-[10px] text-blue-400 mt-1 ml-1 hover:underline">Find icons here</a>
                </div>
            </div>

            <div class="flex gap-3 mt-8">
                <button @click="closeModal" class="flex-1 py-3 rounded-xl text-sm font-medium text-zinc-400 hover:text-white hover:bg-white/5 transition-colors">Cancel</button>
                <button @click="saveNewApp" class="flex-1 py-3 rounded-xl text-sm font-semibold bg-white text-black hover:bg-zinc-200 transition-colors shadow-lg shadow-white/10">Add App</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCo0Rq6eABM3Q6le_x9VjskDCCAg1XUl8A",
            authDomain: "livedesklauncher.firebaseapp.com",
            databaseURL: "https://livedesklauncher-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "livedesklauncher",
            storageBucket: "livedesklauncher.firebasestorage.app",
            messagingSenderId: "719865623018",
            appId: "1:719865623018:web:104315b70c32db5bd4c293",
            measurementId: "G-N1XRVV5SNJ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Expose logic to Alpine
        window.firebaseApp = { auth, db, ref, set, onValue, signInAnonymously, onAuthStateChanged, signInWithPopup, GoogleAuthProvider };
    </script>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('auraApp', () => ({
                user: null,
                online: navigator.onLine,
                modalOpen: false,
                apps: [],
                newApp: { name: '', url: '', icon: 'solar:star-bold-duotone' },
                sortable: null,
                
                // Default Apps Configuration
                defaults: [
                    { id: 'wa', name: 'WhatsApp', url: 'https://web.whatsapp.com', icon: 'solar:chat-round-dots-bold-duotone' },
                    { id: 'yt', name: 'YouTube', url: 'https://youtube.com', icon: 'solar:play-circle-bold-duotone' },
                    { id: 'gm', name: 'Gmail', url: 'https://mail.google.com', icon: 'solar:letter-bold-duotone' },
                    { id: 'x', name: 'X', url: 'https://twitter.com', icon: 'solar:close-circle-bold-duotone' },
                    { id: 'rd', name: 'Reddit', url: 'https://reddit.com', icon: 'solar:mask-hkk-bold-duotone' },
                    { id: 'ig', name: 'Instagram', url: 'https://instagram.com', icon: 'solar:camera-bold-duotone' },
                    { id: 'tg', name: 'Telegram', url: 'https://web.telegram.org', icon: 'solar:plain-2-bold-duotone' },
                    { id: 'gpt', name: 'ChatGPT', url: 'https://chat.openai.com', icon: 'solar:magic-stick-3-bold-duotone' },
                    { id: 'gem', name: 'Gemini', url: 'https://gemini.google.com', icon: 'solar:stars-bold-duotone' },
                    { id: 'not', name: 'Notion', url: 'https://notion.so', icon: 'solar:notebook-bold-duotone' },
                    { id: 'spo', name: 'Spotify', url: 'https://open.spotify.com', icon: 'solar:music-note-slider-bold-duotone' },
                    { id: 'dis', name: 'Discord', url: 'https://discord.com/app', icon: 'solar:gamepad-bold-duotone' },
                    { id: 'gh', name: 'GitHub', url: 'https://github.com', icon: 'solar:code-circle-bold-duotone' },
                    { id: 'nf', name: 'Netflix', url: 'https://netflix.com', icon: 'solar:clapperboard-play-bold-duotone' },
                    { id: 'fig', name: 'Figma', url: 'https://figma.com', icon: 'solar:pen-new-square-bold-duotone' }
                ],

                async initApp() {
                    // Check local storage first
                    const cached = localStorage.getItem('aura_apps');
                    if (cached) {
                        this.apps = JSON.parse(cached);
                        this.$nextTick(() => this.initSortable());
                    } else {
                        this.apps = [...this.defaults];
                        this.$nextTick(() => this.initSortable());
                    }

                    // Online listener
                    window.addEventListener('online', () => { this.online = true; this.syncToFirebase(); });
                    window.addEventListener('offline', () => this.online = false);

                    // Wait for Firebase to load module
                    const checkFirebase = setInterval(() => {
                        if (window.firebaseApp) {
                            clearInterval(checkFirebase);
                            this.setupFirebase();
                        }
                    }, 50);
                },

                setupFirebase() {
                    const { auth, onAuthStateChanged, signInAnonymously } = window.firebaseApp;

                    onAuthStateChanged(auth, (user) => {
                        if (user) {
                            this.user = user;
                            this.listenToDB();
                        } else {
                            // Silent sign-in (Anonymous)
                            signInAnonymously(auth).catch(e => console.error("Auth Error", e));
                        }
                    });
                },

                listenToDB() {
                    const { db, ref, onValue } = window.firebaseApp;
                    const userAppsRef = ref(db, `users/${this.user.uid}/apps`);

                    onValue(userAppsRef, (snapshot) => {
                        const val = snapshot.val();
                        if (val) {
                            this.apps = val;
                            localStorage.setItem('aura_apps', JSON.stringify(val));
                            this.$nextTick(() => {
                                // Refresh icons
                                if (window.Iconify) window.Iconify.scan();
                            });
                        } else {
                            // First time user in DB, save defaults
                            this.syncToFirebase();
                        }
                    });
                },

                syncToFirebase() {
                    if (!this.user || !this.online) return;
                    const { db, ref, set } = window.firebaseApp;
                    set(ref(db, `users/${this.user.uid}/apps`), this.apps);
                },

                signIn() {
                    const { auth, signInWithPopup, GoogleAuthProvider } = window.firebaseApp;
                    const provider = new GoogleAuthProvider();
                    signInWithPopup(auth, provider).catch(e => console.log(e));
                },

                initSortable() {
                    const el = document.getElementById('app-grid');
                    if (this.sortable) this.sortable.destroy();

                    this.sortable = new Sortable(el, {
                        animation: 200,
                        delay: 150, // Slight delay prevents accidental drag on tap
                        delayOnTouchOnly: true,
                        ghostClass: 'opacity-50',
                        onEnd: (evt) => {
                            const item = this.apps.splice(evt.oldIndex, 1)[0];
                            this.apps.splice(evt.newIndex, 0, item);
                            // Update local
                            localStorage.setItem('aura_apps', JSON.stringify(this.apps));
                            // Sync remote
                            this.syncToFirebase();
                        }
                    });
                },

                launch(app) {
                    window.open(app.url, '_blank');
                },

                openModal() {
                    this.newApp = { name: '', url: '', icon: 'solar:star-bold-duotone' };
                    this.modalOpen = true;
                },

                closeModal() {
                    this.modalOpen = false;
                },

                saveNewApp() {
                    if (!this.newApp.name || !this.newApp.url) return;
                    
                    // Simple URL validation prefix
                    let url = this.newApp.url;
                    if (!/^https?:\/\//i.test(url)) {
                        url = 'https://' + url;
                    }

                    const app = {
                        id: Date.now().toString(36),
                        name: this.newApp.name,
                        url: url,
                        icon: this.newApp.icon || 'solar:globe-bold-duotone'
                    };

                    this.apps.push(app);
                    localStorage.setItem('aura_apps', JSON.stringify(this.apps));
                    this.syncToFirebase();
                    this.closeModal();
                    
                    this.$nextTick(() => {
                         if (window.Iconify) window.Iconify.scan();
                    });
                },

                removeApp(id) {
                    if(confirm("Remove this app?")) {
                        this.apps = this.apps.filter(a => a.id !== id);
                        localStorage.setItem('aura_apps', JSON.stringify(this.apps));
                        this.syncToFirebase();
                    }
                }
            }));
        });
    </script>
</body>
