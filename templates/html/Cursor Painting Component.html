<!DOCTYPE html>
<html lang="en"><head><script id="aura-preview-performance-controller">
(function() {
if (window.__auraPreviewPerformanceController) return;
const nativeRequestAnimationFrame = window.requestAnimationFrame
? window.requestAnimationFrame.bind(window)
: function(callback) { return window.setTimeout(function() { callback(Date.now()); }, 16); };
const nativeCancelAnimationFrame = window.cancelAnimationFrame
? window.cancelAnimationFrame.bind(window)
: window.clearTimeout.bind(window);
const nativeSetInterval = window.setInterval.bind(window);
let paused = false;
let nextFrameId = 1;
const frameRecords = new Map();
const pausedFrameCallbacks = new Map();
const style = document.createElement('style');
style.id = 'aura-preview-performance-style';
style.textContent = [
'html[data-aura-preview-paused="true"] *,',
'html[data-aura-preview-paused="true"] *::before,',
'html[data-aura-preview-paused="true"] *::after {',
'  animation-play-state: paused !important;',
'  transition-duration: 0s !important;',
'  scroll-behavior: auto !important;',
'}'
].join('\n');
document.head.appendChild(style);
window.requestAnimationFrame = function(callback) {
const frameId = nextFrameId++;
if (paused) {
pausedFrameCallbacks.set(frameId, callback);
frameRecords.set(frameId, { paused: true });
return frameId;
}
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });
return frameId;
};
window.cancelAnimationFrame = function(frameId) {
const record = frameRecords.get(frameId);
pausedFrameCallbacks.delete(frameId);
if (record && typeof record.nativeFrameId !== 'undefined') {
nativeCancelAnimationFrame(record.nativeFrameId);
}
frameRecords.delete(frameId);
};
window.setInterval = function(callback, delay) {
const args = Array.prototype.slice.call(arguments, 2);
return nativeSetInterval(function() {
if (paused) return;
callback.apply(this, args);
}, delay);
};
const flushPausedFrames = function() {
const callbacks = Array.from(pausedFrameCallbacks.entries());
pausedFrameCallbacks.clear();
callbacks.forEach(function(entry) {
const frameId = entry[0];
const callback = entry[1];
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });
});
};
const setPaused = function(nextPaused) {
const shouldPause = Boolean(nextPaused);
if (paused === shouldPause) return;
paused = shouldPause;
document.documentElement.toggleAttribute('data-aura-preview-paused', paused);
if (!paused) {
flushPausedFrames();
}
};
window.__auraPreviewPerformanceController = {
setPaused: setPaused,
get paused() {
return paused;
}
};
window.addEventListener('message', function(event) {
if (event.source !== window.parent) return;
if (!event.data || event.data.type !== 'aura-preview-performance-mode') return;
setPaused(event.data.paused);
});
})();
</script>

    <div class="absolute inset-0 w-full h-full select-none">
      <img id="revealTargetImg" src="https://cdn.gamma.app/0q3kwkx42ofh0ga/7fcabd41e15c428589032d3bb734d4f8/original/image.png" alt="Reveal Target" class="absolute inset-0 w-full h-full object-cover">

        </h1>

        </p>
      </div>
    </div>
    
    <canvas id="inkRevealCanvas" class="absolute inset-0 z-10 opacity-0 transition-opacity duration-200 ease-in-out" style="cursor: crosshair;"></canvas>

  </div>

  <script>
    (function() {
      const config = {
        maskColor: [252, 250, 248],
        brushSize: 150, // Slightly increased brush size for a larger viewport canvas layout
        lifetime: 600,
        rStart: 10,
        rVary: 0.45,
        stampStep: 10,
        maxStamps: 250, // Increased capacity limit for larger viewport trails
        segments: 36,
        wobble: [0.14, 0.08, 0.05],
        gradientInnerRadius: 0.2,
        gradientStops: [0.95, 0.88, 0]
      };

      const canvas = document.getElementById('inkRevealCanvas');
      const img = document.getElementById('revealTargetImg');
      if (!canvas || !img) return;

      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      let stamps = [];
      let isRunning = false;
      let lastPos = null;
      let dims = { w: 0, h: 0 };
      let isHovered = false;
      let idleTime = 0;
      let isInitialized = false;

      function resize() {
        const parent = canvas.parentElement;
        if (!parent) return;
        
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        dims.w = window.innerWidth;
        dims.h = window.innerHeight;

        canvas.width = Math.round(dims.w * dpr);
        canvas.height = Math.round(dims.h * dpr);
        canvas.style.width = `${dims.w}px`;
        canvas.style.height = `${dims.h}px`;

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = `rgb(${config.maskColor[0]},${config.maskColor[1]},${config.maskColor[2]})`;
        ctx.fillRect(0, 0, dims.w, dims.h);
      }

      function initCanvasAndLoop() {
        if (isInitialized) return;
        isInitialized = true;

        resize();
        window.addEventListener('resize', resize);

        canvas.classList.add('canvas-ready');
        startLoop();
      }

      function carveInk(ctx, x, y, r, seed, alpha) {
        const g = ctx.createRadialGradient(x, y, r * config.gradientInnerRadius, x, y, r);
        g.addColorStop(0, `rgba(0,0,0,${config.gradientStops[0] * alpha})`);
        g.addColorStop(0.5, `rgba(0,0,0,${config.gradientStops[1] * alpha})`);
        g.addColorStop(1, `rgba(0,0,0,${config.gradientStops[2] * alpha})`);

        ctx.fillStyle = g;
        ctx.beginPath();

        for (let i = 0; i <= config.segments; i++) {
          const a = (i / config.segments) * Math.PI * 2;
          const wob = 0.78 +
            config.wobble[0] * Math.sin(a * 3 + seed) +
            config.wobble[1] * Math.sin(a * 5 + seed * 2.1) +
            config.wobble[2] * Math.sin(a * 7 + seed * 0.7);

          const px = x + Math.cos(a) * r * wob;
          const py = y + Math.sin(a) * r * wob;
          
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
      }

      function addStamp(x, y) {
        if (stamps.length >= config.maxStamps) stamps.shift();
        stamps.push({
          x,
          y,
          born: performance.now(),
          seed: Math.random() * Math.PI * 2,
          rmax: config.brushSize * (1 - config.rVary + Math.random() * config.rVary)
        });
      }

      function stampAlong(x, y) {
        if (!lastPos) {
          addStamp(x, y);
        } else {
          const dx = x - lastPos.x;
          const dy = y - lastPos.y;
          const dist = Math.hypot(dx, dy);
          const steps = Math.max(1, Math.ceil(dist / config.stampStep));
          
          for (let i = 1; i <= steps; i++) {
            addStamp(lastPos.x + (dx * i) / steps, lastPos.y + (dy * i) / steps);
          }
        }
        lastPos = { x, y };
      }

      function loop() {
        const now = performance.now();
        
        if (!isHovered) {
          idleTime += 0.012; // Tweaked speed for screen scale
          const idleX = dims.w / 2 + Math.sin(idleTime * 1.1) * (dims.w * 0.38);
          const idleY = dims.h / 2 + Math.cos(idleTime * 0.7) * (dims.h * 0.32);
          stampAlong(idleX, idleY);
        }

        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = `rgb(${config.maskColor[0]},${config.maskColor[1]},${config.maskColor[2]})`;
        ctx.fillRect(0, 0, dims.w, dims.h);

        ctx.globalCompositeOperation = 'destination-out';

        for (let i = stamps.length - 1; i >= 0; i--) {
          const t = (now - stamps[i].born) / config.lifetime;
          if (t >= 1) {
            stamps.splice(i, 1);
            continue;
          }
          const ease = 1 - Math.pow(1 - t, 3);
          const r = config.rStart + (stamps[i].rmax - config.rStart) * ease;
          const alpha = 1 - t * t;
          carveInk(ctx, stamps[i].x, stamps[i].y, r, stamps[i].seed, alpha);
        }

        if (stamps.length || !isHovered) {
          requestAnimationFrame(loop);
        } else {
          isRunning = false;
        }
      }

      function startLoop() {
        if (!isRunning) {
          isRunning = true;
          requestAnimationFrame(loop);
        }
      }

      function getRelativePos(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      canvas.addEventListener('mouseenter', function(e) {
        isHovered = true;
        const pos = getRelativePos(e);
        lastPos = pos;
        stampAlong(pos.x, pos.y);
        startLoop();
      });

      canvas.addEventListener('mousemove', function(e) {
        isHovered = true;
        const pos = getRelativePos(e);
        stampAlong(pos.x, pos.y);
        startLoop();
      });

      canvas.addEventListener('mouseleave', function() {
        isHovered = false;
        lastPos = null;
      });

      if (img.complete && img.naturalWidth !== 0) {
        initCanvasAndLoop();
      } else {
        img.addEventListener('load', initCanvasAndLoop);
      }
    })();
  </script>
