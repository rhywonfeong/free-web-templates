    <script>
      document.addEventListener('DOMContentLoaded', () => {
          // --- STATE & CONSTANTS ---
          let GRID_COLS = 16;
          let GRID_ROWS = 16;
          let currentShape = 'square';
          let squareRes = 16;
          let gridData = [];
          
          const gridEl = document.getElementById('draw-grid');
          const paletteEl = document.getElementById('palette-container');
          const btnGenerate = document.getElementById('btn-generate');
          const btnClear = document.getElementById('btn-clear-grid');
          const imageUpload = document.getElementById('image-upload');
          
          const toolDraw = document.getElementById('tool-draw');
          const toolFill = document.getElementById('tool-fill');
          const shapeBtns = document.querySelectorAll('.shape-btn');
          const squareResWrapper = document.getElementById('square-res-wrapper');
          const squareResSelect = document.getElementById('square-res-select');

          let isDrawing = false;
          let currentColor = '#ef4444'; 
          let activeTool = 'draw'; 

          // --- TOOLS & PALETTE ---
          function setTool(tool) {
              activeTool = tool;
              toolDraw.classList.remove('bg-white', 'text-black', 'border-white');
              toolDraw.classList.add('text-neutral-500', 'border-neutral-800', 'hover:text-white');
              toolFill.classList.remove('bg-white', 'text-black', 'border-white');
              toolFill.classList.add('text-neutral-500', 'border-neutral-800', 'hover:text-white');
              const activeEl = tool === 'draw' ? toolDraw : toolFill;
              activeEl.classList.remove('text-neutral-500', 'border-neutral-800', 'hover:text-white');
              activeEl.classList.add('bg-white', 'text-black', 'border-white');
          }

          toolDraw.addEventListener('click', () => setTool('draw'));
          toolFill.addEventListener('click', () => setTool('fill'));
          setTool('draw');

          const colors = [
              '#ffffff', '#a3a3a3', '#ef4444', '#ea580c', '#ca8a04', '#16a34a', '#2563eb', '#9333ea'
          ];

          colors.forEach((color, index) => {
              const swatch = document.createElement('div');
              swatch.className = `color-swatch ${index === 2 ? 'active' : ''}`;
              swatch.style.backgroundColor = color;
              swatch.dataset.color = color;
              swatch.addEventListener('click', () => selectColor(color, swatch));
              paletteEl.appendChild(swatch);
          });

          const customColorWrapper = document.createElement('label');
          customColorWrapper.className = 'color-swatch flex items-center justify-center relative overflow-hidden cursor-pointer';
          customColorWrapper.title = 'Custom Color Picker';
          customColorWrapper.style.background = 'conic-gradient(from 90deg, #ef4444, #ea580c, #ca8a04, #16a34a, #2563eb, #9333ea, #ef4444)';

          const customColorIcon = document.createElement('div');
          customColorIcon.className = 'z-10 pointer-events-none flex items-center justify-center mix-blend-difference text-white';
          customColorIcon.innerHTML = '<iconify-icon icon="solar:palette-linear" class="text-xs" stroke-width="1.5"></iconify-icon>';

          const customColorInput = document.createElement('input');
          customColorInput.type = 'color';
          customColorInput.value = '#000000';
          customColorInput.className = 'absolute inset-0 w-full h-full opacity-0 cursor-pointer';

          customColorWrapper.appendChild(customColorIcon);
          customColorWrapper.appendChild(customColorInput);
          paletteEl.appendChild(customColorWrapper);

          customColorInput.addEventListener('input', (e) => {
              const newColor = e.target.value;
              customColorWrapper.style.background = newColor;
              selectColor(newColor, customColorWrapper);
          });
          
          customColorInput.addEventListener('click', (e) => {
              selectColor(customColorInput.value, customColorWrapper);
          });

          document.querySelector('.color-swatch.eraser').addEventListener('click', function() {
              selectColor(null, this);
          });

          function selectColor(color, element) {
              currentColor = color;
              document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
              element.classList.add('active');
          }

          // --- GRID GENERATION & SHAPES ---
          function inShape(c, r, shape, cols, rows) {
              if (shape === 'square' || shape === 'rectangle') return true;

              const cx = cols / 2 - 0.5;
              const cy = rows / 2 - 0.5;
              const dx = c - cx;
              const dy = r - cy;

              if (shape === 'circle') {
                  const radius = cols / 2;
                  return Math.sqrt(dx*dx + dy*dy) <= radius;
              }

              if (shape === 'star') {
                  const angle = Math.atan2(dy, dx);
                  const radius = Math.sqrt(dx*dx + dy*dy);
                  const points = 5;
                  const outerR = cols / 2;
                  const innerR = (cols / 2) * 0.45;
                  const p = (angle + Math.PI / 2) / (Math.PI * 2 / points);
                  const pMod = p - Math.floor(p);
                  const sweep = Math.abs(pMod - 0.5) * 2;
                  const maxR = innerR + (outerR - innerR) * sweep;
                  return radius <= maxR + 0.5;
              }
              return true;
          }

          squareResSelect.addEventListener('change', (e) => {
              squareRes = parseInt(e.target.value);
              if (currentShape === 'square') {
                  initGrid('square');
              }
          });

          function initGrid(shape) {
              currentShape = shape;
              
              if (shape === 'square') {
                  GRID_COLS = squareRes;
                  GRID_ROWS = squareRes;
                  squareResWrapper.classList.remove('hidden');
              } else {
                  squareResWrapper.classList.add('hidden');
                  if (shape === 'rectangle') {
                      GRID_COLS = 20;
                      GRID_ROWS = 12;
                  } else {
                      GRID_COLS = 16;
                      GRID_ROWS = 16;
                  }
              }

              gridEl.style.gridTemplateColumns = `repeat(${GRID_COLS}, 1fr)`;
              gridEl.style.aspectRatio = `${GRID_COLS} / ${GRID_ROWS}`;
              gridEl.innerHTML = '';
              gridData = Array(GRID_COLS * GRID_ROWS).fill(null);

              for (let i = 0; i < GRID_COLS * GRID_ROWS; i++) {
                  const c = i % GRID_COLS;
                  const r = Math.floor(i / GRID_COLS);

                  const cell = document.createElement('div');
                  cell.className = 'pixel-cell relative';
                  cell.dataset.index = i;

                  const inner = document.createElement('div');
                  inner.className = 'absolute inset-0';
                  cell.appendChild(inner);

                  if (!inShape(c, r, shape, GRID_COLS, GRID_ROWS)) {
                      cell.classList.add('opacity-0', 'pointer-events-none');
                  } else {
                      cell.classList.add('active-cell');
                      cell.addEventListener('mousedown', () => {
                          if (activeTool === 'fill') {
                              floodFill(i);
                          } else {
                              isDrawing = true;
                              paintCell(cell, inner, i);
                          }
                      });
                      cell.addEventListener('mouseenter', () => {
                          if (isDrawing && activeTool === 'draw') paintCell(cell, inner, i);
                      });
                  }

                  gridEl.appendChild(cell);
              }

              // Update shape UI buttons
              shapeBtns.forEach(btn => {
                  if (btn.dataset.shape === shape) {
                      btn.classList.add('bg-white', 'text-black');
                      btn.classList.remove('text-neutral-500', 'hover:border-neutral-500');
                  } else {
                      btn.classList.remove('bg-white', 'text-black');
                      btn.classList.add('text-neutral-500', 'hover:border-neutral-500');
                  }
              });
          }

          shapeBtns.forEach(btn => {
              btn.addEventListener('click', () => {
                  initGrid(btn.dataset.shape);
              });
          });

          // Initialize Default Grid
          initGrid('square');

          document.addEventListener('mouseup', () => isDrawing = false);
          gridEl.addEventListener('dragstart', e => e.preventDefault());

          function paintCell(cell, inner, index) {
              gridData[index] = currentColor;
              if (currentColor) {
                  inner.style.backgroundColor = currentColor;
              } else {
                  inner.style.backgroundColor = 'transparent';
              }
          }

          function floodFill(startIndex) {
              const originalColor = gridData[startIndex];
              if (originalColor === currentColor) return;
              
              const queue = [startIndex];
              const visited = new Set([startIndex]);
              
              while(queue.length > 0) {
                  const idx = queue.shift();
                  
                  const cell = gridEl.children[idx];
                  const inner = cell.firstChild;
                  paintCell(cell, inner, idx);
                  
                  const r = Math.floor(idx / GRID_COLS);
                  const c = idx % GRID_COLS;
                  
                  const neighbors = [];
                  if (r > 0) neighbors.push(idx - GRID_COLS);
                  if (r < GRID_ROWS - 1) neighbors.push(idx + GRID_COLS);
                  if (c > 0) neighbors.push(idx - 1);
                  if (c < GRID_COLS - 1) neighbors.push(idx + 1);
                  
                  for (const n of neighbors) {
                      const nc = n % GRID_COLS;
                      const nr = Math.floor(n / GRID_COLS);
                      
                      if (!visited.has(n) && gridData[n] === originalColor && inShape(nc, nr, currentShape, GRID_COLS, GRID_ROWS)) {
                          visited.add(n);
                          queue.push(n);
                      }
                  }
              }
          }

          btnClear.addEventListener('click', () => {
              gridData.fill(null);
              document.querySelectorAll('.pixel-cell > div').forEach(inner => {
                  inner.style.backgroundColor = 'transparent';
              });
          });

          imageUpload.addEventListener('change', (e) => {
              const file = e.target.files[0];
              if (!file) return;

              const reader = new FileReader();
              reader.onload = (event) => {
                  const img = new Image();
                  img.onload = () => {
                      const tempCanvas = document.createElement('canvas');
                      tempCanvas.width = GRID_COLS;
                      tempCanvas.height = GRID_ROWS;
                      const ctx = tempCanvas.getContext('2d');
                      
                      const imgAspect = img.width / img.height;
                      const gridAspect = GRID_COLS / GRID_ROWS;
                      
                      let drawWidth, drawHeight, startX, startY;
                      if (imgAspect > gridAspect) {
                          drawHeight = img.height;
                          drawWidth = img.height * gridAspect;
                          startX = (img.width - drawWidth) / 2;
                          startY = 0;
                      } else {
                          drawWidth = img.width;
                          drawHeight = img.width / gridAspect;
                          startX = 0;
                          startY = (img.height - drawHeight) / 2;
                      }
                      
                      ctx.drawImage(img, startX, startY, drawWidth, drawHeight, 0, 0, GRID_COLS, GRID_ROWS);
                      const imageData = ctx.getImageData(0, 0, GRID_COLS, GRID_ROWS).data;
                      
                      for (let i = 0; i < GRID_COLS * GRID_ROWS; i++) {
                          const c = i % GRID_COLS;
                          const r = Math.floor(i / GRID_COLS);
                          
                          if (!inShape(c, r, currentShape, GRID_COLS, GRID_ROWS)) continue;

                          const rColor = imageData[i * 4];
                          const gColor = imageData[i * 4 + 1];
                          const bColor = imageData[i * 4 + 2];
                          const aColor = imageData[i * 4 + 3];
                          
                          const cell = gridEl.children[i];
                          const inner = cell.firstChild;
                          
                          if (aColor > 128) {
                              const hex = "#" + (1 << 24 | rColor << 16 | gColor << 8 | bColor).toString(16).slice(1);
                              gridData[i] = hex;
                              inner.style.backgroundColor = hex;
                          } else {
                              gridData[i] = null;
                              inner.style.backgroundColor = 'transparent';
                          }
                      }
                      e.target.value = '';
                  };
                  img.src = event.target.result;
              };
              reader.readAsDataURL(file);
          });

          // --- PHYSICS LOGIC (THREE.JS) ---
          const canvasContainer = document.getElementById('canvas-container');
          const toggleExplode = document.getElementById('toggle-explode');
          
          let scene, camera, renderer, animationId;
          let pixelBlocks = [];
          let entityGroup;
          let isExploded = false;
          let autoExplode = false;
          let currentBlockSize = 1;

          toggleExplode.addEventListener('change', (e) => {
              autoExplode = e.target.checked;
          });

          let entityVelocity = new THREE.Vector3(0, 0, 0);
          let entityAngularVelocity = new THREE.Vector3(0, 0, 0);
          let raycaster = new THREE.Raycaster();
          let pointer = new THREE.Vector2();
          let dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
          let dragOffset = new THREE.Vector3();
          let isYoinking = false;

          function initPhysics() {
              if(scene) return;

              scene = new THREE.Scene();
              camera = new THREE.PerspectiveCamera(45, canvasContainer.clientWidth / canvasContainer.clientHeight, 0.1, 1000);
              
              // We lock the camera distance because blocks are dynamically scaled to fill the physical space seamlessly
              camera.position.set(0, 0, 45);

              renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false }); 
              renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
              renderer.setPixelRatio(window.devicePixelRatio);
              canvasContainer.innerHTML = '';
              canvasContainer.appendChild(renderer.domElement);

              const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
              scene.add(ambientLight);

              const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
              dirLight.position.set(10, 20, 10);
              scene.add(dirLight);

              const floorGeo = new THREE.PlaneGeometry(200, 200);
              const floorMat = new THREE.MeshBasicMaterial({ visible: false });
              const floor = new THREE.Mesh(floorGeo, floorMat);
              floor.rotation.x = -Math.PI / 2;
              floor.position.y = -15;
              scene.add(floor);

              renderer.domElement.addEventListener('pointerdown', (e) => {
                  if (isExploded || !entityGroup) return;

                  const rect = canvasContainer.getBoundingClientRect();
                  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                  raycaster.setFromCamera(pointer, camera);
                  const intersects = raycaster.intersectObjects(entityGroup.children);

                  if (intersects.length > 0) {
                      isYoinking = true;
                      raycaster.ray.intersectPlane(dragPlane, dragOffset);
                      dragOffset.sub(entityGroup.position);
                      entityVelocity.set(0, 0, 0);
                      entityAngularVelocity.set(0, 0, 0);
                  }
              });

              window.addEventListener('pointermove', (e) => {
                  if (!isYoinking || isExploded || !entityGroup) return;

                  const rect = canvasContainer.getBoundingClientRect();
                  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                  raycaster.setFromCamera(pointer, camera);
                  const target = new THREE.Vector3();
                  if (raycaster.ray.intersectPlane(dragPlane, target)) {
                      const newPos = target.sub(dragOffset);
                      
                      entityVelocity.copy(newPos).sub(entityGroup.position);
                      if (entityVelocity.length() > 3) entityVelocity.setLength(3);
                      entityGroup.position.copy(newPos);
                      
                      entityAngularVelocity.x = entityVelocity.y * 0.05;
                      entityAngularVelocity.y = entityVelocity.x * 0.05;
                  }
              });

              window.addEventListener('pointerup', () => {
                  if (isYoinking) isYoinking = false;
              });

              window.addEventListener('resize', () => {
                  if(!camera || !renderer) return;
                  camera.aspect = canvasContainer.clientWidth / canvasContainer.clientHeight;
                  camera.updateProjectionMatrix();
                  renderer.setSize(canvasContainer.clientWidth, canvasContainer.clientHeight);
              });

              animate();
          }

          function buildPhysicsEntity() {
              if(entityGroup) scene.remove(entityGroup);
              pixelBlocks.forEach(b => scene.remove(b.mesh));
              pixelBlocks = [];
              isExploded = false;
              isYoinking = false;

              entityVelocity.set(0, 0, 0);
              entityAngularVelocity.set(0, 0, 0);

              entityGroup = new THREE.Group();
              
              // Dynamically scale down large grids to fit within the same physical space
              const maxDim = Math.max(GRID_COLS, GRID_ROWS);
              currentBlockSize = 16 / maxDim; 
              
              const offsetX = (GRID_COLS * currentBlockSize) / 2 - (currentBlockSize / 2);
              const offsetY = (GRID_ROWS * currentBlockSize) / 2 - (currentBlockSize / 2);

              const boxGeo = new THREE.BoxGeometry(currentBlockSize, currentBlockSize, currentBlockSize);

              for (let r = 0; r < GRID_ROWS; r++) {
                  for (let c = 0; c < GRID_COLS; c++) {
                      const index = r * GRID_COLS + c;
                      const color = gridData[index];
                      if (color && inShape(c, r, currentShape, GRID_COLS, GRID_ROWS)) {
                          const material = new THREE.MeshLambertMaterial({ color: color });
                          const mesh = new THREE.Mesh(boxGeo, material);
                          
                          // Disable wireframes on very high resolutions to prevent heavy visual clutter
                          if (maxDim <= 32) {
                              const edges = new THREE.EdgesGeometry(boxGeo);
                              const lineOpacity = maxDim > 16 ? 0.3 : 1.0;
                              const lineMat = new THREE.LineBasicMaterial({ 
                                  color: 0x000000, 
                                  transparent: true, 
                                  opacity: lineOpacity 
                              });
                              const line = new THREE.LineSegments(edges, lineMat);
                              mesh.add(line);
                          }

                          mesh.position.x = (c * currentBlockSize) - offsetX;
                          mesh.position.y = -((r * currentBlockSize) - offsetY);
                          mesh.position.z = 0;

                          entityGroup.add(mesh);

                          pixelBlocks.push({
                              mesh: mesh,
                              velocity: new THREE.Vector3(0, 0, 0),
                              rotationSpeed: new THREE.Vector3(0, 0, 0)
                          });
                      }
                  }
              }
              
              entityGroup.position.set(0, 15, 0);
              scene.add(entityGroup);
          }

          function triggerExplosion() {
              if(isExploded || !entityGroup) return;
              isExploded = true;
              isYoinking = false;

              const worldPositions = [];
              pixelBlocks.forEach(block => {
                  const pos = new THREE.Vector3();
                  block.mesh.getWorldPosition(pos);
                  worldPositions.push(pos);
              });

              pixelBlocks.forEach((block, i) => {
                  scene.add(block.mesh);
                  block.mesh.position.copy(worldPositions[i]);
                  block.mesh.rotation.copy(entityGroup.rotation);

                  const angle = Math.random() * Math.PI * 2;
                  const speed = Math.random() * 0.6 + 0.3;

                  block.velocity.x = (block.mesh.position.x - entityGroup.position.x) * 0.05 + Math.cos(angle) * speed + (entityVelocity.x * 0.5);
                  block.velocity.y = Math.random() * 0.5 + 0.3 + (entityVelocity.y * 0.5);
                  block.velocity.z = (block.mesh.position.z - entityGroup.position.z) * 0.05 + Math.sin(angle) * speed + (Math.random() - 0.5) + (entityVelocity.z * 0.5);

                  block.rotationSpeed.x = (Math.random() - 0.5) * 0.2 + entityAngularVelocity.x;
                  block.rotationSpeed.y = (Math.random() - 0.5) * 0.2 + entityAngularVelocity.y;
                  block.rotationSpeed.z = (Math.random() - 0.5) * 0.2 + entityAngularVelocity.z;
              });

              scene.remove(entityGroup);
          }

          function animate() {
              animationId = requestAnimationFrame(animate);
              const floorY = -15;

              if(isExploded) {
                  pixelBlocks.forEach(block => {
                      block.velocity.y -= 0.02;

                      block.mesh.position.add(block.velocity);
                      block.mesh.rotation.x += block.rotationSpeed.x;
                      block.mesh.rotation.y += block.rotationSpeed.y;
                      block.mesh.rotation.z += block.rotationSpeed.z;

                      if(block.mesh.position.y - (currentBlockSize / 2) < floorY) {
                          block.mesh.position.y = floorY + (currentBlockSize / 2);
                          block.velocity.y *= -0.6;
                          block.velocity.x *= 0.8;
                          block.velocity.z *= 0.8;
                      }
                  });
              } else if (entityGroup) {
                  if (!isYoinking) {
                      entityVelocity.y -= 0.02; 
                      
                      entityGroup.position.add(entityVelocity);
                      entityGroup.rotation.x += entityAngularVelocity.x;
                      entityGroup.rotation.y += entityAngularVelocity.y;
                      entityGroup.rotation.z += entityAngularVelocity.z;

                      entityAngularVelocity.multiplyScalar(0.98);

                      const groupHeight = GRID_ROWS * currentBlockSize;
                      const groupBottom = entityGroup.position.y - (groupHeight / 2); 
                      
                      if (groupBottom < floorY) {
                          if (autoExplode && entityVelocity.y < -0.1) {
                              entityGroup.position.y = floorY + (groupHeight / 2);
                              triggerExplosion();
                          } else {
                              entityGroup.position.y = floorY + (groupHeight / 2);
                              entityVelocity.y *= -0.6;
                              entityVelocity.x *= 0.8;
                              entityVelocity.z *= 0.8;
                              
                              if(Math.abs(entityVelocity.y) > 0.1) {
                                  entityAngularVelocity.z += (Math.random() - 0.5) * 0.05;
                                  entityAngularVelocity.x += (Math.random() - 0.5) * 0.05;
                              }
                          }
                      }

                      if (entityGroup.position.length() > 200) {
                          entityGroup.position.set(0, 15, 0);
                          entityVelocity.set(0, 0, 0);
                          entityAngularVelocity.set(0, 0, 0);
                          entityGroup.rotation.set(0, 0, 0);
                      }
                  }
              }

              renderer.render(scene, camera);
          }

          // --- VIEW MANAGEMENT ---
          const viewDraw = document.getElementById('view-draw');
          const viewPhysics = document.getElementById('view-physics');
          const btnBack = document.getElementById('btn-back');
          const btnExplode = document.getElementById('btn-explode');

          btnGenerate.addEventListener('click', () => {
              if(!gridData.some(c => c !== null)) {
                  alert("Grid is empty. Paint structure first.");
                  return;
              }

              viewDraw.classList.remove('view-active');
              viewDraw.classList.add('view-hidden');

              setTimeout(() => {
                  viewPhysics.classList.remove('view-hidden');
                  viewPhysics.classList.add('view-active');
                  initPhysics();
                  buildPhysicsEntity();
              }, 200);
          });

          btnBack.addEventListener('click', () => {
              viewPhysics.classList.remove('view-active');
              viewPhysics.classList.add('view-hidden');

              setTimeout(() => {
                  viewDraw.classList.remove('view-hidden');
                  viewDraw.classList.add('view-active');

                  if(scene && entityGroup) scene.remove(entityGroup);
                  pixelBlocks.forEach(b => scene.remove(b.mesh));
                  pixelBlocks = [];
                  isExploded = false;
                  isYoinking = false;
              }, 200);
          });

          btnExplode.addEventListener('click', triggerExplosion);
      });
    </script>
  </body>
</html>
