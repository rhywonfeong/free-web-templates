<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Geniale Quatsch Seite</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    .spin-slow {
      animation: spin 4s linear infinite;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .wiggle {
      animation: wiggle 0.7s infinite;
    }
    .rainbow-text {
      background: linear-gradient(90deg, #ff0080, #7928ca, #00cfff, #ffeb3b, #34d399, #ff0080);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rainbow 4s ease-in-out infinite;
    }
    @keyframes rainbow {
      0%,100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
  </style>
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-tr from-yellow-200 via-pink-100 to-blue-200 min-h-screen flex flex-col items-center justify-center">

  <h1 class="text-5xl font-extrabold rainbow-text mb-6 wiggle">GENIALE QUATSCH SEITE</h1>
  
  <div class="flex flex-col items-center space-y-8">
    <button onclick="alert('🎉 Überraschung! Du bist jetzt Quatsch-Meister! 🦄')" class="px-6 py-3 bg-pink-500 text-white font-bold rounded-full shadow-lg transform hover:scale-110 transition-all duration-300 focus:outline-none ring-4 ring-pink-300">
      Drück mich für Quatsch!
    </button>
    
    <div class="flex space-x-6">
      <div class="bg-white rounded-full shadow-xl p-6 border-4 border-dashed border-yellow-400 spin-slow">
        <img src="https://em-content.zobj.net/source/microsoft-teams/337/unicorn_1f984.png" alt="Einhorn" class="w-16 h-16">
      </div>
      <div class="bg-white rounded-full shadow-xl p-6 border-4 border-dotted border-pink-400 animate-bounce">
        <img src="https://em-content.zobj.net/source/microsoft-teams/337/potato_1f954.png" alt="Kartoffel" class="w-16 h-16">
      </div>
      <div class="bg-white rounded-full shadow-xl p-6 border-4 border-double border-blue-400 animate-pulse">
        <img src="https://em-content.zobj.net/source/microsoft-teams/337/doughnut_1f369.png" alt="Donut" class="w-16 h-16">
      </div>
    </div>

    <div class="mt-10 bg-white bg-opacity-80 rounded-xl shadow-lg p-8 max-w-xl text-center">
      <p class="text-xl font-semibold text-gray-800 mb-4">Willkommen auf der sinnlosesten Seite des Internets!</p>
      <p class="text-lg text-pink-500">Hier gibt es nichts zu holen, aber viel zu lachen.</p>
      <p class="mt-3 text-blue-600 font-mono">Fun Fact: <span id="funfact" class="underline cursor-pointer">Klicke hier für Unsinn!</span></p>
      <p id="fact-result" class="mt-2 text-green-700 font-bold"></p>
    </div>

    <div class="mt-8 flex space-x-4">
      <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank"
         class="px-4 py-2 bg-yellow-400 rounded-lg font-bold shadow-lg hover:bg-yellow-300 transition-all duration-300">
        Überraschungs-Link 🎲
      </a>
      <button onclick="confetti()" class="px-4 py-2 bg-blue-400 text-white rounded-lg font-bold shadow-lg hover:bg-blue-300 transition-all duration-300">
        Konfetti! 🎉
      </button>
    </div>
  </div>

  <canvas id="konfetti" class="fixed inset-0 pointer-events-none" style="z-index: 100; display: none;"></canvas>

  <script>
    // Unsinnige Fun Facts
    const facts = [
      "Bananen wachsen nach oben, nicht nach unten.",
      "Ein Einhorn kann rückwärts tanzen, aber nur im Regen.",
      "Kartoffeln enthalten 0% WLAN.",
      "Donuts haben geheime Portale im Inneren.",
      "Wenn du diese Seite verlässt, wirst du kurz ein Lama sein.",
      "Quatsch ist die beste Energiequelle für Kreativität.",
      "Dieses Einhorn wurde aus Regenbogen gebaut."
    ];
    document.getElementById('funfact').onclick = function() {
      const fact = facts[Math.floor(Math.random()*facts.length)];
      document.getElementById('fact-result').textContent = fact;
    };

    // Einfaches Konfetti
    function confetti() {
      const canvas = document.getElementById('konfetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.display = 'block';
      const pieces = [];
      const colors = ['#ff0080','#7928ca','#00cfff','#ffeb3b','#34d399','#fbbf24','#f87171','#4c51bf'];
      for(let i=0;i<120;i++) {
        pieces.push({
          x: Math.random()*canvas.width,
          y: Math.random()*canvas.height/2,
          r: Math.random()*8+4,
          c: colors[Math.floor(Math.random()*colors.length)],
          s: Math.random()*2+1,
          a: Math.random()*2*Math.PI
        });
      }
      let t=0;
      function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        for(let p of pieces) {
          ctx.save();
          ctx.translate(p.x,p.y);
          ctx.rotate(p.a);
          ctx.fillStyle = p.c;
          ctx.beginPath();
          ctx.arc(0,0,p.r,0,2*Math.PI);
          ctx.fill();
          ctx.restore();
          p.y += p.s + Math.sin(t/10+p.x/100)*0.7;
          p.x += Math.sin(t/15+p.y/100)*1.2;
        }
        t++;
        if(t<120) requestAnimationFrame(draw);
        else setTimeout(()=>canvas.style.display='none', 700);
      }
      draw();
    }
  </script>
</body>
</html>
