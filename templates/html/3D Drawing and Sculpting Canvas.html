    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced 3D Drawing Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }
        .brush-preview {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid white;
            display: inline-block;
            margin-left: 10px;
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
            cursor: crosshair;
        }
        .tool-btn {
            transition: all 0.3s ease;
        }
        .tool-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .tool-btn.active {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }
    </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Left Control Panel -->
    <div class="fixed top-4 left-4 z-50 glass-effect p-6 rounded-2xl text-white min-w-64">
        <h2 class="text-xl font-bold mb-4 text-center">3D Drawing Studio</h2>
        
        <!-- Drawing Tools -->
        <div class="mb-6">
            <label class="block text-sm font-medium mb-2">Drawing Tools</label>
            <div class="grid grid-cols-2 gap-2">
                <button id="brushTool" class="tool-btn active bg-blue-600 hover:bg-blue-700 px-3 py-2 rounded-lg text-sm">Brush</button>
                <button id="eraserTool" class="tool-btn bg-gray-600 hover:bg-gray-700 px-3 py-2 rounded-lg text-sm">Eraser</button>
                <button id="lineTool" class="tool-btn bg-gray-600 hover:bg-gray-700 px-3 py-2 rounded-lg text-sm">Line</button>
                <button id="sphereTool" class="tool-btn bg-gray-600 hover:bg-gray-700 px-3 py-2 rounded-lg text-sm">Sphere</button>
            </div>
        </div>

        <!-- Color Palette -->
        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Color</label>
            <div class="flex items-center">
                <input type="color" id="colorPicker" value="#ff6b6b" class="w-12 h-8 rounded-lg border-0 cursor-pointer">
                <div id="brushPreview" class="brush-preview ml-3" style="background-color: #ff6b6b;"></div>
            </div>
            <div class="grid grid-cols-6 gap-1 mt-2">
                <div class="w-6 h-6 rounded cursor-pointer bg-red-500" data-color="#ef4444"></div>
                <div class="w-6 h-6 rounded cursor-pointer bg-blue-500" data-color="#3b82f6"></div>
                <div class="w-6 h-6 rounded cursor-pointer bg-green-500" data-color="#10b981"></div>
                <div class="w-6 h-6 rounded cursor-pointer bg-yellow-500" data-color="#f59e0b"></div>
                <div class="w-6 h-6 rounded cursor-pointer bg-purple-500" data-color="#8b5cf6"></div>
                <div class="w-6 h-6 rounded cursor-pointer bg-pink-500" data-color="#ec4899"></div>
            </div>
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium mb-2">Depth: <span id="depthValue">20.0</span></label>
            <input type="range" id="depthSlider" min="-20" max="20" value="20" step="0.5" class="w-full">
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium mb-2">Opacity: <span id="opacityValue">100%</span></label>
            <input type="range" id="opacitySlider" min="10" max="100" value="100" step="5" class="w-full">
        </div>

        <!-- Action Buttons -->
        <div class="space-y-2">
            <button id="undoBtn" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded-lg font-medium">Undo</button>
            <button id="clearBtn" class="w-full bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium">Clear All</button>
            <button id="saveBtn" class="w-full bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium">Save Image</button>
        </div>
    </div>

    <!-- Right Info Panel -->
    <div class="fixed top-4 right-4 z-50 glass-effect p-4 rounded-2xl text-white">
        <h3 class="font-bold mb-2">Controls</h3>
        <div class="text-xs space-y-1">
            <div>🖱️ Left Click: Draw</div>
            <div>🖱️ Right Drag: Rotate View</div>
            <div>🖱️ Scroll: Zoom</div>
            <div>⌨️ Space: Reset Camera</div>
        </div>
        <div class="mt-3 pt-3 border-t border-white border-opacity-20">
            <div class="text-xs">Strokes: <span id="strokeCount">0</span></div>
            <div class="text-xs">FPS: <span id="fpsCounter">60</span></div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, raycaster, mouse;
        let isDrawing = false;
        let currentStroke = null;
        let strokes = [];
        let currentTool = 'brush';
        let cameraControls = { mouseX: 0, mouseY: 0, distance: 15 };
        const defaultBrushSize = 2.0; // Fixed brush size
        
        // Performance monitoring
        let fps = 0;
        let lastTime = performance.now();
        
        // Get DOM elements
        const colorPicker = document.getElementById('colorPicker');
        const depthSlider = document.getElementById('depthSlider');
        const opacitySlider = document.getElementById('opacitySlider');
        const brushPreview = document.getElementById('brushPreview');
        const depthValue = document.getElementById('depthValue');
        const opacityValue = document.getElementById('opacityValue');
        const strokeCount = document.getElementById('strokeCount');
        const fpsCounter = document.getElementById('fpsCounter');
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog = new THREE.Fog(0x0a0a0a, 10, 100);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 15);
            
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                preserveDrawingBuffer: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            setupLighting();
            setupEventListeners();
            setupGrid();
            animate();
        }
        
        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0x667eea, 0.5, 100);
            pointLight.position.set(-10, -10, 10);
            scene.add(pointLight);
        }
        
        function setupGrid() {
            const gridHelper = new THREE.GridHelper(50, 50, 0x333333, 0x111111);
            gridHelper.position.y = -10;
            scene.add(gridHelper);
        }
        
        function setupEventListeners() {
            const canvas = renderer.domElement;
            
            // Mouse events
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('wheel', onWheel);
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            
            // Keyboard events
            document.addEventListener('keydown', onKeyDown);
            
            // UI events
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', () => selectTool(btn.id.replace('Tool', '')));
            });
            
            document.querySelectorAll('[data-color]').forEach(colorBtn => {
                colorBtn.addEventListener('click', () => {
                    const color = colorBtn.dataset.color;
                    colorPicker.value = color;
                    updateBrushPreview();
                });
            });
            
            colorPicker.addEventListener('input', updateBrushPreview);
            depthSlider.addEventListener('input', updateDepth);
            opacitySlider.addEventListener('input', updateOpacity);
            
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('clearBtn').addEventListener('click', clearAll);
            document.getElementById('saveBtn').addEventListener('click', saveImage);
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tool + 'Tool').classList.add('active');
            
            const canvas = renderer.domElement;
            canvas.style.cursor = tool === 'eraser' ? 'grab' : 'crosshair';
        }
        
        function updateBrushPreview() {
            brushPreview.style.backgroundColor = colorPicker.value;
        }
        
        function updateDepth() {
            depthValue.textContent = parseFloat(depthSlider.value).toFixed(1);
        }
        
        function updateOpacity() {
            opacityValue.textContent = opacitySlider.value + '%';
        }
        
        function getMousePosition(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        }
        
        function getWorldPosition() {
            raycaster.setFromCamera(mouse, camera);
            const distance = parseFloat(depthSlider.value);
            return raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(distance));
        }
        
        function onMouseDown(event) {
            if (event.button === 0) {
                isDrawing = true;
                getMousePosition(event);
                
                if (currentTool === 'brush') {
                    startNewStroke();
                } else if (currentTool === 'sphere') {
                    createSphere();
                } else if (currentTool === 'eraser') {
                    eraseAtPosition();
                }
            }
        }
        
        function onMouseMove(event) {
            if (isDrawing && event.buttons === 1) {
                getMousePosition(event);
                if (currentTool === 'brush') {
                    addPointToStroke();
                } else if (currentTool === 'eraser') {
                    eraseAtPosition();
                }
            } else if (event.buttons === 2) {
                updateCameraRotation(event);
            }
        }
        
        function onMouseUp(event) {
            if (event.button === 0) {
                isDrawing = false;
                if (currentTool === 'brush') {
                    finishStroke();
                }
            }
        }
        
        function onWheel(event) {
            event.preventDefault();
            const delta = event.deltaY * 0.01;
            camera.position.multiplyScalar(1 + delta);
            camera.position.clampLength(5, 50);
        }
        
        function onKeyDown(event) {
            if (event.code === 'Space') {
                event.preventDefault();
                resetCamera();
            }
        }
        
        function updateCameraRotation(event) {
            const deltaX = event.movementX * 0.01;
            const deltaY = event.movementY * 0.01;
            
            const spherical = new THREE.Spherical();
            spherical.setFromVector3(camera.position);
            spherical.theta -= deltaX;
            spherical.phi += deltaY;
            spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
            
            camera.position.setFromSpherical(spherical);
            camera.lookAt(0, 0, 0);
        }
        
        function resetCamera() {
            camera.position.set(0, 0, 15);
            camera.lookAt(0, 0, 0);
        }
        
        function startNewStroke() {
            const worldPos = getWorldPosition();
            const color = new THREE.Color(colorPicker.value);
            const size = defaultBrushSize;
            const opacity = parseFloat(opacitySlider.value) / 100;
            
            // Create stroke geometry with points
            const points = [worldPos];
            const geometry = new THREE.BufferGeometry();
            
            // Create material that handles transparency properly
            const material = new THREE.MeshBasicMaterial({ 
                color: color,
                transparent: true,
                opacity: opacity,
                side: THREE.DoubleSide
            });
            
            currentStroke = {
                geometry: geometry,
                material: material,
                mesh: null,
                points: points,
                size: size,
                opacity: opacity,
                color: color,
                type: 'stroke'
            };
            
            updateStrokeGeometry();
        }
        
        function addPointToStroke() {
            if (!currentStroke) return;
            
            const worldPos = getWorldPosition();
            const lastPoint = currentStroke.points[currentStroke.points.length - 1];
            
            if (worldPos.distanceTo(lastPoint) > 0.05) {
                currentStroke.points.push(worldPos);
                updateStrokeGeometry();
            }
        }
        
        function updateStrokeGeometry() {
            if (!currentStroke || currentStroke.points.length < 1) return;
            
            // Remove old mesh
            if (currentStroke.mesh) {
                scene.remove(currentStroke.mesh);
            }
            
            // Create tube geometry for variable width brush strokes
            if (currentStroke.points.length >= 2) {
                const curve = new THREE.CatmullRomCurve3(currentStroke.points);
                const tubeGeometry = new THREE.TubeGeometry(curve, 
                    Math.max(2, currentStroke.points.length * 2), 
                    currentStroke.size * 0.1, 
                    8, 
                    false
                );
                
                currentStroke.mesh = new THREE.Mesh(tubeGeometry, currentStroke.material);
                scene.add(currentStroke.mesh);
            } else if (currentStroke.points.length === 1) {
                // Create a small sphere for single point
                const sphereGeometry = new THREE.SphereGeometry(currentStroke.size * 0.1, 8, 8);
                currentStroke.mesh = new THREE.Mesh(sphereGeometry, currentStroke.material);
                currentStroke.mesh.position.copy(currentStroke.points[0]);
                scene.add(currentStroke.mesh);
            }
        }
        
        function createSphere() {
            const worldPos = getWorldPosition();
            const color = new THREE.Color(colorPicker.value);
            const size = defaultBrushSize;
            const opacity = parseFloat(opacitySlider.value) / 100;
            
            const geometry = new THREE.SphereGeometry(size * 0.3, 16, 16);
            const material = new THREE.MeshLambertMaterial({ 
                color: color,
                transparent: true,
                opacity: opacity
            });
            
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.copy(worldPos);
            sphere.castShadow = true;
            sphere.receiveShadow = true;
            
            scene.add(sphere);
            strokes.push({ mesh: sphere, type: 'sphere' });
            updateStrokeCount();
        }
        
        function eraseAtPosition() {
            const worldPos = getWorldPosition();
            const eraseRadius = defaultBrushSize;
            
            strokes = strokes.filter(stroke => {
                if (stroke.type === 'sphere' && stroke.mesh) {
                    const distance = stroke.mesh.position.distanceTo(worldPos);
                    if (distance < eraseRadius) {
                        scene.remove(stroke.mesh);
                        return false;
                    }
                } else if (stroke.type === 'stroke' && stroke.mesh) {
                    // Simple distance check for stroke erasure
                    const strokeBox = new THREE.Box3().setFromObject(stroke.mesh);
                    const distance = strokeBox.distanceToPoint(worldPos);
                    if (distance < eraseRadius) {
                        scene.remove(stroke.mesh);
                        return false;
                    }
                }
                return true;
            });
            
            updateStrokeCount();
        }
        
        function finishStroke() {
            if (currentStroke && currentStroke.points.length > 0) {
                strokes.push(currentStroke);
                updateStrokeCount();
            }
            currentStroke = null;
        }
        
        function undo() {
            if (strokes.length > 0) {
                const lastStroke = strokes.pop();
                if (lastStroke.mesh) {
                    scene.remove(lastStroke.mesh);
                }
                updateStrokeCount();
            }
        }
        
        function clearAll() {
            strokes.forEach(stroke => {
                if (stroke.mesh) {
                    scene.remove(stroke.mesh);
                }
            });
            strokes = [];
            
            if (currentStroke && currentStroke.mesh) {
                scene.remove(currentStroke.mesh);
            }
            currentStroke = null;
            updateStrokeCount();
        }
        
        function saveImage() {
            const link = document.createElement('a');
            link.download = 'my-3d-drawing.png';
            link.href = renderer.domElement.toDataURL();
            link.click();
        }
        
        function updateStrokeCount() {
            strokeCount.textContent = strokes.length;
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Update FPS counter
            const currentTime = performance.now();
            fps = Math.round(1000 / (currentTime - lastTime));
            lastTime = currentTime;
            fpsCounter.textContent = fps;
            
            renderer.render(scene, camera);
        }
        
        // Initialize everything
        init();
        updateBrushPreview();
        updateDepth();
        updateOpacity();
    </script>
</body>
