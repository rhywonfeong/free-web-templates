<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" />
<title>Interactive Tags</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script></head>

<body class="min-h-screen flex items-center justify-center bg-[#0f1117] text-slate-100 font-inter antialiased">
  <div class="w-full max-w-xl px-6 py-10">
    <!-- Heading -->
    <h1 class="text-3xl font-semibold tracking-tight mb-6">Manage Tags</h1>
    <!-- Tag Input -->
    <div class="border border-slate-700 rounded-lg flex items-center px-4 py-2">
      <input id="tagInput" type="text" placeholder="Add tag…" 
             class="flex-1 bg-transparent outline-none placeholder-slate-500 text-slate-200" />
      <button id="addTagBtn" aria-label="Add tag"
              class="text-slate-400 hover:text-slate-200 transition-colors duration-150">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Divider -->
    <div class="my-6 h-px bg-slate-800"></div>

    <!-- Tags Container -->
    <div id="tagsWrapper" class="flex flex-wrap gap-3"></div>
  </div>

  <script>
    const tagsWrapper = document.getElementById('tagsWrapper');
    const tagInput    = document.getElementById('tagInput');
    const addTagBtn   = document.getElementById('addTagBtn');

    // Initial sample tags
    const tags = ['design', 'ui/ux', 'code', 'open-source'];

    // Render tags
    function renderTags() {
      tagsWrapper.innerHTML = '';
      tags.forEach((tag, index) => {
        const tagEl = document.createElement('span');
        tagEl.className =
          'inline-flex items-center gap-1.5 bg-slate-800 text-slate-200 text-sm font-medium px-3 py-1.5 rounded-full ' +
          'hover:ring-1 hover:ring-slate-500 transition-shadow duration-150';
        tagEl.innerHTML = `
          ${tag}
          <button data-index="${index}" class="hover:text-red-400 focus:outline-none">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        `;
        tagsWrapper.appendChild(tagEl);
      });
      lucide.replace({ strokeWidth: 1.5 });
      addDeleteListeners();
    }

    // Add delete handlers
    function addDeleteListeners() {
      tagsWrapper.querySelectorAll('button[data-index]').forEach(btn => {
        btn.onclick = e => {
          const i = e.currentTarget.getAttribute('data-index');
          tags.splice(i, 1);
          renderTags();
        }
      });
    }

    // Add new tag
    function addTag(val) {
      const trimmed = val.trim();
      if (trimmed && !tags.includes(trimmed)) {
        tags.push(trimmed);
        renderTags();
      }
      tagInput.value = '';
    }

    addTagBtn.onclick = () => addTag(tagInput.value);
    tagInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTag(tagInput.value);
    });

    // Initial render
    renderTags();
  </script>
</body>
</html>
