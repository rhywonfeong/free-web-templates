: function(callback) { return window.setTimeout(function() { callback(Date.now()); }, 16); };
const nativeCancelAnimationFrame = window.cancelAnimationFrame
? window.cancelAnimationFrame.bind(window)
: window.clearTimeout.bind(window);
const nativeSetInterval = window.setInterval.bind(window);

let nextFrameId = 1;
const frameRecords = new Map();
const pausedFrameCallbacks = new Map();
const style = document.createElement('style');

style.textContent = [
'html[data-aura-preview-paused="true"] *,',

'  transition-duration: 0s !important;',
'  scroll-behavior: auto !important;',

}

const args = Array.prototype.slice.call(arguments, 2);

const callbacks = Array.from(pausedFrameCallbacks.entries());

});

  <body class="min-h-screen bg-[#090a0c] text-white antialiased [font-family:Inter,ui-sans-serif,system-ui,sans-serif]">
    <main class="flex min-h-screen items-center justify-center px-4 py-10 sm:px-6 lg:px-8">
      <section class="w-full max-w-2xl">
        <div id="card" class="mx-auto w-full rounded-[1.75rem] border border-white/10 bg-[#0b0c0f]/70 p-3 shadow-2xl shadow-black/40 backdrop-blur sm:p-4">
          <div id="progressPanel" class="mb-4 hidden rounded-[1.25rem] border border-white/10 bg-white/[0.03] p-3 sm:p-4">
            <div class="mb-3 flex items-center justify-between gap-4">
              <div>
                <p id="stepLabel" class="text-xs font-medium text-white/55">
                  Krok 2 z 3
                </p>
                <h1 id="stepTitle" class="mt-1 text-xl font-medium tracking-tight text-white sm:text-2xl">
                  Uzupełnij dane
                </h1>
              </div>
              <div class="flex items-center gap-2" aria-label="Postęp formularza">
                <span id="dot1" class="h-2 w-2 rounded-full bg-emerald-400"></span>
                <span id="dot2" class="h-2 w-2 rounded-full bg-emerald-400"></span>
                <span id="dot3" class="h-2 w-2 rounded-full bg-white/20"></span>
              </div>
            </div>

            <div class="h-1.5 overflow-hidden rounded-full bg-white/10">
              <div id="progressBar" class="h-full w-2/3 rounded-full bg-gradient-to-r from-emerald-400 to-teal-500 transition-all duration-500"></div>
            </div>
          </div>

          <form id="reservationForm" class="flex w-full flex-col gap-3 sm:flex-row sm:items-center">
            <label class="sr-only" for="formInput" id="inputLabel">
              Wpisz numer telefonu
            </label>
            <div class="relative flex w-full flex-1 items-center">
              <input id="formInput" type="tel" autocomplete="tel" placeholder="Wpisz numer telefonu" class="min-h-14 w-full rounded-full border border-white/10 bg-[#07080a] pl-[138px] pr-5 text-xl font-normal tracking-tight text-white outline-none transition placeholder:text-[#767680] focus:border-emerald-400/50 focus:ring-4 focus:ring-emerald-400/10 sm:min-h-16 sm:pl-[148px] sm:pr-6 sm:text-2xl">
              <div id="countryCodeSelect" class="absolute inset-y-[1px] left-[1px] flex items-center pl-4 sm:pl-5 pr-1 pointer-events-none bg-white/5 rounded-l-full">
                <select name="countryCode" class="pointer-events-auto h-full bg-transparent text-white/90 focus:outline-none focus:ring-0 appearance-none pl-1 pr-6 cursor-pointer text-lg sm:text-xl border-none outline-none [&amp;>option]:bg-[#0b0c0f] [&amp;>option]:text-white" style="background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 0.3rem center; background-size: 0.7rem auto;">
                  <option value="+48" selected="">🇵🇱 +48</option>
                  <option value="+49">🇩🇪 +49</option>
                  <option value="+44">🇬🇧 +44</option>
                  <option value="+33">🇫🇷 +33</option>
                  <option value="+39">🇮🇹 +39</option>
                  <option value="+34">🇪🇸 +34</option>
                  <option value="+420">🇨🇿 +420</option>
                  <option value="+421">🇸🇰 +421</option>
                  <option value="+43">🇦🇹 +43</option>
                  <option value="+31">🇳🇱 +31</option>
                  <option value="+32">🇧🇪 +32</option>
                  <option value="+41">🇨🇭 +41</option>
                  <option value="+46">🇸🇪 +46</option>
                  <option value="+47">🇳🇴 +47</option>
                  <option value="+45">🇩🇰 +45</option>
                  <option value="+358">🇫🇮 +358</option>
                  <option value="+351">🇵🇹 +351</option>
                  <option value="+353">🇮🇪 +353</option>
                </select>
                <div class="h-6 w-px bg-white/10 ml-2"></div>
              </div>
            </div>
            <button id="ctaButton" type="submit" class="min-h-14 rounded-full bg-gradient-to-r from-emerald-400 to-teal-600 px-6 text-xl font-medium tracking-tight text-white shadow-2xl shadow-emerald-500/15 transition hover:brightness-110 focus:outline-none focus:ring-4 focus:ring-emerald-400/25 active:scale-[0.99] sm:min-h-16 sm:min-w-48 sm:px-8 sm:text-2xl">
              Zarezerwuj
            </button>
          </form>

          <div class="mt-4 flex items-start gap-3 rounded-[1.25rem] border border-emerald-400/20 bg-emerald-400/10 p-4 text-sm font-normal leading-relaxed text-emerald-50">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-emerald-400 text-[#07110c] shadow-lg shadow-emerald-500/20">
              <iconify-icon icon="ic:baseline-whatsapp" width="26" height="26" id="infoIcon"></iconify-icon>
            </div>
            <p id="infoText">
              Po wpisaniu numeru telefonu zostaniesz automatycznie przekierowany
              do Whatsapp.
              <br>
              Jeśli nie posiadasz WhatsApp, skontaktujemy się z Tobą
              telefonicznie.
            </p>
          </div>

          <div id="successMessage" class="mt-4 hidden rounded-[1.25rem] border border-emerald-400/20 bg-emerald-400/10 p-4 text-sm font-normal text-emerald-100">
            Dziękujemy. Twoja rezerwacja została przyjęta.
          </div>
        </div>
      </section>
    </main>

    <script>
      const form = document.getElementById("reservationForm");
      const input = document.getElementById("formInput");
      const label = document.getElementById("inputLabel");
      const button = document.getElementById("ctaButton");
      const progressPanel = document.getElementById("progressPanel");
      const stepLabel = document.getElementById("stepLabel");
      const stepTitle = document.getElementById("stepTitle");
      const progressBar = document.getElementById("progressBar");
      const successMessage = document.getElementById("successMessage");
      const infoText = document.getElementById("infoText");
      const infoIcon = document.getElementById("infoIcon");
      const dots = [
        document.getElementById("dot1"),
        document.getElementById("dot2"),
        document.getElementById("dot3")
      ];

      let step = 1;

      function updateDots(activeStep) {
        dots.forEach((dot, index) => {
          if (index < activeStep) {
            dot.className = "h-2 w-2 rounded-full bg-emerald-400";
          } else {
            dot.className = "h-2 w-2 rounded-full bg-white/20";
          }
        });
      }

      function goToStep(nextStep) {
        step = nextStep;
        input.value = "";
        successMessage.classList.add("hidden");

        if (step === 2) {
          progressPanel.classList.remove("hidden");
          stepLabel.textContent = "Krok 2 z 3";
          stepTitle.textContent = "Uzupełnij dane";
          progressBar.className = "h-full w-2/3 rounded-full bg-gradient-to-r from-emerald-400 to-teal-500 transition-all duration-500";
          updateDots(2);

          label.textContent = "Imię i nazwisko";
          input.type = "text";
          input.autocomplete = "name";
          input.placeholder = "Imię i nazwisko";
          button.textContent = "Zatwierdź";
          if (infoText) infoText.innerHTML = "Wpisz prawdziwe imię i nazwisko. Jest nam to potrzebne do późniejszego wystawienia certyfikatu jeśli się zdecydujesz wziąć udział w szkoleniu.";
          if (infoIcon) infoIcon.setAttribute("icon", "lucide:info");
          input.focus();
        }

        if (step === 3) {
          progressPanel.classList.remove("hidden");
          stepLabel.textContent = "Krok 3 z 3";
          stepTitle.textContent = "Potwierdź rezerwację";
          progressBar.className = "h-full w-full rounded-full bg-gradient-to-r from-emerald-400 to-teal-500 transition-all duration-500";
          updateDots(3);

          label.textContent = "Adres E-mail";
          input.type = "email";
          input.autocomplete = "email";
          input.placeholder = "Adres E-mail";
          button.textContent = "Zarezerwuj";
          if (infoText) infoText.innerHTML = "Zaraz zostaniesz automatycznie przekierowany do whatsapp. Jeśli nie posiadasz tej aplikacji to skontaktujemy się telefonicznie.";
          if (infoIcon) infoIcon.setAttribute("icon", "ic:baseline-whatsapp");
          input.focus();
        }
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (step === 1) {
          goToStep(2);
          return;
        }

        if (step === 2) {
          goToStep(3);
          return;
        }

        successMessage.classList.remove("hidden");
        button.textContent = "Zarezerwowano";
        input.blur();
      });
    </script>
  
</body></html>
