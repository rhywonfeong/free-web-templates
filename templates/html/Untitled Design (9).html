<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans"; }
/* hide native scrollbar on overflow for segmented control (visual polish) */
.scrollbar-none::-webkit-scrollbar { display: none; }
.scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
</style></head>
  <body class="antialiased text-slate-900 bg-white">
    <main class="mx-auto max-w-6xl px-4 sm:px-6 py-6">
      <header class="mb-5 flex items-center justify-between gap-4">
        <h1 class="text-[22px] sm:text-2xl tracking-tight font-semibold">Заявки</h1>
        <div class="hidden sm:flex items-center gap-3 text-sm text-slate-500">
          <span class="inline-flex items-center gap-1">
            <i data-lucide="activity" class="size-4"></i>
            обновлено 2 мин назад
          </span>
        </div>
      </header>

      <section class="flex items-center justify-between gap-4">
        <!-- Segmented tabs -->
        <div class="flex-1">
          <div class="w-full overflow-x-auto scrollbar-none">
            <div
              class="inline-flex items-center gap-1 rounded-2xl bg-slate-50 ring-1 ring-slate-200/80 shadow-sm p-1 h-12"
              role="tablist"
              aria-label="Статусы заявок"
            >
              <!-- Each tab uses the same pill style as the view toggle on the right -->
              <button
                role="tab"
                aria-selected="true"
                data-tab="актуальные"
                class="group relative inline-flex items-center gap-2 rounded-xl px-4 h-10 text-[15px] font-semibold tracking-tight bg-white text-slate-900 shadow-sm ring-1 ring-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 transition"
              >
                актуальные
                <span class="text-[11px] font-medium text-slate-400 -translate-y-0.5">97</span>
              </button>

              <button
                role="tab"
                aria-selected="false"
                data-tab="архив"
                class="group relative inline-flex items-center gap-2 rounded-xl px-4 h-10 text-[15px] font-medium tracking-tight text-slate-600 hover:text-slate-800 hover:bg-white/60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 transition"
              >
                архив
                <span class="text-[11px] font-medium text-slate-400 -translate-y-0.5">12552</span>
              </button>

              <button
                role="tab"
                aria-selected="false"
                data-tab="отклонены"
                class="group relative inline-flex items-center gap-2 rounded-xl px-4 h-10 text-[15px] font-medium tracking-tight text-slate-600 hover:text-slate-800 hover:bg-white/60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 transition"
              >
                отклонены
                <span class="text-[11px] font-medium text-slate-400 -translate-y-0.5">1444</span>
              </button>

              <button
                role="tab"
                aria-selected="false"
                data-tab="успешные сделки"
                class="group relative inline-flex items-center gap-2 rounded-xl px-4 h-10 text-[15px] font-medium tracking-tight text-slate-600 hover:text-slate-800 hover:bg-white/60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 transition"
              >
                успешные сделки
                <span class="text-[11px] font-medium text-slate-400 -translate-y-0.5">4</span>
              </button>

              <button
                role="tab"
                aria-selected="false"
                data-tab="все"
                class="group relative inline-flex items-center gap-2 rounded-xl px-4 h-10 text-[15px] font-medium tracking-tight text-slate-600 hover:text-slate-800 hover:bg-white/60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 transition"
              >
                все
                <span class="text-[11px] font-medium text-slate-400 -translate-y-0.5">16544</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Unified view toggle (same sizing, paddings, radius, active "pill" style) -->
        <div
          class="shrink-0 inline-flex items-center rounded-2xl bg-slate-50 ring-1 ring-slate-200/80 shadow-sm p-1 h-12"
          role="group"
          aria-label="Режим отображения"
        >
          <button
            type="button"
            data-view="list"
            aria-pressed="true"
            class="inline-flex items-center justify-center rounded-xl h-10 w-10 bg-white text-slate-900 shadow-sm ring-1 ring-slate-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 transition"
            title="Список"
          >
            <i data-lucide="list" class="size-5"></i>
          </button>
          <button
            type="button"
            data-view="grid"
            aria-pressed="false"
            class="inline-flex items-center justify-center rounded-xl h-10 w-10 text-slate-600 hover:text-slate-800 hover:bg-white/60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-400 transition"
            title="Сетка"
          >
            <i data-lucide="grid-3x3" class="size-5"></i>
          </button>
        </div>
      </section>

      <!-- Demo content to show selected state -->
      <section id="content" class="mt-6">
        <div class="rounded-xl border border-slate-200/70 p-4 sm:p-5">
          <div class="flex items-center justify-between gap-3">
            <p id="statusLabel" class="text-[15px] font-medium text-slate-700">
              Показаны: актуальные — вид «Список»
            </p>
            <span class="hidden sm:inline-flex items-center gap-1 text-[13px] text-slate-500">
              <i data-lucide="info" class="size-4"></i>
              подсказка: кликайте по вкладкам и иконкам справа
            </span>
          </div>
        </div>
      </section>
    </main>

    <script>
      lucide.createIcons();

      const tabContainer = document.querySelector('[role="tablist"]');
      const tabs = [...tabContainer.querySelectorAll('[role="tab"]')];
      const viewContainer = document.querySelector('[role="group"][aria-label="Режим отображения"]');
      const viewButtons = [...viewContainer.querySelectorAll('button[data-view]')];
      const statusLabel = document.getElementById('statusLabel');

      const activePill = ['bg-white','text-slate-900','shadow-sm','ring-1','ring-slate-200','font-semibold','tracking-tight'];
      const inactivePill = ['text-slate-600','hover:text-slate-800','hover:bg-white/60','font-medium','tracking-tight'];

      function setActiveTab(btn) {
        tabs.forEach(b => {
          b.setAttribute('aria-selected', 'false');
          b.classList.remove(...activePill);
          if (!b.classList.contains('ring-1')) b.classList.add('ring-0'); // no stray ring
          b.classList.add(...inactivePill);
        });
        btn.setAttribute('aria-selected', 'true');
        btn.classList.remove(...inactivePill);
        btn.classList.add(...activePill);
      }

      function setActiveView(btn) {
        viewButtons.forEach(b => {
          b.setAttribute('aria-pressed','false');
          b.classList.remove(...activePill);
          b.classList.add('text-slate-600','hover:text-slate-800','hover:bg-white/60');
        });
        btn.setAttribute('aria-pressed','true');
        btn.classList.remove('text-slate-600','hover:text-slate-800','hover:bg-white/60');
        btn.classList.add(...activePill);
      }

      tabs.forEach(btn => {
        btn.addEventListener('click', () => {
          setActiveTab(btn);
          const currentView = viewButtons.find(v => v.getAttribute('aria-pressed') === 'true')?.dataset.view || 'list';
          statusLabel.textContent = `Показаны: ${btn.dataset.tab} — вид «${currentView === 'list' ? 'Список' : 'Сетка'}»`;
        });
      });

      viewButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          setActiveView(btn);
          const currentTab = tabs.find(t => t.getAttribute('aria-selected') === 'true')?.dataset.tab || 'актуальные';
          statusLabel.textContent = `Показаны: ${currentTab} — вид «${btn.dataset.view === 'list' ? 'Список' : 'Сетка'}»`;
        });
      });
    </script>
  </body>
</html>
