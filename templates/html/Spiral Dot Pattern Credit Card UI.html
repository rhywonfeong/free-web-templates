  <meta charset="UTF-8" />
  <title>Animated Spiral Credit Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { 
      background: #111827; 
      margin: 0; 
      height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-family: 'Space Mono', monospace;
    }
    .chip {
      width: 40px;
      height: 30px;
      background: linear-gradient(135deg, #c7a94e 0%, #e6d395 50%, #c7a94e 100%);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }
    .chip::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(0,0,0,0.2);
    }
    .chip::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 1px;
      height: 100%;
      background: rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <div class="relative w-[360px] h-[220px] rounded-xl overflow-hidden shadow-2xl perspective-card">
    <!-- Card Background with SVG -->
    <div class="absolute inset-0 bg-gradient-to-br from-purple-900 via-indigo-800 to-blue-900">
      <svg width="360" height="220" viewBox="0 0 360 220" class="absolute inset-0">
        <g>
          <script type="application/ecmascript"><![CDATA[
            const svgNS = "http://www.w3.org/2000/svg";
            const N = 120, SIZE = 360, DOT_R = 0.8, MARGIN = 10;
            const CX = SIZE/2, CY = 220/2, MAX_R = Math.min(CX, CY) - MARGIN - DOT_R;
            const GOLDEN = Math.PI * (3 - Math.sqrt(5)), DUR = 3.5;
            for(let i=0; i<N; i++) {
              const frac = (i+0.5)/N;
              const r = Math.sqrt(frac) * MAX_R;
              const theta = (i+0.5) * GOLDEN;
              const x = CX + r*Math.cos(theta), y = CY + r*Math.sin(theta);
              const circle = document.createElementNS(svgNS,"circle");
              circle.setAttribute("cx",x);
              circle.setAttribute("cy",y);
              circle.setAttribute("r",DOT_R);
              circle.setAttribute("fill","#fff");
              circle.setAttribute("opacity","0.4");
              const animR = document.createElementNS(svgNS,"animate");
              animR.setAttribute("attributeName","r");
              animR.setAttribute("values",`${DOT_R*0.7};${DOT_R*1.4};${DOT_R*0.7}`);
              animR.setAttribute("dur",`${DUR}s`);
              animR.setAttribute("begin",`${frac*DUR}s`);
              animR.setAttribute("repeatCount","indefinite");
              animR.setAttribute("calcMode","spline");
              animR.setAttribute("keySplines","0.4 0 0.6 1;0.4 0 0.6 1");
              const animO = document.createElementNS(svgNS,"animate");
              animO.setAttribute("attributeName","opacity");
              animO.setAttribute("values","0.2;0.6;0.2");
              animO.setAttribute("dur",`${DUR}s`);
              animO.setAttribute("begin",`${frac*DUR}s`);
              animO.setAttribute("repeatCount","indefinite");
              animO.setAttribute("calcMode","spline");
              animO.setAttribute("keySplines","0.4 0 0.6 1;0.4 0 0.6 1");
              circle.appendChild(animR); circle.appendChild(animO);
              document.currentScript.parentNode.appendChild(circle);
            }
          ]]></script>
        </g>
      </svg>
    </div>
    
    <!-- Card Content -->
    <div class="absolute inset-0 p-6 flex flex-col justify-between text-white">
      <!-- Top Row -->
      <div class="flex justify-between items-start">
        <div class="chip"></div>
        <div class="text-right font-bold text-xl tracking-wider">COSMOS</div>
      </div>
      
      <!-- Card Number -->
      <div class="text-center tracking-widest text-xl mt-2">
        <span class="inline-block mx-1 opacity-90">4921</span>
        <span class="inline-block mx-1 opacity-90">8213</span>
        <span class="inline-block mx-1 opacity-90">5678</span>
        <span class="inline-block mx-1 opacity-90">9012</span>
      </div>
      
      <!-- Bottom Row -->
      <div class="flex justify-between items-end text-sm">
        <div>
          <div class="text-xs opacity-70">CARDHOLDER NAME</div>
          <div class="tracking-wider">JANE SMITH</div>
        </div>
        <div class="text-right">
          <div class="text-xs opacity-70">VALID THRU</div>
          <div>05/28</div>
        </div>
      </div>
    </div>
    
    <!-- Holographic Effect Overlay -->
    <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent opacity-30 pointer-events-none"></div>
  </div>
</body>
</html>
