<meta charset="UTF-8">

<title>Orienspace Parts Inspection</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>

::-webkit-scrollbar {
width: 8px;
height: 8px;
}

<body class="bg-black text-neutral-300 font-sans antialiased h-screen flex flex-col selection:bg-amber-500/30 selection:text-amber-500 overflow-hidden">

    <!-- Header / Window Bar -->
    <header class="h-16 border-b border-neutral-800 bg-neutral-950 flex items-center justify-between px-6 shrink-0 z-50">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 text-white">
                <span class="text-2xl font-semibold tracking-tight uppercase">Orienspace</span>
                <!-- Abstract Star/Asterisk Logo -->
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-white">
                    <path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z" fill="currentColor"></path>
                </svg>
            </div>
            <div class="h-6 w-px bg-neutral-800 mx-2"></div>
            <span class="text-lg font-medium text-white tracking-wide">零件检测平台</span>
        </div>
        
        <!-- Window Controls -->
        <div class="flex items-center gap-6 text-neutral-400">
            <button class="hover:text-white transition-colors">
                <i data-lucide="minus" stroke-width="1.5" class="w-5 h-5"></i>
            </button>
            <button class="hover:text-white transition-colors">
                <i data-lucide="square" stroke-width="1.5" class="w-4 h-4"></i>
            </button>
            <button class="hover:text-white transition-colors">
                <i data-lucide="x" stroke-width="1.5" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col p-6 gap-4 max-w-[1920px] mx-auto w-full h-full">

        <!-- Info & Metrics Bar (Above Video) -->
        <div class="flex items-center justify-between shrink-0 px-2">
            <!-- Left: Model Status -->
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-3">
                    <div class="relative flex items-center justify-center w-2.5 h-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-xs text-neutral-500 font-medium uppercase tracking-wider">当前模型</span>
                        <span class="text-sm text-white font-mono tracking-tight">best_v4.engine</span>
                    </div>
                </div>
            </div>

            <!-- Right: Metrics (FPS & Count) -->
            <div class="flex items-center gap-8">
                <!-- FPS -->
                <div class="flex items-baseline gap-2">
                    <span class="text-xs text-neutral-500 font-medium uppercase tracking-wider">FPS</span>
                    <span class="text-xl text-amber-500 font-mono font-bold tracking-tight">--</span>
                </div>
                
                <!-- Separator -->
                <div class="h-8 w-px bg-neutral-800"></div>

                <!-- Counts -->
                <div class="flex items-center gap-6">
                    <div class="flex flex-col items-end">
                        <span class="text-xs text-neutral-500 font-medium uppercase tracking-wider">总计</span>
                        <span class="text-base text-white font-mono font-medium">0</span>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-xs text-emerald-500/80 font-medium uppercase tracking-wider">合格</span>
                        <span class="text-base text-emerald-400 font-mono font-medium">0</span>
                    </div>
                    <div class="flex flex-col items-end">
                        <span class="text-xs text-rose-500/80 font-medium uppercase tracking-wider">NG</span>
                        <span class="text-base text-rose-400 font-mono font-medium">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Video Detection Area (Borderless & Expanded) -->
        <div class="flex-1 relative bg-neutral-900 w-full rounded-sm overflow-hidden group">
            
            <!-- Video Canvas Placeholder -->
            <div class="absolute inset-0 flex items-center justify-center bg-black">
                <!-- Subtle grid background -->
                <div class="absolute inset-0 bg-[linear-gradient(to_right,#1f1f1f_1px,transparent_1px),linear-gradient(to_bottom,#1f1f1f_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-20 pointer-events-none"></div>
                
                <!-- Scanlines effect -->
                <div class="absolute inset-0 bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.25)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] z-10 bg-[length:100%_4px,6px_100%] pointer-events-none opacity-20"></div>

                <!-- No Signal State -->
                <div class="flex flex-col items-center gap-3 z-20">
                    <i data-lucide="video-off" class="w-8 h-8 text-neutral-700"></i>
                    <span class="text-neutral-600 text-sm font-medium tracking-widest uppercase">无视频信号</span>
                </div>
            </div>

            <!-- Corner Markers (HUD Aesthetic) -->
            <div class="absolute top-4 left-4 w-4 h-4 border-l-2 border-t-2 border-white/20"></div>
            <div class="absolute top-4 right-4 w-4 h-4 border-r-2 border-t-2 border-white/20"></div>
            <div class="absolute bottom-4 left-4 w-4 h-4 border-l-2 border-b-2 border-white/20"></div>
            <div class="absolute bottom-4 right-4 w-4 h-4 border-r-2 border-b-2 border-white/20"></div>

        </div>

        <!-- Controls Footer -->
        <div class="shrink-0 pt-2 pb-2">
            <div class="grid grid-cols-4 gap-4 h-14">
                
                <!-- Select Video -->
                <button class="group relative bg-neutral-900 hover:bg-neutral-800 text-neutral-300 rounded-sm transition-all duration-200 border border-neutral-800 flex items-center justify-center overflow-hidden">
                    <span class="text-sm font-medium tracking-wide z-10">选择视频</span>
                </button>

                <!-- Open Camera -->
                <button class="group bg-neutral-900 hover:bg-neutral-800 text-neutral-300 rounded-sm transition-all duration-200 border border-neutral-800 flex items-center justify-center">
                    <span class="text-sm font-medium tracking-wide">打开摄像头</span>
                </button>

                <!-- Select Model -->
                <button class="group bg-neutral-900 hover:bg-neutral-800 text-neutral-300 rounded-sm transition-all duration-200 border border-neutral-800 flex items-center justify-center">
                    <span class="text-sm font-medium tracking-wide">切换模型</span>
                </button>

                <!-- Start Recognition -->
                <button class="group bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white rounded-sm transition-all duration-200 flex items-center justify-center shadow-[0_0_20px_rgba(37,99,235,0.1)]">
                    <div class="flex items-center gap-2">
                        <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                        <span class="text-sm font-medium tracking-wide">开始识别</span>
                    </div>
                </button>
            </div>
        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>

</body></html>
