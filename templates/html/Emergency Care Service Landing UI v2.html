<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physicians Premier Emergency Care</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        .logo-svg {
            max-width: 280px;
            height: auto;
        }
        
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        
        .animate-slide-up {
            animation: slideUp 0.8s ease-out forwards;
        }
        
        .animate-delay-200 {
            animation-delay: 0.2s;
        }
        
        .animate-delay-400 {
            animation-delay: 0.4s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-white font-sans">
    <!-- Main Container - 1200x630 -->
    <div class="w-[1200px] h-[630px] mx-auto bg-white flex overflow-hidden">
        
        <!-- Left Section - Image -->
        <div class="w-[600px] h-full relative animate-fade-in">
            <img src="https://images.unsplash.com/photo-1621619856624-42fd193a0661?w=2160&q=80" 
                 alt="Emergency care facility" 
                 class="w-full h-full object-cover">
            
            <!-- Overlay gradient for better text contrast -->
            <div class="absolute inset-0 bg-gradient-to-r from-transparent to-blue-900/10"></div>
        </div>
        
        <!-- Right Section - Content -->
        <div class="w-[600px] h-full bg-blue-600 flex flex-col relative">
            
            <!-- Header Logo Area -->
            <div class="bg-white px-8 py-6 border-b border-gray-100 animate-slide-up flex items-center justify-center">
                <!-- Physicians Premier Logo SVG -->
                <svg class="logo-svg" viewBox="0 0 400 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Medical Cross Icon -->
                    <rect x="10" y="25" width="30" height="30" rx="4" fill="#DC2626"/>
                    <rect x="22" y="30" width="6" height="20" fill="white"/>
                    <rect x="17" y="35" width="16" height="6" fill="white"/>
                    
                    <!-- PHYSICIANS Text -->
                    <text x="55" y="35" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#374151">PHYSICIANS</text>
                    
                    <!-- PREMIER Text with styling -->
                    <text x="55" y="55" font-family="Inter, sans-serif" font-size="16" font-weight="700">
                        <tspan fill="#2563EB">PREM</tspan><tspan fill="#DC2626">I</tspan><tspan fill="#DC2626">ER</tspan>
                    </text>
                    
                    <!-- Tagline -->
                    <text x="200" y="40" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#6B7280">EMERGENCY CENTERS</text>
                </svg>
            </div>
            
            <!-- Main Content Area -->
            <div class="flex-1 flex flex-col justify-center px-12 py-8">
                
                <!-- Date Banner -->
                <div class="bg-white/10 backdrop-blur-sm rounded-lg px-6 py-3 mb-8 text-center animate-slide-up animate-delay-200">
                    <div class="text-white/90 text-lg font-medium">
                        JUNE 9-13
                    </div>
                </div>
                
                <!-- Main Headline -->
                <h1 class="text-white text-4xl font-bold leading-tight mb-6 text-center animate-slide-up animate-delay-400">
                    Emergency care,<br>
                    designed with<br>
                    families in mind.
                </h1>
                
                <!-- Subtext -->
                <p class="text-white/90 text-lg text-center mb-8 leading-relaxed animate-slide-up animate-delay-400">
                    Skip the wait and receive concierge-level<br>
                    attention in our comfortable,<br>
                    state-of-the-art facility.
                </p>
                
                <!-- Call to Action -->
                <div class="text-center animate-slide-up animate-delay-400">
                    <button class="bg-white text-blue-600 font-semibold px-8 py-3 rounded-lg hover:bg-blue-50 transition-all duration-300 hover:shadow-lg transform hover:-translate-y-0.5">
                        Learn More About Our Services
                    </button>
                </div>
                
            </div>
            
            <!-- Bottom decorative element -->
            <div class="absolute bottom-0 right-0 w-32 h-32 bg-white/5 rounded-tl-full"></div>
            <div class="absolute top-1/2 right-0 w-2 h-24 bg-white/10 rounded-l-full"></div>
            
        </div>
        
    </div>

    <script>
        // Add entrance animations on load
        window.addEventListener('load', function() {
            const elements = document.querySelectorAll('.animate-slide-up, .animate-fade-in');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    el.style.transition = 'all 0.8s ease-out';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, index * 200);
            });
        });
    </script>
</body>
</html>
