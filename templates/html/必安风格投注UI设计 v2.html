<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>仿必安投注页面</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <!-- 顶部导航栏 -->
  <nav class="bg-white shadow sticky top-0 z-10">
    <div class="max-w-2xl mx-auto flex items-center justify-between px-6 py-3">
      <div class="flex items-center gap-2">
        <img src="https://s2.coinmarketcap.com/static/img/coins/64x64/1.png" alt="币安" class="w-7 h-7 rounded-full">
        <span class="font-bold text-lg text-gray-800">币安投注</span>
      </div>
      <button class="px-3 py-1 rounded text-sm bg-yellow-400 text-black hover:bg-yellow-300 transition">登录</button>
    </div>
  </nav>

  <!-- 投注盘口列表 -->
  <main class="flex-1 max-w-2xl mx-auto p-4 space-y-6">
    <section>
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-[16px] font-semibold text-gray-800">热门盘口</h2>
        <button class="text-sm text-blue-600 hover:underline">更多 ></button>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <!-- 盘口1 -->
        <div class="bg-white rounded-xl p-4 shadow hover:shadow-lg transition cursor-pointer border border-gray-200">
          <div class="flex items-center gap-2 mb-1">
            <span class="font-bold text-gray-900 text-[17px]">BTC/USDT</span>
            <span class="bg-green-100 text-green-600 rounded px-2 text-xs">涨</span>
          </div>
          <span class="block text-gray-500 text-sm mb-2">24h: 43,289.31</span>
          <div class="flex items-center gap-3">
            <span class="block text-gray-700 font-semibold">赔率 1.82</span>
            <span class="ml-auto text-xs text-gray-400">剩余: 03:22</span>
          </div>
        </div>
        <!-- 盘口2 -->
        <div class="bg-white rounded-xl p-4 shadow hover:shadow-lg transition cursor-pointer border border-gray-200">
          <div class="flex items-center gap-2 mb-1">
            <span class="font-bold text-gray-900 text-[17px]">ETH/USDT</span>
            <span class="bg-red-100 text-red-500 rounded px-2 text-xs">跌</span>
          </div>
          <span class="block text-gray-500 text-sm mb-2">24h: 2,712.87</span>
          <div class="flex items-center gap-3">
            <span class="block text-gray-700 font-semibold">赔率 1.95</span>
            <span class="ml-auto text-xs text-gray-400">剩余: 07:59</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 投注内容区 -->
    <section>
      <div class="bg-white rounded-lg p-5 shadow border border-gray-200">
        <h3 class="text-lg font-bold mb-4 text-gray-800 flex items-center gap-2">
          <img class="w-6 h-6 rounded-full" src="https://cryptologos.cc/logos/binance-coin-bnb-logo.png" alt="BNB">
          BNB/USDT - 涨跌投注
        </h3>
        <form class="space-y-4">
          <div>
            <label class="block text-sm text-gray-600 mb-1">选择方向</label>
            <div class="flex gap-3">
              <button type="button" class="flex-1 py-2 rounded border border-green-500 text-green-600 font-semibold bg-green-50 hover:bg-green-100">涨</button>
              <button type="button" class="flex-1 py-2 rounded border border-red-400 text-red-500 font-semibold bg-red-50 hover:bg-red-100">跌</button>
            </div>
          </div>
          <div>
            <label class="block text-sm text-gray-600 mb-1">投注金额 (USDT)</label>
            <input type="number" min="0" value="10" class="w-full py-2 px-3 rounded border border-gray-300 bg-gray-50 text-gray-700 focus:outline-none focus:ring-2 focus:ring-yellow-300"/>
          </div>
          <div class="flex items-center justify-between text-sm text-gray-700">
            <span>赔率: <span class="font-semibold text-gray-900">1.92</span></span>
            <span>预计奖励: <span class="font-semibold text-green-600">19.2 USDT</span></span>
          </div>
          <button class="w-full mt-1 py-3 bg-yellow-400 hover:bg-yellow-300 rounded-xl font-bold text-black text-lg transition">确认投注</button>
        </form>
      </div>
    </section>
  </main>

  <!-- 底部导航/按钮 -->
  <footer class="bg-white border-t sticky bottom-0 w-full shadow-inner">
    <div class="max-w-2xl mx-auto flex items-center justify-around py-3 px-4 text-gray-700 text-sm">
      <a href="#" class="flex flex-col items-center gap-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M3 12l2-2m0 0l7-7 7 7m-9 2v6m0 0H5a2 2 0 01-2-2v-7a2 2 0 012-2h3m6 10v-6m0 0l7 7-7-7z"></path>
        </svg>
        <span>首页</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1 text-yellow-500">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
          <path d="M5 20h14v-2H5m14-2v-2a2 2 0 00-2-2h-4V8a2 2 0 012-2h2a2 2 0 012 2v4h2v4m-2 4v-4h2v4h-2z"/>
        </svg>
        <span>投注</span>
      </a>
      <a href="#" class="flex flex-col items-center gap-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 4v16m8-8H4"></path>
        </svg>
        <span>我的</span>
      </a>
    </div>
  </footer>
</body>
</html>
