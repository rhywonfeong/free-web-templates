<!-- Fonts -->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Libraries -->

<style>
/* iOS-like Smoothing & Scroll */
body { -webkit-tap-highlight-color: transparent; user-select: none; overscroll-behavior-y: none; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
[x-cloak] { display: none !important; }
/* Grid Spacing Lock */
.app-grid {
display: grid;
grid-template-columns: repeat(4, minmax(0, 1fr));
gap: 1.5rem 0.5rem;
padding-bottom: 8rem;
}
@media (min-width: 640px) { .app-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2rem 1rem; } }
@media (min-width: 768px) { .app-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
@media (min-width: 1024px) { .app-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
@media (min-width: 1280px) { .app-grid { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
/* Icon Styling */
.ios-icon {
width: 60px; height: 60px;
border-radius: 12px;
position: relative;
overflow: hidden;
border: 1px solid rgba(255,255,255,0.08);
box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 8px rgba(0,0,0,0.3);
transition: transform 0.1s;
}
.ios-icon:active { transform: scale(0.95); }
/* Default dark background for standard apps only (folders handle their own) */
.app-icon-bg { background: linear-gradient(145deg, #1a1a1a, #0a0a0a); }
.folder-mini-grid {
display: grid;
grid-template-columns: repeat(3, 1fr);
grid-template-rows: repeat(3, 1fr);
gap: 2px;
padding: 8px;
width: 100%; height: 100%;
}
/* Gradient Mask for Bottom Fade */
.scroll-mask { mask-image: linear-gradient(to bottom, black 85%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%); }
/* Sortable Ghost */
.sortable-ghost { opacity: 0; }
.sortable-drag { opacity: 1; transform: scale(1.1); z-index: 50; }
/* Gallery Specific */
.gallery-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
gap: 0.5rem;
}
@media (min-width: 640px) { .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; } }
.gallery-vertical {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
gap: 1rem;
}
/* Custom Inputs */
.folder-title-input {
background: transparent;
border: none;
font-size: 1.5rem;
font-weight: 700;
color: white;
width: 100%;
outline: none;
}
.folder-title-input:focus { border-bottom: 1px solid rgba(255,255,255,0.2); }
</style></head>
<body class="bg-black text-white h-screen w-full overflow-hidden flex flex-col" x-data="livedesk()">

    <!-- AUTH MODAL -->
    <div x-show="authModalOpen" x-cloak class="fixed inset-0 z-[70] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/90 backdrop-blur-md" @click="authModalOpen = false" x-transition.opacity></div>
        <div class="relative w-full max-w-sm p-8 space-y-8 text-center bg-[#111] border border-gray-800 rounded-3xl shadow-2xl" 
             x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-10" x-transition:enter-end="opacity-100 translate-y-0">
            <button @click="authModalOpen = false" class="absolute top-4 right-4 text-gray-500 hover:text-white transition-colors">
                <span class="iconify text-2xl" data-icon="solar:close-circle-bold"></span>
            </button>
            <div class="space-y-2">
                <div class="w-16 h-16 mx-auto rounded-[16px] bg-gradient-to-b from-gray-800 to-black border border-gray-700 flex items-center justify-center shadow-2xl">
                    <span class="iconify text-3xl text-white" data-icon="solar:rocket-2-bold-duotone"></span>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">Sign In</h1>
                <p class="text-xs text-gray-500">Sync your apps across devices</p>
            </div>
            <div class="space-y-4">
                <button @click="signInGoogle" class="w-full py-3 bg-white text-black font-semibold rounded-xl flex items-center justify-center gap-2 hover:bg-gray-200 transition-colors">
                    <span class="iconify text-xl" data-icon="logos:google-icon"></span>
                    <span>Continue with Google</span>
                </button>
                <div class="relative py-2">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
                    <span class="relative bg-[#111] px-2 text-xs text-gray-500 uppercase">Or</span>
                </div>
                <form @submit.prevent="signInEmail" class="space-y-3">
                    <input type="email" x-model="email" placeholder="Email" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-white outline-none transition-colors">
                    <input type="password" x-model="password" placeholder="Password" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-white outline-none transition-colors">
                    <button type="submit" class="w-full py-3 bg-gray-800 text-white font-medium rounded-xl hover:bg-gray-700 transition-colors">
                        <span x-show="!authLoading">Sign In / Register</span>
                        <span x-show="authLoading" class="iconify animate-spin mx-auto" data-icon="solar:refresh-circle-bold-duotone"></span>
                    </button>
                    <p x-text="authError" class="text-red-500 text-xs h-4"></p>
                </form>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="h-full w-full relative bg-black">
       
        <!-- FIXED HEADER -->
        <header class="fixed top-0 left-0 right-0 h-16 px-4 md:px-8 flex items-center justify-between border-b border-white/5 bg-black/80 backdrop-blur-md z-40">
            <div class="flex items-center gap-4">
                <h1 class="text-lg font-bold tracking-tight text-white hidden md:block">LIVEDESKLAUNCHER <span class="text-xs text-gray-600 ml-1">v12</span></h1>
                <div class="flex bg-gray-900 rounded-lg p-1 border border-white/10">
                    <button @click="viewMode = 'grid'" :class="viewMode === 'grid' ? 'bg-gray-700 text-white' : 'text-gray-500 hover:text-gray-300'" class="p-1.5 rounded-md transition-colors">
                        <span class="iconify text-lg" data-icon="solar:widget-2-bold-duotone"></span>
                    </button>
                    <button @click="viewMode = 'list'" :class="viewMode === 'list' ? 'bg-gray-700 text-white' : 'text-gray-500 hover:text-gray-300'" class="p-1.5 rounded-md transition-colors">
                        <span class="iconify text-lg" data-icon="solar:list-bold-duotone"></span>
                    </button>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right leading-tight hidden sm:block">
                    <div class="text-sm font-bold text-white" x-text="time"></div>
                    <div class="text-[10px] font-medium text-gray-500 uppercase tracking-wide" x-text="date"></div>
                </div>
               
                <div class="flex items-center gap-3">
                    <button @click="handlePlusClick()" class="w-8 h-8 rounded-full bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                        <span class="iconify" data-icon="solar:add-circle-bold-duotone"></span>
                    </button>
                    <button @click="handleProfileClick()" class="relative group">
                        <div x-show="user" class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 overflow-hidden border border-white/20 ring-2 ring-green-500/20">
                            <!-- Fixed malformed URL from input code -->
                            <img x-show="user?.photoURL" :src="user?.photoURL" class="w-full h-full object-cover">
                            <div x-show="!user?.photoURL" class="w-full h-full flex items-center justify-center font-bold text-xs" x-text="user?.email?.[0].toUpperCase()"></div>
                        </div>
                        <div x-show="!user" class="w-9 h-9 rounded-full bg-gray-800 overflow-hidden border border-white/10 flex items-center justify-center hover:bg-gray-700 transition-colors">
                            <span class="iconify text-xl text-gray-400" data-icon="solar:user-circle-bold-duotone"></span>
                        </div>
                    </button>
                </div>
            </div>
        </header>

        <!-- SCROLLABLE CONTENT AREA -->
        <main class="absolute inset-0 pt-16 pb-0 overflow-hidden" @touchstart="handleTouchStart" @touchend="handleTouchEnd">
           
            <!-- GRID VIEW -->
            <div x-show="viewMode === 'grid'" class="h-full w-full relative" x-transition.opacity>
                <div class="h-full w-full relative">
                    <template x-for="pNum in pageNumbers" :key="pNum">
                        <div x-show="currentPage === pNum" class="absolute inset-0 overflow-y-auto no-scrollbar scroll-mask p-4 md:p-8" 
                             x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-x-10" x-transition:enter-end="opacity-100 translate-x-0">
                            <div class="max-w-7xl mx-auto min-h-full">
                                <div class="app-grid sortable-grid" :data-page="pNum">
                                    <template x-for="app in getAppsForPage(pNum)" :key="app.id">
                                        <div :data-id="app.id" class="relative flex flex-col items-center gap-1.5 rounded-xl transition-all cursor-pointer touch-manipulation group select-none app-item" @click="handleAppClick($event, app)" @contextmenu.prevent="openContext($event, app)">
                                           
                                            <!-- FOLDER ICON RENDER -->
                                            <template x-if="app.type === 'folder'">
                                                <div class="ios-icon flex flex-col z-10 p-0 backdrop-blur-md !bg-opacity-50" :class="app.bgColor || 'bg-[#1a1a1a]'">
                                                    <div class="folder-mini-grid">
                                                        <template x-for="subApp in (app.items || []).slice(0, 9)" :key="subApp.id">
                                                            <div class="w-full h-full rounded-[2px] overflow-hidden bg-black/50 flex items-center justify-center">
                                                                 <template x-if="subApp.icon.includes('data:') || subApp.icon.includes('http')">
                                                                    <img :src="subApp.icon" class="w-full h-full object-cover" @error="$el.src='https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=200&auto=format&fit=crop'">
                                                                </template>
                                                                <template x-if="!subApp.icon.includes('data:') && !subApp.icon.includes('http')">
                                                                    <span class="iconify text-[8px] text-white" :data-icon="subApp.icon"></span>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- GALLERY ICON RENDER (Shows contents like folder) -->
                                            <template x-if="app.type === 'gallery' || app.id === 'system-gallery'">
                                                 <div class="ios-icon flex flex-col z-10 p-0 bg-[#1a1a1a] overflow-hidden">
                                                     <!-- Grid of images -->
                                                     <div x-show="getGalleryPreviews(app.id).length > 0" class="folder-mini-grid">
                                                        <template x-for="item in getGalleryPreviews(app.id)" :key="item.id">
                                                            <div class="w-full h-full rounded-[2px] overflow-hidden bg-gray-900 relative">
                                                                <template x-if="item.type === 'image'">
                                                                    <img :src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/4734259a-bad7-422f-981e-ce01e79184f2_1600w.jpg" class="w-full h-full object-cover opacity-90" @error="$el.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=200&auto=format&fit=crop'">
                                                                </template>
                                                                 <template x-if="item.type === 'video'">
                                                                    <div class="w-full h-full flex items-center justify-center bg-gray-800">
                                                                        <video :src="item.data" class="w-full h-full object-cover opacity-60 pointer-events-none" muted></video>
                                                                        <span class="iconify text-[8px] text-white absolute z-10" data-icon="solar:play-bold"></span>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                     </div>
                                                     <!-- Fallback Icon if empty -->
                                                     <div x-show="getGalleryPreviews(app.id).length === 0" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-indigo-900/30 to-purple-900/30">
                                                         <span class="iconify text-3xl text-gray-500" :data-icon="app.icon || 'solar:gallery-bold-duotone'"></span>
                                                     </div>
                                                 </div>
                                            </template>

                                            <!-- NORMAL APP ICON RENDER -->
                                            <template x-if="app.type !== 'folder' && app.type !== 'gallery' && app.id !== 'system-gallery'">
                                                <div class="ios-icon app-icon-bg flex items-center justify-center z-10">
                                                    <template x-if="app.icon.includes('data:') || app.icon.includes('http')">
                                                        <img :src="app.icon" class="w-full h-full object-cover pointer-events-none" @error="$el.src='https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=200&auto=format&fit=crop'">
                                                    </template>
                                                    <template x-if="!app.icon.includes('data:') && !app.icon.includes('http')">
                                                        <span class="iconify text-3xl text-gray-200" :data-icon="app.icon"></span>
                                                    </template>
                                                </div>
                                            </template>

                                            <div class="flex flex-col items-center gap-0.5 text-center">
                                                <span class="text-[11px] font-bold text-white tracking-tight leading-tight truncate w-20" x-text="app.name"></span>
                                                <span :class="categoryColors[app.category] || categoryColors.default" class="text-[9px] font-medium uppercase leading-none truncate w-20" x-text="app.type === 'folder' ? 'Folder' : (app.type === 'gallery' ? 'Gallery' : (app.category || 'App'))"></span>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- LIST VIEW -->
            <div x-show="viewMode === 'list'" class="h-full overflow-y-auto p-4 md:p-8 no-scrollbar pb-32" x-cloak>
                <div id="list-sortable" class="max-w-4xl mx-auto space-y-3">
                    <template x-for="app in apps" :key="app.id">
                         <div :data-id="app.id" class="flex items-center gap-4 p-3 rounded-2xl bg-gray-900/50 border border-white/5 hover:bg-gray-800 transition-colors group cursor-pointer select-none" @click="handleAppClick($event, app)" @contextmenu.prevent="openContext($event, app)">
                             <!-- Icon Logic for List -->
                             <div class="w-12 h-12 rounded-[10px] bg-gray-800 flex items-center justify-center overflow-hidden flex-shrink-0 relative border border-white/5">
                                <template x-if="app.type === 'folder'">
                                    <div class="grid grid-cols-2 gap-0.5 p-1 w-full h-full">
                                        <template x-for="sub in (app.items||[]).slice(0,4)">
                                            <div class="bg-gray-600 rounded-[2px]"></div>
                                        </template>
                                    </div>
                                </template>
                                <template x-if="app.type === 'gallery' || app.id === 'system-gallery'">
                                     <div class="grid grid-cols-2 gap-0.5 p-1 w-full h-full">
                                         <template x-for="item in getGalleryPreviews(app.id).slice(0,4)">
                                             <div class="bg-gray-700 rounded-[2px] overflow-hidden">
                                                 <img x-show="item.type!=='video'" :src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/4734259a-bad7-422f-981e-ce01e79184f2_1600w.jpg" class="w-full h-full object-cover">
                                                 <div x-show="item.type==='video'" class="w-full h-full bg-gray-800"></div>
                                             </div>
                                         </template>
                                         <div x-show="getGalleryPreviews(app.id).length === 0" class="absolute inset-0 flex items-center justify-center">
                                             <span class="iconify text-xl text-gray-500" :data-icon="app.icon || 'solar:gallery-bold-duotone'"></span>
                                         </div>
                                    </div>
                                </template>
                                <template x-if="app.type !== 'folder' && app.type !== 'gallery' && app.id !== 'system-gallery'">
                                    <div>
                                        <template x-if="app.icon.includes('data:') || app.icon.includes('http')">
                                            <img :src="app.icon" class="w-full h-full object-cover" @error="$el.src='https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=200&auto=format&fit=crop'">
                                        </template>
                                        <template x-if="!app.icon.includes('data:') && !app.icon.includes('http')">
                                            <span class="iconify text-xl text-white" :data-icon="app.icon"></span>
                                        </template>
                                    </div>
                                </template>
                            </div>
                            <div class="flex-grow min-w-0">
                                <div class="flex items-center gap-2">
                                    <h3 class="font-bold text-white truncate text-sm" x-text="app.name"></h3>
                                    <span :class="categoryColors[app.category] || categoryColors.default" class="text-[10px] px-1.5 py-0.5 rounded bg-gray-800 border border-gray-700 font-medium uppercase" x-text="app.type === 'folder' ? 'Folder' : (app.type === 'gallery' ? 'Gallery' : app.category)"></span>
                                </div>
                                <p class="text-xs text-gray-500 truncate" x-text="app.type === 'folder' ? `${(app.items||[]).length} items` : (app.type === 'gallery' ? 'Media Collection' : app.url)"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </main>

        <!-- CREATE SELECTION MENU -->
        <div x-show="createMenuOpen" class="fixed inset-0 z-[100] flex items-center justify-center p-4" x-cloak>
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="createMenuOpen = false" x-transition.opacity></div>
            <div class="relative w-full max-w-sm bg-[#111] border border-gray-800 rounded-3xl p-6 shadow-2xl" 
                 x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-white">Create New</h2>
                    <button @click="createMenuOpen = false" class="text-gray-500 hover:text-white transition-colors">
                        <span class="iconify text-2xl" data-icon="solar:close-circle-bold"></span>
                    </button>
                </div>
                <div class="grid grid-cols-1 gap-3">
                    <button @click="selectCreateType('app')" class="flex items-center gap-4 p-4 rounded-xl bg-gray-900 border border-gray-800 hover:bg-gray-800 hover:border-gray-600 transition-all group text-left">
                        <div class="w-10 h-10 rounded-lg bg-blue-500/10 flex items-center justify-center text-blue-400 group-hover:bg-blue-500 group-hover:text-white transition-colors">
                            <span class="iconify text-xl" data-icon="solar:widget-add-bold-duotone"></span>
                        </div>
                        <div>
                            <div class="font-bold text-sm text-white">Application</div>
                            <div class="text-[10px] text-gray-500">Add a link or app icon</div>
                        </div>
                    </button>
                   
                    <button @click="selectCreateType('folder')" class="flex items-center gap-4 p-4 rounded-xl bg-gray-900 border border-gray-800 hover:bg-gray-800 hover:border-gray-600 transition-all group text-left">
                        <div class="w-10 h-10 rounded-lg bg-yellow-500/10 flex items-center justify-center text-yellow-400 group-hover:bg-yellow-500 group-hover:text-white transition-colors">
                            <span class="iconify text-xl" data-icon="solar:folder-with-files-bold-duotone"></span>
                        </div>
                        <div>
                            <div class="font-bold text-sm text-white">Folder</div>
                            <div class="text-[10px] text-gray-500">Group apps together</div>
                        </div>
                    </button>
                    <button @click="selectCreateType('gallery')" class="flex items-center gap-4 p-4 rounded-xl bg-gray-900 border border-gray-800 hover:bg-gray-800 hover:border-gray-600 transition-all group text-left">
                        <div class="w-10 h-10 rounded-lg bg-pink-500/10 flex items-center justify-center text-pink-400 group-hover:bg-pink-500 group-hover:text-white transition-colors">
                            <span class="iconify text-xl" data-icon="solar:gallery-bold-duotone"></span>
                        </div>
                        <div>
                            <div class="font-bold text-sm text-white">Gallery</div>
                            <div class="text-[10px] text-gray-500">Create separate media collection</div>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <!-- ADVANCED FOLDER MODAL -->
        <div x-show="folderModalOpen" class="fixed inset-0 z-[65] flex items-center justify-center" x-cloak>
             <div class="absolute inset-0 bg-black/60 backdrop-blur-xl" @click="closeFolder" x-transition.opacity></div>
             <div class="relative w-full max-w-3xl bg-[#111] border border-gray-800 rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[85vh] transition-all duration-300" 
                  x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 scale-90 translate-y-4" x-transition:enter-end="opacity-100 scale-100 translate-y-0">
               
                <!-- Folder Header -->
                <div class="w-full flex justify-between items-start p-6 pb-2 shrink-0 bg-gradient-to-b from-[#1a1a1a] to-transparent z-10">
                    <div class="flex flex-col w-full mr-4">
                        <input type="text" x-model="activeFolder.name" @blur="saveApps()" @keydown.enter="$el.blur()" class="folder-title-input mb-1" placeholder="Folder Name">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-500 font-mono uppercase tracking-wider" x-text="`${(activeFolder?.items || []).length} items`"></span>
                             <!-- Color Picker Inline (Added opacity variants) -->

                                <div class="grid grid-cols-5 gap-2 mt-2">

                                <input type="text" x-model="modalData.name" placeholder="My Gallery" class="w-full mt-1 bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500 outline-none">
                            </div>
                        </div>
                    </template>
                    <!-- APP EDITING UI -->
                    <template x-if="modalData.type !== 'folder' && modalData.type !== 'gallery'">
                        <div>
                            <div class="flex gap-5">
                                <div class="w-24 h-24 flex-shrink-0 rounded-[18px] bg-black border border-gray-700 flex items-center justify-center overflow-hidden relative group">
                                    <template x-if="modalData.icon && (modalData.icon.includes('data:') || modalData.icon.includes('http'))">
                                        <img :src="modalData.icon" class="w-full h-full object-cover" @error="$el.src='https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=200&auto=format&fit=crop'">
                                    </template>

                                    <div class="flex gap-3 text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">

                                    </div>
                                    <div x-show="iconTab === 'iconify'">
                                        <input type="text" x-model="modalData.icon" placeholder="e.g. solar:home-bold" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:border-indigo-500 outline-none">
                                    </div>
                                    <div x-show="iconTab === 'url'">
                                        <input type="text" @input="handleUrlInput($event)" placeholder="Paste Image URL or Google Drive Link" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:border-indigo-500 outline-none">
                                    </div>
                                    <div x-show="iconTab === 'upload'">
                                        <label class="flex items-center justify-center w-full py-2 bg-gray-800 border border-gray-700 rounded-lg cursor-pointer hover:bg-gray-700 transition-colors relative overflow-hidden">
                                            <span class="text-xs text-gray-300" x-text="uploading ? 'Resizing & Processing...' : 'Choose Image File'"></span>
                                            <input type="file" accept="image/*" @change="handleFileUpload" class="absolute inset-0 opacity-0 cursor-pointer">
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="space-y-4 mt-5">
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="text-[10px] font-bold text-gray-500 uppercase ml-1">Name *</label>
                                        <input type="text" x-model="modalData.name" class="w-full mt-1 bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500 outline-none">
                                    </div>
                                    <div>
                                        <label class="text-[10px] font-bold text-gray-500 uppercase ml-1">Category</label>
                                        <input type="text" list="cats" x-model="modalData.category" class="w-full mt-1 bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500 outline-none">
                                        <datalist id="cats">
                                            <option value="Google"></option><option value="Aura"></option><option value="Wix"></option><option value="Meta"></option><option value="Lucidchart">
                                        </datalist>

                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 uppercase ml-1">URL *</label>
                                    <input type="url" x-model="modalData.url" class="w-full mt-1 bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500 outline-none">
                                </div>

                        </div>
                    </template>
                </div>
                <div class="p-6 pt-2 border-t border-gray-800">
                    <button @click="saveModal" class="w-full py-3.5 bg-white text-black font-bold rounded-xl hover:bg-gray-200 transition-colors shadow-lg shadow-white/5">
                        <span x-text="modalMode === 'add' ? (modalData.type === 'folder' ? 'Create Folder' : 'Add Item') : 'Save Changes'"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCo0Rq6eABM3Q6le_x9VjskDCCAg1XUl8A",
            authDomain: "livedesklauncher.firebaseapp.com",
            projectId: "livedesklauncher",
            databaseURL: "https://livedesklauncher-default-rtdb.europe-west1.firebasedatabase.app",
            storageBucket: "livedesklauncher.firebasestorage.app",
            messagingSenderId: "719865623018",
            appId: "1:719865623018:web:104315b70c32db5bd4c293",
            measurementId: "G-N1XRVV5SNJ"
        };
       
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const DEFAULT_APPS = [
            { id: 'keep', name: 'Google Keep', url: 'https://keep.google.com/u/0/', icon: 'logos:google-keep', category: 'Google', index: 0 },
            { id: 'drive', name: 'Google Drive', url: 'https://drive.google.com/drive/u/0/my-drive', icon: 'solar:cloud-bold-duotone', category: 'Google', index: 1 },
            { id: 'notebooklm', name: 'NotebookLM', url: 'https://notebooklm.google.com/?authuser=4', icon: 'solar:book-2-bold-duotone', category: 'Google', index: 2 },
            { id: 'aura-ldl3b', name: 'Aura ldl3b', url: 'https://www.aura.build/editor/4da1e71e-d62d-42b1-ab9b-99e503ddaaa1', icon: 'solar:magic-wand-bold-duotone', category: 'Aura', index: 3 },
            { id: 'livedesklauncher', name: 'Livedesklauncher', url: 'https://ldl3b.aura.build/', icon: 'solar:rocket-2-bold-duotone', category: 'Aura', index: 4 },
            { id: 'oliverhoop-wix', name: 'Oliverhoop', url: 'http://www.oliverhoop.com/', icon: 'solar:globe-bold-duotone', category: 'Wix', index: 5 },
            { id: 'whatsapp', name: 'Whatsapp Web', url: 'https://web.whatsapp.com/', icon: 'solar:chat-round-dots-bold-duotone', category: 'Meta', index: 6 },
            { id: 'lucid-dashboard', name: 'Dashboard', url: 'https://lucid.app/documents#/home?folder_id=recent', icon: 'solar:widget-bold-duotone', category: 'Lucidchart', index: 7 },
            { id: 'herodeck', name: 'HERODECK_v6 (FRIENDS)2', url: 'https://lucid.app/lucidchart/ce938cc8-1601-4564-867d-75920d344de3/edit?invitationId=inv_46ae3e96-5bd1-49d6-8ee6-c647f08e61ae&page=j9iTxyKimT7X#', icon: 'solar:users-group-two-rounded-bold-duotone', category: 'Lucidchart', index: 8 },
            { id: 'ruggell', name: 'LIVEDESKLAUNCHER_RUGGELL_1 (live)', url: 'https://lucid.app/lucidchart/dd1c6298-8fed-48f2-b7ab-38004d7fa56c/edit?invitationId=inv_3c63131a-6505-4442-a000-2e08315a122b&page=wMo3WTnqL2Yy#', icon: 'solar:map-point-bold-duotone', category: 'Lucidchart', index: 9 },
            { id: 'iui', name: 'oliverhoop.com (IUI)_v1', url: 'https://lucid.app/lucidchart/3587ba21-f268-4bd3-b80d-9d60998abaea/edit?from_internal=true', icon: 'solar:code-square-bold-duotone', category: 'Lucidchart', index: 10 },
            { id: 'oliverhoop-lucid', name: 'OLIVERHOOP', url: 'https://lucid.app/lucidchart/dcc5537f-dbb9-4ffa-bd54-51774dc95a6b/edit?invitationId=inv_27766cf2-e335-4624-bb00-b960b8a252c1&pa', icon: 'solar:crown-star-bold-duotone', category: 'Lucidchart', index: 11 },
            { id: 'system-gallery', name: 'Photos', url: '#gallery', icon: 'solar:gallery-bold-duotone', category: 'System', index: 12 },
            { id: 'virtual-look-3', name: 'Virtual Look 3', url: '#virtual-look', icon: 'solar:hanger-2-bold-duotone', category: 'Virtual', index: 13 }
        ];
        document.addEventListener('alpine:init', () => {
            Alpine.data('livedesk', () => ({
                user: null,
                loading: true,
                authLoading: false,
                authModalOpen: false,
                email: '',
                password: '',
                authError: '',
               
                apps: [],
                pageNames: {},
                galleryItems: [],
                viewMode: 'grid',
                currentPage: 0,
                time: '',
                date: '',
                versionString: '',
               
                galleryOpen: false,
                activeGalleryId: null,
                galleryViewMode: 'grid',
                viewImage: null,
                virtualLookOpen: false,
               
                // Folder State
                folderModalOpen: false,
                activeFolder: null,
               
                // Import State
                showImportModal: false,
                importSelection: [],
                // Create Menu State
                createMenuOpen: false,
                contextOpen: false,
                contextApp: null,
                contextPos: { x: 0, y: 0 },
                contextIsInsideFolder: false,
               
                modalOpen: false,
                modalMode: 'add',
                modalData: {},
                modalAddingToFolder: false,
                iconTab: 'iconify',
                uploading: false,
               
                touchStartX: 0,
               
                categoryColors: {
                    'Google': 'text-sky-400',
                    'Aura': 'text-purple-400',
                    'Wix': 'text-pink-400',
                    'Meta': 'text-green-400',
                    'Lucidchart': 'text-orange-400',
                    'System': 'text-white',
                    'Virtual': 'text-purple-300',
                    'default': 'text-gray-500'
                },
                init() {
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);
                    const local = localStorage.getItem('ldl_apps');
                    this.processApps(local ? JSON.parse(local) : DEFAULT_APPS);
                    const localPages = localStorage.getItem('ldl_pages');
                    this.pageNames = localPages ? JSON.parse(localPages) : {};
                    const localGallery = localStorage.getItem('ldl_gallery_v6');
                    this.galleryItems = localGallery ? JSON.parse(localGallery) : [];
                    auth.onAuthStateChanged(u => {
                        this.user = u;
                        this.loading = false;
                        if (u) {
                            this.authModalOpen = false;
                            db.ref(`users/${u.uid}/apps`).on('value', s => {
                                const val = s.val();
                                this.processApps(val || DEFAULT_APPS);
                            });
                            db.ref(`users/${u.uid}/pageNames`).on('value', s => {
                                this.pageNames = s.val() || {};
                            });
                            db.ref(`users/${u.uid}/gallery_v6`).on('value', s => {
                                this.galleryItems = s.val() || [];
                            });
                        } else {
                            const local = localStorage.getItem('ldl_apps');
                            this.processApps(local ? JSON.parse(local) : DEFAULT_APPS);
                        }
                    });
                },
                processApps(data) {
                    let maxInd = 0;
                    this.apps = data.map((a, i) => {
                        if (a.index === undefined) a.index = i;
                        maxInd = Math.max(maxInd, a.index);
                        return a;
                    });
                    if(!this.apps.find(a => a.id === 'system-gallery')) {
                        this.apps.push({ id: 'system-gallery', name: 'Photos', url: '#gallery', icon: 'solar:gallery-bold-duotone', category: 'System', page: 0, index: 99 });
                    }
                    if(!this.apps.find(a => a.id === 'virtual-look-3')) {
                        this.apps.push({ id: 'virtual-look-3', name: 'Virtual Look 3', url: '#virtual-look', icon: 'solar:hanger-2-bold-duotone', category: 'Virtual', page: 0, index: 100 });
                    }
                    this.apps.sort((a,b) => (a.page||0) - (b.page||0) || a.index - b.index);
                   
                    // Update Active Folder if open
                    if(this.activeFolder) {
                        const updatedFolder = this.apps.find(a => a.id === this.activeFolder.id);
                        if(updatedFolder) {
                            this.activeFolder = updatedFolder;
                        }
                    }
                    this.$nextTick(() => {
                        this.initSortable();
                    });
                },
                updateTime() {
                    const n = new Date();
                    this.time = n.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                    this.date = n.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
                    const day = String(n.getDate()).padStart(2, '0');
                    const month = String(n.getMonth() + 1).padStart(2, '0');
                    const year = n.getFullYear();
                    let hours = n.getHours();
                    const ampm = hours >= 12 ? 'pm' : 'am';
                    hours = hours % 12; hours = hours ? hours : 12;
                    const strHours = String(hours).padStart(2, '0');
                    const minutes = String(n.getMinutes()).padStart(2, '0');
                    this.versionString = `ldl3b-6_v12_${day}.${month}.${year}_${strHours}:${minutes} ${ampm}`;
                },
                handleProfileClick() {
                    if (this.user) {
                        if(confirm('Log out?')) {
                            this.logout();
                        }
                    } else {
                        this.authModalOpen = true;
                    }
                },
                signInGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); },
                async signInEmail() {
                    this.authLoading = true; this.authError = '';
                    try { await auth.signInWithEmailAndPassword(this.email, this.password); }
                    catch { try { await auth.createUserWithEmailAndPassword(this.email, this.password); } catch(e){ this.authError = e.message; } }
                    this.authLoading = false;
                },
                logout() { auth.signOut(); },
                get pageNumbers() {
                    const max = Math.max(...this.apps.map(a => a.page || 0), 0);
                    const range = [];
                    for(let i=0; i<=max; i++) range.push(i);
                    return range;
                },
               
                getPageName(index) { return this.pageNames[index] || `PAGE ${index + 1}`; },
                updatePageName(index, value) { this.pageNames[index] = value; },
                prevPage() { if (this.currentPage > 0) this.currentPage--; },
                nextPage() {
                    const max = Math.max(...this.pageNumbers);
                    if (this.currentPage < max) this.currentPage++;
                },
               
                handleTouchStart(e) { this.touchStartX = e.changedTouches[0].screenX; },
                handleTouchEnd(e) {
                    const diff = this.touchStartX - e.changedTouches[0].screenX;
                    if (Math.abs(diff) > 50) {
                        if (diff > 0) this.nextPage(); else this.prevPage();
                    }
                },
                saveApps() {
                    if(this.activeFolder) {
                        const idx = this.apps.findIndex(a => a.id === this.activeFolder.id);
                        if(idx > -1) {
                            this.apps[idx] = this.activeFolder;
                        }
                    }
                    const data = JSON.parse(JSON.stringify(this.apps));
                    if (this.user) db.ref(`users/${this.user.uid}/apps`).set(data);
                    else localStorage.setItem('ldl_apps', JSON.stringify(data));
                },
                savePageNames() {
                    if (this.user) db.ref(`users/${this.user.uid}/pageNames`).set(this.pageNames);
                    else localStorage.setItem('ldl_pages', JSON.stringify(this.pageNames));
                },
                saveGallery() {
                     if (this.user) db.ref(`users/${this.user.uid}/gallery_v6`).set(this.galleryItems);
                    else localStorage.setItem('ldl_gallery_v6', JSON.stringify(this.galleryItems));
                },
                getAppsForPage(p) {
                    return this.apps.filter(a => (a.page || 0) === p).sort((a,b) => a.index - b.index);
                },
                get availableAppsForImport() {
                    return this.apps.filter(a => a.type !== 'folder' && a.id !== 'system-gallery' && a.type !== 'gallery' && a.id !== 'virtual-look-3');
                },
               
                get currentGalleryItems() {
                    // Filter items for the currently open gallery.
                    // Legacy items without galleryId belong to 'system-gallery'.
                    return this.galleryItems.filter(item => {
                         const gId = item.galleryId || 'system-gallery';
                         return gId === this.activeGalleryId;
                    });
                },
               
                getGalleryPreviews(id) {
                    const targetId = id === 'system-gallery' ? 'system-gallery' : id;
                    return this.galleryItems
                        .filter(i => (i.galleryId || 'system-gallery') === targetId)
                        .sort((a,b) => b.date - a.date)
                        .slice(0, 9);
                },
               
                get activeGalleryName() {
                     const app = this.apps.find(a => a.id === this.activeGalleryId);
                     return app ? app.name : 'Gallery';
                },
                toggleImport(id) {
                    if(this.importSelection.includes(id)) {
                        this.importSelection = this.importSelection.filter(i => i !== id);
                    } else {
                        this.importSelection.push(id);
                    }
                },
                confirmImport() {
                    if(!this.activeFolder) return;
                    const itemsToMove = this.apps.filter(a => this.importSelection.includes(a.id));
                    this.apps = this.apps.filter(a => !this.importSelection.includes(a.id));
                    if(!this.activeFolder.items) this.activeFolder.items = [];
                    this.activeFolder.items.push(...itemsToMove);
                    this.saveApps();
                    this.showImportModal = false;
                    this.importSelection = [];
                    this.$nextTick(() => { this.initFolderSortable(); });
                },
                handleAppClick(e, app) { this.launchApp(app); },
                launchApp(app) {
                    if(app.type === 'folder') {
                        this.openFolder(app);
                    } else if(app.type === 'gallery' || app.id === 'system-gallery' || app.url === '#gallery') {
                        this.activeGalleryId = app.id;
                        this.galleryOpen = true;
                    } else if (app.id === 'virtual-look-3') {
                        this.virtualLookOpen = true;
                    } else {
                        window.open(app.url, '_blank');
                    }
                },
                openFolder(folder) {
                    this.activeFolder = folder;
                    this.folderModalOpen = true;
                    this.$nextTick(() => {
                        this.initFolderSortable();
                    });
                },
                closeFolder() {
                    this.folderModalOpen = false;
                    this.activeFolder = null;
                },
                initFolderSortable() {
                    const el = document.getElementById('folder-sortable');
                    if(!el) return;
                    if(el._sortable) el._sortable.destroy();
                    el._sortable = new Sortable(el, {
                        group: 'folder-items',
                        animation: 200,
                        delay: 100,
                        delayOnTouchOnly: true,
                        draggable: '.folder-item',
                        onEnd: (evt) => {
                             const items = this.activeFolder.items || [];
                             const movedItem = items[evt.oldIndex];
                             items.splice(evt.oldIndex, 1);
                             items.splice(evt.newIndex, 0, movedItem);
                             this.activeFolder.items = items;
                             this.saveApps();
                        }
                    });
                },
                uploadGalleryItem(e) {
                    if(!this.activeGalleryId) return;
                    const files = e.target.files;
                    if (!files.length) return;
                    Array.from(files).forEach(file => {
                        const reader = new FileReader();
                        const isVideo = file.type.startsWith('video/');
                        reader.onload = (evt) => {
                            const result = evt.target.result;
                            const item = {
                                id: (isVideo ? 'vid_' : 'img_') + Date.now() + Math.random().toString(36).substr(2, 9),
                                galleryId: this.activeGalleryId,
                                type: isVideo ? 'video' : 'image',
                                name: file.name,
                                data: null,
                                date: Date.now()
                            };
                            if (isVideo) {
                                item.data = result;
                                this.galleryItems.push(item);
                                this.saveGallery();
                            } else {
                                const img = new Image();
                                img.onload = () => {
                                    const canvas = document.createElement('canvas');
                                    const ctx = canvas.getContext('2d');
                                    const maxSize = 1200;
                                    let width = img.width;
                                    let height = img.height;
                                    if (width > height) {
                                        if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                                    } else {
                                        if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                                    }
                                    canvas.width = width;
                                    canvas.height = height;
                                    ctx.drawImage(img, 0, 0, width, height);
                                    item.data = canvas.toDataURL('image/jpeg', 0.85);
                                    this.galleryItems.push(item);
                                    this.saveGallery();
                                };
                                img.src = result;
                            }
                        };
                        reader.readAsDataURL(file);
                    });
                    e.target.value = '';
                },
                viewMediaItem(item) {
                    this.viewImage = item;
                },
               
                closeLightbox() {
                    const vid = this.$refs.lightboxVideo;
                    if(vid) vid.pause();
                    this.viewImage = null;
                },
                deleteGalleryItem(id) {
                    if(confirm('Delete this item?')) {
                        this.galleryItems = this.galleryItems.filter(img => img.id !== id);
                        this.saveGallery();
                        if(this.viewImage && this.viewImage.id === id) this.closeLightbox();
                    }
                },
                openContext(e, app, insideFolder = false) {
                    e.preventDefault(); e.stopPropagation();
                    let x = e.clientX, y = e.clientY;
                    if (x + 230 > window.innerWidth) x = window.innerWidth - 240;
                    if (y + 250 > window.innerHeight) y = window.innerHeight - 260;
                    this.contextPos = {x, y};
                    this.contextApp = app;
                    this.contextIsInsideFolder = insideFolder;
                    this.contextOpen = true;
                },
                moveAppToPage(app, pageNum) {
                    const idx = this.apps.findIndex(a => a.id === app.id);
                    if(idx > -1) {
                        const targetApps = this.apps.filter(a => (a.page||0) === pageNum);
                        const newIndex = targetApps.length;
                        this.apps[idx].page = pageNum;
                        this.apps[idx].index = newIndex;
                        this.saveApps();
                        this.currentPage = pageNum;
                    }
                },
               
                removeFromFolder(app) {
                    let parentFolder = this.apps.find(a => a.type === 'folder' && a.items && a.items.find(i => i.id === app.id));
                    if(parentFolder) {
                        parentFolder.items = parentFolder.items.filter(i => i.id !== app.id);
                        const pageApps = this.apps.filter(a => (a.page||0) === this.currentPage);
                        app.page = this.currentPage;
                        app.index = pageApps.length;
                        this.apps.push(app);
                        this.saveApps();
                        if(this.activeFolder && this.activeFolder.id === parentFolder.id) {
                            this.activeFolder = parentFolder;
                        }
                        if(parentFolder.items.length === 0) {
                            this.deleteApp(parentFolder);
                            this.closeFolder();
                        }
                    }
                },
                duplicateApp(app) {
                    if(app.type === 'folder' || app.type === 'gallery') return;
                    const pageApps = this.apps.filter(a => (a.page||0) === (app.page||0));
                    const newApp = {...app, id: 'app'+Date.now(), name: app.name + ' (Copy)', index: pageApps.length};
                    this.apps.push(newApp);
                    this.saveApps();
                },
                deleteApp(app) {
                    if(app.id === 'system-gallery' || app.id === 'virtual-look-3') return;
                    if(app.type === 'folder') {
                        if(confirm('Delete Folder? Items inside will be deleted.')) {
                            this.apps = this.apps.filter(a => a.id !== app.id);
                            this.saveApps();
                        }
                        return;
                    }
                     let parentFolder = this.apps.find(a => a.type === 'folder' && a.items && a.items.find(i => i.id === app.id));
                     if(parentFolder) {
                         parentFolder.items = parentFolder.items.filter(i => i.id !== app.id);
                         if(this.activeFolder && this.activeFolder.id === parentFolder.id) {
                            this.activeFolder = parentFolder;
                         }
                     } else {
                        this.apps = this.apps.filter(a => a.id !== app.id);
                     }
                    this.saveApps();
                },
                handlePlusClick() {
                    if(this.folderModalOpen) {
                        this.openModal('add', null, true);
                    } else {
                        this.createMenuOpen = true;
                    }
                },
                selectCreateType(type) {
                    this.createMenuOpen = false;
                   
                    if (type === 'app') {
                        this.openModal('add');
                    } else if (type === 'folder') {
                        this.modalMode = 'add';
                        const pageApps = this.apps.filter(a => (a.page||0) === this.currentPage);
                        this.modalData = {
                            id: 'folder_' + Date.now(),
                            type: 'folder',
                            name: '',
                            items: [],
                            bgColor: 'bg-[#1a1a1a]',
                            page: this.currentPage,
                            index: pageApps.length
                        };
                        this.modalOpen = true;
                    } else if (type === 'gallery') {
                        this.modalMode = 'add';
                        const pageApps = this.apps.filter(a => (a.page||0) === this.currentPage);
                        this.modalData = {
                            id: 'gallery_' + Date.now(),
                            type: 'gallery',
                            name: 'New Gallery',
                            icon: 'solar:gallery-bold-duotone',
                            category: 'Gallery',
                            page: this.currentPage,
                            index: pageApps.length
                        };
                        this.modalOpen = true;
                    }
                },
                openModal(mode, app = null, addToFolder = false) {
                    this.modalMode = mode;
                    this.modalAddingToFolder = addToFolder;
                   
                    if(mode === 'add') {
                        this.modalData = { id: 'app'+Date.now(), name: '', url: '', icon: '', category: '' };
                        if(!addToFolder) {
                            const pageApps = this.apps.filter(a => (a.page||0) === this.currentPage);
                            this.modalData.page = this.currentPage;
                            this.modalData.index = pageApps.length;
                        }
                    } else {
                        this.modalData = JSON.parse(JSON.stringify(app));
                    }
                    this.modalOpen = true;
                },
                closeModal() { this.modalOpen = false; },
               
                saveModal() {
                    if (this.modalMode === 'add') {
                        if(this.modalAddingToFolder && this.activeFolder) {
                            if(!this.activeFolder.items) this.activeFolder.items = [];
                            this.activeFolder.items.push(this.modalData);
                        } else {
                            this.apps.push(this.modalData);
                        }
                    } else {
                         let parentFolder = this.apps.find(a => a.type === 'folder' && a.items && a.items.find(i => i.id === this.modalData.id));
                         if (parentFolder) {
                            const idx = parentFolder.items.findIndex(a => a.id === this.modalData.id);
                            if (idx > -1) parentFolder.items[idx] = this.modalData;
                            if(this.activeFolder && this.activeFolder.id === parentFolder.id) this.activeFolder = parentFolder;
                        } else {
                            const idx = this.apps.findIndex(a => a.id === this.modalData.id);
                            if (idx > -1) this.apps[idx] = this.modalData;
                        }
                    }
                    this.saveApps();
                    this.closeModal();
                   
                    if(this.modalAddingToFolder) {
                        this.$nextTick(() => { this.initFolderSortable(); });
                    }
                },
               
                handleUrlInput(e) {
                    const val = e.target.value;
                    const driveRegex = /\/d\/(.+?)\/|id=(.+?)(&|$)/;
                    const match = val.match(driveRegex);
                    if (match) {
                        const id = match[1] || match[2];
                        this.modalData.icon = `https://lh3.googleusercontent.com/d/${id}`;
                    } else {
                        this.modalData.icon = val;
                    }
                },
                handleFileUpload(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    this.uploading = true;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            const maxSize = 128;
                            let width = img.width;
                            let height = img.height;
                            if (width > height) {
                                if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                            } else {
                                if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            ctx.drawImage(img, 0, 0, width, height);
                            this.modalData.icon = canvas.toDataURL('image/png');
                            this.uploading = false;
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                },
                initSortable() {
                    document.querySelectorAll('.sortable-grid').forEach(el => {
                        if(el._sortable) el._sortable.destroy();
                        el._sortable = new Sortable(el, {
                            group: 'apps',
                            animation: 250,
                            delay: 150,
                            delayOnTouchOnly: true,
                            draggable: '.app-item',
                            ghostClass: 'sortable-ghost',
                            dragClass: 'sortable-drag',
                            onEnd: (evt) => {
                                const page = parseInt(evt.to.getAttribute('data-page'));
                                const children = Array.from(evt.to.children);
                                children.forEach((child, newIndex) => {
                                    const id = child.getAttribute('data-id');
                                    const app = this.apps.find(a => a.id === id);
                                    if(app) {
                                        app.page = page;
                                        app.index = newIndex;
                                    }
                                });
                                // Folder creation drag logic
                                const dropX = evt.originalEvent.clientX || evt.originalEvent.changedTouches?.[0].clientX;
                                const dropY = evt.originalEvent.clientY || evt.originalEvent.changedTouches?.[0].clientY;
                                if(dropX && dropY) {
                                    const draggedEl = evt.item;
                                    draggedEl.style.visibility = 'hidden';
                                    const targetEl = document.elementFromPoint(dropX, dropY);
                                    draggedEl.style.visibility = '';
                                    const targetAppEl = targetEl.closest('.app-item');
                                    if(targetAppEl && targetAppEl !== draggedEl) {
                                        const targetId = targetAppEl.getAttribute('data-id');
                                        const draggedId = draggedEl.getAttribute('data-id');
                                        this.createFolder(draggedId, targetId);
                                    }
                                }
                                this.saveApps();
                            }
                        });
                    });
                },
                createFolder(draggedId, targetId) {
                    const draggedApp = this.apps.find(a => a.id === draggedId);
                    const targetApp = this.apps.find(a => a.id === targetId);
                    if (!draggedApp || !targetApp) return;
                    if (draggedApp.type === 'folder' || targetApp.type === 'folder') return;
                    if (draggedApp.type === 'gallery' || targetApp.type === 'gallery') return;
                   
                    if(confirm(`Create folder with "${draggedApp.name}" and "${targetApp.name}"?`)) {
                        const newFolder = {
                            id: 'folder_' + Date.now(),
                            type: 'folder',
                            name: 'Folder',
                            page: targetApp.page,
                            index: targetApp.index,
                            bgColor: 'bg-[#1a1a1a]',
                            items: [targetApp, draggedApp]
                        };
                        this.apps = this.apps.filter(a => a.id !== draggedId && a.id !== targetId);
                        this.apps.push(newFolder);
                        this.saveApps();
                        setTimeout(() => this.processApps(this.apps), 50);
                    }
                }
            }))
        })
    </script>
</body>
