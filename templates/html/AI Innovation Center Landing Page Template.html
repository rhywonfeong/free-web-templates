<!DOCTYPE html>
<html lang="fr">
<head>
<script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centre d'Innovation en IA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
body { font-family: 'Inter', sans-serif; }
/* Animation keyframes */
@keyframes spin-slow {
from { transform: rotate(0deg); }
to { transform: rotate(360deg); }
}
@keyframes spin-reverse-slower {
from { transform: rotate(360deg); }
to { transform: rotate(0deg); }
}
@keyframes pulse-subtle {
0%, 100% { opacity: 0.8; transform: scale(1); }
50% { opacity: 1; transform: scale(1.05); }
}
@keyframes float-logo {
0%, 100% { transform: translateY(0px) rotate(0deg); }
50% { transform: translateY(-10px) rotate(1deg); }
}
.animate-spin-slow { animation: spin-slow 60s linear infinite; }
.animate-spin-reverse { animation: spin-reverse-slower 80s linear infinite; }
.animate-pulse-subtle { animation: pulse-subtle 4s ease-in-out infinite; }
.animate-float-logo { animation: float-logo 6s ease-in-out infinite; }
</style></head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col items-center justify-between relative overflow-hidden">

    <!-- Subtle Radial Background Gradient -->
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-white via-slate-50 to-blue-50/30 pointer-events-none -z-10"></div>

    <!-- Main Content Wrapper -->
    <main class="flex-grow flex flex-col items-center justify-center w-full max-w-7xl px-4 py-12 relative z-10">

        <!-- 1. VISUAL CENTERPIECE: Hexagon & Network -->
        <div class="relative w-full max-w-lg aspect-square flex items-center justify-center mb-10">
            
            <!-- Background Glow -->
            <div class="absolute inset-0 bg-blue-900/5 blur-3xl rounded-full"></div>

            <svg viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-2xl">
                
                <!-- OUTER NETWORK RING (Rotating) -->
                <g class="origin-center animate-spin-slow opacity-70">
                    <path d="M300 50 L450 150 L500 300 L450 450 L300 550 L150 450 L100 300 L150 150 Z" stroke="url(#lineGradient)" stroke-width="0.5" />
                    <path d="M300 50 L150 150 M450 150 L300 50 M500 300 L450 150 M450 450 L500 300 M300 550 L450 450 M150 450 L300 550 M100 300 L150 450 M150 150 L100 300" stroke="url(#lineGradient)" stroke-width="0.5" stroke-dasharray="4 4" />
                    
                    <!-- Nodes -->
                    <circle cx="300" cy="50" r="3" class="fill-blue-900" />
                    <circle cx="450" cy="150" r="3" class="fill-red-700" />
                    <circle cx="500" cy="300" r="3" class="fill-blue-800" />
                    <circle cx="450" cy="450" r="3" class="fill-blue-900" />
                    <circle cx="300" cy="550" r="3" class="fill-red-700" />
                    <circle cx="150" cy="450" r="3" class="fill-blue-800" />
                    <circle cx="100" cy="300" r="3" class="fill-blue-900" />
                    <circle cx="150" cy="150" r="3" class="fill-red-700" />
                </g>

                <!-- INNER NETWORK RING (Counter-Rotating) -->
                <g class="origin-center animate-spin-reverse">
                    <path d="M300 120 L400 220 L400 380 L300 480 L200 380 L200 220 Z" stroke="url(#lineGradient2)" stroke-width="0.8" />
                    <path d="M300 120 L300 220 M400 220 L300 300 M400 380 L300 300 M300 480 L300 380 M200 380 L300 300 M200 220 L300 300" stroke="#1e3a8a" stroke-opacity="0.2" stroke-width="0.5" />

                    <!-- Accents -->
                    <circle cx="300" cy="120" r="3.5" class="fill-red-600" />
                    <circle cx="300" cy="480" r="3.5" class="fill-red-600" />
                    <circle cx="400" cy="220" r="2.5" class="fill-blue-400" />
                    <circle cx="400" cy="380" r="2.5" class="fill-blue-400" />
                    <circle cx="200" cy="380" r="2.5" class="fill-blue-400" />
                    <circle cx="200" cy="220" r="2.5" class="fill-blue-400" />
                </g>

                <!-- CENTRAL HEXAGON CORE (Logo Removed) -->
                <g class="animate-pulse-subtle">
                    <!-- Hexagon Background -->
                    <path d="M300 180 L403 240 V360 L300 420 L197 360 V240 Z" fill="url(#hexGradient)" stroke="url(#hexBorder)" stroke-width="1.5" />
                </g>

                <!-- Gradients Definitions -->
                <defs>
                    <!-- Logo Facet Gradients (Kept for reference if needed, though unused now) -->
                    <linearGradient id="facetDarkBlue" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#0f172a" /> <!-- Deepest Navy -->
                        <stop offset="100%" stop-color="#1e40af" /> <!-- Blue 800 -->
                    </linearGradient>
                    <linearGradient id="facetMedBlue" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#3b82f6" /> <!-- Blue 500 -->
                        <stop offset="100%" stop-color="#1e3a8a" /> <!-- Blue 900 -->
                    </linearGradient>
                    <linearGradient id="facetDarkRed" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#4c1d95" /> <!-- Violet 900 (Bridge color) -->
                        <stop offset="100%" stop-color="#991b1b" /> <!-- Red 800 -->
                    </linearGradient>
                    <linearGradient id="facetBrightRed" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#dc2626" /> <!-- Red 600 -->
                        <stop offset="100%" stop-color="#f87171" /> <!-- Red 400 -->
                    </linearGradient>
                    
                    <linearGradient id="arrowLeftGrad" x1="0" y1="1" x2="1" y2="0">
                        <stop offset="0%" stop-color="#1e3a8a" />
                        <stop offset="100%" stop-color="#60a5fa" />
                    </linearGradient>
                    <linearGradient id="arrowRightGrad" x1="0" y1="1" x2="1" y2="0">
                        <stop offset="0%" stop-color="#7f1d1d" />
                        <stop offset="100%" stop-color="#f87171" />
                    </linearGradient>

                    <!-- Existing Background Gradients -->
                    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.1" />
                        <stop offset="50%" stop-color="#dc2626" stop-opacity="0.4" />
                        <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.1" />
                    </linearGradient>
                    <linearGradient id="lineGradient2" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.2" />
                        <stop offset="100%" stop-color="#2563eb" stop-opacity="0.5" />
                    </linearGradient>
                    <linearGradient id="hexGradient" x1="197" y1="180" x2="403" y2="420" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#0f172a" />
                        <stop offset="50%" stop-color="#1e3a8a" />
                        <stop offset="100%" stop-color="#7f1d1d" />
                    </linearGradient>
                    <linearGradient id="hexBorder" x1="197" y1="180" x2="403" y2="420" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="50%" stop-color="#1e3a8a" />
                        <stop offset="100%" stop-color="#dc2626" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <!-- 2. TYPOGRAPHY -->
        <div class="text-center z-20 mb-14">
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-semibold tracking-tight text-slate-900 mb-5 uppercase leading-none">
                Centre d’Innovation en <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-800 to-red-600">IA</span>
            </h1>
            
            <div class="flex items-center justify-center gap-3 text-xs md:text-sm font-medium tracking-[0.2em] text-slate-500 uppercase">
                <span>Qualiopi</span>
                <span class="text-slate-300">|</span>
                <span>Opco</span>
                <span class="text-slate-300">|</span>
                <span>CFA Certifié</span>
            </div>
        </div>

        <!-- 3. ACTION -->
        <div class="flex flex-col sm:flex-row items-center gap-6 w-full justify-center">
            
            <!-- Button 1 -->
            <button class="w-full sm:w-auto px-8 py-3.5 rounded-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 font-medium text-sm tracking-wide transition-all duration-300 hover:border-blue-200 hover:shadow-sm">
                DÉCOUVRIR NOS FORMATIONS
            </button>

            <!-- Button 2 -->
            <div class="w-full sm:w-auto p-[1.5px] rounded-full bg-gradient-to-r from-blue-900 via-red-600 to-blue-900 shadow-lg shadow-blue-100 group transition-transform duration-300 hover:scale-[1.02]">
                <button class="w-full h-full px-8 py-3.5 rounded-full bg-slate-50 group-hover:bg-white text-slate-800 font-semibold text-sm tracking-wide transition-colors duration-200 flex items-center justify-center gap-2">
                    <span>INSCRIPTION RAPIDE</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 text-red-600"></i>
                </button>
            </div>

        </div>

    </main>

    <!-- 4. FOOTER -->
    <footer class="w-full pb-10 pt-4 flex flex-col items-center justify-center relative z-10">
        <p class="text-xs font-medium tracking-widest text-slate-400 uppercase mb-4">
            L’intelligence artificielle au cœur de tous les métiers
        </p>
        
        <!-- Graphic Curve -->
        <svg width="400" height="20" viewBox="0 0 400 20" fill="none" class="opacity-40">
            <path d="M0 10 Q 200 25 400 10" stroke="url(#curveGradient)" stroke-width="1" fill="none"/>
            <defs>
                <linearGradient id="curveGradient" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="white" stop-opacity="0" />
                    <stop offset="50%" stop-color="#dc2626" />
                    <stop offset="100%" stop-color="white" stop-opacity="0" />
                </linearGradient>
            </defs>
        </svg>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
