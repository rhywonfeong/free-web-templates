            </div>

            <svg class="absolute top-1/4 left-10 w-32 h-32 md:w-48 md:h-48 text-[#111] opacity-60 z-10 pointer-events-none rotate-12" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">

                        <!-- Halftone Texture Overlay -->

                        <path d="M10,40 L15,30 M10,40 L22,42"></path>

    <script>
        // Simple Smooth Scroll for Anchor Links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });
    </script>
