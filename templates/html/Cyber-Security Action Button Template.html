<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Access Button</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
@keyframes scan-sweep {
0% { transform: translateX(-150%); }
100% { transform: translateX(400%); }
}
@keyframes scan-texture {
0% { background-position: 0 0; }
100% { background-position: 2px 0; }
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="relative min-h-screen bg-gradient-to-br from-zinc-800 via-zinc-950 to-black flex items-center justify-center p-6 antialiased font-sans overflow-hidden">

    <button class="relative z-10 w-full sm:w-auto inline-flex items-center justify-center gap-3 px-8 py-4 rounded-none bg-[#82ff7a] text-[#051f05] font-medium text-lg overflow-hidden transition-all duration-300 ease-out group hover:scale-[1.02] hover:shadow-[0_0_35px_-10px_rgba(130,255,122,0.6)] active:scale-[0.98] ring-1 ring-white/20 shadow-[inset_0_1px_1px_rgba(255,255,255,0.4),inset_0_-2px_4px_rgba(0,0,0,0.1)]">
        
        <!-- Horizontal Sweeping Green Scanner Light -->
        <div class="absolute inset-y-0 w-32 bg-gradient-to-r from-transparent via-[#008f11]/40 to-transparent pointer-events-none" style="animation: scan-sweep 2.5s linear infinite;"></div>

        <!-- Special Sharp Corner Accents -->
        <div class="absolute top-1.5 left-1.5 w-2 h-2 border-t-2 border-l-2 border-[#051f05]/30 group-hover:border-[#051f05]/80 transition-colors duration-300 pointer-events-none"></div>
        <div class="absolute top-1.5 right-1.5 w-2 h-2 border-t-2 border-r-2 border-[#051f05]/30 group-hover:border-[#051f05]/80 transition-colors duration-300 pointer-events-none"></div>
        <div class="absolute bottom-1.5 left-1.5 w-2 h-2 border-b-2 border-l-2 border-[#051f05]/30 group-hover:border-[#051f05]/80 transition-colors duration-300 pointer-events-none"></div>
        <div class="absolute bottom-1.5 right-1.5 w-2 h-2 border-b-2 border-r-2 border-[#051f05]/30 group-hover:border-[#051f05]/80 transition-colors duration-300 pointer-events-none"></div>

        <!-- Animated Horizontal Fine Scanline Texture -->
        <div class="absolute inset-0 pointer-events-none mix-blend-darken bg-[repeating-linear-gradient(90deg,transparent,transparent_1px,#00000015_1px,#00000015_2px)]" style="animation: scan-texture 1.5s linear infinite;"></div>
        
        <!-- Hover Glare Sweep Animation -->
        <div class="absolute inset-0 pointer-events-none -translate-x-full group-hover:translate-x-full transition-transform duration-1000 ease-in-out bg-[linear-gradient(90deg,transparent,#ffffff70,transparent)]"></div>

        <!-- Content -->
        <span class="relative z-10 flex items-center gap-2.5 drop-shadow-[0_1px_0_rgba(255,255,255,0.4)] tracking-tight">
            <iconify-icon icon="solar:key-minimalistic-linear" class="text-xl"></iconify-icon>
            Continue with Access Code
            <iconify-icon icon="solar:alt-arrow-right-linear" class="text-xl"></iconify-icon>
        </span>

    </button>

</body>
</html>
