body { font-family: 'Inter', sans-serif; }
/* Custom scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background-color: #e2e8f0; border-radius: 20px; }
/* Hide scrollbar for specific elements */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
/* Typing animation dots */
.typing-dot {
animation: typing 1.4s infinite ease-in-out both;
}
.typing-dot:nth-child(1) { animation-delay: -0.32s; }
.typing-dot:nth-child(2) { animation-delay: -0.16s; }
@keyframes typing {
0%, 80%, 100% { transform: scale(0); }
40% { transform: scale(1); }
}
/* Markdown-like styling for AI response */
.prose p { margin-bottom: 0.75rem; }
.prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; }

    <!-- Main Content -->

        <!-- Header -->

        <!-- Chat Area -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 lg:p-8 space-y-8 scroll-smooth pb-32">
            
            <!-- Welcome State (Empty) -->
            <div id="welcome-screen" class="max-w-2xl mx-auto mt-12 lg:mt-20 text-center space-y-8">
                <div class="w-16 h-16 bg-white border border-slate-100 rounded-2xl shadow-sm flex items-center justify-center mx-auto mb-6">
                    <span class="iconify text-teal-600" data-icon="lucide:stethoscope" data-width="32" data-stroke-width="1.5"></span>

                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-2xl mx-auto pt-4">
                    <button onclick="fillInput('What are the latest guidelines for Type 2 Diabetes management?')" class="text-left p-4 rounded-xl border border-slate-200 hover:border-teal-200 hover:bg-teal-50/30 transition-all group">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="iconify text-teal-600" data-icon="lucide:file-text" data-width="16" data-stroke-width="1.5"></span>

                    <button onclick="fillInput('Check interaction between Warfarin and Amoxicillin.')" class="text-left p-4 rounded-xl border border-slate-200 hover:border-teal-200 hover:bg-teal-50/30 transition-all group">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="iconify text-teal-600" data-icon="lucide:pill" data-width="16" data-stroke-width="1.5"></span>
                            <span class="font-medium text-slate-700">Drug Interaction</span>
                        </div>
                        <p class="text-slate-500 text-xs line-clamp-1">Analyze safety of Warfarin and Amoxicillin.</p>
                    </button>
                    <button onclick="fillInput('Draft a referral letter for a patient with persistent migraines.')" class="text-left p-4 rounded-xl border border-slate-200 hover:border-teal-200 hover:bg-teal-50/30 transition-all group">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="iconify text-teal-600" data-icon="lucide:pen-tool" data-width="16" data-stroke-width="1.5"></span>
                            <span class="font-medium text-slate-700">Draft Referral</span>
                        </div>
                        <p class="text-slate-500 text-xs line-clamp-1">Write a letter for neurology consultation.</p>
                    </button>
                    <button onclick="fillInput('Summarize the differential diagnosis for acute abdominal pain in RLQ.')" class="text-left p-4 rounded-xl border border-slate-200 hover:border-teal-200 hover:bg-teal-50/30 transition-all group">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="iconify text-teal-600" data-icon="lucide:microscope" data-width="16" data-stroke-width="1.5"></span>
                            <span class="font-medium text-slate-700">Differential Diagnosis</span>
                        </div>
                        <p class="text-slate-500 text-xs line-clamp-1">RLQ pain analysis and key indicators.</p>
                    </button>
                </div>
            </div>

            <!-- Messages will be injected here via JS -->
            <div id="messages-area" class="max-w-3xl mx-auto space-y-8 hidden">
                <!-- Content injected dynamically -->
            </div>
            
            <!-- Loading Indicator (Hidden by default) -->
            <div id="loading-indicator" class="max-w-3xl mx-auto flex gap-4 hidden">
                <div class="w-8 h-8 rounded-full bg-teal-600 flex-shrink-0 flex items-center justify-center">
                    <span class="iconify text-white" data-icon="lucide:activity" data-width="16" data-stroke-width="2"></span>
                </div>
                <div class="flex items-center gap-1 bg-white border border-slate-100 shadow-sm px-4 py-3 rounded-2xl rounded-tl-none">
                    <div class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                </div>
            </div>

        </div>

        <!-- Input Area -->
        <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-white via-white to-transparent pt-10 pb-6 px-4">

                <!-- Attachments/Tools popover trigger (Visual only) -->
                <div class="absolute bottom-3 left-3 flex gap-2 z-20">
                    <button class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" title="Attach file">
                        <span class="iconify" data-icon="lucide:paperclip" data-width="18" data-stroke-width="1.5"></span>
                    </button>
                    <button class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" title="Voice Input">
                         <span class="iconify" data-icon="lucide:mic" data-width="18" data-stroke-width="1.5"></span>
                    </button>
                </div>

                <textarea id="chat-input" rows="1" class="w-full bg-white border border-slate-200 shadow-lg shadow-slate-200/40 rounded-xl py-4 pl-24 pr-12 focus:outline-none focus:ring-2 focus:ring-teal-500/10 focus:border-teal-500 resize-none text-slate-700 placeholder:text-slate-400 max-h-48 overflow-y-auto no-scrollbar" placeholder="Ask anything about medical cases, drugs, or protocols..."></textarea>
                
                <button id="send-btn" class="absolute bottom-3 right-3 p-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg shadow-sm transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    <span class="iconify" data-icon="lucide:arrow-up" data-width="18" data-stroke-width="2"></span>
                </button>
            </div>
            <p class="text-center text-[10px] text-slate-400 mt-3">MediGPT can make mistakes. Consider checking important medical information.</p>
        </div>

    <script>
        // DOM Elements
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const messagesArea = document.getElementById('messages-area');
        const welcomeScreen = document.getElementById('welcome-screen');
        const loadingIndicator = document.getElementById('loading-indicator');
        const chatContainer = document.getElementById('chat-container');
        const sidebar = document.getElementById('sidebar');
        const mobileOverlay = document.getElementById('mobile-overlay');

        // State
        let isTyping = false;

        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            
            // Enable/Disable send button
            if (this.value.trim().length > 0) {
                sendBtn.removeAttribute('disabled');
            } else {
                sendBtn.setAttribute('disabled', 'true');
            }
        });

        // Handle Enter key
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Handle Send Click
        sendBtn.addEventListener('click', sendMessage);

        function fillInput(text) {
            chatInput.value = text;
            chatInput.style.height = 'auto'; // Reset calculation
            chatInput.style.height = (chatInput.scrollHeight) + 'px'; // Recalculate
            sendBtn.removeAttribute('disabled');
            chatInput.focus();
        }

        function toggleSidebar() {
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                mobileOverlay.classList.remove('hidden');
                // slight delay for opacity transition
                setTimeout(() => mobileOverlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('-translate-x-full');
                mobileOverlay.classList.add('opacity-0');
                setTimeout(() => mobileOverlay.classList.add('hidden'), 300);
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        function resetChat() {
            messagesArea.innerHTML = '';
            messagesArea.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
            chatInput.value = '';
            chatInput.style.height = 'auto';
            if (window.innerWidth < 1024) toggleSidebar(); // Close sidebar on mobile
        }

        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || isTyping) return;

            // UI Updates
            welcomeScreen.classList.add('hidden');
            messagesArea.classList.remove('hidden');
            chatInput.value = '';
            chatInput.style.height = 'auto';
            sendBtn.setAttribute('disabled', 'true');
            isTyping = true;

            // 1. Add User Message
            const userMsgHTML = `
                <div class="flex gap-4 flex-row-reverse group">
                    <div class="w-8 h-8 rounded-full bg-slate-200 flex-shrink-0 flex items-center justify-center text-slate-600 font-medium text-xs">
                        DR
                    </div>
                    <div class="flex-1 max-w-[80%]">
                        <div class="bg-slate-100 text-slate-800 px-5 py-3.5 rounded-2xl rounded-tr-none text-sm leading-relaxed whitespace-pre-wrap">
                            ${text}
                        </div>
                    </div>
                </div>
            `;
            messagesArea.insertAdjacentHTML('beforeend', userMsgHTML);
            scrollToBottom();

            // 2. Show Loading
            loadingIndicator.classList.remove('hidden');
            scrollToBottom();

            // 3. Simulate AI Response (Delay)
            setTimeout(() => {
                loadingIndicator.classList.add('hidden');
                
                // Generate a pseudo-intelligent response based on keywords
                let aiResponse = "";
                const lowerText = text.toLowerCase();

                if (lowerText.includes("diabetes") || lowerText.includes("glucose")) {
                    aiResponse = `
                        <p>Based on current clinical guidelines (ADA 2024), here is a summary for <strong>Type 2 Diabetes Management</strong>:</p>
                        <p><strong>First-line Therapy:</strong> Metformin remains the preferred initial pharmacologic agent for the treatment of type 2 diabetes.</p>
                        <ul>
                            <li>Combine with lifestyle modifications (diet, exercise).</li>
                            <li>Consider early combination therapy if A1C is > 1.5% above target.</li>
                        </ul>
                        <p><strong>Cardiovascular/Renal Protection:</strong> In patients with established ASCVD, HF, or CKD, a SGLT2 inhibitor or GLP-1 RA with demonstrated CVD benefit is recommended independent of A1C.</p>
                        <p>Would you like the specific dosage adjustments for renal impairment?</p>
                    `;
                } else if (lowerText.includes("interaction") || lowerText.includes("warfarin")) {
                    aiResponse = `
                        <p><strong>Interaction Alert: Moderate to Severe</strong></p>
                        <p>There is a significant interaction between <strong>Warfarin</strong> and <strong>Amoxicillin</strong>.</p>
                        <ul>
                            <li><strong>Mechanism:</strong> Penicillins (like Amoxicillin) may alter intestinal flora, potentially increasing the anticoagulant effect of Warfarin.</li>
                            <li><strong>Risk:</strong> Increased risk of bleeding (elevated INR).</li>
                        </ul>
                        <p><strong>Recommendation:</strong></p>
                        <p>Monitor INR closely (e.g., 3 days after starting the antibiotic). Consider a temporary dose reduction of Warfarin if INR rises significantly. Advise patient to report any signs of bleeding or bruising.</p>
                    `;
                } else if (lowerText.includes("referral") || lowerText.includes("letter")) {
                    aiResponse = `
                        <p>Here is a draft referral letter for the Neurology Department:</p>
                        <div class="bg-slate-50 border border-slate-200 p-4 rounded-md font-mono text-xs text-slate-600 my-2">
                            <p><strong>To:</strong> Neurology Department</p>
                            <p><strong>Re:</strong> Patient Evaluation for Persistent Migraines</p>
                            <br>
                            <p>Dear Colleague,</p>
                            <br>
                            <p>I am writing to refer this patient for further evaluation and management of chronic, treatment-resistant migraines. The patient reports a 6-month history of unilateral, pulsating headaches accompanied by photophobia and nausea.</p>
                            <br>
                            <p>Current medications (Sumatriptan 50mg) have provided suboptimal relief. I would appreciate your expert opinion on potential prophylactic therapies or advanced imaging if indicated.</p>
                            <br>
                            <p>Sincerely,</p>
                            <p>Dr. Reynolds</p>
                        </div>
                        <p>You can copy this text or ask me to modify the tone or details.</p>
                    `;
                } else {
                    aiResponse = `
                        <p>I understand. As a medical AI assistant, I can help analyze this clinical scenario.</p>
                        <p>Could you provide more specific details regarding:</p>
                        <ul>
                            <li>Patient demographics (Age, Sex)</li>
                            <li>Onset and duration of symptoms</li>
                            <li>Any relevant past medical history</li>
                        </ul>
                        <p>This will help me generate a more accurate differential diagnosis or management plan.</p>
                    `;
                }

                const aiMsgHTML = `
                    <div class="flex gap-4 group animate-in fade-in slide-in-from-bottom-2 duration-500">
                        <div class="w-8 h-8 rounded-full bg-teal-600 flex-shrink-0 flex items-center justify-center shadow-sm">
                            <span class="iconify text-white" data-icon="lucide:activity" data-width="16" data-stroke-width="2"></span>
                        </div>
                        <div class="flex-1 max-w-[90%] lg:max-w-[85%]">
                            <div class="text-slate-700 prose text-sm leading-relaxed">
                                ${aiResponse}
                            </div>
                            <div class="flex gap-2 mt-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button class="p-1 text-slate-400 hover:text-slate-600" title="Copy">
                                    <span class="iconify" data-icon="lucide:copy" data-width="14"></span>
                                </button>
                                <button class="p-1 text-slate-400 hover:text-slate-600" title="Regenerate">
                                    <span class="iconify" data-icon="lucide:refresh-cw" data-width="14"></span>
                                </button>
                                <button class="p-1 text-slate-400 hover:text-slate-600" title="Good response">
                                    <span class="iconify" data-icon="lucide:thumbs-up" data-width="14"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                messagesArea.insertAdjacentHTML('beforeend', aiMsgHTML);
                scrollToBottom();
                isTyping = false;

            }, 1500); // 1.5s simulated delay
        }
    </script>
