<style>
body { font-family: 'Inter', sans-serif; }
.font-grotesk { font-family: 'Space Grotesk', sans-serif; }
/* Smooth Entrance Animations */
@keyframes fadeIn {
from { opacity: 0; }
to { opacity: 1; }
}
@keyframes slideUp {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}
@keyframes slideDown {
from { opacity: 0; transform: translateY(-20px); }
to { opacity: 1; transform: translateY(0); }
}
@keyframes scaleIn {
from { transform: scale(1.1); opacity: 0; }
to { transform: scale(1); opacity: 1; }
}
@keyframes pulse-glow {
0%, 100% { box-shadow: 0 0 15px rgba(193, 39, 45, 0.2); border-color: rgba(193, 39, 45, 0.3); }
50% { box-shadow: 0 0 25px rgba(193, 39, 45, 0.5); border-color: rgba(193, 39, 45, 0.6); }
}
@keyframes float {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(-5px); }
}
@keyframes shimmer {
0% { background-position: -200% 0; }
100% { background-position: 200% 0; }
}
/* Utility Classes for Animation Delays */
.animate-fade-in { animation: fadeIn 1s ease-out forwards; }
.animate-slide-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
.animate-slide-down { animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
.animate-scale-in { animation: scaleIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
.animate-float { animation: float 4s ease-in-out infinite; }
.delay-100 { animation-delay: 100ms; }
.delay-200 { animation-delay: 200ms; }
.delay-300 { animation-delay: 300ms; }
.delay-400 { animation-delay: 400ms; }
.delay-500 { animation-delay: 500ms; }
.delay-700 { animation-delay: 700ms; }
/* Custom Gradients */
.text-gradient {
background: linear-gradient(to bottom, #F5F1E8 0%, #999 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}
</style></head>
