<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CollabFlow - Board View</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body { font-family: 'Inter', sans-serif; }
/* Custom Scrollbar for the horizontal board */
.scrollbar-hide::-webkit-scrollbar {
display: none;
}
.scrollbar-hide {
-ms-overflow-style: none;
scrollbar-width: none;
}
</style></head>
<body class="bg-[#090b10] text-zinc-300 h-screen flex overflow-hidden antialiased selection:bg-indigo-500/30 selection:text-indigo-200">

    <!-- Sidebar (Kept consistent but darkened to match new theme) -->
    <aside class="w-64 flex-shrink-0 bg-[#0e1116] border-r border-white/5 flex flex-col hidden md:flex">
        <!-- Brand -->
        <div class="h-20 flex items-center px-6">
            <div class="flex items-center gap-3">
                <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-indigo-600/90 text-white shadow-lg shadow-indigo-500/20">
                    <i data-lucide="layout-grid" stroke-width="2" class="h-5 w-5"></i>
                </div>
                <span class="text-base font-semibold tracking-tight text-white">CollabFlow</span>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-3 py-6 space-y-1 overflow-y-auto">
            <a href="#" class="group flex items-center gap-3 rounded-lg bg-white/5 px-3 py-2 text-sm font-medium text-white ring-1 ring-inset ring-white/5">
                <i data-lucide="kanban-square" class="h-4 w-4 text-indigo-400"></i>
                Active Board
            </a>
            <a href="#" class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/5 hover:text-zinc-100">
                <i data-lucide="clock" class="h-4 w-4 text-zinc-500 group-hover:text-zinc-300"></i>
                Recent
            </a>
            <a href="#" class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/5 hover:text-zinc-100">
                <i data-lucide="users" class="h-4 w-4 text-zinc-500 group-hover:text-zinc-300"></i>
                Team Members
            </a>
            
            <div class="pt-8">
                <h3 class="px-3 text-[11px] font-semibold uppercase tracking-wider text-zinc-600 mb-2">Settings</h3>
                <a href="#" class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/5 hover:text-zinc-100">
                    <i data-lucide="settings" class="h-4 w-4 text-zinc-500 group-hover:text-zinc-300"></i>
                    Preferences
                </a>
            </div>
        </nav>

        <!-- Footer -->
        <div class="p-4 border-t border-white/5">
            <a href="#" class="group flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-zinc-400 transition-colors hover:bg-white/5 hover:text-zinc-100">
                <i data-lucide="log-out" class="h-4 w-4 text-zinc-500 group-hover:text-zinc-300"></i>
                Logout
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 bg-[#090b10] overflow-hidden relative">
        
        <!-- Dashboard Content -->
        <div class="flex-1 overflow-x-auto overflow-y-hidden p-6 md:p-10 flex flex-col">
            
            <!-- Top Floating Header -->
            <header class="flex-shrink-0 flex flex-col md:flex-row md:items-center justify-between gap-4 bg-[#11141b] border border-white/5 rounded-2xl p-3 md:px-5 md:py-3 mb-10 shadow-xl shadow-black/20">
                <!-- Left: Board Info -->
                <div class="flex items-center gap-4">
                    <div class="h-10 w-10 bg-indigo-500/10 text-indigo-400 rounded-xl flex items-center justify-center border border-indigo-500/10">
                        <i data-lucide="rocket" stroke-width="1.5" class="h-5 w-5"></i>
                    </div>
                    <div class="flex flex-col">
                        <h1 class="text-white font-semibold text-base leading-none">To Do</h1>
                        <span class="text-[10px] text-zinc-500 font-bold tracking-widest uppercase mt-1.5">Board</span>
                    </div>
                </div>

                <!-- Right: Actions -->
                <div class="flex items-center gap-4 md:gap-6 w-full md:w-auto">
                    <!-- Search -->
                    <div class="relative flex-1 md:flex-none group">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-zinc-500 group-focus-within:text-indigo-400 transition-colors"></i>
                        <input type="text" placeholder="Search..." class="w-full md:w-64 bg-[#1a1e26] border border-transparent rounded-lg pl-10 pr-4 py-2 text-sm text-zinc-300 placeholder-zinc-600 focus:outline-none focus:bg-[#151820] focus:ring-1 focus:ring-indigo-500/20 transition-all">
                    </div>
                    
                    <!-- Notifications -->
                    <button class="relative text-zinc-400 hover:text-white transition-colors">
                        <i data-lucide="bell" stroke-width="1.5" class="h-5 w-5"></i>
                        <span class="absolute top-0 right-0 h-2 w-2 bg-red-500 rounded-full border-2 border-[#11141b]"></span>
                    </button>

                    <!-- Profile -->
                    <div class="flex items-center gap-3 pl-2 border-l border-white/5">
                        <span class="hidden md:block text-sm font-medium text-zinc-300">Demo User</span>
                        <div class="h-9 w-9 rounded-lg bg-zinc-200 text-zinc-900 flex items-center justify-center font-bold text-xs relative ring-2 ring-white/5">
                            DU
                            <span class="absolute -bottom-0.5 -right-0.5 h-3 w-3 bg-emerald-500 border-2 border-[#11141b] rounded-full"></span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Board Columns Container -->
            <div class="flex-1 flex items-start gap-6 overflow-x-auto pb-4 scrollbar-hide">
                
                <!-- Column 1: TO DO -->
                <div class="w-80 flex-shrink-0 bg-[#11141b] rounded-2xl p-3 flex flex-col gap-3 border border-white/5 h-auto max-h-full">
                    <!-- Column Header -->
                    <div class="flex items-center justify-between px-2 pt-2 pb-1">
                        <div class="flex items-center gap-3">
                            <h2 class="text-xs font-bold text-zinc-300 uppercase tracking-wider">To Do</h2>
                            <span class="bg-[#1f2430] text-zinc-400 text-[10px] font-bold h-5 min-w-[20px] px-1.5 flex items-center justify-center rounded-full">1</span>
                        </div>
                        <button class="text-zinc-500 hover:text-white transition-colors">
                            <i data-lucide="more-horizontal" stroke-width="1.5" class="h-5 w-5"></i>
                        </button>
                    </div>

                    <!-- Tasks List -->
                    <div class="flex flex-col gap-2 min-h-0 overflow-y-auto">
                        <!-- Task Card -->
                        <div class="group bg-[#161a22] hover:bg-[#1a1e28] p-4 rounded-xl border border-white/5 hover:border-white/10 shadow-sm transition-all cursor-pointer">
                            <div class="flex items-center gap-3">
                                <div class="flex-shrink-0 h-5 w-5 rounded-full bg-emerald-500/20 text-emerald-500 flex items-center justify-center">
                                    <i data-lucide="check" stroke-width="3" class="h-3 w-3"></i>
                                </div>
                                <span class="text-sm font-medium text-zinc-200 group-hover:text-white">Running</span>
                            </div>
                        </div>
                    </div>

                    <!-- Add Task Footer -->
                    <button class="mt-auto w-full py-2.5 flex items-center justify-center gap-2 text-zinc-500 hover:text-zinc-300 hover:bg-white/5 rounded-lg transition-all text-sm font-medium">
                        <i data-lucide="plus" stroke-width="2" class="h-4 w-4"></i>
                        Add Task
                    </button>
                </div>

                <!-- Column 2: IN PROGRESS -->
                <div class="w-80 flex-shrink-0 bg-[#11141b] rounded-2xl p-3 flex flex-col gap-3 border border-white/5 h-fit">
                    <!-- Column Header -->
                    <div class="flex items-center justify-between px-2 pt-2 pb-1">
                        <div class="flex items-center gap-3">
                            <h2 class="text-xs font-bold text-zinc-300 uppercase tracking-wider">In Progress</h2>
                            <span class="bg-[#1f2430] text-zinc-400 text-[10px] font-bold h-5 min-w-[20px] px-1.5 flex items-center justify-center rounded-full">0</span>
                        </div>
                        <button class="text-zinc-500 hover:text-white transition-colors">
                            <i data-lucide="more-horizontal" stroke-width="1.5" class="h-5 w-5"></i>
                        </button>
                    </div>

                    <!-- Empty State Placeholder to give height -->
                    <div class="h-32 flex items-center justify-center rounded-xl border border-dashed border-white/5">
                         <span class="text-xs text-zinc-700 font-medium">No tasks</span>
                    </div>

                    <!-- Add Task Footer -->
                    <button class="w-full py-2.5 flex items-center justify-center gap-2 text-zinc-500 hover:text-zinc-300 hover:bg-white/5 rounded-lg transition-all text-sm font-medium">
                        <i data-lucide="plus" stroke-width="2" class="h-4 w-4"></i>
                        Add Task
                    </button>
                </div>

                <!-- Column 3: Add New Column -->
                <button class="w-80 h-14 flex-shrink-0 border border-dashed border-zinc-800 hover:border-zinc-600 hover:bg-white/5 rounded-2xl flex items-center justify-center gap-2 text-zinc-400 hover:text-zinc-200 font-medium transition-all group">
                    <i data-lucide="plus" stroke-width="2" class="h-4 w-4 text-zinc-600 group-hover:text-zinc-400 transition-colors"></i>
                    Add New Column
                </button>

            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
