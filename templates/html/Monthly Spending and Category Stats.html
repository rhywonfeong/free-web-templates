  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0">
  <title>Stats Screen</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-6">
  <div class="relative w-[375px] h-[812px] rounded-[54px] bg-white overflow-hidden shadow-2xl border-8 border-gray-100">
    <!-- Notch -->
    <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-[126px] h-[34px] bg-black rounded-b-[18px] z-20"></div>
    <!-- Status bar -->
    <div class="pt-9 px-6 pb-1 flex justify-between items-center text-xs">
      <span id="clock" class="font-medium text-gray-500">9:41</span>
      <div class="flex space-x-1 text-gray-600">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect width="16" height="6" x="4" y="9" rx="2" stroke-width="1.5"/></svg>
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="2" stroke-width="1.5"/></svg>
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><rect x="3" y="7" width="18" height="10" rx="2" stroke-width="1.5"/></svg>
      </div>
    </div>
    <!-- Header -->
    <header class="px-6 py-2 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-900">Stats</h1>
      <div class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center">
        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="1.5" stroke-linejoin="round" d="M15 17h5l-1.405-1.405M20.405 16H9.595c-.234 0-.429-.236-.429-.5v-.717a.995.995 0 01.195-.617L15 5V3.5A1.5 1.5 0 0013.5 2h-3A1.5 1.5 0 009 3.5V5l6.14 9.66c.114.18.165.39.145.6v.74c0 .26-.197.5-.43.5z" /></svg>
      </div>
    </header>
    <!-- Main content -->
    <main class="px-6 pb-24">
      <div class="bg-gradient-to-r from-purple-600 to-blue-600 rounded-3xl p-6 mb-7 shadow-lg mt-2">
        <div class="flex justify-between items-center mb-4">
          <div>
            <div class="text-xs text-white/80">Spending Overview</div>
            <div class="text-xl font-bold text-white">$4,210 <span class="text-xs font-medium text-white/60">this month</span></div>
          </div>
          <button class="bg-white/20 hover:bg-white/40 px-3 py-1 text-xs text-white rounded-full transition" onclick="alert('Show details')">Details</button>
        </div>
        <div class="h-36">
          <canvas id="spendingChart"></canvas>
        </div>
      </div>
      <!-- Categories -->
      <div class="mb-8">
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-gray-900 text-base">By Category</h3>
          <button class="text-xs text-purple-600 font-medium" onclick="alert('Show all categories')">See All</button>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-white rounded-2xl p-4 shadow flex flex-col items-start cursor-pointer transition hover:bg-purple-50" onclick="alert('Groceries category')">
            <div class="flex items-center mb-2">
              <div class="w-9 h-9 bg-blue-500/10 rounded-full flex items-center justify-center mr-2">
                <svg class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M3 6h18M3 6v12c0 1.104.896 2 2 2h14c1.104 0 2-.896 2-2V6"></path><rect x="8" y="10" width="8" height="6" rx="2"></rect></svg>
              </div>
              <span class="font-semibold text-gray-800">Groceries</span>
            </div>
            <div class="flex items-center w-full justify-between">
              <span class="font-bold text-gray-800">$760</span>
              <span class="text-xs text-gray-500">18%</span>
            </div>
          </div>
          <div class="bg-white rounded-2xl p-4 shadow flex flex-col items-start cursor-pointer transition hover:bg-purple-50" onclick="alert('Entertainment category')">
            <div class="flex items-center mb-2">
              <div class="w-9 h-9 bg-pink-500/10 rounded-full flex items-center justify-center mr-2">
                <svg class="h-5 w-5 text-pink-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M2 20c0-3.5 4.2-6 10-6s10 2.5 10 6"></path></svg>
              </div>
              <span class="font-semibold text-gray-800">Entertainment</span>
            </div>
            <div class="flex items-center w-full justify-between">
              <span class="font-bold text-gray-800">$480</span>
              <span class="text-xs text-gray-500">11%</span>
            </div>
          </div>
          <div class="bg-white rounded-2xl p-4 shadow flex flex-col items-start cursor-pointer transition hover:bg-purple-50" onclick="alert('Bills category')">
            <div class="flex items-center mb-2">
              <div class="w-9 h-9 bg-yellow-500/10 rounded-full flex items-center justify-center mr-2">
                <svg class="h-5 w-5 text-yellow-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="6" y="10" width="12" height="10" rx="2"></rect><path d="M9 10V6a3 3 0 116 0v4"></path></svg>
              </div>
              <span class="font-semibold text-gray-800">Bills</span>
            </div>
            <div class="flex items-center w-full justify-between">
              <span class="font-bold text-gray-800">$1,550</span>
              <span class="text-xs text-gray-500">37%</span>
            </div>
          </div>
          <div class="bg-white rounded-2xl p-4 shadow flex flex-col items-start cursor-pointer transition hover:bg-purple-50" onclick="alert('Transport category')">
            <div class="flex items-center mb-2">
              <div class="w-9 h-9 bg-green-500/10 rounded-full flex items-center justify-center mr-2">
                <svg class="h-5 w-5 text-green-500" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="7" rx="2"></rect><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="16.5" cy="18.5" r="1.5"/></svg>
              </div>
              <span class="font-semibold text-gray-800">Transport</span>
            </div>
            <div class="flex items-center w-full justify-between">
              <span class="font-bold text-gray-800">$320</span>
              <span class="text-xs text-gray-500">8%</span>
            </div>
          </div>
        </div>
      </div>
      <!-- Trends -->
      <div>
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-gray-900 text-base">Spending Trend</h3>
          <button class="text-xs text-purple-600 font-medium" onclick="alert('Show trend details')">Details</button>
        </div>
        <div class="bg-white rounded-2xl shadow p-5 flex flex-col items-center cursor-pointer transition hover:bg-purple-50" onclick="alert('Monthly trend')">
          <canvas id="trendChart" class="h-28 w-full"></canvas>
        </div>
      </div>
    </main>
    <!-- Bottom Navigation -->
    <div class="absolute bottom-0 left-0 right-0 h-20 bg-white border-t border-gray-100 flex items-center justify-around px-6 z-10">
      <div class="flex flex-col items-center cursor-pointer" onclick="alert('Go to Finance')">
        <svg class="h-6 w-6 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5V6.75A2.25 2.25 0 015.25 4.5h13.5A2.25 2.25 0 0121 6.75v3.75m-18 0v6.75A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 17.25V10.5m-18 0h18"/></svg>
        <span class="text-xs font-medium text-gray-400 mt-1">Finance</span>
      </div>
      <div class="flex flex-col items-center cursor-pointer" onclick="alert('Go to Wallet')">
        <svg class="h-6 w-6 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="5" rx="4"/><path stroke-linecap="round" d="M6 5v-2a2 2 0 012-2h8a2 2 0 012 2v2"/></svg>
        <span class="text-xs font-medium text-gray-400 mt-1">Wallet</span>
      </div>
      <div class="flex flex-col items-center z-10">
        <div class="w-12 h-12 bg-gradient-to-r from-pink-500 to-purple-500 rounded-full flex items-center justify-center -mt-8 shadow cursor-pointer" onclick="alert('Add new entry');">
          <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M12 6v12m6-6H6"/></svg>
        </div>
      </div>
      <div class="flex flex-col items-center cursor-pointer">
        <svg class="h-6 w-6 text-purple-600" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.5h2.25V21M9.75 17.25V21M16.5 12V21M21 7.5v13.5"/></svg>
        <span class="text-xs font-medium text-purple-600 mt-1 font-bold">Stats</span>
        <div class="w-1 h-1 bg-purple-600 rounded-full mt-1"></div>
      </div>
      <div class="flex flex-col items-center cursor-pointer" onclick="alert('Go to More')">
        <svg class="h-6 w-6 text-gray-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></svg>
        <span class="text-xs font-medium text-gray-400 mt-1">More</span>
      </div>
    </div>
  </div>
  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000); updateClock();

    // Spending Chart
    const ctx = document.getElementById('spendingChart').getContext('2d');
    new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Bills','Groceries','Entertainment','Transport'],
        datasets: [{
          data: [1550, 760, 480, 320],
          backgroundColor: [
            'rgba(251,191,36,0.95)',   // yellow-400
            'rgba(59,130,246,0.95)',   // blue-500
            'rgba(236,72,153,0.95)',   // pink-500
            'rgba(34,197,94,0.95)'     // green-500
          ],
          borderWidth: 0,
        }]
      },
      options: {
        cutout: '78%',
        plugins: { legend: { display:false }},
        responsive: true,
        maintainAspectRatio: false,
      }
    });

    // Trend Line Chart
    const tctx = document.getElementById('trendChart').getContext('2d');
    new Chart(tctx, {
      type: 'line',
      data: {
        labels: ['Nov','Dec','Jan','Feb','Mar','Apr','May'],
        datasets: [{
          data: [3300, 3750, 4210, 3900, 4650, 3920, 4210],
          borderColor: 'rgba(139,92,246,1)',
          backgroundColor: 'rgba(139,92,246,0.07)',
          tension: 0.4,
          pointBackgroundColor: 'rgba(139,92,246,1)',
          pointBorderWidth: 2,
          borderWidth: 2,
          fill: true,
          pointRadius: 4,
        }]
      },
      options: {
        plugins: { legend: { display: false } },
        responsive: true,
        maintainAspectRatio: false,
        scales: { x:{ display: true, grid: {display:false} }, y: { display:false }}
      }
    });
  </script>
</body>
</html>
