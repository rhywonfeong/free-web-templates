    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Mesh Gradient</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        first: "moveVertical 30s ease infinite",
                        second: "moveInCircle 20s reverse infinite",
                        third: "moveInCircle 40s linear infinite",
                        fourth: "moveHorizontal 40s ease infinite",
                        fifth: "moveInCircle 20s ease infinite",
                    },
                    keyframes: {
                        moveHorizontal: {
                            "0%": { transform: "translateX(-50%) translateY(-10%)" },
                            "50%": { transform: "translateX(50%) translateY(10%)" },
                            "100%": { transform: "translateX(-50%) translateY(-10%)" }
                        },
                        moveInCircle: {
                            "0%": { transform: "rotate(0deg)" },
                            "50%": { transform: "rotate(180deg)" },
                            "100%": { transform: "rotate(360deg)" }
                        },
                        moveVertical: {
                            "0%": { transform: "translateY(-50%)" },
                            "50%": { transform: "translateY(50%)" },
                            "100%": { transform: "translateY(-50%)" }
                        }
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --gradient-background-start: rgb(108, 0, 162);
            --gradient-background-end: rgb(0, 17, 82);
            --first-color: 18, 113, 255;
            --second-color: 221, 74, 255;
            --third-color: 100, 220, 255;
            --fourth-color: 200, 50, 50;
            --fifth-color: 180, 180, 50;
            --size: 100%;
            --blending-value: screen;
        }
        
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0px 1000px rgba(255, 255, 255, 0.05) inset;
            -webkit-text-fill-color: white;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="font-sans antialiased">
    <div class="h-screen w-screen relative overflow-hidden bg-[linear-gradient(40deg,var(--gradient-background-start),var(--gradient-background-end))]">
        <!-- Animated Gradient Background -->
        <div class="gradients-container absolute inset-0 blur-xl">
            <div class="absolute [background:radial-gradient(circle_at_center,_rgba(var(--first-color),0.8)_0,_rgba(var(--first-color),0)_50%)_no-repeat] [mix-blend-mode:var(--blending-value)] w-[var(--size)] h-[var(--size)] top-[calc(50%-var(--size)/2)] left-[calc(50%-var(--size)/2)] [transform-origin:center_center] animate-first opacity-100"></div>
            
            <div class="absolute [background:radial-gradient(circle_at_center,_rgba(var(--second-color),_0.8)_0,_rgba(var(--second-color),_0)_50%)_no-repeat] [mix-blend-mode:var(--blending-value)] w-[var(--size)] h-[var(--size)] top-[calc(50%-var(--size)/2)] left-[calc(50%-var(--size)/2)] [transform-origin:calc(50%-400px)] animate-second opacity-100"></div>
            
            <div class="absolute [background:radial-gradient(circle_at_center,_rgba(var(--third-color),_0.8)_0,_rgba(var(--third-color),_0)_50%)_no-repeat] [mix-blend-mode:var(--blending-value)] w-[var(--size)] h-[var(--size)] top-[calc(50%-var(--size)/2)] left-[calc(50%-var(--size)/2)] [transform-origin:calc(50%+400px)] animate-third opacity-100"></div>
            
            <div class="absolute [background:radial-gradient(circle_at_center,_rgba(var(--fourth-color),_0.8)_0,_rgba(var(--fourth-color),_0)_50%)_no-repeat] [mix-blend-mode:var(--blending-value)] w-[var(--size)] h-[var(--size)] top-[calc(50%-var(--size)/2)] left-[calc(50%-var(--size)/2)] [transform-origin:calc(50%-200px)] animate-fourth opacity-70"></div>
            
            <div class="absolute [background:radial-gradient(circle_at_center,_rgba(var(--fifth-color),_0.8)_0,_rgba(var(--fifth-color),_0)_50%)_no-repeat] [mix-blend-mode:var(--blending-value)] w-[var(--size)] h-[var(--size)] top-[calc(50%-var(--size)/2)] left-[calc(50%-var(--size)/2)] [transform-origin:calc(50%-800px)_calc(50%+800px)] animate-fifth opacity-100"></div>
        </div>
        
        <!-- Sign Up Form -->
        <div class="relative z-10 flex items-center justify-center min-h-screen px-4">
            <div class="w-full max-w-md bg-black/20 backdrop-blur-xl rounded-3xl p-8 md:p-10 shadow-[0_8px_40px_rgba(0,0,0,0.3)]">
                <div class="mb-8 text-center">
                    <h1 class="text-3xl font-bold text-white mb-2">Create Account</h1>
                    <p class="text-blue-100/80">Join our community today</p>
                </div>
                
                <form class="space-y-6">
                    <div>
                        <label for="fullName" class="block text-sm font-medium text-blue-100 mb-1.5">Full Name</label>
                        <input type="text" id="fullName" name="fullName" required 
                               class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-blue-100/50 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-transparent transition-all" 
                               placeholder="Enter your full name">
                    </div>
                    
                    <div>
                        <label for="email" class="block text-sm font-medium text-blue-100 mb-1.5">Email Address</label>
                        <input type="email" id="email" name="email" required 
                               class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-blue-100/50 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-transparent transition-all" 
                               placeholder="you@example.com">
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-blue-100 mb-1.5">Password</label>
                        <input type="password" id="password" name="password" required 
                               class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-blue-100/50 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-transparent transition-all" 
                               placeholder="Create a password">
                    </div>
                    
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-blue-100 mb-1.5">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required 
                               class="w-full bg-white/10 border border-white/20 rounded-xl px-4 py-3 text-white placeholder-blue-100/50 focus:outline-none focus:ring-2 focus:ring-purple-500/50 focus:border-transparent transition-all" 
                               placeholder="Confirm your password">
                    </div>
                    
                    <div class="pt-2">
                        <button type="submit" 
                                class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white font-medium py-3 px-4 rounded-xl hover:from-purple-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:ring-offset-gray-900 transition-all shadow-lg hover:shadow-xl">
                            Sign Up
                        </button>
                    </div>
                </form>
                
                <div class="mt-8 text-center">
                    <p class="text-blue-100/70">
                        Already have an account? 
                        <a href="#" class="text-white font-medium hover:text-purple-300 transition-colors">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
