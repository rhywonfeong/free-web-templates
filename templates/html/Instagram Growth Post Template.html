<!DOCTYPE html>
<html lang="pt-BR"><head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Post Design</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
</style></head>
<body class="bg-zinc-100 min-h-screen flex items-center justify-center p-4">

    <!-- Instagram Post Container (1080x1350 aspect ratio) -->
    <div class="relative w-full max-w-md aspect-[4/5] bg-black overflow-hidden flex flex-col shadow-2xl">
        
        <!-- Ambient Background Effects -->
        <!-- Top Right Glow -->
        <div class="absolute -top-20 -right-20 w-96 h-96 bg-gradient-to-br from-pink-600/40 to-red-600/20 rounded-full blur-[100px] opacity-60"></div>
        <!-- Bottom Left Glow -->
        <div class="absolute -bottom-32 -left-20 w-[500px] h-[500px] bg-gradient-to-tr from-red-900/30 via-pink-900/20 to-transparent rounded-full blur-[120px] opacity-50"></div>
        
        <!-- Subtle Grid Pattern -->
        <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:64px_64px] opacity-40"></div>
        
        <!-- Content Wrapper -->
        <div class="relative z-10 flex flex-col justify-between h-full p-10">
            
            <!-- Header -->
            <div class="flex items-start justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center shadow-lg">
                        <!-- Custom Abstract Logo using Lucide -->
                        <i data-lucide="bar-chart-2" class="text-white w-5 h-5" stroke-width="1.5"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-sm font-medium text-zinc-100 tracking-tight leading-tight">Vitor Prado</span>
                        <span class="text-xs text-zinc-500 tracking-wide font-normal">Anúncios e Inteligência</span>
                    </div>
                </div>
                
                <!-- Tag/Pill -->
                <div class="px-3 py-1 rounded-full border border-zinc-800 bg-zinc-900/50 backdrop-blur-sm">
                    <span class="text-xs font-medium text-zinc-400 tracking-wide">Growth</span>
                </div>
            </div>

            <!-- Main Typography -->
            <div class="flex flex-col gap-6 mt-8">
                <!-- Status Pill -->
                <div class="self-start inline-flex items-center gap-2 pl-2 pr-3 py-1 rounded-full border border-pink-500/20 bg-gradient-to-r from-pink-500/10 to-red-500/10 backdrop-blur-md">
                    <div class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-500 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-pink-500"></span>
                    </div>
                    <span class="text-xs font-medium text-pink-200 tracking-wide">30 dias</span>
                </div>

                <!-- Headline -->
                <h1 class="text-5xl font-medium text-white tracking-tight leading-[1.05]">
                    De <span class="text-zinc-500">10</span> para <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-pink-500 to-red-500 pb-1">+40 matrículas</span>
                </h1>

                <!-- Divider Line -->
                <div class="w-16 h-[1px] bg-gradient-to-r from-zinc-700 to-transparent"></div>

                <!-- Subtext -->
                <div class="flex flex-col gap-1 text-xl font-normal text-zinc-400">
                    <div class="flex items-center gap-3">
                        <i data-lucide="x" class="text-zinc-600 w-4 h-4" stroke-width="1.5"></i>
                        <span>Sem promessa.</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <i data-lucide="x" class="text-zinc-600 w-4 h-4" stroke-width="1.5"></i>
                        <span>Sem milagre.</span>
                    </div>
                    <div class="flex items-center gap-3 mt-1">
                        <i data-lucide="check" class="text-green-500 w-4 h-4" stroke-width="1.5"></i>
                        <span class="text-white font-medium">Só processo.</span>
                    </div>
                </div>
            </div>

            <!-- Footer / CTA -->
            <div class="flex items-end justify-between mt-auto pt-8">
                <!-- Carousel Indicators -->
                <div class="flex gap-1.5 pb-2">
                    <div class="w-1.5 h-1.5 rounded-full bg-white"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-zinc-800"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-zinc-800"></div>
                    <div class="w-1.5 h-1.5 rounded-full bg-zinc-800"></div>
                </div>

                <!-- CTA Button -->
                <div class="group flex items-center gap-3 pl-5 pr-4 py-3 bg-white text-black rounded-full shadow-[0_0_20px_rgba(255,255,255,0.1)] hover:scale-[1.02] transition-transform duration-300 ease-out">
                    <span class="text-sm font-medium tracking-tight">Arrasta pra ver mais</span>
                    <i data-lucide="arrow-right" class="w-4 h-4 text-black group-hover:translate-x-1 transition-transform" stroke-width="1.5"></i>
                </div>
            </div>
        </div>

        <!-- Glass overlay for texture -->
        <div class="absolute inset-0 bg-noise opacity-[0.03] pointer-events-none mix-blend-overlay"></div>
    </div>

    <script>
        lucide.createIcons();
    </script>

</body></html>
