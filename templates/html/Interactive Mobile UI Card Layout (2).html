            background-color: #1a1c20;

        .card {
            background-color: rgba(26, 27, 34, 0.95);

            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .phone-body {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .screen-shape {

            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }
        .screen-content {

            box-shadow: 0 4px 12px rgba(51, 97, 216, 0.3);

        .blue-button:hover {

            box-shadow: 0 6px 16px rgba(51, 97, 216, 0.4);
        }
        .content-container {
            background-color: rgba(26, 27, 34, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }
        
        /* Subtle stroke path animation */
        .phone-outline {
            position: absolute;
            top: -70px;
            left: 0;
            width: 180px;
            height: 320px;
            fill: none;
            stroke-width: 1.5;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            z-index: 30;
            animation: draw 4s ease-in-out infinite alternate;
        }
        
        @keyframes draw {
            0% {
                stroke-dashoffset: 1000;
                stroke: rgba(77, 124, 254, 0.2);
                filter: drop-shadow(0 0 1px rgba(77, 124, 254, 0.1));
            }
            50% {
                stroke: rgba(77, 124, 254, 0.8);

            100% {
                stroke-dashoffset: 0;
                stroke: rgba(77, 124, 254, 0.2);
                filter: drop-shadow(0 0 1px rgba(77, 124, 254, 0.1));
