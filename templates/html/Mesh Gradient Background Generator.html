<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesh Gradient Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist+Sans:wght@400;500;600&display=swap">
  <style>
    body { font-family: 'Geist Sans', sans-serif; }
    pre { font-family: 'Geist Mono', monospace; }
  </style>
</head>
<body class="bg-gray-950 text-gray-200 flex items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-4xl bg-gray-900 rounded-lg shadow-xl overflow-hidden border border-gray-800">
    <div class="p-4 border-b border-gray-800">
      <h1 class="text-lg font-medium text-white">Mesh Gradient Generator</h1>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2">
      <!-- Controls -->
      <div class="p-4 border-r border-gray-800">
        <div class="space-y-4">
          <!-- Color 1 -->
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Color 1</label>
            <div class="flex items-center space-x-2">
              <input type="color" id="color1" value="#635BFF" class="h-8 w-8 rounded cursor-pointer bg-transparent">
              <input type="text" id="color1Text" value="#635BFF" class="flex-1 px-2 py-1 bg-gray-800 border border-gray-700 rounded text-xs">
            </div>
            <div class="mt-2 grid grid-cols-4 gap-1">
              <button data-color="#635BFF" class="color-preset w-full h-5 rounded bg-[#635BFF]"></button>
              <button data-color="#00D4FF" class="color-preset w-full h-5 rounded bg-[#00D4FF]"></button>
              <button data-color="#FF6BCB" class="color-preset w-full h-5 rounded bg-[#FF6BCB]"></button>
              <button data-color="#FFB347" class="color-preset w-full h-5 rounded bg-[#FFB347]"></button>
            </div>
          </div>
          
          <!-- Color 2 -->
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Color 2</label>
            <div class="flex items-center space-x-2">
              <input type="color" id="color2" value="#00D4FF" class="h-8 w-8 rounded cursor-pointer bg-transparent">
              <input type="text" id="color2Text" value="#00D4FF" class="flex-1 px-2 py-1 bg-gray-800 border border-gray-700 rounded text-xs">
            </div>
            <div class="mt-2 grid grid-cols-4 gap-1">
              <button data-color="#635BFF" class="color-preset w-full h-5 rounded bg-[#635BFF]"></button>
              <button data-color="#00D4FF" class="color-preset w-full h-5 rounded bg-[#00D4FF]"></button>
              <button data-color="#FF6BCB" class="color-preset w-full h-5 rounded bg-[#FF6BCB]"></button>
              <button data-color="#FFB347" class="color-preset w-full h-5 rounded bg-[#FFB347]"></button>
            </div>
          </div>
          
          <!-- Position Controls -->
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Positions</label>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-[10px] text-gray-500 mb-1">X1</label>
                <input type="range" id="x1" min="0" max="100" value="0" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer">
              </div>
              <div>
                <label class="block text-[10px] text-gray-500 mb-1">Y1</label>
                <input type="range" id="y1" min="0" max="100" value="0" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer">
              </div>
              <div>
                <label class="block text-[10px] text-gray-500 mb-1">X2</label>
                <input type="range" id="x2" min="0" max="100" value="100" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer">
              </div>
              <div>
                <label class="block text-[10px] text-gray-500 mb-1">Y2</label>
                <input type="range" id="y2" min="0" max="100" value="100" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer">
              </div>
            </div>
          </div>
          
          <!-- Blur -->
          <div>
            <label class="block text-xs font-medium text-gray-400 mb-1">Blur</label>
            <input type="range" id="blur" min="0" max="100" value="40" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer">
          </div>
          
          <!-- Actions -->
          <div class="flex space-x-2 pt-2">
            <button id="randomize" class="flex-1 bg-gray-800 text-gray-200 py-1.5 px-3 rounded border border-gray-700 hover:bg-gray-700 text-xs">
              Randomize
            </button>
            <button id="copyCSS" class="flex-1 bg-indigo-900 text-gray-100 py-1.5 px-3 rounded border border-indigo-800 hover:bg-indigo-800 text-xs">
              Copy CSS
            </button>
          </div>
        </div>
      </div>
      
      <!-- Preview -->
      <div class="p-4">
        <div id="gradientPreview" class="w-full h-48 rounded-md mb-4 border border-gray-800"></div>
        
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1">CSS Code</label>
          <div class="relative">
            <pre id="cssCode" class="bg-gray-800 p-2 rounded-md text-[10px] overflow-x-auto text-gray-300 border border-gray-700"></pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const color1Input = document.getElementById('color1');
      const color2Input = document.getElementById('color2');
      const color1Text = document.getElementById('color1Text');
      const color2Text = document.getElementById('color2Text');
      const x1Input = document.getElementById('x1');
      const y1Input = document.getElementById('y1');
      const x2Input = document.getElementById('x2');
      const y2Input = document.getElementById('y2');
      const blurInput = document.getElementById('blur');
      const gradientPreview = document.getElementById('gradientPreview');
      const cssCode = document.getElementById('cssCode');
      const randomizeBtn = document.getElementById('randomize');
      const copyCSSBtn = document.getElementById('copyCSS');
      
      // Connect color inputs
      color1Input.addEventListener('input', () => {
        color1Text.value = color1Input.value;
        updateGradient();
      });
      
      color2Input.addEventListener('input', () => {
        color2Text.value = color2Input.value;
        updateGradient();
      });
      
      color1Text.addEventListener('input', () => {
        color1Input.value = color1Text.value;
        updateGradient();
      });
      
      color2Text.addEventListener('input', () => {
        color2Input.value = color2Text.value;
        updateGradient();
      });
      
      // Color presets
      document.querySelectorAll('.color-preset').forEach(btn => {
        btn.addEventListener('click', () => {
          const color = btn.getAttribute('data-color');
          const parent = btn.closest('div').parentElement;
          const colorInput = parent.querySelector('input[type="color"]');
          const textInput = parent.querySelector('input[type="text"]');
          
          colorInput.value = color;
          textInput.value = color;
          updateGradient();
        });
      });
      
      // Position controls
      [x1Input, y1Input, x2Input, y2Input, blurInput].forEach(input => {
        input.addEventListener('input', updateGradient);
      });
      
      // Randomize button
      randomizeBtn.addEventListener('click', () => {
        const randomColor = () => {
          const letters = '0123456789ABCDEF';
          let color = '#';
          for (let i = 0; i < 6; i++) {
            color += letters[Math.floor(Math.random() * 16)];
          }
          return color;
        };
        
        color1Input.value = randomColor();
        color2Input.value = randomColor();
        color1Text.value = color1Input.value;
        color2Text.value = color2Input.value;
        
        x1Input.value = Math.floor(Math.random() * 100);
        y1Input.value = Math.floor(Math.random() * 100);
        x2Input.value = Math.floor(Math.random() * 100);
        y2Input.value = Math.floor(Math.random() * 100);
        blurInput.value = Math.floor(Math.random() * 80) + 20;
        
        updateGradient();
      });
      
      // Copy CSS button
      copyCSSBtn.addEventListener('click', () => {
        const textToCopy = cssCode.textContent;
        navigator.clipboard.writeText(textToCopy);
        
        copyCSSBtn.textContent = 'Copied!';
        setTimeout(() => {
          copyCSSBtn.textContent = 'Copy CSS';
        }, 2000);
      });
      
      // Generate CSS
      function updateGradient() {
        const color1 = color1Input.value;
        const color2 = color2Input.value;
        const x1 = x1Input.value;
        const y1 = y1Input.value;
        const x2 = x2Input.value;
        const y2 = y2Input.value;
        const blur = blurInput.value;
        
        const radialGradient1 = `radial-gradient(circle at ${x1}% ${y1}%, ${color1} 0%, transparent ${blur}%)`;
        const radialGradient2 = `radial-gradient(circle at ${x2}% ${y2}%, ${color2} 0%, transparent ${blur}%)`;
        
        const backgroundValue = `${radialGradient1}, ${radialGradient2}`;
        gradientPreview.style.background = backgroundValue;
        
        cssCode.textContent = `.mesh-gradient {
  background: ${backgroundValue};
}`;
      }
      
      // Initial update
      updateGradient();
    });
  </script>
</body>
</html>
