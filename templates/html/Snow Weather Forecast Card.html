  <meta charset="UTF-8">

  <title>Snow Weather Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #3b82f6 100%);
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
    }
    #particles-js {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
    }
    .glass {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes rotate-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-pulse-slow { animation: pulse 3s ease-in-out infinite; }
    .animate-float { animation: float 4s ease-in-out infinite; }
    .animate-shimmer { animation: shimmer 2s ease-in-out infinite; }
    .animate-rotate-slow { animation: rotate-slow 8s linear infinite; }
  </style>
</head>
<body>
  <div id="particles-js"></div>
  
  <div class="flex items-center justify-center min-h-screen p-4 relative z-10">
    <div class="max-w-sm w-full glass rounded-xl overflow-hidden shadow-2xl">
      <!-- Header -->
      <div class="px-6 pt-6 pb-4 border-b border-white/20">

          <div class="flex items-center space-x-2">

            </div>
            <p class="text-gray-200 text-sm mt-1">Heavy Snow</p>
          </div>

          <div class="text-white animate-float">

              <circle cx="7.05" cy="16.95" r="1" fill="currentColor"/>

          </div>
        </div>
      </div>
      
      <!-- Stats -->
      <div class="px-6 py-4 bg-white/10 grid grid-cols-3 gap-2 text-center">
        <div class="px-2 py-3">
          <p class="text-xs text-gray-200 uppercase tracking-wide">Humidity</p>
          <p class="text-white font-medium mt-1">94%</p>
        </div>
        <div class="px-2 py-3">
          <p class="text-xs text-gray-200 uppercase tracking-wide">Wind</p>
          <p class="text-white font-medium mt-1">8 mph</p>
        </div>
        <div class="px-2 py-3">
          <p class="text-xs text-gray-200 uppercase tracking-wide">Feels like</p>
          <p class="text-white font-medium mt-1">18°</p>
        </div>
      </div>
      
      <!-- Forecast -->
      <div class="px-6 py-4 border-t border-white/20">

            <p class="text-xs text-gray-200">Mon</p>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" class="w-6 h-6 mx-auto my-1 text-white animate-shimmer">

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-6 h-6 mx-auto my-1 text-gray-200 animate-float">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />

            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5" class="w-6 h-6 mx-auto my-1 text-white animate-shimmer" style="animation-delay: 0.5s">

            </svg>
            <p class="text-xs font-medium text-white">26°</p>
          </div>
        </div>
      </div>
    </div>
