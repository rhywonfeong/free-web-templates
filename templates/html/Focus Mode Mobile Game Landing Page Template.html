<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Focus Mode: The Game</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
touch-action: manipulation;
}
/* Custom Scrollbar for hidden aesthetics */
.no-scrollbar::-webkit-scrollbar {
display: none;
}
.no-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
/* Animations */
@keyframes slideIn {
from { transform: translateY(-20px) scale(0.95); opacity: 0; }
to { transform: translateY(0) scale(1); opacity: 1; }
}
@keyframes popOut {
to { transform: translateX(100%); opacity: 0; height: 0; margin: 0; padding: 0; border: 0; }
}
.notification-enter {
animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.notification-exit {
animation: popOut 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
pointer-events: none;
}
/* Custom Range Slider for Health Bar simulation */
input[type=range] {
-webkit-appearance: none;
background: transparent;
}
input[type=range]::-webkit-slider-thumb {
-webkit-appearance: none;
}
input[type=range]:focus {
outline: none;
}
.glass-panel {
background: rgba(24, 24, 27, 0.6);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
}
</style></head>
<body class="bg-zinc-950 text-zinc-300 h-screen w-full flex items-center justify-center overflow-hidden selection:bg-indigo-500/30">

    <!-- Ambient Background -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] bg-indigo-900/20 rounded-full blur-[120px]"></div>
        <div class="absolute top-[40%] -right-[10%] w-[40%] h-[60%] bg-emerald-900/10 rounded-full blur-[100px]"></div>
    </div>

    <!-- Phone Frame -->
    <div class="relative w-full max-w-sm h-full sm:h-[90vh] sm:max-h-[850px] bg-black sm:rounded-[3rem] sm:border sm:border-zinc-800 shadow-2xl flex flex-col overflow-hidden ring-1 ring-white/5">
        
        <!-- Status Bar -->
        <div class="h-14 flex items-center justify-between px-6 shrink-0 z-20">
            <span id="clock" class="text-sm font-medium tracking-wide text-zinc-400">09:41</span>
            <div class="flex items-center gap-2 text-zinc-400">
                <iconify-icon icon="solar:signal-linear" width="16" stroke-width="1.5"></iconify-icon>
                <iconify-icon icon="solar:wi-fi-linear" width="16" stroke-width="1.5"></iconify-icon>
                <iconify-icon icon="solar:battery-charge-linear" width="18" stroke-width="1.5"></iconify-icon>
            </div>
        </div>

        <!-- Dynamic Notch Island (Game Status) -->
        <div class="absolute top-2 left-1/2 -translate-x-1/2 w-[120px] h-[32px] bg-black rounded-full z-30 flex items-center justify-center transition-all duration-300 overflow-hidden group" id="dynamic-island">
            <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                <span class="text-[10px] font-medium tracking-tight text-emerald-500 uppercase">Focus Mode</span>
            </div>
        </div>

        <!-- Game Area: Notification Center -->
        <div class="flex-1 relative flex flex-col z-10">
            
            <!-- Date/Header -->
            <div class="px-6 py-4 transition-opacity duration-500" id="lockscreen-header">
                <div class="flex flex-col items-center pt-8 pb-4">
                    <iconify-icon icon="solar:lock-unlocked-linear" class="text-zinc-500 mb-4" width="24" stroke-width="1.5"></iconify-icon>
                    <h1 class="text-5xl font-medium tracking-tighter text-white mb-2" id="big-clock">09:41</h1>
                    <p class="text-base text-zinc-400 font-normal" id="date-display">Tuesday, October 24</p>
                </div>
            </div>

            <!-- Focus Meter (Health) -->
            <div class="px-6 mb-4 opacity-0 transition-opacity duration-500" id="game-hud">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-xs font-medium text-zinc-400 tracking-wide uppercase">Focus Level</span>
                    <span class="text-xs font-mono text-white" id="score-display">0</span>
                </div>
                <div class="h-1 w-full bg-zinc-800 rounded-full overflow-hidden">
                    <div id="stress-bar" class="h-full bg-gradient-to-r from-emerald-500 to-emerald-400 w-full transition-all duration-300 ease-linear"></div>
                </div>
            </div>

            <!-- Notifications Container -->
            <div id="notification-list" class="flex-1 overflow-y-auto overflow-x-hidden px-4 pb-24 space-y-3 no-scrollbar relative mask-image-b">
                <!-- Notifications injected here -->
            </div>

            <!-- Bottom Action / Start Button -->
            <div class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-black via-black/90 to-transparent z-20 flex flex-col items-center gap-4">
                
                <!-- Start UI -->
                <div id="start-screen" class="w-full flex flex-col gap-3">
                    <button onclick="startGame()" class="group w-full h-12 bg-white text-black rounded-full font-medium text-sm tracking-tight hover:bg-zinc-200 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(255,255,255,0.15)]">
                        <span>Enable Focus Mode</span>
                        <iconify-icon icon="solar:arrow-right-linear" width="18" stroke-width="1.5" class="group-hover:translate-x-1 transition-transform"></iconify-icon>
                    </button>
                    <p class="text-center text-xs text-zinc-500">Clear notifications to stay focused.</p>
                </div>

                <!-- Game Over UI -->
                <div id="game-over-screen" class="hidden w-full flex flex-col gap-3 backdrop-blur-md bg-zinc-900/80 p-6 rounded-3xl border border-white/10 text-center shadow-2xl">
                    <div class="w-10 h-10 rounded-full bg-red-500/10 text-red-500 mx-auto flex items-center justify-center mb-1">
                        <iconify-icon icon="solar:danger-circle-linear" width="24" stroke-width="1.5"></iconify-icon>
                    </div>
                    <h3 class="text-lg font-medium text-white tracking-tight">Focus Lost</h3>
                    <p class="text-xs text-zinc-400 leading-relaxed">
                        You were overwhelmed by digital distractions.<br>
                        Final Score: <span id="final-score" class="text-white font-mono">0</span>
                    </p>
                    <button onclick="resetGame()" class="mt-2 w-full h-10 bg-white/10 text-white border border-white/10 rounded-full font-medium text-xs tracking-tight hover:bg-white hover:text-black transition-colors">
                        Try Again
                    </button>
                </div>

                <!-- Footer Handler -->
                <div class="w-32 h-1 bg-zinc-800 rounded-full mt-2"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Game Config ---
        const NOTIFICATION_TYPES = [
            { app: 'Messages', icon: 'solar:chat-round-dots-linear', color: 'text-green-500', bg: 'bg-green-500/10', senders: ['Mom', 'Alex', 'Sarah', 'Boss', 'Unknown'], msgs: ['Call me asap!', 'Did you see this?', 'Can we talk?', 'Meeting in 5 min', 'sent an image'] },
            { app: 'Mail', icon: 'solar:letter-linear', color: 'text-blue-500', bg: 'bg-blue-500/10', senders: ['Newsletter', 'HR Dept', 'Support', 'LinkedIn', 'Jira'], msgs: ['Update on your ticket', 'Invitation to connect', 'Action Required', 'Weekly Digest', 'New task assigned'] },
            { app: 'Calendar', icon: 'solar:calendar-linear', color: 'text-red-500', bg: 'bg-red-500/10', senders: ['Calendar', 'Reminder'], msgs: ['Standup in 10m', 'Lunch with Team', 'Doctor Appointment', 'Submit Report', 'Focus Time ending'] },
            { app: 'Wallet', icon: 'solar:wallet-money-linear', color: 'text-orange-500', bg: 'bg-orange-500/10', senders: ['Bank', 'CryptoApp'], msgs: ['Payment Received', 'Transaction Alert', 'Subscription Renewed', 'Market is down', 'Confirm Purchase'] },
            { app: 'System', icon: 'solar:settings-linear', color: 'text-zinc-400', bg: 'bg-zinc-500/10', senders: ['System', 'Security'], msgs: ['Update Available', 'Storage Full', 'Backup Failed', 'New Device Detected', 'Battery Low'] },
            { app: 'Social', icon: 'solar:heart-linear', color: 'text-pink-500', bg: 'bg-pink-500/10', senders: ['Instagram', 'Twitter', 'TikTok'], msgs: ['liked your photo', 'mentioned you', 'started following you', 'went live', 'commented: "Wow"'] }
        ];

        let state = {
            active: false,
            score: 0,
            health: 100,
            speed: 2000,
            intervalId: null,
            difficultyInterval: null,
            notifications: []
        };

        // --- DOM Elements ---
        const list = document.getElementById('notification-list');
        const scoreEl = document.getElementById('score-display');
        const finalScoreEl = document.getElementById('final-score');
        const healthBar = document.getElementById('stress-bar');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const hud = document.getElementById('game-hud');
        const header = document.getElementById('lockscreen-header');
        const timeEl = document.getElementById('clock');
        const bigTimeEl = document.getElementById('big-clock');
        const dateEl = document.getElementById('date-display');
        const island = document.getElementById('dynamic-island');

        // --- Utilities ---
        const updateTime = () => {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            timeEl.innerText = timeStr;
            bigTimeEl.innerText = timeStr;
            dateEl.innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
        };
        setInterval(updateTime, 1000);
        updateTime();

        // --- Game Logic ---
        
        function startGame() {
            state = { active: true, score: 0, health: 100, speed: 2000, notifications: [], intervalId: null };
            
            // UI Transition
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            header.style.opacity = '0';
            header.style.height = '0';
            header.style.overflow = 'hidden';
            header.style.padding = '0';
            hud.classList.remove('opacity-0');
            island.style.width = '200px';
            
            list.innerHTML = '';
            updateHealth();

            // Game Loop
            state.intervalId = setTimeout(spawnLoop, state.speed);
            
            // Increase Difficulty
            state.difficultyInterval = setInterval(() => {
                if(state.speed > 600) state.speed -= 100;
            }, 5000);
        }

        function spawnLoop() {
            if (!state.active) return;
            spawnNotification();
            
            // Randomize timing slightly for realism
            const randomVar = Math.random() * 500;
            state.intervalId = setTimeout(spawnLoop, state.speed - randomVar);
        }

        function spawnNotification() {
            if (!state.active) return;

            // Generate content
            const type = NOTIFICATION_TYPES[Math.floor(Math.random() * NOTIFICATION_TYPES.length)];
            const sender = type.senders[Math.floor(Math.random() * type.senders.length)];
            const msg = type.msgs[Math.floor(Math.random() * type.msgs.length)];
            const id = Date.now() + Math.random();

            // Create Element
            const el = document.createElement('div');
            el.className = 'notification-enter group relative w-full p-3 bg-zinc-900/80 backdrop-blur-xl border border-white/5 rounded-2xl select-none cursor-pointer hover:bg-zinc-800 transition-colors shadow-lg active:scale-[0.98] transform';
            el.innerHTML = `
                <div class="flex items-start gap-3">
                    <div class="shrink-0 w-10 h-10 rounded-xl ${type.bg} flex items-center justify-center ${type.color}">
                        <iconify-icon icon="${type.icon}" width="20" stroke-width="1.5"></iconify-icon>
                    </div>
                    <div class="flex-1 min-w-0 pt-0.5">
                        <div class="flex justify-between items-baseline mb-0.5">
                            <h4 class="text-sm font-semibold text-zinc-200 truncate pr-2">${sender}</h4>
                            <span class="text-[10px] text-zinc-500 font-medium">now</span>
                        </div>
                        <p class="text-xs text-zinc-400 leading-snug truncate">${msg}</p>
                    </div>
                </div>
                <div class="absolute -right-2 -top-2 w-5 h-5 bg-zinc-700 text-white rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity shadow-md pointer-events-none">
                    <iconify-icon icon="solar:close-circle-bold" width="20"></iconify-icon>
                </div>
            `;

            // Click Handler (Clear Notification)
            el.addEventListener('click', (e) => {
                if(!state.active) return;
                // Ripple effect could go here
                el.classList.remove('notification-enter');
                el.classList.add('notification-exit');
                
                // Audio Context would go here for sound
                
                setTimeout(() => el.remove(), 300);
                
                // Update Score
                state.score += 100;
                scoreEl.innerText = state.score;
                
                // Heal slightly
                state.health = Math.min(100, state.health + 5);
                updateHealth();
            });

            // Add to DOM
            list.prepend(el); // Newest on top

            // Check Overflow (Lose Condition if list is too tall effectively)
            // But we use health decay based on count
            if (list.children.length > 6) {
                state.health -= 15;
                updateHealth();
            }

            // Natural decay just for existing
            state.health -= 2; 
            updateHealth();
        }

        function updateHealth() {
            healthBar.style.width = `${Math.max(0, state.health)}%`;
            
            // Color shift based on health
            if(state.health > 50) {
                healthBar.className = 'h-full w-full transition-all duration-300 ease-linear bg-gradient-to-r from-emerald-500 to-emerald-400';
            } else if (state.health > 20) {
                healthBar.className = 'h-full w-full transition-all duration-300 ease-linear bg-gradient-to-r from-yellow-500 to-orange-400';
            } else {
                healthBar.className = 'h-full w-full transition-all duration-300 ease-linear bg-gradient-to-r from-red-600 to-red-500 animate-pulse';
            }

            if (state.health <= 0) {
                gameOver();
            }
        }

        function gameOver() {
            state.active = false;
            clearTimeout(state.intervalId);
            clearInterval(state.difficultyInterval);
            
            finalScoreEl.innerText = state.score;
            gameOverScreen.classList.remove('hidden');
            hud.classList.add('opacity-0');
            island.style.width = '120px';
        }

        function resetGame() {
            startScreen.classList.remove('hidden');
            gameOverScreen.classList.add('hidden');
            
            // Reset visuals
            header.style.opacity = '1';
            header.style.height = 'auto';
            header.style.padding = '1rem 1.5rem';
            
            list.innerHTML = '';
            startGame();
        }

    </script>
</body>
