<body class="bg-[#FCFCFC] text-zinc-800 font-sans antialiased h-screen flex overflow-hidden selection:bg-emerald-100 selection:text-emerald-900" style="font-family: 'Inter', sans-serif;">

    <!-- Mobile Sidebar Overlay -->
    <div id="overlay" class="fixed inset-0 bg-zinc-900/20 backdrop-blur-sm z-40 hidden lg:hidden" aria-hidden="true"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-[#FCFCFC] border-r border-zinc-200 flex flex-col flex-shrink-0 h-full fixed lg:static z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">
        <!-- Logo -->
        <div class="h-16 flex items-center px-6 border-b border-zinc-100">
            <span class="text-xl font-semibold tracking-tighter text-zinc-900">QRN.</span>
        </div>

        <!-- Search -->
        <div class="p-4 border-b border-zinc-100">
            <div class="relative flex items-center group">
                <iconify-icon icon="solar:magnifer-linear" stroke-width="1.5" class="absolute left-3 text-zinc-400 group-focus-within:text-emerald-600 transition-colors text-lg"></iconify-icon>
                <input id="search-input" type="text" placeholder="Search Surah..." class="w-full bg-zinc-100/50 hover:bg-zinc-100 focus:bg-white border border-transparent focus:border-emerald-500/30 focus:ring-4 focus:ring-emerald-500/10 text-sm rounded-lg pl-9 pr-3 py-2 outline-none transition-all placeholder:text-zinc-500 text-zinc-900">
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="px-4 pt-4 pb-2 flex gap-4 border-b border-zinc-100 text-sm font-medium">
            <button class="text-zinc-900 border-b-2 border-zinc-900 pb-2">Surahs</button>
            <button class="text-zinc-500 hover:text-zinc-900 transition-colors pb-2">Juz</button>
            <button class="text-zinc-500 hover:text-zinc-900 transition-colors pb-2">Bookmarks</button>
        </div>

        <!-- Sidebar Surah List (Dynamic) -->
        <div id="sidebar-surahs" class="flex-1 overflow-y-auto px-3 py-2 scrollbar-hide space-y-1">
            <div class="text-center py-4 text-xs text-zinc-400">Loading...</div>
        </div>

        <!-- User/Settings -->
        <div class="p-4 border-t border-zinc-100 flex items-center justify-between">
            <button class="flex items-center gap-2 text-sm font-medium text-zinc-600 hover:text-zinc-900 transition-colors">
                <div class="w-8 h-8 rounded-full bg-zinc-100 border border-zinc-200 flex items-center justify-center">
                    <iconify-icon icon="solar:user-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                </div>
                Sign In
            </button>
            <button class="p-2 text-zinc-400 hover:text-zinc-900 transition-colors rounded-lg hover:bg-zinc-100">
                <iconify-icon icon="solar:settings-linear" stroke-width="1.5" class="text-xl"></iconify-icon>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0 bg-zinc-50/50 relative">
        <!-- Header -->
        <header class="h-16 border-b border-zinc-100 flex items-center justify-between px-4 sm:px-8 bg-white/80 backdrop-blur-md sticky top-0 z-30">
            <div class="flex items-center gap-4">
                <button id="mobile-menu-btn" class="lg:hidden p-2 -ml-2 text-zinc-600 hover:text-zinc-900 rounded-lg hover:bg-zinc-50">
                    <iconify-icon icon="solar:hamburger-menu-linear" stroke-width="1.5" class="text-xl"></iconify-icon>
                </button>
                <div>
                    <h1 class="text-xl font-semibold tracking-tight text-zinc-900">All Surahs</h1>
                    <p id="surah-count" class="text-xs text-zinc-500">114 Surahs</p>
                </div>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <button class="flex items-center gap-2 px-3 py-1.5 rounded-lg border border-zinc-200/60 bg-white text-zinc-600 hover:text-zinc-900 hover:bg-zinc-50 transition-colors text-sm font-medium shadow-sm">
                    <iconify-icon icon="solar:sort-from-top-to-bottom-linear" stroke-width="1.5" class="text-lg hidden sm:block"></iconify-icon>
                    <span>Sort: Number</span>
                    <iconify-icon icon="solar:alt-arrow-down-linear" stroke-width="1.5" class="text-lg opacity-50"></iconify-icon>
                </button>
            </div>
        </header>

        <!-- Surahs Grid Area -->
        <div class="flex-1 overflow-y-auto w-full px-4 sm:px-8 py-6 lg:py-8 scroll-smooth">
            <div class="max-w-7xl mx-auto">
                <!-- Dynamic Grid container -->
                <div id="surahs-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 pb-24">
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-zinc-500 gap-3">
                        <iconify-icon icon="solar:spinner-linear" class="text-2xl animate-spin"></iconify-icon>
                        <span class="text-sm">Loading Surahs from API...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Global Audio Player (Fixed Bottom) -->
        <div class="absolute bottom-0 left-0 right-0 bg-white/90 backdrop-blur-xl border-t border-zinc-200/80 px-4 sm:px-8 py-4 flex items-center justify-between z-40 transform translate-y-0 transition-transform">
            <div class="flex items-center gap-4 w-1/3">
                <div class="w-10 h-10 rounded-lg bg-zinc-100 flex items-center justify-center text-zinc-500 overflow-hidden shadow-sm">
                    <img src="https://i.pravatar.cc/100?img=11" alt="Reciter" class="w-full h-full object-cover opacity-80 mix-blend-multiply">
                </div>
                <div class="hidden sm:block truncate pr-4">
                    <div id="current-surah-name" class="text-sm font-medium text-zinc-900 truncate">Select a Surah</div>
                    <div id="current-surah-desc" class="text-xs text-zinc-500 truncate">Mishary Rashid Alafasy</div>
                </div>
            </div>

            <div class="flex flex-col items-center w-1/3 gap-2">
                <div class="flex items-center gap-4">
                    <button id="prev-btn" class="text-zinc-400 hover:text-zinc-900 transition-colors hidden sm:block">
                        <iconify-icon icon="solar:skip-previous-linear" stroke-width="1.5" class="text-xl"></iconify-icon>
                    </button>
                    <button id="play-btn" class="w-10 h-10 rounded-full bg-zinc-900 text-white flex items-center justify-center hover:bg-zinc-800 transition-colors shadow-sm">
                        <iconify-icon id="play-icon" icon="solar:play-linear" stroke-width="1.5" class="text-xl"></iconify-icon>
                    </button>
                    <button id="next-btn" class="text-zinc-400 hover:text-zinc-900 transition-colors hidden sm:block">
                        <iconify-icon icon="solar:skip-next-linear" stroke-width="1.5" class="text-xl"></iconify-icon>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-end w-1/3 gap-3">
                <span id="time-current" class="text-xs text-zinc-500 hidden sm:inline w-8 text-right">0:00</span>
                <div id="progress-container" class="w-24 h-1.5 bg-zinc-100 rounded-full overflow-hidden hidden sm:block relative cursor-pointer group">
                    <div id="progress-bar" class="absolute top-0 left-0 h-full bg-zinc-900 w-0 rounded-full group-hover:bg-emerald-600 transition-colors"></div>
                </div>
                <span id="time-total" class="text-xs text-zinc-500 hidden sm:inline w-8">0:00</span>
                <button class="p-2 text-zinc-400 hover:text-zinc-900 transition-colors rounded-lg ml-2">
                    <iconify-icon icon="solar:volume-loud-linear" stroke-width="1.5" class="text-xl"></iconify-icon>
                </button>
            </div>
        </div>
    </main>

    <!-- Application Logic -->
    <script>
        // DOM Elements
        const grid = document.getElementById('surahs-grid');
        const sidebarList = document.getElementById('sidebar-surahs');
        const search = document.getElementById('search-input');
        const countText = document.getElementById('surah-count');
        const mobileBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        
        // Audio Elements
        const audio = new Audio();
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const currentSurahName = document.getElementById('current-surah-name');
        const currentSurahDesc = document.getElementById('current-surah-desc');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');

        let surahsData = [];
        let currentPlayingNumber = null;

        // 1. Fetch Surah Data from AlQuran Cloud API
        async function fetchSurahs() {
            try {
                const res = await fetch('https://api.alquran.cloud/v1/surah');
                const data = await res.json();
                surahsData = data.data;
                renderSurahs(surahsData);
            } catch (err) {
                grid.innerHTML = '<div class="col-span-full text-center py-10 text-red-500 text-sm">Failed to load data. Check network connection.</div>';
                sidebarList.innerHTML = '';
            }
        }

        // 2. Render Cards and Sidebar List
        function renderSurahs(surahs) {
            countText.textContent = `${surahs.length} Surahs`;

            // Main Grid
            grid.innerHTML = surahs.map(surah => {
                const isPlaying = currentPlayingNumber === surah.number;
                return `
                <button onclick="playSurah(${surah.number}, '${surah.englishName}', '${surah.englishNameTranslation}')" class="w-full text-left group relative flex items-center justify-between p-4 rounded-2xl border ${isPlaying ? 'border-emerald-500/50 shadow-[0_2px_15px_-3px_rgba(16,185,129,0.1)]' : 'border-zinc-200/60 hover:border-emerald-500/30 hover:shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)]'} bg-white transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-11 h-11 rounded-xl ${isPlaying ? 'bg-emerald-50 text-emerald-600 border-emerald-200/50' : 'bg-zinc-50 text-zinc-600 border-zinc-200/60 group-hover:bg-emerald-50 group-hover:text-emerald-600 group-hover:border-emerald-200/50'} border flex items-center justify-center text-sm font-medium transition-colors">
                            ${isPlaying && !audio.paused ? '<iconify-icon icon="solar:chart-square-linear" class="animate-pulse"></iconify-icon>' : surah.number}
                        </div>
                        <div class="flex flex-col">
                            <span class="text-base font-semibold tracking-tight transition-colors ${isPlaying ? 'text-emerald-700' : 'text-zinc-900 group-hover:text-emerald-700'}">${surah.englishName}</span>
                            <span class="text-xs text-zinc-500 mt-0.5">${surah.englishNameTranslation}</span>
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-1.5">
                        <span class="text-2xl opacity-90 transition-colors ${isPlaying ? 'text-emerald-700' : 'text-zinc-900 group-hover:text-emerald-700'}" style="font-family: 'Amiri', serif;">${surah.name.replace('سُورَةُ ', '')}</span>
                        <span class="text-xs text-zinc-400 font-medium">${surah.revelationType === 'Meccan' ? 'Makkah' : 'Madinah'} • ${surah.numberOfAyahs} Ayahs</span>
                    </div>
                </button>
            `}).join('');

            // Sidebar List
            sidebarList.innerHTML = surahs.map(surah => {
                const isPlaying = currentPlayingNumber === surah.number;
                return `
                <button onclick="playSurah(${surah.number}, '${surah.englishName}', '${surah.englishNameTranslation}')" class="w-full text-left px-3 py-2.5 rounded-lg ${isPlaying ? 'bg-zinc-100/80 text-zinc-900' : 'hover:bg-zinc-50 text-zinc-600 hover:text-zinc-900'} transition-colors flex items-center justify-between group">
                    <div class="flex items-center gap-3 truncate pr-2">
                        <span class="min-w-[24px] h-6 rounded flex items-center justify-center ${isPlaying ? 'bg-white border-zinc-200 shadow-sm text-zinc-500' : 'bg-zinc-50 border-transparent text-zinc-400 group-hover:bg-white group-hover:border-zinc-200 group-hover:text-zinc-600'} border text-xs font-medium transition-all">
                            ${isPlaying && !audio.paused ? '<iconify-icon icon="solar:play-linear"></iconify-icon>' : surah.number}
                        </span>
                        <div class="truncate">
                            <div class="text-sm font-medium ${isPlaying ? 'text-zinc-900' : 'group-hover:text-zinc-900'} transition-colors truncate">${surah.englishName}</div>
                            <div class="text-xs ${isPlaying ? 'text-zinc-500' : 'text-zinc-400 group-hover:text-zinc-500'} transition-colors truncate">${surah.englishNameTranslation}</div>
                        </div>
                    </div>
                    <div class="text-lg ${isPlaying ? 'text-emerald-700 opacity-80' : 'text-zinc-400 group-hover:text-zinc-600'} transition-colors" style="font-family: 'Amiri', serif;">${surah.name.replace('سُورَةُ ', '')}</div>
                </button>
            `}).join('');
        }

        // 3. Search / Filtering functionality
        search.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = surahsData.filter(s =>
                s.englishName.toLowerCase().includes(term) ||
                s.englishNameTranslation.toLowerCase().includes(term) ||
                s.name.includes(term)
            );
            renderSurahs(filtered);
        });

        // 4. Audio Playback Logic (Streaming from mp3quran.net)
        function playSurah(number, englishName, translation) {
            if (currentPlayingNumber === number) {
                // Toggle if clicking the already playing Surah
                if (audio.paused) {
                    audio.play();
                    playIcon.setAttribute('icon', 'solar:pause-linear');
                } else {
                    audio.pause();
                    playIcon.setAttribute('icon', 'solar:play-linear');
                }
            } else {
                // Play new Surah
                currentPlayingNumber = number;
                const formattedNumber = String(number).padStart(3, '0');
                audio.src = `https://server8.mp3quran.net/afs/${formattedNumber}.mp3`;
                audio.play();

                currentSurahName.textContent = englishName;
                currentSurahDesc.textContent = translation;
                playIcon.setAttribute('icon', 'solar:pause-linear');
            }
            renderSurahs(surahsData); // Re-render to show active state
        }

        playBtn.addEventListener('click', () => {
            if (!currentPlayingNumber && surahsData.length > 0) {
                playSurah(surahsData[0].number, surahsData[0].englishName, surahsData[0].englishNameTranslation);
                return;
            }
            if (audio.paused) {
                audio.play();
                playIcon.setAttribute('icon', 'solar:pause-linear');
            } else {
                audio.pause();
                playIcon.setAttribute('icon', 'solar:play-linear');
            }
            renderSurahs(surahsData); // Re-render for icon pulse states
        });

        // Skip Next / Prev
        function skip(direction) {
            if(!currentPlayingNumber) return;
            let nextNum = currentPlayingNumber + direction;
            if(nextNum < 1) nextNum = 114;
            if(nextNum > 114) nextNum = 1;
            const targetSurah = surahsData.find(s => s.number === nextNum);
            if(targetSurah) {
                playSurah(targetSurah.number, targetSurah.englishName, targetSurah.englishNameTranslation);
            }
        }
        prevBtn.addEventListener('click', () => skip(-1));
        nextBtn.addEventListener('click', () => skip(1));

        // Audio Progress Update
        audio.addEventListener('timeupdate', () => {
            if(audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = `${percent}%`;
                timeCurrent.textContent = formatTime(audio.currentTime);
                timeTotal.textContent = formatTime(audio.duration);
            }
        });

        // Audio Finished event
        audio.addEventListener('ended', () => {
            skip(1); // Auto play next surah
        });

        // Scrubbing capability
        progressContainer.addEventListener('click', (e) => {
            if(!audio.duration) return;
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // 5. Mobile Menu Toggle
        function toggleMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
        mobileBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // Initialize App
        fetchSurahs();
    </script>
