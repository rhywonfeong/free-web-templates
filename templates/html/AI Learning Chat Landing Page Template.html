        <!-- Centered Max-Width Container for AI Prompt -->
        <div class="w-full max-w-sm bg-white rounded-[2rem] p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 transform transition-all hover:scale-[1.02]">

            <!-- Horizontal Quick Replies (Fades out when interacting) -->
            <div id="quick-replies" class="flex gap-3 overflow-x-auto hide-scrollbar snap-x px-2 -mx-2 pb-2 transition-all duration-300 ease-out">
                <button class="snap-center shrink-0 px-6 py-3.5 rounded-full bg-purple-600 text-white text-base font-normal shadow-md shadow-purple-600/20 active:scale-95 transition-all">
                    Yes, I'm ready
                </button>
                <button class="snap-center shrink-0 px-6 py-3.5 rounded-full bg-white border border-gray-200 text-gray-700 text-base font-normal shadow-sm hover:bg-gray-50 active:scale-95 transition-all">
                    Something else
                </button>
                <button class="snap-center shrink-0 px-6 py-3.5 rounded-full bg-white border border-gray-200 text-gray-700 text-base font-normal shadow-sm hover:bg-gray-50 active:scale-95 transition-all">
                    I didn't understand
                </button>
                <button class="snap-center shrink-0 px-6 py-3.5 rounded-full bg-white border border-gray-200 text-red-600 text-base font-normal shadow-sm hover:bg-red-50 active:scale-95 transition-all">
                    Exit exercise
                </button>
            </div>

            <!-- Interactive Control Area -->
            <div class="relative h-24 w-full mt-2">
                
                <!-- DEFAULT STATE -->
                <div id="default-controls" class="absolute inset-0 flex items-center justify-center gap-6 transition-all duration-300 ease-out z-10 opacity-100 scale-100 pointer-events-auto">
                    <!-- Secondary Action (Text) -->
                    <button onclick="setState('text')" class="w-14 h-14 rounded-full bg-white border border-gray-100 text-gray-600 shadow-sm flex items-center justify-center hover:bg-gray-50 active:scale-95 transition-all">
                        <iconify-icon icon="solar:keyboard-linear" class="text-2xl"></iconify-icon>
                    </button>

                    <!-- Primary Action (Voice) -->
                    <div class="relative flex items-center justify-center">
                        <div class="absolute w-28 h-28 bg-purple-100 rounded-full animate-ping opacity-60" style="animation-duration: 3s;"></div>
                        <div class="absolute w-24 h-24 bg-purple-200 rounded-full animate-pulse opacity-80" style="animation-duration: 2s;"></div>
                        
                        <button onclick="setState('voice')" class="relative z-10 w-20 h-20 rounded-full bg-purple-600 flex items-center justify-center text-white shadow-xl shadow-purple-600/30 active:scale-90 transition-transform duration-300">
                            <iconify-icon icon="solar:microphone-2-linear" class="text-3xl"></iconify-icon>
                        </button>
                    </div>

                    <!-- Invisible spacer for perfect centering -->
                    <div class="w-14 h-14 opacity-0 pointer-events-none"></div>
                </div>

                <!-- VOICE LISTENING STATE (Cool Wave Animation) -->
                <div id="voice-controls" class="absolute inset-0 flex flex-col items-center justify-center transition-all duration-300 ease-out z-0 opacity-0 scale-95 pointer-events-none">
                    <div class="relative flex items-center justify-center">
                        <!-- Ripple Effects -->
                        <div class="absolute w-32 h-32 bg-purple-300 rounded-full animate-ping opacity-30" style="animation-duration: 1.5s;"></div>

                        <!-- Core Listening Orb -->
                        <button onclick="setState('default')" class="relative z-10 w-20 h-20 rounded-full bg-gradient-to-tr from-purple-700 to-purple-500 flex items-center justify-center text-white shadow-xl shadow-purple-600/40 hover:scale-105 active:scale-95 transition-transform duration-300 group">

                            <div class="flex items-center justify-center gap-1.5 h-8 w-8 group-hover:opacity-0 transition-opacity duration-300">

                                <div class="wave-bar h-full"></div>
                                <div class="wave-bar h-full"></div>

                                <div class="wave-bar h-full"></div>

                        <button class="w-12 h-12 shrink-0 bg-purple-600 text-white rounded-full flex items-center justify-center shadow-md active:scale-95 hover:bg-purple-700 transition-all">

                        </button>
                    </div>
                </div>

            </div>

        </div>
    </footer>

    <script>
        // Simple state manager to toggle between Default, Voice, and Text UIs
        function setState(state) {
            const defaultUi = document.getElementById('default-controls');
            const voiceUi = document.getElementById('voice-controls');
            const textUi = document.getElementById('text-controls');
            const quickReplies = document.getElementById('quick-replies');

            // Reset UI states
            [defaultUi, voiceUi, textUi].forEach(el => {
                el.classList.remove('opacity-100', 'scale-100', 'translate-y-0', 'pointer-events-auto', 'z-10');
                el.classList.add('opacity-0', 'pointer-events-none', 'z-0');
            });
            defaultUi.classList.add('scale-95');
            voiceUi.classList.add('scale-95');
            textUi.classList.add('translate-y-4');

            // Apply selected state
            if (state === 'default') {
                defaultUi.classList.remove('opacity-0', 'scale-95', 'pointer-events-none', 'z-0');
                defaultUi.classList.add('opacity-100', 'scale-100', 'pointer-events-auto', 'z-10');
                
                quickReplies.style.opacity = '1';
                quickReplies.style.transform = 'translateY(0)';
                quickReplies.style.pointerEvents = 'auto';
            } else if (state === 'voice') {
                voiceUi.classList.remove('opacity-0', 'scale-95', 'pointer-events-none', 'z-0');
                voiceUi.classList.add('opacity-100', 'scale-100', 'pointer-events-auto', 'z-10');
                
                quickReplies.style.opacity = '0';
                quickReplies.style.transform = 'translateY(10px)';
                quickReplies.style.pointerEvents = 'none';
            } else if (state === 'text') {
                textUi.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none', 'z-0');
                textUi.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto', 'z-10');
                
                quickReplies.style.opacity = '0';
                quickReplies.style.transform = 'translateY(10px)';
                quickReplies.style.pointerEvents = 'none';
                
                // Auto-focus the input field cleanly
                setTimeout(() => document.getElementById('text-input').focus(), 100);
            }
        }
    </script>
