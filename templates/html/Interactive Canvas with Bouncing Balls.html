  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncing Balls Experiment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #1a202c, #2d3748);
    }
    .settings-panel {
      background: linear-gradient(145deg, #2d3748, #1e293b);
      transform: translateY(100%);
      transition: transform 0.3s ease-in-out;
    }
    .settings-panel.open {
      transform: translateY(0);
    }
    input[type="range"] {
      -webkit-appearance: none;
      height: 4px;
      border-radius: 2px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: linear-gradient(135deg, #a0aec0, #e2e8f0);
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body class="flex items-center justify-center h-screen p-4">
  <div class="text-center w-full max-w-4xl relative">
    <h1 class="text-2xl font-bold text-white mb-2">Colorful Bouncing Balls</h1>
    
    <div class="mb-4 flex flex-wrap gap-3 justify-center">
      <button id="add-ball" class="px-3 py-1 bg-gradient-to-r from-purple-600 to-blue-500 text-white rounded-lg hover:opacity-90">Add Ball</button>
      <button id="clear" class="px-3 py-1 bg-gradient-to-r from-red-600 to-pink-500 text-white rounded-lg hover:opacity-90">Clear All</button>
      <button id="toggle-rainbow" class="px-3 py-1 bg-gradient-to-r from-green-400 to-teal-500 text-white rounded-lg hover:opacity-90">Rainbow Mode</button>
      <button id="settings-btn" class="px-3 py-1 bg-gradient-to-r from-yellow-400 to-orange-500 text-white rounded-lg hover:opacity-90">Settings</button>
    </div>
    
    <div class="relative">
      <canvas id="canvas" class="w-full border-2 border-gray-700 rounded-lg shadow-lg"></canvas>
      
      <!-- Settings Panel -->
      <div id="settings-panel" class="settings-panel absolute bottom-0 left-0 right-0 p-4 rounded-t-lg shadow-lg z-10">
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-white font-bold">Experimental Settings</h3>
          <button id="close-settings" class="text-white hover:text-gray-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-white text-sm">
          <div>
            <div class="flex justify-between">
              <label for="speed">Speed</label>
              <span id="speed-value" class="bg-gradient-to-r from-blue-500 to-blue-600 px-2 rounded">1.0x</span>
            </div>
            <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1" class="w-full bg-gradient-to-r from-blue-400 to-blue-600 rounded-full">
          </div>
          
          <div>
            <div class="flex justify-between">
              <label for="trail-length">Trail Length</label>
              <span id="trail-value" class="bg-gradient-to-r from-purple-500 to-purple-600 px-2 rounded">15</span>
            </div>
            <input type="range" id="trail-length" min="1" max="50" value="15" class="w-full bg-gradient-to-r from-purple-400 to-purple-600 rounded-full">
          </div>
          
          <div>
            <div class="flex justify-between">
              <label for="size">Ball Size</label>
              <span id="size-value" class="bg-gradient-to-r from-green-500 to-green-600 px-2 rounded">1.0x</span>
            </div>
            <input type="range" id="size" min="0.2" max="3" step="0.1" value="1" class="w-full bg-gradient-to-r from-green-400 to-green-600 rounded-full">
          </div>
          
          <div>
            <div class="flex justify-between">
              <label for="fade">Fade Effect</label>
              <span id="fade-value" class="bg-gradient-to-r from-red-500 to-red-600 px-2 rounded">0.2</span>
            </div>
            <input type="range" id="fade" min="0" max="0.5" step="0.01" value="0.2" class="w-full bg-gradient-to-r from-red-400 to-red-600 rounded-full">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const addBallBtn = document.getElementById('add-ball');
    const clearBtn = document.getElementById('clear');
    const rainbowBtn = document.getElementById('toggle-rainbow');
    const settingsBtn = document.getElementById('settings-btn');
    const settingsPanel = document.getElementById('settings-panel');
    const closeSettingsBtn = document.getElementById('close-settings');
    
    // Settings elements
    const speedSlider = document.getElementById('speed');
    const speedValue = document.getElementById('speed-value');
    const trailSlider = document.getElementById('trail-length');
    const trailValue = document.getElementById('trail-value');
    const sizeSlider = document.getElementById('size');
    const sizeValue = document.getElementById('size-value');
    const fadeSlider = document.getElementById('fade');
    const fadeValue = document.getElementById('fade-value');
    
    // Set canvas size to be larger
    canvas.width = Math.min(1200, window.innerWidth - 40);
    canvas.height = Math.min(600, window.innerHeight - 150);
    
    let balls = [];
    let rainbowMode = false;
    let speedMultiplier = 1;
    let sizeMultiplier = 1;
    let fadeAmount = 0.2;
    let defaultTrailLength = 15;
    
    // Create linear gradient background for canvas
    const canvasGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    canvasGradient.addColorStop(0, '#1e293b');
    canvasGradient.addColorStop(1, '#0f172a');
    
    class Ball {
      constructor(x, y) {
        this.x = x || Math.random() * canvas.width;
        this.y = y || Math.random() * canvas.height;
        this.baseRadius = 5 + Math.random() * 8;
        this.baseDx = (Math.random() - 0.5) * 6;
        this.baseDy = (Math.random() - 0.5) * 6;
        this.hue = Math.random() * 360;
        this.color = `hsl(${this.hue}, 80%, 60%)`;
        this.trail = [];
        this.hueShift = 0;
      }
      
      update() {
        if (rainbowMode) {
          this.hueShift = (this.hueShift + 1) % 360;
          this.color = `hsl(${(this.hue + this.hueShift) % 360}, 80%, 60%)`;
        }
        
        const radius = this.baseRadius * sizeMultiplier;
        const dx = this.baseDx * speedMultiplier;
        const dy = this.baseDy * speedMultiplier;
        
        this.trail.push({x: this.x, y: this.y});
        
        if (this.trail.length > defaultTrailLength) {
          this.trail.shift();
        }
        
        this.x += dx;
        this.y += dy;
        
        if (this.x + radius > canvas.width || this.x - radius < 0) {
          this.baseDx = -this.baseDx;
        }
        
        if (this.y + radius > canvas.height || this.y - radius < 0) {
          this.baseDy = -this.baseDy;
        }
      }
      
      draw() {
        const radius = this.baseRadius * sizeMultiplier;
        
        if (this.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(this.trail[0].x, this.trail[0].y);
          
          for (let i = 1; i < this.trail.length; i++) {
            ctx.lineTo(this.trail[i].x, this.trail[i].y);
          }
          
          const gradient = ctx.createLinearGradient(
            this.trail[0].x, this.trail[0].y, 
            this.trail[this.trail.length-1].x, this.trail[this.trail.length-1].y
          );
          
          const color = this.color;
          gradient.addColorStop(0, color.replace('hsl', 'hsla').replace(')', ', 0.1)'));
          gradient.addColorStop(1, color);
          
          ctx.strokeStyle = gradient;
          ctx.lineWidth = radius * 1.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();
        }
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
    }
    
    function animate() {
      ctx.fillStyle = canvasGradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = `rgba(15, 23, 42, ${fadeAmount})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      balls.forEach(ball => {
        ball.update();
        ball.draw();
      });
      
      requestAnimationFrame(animate);
    }
    
    // Add initial balls
    for (let i = 0; i < 8; i++) {
      balls.push(new Ball());
    }
    
    // Start animation
    animate();
    
    // Event listeners
    addBallBtn.addEventListener('click', () => balls.push(new Ball()));
    clearBtn.addEventListener('click', () => balls = []);
    rainbowBtn.addEventListener('click', () => {
      rainbowMode = !rainbowMode;
      rainbowBtn.classList.toggle('ring-2');
      rainbowBtn.classList.toggle('ring-white');
    });
    
    settingsBtn.addEventListener('click', () => {
      settingsPanel.classList.add('open');
    });
    
    closeSettingsBtn.addEventListener('click', () => {
      settingsPanel.classList.remove('open');
    });
    
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      balls.push(new Ball(e.clientX - rect.left, e.clientY - rect.top));
    });
    
    // Settings listeners
    speedSlider.addEventListener('input', (e) => {
      speedMultiplier = parseFloat(e.target.value);
      speedValue.textContent = speedMultiplier.toFixed(1) + 'x';
    });
    
    trailSlider.addEventListener('input', (e) => {
      defaultTrailLength = parseInt(e.target.value);
      trailValue.textContent = defaultTrailLength;
    });
    
    sizeSlider.addEventListener('input', (e) => {
      sizeMultiplier = parseFloat(e.target.value);
      sizeValue.textContent = sizeMultiplier.toFixed(1) + 'x';
    });
    
    fadeSlider.addEventListener('input', (e) => {
      fadeAmount = parseFloat(e.target.value);
      fadeValue.textContent = fadeAmount.toFixed(2);
    });
    
    // Resize handler
    window.addEventListener('resize', () => {
      canvas.width = Math.min(1200, window.innerWidth - 40);
      canvas.height = Math.min(600, window.innerHeight - 150);
      
      // Update canvas gradient
      canvasGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      canvasGradient.addColorStop(0, '#1e293b');
      canvasGradient.addColorStop(1, '#0f172a');
    });
  </script>
</body>
</html>
