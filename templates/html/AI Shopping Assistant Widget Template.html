<body class="bg-gray-50 min-h-screen relative overflow-hidden text-sm">
    <!-- Mockup Dashboard Background to demonstrate glass effect -->
    <div class="absolute inset-0 p-8 flex flex-col gap-6 opacity-40 select-none pointer-events-none">
        <div class="h-12 w-48 bg-gray-200 rounded-lg"></div>
        <div class="grid grid-cols-3 gap-6">
            <div class="h-64 bg-gray-200 rounded-2xl"></div>
            <div class="h-64 bg-gray-200 rounded-2xl"></div>
            <div class="h-64 bg-gray-200 rounded-2xl"></div>
        </div>
        <div class="h-96 bg-gray-200 rounded-2xl w-full"></div>
    </div>

    <!-- Chatbot Container -->
    <div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
        
        <!-- Opened State: Chat Window -->
        <!-- Start hidden, transition classes applied for open/close -->
        <div id="chat-window" class="w-[380px] mb-4 flex flex-col transition-all duration-300 transform scale-95 opacity-0 pointer-events-none origin-bottom-right relative">
            
            <!-- Main Glassy Panel -->
            <div class="bg-white/60 backdrop-blur-2xl border border-violet-400/60 rounded-3xl shadow-[0_20px_40px_-15px_rgba(139,92,246,0.2)] overflow-hidden flex flex-col h-[520px]">
                
                <!-- Gradient Header -->
                <div class="bg-gradient-to-r from-violet-600 via-fuchsia-400 to-lime-300 p-4 shrink-0 flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="h-10 w-10 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center text-white shadow-inner">
                            <i data-lucide="sparkles" stroke-width="1.5" class="w-5 h-5"></i>
                        </div>
                        <div class="flex flex-col text-white">
                            <!-- Tracking tight applied to title as per instruction, though < 20px it adds to the sleek look -->
                            <h2 class="text-lg font-medium tracking-tight leading-tight">Jify</h2>
                            <p class="text-xs text-white/90">Your AI Shopping Assistant</p>
                        </div>
                    </div>
                    <button id="close-chat" class="text-white/80 hover:text-white transition-colors p-1 rounded-full hover:bg-white/10">
                        <i data-lucide="x" stroke-width="1.5" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Chat Messages Area -->
                <div class="flex-1 overflow-y-auto chat-scroll p-5 flex flex-col gap-4">
                    <!-- Incoming Message -->
                    <div class="flex flex-col gap-1 max-w-[85%] self-start">
                        <div class="bg-white/95 backdrop-blur-sm border border-white rounded-2xl rounded-tl-sm p-4 text-sm text-gray-700 shadow-sm leading-relaxed">
                            Hey Pankaj! I noticed you recently got those Yellow Puffer Jacket. Want some style tips to match them?
                        </div>
                        <span class="text-xs text-gray-500 pl-1">15:30</span>
                    </div>
                    <!-- Space for more messages to push input down if needed -->
                </div>

                <!-- Input Area -->
                <div class="p-4 bg-white/40 backdrop-blur-md border-t border-violet-100/50 shrink-0">
                    <div class="relative flex items-center shadow-sm rounded-full bg-white/80 border border-gray-100 focus-within:ring-2 focus-within:ring-violet-200 transition-shadow">
                        <input type="text" placeholder="Ask me anything..." class="w-full bg-transparent py-3.5 pl-5 pr-12 text-sm text-gray-700 placeholder-gray-400 focus:outline-none rounded-full">
                        <button class="absolute right-1.5 h-9 w-9 rounded-full bg-violet-400 hover:bg-violet-500 flex items-center justify-center text-white transition-colors shadow-md">
                            <i data-lucide="send" stroke-width="1.5" class="w-4 h-4 ml-0.5"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Footer Badge -->
            <div class="absolute -bottom-2.5 right-6 bg-gray-900 text-white px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-lg border border-gray-700">
                <i data-lucide="zap" stroke-width="1.5" class="w-3 h-3 text-lime-300"></i>
                <span class="text-xs font-medium tracking-wide">Powered by GoKwik</span>

        <!-- Closed State: Floating Action Button -->
        <button id="open-chat" class="h-16 w-16 rounded-full bg-gradient-to-tr from-violet-600 via-fuchsia-500 to-lime-300 shadow-xl shadow-violet-500/30 flex items-center justify-center text-white hover:scale-105 hover:shadow-2xl hover:shadow-violet-500/40 transition-all duration-300 border-2 border-white/20 relative group">
            <i data-lucide="sparkles" stroke-width="1.5" class="w-7 h-7 relative z-10"></i>
            <!-- Optional pulse effect -->
            <div class="absolute inset-0 rounded-full bg-white opacity-0 group-hover:animate-ping transition-opacity"></div>
        </button>
        
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Chatbot Toggle Logic
        const chatWindow = document.getElementById('chat-window');
        const openBtn = document.getElementById('open-chat');
        const closeBtn = document.getElementById('close-chat');

        function toggleChat() {
            const isClosed = chatWindow.classList.contains('opacity-0');
            
            if (isClosed) {
                // Open Chat
                chatWindow.classList.remove('opacity-0', 'pointer-events-none', 'scale-95');
                chatWindow.classList.add('opacity-100', 'pointer-events-auto', 'scale-100');
                
                openBtn.classList.remove('scale-100', 'opacity-100');
                openBtn.classList.add('scale-50', 'opacity-0', 'pointer-events-none');
            } else {
                // Close Chat
                chatWindow.classList.remove('opacity-100', 'pointer-events-auto', 'scale-100');
                chatWindow.classList.add('opacity-0', 'pointer-events-none', 'scale-95');
                
                openBtn.classList.remove('scale-50', 'opacity-0', 'pointer-events-none');
                openBtn.classList.add('scale-100', 'opacity-100');
            }
        }

        openBtn.addEventListener('click', toggleChat);
        closeBtn.addEventListener('click', toggleChat);

        // Optional: Open chat automatically for demonstration
        setTimeout(toggleChat, 500);
    </script>
