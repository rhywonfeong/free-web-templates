<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

<body class="bg-black text-white antialiased min-h-screen overflow-hidden relative flex items-center justify-center transition-colors duration-1000">

    <!-- Ambient Glow (changes with theme) -->
    <div id="ambient-glow" class="absolute inset-0 z-0 pointer-events-none transition-all duration-700 opacity-60" style="background: radial-gradient(circle at 50% 50%, rgba(155, 17, 30, 0.3) 0%, transparent 60%);"></div>

    <!-- Animated Background -->
    <div class="absolute inset-0 z-0 pointer-events-none">
        <div class="absolute top-0 left-0 right-0 h-[200%] w-full animate-[pan-stars_60s_linear_infinite]">
            <div class="absolute inset-0 star-layer opacity-40"></div>
        </div>
        <div class="absolute top-0 left-0 right-0 h-[200%] w-full animate-[pan-stars_90s_linear_infinite]">
            <div class="absolute inset-0 star-layer-2 opacity-30"></div>
        </div>
    </div>

    <!-- Main Views Container -->
    <div id="main-container" class="relative z-10 w-full max-w-[380px] mx-4 transition-all duration-500">
        
        <!-- View 1: Welcome -->
        <div id="view-welcome" class="bg-[#0A0A0A] border border-white/[0.08] rounded-[24px] p-10 flex flex-col items-center text-center shadow-2xl transition-all duration-300 transform opacity-100 scale-100">
            <div class="mb-6 flex justify-center items-center w-24 h-24">
                <img src="https://static.wikia.nocookie.net/creatures-tycoon/images/7/7e/Clifford_The_Big_Red_Dog.png/revision/latest?cb=20220103161414" alt="Clifford Logo" class="w-full h-full object-contain drop-shadow-md">
            </div>
            <div class="space-y-3 mb-8">
                <h1 class="text-2xl font-semibold text-white tracking-tight">Welcome to Clifford</h1>
                <p class="text-base text-zinc-400">
                    Heavily inspired by <span class="font-semibold text-transparent bg-clip-text bg-gradient-to-r from-red-600 to-red-400">Cherri</span>
                </p>
            </div>
            <button id="btn-start" class="bg-[#1C1C1C] hover:bg-[#2A2A2A] text-white text-sm font-medium py-3 px-8 rounded-full border border-white/[0.06] transition-all duration-200 shadow-sm active:scale-95">
                Get Started
            </button>
        </div>

        <!-- View 2: Theme Selection -->
        <div id="view-theme" class="hidden bg-[#0A0A0A] border border-white/[0.08] rounded-[24px] p-8 flex-col shadow-2xl transition-all duration-300 transform opacity-0 scale-95">
            <h2 id="theme-title" class="text-2xl font-semibold text-white tracking-tight mb-8 text-center transition-colors duration-300">Choose a Theme</h2>
            
            <div class="grid grid-cols-2 gap-3 mb-8">
                <button class="theme-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-[#9b111e] text-white border border-transparent" data-name="Default" data-color="#9b111e" data-glow="rgba(155, 17, 30, 0.3)">Default</button>
                <button class="theme-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-name="Forest" data-color="#166534" data-glow="rgba(22, 101, 52, 0.3)">Forest</button>
                <button class="theme-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-name="Crimson" data-color="#be123c" data-glow="rgba(190, 18, 60, 0.3)">Crimson</button>
                <button class="theme-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-name="Lavendar" data-color="#6366f1" data-glow="rgba(99, 102, 241, 0.3)">Lavendar</button>
                <button class="theme-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-name="Monochrome" data-color="#52525b" data-glow="rgba(82, 82, 91, 0.3)">Monochrome</button>
                <button class="theme-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-name="Midnight" data-color="#1e3a8a" data-glow="rgba(30, 58, 138, 0.3)">Midnight</button>
                <button class="theme-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-name="Sunset" data-color="#c2410c" data-glow="rgba(194, 65, 12, 0.3)">Sunset</button>
                <button class="theme-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-name="Ocean" data-color="#0369a1" data-glow="rgba(3, 105, 161, 0.3)">Ocean</button>
            </div>
            
            <button id="btn-theme-continue" class="w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04] active:scale-95 mt-auto">
                Continue
            </button>
        </div>

        <!-- View 3: Cloak Selection -->
        <div id="view-cloak" class="hidden bg-[#0A0A0A] border border-white/[0.08] rounded-[24px] p-8 flex-col shadow-2xl transition-all duration-300 transform opacity-0 scale-95 items-center">
            <h2 class="text-2xl font-semibold text-white tracking-tight mb-8 text-center">Choose a Cloak</h2>
            
            <div class="grid grid-cols-2 gap-3 w-full mb-8">
                <button class="cloak-btn active-cloak w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 border border-transparent text-white shadow-lg" data-cloak="None" style="background-color: var(--theme-color);">None</button>
                <button class="cloak-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-cloak="Google">Google</button>
                <button class="cloak-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-cloak="Google Docs">Google Docs</button>
                <button class="cloak-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-cloak="Google Slides">Google Slides</button>
                <button class="cloak-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-cloak="Canva">Canva</button>
                <button class="cloak-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-cloak="Blooket">Blooket</button>
                <button class="cloak-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-cloak="Kahoot">Kahoot</button>
                <button class="cloak-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]" data-cloak="Edpuzzle">Edpuzzle</button>
            </div>
            
            <button id="btn-cloak-continue" class="w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04] active:scale-95 mt-auto">
                Continue
            </button>
        </div>

        <!-- View 4: Sign Up -->
        <div id="view-signup" class="hidden bg-[#0A0A0A] border border-white/[0.08] rounded-[24px] p-8 flex-col shadow-2xl transition-all duration-300 transform opacity-0 scale-95 items-center">
            <h2 class="text-2xl font-semibold text-white tracking-tight mb-8 text-center">Create Your Account</h2>
            
            <div class="w-full flex flex-col gap-3 mb-8 relative">
                <input type="text" id="signup-user" placeholder="Username" class="w-full bg-[#111] border border-white/[0.08] rounded-xl px-4 py-3 text-sm text-white placeholder:text-zinc-500 focus:outline-none focus:border-white/[0.2] transition-colors" autocomplete="off">
                <input type="password" id="signup-pass" placeholder="Password" class="w-full bg-[#111] border border-white/[0.08] rounded-xl px-4 py-3 text-sm text-white placeholder:text-zinc-500 focus:outline-none focus:border-white/[0.2] transition-colors">
                <p id="signup-error" class="text-red-400 text-xs text-center absolute -bottom-6 left-0 right-0 hidden font-medium">Username is taken</p>
            </div>
            
            <div class="w-full flex flex-col gap-2 mt-auto">
                <button id="btn-signup-submit" class="w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 text-white shadow-lg hover:brightness-110 active:scale-95" style="background-color: var(--theme-color);">
                    Create Account
                </button>
                <button id="btn-signup-skip" class="w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-400 hover:text-white hover:bg-white/[0.04] active:scale-95">
                    Skip
                </button>
            </div>
        </div>

        <!-- View 5: TOS -->
        <div id="view-tos" class="hidden bg-[#0A0A0A] border border-white/[0.08] rounded-[24px] p-8 flex-col shadow-2xl transition-all duration-300 transform opacity-0 scale-95 items-center justify-center text-center">
            <h2 class="text-2xl font-semibold text-white tracking-tight mb-4">Terms of Service</h2>
            <p class="text-base text-zinc-400 mb-8 leading-relaxed">
                do you agree to our following terms of service
            </p>
            <button id="btn-tos-agree" class="w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 text-white shadow-lg hover:brightness-110 active:scale-95 w-full" style="background-color: var(--theme-color);">
                Agree
            </button>
        </div>

    </div>

    <!-- Final View (Full Screen Blank Page) -->
    <div id="view-final" class="hidden fixed inset-0 z-50 flex-col items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-1000 opacity-0">
        <div class="flex items-center gap-5 z-10 animate-fade-in-up">
            <img src="https://static.wikia.nocookie.net/creatures-tycoon/images/7/7e/Clifford_The_Big_Red_Dog.png/revision/latest?cb=20220103161414" alt="Clifford Logo" class="w-20 h-20 object-contain drop-shadow-2xl">
            <h1 class="text-5xl font-semibold tracking-tight" style="background: linear-gradient(135deg, #ffffff 0%, var(--theme-color) 100%); -webkit-background-clip: text; color: transparent;">Clifford</h1>
        </div>
        
        <div class="absolute bottom-12 w-full px-6 text-center z-10 animate-fade-in">
            <p class="text-base text-zinc-500 max-w-2xl mx-auto leading-relaxed">
                all them unblocked sites like gn-math, truffled, vaper, infamous are NOTHING compared to <span class="font-semibold text-transparent bg-clip-text bg-gradient-to-r from-red-600 to-red-400 tracking-tight">Clifford</span>.
            </p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Elements
        const mainContainer = document.getElementById('main-container');
        const ambientGlow = document.getElementById('ambient-glow');
        
        const viewWelcome = document.getElementById('view-welcome');
        const viewTheme = document.getElementById('view-theme');
        const viewCloak = document.getElementById('view-cloak');
        const viewSignup = document.getElementById('view-signup');
        const viewTos = document.getElementById('view-tos');
        const viewFinal = document.getElementById('view-final');

        const btnStart = document.getElementById('btn-start');
        const btnThemeContinue = document.getElementById('btn-theme-continue');
        const btnCloakContinue = document.getElementById('btn-cloak-continue');
        const btnSignupSubmit = document.getElementById('btn-signup-submit');
        const btnSignupSkip = document.getElementById('btn-signup-skip');
        const btnTosAgree = document.getElementById('btn-tos-agree');

        const themeBtns = document.querySelectorAll('.theme-btn');
        const themeTitle = document.getElementById('theme-title');
        const cloakBtns = document.querySelectorAll('.cloak-btn');
        
        const signupUser = document.getElementById('signup-user');
        const signupError = document.getElementById('signup-error');

        // State
        let currentThemeColor = '#9b111e';
        let currentThemeGlow = 'rgba(155, 17, 30, 0.3)';
        let selectedCloak = 'None';
        const takenUsernames = ['admin', 'clifford', 'user', 'guest', 'test'];

        // Helper: Switch views with smooth transition
        function switchView(currentEl, targetEl) {
            currentEl.classList.remove('opacity-100', 'scale-100');
            currentEl.classList.add('opacity-0', 'scale-95');
            currentEl.style.pointerEvents = 'none';

            setTimeout(() => {
                currentEl.classList.add('hidden');
                currentEl.classList.remove('flex');
                
                targetEl.classList.remove('hidden');
                targetEl.classList.add('flex');
                
                // Trigger reflow
                void targetEl.offsetWidth;
                
                targetEl.classList.remove('opacity-0', 'scale-95');
                targetEl.classList.add('opacity-100', 'scale-100');
                targetEl.style.pointerEvents = 'auto';
            }, 300);
        }

        // Navigation Listeners
        btnStart.addEventListener('click', () => switchView(viewWelcome, viewTheme));
        btnThemeContinue.addEventListener('click', () => switchView(viewTheme, viewCloak));
        btnCloakContinue.addEventListener('click', () => {
            applyCloakSettings(selectedCloak);
            switchView(viewCloak, viewSignup);
        });

        // Theme Selection
        themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                currentThemeColor = btn.getAttribute('data-color');
                currentThemeGlow = btn.getAttribute('data-glow');
                const name = btn.getAttribute('data-name');

                // Update CSS Variable for dynamic coloring across the app
                document.documentElement.style.setProperty('--theme-color', currentThemeColor);

                // Reset theme buttons
                themeBtns.forEach(b => {
                    b.className = 'theme-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 bg-transparent text-zinc-300 border border-white/[0.08] hover:bg-white/[0.04]';
                    b.style.backgroundColor = '';
                    b.style.borderColor = '';
                });

                // Activate selected theme button
                btn.className = 'theme-btn w-full py-3 rounded-xl text-sm font-medium transition-all duration-200 border border-transparent text-white shadow-lg scale-105';
                btn.style.backgroundColor = currentThemeColor;
                setTimeout(() => btn.classList.remove('scale-105'), 150);

                // Update Ambient Glow & Title
                ambientGlow.style.background = `radial-gradient(circle at 50% 50%, ${currentThemeGlow} 0%, transparent 60%)`;
                themeTitle.innerHTML = `<span style="color: ${currentThemeColor}">${name}</span> Theme`;
            });
        });

        // Cloak Selection
        cloakBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Reset cloak buttons
                cloakBtns.forEach(b => {
                    b.classList.remove('active-cloak', 'text-white', 'border-transparent', 'shadow-lg');
                    b.classList.add('bg-transparent', 'text-zinc-300', 'border-white/[0.08]', 'hover:bg-white/[0.04]');
                    b.style.backgroundColor = '';
                });

                // Activate selected cloak button
                btn.classList.add('active-cloak', 'text-white', 'border-transparent', 'shadow-lg');
                btn.classList.remove('bg-transparent', 'text-zinc-300', 'border-white/[0.08]', 'hover:bg-white/[0.04]');
                btn.style.backgroundColor = 'var(--theme-color)';
                
                selectedCloak = btn.dataset.cloak;
            });
        });

        // Apply Cloak Metadata
        function applyCloakSettings(cloakName) {
            const cloaks = {
                'None': { title: 'Welcome to Clifford', icon: '' },
                'Google': { title: 'Google', icon: 'https://www.google.com/favicon.ico' },
                'Google Docs': { title: 'Google Docs', icon: 'https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico' },
                'Google Slides': { title: 'Google Slides', icon: 'https://ssl.gstatic.com/docs/presentations/images/favicon5.ico' },
                'Canva': { title: 'Home - Canva', icon: 'https://www.canva.com/favicon.ico' },
                'Blooket': { title: 'Blooket', icon: 'https://www.blooket.com/favicon.ico' },
                'Kahoot': { title: 'Kahoot!', icon: 'https://kahoot.it/favicon.ico' },
                'Edpuzzle': { title: 'Edpuzzle', icon: 'https://edpuzzle.com/favicon.ico' }
            };

            const data = cloaks[cloakName];
            if(data) {
                document.title = data.title;
                if(data.icon) {
                    let link = document.querySelector("link[rel~='icon']");
                    if (!link) {
                        link = document.createElement('link');
                        link.rel = 'icon';
                        document.head.appendChild(link);
                    }
                    link.href = data.icon;
                }
            }
        }

        // Signup Logic
        signupUser.addEventListener('input', () => {
            signupError.classList.add('hidden');
            signupUser.classList.remove('border-red-500/50', 'focus:border-red-500');
        });

        btnSignupSubmit.addEventListener('click', () => {
            const user = signupUser.value.trim().toLowerCase();
            
            if (!user) {
                signupError.textContent = "Username is required";
                signupError.classList.remove('hidden');
                signupUser.classList.add('border-red-500/50', 'focus:border-red-500');
                return;
            }

            if (takenUsernames.includes(user)) {
                signupError.textContent = "Username is taken";
                signupError.classList.remove('hidden');
                signupUser.classList.add('border-red-500/50', 'focus:border-red-500');
                return;
            }

            // Save progress (Mock)
            localStorage.setItem('clifford_user', user);
            switchView(viewSignup, viewTos);
        });

        btnSignupSkip.addEventListener('click', () => {
            // Do not save progress
            switchView(viewSignup, viewTos);
        });

        // TOS & Final View
        btnTosAgree.addEventListener('click', () => {
            // Fade out main container and show full screen blank final view
            mainContainer.classList.add('opacity-0', 'scale-95');
            mainContainer.style.pointerEvents = 'none';

            // Make ambient glow subtle for the blank page
            ambientGlow.style.background = `radial-gradient(circle at 50% 50%, ${currentThemeGlow.replace('0.3', '0.1')} 0%, transparent 80%)`;

            setTimeout(() => {
                mainContainer.classList.add('hidden');
                
                viewFinal.classList.remove('hidden');
                viewFinal.classList.add('flex');
                
                // Trigger reflow
                void viewFinal.offsetWidth;
                
                viewFinal.classList.remove('opacity-0');
                viewFinal.classList.add('opacity-100');
            }, 500);
        });

    </script>
