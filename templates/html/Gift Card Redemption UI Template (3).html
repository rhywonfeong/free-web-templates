<body class="bg-black text-white antialiased flex flex-col items-center justify-between min-h-screen relative overflow-hidden selection:bg-white/20 selection:text-white">

    <!-- Header / Logo -->

    <!-- Main Content Area -->

        <!-- Floating Container -->

            <div class="w-full h-full rounded-2xl relative overflow-hidden shadow-2xl shadow-zinc-900/50 bg-gradient-to-br from-zinc-800 via-zinc-900 to-black border border-white/10 transition-transform duration-700">

                        <iconify-icon icon="cib:apple" width="24" class="text-white opacity-80"></iconify-icon>
                    </div>

                    <!-- Middle abstract design element -->
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 bg-blue-500/10 blur-3xl rounded-full"></div>

                    <div class="flex justify-between items-end">
                        <div class="flex flex-col">
                            <span class="text-xs text-zinc-500 mb-1">Balance</span>
                            <span class="text-2xl font-semibold tracking-tight text-white">$512.00</span>
                        </div>
                        <!-- Masked Code Dots -->
                        <div class="flex gap-1 mb-1">
                            <div class="w-1.5 h-1.5 rounded-full bg-white/60"></div>
                            <div class="w-1.5 h-1.5 rounded-full bg-white/60"></div>
                            <div class="w-1.5 h-1.5 rounded-full bg-white/60"></div>
                            <div class="w-1.5 h-1.5 rounded-full bg-white/60"></div>
                            <span class="text-xs text-white/60 ml-1 font-mono">8921</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Initial Form State -->
        <div id="redemption-form" class="w-full flex flex-col items-center transition-all duration-500">
            <h1 class="text-2xl font-medium tracking-tight text-center mb-2">Redeem Gift Card</h1>
            <p class="text-sm text-zinc-400 text-center mb-8 max-w-xs leading-relaxed">
                Redeem a gift card using your computer or camera in Apple Pay.
            </p>

            <!-- Input Group -->
            <div class="w-full relative group mb-4">
                <label for="code-input" class="absolute -top-2 left-3 bg-black px-1 text-xs text-zinc-500 transition-colors group-focus-within:text-blue-500">Insert Code</label>
                <div class="w-full h-12 bg-zinc-900 rounded-lg border border-zinc-800 flex items-center px-3 focus-within:border-blue-500/50 transition-colors relative overflow-hidden">
                    <input type="text" id="code-input" placeholder="Enter gift card code" class="w-full bg-transparent text-base text-white placeholder-zinc-600 focus:outline-none tracking-widest font-mono uppercase" autocomplete="off">
                    
                    <!-- Dynamic Enter Button -->
                    <button id="enter-btn" class="absolute right-1 top-1 bottom-1 bg-white text-black text-xs font-semibold px-4 rounded hover:bg-zinc-200 transition-all duration-300 opacity-0 translate-x-4 pointer-events-none" onclick="triggerVerification()">
                        Enter
                    </button>
                </div>
            </div>

            <div class="relative w-full flex items-center justify-center my-4">
                <span class="bg-black px-2 text-xs text-zinc-600">or</span>
                <div class="absolute inset-0 border-t border-zinc-900 -z-10"></div>
            </div>

            <!-- Use Camera Button -->
            <button onclick="openActionSheet()" class="w-full h-12 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-blue-400 text-sm font-medium flex items-center justify-center gap-2 transition-colors active:scale-[0.98] duration-200">
                <iconify-icon icon="solar:camera-linear" width="20" stroke-width="1.5"></iconify-icon>
                Use Camera
            </button>
        </div>

        <!-- Result / Error State (Hidden by default) -->
        <div id="result-state" class="w-full hidden flex-col items-center text-center animate-pulse-fade-in">
            <div class="w-12 h-12 rounded-full bg-red-500/10 flex items-center justify-center mb-4 text-red-500">
                <iconify-icon icon="solar:close-circle-linear" width="28" stroke-width="1.5"></iconify-icon>
            </div>
            <h2 class="text-lg font-medium tracking-tight mb-2">Card Error</h2>
            <p class="text-sm text-zinc-400 mb-8 max-w-[260px] leading-relaxed">
                This card cannot be used at this moment. Please try another card.
            </p>
            <button onclick="resetUI()" class="w-full h-12 rounded-full bg-white text-black text-sm font-semibold hover:bg-zinc-200 transition-colors active:scale-95 duration-200">
                Try Another Card
            </button>
        </div>

    <!-- Footer -->
    <footer class="w-full py-6 text-center z-10">

            <span class="text-xs font-medium">Secure redemption via Apple Pay</span>
        </div>
    </footer>

    <!-- Loading Overlay (Full Screen Blur) -->
    <div id="loading-overlay" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-md flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <!-- Floating card clone for loading state context -->
        <div class="w-64 aspect-[1.586/1] mb-8 rounded-xl bg-gradient-to-br from-zinc-800 to-zinc-900 shadow-2xl animate-float opacity-50 scale-90"></div>
        
        <div class="w-8 h-8 rounded-full border-[3px] loader-ring mb-4"></div>
        <span class="text-sm font-medium text-white/90 tracking-wide">Checking card information...</span>
    </div>

    <!-- Action Sheet (Mobile Style) -->
    <div id="action-sheet-backdrop" class="fixed inset-0 bg-black/60 z-40 hidden transition-opacity duration-300 opacity-0" onclick="closeActionSheet()"></div>
    <div id="action-sheet" class="fixed bottom-0 left-0 right-0 z-50 transform translate-y-full transition-transform duration-300 ease-[cubic-bezier(0.32,0.72,0,1)] max-w-md mx-auto">
        <div class="bg-zinc-900/90 backdrop-blur-xl rounded-t-2xl p-4 pb-8 border-t border-white/5 ring-1 ring-white/10">
            <div class="w-10 h-1 rounded-full bg-zinc-600 mx-auto mb-6 opacity-50"></div>
            
            <div class="space-y-3">
                <button onclick="handleImageSelect()" class="w-full p-4 rounded-xl bg-zinc-800/50 hover:bg-zinc-700/50 flex items-center gap-4 transition-colors text-left group">
                    <div class="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-500 group-hover:scale-110 transition-transform">
                        <iconify-icon icon="solar:gallery-wide-linear" width="20" stroke-width="1.5"></iconify-icon>
                    </div>
                    <div>
                        <div class="text-sm font-medium text-white">Choose from Gallery</div>
                        <div class="text-xs text-zinc-500">Upload an image of your code</div>
                    </div>
                </button>

                <button onclick="handleImageSelect()" class="w-full p-4 rounded-xl bg-zinc-800/50 hover:bg-zinc-700/50 flex items-center gap-4 transition-colors text-left group">
                    <div class="w-10 h-10 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-500 group-hover:scale-110 transition-transform">
                        <iconify-icon icon="solar:camera-minimalistic-linear" width="20" stroke-width="1.5"></iconify-icon>
                    </div>
                    <div>
                        <div class="text-sm font-medium text-white">Take Photo</div>
                        <div class="text-xs text-zinc-500">Scan the card directly</div>
                    </div>
                </button>

                <button onclick="closeActionSheet()" class="w-full p-4 mt-2 rounded-xl bg-black text-white font-medium text-sm hover:bg-zinc-900 border border-zinc-800 transition-colors">
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        const codeInput = document.getElementById('code-input');
        const enterBtn = document.getElementById('enter-btn');
        const actionSheet = document.getElementById('action-sheet');
        const backdrop = document.getElementById('action-sheet-backdrop');
        const loadingOverlay = document.getElementById('loading-overlay');
        const formSection = document.getElementById('redemption-form');
        const resultSection = document.getElementById('result-state');

        // Input Logic: Show "Enter" button when typing
        codeInput.addEventListener('input', (e) => {
            if (e.target.value.length > 0) {
                enterBtn.classList.remove('opacity-0', 'translate-x-4', 'pointer-events-none');
                enterBtn.classList.add('opacity-100', 'translate-x-0', 'pointer-events-auto');
            } else {
                enterBtn.classList.add('opacity-0', 'translate-x-4', 'pointer-events-none');
                enterBtn.classList.remove('opacity-100', 'translate-x-0', 'pointer-events-auto');
            }
        });

        // Trigger on Enter key
        codeInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && codeInput.value.length > 0) {
                triggerVerification();
            }
        });

        function triggerVerification() {
            // Simulate processing
            handleImageSelect();
        }

        // Action Sheet Logic
        function openActionSheet() {
            backdrop.classList.remove('hidden');
            // Trigger reflow
            void backdrop.offsetWidth; 
            backdrop.classList.remove('opacity-0');
            
            actionSheet.classList.remove('translate-y-full');
        }

        function closeActionSheet() {
            actionSheet.classList.add('translate-y-full');
            backdrop.classList.add('opacity-0');
            
            setTimeout(() => {
                backdrop.classList.add('hidden');
            }, 300);
        }

        // Flow Logic: Loading -> Error
        function handleImageSelect() {
            closeActionSheet();
            
            // Show Loading
            loadingOverlay.classList.remove('hidden');
            // Small delay for fade in
            setTimeout(() => {
                loadingOverlay.classList.remove('opacity-0');
            }, 50);

            // Simulate Verification Network Request
            setTimeout(() => {
                finishLoadingAndShowError();
            }, 2500);
        }

        function finishLoadingAndShowError() {
            // Hide Loading
            loadingOverlay.classList.add('opacity-0');
            
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
                
                // Hide Form, Show Result
                formSection.classList.add('hidden');
                resultSection.classList.remove('hidden');
                resultSection.classList.add('flex'); // restore flex display
                
                // Animate fade in of result
                resultSection.animate([
                    { opacity: 0, transform: 'translateY(10px)' },
                    { opacity: 1, transform: 'translateY(0)' }
                ], {
                    duration: 500,
                    easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
                });

            }, 300);
        }

        function resetUI() {
            // Reset to initial state
            resultSection.classList.add('hidden');
            resultSection.classList.remove('flex');
            
            formSection.classList.remove('hidden');
            
            // Clear input
            codeInput.value = '';
            enterBtn.classList.add('opacity-0', 'translate-x-4', 'pointer-events-none');
            
            // Animate form back in
            formSection.animate([
                { opacity: 0, transform: 'scale(0.98)' },
                { opacity: 1, transform: 'scale(1)' }
            ], {
                duration: 400,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
            });
        }
    </script>
