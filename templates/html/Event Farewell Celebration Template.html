<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farewell Celebration</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #f7fceb;
}
.font-serif {
font-family: 'Playfair Display', serif;
}
/* Cinematic Noise Overlay */
.bg-noise {
background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
opacity: 0.04;
pointer-events: none;
}
/* Glassmorphism Utilities */
.glass-panel {
background: rgba(255, 255, 255, 0.4);
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
border: 1px solid rgba(255, 255, 255, 0.6);
}
.glass-button {
background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.4));
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255,255,255,0.9);
box-shadow: 0 8px 32px rgba(132, 204, 22, 0.15), inset 0 0 0 1px rgba(255,255,255,0.6);
}
/* Animations */
@keyframes float-slow {
0%, 100% { transform: translateY(0) rotate(0deg); }
50% { transform: translateY(-20px) rotate(3deg); }
}
@keyframes float-reverse {
0%, 100% { transform: translateY(0) rotate(0deg); }
50% { transform: translateY(20px) rotate(-3deg); }
}
@keyframes drift {
0% { transform: translateY(110vh) rotate(0deg) scale(0.8); opacity: 0; }
10% { opacity: 0.7; }
90% { opacity: 0.7; }
100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; }
}
@keyframes pulse-glow {
0%, 100% { opacity: 0.5; transform: scale(1); }
50% { opacity: 0.8; transform: scale(1.05); }
}
@keyframes spin-slow {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
@keyframes spin-reverse-slow {
0% { transform: rotate(360deg); }
100% { transform: rotate(0deg); }
}
.animate-float-1 { animation: float-slow 8s ease-in-out infinite; }
.animate-float-2 { animation: float-reverse 10s ease-in-out infinite; }
.animate-glow { animation: pulse-glow 6s ease-in-out infinite; }
.animate-spin-slow { animation: spin-slow 20s linear infinite; }
.animate-spin-reverse-slow { animation: spin-reverse-slow 25s linear infinite; }
/* Petal Base Shape */
.petal {
width: 24px;
height: 36px;
border-radius: 50% 50% 0 50%;
position: absolute;
z-index: 10;
}
/* Hide Scrollbar */
::-webkit-scrollbar { display: none; }
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="relative w-full min-h-screen overflow-hidden bg-gradient-to-br from-yellow-50 via-lime-100 to-green-50 text-gray-900 selection:bg-lime-200 selection:text-green-900">

    <!-- Cinematic Overlays -->
    <div class="fixed inset-0 bg-noise z-50 pointer-events-none"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-transparent via-white/20 to-white/40 z-0 pointer-events-none"></div>

    <!-- Decorative Aesthetic Background Blobs (UI Motion Graphics Style) -->
    <!-- Top Left Blob -->
    <div class="fixed -top-32 -left-20 w-[30rem] h-[30rem] animate-float-1 z-0 pointer-events-none">
        <div class="absolute inset-0 bg-lime-200/50 rounded-full blur-3xl animate-glow"></div>
        <div class="absolute top-20 left-20 w-40 h-40 bg-gradient-to-tr from-yellow-200 to-lime-100 rounded-full opacity-80 blur-md mix-blend-multiply"></div>
        <div class="absolute top-10 left-40 w-32 h-32 bg-gradient-to-tr from-lime-100 to-green-50 rounded-full opacity-90 blur-sm mix-blend-overlay"></div>
    </div>

    <!-- Bottom Right Blob -->
    <div class="fixed -bottom-40 -right-20 w-[35rem] h-[35rem] animate-float-2 z-0 pointer-events-none">
        <div class="absolute inset-0 bg-yellow-200/40 rounded-full blur-3xl animate-glow" style="animation-delay: -3s;"></div>
        <div class="absolute bottom-20 right-20 w-48 h-48 bg-gradient-to-tr from-green-200 to-lime-100 rounded-full opacity-80 blur-md mix-blend-multiply"></div>
        <div class="absolute bottom-40 right-10 w-36 h-36 bg-gradient-to-tl from-lime-100 to-yellow-100 rounded-full opacity-90 blur-sm mix-blend-overlay"></div>
    </div>


    <!-- ==================== NEW: CORNER BALLOONS & FLOWERS ==================== -->
    
    <!-- Top Left Corner Elements -->
    <div class="fixed top-8 left-8 sm:top-16 sm:left-16 z-10 pointer-events-none opacity-80">
        <!-- Big Geometric Flower -->
        <div class="absolute -top-10 -left-10 w-32 h-32 sm:w-48 sm:h-48 animate-spin-slow mix-blend-multiply">
            <div class="absolute top-0 left-1/4 w-1/2 h-full bg-lime-200/60 rounded-full"></div>
            <div class="absolute top-1/4 left-0 w-full h-1/2 bg-yellow-200/60 rounded-full"></div>
            <div class="absolute inset-0 m-auto w-10 h-10 bg-green-300 rounded-full blur-sm"></div>
        </div>
        <!-- Yellow Balloon -->
        <div class="relative w-24 h-32 sm:w-32 sm:h-40 animate-float-1" style="animation-delay: -2s;">
            <div class="w-full h-full rounded-[50%_50%_50%_50%/40%_40%_60%_60%] bg-[radial-gradient(circle_at_30%_30%,#fef08a,#eab308)] shadow-[-10px_-10px_20px_rgba(0,0,0,0.05)_inset,10px_10px_20px_rgba(255,255,255,0.7)_inset]"></div>
            <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[6px] border-r-[6px] border-b-[10px] border-transparent border-b-yellow-500"></div>
            <div class="absolute -bottom-12 left-1/2 w-[1px] h-12 bg-gray-400/60"></div>
        </div>
    </div>

    <!-- Bottom Right Corner Elements -->
    <div class="fixed bottom-16 right-8 sm:bottom-24 sm:right-16 z-10 pointer-events-none opacity-80">
        <!-- Big Geometric Flower -->
        <div class="absolute top-10 right-10 w-40 h-40 sm:w-56 sm:h-56 animate-spin-reverse-slow mix-blend-multiply scale-110">
            <div class="absolute inset-0 w-full h-full border-[16px] border-lime-300/40 rounded-full border-dashed"></div>
            <div class="absolute inset-4 bg-yellow-200/50 rounded-[40%] animate-spin-slow"></div>
            <div class="absolute inset-0 m-auto w-12 h-12 bg-green-200 rounded-full blur-sm"></div>
        </div>
        <!-- Green Balloon -->
        <div class="relative w-28 h-36 sm:w-36 sm:h-48 animate-float-2">
            <div class="w-full h-full rounded-[50%_50%_50%_50%/40%_40%_60%_60%] bg-[radial-gradient(circle_at_30%_30%,#d9f99d,#65a30d)] shadow-[-10px_-10px_20px_rgba(0,0,0,0.05)_inset,10px_10px_20px_rgba(255,255,255,0.6)_inset]"></div>
            <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[8px] border-r-[8px] border-b-[12px] border-transparent border-b-lime-600"></div>
            <div class="absolute -bottom-16 left-1/2 w-[1px] h-16 bg-gray-400/60"></div>
        </div>
    </div>

    <!-- Top Right Corner Elements -->
    <div class="fixed top-12 right-12 sm:top-20 sm:right-20 z-10 pointer-events-none opacity-70">
        <!-- Floating Lime Balloon -->
        <div class="relative w-20 h-28 sm:w-24 sm:h-32 animate-float-1" style="animation-delay: -5s;">
            <div class="w-full h-full rounded-[50%_50%_50%_50%/40%_40%_60%_60%] bg-[radial-gradient(circle_at_30%_30%,#bbf7d0,#22c55e)] shadow-[-10px_-10px_20px_rgba(0,0,0,0.05)_inset,10px_10px_20px_rgba(255,255,255,0.6)_inset]"></div>
            <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-0 h-0 border-l-[5px] border-r-[5px] border-b-[8px] border-transparent border-b-green-500"></div>
            <div class="absolute -bottom-10 left-1/2 w-[1px] h-10 bg-gray-400/60"></div>
        </div>
    </div>

    <!-- Bottom Left Corner Elements -->
    <div class="fixed bottom-12 left-12 sm:bottom-20 sm:left-20 z-10 pointer-events-none opacity-70">
        <!-- Layered Abstract Flower -->
        <div class="relative w-24 h-24 sm:w-32 sm:h-32 animate-spin-slow">
            <div class="absolute inset-0 bg-lime-300/40 rounded-3xl rotate-12"></div>
            <div class="absolute inset-0 bg-yellow-300/40 rounded-3xl rotate-45"></div>
            <div class="absolute inset-0 bg-green-200/40 rounded-3xl rotate-[75deg]"></div>
        </div>
    </div>


    <!-- Floating Petals Container -->
    <div id="petals-container" class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <!-- Petals are injected via JS -->
    </div>

    <!-- PAGE 1: Landing Page -->
    <div id="page1" class="absolute inset-0 z-30 flex flex-col items-center justify-center transition-all duration-1000 ease-[cubic-bezier(0.22,1,0.36,1)]">
        <div class="relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-yellow-300 via-lime-300 to-green-300 rounded-full blur opacity-40 group-hover:opacity-80 transition duration-500"></div>
            <button onclick="openInvitation()" class="relative glass-button px-10 py-4 rounded-full flex items-center gap-3 text-gray-800 transition-all duration-500 hover:scale-[1.02] active:scale-95 cursor-pointer">
                <span class="text-sm tracking-widest uppercase font-medium">Open</span>
                <iconify-icon icon="solar:round-alt-arrow-right-linear" width="20" height="20" class="text-emerald-600 group-hover:translate-x-1 transition-transform duration-300"></iconify-icon>
            </button>
        </div>
    </div>

    <!-- PAGE 2: Farewell Details Page -->
    <div id="page2" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-4 sm:p-8 opacity-0 scale-[0.97] pointer-events-none transition-all duration-1000 ease-[cubic-bezier(0.22,1,0.36,1)]">
        
        <!-- Live Timing Pill -->
        <div class="absolute top-6 right-6 sm:top-10 sm:right-10 glass-panel px-4 py-2 rounded-full flex items-center gap-2 shadow-sm animate-fade-in z-40">
            <iconify-icon icon="solar:clock-circle-linear" class="text-lime-600"></iconify-icon>
            <span id="liveClock" class="text-xs font-medium text-gray-600 tracking-wide"></span>
        </div>

        <!-- Main Glass Card -->
        <div class="glass-panel w-full max-w-3xl rounded-[2.5rem] p-8 sm:p-14 text-center relative overflow-hidden group shadow-[0_20px_60px_-15px_rgba(0,0,0,0.05)]">
            
            <!-- Subtle internal card glow -->
            <div class="absolute -top-40 -right-40 w-80 h-80 bg-lime-200/50 rounded-full blur-3xl transition-opacity duration-700 opacity-50 group-hover:opacity-100 pointer-events-none"></div>
            <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-yellow-200/50 rounded-full blur-3xl transition-opacity duration-700 opacity-50 group-hover:opacity-100 pointer-events-none"></div>

            <div class="relative z-10 flex flex-col items-center">
                
                <!-- Headers -->
                <span class="font-serif italic text-lg sm:text-xl text-emerald-600 mb-3 font-medium tracking-wide">Memories Forever</span>
                <h1 class="font-serif text-4xl sm:text-6xl md:text-7xl text-gray-900 tracking-tighter mb-12 font-semibold uppercase leading-tight">
                    Farewell <br/> Party
                </h1>

                <!-- Countdown Timer Grid -->
                <div class="grid grid-cols-4 gap-3 sm:gap-6 w-full max-w-xl mb-12">
                    <div class="flex flex-col items-center group/time">
                        <div class="w-16 h-16 sm:w-24 sm:h-24 rounded-2xl bg-white/50 border border-white/60 shadow-sm flex items-center justify-center mb-2 transition-transform duration-300 group-hover/time:-translate-y-1">
                            <span id="cd-days" class="text-2xl sm:text-4xl text-gray-800 font-medium tracking-tight">00</span>
                        </div>
                        <span class="text-xs text-gray-600 uppercase tracking-widest font-medium">Days</span>
                    </div>
                    <div class="flex flex-col items-center group/time">
                        <div class="w-16 h-16 sm:w-24 sm:h-24 rounded-2xl bg-white/50 border border-white/60 shadow-sm flex items-center justify-center mb-2 transition-transform duration-300 group-hover/time:-translate-y-1">
                            <span id="cd-hours" class="text-2xl sm:text-4xl text-gray-800 font-medium tracking-tight">00</span>
                        </div>
                        <span class="text-xs text-gray-600 uppercase tracking-widest font-medium">Hours</span>
                    </div>
                    <div class="flex flex-col items-center group/time">
                        <div class="w-16 h-16 sm:w-24 sm:h-24 rounded-2xl bg-white/50 border border-white/60 shadow-sm flex items-center justify-center mb-2 transition-transform duration-300 group-hover/time:-translate-y-1">
                            <span id="cd-mins" class="text-2xl sm:text-4xl text-gray-800 font-medium tracking-tight">00</span>
                        </div>
                        <span class="text-xs text-gray-600 uppercase tracking-widest font-medium">Mins</span>
                    </div>
                    <div class="flex flex-col items-center group/time">
                        <div class="w-16 h-16 sm:w-24 sm:h-24 rounded-2xl bg-white/50 border border-white/60 shadow-sm flex items-center justify-center mb-2 transition-transform duration-300 group-hover/time:-translate-y-1">
                            <span id="cd-secs" class="text-2xl sm:text-4xl text-emerald-600 font-medium tracking-tight">00</span>
                        </div>
                        <span class="text-xs text-gray-600 uppercase tracking-widest font-medium">Secs</span>
                    </div>
                </div>

                <!-- Event Details Divider -->
                <div class="w-12 h-[1px] bg-gray-300 mb-8 rounded-full"></div>

                <!-- Location Details -->
                <div class="space-y-5 w-full">
                    <div class="flex flex-col sm:flex-row items-center justify-center gap-2 sm:gap-3 group/loc">
                        <div class="w-8 h-8 rounded-full bg-lime-200 flex items-center justify-center group-hover/loc:scale-110 transition-transform">
                            <iconify-icon icon="solar:buildings-linear" class="text-emerald-700 text-lg"></iconify-icon>
                        </div>
                        <span class="text-gray-800 text-lg sm:text-xl font-medium tracking-tight">
                            Bareilly International University
                        </span>
                    </div>
                    
                    <div class="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-xl bg-white/40 border border-white/50 group/pin transition-colors hover:bg-white/60">
                        <iconify-icon icon="solar:map-point-linear" class="text-lime-600 text-lg group-hover/pin:animate-bounce"></iconify-icon>
                        <span class="text-gray-700 text-sm sm:text-base font-medium">
                            BIU House near Jhanda Ground
                        </span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // Generate Floating Petals dynamically (Updated to yellow/green palette)
        const container = document.getElementById('petals-container');
        const colors = ['from-yellow-200 to-lime-200', 'from-lime-200 to-green-300', 'from-green-200 to-emerald-200'];
        
        for (let i = 0; i < 12; i++) {
            const petal = document.createElement('div');
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            const randomLeft = Math.floor(Math.random() * 100);
            const randomDelay = Math.random() * 10;
            const randomDuration = 12 + Math.random() * 10;
            const randomScale = 0.5 + Math.random() * 0.8;
            
            petal.className = `petal bg-gradient-to-br ${randomColor}`;
            petal.style.left = `${randomLeft}vw`;
            petal.style.animation = `drift ${randomDuration}s linear ${randomDelay}s infinite`;
            petal.style.transform = `scale(${randomScale})`;
            
            container.appendChild(petal);
        }

        // Page Transition Logic
        function openInvitation() {
            const p1 = document.getElementById('page1');
            const p2 = document.getElementById('page2');

            // Animate Page 1 out
            p1.style.opacity = '0';
            p1.style.transform = 'scale(1.05)';
            p1.style.filter = 'blur(10px)';
            p1.style.pointerEvents = 'none';

            // Animate Page 2 in
            setTimeout(() => {
                p2.classList.remove('opacity-0', 'scale-[0.97]', 'pointer-events-none');
                p2.classList.add('opacity-100', 'scale-100');
                p2.style.pointerEvents = 'auto';
            }, 600);
        }

        // Live Clock
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('liveClock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Countdown Timer Logic
        const targetDate = new Date("May 16, 2026 10:00:00").getTime();
        
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('cd-days').textContent = "00";
                document.getElementById('cd-hours').textContent = "00";
                document.getElementById('cd-mins').textContent = "00";
                document.getElementById('cd-secs').textContent = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
            document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('cd-mins').textContent = String(minutes).padStart(2, '0');
            document.getElementById('cd-secs').textContent = String(seconds).padStart(2, '0');
        }
        
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
