    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Wave Patterns</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes wave1 {
            0%, 100% { transform: translateY(0) scaleY(1.05); }
            50% { transform: translateY(10px) scaleY(0.95); }
        }
        @keyframes wave2 {
            0%, 100% { transform: translateY(0) scaleY(0.95); }
            50% { transform: translateY(-12px) scaleY(1.05); }
        }
        @keyframes colorShift1 {
            0% { stroke: rgba(59, 130, 246, 0.5); }
            33% { stroke: rgba(139, 92, 246, 0.5); }
            66% { stroke: rgba(236, 72, 153, 0.5); }
            100% { stroke: rgba(59, 130, 246, 0.5); }
        }
        @keyframes colorShift2 {
            0% { stroke: rgba(236, 72, 153, 0.3); }
            33% { stroke: rgba(59, 130, 246, 0.3); }
            66% { stroke: rgba(139, 92, 246, 0.3); }
            100% { stroke: rgba(236, 72, 153, 0.3); }
        }
        @keyframes dashOffset {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 1000; }
        }
        .wave-1 { animation: wave1 8s ease-in-out infinite, colorShift1 15s linear infinite; }
        .wave-2 { animation: wave2 9s ease-in-out infinite, colorShift2 18s linear infinite; }
        .wave-3 { animation: wave1 10s ease-in-out infinite, colorShift1 20s linear infinite; }
        .wave-4 { animation: wave2 11s ease-in-out infinite, colorShift2 22s linear infinite; }
        .dash-animate { animation: dashOffset 30s linear infinite; }
    </style>
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen overflow-hidden">
    <div class="relative w-full max-w-6xl h-[80vh] mx-auto">
        <!-- Background gradient -->
        <div class="absolute inset-0 bg-gradient-to-b from-blue-950/20 via-purple-950/20 to-pink-950/20 rounded-3xl"></div>
        
        <!-- Main wave container -->
        <div class="absolute inset-0 flex items-center justify-center overflow-hidden">
            <svg viewBox="0 0 1200 800" class="w-full h-full" preserveAspectRatio="none">
                <!-- Defs for gradients -->
                <defs>
                    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="rgba(59, 130, 246, 0.6)" />
                        <stop offset="50%" stop-color="rgba(139, 92, 246, 0.6)" />
                        <stop offset="100%" stop-color="rgba(236, 72, 153, 0.6)" />
                    </linearGradient>
                    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="rgba(236, 72, 153, 0.4)" />
                        <stop offset="50%" stop-color="rgba(59, 130, 246, 0.4)" />
                        <stop offset="100%" stop-color="rgba(139, 92, 246, 0.4)" />
                    </linearGradient>
                    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="rgba(139, 92, 246, 0.3)" />
                        <stop offset="50%" stop-color="rgba(236, 72, 153, 0.3)" />
                        <stop offset="100%" stop-color="rgba(59, 130, 246, 0.3)" />
                    </linearGradient>
                </defs>
                
                <!-- Wave patterns - Layer 1 -->
                <path class="wave-1" fill="none" stroke="url(#gradient1)" stroke-width="2" stroke-linecap="round" 
                    d="M 0 300 Q 150 250, 300 300 T 600 300 T 900 300 T 1200 300" />
                <path class="wave-2" fill="none" stroke="url(#gradient2)" stroke-width="1.5" stroke-linecap="round"
                    d="M 0 350 Q 150 400, 300 350 T 600 350 T 900 350 T 1200 350" />
                <path class="wave-3" fill="none" stroke="url(#gradient3)" stroke-width="1" stroke-linecap="round"
                    d="M 0 400 Q 150 350, 300 400 T 600 400 T 900 400 T 1200 400" />
                
                <!-- Wave patterns - Layer 2 -->
                <path class="wave-1" fill="none" stroke="url(#gradient1)" stroke-width="2" stroke-linecap="round"
                    d="M 0 500 Q 200 450, 400 500 T 800 500 T 1200 500" />
                <path class="wave-2" fill="none" stroke="url(#gradient2)" stroke-width="1.5" stroke-linecap="round"
                    d="M 0 550 Q 200 600, 400 550 T 800 550 T 1200 550" />
                <path class="wave-3" fill="none" stroke="url(#gradient3)" stroke-width="1" stroke-linecap="round"
                    d="M 0 600 Q 200 550, 400 600 T 800 600 T 1200 600" />
                
                <!-- Dashed wave patterns -->
                <path class="wave-4 dash-animate" fill="none" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1" stroke-linecap="round"
                    stroke-dasharray="10,15" d="M 0 250 Q 300 150, 600 250 T 1200 250" />
                <path class="wave-3 dash-animate" fill="none" stroke="rgba(59, 130, 246, 0.3)" stroke-width="0.75" stroke-linecap="round"
                    stroke-dasharray="8,12" d="M 0 450 Q 300 550, 600 450 T 1200 450" />
                
                <!-- Intersecting sine waves -->
                <g id="sineWaves">
                    <path class="wave-1" fill="none" stroke="rgba(236, 72, 153, 0.2)" stroke-width="1.5" 
                        d="M0,200 C100,100 200,300 300,200 C400,100 500,300 600,200 C700,100 800,300 900,200 C1000,100 1100,300 1200,200" />
                    <path class="wave-2" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1.5"
                        d="M0,150 C100,250 200,50 300,150 C400,250 500,50 600,150 C700,250 800,50 900,150 C1000,250 1100,50 1200,150" />
                </g>
                
                <!-- Particle waves -->
                <g id="particles">
                    <circle cx="100" cy="300" r="2" fill="white" class="opacity-80">
                        <animate attributeName="cy" values="300;280;300" dur="4s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="200" cy="350" r="1.5" fill="white" class="opacity-60">
                        <animate attributeName="cy" values="350;370;350" dur="5s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="400" cy="400" r="2" fill="white" class="opacity-80">
                        <animate attributeName="cy" values="400;380;400" dur="6s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="600" cy="300" r="1.5" fill="white" class="opacity-60">
                        <animate attributeName="cy" values="300;320;300" dur="7s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="800" cy="350" r="2" fill="white" class="opacity-80">
                        <animate attributeName="cy" values="350;330;350" dur="5s" repeatCount="indefinite" />
                    </circle>
                    <circle cx="1000" cy="400" r="1.5" fill="white" class="opacity-60">
                        <animate attributeName="cy" values="400;420;400" dur="6s" repeatCount="indefinite" />
                    </circle>
                </g>
            </svg>
        </div>
        
        <!-- Content overlay -->
        <div class="absolute inset-0 flex flex-col items-center justify-center z-10 p-6 text-center">
            <h1 class="text-4xl md:text-6xl font-bold text-white mb-4 tracking-tight">
                Harmonic Wave Patterns
            </h1>
            <p class="text-lg md:text-xl text-blue-100/80 max-w-2xl">
                A complex visualization of interacting sinusoidal waveforms with varying amplitudes, 
                frequencies and phase shifts creating an ever-evolving flow of energy.
            </p>
        </div>
    </div>
    
    <script>
        // Generate additional dynamic waves
        document.addEventListener('DOMContentLoaded', function() {
            const sineWaves = document.getElementById('sineWaves');
            
            // Create multiple sine waves with different parameters
            for (let i = 0; i < 5; i++) {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const amplitude = 50 + i * 10;
                const frequency = 3 + i * 0.5;
                const phase = i * 30;
                
                let d = `M0,${300 + i * 20} `;
                for (let x = 0; x <= 1200; x += 20) {
                    const y = 300 + i * 20 + amplitude * Math.sin((x / 200 * frequency) + phase);
                    d += `L${x},${y} `;
                }
                
                path.setAttribute('d', d);
                path.setAttribute('fill', 'none');
                path.setAttribute('stroke', `rgba(${59 + i * 40}, ${130 - i * 20}, ${246 - i * 30}, ${0.2 - i * 0.02})`);
                path.setAttribute('stroke-width', 1);
                path.classList.add(i % 2 === 0 ? 'wave-1' : 'wave-2');
                
                sineWaves.appendChild(path);
            }
        });
    </script>
</body>
