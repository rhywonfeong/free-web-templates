        <!-- Weekly Forecast -->
        <section data-anime="" class="transition-all duration-700">
          <h2 class="text-lg font-medium tracking-tight mb-2">
            7-Day Outlook

          <div class="divide-y divide-gray-700/60">
            <!-- Week Row -->
            
            <!-- Rows injected by JS -->
          
              <div class="flex items-center justify-between py-2 hover:bg-white/5 rounded-lg px-2 transition-colors">
                <span class="w-1/3 text-sm font-medium">Monday</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="cloud" class="lucide lucide-cloud w-5 h-5"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>
                <div class="w-1/3 flex justify-end space-x-1 text-sm">
                  <span>63°</span><span class="text-gray-400">/</span><span class="text-gray-400">49°</span>
                </div>
              </div>
            
              <div class="flex items-center justify-between py-2 hover:bg-white/5 rounded-lg px-2 transition-colors">
                <span class="w-1/3 text-sm font-medium">Tuesday</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="cloud-drizzle" class="lucide lucide-cloud-drizzle w-5 h-5"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M8 19v1"></path><path d="M8 14v1"></path><path d="M16 19v1"></path><path d="M16 14v1"></path><path d="M12 21v1"></path><path d="M12 16v1"></path></svg>
                <div class="w-1/3 flex justify-end space-x-1 text-sm">
                  <span>61°</span><span class="text-gray-400">/</span><span class="text-gray-400">48°</span>
                </div>
              </div>
            
              <div class="flex items-center justify-between py-2 hover:bg-white/5 rounded-lg px-2 transition-colors">
                <span class="w-1/3 text-sm font-medium">Wednesday</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="cloud-snow" class="lucide lucide-cloud-snow w-5 h-5"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M8 15h.01"></path><path d="M8 19h.01"></path><path d="M12 17h.01"></path><path d="M12 21h.01"></path><path d="M16 15h.01"></path><path d="M16 19h.01"></path></svg>
                <div class="w-1/3 flex justify-end space-x-1 text-sm">

                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="cloud-rain" class="lucide lucide-cloud-rain w-5 h-5"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M16 14v6"></path><path d="M8 14v6"></path><path d="M12 16v6"></path></svg>
                <div class="w-1/3 flex justify-end space-x-1 text-sm">
                  <span>60°</span><span class="text-gray-400">/</span><span class="text-gray-400">46°</span>

              <div class="flex items-center justify-between py-2 hover:bg-white/5 rounded-lg px-2 transition-colors">
                <span class="w-1/3 text-sm font-medium">Friday</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="cloud" class="lucide lucide-cloud w-5 h-5"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>
                <div class="w-1/3 flex justify-end space-x-1 text-sm">

        <!-- Temperature Trend Chart -->
        <section data-anime="" class="transition-all duration-700">
          <h2 class="text-lg font-medium tracking-tight mb-2">
            Temperature Trend
          </h2>
          <div class="rounded-xl bg-white/5 p-3">
            <div class="relative">
              <canvas id="tempChart" width="279" height="120" style="display: block; box-sizing: border-box; height: 120px; width: 279px;"></canvas>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script>
      // Staggered Animation Reveal
      document.addEventListener("DOMContentLoaded", () => {
        const sections = document.querySelectorAll("[data-anime]");
        sections.forEach((el, i) => {
          setTimeout(() => {
            el.classList.remove("opacity-0", "translate-y-4", "blur-sm");
          }, 300 + i * 200);
        });

        // Populate Hourly Forecast
        const hours = [
          { time: "12 AM", icon: "cloud-rain", temp: 55 },
          { time: "1 AM", icon: "cloud", temp: 54 },
          { time: "2 AM", icon: "cloud", temp: 54 },
          { time: "3 AM", icon: "cloud", temp: 53 },
          { time: "4 AM", icon: "cloud-snow", temp: 53 },
          { time: "5 AM", icon: "cloud-rain", temp: 52 },
          { time: "6 AM", icon: "cloud-rain", temp: 52 },
          { time: "7 AM", icon: "cloud-sun", temp: 55 },
          { time: "8 AM", icon: "sun", temp: 58 },
          { time: "9 AM", icon: "sun", temp: 61 },
        ];

        const hourHolder = document.querySelector(
          "[data-anime] div.flex.space-x-4"
        );
        const hourTemplate = document.getElementById("hour-card").content;
        hours.forEach((h) => {
          const node = hourTemplate.cloneNode(true);
          node.querySelector("span").textContent = h.time;
          node.querySelector("i").setAttribute("data-lucide", h.icon);
          node.querySelector(
            "span.text-lg"
          ).textContent = `${h.temp}°`;
          hourHolder.appendChild(node);
        });

        // Populate Weekly Forecast
        const days = [
          { day: "Monday", icon: "cloud", hi: 63, lo: 49 },
          { day: "Tuesday", icon: "cloud-drizzle", hi: 61, lo: 48 },
          { day: "Wednesday", icon: "cloud-snow", hi: 59, lo: 47 },
          { day: "Thursday", icon: "cloud-rain", hi: 60, lo: 46 },
          { day: "Friday", icon: "cloud", hi: 62, lo: 47 },
          { day: "Saturday", icon: "sun", hi: 66, lo: 50 },
          { day: "Sunday", icon: "sun", hi: 68, lo: 52 },
        ];
        const weekHolder = document
          .querySelectorAll("[data-anime]")[2]
          .querySelector("div.divide-y");
        const dayTemplate = document.getElementById("day-row").content;
        days.forEach((d) => {
          const node = dayTemplate.cloneNode(true);
          node.querySelector("span").textContent = d.day;
          node.querySelector("i").setAttribute("data-lucide", d.icon);
          node.querySelectorAll("span")[1].textContent = `${d.hi}°`;
          node.querySelectorAll("span")[3].textContent = `${d.lo}°`;
          weekHolder.appendChild(node);
        });

        // Lucide Icons
        lucide.createIcons();

        // Chart.js Temperature Line
        const ctx = document.getElementById("tempChart");
        new Chart(ctx, {
          type: "line",
          data: {
            labels: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
            datasets: [
              {
                label: "High",
                data: days.map((d) => d.hi),
                borderColor: "#facc15",
                backgroundColor: "transparent",
                tension: 0.4,
                borderWidth: 2,
                pointRadius: 0,
              },
              {
                label: "Low",
                data: days.map((d) => d.lo),
                borderColor: "#38bdf8",
                backgroundColor: "transparent",
                tension: 0.4,
                borderDash: [4, 4],
                borderWidth: 2,
                pointRadius: 0,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { display: false },
              x: {
                grid: { display: false },
                ticks: { color: "#aaa", font: { size: 10 } },
              },
            },
          },
        });
      });
    </script>
  
</body></html>
