<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isolated Particle Background</title>
<script src="https://cdn.tailwindcss.com"></script><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="scroll-smooth bg-[#050505] min-h-[200vh] m-0 p-0 font-sans">
    
    <!-- Demonstration text -->
    <div class="fixed inset-0 flex items-center justify-center text-gray-600 text-sm tracking-widest uppercase pointer-events-none z-0">
        Rising Particles Background
    </div>

    <!-- Isolated Canvas Background -->
    <canvas id="hero-canvas" class="fixed top-0 left-0 w-full h-screen z-[-1] opacity-60 pointer-events-none"></canvas>

    <script>
        class ParticleSystem {
            constructor(canvasId, options = {}) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.particles = [];
                this.options = {
                    count: 100,
                    color: '#ccff00',
                    ...options
                };
                
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.init();
                this.animate();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            init() {
                this.particles = [];
                for(let i = 0; i < this.options.count; i++) {
                    this.particles.push(new Particle(this.canvas, this.options.color));
                }
            }

            animate() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.particles.forEach(p => {
                    // Normal Flow
                    p.update();
                    p.opacity = Math.min(0.8, p.opacity + 0.01);
                    p.draw(this.ctx);
                });

                requestAnimationFrame(() => this.animate());
            }
        }

        class Particle {
            constructor(canvas, color) {
                this.canvas = canvas;
                this.color = color;
                this.reset();
            }

            reset() {
                this.x = Math.random() * this.canvas.width;
                this.y = Math.random() * this.canvas.height;
                this.size = Math.random() * 2 + 1;
                this.speedY = Math.random() * -1 - 0.5; // Upward flow
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                if (this.y < 0) {
                    this.y = this.canvas.height;
                    this.x = Math.random() * this.canvas.width;
                }
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // Initialize System
        const heroParticles = new ParticleSystem('hero-canvas', { 
            count: 150, 
            color: '#ccff00'
        });
    </script>
</body>
</html>
