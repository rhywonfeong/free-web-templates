<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Deal Card Centered</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
body {
font-family: 'Inter', sans-serif;
background-color: #000;
}
</style></head>
<body class="min-h-screen flex items-center justify-center p-4 bg-zinc-950 text-zinc-100">

    <!-- Card -->
    <div class="w-full max-w-sm bg-[#09090B] border border-white/10 shadow-2xl ring-1 ring-white/5 group">
        
        <!-- Image Header -->
        <div class="relative h-64 w-full overflow-hidden">
            <!-- Background Image -->
            <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?q=80&w=2000&auto=format&fit=crop" alt="Paris" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105 opacity-90">
            
            <!-- Gradient for text readability -->
            <div class="absolute inset-0 bg-gradient-to-t from-[#09090B] via-transparent to-transparent opacity-80"></div>

            <!-- Top Badges -->
            <div class="absolute top-4 left-4 flex items-center gap-2">
                <span class="bg-black/60 backdrop-blur-md text-white text-xs font-medium px-2.5 py-1 border border-white/10">
                    Feb 9
                </span>
            </div>

            <!-- Business Class Badge (Right) -->
            <div class="absolute top-4 right-4">
                <span class="bg-blue-600/90 backdrop-blur-md text-white text-xs font-semibold px-2.5 py-1 border border-blue-400/20 shadow-lg shadow-blue-900/20">
                    Business Class
                </span>
            </div>
        </div>

        <!-- Content Body -->
        <div class="px-6 pt-6 pb-6 relative -mt-6 bg-[#09090B] border-t border-white/5 text-center">
            
            <!-- Header Section -->
            <div class="mb-8">
                <h1 class="text-3xl font-semibold text-white tracking-tight uppercase">Europe</h1>
                <p class="text-zinc-400 text-sm mt-1">8 Routes to Paris</p>
            </div>

            <!-- Price Block -->
            <div class="flex items-end justify-center gap-3 mb-8 p-5 bg-zinc-900/30 border border-white/5">
                <div class="flex flex-col items-center">
                    <span class="text-xs text-zinc-500 mb-1 font-medium">Roundtrip</span>
                    <span class="text-3xl font-semibold text-white tracking-tight">$2,781</span>
                </div>
                <span class="text-sm text-zinc-600 line-through mb-1.5 pb-0.5 decoration-zinc-700 decoration-1">$2,347</span>
            </div>

            <!-- Meta Info & Logos -->
            <div class="flex flex-col items-center gap-4 mb-8">
                <!-- Availability Text -->
                <div class="flex items-center justify-center gap-2 text-xs text-zinc-400 font-medium">
                    <i data-lucide="calendar" class="w-3.5 h-3.5 text-zinc-500"></i>
                    <span>Available for 5 months</span>
                </div>
                
                <!-- Airline Logos -->
                <div class="flex items-center justify-center gap-2.5">
                    <div class="w-7 h-7 rounded-full bg-white p-0.5 flex items-center justify-center opacity-90 hover:opacity-100 transition-opacity ring-1 ring-white/10 overflow-hidden">
                        <img src="https://images.kiwi.com/airlines/64/AF.png" alt="Air France" class="w-full h-full object-contain grayscale opacity-80">
                    </div>
                    <div class="w-7 h-7 rounded-full bg-white p-0.5 flex items-center justify-center opacity-90 hover:opacity-100 transition-opacity ring-1 ring-white/10 overflow-hidden">
                        <img src="https://images.kiwi.com/airlines/64/KL.png" alt="KLM" class="w-full h-full object-contain grayscale opacity-80">
                    </div>
                    <div class="w-7 h-7 rounded-full bg-white p-0.5 flex items-center justify-center opacity-90 hover:opacity-100 transition-opacity ring-1 ring-white/10 overflow-hidden">
                        <img src="https://images.kiwi.com/airlines/64/UA.png" alt="United" class="w-full h-full object-contain grayscale opacity-80">
                    </div>
                    <div class="w-7 h-7 rounded-full bg-zinc-800 border border-white/10 flex items-center justify-center hover:bg-zinc-700 transition-colors">
                        <span class="text-xs text-zinc-400 font-medium">+2</span>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <button class="w-full bg-white hover:bg-zinc-200 active:bg-zinc-300 text-black text-sm font-medium py-3.5 transition-all duration-200 flex items-center justify-center gap-2 group/btn">
                Deal Details
                <i data-lucide="arrow-right" class="w-4 h-4 text-zinc-500 group-hover/btn:text-black transition-colors"></i>
            </button>

        </div>

    </div>

    <script>
        lucide.createIcons({
            attrs: {
                "stroke-width": 1.5
            }
        });
    </script>
</body>
</html>
