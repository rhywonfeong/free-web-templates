<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Create Availability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-white text-neutral-900 font-sans" style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;">
  <div class="min-h-screen flex flex-col">
    <!-- Safe areas -->
    <div class="h-[env(safe-area-inset-top)]"></div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur border-b border-neutral-200">
      <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
        <button class="flex items-center gap-2 text-neutral-600 active:opacity-70" aria-label="Back">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
          <span class="text-[15px]">Back</span>
        </button>
        <div class="text-[20px] sm:text-[22px] tracking-tight font-semibold">New Availability</div>
        <button class="text-neutral-600 opacity-0 pointer-events-none">...</button>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1">
      <div class="max-w-md mx-auto px-4 pb-36 pt-4">
        <!-- Teacher Card (optional context) -->
        <section class="mb-5">
          <div class="flex items-center gap-3">
            <img src="https://images.unsplash.com/photo-1547425260-76bcadfb4f2c?q=80&w=400&auto=format&fit=crop" alt="Teacher avatar" class="w-10 h-10 rounded-full object-cover" />
            <div>
              <p class="text-[13px] text-neutral-500">You’re setting availability for</p>
              <p class="text-[16px] font-medium tracking-tight">1:1 Lessons</p>
            </div>
          </div>
        </section>

        <!-- Duration -->
        <section class="mb-7">
          <h2 class="text-[22px] tracking-tight font-semibold mb-3">Class duration</h2>

          <!-- Changed: segmented buttons replaced with input field -->
          <label class="block">
            <span class="sr-only">Duration</span>
            <div class="flex items-center gap-2 px-3 py-2 rounded-xl border border-neutral-200 hover:bg-neutral-50">
              <i data-lucide="clock" class="w-4 h-4 text-neutral-500"></i>
              <input id="durationInput" type="number" min="5" step="5" value="60" class="w-20 bg-transparent outline-none text-[15px] text-neutral-800" aria-label="Duration value">
              <div class="h-5 w-px bg-neutral-200"></div>
              <select id="durationUnit" class="bg-transparent outline-none text-[15px] text-neutral-700">
                <option value="minutes" selected>minutes</option>
                <option value="hours">hours</option>
              </select>
            </div>
          </label>

          <!-- Allow student choice -->
          <div class="mt-4 p-3 rounded-2xl border border-neutral-200">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <i data-lucide="sparkles" class="w-4 h-4 text-orange-500"></i>
                <p class="text-[15px]">Let students choose duration</p>
              </div>
              <button id="toggleStudentChoice" class="toggle relative inline-flex h-8 w-14 items-center rounded-full bg-neutral-200 transition-colors">
                <span class="dot h-6 w-6 bg-white rounded-full shadow-sm translate-x-1 transition-transform"></span>
              </button>
            </div>
            <div id="studentChoices" class="hidden mt-3">
              <p class="text-[13px] text-neutral-500 mb-2">Allowed options</p>
              <div id="choiceChips" class="flex flex-wrap gap-2">
                <button data-value="30" class="chip px-3 py-1.5 rounded-full border border-neutral-200 text-[14px] text-neutral-700 hover:bg-neutral-50">30m</button>
                <button data-value="45" class="chip px-3 py-1.5 rounded-full border border-neutral-200 text-[14px] text-neutral-700 hover:bg-neutral-50">45m</button>
                <button data-value="60" class="chip active px-3 py-1.5 rounded-full border border-orange-500/30 bg-orange-50 text-orange-700 text-[14px]">1h</button>
                <button data-value="90" class="chip px-3 py-1.5 rounded-full border border-neutral-200 text-[14px] text-neutral-700 hover:bg-neutral-50">1h30</button>
              </div>
            </div>
          </div>

          <!-- Buffer -->
          <div class="mt-4">
            <label class="text-[15px] text-neutral-700 mb-2 block">Buffer between classes</label>
            <div class="relative">
              <button id="bufferBtn" class="w-full flex items-center justify-between px-4 py-3 rounded-xl border border-neutral-200 text-[15px] hover:bg-neutral-50">
                <span class="flex items-center gap-2 text-neutral-700">
                  <i data-lucide="hourglass" class="w-4 h-4 text-neutral-500"></i>
                  <span id="bufferLabel">10 minutes</span>
                </span>
                <i data-lucide="chevron-down" class="w-4 h-4 text-neutral-500"></i>
              </button>
              <div id="bufferMenu" class="hidden absolute z-30 mt-2 w-full bg-white border border-neutral-200 rounded-xl shadow-lg overflow-hidden">
                <button data-mins="0" class="menu-item w-full text-left px-4 py-3 text-[15px] hover:bg-neutral-50">No buffer</button>
                <button data-mins="5" class="menu-item w-full text-left px-4 py-3 text-[15px] hover:bg-neutral-50">5 minutes</button>
                <button data-mins="10" class="menu-item w-full text-left px-4 py-3 text-[15px] hover:bg-neutral-50">10 minutes</button>
                <button data-mins="15" class="menu-item w-full text-left px-4 py-3 text-[15px] hover:bg-neutral-50">15 minutes</button>
                <button data-mins="30" class="menu-item w-full text-left px-4 py-3 text-[15px] hover:bg-neutral-50">30 minutes</button>
              </div>
            </div>
          </div>
        </section>

        <!-- Availability -->
        <section class="mb-7">
          <h2 class="text-[22px] tracking-tight font-semibold mb-3">Availability</h2>

          <!-- Separated: Repeats weekly -->
          <div id="weeklyPanel" class="mt-1">
            <h3 class="text-[17px] font-medium tracking-tight mb-2">Repeats weekly</h3>
            <p class="text-[13px] text-neutral-500 mb-2">Days available</p>
            <div id="dayChips" class="flex flex-wrap gap-2">
              <!-- Mon-Sun chips -->
              <button data-day="Mon" class="day px-3 py-1.5 rounded-full border border-orange-500/30 bg-orange-50 text-orange-700 text-[14px]">Mon</button>
              <button data-day="Tue" class="day px-3 py-1.5 rounded-full border border-orange-500/30 bg-orange-50 text-orange-700 text-[14px]">Tue</button>
              <button data-day="Wed" class="day px-3 py-1.5 rounded-full border border-orange-500/30 bg-orange-50 text-orange-700 text-[14px]">Wed</button>
              <button data-day="Thu" class="day px-3 py-1.5 rounded-full border border-orange-500/30 bg-orange-50 text-orange-700 text-[14px]">Thu</button>
              <button data-day="Fri" class="day px-3 py-1.5 rounded-full border border-orange-500/30 bg-orange-50 text-orange-700 text-[14px]">Fri</button>
              <button data-day="Sat" class="day px-3 py-1.5 rounded-full border border-neutral-200 text-neutral-700">Sat</button>
              <button data-day="Sun" class="day px-3 py-1.5 rounded-full border border-neutral-200 text-neutral-700">Sun</button>
            </div>

            <div class="mt-4">
              <p class="text-[13px] text-neutral-500 mb-2">Time blocks</p>
              <div id="blocks" class="space-y-2">
                <!-- Block template -->
                <div class="block-row flex items-center justify-between gap-2 p-3 rounded-2xl border border-neutral-200">
                  <div class="flex items-center gap-2">
                    <i data-lucide="clock" class="w-4 h-4 text-neutral-500"></i>
                    <button data-role="start" class="time-btn px-3 py-2 rounded-lg border border-neutral-200 text-[15px] hover:bg-neutral-50">8:00 AM</button>
                    <span class="text-neutral-400 text-[14px]">to</span>
                    <button data-role="end" class="time-btn px-3 py-2 rounded-lg border border-neutral-200 text-[15px] hover:bg-neutral-50">5:00 PM</button>
                  </div>
                  <button class="remove-row text-neutral-400 hover:text-neutral-600 p-2 rounded-lg" aria-label="Remove">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                  </button>
                </div>
              </div>
              <div class="mt-2">
                <button id="addBlock" class="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-xl border border-dashed border-neutral-300 text-neutral-700 hover:bg-neutral-50">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span class="text-[15px]">Add time block</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Divider -->
          <div class="mt-6 pt-4 border-t border-neutral-200"></div>

          <!-- Separated: Specific dates with Date Range -->
          <div id="specificPanel" class="mt-4">
            <h3 class="text-[17px] font-medium tracking-tight mb-2">Specific dates</h3>
            <div class="p-3 border border-neutral-200 rounded-2xl">
              <div class="flex items-center gap-2 mb-3">
                <i data-lucide="calendar" class="w-4 h-4 text-neutral-500"></i>
                <p class="text-[15px]">Pick date range</p>
              </div>
              <div class="grid grid-cols-2 gap-2">
                <label class="flex items-center gap-2 px-3 py-2 rounded-xl border border-neutral-200 text-[15px]">
                  <span class="text-neutral-500">From</span>
                  <input type="date" class="w-full outline-none bg-transparent text-neutral-800" />
                </label>
                <label class="flex items-center gap-2 px-3 py-2 rounded-xl border border-neutral-200 text-[15px]">
                  <span class="text-neutral-500">To</span>
                  <input type="date" class="w-full outline-none bg-transparent text-neutral-800" />
                </label>
              </div>

              <div class="mt-3">
                <p class="text-[13px] text-neutral-500 mb-2">Time on selected dates</p>
                <div class="block-row flex items-center justify-between gap-2 p-3 rounded-2xl border border-neutral-200">
                  <div class="flex items gap-2">
                    <i data-lucide="clock" class="w-4 h-4 text-neutral-500"></i>
                    <button data-role="start" class="time-btn px-3 py-2 rounded-lg border border-neutral-200 text-[15px] hover:bg-neutral-50">9:00 AM</button>
                    <span class="text-neutral-400 text-[14px]">to</span>
                    <button data-role="end" class="time-btn px-3 py2 rounded-lg border border-neutral-200 text-[15px] hover:bg-neutral-50">1:00 PM</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- Notes -->
        <section class="mb-7">
          <label class="text-[15px] text-neutral-700 mb-2 block">Internal note</label>
          <div class="relative">
            <textarea rows="3" placeholder="Optional — students won’t see this" class="w-full px-4 py-3 rounded-xl border border-neutral-200 text-[15px] placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-orange-500/30 focus:border-orange-500/50"></textarea>
            <div class="absolute bottom-2 right-2 text-neutral-400 text-[12px]">0/140</div>
          </div>
        </section>
      </div>
    </main>

    <!-- Sticky footer -->
    <footer class="fixed bottom-0 inset-x-0 z-40 bg-white/90 backdrop-blur border-t border-neutral-200">
      <div class="max-w-md mx-auto px-4 py-3 flex items-center gap-3">
        <button class="flex-1 px-4 py-3 rounded-xl border border-neutral-200 text-[15px] text-neutral-800 hover:bg-neutral-50">
          Preview
        </button>
        <button class="flex-[2] px-4 py-3 rounded-xl bg-orange-500 text-white text-[16px] font-semibold tracking-tight shadow-sm hover:bg-orange-600 active:translate-y-px flex items-center justify-center gap-2">
          <i data-lucide="check-circle-2" class="w-5 h-5 text-white"></i>
          Save & Publish
        </button>
      </div>
      <div class="h-[env(safe-area-inset-bottom)]"></div>
    </footer>
  </div>

  <!-- Time Picker Bottom Sheet -->
  <div id="timeSheet" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/30" data-dismiss="sheet"></div>
    <div class="absolute inset-x-0 bottom-0 bg-white rounded-t-3xl shadow-2xl">
      <div class="mx-auto max-w-md">
        <div class="px-5 pt-4 pb-2 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i data-lucide="clock" class="w-5 h-5 text-neutral-500"></i>
            <p id="sheetTitle" class="text-[17px] font-medium tracking-tight">Select time</p>
          </div>
          <button class="p-2 text-neutral-500 hover:text-neutral-700" data-dismiss="sheet">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div class="px-5 pb-6">
          <div id="timeList" class="grid grid-cols-3 gap-2 max-h-[48vh] overflow-y-auto">
            <!-- Times injected by JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    // Initialize icons
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      // Duration segmented control (removed) - guard for safety
      const durationGroup = document.getElementById('durationGroup');
      if (durationGroup) {
        durationGroup.addEventListener('click', (e) => {
          const btn = e.target.closest('.seg-btn');
          if (!btn) return;
          durationGroup.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active','border-orange-500/30','bg-orange-50','text-orange-700'));
          durationGroup.querySelectorAll('.seg-btn').forEach(b => b.classList.add('border-neutral-200','text-neutral-700'));
          btn.classList.remove('border-neutral-200','text-neutral-700');
          btn.classList.add('active','border-orange-500/30','bg-orange-50','text-orange-700');
        });
      }

      // Toggle "Let students choose duration"
      const toggle = document.getElementById('toggleStudentChoice');
      const choices = document.getElementById('studentChoices');
      let toggled = false;
      toggle.addEventListener('click', () => {
        toggled = !toggled;
        toggle.classList.toggle('bg-orange-500', toggled);
        toggle.classList.toggle('bg-neutral-200', !toggled);
        toggle.querySelector('.dot').style.transform = toggled ? 'translateX(2.25rem)' : 'translateX(0.25rem)';
        choices.classList.toggle('hidden', !toggled);
      });

      // Choice chips
      const choiceChips = document.getElementById('choiceChips');
      if (choiceChips) {
        choiceChips.addEventListener('click', (e) => {
          const chip = e.target.closest('.chip');
          if (!chip) return;
          chip.classList.toggle('active');
          chip.classList.toggle('bg-orange-50');
          chip.classList.toggle('text-orange-700');
          chip.classList.toggle('border-orange-500/30');
          chip.classList.toggle('border-neutral-200');
          chip.classList.toggle('text-neutral-700');
        });
      }

      // Buffer dropdown
      const bufferBtn = document.getElementById('bufferBtn');
      const bufferMenu = document.getElementById('bufferMenu');
      const bufferLabel = document.getElementById('bufferLabel');
      bufferBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        bufferMenu.classList.toggle('hidden');
      });
      bufferMenu.addEventListener('click', (e) => {
        const item = e.target.closest('.menu-item');
        if (!item) return;
        bufferLabel.textContent = item.textContent.trim();
        bufferMenu.classList.add('hidden');
      });
      document.addEventListener('click', () => bufferMenu.classList.add('hidden'));

      // Tabs removed - guard to avoid errors
      const tabs = document.getElementById('availTabs');
      if (tabs) {
        const weeklyPanel = document.getElementById('weeklyPanel');
        const specificPanel = document.getElementById('specificPanel');
        tabs.addEventListener('click', (e) => {
          const tab = e.target.closest('.tab');
          if (!tab) return;
          tabs.querySelectorAll('.tab').forEach(t => {
            t.classList.remove('active','bg-white','text-orange-700','shadow-sm');
            t.classList.add('text-neutral-700');
          });
          tab.classList.add('active','bg-white','text-orange-700','shadow-sm');
          if (tab.dataset.tab === 'weekly') {
            weeklyPanel.classList.remove('hidden');
            specificPanel.classList.add('hidden');
          } else {
            weeklyPanel.classList.add('hidden');
            specificPanel.classList.remove('hidden');
          }
        });
      }

      // Day chips
      const dayChips = document.getElementById('dayChips');
      dayChips.addEventListener('click', (e) => {
        const day = e.target.closest('.day');
        if (!day) return;
        const active = day.classList.contains('bg-orange-50');
        if (active) {
          day.classList.remove('bg-orange-50','text-orange-700','border-orange-500/30');
          day.classList.add('border-neutral-200','text-neutral-700');
        } else {
          day.classList.add('bg-orange-50','text-orange-700','border-orange-500/30');
          day.classList.remove('border-neutral-200','text-neutral-700');
        }
      });

      // Time sheet
      const timeSheet = document.getElementById('timeSheet');
      const timeList = document.getElementById('timeList');
      const sheetTitle = document.getElementById('sheetTitle');
      let currentTargetBtn = null;

      function openSheet(targetBtn) {
        currentTargetBtn = targetBtn;
        sheetTitle.textContent = targetBtn.dataset.role === 'start' ? 'Select start time' : 'Select end time';
        timeSheet.classList.remove('hidden');
      }
      function closeSheet() {
        timeSheet.classList.add('hidden');
        currentTargetBtn = null;
      }

      // Generate times (every 30 minutes)
      const times = [];
      for (let h = 6; h <= 21; h++) {
        for (let m of [0, 30]) {
          const date = new Date();
          date.setHours(h, m, 0, 0);
          let hour = h % 12 || 12;
          const ampm = h < 12 ? 'AM' : 'PM';
          const label = `${hour}:${String(m).padStart(2,'0')} ${ampm}`;
          times.push(label);
        }
      }
      timeList.innerHTML = times.map(t => `<button class="px-3 py-2 rounded-lg border border-neutral-200 text-[15px] hover:bg-neutral-50 text-left">${t}</button>`).join('');
      timeList.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn || !currentTargetBtn) return;
        currentTargetBtn.textContent = btn.textContent.trim();
        closeSheet();
      });

      document.querySelectorAll('[data-dismiss="sheet"]').forEach(el => {
        el.addEventListener('click', closeSheet);
      });

      // Open sheet from any time button
      function delegateTimeButtons(root) {
        root.addEventListener('click', (e) => {
          const tbtn = e.target.closest('.time-btn');
          if (!tbtn) return;
          openSheet(tbtn);
        });
      }
      delegateTimeButtons(document);

      // Add/Remove blocks
      const blocks = document.getElementById('blocks');
      document.getElementById('addBlock').addEventListener('click', () => {
        const row = document.createElement('div');
        row.className = 'block-row flex items-center justify-between gap-2 p-3 rounded-2xl border border-neutral-200';
        row.innerHTML = `
          <div class="flex items-center gap-2">
            <i data-lucide="clock" class="w-4 h-4 text-neutral-500"></i>
            <button data-role="start" class="time-btn px-3 py-2 rounded-lg border border-neutral-200 text-[15px] hover:bg-neutral-50">9:00 AM</button>
            <span class="text-neutral-400 text-[14px]">to</span>
            <button data-role="end" class="time-btn px-3 py-2 rounded-lg border border-neutral-200 text-[15px] hover:bg-neutral-50">12:00 PM</button>
          </div>
          <button class="remove-row text-neutral-400 hover:text-neutral-600 p-2 rounded-lg" aria-label="Remove">
            <i data-lucide="trash-2" class="w-5 h-5"></i>
          </button>
        `;
        blocks.appendChild(row);
        lucide.createIcons(); // refresh icons
      });

      document.addEventListener('click', (e) => {
        const remove = e.target.closest('.remove-row');
        if (!remove) return;
        const row = remove.closest('.block-row');
        if (row && blocks.children.length > 1) row.remove();
      });
    });
  </script>
</body>
</html>
