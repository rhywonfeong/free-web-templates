<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap');
:root {
--font-serif: 'Source Serif 4', serif;
}
body {
font-family: var(--font-serif);
}
@keyframes wordBlur {
0% {
filter: blur(0.5rem);
opacity: 0;
transform: translateY(0.25rem);
}
100% {
filter: blur(0);
opacity: 1;
transform: translateY(0);
}
}
.animate-word {
display: inline-block;
opacity: 0;
animation: wordBlur 0.8s ease forwards;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4 text-white/90 antialiased">

    <!-- Browser Frame -->
    <div class="w-full max-w-4xl aspect-square sm:aspect-video bg-gray-900 rounded-xl overflow-hidden shadow-sm border border-white/5 flex flex-col">
        
        <!-- Browser Header -->
        <div class="h-10 bg-gray-800/40 border-b border-white/5 flex items-center px-4 justify-between">
            <div class="flex gap-2">
                <div class="w-3 h-3 rounded-full bg-white/10"></div>
                <div class="w-3 h-3 rounded-full bg-white/10"></div>
                <div class="w-3 h-3 rounded-full bg-white/10"></div>
            </div>
            <div class="bg-gray-950/50 px-8 py-1 rounded-md text-[0.65rem] text-white/30 tracking-widest uppercase">
                setup.workspace.internal
            </div>
            <div class="w-12"></div>
        </div>

        <!-- 2-2 Square Grid -->
        <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 grid-rows-4 sm:grid-rows-2">
            
            <!-- Cell 1: Brand & Identity -->
            <div class="p-8 border-b border-r border-white/5 flex flex-col justify-between group hover:bg-white/[0.02] transition-colors duration-500">
                <div class="text-lg tracking-tighter font-semibold">
                    <span class="animate-word" style="animation-delay: 0.1s;">A</span><span class="animate-word" style="animation-delay: 0.15s;">S</span>
                </div>
                <div>
                    <h2 class="text-2xl tracking-tight font-light mb-2">
                        <span class="animate-word" style="animation-delay: 0.2s;">Welcome</span>
                        <span class="animate-word" style="animation-delay: 0.3s;">to</span>
                        <span class="animate-word" style="animation-delay: 0.4s;">the</span>
                        <span class="animate-word" style="animation-delay: 0.5s;">Studio.</span>
                    </h2>
                    <p class="text-xs text-white/40 leading-relaxed max-w-xs">
                        Prepare your creative environment with a few essential configurations.
                    </p>
                </div>
            </div>

            <!-- Cell 2: Profile -->
            <div class="p-8 border-b border-white/5 flex flex-col justify-between hover:bg-white/[0.02] transition-colors duration-500">
                <div class="flex justify-end">
                    <div class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center bg-gray-800">
                        <iconify-icon icon="solar:user-linear" style="font-size: 1.25rem; color: white;" stroke-width="1.5"></iconify-icon>
                    </div>
                </div>
                <div>
                    <h3 class="text-lg tracking-tight font-light mb-4">
                        <span class="animate-word" style="animation-delay: 0.6s;">Personalize</span>
                        <span class="animate-word" style="animation-delay: 0.7s;">Identity.</span>
                    </h3>
                    <div class="space-y-3">
                        <input type="text" placeholder="Display name" class="w-full bg-white/5 border border-white/10 rounded px-3 py-2 text-xs focus:outline-none focus:border-white/30 transition-colors placeholder:text-white/20">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-white animate-pulse"></div>
                            <span class="text-[0.65rem] text-white/30 uppercase tracking-widest">Awaiting input</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cell 3: Preferences -->
            <div class="p-8 border-r border-white/5 flex flex-col justify-between hover:bg-white/[0.02] transition-colors duration-500">
                <div>
                    <iconify-icon icon="solar:settings-linear" style="font-size: 1.25rem; color: white;" stroke-width="1.5"></iconify-icon>
                </div>
                <div class="space-y-4">
                    <h3 class="text-lg tracking-tight font-light">
                        <span class="animate-word" style="animation-delay: 0.8s;">Visual</span>
                        <span class="animate-word" style="animation-delay: 0.9s;">Interface.</span>
                    </h3>
                    <div class="flex gap-4">
                        <button class="flex-1 py-4 border border-white/20 rounded-lg flex flex-col items-center gap-2 group/btn hover:bg-white hover:text-black transition-all duration-300">
                            <iconify-icon icon="solar:moon-linear" style="font-size: 1rem;" stroke-width="1.5"></iconify-icon>
                            <span class="text-[0.65rem] uppercase tracking-widest font-medium">Dark</span>
                        </button>
                        <button class="flex-1 py-4 border border-white/5 rounded-lg flex flex-col items-center gap-2 text-white/30 hover:border-white/20 transition-all duration-300">
                            <iconify-icon icon="solar:sun-linear" style="font-size: 1rem;" stroke-width="1.5"></iconify-icon>
                            <span class="text-[0.65rem] uppercase tracking-widest font-medium">Light</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Cell 4: Launch -->
            <div class="p-8 flex flex-col justify-between bg-white/[0.01] hover:bg-white/[0.03] transition-colors duration-500">
                <div class="flex justify-between items-start">
                    <div class="text-[0.65rem] text-white/20 uppercase tracking-[0.2em] leading-tight">
                        Step 04/04<br>Finalize
                    </div>
                    <iconify-icon icon="solar:rocket-linear" style="font-size: 1.25rem; color: white;" stroke-width="1.5"></iconify-icon>
                </div>
                <div class="space-y-6">
                    <p class="text-xs text-white/40 italic">
                        "The details are not the details. They make the design."
                    </p>
                    <button class="w-full bg-white text-gray-950 py-3 rounded-md text-xs font-semibold uppercase tracking-widest hover:bg-gray-200 transition-colors flex items-center justify-center gap-2 group">
                        Enter Workspace
                        <iconify-icon icon="solar:arrow-right-linear" class="group-hover:translate-x-1 transition-transform"></iconify-icon>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Background Decoration -->
    <div class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-20">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-white/5 blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-white/5 blur-[120px]"></div>
    </div>


</body></html>
