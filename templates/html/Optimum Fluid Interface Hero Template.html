<body class="antialiased selection:bg-zinc-100 selection:text-black relative">

    <!-- Background Typography (Centered) -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-0 select-none overflow-hidden">
        <h1 class="text-[16vw] font-bold tracking-tighter text-zinc-100 opacity-100 leading-none">

    <!-- WebGL Canvas Container (Layered above text) -->

    <!-- UI Overlay (Layered above canvas) -->
    <div class="relative z-20 flex flex-col h-screen justify-between pointer-events-none p-6 md:p-8">

        <!-- Controls Panel -->
        <aside class="pointer-events-auto w-full max-w-[300px] self-end md:self-start mt-auto glass-panel rounded-xl p-5 transition-all duration-500 hover:shadow-lg hover:shadow-black/5 border border-white/50">
            
            <div class="flex items-center justify-between mb-6">

                    <iconify-icon icon="lucide:settings-2" width="16" stroke-width="1.5"></iconify-icon>
                    <span class="text-xs font-semibold tracking-tight">Parameters</span>

                <div class="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-zinc-100 border border-zinc-200">

            <div class="space-y-5">
                
                <!-- Smoothness -->
                <div class="group">
                    <div class="flex justify-between mb-2 items-center">
                        <label class="text-[11px] font-medium text-zinc-500 group-hover:text-zinc-800 transition-colors uppercase tracking-wide">Viscosity</label>

                <div class="group">

                <div class="group">

                        <label class="text-[11px] font-medium text-zinc-500 group-hover:text-zinc-800 transition-colors uppercase tracking-wide">Dispersion</label>
                        <span id="val-spread" class="text-[10px] font-mono text-zinc-400 bg-zinc-50 px-1.5 py-0.5 rounded">1.20</span>
                    </div>
                    <input type="range" id="spread" min="0.5" max="2.5" step="0.01" value="1.20">

            <div class="mt-6 pt-4 border-t border-zinc-100 flex gap-2">
                <button id="btn-random" class="flex-1 h-8 rounded-md bg-white hover:bg-zinc-50 border border-zinc-200 shadow-sm text-xs font-medium text-zinc-600 hover:text-zinc-900 transition-all flex items-center justify-center gap-1.5 active:scale-[0.98]">

                    <iconify-icon icon="lucide:arrow-right" width="14" stroke-width="1.5"></iconify-icon>
                    Export

    <!-- Script: Three.js + Custom Shader -->
    <script>
        const canvasContainer = document.getElementById('canvas-container');
        
        // Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        
        // Handle resizing
        function resize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            if(material) {
                material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
                // Adjust aspect ratio correction
                material.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
            }
        }
        window.addEventListener('resize', resize);
        canvasContainer.appendChild(renderer.domElement);

        const geometry = new THREE.PlaneGeometry(2, 2);

        // Inputs
        const ui = {
            smoothness: document.getElementById('smoothness'),
            speed: document.getElementById('speed'),
            spread: document.getElementById('spread')
        };

        const labels = {
            smoothness: document.getElementById('val-smooth'),
            speed: document.getElementById('val-speed'),
            spread: document.getElementById('val-spread')
        };

        // Shader Logic
        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                uAspect: { value: window.innerWidth / window.innerHeight },
                uSmoothness: { value: parseFloat(ui.smoothness.value) },
                uSpeed: { value: parseFloat(ui.speed.value) },
                uSpread: { value: parseFloat(ui.spread.value) },
                uMouse: { value: new THREE.Vector2(999, 999) }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float uTime;
                uniform vec2 uResolution;
                uniform float uAspect;
                uniform float uSmoothness;
                uniform float uSpeed;
                uniform float uSpread;
                uniform vec2 uMouse;

                varying vec2 vUv;

                // Smooth minimum function for blending balls
                float smin(float a, float b, float k) {
                    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
                    return mix(b, a, h) - k * h * (1.0 - h);
                }

                // SDF for a sphere
                float sdSphere(vec3 p, float r) {
                    return length(p) - r;
                }

                // Generate the fluid field
                float map(vec3 p) {
                    float d = 10.0;
                    float k = uSmoothness; 
                    float t = uTime * uSpeed;
                    
                    // Sphere 1 
                    vec3 p1 = p - vec3(sin(t * 0.8) * 0.5 * uSpread, cos(t * 0.5) * 0.3 * uSpread, 0.0);
                    float d1 = sdSphere(p1, 0.5);
                    d = d1;

                    // Sphere 2
                    vec3 p2 = p - vec3(cos(t * 0.7 + 1.0) * 0.8 * uSpread, sin(t * 0.6) * 0.6 * uSpread, sin(t) * 0.5);
                    float d2 = sdSphere(p2, 0.4);
                    d = smin(d, d2, k);

                    // Sphere 3
                    vec3 p3 = p - vec3(sin(t * 1.1 - 2.0) * 0.7 * uSpread, cos(t * 0.9 + 1.0) * 0.7 * uSpread, cos(t)*0.2);
                    float d3 = sdSphere(p3, 0.45);
                    d = smin(d, d3, k);

                    // Sphere 4
                    vec3 p4 = p - vec3(cos(t * 0.3) * 1.2 * uSpread, sin(t * 0.4 + 2.0) * 0.5 * uSpread, 0.2);
                    float d4 = sdSphere(p4, 0.35);
                    d = smin(d, d4, k);

                    // Sphere 5
                    vec3 p5 = p - vec3(sin(t * 1.3 + 4.0) * 0.6 * uSpread, cos(t * 1.2 + 3.0) * 0.9 * uSpread, -0.3);
                    float d5 = sdSphere(p5, 0.3);
                    d = smin(d, d5, k);

                    // Mouse Interaction
                    if(uMouse.x < 100.0) {
                        vec3 pMouse = p - vec3(uMouse.x, uMouse.y, 0.0);
                        float dMouse = sdSphere(pMouse, 0.5); 
                        d = smin(d, dMouse, k);
                    }

                    return d;
                }

                // Calculate Normal
                vec3 calcNormal(vec3 p) {
                    const float h = 0.0001;
                    const vec2 k = vec2(1, -1);
                    return normalize(
                        k.xyy * map(p + k.xyy * h) +
                        k.yyx * map(p + k.yyx * h) +
                        k.yxy * map(p + k.yxy * h) +
                        k.xxx * map(p + k.xxx * h)
                    );
                }

                // Cosine based palette for reflection
                vec3 palette( in float t, in vec3 a, in vec3 b, in vec3 c, in vec3 d ) {
                    return a + b*cos( 6.28318*(c*t+d) );
                }

                void main() {
                    vec2 uv = (vUv - 0.5) * 2.0;
                    uv.x *= uAspect;

                    vec3 ro = vec3(0.0, 0.0, 4.0);
                    vec3 rd = normalize(vec3(uv, -2.0));

                    float t = 0.0;
                    float tMax = 20.0;
                    int maxSteps = 64; 
                    float d = 0.0;
                    
                    vec3 p;
                    bool hit = false;

                    for(int i = 0; i < maxSteps; i++) {
                        p = ro + rd * t;
                        d = map(p);
                        if(d < 0.001) {
                            hit = true;
                            break;
                        }
                        t += d;
                        if(t > tMax) break;
                    }

                    if(hit) {
                        vec3 normal = calcNormal(p);
                        vec3 viewDir = normalize(ro - p);
                        
                        // Lighting Setup
                        vec3 lightPos = vec3(2.0, 4.0, 5.0);
                        vec3 lightDir = normalize(lightPos - p);
                        
                        // Diffuse
                        float diff = max(dot(normal, lightDir), 0.0);
                        
                        // Specular (Gloss)
                        vec3 reflectDir = reflect(-lightDir, normal);
                        float spec = pow(max(dot(viewDir, reflectDir), 0.0), 64.0);

                        // Rim / Fresnel (The Edge Glow)
                        float rim = 1.0 - max(dot(viewDir, normal), 0.0);
                        rim = pow(rim, 3.0);

                        // Monochromatic "Liquid Silver" Palette
                        vec3 colA = vec3(0.5, 0.5, 0.5);
                        vec3 colB = vec3(0.5, 0.5, 0.5);
                        vec3 colC = vec3(1.0, 1.0, 1.0);
                        vec3 colD = vec3(0.0, 0.10, 0.20); // Very subtle cool tint
                        
                        // Map normal Y and X to palette to create shift
                        float reflectionAngle = dot(normal, vec3(0.5, 0.5, 0.5)) * 0.5 + 0.5;
                        vec3 reflection = palette(reflectionAngle + uTime * 0.05, colA, colB, colC, colD);
                        
                        // Tint colors to match the grey text (Cool Grey)
                        vec3 reflectionTint = mix(vec3(0.9, 0.9, 0.95), vec3(0.85, 0.9, 0.95), normal.y * 0.5 + 0.5);

                        // Final Color Composition
                        vec3 baseColor = vec3(0.95, 0.95, 0.95); // White base
                        
                        vec3 color = baseColor * (diff * 0.5 + 0.5); // Ambient + Diffuse
                        
                        // Add the environment colors to the rim and shadow areas
                        color += reflection * rim * 0.6; 
                        
                        // Add sharp white specular highlight
                        color += vec3(1.0) * spec * 0.7;
                        
                        // Add subtle color bleed based on normal
                        color = mix(color, reflectionTint, 0.2);

                        gl_FragColor = vec4(color, 1.0);
                    } else {
                        // Fully transparent background
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 0.0);
                    }
                }
            `,
            transparent: true
        });

        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // Initial Resize
        resize();

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            material.uniforms.uTime.value = clock.getElapsedTime();
            renderer.render(scene, camera);
        }
        animate();

        // Mouse Interaction Logic
        window.addEventListener('mousemove', (e) => {
            const ndcX = (e.clientX / window.innerWidth) * 2 - 1;
            const ndcY = -(e.clientY / window.innerHeight) * 2 + 1;
            const aspect = window.innerWidth / window.innerHeight;
            const worldX = ndcX * aspect * 2.0;
            const worldY = ndcY * 2.0;

            material.uniforms.uMouse.value.set(worldX, worldY);
        });

        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                const touch = e.touches[0];
                const ndcX = (touch.clientX / window.innerWidth) * 2 - 1;
                const ndcY = -(touch.clientY / window.innerHeight) * 2 + 1;
                const aspect = window.innerWidth / window.innerHeight;
                const worldX = ndcX * aspect * 2.0;
                const worldY = ndcY * 2.0;
                material.uniforms.uMouse.value.set(worldX, worldY);
            }
        }, {passive: true});

        // Interaction Listeners
        const inputKeys = ['smoothness', 'speed', 'spread'];
        
        inputKeys.forEach(key => {
            ui[key].addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                labels[key].innerText = val.toFixed(2);
                const uniformKey = 'u' + key.charAt(0).toUpperCase() + key.slice(1);
                if(material.uniforms[uniformKey]) {
                    material.uniforms[uniformKey].value = val;
                }
            });
        });

        // Randomize
        document.getElementById('btn-random').addEventListener('click', () => {
            const rSmooth = (Math.random() * 1.5 + 0.3).toFixed(2);
            const rSpeed = (Math.random() * 1.5 + 0.2).toFixed(2);
            const rSpread = (Math.random() * 1.0 + 0.8).toFixed(2);

            ui.smoothness.value = rSmooth;
            ui.speed.value = rSpeed;
            ui.spread.value = rSpread;

            ui.smoothness.dispatchEvent(new Event('input'));
            ui.speed.dispatchEvent(new Event('input'));
            ui.spread.dispatchEvent(new Event('input'));
        });

    </script>
