  <meta charset="UTF-8">

  <title>Global Network Visualization</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.dots.min.js"></script>

<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-gray-900 rounded-2xl overflow-hidden shadow-md border border-gray-800">
    <div class="relative h-64" id="vanta-canvas">
      <div class="absolute top-3 left-4 z-10">
        <h2 class="text-2xl font-bold text-white">Global Network</h2>
        <p class="text-gray-400 text-sm">Interactive 3D visualization</p>
      </div>
      <div class="absolute bottom-3 right-4 bg-gray-900/70 backdrop-blur-sm rounded-lg p-2 z-10 shadow-sm">
        <div class="flex space-x-3 text-xs text-gray-300">
          <div class="flex items-center">
            <span class="w-2.5 h-2.5 rounded-full bg-purple-500 mr-1.5"></span>
            <span>Main Hub</span>
          </div>
          <div class="flex items-center">
            <span class="w-2.5 h-2.5 rounded-full bg-teal-500 mr-1.5"></span>
            <span>Regional Office</span>
          </div>
        </div>
      </div>
    </div>
    <div class="p-5 bg-gray-900/80">
      <div class="flex justify-between text-gray-300 text-sm">
        <div>
          <p class="font-medium">San Francisco</p>
          <p class="text-xs text-gray-500">Headquarters</p>
        </div>
        <div>
          <p class="font-medium">New York</p>
          <p class="text-xs text-gray-500">East Coast Office</p>
        </div>
      </div>
      <div class="mt-4 pt-4 border-t border-gray-800">
        <p class="text-gray-400 text-sm">Our global presence spans key strategic locations, enabling us to serve clients worldwide with localized expertise and 24/7 support capabilities.</p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      VANTA.DOTS({
        el: "#vanta-canvas",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 256,
        minWidth: 200,
        scale: 1.00,
        scaleMobile: 1.00,
        color: 0x8a5cf7,
        color2: 0x14b8a6,
        backgroundColor: 0x111827,
        size: 2.80,
        spacing: 22.00,
        showLines: true,
        points: 12,
        maxDistance: 20.00,
        backgroundColor: 0x111827
      });
    });
  </script>
