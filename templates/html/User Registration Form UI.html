    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #0a0c12;
            --bg-component: #181c27;
            --bg-input: rgba(30, 35, 50, 0.6);
            --bg-button-primary: #00f0c0;
            --bg-button-primary-hover: #00ffde;
            
            --text-primary: #e0e7ff;
            --text-secondary: #a0aed0;
            --text-muted: #707a95;
            --text-heading: #ffffff;
            
            --border-color: #3a3f5e;
            --border-input: #3a3f5e;
            --border-radius-base: 6px;
            --border-radius-lg: 8px;
            
            --shadow-color-rgb: 0, 240, 192;
            --shadow-md: 0 0 18px rgba(var(--shadow-color-rgb), 0.4);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fira Code', monospace;
        }
        
        body {
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        
        .login-form-wrapper {
            background-color: var(--bg-component);
            padding: 30px 40px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
            transition: all 0.25s;
        }
        
        .login-form-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-heading);
            text-align: center;
            margin-bottom: 25px;
        }
        
        .social-login-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .c-btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            border-radius: var(--border-radius-base);
            transition: all 0.15s;
            border: 1px solid var(--border-input);
            background-color: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
        }
        
        .c-btn-social:hover {
            background-color: rgba(50, 55, 70, 0.7);
            transform: translateY(-1px);
        }
        
        .social-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        .c-btn-google {
            background-color: #333;
            color: #fff;
            border-color: #555;
        }
        
        .c-btn-google:hover {
            background-color: #444;
        }
        
        .form-divider {
            text-align: center;
            margin: 25px 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }
        
        .form-divider::before,
        .form-divider::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background-color: var(--border-color);
            margin: 0 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border: 1px solid var(--border-input);
            border-radius: var(--border-radius-base);
            background-color: var(--bg-input);
            color: var(--text-primary);
            transition: all 0.15s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--bg-button-primary);
            box-shadow: 0 0 0 2px rgba(0, 240, 192, 0.5), 0 0 15px rgba(0, 240, 192, 0.5);
        }
        
        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 1;
        }
        
        .c-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            border-radius: var(--border-radius-base);
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }
        
        .c-btn-primary {
            background: var(--bg-button-primary);
            color: var(--bg-page);
            border-color: var(--bg-button-primary);
            box-shadow: 0 0 10px rgba(var(--shadow-color-rgb), 0.4), 0 0 20px rgba(var(--shadow-color-rgb), 0.2);
        }
        
        .c-btn-primary:hover {
            background: var(--bg-button-primary-hover);
            box-shadow: 0 0 18px rgba(var(--shadow-color-rgb), 0.6), 0 0 35px rgba(var(--shadow-color-rgb), 0.3);
            transform: translateY(-2px) scale(1.03);
        }
        
        @media (max-width: 480px) {
            .login-form-wrapper {
                padding: 20px;
            }
            
            .form-control, 
            .c-btn {
                font-size: 0.95rem;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="login-form-wrapper">
        <h3 class="login-form-title">Join Instantly</h3>
        <div class="social-login-buttons">
            <button class="c-btn-social c-btn-google">
                <svg class="social-icon" viewBox="0 0 48 48">

                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>

                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
                </svg>
                Sign in with Google
            </button>
            <button class="c-btn-social">
                <svg class="social-icon" viewBox="0 0 24 24" fill="#1877F2">
                    <path d="M22.675 0h-21.35C.593 0 0 .593 0 1.325v21.351C0 23.407.593 24 1.325 24H12.82v-9.294H9.692v-3.622h3.128V8.413c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12V24h6.116c.732 0 1.325-.593 1.325-1.325V1.325C24 .593 23.407 0 22.675 0z"></path>
                </svg>
                Sign in with Facebook
            </button>
        </div>
        <div class="form-divider">OR USE EMAIL</div>
        <form action="#" method="POST" onsubmit="return false;">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <button type="submit" class="c-btn c-btn-primary">Continue</button>
        </form>
    </div>
</body>
