@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
body {
font-family: 'Inter', sans-serif;

radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 25%),

}
.font-mono {
font-family: 'JetBrains Mono', monospace;
}
/* -----------------------
Creative Effects
----------------------- */
/* Holographic Foil Mesh */
.holo-mesh {
background:
radial-gradient(at 0% 0%, rgba(255, 255, 255, 0.8) 0px, transparent 50%),
radial-gradient(at 100% 0%, rgba(255, 200, 255, 0.5) 0px, transparent 50%),
radial-gradient(at 100% 100%, rgba(180, 255, 255, 0.5) 0px, transparent 50%),
radial-gradient(at 0% 100%, rgba(240, 240, 255, 0.5) 0px, transparent 50%);
filter: blur(20px);
opacity: 0.4;
mix-blend-mode: overlay;
}
/* Iridescent Shine Animation */
.iridescent-text {
background: linear-gradient(
90deg,
#ffffff 0%,
#a5a5a5 20%,
#ffffff 30%,
#9ca3af 60%,
#ffffff 80%,
#a5a5a5 100%
);
background-size: 200% auto;
color: transparent;
-webkit-background-clip: text;
background-clip: text;
animation: shine 6s linear infinite;
}
@keyframes shine {
to { background-position: 200% center; }
}
/* Micro-texture Noise */
.noise-texture {
background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
}
/* Security Strip Pattern */
.security-strip {
background: repeating-linear-gradient(
45deg,
rgba(0,0,0,0.03),
rgba(0,0,0,0.03) 2px,
transparent 2px,
transparent 4px
);
}
/* Card 3D Tilt Wrapper */
.card-perspective {
perspective: 1000px;
}
.card-inner {
transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
transform-style: preserve-3d;
}
.card-perspective:hover .card-inner {
transform: rotateY(5deg) rotateX(5deg) scale(1.02);
}
/* Scanning Line Animation */
.scan-line {
position: absolute;
width: 100%;
height: 2px;
background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
top: 0;
left: 0;
animation: scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
opacity: 0.5;
}
@keyframes scan {
0% { top: 10%; opacity: 0; }
10% { opacity: 0.8; }
90% { opacity: 0.8; }
100% { top: 90%; opacity: 0; }
}
/* Chip Gold Gradient */
.chip-gradient {
background: linear-gradient(135deg, #e2cba9 0%, #fdfcfb 25%, #d4af78 50%, #fdfcfb 75%, #e2cba9 100%);
}
/* Vertical Text Mode */
.writing-vertical {
writing-mode: vertical-rl;
text-orientation: mixed;
transform: rotate(180deg);
}
</style></head>
