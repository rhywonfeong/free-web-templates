body {

/* Custom Scrollbar */

}
::-webkit-scrollbar-thumb {
background: #27272a;

}
/* Custom Range Slider */
input[type=range] {
-webkit-appearance: none;
background: transparent;
}
input[type=range]::-webkit-slider-thumb {
-webkit-appearance: none;
height: 14px;
width: 14px;
border-radius: 50%;
background: #ffffff;
cursor: pointer;
margin-top: -6px;
box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
}
input[type=range]::-webkit-slider-runnable-track {

cursor: pointer;

}
/* Animations */
@keyframes subtle-fade {

100% { opacity: 1; transform: translateY(0); }

.loader-line {

.loader-line::after {

position: absolute;
top: 0;
left: 0;
height: 100%;
width: 50%;
background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
transform: translateX(-100%);
animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
100% { transform: translateX(200%); }
}
/* Hide Number Input Arrows */

<body class="min-h-screen flex flex-col items-center justify-center selection:bg-white/20">

    <!-- Main Container -->
    <main class="relative z-10 w-full max-w-2xl px-6 py-12 flex flex-col gap-10">

        <!-- Header -->

            </div>
        </header>

        <!-- Search Input Area -->
        <div class="w-full animate-enter" style="animation-delay: 100ms;">
            <div class="group relative flex items-center w-full">

                    <iconify-icon icon="solar:link-circle-linear" width="20"></iconify-icon>

                <input type="text" id="urlInput" placeholder="Paste YouTube link here..."

            </div>
            
            <!-- Quick Settings Toggles (Custom UI) -->
            <div class="flex items-center justify-center gap-6 mt-6">
                <label class="flex items-center gap-2 cursor-pointer group">
                    <div class="relative w-8 h-4 rounded-full bg-zinc-800 border border-white/5 transition-colors group-hover:border-white/10">
                        <input type="checkbox" class="peer sr-only" checked>
                        <div class="absolute left-0.5 top-0.5 w-3 h-3 bg-zinc-500 rounded-full transition-all peer-checked:bg-white peer-checked:translate-x-4"></div>
                    </div>
                    <span class="text-xs text-zinc-500 group-hover:text-zinc-400 transition-colors">WASM Engine</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer group">
                    <div class="relative w-8 h-4 rounded-full bg-zinc-800 border border-white/5 transition-colors group-hover:border-white/10">
                        <input type="checkbox" class="peer sr-only">
                        <div class="absolute left-0.5 top-0.5 w-3 h-3 bg-zinc-500 rounded-full transition-all peer-checked:bg-white peer-checked:translate-x-4"></div>
                    </div>
                    <span class="text-xs text-zinc-500 group-hover:text-zinc-400 transition-colors">Metadata Only</span>
                </label>
            </div>
        </div>

        <!-- Processing State (Hidden by default) -->
        <div id="processingState" class="hidden w-full bg-zinc-900/30 border border-white/5 rounded-2xl p-6 backdrop-blur-sm animate-enter">
            
            <!-- Header of Card -->
            <div class="flex items-start justify-between mb-6">
                <div class="flex gap-4">
                    <!-- Thumbnail Skeleton/Image -->
                    <div id="thumbContainer" class="w-32 h-20 bg-zinc-800 rounded-lg overflow-hidden border border-white/5 relative">
                        <img id="videoThumb" src="" class="w-full h-full object-cover hidden opacity-80">
                        <div id="skeleton" class="w-full h-full flex items-center justify-center text-zinc-600">
                            <iconify-icon icon="solar:videocamera-linear" width="24"></iconify-icon>
                        </div>
                    </div>
                    <div class="flex flex-col justify-center">
                        <h3 id="videoTitle" class="text-sm font-medium text-zinc-200 line-clamp-1 tracking-tight">Analyzing source...</h3>
                        <p id="videoChannel" class="text-xs text-zinc-500 mt-1">Please wait</p>
                        <div class="flex items-center gap-2 mt-2">
                             <span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-zinc-800 text-zinc-400 border border-white/5">HD</span>
                             <span class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-zinc-800 text-zinc-400 border border-white/5">CC</span>
                        </div>
                    </div>
                </div>
                <button class="text-zinc-500 hover:text-white transition-colors">
                    <iconify-icon icon="solar:close-circle-linear" width="20"></iconify-icon>

            </div>

            <hr class="border-t border-white/5 mb-6">

            <!-- Controls -->
            <div id="controlsArea" class="opacity-50 pointer-events-none transition-opacity duration-500">
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <!-- Format Select -->
                    <div class="relative group">
                        <label class="block text-[10px] uppercase tracking-wider text-zinc-500 mb-2 font-semibold">Format</label>
                        <div class="relative flex items-center">
                            <select class="w-full h-10 bg-zinc-950 border border-white/10 rounded-lg px-3 text-xs text-zinc-300 appearance-none focus:outline-none focus:border-zinc-600 transition-colors cursor-pointer">
                                <option>MP4 (Video)</option>
                                <option>MP3 (Audio)</option>

                            </select>
                            <iconify-icon icon="solar:alt-arrow-down-linear" class="absolute right-3 text-zinc-500 pointer-events-none" width="14"></iconify-icon>
                        </div>
                    </div>
                    
                    <!-- Quality Select -->
                    <div class="relative group">
                        <label class="block text-[10px] uppercase tracking-wider text-zinc-500 mb-2 font-semibold">Quality</label>
                        <div class="relative flex items-center">
                            <select class="w-full h-10 bg-zinc-950 border border-white/10 rounded-lg px-3 text-xs text-zinc-300 appearance-none focus:outline-none focus:border-zinc-600 transition-colors cursor-pointer">
                                <option>1080p (High)</option>
                                <option>720p (Medium)</option>

                </div>

                <!-- Action Button -->
                <button id="downloadActionBtn" class="w-full h-11 bg-white text-black text-xs font-semibold tracking-tight rounded-lg hover:bg-zinc-200 transition-all active:scale-[0.99] flex items-center justify-center gap-2">

            <!-- Progress Bar (Initially Hidden) -->
            <div id="progressArea" class="hidden mt-6">

                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full h-1 bg-zinc-800 rounded-full overflow-hidden">
                    <div id="progressBar" class="h-full bg-white w-0 transition-all duration-300 ease-out shadow-[0_0_10px_rgba(255,255,255,0.3)]"></div>

            </div>

        </div>

        <!-- History / Footer -->
        <div class="w-full border-t border-white/5 pt-8 flex flex-col gap-4 animate-enter" style="animation-delay: 200ms;">
            <div class="flex items-center justify-between text-zinc-500">
                <span class="text-xs font-medium tracking-tight">Recent Activity</span>
                <button class="text-[10px] hover:text-zinc-300 transition-colors">Clear</button>

            <div class="flex flex-col gap-2">

                <div class="group flex items-center justify-between p-3 rounded-lg hover:bg-white/[0.02] border border-transparent hover:border-white/5 transition-all cursor-default">

                        <div class="flex items-center justify-center w-8 h-8 rounded-full bg-zinc-900 border border-white/5 text-zinc-600">
                            <iconify-icon icon="solar:file-check-linear" width="14"></iconify-icon>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xs text-zinc-300">Design System Tutorial.mp4</span>
                            <span class="text-[10px] text-zinc-600">24MB • Local Blob</span>
                        </div>
                    </div>
                    <button class="opacity-0 group-hover:opacity-100 p-1.5 text-zinc-500 hover:text-white transition-all">
                        <iconify-icon icon="solar:menu-dots-linear" width="16"></iconify-icon>
                    </button>
                </div>
            </div>
        </div>
        
    </main>

    <script>
        const urlInput = document.getElementById('urlInput');
        const processBtn = document.getElementById('processBtn');
        const processingState = document.getElementById('processingState');
        const controlsArea = document.getElementById('controlsArea');
        const videoTitle = document.getElementById('videoTitle');
        const videoChannel = document.getElementById('videoChannel');
        const downloadActionBtn = document.getElementById('downloadActionBtn');
        const progressArea = document.getElementById('progressArea');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressText = document.getElementById('progressText');
        const thumbContainer = document.getElementById('thumbContainer');
        const videoThumb = document.getElementById('videoThumb');
        const skeleton = document.getElementById('skeleton');

        // Mock Data for simulation
        const mockVideoData = {
            title: "Building Advanced Interfaces with Tailwind CSS",
            channel: "Frontend Mastery",
            img: "https://images.unsplash.com/photo-1633356122544-f134324a6cee?q=80&w=1000&auto=format&fit=crop"
        };

        processBtn.addEventListener('click', () => {
            if(!urlInput.value) {
                urlInput.focus();
                return;
            }

            // Reset UI
            processingState.classList.remove('hidden');
            controlsArea.classList.add('opacity-50', 'pointer-events-none');
            progressArea.classList.add('hidden');
            videoThumb.classList.add('hidden');
            skeleton.classList.remove('hidden');
            videoTitle.innerText = "Resolving stream...";
            videoChannel.innerText = "Handshaking";

            // Simulate Network Request
            setTimeout(() => {
                videoTitle.innerText = mockVideoData.title;
                videoChannel.innerText = mockVideoData.channel;
                
                // Show Thumbnail
                skeleton.classList.add('hidden');
                videoThumb.src = mockVideoData.img;
                videoThumb.classList.remove('hidden');
                
                // Enable Controls
                controlsArea.classList.remove('opacity-50', 'pointer-events-none');
            }, 1500);
        });

        downloadActionBtn.addEventListener('click', () => {
            controlsArea.classList.add('opacity-50', 'pointer-events-none');
            progressArea.classList.remove('hidden');
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 5;
                if(progress > 100) progress = 100;
                
                progressBar.style.width = `${progress}%`;
                progressPercent.innerText = `${Math.floor(progress)}%`;

                if(progress < 30) progressText.innerText = "Demuxing stream...";
                else if(progress < 70) progressText.innerText = "Transcoding audio...";
                else if(progress < 99) progressText.innerText = "Assembling container...";
                else progressText.innerText = "Finalizing blob...";

                if(progress === 100) {
                    clearInterval(interval);
                    progressText.innerText = "Complete";
                    setTimeout(() => {
                        alert("Download Simulation Complete! (In a real app, file would save now)");
                        // Reset for demo
                        processingState.classList.add('hidden');
                        urlInput.value = '';
                    }, 500);
                }
            }, 100);
        });

        // Allow Enter key to trigger
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                processBtn.click();
            }
        });
    </script>
</body>
