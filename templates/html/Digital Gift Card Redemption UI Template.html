            <svg class="spinner text-zinc-500 w-10 h-10 mb-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                <circle class="opacity-75" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="80" stroke-dashoffset="60"></circle>
            </svg>
        </div>

    </div>

    <!-- Error View -->
    <div id="error-view" class="fixed inset-0 z-50 bg-zinc-950 flex flex-col items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm text-center">
            <div class="mx-auto w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center mb-6 text-red-500">
                <iconify-icon icon="solar:danger-circle-linear" width="36" stroke-width="1.5"></iconify-icon>
            </div>
            
            <h2 class="text-xl font-medium text-white mb-3">Unable to Redeem</h2>
            <p class="text-zinc-400 text-base leading-relaxed mb-10 px-4">
                This card cannot be used at this moment. <br class="hidden md:block">Please try another card.
            </p>
            
            <button id="retry-btn" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-medium text-base py-4 rounded-xl transition-colors">
                Try Another Card
            </button>
        </div>
    </div>

    <script>
        // Elements
        const codeInput = document.getElementById('code-input');
        const enterBtn = document.getElementById('enter-btn');
        const cameraBtn = document.getElementById('camera-btn');
        const overlay = document.getElementById('action-sheet-overlay');
        const sheet = document.getElementById('action-sheet');
        const cancelSheet = document.getElementById('cancel-sheet');
        const galleryOpt = document.getElementById('gallery-opt');
        const photoOpt = document.getElementById('photo-opt');
        const fileInput = document.getElementById('file-input');
        const loadingView = document.getElementById('loading-view');
        const errorView = document.getElementById('error-view');
        const retryBtn = document.getElementById('retry-btn');
        const mainView = document.getElementById('main-view');

        let typingTimer;
        const doneTypingInterval = 600; // ms

        // --- Logic: Input & Enter Button ---
        codeInput.addEventListener('input', () => {
            // Hide button while typing
            enterBtn.classList.add('hidden');
            enterBtn.classList.remove('fade-enter-active');
            
            clearTimeout(typingTimer);
            
            if (codeInput.value.length > 0) {
                typingTimer = setTimeout(() => {
                    // Show button when typing stops
                    enterBtn.classList.remove('hidden');
                    // Small delay for CSS transition to grab
                    requestAnimationFrame(() => {
                        enterBtn.classList.add('fade-enter-active');
                    });
                }, doneTypingInterval);
            }
        });

        enterBtn.addEventListener('click', () => {
            triggerLoading();
        });

        // --- Logic: Camera Action Sheet ---
        cameraBtn.addEventListener('click', () => {
            overlay.classList.remove('hidden');
            // Force reflow
            void overlay.offsetWidth; 
            overlay.classList.remove('opacity-0');
            
            // Slide up sheet
            sheet.classList.remove('translate-y-full');
            sheet.classList.add('translate-y-0');
        });

        const closeSheet = () => {
            sheet.classList.remove('translate-y-0');
            sheet.classList.add('translate-y-full');
            overlay.classList.add('opacity-0');
            
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        };

        cancelSheet.addEventListener('click', closeSheet);
        overlay.addEventListener('click', (e) => {
            if(e.target === overlay) closeSheet();
        });

        // --- Logic: Gallery & Photo Actions ---
        galleryOpt.addEventListener('click', () => {
            closeSheet();
            fileInput.click();
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                triggerLoading();
            }
        });

        photoOpt.addEventListener('click', () => {
            closeSheet();
            triggerLoading();
        });

        // --- Logic: Loading & Error ---
        function triggerLoading() {
            // Check if mobile or desktop to size the loading overlay correctly
            // For this design, loading covers the full screen or the card? 
            // Apple Pay usually covers the card content. 
            // I'll make it cover the body or main view.
            
            loadingView.classList.remove('hidden');
            
            // Simulate network request
            setTimeout(() => {
                loadingView.classList.add('hidden');
                showError();
            }, 2000);
        }

        function showError() {
            errorView.classList.remove('hidden');
            // Subtle entrance animation
            errorView.firstElementChild.classList.add('fade-enter');
            requestAnimationFrame(() => {
                errorView.firstElementChild.classList.add('fade-enter-active');
                errorView.firstElementChild.classList.remove('fade-enter');
            });
        }

        retryBtn.addEventListener('click', () => {
            // Reset everything
            errorView.classList.add('hidden');
            codeInput.value = '';
            enterBtn.classList.add('hidden');
            fileInput.value = ''; // clear file input
        });

    </script>
