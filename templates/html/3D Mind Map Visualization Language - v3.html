  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Cube Visualization</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .scene {
      perspective: 1000px;
    }
    .cube {
      position: relative;
      width: 200px;
      transform-style: preserve-3d;
      animation: rotate 10s infinite linear;
    }
    .cube-face {
      position: absolute;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.8);
      border: 2px solid #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .front { transform: translateZ(100px); }
    .back { transform: rotateY(180deg) translateZ(100px); }
    .right { transform: rotateY(90deg) translateZ(100px); }
    .left { transform: rotateY(-90deg) translateZ(100px); }
    .top { transform: rotateX(90deg) translateZ(100px); }
    .bottom { transform: rotateX(-90deg) translateZ(100px); }
    @keyframes rotate {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to { transform: rotateX(360deg) rotateY(360deg); }
    }
  </style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen p-5 hue-rotate-0">
  <div class="scene w-64 h-64 relative">
    <div class="cube">
      <div class="cube-face front bg-blue-500">Front</div>
      <div class="cube-face back bg-red-500">Back</div>
      <div class="cube-face right bg-green-500">Right</div>
      <div class="cube-face left bg-yellow-500">Left</div>
      <div class="cube-face top bg-purple-500">Top</div>
      <div class="cube-face bottom bg-pink-500">Bottom</div>
    </div>
  </div>
</body>
