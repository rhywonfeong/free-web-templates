<style>
/* As animações essenciais (keyframes) precisam de se manter na tag style */
@keyframes pongLoader {
25% { background-position: 0 0, 100% 100%, 100% calc(100% - 5px); }
50% { background-position: 0 100%, 100% 100%, 0 calc(100% - 5px); }
75% { background-position: 0 100%, 100% 0, 100% 5px; }
}
@keyframes slideUpCenter {
from { transform: translate(-50%, 20px); opacity: 0; }
to { transform: translate(-50%, 0); opacity: 1; }
}

<body class="m-0 p-0 w-full h-[100dvh] overflow-hidden bg-black fixed inset-0 text-neutral-900 antialiased" style="font-family: 'Inter', sans-serif;">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 z-[9999] flex items-center justify-center bg-white transition-opacity duration-700 ease-out">
        <div style="width: 80px; height: 70px; border: 5px solid #000; padding: 0 8px; box-sizing: border-box; background: linear-gradient(#fff 0 0) 0 0/8px 20px, linear-gradient(#fff 0 0) 100% 0/8px 20px, radial-gradient(farthest-side,#fff 90%,#0000) 0 5px/8px 8px content-box, #000; background-repeat: no-repeat; animation: pongLoader 2s infinite linear;"></div>
    </div>

    <!-- Iframe -->
    <iframe
        id="game-frame"
        class="w-full h-[100dvh] border-none block absolute top-0 left-0 z-0"
        src="https://jojoisgamesite.lovable.app/"
        allow="fullscreen; autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
    ></iframe>

    <!-- Cookie Banner -->
    <div id="cookie-banner" class="hidden fixed bottom-5 left-1/2 z-[99999] bg-white border border-neutral-200/80 rounded-2xl p-4 flex items-center gap-5 w-[calc(100%-32px)] max-w-[420px] shadow-[0_12px_40px_-12px_rgba(0,0,0,0.15)]" style="animation: slideUpCenter 0.5s cubic-bezier(0.16,1,0.3,1) both;">
        <div class="flex-1 text-neutral-500 text-xs leading-relaxed">
            <strong class="text-neutral-900 block mb-0.5 text-sm font-semibold tracking-tight">🍪 Cookies</strong>
            Usamos cookies para melhorar a tua experiência.
        </div>
        <button id="cookie-accept" class="bg-neutral-900 text-white border-none rounded-lg px-4 py-2.5 font-semibold text-xs cursor-pointer hover:bg-neutral-800 transition-colors duration-200 outline-none focus:ring-2 focus:ring-neutral-400 focus:ring-offset-2">
            Aceitar
        </button>
    </div>

    <script>
        const overlay = document.getElementById('loading-overlay');
        const banner  = document.getElementById('cookie-banner');
        const iframe  = document.getElementById('game-frame');

        function syncSize() {
            const h = window.innerHeight;
            document.documentElement.style.height = h + "px";
            document.body.style.height = h + "px";
            iframe.style.height = h + "px";
        }

        window.addEventListener('resize', syncSize);
        window.addEventListener('orientationchange', syncSize);
        syncSize();

        function maybeShowCookies() {
            if (localStorage.getItem('cookies_accepted') !== 'true') {
                banner.classList.remove('hidden');
            }
        }

        document.getElementById('cookie-accept').addEventListener('click', () => {
            localStorage.setItem('cookies_accepted', 'true');
            banner.classList.add('hidden');
        });

        iframe.addEventListener('load', () => {
            syncSize();
            overlay.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => { overlay.style.display = 'none'; }, 700);
            maybeShowCookies();
        });

        setTimeout(() => {
            if (!overlay.classList.contains('opacity-0')) {
                overlay.classList.add('opacity-0', 'pointer-events-none');
                maybeShowCookies();
            }
        }, 8000);
    </script>
</body>
