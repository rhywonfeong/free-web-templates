<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Profile</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #0A0A0A; /* Deep dark background */
}
/* Custom scrollbar for subtle look */
::-webkit-scrollbar {
width: 6px;
}
::-webkit-scrollbar-track {
background: transparent;
}
::-webkit-scrollbar-thumb {
background: #262626;
border-radius: 3px;
}
/* Custom Toggle Checkbox */
.toggle-checkbox:checked {
right: 0;
border-color: #fff;
}
.toggle-checkbox:checked + .toggle-label {
background-color: #fff;
}
.toggle-checkbox:checked + .toggle-label:before {
transform: translateX(100%);
}
/* Smooth fade in */
.fade-in {
animation: fadeIn 0.6s ease-out forwards;
opacity: 0;
transform: translateY(10px);
}
@keyframes fadeIn {
to {
opacity: 1;
transform: translateY(0);
}
}
</style></head>
<body class="text-neutral-400 antialiased min-h-screen flex items-center justify-center p-4 sm:p-6 selection:bg-neutral-700 selection:text-white">

    <!-- Main Container -->
    <div class="w-full max-w-3xl mx-auto fade-in">
        
        <!-- Navbar / Logo Area -->
        <div class="mb-10 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 bg-white rounded-full flex items-center justify-center">
                    <div class="w-2 h-2 bg-black rounded-full"></div>
                </div>
                <span class="text-white font-medium tracking-tight text-sm">PROFILE.OS</span>
            </div>
            <div class="text-xs font-medium text-neutral-500">STEP 1 OF 3</div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            
            <!-- Sidebar / Info -->
            <div class="lg:col-span-4 space-y-4">
                <h1 class="text-3xl text-white font-medium tracking-tight leading-tight">Claim your <br> digital identity.</h1>
                <p class="text-sm text-neutral-500 leading-relaxed">
                    Set up your public presence. This information will be displayed on your profile URL and can be edited later.
                </p>
                
                <div class="pt-6">
                    <div class="flex items-center gap-3 text-xs text-neutral-500 mb-3">
                        <iconify-icon icon="solar:shield-check-linear" width="16" stroke-width="1.5"></iconify-icon>
                        <span>Data is encrypted</span>
                    </div>
                    <div class="flex items-center gap-3 text-xs text-neutral-500">
                        <iconify-icon icon="solar:eye-linear" width="16" stroke-width="1.5"></iconify-icon>
                        <span>Visible to team members</span>
                    </div>
                </div>
            </div>

            <!-- Form Area -->
            <div class="lg:col-span-8">
                <form class="space-y-8" onsubmit="event.preventDefault();">
                    
                    <!-- Avatar Upload -->
                    <div class="group">
                        <label class="block text-xs font-medium text-neutral-500 mb-3 uppercase tracking-wider">Profile Picture</label>
                        <div class="flex items-center gap-6">
                            <div class="relative w-20 h-20 rounded-full bg-neutral-900 border border-neutral-800 flex items-center justify-center overflow-hidden group-hover:border-neutral-700 transition-colors duration-300">
                                <iconify-icon icon="solar:user-linear" class="text-neutral-600" width="32" stroke-width="1.5"></iconify-icon>
                                <!-- Overlay on hover -->
                                <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
                                    <iconify-icon icon="solar:camera-add-linear" class="text-white" width="24" stroke-width="1.5"></iconify-icon>
                                </div>
                            </div>
                            <div class="flex flex-col gap-2">
                                <button class="px-4 py-2 bg-neutral-900 hover:bg-neutral-800 text-neutral-200 text-xs font-medium rounded-md border border-neutral-800 transition-all flex items-center gap-2 w-max">
                                    Upload Image
                                </button>
                                <span class="text-xs text-neutral-600">Max size 5MB. JPG or PNG.</span>
                            </div>
                        </div>
                    </div>

                    <!-- Name Fields -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div class="space-y-1.5">
                            <label for="fname" class="text-xs font-medium text-neutral-500">First Name</label>
                            <input type="text" id="fname" placeholder="Jane" class="w-full bg-transparent border-b border-neutral-800 focus:border-white py-2 text-sm text-white placeholder-neutral-700 outline-none transition-colors duration-300">
                        </div>
                        <div class="space-y-1.5">
                            <label for="lname" class="text-xs font-medium text-neutral-500">Last Name</label>
                            <input type="text" id="lname" placeholder="Doe" class="w-full bg-transparent border-b border-neutral-800 focus:border-white py-2 text-sm text-white placeholder-neutral-700 outline-none transition-colors duration-300">
                        </div>
                    </div>

                    <!-- Handle -->
                    <div class="space-y-1.5">
                        <label for="handle" class="text-xs font-medium text-neutral-500">Username</label>
                        <div class="flex items-center border-b border-neutral-800 focus-within:border-white transition-colors duration-300">
                            <span class="text-neutral-600 text-sm select-none">profile.os/</span>
                            <input type="text" id="handle" placeholder="username" class="w-full bg-transparent py-2 text-sm text-white placeholder-neutral-700 outline-none">
                            <iconify-icon icon="solar:verified-check-linear" class="text-green-500 opacity-0 transition-opacity" width="16" stroke-width="1.5"></iconify-icon>
                        </div>
                    </div>

                    <!-- Role Selection (Custom Radio Cards) -->
                    <div class="space-y-3">
                        <label class="text-xs font-medium text-neutral-500 uppercase tracking-wider">Primary Role</label>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <!-- Option 1 -->
                            <label class="cursor-pointer relative">
                                <input type="radio" name="role" class="peer sr-only">
                                <div class="p-4 rounded-lg border border-neutral-800 bg-neutral-900/30 hover:bg-neutral-900 hover:border-neutral-700 peer-checked:bg-neutral-100 peer-checked:border-neutral-100 peer-checked:text-black transition-all duration-200 h-full flex flex-col justify-between group">
                                    <iconify-icon icon="solar:palette-linear" width="24" stroke-width="1.5" class="mb-3 text-neutral-500 group-hover:text-neutral-300 peer-checked:text-black transition-colors"></iconify-icon>
                                    <span class="text-sm font-medium">Designer</span>
                                </div>
                            </label>
                            
                            <!-- Option 2 -->
                            <label class="cursor-pointer relative">
                                <input type="radio" name="role" class="peer sr-only" checked>
                                <div class="p-4 rounded-lg border border-neutral-800 bg-neutral-900/30 hover:bg-neutral-900 hover:border-neutral-700 peer-checked:bg-neutral-100 peer-checked:border-neutral-100 peer-checked:text-black transition-all duration-200 h-full flex flex-col justify-between group">
                                    <iconify-icon icon="solar:code-circle-linear" width="24" stroke-width="1.5" class="mb-3 text-neutral-500 group-hover:text-neutral-300 peer-checked:text-black transition-colors"></iconify-icon>
                                    <span class="text-sm font-medium">Developer</span>
                                </div>
                            </label>

                            <!-- Option 3 -->
                            <label class="cursor-pointer relative">
                                <input type="radio" name="role" class="peer sr-only">
                                <div class="p-4 rounded-lg border border-neutral-800 bg-neutral-900/30 hover:bg-neutral-900 hover:border-neutral-700 peer-checked:bg-neutral-100 peer-checked:border-neutral-100 peer-checked:text-black transition-all duration-200 h-full flex flex-col justify-between group">
                                    <iconify-icon icon="solar:graph-up-linear" width="24" stroke-width="1.5" class="mb-3 text-neutral-500 group-hover:text-neutral-300 peer-checked:text-black transition-colors"></iconify-icon>
                                    <span class="text-sm font-medium">Product</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Bio Textarea -->
                    <div class="space-y-1.5">
                        <div class="flex justify-between items-end">
                            <label for="bio" class="text-xs font-medium text-neutral-500">Bio</label>
                            <span class="text-[10px] text-neutral-600">0/160</span>
                        </div>
                        <textarea id="bio" rows="3" class="w-full bg-neutral-900/30 border border-neutral-800 rounded-lg p-3 text-sm text-white placeholder-neutral-700 outline-none focus:border-neutral-600 focus:ring-1 focus:ring-neutral-600 transition-all resize-none" placeholder="Write a short introduction..."></textarea>
                    </div>

                    <!-- Custom Toggle Section -->
                    <div class="flex items-center justify-between py-2">
                        <div class="flex flex-col">
                            <span class="text-sm text-white font-medium">Open to work</span>
                            <span class="text-xs text-neutral-500">Display a badge on your profile</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" value="" class="sr-only peer">
                            <div class="w-11 h-6 bg-neutral-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-neutral-400 after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-neutral-200 peer-checked:after:bg-black"></div>
                        </label>
                    </div>

                    <!-- Actions -->
                    <div class="pt-6 border-t border-neutral-900 flex items-center justify-end gap-4">
                        <button class="text-sm font-medium text-neutral-500 hover:text-white transition-colors">
                            Cancel
                        </button>
                        <button class="group bg-white text-black px-5 py-2.5 rounded-md text-sm font-medium hover:bg-neutral-200 transition-all flex items-center gap-2">
                            Create Profile
                            <iconify-icon icon="solar:arrow-right-linear" width="16" stroke-width="1.5" class="group-hover:translate-x-0.5 transition-transform"></iconify-icon>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
