<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: #eeedf2;
font-family: 'DM Sans', sans-serif;
padding: 40px 20px;
}
.cards-container {
display: flex;
gap: 20px;
flex-wrap: wrap;
justify-content: center;
}
.card {
width: 272px;
height: 400px;
border-radius: 28px;
position: relative;
cursor: pointer;
overflow: hidden;
background: #ffffff;
border: 1px solid rgba(255,255,255,0.5);
box-shadow: 0 4px 20px rgba(0,0,0,0.06);
transition: transform 0.5s cubic-bezier(0.23,1,0.32,1), box-shadow 0.5s cubic-bezier(0.23,1,0.32,1);
animation: cardIn 0.7s cubic-bezier(0.23,1,0.32,1) both;
}
.card:nth-child(1) { animation-delay: 0s; }
.card:nth-child(2) { animation-delay: 0.07s; }
.card:nth-child(3) { animation-delay: 0.14s; }
.card:nth-child(4) { animation-delay: 0.21s; }
.card:nth-child(5) { animation-delay: 0.28s; }
@keyframes cardIn {
from { opacity: 0; transform: translateY(24px) scale(0.97); }
to { opacity: 1; transform: translateY(0) scale(1); }
}
.card:hover {
transform: translateY(-8px) scale(1.015);
box-shadow: 0 20px 40px rgba(0,0,0,0.1);
}
.card-blobs {
position: absolute;
inset: 0;
z-index: 0;
pointer-events: none;
}
.card-blobs .blob {
position: absolute;
border-radius: 50%;
filter: blur(45px);
opacity: 0.7;
transition: transform 0.6s cubic-bezier(0.23,1,0.32,1), opacity 0.4s ease;
}
.card:hover .card-blobs .blob {
opacity: 0.82;
transform: scale(1.08);
}
/* Analyst — pink/salmon left, lavender/purple right */
.card--analyst .blob-1 { background: #f0a8a8; width: 170px; height: 170px; bottom: -35px; left: -25px; }
.card--analyst .blob-2 { background: #d8b8f0; width: 160px; height: 160px; bottom: -20px; right: -20px; }
.card--analyst .blob-3 { background: #f0c0b8; width: 110px; height: 110px; bottom: 25px; left: 35%; }
/* Engineer — golden yellow left, lime green right */
.card--engineer .blob-1 { background: #f0d090; width: 170px; height: 170px; bottom: -35px; left: -25px; }
.card--engineer .blob-2 { background: #c0e890; width: 150px; height: 150px; bottom: -15px; right: -25px; }
.card--engineer .blob-3 { background: #e8d878; width: 110px; height: 110px; bottom: 20px; left: 40%; }
/* Marketing — sky blue left, teal middle, blue-green right */
.card--marketing .blob-1 { background: #90c8f0; width: 170px; height: 170px; bottom: -35px; left: -25px; }
.card--marketing .blob-2 { background: #60c8d0; width: 160px; height: 160px; bottom: -20px; right: -25px; }
.card--marketing .blob-3 { background: #80d8e8; width: 110px; height: 110px; bottom: 25px; left: 38%; }
/* Sales — pink left, coral/orange middle, warm peach right */
.card--sales .blob-1 { background: #f0a0b8; width: 160px; height: 160px; bottom: -30px; left: -20px; }
.card--sales .blob-2 { background: #f0b878; width: 160px; height: 160px; bottom: -20px; right: -25px; }
.card--sales .blob-3 { background: #f0a080; width: 120px; height: 120px; bottom: 20px; left: 35%; }
.card--sales .blob-4 { background: #e8c090; width: 100px; height: 100px; bottom: -10px; right: 25%; }
/* Data — mint left, cyan middle, soft green right */
.card--data .blob-1 { background: #80e0c0; width: 170px; height: 170px; bottom: -35px; left: -25px; }
.card--data .blob-2 { background: #80d0e0; width: 150px; height: 150px; bottom: -15px; right: -25px; }
.card--data .blob-3 { background: #a0e8c8; width: 110px; height: 110px; bottom: 25px; left: 40%; }
.card-content {
position: relative;
z-index: 2;
height: 100%;
display: flex;
flex-direction: column;
align-items: center;
padding: 24px 22px 32px;
}
.badge {
display: inline-flex;
align-items: center;
gap: 9px;
background: rgba(255,255,255,0.55);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1.5px solid rgba(255,255,255,0.7);
border-radius: 50px;
padding: 6px 16px 6px 6px;
align-self: flex-start;
box-shadow: 0 2px 12px rgba(0,0,0,0.04);
transition: background 0.3s, transform 0.3s;
}
.card:hover .badge {
background: rgba(255,255,255,0.72);
transform: scale(1.04);
}
.badge-icon {
width: 28px;
height: 28px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
}
.card--analyst .badge-icon { background: linear-gradient(140deg, #7090d0, #a080e0); }
.card--engineer .badge-icon { background: linear-gradient(140deg, #e0a838, #d07030); }
.card--marketing .badge-icon { background: linear-gradient(140deg, #e070a0, #c850c8); }
.card--sales .badge-icon { background: linear-gradient(140deg, #9060d0, #6840c0); }
.card--data .badge-icon { background: linear-gradient(140deg, #40b888, #2890a8); }
.badge-icon svg { width: 13px; height: 13px; fill: #fff; }
.badge-text {
font-size: 13px;
font-weight: 600;
color: #2a2a3a;
}
.icon-box {
width: 108px;
height: 108px;
border-radius: 26px;
background: rgba(255,255,255,0.5);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
border: 1.5px solid rgba(255,255,255,0.6);
box-shadow: 0 8px 28px rgba(0,0,0,0.05), 0 1px 6px rgba(0,0,0,0.03);
display: flex;
align-items: center;
justify-content: center;
margin-top: auto;
margin-bottom: auto;
transition: transform 0.5s cubic-bezier(0.23,1,0.32,1), box-shadow 0.4s ease, background 0.4s ease;
}
.card:hover .icon-box {
transform: scale(1.06);
background: rgba(255,255,255,0.65);
box-shadow: 0 12px 36px rgba(0,0,0,0.07);
}
.icon-box svg {
transition: transform 0.5s cubic-bezier(0.23,1,0.32,1);
}
.card:hover .icon-box svg { transform: scale(1.05); }
.card-bottom {
display: flex;
flex-direction: column;
align-items: center;
gap: 10px;
width: 100%;
}
.card-title {
font-family: 'Playfair Display', serif;
font-size: 30px;
font-weight: 800;
line-height: 1.08;
color: #1a1a2e;
text-align: center;
transition: transform 0.4s cubic-bezier(0.23,1,0.32,1);
}
.card:hover .card-title { transform: translateY(-2px); }
.card-tagline {
font-family: 'JetBrains Mono', monospace;
font-size: 9.5px;
font-weight: 500;
letter-spacing: 2.8px;
text-transform: uppercase;
color: rgba(40,40,60,0.35);
transition: color 0.3s, letter-spacing 0.4s cubic-bezier(0.23,1,0.32,1);
}
.card:hover .card-tagline {
color: rgba(40,40,60,0.55);
letter-spacing: 3.8px;
}
@media (max-width: 768px) {
.cards-container { gap: 14px; }
.card { width: 250px; height: 370px; }
.card-title { font-size: 26px; }
.icon-box { width: 96px; height: 96px; border-radius: 22px; }
}
