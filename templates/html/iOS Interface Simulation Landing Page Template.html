body {
font-family: 'Inter', sans-serif;
}
/* Smooth IOS-like scrolling */
.ios-scroll {
-webkit-overflow-scrolling: touch;
scrollbar-width: none;
}
.ios-scroll::-webkit-scrollbar {
display: none;
}
/* Wallpapers */
.wallpaper-gradient {
background:
radial-gradient(circle at 50% 0%, #7c3aed 0%, transparent 50%),
radial-gradient(circle at 0% 50%, #db2777 0%, transparent 50%),
radial-gradient(circle at 100% 50%, #2563eb 0%, transparent 50%),
radial-gradient(circle at 50% 100%, #059669 0%, transparent 50%),
linear-gradient(180deg, #18181b 0%, #09090b 100%);
background-size: 200% 200%;
animation: gradient-shift 15s ease infinite;
}
@keyframes gradient-shift {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}
/* Utilities */
.backdrop-blur-xl {
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
}
.backdrop-blur-md {
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
}
/* Animations */
.unlock-slide-up {
transform: translateY(-100%);
opacity: 0;
transition: all 0.6s cubic-bezier(0.32, 0.72, 0, 1);
}
.home-scale-in {
transform: scale(1);
opacity: 1;
transition: all 0.6s cubic-bezier(0.32, 0.72, 0, 1);
}
.home-hidden {
transform: scale(0.85);
opacity: 0;
pointer-events: none;
}
.app-open {
transform: scale(1);
border-radius: 0;
opacity: 1;
pointer-events: auto;
}
.app-closed {
transform: scale(0);
opacity: 0;
pointer-events: none;
border-radius: 3rem;
}
/* Icon Squircle approximation */
.squircle {
border-radius: 22%;
}
.shake-animation {
animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
}
.spin-slow {
animation: spin 8s linear infinite;
}
@keyframes spin {
from { transform: rotate(0deg); }
to { transform: rotate(360deg); }
}
@keyframes shake {
10%, 90% { transform: translate3d(-1px, 0, 0); }
20%, 80% { transform: translate3d(2px, 0, 0); }
30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
40%, 60% { transform: translate3d(4px, 0, 0); }
}

    <script>
        // Clock Functionality
        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeString = `${hours}:${minutes}`;
            
            document.getElementById('lock-time').innerText = timeString;
            document.getElementById('status-time').innerText = timeString;

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            const dateString = `${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
            document.getElementById('lock-date').innerText = dateString;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // Unlock Logic
        const lockScreen = document.getElementById('lock-screen');
        const homeScreen = document.getElementById('home-screen');
        
        function unlockPhone() {
            lockScreen.classList.add('unlock-slide-up');
            homeScreen.classList.remove('home-hidden');
            homeScreen.classList.add('home-scale-in');
        }

        // App Logic
        const appLayer = document.getElementById('app-layer');
        const appTitle = document.getElementById('app-title');

        function openApp(name, colorClass) {
            appTitle.innerText = name;
            appLayer.classList.remove('app-closed');
            appLayer.classList.add('app-open');
        }

        function closeApp() {
            appLayer.classList.remove('app-open');
            appLayer.classList.add('app-closed');
        }

        lockScreen.addEventListener('click', (e) => {
            if(e.target === lockScreen || e.target.closest('.group')) {
                // handle click
            }
        });

        // Download Self Logic
        document.getElementById('download-btn').addEventListener('click', function() {
            // Get current HTML
            const htmlContent = document.documentElement.outerHTML;
            // Create blob
            const blob = new Blob([htmlContent], {type: 'text/html'});
            const url = URL.createObjectURL(blob);
            this.href = url;
        });

    </script>
