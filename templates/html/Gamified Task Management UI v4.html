<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Arcade - Gamified Task Management</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.cdnfonts.com/css/pixel-operator" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Pixel Operator', 'Pixel Operator SC', monospace;
      background: #1B0261;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* 8-bit flicker */
    @keyframes flicker {
      0%,100% { opacity: 1;}
      49% { opacity: 0.65;}
      50% { opacity: 0.25;}
      52% { opacity: 1;}
    }
    .flicker { animation: flicker 1.6s step-end infinite; }
    /* Pixel artifacts & stars */
    @keyframes floatStar {
      0% {transform: translateY(0);}
      100% {transform: translateY(-120vh);}
    }
    .star-anim { animation: floatStar linear infinite; }
    /* 8-bit bounce for coins */
    @keyframes bounce {
      0%,100% {transform: translateY(0);}
      50% {transform: translateY(-10px);}
    }
    .coin-anim { animation: bounce 1.2s steps(2, end) infinite; }
    /* 8-bit border flicker */
    @keyframes borderFlicker {
      0%,100% { box-shadow: 0 0 0 0 #00C4F6; }
      10% { box-shadow: 0 0 0 4px #FFD930, 0 0 0 8px #0C0261; }
      20% { box-shadow: 0 0 0 4px #FF19ED, 0 0 0 8px #FFD930; }
      35% { box-shadow: 0 0 0 4px #00C4F6, 0 0 0 8px #221990; }
      50% { box-shadow: 0 0 0 8px #FF19ED, 0 0 0 12px #FFD930; }
      70% { box-shadow: 0 0 0 4px #FFD930, 0 0 0 8px #FF19ED; }
      80% { box-shadow: 0 0 0 8px #00C4F6, 0 0 0 12px #FFD930; }
    }
    .frame-8bit {
      border: 6px solid #ECF0F3;
      border-radius: 0;
      background: #130D41;
      box-shadow: 0 0 0 8px #00C4F6;
      animation: borderFlicker 4s steps(3, end) infinite;
    }
    .pixel-btn {
      border: 4px solid #ECF0F3;
      border-radius: 0;
      font-family: 'Pixel Operator', monospace;
      box-shadow: 0 0 0 2px #FFD930, 0 0 0 0 #00C4F6;
      text-transform: uppercase;
      transition: background 0.1s, color 0.1s, box-shadow 0.1s;
    }
    .pixel-btn-primary {
      background: #00C4F6;
      color: #1B0261;
      border-color: #FFD930;
      box-shadow: 0 6px 0 0 #0C0261;
    }
    .pixel-btn-primary:hover {
      background: #FFD930;
      color: #1B0261;
      border-color: #FF19ED;
      box-shadow: 0 6px 0 0 #221990;
    }
    .pixel-btn-secondary {
      background: #FF19ED;
      color: #ECF0F3;
      border-color: #ECF0F3;
      box-shadow: 0 6px 0 0 #221990;
    }
    .pixel-btn-secondary:hover {
      background: #130D41;
      color: #FFD930;
      border-color: #FFD930;
      box-shadow: 0 6px 0 0 #00C4F6;
    }
    .pixelate { image-rendering: pixelated; }
  </style>
</head>
<body class="relative min-h-screen flex items-center justify-center bg-[#1B0261] overflow-x-hidden">

  <!-- Blocky animated pixel stars background -->
  <div class="pointer-events-none fixed inset-0 z-0">
    <!-- 8-bit stars (solid blocks) -->
    <div style="left:5vw;top:90vh;animation-duration:7s;" class="absolute w-2 h-2 bg-[#00C4F6] pixelate star-anim"></div>
    <div style="left:40vw;top:98vh;animation-duration:10s;" class="absolute w-2 h-2 bg-[#FFD930] pixelate star-anim"></div>
    <div style="left:70vw;top:85vh;animation-duration:6.5s;" class="absolute w-3 h-3 bg-[#FF19ED] pixelate star-anim"></div>
    <div style="left:60vw;top:97vh;animation-duration:8s;" class="absolute w-2 h-2 bg-[#ECF0F3] pixelate star-anim"></div>
    <div style="left:20vw;top:95vh;animation-duration:6.7s;" class="absolute w-3 h-3 bg-[#00C4F6] pixelate star-anim"></div>
    <div style="left:80vw;top:98vh;animation-duration:10s;" class="absolute w-2 h-2 bg-[#FFD930] pixelate star-anim"></div>
    <div style="left:50vw;top:75vh;animation-duration:7.2s;" class="absolute w-2 h-2 bg-[#FF19ED] pixelate star-anim"></div>
    <div style="left:12vw;top:88vh;animation-duration:9s;" class="absolute w-3 h-3 bg-[#ECF0F3] pixelate star-anim"></div>
    <div style="left:85vw;top:93vh;animation-duration:8.5s;" class="absolute w-2 h-2 bg-[#ECF0F3] pixelate star-anim"></div>
    <div style="left:44vw;top:99vh;animation-duration:6.3s;" class="absolute w-2 h-2 bg-[#FF19ED] pixelate star-anim"></div>
    <div style="left:28vw;top:96vh;animation-duration:10.5s;" class="absolute w-3 h-3 bg-[#FFD930] pixelate star-anim"></div>
    <div style="left:56vw;top:91vh;animation-duration:7.8s;" class="absolute w-3 h-3 bg-[#00C4F6] pixelate star-anim"></div>
    <div style="left:67vw;top:92vh;animation-duration:8.1s;" class="absolute w-2 h-2 bg-[#ECF0F3] pixelate star-anim"></div>
    <div style="left:23vw;top:85vh;animation-duration:5.7s;" class="absolute w-2 h-2 bg-[#FF19ED] pixelate star-anim"></div>
    <div style="left:78vw;top:94vh;animation-duration:9.6s;" class="absolute w-3 h-3 bg-[#FFD930] pixelate star-anim"></div>
  </div>

  <!-- 8-bit arcade coins -->
  <div class="pointer-events-none fixed inset-0 z-10">
    <div style="left:7vw;top:50vh;animation-delay:0.12s;" class="absolute coin-anim">
      <div class="w-8 h-8 bg-[#FFD930] border-4 border-[#ECF0F3] pixelate"></div>
      <div class="absolute left-2 top-1 w-2 h-2 bg-white pixelate"></div>
    </div>
    <div style="left:92vw;top:70vh;animation-delay:0.32s;" class="absolute coin-anim">
      <div class="w-7 h-7 bg-[#FF19ED] border-4 border-[#ECF0F3] pixelate"></div>
      <div class="absolute left-2 top-2 w-2 h-2 bg-white pixelate"></div>
    </div>
    <div style="left:80vw;top:20vh;animation-delay:0.5s;" class="absolute coin-anim">
      <div class="w-8 h-8 bg-[#00C4F6] border-4 border-[#ECF0F3] pixelate"></div>
      <div class="absolute left-2 top-2 w-2 h-2 bg-white pixelate"></div>
    </div>
    <div style="left:50vw;top:10vh;animation-delay:0.8s;" class="absolute coin-anim">
      <div class="w-7 h-7 bg-[#FFD930] border-4 border-[#ECF0F3] pixelate"></div>
      <div class="absolute left-1 top-1 w-2 h-2 bg-white pixelate"></div>
    </div>
  </div>

  <!-- 8-bit Hero Card -->
  <main class="relative z-30 px-5 py-7 md:px-10 w-full max-w-lg frame-8bit flex flex-col items-center border-8 border-[#ECF0F3] bg-[#130D41]">

    <div class="w-full flex flex-col items-center mb-3">
      <span class="inline-block px-3 py-2 text-2xl md:text-3xl font-bold text-[#FFD930] bg-[#0C0261] border-4 border-[#00C4F6] pixelate flicker mb-2"
        style="font-family:'Pixel Operator', monospace;">
        TASK ARCADE
      </span>
      <span class="inline-block px-3 py-1 text-lg md:text-xl font-bold text-[#ECF0F3] bg-[#221990] border-4 border-[#FFD930] pixelate"
        style="font-family:'Pixel Operator SC', monospace;">
        Gamified Task Management
      </span>
    </div>
    <p class="text-center text-base md:text-lg text-[#ECF0F3] font-normal mb-6 mt-4 pixelate" style="font-family:'Pixel Operator', monospace;">
      Create, edit, and delete quests.<br>
      Choose your character and equip items.<br>
      Collect XP. Level up. Unlock rewards.<br>
      <span class="text-[#FFD930] font-bold">Retro 8-bit. True Arcade. Real Productivity.</span>
    </p>
    <div class="flex flex-wrap gap-4 w-full justify-center mt-2">
      <a href="#" class="pixel-btn pixel-btn-primary text-lg font-bold px-7 py-2"
        style="font-family:'Pixel Operator', monospace;">
        Start Quest
      </a>
      <a href="#" class="pixel-btn pixel-btn-secondary text-lg font-bold px-7 py-2"
        style="font-family:'Pixel Operator', monospace;">
        Learn More
      </a>
    </div>
    <!-- Blocky pixel border corners -->
    <div class="absolute left-0 top-0 w-6 h-6 bg-[#FFD930] pixelate"></div>
    <div class="absolute right-0 top-0 w-6 h-6 bg-[#00C4F6] pixelate"></div>
    <div class="absolute left-0 bottom-0 w-6 h-6 bg-[#FF19ED] pixelate"></div>
    <div class="absolute right-0 bottom-0 w-6 h-6 bg-[#221990] pixelate"></div>
  </main>
  
  <div class="pointer-events-none fixed bottom-4 left-1/2 -translate-x-1/2 z-40 select-none">
    <span class="flicker text-2xl text-[#FFD930] bg-[#0C0261] border-4 border-[#00C4F6] px-4 py-2 pixelate"
      style="font-family:'Pixel Operator', monospace;">
      [PRESS START!]
    </span>
  </div>
</body>
</html>
