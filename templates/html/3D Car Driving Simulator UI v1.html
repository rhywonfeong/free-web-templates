<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Simulator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-900 text-white font-inter overflow-hidden">
    <div class="fixed inset-0 flex flex-col">
        <!-- Header -->
        <header class="bg-gray-800/80 backdrop-blur-sm border-b border-gray-700/50 p-4 animate-[slideDown_0.6s_ease-out]">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center">
                        <i data-lucide="car" class="w-5 h-5"></i>
                    </div>
                    <h1 class="text-xl font-semibold tracking-tight">Car Simulator</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="text-sm text-gray-400">Speed: <span id="speedometer" class="text-blue-400 font-medium">0</span> km/h</div>
                    <button id="resetBtn" class="px-3 py-1.5 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm transition-colors duration-200">
                        <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex-1 relative">
            <!-- 3D Canvas -->
            <div id="canvas-container" class="absolute inset-0 animate-[fadeIn_0.8s_ease-out_0.2s_both]"></div>

            <!-- Controls Panel -->
            <div class="absolute bottom-4 left-4 bg-gray-800/90 backdrop-blur-sm rounded-xl p-4 border border-gray-700/50 animate-[slideUp_0.6s_ease-out_0.4s_both]">
                <h3 class="text-sm font-medium mb-3 text-gray-300">Controls</h3>
                <div class="space-y-2 text-xs text-gray-400">
                    <div class="flex items-center space-x-2">
                        <div class="w-6 h-6 bg-gray-700 rounded flex items-center justify-center text-white font-medium">W</div>
                        <span>Accelerate</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="w-6 h-6 bg-gray-700 rounded flex items-center justify-center text-white font-medium">S</div>
                        <span>Brake/Reverse</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="w-6 h-6 bg-gray-700 rounded flex items-center justify-center text-white font-medium">A</div>
                        <span>Turn Left</span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="w-6 h-6 bg-gray-700 rounded flex items-center justify-center text-white font-medium">D</div>
                        <span>Turn Right</span>
                    </div>
                </div>
            </div>

            <!-- Stats Panel -->
            <div class="absolute top-4 right-4 bg-gray-800/90 backdrop-blur-sm rounded-xl p-4 border border-gray-700/50 animate-[slideDown_0.6s_ease-out_0.6s_both]">
                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-400">Engine</span>
                        <div id="engineStatus" class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-400">Gear</span>
                        <span id="gearDisplay" class="text-sm font-medium">D</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-sm text-gray-400">RPM</span>
                        <span id="rpmDisplay" class="text-sm font-medium">800</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Three.js setup
        let scene, camera, renderer, car, ground;
        let keys = {};
        let carSpeed = 0;
        let carRotation = 0;
        let maxSpeed = 0.5;
        let acceleration = 0.01;
        let deceleration = 0.008;
        let turnSpeed = 0.03;

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x1a1a1a, 10, 100);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight - 80);
            renderer.setClearColor(0x1a1a1a);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.3);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            // Ground
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x2a2a2a });
            ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grid
            const gridHelper = new THREE.GridHelper(100, 100, 0x404040, 0x404040);
            scene.add(gridHelper);

            // Car
            createCar();

            // Camera position
            camera.position.set(0, 8, 10);
            camera.lookAt(0, 0, 0);

            // Event listeners
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.getElementById('resetBtn').addEventListener('click', resetCar);
            window.addEventListener('resize', onWindowResize);
        }

        function createCar() {
            car = new THREE.Group();

            // Car body
            const bodyGeometry = new THREE.BoxGeometry(2, 0.8, 4);
            const bodyMaterial = new THREE.MeshLambertMaterial({ color: 0x3b82f6 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.y = 0.5;
            body.castShadow = true;
            car.add(body);

            // Car roof
            const roofGeometry = new THREE.BoxGeometry(1.6, 0.6, 2);
            const roofMaterial = new THREE.MeshLambertMaterial({ color: 0x2563eb });
            const roof = new THREE.Mesh(roofGeometry, roofMaterial);
            roof.position.y = 1.1;
            roof.position.z = -0.3;
            roof.castShadow = true;
            car.add(roof);

            // Wheels
            const wheelGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 8);
            const wheelMaterial = new THREE.MeshLambertMaterial({ color: 0x333333 });
            
            const positions = [
                [-1.2, 0.3, 1.3],
                [1.2, 0.3, 1.3],
                [-1.2, 0.3, -1.3],
                [1.2, 0.3, -1.3]
            ];

            positions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.position.set(...pos);
                wheel.rotation.z = Math.PI / 2;
                wheel.castShadow = true;
                car.add(wheel);
            });

            car.position.y = 0.1;
            car.castShadow = true;
            scene.add(car);
        }

        function onKeyDown(event) {
            keys[event.code] = true;
        }

        function onKeyUp(event) {
            keys[event.code] = false;
        }

        function updateCar() {
            let accelerating = false;
            let braking = false;
            let turningLeft = false;
            let turningRight = false;

            if (keys['KeyW']) {
                carSpeed = Math.min(carSpeed + acceleration, maxSpeed);
                accelerating = true;
            }
            if (keys['KeyS']) {
                if (carSpeed > 0) {
                    carSpeed = Math.max(carSpeed - deceleration * 2, 0);
                    braking = true;
                } else {
                    carSpeed = Math.max(carSpeed - acceleration, -maxSpeed * 0.5);
                }
            }
            if (keys['KeyA']) {
                if (Math.abs(carSpeed) > 0.01) {
                    carRotation += turnSpeed * (carSpeed > 0 ? 1 : -1);
                    turningLeft = true;
                }
            }
            if (keys['KeyD']) {
                if (Math.abs(carSpeed) > 0.01) {
                    carRotation -= turnSpeed * (carSpeed > 0 ? 1 : -1);
                    turningRight = true;
                }
            }

            if (!accelerating && !braking) {
                carSpeed *= 0.95;
            }

            // Apply movement
            car.position.x += Math.sin(carRotation) * carSpeed;
            car.position.z += Math.cos(carRotation) * carSpeed;
            car.rotation.y = carRotation;

            // Update camera
            const cameraDistance = 10;
            const cameraHeight = 6;
            camera.position.x = car.position.x - Math.sin(carRotation) * cameraDistance;
            camera.position.z = car.position.z - Math.cos(carRotation) * cameraDistance;
            camera.position.y = car.position.y + cameraHeight;
            camera.lookAt(car.position);

            // Update UI
            const speedKmh = Math.abs(carSpeed) * 100;
            document.getElementById('speedometer').textContent = Math.round(speedKmh);
            
            const rpm = 800 + Math.abs(carSpeed) * 4000;
            document.getElementById('rpmDisplay').textContent = Math.round(rpm);
            
            const gear = carSpeed < -0.01 ? 'R' : carSpeed < 0.01 ? 'N' : 'D';
            document.getElementById('gearDisplay').textContent = gear;
        }

        function resetCar() {
            car.position.set(0, 0.1, 0);
            car.rotation.y = 0;
            carSpeed = 0;
            carRotation = 0;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / (window.innerHeight - 80);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight - 80);
        }

        function animate() {
            requestAnimationFrame(animate);
            updateCar();
            renderer.render(scene, camera);
        }

        // Start the simulation
        init();
        animate();
    </script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes slideDown {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</body>
</html>
