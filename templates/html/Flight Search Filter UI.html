    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Search Filter</title>
    <style>
        /* Global styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Filter card styles */
        .filter-card {
            width: 480px;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 
                0 10px 10px rgba(0, 0, 0, 0.03),
                0 0 2px rgba(0, 0, 0, 0.1),
                0 1px 1px rgba(0, 0, 0, 0.03);
        }

        /* Header styles */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 12px;
        }

        .header h2 {
            font-size: 20px;
            font-weight: 500;
        }

        .reset-btn {
            font-size: 16px;
            font-weight: 500;
            color: #fff;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.8;
        }

        .reset-btn:hover {
            opacity: 1;
        }

        /* Separator */
        .separator {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.1);
            margin: 0;
        }

        /* Section styles */
        .section {
            padding: 24px 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .clear-btn {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            background: none;
            border: none;
            cursor: pointer;
            opacity: 0.8;
        }

        .clear-btn:hover {
            opacity: 1;
        }

        /* Price slider section */
        .price-label {
            font-size: 14px;
            font-weight: 500;
        }

        /* Slider container */
        .slider-container {
            position: relative;
            width: 100%;
            height: 12px;
            margin: 12px 0;
        }

        /* Slider track */
        .slider-track {
            position: absolute;
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Slider active track */
        .slider-track-active {
            position: absolute;
            height: 6px;
            background: #3395ff;
            border-radius: 3px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Slider thumb */
        .slider-thumb {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #3395ff;
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        /* Price bubble */
        .price-bubble {
            position: absolute;
            background: #3395ff;
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            white-space: nowrap;
            transform: translateX(-50%);
            top: -40px;
            z-index: 3;
        }

        /* Sort by section */
        .sort-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sort-option {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .radio-container {
            position: relative;
            width: 20px;
            height: 20px;
        }

        .radio-input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .radio-checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 20px;
            width: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }

        .radio-input:checked ~ .radio-checkmark {
            background-color: #3395ff;
        }

        .radio-checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .radio-input:checked ~ .radio-checkmark:after {
            display: block;
            top: 6px;
            left: 6px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: white;
        }

        .option-label {
            font-size: 14px;
            font-weight: 400;
        }

        /* Stops section */
        .stops-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stops-option {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .checkbox-container {
            position: relative;
            width: 20px;
            height: 20px;
        }

        .checkbox-input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkbox-checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 20px;
            width: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .checkbox-input:checked ~ .checkbox-checkmark {
            background-color: #3395ff;
        }

        .checkbox-checkmark:after {
            content: "";
            position: absolute;
            display: none;
        }

        .checkbox-input:checked ~ .checkbox-checkmark:after {
            display: block;
            left: 7px;
            top: 3px;
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Travel time section */
        .time-slider-container {
            position: relative;
            width: 100%;
            height: 12px;
            margin: 12px 0 20px 0;
        }

        .time-label {
            font-size: 14px;
            font-weight: 500;
        }

        /* Baggage section */
        .baggage-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Search button */
        .search-button {
            background-color: #3395ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            margin: 20px auto;
            display: block;
            box-shadow: 
                0 5px 5px rgba(0, 0, 0, 0.03),
                0 0 2px rgba(0, 0, 0, 0.1),
                0 1px 1px rgba(0, 0, 0, 0.03);
            transition: background-color 0.2s;
        }

        .search-button:hover {
            background-color: #2a85ea;
        }
    </style>
</head>
<body>
    <div class="filter-card">
        <div class="header">
            <h2>Filters</h2>
            <button class="reset-btn" id="resetAll">Reset</button>
        </div>
        
        <div class="separator"></div>
        
        <!-- Sort by section -->
        <div class="section">
            <h3 class="section-title">Sort by</h3>
            
            <div class="sort-options">
                <label class="sort-option">
                    <div class="radio-container">
                        <input type="radio" name="sort" class="radio-input" value="best" checked>
                        <span class="radio-checkmark"></span>
                    </div>
                    <span class="option-label">Best</span>
                </label>
                
                <label class="sort-option">
                    <div class="radio-container">
                        <input type="radio" name="sort" class="radio-input" value="cheapest">
                        <span class="radio-checkmark"></span>
                    </div>
                    <span class="option-label">Cheapest</span>
                </label>
                
                <label class="sort-option">
                    <div class="radio-container">
                        <input type="radio" name="sort" class="radio-input" value="fastest">
                        <span class="radio-checkmark"></span>
                    </div>
                    <span class="option-label">Fastest</span>
                </label>
            </div>
        </div>
        
        <div class="separator"></div>
        
        <!-- Price section -->
        <div class="section">
            <div class="section-title">
                <h3>Price</h3>
                <button class="clear-btn" id="clearPrice">Clear</button>
            </div>
            
            <div class="section-content">
                <div class="price-label">Up to CA$<span id="priceValue">6000</span></div>
            </div>
            
            <div class="slider-container">
                <div class="slider-track"></div>
                <div class="slider-track-active" id="sliderActive"></div>
                <div class="slider-thumb" id="sliderThumb"></div>
                <div class="price-bubble" id="priceBubble">CA$6000</div>
            </div>
        </div>
        
        <div class="separator"></div>
        
        <!-- Stops section -->
        <div class="section">
            <div class="section-title">
                <h3>Stops</h3>
                <button class="clear-btn" id="clearStops">Clear</button>
            </div>
            
            <div class="stops-options">
                <label class="stops-option">
                    <div class="checkbox-container">
                        <input type="checkbox" class="checkbox-input" value="direct" checked>
                        <span class="checkbox-checkmark"></span>
                    </div>
                    <span class="option-label">Direct</span>
                </label>
                
                <label class="stops-option">
                    <div class="checkbox-container">
                        <input type="checkbox" class="checkbox-input" value="1stop" checked>
                        <span class="checkbox-checkmark"></span>
                    </div>
                    <span class="option-label">1 stop</span>
                </label>
                
                <label class="stops-option">
                    <div class="checkbox-container">
                        <input type="checkbox" class="checkbox-input" value="2plus" checked>
                        <span class="checkbox-checkmark"></span>
                    </div>
                    <span class="option-label">2+ stops</span>
                </label>
            </div>
        </div>
        
        <div class="separator"></div>
        
        <!-- Travel time section -->
        <div class="section">
            <div class="section-title">
                <h3>Travel time</h3>
                <button class="clear-btn" id="clearTime">Clear</button>
            </div>
            
            <div class="section-content">
                <div class="time-label">Up to <span id="timeValue">24h</span></div>
            </div>
            
            <div class="time-slider-container">
                <div class="slider-track"></div>
                <div class="slider-track-active" id="timeSliderActive"></div>
                <div class="slider-thumb" id="timeSliderThumb"></div>
                <div class="price-bubble" id="timeBubble">24h</div>
            </div>
        </div>
        
        <div class="separator"></div>
        
        <!-- Baggage section -->
        <div class="section">
            <div class="section-title">
                <h3>Baggage</h3>
                <button class="clear-btn" id="clearBaggage">Clear</button>
            </div>
            
            <div class="baggage-options">
                <label class="stops-option">
                    <div class="checkbox-container">
                        <input type="checkbox" class="checkbox-input" value="cabin" checked>
                        <span class="checkbox-checkmark"></span>
                    </div>
                    <span class="option-label">Cabin baggage included</span>
                </label>
                
                <label class="stops-option">
                    <div class="checkbox-container">
                        <input type="checkbox" class="checkbox-input" value="checked">
                        <span class="checkbox-checkmark"></span>
                    </div>
                    <span class="option-label">Checked baggage included</span>
                </label>
            </div>
        </div>
        
        <button class="search-button">Search Flights</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Price slider elements
            const sliderThumb = document.getElementById('sliderThumb');
            const sliderActive = document.getElementById('sliderActive');
            const priceBubble = document.getElementById('priceBubble');
            const priceValue = document.getElementById('priceValue');
            const clearPriceBtn = document.getElementById('clearPrice');
            const sliderContainer = document.querySelector('.slider-container');
            
            // Travel time slider elements
            const timeSliderThumb = document.getElementById('timeSliderThumb');
            const timeSliderActive = document.getElementById('timeSliderActive');
            const timeBubble = document.getElementById('timeBubble');
            const timeValue = document.getElementById('timeValue');
            const clearTimeBtn = document.getElementById('clearTime');
            const timeSliderContainer = document.querySelector('.time-slider-container');
            
            // Other clear buttons
            const clearStopsBtn = document.getElementById('clearStops');
            const clearBaggageBtn = document.getElementById('clearBaggage');
            const resetAllBtn = document.getElementById('resetAll');
            
            // Price range
            const minPrice = 0;
            const maxPrice = 6000;
            let currentPrice = maxPrice;
            
            // Time range
            const minTime = 2;
            const maxTime = 24;
            let currentTime = maxTime;
            
            // Update UI based on price
            function updatePrice(price) {
                currentPrice = price;
                
                // Calculate percentage for positioning
                const percentage = (price / maxPrice) * 100;
                
                // Update thumb and active track position
                sliderThumb.style.left = `${percentage}%`;
                sliderActive.style.width = `${percentage}%`;
                
                // Update price display
                priceValue.textContent = price;
                priceBubble.textContent = `CA$${price}`;
                
                // Position the bubble
                priceBubble.style.left = `${percentage}%`;
            }
            
            // Update UI based on time
            function updateTime(time) {
                currentTime = time;
                
                // Calculate percentage for positioning
                const percentage = (time / maxTime) * 100;
                
                // Update thumb and active track position
                timeSliderThumb.style.left = `${percentage}%`;
                timeSliderActive.style.width = `${percentage}%`;
                
                // Update time display
                timeValue.textContent = time + 'h';
                timeBubble.textContent = time + 'h';
                
                // Position the bubble
                timeBubble.style.left = `${percentage}%`;
            }
            
            // Handle slider thumb drag for price
            let isDraggingPrice = false;
            
            sliderThumb.addEventListener('mousedown', function(e) {
                isDraggingPrice = true;
                document.addEventListener('mousemove', onPriceMouseMove);
                document.addEventListener('mouseup', onPriceMouseUp);
                priceBubble.style.opacity = '1';
                e.preventDefault();
            });
            
            // For touch devices (price)
            sliderThumb.addEventListener('touchstart', function(e) {
                isDraggingPrice = true;
                document.addEventListener('touchmove', onPriceTouchMove);
                document.addEventListener('touchend', onPriceTouchEnd);
                priceBubble.style.opacity = '1';
                e.preventDefault();
            });
            
            function onPriceMouseMove(e) {
                if (!isDraggingPrice) return;
                updatePriceSliderPosition(e.clientX);
            }
            
            function onPriceTouchMove(e) {
                if (!isDraggingPrice) return;
                updatePriceSliderPosition(e.touches[0].clientX);
                e.preventDefault();
            }
            
            function onPriceMouseUp() {
                isDraggingPrice = false;
                document.removeEventListener('mousemove', onPriceMouseMove);
                document.removeEventListener('mouseup', onPriceMouseUp);
            }
            
            function onPriceTouchEnd() {
                isDraggingPrice = false;
                document.removeEventListener('touchmove', onPriceTouchMove);
                document.removeEventListener('touchend', onPriceTouchEnd);
            }
            
            function updatePriceSliderPosition(clientX) {
                // Get slider dimensions
                const sliderRect = sliderContainer.getBoundingClientRect();
                
                // Calculate position within slider (0 to 1)
                let position = (clientX - sliderRect.left) / sliderRect.width;
                
                // Clamp position between 0 and 1
                position = Math.max(0, Math.min(1, position));
                
                // Calculate price
                const price = Math.round(position * maxPrice);
                
                // Update UI
                updatePrice(price);
            }
            
            // Handle slider thumb drag for time
            let isDraggingTime = false;
            
            timeSliderThumb.addEventListener('mousedown', function(e) {
                isDraggingTime = true;
                document.addEventListener('mousemove', onTimeMouseMove);
                document.addEventListener('mouseup', onTimeMouseUp);
                timeBubble.style.opacity = '1';
                e.preventDefault();
            });
            
            // For touch devices (time)
            timeSliderThumb.addEventListener('touchstart', function(e) {
                isDraggingTime = true;
                document.addEventListener('touchmove', onTimeTouchMove);
                document.addEventListener('touchend', onTimeTouchEnd);
                timeBubble.style.opacity = '1';
                e.preventDefault();
            });
            
            function onTimeMouseMove(e) {
                if (!isDraggingTime) return;
                updateTimeSliderPosition(e.clientX);
            }
            
            function onTimeTouchMove(e) {
                if (!isDraggingTime) return;
                updateTimeSliderPosition(e.touches[0].clientX);
                e.preventDefault();
            }
            
            function onTimeMouseUp() {
                isDraggingTime = false;
                document.removeEventListener('mousemove', onTimeMouseMove);
                document.removeEventListener('mouseup', onTimeMouseUp);
            }
            
            function onTimeTouchEnd() {
                isDraggingTime = false;
                document.removeEventListener('touchmove', onTimeTouchMove);
                document.removeEventListener('touchend', onTimeTouchEnd);
            }
            
            function updateTimeSliderPosition(clientX) {
                // Get slider dimensions
                const sliderRect = timeSliderContainer.getBoundingClientRect();
                
                // Calculate position within slider (0 to 1)
                let position = (clientX - sliderRect.left) / sliderRect.width;
                
                // Clamp position between 0 and 1
                position = Math.max(0, Math.min(1, position));
                
                // Calculate time (between min and max)
                const time = Math.round(minTime + position * (maxTime - minTime));
                
                // Update UI
                updateTime(time);
            }
            
            // Click on price slider track to set position
            sliderContainer.addEventListener('click', function(e) {
                // Ignore if the click was on the thumb
                if (e.target === sliderThumb) return;
                
                updatePriceSliderPosition(e.clientX);
            });
            
            // Click on time slider track to set position
            timeSliderContainer.addEventListener('click', function(e) {
                // Ignore if the click was on the thumb
                if (e.target === timeSliderThumb) return;
                
                updateTimeSliderPosition(e.clientX);
            });
            
            // Clear price button
            clearPriceBtn.addEventListener('click', function() {
                updatePrice(maxPrice);
            });
            
            // Clear time button
            clearTimeBtn.addEventListener('click', function() {
                updateTime(maxTime);
            });
            
            // Clear stops button
            clearStopsBtn.addEventListener('click', function() {
                document.querySelectorAll('.stops-options .checkbox-input').forEach(checkbox => {
                    checkbox.checked = true;
                });
            });
            
            // Clear baggage button
            clearBaggageBtn.addEventListener('click', function() {
                document.querySelectorAll('.baggage-options .checkbox-input').forEach(checkbox => {
                    checkbox.checked = false;
                });
                // Set cabin baggage to checked by default
                document.querySelector('.baggage-options .checkbox-input[value="cabin"]').checked = true;
            });
            
            // Reset all button
            resetAllBtn.addEventListener('click', function() {
                // Reset price
                updatePrice(maxPrice);
                
                // Reset time
                updateTime(maxTime);
                
                // Reset sort
                document.querySelector('.sort-options .radio-input[value="best"]').checked = true;
                
                // Reset stops
                document.querySelectorAll('.stops-options .checkbox-input').forEach(checkbox => {
                    checkbox.checked = true;
                });
                
                // Reset baggage
                document.querySelectorAll('.baggage-options .checkbox-input').forEach(checkbox => {
                    checkbox.checked = false;
                });
                document.querySelector('.baggage-options .checkbox-input[value="cabin"]').checked = true;
            });
            
            // Initialize with default values
            updatePrice(currentPrice);
            updateTime(currentTime);
        });
    </script>
</body>
