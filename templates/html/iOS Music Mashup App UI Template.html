<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mixy - iOS Style</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
/* iOS-like smooth scrolling and tap highlights */
* { -webkit-tap-highlight-color: transparent; }
/* Subtle animated background mesh */
@keyframes float {
0% { transform: translate(0px, 0px) scale(1); }
33% { transform: translate(30px, -50px) scale(1.1); }
66% { transform: translate(-20px, 20px) scale(0.9); }
100% { transform: translate(0px, 0px) scale(1); }
}
.animate-blob {
animation: float 20s infinite ease-in-out;
}
.animation-delay-2000 { animation-delay: 2s; }
.animation-delay-4000 { animation-delay: 4s; }
</style></head>
<body class="bg-black text-white h-screen w-screen overflow-hidden selection:bg-pink-500/30">

    <!-- Ambient Background (Subtler iOS Style) -->
    <div class="fixed inset-0 z-0 bg-black">
        <div class="absolute -top-40 -left-20 h-96 w-96 rounded-full bg-purple-900/40 mix-blend-screen blur-[100px] animate-blob"></div>
        <div class="absolute top-0 -right-20 h-96 w-96 rounded-full bg-indigo-900/40 mix-blend-screen blur-[100px] animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-32 left-20 h-96 w-96 rounded-full bg-pink-900/30 mix-blend-screen blur-[100px] animate-blob animation-delay-4000"></div>
    </div>
    
    <!-- Main App Container -->
    <main class="relative z-10 mx-auto flex h-full max-w-md flex-col px-6 pt-2 pb-6">
        
        <!-- Status Bar -->
        <div class="flex w-full items-center justify-between px-2 py-3 text-xs font-semibold tracking-wide text-white">
            <span>9:41</span>
            <div class="flex items-center gap-1.5">
                <i data-lucide="signal" class="h-4 w-4 stroke-[2]"></i>
                <i data-lucide="wifi" class="h-4 w-4 stroke-[2]"></i>
                <div class="relative ml-0.5 flex h-[11px] w-[22px] items-center justify-start rounded-[4px] border border-white/30 px-[1.5px]">
                    <div class="h-[7px] w-[17px] rounded-[2px] bg-white"></div>
                </div>
            </div>
        </div>

        <!-- Navigation Bar -->
        <header class="flex items-center justify-between py-2">
            <button class="group flex h-10 w-10 items-center justify-center -ml-2 rounded-full active:bg-white/10 transition-colors">
                <i data-lucide="chevron-left" class="h-7 w-7 text-blue-500 stroke-[2]"></i>
            </button>
            
            <span class="text-base font-semibold tracking-tight text-white/90">Mixy</span>
            
            <div class="w-10"></div> <!-- Spacer -->
        </header>

        <!-- Main Content -->
        <div class="flex flex-1 flex-col items-center pt-4">
            
            <!-- iOS Large Title Style -->
            <div class="w-full text-center mb-8">
                <h1 class="text-3xl font-bold tracking-tight text-white">
                    Create Mashup
                </h1>
                <p class="mt-1 text-base text-white/50 font-normal">Select tracks to blend</p>
            </div>

            <!-- Cards Container -->
            <div class="flex w-full items-start justify-center gap-4">
                
                <!-- Left Card (Beat) -->
                <div class="flex flex-1 flex-col gap-3">
                    <div class="group relative aspect-square w-full cursor-pointer overflow-hidden rounded-[1.25rem] bg-zinc-900 shadow-lg ring-1 ring-white/10 transition-transform active:scale-95">
                        <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=600&auto=format&fit=crop" class="h-full w-full object-cover opacity-60 transition-opacity group-hover:opacity-80" alt="Beat Cover">
                        
                        <!-- Blur Overlay -->
                        <div class="absolute inset-0 flex flex-col items-center justify-center gap-2 bg-black/20 backdrop-blur-sm p-4">
                            <!-- Icon representing 'Beat' -->
                            <div class="flex h-12 w-12 items-center justify-center rounded-full bg-white/10 backdrop-blur-md ring-1 ring-white/20">
                                <i data-lucide="music-2" class="h-6 w-6 text-white stroke-[2]"></i>
                            </div>
                        </div>
                        
                        <!-- Selected Indicator -->
                        <div class="absolute top-3 right-3 h-5 w-5 rounded-full bg-blue-500 flex items-center justify-center shadow-lg">
                            <i data-lucide="check" class="h-3 w-3 text-white stroke-[3]"></i>
                        </div>
                    </div>
                    <div class="text-center px-1">
                        <p class="truncate text-sm font-semibold text-white leading-tight">Much I Love You</p>
                        <p class="truncate text-xs text-white/50 mt-0.5">Jaydoiscool</p>
                    </div>
                </div>

                <!-- Right Card (Vocal) -->
                <div class="flex flex-1 flex-col gap-3">
                    <div class="group relative aspect-square w-full cursor-pointer overflow-hidden rounded-[1.25rem] bg-zinc-900 shadow-lg ring-1 ring-white/10 transition-transform active:scale-95">
                        <img src="https://images.unsplash.com/photo-1493225255756-d9584f8606e9?q=80&w=600&auto=format&fit=crop" class="h-full w-full object-cover" alt="Vocal Cover">
                        
                        <div class="absolute inset-0 bg-gradient-to-b from-transparent via-transparent to-black/80"></div>
                        
                        <!-- Text overlay style -->
                        <div class="absolute bottom-3 left-3 right-3 text-center">
                            <span class="block text-lg font-bold text-white tracking-wide uppercase drop-shadow-md">Jade</span>
                        </div>
                    </div>
                    <div class="text-center px-1">
                        <p class="truncate text-sm font-semibold text-white leading-tight">Constellations</p>
                        <p class="truncate text-xs text-white/50 mt-0.5">Jade LeMac</p>
                    </div>
                </div>

            </div>

            <!-- iOS Segmented Control / Action Bar -->
            <div class="mt-auto w-full pb-6">
                
                <!-- Floating Glass Control -->
                <div class="mb-6 flex h-16 w-full items-center justify-between rounded-2xl bg-zinc-800/40 px-2 backdrop-blur-xl ring-1 ring-white/5">
                    
                    <button class="flex h-full flex-1 items-center justify-center rounded-xl text-sm font-medium text-white/50 transition-colors hover:text-white">
                        Adjust Beat
                    </button>

                    <!-- Divider -->
                    <div class="h-8 w-[1px] bg-white/10"></div>

                    <button class="mx-2 flex h-10 w-10 items-center justify-center rounded-full bg-white/10 text-white transition-transform active:rotate-180">
                         <i data-lucide="arrow-left-right" class="h-5 w-5 stroke-[2]"></i>
                    </button>

                    <!-- Divider -->
                    <div class="h-8 w-[1px] bg-white/10"></div>

                    <button class="flex h-full flex-1 items-center justify-center rounded-xl text-sm font-medium text-blue-400">
                        Edit Vocal
                    </button>
                </div>

                <!-- Main Action Button (iOS Style) -->
                <button class="relative w-full overflow-hidden rounded-2xl bg-white p-4 shadow-[0_0_20px_rgba(255,255,255,0.15)] transition-transform active:scale-[0.98]">
                    <div class="flex items-center justify-center gap-2">
                        <i data-lucide="sparkles" class="h-5 w-5 text-black stroke-[2]"></i>
                        <span class="text-base font-bold text-black">Generate Mashup</span>
                    </div>
                </button>

            </div>

        </div>

        <!-- Home Indicator -->
        <div class="flex justify-center pb-1">
            <div class="h-1.5 w-32 rounded-full bg-white/20 backdrop-blur-md"></div>
        </div>

    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
