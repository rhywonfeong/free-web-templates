    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Credit Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        first: "moveVertical 30s ease infinite",
                        second: "moveInCircle 20s reverse infinite",
                        third: "moveInCircle 40s linear infinite",
                    },
                    keyframes: {
                        moveInCircle: {
                            "0%": { transform: "rotate(0deg)" },
                            "50%": { transform: "rotate(180deg)" },
                            "100%": { transform: "rotate(360deg)" }
                        },
                        moveVertical: {
                            "0%": { transform: "translateY(-10%)" },
                            "50%": { transform: "translateY(10%)" },
                            "100%": { transform: "translateY(-10%)" }
                        }
                    }
                }
            }
        };
    </script>
    <style>
        :root {
            --gradient-background-start: rgb(50, 0, 120);
            --gradient-background-end: rgb(10, 40, 100);
            --first-color: 18, 113, 255;
            --second-color: 221, 74, 255;
            --third-color: 100, 220, 255;
            --blending-value: screen;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="w-[340px] h-[220px] relative overflow-hidden rounded-3xl shadow-xl">
        <!-- Gradient Background -->
        <div class="absolute inset-0 bg-[linear-gradient(40deg,var(--gradient-background-start),var(--gradient-background-end))]">
            <div class="gradients-container h-full w-full blur-lg">
                <div class="absolute [background:radial-gradient(circle_at_center,_rgba(var(--first-color),0.8)_0,_rgba(var(--first-color),0)_50%)_no-repeat] [mix-blend-mode:var(--blending-value)] w-[100%] h-[100%] top-0 left-0 [transform-origin:center_center] animate-first opacity-100"></div>
                
                <div class="absolute [background:radial-gradient(circle_at_center,_rgba(var(--second-color),_0.8)_0,_rgba(var(--second-color),_0)_50%)_no-repeat] [mix-blend-mode:var(--blending-value)] w-[100%] h-[100%] top-0 left-0 [transform-origin:calc(50%-100px)] animate-second opacity-100"></div>
                
                <div class="absolute [background:radial-gradient(circle_at_center,_rgba(var(--third-color),_0.8)_0,_rgba(var(--third-color),_0)_50%)_no-repeat] [mix-blend-mode:var(--blending-value)] w-[100%] h-[100%] top-0 left-0 [transform-origin:calc(50%+100px)] animate-third opacity-100"></div>
            </div>
        </div>
        
        <!-- Card Content -->
        <div class="relative z-10 h-full w-full p-6 flex flex-col text-white">
            <!-- Top Row -->
            <div class="flex justify-between items-start">
                <!-- Chip -->
                <div class="w-12 h-10">
                    <svg viewBox="0 0 48 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="1" y="1" width="46" height="38" rx="5" stroke="gold" stroke-width="2"/>
                        <rect x="10" y="12" width="28" height="16" fill="gold"/>
                    </svg>
                </div>
                
                <!-- Logo -->
                <div class="text-xl font-bold tracking-wider">
                    <span class="bg-clip-text text-transparent bg-gradient-to-r from-white to-blue-200">NEXUS</span>
                </div>
            </div>
            
            <!-- Card Number -->
            <div class="mt-8 text-xl tracking-widest font-mono text-center">
                <span class="opacity-90">4929 1122 3344 5566</span>
            </div>
            
            <!-- Bottom Row -->
            <div class="mt-auto flex justify-between items-end">
                <!-- Cardholder Name -->
                <div class="flex flex-col">
                    <span class="text-xs opacity-70">CARDHOLDER</span>
                    <span class="font-medium tracking-wide">JOHN SMITH</span>
                </div>
                
                <!-- Expiry -->
                <div class="flex flex-col items-end">
                    <span class="text-xs opacity-70">EXPIRES</span>
                    <span class="font-medium">12/25</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
