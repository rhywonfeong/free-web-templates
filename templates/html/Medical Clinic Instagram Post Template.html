<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leadflow Post Design 1080x1350</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
.font-serif-italic { font-family: 'Playfair Display', serif; font-style: italic; }
</style></head>
<body class="bg-neutral-950 min-h-screen flex items-center justify-center p-4">

    <!-- Instagram Feed Post Container (Aspect Ratio 4:5 - 1080x1350) -->
    <!-- Max width set to 540px for browser viewing (scale 1:2), remove max-w for full size -->
    <div class="relative w-full max-w-[540px] aspect-[4/5] bg-black rounded-3xl overflow-hidden shadow-2xl border border-white/10 group select-none">
        
        <!-- Background Image with Overlay -->
        <div class="absolute inset-0 z-0">
            <!-- Office/Desk Background -->
            <img src="https://images.unsplash.com/photo-1497215728101-856f4ea42174?q=80&w=2070&auto=format&fit=crop" 
                 alt="Office Desk Dark" 
                 class="w-full h-full object-cover opacity-40 grayscale mix-blend-overlay">
            
            <!-- Ambient Lighting Gradients (Brand Colors) -->
            <div class="absolute top-[-10%] right-[-10%] w-[80%] h-[40%] bg-[#BB1E59] rounded-full mix-blend-screen filter blur-[100px] opacity-25"></div>
            <div class="absolute bottom-[-10%] left-[-10%] w-[60%] h-[40%] bg-[#FC4E2B] rounded-full mix-blend-screen filter blur-[90px] opacity-15"></div>
            
            <!-- Vignette -->
            <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/40 to-black/90"></div>
            
            <!-- Noise Texture Overlay (Optional for quality feel) -->
            <div class="absolute inset-0 opacity-[0.03] bg-[url('https://grainy-gradients.vercel.app/noise.svg')] mix-blend-overlay"></div>
        </div>

        <!-- Content Wrapper -->
        <div class="relative z-10 h-full flex flex-col items-center justify-between py-14 px-10 text-center">

            <!-- Top Pill / Badge -->
            <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-full bg-white/5 backdrop-blur-md border border-white/10 shadow-lg mb-4">
                <div class="p-1 bg-gradient-to-br from-[#FC4E2B] to-[#BB1E59] rounded-full flex items-center justify-center">
                    <iconify-icon icon="solar:bolt-linear" class="text-white text-sm"></iconify-icon>
                </div>
                <span class="text-xs font-medium text-white/90 tracking-wide uppercase">Leadflow Marketing Médico</span>
            </div>

            <!-- Main Headline Section -->
            <div class="flex-1 flex flex-col justify-center items-center space-y-3 mt-4">
                <h1 class="text-5xl text-white leading-[1.15] tracking-tight font-medium drop-shadow-2xl">
                    Se sua clínica <br> já fatura
                    <span class="block mt-4 mb-2 font-serif-italic bg-gradient-to-r from-[#FC4E2B] via-[#E03545] to-[#BB1E59] bg-clip-text text-transparent pb-1 leading-tight">
                        +300 mil/ano
                    </span>
                    <span class="block text-4xl text-white/80 mt-2 font-normal">
                        e mesmo assim vive <br> no limite...
                    </span>
                </h1>
                
                <p class="text-3xl text-white mt-8 font-medium tracking-tight leading-tight">
                    o problema não é <br>
                    <span class="font-serif-italic text-[#FC4E2B] text-4xl mt-1 block">marketing.</span>
                </p>
            </div>

            <!-- Secondary Content & CTA -->
            <div class="w-full flex flex-col items-center gap-10 pb-6">
                
                <!-- Body Text -->
                <p class="text-xl text-gray-300 font-normal leading-relaxed max-w-sm mx-auto opacity-80">
                    Clínica que passa de 300k/ano sem estrutura não cresce. Ela só se desgasta.
                </p>

                <!-- CTA Button Style -->
                <div class="flex flex-col items-center gap-4 cursor-pointer group/cta">
                    <span class="text-lg font-medium text-white tracking-wide group-hover/cta:text-[#FC4E2B] transition-colors duration-300">
                        Leia a legenda
                    </span>
                    <div class="relative flex items-center justify-center w-14 h-14 rounded-full bg-white/5 border border-white/10 backdrop-blur-md group-hover/cta:bg-white/10 transition-all duration-300 shadow-2xl">
                        <iconify-icon icon="solar:arrow-down-linear" class="text-white text-2xl group-hover/cta:translate-y-1 transition-transform duration-300"></iconify-icon>
                        
                        <!-- Pulse Effect -->
                        <div class="absolute inset-0 rounded-full border border-white/20 animate-[ping_2s_ease-in-out_infinite] opacity-20"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
