<style>
/* Custom Animations & Base Styles */
:root {
--paper-color: #fdfbf7;
--envelope-color: #fce7f3; /* rose-100 */
--envelope-dark: #fbcfe8; /* rose-200 */
--accent: #be123c; /* rose-700 */
}
body {
font-family: 'Playfair Display', serif;
overflow-x: hidden;
background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
}
.font-handwriting {
font-family: 'Great Vibes', cursive;
}
.font-title {
font-family: 'Cinzel', serif;
}
/* Envelope CSS */
.envelope-wrapper {
perspective: 1000px;
}
.envelope {
position: relative;
transform-style: preserve-3d;
transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.envelope:hover {
transform: translateY(-5px) rotate(1deg);
}
.flap {
position: absolute;
width: 0;
height: 0;
border-style: solid;
}
.flap.top {
top: 0;
left: 0;
width: 100%;
height: 100px; /* adjusted via js/tailwind usually but fixed for shape */
border-width: 100px 150px 0 150px;
border-color: var(--envelope-dark) transparent transparent transparent;
z-index: 50;
transform-origin: top;
transition: transform 0.6s 0.2s ease-in-out, z-index 0.2s 0.4s;
}
.flap.right {
top: 0;
right: 0;
border-width: 100px 150px 100px 0;
border-color: transparent var(--envelope-color) transparent transparent;
z-index: 40;
}
.flap.left {
top: 0;
left: 0;
border-width: 100px 0 100px 150px;
border-color: transparent transparent transparent var(--envelope-color);
z-index: 40;
}
.flap.bottom {
bottom: 0;
left: 0;
border-width: 0 150px 110px 150px;
border-color: transparent transparent var(--envelope-dark) transparent;
z-index: 45;
}
.letter-content {
background: var(--paper-color);
transform: translateY(0) scale(0.9);
transition: all 1s ease-in-out;
box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}
/* Animation States */
.is-open .flap.top {
transform: rotateX(180deg);
z-index: 10;
}
.is-open .letter-content {
transform: translateY(-60%) scale(1);
z-index: 60;
height: auto;
min-height: 400px;
}
/* Full Screen Letter Mode */
.letter-expanded {
position: fixed !important;
top: 50% !important;
left: 50% !important;
transform: translate(-50%, -50%) scale(1) !important;
width: 90% !important;
max-width: 500px !important;
height: auto !important;
max-height: 85vh !important;
z-index: 100 !important;
border-radius: 8px;
overflow-y: auto;
box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
padding: 2rem;
opacity: 0;
animation: fadeInLetter 1s forwards 0.6s;
}
@keyframes fadeInLetter {
to { opacity: 1; }
}
/* Floating Hearts BG */
.floating-heart {
position: absolute;
opacity: 0;
animation: floatUp 8s infinite linear;
}
@keyframes floatUp {
0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
20% { opacity: 0.6; }
80% { opacity: 0.6; }
100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}
/* Cupid Animation */
.cupid {
position: fixed;
top: 10%;
left: -100px;
animation: flyCupid 20s infinite linear;
z-index: 5;
opacity: 0.8;
}
@keyframes flyCupid {
0% { left: -100px; top: 10%; transform: rotate(0deg); }
25% { top: 5%; }
50% { left: 110vw; top: 15%; }
100% { left: 110vw; }
}
/* Cursor & Interaction */
.cursor-blink {
animation: blink 1s step-end infinite;
}
@keyframes blink {
50% { opacity: 0; }
}
/* Audio Player Hidden */
#music-player { display: none; }
/* Scrollbar hide */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
/* Pulse for Yes button */
.heart-beat {
animation: heartBeat 1.5s infinite;
}
@keyframes heartBeat {
0%, 100% { transform: scale(1); }
50% { transform: scale(1.05); }
}
</style></head>
<body class="min-h-screen flex flex-col items-center justify-center selection:bg-rose-200 selection:text-rose-900 overflow-hidden text-rose-900 bg-rose-50 relative">

    <!-- Background Elements -->
    <canvas id="canvas-particles" class="absolute inset-0 w-full h-full pointer-events-none z-0" width="1432" height="905"></canvas>
    
    <!-- Floating Hearts Container -->
    <div id="hearts-bg" class="absolute inset-0 pointer-events-none overflow-hidden z-0">
        <!-- JS will populate this -->
    </div>

    <!-- Cupid -->
    <div class="cupid text-rose-300">
        <iconify-icon icon="solar:cupid-linear" width="64" stroke-width="1.5"></iconify-icon>
    </div>

    <!-- Music Control -->
    <button id="music-btn" class="fixed top-6 right-6 z-50 p-3 rounded-full bg-white/40 backdrop-blur-md border border-white/50 text-rose-800 hover:bg-white/70 transition-all duration-300 shadow-sm group">
        <iconify-icon id="music-icon" icon="solar:music-note-linear" width="24" stroke-width="1.5"></iconify-icon>
        <span class="absolute right-full mr-3 top-1/2 -translate-y-1/2 bg-white/80 px-2 py-1 rounded text-xs text-rose-900 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">
            Mettre l'ambiance
        </span>
    </button>
    <audio id="bg-music" loop="">
        <!-- Using a royalty free calm piano link -->
        <source src="https://cdn.pixabay.com/download/audio/2022/10/25/audio_10852895e6.mp3?filename=romantic-piano-125026.mp3" type="audio/mpeg">
    </audio>

    <!-- Main Content -->
    <main class="z-10 flex flex-col w-full h-full pt-4 pr-4 pb-4 pl-4 relative items-center justify-center">

        <!-- Instructional Text (Fades out) -->
        <div id="instruction" class="absolute top-1/4 animate-pulse text-rose-800/60 font-title tracking-widest text-sm mb-8 transition-opacity duration-1000">
            Une lettre t'attend...
        </div>

        <!-- The Envelope -->
        <div id="envelope-wrapper" class="envelope-wrapper w-[300px] h-[200px] cursor-pointer group select-none">
            <div id="envelope" class="envelope w-full h-full bg-rose-200 shadow-xl relative rounded-sm">
                
                <!-- Flaps (CSS Triangles) -->
                <div class="flap top border-rose-300"></div>
                <div class="flap right"></div>
                <div class="flap left"></div>
                <div class="flap bottom"></div>

                <!-- Letter Inside (Initial State) -->
                <div id="letter-preview" class="absolute left-2 right-2 top-2 bottom-2 bg-white shadow-sm z-20 flex items-center justify-center opacity-0 transition-opacity duration-500">
                    <div class="w-full h-full border border-rose-100 m-1 flex items-center justify-center">
                        <span class="font-handwriting text-2xl text-rose-300">Pour toi</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- The Expanded Letter (Overlay) -->
        <div id="expanded-letter" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-rose-900/10 backdrop-blur-[2px] transition-all duration-1000 opacity-0">
            <div class="relative bg-[#fffdf9] w-[90%] max-w-[480px] p-8 md:p-12 shadow-2xl rounded-sm border border-stone-100 text-center flex flex-col items-center overflow-hidden">
                
                <!-- Decorative Corners -->
                <div class="absolute top-4 left-4 w-16 h-16 border-l border-t border-rose-200"></div>
                <div class="absolute top-4 right-4 w-16 h-16 border-r border-t border-rose-200"></div>
                <div class="absolute bottom-4 left-4 w-16 h-16 border-l border-b border-rose-200"></div>
                <div class="absolute bottom-4 right-4 w-16 h-16 border-r border-b border-rose-200"></div>

                <!-- Shine Effect -->
                <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/40 to-transparent pointer-events-none opacity-50"></div>

                <!-- Content -->
                <div class="relative z-10 w-full flex flex-col items-center">
                    <iconify-icon icon="solar:heart-linear" class="text-rose-300 mb-6 animate-pulse" width="32"></iconify-icon>
                    
                    <div id="poem-container" class="font-title text-rose-800 text-lg md:text-xl leading-relaxed tracking-tight min-h-[180px] flex flex-col justify-center items-center mb-8">
                        <!-- Typewriter text goes here -->
                    </div>

                    <!-- Question -->
                    <h2 id="final-question" class="font-handwriting text-4xl md:text-5xl text-rose-600 mb-10 opacity-0 transition-all duration-1000 transform translate-y-4">
                        Veux-tu être ma Valentine ?
                    </h2>

                    <!-- Buttons -->
                    <div id="response-buttons" class="flex flex-col md:flex-row items-center gap-4 w-full justify-center opacity-0 transition-all duration-1000 delay-500">
                        <button id="btn-yes" class="heart-beat group relative px-8 py-3 bg-gradient-to-r from-rose-500 to-rose-600 text-white font-title font-semibold text-lg tracking-wide rounded-full shadow-lg hover:shadow-rose-300/50 hover:scale-105 transition-all duration-300 overflow-hidden">
                            <span class="relative z-10 flex items-center gap-2">
                                Oui <iconify-icon icon="solar:heart-bold" width="20"></iconify-icon>
                            </span>
                            <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                        </button>

                        <button id="btn-no" class="px-6 py-2 bg-stone-100 text-stone-500 font-title text-sm tracking-wide rounded-full hover:bg-stone-200 transition-colors shadow-sm cursor-not-allowed relative">
                            Non <span class="text-base">😢</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Success Overlay -->
        <div id="success-overlay" class="fixed inset-0 z-50 bg-rose-900/90 text-white flex flex-col items-center justify-center text-center p-6 opacity-0 pointer-events-none transition-opacity duration-1000">
            <iconify-icon icon="solar:stars-minimalistic-linear" width="60" class="text-yellow-200 mb-6 animate-spin-slow"></iconify-icon>
            <h1 class="font-handwriting text-5xl md:text-7xl mb-6 text-rose-100">Luuuiiiaaaa ktieerr</h1>
            <p class="font-title text-lg md:text-xl text-rose-200 max-w-md leading-relaxed tracking-wide">
                Taleur chérie:)<br>
                <span class="text-white mt-4 block text-sm opacity-80 uppercase tracking-widest border-t border-white/20 pt-4 w-1/2 mx-auto">Je t'aime mon amour<3</span>
            </p>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const envelopeWrapper = document.getElementById('envelope-wrapper');
            const envelope = document.getElementById('envelope');
            const instruction = document.getElementById('instruction');
            const expandedLetter = document.getElementById('expanded-letter');
            const poemContainer = document.getElementById('poem-container');
            const finalQuestion = document.getElementById('final-question');
            const responseButtons = document.getElementById('response-buttons');
            const btnNo = document.getElementById('btn-no');
            const btnYes = document.getElementById('btn-yes');
            const musicBtn = document.getElementById('music-btn');
            const bgMusic = document.getElementById('bg-music');
            const successOverlay = document.getElementById('success-overlay');

            let isEnvelopeOpen = false;
            let isMusicPlaying = false;

            // --- 1. Background Effects (Hearts & Particles) ---
            
            // Create CSS Floating Hearts
            const heartsContainer = document.getElementById('hearts-bg');
            const icons = ['solar:heart-linear', 'solar:heart-bold', 'solar:stars-minimalistic-linear'];
            
            function createHeart() {
                const el = document.createElement('div');
                el.classList.add('floating-heart');
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 5 + 5) + 's';
                el.style.fontSize = (Math.random() * 20 + 10) + 'px';
                el.style.color = Math.random() > 0.5 ? '#fbcfe8' : '#fda4af'; // rose-200 or rose-300
                
                const icon = document.createElement('iconify-icon');
                icon.setAttribute('icon', icons[Math.floor(Math.random() * icons.length)]);
                el.appendChild(icon);
                
                heartsContainer.appendChild(el);
                
                setTimeout(() => {
                    el.remove();
                }, 11000);
            }

            setInterval(createHeart, 800);

            // Canvas Gold Particles
            const canvas = document.getElementById('canvas-particles');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = Math.random() * 0.5 - 0.25;
                    this.vy = Math.random() * 0.5 - 0.25;
                    this.size = Math.random() * 2;
                    this.alpha = Math.random();
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    if (this.x < 0) this.x = width;
                    if (this.x > width) this.x = 0;
                    if (this.y < 0) this.y = height;
                    if (this.y > height) this.y = 0;
                    this.alpha += (Math.random() - 0.5) * 0.02;
                    if (this.alpha < 0.1) this.alpha = 0.1;
                    if (this.alpha > 0.8) this.alpha = 0.8;
                }
                draw() {
                    ctx.fillStyle = `rgba(212, 175, 55, ${this.alpha})`; // Goldish
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            for(let i=0; i<60; i++) particles.push(new Particle());

            function animateParticles() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animateParticles);
            }
            animateParticles();


            // --- 2. Music Logic ---
            musicBtn.addEventListener('click', () => {
                if(isMusicPlaying) {
                    bgMusic.pause();
                    musicBtn.querySelector('iconify-icon').setAttribute('icon', 'solar:music-note-linear');
                    musicBtn.classList.remove('bg-rose-100');
                } else {
                    bgMusic.volume = 0.3;
                    bgMusic.play().catch(e => console.log("Auto-play prevented"));
                    musicBtn.querySelector('iconify-icon').setAttribute('icon', 'solar:music-note-bold');
                    musicBtn.classList.add('bg-rose-100');
                }
                isMusicPlaying = !isMusicPlaying;
            });


            // --- 3. Envelope Interaction ---
            const poemLines = [
                "Dans le tumulte des jours,",
                "tu es mon calme, ma lumière,",
                "celle qui transforme l’ordinaire en douceur.",
                "<br>",
                "Alors aujourd’hui, mon cœur",
                "a quelque chose à te murmurer..."
            ];

            function typeWriter(lines, index = 0) {
                if (index < lines.length) {
                    const line = lines[index];
                    const p = document.createElement('p');
                    p.innerHTML = ""; 
                    p.className = "mb-2 opacity-0 transform translate-y-2 transition-all duration-500";
                    poemContainer.appendChild(p);

                    // Fade in the line
                    setTimeout(() => {
                        p.classList.remove('opacity-0', 'translate-y-2');
                        p.innerHTML = line; // Simple fade in for blocks, or char by char if needed
                    }, 100);

                    // Wait slightly before next line
                    setTimeout(() => {
                        typeWriter(lines, index + 1);
                    }, 1500);
                } else {
                    // Finished typing
                    setTimeout(() => {
                        finalQuestion.classList.remove('opacity-0', 'translate-y-4');
                        responseButtons.classList.remove('opacity-0');
                        responseButtons.classList.add('flex');
                    }, 1000);
                }
            }

            envelopeWrapper.addEventListener('click', () => {
                if (isEnvelopeOpen) return;
                isEnvelopeOpen = true;

                // Sound Effect (Simulated via visual feedback mostly)
                // If we had a paper sound, we'd play it here.

                // 1. Hide instruction
                instruction.style.opacity = 0;

                // 2. Open Flap
                envelope.classList.add('is-open');

                // 3. Show Expanded Letter Overlay
                setTimeout(() => {
                    expandedLetter.classList.remove('hidden');
                    // Force reflow
                    void expandedLetter.offsetWidth; 
                    expandedLetter.style.opacity = 1;
                    
                    // Start Typing
                    setTimeout(() => {
                        typeWriter(poemLines);
                    }, 1000);

                }, 800);
            });


            // --- 4. Buttons Interaction ---

            // "No" Button Logic (Runaway)
            btnNo.addEventListener('mouseover', (e) => {
                const x = Math.random() * 150 - 75; // -75 to 75
                const y = Math.random() * 100 - 50; // -50 to 50
                
                btnNo.style.transform = `translate(${x}px, ${y}px)`;
            });

            btnNo.addEventListener('click', (e) => {
                e.preventDefault(); // Just in case
            });

            // "Yes" Button Logic
            btnYes.addEventListener('click', () => {
                // Celebration!
                
                // 1. Burst of hearts (Confetti-like)
                for(let i=0; i<50; i++) {
                    setTimeout(createHeart, i * 50);
                }

                // 2. Transition to Success Screen
                expandedLetter.style.opacity = 0;
                setTimeout(() => {
                    expandedLetter.classList.add('hidden');
                    successOverlay.classList.remove('pointer-events-none');
                    successOverlay.style.opacity = 1;
                }, 800);
            });
        });
    </script>
