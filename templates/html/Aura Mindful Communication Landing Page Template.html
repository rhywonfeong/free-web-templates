<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aura - Mindful Chat</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #F3F3F1;
color: #171717;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="min-h-screen flex flex-col selection:bg-neutral-800 selection:text-white">

    <!-- Navigation -->
    <nav class="w-full px-6 py-8 md:px-12 flex justify-between items-center z-10 relative">
        <div class="text-xl font-medium tracking-tight">
            Aura
        </div>
        
        <div class="hidden md:flex items-center gap-10 text-base text-gray-500">
            <a href="#" class="hover:text-gray-900 transition-colors flex items-center gap-1.5">
                Features 
                <i data-lucide="chevron-down" class="w-4 h-4"></i>
            </a>
            <a href="#" class="hover:text-gray-900 transition-colors">About</a>
            <a href="#" class="hover:text-gray-900 transition-colors">FAQ</a>
        </div>

        <a href="#" class="bg-[#171717] text-[#F3F3F1] px-6 py-2.5 rounded text-base hover:bg-gray-800 transition-colors font-medium">
            Get Aura
        </a>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow w-full px-6 md:px-12 flex flex-col md:flex-row relative">
        
        <!-- Left Column: Text Content -->
        <div class="md:w-1/2 flex flex-col md:pt-20 md:pb-24 min-h-[50vh] md:min-h-[calc(100vh-120px)] w-full z-10 pt-12 pb-16 justify-between">
            
            <!-- Top Description -->
            <div class="">
                <p class="leading-relaxed text-lg text-gray-600 max-w-sm">
                    Aura is an asynchronous communication room designed for mindful dialogue. No read receipts, no typing indicators. Just the message, when you're ready.
                </p>
                
                <a href="#" class="inline-flex items-center gap-2 hover:text-gray-900 transition-colors group text-base text-gray-500 mt-8">
                    Scroll to explore
                    <i data-lucide="arrow-down" class="w-4 h-4 group-hover:translate-y-1 transition-transform"></i>
                </a>
            </div>

            <!-- Bottom Headline -->
            <div class="mt-24 md:mt-0">
                <h1 class="text-5xl md:text-7xl lg:text-[5.5rem] font-medium tracking-tight leading-[1.05]">
                    Converse with<br>intention
                </h1>
            </div>
            
        </div>

        <!-- Right Column: Image Container -->
        <div class="w-full md:w-1/2 flex justify-center md:justify-end items-center pb-16 md:pb-24 md:pr-12 lg:pr-24 relative z-0 mt-12 md:mt-0">
            <div class="w-full max-w-[420px] aspect-[4/7] bg-gray-200 overflow-hidden relative shadow-sm">
                <!-- Using an image of calming smoke/incense to match the reference aesthetic -->
                <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/917d6f93-fb36-439a-8c48-884b67b35381_1600w.jpg" alt="Abstract calming smoke" class="w-full h-full object-cover object-center">
            </div>
        </div>

    </main>

    <script>
        // Initialize Lucide icons with specific stroke width
        lucide.createIcons({
            attrs: {
                'stroke-width': 1.5
            }
        });
    </script>

</body></html>
