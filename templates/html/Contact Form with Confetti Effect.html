    <style>
        :root {
            /* Playful Startup Theme Variables */
            --font-primary: 'Poppins', sans-serif;
            --bg-page: #fef6e4;
            --bg-component: #ffffff;
            --bg-nav: rgba(255, 250, 240, 0.85);
            --text-primary: #3a3a3a;
            --text-secondary: #5c5c5c;
            --text-headline: #2c2c2c;
            --text-heading-accent: #d9534f; /* Coral red */
            --text-cta-accent: #f0ad4e; /* Orange-yellow */
            --text-on-cta: #ffffff;
            --border-color: #f3d2c1;
            --border-color-input-focus: var(--text-cta-accent);
            --radius-base: 8px;
            --radius-large: 16px;
            --radius-xl: 24px;
            --radius-pill: 50px;
            --shadow-color-rgb: 100, 100, 100;
            --shadow-opacity-soft: 0.08;
            --shadow-opacity-medium: 0.12;
            --shadow-soft: 0 4px 8px rgba(var(--shadow-color-rgb), var(--shadow-opacity-soft));
            --shadow-medium: 0 6px 12px rgba(var(--shadow-color-rgb), var(--shadow-opacity-medium));
            --shadow-interactive: 0 8px 16px rgba(var(--shadow-color-rgb), 0.15);
            --transition-speed: 0.3s;
            --transition-bounce: cubic-bezier(0.68, -0.55, 0.27, 1.55);
            --transition-subtle: ease-in-out;
            --color-playful-green: #6FCF97;
            --color-playful-purple: #9B51E0;
            --color-playful-blue: #56CCF2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body {
            font-family: var(--font-primary); background-color: var(--bg-page); color: var(--text-primary);
            line-height: 1.7; overflow-x: hidden; padding-top: 80px;
        }
        body.scrolled .main-nav { padding: 12px 40px; }

        .container { width: 90%; max-width: 1100px; margin: 0 auto; padding: 60px 0; }
        .section-title { font-size: clamp(2.2rem, 6vw, 3.5rem); color: var(--text-heading-accent); text-align: center; margin-bottom: 20px; font-weight: 700; }
        .section-subtitle { font-size: clamp(1rem, 2.5vw, 1.3rem); color: var(--text-secondary); text-align: center; max-width: 700px; margin: 0 auto 60px auto; }
        .section-title .highlight, .section-subtitle .highlight { color: var(--text-cta-accent); font-weight: 700; }

        .main-nav {
            position: fixed; top: 0; left: 0; width: 100%; padding: 18px 40px;
            background-color: var(--bg-nav); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; box-shadow: var(--shadow-soft); transition: padding 0.3s ease;
        }
        .nav-logo a { font-size: 1.8rem; font-weight: 800; color: var(--text-heading-accent); text-decoration: none; transition: transform var(--transition-speed) ease; }
        .nav-logo a:hover { transform: scale(1.05) rotate(-3deg); }
        .nav-links ul { list-style: none; display: flex; gap: 30px; }
        .nav-links a { text-decoration: none; color: var(--text-secondary); font-weight: 500; position: relative; padding-bottom: 5px; transition: color var(--transition-speed) ease; }
        .nav-links a::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background-color: var(--text-cta-accent); transition: width var(--transition-speed) var(--transition-bounce); }
        .nav-links a:hover { color: var(--text-cta-accent); }
        .nav-links a:hover::after { width: 100%; }
        .nav-links .nav-cta-link { background-color: var(--text-cta-accent); color: var(--text-on-cta); padding: 8px 18px; border-radius: var(--radius-pill); box-shadow: var(--shadow-soft); transition: transform var(--transition-speed) var(--transition-bounce), box-shadow var(--transition-speed) ease; }
        .nav-links .nav-cta-link:hover { color: var(--text-on-cta); transform: translateY(-2px) scale(1.05); box-shadow: var(--shadow-medium); }
        .nav-links .nav-cta-link:hover::after { width: 0; }

        #contact-section {
            background-color: var(--bg-page); min-height: calc(100vh - 80px); display: flex;
            align-items: center; justify-content: center; padding-bottom: 80px;
        }
        .contact-form-wrapper {
            background-color: var(--bg-component); padding: 40px 50px; border-radius: var(--radius-xl);
            box-shadow: var(--shadow-medium); max-width: 650px; width: 100%; margin: 0 auto;
            position: relative; 
            overflow: hidden; /* Contain confetti INSIDE */
            z-index: 2;
        }
        .contact-form-wrapper::after { /* Gradient fade-out at the bottom */
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to bottom, transparent, var(--bg-component) 80%);
            pointer-events: none;
            z-index: 3; /* Above confetti, below form elements */
        }

        .form-group { margin-bottom: 25px; position: relative; z-index: 4; /* Ensure form elements are above fade */ }
        .form-group label { display: block; font-weight: 600; color: var(--text-heading-accent); margin-bottom: 10px; font-size: 0.95rem; transition: all 0.3s ease; }
        .form-input, .form-textarea {
            width: 100%; padding: 16px 20px; border-radius: var(--radius-large);
            border: 2px solid var(--border-color); background-color: var(--bg-page);
            font-family: var(--font-primary); font-size: 1rem; color: var(--text-primary);
            transition: border-color var(--transition-speed) ease, box-shadow var(--transition-speed) ease, transform 0.2s var(--transition-bounce);
            position: relative; 
            z-index: 4; /* Ensure form elements are above fade */
        }
        .form-input:focus, .form-textarea:focus {
            outline: none; border-color: var(--border-color-input-focus);
            box-shadow: 0 0 0 4px rgba(var(--text-cta-accent), 0.25); transform: scale(1.01);
        }
        .form-input::placeholder, .form-textarea::placeholder { color: color-mix(in srgb, var(--text-secondary) 70%, transparent); opacity: 1; }
        .form-textarea { min-height: 150px; resize: vertical; }
        .submit-button-wrapper { text-align: center; margin-top: 30px; position: relative; z-index: 4; /* Ensure form elements are above fade */ }
        .submit-button {
            display: inline-block; background: linear-gradient(45deg, var(--text-heading-accent), color-mix(in srgb, var(--text-heading-accent) 70%, var(--text-cta-accent) 30%));
            color: var(--text-on-cta); padding: 16px 40px; font-size: 1.15rem; font-weight: 700;
            text-decoration: none; border-radius: var(--radius-pill); border: none; cursor: pointer;
            box-shadow: 0 5px 15px rgba(var(--text-heading-accent), 0.3);
            transition: transform var(--transition-speed) var(--transition-bounce), box-shadow var(--transition-speed) ease, background-position 0.5s ease;
            background-size: 200% auto; position: relative; overflow: hidden;
        }
        .submit-button:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 10px 20px rgba(var(--text-heading-accent), 0.4); background-position: right center; }
        .submit-button .icon { margin-left: 10px; display: inline-block; transition: transform 0.3s var(--transition-bounce); }
        .submit-button:hover .icon { transform: translateX(5px) rotate(15deg); }

        .form-confetti {
            position: absolute;
            width: 10px; height: 10px;
            opacity: 0; 
            border-radius: 2px;
            z-index: 1; /* Behind form elements and fade gradient */
            pointer-events: none;
        }
        .form-confetti.animate-confetti {
            animation: fall var(--fall-duration, 4s) linear var(--fall-delay, 0s) infinite;
        }

        .form-confetti.c1 { background: var(--text-cta-accent); left: 10%; --fall-duration: 4s; --fall-delay: 0.2s; }
        .form-confetti.c2 { background: var(--color-playful-green); left: 80%; width: 12px; height: 6px; --fall-duration: 5s; --fall-delay: 0.9s; }
        .form-confetti.c3 { background: var(--color-playful-purple); left: 50%; --fall-duration: 3.5s; --fall-delay: 1.5s; }
        .form-confetti.c4 { background: var(--text-heading-accent); left: 25%; width: 8px; height: 8px; --fall-duration: 4.5s; --fall-delay: 0.5s; }
        .form-confetti.c5 { background: var(--color-playful-blue); left: 70%; border-radius: 50%; --fall-duration: 3s; --fall-delay: 2s; }
        .form-confetti.c6 { background: var(--text-cta-accent); left: 35%; width:7px; height:7px; --fall-duration: 4.2s; --fall-delay: 1.8s; }
        .form-confetti.c7 { background: var(--color-playful-green); left: 60%; width:9px; height:9px; --fall-duration: 3.8s; --fall-delay: 1.1s; }

        @keyframes fall {
            0% {
                transform: translateY(-70px) rotate(0deg); /* Start even further UP */
                opacity: 0; 
            }
            10%, 15% { 
                transform: translateY(calc(var(--form-height, 500px) * 0.1)) rotate(72deg); /* Example rotation */
                opacity: 0.7;
            }
            85%, 90% { 
                opacity: 0.7;
            }
            100% {
                transform: translateY(calc(var(--form-height, 500px) + 40px)) rotate(720deg); /* Fall well below card */
                opacity: 0; 
            }
        }

        @media (max-width: 768px) {
            body { padding-top: 120px; }
            .main-nav { padding: 15px 20px; flex-direction: column; gap: 10px; }
            .nav-logo a { font-size: 1.6rem; }
            .nav-links ul { gap: 15px; flex-wrap: wrap; justify-content: center; }
            .nav-links a { font-size: 0.9rem; }
            .nav-links .nav-cta-link { padding: 6px 14px; font-size: 0.9rem; }
            .container { padding: 40px 20px; }
            .section-title { font-size: 2rem; }
            .section-subtitle { font-size: 1rem; margin-bottom: 40px;}
            .contact-form-wrapper { padding: 30px 25px; }
            .contact-form-wrapper::after { height: 40px; }
        }
        @media (max-width: 480px) {
            .submit-button { padding: 14px 30px; font-size: 1rem; }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nav = document.querySelector('.main-nav');
            if (nav) {
                if (window.scrollY > 50) { document.body.classList.add('scrolled'); }
                window.addEventListener('scroll', () => {
                    document.body.classList.toggle('scrolled', window.scrollY > 50);
                });
            }

            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    const href = this.getAttribute('href');
                    if (href.startsWith('#') && href.length > 1 && document.querySelector(href)) {
                         e.preventDefault();
                         document.querySelector(href).scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });

            const contactFormWrapper = document.querySelector('.contact-form-wrapper');
            if (contactFormWrapper) {
                const setFormHeightVar = () => {
                    contactFormWrapper.style.setProperty('--form-height', contactFormWrapper.offsetHeight + 'px');
                };
                setFormHeightVar();
                window.addEventListener('resize', setFormHeightVar); // Update on resize

                const confettiPieces = contactFormWrapper.querySelectorAll('.form-confetti');
                const confettiObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            confettiPieces.forEach(piece => {
                                piece.classList.add('animate-confetti');
                            });
                        } else {
                            confettiPieces.forEach(piece => {
                                piece.classList.remove('animate-confetti');
                            });
                        }
                    });
                }, { threshold: 0.1 }); // Start when 10% of the form is visible
                confettiObserver.observe(contactFormWrapper);
            }
        });
    </script>
