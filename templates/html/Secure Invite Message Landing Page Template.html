<style>
body { font-family: 'Inter', sans-serif; background-color: #030303; }
/* Perspective container for 3D effects */
.perspective-container {
perspective: 1200px;
}
/* Envelope Flap Animation */
.envelope-flap {
transform-origin: top;
transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s linear 0.3s;
transform-style: preserve-3d;
z-index: 40;
}
.envelope-flap.open {
transform: rotateX(180deg);
z-index: 10; /* Moves behind card once open */
transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s linear 0.2s;
}
/* Card Animation */
.card-content {
transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
transform-origin: bottom center;
will-change: transform;
}
.card-content.revealed {
transform: translateY(-160px) scale(1.05);
z-index: 35;
}
/* Ambient Glow */
.ambient-glow {
animation: pulse-glow 6s infinite ease-in-out;
}
@keyframes pulse-glow {
0%, 100% { opacity: 0.3; transform: scale(1); }
50% { opacity: 0.6; transform: scale(1.1); }
}
/* Text Blur Reveal */
.blur-reveal {
animation: blurIn 1s ease forwards;
}
@keyframes blurIn {
0% { filter: blur(8px); opacity: 0; transform: translateY(10px); }
100% { filter: blur(0); opacity: 1; transform: translateY(0); }
}
/* Utilities */
.glass-panel {
background: rgba(255, 255, 255, 0.03);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
border: 1px solid rgba(255, 255, 255, 0.08);
}
</style>

<body class="min-h-screen flex flex-col items-center justify-center overflow-hidden antialiased text-slate-300 bg-background selection:bg-orange-500/30 selection:text-white">

    <!-- Ambient Background -->

        <div class="absolute top-[-20%] left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-orange-600/10 blur-[100px] rounded-full ambient-glow"></div>
        <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-background to-transparent"></div>

    <!-- Main Container -->
    <main class="relative z-10 w-full max-w-lg px-6 flex flex-col items-center">
        
        <!-- Header -->

        <!-- Envelope System -->

            <!-- Glow behind envelope (active on unlock) -->

            <!-- The Secret Card -->
            <div id="secretCard" class="card-content absolute left-3 right-3 bottom-3 top-4 bg-[#111] rounded-xl shadow-2xl z-20 flex flex-col items-center border border-white/10 overflow-hidden">

                    </div>
                    <h2 class="text-lg font-medium text-white mb-3 tracking-tight">Message Decrypted</h2>
                    <div class="w-full h-px bg-white/10 mb-4"></div>
                    <p id="revealedMessage" class="text-sm text-slate-300 leading-relaxed font-light">

                    </p>
                </div>
            </div>

            <!-- Envelope Back -->
            <div class="absolute inset-0 bg-zinc-900 rounded-lg border border-white/5 shadow-2xl z-10"></div>

            <!-- Envelope Flap (The Triangle Top) -->
            <div id="flap" class="envelope-flap absolute top-0 left-0 w-full h-[120px] origin-top">
                <!-- Flap Shape -->
                <div class="w-full h-full bg-zinc-800 rounded-t-lg shadow-lg border-t border-white/10" 
                     style="clip-path: polygon(0 0, 100% 0, 50% 100%); background: linear-gradient(180deg, #27272a 0%, #18181b 100%);">
                </div>
            </div>

            <!-- Envelope Front Pocket -->
            <div class="absolute bottom-0 left-0 w-full h-[130px] z-30 pointer-events-none">
                <div class="w-full h-full bg-zinc-900 rounded-b-lg border border-white/10 shadow-[0_-5px_15px_rgba(0,0,0,0.5)]" 
                     style="clip-path: polygon(0 100%, 0 0, 50% 30%, 100% 0, 100% 100%); background: linear-gradient(0deg, #18181b 0%, #27272a 100%);">
                </div>
            </div>

        </div>

        <!-- Controls: Unlock Interface -->
        <div id="unlockInterface" class="w-full max-w-xs transition-all duration-500 transform translate-y-0 opacity-100">
            <div class="relative group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-orange-500 to-amber-600 rounded-lg blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
                <div class="relative flex items-center bg-surface rounded-lg p-1 border border-white/10 shadow-xl">
                    <div class="pl-3 text-slate-500 flex items-center">
                        <iconify-icon icon="solar:key-minimalistic-linear" class="text-lg"></iconify-icon>
                    </div>
                    <input type="text" placeholder="Passcode" class="border-none placeholder:text-slate-600 focus:ring-0 text-sm text-white tracking-widest font-mono bg-transparent w-full py-2.5 px-3" autocomplete="off" id="passcodeInput">
                    <button onclick="attemptUnlock()" class="bg-white hover:bg-slate-200 text-black text-xs font-semibold py-2 px-4 rounded-[4px] transition-colors shadow-lg" id="unlockBtn">
                        Unlock
                    </button>
                </div>
            </div>
            <p id="errorMsg" class="h-4 mt-2 text-center text-[10px] text-red-500 font-medium opacity-0 transition-opacity">Incorrect code</p>
        </div>

        <!-- Post-Unlock Controls (Hidden by default) -->
        <div id="postUnlockControls" class="w-full max-w-xs flex flex-col gap-3 hidden opacity-0 transition-all duration-500 transform translate-y-4">
            <button onclick="resetEnvelope()" class="w-full glass-panel hover:bg-white/5 text-slate-300 text-xs font-medium py-3 rounded-lg transition-all flex items-center justify-center gap-2 group">
                <iconify-icon icon="solar:refresh-linear" class="text-base group-hover:rotate-180 transition-transform duration-500"></iconify-icon>
                Close Envelope
            </button>
            
            <button onclick="toggleCreateMode()" class="w-full text-xs text-slate-500 hover:text-orange-500 transition-colors py-2">
                Create your own message
            </button>
        </div>

        <!-- Footer Actions -->
        <div class="mt-8 transition-all duration-500" id="createOption">
            <button onclick="toggleCreateMode()" class="text-xs font-medium text-slate-500 hover:text-white transition-colors flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full border border-white/5 hover:border-white/10">
                <iconify-icon icon="solar:add-circle-linear" class="text-sm"></iconify-icon>
                <span>Create & Share New Message</span>
            </button>
        </div>

    </main>

    <!-- Create/Share Modal -->
    <div id="createModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm hidden flex items-center justify-center p-6">
        <div class="bg-[#0A0A0A] border border-white/10 rounded-2xl p-6 w-full max-w-sm shadow-2xl scale-95 opacity-0 transition-all duration-300 transform" id="modalContent">
            
            <!-- Step 1: Create -->
            <div id="stepCreate">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-white font-medium text-sm">New Secure Message</h3>
                    <button onclick="toggleCreateMode()" class="text-slate-500 hover:text-white"><iconify-icon icon="solar:close-circle-linear" class="text-xl"></iconify-icon></button>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] uppercase tracking-wider font-semibold text-slate-500 mb-2">Secret Message</label>
                        <textarea id="newMessage" rows="3" class="w-full bg-zinc-900/50 border border-white/10 rounded-lg p-3 text-sm text-white placeholder:text-slate-700 focus:border-orange-500/50 focus:ring-1 focus:ring-orange-500/50 outline-none transition-all resize-none" placeholder="Write your secret here..."></textarea>
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase tracking-wider font-semibold text-slate-500 mb-2">Unlock Passcode</label>
                        <input type="text" id="newCode" class="w-full bg-zinc-900/50 border border-white/10 rounded-lg p-3 text-sm text-white font-mono placeholder:text-slate-700 focus:border-orange-500/50 focus:ring-1 focus:ring-orange-500/50 outline-none transition-all" placeholder="e.g. 2024">
                    </div>
                    <button onclick="generateLink()" class="w-full bg-white hover:bg-slate-200 text-black text-sm font-medium py-3 rounded-lg transition-all mt-2">
                        Generate Link
                    </button>
                </div>
            </div>

            <!-- Step 2: Share -->
            <div id="stepShare" class="hidden text-center">
                <div class="w-12 h-12 bg-green-500/10 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
                    <iconify-icon icon="solar:link-circle-linear" class="text-2xl"></iconify-icon>
                </div>
                <h3 class="text-white font-medium mb-2">Ready to Share</h3>
                <p class="text-xs text-slate-500 mb-6">Send this link. They will need the code <span id="displayCode" class="text-white font-mono"></span> to open it.</p>
                
                <div class="bg-zinc-900/80 border border-white/10 rounded-lg p-3 mb-4 flex items-center gap-2">
                    <input type="text" id="shareUrl" readonly class="bg-transparent text-xs text-slate-400 w-full outline-none font-mono truncate">
                    <button onclick="copyLink()" class="text-white hover:text-orange-500 text-xs font-medium whitespace-nowrap">Copy</button>
                </div>
                
                <button onclick="toggleCreateMode()" class="text-xs text-slate-500 hover:text-white">Close</button>
            </div>

        </div>
    </div>

    <script>
        // State
        let correctCode = "1234"; 
        let messageText = "Welcome to the secure drop. Create your own link to share encrypted messages.";
        const defaultMessage = messageText;

        // Elements
        const flap = document.getElementById('flap');
        const card = document.getElementById('secretCard');
        const cardInner = document.getElementById('cardInner');
        const glow = document.getElementById('envelopeGlow');
        const unlockInterface = document.getElementById('unlockInterface');
        const postUnlockControls = document.getElementById('postUnlockControls');
        const createOption = document.getElementById('createOption');
        const headerTitle = document.getElementById('headerTitle');
        const messageDisplay = document.getElementById('revealedMessage');
        const input = document.getElementById('passcodeInput');
        const errorMsg = document.getElementById('errorMsg');

        // Check URL for shared data on load
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('d'); // d for data
            
            if (data) {
                try {
                    // Simple Base64 decode (In production use real encryption)
                    const decoded = JSON.parse(atob(data));
                    if(decoded.c && decoded.m) {
                        correctCode = decoded.c;
                        messageText = decoded.m;
                    }
                } catch (e) {
                    console.error("Invalid link");
                }
            }
            // Set message in DOM
            messageDisplay.innerText = messageText;
        });

        // 1. UNLOCK FUNCTION
        function attemptUnlock() {
            const code = input.value.trim();
            
            if (code === correctCode) {
                // UI Cleanup
                errorMsg.style.opacity = '0';
                input.blur();

                // Animation Sequence
                // A. Open Flap
                flap.classList.add('open');

                // B. Hide Inputs / Show Glow
                unlockInterface.style.opacity = '0';
                unlockInterface.style.pointerEvents = 'none';
                createOption.style.opacity = '0';
                createOption.style.pointerEvents = 'none';
                glow.style.opacity = '1';

                // C. Slide Card Out (Delayed to match flap)
                setTimeout(() => {
                    card.classList.add('revealed');
                    
                    // D. Reveal Content inside card
                    setTimeout(() => {
                        cardInner.style.opacity = '1';
                        messageDisplay.classList.add('blur-reveal');
                    }, 300);

                    // E. Show Post-Unlock Controls
                    setTimeout(() => {
                        postUnlockControls.classList.remove('hidden');
                        // Trigger reflow for transition
                        void postUnlockControls.offsetWidth;
                        postUnlockControls.classList.remove('opacity-0', 'translate-y-4');
                    }, 800);

                }, 500); // Wait for flap to open halfway

            } else {
                // Error State
                errorMsg.style.opacity = '1';
                // Shake Animation
                const parent = input.parentElement;
                parent.classList.add('border-red-500/50', 'bg-red-500/5');
                parent.style.transform = 'translateX(-4px)';
                setTimeout(() => parent.style.transform = 'translateX(4px)', 100);
                setTimeout(() => parent.style.transform = 'translateX(-4px)', 200);
                setTimeout(() => parent.style.transform = 'translateX(0)', 300);
                
                setTimeout(() => {
                    parent.classList.remove('border-red-500/50', 'bg-red-500/5');
                }, 1500);
            }
        }

        // 2. RESET FUNCTION
        function resetEnvelope() {
            // Hide post controls
            postUnlockControls.classList.add('opacity-0', 'translate-y-4');
            
            setTimeout(() => {
                postUnlockControls.classList.add('hidden');
                
                // Hide Card Content
                cardInner.style.opacity = '0';
                messageDisplay.classList.remove('blur-reveal');

                // Slide Card Down
                card.classList.remove('revealed');

                setTimeout(() => {
                    // Close Flap
                    flap.classList.remove('open');
                    glow.style.opacity = '0';

                    // Show Inputs again
                    setTimeout(() => {
                        unlockInterface.style.opacity = '1';
                        unlockInterface.style.pointerEvents = 'auto';
                        createOption.style.opacity = '1';
                        createOption.style.pointerEvents = 'auto';
                        input.value = '';
                    }, 400);

                }, 500);
            }, 300);
        }

        // Enter key support
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') attemptUnlock();
        });

        // 3. CREATE & SHARE LOGIC
        const createModal = document.getElementById('createModal');
        const modalContent = document.getElementById('modalContent');
        const stepCreate = document.getElementById('stepCreate');
        const stepShare = document.getElementById('stepShare');

        function toggleCreateMode() {
            const isHidden = createModal.classList.contains('hidden');
            if (isHidden) {
                // Reset Modal State
                stepCreate.classList.remove('hidden');
                stepShare.classList.add('hidden');
                document.getElementById('newMessage').value = '';
                document.getElementById('newCode').value = '';

                createModal.classList.remove('hidden');
                setTimeout(() => {
                    modalContent.classList.remove('scale-95', 'opacity-0');
                    modalContent.classList.add('scale-100', 'opacity-100');
                }, 10);
            } else {
                modalContent.classList.remove('scale-100', 'opacity-100');
                modalContent.classList.add('scale-95', 'opacity-0');
                setTimeout(() => createModal.classList.add('hidden'), 300);
            }
        }

        function generateLink() {
            const msg = document.getElementById('newMessage').value;
            const code = document.getElementById('newCode').value;

            if (!msg || !code) return;

            // Encode data
            const payload = JSON.stringify({ m: msg, c: code });
            const encoded = btoa(payload); // Base64
            
            // Construct URL
            const url = `${window.location.origin}${window.location.pathname}?d=${encoded}`;

            // Update UI
            document.getElementById('shareUrl').value = url;
            document.getElementById('displayCode').innerText = code;
            
            stepCreate.classList.add('hidden');
            stepShare.classList.remove('hidden');
        }

        function copyLink() {
            const urlInput = document.getElementById('shareUrl');
            urlInput.select();
            document.execCommand('copy');
            
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = 'Copied!';
            btn.classList.add('text-green-500');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('text-green-500');
            }, 2000);
        }

    </script>
