<style>
body {

@keyframes animStar {

.bg-grid-pattern {

80%, 100% { transform: scale(2); opacity: 0; }

@keyframes fade-in {

<body class="antialiased relative min-h-screen" style="font-family: 'Inter', sans-serif;">

    <!-- Background Layer -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">

        <div id="stars-small" class="absolute inset-0 w-px h-px bg-transparent" style="animation: animStar 100s linear infinite; box-shadow: 104px 16px #fff, 1470px 1039px #fff, 1862px 1855px #fff, 1170px 1421px #fff, 177px 1835px #fff, 1912px 152px #fff, 1578px 604px #fff, 1232px 247px #fff, 294px 886px #fff, 440px 44px #fff, 1392px 1185px #fff, 747px 359px #fff, 1717px 448px #fff, 1137px 651px #fff, 801px 1606px #fff, 621px 1033px #fff, 754px 1127px #fff, 1813px 703px #fff, 21px 1814px #fff, 1881px 1419px #fff, 1021px 235px #fff, 1343px 794px #fff, 417px 1863px #fff, 528px 1461px #fff, 445px 528px #fff, 1434px 1252px #fff, 438px 1752px #fff, 647px 724px #fff, 983px 1836px #fff, 1792px 1021px #fff;"></div>
        <div id="stars-medium" class="absolute inset-0 w-0.5 h-0.5 bg-transparent" style="animation: animStar 150s linear infinite; box-shadow: 344px 150px #fff, 93px 978px #fff, 1873px 354px #fff, 1432px 866px #fff, 1611px 1565px #fff, 964px 1038px #fff, 447px 783px #fff, 1364px 521px #fff, 579px 1232px #fff, 1849px 470px #fff, 985px 235px #fff, 672px 261px #fff, 1319px 1476px #fff, 320px 690px #fff, 1033px 1873px #fff;"></div>
        <div class="absolute inset-0 bg-grid-pattern z-[1] opacity-60"></div>
        <div class="absolute top-[-10%] left-[20%] w-72 md:w-[500px] h-72 md:h-[500px] rounded-full blur-[100px] mix-blend-screen" style="background: rgba(239, 35, 60, 0.1);"></div>
        <div class="absolute bottom-[10%] right-[10%] w-64 md:w-96 h-64 md:h-96 rounded-full blur-[80px] mix-blend-screen" style="background: rgba(239, 35, 60, 0.05);"></div>
    </div>

    <!-- Main Content -->
    <main class="relative z-10 min-h-screen flex flex-col items-center justify-start px-4 pt-16 md:pt-20 pb-12">

        <!-- Badge -->
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full mb-5 cursor-default" style="border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); backdrop-filter: blur(12px);">
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" style="background: #f87171;"></span>
                <span class="relative inline-flex rounded-full h-2 w-2" style="background: #ef233c;"></span>
            </span>
            <span class="text-xs font-medium tracking-wide" style="font-family: 'Manrope', sans-serif; color: rgba(254, 202, 202, 0.9)">Asistente Online IA</span>
        </div>

        <!-- Heading -->
        <h1 class="sm:text-4xl md:text-5xl lg:text-6xl leading-tight md:leading-tight text-3xl font-semibold tracking-tight text-center max-w-3xl mb-3" style="font-family: 'Manrope', sans-serif; color: #f1f5f9">Atracción de Talento</h1>
        <p class="md:text-lg leading-relaxed text-base font-light text-center max-w-xl mb-8" style="color: rgba(212, 212, 216, 0.8)">Test Bot Reclutamiento</p>

        <!-- Method Selector Buttons -->
        <div class="flex flex-wrap items-center justify-center gap-2 mb-6 w-full max-w-5xl">
            <button onclick="switchMethod(1)" id="btn-m1" class="flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all duration-200" style="font-family: 'Manrope', sans-serif; background: rgba(239, 35, 60, 0.15); border: 1px solid rgba(239, 35, 60, 0.4); color: #fca5a5;">
                <iconify-icon icon="solar:code-square-linear" width="16" style="color: #ef233c;"></iconify-icon>
                Método 1 — plugin.js
            </button>
            <button onclick="switchMethod(2)" id="btn-m2" class="flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all duration-200" style="font-family: 'Manrope', sans-serif; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #a1a1aa;">
                <iconify-icon icon="solar:code-square-linear" width="16" style="color: #71717a;"></iconify-icon>
                Método 2 — plugin.js?v=5
            </button>
            <button onclick="switchMethod(3)" id="btn-m3" class="flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-medium transition-all duration-200" style="font-family: 'Manrope', sans-serif; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #a1a1aa;">
                <iconify-icon icon="solar:monitor-linear" width="16" style="color: #71717a;"></iconify-icon>
                Método 3 — iframe
            </button>

            <!-- Status Indicator -->
            <div id="status-pill" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full ml-2" style="background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);">
                <span id="status-dot" class="w-2 h-2 rounded-full" style="background: #facc15;"></span>
                <span id="status-text" class="text-[10px] font-medium tracking-wide uppercase" style="font-family: 'Manrope', sans-serif; color: #a1a1aa;">Cargando...</span>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="w-full max-w-5xl relative group">
            <div class="absolute -inset-0.5 bg-gradient-to-b from-zinc-700 to-transparent rounded-[14px] opacity-20 blur-sm pointer-events-none"></div>

            <div class="relative w-full rounded-xl overflow-hidden shadow-2xl" style="background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08);">
                <!-- Window Chrome -->
                <div class="h-10 border-b border-white/5 flex items-center px-4 gap-2 bg-black/20">
                    <div class="w-3 h-3 rounded-full bg-red-500/20 border border-red-500/30"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/20 border border-yellow-500/30"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/20 border border-green-500/30"></div>
                    <div class="ml-auto flex items-center gap-2">
                        <span id="method-label" class="text-[10px] uppercase tracking-wider text-zinc-500 font-medium" style="font-family: 'Manrope', sans-serif;">Método 1 · plugin.js</span>
                        <iconify-icon icon="solar:shield-check-linear" class="text-zinc-600" width="14"></iconify-icon>
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="w-full relative overflow-hidden" style="height: 680px;" id="chat-container">
                    <!-- Content injected by JS -->
                </div>
            </div>
        </div>

        <!-- Debug Log Panel -->
        <div class="w-full max-w-5xl mt-4">
            <button onclick="toggleLog()" class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-200 mb-2" style="font-family: 'Manrope', sans-serif; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); color: #71717a;">
                <iconify-icon icon="solar:programming-linear" width="14"></iconify-icon>
                <span>Registro de pruebas</span>
                <iconify-icon icon="solar:alt-arrow-down-linear" width="12" id="log-arrow" style="transition: transform 0.2s;"></iconify-icon>
            </button>
            <div id="log-panel" class="hidden rounded-lg overflow-hidden" style="background: rgba(10, 10, 10, 0.8); border: 1px solid rgba(255,255,255,0.06); backdrop-filter: blur(12px);">
                <div class="p-3 border-b border-white/5 flex items-center justify-between">
                    <span class="text-[10px] uppercase tracking-wider font-medium" style="font-family: 'Manrope', sans-serif; color: #52525b;">Console Output</span>
                    <button onclick="clearLog()" class="text-[10px] uppercase tracking-wider font-medium px-2 py-0.5 rounded" style="color: #71717a; background: rgba(255,255,255,0.04);">Limpiar</button>
                </div>
                <div id="log-content" class="p-3 max-h-48 overflow-y-auto space-y-1" style="font-family: 'SF Mono', 'Fira Code', monospace;">
                </div>
            </div>
        </div>

    </main>

    <script>
        const ACCOUNT_ID = "1197853";
        const CHAT_ID = "Kt7NNxJ8EtiiR";
        const CHAT_COLOR = "#C90707";
        let currentMethod = 0;
        let logVisible = false;

        function log(msg, type = 'info') {
            const el = document.getElementById('log-content');
            const time = new Date().toLocaleTimeString('es-MX', { hour12: false });
            const colors = {
                info: '#60a5fa',
                success: '#4ade80',
                error: '#f87171',
                warn: '#facc15',
                system: '#a78bfa'
            };
            const icons = {
                info: '●',
                success: '✓',
                error: '✗',
                warn: '⚠',
                system: '◆'
            };
            const entry = document.createElement('div');
            entry.className = 'log-entry flex items-start gap-2';
            entry.innerHTML = `
                <span class="text-[10px] shrink-0 mt-px" style="color: #3f3f46;">${time}</span>
                <span class="text-[10px] shrink-0" style="color: ${colors[type]};">${icons[type]}</span>
                <span class="text-[11px] leading-relaxed" style="color: ${type === 'error' ? '#fca5a5' : type === 'success' ? '#bbf7d0' : '#a1a1aa'};">${msg}</span>
            `;
            el.appendChild(entry);
            el.scrollTop = el.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log-content').innerHTML = '';
            log('Registro limpiado', 'system');
        }

        function toggleLog() {
            logVisible = !logVisible;
            document.getElementById('log-panel').classList.toggle('hidden', !logVisible);
            document.getElementById('log-arrow').style.transform = logVisible ? 'rotate(180deg)' : '';
        }

        function setStatus(state, text) {
            const dot = document.getElementById('status-dot');
            const txt = document.getElementById('status-text');
            const colors = {
                loading: '#facc15',
                success: '#4ade80',
                error: '#ef4444',
                idle: '#71717a'
            };
            dot.style.background = colors[state] || colors.idle;
            txt.textContent = text;
        }

        function setActiveButton(n) {
            [1, 2, 3].forEach(i => {
                const btn = document.getElementById(`btn-m${i}`);
                if (i === n) {
                    btn.style.background = 'rgba(239, 35, 60, 0.15)';
                    btn.style.borderColor = 'rgba(239, 35, 60, 0.4)';
                    btn.style.color = '#fca5a5';
                } else {
                    btn.style.background = 'rgba(255,255,255,0.04)';
                    btn.style.borderColor = 'rgba(255,255,255,0.08)';
                    btn.style.color = '#a1a1aa';
                }
            });
        }

        function cleanupCurrentMethod() {
            const container = document.getElementById('chat-container');
            container.innerHTML = '';

            // Remove any previously injected plugin scripts
            document.querySelectorAll('script[data-chatbot-method]').forEach(s => s.remove());

            // Remove any widget elements the plugin might have added to body
            document.querySelectorAll('.ktt10-btn, .ktt10-flt, [id^="ktt10"]').forEach(el => el.remove());

            // Reset ktt10 if it exists
            if (window.ktt10) {
                try { delete window.ktt10; } catch(e) { window.ktt10 = undefined; }
            }
        }

        function switchMethod(n) {
            if (n === currentMethod) return;
            currentMethod = n;
            setActiveButton(n);

            const labels = {
                1: 'Método 1 · plugin.js',
                2: 'Método 2 · plugin.js?v=5',
                3: 'Método 3 · iframe'
            };
            document.getElementById('method-label').textContent = labels[n];

            log(`Cambiando a Método ${n}...`, 'system');
            setStatus('loading', 'Cargando...');
            cleanupCurrentMethod();

            if (n === 1) loadPluginMethod('https://app.chatgptbuilder.io/webchat/plugin.js', 1);
            else if (n === 2) loadPluginMethod('https://app.chatgptbuilder.io/webchat/plugin.js?v=5', 2);
            else if (n === 3) loadIframeMethod();
        }

        function loadPluginMethod(url, methodNum) {
            log(`Cargando script: ${url}`, 'info');

            const container = document.getElementById('chat-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full gap-4 fade-in">
                    <div class="w-10 h-10 rounded-full border-2 border-t-transparent animate-spin" style="border-color: rgba(239,35,60,0.3); border-top-color: transparent;"></div>
                    <div class="text-center">
                        <p class="text-sm font-medium" style="color: #d4d4d8; font-family: 'Manrope', sans-serif;">Inicializando Método ${methodNum}</p>
                        <p class="text-xs mt-1" style="color: #52525b;">Cargando plugin.js${methodNum === 2 ? '?v=5' : ''}...</p>
                    </div>
                </div>
            `;

            const script = document.createElement('script');
            script.src = url;
            script.setAttribute('data-chatbot-method', methodNum);

            const timeout = setTimeout(() => {
                log(`Timeout: El script no respondió en 10s`, 'error');
                setStatus('error', 'Timeout');
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full gap-3 fade-in">
                        <iconify-icon icon="solar:danger-triangle-linear" width="40" style="color: #ef4444;"></iconify-icon>
                        <p class="text-sm font-medium" style="color: #fca5a5; font-family: 'Manrope', sans-serif;">Timeout — sin respuesta</p>
                        <p class="text-xs" style="color: #71717a;">Prueba otro método usando los botones superiores</p>
                    </div>
                `;
            }, 10000);

            script.onload = () => {
                clearTimeout(timeout);
                log(`Script cargado exitosamente`, 'success');

                setTimeout(() => {
                    if (typeof ktt10 !== 'undefined' && ktt10.setup) {
                        log(`ktt10.setup() encontrado, inicializando widget...`, 'info');
                        try {
                            ktt10.setup({
                                id: CHAT_ID,
                                accountId: ACCOUNT_ID,
                                color: CHAT_COLOR
                            });
                            log(`Widget inicializado correctamente ✓`, 'success');
                            setStatus('success', 'Conectado');
                            container.innerHTML = `
                                <div class="flex flex-col items-center justify-center h-full gap-3 fade-in">
                                    <iconify-icon icon="solar:check-circle-linear" width="40" style="color: #4ade80;"></iconify-icon>
                                    <p class="text-sm font-medium" style="color: #bbf7d0; font-family: 'Manrope', sans-serif;">Plugin cargado — Método ${methodNum}</p>
                                    <p class="text-xs text-center px-8" style="color: #71717a;">El widget flotante debe aparecer en la esquina inferior derecha de la página. Haz clic en el botón del chat para interactuar.</p>
                                </div>
                            `;
                        } catch (err) {
                            log(`Error en setup(): ${err.message}`, 'error');
                            setStatus('error', 'Error setup');
                        }
                    } else {
                        log(`ktt10 no disponible después de cargar`, 'warn');
                        setStatus('error', 'Sin ktt10');
                        container.innerHTML = `
                            <div class="flex flex-col items-center justify-center h-full gap-3 fade-in">
                                <iconify-icon icon="solar:close-circle-linear" width="40" style="color: #facc15;"></iconify-icon>
                                <p class="text-sm font-medium" style="color: #fde68a; font-family: 'Manrope', sans-serif;">Script cargado pero ktt10 no detectado</p>
                                <p class="text-xs" style="color: #71717a;">Prueba otro método</p>
                            </div>
                        `;
                    }
                }, 1500);
            };

            script.onerror = (e) => {
                clearTimeout(timeout);
                log(`Error al cargar script: ${url}`, 'error');
                setStatus('error', 'Error carga');
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full gap-3 fade-in">
                        <iconify-icon icon="solar:danger-triangle-linear" width="40" style="color: #ef4444;"></iconify-icon>
                        <p class="text-sm font-medium" style="color: #fca5a5; font-family: 'Manrope', sans-serif;">Error al cargar plugin</p>
                        <p class="text-xs" style="color: #71717a;">El servidor no respondió o el archivo no existe</p>
                    </div>
                `;
            };

            document.body.appendChild(script);
        }

        function loadIframeMethod() {
            log(`Cargando iframe directo...`, 'info');
            const container = document.getElementById('chat-container');
            const iframeUrl = `https://app.chatgptbuilder.io/webchat/?p=${ACCOUNT_ID}&id=${CHAT_ID}`;

            container.innerHTML = `
                <div id="iframe-loader" class="absolute inset-0 flex flex-col items-center justify-center gap-4 z-10 fade-in" style="background: rgba(10,10,10,0.9);">
                    <div class="w-10 h-10 rounded-full border-2 border-t-transparent animate-spin" style="border-color: rgba(239,35,60,0.3); border-top-color: transparent;"></div>
                    <div class="text-center">
                        <p class="text-sm font-medium" style="color: #d4d4d8; font-family: 'Manrope', sans-serif;">Cargando iframe</p>
                        <p class="text-xs mt-1" style="color: #52525b;">${iframeUrl}</p>
                    </div>
                </div>
                <iframe 
                    id="chat-iframe"
                    allow="microphone *" 
                    src="${iframeUrl}" 
                    style="width: 100%; height: 100%; border: none; background: transparent;"
                ></iframe>
            `;

            const iframe = document.getElementById('chat-iframe');
            const loader = document.getElementById('iframe-loader');

            const iframeTimeout = setTimeout(() => {
                log(`Iframe timeout — posible bloqueo`, 'warn');
                if (loader) loader.remove();
                setStatus('warn', 'Carga lenta');
            }, 8000);

            iframe.onload = () => {
                clearTimeout(iframeTimeout);
                if (loader) {
                    loader.style.transition = 'opacity 0.3s';
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 300);
                }
                log(`Iframe cargado exitosamente ✓`, 'success');
                setStatus('success', 'Conectado');
            };

            iframe.onerror = () => {
                clearTimeout(iframeTimeout);
                log(`Error al cargar iframe`, 'error');
                setStatus('error', 'Error iframe');
            };
        }

        // Auto-start with Method 1
        document.addEventListener('DOMContentLoaded', () => {
            log('Sistema de prueba iniciado', 'system');
            log(`Account ID: ${ACCOUNT_ID}`, 'info');
            log(`Chat ID: ${CHAT_ID}`, 'info');
            log('─────────────────────────────', 'system');
            switchMethod(1);
        });
    </script>

</body>
