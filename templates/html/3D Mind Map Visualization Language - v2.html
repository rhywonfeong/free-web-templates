<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI App Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        function updateUserMessage() {
            const inputField = document.getElementById('userInput');
            const userMessageDisplay = document.getElementById('userMessages');
            if(inputField.value.trim()) {
                const newMessage = document.createElement('p');
                newMessage.className = 'text-gray-700 mb-4';
                newMessage.innerHTML = `<strong>User:</strong> ${inputField.value}`;
                userMessageDisplay.appendChild(newMessage);
                inputField.value = '';  // Clear input field
            }
        }
    </script>
</head>
<body class="bg-indigo-400 font-sans leading-normal tracking-normal hue-rotate-0 saturate-100 drop-shadow-lg">
    <div class="container mx-auto px-4 pt-8">
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold text-gray-900">AI App</h1>
                <button class="bg-blue-500 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200">Settings</button>
            </div>
            <div class="bg-gray-200 p-4 rounded-lg mb-6">
                <h2 class="text-lg font-semibold text-gray-700 mb-2">Chat with AI</h2>
                <div id="userMessages" class="bg-white rounded-lg shadow-inner p-4 h-64 overflow-y-scroll">
                    <p class="text-gray-700 mb-4"><strong>AI:</strong> Hello! How can I assist you today?</p>
                </div>
            </div>
            <div class="relative mb-6">
                <input id="userInput" type="text" class="w-full text-gray-900 bg-white rounded-lg shadow-sm p-4 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Type your message" />
                <button onclick="updateUserMessage()" class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-blue-500 text-white px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200">Send</button>
            </div>
            <div class="flex justify-around">
                <button class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200">Help</button>
                <button class="bg-gray-300 text-gray-700 px-4 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-200">Contact Us</button>
            </div>
        </div>
    </div>
</body>
</html>
