<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>General Configuration Options</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white shadow-lg rounded-lg max-w-xl w-full p-8 space-y-8">
    <div class="mb-4">
      <h2 class="text-2xl font-semibold text-gray-800">General Configuration Options</h2>
      <p class="text-gray-500 text-sm mt-1">Edit the project-level settings below.</p>
    </div>
    <!-- Visible Toggle -->
    <div>
      <label class="flex items-center justify-between mb-1">
        <span class="font-medium text-gray-700">Visible</span>
        <span class="text-sm text-gray-400 ml-2">Hide project from filters</span>
      </label>
      <div class="flex items-center">
        <button id="visibleToggle" type="button" aria-pressed="true" class="w-12 h-6 bg-green-500 rounded-full relative transition-colors focus:outline-none">
          <span class="absolute left-0 top-0 w-6 h-6 bg-white rounded-full shadow transform translate-x-6 transition-transform"></span>
        </button>
        <span id="visibleState" class="ml-3 text-green-600 font-medium">Visible</span>
      </div>
    </div>
    <!-- Codification Success Multiselect -->
    <div>
      <label class="block font-medium text-gray-700 mb-1" for="codifications">
        Codification Success
      </label>
      <p class="text-sm text-gray-400 mb-2">Select which codifications correspond to a success in the call.</p>
      <select id="codifications" multiple class="w-full rounded border-gray-300 focus:ring-indigo-500 focus:border-indigo-500">
        <option value="venta" selected>venta</option>
        <option value="venta_online" selected>venta_online</option>
        <option value="no_venta">no_venta</option>
        <option value="cancelada">cancelada</option>
        <option value="pendiente">pendiente</option>
      </select>
      <p class="text-xs text-gray-400 mt-1">Hold Ctrl (Windows) or Command (Mac) to select multiple.</p>
    </div>
    <!-- Enable GenAI Toggle -->
    <div>
      <label class="flex items-center justify-between mb-1">
        <span class="font-medium text-gray-700">Enable GenAI</span>
        <span class="text-sm text-gray-400 ml-2">Allow users to ask about the call in detail views</span>
      </label>
      <div class="flex items-center">
        <button id="genaiToggle" type="button" aria-pressed="true" class="w-12 h-6 bg-green-500 rounded-full relative transition-colors focus:outline-none">
          <span class="absolute left-0 top-0 w-6 h-6 bg-white rounded-full shadow transform translate-x-6 transition-transform"></span>
        </button>
        <span id="genaiState" class="ml-3 text-green-600 font-medium">Enabled</span>
      </div>
    </div>
    <!-- Client Metadata Field Select -->
    <div>
      <label class="block font-medium text-gray-700 mb-1" for="client_metadata">
        Client Metadata Field
      </label>
      <p class="text-sm text-gray-400 mb-2">Select the metadata field used to identify calls belonging to the same client.</p>
      <select id="client_metadata" class="w-full rounded border-gray-300 focus:ring-indigo-500 focus:border-indigo-500">
        <option value="client_id" selected>client_id</option>
        <option value="dni">dni</option>
        <option value="phone_number">phone_number</option>
        <option value="email">email</option>
      </select>
    </div>
    <!-- Save Button -->
    <div class="pt-2 flex justify-end">
      <button class="px-6 py-2 bg-indigo-600 text-white rounded font-medium hover:bg-indigo-700 focus:outline-none">
        Save Configuration
      </button>
    </div>
  </div>
  <script>
    // Visible toggle logic
    const visibleToggle = document.getElementById('visibleToggle');
    const visibleState = document.getElementById('visibleState');
    let visible = true;
    visibleToggle.addEventListener('click', () => {
      visible = !visible;
      visibleToggle.classList.toggle('bg-green-500', visible);
      visibleToggle.classList.toggle('bg-gray-300', !visible);
      visibleToggle.firstElementChild.style.transform = visible ? 'translateX(1.5rem)' : 'translateX(0)';
      visibleState.textContent = visible ? 'Visible' : 'Hidden';
      visibleState.classList.toggle('text-green-600', visible);
      visibleState.classList.toggle('text-gray-500', !visible);
    });
    // Enable GenAI toggle logic
    const genaiToggle = document.getElementById('genaiToggle');
    const genaiState = document.getElementById('genaiState');
    let genaiEnabled = true;
    genaiToggle.addEventListener('click', () => {
      genaiEnabled = !genaiEnabled;
      genaiToggle.classList.toggle('bg-green-500', genaiEnabled);
      genaiToggle.classList.toggle('bg-gray-300', !genaiEnabled);
      genaiToggle.firstElementChild.style.transform = genaiEnabled ? 'translateX(1.5rem)' : 'translateX(0)';
      genaiState.textContent = genaiEnabled ? 'Enabled' : 'Disabled';
      genaiState.classList.toggle('text-green-600', genaiEnabled);
      genaiState.classList.toggle('text-gray-500', !genaiEnabled);
    });
    // Set initial toggle knob positions
    visibleToggle.firstElementChild.style.transform = visible ? 'translateX(1.5rem)' : 'translateX(0)';
    genaiToggle.firstElementChild.style.transform = genaiEnabled ? 'translateX(1.5rem)' : 'translateX(0)';
  </script>
</body>
</html>
