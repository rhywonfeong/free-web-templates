<style>

.app-grid {

padding-bottom: 8rem;
}
@media (min-width: 640px) { .app-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2rem 1rem; } }

/* Icon Styling */
.ios-icon {

}
.dock-glass {

.resize-handle { position: absolute; z-index: 60; touch-action: none; }

@media (min-width: 640px) { .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; } }

            </button>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div class="h-full w-full relative bg-black">
       
        <!-- HEADER -->
        <header class="fixed top-0 left-0 right-0 h-16 px-4 md:px-8 flex items-center justify-between border-b border-white/5 bg-black/80 backdrop-blur-md z-40">
            <div class="flex items-center gap-4">
                <h1 class="text-lg font-bold tracking-tight text-white hidden md:block">LDL15 EXPERIMENTAL <span class="text-xs text-gray-600 ml-1">v23</span></h1>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right leading-tight hidden sm:block">
                    <div class="text-sm font-bold text-white" x-text="time"></div>
                    <div class="text-[10px] font-medium text-gray-500 uppercase tracking-wide" x-text="date"></div>
                </div>
                <div class="flex items-center gap-3">
                    <button @click="handlePlusClick()" class="w-8 h-8 rounded-full bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                        <span class="iconify" data-icon="solar:add-circle-bold-duotone"></span>
                    </button>
                    <button @click="handleProfileClick()" class="w-9 h-9 rounded-full bg-gray-800 border border-white/10 flex items-center justify-center overflow-hidden">
                        <img x-show="user?.photoURL" :src="user?.photoURL" class="w-full h-full object-cover">
                        <span x-show="!user?.photoURL" class="iconify text-xl text-gray-400" data-icon="solar:user-circle-bold-duotone"></span>
                    </button>
                </div>
            </div>
        </header>

        <!-- SNAP PREVIEW ZONE -->
        <div x-show="isDragging && snapPreview" class="snap-zone" :style="`left: ${snapPreview.x}px; top: ${snapPreview.y}px; width: ${snapPreview.w}px; height: ${snapPreview.h}px; opacity: ${snapPreview ? 1 : 0}`"></div>

        <!-- DESKTOP AREA (ICONS) -->
        <main class="absolute inset-0 pt-16 pb-0 overflow-hidden" @touchstart="handleTouchStart" @touchend="handleTouchEnd">
            <!-- Grid View -->
            <div class="h-full w-full relative transition-all duration-300" :class="holisticViewOpen ? 'z-50 bg-black/40 backdrop-blur-xl overflow-y-auto p-10 pt-20 flex flex-wrap justify-center items-center gap-8' : ''">
                 <template x-for="pNum in pageNumbers" :key="pNum">
                    <div x-show="holisticViewOpen || currentPage === pNum" class="transition-all duration-500 ease-out" :class="holisticViewOpen ? 'relative w-[260px] h-[460px] md:w-[300px] md:h-[530px] rounded-3xl border border-white/10 bg-[#111] shadow-2xl cursor-pointer hover:border-indigo-500/50 hover:-translate-y-2' : 'absolute inset-0 overflow-y-auto no-scrollbar p-4 md:p-8'" @click="if(holisticViewOpen) { currentPage = pNum; holisticViewOpen = false; }">
                        <div x-show="holisticViewOpen" class="absolute top-4 left-0 right-0 text-center z-10 pointer-events-none">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest bg-black/80 px-3 py-1.5 rounded-full border border-white/10 shadow-lg" x-text="getPageName(pNum)"></span>
                        </div>
                        <div :class="holisticViewOpen ? 'w-[360%] h-[360%] origin-top-left scale-[0.277] pointer-events-none p-10 pt-24' : 'max-w-7xl mx-auto min-h-full'">

                                        <template x-if="app.type === 'folder'">
                                            <div class="ios-icon flex flex-col z-10 p-0 backdrop-blur-md !bg-opacity-50" :class="app.bgColor || 'bg-[#1a1a1a]'">
                                                <div class="folder-mini-grid">
                                                    <template x-for="subApp in (app.items || []).slice(0, 9)" :key="subApp.id">
                                                        <div class="w-full h-full rounded-[2px] overflow-hidden bg-black/50 flex items-center justify-center">
                                                            <template x-if="subApp.icon.includes('data:') || subApp.icon.includes('http')">
                                                                <img :src="subApp.icon" class="w-full h-full object-cover">
                                                            </template>
                                                            <template x-if="!subApp.icon.includes('data:') &amp;&amp; !subApp.icon.includes('http')">
                                                                <span class="iconify text-[8px] text-white" :data-icon="subApp.icon"></span>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                        <!-- Gallery Icon -->
                                        <template x-if="app.type === 'gallery' || app.id === 'system-gallery'">
                                             <div class="ios-icon flex flex-col z-10 p-0 bg-[#1a1a1a] overflow-hidden flex items-center justify-center">
                                                  <span class="iconify text-3xl text-gray-500" :data-icon="app.icon || 'solar:gallery-bold-duotone'"></span>
                                             </div>

                                        <!-- Normal App Icon -->
                                        <template x-if="app.type !== 'folder' &amp;&amp; app.type !== 'gallery' &amp;&amp; app.id !== 'system-gallery'">

                                                <template x-if="app.icon.includes('data:') || app.icon.includes('http')">
                                                    <img :src="app.icon" class="w-full h-full object-cover pointer-events-none">
                                                </template>
                                                <template x-if="!app.icon.includes('data:') &amp;&amp; !app.icon.includes('http')">
                                                    <span class="iconify text-3xl text-gray-200" :data-icon="app.icon"></span>
                                                </template>
                                            </div>
                                        </template>
                                        <div class="flex flex-col items-center gap-0.5 text-center">

                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                 </template>
            </div>
        </main>

                     @mousedown="focusWindow(win.id)"
                     @touchstart="focusWindow(win.id)">

                    <div class="resize-handle resize-r" @mousedown.stop.prevent="startResize($event, win, 'r')"></div>
                    <div class="resize-handle resize-b" @mousedown.stop.prevent="startResize($event, win, 'b')"></div>
                    <div class="resize-handle resize-br" @mousedown.stop.prevent="startResize($event, win, 'br')"></div>
                    <div class="resize-handle resize-l" @mousedown.stop.prevent="startResize($event, win, 'l')"></div>
                    <div class="resize-handle resize-t" @mousedown.stop.prevent="startResize($event, win, 't')"></div>

                    <!-- Window Header -->
                    <div class="h-10 bg-[#1a1a1a] border-b border-white/5 flex items-center justify-between px-3 cursor-grab active:cursor-grabbing shrink-0 select-none"
                         @mousedown="startDrag($event, win)" @touchstart="startDrag($event, win)" @dblclick="maximizeWindow(win)">
                        <div class="flex items-center gap-2 max-w-[70%]">
                            <div class="flex gap-1.5 mr-2 group">
                                <button @click.stop="closeWindow(win.id)" class="w-3 h-3 rounded-full bg-red-500 hover:bg-red-400 border border-red-600 flex items-center justify-center"><span class="iconify text-[8px] text-black opacity-0 group-hover:opacity-100" data-icon="solar:close-circle-bold"></span></button>
                                <button @click.stop="minimizeWindow(win.id)" class="w-3 h-3 rounded-full bg-yellow-500 hover:bg-yellow-400 border border-yellow-600 flex items-center justify-center"><span class="iconify text-[8px] text-black opacity-0 group-hover:opacity-100" data-icon="solar:minimize-bold"></span></button>
                                <button @click.stop="maximizeWindow(win)" class="w-3 h-3 rounded-full bg-green-500 hover:bg-green-400 border border-green-600 flex items-center justify-center"><span class="iconify text-[8px] text-black opacity-0 group-hover:opacity-100" data-icon="solar:maximize-bold"></span></button>
                            </div>
                            <span class="text-xs font-bold text-gray-300 truncate" x-text="win.title"></span>
                        </div>
                    </div>

                    <!-- Window Content -->
                    <div class="flex-1 relative bg-[#0f0f0f] overflow-hidden">
                        <!-- Drag Overlay (prevents iframe capture) -->
                        <div x-show="isDragging || isResizing" class="absolute inset-0 z-50 bg-transparent"></div>

                        <!-- 1. IFRAME CONTENT (Apps/Code/Internal) -->
                        <template x-if="win.contentType === 'iframe'">
                             <div class="w-full h-full flex flex-col">
                                <template x-if="win.appData.type === 'code'">
                                     <iframe :srcdoc="win.appData.code" class="w-full h-full border-none bg-white"></iframe>
                                </template>
                                <template x-if="win.appData.type !== 'code'">
                                     <div class="w-full h-full relative">
                                        <iframe :src="win.url" class="w-full h-full border-none" allow="camera; microphone; geolocation" sandbox="allow-forms allow-scripts allow-same-origin allow-popups"></iframe>

                                                <span>Open in Tab</span>
                                                <span class="iconify" data-icon="solar:arrow-right-up-bold"></span>
                                            </a>
                                        </div>
                                     </div>
                                </template>
                            </div>
                        </template>

                        <!-- 2. FOLDER CONTENT -->
                        <template x-if="win.contentType === 'folder'">
                            <div class="w-full h-full overflow-y-auto p-4 custom-scrollbar bg-[#0a0a0a]">
                                <div class="grid grid-cols-4 sm:grid-cols-5 gap-4" :id="'folder-sortable-' + win.id">
                                     <template x-for="item in win.appData.items || []" :key="item.id">
                                        <div :data-id="item.id" class="flex flex-col items-center gap-2 cursor-pointer group hover:bg-white/5 p-2 rounded-xl transition-colors" @click="handleAppClick($event, item)">
                                             <div class="w-12 h-12 rounded-[10px] bg-[#222] border border-gray-700 flex items-center justify-center overflow-hidden">
                                                 <template x-if="item.icon.includes('data:') || item.icon.includes('http')">
                                                    <img :src="item.icon" class="w-full h-full object-cover">
                                                </template>
                                                <template x-if="!item.icon.includes('data:') &amp;&amp; !item.icon.includes('http')">
                                                    <span class="iconify text-2xl text-white" :data-icon="item.icon"></span>
                                                </template>
                                             </div>
                                             <span class="text-[10px] text-gray-300 text-center truncate w-full" x-text="item.name"></span>
                                        </div>
                                     </template>
                                </div>
                            </div>
                        </template>

                        <!-- 3. GALLERY CONTENT -->
                        <template x-if="win.contentType === 'gallery'">
                            <div class="w-full h-full overflow-y-auto p-4 custom-scrollbar bg-black" x-data="{ items: getGalleryItems(win.appData.id) }">
                                <div class="flex justify-between items-center mb-4">
                                    <span class="text-xs font-bold text-gray-500 uppercase" x-text="items.length + ' Items'"></span>
                                    <label class="cursor-pointer px-3 py-1 bg-gray-800 rounded-lg text-xs font-bold hover:bg-gray-700 flex items-center gap-2">
                                        <span class="iconify" data-icon="solar:upload-bold-duotone"></span> Upload
                                        <input type="file" multiple="" accept="image/*,video/*" class="hidden" @change="uploadToGallery($event, win.appData.id)">
                                    </label>
                                </div>
                                <div class="gallery-grid">
                                    <template x-for="gItem in items" :key="gItem.id">
                                        <div class="aspect-square rounded-lg bg-gray-900 border border-white/10 overflow-hidden relative group cursor-pointer" @click="viewImage = gItem">
                                            <template x-if="gItem.type === 'video'">
                                                <video :src="gItem.data" class="w-full h-full object-cover"></video>
                                            </template>
                                            <template x-if="gItem.type !== 'video'">
                                                <img :src="gItem.data" class="w-full h-full object-cover">
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <!-- 4. NOTE CONTENT -->

                                                <span class="iconify text-xl text-gray-400" data-icon="solar:file-bold-duotone"></span>
                                                <span class="text-xs text-white truncate" x-text="file.name"></span>
                                            </a>
                                        </template>
                                    </div>
                                </template>
                                <button @click="window.open(win.appData.url, '_blank')" class="w-full py-2 bg-indigo-600 rounded-lg font-bold text-sm">Open Original URL</button>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- DOCK SYSTEM (Behind Holistic Button) -->

                 <template x-for="win in windows" :key="win.id">
                    <button @click="toggleWindow(win.id)" class="relative group w-10 h-10 rounded-[10px] flex items-center justify-center transition-all hover:-translate-y-2 hover:scale-110" :class="win.minimized ? 'opacity-50 grayscale' : 'bg-white/10'">
                        <div class="w-full h-full rounded-[10px] overflow-hidden border border-white/10">
                            <template x-if="win.icon.includes('solar:') || win.icon.includes('logos:')">
                                <div class="w-full h-full flex items-center justify-center bg-[#222]">
                                    <span class="iconify text-xl text-white" :data-icon="win.icon"></span>
                                </div>
                            </template>
                            <template x-if="!win.icon.includes('solar:') && !win.icon.includes('logos:')">
                                <img :src="win.icon" class="w-full h-full object-cover">
                            </template>
                        </div>
                        <!-- Active Indicator -->
                        <div class="absolute -bottom-1 w-1 h-1 rounded-full bg-white shadow-glow"></div>
                        <!-- Tooltip -->
                        <div class="absolute -top-8 bg-gray-900 border border-gray-700 text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity truncate max-w-[100px]" x-text="win.title"></div>
                    </button>
                 </template>
                 <!-- Separator if holistic button is near -->
                 <div class="w-16"></div> 
            </div>
        </div>

        <!-- HOLISTIC BUTTON (Overlays Dock) -->
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] pointer-events-auto transform translate-y-1">
             <button @click="toggleHolistic()" class="group relative flex items-center justify-center w-14 h-14 bg-[#1a1a1a]/90 backdrop-blur-xl border border-white/20 rounded-2xl shadow-2xl hover:bg-white/20 hover:scale-105 active:scale-95 transition-all duration-300 overflow-hidden">
                <span class="iconify text-2xl text-white transition-transform duration-500 relative z-10" :class="holisticViewOpen ? 'rotate-180' : ''" :data-icon="holisticViewOpen ? 'solar:minimize-square-bold-duotone' : 'solar:widget-5-bold-duotone'"></span>
            </button>
        </div>

        <!-- LIGHTBOX -->
        <div x-show="viewImage" class="fixed inset-0 z-[200] bg-black/95 backdrop-blur-xl flex flex-col" x-cloak="">
             <button @click="viewImage = null" class="absolute top-4 right-4 p-2 rounded-full bg-gray-800 text-white z-50"><span class="iconify text-2xl" data-icon="solar:close-circle-bold"></span></button>
            <div class="flex-1 flex items-center justify-center p-4">
                <template x-if="viewImage?.type === 'video'">
                     <video :src="viewImage.data" controls="" autoplay="" class="max-w-full max-h-full rounded-lg"></video>
                </template>
                <template x-if="viewImage?.type !== 'video'">
                    <img :src="viewImage?.data" class="max-w-full max-h-full object-contain rounded-lg">
                </template>
            </div>
        </div>
        
        <!-- PAGINATION (Hidden if holistic) -->
        <div x-show="viewMode === 'grid' && !holisticViewOpen" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-40 flex gap-2 p-2 bg-black/40 backdrop-blur-xl rounded-full border border-white/10 shadow-xl" x-cloak="">
            <template x-for="pNum in pageNumbers" :key="pNum">
                <div class="w-2 h-2 rounded-full transition-all duration-300 cursor-pointer shadow-lg" :class="currentPage === pNum ? 'bg-white w-4' : 'bg-gray-600'" @click="currentPage = pNum"></div>
            </template>
        </div>

        <!-- CREATE MENU (Simplified for V23) -->
        <div x-show="createMenuOpen" class="fixed inset-0 z-[100] flex items-center justify-center p-4" x-cloak="">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="createMenuOpen = false"></div>
            <div class="relative w-full max-w-sm bg-[#111] border border-gray-800 rounded-3xl p-6 shadow-2xl">
                <h2 class="text-lg font-bold text-white mb-4">Add New</h2>
                <div class="grid grid-cols-2 gap-3">
                    <button @click="openModal('add'); createMenuOpen=false" class="p-4 rounded-xl bg-gray-900 hover:bg-gray-800 text-white text-center font-bold">App</button>
                    <button @click="selectCreateType('folder')" class="p-4 rounded-xl bg-gray-900 hover:bg-gray-800 text-white text-center font-bold">Folder</button>
                    <button @click="selectCreateType('gallery')" class="p-4 rounded-xl bg-gray-900 hover:bg-gray-800 text-white text-center font-bold">Gallery</button>
                    <button @click="selectCreateType('code')" class="p-4 rounded-xl bg-gray-900 hover:bg-gray-800 text-white text-center font-bold">Widget</button>
                </div>
            </div>
        </div>

        <!-- CONTEXT MENU (Keep v22 Logic) -->
        <div x-show="contextOpen" @click.outside="contextOpen = false" class="fixed z-[150] w-56 bg-[#111] border border-gray-800 rounded-xl shadow-2xl py-1.5 backdrop-blur-xl" :style="`top: ${contextPos.y}px; left: ${contextPos.x}px`">
            <button @click="launchApp(contextApp); contextOpen=false" class="w-full px-4 py-2 text-left text-sm text-white hover:bg-indigo-600">Open Window</button>
            <div class="h-px bg-gray-800 my-1"></div>
            <button @click="openModal('edit', contextApp); contextOpen=false" class="w-full px-4 py-2 text-left text-xs text-gray-300 hover:bg-gray-800">Edit</button>
            <button @click="deleteApp(contextApp); contextOpen=false" class="w-full px-4 py-2 text-left text-xs text-red-400 hover:bg-gray-800">Delete</button>
        </div>
        
        <!-- EDIT/ADD MODAL (Simplified Overlay) -->
        <div x-show="modalOpen" class="fixed inset-0 z-[110] flex items-center justify-center p-4">
             <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" @click="closeModal"></div>
             <div class="relative w-full max-w-lg bg-[#111] border border-gray-800 rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                 <h2 class="text-xl font-bold mb-4" x-text="modalMode === 'add' ? 'Add Item' : 'Edit Item'"></h2>
                 <div class="space-y-4">
                     <input type="text" x-model="modalData.name" placeholder="Name" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-white outline-none">
                     <template x-if="modalData.type !== 'folder' && modalData.type !== 'gallery' && modalData.type !== 'code'">
                        <input type="url" x-model="modalData.url" placeholder="URL" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-white outline-none">
                     </template>
                      <template x-if="modalData.type === 'code'">
                        <textarea x-model="modalData.code" placeholder="HTML Code" rows="5" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm font-mono focus:border-white outline-none"></textarea>
                     </template>
                     <input type="text" x-model="modalData.icon" placeholder="Icon (URL or iconify name)" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm focus:border-white outline-none">
                     <button @click="saveModal" class="w-full py-3 bg-white text-black font-bold rounded-xl">Save</button>
                 </div>
             </div>
        </div>

    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCo0Rq6eABM3Q6le_x9VjskDCCAg1XUl8A", authDomain: "livedesklauncher.firebaseapp.com", projectId: "livedesklauncher", databaseURL: "https://livedesklauncher-default-rtdb.europe-west1.firebasedatabase.app", storageBucket: "livedesklauncher.firebasestorage.app", messagingSenderId: "719865623018", appId: "1:719865623018:web:104315b70c32db5bd4c293" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        const DEFAULT_APPS = [
            { id: 'app1', name: 'Google', url: 'https://www.google.com/webhp?igu=1', icon: 'logos:google-icon', category: 'Google', index: 0 },
            { id: 'system-gallery', name: 'Photos', type: 'gallery', icon: 'solar:gallery-bold-duotone', category: 'System', index: 1 },
            { id: 'calc', name: 'Calculator', type: 'code', code: '<style>body{display:flex;justify-content:center;align-items:center;height:100%;background:#000;color:#fff;font-family:sans-serif}input{width:100%;padding:10px;margin-bottom:10px;background:#222;border:none;color:#fff;font-size:20px;text-align:right}button{width:23%;height:50px;margin:1%;border:none;border-radius:5px;font-size:18px;cursor:pointer;background:#333;color:#fff}button.op{background:#f90;color:#000}</style><div style="width:200px"><input id="d" readonly><br><button onclick="a(7)">7</button><button onclick="a(8)">8</button><button onclick="a(9)">9</button><button class="op" onclick="a(\'/\')">/</button><br><button onclick="a(4)">4</button><button onclick="a(5)">5</button><button onclick="a(6)">6</button><button class="op" onclick="a(\'*\')">*</button><br><button onclick="a(1)">1</button><button onclick="a(2)">2</button><button onclick="a(3)">3</button><button class="op" onclick="a(\'-\')">-</button><br><button onclick="a(0)">0</button><button onclick="c()">C</button><button onclick="e()">=</button><button class="op" onclick="a(\'+\')">+</button></div><script>function a(v){document.getElementById("d").value+=v}function c(){document.getElementById("d").value=""}function e(){try{document.getElementById("d").value=eval(document.getElementById("d").value)}catch{document.getElementById("d").value="Err"}}<\/script>', icon: 'solar:calculator-bold-duotone', category: 'Widget', index: 2 }
        ];

        document.addEventListener('alpine:init', () => {
            Alpine.data('livedesk', () => ({
                user: null, authModalOpen: false, authLoading: false,
                apps: [], windows: [], galleryItems: [], pageNames: {},
                viewMode: 'grid', currentPage: 0, holisticViewOpen: false,
                time: '', date: '', 
                
                // Context & Modals
                createMenuOpen: false, contextOpen: false, contextApp: null, contextPos: {x:0,y:0},
                modalOpen: false, modalMode: 'add', modalData: {},
                viewImage: null,
                
                // Window Management State
                zCounter: 100,
                isDragging: false,
                isResizing: false,
                dragOffset: { x:0, y:0 },
                activeResizeDir: null,
                activeWinId: null,
                snapPreview: null, // {x, y, w, h} or null

                init() {
                    this.updateTime(); setInterval(() => this.updateTime(), 1000);
                    const localApps = localStorage.getItem('ldl_apps');
                    this.processApps(localApps ? JSON.parse(localApps) : DEFAULT_APPS);
                    const localGal = localStorage.getItem('ldl_gallery_v6');
                    this.galleryItems = localGal ? JSON.parse(localGal) : [];
                    
                    auth.onAuthStateChanged(u => {
                        this.user = u;
                        if(u) {
                            db.ref(`users/${u.uid}/apps`).on('value', s => this.processApps(s.val() || DEFAULT_APPS));
                            db.ref(`users/${u.uid}/gallery_v6`).on('value', s => this.galleryItems = s.val() || []);
                        }
                    });
                },

                // --- APP LOGIC ---
                processApps(data) {
                    this.apps = data.map((a,i) => ({...a, index: a.index ?? i})).sort((a,b) => (a.page||0)-(b.page||0) || a.index-b.index);
                    this.$nextTick(() => this.initSortable());
                },
                saveApps() {
                    if(this.user) db.ref(`users/${this.user.uid}/apps`).set(this.apps);
                    else localStorage.setItem('ldl_apps', JSON.stringify(this.apps));
                },
                getAppsForPage(p) { return this.apps.filter(a => (a.page||0)===p); },
                get pageNumbers() { const m = Math.max(...this.apps.map(a=>a.page||0), 0); return Array.from({length:m+1},(_,i)=>i); },
                updateTime() { const n=new Date(); this.time=n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); this.date=n.toLocaleDateString('en-GB',{day:'numeric',month:'short'}); },
                
                // --- WINDOW MANAGEMENT (V23 CORE) ---
                handleAppClick(e, app) { this.launchApp(app); },
                
                launchApp(app) {
                    if(this.windows.find(w => w.appId === app.id)) {
                        const win = this.windows.find(w => w.appId === app.id);
                        this.toggleWindow(win.id);
                        return;
                    }
                    // Determine Type
                    let contentType = 'iframe';
                    if(app.type === 'folder') contentType = 'folder';
                    else if(app.type === 'gallery' || app.id === 'system-gallery') contentType = 'gallery';
                    else if(app.note || (app.attachments && app.attachments.length)) contentType = 'note';

                    // Default geometry
                    const w = Math.min(window.innerWidth * 0.9, 800);
                    const h = Math.min(window.innerHeight * 0.8, 600);
                    const x = (window.innerWidth - w) / 2 + (this.windows.length * 20);
                    const y = (window.innerHeight - h) / 2 + (this.windows.length * 20);

                    const newWin = {
                        id: Date.now(),
                        appId: app.id,
                        title: app.name,
                        icon: app.icon || 'solar:window-frame-bold-duotone',
                        contentType: contentType,
                        appData: app, // Store full app data for rendering
                        url: app.url,
                        x: x, y: y, w: w, h: h,
                        z: ++this.zCounter,
                        minimized: false,
                        maximized: false,
                        preMax: null // store geometry before maximize
                    };
                    this.windows.push(newWin);
                },

                toggleWindow(id) {
                    const win = this.windows.find(w => w.id === id);
                    if(win.minimized) {
                        win.minimized = false;
                        this.focusWindow(id);
                    } else if (win.z === this.zCounter) {
                        // If top, minimize
                        win.minimized = true;
                    } else {
                        // If not top, bring to front
                        this.focusWindow(id);
                    }
                },
                focusWindow(id) {
                    const win = this.windows.find(w => w.id === id);
                    if(win) {
                        win.z = ++this.zCounter;
                        this.activeWinId = id;
                    }
                },
                closeWindow(id) {
                    this.windows = this.windows.filter(w => w.id !== id);
                },
                maximizeWindow(win) {
                    if(win.maximized) {
                        // Restore
                        win.x = win.preMax.x; win.y = win.preMax.y; win.w = win.preMax.w; win.h = win.preMax.h;
                        win.maximized = false;
                    } else {
                        // Maximize
                        win.preMax = { x: win.x, y: win.y, w: win.w, h: win.h };
                        win.x = 0; win.y = 64; // Below Header
                        win.w = window.innerWidth; win.h = window.innerHeight - 64 - 80; // Minus header and dock space
                        win.maximized = true;
                    }
                    this.focusWindow(win.id);
                },
                minimizeWindow(id) {
                    const win = this.windows.find(w => w.id === id);
                    if(win) win.minimized = true;
                },

                // --- DRAG & RESIZE LOGIC ---
                startDrag(e, win) {
                    if(win.maximized) return;
                    this.isDragging = true;
                    this.activeWinId = win.id;
                    this.focusWindow(win.id);
                    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                    this.dragOffset = { x: clientX - win.x, y: clientY - win.y };
                },
                startResize(e, win, dir) {
                    this.isResizing = true;
                    this.activeWinId = win.id;
                    this.activeResizeDir = dir;
                    this.focusWindow(win.id);
                    this.dragOffset = { 
                        x: e.type.includes('touch') ? e.touches[0].clientX : e.clientX,
                        y: e.type.includes('touch') ? e.touches[0].clientY : e.clientY,
                        winX: win.x, winY: win.y, winW: win.w, winH: win.h
                    };
                },
                onMouseMove(e) {
                    const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                    const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

                    // DRAGGING + SNAPPING PREVIEW
                    if (this.isDragging && this.activeWinId) {
                        const win = this.windows.find(w => w.id === this.activeWinId);
                        win.x = clientX - this.dragOffset.x;
                        win.y = clientY - this.dragOffset.y;
                        
                        // Snap Logic
                        const edgeThreshold = 30;
                        const headerH = 64;
                        this.snapPreview = null;

                        if (clientY < edgeThreshold + headerH) {
                            // Top Snap (Full)
                            this.snapPreview = { x: 0, y: headerH, w: window.innerWidth, h: window.innerHeight - headerH - 80 };
                        } else if (clientX < edgeThreshold) {
                            // Left Snap (Half)
                            this.snapPreview = { x: 0, y: headerH, w: window.innerWidth/2, h: window.innerHeight - headerH - 80 };
                        } else if (clientX > window.innerWidth - edgeThreshold) {
                            // Right Snap (Half)
                            this.snapPreview = { x: window.innerWidth/2, y: headerH, w: window.innerWidth/2, h: window.innerHeight - headerH - 80 };
                        }
                    }

                    // RESIZING
                    if (this.isResizing && this.activeWinId) {
                         const win = this.windows.find(w => w.id === this.activeWinId);
                         const dx = clientX - this.dragOffset.x;
                         const dy = clientY - this.dragOffset.y;
                         
                         if(this.activeResizeDir.includes('r')) win.w = Math.max(300, this.dragOffset.winW + (clientX - this.dragOffset.x));
                         if(this.activeResizeDir.includes('b')) win.h = Math.max(200, this.dragOffset.winH + (clientY - this.dragOffset.y));
                         if(this.activeResizeDir.includes('l')) {
                             const newW = Math.max(300, this.dragOffset.winW - (clientX - this.dragOffset.x));
                             win.x = this.dragOffset.winX + (this.dragOffset.winW - newW);
                             win.w = newW;
                         }
                         if(this.activeResizeDir.includes('t')) {
                             const newH = Math.max(200, this.dragOffset.winH - (clientY - this.dragOffset.y));
                             win.y = this.dragOffset.winY + (this.dragOffset.winH - newH);
                             win.h = newH;
                         }
                    }
                },
                endResizeOrDrag() {
                    if (this.isDragging && this.snapPreview && this.activeWinId) {
                        const win = this.windows.find(w => w.id === this.activeWinId);
                        win.preMax = { x: win.x, y: win.y, w: win.w, h: win.h }; // Save state
                        win.x = this.snapPreview.x;
                        win.y = this.snapPreview.y;
                        win.w = this.snapPreview.w;
                        win.h = this.snapPreview.h;
                    }
                    this.isDragging = false;
                    this.isResizing = false;
                    this.activeWinId = null;
                    this.snapPreview = null;
                },

                // --- UTILS ---
                toggleHolistic() { this.holisticViewOpen = !this.holisticViewOpen; },
                handlePlusClick() { this.createMenuOpen = true; },
                getPageName(i) { return this.pageNames[i] || `PAGE ${i+1}`; },
                getGalleryItems(gId) { return this.galleryItems.filter(i => (i.galleryId||'system-gallery') === gId); },
                uploadToGallery(e, gId) {
                     Array.from(e.target.files).forEach(f => {
                         const r = new FileReader();
                         r.onload = (ev) => {
                             this.galleryItems.push({ id: Date.now() + Math.random(), galleryId: gId, type: f.type.startsWith('video')?'video':'image', data: ev.target.result, date: Date.now() });
                             if(this.user) db.ref(`users/${this.user.uid}/gallery_v6`).set(this.galleryItems);
                             else localStorage.setItem('ldl_gallery_v6', JSON.stringify(this.galleryItems));
                         };
                         r.readAsDataURL(f);
                     });
                },
                
                // --- SORTABLE ---
                initSortable() {
                    document.querySelectorAll('.sortable-grid').forEach(el => {
                        if(el._sortable) el._sortable.destroy();
                        el._sortable = new Sortable(el, {
                            group: 'apps', delay: 200, delayOnTouchOnly: true,
                            onEnd: (evt) => {
                                // Simple reorder logic for brevity
                                const fromP = parseInt(evt.from.dataset.page);
                                const toP = parseInt(evt.to.dataset.page);
                                const item = this.apps.find(a=>a.id === evt.item.dataset.id);
                                if(item) { item.page = toP; this.saveApps(); }
                            }
                        });
                    });
                },
                
                // --- CONTEXT ---
                openContext(e, app) {
                     e.preventDefault();
                     this.contextApp = app;
                     this.contextPos = { x: Math.min(e.clientX, window.innerWidth-230), y: Math.min(e.clientY, window.innerHeight-200) };
                     this.contextOpen = true;
                },
                deleteApp(app) {
                    if(confirm("Delete?")) {
                        this.apps = this.apps.filter(a => a.id !== app.id);
                        this.saveApps();
                    }
                },
                // --- CREATE/MODAL ---
                selectCreateType(t) { this.openModal('add'); this.modalData.type = t; this.createMenuOpen=false; },
                openModal(mode, data) {
                    this.modalMode = mode;
                    this.modalData = mode==='add' ? {id:'app_'+Date.now(), name:'', page:this.currentPage, index:999, type:'app'} : {...data};
                    this.modalOpen = true;
                },
                saveModal() {
                    if(this.modalMode==='add') this.apps.push(this.modalData);
                    else { const i = this.apps.findIndex(a=>a.id===this.modalData.id); if(i>-1) this.apps[i]=this.modalData; }
                    this.saveApps(); this.closeModal();
                },
                closeModal() { this.modalOpen = false; },
                signInGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); },
                handleProfileClick() { if(this.user) { if(confirm('Logout?')) auth.signOut(); } else this.authModalOpen=true; }
            }));
        });
    </script>
