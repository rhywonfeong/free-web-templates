    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dots Animation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .dots-container {
            background: #000;
            position: relative;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        .dot {
            position: absolute;
            border-radius: 50%;
            background: white;
            transform-origin: center;
            animation: pulse 3.8s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(0.9); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('dots-container');
            const containerRect = container.getBoundingClientRect();
            const dotCount = 1500;
            
            for (let i = 0; i < dotCount; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                
                // Calculate position in a grid with slight randomization
                const col = i % 50;
                const row = Math.floor(i / 50);
                
                // Dots are now 2x smaller
                const size = Math.random() * 2 + 1;
                const xPos = (col / 50) * containerRect.width + (Math.random() * 10 - 5);
                const yPos = (row / 30) * containerRect.height + (Math.random() * 10 - 5) + ((i % 2) * 5);
                
                // Set dot properties
                dot.style.width = `${size}px`;
                dot.style.height = `${size}px`;
                dot.style.left = `${xPos}px`;
                dot.style.top = `${yPos}px`;
                
                // Add randomized animation delay
                dot.style.animationDelay = `${Math.random() * 3.8}s`;
                
                container.appendChild(dot);
            }
            
            // Add mouse interaction
            container.addEventListener('mousemove', (e) => {
                const mouseX = e.clientX;
                const mouseY = e.clientY;
                
                document.querySelectorAll('.dot').forEach(dot => {
                    const dotRect = dot.getBoundingClientRect();
                    const dotX = dotRect.left + dotRect.width/2;
                    const dotY = dotRect.top + dotRect.height/2;
                    
                    const distance = Math.sqrt(Math.pow(mouseX - dotX, 2) + Math.pow(mouseY - dotY, 2));
                    const maxDistance = 100;
                    
                    if (distance < maxDistance) {
                        const scale = 1 + (1 - distance/maxDistance) * 0.5;
                        dot.style.transform = `scale(${scale})`;
                        dot.style.zIndex = "10";
                    }
                });
            });
            
            // Reset on mouse leave
            container.addEventListener('mouseleave', () => {
                document.querySelectorAll('.dot').forEach(dot => {
                    dot.style.transform = "";
                    dot.style.zIndex = "";
                });
            });
        });
    </script>
</head>
<body class="bg-black m-0 p-0">
    <div id="dots-container" class="dots-container"></div>
</body>
</html>
