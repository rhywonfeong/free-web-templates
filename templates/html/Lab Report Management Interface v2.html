<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0f172a" />
<title>Lab Reports</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script></head>
  <body class="antialiased bg-slate-50 text-slate-900 font-sans">
    <!-- App Shell -->
    <div class="min-h-screen flex flex-col">

      <!-- Top Navigation -->
      <header class="sticky top-0 z-50 bg-white/80 backdrop-blur supports-[backdrop-filter]:bg-white/60 border-b border-slate-200">
        <div class="max-w-3xl mx-auto px-4 sm:px-6">
          <div class="h-12 sm:h-14 flex items-center justify-between">
            <button id="backBtn" class="inline-flex items-center justify-center h-9 w-9 rounded-md hover:bg-slate-100 active:bg-slate-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-300" aria-label="Back">
              <i data-lucide="chevron-left" class="w-5 h-5"></i>
            </button>
            <h1 class="text-[22px] leading-6 tracking-tight font-semibold">Lab Reports</h1>
            <button id="toggleSearch" class="inline-flex items-center justify-center h-9 w-9 rounded-md hover:bg-slate-100 active:bg-slate-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-300" aria-expanded="false" aria-controls="searchBar" aria-label="Search">
              <i data-lucide="search" class="w-5 h-5"></i>
            </button>
          </div>
          <!-- Search Bar (collapsible) -->
          <div id="searchBar" class="overflow-hidden transition-[max-height,opacity] duration-300 ease-out max-h-0 opacity-0">
            <div class="pb-3">
              <label class="relative block">
                <span class="sr-only">Search reports</span>
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input id="searchInput" type="search" placeholder="Search by name or description..." class="w-full rounded-lg border border-slate-300 bg-white pl-10 pr-3 py-2 text-[15px] placeholder:text-slate-400 outline-none focus:ring-4 focus:ring-slate-200 focus:border-slate-400"/>
              </label>
            </div>
          </div>
        </div>
      </header>

      <!-- Pull to Refresh Indicator -->
      <div id="ptr" class="max-w-3xl mx-auto px-4 sm:px-6 w-full">
        <div id="ptrIndicator" class="text-center text-sm text-slate-500 overflow-hidden transition-[height,opacity] duration-200 ease-out h-0 opacity-0">
          <div class="flex items-center justify-center gap-2 py-2">
            <i data-lucide="refresh-ccw" class="w-4 h-4"></i>
            <span id="ptrText">Pull to refresh</span>
          </div>
        </div>
      </div>

      <!-- Content -->
      <main id="content" class="flex-1">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 pt-4 pb-28 sm:pb-28 space-y-4" id="listContainer" style="padding-bottom: calc(env(safe-area-inset-bottom) + 7rem);">
          <!-- List rendered here -->
        </div>
      </main>

      <!-- Floating Add Button -->
      <button id="fabAdd" class="fixed right-5 sm:right-6 inline-flex items-center justify-center w-14 h-14 rounded-full bg-slate-900 text-white shadow-lg shadow-slate-900/10 ring-1 ring-black/10 hover:bg-slate-800 active:scale-95 transition focus:outline-none focus-visible:ring-4 focus-visible:ring-slate-300" style="bottom: calc(env(safe-area-inset-bottom) + 24px);">
        <i data-lucide="plus" class="w-6 h-6"></i>
        <span class="sr-only">Add Lab Report</span>
      </button>
    </div>

    <!-- Add/Update Report Modal -->
    <div id="reportModal" class="fixed inset-0 z-[60] hidden">
      <div class="absolute inset-0 bg-black/40"></div>
      <div class="absolute inset-x-0 bottom-0 md:inset-0 md:flex md:items-center md:justify-center">
        <div class="bg-white md:rounded-xl md:shadow-2xl md:border md:border-slate-200 w-full md:max-w-xl md:w-[560px] max-h-[92vh] overflow-auto">
          <div class="p-4 border-b border-slate-200 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="file-plus-2" class="w-5 h-5 text-slate-700"></i>
              <h2 id="modalTitle" class="text-[18px] font-semibold tracking-tight">Add Lab Report</h2>
            </div>
            <button id="closeModal" class="p-2 rounded-md hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-300" aria-label="Close">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>
          <form id="reportForm" class="p-4 space-y-4">
            <input type="hidden" id="reportId" />
            <div class="space-y-1.5">
              <label for="reportName" class="text-[13px] text-slate-600">Report Name</label>
              <input id="reportName" type="text" required placeholder="e.g., Complete Blood Count" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-[15px] outline-none focus:ring-4 focus:ring-slate-200 focus:border-slate-400"/>
            </div>
            <div class="space-y-1.5">
              <label for="reportDesc" class="text-[13px] text-slate-600">Description</label>
              <textarea id="reportDesc" rows="3" placeholder="Add notes or context..." class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-[15px] outline-none focus:ring-4 focus:ring-slate-200 focus:border-slate-400"></textarea>
            </div>
            <div class="space-y-1.5">
              <label for="reportDate" class="text-[13px] text-slate-600">Date of Report</label>
              <input id="reportDate" type="date" required class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-[15px] outline-none focus:ring-4 focus:ring-slate-200 focus:border-slate-400"/>
            </div>
            <div class="space-y-1.5">
              <div class="flex items-center justify-between">
                <label class="text-[13px] text-slate-600">Upload File / Image</label>
                <span class="text-[12px] text-slate-500">Attachment is required</span>
              </div>
              <label class="block rounded-lg border border-dashed border-slate-300 hover:border-slate-400 transition cursor-pointer bg-slate-50/50">
                <input id="reportFile" type="file" accept="image/*,.pdf" class="sr-only" />
                <div class="px-4 py-6 flex items-center gap-3">
                  <div class="flex h-14 w-14 items-center justify-center rounded-md bg-white border border-slate-200">
                    <i data-lucide="upload-cloud" class="w-5 h-5 text-slate-600"></i>
                  </div>
                  <div class="flex-1">
                    <p class="text-[14px] font-medium text-slate-800">Drag & drop or click to upload</p>
                    <p class="text-[12px] text-slate-500">JPG, PNG or PDF</p>
                  </div>
                </div>
              </label>
              <div id="filePreview" class="hidden">
                <div class="mt-2 flex items-center gap-3 p-2 rounded-lg border border-slate-200 bg-white">
                  <div id="fileThumb" class="h-14 w-14 rounded-md overflow-hidden bg-slate-100 flex items-center justify-center"></div>
                  <div class="flex-1 min-w-0">
                    <p id="fileName" class="truncate text-[14px] text-slate-800"></p>
                    <p id="fileMeta" class="text-[12px] text-slate-500"></p>
                  </div>
                  <button type="button" id="clearFile" class="p-2 rounded-md hover:bg-slate-100" aria-label="Remove file">
                    <i data-lucide="trash-2" class="w-4 h-4 text-slate-600"></i>
                  </button>
                </div>
              </div>
            </div>
            <div class="pt-2 flex items-center justify-end gap-3">
              <button type="button" id="cancelForm" class="px-3.5 py-2 rounded-lg border border-slate-300 bg-white text-slate-700 text-[14px] hover:bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-300">Cancel</button>
              <button type="submit" id="saveReport" disabled class="px-3.5 py-2 rounded-lg bg-slate-900 text-white text-[14px] hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed focus:outline-none focus-visible:ring-4 focus-visible:ring-slate-300">Save Report</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Full Report Viewer Modal -->
    <div id="viewerModal" class="fixed inset-0 z-[70] hidden">
      <div class="absolute inset-0 bg-black/60"></div>
      <div class="absolute inset-0 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-3xl max-h-[92vh] rounded-xl shadow-2xl border border-slate-200 overflow-hidden">
          <div class="flex items-center justify-between px-4 py-3 border-b border-slate-200">
            <div class="flex items-center gap-2">
              <i data-lucide="file-text" class="w-5 h-5 text-slate-700"></i>
              <h3 id="viewerTitle" class="text-[18px] font-semibold tracking-tight">Report</h3>
            </div>
            <div class="flex items-center gap-1.5">
              <button id="viewerShare" class="px-2 py-1.5 rounded-md hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-300" aria-label="Share">
                <i data-lucide="share-2" class="w-5 h-5"></i>
              </button>
              <button id="viewerClose" class="px-2 py-1.5 rounded-md hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-300" aria-label="Close">
                <i data-lucide="x" class="w-5 h-5"></i>
              </button>
            </div>
          </div>
          <div class="grid md:grid-cols-2 gap-0">
            <div class="p-4 border-r border-slate-200">
              <dl class="space-y-3">
                <div class="grid grid-cols-3 gap-2">
                  <dt class="col-span-1 text-[12px] text-slate-500">Report Name</dt>
                  <dd id="viewerName" class="col-span-2 text-[15px] text-slate-800 font-medium"></dd>
                </div>
                <div class="grid grid-cols-3 gap-2">
                  <dt class="col-span-1 text-[12px] text-slate-500">Date</dt>
                  <dd id="viewerDate" class="col-span-2 text-[15px] text-slate-800"></dd>
                </div>
                <div>
                  <dt class="text-[12px] text-slate-500 mb-1">Description</dt>
                  <dd id="viewerDesc" class="text-[14px] text-slate-800"></dd>
                </div>
                <div class="pt-2 flex items-center gap-2">
                  <button id="viewerEdit" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-md border border-slate-300 bg-white text-[14px] hover:bg-slate-50">
                    <i data-lucide="pencil" class="w-4 h-4"></i> Update
                  </button>
                  <button id="viewerDelete" class="inline-flex items-center gap-2 px-3 py-1.5 rounded-md border border-rose-200 bg-rose-50 text-rose-700 text-[14px] hover:bg-rose-100">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
                  </button>
                </div>
              </dl>
            </div>
            <div class="p-4">
              <div class="border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
                <img id="viewerImage" alt="Lab report preview" class="w-full h-[300px] sm:h-[320px] object-contain bg-white" loading="lazy" decoding="async" />
              </div>
              <p class="text-[12px] text-slate-500 mt-2 px-0">Full-size preview</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Icons
      document.addEventListener('DOMContentLoaded', () => {
        lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
      });

      // State
      let reports = [
        {
          id: crypto.randomUUID(),
          name: "Complete Blood Count",
          description: "Routine CBC to evaluate overall health and detect a wide range of disorders, including anemia, infection, and leukemia.",
          date: "2025-08-12",
          imageUrl: "https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?q=80&w=1200&auto=format&fit=crop"
        },
        {
          id: crypto.randomUUID(),
          name: "Lipid Profile",
          description: "Fasting lipid panel indicating cholesterol and triglyceride levels. Doctor advised low saturated fat diet.",
          date: "2025-07-02",
          imageUrl: "https://images.unsplash.com/photo-1579154203451-1f5a5aee0b43?q=80&w=1200&auto=format&fit=crop"
        },
        {
          id: crypto.randomUUID(),
          name: "Thyroid Function Test",
          description: "T3, T4, and TSH measured. Slightly elevated TSH with normal T3/T4 suggests subclinical hypothyroidism. Recommended follow-up in 6 weeks.",
          date: "2025-06-14",
          imageUrl: "https://images.unsplash.com/photo-1581090464777-f3220bbe1b8b?q=80&w=1200&auto=format&fit=crop"
        }
      ];
      let filtered = null;
      let currentViewId = null;

      // Elements
      const listContainer = document.getElementById('listContainer');
      const fabAdd = document.getElementById('fabAdd');
      const searchToggle = document.getElementById('toggleSearch');
      const searchBar = document.getElementById('searchBar');
      const searchInput = document.getElementById('searchInput');
      const backBtn = document.getElementById('backBtn');

      // Modal elements
      const reportModal = document.getElementById('reportModal');
      const modalTitle = document.getElementById('modalTitle');
      const reportForm = document.getElementById('reportForm');
      const reportId = document.getElementById('reportId');
      const reportName = document.getElementById('reportName');
      const reportDesc = document.getElementById('reportDesc');
      const reportDate = document.getElementById('reportDate');
      const reportFile = document.getElementById('reportFile');
      const filePreview = document.getElementById('filePreview');
      const fileThumb = document.getElementById('fileThumb');
      const fileName = document.getElementById('fileName');
      const fileMeta = document.getElementById('fileMeta');
      const clearFile = document.getElementById('clearFile');
      const saveBtn = document.getElementById('saveReport');
      const closeModal = document.getElementById('closeModal');
      const cancelForm = document.getElementById('cancelForm');

      // Viewer elements
      const viewerModal = document.getElementById('viewerModal');
      const viewerClose = document.getElementById('viewerClose');
      const viewerTitle = document.getElementById('viewerTitle');
      const viewerName = document.getElementById('viewerName');
      const viewerDate = document.getElementById('viewerDate');
      const viewerDesc = document.getElementById('viewerDesc');
      const viewerImage = document.getElementById('viewerImage');
      const viewerEdit = document.getElementById('viewerEdit');
      const viewerDelete = document.getElementById('viewerDelete');
      const viewerShare = document.getElementById('viewerShare');

      // Pull to refresh
      const ptrIndicator = document.getElementById('ptrIndicator');
      const ptrText = document.getElementById('ptrText');
      let pulling = false;
      let pullStartY = 0;
      let pulled = 0;

      function fmtDate(iso) {
        if (!iso) return '';
        const d = new Date(iso + 'T00:00:00');
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
      }

      function truncate(text, n=120) {
        if (!text) return '';
        return text.length > n ? text.slice(0, n).trim() + '…' : text;
      }

      function currentList() {
        return filtered ?? reports;
      }

      function renderList() {
        const items = [...currentList()].sort((a,b) => b.date.localeCompare(a.date));
        if (items.length === 0) {
          listContainer.innerHTML = `
            <section class="pt-10">
              <div class="border border-slate-200 rounded-xl bg-white p-8 text-center">
                <div class="mx-auto mb-4 w-28 h-28 rounded-full overflow-hidden ring-1 ring-slate-200">
                  <img alt="Empty state illustration" class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1584982751601-97dcc096659c?q=80&w=1200&auto=format&fit=crop" loading="lazy" decoding="async" />
                </div>
                <h3 class="text-[18px] font-semibold tracking-tight">No Lab Reports yet</h3>
                <p class="text-[14px] text-slate-600 mt-1">Add your first report to keep everything organized.</p>
                <div class="mt-4">
                  <button class="inline-flex items-center gap-2 px-3.5 py-2 rounded-lg bg-slate-900 text-white text-[14px] hover:bg-slate-800 focus:outline-none focus-visible:ring-4 focus-visible:ring-slate-300" onclick="openAddModal()">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add your first report
                  </button>
                </div>
              </div>
            </section>
          `;
          lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
          return;
        }

        listContainer.innerHTML = items.map(item => cardTemplate(item)).join('');
        lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
        attachCardInteractions();
      }

      function cardTemplate(item) {
        const descShort = truncate(item.description, 140);
        const showReadMore = item.description && item.description.length > 140;
        return `
          <article class="relative">
            <!-- Swipe actions behind -->
            <div class="absolute inset-y-0 right-0 flex items-center gap-2 pr-3">
              <button data-id="${item.id}" data-action="share" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-slate-900 text-white text-[13px] hover:bg-slate-800">
                <i data-lucide="share-2" class="w-4 h-4"></i> Share
              </button>
              <button data-id="${item.id}" data-action="delete" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-rose-600 text-white text-[13px] hover:bg-rose-700">
                <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
              </button>
            </div>
            <!-- Card front -->
            <div class="group relative bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden transition shadow-slate-200/60 hover:shadow-md hover:-translate-y-0.5 will-change-transform touch-pan-y ring-1 ring-black/5" data-swipe-card data-id="${item.id}">
              <div class="p-4">
                <!-- Header Row -->
                <div class="flex items-start justify-between gap-3">
                  <div class="min-w-0">
                    <h3 class="text-[16px] font-semibold tracking-tight text-slate-900 line-clamp-1">${item.name}</h3>
                  </div>
                  <div class="shrink-0 text-[12px] text-slate-500">${fmtDate(item.date)}</div>
                </div>
                <!-- Body -->
                <div class="mt-3 grid grid-cols-[1fr_auto] gap-3">
                  <div class="min-w-0">
                    <p class="text-[14px] text-slate-700 line-clamp-2" data-desc>${descShort}</p>
                    ${showReadMore ? `<button class="mt-1 text-[13px] text-slate-600 hover:text-slate-800 underline underline-offset-2 decoration-slate-300" data-readmore data-id="${item.id}">Read more</button>` : ``}
                  </div>
                  <!-- Thumbnail Preview -->
                  <button class="relative border border-slate-200 rounded-lg overflow-hidden bg-slate-50 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-300" data-open-view data-id="${item.id}" title="Open report" aria-label="Open report">
                    <img alt="${item.name} thumbnail" src="${item.imageUrl}" onerror="this.src='https://images.unsplash.com/photo-1621619856624-42fd193a0661?w=1080&q=80'" class="h-20 w-28 object-cover" loading="lazy" decoding="async"/>
                  </button>
                </div>
              </div>
              <!-- Divider -->
              <div class="border-t border-slate-200"></div>
              <!-- Action Row -->
              <div class="px-3 py-2 flex items-center justify-between">
                <div class="flex items-center gap-2 text-[13px]">
                  <button data-id="${item.id}" data-action="edit" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md hover:bg-slate-100">
                    <i data-lucide="pencil" class="w-4 h-4"></i> Update
                  </button>
                  <button data-id="${item.id}" data-action="delete" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md hover:bg-slate-100">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
                  </button>
                  <button data-id="${item.id}" data-action="share" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md hover:bg-slate-100">
                    <i data-lucide="share-2" class="w-4 h-4"></i> Share
                  </button>
                </div>
                <button data-open-view data-id="${item.id}" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md text-[13px] text-slate-600 hover:text-slate-800 hover:bg-slate-100">
                  <i data-lucide="maximize-2" class="w-4 h-4"></i> Open
                </button>
              </div>
            </div>
          </article>
        `;
      }

      function attachCardInteractions() {
        // Open viewer
        document.querySelectorAll('[data-open-view]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-id');
            openViewer(id);
          });
        });
        // Read more
        document.querySelectorAll('[data-readmore]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = btn.getAttribute('data-id');
            const rep = reports.find(r => r.id === id);
            const card = btn.closest('article');
            const descEl = card.querySelector('[data-desc]');
            descEl.textContent = rep.description;
            btn.remove();
          });
        });
        // Actions: edit/delete/share
        document.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-id');
            const action = btn.getAttribute('data-action');
            if (action === 'edit') openEditModal(id);
            if (action === 'delete') confirmDelete(id);
            if (action === 'share') shareReport(id);
          });
        });
        // Swipe interactions
        document.querySelectorAll('[data-swipe-card]').forEach(card => {
          let startX = 0, currentX = 0, translating = false, swiped = false;
          const maxReveal = 140;
          const threshold = 60;
          card.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            translating = true;
            card.style.transition = 'none';
          }, {passive: true});
          card.addEventListener('touchmove', (e) => {
            if (!translating) return;
            currentX = e.touches[0].clientX;
            let dx = currentX - startX;
            if (dx < 0) {
              dx = Math.max(dx, -maxReveal);
              card.style.transform = `translateX(${dx}px)`;
            } else {
              card.style.transform = `translateX(${Math.min(dx, 12)}px)`;
            }
          }, {passive: true});
          card.addEventListener('touchend', () => {
            translating = false;
            const dx = currentX - startX;
            card.style.transition = 'transform 180ms ease';
            if (dx < -threshold) {
              card.style.transform = `translateX(-120px)`;
              swiped = true;
            } else {
              card.style.transform = '';
              swiped = false;
            }
          });
          // Tap anywhere to close swipe
          card.addEventListener('click', () => {
            if (swiped) {
              card.style.transform = '';
              swiped = false;
            }
          });
        });
      }

      // Open Add Modal
      function openAddModal() {
        reportForm.reset();
        reportId.value = '';
        modalTitle.textContent = 'Add Lab Report';
        filePreview.classList.add('hidden');
        reportFile.value = '';
        saveBtn.disabled = true;
        openModal(reportModal);
      }

      function openEditModal(id) {
        const rep = reports.find(r => r.id === id);
        if (!rep) return;
        reportId.value = rep.id;
        modalTitle.textContent = 'Update Lab Report';
        reportName.value = rep.name || '';
        reportDesc.value = rep.description || '';
        reportDate.value = rep.date || '';
        // Preload current image to preview box (not changing unless new file selected)
        filePreview.classList.remove('hidden');
        fileThumb.innerHTML = `<img alt="preview" src="${rep.imageUrl}" class="h-full w-full object-cover"/>`;
        fileName.textContent = rep.name + " (current)";
        fileMeta.textContent = 'Existing attachment';
        saveBtn.disabled = false; // already has an attachment
        openModal(reportModal);
      }

      // Modal helpers
      function openModal(modal) {
        modal.classList.remove('hidden');
        lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
      }
      function closeModalFn(modal) {
        modal.classList.add('hidden');
      }

      // File handling
      reportFile.addEventListener('change', () => {
        const file = reportFile.files[0];
        if (!file) {
          filePreview.classList.add('hidden');
          saveBtn.disabled = !reportId.value; // only enable if editing with existing file
          return;
        }
        const isImage = file.type.startsWith('image/');
        if (isImage) {
          const url = URL.createObjectURL(file);
          fileThumb.innerHTML = `<img alt="preview" src="${url}" class="h-full w-full object-cover"/>`;
        } else {
          fileThumb.innerHTML = `<div class="w-full h-full flex items-center justify-center"><i data-lucide="file" class="w-5 h-5 text-slate-600"></i></div>`;
        }
        fileName.textContent = file.name;
        fileMeta.textContent = `${Math.round(file.size/1024)} KB`;
        filePreview.classList.remove('hidden');
        saveBtn.disabled = false;
        lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
      });

      clearFile.addEventListener('click', () => {
        reportFile.value = '';
        filePreview.classList.add('hidden');
        saveBtn.disabled = !reportId.value; // if creating new, disable save
      });

      // Save form
      reportForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const id = reportId.value || crypto.randomUUID();
        const name = reportName.value.trim();
        const description = reportDesc.value.trim();
        const date = reportDate.value;
        let imageUrl = null;

        const existing = reports.find(r => r.id === id);

        if (reportFile.files[0]) {
          const file = reportFile.files[0];
          if (file.type.startsWith('image/')) {
            imageUrl = URL.createObjectURL(file);
          } else {
            // For PDFs or others, we still need a thumbnail; use a placeholder image
            imageUrl = "https://images.unsplash.com/photo-1553877522-43269d4ea984?q=80&w=1200&auto=format&fit=crop";
          }
        } else if (existing) {
          imageUrl = existing.imageUrl;
        }

        if (!imageUrl) {
          alert('Please attach an image or file.');
          return;
        }

        const payload = { id, name, description, date, imageUrl };

        if (existing) {
          reports = reports.map(r => r.id === id ? payload : r);
        } else {
          reports.unshift(payload);
        }

        filtered = applyFilter(searchInput.value);
        renderList();
        closeModalFn(reportModal);
      });

      // Viewer
      function openViewer(id) {
        const rep = reports.find(r => r.id === id);
        if (!rep) return;
        currentViewId = id;
        viewerTitle.textContent = rep.name || 'Report';
        viewerName.textContent = rep.name || '—';
        viewerDate.textContent = fmtDate(rep.date) || '—';
        viewerDesc.textContent = rep.description || '—';
        viewerImage.src = rep.imageUrl;
        openModal(viewerModal);
      }

      viewerClose.addEventListener('click', () => closeModalFn(viewerModal));
      viewerEdit.addEventListener('click', () => {
        closeModalFn(viewerModal);
        openEditModal(currentViewId);
      });
      viewerDelete.addEventListener('click', () => {
        confirmDelete(currentViewId);
        closeModalFn(viewerModal);
      });
      viewerShare.addEventListener('click', () => {
        shareReport(currentViewId);
      });

      // Share
      function shareReport(id) {
        const rep = reports.find(r => r.id === id);
        if (!rep) return;
        const shareData = {
          title: rep.name,
          text: rep.description || 'Lab report',
          url: rep.imageUrl
        };
        if (navigator.share) {
          navigator.share(shareData).catch(() => {});
        } else {
          navigator.clipboard.writeText(rep.imageUrl).then(() => {
            toast('Link copied to clipboard');
          });
        }
      }

      // Delete
      function confirmDelete(id) {
        const rep = reports.find(r => r.id === id);
        if (!rep) return;
        if (confirm(`Delete "${rep.name}"?`)) {
          reports = reports.filter(r => r.id !== id);
          filtered = applyFilter(searchInput.value);
          renderList();
          toast('Report deleted');
        }
      }

      // Simple toast
      function toast(msg) {
        const t = document.createElement('div');
        t.className = "fixed bottom-6 left-1/2 -translate-x-1/2 px-3.5 py-2 rounded-md bg-slate-900 text-white text-[13px] shadow-lg";
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1800);
      }

      // Search
      function applyFilter(q) {
        const ql = (q || '').trim().toLowerCase();
        if (!ql) return null;
        return reports.filter(r =>
          (r.name || '').toLowerCase().includes(ql) ||
          (r.description || '').toLowerCase().includes(ql)
        );
      }

      searchToggle.addEventListener('click', () => {
        const open = searchBar.style.maxHeight && searchBar.style.maxHeight !== '0px';
        if (open) {
          searchBar.style.maxHeight = '0px';
          searchBar.style.opacity = '0';
          searchToggle.setAttribute('aria-expanded', 'false');
          searchInput.value = '';
          filtered = null;
          renderList();
        } else {
          searchBar.style.maxHeight = '72px';
          searchBar.style.opacity = '1';
          searchToggle.setAttribute('aria-expanded', 'true');
          setTimeout(() => searchInput.focus(), 50);
        }
      });

      searchInput.addEventListener('input', (e) => {
        filtered = applyFilter(e.target.value);
        renderList();
      });

      // Back
      backBtn.addEventListener('click', () => {
        if (history.length > 1) history.back();
      });

      // FAB
      fabAdd.addEventListener('click', openAddModal);

      // Modal close
      closeModal.addEventListener('click', () => closeModalFn(reportModal));
      cancelForm.addEventListener('click', () => closeModalFn(reportModal));
      reportModal.addEventListener('click', (e) => {
        if (e.target === reportModal) closeModalFn(reportModal);
      });
      viewerModal.addEventListener('click', (e) => {
        if (e.target === viewerModal) closeModalFn(viewerModal);
      });

      // Pull to refresh on main scroll
      const content = document.getElementById('content');
      content.addEventListener('touchstart', (e) => {
        if (content.scrollTop <= 0) {
          pulling = true;
          pullStartY = e.touches[0].clientY;
          pulled = 0;
        }
      }, {passive: true});
      content.addEventListener('touchmove', (e) => {
        if (!pulling) return;
        const y = e.touches[0].clientY;
        pulled = Math.max(0, y - pullStartY);
        if (pulled > 0) {
          e.preventDefault();
          ptrIndicator.style.height = Math.min(72, pulled / 2) + 'px';
          ptrIndicator.style.opacity = '1';
          ptrText.textContent = pulled > 120 ? 'Release to refresh' : 'Pull to refresh';
        }
      }, {passive: false});
      content.addEventListener('touchend', () => {
        if (!pulling) return;
        if (pulled > 120) {
          ptrText.textContent = 'Refreshing...';
          setTimeout(() => {
            // Simulate refresh
            filtered = applyFilter(searchInput.value);
            renderList();
            ptrIndicator.style.height = '0px';
            ptrIndicator.style.opacity = '0';
          }, 600);
        } else {
          ptrIndicator.style.height = '0px';
          ptrIndicator.style.opacity = '0';
        }
        pulling = false;
        pulled = 0;
      });

      // Initialize
      renderList();
    </script>
  </body>
</html>
