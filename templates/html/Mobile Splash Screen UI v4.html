<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EclinicX — Splash</title>
<!-- Inter Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script></head>
  <body class="min-h-screen bg-gradient-to-br from-slate-50 via-sky-50 to-cyan-50 relative antialiased" style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial">
    <!-- Soft ambient accents -->
    <div class="pointer-events-none absolute inset-0 overflow-hidden">
      <div class="absolute -top-24 -left-24 h-80 w-80 bg-gradient-to-br from-sky-300/30 via-cyan-300/25 to-teal-300/25 blur-3xl rounded-full"></div>
      <div class="absolute top-1/3 -right-20 h-72 w-72 bg-gradient-to-tr from-teal-300/25 via-cyan-300/25 to-sky-300/25 blur-3xl rounded-full"></div>
      <div class="absolute bottom-10 left-1/4 h-64 w-64 bg-gradient-to-br from-teal-300/20 via-sky-300/20 to-cyan-300/20 blur-3xl rounded-full"></div>
    </div>

    <main class="relative z-10 flex items-center justify-center p-6 sm:p-10">
      <!-- Phone shell -->
      <section class="w-full max-w-sm">
        <div class="mx-auto rounded-[32px] bg-gradient-to-br from-white/80 to-white/60 shadow-xl shadow-sky-100/50 ring-1 ring-slate-200/60 backdrop-blur">
          <div class="rounded-[30px] overflow-hidden">
            <!-- Status bar -->
            <div class="relative px-5 pt-4 pb-1">
              <div class="flex items-center justify-between text-slate-700">
                <span class="text-[13px] font-medium tracking-tight">9:41</span>
                <div class="flex items-center gap-2">
                  <i data-lucide="wifi" class="h-4 w-4 opacity-80 stroke-[1.5]"></i>
                  <i data-lucide="signal" class="h-4 w-4 opacity-80 stroke-[1.5]"></i>
                  <i data-lucide="battery" class="h-4 w-4 opacity-80 stroke-[1.5]"></i>
                </div>
              </div>
            </div>

            <!-- Splash hero card (updated to light aurora background) -->
            <div class="relative mx-4 mb-4 rounded-3xl bg-white/95 ring-1 ring-slate-200/70 overflow-hidden">
              <!-- Aurora background layers -->
              <div class="pointer-events-none absolute inset-0">
                <div class="absolute -top-20 -left-16 h-60 w-60 rounded-full blur-3xl" style="background: radial-gradient(120px 120px at 40% 40%, rgba(56,189,248,0.35), transparent 70%), radial-gradient(140px 140px at 90% 20%, rgba(45,212,191,0.35), transparent 70%);"></div>
                <div class="absolute -bottom-16 -right-12 h-72 w-72 rounded-full blur-3xl" style="background: radial-gradient(160px 160px at 30% 60%, rgba(14,165,233,0.25), transparent 70%), radial-gradient(120px 120px at 70% 40%, rgba(34,197,94,0.15), transparent 75%);"></div>
                <div class="absolute inset-0 opacity-[0.35]" style="background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.75) 32%, rgba(255,255,255,0.65) 65%, rgba(255,255,255,0.55) 100%);"></div>
              </div>

              <!-- Logo spot -->
              <div class="absolute top-4 left-4 z-10 inline-flex items-center gap-2 rounded-full bg-white/80 px-3 py-1.5 ring-1 ring-slate-200/70 backdrop-blur shadow-sm">
                <div class="h-6 w-6 rounded-lg bg-sky-600 text-white text-[12px] font-medium leading-none tracking-tight flex items-center justify-center">EX</div>
                <span class="text-[12px] font-medium text-slate-700">Place your logo</span>
              </div>

              <!-- Subtle top info tag -->
              <div class="absolute top-4 right-4 z-10 inline-flex items-center gap-1.5 rounded-full bg-slate-900/5 px-2.5 py-1 ring-1 ring-slate-200/70 backdrop-blur text-[11px] text-slate-700 shadow-sm">
                <i data-lucide="shield-check" class="h-3.5 w-3.5 text-emerald-600 stroke-[1.5]"></i>
                HIPAA-ready
              </div>

              <!-- Circular stage -->
              <div class="relative px-6 pt-10 pb-24">
                <div class="mx-auto h-56 w-56 rounded-full bg-gradient-to-b from-sky-100/70 to-teal-100/50 ring-1 ring-white shadow-inner shadow-black/5"></div>

                <!-- Doctor image clipped in a soft card (transparent background) -->
                <div class="pointer-events-none absolute inset-x-0 -bottom-2 flex justify-center">
                  <div class="h-[360px] w-[270px] rounded-[28px] bg-white/60 backdrop-blur-sm ring-1 ring-slate-200/70 overflow-hidden shadow-[0_24px_60px_-20px_rgba(15,23,42,0.35)]">
                    <img
                      alt="Happy professional doctor portrait, background removed"
                      src="https://pngimg.com/uploads/doctor/doctor_PNG16038.png"
                      class="h-full w-full object-contain object-center"
                    />
                  </div>
                </div>

                <!-- 3D-style graphic badges (neumorphic) -->
                <div class="absolute inset-0">
                  <div class="absolute left-6 top-12">
                    <div class="relative h-12 w-12 rounded-2xl bg-gradient-to-br from-white to-slate-100 ring-1 ring-slate-200 shadow-[6px_8px_24px_rgba(15,23,42,0.08),inset_0_1px_0_rgba(255,255,255,0.8)] flex items-center justify-center">
                      <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-sky-50 to-slate-50 ring-1 ring-white flex items-center justify-center">
                        <i data-lucide="stethoscope" class="h-5 w-5 text-sky-600 stroke-[1.5]"></i>
                      </div>
                    </div>
                  </div>
                  <div class="absolute right-7 top-20">
                    <div class="relative h-12 w-12 rounded-2xl bg-gradient-to-br from-white to-slate-100 ring-1 ring-slate-200 shadow-[6px_8px_24px_rgba(15,23,42,0.08),inset_0_1px_0_rgba(255,255,255,0.8)] flex items-center justify-center">
                      <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-emerald-50 to-slate-50 ring-1 ring-white flex items-center justify-center">
                        <i data-lucide="pill" class="h-5 w-5 text-emerald-600 stroke-[1.5]"></i>
                      </div>
                    </div>
                  </div>
                  <div class="absolute left-10 bottom-28">
                    <div class="relative h-12 w-12 rounded-2xl bg-gradient-to-br from-white to-slate-100 ring-1 ring-slate-200 shadow-[6px_8px_24px_rgba(15,23,42,0.08),inset_0_1px_0_rgba(255,255,255,0.8)] flex items-center justify-center">
                      <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-rose-50 to-slate-50 ring-1 ring-white flex items-center justify-center">
                        <i data-lucide="heart-pulse" class="h-5 w-5 text-rose-600 stroke-[1.5]"></i>
                      </div>
                    </div>
                  </div>
                  <div class="absolute right-10 bottom-24">
                    <div class="relative h-12 w-12 rounded-2xl bg-gradient-to-br from-white to-slate-100 ring-1 ring-slate-200 shadow-[6px_8px_24px_rgba(15,23,42,0.08),inset_0_1px_0_rgba(255,255,255,0.8)] flex items-center justify-center">
                      <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-violet-50 to-slate-50 ring-1 ring-white flex items-center justify-center">
                        <i data-lucide="syringe" class="h-5 w-5 text-violet-600 stroke-[1.5]"></i>
                      </div>
                    </div>
                  </div>
                  <div class="absolute left-1/2 -translate-x-1/2 top-7">
                    <div class="relative h-10 w-10 rounded-xl bg-gradient-to-br from-white to-slate-100 ring-1 ring-slate-200 shadow-[6px_8px_24px_rgba(15,23,42,0.08),inset_0_1px_0_rgba(255,255,255,0.8)] flex items-center justify-center">
                      <div class="h-8 w-8 rounded-lg bg-gradient-to-br from-cyan-50 to-slate-50 ring-1 ring-white flex items-center justify-center">
                        <i data-lucide="shield-plus" class="h-4.5 w-4.5 text-cyan-600 stroke-[1.5]"></i>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Bottom content panel -->
              <div class="relative px-6 pb-6">
                <div class="rounded-2xl bg-white/95 backdrop-blur p-5 shadow-lg ring-1 ring-slate-200/80">
                  <div class="mb-2 flex items-center justify-between">
                    <span class="inline-flex items-center gap-2 rounded-full bg-sky-50 px-2.5 py-1 text-[11px] font-medium text-sky-700 ring-1 ring-sky-100">
                      <i data-lucide="calendar-check" class="h-3.5 w-3.5 stroke-[1.5]"></i>
                      Instant Booking
                    </span>
                    <!-- Secondary logo spot (optional) -->
                    <span class="inline-flex items-center gap-1 rounded-full bg-slate-50 px-2 py-1 text-[11px] text-slate-600 ring-1 ring-slate-200">
                      <i data-lucide="sparkles" class="h-3.5 w-3.5 text-amber-500 stroke-[1.5]"></i>
                      Your Logo Here
                    </span>
                  </div>
                  <h2 class="text-[22px] sm:text-[24px] font-semibold tracking-tight text-slate-900">
                    EclinicX
                  </h2>
                  <p class="mt-1 text-[13px] leading-5 text-slate-600">
                    Start your wellness journey with easy doctor consultations, instant bookings, and expert care.
                  </p>

                  <div class="mt-4 flex items-center gap-3">
                    <button class="group inline-flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-sky-600 to-teal-600 px-4 py-3 text-sm font-medium text-white shadow-md shadow-sky-500/20 ring-1 ring-white/10 transition hover:brightness-105 active:scale-[0.99]">
                      Get Started
                      <i data-lucide="arrow-right" class="h-4 w-4 transition -translate-x-0.5 group-hover:translate-x-0 stroke-[1.5]"></i>
                    </button>
                  </div>

                  <div class="mt-3 flex items-center justify-center gap-2 text-[12px] text-slate-500">
                    <span>Already have an account?</span>
                    <a href="#" class="font-medium text-sky-600 hover:text-sky-700">Sign In</a>
                  </div>
                </div>
              </div>
            </div>

            <!-- Safe bottom area -->
            <div class="h-4"></div>
          </div>
        </div>

        <!-- Subtle reflection shadow -->
        <div class="mx-auto mt-6 h-3 w-56 rounded-full bg-slate-900/5 blur-[2px]"></div>
      </section>
    </main>

    <script>
      // Initialize lucide icons
      lucide.createIcons();
    </script>
  </body>
</html>
