<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koli App - Associate Merchant Order</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
}
/* Custom scrollbar for the order list to maintain a clean look */
.custom-scrollbar::-webkit-scrollbar {
width: 4px;
}
.custom-scrollbar::-webkit-scrollbar-track {
background: transparent;
}
.custom-scrollbar::-webkit-scrollbar-thumb {
background-color: #e5e7eb;
border-radius: 4px;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-gray-50 min-h-screen text-gray-900 flex items-center justify-center p-4 sm:p-6 selection:bg-blue-100 selection:text-blue-900">

    <!-- Modal Backdrop Overlay -->
    <div class="fixed inset-0 bg-gray-900/20 backdrop-blur-sm z-40 transition-opacity"></div>

    <!-- Modal Container -->
    <div class="bg-white rounded-xl shadow-2xl shadow-gray-200/50 border border-gray-200 w-full max-w-lg mx-auto z-50 overflow-hidden flex flex-col relative">
        
        <!-- 1. The Header -->
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-700 shrink-0 shadow-sm">
                    <iconify-icon icon="solar:bus-linear" class="text-lg" stroke-width="1.5"></iconify-icon>
                </div>
                <h2 class="text-lg font-semibold tracking-tight text-gray-900">Associate a Merchant Order</h2>
            </div>
            <button class="text-gray-400 hover:text-gray-900 transition-colors p-1 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-200">
                <iconify-icon icon="solar:close-linear" class="text-xl" stroke-width="1.5"></iconify-icon>
            </button>
        </div>

        <!-- 2. The Assignment Section (Top Half) -->
        <div class="px-6 py-6 flex flex-col gap-5">
            
            <!-- Merchant Order Input -->
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-gray-700">Enter Shein / Temu / Alibaba Order Number</label>
                <input 
                    type="text" 
                    placeholder="Ex: SHEIN-123456789" 
                    class="w-full px-3 py-2.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all shadow-sm"
                >
            </div>

            <!-- KOLI Orders Selection -->
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-gray-700">Select Related KOLI Orders</label>
                
                <!-- Order List Box (Custom Styled Select) -->
                <div class="w-full bg-gray-50/50 border border-gray-200 rounded-lg p-1.5 h-40 overflow-y-auto custom-scrollbar shadow-inner">
                    <div class="flex flex-col gap-1">
                        <!-- Selected State Example -->
                        <div class="flex items-center gap-3 px-3 py-2 bg-blue-50/80 border border-blue-200/60 rounded-md cursor-pointer transition-colors">
                            <iconify-icon icon="solar:box-minimalistic-linear" class="text-blue-600 text-base shrink-0" stroke-width="1.5"></iconify-icon>
                            <span class="text-sm font-medium text-blue-900 tracking-tight">KOLI-8942 - Marie D. <span class="text-blue-600/70 font-normal">(3 Items)</span></span>
                        </div>
                        
                        <!-- Default State Examples -->
                        <div class="flex items-center gap-3 px-3 py-2 hover:bg-gray-100 rounded-md cursor-pointer border border-transparent transition-colors">
                            <iconify-icon icon="solar:box-minimalistic-linear" class="text-gray-400 text-base shrink-0" stroke-width="1.5"></iconify-icon>
                            <span class="text-sm font-medium text-gray-700 tracking-tight">KOLI-8901 - Jean K. <span class="text-gray-400 font-normal">(1 Item)</span></span>
                        </div>
                        
                        <div class="flex items-center gap-3 px-3 py-2 hover:bg-gray-100 rounded-md cursor-pointer border border-transparent transition-colors">
                            <iconify-icon icon="solar:box-minimalistic-linear" class="text-gray-400 text-base shrink-0" stroke-width="1.5"></iconify-icon>
                            <span class="text-sm font-medium text-gray-700 tracking-tight">KOLI-8888 - Alice W. <span class="text-gray-400 font-normal">(3 Items)</span></span>
                        </div>
                    </div>
                </div>
                <!-- Instruction Text -->
                <p class="text-xs text-gray-400 mt-0.5">Hold Ctrl (Cmd) to select multiple</p>
            </div>

            <!-- Primary Action Button -->
            <button class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 border border-transparent rounded-lg text-sm text-white shadow-sm shadow-blue-600/20 transition-all font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:ring-offset-1 mt-1">
                <iconify-icon icon="solar:link-linear" class="text-lg text-blue-100" stroke-width="1.5"></iconify-icon>
                Link Orders
            </button>

        </div>

        <!-- Separator -->
        <div class="h-px w-full bg-gray-100"></div>

        <!-- 3. The Search Section (Bottom Half) -->
        <div class="px-6 py-6 bg-gray-50/30 flex flex-col gap-5">
            
            <div class="flex flex-col gap-1.5">
                <label class="text-sm font-medium text-gray-700">Search by Merchant Number <span class="text-gray-400 font-normal">(Cameroon Dispatch)</span></label>
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <iconify-icon icon="solar:magnifer-linear" class="text-base" stroke-width="1.5"></iconify-icon>
                        </div>
                        <input 
                            type="text" 
                            placeholder="Enter a Shein Number..." 
                            class="w-full pl-9 pr-3 py-2.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-200 focus:border-gray-400 transition-all shadow-sm"
                        >
                    </div>
                    
                    <!-- Secondary Action Button -->
                    <button class="flex items-center justify-center gap-2 px-5 py-2.5 bg-slate-800 hover:bg-slate-900 border border-transparent rounded-lg text-sm text-white shadow-sm transition-all font-medium focus:outline-none focus:ring-2 focus:ring-slate-800/50 focus:ring-offset-1 shrink-0">
                        <iconify-icon icon="solar:magnifer-linear" class="text-lg text-slate-300" stroke-width="1.5"></iconify-icon>
                        View Details
                    </button>
                </div>
            </div>

            <!-- Status Indicator -->
            <div class="flex items-start gap-2.5 px-4 py-3 bg-gray-100/80 border border-gray-200/60 rounded-lg text-sm text-gray-500">
                <iconify-icon icon="solar:info-circle-linear" class="text-lg text-gray-400 shrink-0 mt-px" stroke-width="1.5"></iconify-icon>
                <p class="leading-relaxed">Enter a Number</p>
            </div>

        </div>
    </div>

</body>
</html>
