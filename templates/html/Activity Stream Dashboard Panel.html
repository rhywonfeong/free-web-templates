<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --font-main: 'Roboto', sans-serif;
            --bg-page: #f8f9fa;
            --bg-component: #ffffff;
            --bg-avatar: #e9ecef;
            --text-primary: #212529;
            --text-secondary: #495057;
            --text-heading: #004085;
            --text-muted: #6c757d;
            --text-accent: #007bff;
            --color-success: #28a745;
            --border-color: #dee2e6;
            --border-radius: 0.25rem;
            --border-radius-avatar: 50%;
            --shadow-md: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 1rem 3rem rgba(0, 0, 0, 0.2);
            --transition-speed: 0.2s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: grid;
            place-items: center;
            align-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .dashboard-activity-stream {
            background-color: var(--bg-component);
            max-width: 500px;
            width: 100%;
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
        }

        .dashboard-activity-stream:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .dashboard-activity-stream h4 {
            font-size: 1.2rem;
            color: var(--text-heading);
            margin-bottom: 15px;
        }

        .activity-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .activity-item {
            display: flex;
            align-items: flex-start;
            padding: 12px 5px;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-avatar {
            width: 35px;
            height: 35px;
            border-radius: var(--border-radius-avatar);
            object-fit: cover;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .activity-icon {
            width: 35px;
            height: 35px;
            border-radius: var(--border-radius-avatar);
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-avatar);
            color: var(--text-accent);
            font-size: 1rem;
            flex-shrink: 0;
        }

        .activity-icon .fa-check-circle {
            color: var(--color-success);
        }

        .activity-content {
            flex-grow: 1;
            font-size: 0.9rem;
            color: var(--text-primary);
            line-height: 1.5;
        }

        .activity-user {
            font-weight: 600;
            color: var(--text-heading);
        }

        .activity-time {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 3px;
        }

        @media (max-width: 480px) {
            .dashboard-activity-stream {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-activity-stream animate__animated animate__fadeInUp" style="animation-duration: 0.7s; animation-delay: 0.1s;">
        <h4>Recent Activity</h4>
        <ul class="activity-list">
            <li class="activity-item animate__animated animate__fadeInRight" style="animation-delay: 0.2s;">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-4.0.3&amp;ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&amp;auto=format&amp;fit=crop&amp;w=40&amp;h=40&amp;q=80" alt="User Alex" class="activity-avatar">
                <div class="activity-content">
                    <span class="activity-user">Alex J.</span> uploaded a new file: "Quarterly_Report_Q3_Final.pdf"
                    <span class="activity-time">2 mins ago</span>
                </div>
            </li>
            <li class="activity-item animate__animated animate__fadeInRight" style="animation-delay: 0.3s;">
                 <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?ixlib=rb-4.0.3&amp;ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&amp;auto=format&amp;fit=crop&amp;w=40&amp;h=40&amp;q=80" alt="User Maria" class="activity-avatar">
                <div class="activity-content">
                    <span class="activity-user">Maria G.</span> commented on "Project Phoenix Marketing Plan"
                    <span class="activity-time">15 mins ago</span>
                </div>
            </li>
            <li class="activity-item animate__animated animate__fadeInRight" style="animation-delay: 0.4s;">
                <div class="activity-icon"><i class="fas fa-check-circle"></i></div>
                <div class="activity-content">
                    Task "Deploy to Staging Environment" completed successfully.
                    <span class="activity-time">1 hour ago</span>
                </div>
            </li>
             <li class="activity-item animate__animated animate__fadeInRight" style="animation-delay: 0.5s;">
                <div class="activity-icon"><i class="fas fa-user-plus"></i></div>
                <div class="activity-content">
                    <span class="activity-user">New User</span> "john.doe@example.com" signed up.
                    <span class="activity-time">3 hours ago</span>
                </div>
            </li>
        </ul>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new WOW().init();
        });
    </script>
</body>
</html>
