<body class="min-h-screen bg-[#FDFDF9] flex items-center justify-center p-3 sm:p-8" style="font-family: 'Inter', sans-serif;">

    <!-- Top Right Icon Button -->

    <!-- Header Section -->

    <!-- Questionnaire Form -->

                  <span class="font-medium text-base sm:text-lg">Male</span>

            </div>

        </div>

        <!-- Question 2: Age Range -->

          <section class="space-y-3 sm:space-y-4">
            <h3 class="text-base sm:text-lg font-medium text-[#4D3D0A]">2. What is your age range?</h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
              <label class="cursor-pointer">

        <!-- Question 3: Biggest Health Goal -->

          <h3 class="text-base sm:text-lg font-medium text-[#4D3D0A] mb-3 flex-shrink-0">3. What is your biggest health goal right now?</h3>
          <section class="space-y-2 sm:space-y-3 flex-grow overflow-y-auto pr-1 sm:pr-2 pb-4 -mr-1 sm:-mr-2 custom-scrollbar">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3">
              
              <label class="relative block cursor-pointer">
                <input type="radio" name="goal" value="energy" class="peer sr-only">
                <div class="flex items-center gap-3 p-3 sm:p-4 rounded-2xl bg-[#E5B514] hover:bg-[#D9AC13] peer-checked:bg-[#FFFDF5] peer-checked:shadow-sm peer-checked:[&_.radio-outer]:border-[#D9AC13] peer-checked:[&_.radio-inner]:scale-100 peer-checked:[&_iconify-icon]:text-[#D9AC13] transition-all">
                  <div class="radio-outer flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 border-[#B38F10] flex items-center justify-center transition-colors">
                    <div class="radio-inner w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#D9AC13] scale-0 transition-transform"></div>
                  </div>
                  <iconify-icon icon="solar:bolt-linear" width="22" height="22" class="text-[#8C700D] flex-shrink-0 transition-colors"></iconify-icon>
                  <span class="text-sm sm:text-base font-medium text-[#4D3D0A] peer-checked:text-[#1A1504]">Boost energy & reduce fatigue</span>

              </label>

              <label class="relative block cursor-pointer">
                <input type="radio" name="goal" value="fertility" class="peer sr-only">

                  </div>
                  <iconify-icon icon="solar:heart-pulse-linear" width="22" height="22" class="text-[#8C700D] flex-shrink-0 transition-colors"></iconify-icon>
                  <span class="text-sm sm:text-base font-medium text-[#4D3D0A] peer-checked:text-[#1A1504]">Improve fertility / pregnant</span>

              </label>

              <label class="relative block cursor-pointer">
                <input type="radio" name="goal" value="diabetes" class="peer sr-only">
                <div class="flex items-center gap-3 p-3 sm:p-4 rounded-2xl bg-[#E5B514] hover:bg-[#D9AC13] peer-checked:bg-[#FFFDF5] peer-checked:shadow-sm peer-checked:[&_.radio-outer]:border-[#D9AC13] peer-checked:[&_.radio-inner]:scale-100 peer-checked:[&_iconify-icon]:text-[#D9AC13] transition-all">
                  <div class="radio-outer flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 border-[#B38F10] flex items-center justify-center transition-colors">
                    <div class="radio-inner w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#D9AC13] scale-0 transition-transform"></div>
                  </div>
                  <iconify-icon icon="solar:waterdrop-linear" width="22" height="22" class="text-[#8C700D] flex-shrink-0 transition-colors"></iconify-icon>
                  <span class="text-sm sm:text-base font-medium text-[#4D3D0A] peer-checked:text-[#1A1504]">Manage diabetes</span>
                </div>
              </label>

              <label class="relative block cursor-pointer">
                <input type="radio" name="goal" value="libido" class="peer sr-only">
                <div class="flex items-center gap-3 p-3 sm:p-4 rounded-2xl bg-[#E5B514] hover:bg-[#D9AC13] peer-checked:bg-[#FFFDF5] peer-checked:shadow-sm peer-checked:[&_.radio-outer]:border-[#D9AC13] peer-checked:[&_.radio-inner]:scale-100 peer-checked:[&_iconify-icon]:text-[#D9AC13] transition-all">
                  <div class="radio-outer flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 border-[#B38F10] flex items-center justify-center transition-colors">
                    <div class="radio-inner w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#D9AC13] scale-0 transition-transform"></div>
                  </div>
                  <iconify-icon icon="solar:flame-linear" width="22" height="22" class="text-[#8C700D] flex-shrink-0 transition-colors"></iconify-icon>
                  <span class="text-sm sm:text-base font-medium text-[#4D3D0A] peer-checked:text-[#1A1504]">Improve sexual performance</span>
                </div>
              </label>

              <label class="relative block cursor-pointer">
                <input type="radio" name="goal" value="detox" class="peer sr-only">
                <div class="flex items-center gap-3 p-3 sm:p-4 rounded-2xl bg-[#E5B514] hover:bg-[#D9AC13] peer-checked:bg-[#FFFDF5] peer-checked:shadow-sm peer-checked:[&_.radio-outer]:border-[#D9AC13] peer-checked:[&_.radio-inner]:scale-100 peer-checked:[&_iconify-icon]:text-[#D9AC13] transition-all">
                  <div class="radio-outer flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 border-[#B38F10] flex items-center justify-center transition-colors">
                    <div class="radio-inner w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#D9AC13] scale-0 transition-transform"></div>
                  </div>
                  <iconify-icon icon="solar:leaf-linear" width="22" height="22" class="text-[#8C700D] flex-shrink-0 transition-colors"></iconify-icon>
                  <span class="text-sm sm:text-base font-medium text-[#4D3D0A] peer-checked:text-[#1A1504]">Detox & cleanse body</span>
                </div>
              </label>

              <label class="relative block cursor-pointer">
                <input type="radio" name="goal" value="infection" class="peer sr-only">
                <div class="flex items-center gap-3 p-3 sm:p-4 rounded-2xl bg-[#E5B514] hover:bg-[#D9AC13] peer-checked:bg-[#FFFDF5] peer-checked:shadow-sm peer-checked:[&_.radio-outer]:border-[#D9AC13] peer-checked:[&_.radio-inner]:scale-100 peer-checked:[&_iconify-icon]:text-[#D9AC13] transition-all">
                  <div class="radio-outer flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 border-[#B38F10] flex items-center justify-center transition-colors">
                    <div class="radio-inner w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#D9AC13] scale-0 transition-transform"></div>
                  </div>
                  <iconify-icon icon="solar:shield-warning-linear" width="22" height="22" class="text-[#8C700D] flex-shrink-0 transition-colors"></iconify-icon>
                  <span class="text-sm sm:text-base font-medium text-[#4D3D0A] peer-checked:text-[#1A1504]">Treat infection</span>
                </div>
              </label>

              <label class="relative block cursor-pointer">
                <input type="radio" name="goal" value="prostate" class="peer sr-only">
                <div class="flex items-center gap-3 p-3 sm:p-4 rounded-2xl bg-[#E5B514] hover:bg-[#D9AC13] peer-checked:bg-[#FFFDF5] peer-checked:shadow-sm peer-checked:[&_.radio-outer]:border-[#D9AC13] peer-checked:[&_.radio-inner]:scale-100 peer-checked:[&_iconify-icon]:text-[#D9AC13] transition-all">
                  <div class="radio-outer flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 border-[#B38F10] flex items-center justify-center transition-colors">
                    <div class="radio-inner w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#D9AC13] scale-0 transition-transform"></div>
                  </div>
                  <iconify-icon icon="solar:shield-plus-linear" width="22" height="22" class="text-[#8C700D] flex-shrink-0 transition-colors"></iconify-icon>
                  <span class="text-sm sm:text-base font-medium text-[#4D3D0A] peer-checked:text-[#1A1504]">Manage prostate issues</span>
                </div>
              </label>

              <label class="relative block cursor-pointer">
                <input type="radio" name="goal" value="blood-pressure" class="peer sr-only">
                <div class="flex items-center gap-3 p-3 sm:p-4 rounded-2xl bg-[#E5B514] hover:bg-[#D9AC13] peer-checked:bg-[#FFFDF5] peer-checked:shadow-sm peer-checked:[&_.radio-outer]:border-[#D9AC13] peer-checked:[&_.radio-inner]:scale-100 peer-checked:[&_iconify-icon]:text-[#D9AC13] transition-all">
                  <div class="radio-outer flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 border-[#B38F10] flex items-center justify-center transition-colors">
                    <div class="radio-inner w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#D9AC13] scale-0 transition-transform"></div>
                  </div>
                  <iconify-icon icon="solar:heart-angle-linear" width="22" height="22" class="text-[#8C700D] flex-shrink-0 transition-colors"></iconify-icon>
                  <span class="text-sm sm:text-base font-medium text-[#4D3D0A] peer-checked:text-[#1A1504]">Lower blood pressure</span>

              <label class="relative block cursor-pointer">
                <input type="radio" name="goal" value="vision" class="peer sr-only">
                <div class="flex items-center gap-3 p-3 sm:p-4 rounded-2xl bg-[#E5B514] hover:bg-[#D9AC13] peer-checked:bg-[#FFFDF5] peer-checked:shadow-sm peer-checked:[&_.radio-outer]:border-[#D9AC13] peer-checked:[&_.radio-inner]:scale-100 peer-checked:[&_iconify-icon]:text-[#D9AC13] transition-all">
                  <div class="radio-outer flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 border-[#B38F10] flex items-center justify-center transition-colors">
                    <div class="radio-inner w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#D9AC13] scale-0 transition-transform"></div>
                  </div>
                  <iconify-icon icon="solar:eye-linear" width="22" height="22" class="text-[#8C700D] flex-shrink-0 transition-colors"></iconify-icon>
                  <span class="text-sm sm:text-base font-medium text-[#4D3D0A] peer-checked:text-[#1A1504]">Improve vision</span>
                </div>
              </label>

              <label class="relative block cursor-pointer">
                <input type="radio" name="goal" value="immune" class="peer sr-only">
                <div class="flex items-center gap-3 p-3 sm:p-4 rounded-2xl bg-[#E5B514] hover:bg-[#D9AC13] peer-checked:bg-[#FFFDF5] peer-checked:shadow-sm peer-checked:[&_.radio-outer]:border-[#D9AC13] peer-checked:[&_.radio-inner]:scale-100 peer-checked:[&_iconify-icon]:text-[#D9AC13] transition-all">
                  <div class="radio-outer flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 border-[#B38F10] flex items-center justify-center transition-colors">

        <!-- Question 4: Duration -->
        <div class="step hidden opacity-0 translate-y-4 transition-all duration-300 absolute inset-0 w-full flex flex-col" data-step="4">
          <h3 class="text-base sm:text-lg font-medium text-[#4D3D0A] mb-3 flex-shrink-0">4. How long have you been experiencing this?</h3>
          <section class="space-y-2 sm:space-y-3 flex-grow overflow-y-auto pr-1 sm:pr-2 pb-4 -mr-1 sm:-mr-2 custom-scrollbar">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3">
              
              <label class="relative block cursor-pointer">

                    <div class="radio-inner w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#D9AC13] scale-0 transition-transform"></div>
                  </div>
                  <iconify-icon icon="solar:calendar-linear" width="22" height="22" class="text-[#8C700D] flex-shrink-0 transition-colors"></iconify-icon>

              <label class="relative block cursor-pointer">
                <input type="radio" name="duration" value="1-3-years" class="peer sr-only">
                <div class="flex items-center gap-3 p-3 sm:p-4 rounded-2xl bg-[#E5B514] hover:bg-[#D9AC13] peer-checked:bg-[#FFFDF5] peer-checked:shadow-sm peer-checked:[&_.radio-outer]:border-[#D9AC13] peer-checked:[&_.radio-inner]:scale-100 peer-checked:[&_iconify-icon]:text-[#D9AC13] transition-all">
                  <div class="radio-outer flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 border-[#B38F10] flex items-center justify-center transition-colors">
                    <div class="radio-inner w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#D9AC13] scale-0 transition-transform"></div>
                  </div>
                  <iconify-icon icon="solar:calendar-add-linear" width="22" height="22" class="text-[#8C700D] flex-shrink-0 transition-colors"></iconify-icon>
                  <span class="text-sm sm:text-base font-medium text-[#4D3D0A] peer-checked:text-[#1A1504]">1–3 years</span>
                </div>
              </label>

              <label class="relative block cursor-pointer">
                <input type="radio" name="duration" value="over-3-years" class="peer sr-only">
                <div class="flex items-center gap-3 p-3 sm:p-4 rounded-2xl bg-[#E5B514] hover:bg-[#D9AC13] peer-checked:bg-[#FFFDF5] peer-checked:shadow-sm peer-checked:[&_.radio-outer]:border-[#D9AC13] peer-checked:[&_.radio-inner]:scale-100 peer-checked:[&_iconify-icon]:text-[#D9AC13] transition-all">
                  <div class="radio-outer flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full border-2 border-[#B38F10] flex items-center justify-center transition-colors">
                    <div class="radio-inner w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#D9AC13] scale-0 transition-transform"></div>
                  </div>
                  <iconify-icon icon="solar:infinity-linear" width="22" height="22" class="text-[#8C700D] flex-shrink-0 transition-colors"></iconify-icon>
                  <span class="text-sm sm:text-base font-medium text-[#4D3D0A] peer-checked:text-[#1A1504]">Over 3 years</span>
                </div>
              </label>
            </div>
          </section>
        </div>

        <!-- Question 5: Medication -->
        <div class="step hidden opacity-0 translate-y-4 transition-all duration-300 absolute inset-0 w-full" data-step="5">
          <section class="space-y-3 sm:space-y-4">
            <h3 class="text-base sm:text-lg font-medium text-[#4D3D0A]">5. Are you currently on medication?</h3>
            <div class="grid grid-cols-2 gap-3 sm:gap-4">
              <label class="cursor-pointer">
                <input type="radio" name="medication" value="yes" class="peer sr-only">
                <div class="flex flex-col items-center justify-center gap-2 py-4 sm:py-5 px-3 rounded-2xl bg-[#E5B514] text-[#66510A] peer-checked:bg-[#FFFDF5] peer-checked:text-[#1A1504] peer-checked:shadow-sm peer-checked:[&>iconify-icon]:text-[#D9AC13] hover:bg-[#D9AC13] transition-all">
                  <iconify-icon icon="solar:pill-linear" width="28" height="28" class="transition-colors"></iconify-icon>
                  <span class="font-medium text-base sm:text-lg">Yes</span>
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="medication" value="no" class="peer sr-only">
                <div class="flex flex-col items-center justify-center gap-2 py-4 sm:py-5 px-3 rounded-2xl bg-[#E5B514] text-[#66510A] peer-checked:bg-[#FFFDF5] peer-checked:text-[#1A1504] peer-checked:shadow-sm peer-checked:[&>iconify-icon]:text-[#D9AC13] hover:bg-[#D9AC13] transition-all">
                  <iconify-icon icon="solar:close-circle-linear" width="28" height="28" class="transition-colors"></iconify-icon>
                  <span class="font-medium text-base sm:text-lg">No</span>
                </div>
              </label>
            </div>
          </section>
        </div>
      </div>

      <!-- Navigation Buttons -->
      <div class="pt-6 sm:pt-8 mt-auto flex items-center gap-2 sm:gap-4 z-10 bg-[#FFCA16] flex-shrink-0">
        <button type="button" id="prev-btn" class="hidden flex-1 bg-[#E5B514] text-[#66510A] py-3 sm:py-4 rounded-xl sm:rounded-2xl text-sm sm:text-lg font-medium hover:bg-[#D9AC13] focus:ring-4 focus:ring-white/30 transition-all flex items-center justify-center gap-2">
          <iconify-icon icon="solar:arrow-left-linear" width="18" height="18" class="sm:w-[20px] sm:h-[20px]"></iconify-icon>
          Back
        </button>
        <button type="button" id="next-btn" class="flex-1 bg-[#261E05] text-[#FFFDF5] py-3 sm:py-4 rounded-xl sm:rounded-2xl text-sm sm:text-lg font-medium hover:bg-[#1A1403] focus:ring-4 focus:ring-[#261E05]/30 transition-all shadow-lg sm:shadow-xl shadow-[#261E05]/20 flex items-center justify-center gap-2">
          Next
          <iconify-icon icon="solar:arrow-right-linear" width="18" height="18" class="sm:w-[20px] sm:h-[20px]"></iconify-icon>
        </button>
        <button type="submit" id="submit-btn" class="hidden flex-1 bg-[#261E05] text-[#FFFDF5] py-3 sm:py-4 rounded-xl sm:rounded-2xl text-sm sm:text-lg font-medium hover:bg-[#1A1403] focus:ring-4 focus:ring-[#261E05]/30 transition-all shadow-lg sm:shadow-xl shadow-[#261E05]/20 flex items-center justify-center gap-2">
          Complete
          <iconify-icon icon="solar:check-circle-linear" width="18" height="18" class="sm:w-[20px] sm:h-[20px]"></iconify-icon>
        </button>
      </div>

    </form>
  </main>

  <style>
    /* Custom scrollbar for mobile-friendly inner scrolling lists */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #D9AC13;
      border-radius: 10px;
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let currentStep = 1;
      const totalSteps = 5;
      const steps = document.querySelectorAll('.step');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const submitBtn = document.getElementById('submit-btn');
      const progressBar = document.getElementById('progress-bar');
      const stepIndicator = document.getElementById('step-indicator');
      const progressPercentage = document.getElementById('progress-percentage');
      const form = document.getElementById('assessment-form');

      function updateUI() {
        steps.forEach((step, index) => {
          if (index + 1 === currentStep) {
            step.classList.remove('hidden');
            requestAnimationFrame(() => {
              step.classList.remove('opacity-0', 'translate-y-4');
              step.classList.add('opacity-100', 'translate-y-0');
            });
          } else {
            step.classList.add('opacity-0', 'translate-y-4');
            step.classList.remove('opacity-100', 'translate-y-0');
            setTimeout(() => {
              if (index + 1 !== currentStep) step.classList.add('hidden');
            }, 300);
          }
        });

        if (currentStep === 1) {
          prevBtn.classList.add('hidden');
          prevBtn.classList.remove('flex');
        } else {
          prevBtn.classList.remove('hidden');
          prevBtn.classList.add('flex');
        }

        if (currentStep === totalSteps) {
          nextBtn.classList.add('hidden');
          nextBtn.classList.remove('flex');
          submitBtn.classList.remove('hidden');
          submitBtn.classList.add('flex');
        } else {
          nextBtn.classList.remove('hidden');
          nextBtn.classList.add('flex');
          submitBtn.classList.add('hidden');
          submitBtn.classList.remove('flex');
        }

        const percentage = Math.round((currentStep / totalSteps) * 100);
        progressBar.style.width = `${percentage}%`;
        stepIndicator.textContent = `Step ${currentStep} of ${totalSteps}`;
        progressPercentage.textContent = `${percentage}%`;
      }

      const inputs = document.querySelectorAll('input[type="radio"]');
      inputs.forEach(input => {
        input.addEventListener('change', () => {
          if (currentStep < totalSteps) {
            setTimeout(() => {
              currentStep++;
              updateUI();
            }, 350); 
          }
        });
      });

      nextBtn.addEventListener('click', () => {
        if (currentStep < totalSteps) {
          currentStep++;
          updateUI();
        }
      });

      prevBtn.addEventListener('click', () => {
        if (currentStep > 1) {
          currentStep--;
          updateUI();
        }
      });

      document.getElementById('reset-btn').addEventListener('click', () => {
        form.reset();
        currentStep = 1;
        updateUI();
      });

      updateUI();
    });
  </script>
</body>
</html>
