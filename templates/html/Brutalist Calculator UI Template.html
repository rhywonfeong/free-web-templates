<body class="bg-[#f0f0f0] min-h-screen flex items-center justify-center p-4">

        <!-- Keypad Area -->
        <div class="p-4 bg-[#e6e6e6]">
            <div class="grid grid-cols-4 gap-3">

                <!-- Row 2 -->
                <button onclick="handleInput('7')" class="btn-brutal bg-white h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-neutral-100">
                    <span class="font-mono text-xl font-bold">7</span>

                <button onclick="handleInput('8')" class="btn-brutal bg-white h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-neutral-100">
                    <span class="font-mono text-xl font-bold">8</span>

                <button onclick="handleInput('9')" class="btn-brutal bg-white h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-neutral-100">
                    <span class="font-mono text-xl font-bold">9</span>
                </button>
                <button onclick="handleInput('*')" class="btn-brutal bg-[#c4b5fd] h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-[#a78bfa] group">
                    <span class="iconify text-xl group-hover:scale-110 transition-transform" data-icon="lucide:x" data-stroke-width="1.5"></span>
                </button>

                <!-- Row 3 -->
                <button onclick="handleInput('4')" class="btn-brutal bg-white h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-neutral-100">
                    <span class="font-mono text-xl font-bold">4</span>
                </button>
                <button onclick="handleInput('5')" class="btn-brutal bg-white h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-neutral-100">
                    <span class="font-mono text-xl font-bold">5</span>
                </button>
                <button onclick="handleInput('6')" class="btn-brutal bg-white h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-neutral-100">
                    <span class="font-mono text-xl font-bold">6</span>
                </button>
                <button onclick="handleInput('-')" class="btn-brutal bg-[#c4b5fd] h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-[#a78bfa] group">
                    <span class="iconify text-xl group-hover:scale-110 transition-transform" data-icon="lucide:minus" data-stroke-width="1.5"></span>
                </button>

                <!-- Row 4 -->
                <button onclick="handleInput('1')" class="btn-brutal bg-white h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-neutral-100">
                    <span class="font-mono text-xl font-bold">1</span>
                </button>
                <button onclick="handleInput('2')" class="btn-brutal bg-white h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-neutral-100">
                    <span class="font-mono text-xl font-bold">2</span>
                </button>
                <button onclick="handleInput('3')" class="btn-brutal bg-white h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-neutral-100">
                    <span class="font-mono text-xl font-bold">3</span>
                </button>
                <button onclick="handleInput('+')" class="btn-brutal bg-[#c4b5fd] h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-[#a78bfa] group">

                </button>
                <button onclick="calculate()" class="btn-brutal col-span-2 bg-black h-16 border-[3px] border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center hover:bg-neutral-900">

        <!-- Brutal Footer Badge -->
        <div class="bg-black text-white p-2 text-center border-t-[3px] border-black">

    <!-- Hidden Audio Elements for Interaction -->
    <audio id="click-sound" src="data:audio/wav;base64,UklGRiIAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="></audio>

    <script>
        // DOM Elements
        const display = document.getElementById('display');
        const prevDisplay = document.getElementById('prev-display');
        const soundToggle = document.getElementById('sound-toggle');
        
        let currentInput = '0';
        let previousInput = '';
        let operator = null;
        let shouldResetDisplay = false;

        // Simple Beep using Web Audio API for a more robotic sound
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type = 'click') {
            if (!soundToggle.checked) return;
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'click') {
                oscillator.type = 'square'; // Brutal 8-bit sound
                oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'clear') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            }
        }

        // Handle Number and Operator Input
        function handleInput(val) {
            playSound('click');

            if (['+', '-', '*', '/'].includes(val)) {
                if (operator !== null && !shouldResetDisplay) {
                    calculate(true); // Intermediate calculation
                }
                operator = val;
                previousInput = currentInput;
                shouldResetDisplay = true;
                prevDisplay.innerText = `${previousInput} ${operator}`;
            } else {
                if (currentInput === '0' || shouldResetDisplay) {
                    if (val === '.') {
                        currentInput = '0.';
                    } else {
                        currentInput = val;
                    }
                    shouldResetDisplay = false;
                } else {
                    if (val === '.' && currentInput.includes('.')) return;
                    currentInput += val;
                }
                display.value = currentInput;
            }
        }

        // Handle Actions (AC, DEL)
        function handleAction(action) {
            if (action === 'AC') {
                playSound('clear');
                currentInput = '0';
                previousInput = '';
                operator = null;
                shouldResetDisplay = false;
                prevDisplay.innerText = '';
                display.value = currentInput;
            } else if (action === 'DEL') {
                playSound('click');
                if (shouldResetDisplay) return;
                currentInput = currentInput.slice(0, -1);
                if (currentInput === '') currentInput = '0';
                display.value = currentInput;
            }
        }

        // Calculate Result
        function calculate(intermediate = false) {
            if (operator === null || shouldResetDisplay) return;

            playSound('click');
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);

            switch (operator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': result = current === 0 ? 'Error' : prev / current; break;
                default: return;
            }

            // Handle float precision issues
            if (typeof result === 'number') {
                result = Math.round(result * 100000000) / 100000000;
            }

            currentInput = result.toString();
            operator = null;
            shouldResetDisplay = true;
            display.value = currentInput;
            
            if (!intermediate) {
                prevDisplay.innerText = `${prev} ${previousInput ? (display.value === 'Error' ? '' :  operator || '') : ''} =`; // Clear top display or show partial
                prevDisplay.innerText = ''; // Or just clear it for cleaner look
            }
        }

        // Keyboard support
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') handleInput(e.key);
            if (e.key === '.') handleInput('.');
            if (['+', '-', '*', '/'].includes(e.key)) handleInput(e.key);
            if (e.key === 'Enter' || e.key === '=') calculate();
            if (e.key === 'Backspace') handleAction('DEL');
            if (e.key === 'Escape') handleAction('AC');
        });
    </script>
