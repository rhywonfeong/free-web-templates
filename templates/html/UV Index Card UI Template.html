<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
}
</style></head>
<body class="bg-gray-200 min-h-screen flex items-center justify-center p-6">

    <div class="flex flex-wrap justify-center gap-6 max-w-7xl w-full">
        
        <!-- Card 1: UV Index -->
        <div class="bg-black text-white w-[320px] h-[320px] rounded-[2.5rem] p-7 flex flex-col justify-between shadow-2xl relative overflow-hidden ring-1 ring-white/10">
            
            <!-- Header -->
            <div class="flex items-center gap-2 text-zinc-400">
                <i data-lucide="sun" class="w-5 h-5 opacity-80" stroke-width="1.5"></i>
                <h2 class="text-xs font-medium tracking-wide uppercase text-zinc-400/80">UV Index</h2>
            </div>

            <!-- Main Value -->
            <div class="flex flex-col mt-2">
                <div class="flex flex-col">
                    <span class="text-8xl font-medium tracking-tighter leading-none -ml-1">6</span>
                    <span class="text-3xl font-medium tracking-tight mt-1">High</span>
                </div>
            </div>

            <!-- Gradient Progress Bar -->
            <div class="relative w-full h-2 mt-4 mb-2">
                <div class="absolute inset-0 rounded-full bg-[linear-gradient(90deg,#4ade80_0%,#facc15_30%,#fb923c_60%,#f43f5e_80%,#d946ef_100%)] opacity-80"></div>
                <div class="absolute top-1/2 -translate-y-1/2 left-[55%] h-5 w-1.5 bg-white rounded-full ring-[3px] ring-black shadow-sm z-10"></div>
            </div>

            <!-- Footer Text -->
            <div class="mt-auto">
                <p class="text-lg font-medium text-zinc-200 leading-snug tracking-tight">
                    Use sun protection<br>
                    until 16:00
                </p>
            </div>
        </div>

        <!-- Card 2: Sunset (Existing Design) -->
        <div class="bg-black text-white w-[320px] h-[320px] rounded-[2.5rem] p-7 flex flex-col justify-between shadow-2xl relative overflow-hidden ring-1 ring-white/10">
            
            <!-- Header -->
            <div class="flex items-center gap-2 text-zinc-400">
                <i data-lucide="sunset" class="w-5 h-5 opacity-80" stroke-width="1.5"></i>
                <h2 class="text-xs font-medium tracking-wide uppercase text-zinc-400/80">Sunset</h2>
            </div>

            <!-- Main Value -->
            <div class="flex flex-col mt-4 z-10">
                <span class="text-6xl font-medium tracking-tighter leading-none">20:38</span>
                <span class="text-zinc-400 font-medium mt-1 text-base">Sunrise: 05:42</span>
            </div>

            <!-- Visual Graph -->
            <div class="absolute bottom-0 left-0 right-0 h-40 w-full px-0 pointer-events-none">
                <svg viewBox="0 0 320 160" class="w-full h-full">
                    <defs>
                        <linearGradient id="sunGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:rgba(251, 146, 60, 0.2);stop-opacity:1" />
                            <stop offset="100%" style="stop-color:rgba(251, 146, 60, 0);stop-opacity:0" />
                        </linearGradient>
                    </defs>
                    <line x1="0" y1="110" x2="320" y2="110" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4 4" />
                    <path d="M -20,110 Q 160,-60 340,110" fill="url(#sunGradient)" stroke="none" />
                    <path d="M -20,110 Q 160,-60 340,110" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" class="opacity-80" />
                    <circle cx="230" cy="55" r="5" fill="white" stroke="#fb923c" stroke-width="2" class="shadow-[0_0_15px_rgba(251,146,60,0.8)]" />
                </svg>
            </div>

            <!-- Footer Text -->
            <div class="mt-auto relative z-10">
                 <p class="text-lg font-medium text-zinc-200 leading-snug tracking-tight">
                    Light is decreasing<br>
                    by 2m 30s
                </p>
            </div>
        </div>

        <!-- Card 3: Sunset (New Requested Design) -->
        <div class="bg-black text-white w-[320px] h-[320px] rounded-[2.5rem] p-7 flex flex-col shadow-2xl relative overflow-hidden ring-1 ring-white/10">
            
            <!-- Header -->
            <div class="flex items-center gap-2 text-zinc-400 absolute top-7 left-7 z-20">
                <i data-lucide="sunset" class="w-5 h-5 opacity-80" stroke-width="1.5"></i>
                <h2 class="text-xs font-medium tracking-wide uppercase text-zinc-400/80">Sunset</h2>
            </div>

            <!-- Content Container -->
            <div class="flex-1 flex flex-col items-center justify-center pt-8 relative z-10">
                
                <!-- Time -->
                <span class="text-[3.5rem] font-medium tracking-tighter text-white leading-none mb-1">18:57</span>

                <!-- Wave Graph -->
                <div class="w-full h-32 relative flex items-center justify-center">
                    <svg viewBox="0 0 264 100" class="w-full h-full overflow-visible">
                        <defs>
                            <linearGradient id="waveGradientNew" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="#facc15" /> 
                                <stop offset="50%" stop-color="#fb923c" />
                                <stop offset="100%" stop-color="#f43f5e" />
                            </linearGradient>
                            <mask id="maskAbove">
                                <rect x="-20" y="-20" width="300" height="80" fill="white" />
                            </mask>
                            <mask id="maskBelow">
                                <rect x="-20" y="60" width="300" height="60" fill="white" />
                            </mask>
                        </defs>
                        
                        <!-- Horizon Line -->
                        <line x1="-20" y1="60" x2="284" y2="60" stroke="#3f3f46" stroke-width="1.5" />

                        <!-- Wave Path Definitions -->
                        <!-- A smooth bell-like curve peaking at center -->
                        
                        <!-- Lower part (Gray) - masked to show only below y=60 -->
                        <path d="M -10,90 C 70,90 90,20 132,20 C 174,20 194,90 274,90" 
                              fill="none" stroke="#52525b" stroke-width="5" stroke-linecap="round" 
                              mask="url(#maskBelow)" opacity="0.6" />

                        <!-- Upper part (Gradient) - masked to show only above y=60 -->
                        <path d="M -10,90 C 70,90 90,20 132,20 C 174,20 194,90 274,90" 
                              fill="none" stroke="url(#waveGradientNew)" stroke-width="5" stroke-linecap="round"
                              mask="url(#maskAbove)" />
                        
                        <!-- Tick Mark at Peak -->
                        <!-- Placed at x=132 (center), y=20 (peak of curve) -->
                        <rect x="130" y="14" width="4" height="12" rx="2" fill="#18181b" class="ring-2 ring-transparent" />
                    </svg>
                </div>
            </div>

            <!-- Footer -->
            <div class="mt-auto z-20">
                <p class="text-base font-medium text-zinc-400">
                    Sunrise: <span class="text-zinc-200">06:33</span>
                </p>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
