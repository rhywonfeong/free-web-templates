    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System in Three.js</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body class="bg-black text-white">
    <div class="absolute top-0 left-0 p-4 z-10">
        <h1 class="text-2xl font-bold">Solar System</h1>
        <p class="text-sm">Scroll to zoom, drag to rotate</p>
    </div>
    
    <script>
        // Initialize Three.js scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Add controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        
        // Set camera position
        camera.position.z = 50;
        
        // Add ambient light
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);
        
        // Add point light (sun)
        const sunLight = new THREE.PointLight(0xffffff, 2, 300);
        scene.add(sunLight);
        
        // Create sun
        const sunGeometry = new THREE.SphereGeometry(5, 32, 32);
        const sunMaterial = new THREE.MeshBasicMaterial({ 
            color: 0xffff00,
            emissive: 0xffff00,
            emissiveIntensity: 0.5
        });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        scene.add(sun);
        
        // Planet data: [size, distance from sun, orbit speed, color]
        const planetData = [
            [0.8, 10, 0.02, 0x8A8A8A], // Mercury
            [1.5, 15, 0.015, 0xE8CAA0], // Venus
            [1.6, 20, 0.01, 0x3333FF],  // Earth
            [1.2, 25, 0.008, 0xE27B58], // Mars
            [3.5, 35, 0.005, 0xC99039], // Jupiter
            [3.0, 45, 0.004, 0xB5A642], // Saturn
            [2.5, 55, 0.003, 0x5B92E5], // Uranus
            [2.3, 65, 0.002, 0x3E5FE8]  // Neptune
        ];
        
        // Create planets and their orbits
        const planets = [];
        const orbits = [];
        
        planetData.forEach(([size, distance, speed, color]) => {
            // Create planet
            const planetGeometry = new THREE.SphereGeometry(size, 32, 16);
            const planetMaterial = new THREE.MeshLambertMaterial({ color });
            const planet = new THREE.Mesh(planetGeometry, planetMaterial);
            planet.position.x = distance;
            planet.userData = { distance, speed, angle: Math.random() * Math.PI * 2 };
            scene.add(planet);
            planets.push(planet);
            
            // Create orbit
            const orbitGeometry = new THREE.RingGeometry(distance - 0.1, distance + 0.1, 128);
            const orbitMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                side: THREE.DoubleSide,
                opacity: 0.2,
                transparent: true
            });
            const orbit = new THREE.Mesh(orbitGeometry, orbitMaterial);
            orbit.rotation.x = Math.PI / 2;
            scene.add(orbit);
            orbits.push(orbit);
        });
        
        // Create a starfield background
        const starsGeometry = new THREE.BufferGeometry();
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
        
        const starsVertices = [];
        for (let i = 0; i < 5000; i++) {
            const x = (Math.random() - 0.5) * 2000;
            const y = (Math.random() - 0.5) * 2000;
            const z = (Math.random() - 0.5) * 2000;
            starsVertices.push(x, y, z);
        }
        
        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate sun
            sun.rotation.y += 0.002;
            
            // Update planet positions
            planets.forEach(planet => {
                planet.userData.angle += planet.userData.speed;
                planet.position.x = Math.cos(planet.userData.angle) * planet.userData.distance;
                planet.position.z = Math.sin(planet.userData.angle) * planet.userData.distance;
                planet.rotation.y += 0.01;
            });
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
</body>
</html>
