<!DOCTYPE html>
<html lang="en">
  <head><script id="aura-preview-performance-controller">
(function() {
if (window.__auraPreviewPerformanceController) return;
const nativeRequestAnimationFrame = window.requestAnimationFrame
? window.requestAnimationFrame.bind(window)
: function(callback) { return window.setTimeout(function() { callback(Date.now()); }, 16); };
const nativeCancelAnimationFrame = window.cancelAnimationFrame
? window.cancelAnimationFrame.bind(window)
: window.clearTimeout.bind(window);
const nativeSetInterval = window.setInterval.bind(window);
let paused = false;
let nextFrameId = 1;
const frameRecords = new Map();
const pausedFrameCallbacks = new Map();
const style = document.createElement('style');
style.id = 'aura-preview-performance-style';
style.textContent = [
'html[data-aura-preview-paused="true"] *,',
'html[data-aura-preview-paused="true"] *::before,',
'html[data-aura-preview-paused="true"] *::after {',
'  animation-play-state: paused !important;',
'  transition-duration: 0s !important;',
'  scroll-behavior: auto !important;',
'}'
].join('\n');
document.head.appendChild(style);
window.requestAnimationFrame = function(callback) {
const frameId = nextFrameId++;
if (paused) {
pausedFrameCallbacks.set(frameId, callback);
frameRecords.set(frameId, { paused: true });
return frameId;
}
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });
return frameId;
};
window.cancelAnimationFrame = function(frameId) {
const record = frameRecords.get(frameId);
pausedFrameCallbacks.delete(frameId);
if (record && typeof record.nativeFrameId !== 'undefined') {
nativeCancelAnimationFrame(record.nativeFrameId);
}
frameRecords.delete(frameId);
};
window.setInterval = function(callback, delay) {
const args = Array.prototype.slice.call(arguments, 2);
return nativeSetInterval(function() {
if (paused) return;
callback.apply(this, args);
}, delay);
};
const flushPausedFrames = function() {
const callbacks = Array.from(pausedFrameCallbacks.entries());
pausedFrameCallbacks.clear();
callbacks.forEach(function(entry) {
const frameId = entry[0];
const callback = entry[1];
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });
});
};
const setPaused = function(nextPaused) {
const shouldPause = Boolean(nextPaused);
if (paused === shouldPause) return;
paused = shouldPause;
document.documentElement.toggleAttribute('data-aura-preview-paused', paused);
if (!paused) {
flushPausedFrames();
}
};
window.__auraPreviewPerformanceController = {
setPaused: setPaused,
get paused() {
return paused;
}
};
window.addEventListener('message', function(event) {
if (event.source !== window.parent) return;
if (!event.data || event.data.type !== 'aura-preview-performance-mode') return;
setPaused(event.data.paused);
});
})();
</script>

<title>Animated Button</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes scan { 0% { transform: translateX(-200%) skewX(-45deg); } 100% { transform: translateX(200%) skewX(-45deg); } }
</style><!-- aura-ga4-start -->

  <body
    class="bg-black min-h-screen flex items-center justify-center p-8 antialiased"
  >
    <button class="relative group outline-none focus:outline-none">
      <!-- Background Glow Effect -->
      <div
        class="absolute inset-0 -skew-x-[15deg] blur-xl opacity-40 transition-all duration-200 ease-out group-hover:opacity-80 group-hover:blur-2xl group-hover:scale-105 bg-gradient-to-r from-red-600 via-orange-500 to-yellow-400"
      ></div>

      <!-- Main Button Surface -->
      <div
        class="relative bg-gradient-to-r from-orange-500 to-amber-400 px-16 py-6 -skew-x-[15deg] transition-all duration-150 ease-out group-hover:scale-105 group-active:scale-95 flex items-center justify-center overflow-hidden"
      >
        <!-- Shine effect on hover -->
        <div
          class="absolute inset-0 bg-gradient-to-r from-transparent via-white/60 to-transparent"
          style="animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;"
        ></div>

        <!-- Button Text (Reverse Skew to keep text upright) -->
        <span
          class="relative skew-x-[15deg] text-black/90 text-2xl font-extrabold tracking-[0.15em] uppercase select-none flex items-center gap-3 group-hover:text-black transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="transparent"
            class="w-7 h-7 -ml-2 group-hover:scale-125 group-hover:text-white transition-all duration-300"
          >
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span>Daily Task</span>
        </span>
        <div
          class="absolute top-2 left-2 w-3 h-3 border-t-[3px] border-l-[3px] border-black/30"
        ></div>
        <div
          class="absolute bottom-2 right-2 w-3 h-3 border-b-[3px] border-r-[3px] border-black/30"
        ></div>
      </div>
    </button>
  </body>
