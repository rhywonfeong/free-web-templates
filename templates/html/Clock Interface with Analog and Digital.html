    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock with Digital Time</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 h-screen w-screen flex items-center justify-center m-0 p-0">
    <div class="clock-container flex flex-col items-center justify-center gap-6">
        <!-- Digital Time Display -->
        <div id="digitalTime" class="text-white text-4xl font-mono font-bold tracking-widest bg-gray-800 px-6 py-3 rounded-lg shadow-lg">
            12:00:00 AM
        </div>
        
        <!-- Analog Clock -->
        <div class="relative w-80 h-80 rounded-full bg-gray-800 border-4 border-gray-700 shadow-2xl">
            <!-- Clock Numbers -->
            <div class="absolute w-full h-full text-white text-xl font-bold">
                <div class="absolute top-2 left-1/2 -translate-x-1/2">12</div>
                <div class="absolute top-[10%] right-[25%]">1</div>
                <div class="absolute top-[25%] right-[10%]">2</div>
                <div class="absolute top-1/2 right-2 -translate-y-1/2">3</div>
                <div class="absolute bottom-[25%] right-[10%]">4</div>
                <div class="absolute bottom-[10%] right-[25%]">5</div>
                <div class="absolute bottom-2 left-1/2 -translate-x-1/2">6</div>
                <div class="absolute bottom-[10%] left-[25%]">7</div>
                <div class="absolute bottom-[25%] left-[10%]">8</div>
                <div class="absolute top-1/2 left-2 -translate-y-1/2">9</div>
                <div class="absolute top-[25%] left-[10%]">10</div>
                <div class="absolute top-[10%] left-[25%]">11</div>
            </div>
            
            <!-- Clock Center -->
            <div class="absolute top-1/2 left-1/2 w-4 h-4 rounded-full bg-white -translate-x-1/2 -translate-y-1/2 z-10"></div>
            
            <!-- Clock Hands -->
            <div id="hourHand" class="absolute w-1.5 bg-white rounded-full origin-bottom" 
                 style="height: 24%; left: 50%; bottom: 50%; transform: translateX(-50%) rotate(0deg);"></div>
            
            <div id="minuteHand" class="absolute w-1 bg-blue-400 rounded-full origin-bottom" 
                 style="height: 35%; left: 50%; bottom: 50%; transform: translateX(-50%) rotate(0deg);"></div>
                 
            <div id="secondHand" class="absolute w-0.5 bg-red-500 rounded-full origin-bottom" 
                 style="height: 40%; left: 50%; bottom: 50%; transform: translateX(-50%) rotate(0deg);"></div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours() % 12;
            
            // Calculate rotation angles
            const secondDegrees = (seconds / 60) * 360;
            const minuteDegrees = ((minutes + seconds/60) / 60) * 360;
            const hourDegrees = ((hours + minutes/60) / 12) * 360;
            
            // Apply rotation to clock hands
            document.getElementById('secondHand').style.transform = `translateX(-50%) rotate(${secondDegrees}deg)`;
            document.getElementById('minuteHand').style.transform = `translateX(-50%) rotate(${minuteDegrees}deg)`;
            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${hourDegrees}deg)`;
            
            // Update digital time with seconds
            let displayHours = hours === 0 ? 12 : hours;
            const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
            const displayMinutes = minutes.toString().padStart(2, '0');
            const displaySeconds = seconds.toString().padStart(2, '0');
            document.getElementById('digitalTime').textContent = `${displayHours}:${displayMinutes}:${displaySeconds} ${ampm}`;
        }
        
        // Update the clock immediately and then every second
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
