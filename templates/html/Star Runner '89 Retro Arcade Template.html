          </div>
          <div class="h-8 w-px bg-[#40503f]"></div>
          <div class="text-center sm:text-right">
            <p class="text-xs tracking-[0.16em] text-[#73816e]">BONUS</p>

    <footer class="flex w-full max-w-4xl flex-wrap items-center justify-between gap-2 border-t border-[#253326] pt-4 text-xs tracking-wider text-[#647361]">

      <span>BEST PLAYED WITH THE LIGHTS LOW</span>

  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const screenMessage = document.getElementById('screenMessage');
    const statusText = document.getElementById('statusText');
    const comboText = document.getElementById('comboText');
    const highScoreEl = document.getElementById('highScore');

    let running = false, score = 0, lives = 3, frame = 0, direction = 0, combo = 0, comboTimer = 0, boost = 0;
    let highScore = Number(localStorage.getItem('starRunnerHigh') || 0);
    let player, stars, meteors, orbs, particles, popups;
    const sky = Array.from({ length: 54 }, () => ({
      x: Math.floor(Math.random() * 320), y: Math.floor(Math.random() * 125),
      s: Math.random() > 0.84 ? 2 : 1, t: Math.floor(Math.random() * 90)
    }));

    highScoreEl.textContent = String(highScore).padStart(5, '0');

    function rect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(Math.round(x), Math.round(y), w, h);
    }

    function text(value, x, y, color, align = 'left') {
      ctx.fillStyle = color;
      ctx.font = '8px monospace';
      ctx.textAlign = align;
      ctx.fillText(value, x, y);
    }

    function resetGame() {
      score = 0; lives = 3; frame = 0; direction = 0; combo = 0; comboTimer = 0; boost = 0;
      player = { x: 150, y: 148, w: 16, h: 14, invincible: 0 };
      stars = []; meteors = []; orbs = []; particles = []; popups = [];
      running = true;
      screenMessage.classList.add('hidden');
      statusText.textContent = 'GAME ON';
      comboText.textContent = 'COMBO ×1';
      startBtn.textContent = 'RESET';
    }

    function startGame() {
      if (!running) resetGame();
      else activateBoost();
    }

    function activateBoost() {
      if (!running || boost > 0) return;
      boost = 95;
      player.invincible = Math.max(player.invincible, 95);
      burst(player.x + 8, player.y + 7, '#75f4ff', 22);
      statusText.textContent = 'STAR BOOST!';
    }

    function burst(x, y, color, amount = 10) {
      for (let i = 0; i < amount; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = 0.4 + Math.random() * 1.8;
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 14 + Math.random() * 18, color });
      }
    }

    function hit(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function addScore(amount, x, y, color = '#b8ff72') {
      score += amount;
      popups.push({ x, y, value: '+' + amount, life: 35, color });
    }

    function spawn() {
      const pace = Math.max(30, 66 - Math.floor(score / 7));
      if (frame % pace === 0) stars.push({ x: 12 + Math.random() * 296, y: -8, speed: 0.75 + Math.random() * 0.65, spin: 0 });
      if (frame % Math.max(18, 48 - Math.floor(score / 5)) === 0) meteors.push({ x: 8 + Math.random() * 300, y: -12, speed: 1.05 + Math.random() * 0.9, size: Math.random() > 0.72 ? 10 : 7 });
      if (frame % 420 === 150) orbs.push({ x: 20 + Math.random() * 280, y: -10, speed: 0.8, spin: 0 });
    }

    function update() {
      if (!running) return;
      frame++;
      spawn();

      if (boost > 0) {
        boost--;
        if (boost === 0) statusText.textContent = 'GAME ON';
      }

      if (comboTimer > 0) comboTimer--;
      else if (combo > 0) {
        combo = 0;
        comboText.textContent = 'COMBO ×1';
      }

      player.x += direction * (boost ? 3.4 : 2.25);
      player.x = Math.max(5, Math.min(299, player.x));
      if (player.invincible > 0) player.invincible--;

      stars.forEach(s => { s.y += s.speed; s.spin++; });
      meteors.forEach(m => m.y += m.speed);
      orbs.forEach(o => { o.y += o.speed; o.spin++; });

      stars = stars.filter(s => {
        const target = { x: s.x - 4, y: s.y - 4, w: 8, h: 8 };
        if (hit(player, target) || (boost && Math.abs(player.x + 8 - s.x) < 28 && Math.abs(player.y - s.y) < 28)) {
          combo = Math.min(9, combo + 1);
          comboTimer = 105;
          const multiplier = 1 + Math.floor(combo / 3);
          addScore(10 * multiplier, s.x, s.y, multiplier > 1 ? '#ff9cdb' : '#b8ff72');
          comboText.textContent = 'COMBO ×' + multiplier;
          burst(s.x, s.y, multiplier > 1 ? '#ff9cdb' : '#fff5b0', 9);
          return false;
        }
        return s.y < 188;
      });

      orbs = orbs.filter(o => {
        if (hit(player, { x: o.x - 6, y: o.y - 6, w: 12, h: 12 })) {
          addScore(75, o.x, o.y, '#75f4ff');
          boost = 150;
          player.invincible = 150;
          statusText.textContent = 'RAINBOW RUSH!';
          burst(o.x, o.y, '#75f4ff', 28);
          return false;
        }
        return o.y < 190;
      });

      meteors = meteors.filter(m => {
        const target = { x: m.x - m.size / 2, y: m.y - m.size / 2, w: m.size, h: m.size };
        if (boost && hit(player, target)) {
          addScore(15, m.x, m.y, '#75f4ff');
          burst(m.x, m.y, '#75f4ff', 13);
          return false;
        }
        if (player.invincible === 0 && hit(player, target)) {
          lives--;
          player.invincible = 90;
          combo = 0;
          comboText.textContent = 'COMBO ×1';
          burst(player.x + 8, player.y + 7, '#d34b3e', 22);
          if (lives <= 0) endGame();
          else statusText.textContent = 'WATCH OUT!';
          return false;
        }
        return m.y < 195;
      });

      particles = particles.filter(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life--;
        return p.life > 0;
      });

      popups = popups.filter(p => { p.y -= 0.45; p.life--; return p.life > 0; });
    }

    function endGame() {
      running = false;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('starRunnerHigh', highScore);
        highScoreEl.textContent = String(highScore).padStart(5, '0');
      }
      statusText.textContent = score >= highScore && score > 0 ? 'NEW RECORD!' : 'GAME OVER';
      startBtn.textContent = 'START';
      screenMessage.classList.remove('hidden');
      screenMessage.innerHTML = `<div class="border border-[#e4c277]/80 bg-[#21140e]/90 px-7 py-5 text-center shadow-[0_0_1.5rem_rgba(228,194,119,0.16)]">
        <p class="text-base font-semibold tracking-[0.15em] text-[#fff0c5]">GAME OVER</p>
        <p class="mt-2 text-xs tracking-wider text-[#e4c277]">SCORE ${String(score).padStart(5, '0')}</p>
        <p class="mt-2 text-xs tracking-wider text-[#b8ff72]">PRESS START</p>
      </div>`;
    }

    function drawStar(s) {
      const x = Math.round(s.x), y = Math.round(s.y), bright = s.spin % 16 < 8;
      rect(x - 1, y - 4, 2, 9, '#fff5b0');
      rect(x - 4, y - 1, 9, 2, '#fff5b0');
      rect(x - 2, y - 2, 5, 5, bright ? '#ffffff' : '#e4c277');
      rect(x, y, 1, 1, '#ffffff');
    }

    function drawOrb(o) {
      const x = Math.round(o.x), y = Math.round(o.y);
      const colors = ['#ff8fcf', '#75f4ff', '#b8ff72', '#e4c277'];
      rect(x - 5, y - 2, 11, 5, colors[o.spin % 4]);
      rect(x - 2, y - 5, 5, 11, colors[(o.spin + 1) % 4]);
      rect(x - 3, y - 3, 7, 7, '#ffffff');
      rect(x - 1, y - 1, 3, 3, '#75f4ff');
    }

    function drawMeteor(m) {
      const x = Math.round(m.x), y = Math.round(m.y), s = m.size;
      rect(x - s / 2 - 2, y - 1, 3, 2, '#713038');
      rect(x - s / 2, y - s / 2 + 2, s, s - 4, '#a44944');
      rect(x - s / 2 + 2, y - s / 2, s - 4, s, '#a44944');
      rect(x - 2, y - 2, 3, 3, '#5b282f');
      rect(x + 2, y + 1, 2, 2, '#e17455');
    }

    function drawPlayer() {
      if (player.invincible > 0 && !boost && Math.floor(player.invincible / 5) % 2 === 0) return;
      const x = Math.round(player.x), y = player.y;
      if (boost) {
        rect(x - 8, y + 4, 8, 2, '#75f4ff');
        rect(x - 14, y + 6, 12, 1, '#ff9cdb');
      }
      rect(x + 4, y - 3, 8, 2, boost ? '#75f4ff' : '#e4c277');
      rect(x + 2, y, 12, 10, boost ? '#75f4ff' : '#b8ff72');
      rect(x, y + 3, 16, 5, '#d8f6c9');
      rect(x + 3, y + 2, 3, 2, '#15251d');
      rect(x + 10, y + 2, 3, 2, '#15251d');
      rect(x + 2, y + 10, 4, 3, '#e4c277');
      rect(x + 10, y + 10, 4, 3, '#e4c277');
      rect(x - 2, y + 5, 2, 2, '#5dd2cf');
      rect(x + 16, y + 5, 2, 2, '#5dd2cf');
    }

    function draw() {
      ctx.fillStyle = '#071019';
      ctx.fillRect(0, 0, 320, 180);

      sky.forEach(dot => {
        const twinkle = (frame + dot.t) % 70 < 5;
        rect(dot.x, dot.y, dot.s, dot.s, twinkle ? '#d8f6c9' : '#637b84');
      });

      rect(0, 126, 320, 2, '#1d3d46');
      for (let i = 0; i < 18; i++) {
        const x = (i * 23 + 6) % 320, h = 5 + ((i * 17) % 18);
        rect(x, 126 - h, 13, h, i % 3 === 0 ? '#142d36' : '#102832');
        rect(x + 3, 129 - h, 2, 2, '#29515a');
      }

      rect(0, 128, 320, 52, '#0a2022');
      for (let y = 136; y < 180; y += 11) rect(0, y, 320, 1, '#164143');
      for (let x = -20; x < 340; x += 26) {
        ctx.strokeStyle = '#164143';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(160, 128);
        ctx.lineTo(x, 180);
        ctx.stroke();
      }

      stars.forEach(drawStar);
      orbs.forEach(drawOrb);
      meteors.forEach(drawMeteor);
      particles.forEach(p => rect(p.x, p.y, 2, 2, p.color));
      drawPlayer();

      popups.forEach(p => text(p.value, p.x, p.y, p.color, 'center'));

      rect(0, 0, 320, 16, '#081017');
      rect(0, 15, 320, 1, '#294047');
      text('SCORE ' + String(score).padStart(5, '0'), 8, 11, '#b8ff72');
      text('HI ' + String(highScore).padStart(5, '0'), 160, 11, '#e4c277', 'center');
      text(boost ? 'BOOST!' : 'SHIP', 274, 11, boost ? '#75f4ff' : '#d8f6c9');
      for (let i = 0; i < lives; i++) rect(305 + i * 4, 6, 3, 5, '#d34b3e');

      if (!running && score === 0) text('STAR SECTOR 04', 160, 67, '#789a84', 'center');
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    function setDirection(value) {
      direction = value;
      if (!running) resetGame();
    }

    document.addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      if (key === 'arrowleft' || key === 'a') setDirection(-1);
      if (key === 'arrowright' || key === 'd') setDirection(1);
      if (event.key === 'Enter') {
        event.preventDefault();
        startGame();
      }
      if (event.key === ' ' || key === 'b') {
        event.preventDefault();
        if (!running) resetGame();
        else activateBoost();
      }
    });

    document.addEventListener('keyup', event => {
      if (['ArrowLeft', 'ArrowRight', 'a', 'd', 'A', 'D'].includes(event.key)) direction = 0;
    });

    function bindControl(id, value) {
      const button = document.getElementById(id);
      button.addEventListener('pointerdown', event => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        setDirection(value);
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => {
        button.addEventListener(type, () => direction = 0);
      });
    }

    bindControl('leftBtn', -1);
    bindControl('rightBtn', 1);
    startBtn.addEventListener('click', startGame);
    canvas.addEventListener('click', startGame);

    player = { x: 150, y: 148, w: 16, h: 14, invincible: 0 };
