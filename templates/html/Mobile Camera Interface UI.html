  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lens Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    @keyframes slide-up{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes flash{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
    .slide-up{animation:slide-up .3s ease-out forwards}
    .pulse-subtle{animation:pulse 2s infinite}
    .flash{animation:flash .3s ease-out}
  </style>
</head>
<body class="bg-gray-900 h-screen flex items-center justify-center p-4">
  <div class="relative w-[280px] h-[580px] bg-black rounded-[45px] shadow-2xl border border-gray-800 overflow-hidden">
    <!-- Dynamic Island -->
    <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-[120px] h-[34px] bg-black rounded-b-[18px] z-20 flex items-center justify-center">
      <div class="w-[10px] h-[10px] bg-gray-700 rounded-full mr-14"></div>
      <div id="recordingDot" class="w-[6px] h-[6px] bg-green-500 rounded-full pulse-subtle opacity-0"></div>
    </div>
    
    <!-- Status Bar -->
    <div class="pt-10 px-6 flex justify-between items-center text-white text-xs z-10">
      <span id="time">9:41</span>
      <div class="flex space-x-1">
        <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
        </svg>
        <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
        </svg>
        <svg class="h-3 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
    </div>
    
    <!-- Main Camera Interface -->
    <div id="cameraInterface" class="relative h-[350px] overflow-hidden bg-gradient-to-b from-gray-800 to-gray-900">
      <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1682687220063-4742bd7fd538')] bg-cover bg-center opacity-80"></div>
      <video id="cameraView" class="absolute inset-0 w-full h-full object-cover opacity-0 transition-opacity duration-300"></video>
      <div id="flashOverlay" class="absolute inset-0 bg-white opacity-0 z-10"></div>
      <div id="focusPoint" class="absolute w-16 h-16 border-2 border-blue-400 rounded-lg opacity-0 pointer-events-none transition-all duration-300 transform -translate-x-1/2 -translate-y-1/2"></div>
      
      <!-- Exposure Meter -->
      <div class="absolute right-4 top-1/2 transform -translate-y-1/2 h-32 w-1 bg-gray-800 rounded-full overflow-hidden">
        <div id="exposureLevel" class="w-full h-1/2 bg-white rounded-full absolute bottom-0 transition-all duration-300"></div>
      </div>
      
      <!-- Zoom Control -->
      <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 w-48 flex flex-col items-center">
        <div class="bg-black bg-opacity-50 rounded-full px-3 py-1 text-white text-xs mb-2">
          <span id="zoomLevel">1.0</span>x
        </div>
        <input type="range" id="zoomSlider" min="10" max="50" value="10" class="w-full h-1 bg-white rounded-full appearance-none cursor-pointer">
      </div>
    </div>
    
    <!-- Photo Gallery Interface (Hidden by default) -->
    <div id="galleryInterface" class="relative h-[350px] overflow-hidden bg-gray-900 hidden">
      <div class="absolute top-0 left-0 w-full p-3 flex justify-between items-center bg-black bg-opacity-50 z-10">
        <button id="backToCamera" class="text-white text-sm">&lt; Back</button>
        <span class="text-white text-sm">Select Photos (0/3)</span>
      </div>
      
      <div class="grid grid-cols-3 gap-1 p-1 h-full overflow-y-auto">
        <div class="aspect-square bg-gray-800 relative" id="photo1">
          <img src="https://images.unsplash.com/photo-1682687220063-4742bd7fd538" class="w-full h-full object-cover">
          <div class="absolute top-2 right-2 w-5 h-5 rounded-full border-2 border-white" data-selected="false"></div>
        </div>
        <div class="aspect-square bg-gray-800 relative" id="photo2">
          <img src="https://images.unsplash.com/photo-1682687220063-4742bd7fd538" class="w-full h-full object-cover">
          <div class="absolute top-2 right-2 w-5 h-5 rounded-full border-2 border-white" data-selected="false"></div>
        </div>
        <div class="aspect-square bg-gray-800 relative" id="photo3">
          <img src="https://images.unsplash.com/photo-1682687220063-4742bd7fd538" class="w-full h-full object-cover">
          <div class="absolute top-2 right-2 w-5 h-5 rounded-full border-2 border-white" data-selected="false"></div>
        </div>
        <div class="aspect-square bg-gray-800 relative" id="photo4">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330" class="w-full h-full object-cover">
          <div class="absolute top-2 right-2 w-5 h-5 rounded-full border-2 border-white" data-selected="false"></div>
        </div>
        <div class="aspect-square bg-gray-800 relative" id="photo5">
          <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b" class="w-full h-full object-cover">
          <div class="absolute top-2 right-2 w-5 h-5 rounded-full border-2 border-white" data-selected="false"></div>
        </div>
        <div class="aspect-square bg-gray-800 relative" id="photo6">
          <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" class="w-full h-full object-cover">
          <div class="absolute top-2 right-2 w-5 h-5 rounded-full border-2 border-white" data-selected="false"></div>
        </div>
      </div>
      
      <div class="absolute bottom-0 left-0 w-full p-3 flex justify-center bg-black bg-opacity-50">
        <button id="shareSelectedBtn" class="bg-blue-500 text-white px-4 py-2 rounded-lg opacity-50 pointer-events-none">Share Selected</button>
      </div>
    </div>
    
    <!-- Camera Controls -->
    <div class="h-[170px] bg-black bg-opacity-90 px-6 pt-4 pb-8">
      <!-- Mode Selector -->
      <div class="flex justify-center space-x-6 mb-6 text-xs text-gray-400">
        <div class="mode-option slide-up cursor-pointer" data-mode="photo" style="animation-delay:0.1s">
          <span class="text-white font-medium">PHOTO</span>
          <div class="h-0.5 bg-white w-full mt-1 rounded-full"></div>
        </div>
        <div class="mode-option slide-up cursor-pointer" data-mode="video" style="animation-delay:0.2s">VIDEO</div>
        <div class="mode-option slide-up cursor-pointer" data-mode="portrait" style="animation-delay:0.3s">PORTRAIT</div>
        <div class="mode-option slide-up cursor-pointer" data-mode="cinematic" style="animation-delay:0.4s">CINEMATIC</div>
      </div>
      
      <!-- Bottom Controls -->
      <div class="flex items-center justify-between">
        <!-- Last Photo Thumbnail -->
        <div id="lastPhotoThumbnail" class="w-10 h-10 rounded-md bg-gray-700 overflow-hidden slide-up cursor-pointer" style="animation-delay:0.5s;background-image:url('https://images.unsplash.com/photo-1682687220063-4742bd7fd538');background-size:cover"></div>
        
        <!-- Shutter Button -->
        <div id="shutterBtn" class="w-16 h-16 rounded-full border-2 border-white flex items-center justify-center slide-up cursor-pointer transition-transform duration-150" style="animation-delay:0.2s">
          <div class="w-14 h-14 rounded-full bg-white"></div>
        </div>
        
        <!-- Camera Flip -->
        <div id="flipCameraBtn" class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center slide-up cursor-pointer" style="animation-delay:0.5s">
          <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const cameraView = document.getElementById('cameraView');
      const shutterBtn = document.getElementById('shutterBtn');
      const flashOverlay = document.getElementById('flashOverlay');
      const focusPoint = document.getElementById('focusPoint');
      const flipCameraBtn = document.getElementById('flipCameraBtn');
      const lastPhotoThumbnail = document.getElementById('lastPhotoThumbnail');
      const recordingDot = document.getElementById('recordingDot');
      const timeDisplay = document.getElementById('time');
      const modeOptions = document.querySelectorAll('.mode-option');
      const zoomSlider = document.getElementById('zoomSlider');
      const zoomLevel = document.getElementById('zoomLevel');
      const cameraInterface = document.getElementById('cameraInterface');
      const galleryInterface = document.getElementById('galleryInterface');
      const backToCamera = document.getElementById('backToCamera');
      const shareSelectedBtn = document.getElementById('shareSelectedBtn');
      const photoSelectors = document.querySelectorAll('[data-selected]');
      
      let currentMode = 'photo';
      let facingMode = 'environment';
      let isRecording = false;
      let selectedCount = 0;
      
      function updateTime() {
        const now = new Date();
        timeDisplay.textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      }
      updateTime();
      setInterval(updateTime, 60000);
      
      async function initCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {facingMode, zoom: true}, 
            audio: currentMode === 'video'
          });
          cameraView.srcObject = stream;
          cameraView.play();
          cameraView.style.opacity = 1;
        } catch (err) {
          console.log('Camera access error:', err);
        }
      }
      
      // Zoom functionality
      zoomSlider.addEventListener('input', () => {
        const zoomValue = zoomSlider.value / 10;
        zoomLevel.textContent = zoomValue.toFixed(1);
        
        if (cameraView.srcObject) {
          const videoTrack = cameraView.srcObject.getVideoTracks()[0];
          const capabilities = videoTrack.getCapabilities();
          
          if (capabilities.zoom) {
            const zoomRatio = zoomValue;
            videoTrack.applyConstraints({advanced: [{zoom: zoomRatio}]})
              .catch(e => console.log('Zoom not supported', e));
          }
        }
      });
      
      // Gallery functionality
      lastPhotoThumbnail.addEventListener('click', () => {
        cameraInterface.classList.add('hidden');
        galleryInterface.classList.remove('hidden');
      });
      
      backToCamera.addEventListener('click', () => {
        galleryInterface.classList.add('hidden');
        cameraInterface.classList.remove('hidden');
      });
      
      // Photo selection
      photoSelectors.forEach(selector => {
        selector.addEventListener('click', () => {
          const isSelected = selector.dataset.selected === 'true';
          
          if (isSelected) {
            selector.dataset.selected = 'false';
            selector.classList.remove('bg-blue-500');
            selectedCount--;
          } else if (selectedCount < 3) {
            selector.dataset.selected = 'true';
            selector.classList.add('bg-blue-500');
            selectedCount++;
          }
          
          // Update UI
          document.querySelector('#galleryInterface span').textContent = `Select Photos (${selectedCount}/3)`;
          
          if (selectedCount > 0) {
            shareSelectedBtn.classList.remove('opacity-50', 'pointer-events-none');
          } else {
            shareSelectedBtn.classList.add('opacity-50', 'pointer-events-none');
          }
        });
      });
      
      // Initialize camera on button click to avoid autoplay restrictions
      shutterBtn.addEventListener('click', () => {
        if (cameraView.srcObject === null) {
          initCamera();
        }
        
        shutterBtn.classList.add('scale-95');
        setTimeout(() => shutterBtn.classList.remove('scale-95'), 150);
        
        if (currentMode === 'photo') {
          flashOverlay.classList.add('flash');
          setTimeout(() => flashOverlay.classList.remove('flash'), 300);
        } else if (currentMode === 'video') {
          isRecording = !isRecording;
          recordingDot.style.opacity = isRecording ? 1 : 0;
        }
      });
      
      cameraView.parentElement.addEventListener('click', (e) => {
        const rect = cameraView.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        focusPoint.style.left = `${x}px`;
        focusPoint.style.top = `${y}px`;
        focusPoint.style.opacity = '1';
        
        setTimeout(() => {
          focusPoint.style.opacity = '0';
        }, 1000);
      });
      
      flipCameraBtn.addEventListener('click', () => {
        if (cameraView.srcObject) {
          cameraView.srcObject.getTracks().forEach(track => track.stop());
          facingMode = facingMode === 'environment' ? 'user' : 'environment';
          initCamera();
        }
      });
      
      modeOptions.forEach(option => {
        option.addEventListener('click', () => {
          const mode = option.dataset.mode;
          currentMode = mode;
          
          modeOptions.forEach(opt => {
            opt.innerHTML = opt.textContent;
            opt.classList.remove('text-white', 'font-medium');
          });
          
          option.innerHTML = `<span class="text-white font-medium">${option.textContent}</span><div class="h-0.5 bg-white w-full mt-1 rounded-full"></div>`;
        });
      });
    });
  </script>
</body>
</html>
