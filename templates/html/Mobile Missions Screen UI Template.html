<body class="bg-zinc-100 flex items-center justify-center min-h-screen text-zinc-900 selection:bg-yellow-100">

    <!-- Mobile App Container -->
    <div class="w-full max-w-sm h-[850px] bg-white sm:rounded-[2rem] sm:border sm:border-zinc-200 relative overflow-hidden flex flex-col shadow-2xl">
        
        <!-- Header -->
        <header class="pt-12 pb-2 px-6 bg-white/90 backdrop-blur-md sticky top-0 z-20">
            <div class="flex items-center justify-between mb-6">
                <h1 class="text-xl font-bold tracking-tight text-zinc-900">미션</h1>
                <!-- Currency Balance (Mini) -->
                <div class="flex items-center gap-2 bg-zinc-50 px-3 py-1.5 rounded-full border border-zinc-100">

            </div>

            <div class="bg-zinc-900 rounded-2xl p-5 text-white relative overflow-hidden shadow-lg mb-2">
                <!-- Background Pattern -->
                <div class="absolute top-0 right-0 w-32 h-32 bg-yellow-500 rounded-full blur-[60px] opacity-20 translate-x-10 -translate-y-10"></div>
                
                <div class="flex justify-between items-start relative z-10 mb-4">

                    <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center border border-white/10">

                    </div>
                </div>

                <!-- Progress Bar -->

                    </div>
                    <div class="flex justify-between text-[10px] text-zinc-400 font-medium">
                        <span>현재 3개</span>
                        <span class="text-yellow-400">목표 5개</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto no-scrollbar bg-white">
            
            <!-- Tab Navigation -->
            <div class="sticky top-0 bg-white z-10 px-6 py-2 border-b border-zinc-100">
                <div class="flex p-1 bg-zinc-100 rounded-xl">
                    <button class="flex-1 py-2 rounded-lg bg-white text-xs font-semibold shadow-sm text-zinc-900 transition-all">일일 미션</button>
                    <button class="flex-1 py-2 rounded-lg text-xs font-medium text-zinc-500 hover:text-zinc-700 transition-all">주간 도전</button>

            </div>

                <div class="flex items-center gap-2">
                    <i data-lucide="sun" class="w-4 h-4 text-orange-500" stroke-width="1.5"></i>
                    <span class="text-xs font-semibold text-zinc-900">오늘의 할 일</span>
                </div>

                <!-- Mission Item: Claimable -->
                <div class="flex items-center gap-4 p-4 rounded-2xl border border-yellow-200 bg-yellow-50/30">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full bg-yellow-100 flex items-center justify-center text-yellow-600">

                    <button class="flex-shrink-0 border border-zinc-200 text-zinc-600 hover:bg-zinc-50 text-xs font-medium px-3 py-1.5 rounded-lg transition-colors">
                        이동
                    </button>
                </div>

                <!-- Mission Item: In Progress -->
                <div class="flex items-center gap-4 p-4 rounded-2xl border border-zinc-100 bg-white shadow-sm">
                    <div class="flex-shrink-0 w-10 h-10 rounded-full bg-zinc-50 flex items-center justify-center text-zinc-500 border border-zinc-100">
                        <i data-lucide="egg" class="w-5 h-5" stroke-width="1.5"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center mb-1">
                            <h3 class="text-sm font-medium text-zinc-900">황금알 수확</h3>

                <!-- Divider -->

                <!-- Section Title: Completed -->

                    <span class="text-[10px] font-medium text-zinc-400 group-hover:text-zinc-600">MY</span>

            </ul>
