  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Hearts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes heartBeat {
      0% { transform: scale(0); opacity: 0; }
      15% { transform: scale(1.3); opacity: 0.9; }
      30% { transform: scale(0.95); opacity: 0.85; }
      45% { transform: scale(1.1); opacity: 0.9; }
      60% { transform: scale(1); opacity: 0.85; }
      100% { transform: scale(1); opacity: 0; }
    }
    .heart-container { position: relative; width: 100%; height: 100vh; overflow: hidden; }
    .heart {
      position: absolute;
      animation: heartBeat 2s forwards;
    }
    .floating {
      animation: float 6s ease-in-out infinite;
    }
    .pulsing {
      animation: pulse 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-900 to-black m-0 p-0 overflow-hidden">
  <div class="heart-container" id="heartContainer">
    <!-- Floating hearts -->
    <div class="floating pulsing absolute top-1/4 left-1/3 opacity-70">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="#9e91bc">

      </svg>
    </div>
    <div class="floating pulsing absolute top-1/2 left-2/3 opacity-60" style="animation-delay: 0.5s">

    <div class="floating pulsing absolute top-1/3 left-3/4 opacity-50" style="animation-delay: 1.5s">

      <svg width="65" height="65" viewBox="0 0 24 24" fill="#4a4e7c">
        <path d="M12,21.35L10.55,20.03C5.4,15.36 2,12.27 2,8.5C2,5.41 4.42,3 7.5,3C9.24,3 10.91,3.81 12,5.08C13.09,3.81 14.76,3 16.5,3C19.58,3 22,5.41 22,8.5C22,12.27 18.6,15.36 13.45,20.03L12,21.35Z"/>
      </svg>
    </div>

  <script>
    const heartContainer = document.getElementById('heartContainer');
    const colors = ['#9e91bc', '#4a4e7c', '#6f7db7'];
    
    // Create Twitter-like heart animation on click
    heartContainer.addEventListener('click', (e) => {
      const heart = document.createElement('div');
      heart.className = 'heart';
      
      // Random heart size between 40 and 80
      const size = Math.floor(Math.random() * 40) + 40;
      
      // Position heart at click location
      heart.style.left = (e.clientX - size/2) + 'px';
      heart.style.top = (e.clientY - size/2) + 'px';
      
      // Random color from our palette
      const color = colors[Math.floor(Math.random() * colors.length)];
      
      // Create the heart SVG
      heart.innerHTML = `
        <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}">
          <path d="M12,21.35L10.55,20.03C5.4,15.36 2,12.27 2,8.5C2,5.41 4.42,3 7.5,3C9.24,3 10.91,3.81 12,5.08C13.09,3.81 14.76,3 16.5,3C19.58,3 22,5.41 22,8.5C22,12.27 18.6,15.36 13.45,20.03L12,21.35Z"/>
        </svg>
      `;
      
      heartContainer.appendChild(heart);
      
      // Remove heart after animation completes
      setTimeout(() => {
        heart.remove();
      }, 2000);
    });
    
    // Auto-generate hearts periodically
    setInterval(() => {
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;
      
      const event = new MouseEvent('click', {
        clientX: x,
        clientY: y
      });
      
      heartContainer.dispatchEvent(event);
    }, 300);
  </script>
