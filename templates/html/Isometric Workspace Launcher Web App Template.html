<style>
body {
background-color: #050505;
overflow: hidden;
touch-action: pan-x pan-y;
}
/* 3D Scene Setup */
.scene {
perspective: 1200px;
height: 100vh;
width: 100vw;
overflow: hidden;
display: flex;
justify-content: center;
align-items: center; /* Center the grid initially */
}
/* The Rotated Plane */
.iso-plane {
transform: rotateX(52deg) rotateZ(-45deg) scale(0.9);
transform-style: preserve-3d;
padding: 100px;
transition: transform 0.5s ease-out;
/* Allow scrolling within this transformed plane? No, we scroll the container */
}
/* Scrollable Wrapper for the Plane */
.iso-scroll-wrapper {
width: 100%;
height: 100%;
overflow-y: auto;
overflow-x: hidden;
/* Hide scrollbar */
scrollbar-width: none;
-ms-overflow-style: none;
perspective: 1200px; /* Perspective on the scroll wrapper */
}
.iso-scroll-wrapper::-webkit-scrollbar { display: none; }
/* The Isometric Cube/Block */
.iso-block {
position: relative;
width: 64px;
height: 64px;
transform-style: preserve-3d;
transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
cursor: pointer;
z-index: 10;
}
/* Hover Effect: Lift */
.iso-block:hover {
transform: translateZ(20px);
z-index: 20;
}
/* Dragging State */
.iso-block.sortable-ghost { opacity: 0.3; }
.iso-block.sortable-drag { cursor: grabbing; transform: translateZ(40px) scale(1.1); z-index: 50; }
/* The Cube Faces */
.cube-face {
position: absolute;
top: 0; left: 0;
backface-visibility: hidden; /* Optimization */
}
/* TOP FACE (Main Icon) */
.face-top {
width: 64px; height: 64px;
background: linear-gradient(135deg, #27272a, #18181b); /* Zinc 800-900 */
border: 1px solid rgba(255,255,255,0.08);
border-radius: 12px;
transform: translateZ(12px); /* Extrusion height */
display: flex;
align-items: center;
justify-content: center;
box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
transition: background 0.2s;
}
.iso-block:hover .face-top {
background: linear-gradient(135deg, #3f3f46, #27272a);
border-color: rgba(255,255,255,0.2);
}
/* RIGHT FACE (Extrusion) */
.face-right {
width: 12px; height: 64px; /* Thickness is width here */
background: #0a0a0a; /* Darkest side */
transform: rotateY(90deg) translateZ(58px); /* 64 - (12/2) approx */
/* Exact positioning math: translateZ = Width - (Thickness/2) is wrong.
We want it at the right edge.
Right edge is at X=64.
RotateY(90) puts it on Z plane.
Let's use pseudo ::after/before for cleaner CSS 3D structure on the block directly
*/
}
/* Refined Cube Construction using Pseudo Elements to reduce DOM */
.cube {
width: 100%; height: 100%;
position: relative;
transform-style: preserve-3d;
}
/* Top Face */
.cube-top {
position: absolute; inset: 0;
background: linear-gradient(to bottom right, #202022, #101012);
border: 1px solid rgba(255,255,255,0.05);
border-radius: 12px;
transform: translateZ(12px);
box-shadow: inset 1px 1px 0 rgba(255,255,255,0.05);
}
/* Side 1 (Right) */
.cube-top::after {
content: ''; position: absolute;
top: 0; right: 0;
width: 12px; height: 100%;
background: #050505;
transform-origin: right;
transform: rotateY(90deg);
border-radius: 0 4px 4px 0; /* Smooth edge */
filter: brightness(0.6);
}
/* Side 2 (Bottom) */
.cube-top::before {
content: ''; position: absolute;
bottom: 0; left: 0;
width: 100%; height: 12px;
background: #000000;
transform-origin: bottom;
transform: rotateX(-90deg);
border-radius: 0 0 4px 4px;
filter: brightness(0.4);
}
/* Shadow (On the floor Z=0) */
.cube-shadow {
position: absolute; inset: 0;
background: rgba(0,0,0,0.6);
transform: translateZ(0);
filter: blur(8px);
border-radius: 12px;
transition: all 0.3s;
}
.iso-block:hover .cube-shadow {
background: rgba(0,0,0,0.4);
transform: translateZ(0) scale(1.1); /* Shadow spreads as object lifts */
filter: blur(12px);
}
/* Text Label (Below and Behind) */
/* Counter-rotated to face camera or lie flat?
Prompt: "Hover text slightly below and behind... Strong text-shadow"
Let's make it float "above" the grid but physically behind the block in Y.
*/
.iso-label {
position: absolute;
top: 110%; left: -20%; right: -20%;
text-align: center;
transform: translateZ(10px) rotateZ(45deg) rotateX(-52deg); /* Billboarding attempt? */
/* Actually, simple standard isometric text is usually just flat.
Let's try pure flat text first, readability is better.
If I remove rotation, it lies on the plane.
To billboard: rotateZ(45deg) cancel grid rot, rotateX(-52deg) cancel grid tilt.
*/
transform: translateZ(20px) rotateZ(45deg) rotateX(-52deg) translateY(10px);
pointer-events: none;
opacity: 0;
transition: opacity 0.2s, transform 0.2s;
text-shadow: 0 2px 4px rgba(0,0,0,0.9);
white-space: nowrap;
}
.iso-block:hover .iso-label {
opacity: 1;
transform: translateZ(30px) rotateZ(45deg) rotateX(-52deg) translateY(0px);
}
/* Ghost Slot */
.ghost-slot {
border: 2px dashed rgba(255,255,255,0.05);
border-radius: 12px;
background: rgba(255,255,255,0.01);
transform: translateZ(0);
}
/* 2D UI Overlay (Header/Footer) */
.ui-layer {
position: fixed;
z-index: 100;
width: 100%;
pointer-events: none;
}
.ui-interactive { pointer-events: auto; }
/* Icon styling */
.app-icon {
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
/* Counter-rotate icon to face camera? No, standard iso icons lie flat on the block surface. */
transform: rotateZ(-45deg); /* Actually, normally we want the icon UP.
Grid is rotated Z -45. Block is inside.
If we want icon to look "straight" relative to the block edges, no rotation needed relative to block.
But relative to screen?
Let's keep icon aligned with block edges.
Wait, prompt says "rotateZ(-45deg)" for container.
If I put an icon in, it will be tilted.
Let's counter-rotate the ICON inside the block so it stands "upright" relative to the viewer?
Or just leave it "painted on the box".
Painted on box is more cohesive for "Isometric Block".
However, usually we want the icon content to be upright.
Let's rotate icon: transform: rotateZ(45deg) ?
*/
transform: rotateZ(45deg); /* Counter the container's -45deg rotation so top-left is up */
}
[x-cloak] { display: none !important; }
.backdrop-blur-md { backdrop-filter: blur(12px); }
</style></head>

                            <label class="inline-flex items-center gap-1.5 cursor-pointer text-[10px] text-zinc-500 hover:text-white transition-colors">
                                <i data-lucide="upload" class="w-3 h-3"></i> <span>Upload Local Image</span>
                                <input type="file" @change="handleFileUpload" class="hidden" accept="image/*">
                            </label>
                        </div>
                    </div>
                </div>

                <div class="pt-4 flex justify-end gap-3 border-t border-zinc-800/50 mt-2">
                    <button @click="deleteAppWrapper" x-show="editMode" class="text-red-500 text-[10px] hover:text-red-400 mr-auto px-1">DELETE</button>
                    <button @click="closeModal()" class="px-3 py-1.5 text-xs font-medium text-zinc-500 hover:text-white transition-colors">Cancel</button>
                    <button @click="saveApp()" class="px-4 py-1.5 bg-zinc-100 hover:bg-white text-black text-xs font-semibold rounded-md shadow-lg transition-transform transform active:scale-95">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTEXT MENU -->
    <div x-show="contextMenu.show" 
         x-cloak
         @click.away="contextMenu.show = false"
         class="fixed z-[160] w-40 bg-zinc-900/95 border border-zinc-800 rounded-lg shadow-xl py-1 backdrop-blur-md"
         :style="`top: ${contextMenu.y}px; left: ${contextMenu.x}px`">
        <div class="px-3 py-1.5 border-b border-zinc-800 mb-1">
            <p class="text-[10px] font-semibold text-zinc-400 truncate uppercase tracking-wider" x-text="contextMenu.app?.name"></p>
        </div>
        <button @click="launchApp(contextMenu.app)" class="w-full text-left px-3 py-1.5 text-xs text-zinc-300 hover:bg-indigo-500/10 hover:text-indigo-400 flex items-center gap-2"><i data-lucide="external-link" class="w-3 h-3"></i> Open</button>
        <button @click="editApp(contextMenu.app)" class="w-full text-left px-3 py-1.5 text-xs text-zinc-300 hover:bg-white/5 hover:text-white flex items-center gap-2"><i data-lucide="edit-2" class="w-3 h-3"></i> Edit</button>
        
        <div class="relative group">
            <button class="w-full text-left px-3 py-1.5 text-xs text-zinc-300 hover:bg-white/5 hover:text-white flex items-center justify-between">
                <div class="flex items-center gap-2"><i data-lucide="arrow-right-circle" class="w-3 h-3"></i> Move</div>
                <i data-lucide="chevron-right" class="w-3 h-3 opacity-50"></i>
            </button>
            <div class="absolute left-full top-0 ml-1 w-24 bg-zinc-900 border border-zinc-800 rounded shadow-xl hidden group-hover:block">
                <template x-for="(name, idx) in pageNames">
                    <button @click="moveAppToPage(contextMenu.app, idx)" class="w-full text-left px-3 py-1.5 text-[10px] text-zinc-400 hover:bg-white/5 hover:text-white truncate" x-text="name || 'Page '+(idx+1)"></button>
                </template>
            </div>
        </div>

        <div class="h-px bg-zinc-800 my-1"></div>
        <button @click="deleteApp(contextMenu.app.id)" class="w-full text-left px-3 py-1.5 text-xs text-red-500 hover:bg-red-900/10 flex items-center gap-2"><i data-lucide="trash" class="w-3 h-3"></i> Delete</button>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD-PLACEHOLDER-KEY",
            authDomain: "livedesklauncher.firebaseapp.com",
            databaseURL: "https://livedesklauncher-default-rtdb.firebaseio.com",
            projectId: "livedesklauncher",
            storageBucket: "livedesklauncher.appspot.com",
            messagingSenderId: "00000000000",
            appId: "1:00000000000:web:00000000000000"
        };

        // Initialize Firebase safely
        let appInstance, auth, db;
        try {
            appInstance = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.database();
        } catch (e) { console.warn("Firebase Init Error (Using Local Mode):", e); }

        function launcher() {
            return {
                user: null,
                apps: [],
                pageNames: ['Home', 'Work', 'Social', 'Dev', 'Media'],
                currentPage: 0,
                viewMode: 'grid',
                showModal: false,
                editMode: false,
                loading: true,
                email: '',
                password: '',
                time: '',
                date: '',
                contextMenu: { show: false, x: 0, y: 0, app: null },
                form: { id: null, name: '', url: '', icon: '', category: 'Google', page: 0 },
                
                // Default Data
                defaultApps: [
                    { id: '1', name: 'Keep', category: 'Google', url: 'https://keep.google.com', icon: 'solar:notes-bold-duotone', page: 0 },
                    { id: '2', name: 'Drive', category: 'Google', url: 'https://drive.google.com', icon: 'solar:cloud-bold-duotone', page: 0 },
                    { id: '3', name: 'NotebookLM', category: 'Google', url: 'https://notebooklm.google.com', icon: 'solar:book-bookmark-bold-duotone', page: 0 },
                    { id: '4', name: 'Aura', category: 'Aura', url: '#', icon: 'solar:atom-bold-duotone', page: 0 },
                    { id: '5', name: 'Livedesk', category: 'Aura', url: '#', icon: 'solar:monitor-bold-duotone', page: 0 },
                    { id: '6', name: 'Shop', category: 'Work', url: '#', icon: 'solar:shop-bold-duotone', page: 0 },
                    { id: '7', name: 'WhatsApp', category: 'Social', url: 'https://web.whatsapp.com', icon: 'solar:chat-round-bold-duotone', page: 0 },
                    { id: '8', name: 'Analytics', category: 'Work', url: '#', icon: 'solar:graph-bold-duotone', page: 0 },
                ],

                init() {
                    // Clock
                    setInterval(() => {
                        const now = new Date();
                        this.time = now.toLocaleTimeString('en-US', { hour12: false, hour:'2-digit', minute:'2-digit' });
                        this.date = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                    }, 1000);

                    // Auth State
                    if(auth) {
                        auth.onAuthStateChanged(u => {
                            this.user = u;
                            this.loading = false;
                            if(u) this.loadData();
                        });
                    } else {
                        this.loading = false;
                        const savedUser = localStorage.getItem('ldl_user');
                        if(savedUser) { 
                            this.user = JSON.parse(savedUser);
                            this.loadData();
                        }
                    }

                    // Sortable Setup
                    this.$nextTick(() => {
                        this.initSortable();
                        lucide.createIcons();
                    });
                },

                get filteredApps() {
                    return this.apps.filter(a => (a.page || 0) == this.currentPage);
                },

                initSortable() {
                    const el = document.getElementById('app-grid');
                    if(!el) return;
                    Sortable.create(el, {
                        animation: 200,
                        delay: 150,
                        delayOnTouchOnly: true,
                        ghostClass: 'sortable-ghost',
                        dragClass: 'sortable-drag',
                        draggable: '.group',
                        onEnd: (evt) => {
                            // Logic for reordering arrays would go here
                            // For V1 visual prototype, we let Sortable handle DOM reorder
                        }
                    });
                },

                // Authentication
                loginGoogle() {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    auth.signInWithPopup(provider).catch(e => alert(e.message));
                },
                loginEmail() {
                    auth.signInWithEmailAndPassword(this.email, this.password).catch(e => {
                        if(e.code === 'auth/user-not-found') {
                            auth.createUserWithEmailAndPassword(this.email, this.password);
                        } else alert(e.message);
                    });
                },
                guestMode() {
                    this.user = { uid: 'guest', email: 'guest@local', photoURL: '' };
                    localStorage.setItem('ldl_user', JSON.stringify(this.user));
                    this.loadData();
                },
                logout() {
                    if(auth) auth.signOut();
                    this.user = null;
                    localStorage.removeItem('ldl_user');
                    this.apps = [];
                },

                // Data Persistence
                loadData() {
                    if(this.user.uid === 'guest') {
                        const localApps = localStorage.getItem('ldl_apps');
                        this.apps = localApps ? JSON.parse(localApps) : this.defaultApps;
                        const localPages = localStorage.getItem('ldl_pages');
                        if(localPages) this.pageNames = JSON.parse(localPages);
                        return;
                    }
                    db.ref(`users/${this.user.uid}/apps`).on('value', s => {
                        const val = s.val();
                        this.apps = val ? Object.values(val) : this.defaultApps;
                    });
                    db.ref(`users/${this.user.uid}/pageNames`).on('value', s => {
                        if(s.exists()) this.pageNames = s.val();
                    });
                },
                saveData() {
                    if(this.user.uid === 'guest') {
                        localStorage.setItem('ldl_apps', JSON.stringify(this.apps));
                        localStorage.setItem('ldl_pages', JSON.stringify(this.pageNames));
                        return;
                    }
                    const appObj = {};
                    this.apps.forEach(a => appObj[a.id] = a);
                    db.ref(`users/${this.user.uid}/apps`).set(appObj);
                    db.ref(`users/${this.user.uid}/pageNames`).set(this.pageNames);
                },

                // CRUD Operations
                openModal() {
                    this.editMode = false;
                    this.form = { id: Date.now().toString(), name: '', url: 'https://', icon: 'solar:box-bold-duotone', category: 'Google', page: this.currentPage };
                    this.showModal = true;
                },
                editApp(app) {
                    this.editMode = true;
                    this.form = { ...app };
                    this.showModal = true;
                    this.contextMenu.show = false;
                },
                saveApp() {
                    if(!this.form.name) return;
                    if(this.editMode) {
                        const idx = this.apps.findIndex(a => a.id === this.form.id);
                        if(idx > -1) this.apps[idx] = { ...this.form };
                    } else {
                        this.apps.push({ ...this.form });
                    }
                    this.saveData();
                    this.closeModal();
                },
                deleteApp(id) {
                    this.apps = this.apps.filter(a => a.id !== id);
                    this.saveData();
                    this.contextMenu.show = false;
                },
                deleteAppWrapper() {
                    if(confirm('Delete this block?')) this.deleteApp(this.form.id);
                    this.closeModal();
                },
                moveAppToPage(app, pageIdx) {
                    const idx = this.apps.findIndex(a => a.id === app.id);
                    if(idx > -1) {
                        this.apps[idx].page = pageIdx;
                        this.saveData();
                    }
                    this.contextMenu.show = false;
                },
                savePageName() {
                    this.saveData();
                },

                // UI Utils
                launchApp(app) {
                    window.open(app.url, '_blank');
                },
                openNewWindow() {
                    window.open(window.location.href, '_blank', 'width=500,height=600');
                },
                closeModal() {
                    this.showModal = false;
                },
                toggleView() {
                    this.viewMode = this.viewMode === 'grid' ? 'list' : 'grid';
                },
                nextPage() {
                    if(this.currentPage < 4) { this.currentPage++; }
                },
                prevPage() {
                    if(this.currentPage > 0) { this.currentPage--; }
                },
                setPage(n) {
                    this.currentPage = n;
                },
                showContext(e, app) {
                    // Adjust coordinates to prevent overflow
                    let x = e.clientX;
                    let y = e.clientY;
                    if (x > window.innerWidth - 180) x -= 160;
                    if (y > window.innerHeight - 200) y -= 150;
                    
                    this.contextMenu = { show: true, x, y, app };
                },
                getCategoryColor(cat) {
                    const map = {
                        'Google': 'text-sky-400 border-sky-400/20 bg-sky-400/10',
                        'Aura': 'text-purple-400 border-purple-400/20 bg-purple-400/10',
                        'Work': 'text-emerald-400 border-emerald-400/20 bg-emerald-400/10',
                        'Social': 'text-pink-400 border-pink-400/20 bg-pink-400/10',
                        'Dev': 'text-orange-400 border-orange-400/20 bg-orange-400/10'
                    };
                    // Simplified for list/grid nuance
                    if (this.viewMode === 'list') return map[cat] || 'text-zinc-500 bg-zinc-800';
                    // Just text color for billboard
                    return map[cat] ? map[cat].split(' ')[0] : 'text-zinc-500';
                },
                handleFileUpload(e) {
                    const file = e.target.files[0];
                    if(!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        this.form.icon = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                },
                fetchMeta() {
                    if(!this.form.name && this.form.url) {
                        try {
                            const url = new URL(this.form.url);
                            this.form.name = url.hostname.replace('www.','').split('.')[0];
                            this.form.icon = `https://www.google.com/s2/favicons?domain=${url.hostname}&sz=128`;
                        } catch(e){}
                    }
                }
            }
        }
    </script>
</body>
</html>
