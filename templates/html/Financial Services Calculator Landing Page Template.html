<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculateur de revenus</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
body {
font-family: 'Inter', sans-serif;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 sm:p-6 text-gray-900 antialiased">

    <!-- Glassmorphic Outer Wrapper -->
    <div class="w-full max-w-md p-4" style="background: linear-gradient(rgba(255, 255, 255, 0.5), transparent); border: 1px solid rgba(0, 0, 0, 0.05); box-shadow: rgba(0, 0, 0, 0.1) 0px 25px 25px; border-radius: 1.5rem; backdrop-filter: blur(10px);">
        
        <!-- Solid Inner Container -->
        <div class="bg-white/95 rounded-xl shadow-2xl ring-1 ring-gray-200 overflow-hidden backdrop-blur-sm">
            <div class="p-6 sm:p-8">
                
                <!-- Header -->
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-xl sm:text-2xl font-semibold tracking-tight text-gray-900">
                        Calculateur de revenus
                    </h2>
                    <button class="p-2 -mr-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition-colors flex items-center justify-center" aria-label="Fermer">
                        <iconify-icon icon="solar:close-square-linear" stroke-width="1.5" class="text-xl"></iconify-icon>
                    </button>
                </div>

                <!-- Main Value -->
                <div class="text-center mb-10 space-y-4">
                    <div class="text-4xl sm:text-5xl font-semibold tracking-tight text-indigo-600">
                        147.250 F CFA
                    </div>
                    <p class="text-base text-gray-500 max-w-[280px] mx-auto leading-relaxed">
                        Revenu net après déduction automatique des frais de commission de 5%.
                    </p>
                </div>

                <!-- Interactive Section -->
                <div class="space-y-8">
                    
                    <!-- Slider -->
                    <div class="space-y-4">
                        <div class="flex justify-between items-baseline">
                            <label class="text-base font-medium text-gray-700">Glissez pour définir votre CA</label>
                            <span class="text-base font-semibold text-gray-900">155.000 F CFA</span>
                        </div>
                        
                        <!-- Custom Visual Slider -->
                        <div class="relative w-full h-1.5 bg-gray-100 rounded-full flex items-center cursor-pointer group">
                            <!-- Track fill -->
                            <div class="absolute h-full bg-indigo-600 w-[78%] rounded-full group-hover:bg-indigo-500 transition-colors"></div>
                            <!-- Thumb -->
                            <div class="absolute left-[78%] -translate-x-1/2 w-5 h-5 bg-white border-[3px] border-indigo-600 rounded-full shadow-sm ring-4 ring-transparent focus-within:ring-indigo-600/20 transition-all" tabindex="0"></div>
                        </div>
                        
                        <p class="text-sm text-gray-500">Veuillez définir votre chiffre d'affaires.</p>
                    </div>

                    <!-- Currency Toggle -->
                    <div class="flex justify-center">
                        <div class="inline-flex bg-gray-100/80 p-1 rounded-xl">
                            <button class="px-5 py-2 text-base font-medium text-gray-900 bg-white rounded-lg shadow-sm ring-1 ring-gray-900/5 transition-all">
                                F CFA
                            </button>
                            <button class="px-5 py-2 text-base font-medium text-gray-500 hover:text-gray-900 rounded-lg transition-colors">
                                €
                            </button>
                            <button class="px-5 py-2 text-base font-medium text-gray-500 hover:text-gray-900 rounded-lg transition-colors">
                                $
                            </button>
                        </div>
                    </div>

                    <!-- CTA Button -->
                    <button class="w-full bg-[#0A0A0A] hover:bg-gray-800 text-white text-base font-medium py-3.5 px-4 rounded-[14px] flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
                        Ouvrir ma boutique maintenant
                        <iconify-icon icon="solar:arrow-right-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                    </button>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
