<html lang="en"><head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Winter Catch</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
.snowflake {
position: absolute;
top: -10px;
background: white;
border-radius: 50%;
opacity: 0.8;
pointer-events: none;
animation: fall linear infinite;
}
@keyframes fall {
to { transform: translateY(110vh); }
}
.blur-backdrop { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.grayscale-bg { filter: grayscale(100%) contrast(120%) brightness(60%); }
</style></head>
<body class="bg-neutral-950 text-neutral-200 h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative selection:bg-neutral-800">

    <!-- Background Ambience -->
    <div class="absolute inset-0 z-0 overflow-hidden">
        <!-- Grayscale Fireplace Background -->
        <img src="https://images.unsplash.com/photo-1542826438-bd32f43d626f?q=80&amp;w=2600&amp;auto=format&amp;fit=crop" alt="Background" class="w-full h-full object-cover grayscale-bg opacity-40">
        <!-- Gradient Overlay for readability -->
        <div class="absolute inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/80 to-neutral-900/60 mix-blend-multiply"></div>
    </div>

    <div id="snow-container" class="absolute inset-0 pointer-events-none z-0 opacity-30"></div>

    <!-- UI Layer -->
    <div class="z-10 w-full max-w-lg h-full max-h-[900px] flex flex-col relative border-x border-neutral-800/30 bg-neutral-900/40 shadow-2xl backdrop-blur-sm ring-1 ring-white/5">
        
        <!-- Header -->
        <header class="flex items-center justify-between px-6 py-5 border-b border-white/5 blur-backdrop bg-neutral-950/30 shrink-0">
            <div class="flex items-center gap-2">
                <i data-lucide="snowflake" class="w-5 h-5 text-neutral-400"></i>
                <span class="text-sm font-medium tracking-tight text-neutral-100 uppercase">Holiday<span class="text-neutral-500">Drop</span></span>
            </div>
            <div class="flex items-center gap-6">
                <div class="flex flex-col items-end">
                    <span class="text-[10px] uppercase tracking-wider text-neutral-500 font-medium">Score</span>
                    <span id="score-display" class="text-lg font-medium leading-none tracking-tight font-mono transition-colors duration-150">0</span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-[10px] uppercase tracking-wider text-neutral-500 font-medium">Lives</span>
                    <div id="lives-display" class="flex gap-1 mt-1 text-rose-500">
                        <!-- Hearts injected via JS -->
                    </div>
                </div>
            </div>
        </header>

        <!-- Game Area -->
        <main id="game-area" class="relative flex-1 w-full overflow-hidden cursor-crosshair">
            
            <!-- Start Screen -->
            <div id="start-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-neutral-950/80 blur-backdrop transition-opacity duration-500">
                <div class="text-center space-y-6 max-w-xs p-6">
                    <div class="w-12 h-12 bg-neutral-800 rounded-xl flex items-center justify-center mx-auto ring-1 ring-white/10 shadow-lg shadow-black/50">
                        <i data-lucide="gift" class="w-6 h-6 text-emerald-400"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-medium text-white tracking-tight mb-2">Winter Protocol</h1>
                        <p class="text-sm text-neutral-400 leading-relaxed">
                            Collect organic matter (fruit). Avoid fossil fuels (coal). <br>
                            <span class="text-rose-400 text-xs block mt-2 font-medium">Warning: System accelerates upon damage.</span>
                        </p>
                    </div>
                    <button id="start-btn" class="group relative w-full flex justify-center py-3 px-4 border border-white/10 text-sm font-medium rounded-lg text-white bg-white/5 hover:bg-white/10 hover:border-white/20 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-neutral-900 focus:ring-neutral-500">
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i data-lucide="play" class="h-4 w-4 text-neutral-400 group-hover:text-emerald-400 transition-colors"></i>
                        </span>
                        Initialize Sequence
                    </button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-screen" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center bg-neutral-950/90 blur-backdrop">
                <div class="text-center space-y-6 max-w-xs p-6 animate-in fade-in zoom-in duration-300">
                    <div class="w-12 h-12 bg-rose-500/10 rounded-xl flex items-center justify-center mx-auto ring-1 ring-rose-500/20">
                        <i data-lucide="x-octagon" class="w-6 h-6 text-rose-500"></i>
                    </div>
                    <div>
                        <h2 class="text-xl font-medium text-white tracking-tight">Sequence Terminated</h2>
                        <div class="mt-4 flex justify-center items-baseline gap-2">
                            <span class="text-sm text-neutral-500">Final Score</span>
                            <span id="final-score" class="text-3xl font-mono font-medium text-white">0</span>
                        </div>
                    </div>
                    <button id="restart-btn" class="w-full py-3 px-4 border border-white/10 text-sm font-medium rounded-lg text-white bg-white/5 hover:bg-white/10 transition-all">
                        Reboot System
                    </button>
                </div>
            </div>

            <!-- Player (Updated Stocking SVG) -->
            <div id="player" class="absolute bottom-4 left-1/2 w-20 h-24 -ml-10 z-20 transition-transform duration-75 will-change-transform">
                <div class="relative w-full h-full drop-shadow-xl filter">
                    <svg viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                        <!-- Loop -->
                        <path d="M25 10 C 25 0, 35 0, 35 10 L 35 20" stroke="#991b1b" stroke-width="4" fill="none"></path>
                        
                        <!-- Main Body Base (Red Felt) -->
                        <path d="M25 25 
                                 L75 25 
                                 C78 25, 80 27, 80 30
                                 L75 65 
                                 C73 85, 65 95, 55 105
                                 L45 110
                                 C25 115, 10 100, 15 85
                                 L25 25 Z" fill="#dc2626"></path>
                        
                        <!-- Shadow/Depth Overlay -->
                        <path d="M25 25 L75 25 L75 65 C73 85, 65 95, 55 105 L45 110 C25 115, 10 100, 15 85 L25 25 Z" fill="url(#feltGradient)" style="mix-blend-mode: multiply; opacity: 0.3;"></path>
                              
                        <!-- Gold Swirls Embroidery -->
                        <path d="M35 55 C 30 60, 30 70, 40 70 M 60 50 C 65 55, 70 60, 65 70 M 45 80 C 40 90, 50 95, 60 90" stroke="#ca8a04" stroke-width="1" fill="none" opacity="0.8"></path>

                        <!-- Holly Leaves (Green) -->
                        <g transform="translate(50, 60) scale(0.8)">
                            <!-- Leaf 1 -->
                            <path d="M0 0 C -5 -5, -10 -2, -12 -5 C -10 -10, -5 -8, 0 -15 C 5 -8, 10 -10, 12 -5 C 10 -2, 5 -5, 0 0 Z" fill="#15803d" transform="rotate(-30)"></path>
                            <!-- Leaf 2 -->
                            <path d="M0 0 C -5 -5, -10 -2, -12 -5 C -10 -10, -5 -8, 0 -15 C 5 -8, 10 -10, 12 -5 C 10 -2, 5 -5, 0 0 Z" fill="#166534" transform="rotate(30)"></path>
                            <!-- Leaf 3 -->
                            <path d="M0 0 C -5 -5, -10 -2, -12 -5 C -10 -10, -5 -8, 0 -15 C 5 -8, 10 -10, 12 -5 C 10 -2, 5 -5, 0 0 Z" fill="#15803d" transform="rotate(180) translate(0, -3)"></path>
                            
                            <!-- Leaf Veins -->
                            <path d="M0 0 L 0 -15" stroke="#a3e635" stroke-width="0.5" transform="rotate(-30)" opacity="0.4"></path>
                            <path d="M0 0 L 0 -15" stroke="#a3e635" stroke-width="0.5" transform="rotate(30)" opacity="0.4"></path>
                        </g>

                        <!-- Berries (Red) -->
                        <g transform="translate(50, 60)">
                            <circle cx="-2" cy="-2" r="2.5" fill="#ef4444"></circle>
                            <circle cx="2" cy="-2" r="2.5" fill="#b91c1c"></circle>
                            <circle cx="0" cy="1.5" r="2.5" fill="#dc2626"></circle>
                        </g>

                        <!-- Cuff (White Fluffy) -->
                        <path d="M22 20 
                                 L78 20 
                                 C80 20, 81 21, 81 23
                                 L79 38
                                 C79 40, 77 41, 75 41
                                 L25 41
                                 C23 41, 21 40, 21 38
                                 L19 23
                                 C19 21, 20 20, 22 20 Z" fill="#f5f5f5" filter="url(#fluff)"></path>
                        
                        <defs>
                            <linearGradient id="feltGradient" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#991b1b"></stop>
                                <stop offset="100%" stop-color="#7f1d1d"></stop>
                            </linearGradient>
                            <filter id="fluff">
                                <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" result="noise"></feTurbulence>
                                <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"></feDisplacementMap>
                                <feGaussianBlur stdDeviation="0.5"></feGaussianBlur>
                            </filter>
                        </defs>
                    </svg>
                </div>
            </div>

        </main>
        
        <!-- Footer -->
        <footer class="py-3 px-6 border-t border-white/5 text-center shrink-0 bg-neutral-950/40">
            <p class="text-[10px] text-neutral-600 tracking-wide uppercase">Seasonal Interactive Experience v1.1</p>
        </footer>
    </div>

    <script>
        // Init Icons
        lucide.createIcons();

        // Game State
        const state = {
            playing: false,
            score: 0,
            lives: 5,
            items: [], 
            lastSpawn: 0,
            spawnRate: 1000,
            baseSpeed: 2.5,
            playerX: 50,
            animationFrame: null
        };

        // DOM Elements
        const gameArea = document.getElementById('game-area');
        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score-display');
        const livesDisplay = document.getElementById('lives-display');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const snowContainer = document.getElementById('snow-container');

        // Assets (SVG Strings for performance)
        const ICONS = {
            apple: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/><path d="M10 2c1 .5 2 2 2 5"/></svg>`,
            orange: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="rgba(249, 115, 22, 0.2)" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>`,
            plum: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4.97 0 9-3.3 9-8.5C21 7.2 17.5 2 12 2s-9 5.2-9 11.5c0 5.2 4.03 8.5 9 8.5Z"/><path d="M12 13v-5"/></svg>`,
            coal: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="rgba(64, 64, 64, 0.8)" stroke="#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`
        };

        const HEART_FILLED = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;
        const HEART_EMPTY = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.3"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>`;

        // Input Handling
        function handleInput(clientX) {
            const rect = gameArea.getBoundingClientRect();
            let x = clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            state.playerX = (x / rect.width) * 100;
            player.style.left = `${state.playerX}%`;
        }

        window.addEventListener('mousemove', (e) => {
            if (state.playing) handleInput(e.clientX);
        });

        window.addEventListener('touchmove', (e) => {
            if (state.playing) {
                e.preventDefault(); 
                handleInput(e.touches[0].clientX);
            }
        }, { passive: false });

        // Logic
        function renderLives() {
            livesDisplay.innerHTML = '';
            for(let i=0; i<5; i++) {
                livesDisplay.innerHTML += i < state.lives ? HEART_FILLED : HEART_EMPTY;
            }
        }

        function spawnItem() {
            const el = document.createElement('div');
            el.className = 'absolute top-0 w-8 h-8 flex items-center justify-center -ml-4';
            
            const coalChance = 0.15 + ((5 - state.lives) * 0.05); 
            const isCoal = Math.random() < coalChance;
            
            if (isCoal) {
                el.innerHTML = ICONS.coal;
                el.dataset.type = 'coal';
            } else {
                const fruits = ['apple', 'orange', 'plum'];
                const fruit = fruits[Math.floor(Math.random() * fruits.length)];
                el.innerHTML = ICONS[fruit];
                el.dataset.type = 'fruit';
            }

            const xPos = 5 + Math.random() * 90;
            el.style.left = `${xPos}%`;
            
            gameArea.appendChild(el);

            const difficultyMultiplier = (6 - state.lives) * 0.6; 
            const speed = (state.baseSpeed + difficultyMultiplier) * (0.8 + Math.random() * 0.4);

            state.items.push({
                el: el,
                x: xPos,
                y: -10, 
                speed: speed,
                type: isCoal ? 'coal' : 'fruit',
                active: true
            });
        }

        function update(timestamp) {
            if (!state.playing) return;

            // Spawning
            const currentSpawnRate = Math.max(400, state.spawnRate - (state.score * 5));
            if (timestamp - state.lastSpawn > currentSpawnRate) {
                spawnItem();
                state.lastSpawn = timestamp;
            }

            // Movement & Collision
            const gameRect = gameArea.getBoundingClientRect();
            // Player visual dimensions roughly 80px wide, but hitbox should be centered
            
            const playerTop = gameRect.height - 100; // Adjusted for taller SVG

            state.items.forEach(item => {
                if (!item.active) return;

                item.y += item.speed;
                item.el.style.transform = `translateY(${item.y}px)`;

                const itemBottom = item.y + 32; 

                // Check Bounds
                if (item.y > gameRect.height) {
                    item.active = false;
                    item.el.remove();
                    return; 
                }

                // Collision
                // Check Y overlap (Top of stocking opening is around 25px down in SVG, player is 120px tall)
                // We want to catch things near the "cuff" area approx
                if (itemBottom > playerTop + 20 && item.y < playerTop + 60) {
                    
                    const itemPxX = (item.x / 100) * gameRect.width;
                    const playerPxX = (state.playerX / 100) * gameRect.width;
                    const dist = Math.abs(playerPxX - itemPxX);
                    
                    if (dist < 35) { // Catch radius
                        item.active = false;
                        item.el.remove();
                        handleCatch(item.type);
                    }
                }
            });

            state.items = state.items.filter(i => i.active);
            state.animationFrame = requestAnimationFrame(update);
        }

        function handleCatch(type) {
            if (type === 'fruit') {
                state.score += 10;
                scoreDisplay.textContent = state.score;
                animateScore();
            } else if (type === 'coal') {
                state.lives--;
                renderLives();
                flashScreen();
                if (state.lives <= 0) {
                    endGame();
                }
            }
        }

        function animateScore() {
            scoreDisplay.classList.add('text-emerald-400');
            setTimeout(() => scoreDisplay.classList.remove('text-emerald-400'), 150);
        }

        function flashScreen() {
            const flash = document.createElement('div');
            flash.className = 'absolute inset-0 bg-rose-500/20 z-40 pointer-events-none transition-opacity duration-300';
            gameArea.appendChild(flash);
            setTimeout(() => {
                flash.classList.add('opacity-0');
                setTimeout(() => flash.remove(), 300);
            }, 50);
        }

        function createSnow() {
            const count = 40;
            for(let i=0; i<count; i++) {
                const snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.style.left = Math.random() * 100 + '%';
                snow.style.width = Math.random() * 3 + 2 + 'px';
                snow.style.height = snow.style.width;
                snow.style.opacity = Math.random() * 0.5 + 0.1;
                snow.style.animationDuration = Math.random() * 5 + 10 + 's';
                snow.style.animationDelay = Math.random() * 5 + 's';
                snowContainer.appendChild(snow);
            }
        }

        function startGame() {
            state.score = 0;
            state.lives = 5;
            state.items.forEach(i => i.el.remove());
            state.items = [];
            state.playing = true;
            
            scoreDisplay.textContent = '0';
            renderLives();
            
            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.classList.add('hidden'), 500);
            gameOverScreen.classList.add('hidden');
            
            if (state.animationFrame) cancelAnimationFrame(state.animationFrame);
            state.lastSpawn = performance.now();
            requestAnimationFrame(update);
        }

        function endGame() {
            state.playing = false;
            finalScoreDisplay.textContent = state.score;
            gameOverScreen.classList.remove('hidden');
        }

        // Init
        createSnow();
        renderLives();
        
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', () => {
            gameOverScreen.classList.add('hidden');
            startGame();
        });

    </script>

</body></html>
