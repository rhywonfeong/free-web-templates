<div class="flex items-center justify-center min-h-screen bg-gray-950">
  <div class="relative w-[400px] h-[240px] rounded-3xl overflow-hidden shadow-xl bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 border border-gray-800">
    <svg class="absolute top-0 left-0 w-full h-full animate-pulse" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="waveGradient1" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
          <stop stop-color="#A7F3D0" stop-opacity="0.04"/>
          <stop offset="1" stop-color="#38BDF8" stop-opacity="0.08"/>
        </linearGradient>
        <linearGradient id="waveGradient2" x1="0" y1="240" x2="400" y2="0" gradientUnits="userSpaceOnUse">
          <stop stop-color="#F472B6" stop-opacity="0.10"/>
          <stop offset="1" stop-color="#38BDF8" stop-opacity="0.04"/>
        </linearGradient>
      </defs>
      <path id="wave1" d="M0,80 Q100,140 200,80 T400,80" stroke="url(#waveGradient1)" stroke-width="2.5" fill="none">
        <animate attributeName="d" values="
          M0,80 Q100,140 200,80 T400,80;
          M0,100 Q100,60 200,100 T400,100;
          M0,80 Q100,140 200,80 T400,80
          " dur="5s" repeatCount="indefinite" />
      </path>
      <path id="wave2" d="M0,130 Q100,190 200,130 T400,130" stroke="url(#waveGradient2)" stroke-width="2" fill="none" opacity="0.6">
        <animate attributeName="d" values="
          M0,130 Q100,190 200,130 T400,130;
          M0,150 Q100,110 200,150 T400,150;
          M0,130 Q100,190 200,130 T400,130
          " dur="6s" repeatCount="indefinite" />
      </path>
      <path id="wave3" d="M0,180 Q100,220 200,180 T400,180" stroke="url(#waveGradient1)" stroke-width="1.5" fill="none" opacity="0.4">
        <animate attributeName="d" values="
          M0,180 Q100,220 200,180 T400,180;
          M0,170 Q100,150 200,170 T400,170;
          M0,180 Q100,220 200,180 T400,180
          " dur="7s" repeatCount="indefinite" />
      </path>
    </svg>
    <div class="relative z-10 flex flex-col items-start justify-center h-full p-8 space-y-2">
      <span class="text-sm font-semibold text-cyan-400 uppercase tracking-[0.13em]">Linear Card</span>
      <h2 class="text-3xl font-bold text-white mb-2">Minimal Wave Animation</h2>
      <p class="text-gray-400 text-base">Clean, subtle waves with a modern gradient for your next UI inspiration.</p>
    </div>
    <div class="absolute inset-0 bg-black opacity-20 pointer-events-none"></div>
  </div>
</div>
