<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koli App - Create Group</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
-webkit-font-smoothing: antialiased;
-moz-osx-font-smoothing: grayscale;
}
/* Hide scrollbar for Chrome, Safari and Opera */
.no-scrollbar::-webkit-scrollbar {
display: none;
}
/* Hide scrollbar for IE, Edge and Firefox */
.no-scrollbar {
-ms-overflow-style: none;  /* IE and Edge */
scrollbar-width: none;  /* Firefox */
}
input:focus {
outline: none;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen sm:p-6">

    <!-- Mobile Device Frame Simulator -->
    <div class="bg-white w-full h-[100dvh] sm:h-[932px] max-w-[430px] relative flex flex-col sm:rounded-[40px] sm:shadow-2xl overflow-hidden sm:border-[8px] sm:border-gray-900 ring-1 ring-gray-100">
        
        <!-- Status Bar Mockup (Optional, for realism in frame) -->
        <div class="h-12 w-full flex justify-between items-center px-6 pt-2 shrink-0">
            <span class="text-sm font-medium text-gray-900 tracking-tight">9:41</span>
            <div class="flex items-center gap-1.5 text-gray-900">
                <iconify-icon icon="solar:cellular-line-linear" class="text-sm"></iconify-icon>
                <iconify-icon icon="solar:wi-fi-linear" class="text-sm"></iconify-icon>
                <iconify-icon icon="solar:battery-charge-linear" class="text-base"></iconify-icon>
            </div>
        </div>

        <!-- 1. THE HEADER -->
        <div class="flex items-center justify-between px-4 py-3 shrink-0">
            <button class="text-base font-medium text-purple-600 hover:text-purple-700 transition-colors">
                Cancel
            </button>
            <h1 class="text-lg font-semibold text-gray-900 tracking-tight">
                New Group
            </h1>
            <button class="text-base font-medium text-purple-300 cursor-not-allowed">
                Create
            </button>
        </div>

        <!-- 2. GROUP IDENTITY -->
        <div class="flex items-center gap-4 px-4 py-5 border-b border-gray-100 shrink-0">
            <button class="w-[60px] h-[60px] rounded-full bg-gray-50 border border-dashed border-gray-300 flex flex-col items-center justify-center text-gray-400 hover:bg-gray-100 transition-colors shrink-0">
                <iconify-icon icon="solar:camera-linear" stroke-width="1.5" class="text-xl mb-0.5"></iconify-icon>
            </button>
            <div class="flex-1">
                <input type="text" placeholder="Group Name (e.g., Family)" class="w-full text-base font-medium text-gray-900 placeholder-gray-400 bg-transparent border-none focus:ring-0 p-0">
            </div>
        </div>

        <!-- 3 & 4. MEMBER SELECTION & SEARCH -->
        <div class="flex flex-col flex-1 overflow-hidden">
            
            <!-- Search Bar -->
            <div class="px-4 py-4 shrink-0">
                <div class="bg-gray-100/80 rounded-2xl flex items-center px-3.5 py-2.5 gap-2.5">
                    <iconify-icon icon="solar:magnifer-linear" class="text-lg text-gray-500 shrink-0"></iconify-icon>
                    <input type="text" placeholder="Search by name or number" class="w-full bg-transparent border-none focus:ring-0 text-sm text-gray-900 placeholder-gray-500 p-0">
                </div>
            </div>

            <!-- Floating Selection Bar -->
            <div class="px-4 pb-4 flex gap-3 overflow-x-auto no-scrollbar shrink-0 border-b border-gray-50">
                <!-- Selected Member 1 -->
                <div class="relative shrink-0 flex flex-col items-center gap-1">
                    <div class="relative w-[52px] h-[52px]">
                        <img src="https://i.pravatar.cc/150?img=47" alt="Sarah" class="w-full h-full rounded-full object-cover ring-2 ring-white">
                        <button class="absolute -top-0.5 -right-0.5 w-5 h-5 bg-gray-800 rounded-full flex items-center justify-center text-white ring-2 ring-white hover:bg-gray-900">
                            <iconify-icon icon="solar:close-linear" class="text-xs"></iconify-icon>
                        </button>
                    </div>
                    <span class="text-xs font-medium text-gray-600 truncate w-12 text-center">Sarah</span>
                </div>
                <!-- Selected Member 2 -->
                <div class="relative shrink-0 flex flex-col items-center gap-1">
                    <div class="relative w-[52px] h-[52px]">
                        <img src="https://i.pravatar.cc/150?img=11" alt="Michael" class="w-full h-full rounded-full object-cover ring-2 ring-white">
                        <button class="absolute -top-0.5 -right-0.5 w-5 h-5 bg-gray-800 rounded-full flex items-center justify-center text-white ring-2 ring-white hover:bg-gray-900">
                            <iconify-icon icon="solar:close-linear" class="text-xs"></iconify-icon>
                        </button>
                    </div>
                    <span class="text-xs font-medium text-gray-600 truncate w-12 text-center">Michael</span>
                </div>
            </div>

            <!-- Contact List -->
            <div class="flex-1 overflow-y-auto no-scrollbar px-4 pb-12">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest mt-4 mb-3 px-1">Suggested Contacts</h2>
                
                <div class="flex flex-col">
                    <!-- Contact Row 1 (Unselected) -->
                    <label class="flex items-center justify-between py-3.5 px-1 cursor-pointer group active:bg-gray-50 rounded-xl transition-colors">
                        <div class="flex items-center gap-3.5">
                            <img src="https://i.pravatar.cc/150?img=68" alt="Alex Rivera" class="w-[46px] h-[46px] rounded-full object-cover bg-gray-100">
                            <div>
                                <p class="text-base font-medium text-gray-900">Alex Rivera</p>
                                <p class="text-xs text-gray-500 mt-0.5">Mobile</p>
                            </div>
                        </div>
                        <div class="w-6 h-6 rounded-full border-[1.5px] border-gray-300 flex items-center justify-center group-hover:border-purple-300 transition-colors"></div>
                    </label>

                    <!-- Contact Row 2 (Selected) -->
                    <label class="flex items-center justify-between py-3.5 px-1 cursor-pointer group active:bg-gray-50 rounded-xl transition-colors">
                        <div class="flex items-center gap-3.5">
                            <img src="https://i.pravatar.cc/150?img=47" alt="Sarah Chen" class="w-[46px] h-[46px] rounded-full object-cover bg-gray-100">
                            <div>
                                <p class="text-base font-medium text-gray-900">Sarah Chen</p>
                                <p class="text-xs text-gray-500 mt-0.5">Koli App</p>
                            </div>
                        </div>
                        <div class="w-6 h-6 rounded-full bg-purple-600 border border-purple-600 flex items-center justify-center shadow-sm">
                            <iconify-icon icon="solar:check-linear" stroke-width="2" class="text-white text-sm"></iconify-icon>
                        </div>
                    </label>

                    <!-- Contact Row 3 (Unselected) -->
                    <label class="flex items-center justify-between py-3.5 px-1 cursor-pointer group active:bg-gray-50 rounded-xl transition-colors">
                        <div class="flex items-center gap-3.5">
                            <div class="w-[46px] h-[46px] rounded-full bg-purple-100 flex items-center justify-center text-purple-600 text-lg font-medium">
                                D
                            </div>
                            <div>
                                <p class="text-base font-medium text-gray-900">David Kim</p>
                                <p class="text-xs text-gray-500 mt-0.5">Mobile</p>
                            </div>
                        </div>
                        <div class="w-6 h-6 rounded-full border-[1.5px] border-gray-300 flex items-center justify-center group-hover:border-purple-300 transition-colors"></div>
                    </label>

                    <!-- Contact Row 4 (Selected) -->
                    <label class="flex items-center justify-between py-3.5 px-1 cursor-pointer group active:bg-gray-50 rounded-xl transition-colors">
                        <div class="flex items-center gap-3.5">
                            <img src="https://i.pravatar.cc/150?img=11" alt="Michael Scott" class="w-[46px] h-[46px] rounded-full object-cover bg-gray-100">
                            <div>
                                <p class="text-base font-medium text-gray-900">Michael Scott</p>
                                <p class="text-xs text-gray-500 mt-0.5">Work</p>
                            </div>
                        </div>
                        <div class="w-6 h-6 rounded-full bg-purple-600 border border-purple-600 flex items-center justify-center shadow-sm">
                            <iconify-icon icon="solar:check-linear" stroke-width="2" class="text-white text-sm"></iconify-icon>
                        </div>
                    </label>
                    
                    <!-- Contact Row 5 (Unselected) -->
                    <label class="flex items-center justify-between py-3.5 px-1 cursor-pointer group active:bg-gray-50 rounded-xl transition-colors">
                        <div class="flex items-center gap-3.5">
                            <img src="https://i.pravatar.cc/150?img=32" alt="Emma Wilson" class="w-[46px] h-[46px] rounded-full object-cover bg-gray-100">
                            <div>
                                <p class="text-base font-medium text-gray-900">Emma Wilson</p>
                                <p class="text-xs text-gray-500 mt-0.5">Koli App</p>
                            </div>
                        </div>
                        <div class="w-6 h-6 rounded-full border-[1.5px] border-gray-300 flex items-center justify-center group-hover:border-purple-300 transition-colors"></div>
                    </label>
                </div>
            </div>
            
            <!-- Home Indicator Mockup -->
            <div class="h-[34px] w-full flex items-center justify-center shrink-0 bg-white">
                <div class="w-[134px] h-[5px] bg-gray-900 rounded-full"></div>
            </div>

        </div>
    </div>

</body>
</html>
