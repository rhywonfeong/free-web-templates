            <div class="flex flex-col items-center bg-white rounded-2xl px-4 py-2 shadow-sm">

                <span class="text-xs font-medium text-neutral-400 uppercase">Tue</span>

                <span class="text-xs font-medium text-neutral-400 uppercase">Wed</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-2xl font-medium text-neutral-300">8</span>
                <span class="text-xs font-medium text-neutral-400 uppercase">Thu</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-2xl font-medium text-neutral-300">9</span>
                <span class="text-xs font-medium text-neutral-400 uppercase">Fri</span>
            </div>
            <div class="flex flex-col items-center">
                <span class="text-2xl font-medium text-neutral-300">10</span>
                <span class="text-xs font-medium text-neutral-400 uppercase">Sat</span>
            </div>
        </div>

        <!-- Tasks List -->
        <div class="space-y-0">
            <!-- Wake Up - Completed -->
            <div class="flex items-center justify-between py-4 dotted-border">
                <div class="flex items-center gap-4">
                    <span class="text-2xl">☀️</span>
                    <span class="text-lg font-medium text-neutral-400 line-through">Wake Up</span>
                </div>
                <span class="text-base font-normal text-neutral-400">09:00</span>
            </div>

            <!-- Exercise -->
            <div class="flex dotted-border pt-4 pb-4 items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-7 h-7 rounded-full border-2 border-dashed border-neutral-300"></div>
                    <span class="text-lg font-medium text-neutral-900">Exercise</span>
                </div>
            </div>

            <!-- Drink Water -->
            <div class="flex dotted-border pt-4 pb-4 items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-7 h-7 rounded-full border-2 border-dashed border-neutral-300"></div>
                    <span class="text-lg font-medium text-neutral-900">Drink water</span>
                </div>
            </div>

            <!-- Task 3 -->
            <div class="flex dotted-border pt-4 pb-4 items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-7 h-7 rounded-full border-2 border-dashed border-neutral-300"></div>
                    <span class="text-lg font-medium text-neutral-900">Meeting notes</span>
                </div>
            </div>

            <!-- Task 4 -->
            <div class="flex items-center justify-between py-4 dotted-border">
                <div class="flex items-center gap-4">
                    <div class="w-7 h-7 rounded-full border-2 border-dashed border-neutral-300"></div>
                    <span class="text-lg font-medium text-neutral-900">Read book</span>
                </div>
            </div>

            <!-- Wind Down -->
            <div class="flex items-center justify-between py-4 dotted-border">
                <div class="flex items-center gap-4">
                    <span class="text-2xl">🌙</span>
                    <span class="text-lg font-medium text-neutral-900">Wind Down</span>
                </div>
                <span class="text-base font-normal text-neutral-400">22:00</span>
            </div>
        </div>
    </div>
