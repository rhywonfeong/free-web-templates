<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travel Preference Wizard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.4"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@keyframes fadeUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:translateY(0)}}
.animate-fadeUp{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) both}
.autocomplete-list{max-height:10rem;overflow-y:auto}
.tag{--tw-ring-color:#4f46e5}
.tag:hover .remove{opacity:1}
.remove{opacity:0;transition:opacity .2s ease}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<link id="all-fonts-link-font-geist" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap"><link id="all-fonts-link-font-roboto" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&amp;display=swap"><link id="all-fonts-link-font-montserrat" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&amp;display=swap"><link id="all-fonts-link-font-poppins" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&amp;display=swap"><link id="all-fonts-link-font-playfair" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;900&amp;display=swap"><link id="all-fonts-link-font-instrument-serif" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:wght@400;500;600;700&amp;display=swap"><link id="all-fonts-link-font-merriweather" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&amp;display=swap"><link id="all-fonts-link-font-bricolage" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;400;500;600;700&amp;display=swap"><link id="all-fonts-link-font-jakarta" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap"><link id="all-fonts-link-font-manrope" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap"><link id="all-fonts-link-font-space-grotesk" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"><link id="all-fonts-link-font-work-sans" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800&amp;display=swap"><link id="all-fonts-link-font-pt-serif" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&amp;display=swap"><link id="all-fonts-link-font-geist-mono" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&amp;display=swap"><link id="all-fonts-link-font-space-mono" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap"><link id="all-fonts-link-font-quicksand" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&amp;display=swap"><link id="all-fonts-link-font-nunito" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&amp;display=swap"><style id="all-fonts-style-font-geist">.font-geist { font-family: 'Geist', sans-serif !important; }</style><style id="all-fonts-style-font-roboto">.font-roboto { font-family: 'Roboto', sans-serif !important; }</style><style id="all-fonts-style-font-montserrat">.font-montserrat { font-family: 'Montserrat', sans-serif !important; }</style><style id="all-fonts-style-font-poppins">.font-poppins { font-family: 'Poppins', sans-serif !important; }</style><style id="all-fonts-style-font-playfair">.font-playfair { font-family: 'Playfair Display', serif !important; }</style><style id="all-fonts-style-font-instrument-serif">.font-instrument-serif { font-family: 'Instrument Serif', serif !important; }</style><style id="all-fonts-style-font-merriweather">.font-merriweather { font-family: 'Merriweather', serif !important; }</style><style id="all-fonts-style-font-bricolage">.font-bricolage { font-family: 'Bricolage Grotesque', sans-serif !important; }</style><style id="all-fonts-style-font-jakarta">.font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif !important; }</style><style id="all-fonts-style-font-manrope">.font-manrope { font-family: 'Manrope', sans-serif !important; }</style><style id="all-fonts-style-font-space-grotesk">.font-space-grotesk { font-family: 'Space Grotesk', sans-serif !important; }</style><style id="all-fonts-style-font-work-sans">.font-work-sans { font-family: 'Work Sans', sans-serif !important; }</style><style id="all-fonts-style-font-pt-serif">.font-pt-serif { font-family: 'PT Serif', serif !important; }</style><style id="all-fonts-style-font-geist-mono">.font-geist-mono { font-family: 'Geist Mono', monospace !important; }</style><style id="all-fonts-style-font-space-mono">.font-space-mono { font-family: 'Space Mono', monospace !important; }</style><style id="all-fonts-style-font-quicksand">.font-quicksand { font-family: 'Quicksand', sans-serif !important; }</style><style id="all-fonts-style-font-nunito">.font-nunito { font-family: 'Nunito', sans-serif !important; }</style></head>

<body class="antialiased flex items-center justify-center min-h-screen text-gray-100 font-inter bg-gray-950 pt-6 pr-6 pb-6 pl-6">

<!-- WIZARD CARD -->
<section class="animate-fadeUp w-full max-w-md ring-1 ring-gray-800 bg-gray-900/60 rounded-2xl pt-6 pr-6 pb-6 pl-6 backdrop-blur space-y-8">

  <!-- HEADER -->
  <header class="flex items-center gap-3">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="compass" class="lucide lucide-compass w-6 h-6 text-indigo-400"><path d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"></path><circle cx="12" cy="12" r="10"></circle></svg>
    <h2 class="text-xl font-semibold tracking-tight">Trip Preferences</h2>
  </header>

  <form class="space-y-6" id="wizard-form" autocomplete="off">

    <!-- MAIN CITY AUTOCOMPLETE -->
    <div class="space-y-2">
      <label for="main-city" class="text-sm font-medium tracking-tight flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="map" class="lucide lucide-map w-4 h-4 text-indigo-400"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"></path><path d="M15 5.764v15"></path><path d="M9 3.236v15"></path></svg>Main City
      </label>
      <div class="relative">
        <input id="main-city" type="text" placeholder="Search city..." class="peer w-full bg-gray-800/60 ring-1 ring-gray-700 focus:ring-indigo-500 rounded-md px-3 py-2 text-sm placeholder-gray-500 outline-none transition" aria-autocomplete="list" aria-controls="city-suggestions" aria-expanded="false">
        <ul id="city-suggestions" role="listbox" class="absolute z-10 left-0 right-0 mt-1 bg-gray-900 ring-1 ring-gray-800 rounded-md shadow-lg divide-y divide-gray-800 hidden autocomplete-list no-scrollbar">
          <!-- suggestions injected here -->
        </ul>
      </div>
    </div>

    <!-- NIGHTS COUNTER -->
    <div class="space-y-2">
      <label for="nights" class="text-sm font-medium tracking-tight flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="moon" class="lucide lucide-moon w-4 h-4 text-indigo-400"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>Number&nbsp;of&nbsp;Nights
      </label>
      <div class="flex items-center gap-2">
        <button type="button" id="minus" class="w-8 h-8 flex items-center justify-center rounded-md bg-gray-800/60 ring-1 ring-gray-700 hover:ring-indigo-500 text-gray-400 transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="minus" class="lucide lucide-minus w-4 h-4"><path d="M5 12h14"></path></svg>
        </button>
        <input id="nights" type="number" value="3" min="1" class="w-full text-center bg-gray-800/60 ring-1 ring-gray-700 focus:ring-indigo-500 rounded-md px-3 py-2 text-sm outline-none transition">
        <button type="button" id="plus" class="w-8 h-8 flex items-center justify-center rounded-md bg-gray-800/60 ring-1 ring-gray-700 hover:ring-indigo-500 text-gray-400 transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus" class="lucide lucide-plus w-4 h-4"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        </button>
      </div>
    </div>

    <!-- HOTEL PREFERENCE -->
    <fieldset class="space-y-2">
      <legend class="text-sm font-medium tracking-tight flex items-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="bed-double" class="lucide lucide-bed-double w-4 h-4 text-indigo-400"><path d="M2 20v-8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8"></path><path d="M4 10V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4"></path><path d="M12 4v6"></path><path d="M2 18h20"></path></svg>Hotel Preference
      </legend>
      <div class="flex gap-2">
        <button type="button" data-pref="budget" class="pref-btn flex-1 text-xs font-semibold rounded-md px-3 py-2 bg-gray-800/60 ring-1 ring-gray-700 hover:ring-indigo-500 transition" aria-pressed="false">Budget</button>
        <button type="button" data-pref="standard" class="pref-btn flex-1 text-xs font-semibold rounded-md px-3 py-2 bg-gray-800/60 ring-1 ring-gray-700 hover:ring-indigo-500 transition" aria-pressed="false">Standard</button>
        <button type="button" data-pref="luxury" class="pref-btn flex-1 text-xs font-semibold rounded-md px-3 py-2 bg-gray-800/60 ring-1 ring-gray-700 hover:ring-indigo-500 transition" aria-pressed="false">Luxury</button>
      </div>
      <input type="hidden" name="hotelPref" id="hotelPref">
    </fieldset>

    <!-- NEARBY CITIES / DAY TRIPS -->
    <details class="group space-y-3">
      <summary class="cursor-pointer select-none flex items-center justify-between gap-3 py-2 px-3 rounded-md bg-gray-800/50 ring-1 ring-gray-700 hover:ring-indigo-500 transition">
        <span class="flex items-center gap-2 text-sm font-medium tracking-tight">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="map-pin" class="lucide lucide-map-pin w-4 h-4 text-indigo-400"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>Nearby Cities or Day Trips
        </span>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="chevron-right" class="lucide lucide-chevron-right w-4 h-4 text-gray-400 group-open:rotate-90 transition-transform"><path d="m9 18 6-6-6-6"></path></svg>
      </summary>

      <div class="space-y-3">
        <!-- tags container -->
        <div id="tag-container" class="flex flex-wrap gap-2 min-h-[2.5rem] items-center"></div>

        <!-- input with suggestions -->
        <div class="relative">
          <input id="secondary-city" type="text" placeholder="Add a city..." class="w-full bg-gray-800/60 ring-1 ring-gray-700 focus:ring-indigo-500 rounded-md px-3 py-2 text-sm placeholder-gray-500 outline-none transition" aria-autocomplete="list" aria-controls="secondary-suggestions" aria-expanded="false">
          <ul id="secondary-suggestions" role="listbox" class="absolute z-10 left-0 right-0 mt-1 bg-gray-900 ring-1 ring-gray-800 rounded-md shadow-lg divide-y divide-gray-800 hidden autocomplete-list no-scrollbar">
            <!-- suggestions injected here -->
          </ul>
        </div>
      </div>
    </details>

    <!-- SUBMIT -->
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 font-semibold text-sm rounded-md py-3 transition">
      Save Preferences
    </button>
  </form>
</section>

<!-- ICON INIT & LOGIC -->
<script>
lucide.createIcons();

/* Sample city dataset */
const cities=["Tokyo","Kyoto","Osaka","Sapporo","Fukuoka","Nagoya","Yokohama","Sendai","Hiroshima","Kobe","Nara","Hakone","Nikko","Kanazawa","Takayama"];

/* Utility to render suggestion list */
function showSuggestions(inputEl,listEl){
  const val=inputEl.value.trim().toLowerCase();
  listEl.innerHTML='';
  if(!val){listEl.classList.add('hidden');return;}
  const matches=cities.filter(c=>c.toLowerCase().startsWith(val));
  if(!matches.length){listEl.classList.add('hidden');return;}
  matches.forEach(city=>{
    const li=document.createElement('li');
    li.role='option';
    li.tabIndex=0;
    li.className="px-3 py-2 text-sm hover:bg-gray-800 cursor-pointer";
    li.textContent=city;
    li.addEventListener('click',()=>{selectCity(inputEl,listEl,city)});
    li.addEventListener('keydown',e=>{if(e.key==='Enter')selectCity(inputEl,listEl,city)});
    listEl.appendChild(li);
  });
  listEl.classList.remove('hidden');
}
function selectCity(inputEl,listEl,city){
  inputEl.value=city;
  listEl.classList.add('hidden');
  inputEl.dispatchEvent(new Event('city-selected'));
}

/* Autocomplete for main city */
const mainInput=document.getElementById('main-city');
const mainList=document.getElementById('city-suggestions');
mainInput.addEventListener('input',()=>showSuggestions(mainInput,mainList));
mainInput.addEventListener('focus',()=>showSuggestions(mainInput,mainList));
mainInput.addEventListener('blur',()=>setTimeout(()=>mainList.classList.add('hidden'),100));

/* Nights counter */
const nights=document.getElementById('nights');
document.getElementById('minus').addEventListener('click',()=>{nights.value=Math.max(1,parseInt(nights.value||1)-1)});
document.getElementById('plus').addEventListener('click',()=>{nights.value=parseInt(nights.value||1)+1});

/* Hotel pref selection */
const prefBtns=document.querySelectorAll('.pref-btn');
const prefHidden=document.getElementById('hotelPref');
prefBtns.forEach(btn=>{
  btn.addEventListener('click',()=>{
    prefBtns.forEach(b=>{b.classList.remove('ring-indigo-500','bg-indigo-600');b.setAttribute('aria-pressed','false')});
    btn.classList.add('ring-indigo-500','bg-indigo-600');
    btn.setAttribute('aria-pressed','true');
    prefHidden.value=btn.dataset.pref;
  });
});

/* Nearby cities tag system */
const secInput=document.getElementById('secondary-city');
const secList=document.getElementById('secondary-suggestions');
const tagContainer=document.getElementById('tag-container');
const tags=new Set();

function addTag(city){
  if(tags.has(city))return;
  tags.add(city);
  const tagEl=document.createElement('span');
  tagEl.className="tag flex items-center gap-1 bg-gray-800/60 ring-1 ring-gray-700 rounded-md px-2 py-1 text-xs";
  tagEl.innerHTML=`${city}<button type="button" class="remove" aria-label="Remove ${city}"><i data-lucide="x" class="w-3 h-3"></i></button>`;
  tagContainer.appendChild(tagEl);
  lucide.createIcons({icons:['x'],attrs:{class:'w-3 h-3'}});
  tagEl.querySelector('.remove').addEventListener('click',()=>{tags.delete(city);tagEl.remove()});
}

secInput.addEventListener('input',()=>showSuggestions(secInput,secList));
secInput.addEventListener('focus',()=>showSuggestions(secInput,secList));
secInput.addEventListener('blur',()=>setTimeout(()=>secList.classList.add('hidden'),100));
secInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    const city=secInput.value.trim();
    if(city){addTag(city);secInput.value='';}
  }
});
secInput.addEventListener('city-selected',()=>{addTag(secInput.value.trim());secInput.value='';});

/* Submit handler */
document.getElementById('wizard-form').addEventListener('submit',e=>{
  e.preventDefault();
  const data={
    mainCity:mainInput.value.trim(),
    nights:parseInt(nights.value,10),
    hotelPref:prefHidden.value,
    nearby:[...tags]
  };
  console.log('Preferences saved:',data);
  alert('Preferences saved! Check console for details.');
});
</script>

</body></html>
