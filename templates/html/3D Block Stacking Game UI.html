    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Tetris</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-gray-900 flex items-center justify-center h-screen">
    <div class="text-center">
        <h1 class="text-4xl font-bold text-white mb-4">Mini Tetris</h1>
        <div id="game-container" class="inline-block relative">
            <div id="score" class="absolute top-0 right-0 text-white p-2 bg-black bg-opacity-50 rounded">Score: 0</div>
            <div id="game-over" class="hidden absolute inset-0 bg-black bg-opacity-75 flex items-center justify-center">
                <div class="text-white text-2xl font-bold">Game Over</div>
            </div>
        </div>
        <div class="mt-4">
            <button id="start-btn" class="px-4 py-2 bg-blue-500 text-white rounded mr-2">Start</button>
            <button id="reset-btn" class="px-4 py-2 bg-red-500 text-white rounded">Reset</button>
        </div>
        <div class="text-white mt-4">
            <p>Controls: ← → to move, ↑ to rotate, ↓ to drop faster</p>
        </div>
    </div>

    <script>
        // Game constants
        const BOARD_WIDTH = 10;
        const BOARD_HEIGHT = 20;
        const BLOCK_SIZE = 30;
        
        // Three.js setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, (BOARD_WIDTH * BLOCK_SIZE) / (BOARD_HEIGHT * BLOCK_SIZE), 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(BOARD_WIDTH * BLOCK_SIZE, BOARD_HEIGHT * BLOCK_SIZE);
        document.getElementById('game-container').appendChild(renderer.domElement);
        
        camera.position.z = 15;
        scene.background = new THREE.Color(0x111111);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 10, 10);
        scene.add(directionalLight);
        
        // Game state
        let board = Array(BOARD_HEIGHT).fill().map(() => Array(BOARD_WIDTH).fill(0));
        let currentPiece = null;
        let score = 0;
        let gameOver = false;
        let gameStarted = false;
        let gameLoop = null;
        
        // Tetromino shapes
        const SHAPES = [
            // I
            [
                [1, 1, 1, 1]
            ],
            // J
            [
                [1, 0, 0],
                [1, 1, 1]
            ],
            // L
            [
                [0, 0, 1],
                [1, 1, 1]
            ],
            // O
            [
                [1, 1],
                [1, 1]
            ],
            // S
            [
                [0, 1, 1],
                [1, 1, 0]
            ],
            // T
            [
                [0, 1, 0],
                [1, 1, 1]
            ],
            // Z
            [
                [1, 1, 0],
                [0, 1, 1]
            ]
        ];
        
        const COLORS = [
            0x00ffff, // Cyan
            0x0000ff, // Blue
            0xff7f00, // Orange
            0xffff00, // Yellow
            0x00ff00, // Green
            0x800080, // Purple
            0xff0000  // Red
        ];
        
        // Game objects
        const blockMeshes = [];
        
        function createBlock(x, y, colorIndex) {
            const geometry = new THREE.BoxGeometry(0.9, 0.9, 0.9);
            const material = new THREE.MeshPhongMaterial({ color: COLORS[colorIndex] });
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.position.x = x - BOARD_WIDTH / 2 + 0.5;
            mesh.position.y = y - BOARD_HEIGHT / 2 + 0.5;
            
            scene.add(mesh);
            return mesh;
        }
        
        function createNewPiece() {
            const shapeIndex = Math.floor(Math.random() * SHAPES.length);
            const shape = SHAPES[shapeIndex];
            
            currentPiece = {
                shape,
                x: Math.floor((BOARD_WIDTH - shape[0].length) / 2),
                y: BOARD_HEIGHT - shape.length,
                colorIndex: shapeIndex,
                blocks: []
            };
            
            // Create blocks for the piece
            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x]) {
                        const blockX = currentPiece.x + x;
                        const blockY = currentPiece.y + y;
                        
                        // Check if position is already occupied (game over condition)
                        if (board[blockY] && board[blockY][blockX]) {
                            gameOver = true;
                            document.getElementById('game-over').classList.remove('hidden');
                            clearInterval(gameLoop);
                            return;
                        }
                        
                        const mesh = createBlock(blockX, blockY, currentPiece.colorIndex);
                        currentPiece.blocks.push(mesh);
                    }
                }
            }
        }
        
        function moveDown() {
            currentPiece.y--;
            
            if (checkCollision()) {
                currentPiece.y++;
                placePiece();
                clearLines();
                createNewPiece();
                return false;
            }
            
            updatePiecePosition();
            return true;
        }
        
        function moveLeft() {
            currentPiece.x--;
            if (checkCollision()) {
                currentPiece.x++;
                return false;
            }
            updatePiecePosition();
            return true;
        }
        
        function moveRight() {
            currentPiece.x++;
            if (checkCollision()) {
                currentPiece.x--;
                return false;
            }
            updatePiecePosition();
            return true;
        }
        
        function rotate() {
            const oldShape = currentPiece.shape;
            const newShape = [];
            
            for (let x = 0; x < oldShape[0].length; x++) {
                newShape.push([]);
                for (let y = oldShape.length - 1; y >= 0; y--) {
                    newShape[x].push(oldShape[y][x]);
                }
            }
            
            const oldX = currentPiece.x;
            const oldY = currentPiece.y;
            
            currentPiece.shape = newShape;
            
            if (checkCollision()) {
                currentPiece.shape = oldShape;
                return false;
            }
            
            // Remove old blocks
            currentPiece.blocks.forEach(block => scene.remove(block));
            currentPiece.blocks = [];
            
            // Create new blocks
            for (let y = 0; y < newShape.length; y++) {
                for (let x = 0; x < newShape[y].length; x++) {
                    if (newShape[y][x]) {
                        const blockX = currentPiece.x + x;
                        const blockY = currentPiece.y + y;
                        const mesh = createBlock(blockX, blockY, currentPiece.colorIndex);
                        currentPiece.blocks.push(mesh);
                    }
                }
            }
            
            return true;
        }
        
        function checkCollision() {
            const shape = currentPiece.shape;
            
            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x]) {
                        const blockX = currentPiece.x + x;
                        const blockY = currentPiece.y + y;
                        
                        // Check if out of bounds or colliding with placed blocks
                        if (blockX < 0 || blockX >= BOARD_WIDTH || blockY < 0 || 
                            (blockY < BOARD_HEIGHT && board[blockY][blockX])) {
                            return true;
                        }
                    }
                }
            }
            
            return false;
        }
        
        function updatePiecePosition() {
            const shape = currentPiece.shape;
            
            for (let i = 0; i < currentPiece.blocks.length; i++) {
                let blockIndex = 0;
                
                for (let y = 0; y < shape.length; y++) {
                    for (let x = 0; x < shape[y].length; x++) {
                        if (shape[y][x]) {
                            if (blockIndex === i) {
                                const blockX = currentPiece.x + x;
                                const blockY = currentPiece.y + y;
                                
                                currentPiece.blocks[i].position.x = blockX - BOARD_WIDTH / 2 + 0.5;
                                currentPiece.blocks[i].position.y = blockY - BOARD_HEIGHT / 2 + 0.5;
                                return;
                            }
                            blockIndex++;
                        }
                    }
                }
            }
        }
        
        function placePiece() {
            const shape = currentPiece.shape;
            
            for (let y = 0; y < shape.length; y++) {
                for (let x = 0; x < shape[y].length; x++) {
                    if (shape[y][x]) {
                        const blockX = currentPiece.x + x;
                        const blockY = currentPiece.y + y;
                        
                        if (blockY >= 0 && blockY < BOARD_HEIGHT) {
                            board[blockY][blockX] = currentPiece.colorIndex + 1;
                            blockMeshes.push(...currentPiece.blocks);
                        }
                    }
                }
            }
        }
        
        function clearLines() {
            let linesCleared = 0;
            
            for (let y = 0; y < BOARD_HEIGHT; y++) {
                if (board[y].every(cell => cell !== 0)) {
                    // Remove blocks from the scene
                    for (let x = 0; x < BOARD_WIDTH; x++) {
                        const index = blockMeshes.findIndex(mesh => 
                            Math.round(mesh.position.x + BOARD_WIDTH / 2 - 0.5) === x && 
                            Math.round(mesh.position.y + BOARD_HEIGHT / 2 - 0.5) === y
                        );
                        
                        if (index !== -1) {
                            scene.remove(blockMeshes[index]);
                            blockMeshes.splice(index, 1);
                        }
                    }
                    
                    // Move all rows above down
                    for (let y2 = y; y2 < BOARD_HEIGHT - 1; y2++) {
                        board[y2] = [...board[y2 + 1]];
                    }
                    
                    // Clear the top row
                    board[BOARD_HEIGHT - 1] = Array(BOARD_WIDTH).fill(0);
                    
                    // Move all blocks above this line down
                    blockMeshes.forEach(mesh => {
                        const meshY = Math.round(mesh.position.y + BOARD_HEIGHT / 2 - 0.5);
                        if (meshY > y) {
                            mesh.position.y -= 1;
                        }
                    });
                    
                    linesCleared++;
                    y--; // Check the same line again
                }
            }
            
            if (linesCleared > 0) {
                score += [0, 40, 100, 300, 1200][linesCleared] * (Math.floor(score / 1000) + 1);
                document.getElementById('score').textContent = `Score: ${score}`;
            }
        }
        
        function render() {
            requestAnimationFrame(render);
            renderer.render(scene, camera);
        }
        
        function startGame() {
            if (gameStarted) return;
            
            gameStarted = true;
            gameOver = false;
            score = 0;
            document.getElementById('score').textContent = 'Score: 0';
            document.getElementById('game-over').classList.add('hidden');
            
            // Clear the board
            board = Array(BOARD_HEIGHT).fill().map(() => Array(BOARD_WIDTH).fill(0));
            
            // Remove all blocks
            blockMeshes.forEach(mesh => scene.remove(mesh));
            blockMeshes.length = 0;
            
            if (currentPiece) {
                currentPiece.blocks.forEach(mesh => scene.remove(mesh));
            }
            
            createNewPiece();
            
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                if (!gameOver) {
                    moveDown();
                }
            }, 500);
        }
        
        function resetGame() {
            clearInterval(gameLoop);
            gameStarted = false;
            gameOver = true;
            
            // Clear the board
            board = Array(BOARD_HEIGHT).fill().map(() => Array(BOARD_WIDTH).fill(0));
            
            // Remove all blocks
            blockMeshes.forEach(mesh => scene.remove(mesh));
            blockMeshes.length = 0;
            
            if (currentPiece) {
                currentPiece.blocks.forEach(mesh => scene.remove(mesh));
                currentPiece = null;
            }
            
            score = 0;
            document.getElementById('score').textContent = 'Score: 0';
            document.getElementById('game-over').classList.add('hidden');
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (!gameStarted || gameOver) return;
            
            switch (e.key) {
                case 'ArrowLeft':
                    moveLeft();
                    break;
                case 'ArrowRight':
                    moveRight();
                    break;
                case 'ArrowUp':
                    rotate();
                    break;
                case 'ArrowDown':
                    moveDown();
                    break;
                case ' ':
                    while(moveDown());
                    break;
            }
        });
        
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('reset-btn').addEventListener('click', resetGame);
        
        // Start rendering
        render();
    </script>
</body>
</html>
