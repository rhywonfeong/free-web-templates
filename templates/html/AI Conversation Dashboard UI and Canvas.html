<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8">
<title>Glassomorphic AI Conversation Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen antialiased text-neutral-100 selection:bg-sky-500/20 selection:text-sky-100" style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; background-color: #0D0D0D;">
  <!-- Ethereal Gradient Background -->
  <div class="pointer-events-none fixed inset-0 -z-20">
    <div class="absolute inset-0 opacity-80" style="background: radial-gradient(1200px 600px at 10% 10%, rgba(30,64,175,0.18), transparent 60%), radial-gradient(1000px 600px at 90% 20%, rgba(0,168,164,0.12), transparent 60%), radial-gradient(1000px 500px at 50% 100%, rgba(94,140,255,0.12), transparent 60%);"></div>
    <div class="absolute inset-0" style="background: linear-gradient(180deg, rgba(13,13,13,0.95), rgba(13,13,13,0.9));"></div>
  </div>

  <!-- App Frame -->
  <div id="root" class="relative mx-auto my-4 sm:my-8 max-w-[1400px] 2xl:max-w-[1600px] h-[calc(100vh-2rem)] sm:h-[calc(100vh-4rem)]">
    <div class="relative flex h-full overflow-hidden rounded-2xl shadow-2xl" style="background: rgba(18,18,18,0.25); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); --primary-color:#5E8CFF; --secondary-color:#FF8356; --tertiary-color:#C96BFF; --info-color:#62CCFF; --bg:#0D0D0D; --card: rgba(18,18,18,0.25); --border: rgba(255,255,255,0.08); --hover-shade:#16233F; --active-shade:#1B2A4D; --panel-shadow: 0 20px 60px rgba(4, 51, 163, 0.20);">

      <!-- Left Sidebar -->
      <aside id="sidebar" class="hidden md:flex md:w-[300px] lg:w-[320px] xl:w-[340px] flex-col border-r border-white/10" aria-label="Spaces and Agents" style="background: rgba(18,18,18,0.25); backdrop-filter: blur(16px);">
        <!-- Sidebar Header -->
        <div class="sticky top-0 z-10 px-4 sm:px-5 py-3 flex items-center justify-between border-b border-white/10" style="background: rgba(18,18,18,0.35); backdrop-filter: blur(16px);">
          <div class="flex items-center gap-2">
            <div class="h-8 w-8 rounded-xl flex items-center justify-center ring-1 ring-white/10" style="background: linear-gradient(145deg, rgba(94,140,255,0.22), rgba(16,185,129,0.12));">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px] text-sky-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3v3m0 12v3M3 12h3m12 0h3"/><circle cx="12" cy="12" r="4"/></svg>
            </div>
            <h1 class="text-[22px] tracking-tight font-semibold">Conversations</h1>
          </div>
          <button id="collapseAll" class="px-2 py-1 rounded-lg text-[12px] text-neutral-300 hover:text-white hover:bg-white/5" aria-label="Collapse all spaces">Collapse</button>
        </div>

        <!-- Spaces List -->
        <div id="spacesList" class="flex-1 overflow-y-auto px-2 py-3" tabindex="0" aria-label="Spaces list" style="scrollbar-width: thin;">
          <!-- Rendered by initDashboard -->
        </div>

        <!-- Sidebar Footer -->
        <div class="px-3 py-3 border-t border-white/10">
          <button id="newSpaceBtn" class="w-full flex items-center justify-center gap-2 rounded-xl px-3 py-2.5 text-sm font-medium text-neutral-200 hover:text-white ring-1 ring-white/10 hover:bg-white/5" aria-label="Create new space">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5v14M5 12h14"/></svg>
            New Space
          </button>
        </div>
      </aside>

      <!-- Main Content -->
      <main id="main" class="relative flex-1 flex flex-col">
        <!-- Top Toolbar -->
        <div class="sticky top-0 z-20 border-b border-white/10" style="background: rgba(18,18,18,0.35); backdrop-filter: blur(16px);">
          <div class="px-4 sm:px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2 md:gap-3">
              <!-- Mobile Sidebar Toggle -->
              <button id="mobileSidebarBtn" class="md:hidden inline-flex items-center justify-center h-9 w-9 rounded-xl ring-1 ring-white/10 hover:bg-white/5" aria-label="Toggle sidebar">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-neutral-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>

              <!-- Search -->
              <div class="hidden sm:flex items-center gap-2 ring-1 ring-white/10 rounded-xl pl-2 pr-2 py-1.5 min-w-[260px] max-w-[420px] text-sm" style="background: rgba(18,18,18,0.25);">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 text-neutral-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input id="globalSearch" aria-label="Search conversations" placeholder="Search spaces, chats, agents..." class="w-full bg-transparent outline-none placeholder:text-neutral-400 text-neutral-100" />
                <span class="hidden md:inline text-[11px] text-neutral-400 px-1.5 py-0.5 rounded bg-white/5">⌘K</span>
              </div>
            </div>

            <!-- Model/Provider Switcher + Settings -->
            <div class="flex items-center gap-2 md:gap-3">
              <div class="relative">
                <button id="modelBtn" class="flex items-center gap-2 rounded-xl ring-1 ring-white/10 px-3 py-1.5 text-sm hover:bg-white/5" aria-haspopup="listbox" aria-expanded="false" aria-label="Select model">
                  <span class="inline-flex h-2.5 w-2.5 rounded-full" style="background: var(--primary-color);"></span>
                  <span id="modelLabel" class="text-neutral-200">gpt-4o</span>
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-neutral-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div id="modelMenu" class="hidden absolute right-0 mt-2 w-48 rounded-xl ring-1 ring-white/10 overflow-hidden" role="listbox" style="background: rgba(18,18,18,0.85); backdrop-filter: blur(16px); box-shadow: var(--panel-shadow);">
                  <button role="option" data-value="gpt-4o" class="w-full text-left px-3 py-2 text-sm hover:bg-white/5">gpt-4o</button>
                  <button role="option" data-value="gpt-4-mini" class="w-full text-left px-3 py-2 text-sm hover:bg-white/5">gpt-4-mini</button>
                  <button role="option" data-value="claude-3.5" class="w-full text-left px-3 py-2 text-sm hover:bg-white/5">claude-3.5</button>
                  <button role="option" data-value="sonnet-3.5" class="w-full text-left px-3 py-2 text-sm hover:bg-white/5">sonnet-3.5</button>
                </div>
              </div>

              <button id="settingsBtn" class="inline-flex items-center justify-center h-9 w-9 rounded-xl ring-1 ring-white/10 hover:bg-white/5" aria-label="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 text-neutral-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Canvas + Transcript Wrapper -->
        <div class="relative flex-1 overflow-hidden">
          <!-- Pannable/Zoomable Viewport -->
          <div id="viewport" class="absolute inset-0" tabindex="0" aria-label="Conversation canvas" role="region">
            <!-- Connections Canvas -->
            <canvas id="connections" class="absolute inset-0"></canvas>
            <!-- Nodes Layer -->
            <div id="nodesLayer" class="absolute inset-0"></div>
            <!-- Hover Preview Popover -->
            <div id="nodePreview" class="hidden absolute min-w-[220px] max-w-[320px] p-3 rounded-xl ring-1 ring-white/10 text-sm" style="background: rgba(18,18,18,0.7); backdrop-filter: blur(16px); box-shadow: var(--panel-shadow);"></div>
            <!-- Context Menu -->
            <div id="ctxMenu" class="hidden absolute w-44 rounded-xl overflow-hidden ring-1 ring-white/10" style="background: rgba(18,18,18,0.85); backdrop-filter: blur(16px); box-shadow: var(--panel-shadow);">
              <button data-action="duplicate" class="w-full text-left px-3 py-2 text-sm hover:bg-white/5 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect width="8" height="8" x="8" y="8" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></svg>
                Duplicate
              </button>
              <button data-action="move" class="w-full text-left px-3 py-2 text-sm hover:bg-white/5 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m5 9 7-7 7 7"/><path d="M12 2v20"/></svg>
                Move to next space
              </button>
              <button data-action="delete" class="w-full text-left px-3 py-2 text-sm hover:bg-white/5 text-rose-300 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>
                Delete
              </button>
            </div>
          </div>

          <!-- Transcript / Streaming Output -->
          <div id="transcript" class="pointer-events-none absolute left-0 right-0 bottom-24 md:bottom-28 px-4 sm:px-6 space-y-2 max-h-[35%] overflow-y-auto">
            <!-- Messages appended here -->
          </div>
        </div>

        <!-- Bottom Composer -->
        <div class="sticky bottom-0 z-20 border-t border-white/10" style="background: rgba(18,18,18,0.35); backdrop-filter: blur(16px);">
          <div class="px-4 sm:px-6 py-3 space-y-2">
            <!-- Persona Chips -->
            <div id="personaChips" class="flex flex-wrap items-center gap-2">
              <!-- Rendered by initDashboard -->
            </div>
            <!-- Composer Row -->
            <div class="flex items-end gap-2">
              <!-- Textarea -->
              <div class="flex-1 ring-1 ring-white/10 rounded-xl p-2.5" style="background: rgba(18,18,18,0.25);">
                <textarea id="composerInput" rows="1" aria-label="Prompt input" placeholder="Write a prompt… (Enter to send, Shift+Enter for newline)" class="w-full resize-none bg-transparent outline-none text-[15px] placeholder:text-neutral-400"></textarea>
                <div class="mt-2 flex items-center justify-between">
                  <!-- Model Selector (secondary small) -->
                  <div class="relative">
                    <button id="composerModelBtn" class="inline-flex items-center gap-1.5 text-[12px] px-2 py-1 rounded-lg ring-1 ring-white/10 hover:bg-white/5" aria-haspopup="listbox" aria-expanded="false" aria-label="Composer model">
                      <span class="h-2 w-2 rounded-full" style="background: var(--secondary-color);"></span>
                      <span id="composerModelLabel" class="text-neutral-300">Auto</span>
                      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-neutral-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <div id="composerModelMenu" class="hidden absolute left-0 mt-2 w-36 rounded-xl ring-1 ring-white/10 overflow-hidden" role="listbox" style="background: rgba(18,18,18,0.85); backdrop-filter: blur(16px); box-shadow: var(--panel-shadow);">
                      <button role="option" data-value="Auto" class="w-full text-left px-3 py-2 text-sm hover:bg-white/5">Auto</button>
                      <button role="option" data-value="Reasoning" class="w-full text-left px-3 py-2 text-sm hover:bg-white/5">Reasoning</button>
                      <button role="option" data-value="Fast" class="w-full text-left px-3 py-2 text-sm hover:bg-white/5">Fast</button>
                    </div>
                  </div>

                  <div class="flex items-center gap-2">
                    <button id="attachBtn" class="inline-flex items-center justify-center h-9 w-9 rounded-xl ring-1 ring-white/10 hover:bg-white/5" aria-label="Attach file">
                      <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 text-neutral-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21.44 11.05 12 20.5a6 6 0 0 1-8.49-8.49l10-10a4 4 0 1 1 5.66 5.66l-10 10a2 2 0 1 1-2.83-2.83L15 6"/></svg>
                    </button>
                    <button id="sendBtn" class="inline-flex items-center gap-2 rounded-xl px-3.5 py-2.5 text-sm font-medium text-neutral-900 hover:opacity-90" style="background: var(--primary-color); box-shadow: 0 10px 30px rgba(94,140,255,0.35);" aria-label="Send message">
                      <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                      Send
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <p class="text-[11px] text-neutral-400">Tip: Use ↑/↓ in sidebar, ←/→ to navigate nodes, drag to reposition, right-click for actions.</p>
          </div>
        </div>
      </main>

      <!-- Right Inspector -->
      <aside id="inspector" class="pointer-events-none absolute top-0 right-0 h-full w-[360px] md:w-[380px] translate-x-full transition-transform duration-200 ease-in-out" aria-label="Inspector panel">
        <div class="pointer-events-auto h-full flex flex-col ring-1 ring-white/10" style="background: rgba(18,18,18,0.35); backdrop-filter: blur(16px);">
          <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
            <div class="flex items-center gap-2">
              <span class="h-2.5 w-2.5 rounded-full" id="inspectorColor" style="background: var(--primary-color);"></span>
              <h2 id="inspectorTitle" class="text-lg tracking-tight font-semibold">Inspector</h2>
            </div>
            <button id="closeInspector" class="h-9 w-9 rounded-xl ring-1 ring-white/10 hover:bg-white/5" aria-label="Close inspector">
              <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto w-4.5 h-4.5 text-neutral-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 18 18 6M6 6l12 12"/></svg>
            </button>
          </div>
          <div class="flex-1 overflow-y-auto px-4 py-4 space-y-4">
            <!-- Persona -->
            <div class="rounded-xl ring-1 ring-white/10 p-4" style="background: rgba(18,18,18,0.25);">
              <button class="w-full flex items-center justify-between group" data-accordion="persona">
                <div class="flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
                  <span class="text-sm font-medium">Persona</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-neutral-400 group-data-[open=true]:rotate-180 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="mt-3 text-sm text-neutral-300 space-y-1" data-accordion-panel="persona">
                <div class="flex items-center gap-2">
                  <span class="text-neutral-400">Name:</span> <span id="inspectorPersona">—</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="text-neutral-400">Model:</span> <span id="inspectorModel">—</span>
                </div>
                <div>
                  <span class="text-neutral-400">Tags:</span>
                  <div id="inspectorTags" class="mt-1 flex flex-wrap gap-1.5"></div>
                </div>
              </div>
            </div>
            <!-- Knowledge -->
            <div class="rounded-xl ring-1 ring-white/10 p-4" style="background: rgba(18,18,18,0.25);">
              <button class="w-full flex items-center justify-between group" data-accordion="knowledge">
                <div class="flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M20 2v15"/><path d="M4 7V4a2 2 0 0 1 2-2h14"/></svg>
                  <span class="text-sm font-medium">Knowledge</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-neutral-400 group-data-[open=true]:rotate-180 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="mt-3 text-sm space-y-2" data-accordion-panel="knowledge">
                <div class="flex items-center justify-between">
                  <span class="text-neutral-300">Docs</span><span class="text-neutral-400 text-xs">3 sources</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-neutral-300">Embeddings</span><span class="text-neutral-400 text-xs">Enabled</span>
                </div>
              </div>
            </div>
            <!-- Metadata -->
            <div class="rounded-xl ring-1 ring-white/10 p-4" style="background: rgba(18,18,18,0.25);">
              <button class="w-full flex items-center justify-between group" data-accordion="metadata">
                <div class="flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m7 7 10 10M7 17 17 7"/><path d="M3 7h4v4H3zM17 17h4v4h-4z"/></svg>
                  <span class="text-sm font-medium">Metadata</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-neutral-400 group-data-[open=true]:rotate-180 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 9 6 6 6-6"/></svg>
              </button>
              <div class="mt-3 text-sm space-y-2" data-accordion-panel="metadata">
                <div class="flex items-center justify-between">
                  <span class="text-neutral-300">Created</span><span id="inspectorCreated" class="text-neutral-400 text-xs">—</span>
                </div>
                <div class="flex items-center justify-between">
                  <span class="text-neutral-300">Updated</span><span id="inspectorUpdated" class="text-neutral-400 text-xs">—</span>
                </div>
                <div>
                  <span class="text-neutral-300">Notes</span>
                  <p id="inspectorNotes" class="text-neutral-400 text-xs mt-1">—</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </aside>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    // Utilities
    const $ = (sel, root=document) => root.querySelector(sel);
    const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
    const dpr = () => (window.devicePixelRatio || 1);

    // State
    const state = {
      spaces: [],
      nodes: [], // flattened chats with layout {id, spaceId, title, persona, tags, x, y}
      connections: [], // array of [fromId, toId]
      selectedNodeId: null,
      selectedSidebarIndex: 0,
      transform: { x: 200, y: 120, k: 1 },
      drag: { active: false, nodeId: null, startX: 0, startY: 0, nodeStart: {x:0,y:0} },
      pan: { active: false, startX: 0, startY: 0, startTx: 0, startTy: 0 },
      reduced: window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
    };

    // Module
    window.initDashboard = function(containerId, data) {
      const root = document.getElementById(containerId) || document.getElementById('root');

      // Bind UI elements
      const sidebar = $('#sidebar', root);
      const spacesList = $('#spacesList', sidebar);
      const collapseAllBtn = $('#collapseAll', sidebar);

      const modelBtn = $('#modelBtn', root);
      const modelMenu = $('#modelMenu', root);
      const modelLabel = $('#modelLabel', root);

      const viewport = $('#viewport', root);
      const nodesLayer = $('#nodesLayer', root);
      const canvas = $('#connections', root);
      const preview = $('#nodePreview', root);
      const ctxMenu = $('#ctxMenu', root);
      const transcript = $('#transcript', root);

      const inspector = $('#inspector', root);
      const closeInspector = $('#closeInspector', root);

      const personaChips = $('#personaChips', root);
      const composerInput = $('#composerInput', root);
      const sendBtn = $('#sendBtn', root);
      const composerModelBtn = $('#composerModelBtn', root);
      const composerModelMenu = $('#composerModelMenu', root);
      const composerModelLabel = $('#composerModelLabel', root);

      const mobileSidebarBtn = $('#mobileSidebarBtn', root);
      const newSpaceBtn = $('#newSpaceBtn', root);

      // Build data
      state.spaces = (data.spaces || []).map((s, si) => ({
        ...s,
        open: true,
        color: pickSpaceColor(si)
      }));

      // Layout nodes in horizontal rows per space
      state.nodes = [];
      let xCursor = 0, yCursor = 0;
      const gapX = 240, gapY = 180;
      state.spaces.forEach((s, si) => {
        xCursor = 0;
        yCursor = si * gapY;
        (s.chats || []).forEach((c, ci) => {
          state.nodes.push({
            id: c.id, spaceId: s.id, title: c.title, persona: c.persona, tags: c.tags || [],
            x: xCursor, y: yCursor,
            createdAt: new Date(Date.now() - (si*3 + ci) * 3600e3).toISOString(),
            updatedAt: new Date().toISOString(),
            notes: 'Initial draft. Click to edit and manage.'
          });
          xCursor += gapX;
        });
      });

      // Simple connections: within space, sequential
      state.connections = [];
      state.spaces.forEach(s => {
        const ns = state.nodes.filter(n => n.spaceId === s.id);
        for (let i=0; i<ns.length-1; i++) {
          state.connections.push([ns[i].id, ns[i+1].id]);
        }
      });

      // Renderers
      function renderSidebar() {
        spacesList.innerHTML = '';
        const flatItems = [];
        state.spaces.forEach((space, sIdx) => {
          // Space header
          const header = document.createElement('div');
          header.className = 'group px-2 py-1.5 rounded-lg cursor-pointer';
          header.setAttribute('role', 'treeitem');
          header.setAttribute('aria-expanded', String(space.open));

          header.innerHTML = `
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="h-2.5 w-2.5 rounded-full" style="background:${space.color}"></span>
                <span class="text-sm font-medium">${escapeHtml(space.name)}</span>
              </div>
              <div class="flex items-center gap-1.5">
                <span class="text-[11px] text-neutral-400">${(space.chats || []).length}</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-neutral-400 transition-transform ${space.open ? 'rotate-180' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m6 9 6 6 6-6"/></svg>
              </div>
            </div>`;
          header.addEventListener('click', () => {
            space.open = !space.open;
            renderSidebar();
          });
          header.addEventListener('mouseenter', () => header.style.background = 'var(--hover-shade)');
          header.addEventListener('mouseleave', () => header.style.background = 'transparent');
          spacesList.appendChild(header);

          flatItems.push({ type:'space', id: space.id, el: header });

          // Chats
          const group = document.createElement('div');
          group.className = `overflow-hidden transition-all duration-200 ease-in-out ml-3`;
          group.style.height = space.open ? `${Math.max(1, (space.chats||[]).length) * 34}px` : '0px';

          (space.chats || []).forEach((chat, ci) => {
            const active = state.selectedNodeId === chat.id;
            const item = document.createElement('button');
            item.className = `w-full flex items-center justify-between px-2 py-1.5 rounded-lg text-left ${active ? '' : 'hover:bg-white/5'}`;
            item.style.borderLeft = `2px solid ${active ? 'var(--primary-color)' : 'transparent'}`;
            item.innerHTML = `
              <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 ${active ? 'text-neutral-100' : 'text-neutral-400'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M7 8h10M7 12h6"/><path d="M21 15V6a2 2 0 0 0-2-2H7l-4 4v11a2 2 0 0 0 2 2h9"/></svg>
                <span class="text-sm ${active ? 'text-neutral-100' : 'text-neutral-300'}">${escapeHtml(chat.title)}</span>
              </div>
              <span class="text-[11px] text-neutral-500">${escapeHtml(chat.persona || '')}</span>
            `;
            item.addEventListener('click', () => {
              selectNode(chat.id, { center: true, openInspector: true });
            });
            group.appendChild(item);
            flatItems.push({ type:'chat', id: chat.id, el: item });
          });

          spacesList.appendChild(group);
        });

        // Keyboard nav for sidebar list
        spacesList.onkeydown = (e) => {
          if (['ArrowUp','ArrowDown','Home','End'].includes(e.key)) e.preventDefault();
          if (e.key === 'ArrowDown') {
            state.selectedSidebarIndex = clamp(state.selectedSidebarIndex + 1, 0, flatItems.length - 1);
            flatItems[state.selectedSidebarIndex].el.focus();
          } else if (e.key === 'ArrowUp') {
            state.selectedSidebarIndex = clamp(state.selectedSidebarIndex - 1, 0, flatItems.length - 1);
            flatItems[state.selectedSidebarIndex].el.focus();
          } else if (e.key === 'Home') {
            state.selectedSidebarIndex = 0; flatItems[0]?.el.focus();
          } else if (e.key === 'End') {
            state.selectedSidebarIndex = flatItems.length - 1; flatItems.at(-1)?.el.focus();
          } else if (e.key === 'Enter') {
            const item = flatItems[state.selectedSidebarIndex];
            if (item?.type === 'chat') selectNode(item.id, { center: true, openInspector: true });
            if (item?.type === 'space') {
              const space = state.spaces.find(s => s.id === item.id);
              if (space) { space.open = !space.open; renderSidebar(); }
            }
          }
        };

        // Collapse all
        collapseAllBtn.onclick = () => {
          const anyOpen = state.spaces.some(s => s.open);
          state.spaces.forEach(s => s.open = !anyOpen);
          renderSidebar();
        };
      }

      function renderNodes() {
        nodesLayer.innerHTML = '';
        const { x:tx, y:ty, k } = state.transform;

        state.nodes.forEach(node => {
          const left = node.x * k + tx;
          const top = node.y * k + ty;

          const el = document.createElement('div');
          el.className = `absolute group`;
          el.style.left = `${left}px`;
          el.style.top = `${top}px`;
          el.style.transform = `translate(-50%,-50%)`;
          el.style.transition = state.reduced ? 'none' : 'transform 160ms ease-in-out, box-shadow 160ms ease-in-out';
          el.dataset.id = node.id;

          const active = state.selectedNodeId === node.id;
          el.innerHTML = `
            <div class="min-w-[220px] max-w-[280px] rounded-2xl p-3 ring-1 ${active ? 'ring-[color:var(--primary-color)]/60' : 'ring-white/10'}"
                 style="background: rgba(18,18,18,0.35); backdrop-filter: blur(16px); box-shadow: ${active ? '0 0 0 6px rgba(94,140,255,0.08), var(--panel-shadow)' : 'var(--panel-shadow)'};">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="h-2.5 w-2.5 rounded-full" style="background: ${spaceColor(node.spaceId)};"></span>
                  <span class="text-sm font-medium">${escapeHtml(node.title)}</span>
                </div>
                <button class="opacity-0 group-hover:opacity-100 transition inline-flex items-center justify-center h-7 w-7 rounded-lg hover:bg-white/5" aria-label="More actions">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
                </button>
              </div>
              <div class="mt-1 text-[12px] text-neutral-400 line-clamp-2">Persona: <span class="text-neutral-300">${escapeHtml(node.persona || '—')}</span></div>
              <div class="mt-2 flex flex-wrap gap-1.5">
                ${(node.tags || []).map(t => `<span class="text-[10px] px-2 py-0.5 rounded-full ring-1 ring-white/10" style="background: rgba(18,18,18,0.35);">${escapeHtml(t)}</span>`).join('')}
              </div>
            </div>
          `;

          // Hover preview
          el.addEventListener('mouseenter', (e) => {
            preview.innerHTML = `
              <div class="text-xs text-neutral-400">Preview</div>
              <div class="mt-1 text-sm text-neutral-200">${escapeHtml(node.title)}</div>
              <div class="mt-1 text-[12px] text-neutral-400">Persona: <span class="text-neutral-300">${escapeHtml(node.persona||'—')}</span></div>
            `;
            preview.style.left = `${left + 16}px`;
            preview.style.top = `${top + 16}px`;
            preview.classList.remove('hidden');
          });
          el.addEventListener('mouseleave', () => preview.classList.add('hidden'));

          // Select
          el.addEventListener('mousedown', (e) => {
            if (e.button === 2) return; // context
            selectNode(node.id, { openInspector: false });
            // Dragging
            state.drag.active = true;
            state.drag.nodeId = node.id;
            state.drag.startX = e.clientX;
            state.drag.startY = e.clientY;
            state.drag.nodeStart = { x: node.x, y: node.y };
          });

          // Context menu trigger
          el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            selectNode(node.id, {});
            showContextMenu(e.clientX, e.clientY);
          });

          nodesLayer.appendChild(el);
        });
        drawConnections();
      }

      function drawConnections() {
        resizeCanvas();
        const ctx = canvas.getContext('2d');
        const { width, height } = canvas;
        ctx.clearRect(0,0,width,height);

        ctx.save();
        // Glow style
        state.connections.forEach(([fromId, toId]) => {
          const a = state.nodes.find(n => n.id === fromId);
          const b = state.nodes.find(n => n.id === toId);
          if (!a || !b) return;
          const ax = a.x * state.transform.k + state.transform.x;
          const ay = a.y * state.transform.k + state.transform.y;
          const bx = b.x * state.transform.k + state.transform.x;
          const by = b.y * state.transform.k + state.transform.y;

          // Soft curve
          const mx = (ax + bx) / 2;
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.bezierCurveTo(mx, ay, mx, by, bx, by);

          // Outer glow
          ctx.strokeStyle = 'rgba(94,140,255,0.18)';
          ctx.lineWidth = 10 * dpr();
          ctx.lineCap = 'round';
          ctx.stroke();

          // Inner bright
          ctx.strokeStyle = 'rgba(98,204,255,0.6)';
          ctx.lineWidth = 2.2 * dpr();
          ctx.stroke();

          // Animated dash (subtle)
          ctx.setLineDash([8 * dpr(), 12 * dpr()]);
          ctx.lineDashOffset = (Date.now() / 40) % (20 * dpr());
          ctx.strokeStyle = 'rgba(94,140,255,0.35)';
          ctx.lineWidth = 1.2 * dpr();
          ctx.stroke();
          ctx.setLineDash([]);
        });
        ctx.restore();
      }

      function resizeCanvas() {
        const rect = viewport.getBoundingClientRect();
        canvas.width = rect.width * dpr();
        canvas.height = rect.height * dpr();
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
      }

      function selectNode(id, { center=false, openInspector=false } = {}) {
        state.selectedNodeId = id;
        renderSidebar();
        renderNodes();
        if (center) centerOnNode(id);
        if (openInspector) openInspectorFor(id);
      }

      function centerOnNode(id) {
        const n = state.nodes.find(nn => nn.id === id);
        if (!n) return;
        const rect = viewport.getBoundingClientRect();
        const cx = rect.width / 2, cy = rect.height / 2;
        state.transform.x = cx - n.x * state.transform.k;
        state.transform.y = cy - n.y * state.transform.k;
        renderNodes();
      }

      function openInspectorFor(id) {
        const n = state.nodes.find(nn => nn.id === id);
        if (!n) return;
        // Fill inspector
        $('#inspectorTitle').textContent = n.title;
        $('#inspectorPersona').textContent = n.persona || '—';
        $('#inspectorModel').textContent = modelLabel.textContent || '—';
        const tagsEl = $('#inspectorTags');
        tagsEl.innerHTML = (n.tags || []).map(t => `<span class="text-[11px] px-2 py-0.5 rounded-full ring-1 ring-white/10" style="background: rgba(18,18,18,0.35);">${escapeHtml(t)}</span>`).join('');
        $('#inspectorCreated').textContent = new Date(n.createdAt).toLocaleString();
        $('#inspectorUpdated').textContent = new Date(n.updatedAt).toLocaleString();
        $('#inspectorNotes').textContent = n.notes || '—';
        $('#inspectorColor').style.background = spaceColor(n.spaceId);

        inspector.classList.remove('translate-x-full');
      }

      // Colors
      function pickSpaceColor(i) {
        const palette = ['#5E8CFF','#FF8356','#C96BFF','#62CCFF','#00C2A8','#FF66A3'];
        return palette[i % palette.length];
      }
      function spaceColor(spaceId) {
        const idx = state.spaces.findIndex(s => s.id === spaceId);
        return pickSpaceColor(idx < 0 ? 0 : idx);
      }

      // Context menu
      function showContextMenu(x, y) {
        ctxMenu.style.left = `${x}px`;
        ctxMenu.style.top = `${y}px`;
        ctxMenu.classList.remove('hidden');
      }
      function hideContextMenu() {
        ctxMenu.classList.add('hidden');
      }
      ctxMenu.addEventListener('click', (e) => {
        const action = e.target.closest('button')?.dataset?.action;
        const id = state.selectedNodeId;
        const n = state.nodes.find(nn => nn.id === id);
        hideContextMenu();
        if (!n) return;
        if (action === 'delete') {
          state.nodes = state.nodes.filter(nn => nn.id !== id);
          state.connections = state.connections.filter(([a,b]) => a !== id && b !== id);
          renderNodes();
        } else if (action === 'duplicate') {
          const clone = { ...n, id: genId(), x: n.x + 60, y: n.y + 60, title: n.title + ' (copy)' };
          state.nodes.push(clone);
          // Link after original
          state.connections.push([n.id, clone.id]);
          renderNodes();
        } else if (action === 'move') {
          // Move to next space
          const sIndex = state.spaces.findIndex(s => s.id === n.spaceId);
          const next = state.spaces[(sIndex + 1) % state.spaces.length];
          n.spaceId = next.id;
          n.y = (state.spaces.findIndex(s => s.id === next.id)) * 180;
          rebuildConnections();
          renderNodes();
        }
      });

      function rebuildConnections() {
        state.connections = [];
        state.spaces.forEach(s => {
          const ns = state.nodes.filter(n => n.spaceId === s.id).sort((a,b) => a.x - b.x);
          for (let i=0; i<ns.length-1; i++) state.connections.push([ns[i].id, ns[i+1].id]);
        });
      }

      // Global interactions
      document.addEventListener('click', (e) => {
        if (!ctxMenu.contains(e.target)) hideContextMenu();
      });

      viewport.addEventListener('mousedown', (e) => {
        // If not on node element
        const targetNode = e.target.closest('[data-id]');
        if (!targetNode && e.button === 0) {
          state.pan.active = true;
          state.pan.startX = e.clientX;
          state.pan.startY = e.clientY;
          state.pan.startTx = state.transform.x;
          state.pan.startTy = state.transform.y;
        }
      });
      window.addEventListener('mousemove', (e) => {
        // Drag node
        if (state.drag.active && state.drag.nodeId) {
          const n = state.nodes.find(nn => nn.id === state.drag.nodeId);
          if (!n) return;
          const dx = (e.clientX - state.drag.startX) / state.transform.k;
          const dy = (e.clientY - state.drag.startY) / state.transform.k;
          n.x = state.drag.nodeStart.x + dx;
          n.y = state.drag.nodeStart.y + dy;
          n.updatedAt = new Date().toISOString();
          renderNodes();
        }
        // Pan
        if (state.pan.active) {
          const dx = e.clientX - state.pan.startX;
          const dy = e.clientY - state.pan.startY;
          state.transform.x = state.pan.startTx + dx;
          state.transform.y = state.pan.startTy + dy;
          renderNodes();
        }
      });
      window.addEventListener('mouseup', () => {
        state.drag.active = false; state.drag.nodeId = null;
        state.pan.active = false;
      });

      // Zoom
      viewport.addEventListener('wheel', (e) => {
        const zooming = e.ctrlKey || e.metaKey || e.deltaY % 1 !== 0;
        if (!zooming) return;
        e.preventDefault();
        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        const oldK = state.transform.k;
        const delta = -e.deltaY * 0.0015;
        const newK = clamp(oldK * (1 + delta), 0.5, 1.8);
        // Zoom towards mouse
        state.transform.x = mouseX - (mouseX - state.transform.x) * (newK / oldK);
        state.transform.y = mouseY - (mouseY - state.transform.y) * (newK / oldK);
        state.transform.k = newK;
        renderNodes();
      }, { passive: false });

      // Arrow keys on canvas
      viewport.addEventListener('keydown', (e) => {
        if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter'].includes(e.key)) e.preventDefault();
        const nodes = state.nodes;
        const idx = nodes.findIndex(n => n.id === state.selectedNodeId);
        if (e.key === 'ArrowRight') {
          const next = nodes[(idx + 1 + nodes.length) % nodes.length];
          if (next) selectNode(next.id, {});
        } else if (e.key === 'ArrowLeft') {
          const prev = nodes[(idx - 1 + nodes.length) % nodes.length];
          if (prev) selectNode(prev.id, {});
        } else if (e.key === 'ArrowUp') {
          state.transform.y += 40;
          renderNodes();
        } else if (e.key === 'ArrowDown') {
          state.transform.y -= 40;
          renderNodes();
        } else if (e.key === 'Enter') {
          if (state.selectedNodeId) openInspectorFor(state.selectedNodeId);
        }
      });

      // Inspector controls
      closeInspector.addEventListener('click', () => {
        inspector.classList.add('translate-x-full');
      });
      // Accordion
      $$('[data-accordion]', inspector).forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-accordion');
          const panel = inspector.querySelector(`[data-accordion-panel="${key}"]`);
          const open = btn.getAttribute('data-open') === 'true';
          btn.setAttribute('data-open', String(!open));
          if (panel) panel.classList.toggle('hidden', open);
        });
      });

      // Toolbar menus
      modelBtn.addEventListener('click', () => {
        modelMenu.classList.toggle('hidden');
        modelBtn.setAttribute('aria-expanded', String(!modelMenu.classList.contains('hidden')));
      });
      modelMenu.addEventListener('click', (e) => {
        const val = e.target.closest('[role="option"]')?.dataset?.value;
        if (!val) return;
        modelLabel.textContent = val;
        modelMenu.classList.add('hidden');
        modelBtn.setAttribute('aria-expanded', 'false');
        // Update inspector model if open on selection
        if (state.selectedNodeId) $('#inspectorModel').textContent = val;
      });
      document.addEventListener('click', (e) => {
        if (!modelMenu.contains(e.target) && !modelBtn.contains(e.target)) modelMenu.classList.add('hidden');
        if (!composerModelMenu.contains(e.target) && !composerModelBtn.contains(e.target)) composerModelMenu.classList.add('hidden');
      });

      // Composer model
      composerModelBtn.addEventListener('click', () => {
        composerModelMenu.classList.toggle('hidden');
        composerModelBtn.setAttribute('aria-expanded', String(!composerModelMenu.classList.contains('hidden')));
      });
      composerModelMenu.addEventListener('click', (e) => {
        const val = e.target.closest('[role="option"]')?.dataset?.value;
        if (!val) return;
        composerModelLabel.textContent = val;
        composerModelMenu.classList.add('hidden');
        composerModelBtn.setAttribute('aria-expanded', 'false');
      });

      // Personas (from data)
      const personas = Array.from(new Set(state.nodes.map(n => n.persona || 'General'))).slice(0, 6);
      personaChips.innerHTML = personas.map((p, i) => `
        <button data-persona="${escapeHtml(p)}" class="px-2.5 py-1.5 rounded-lg text-[12px] ring-1 ring-white/10 hover:bg-white/5 ${i===0 ? 'bg-white/5' : ''}">${escapeHtml(p)}</button>
      `).join('');
      personaChips.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-persona]');
        if (!btn) return;
        $$('#personaChips button').forEach(b => b.classList.remove('bg-white/5'));
        btn.classList.add('bg-white/5');
      });

      // Composer behavior
      composerInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          triggerSend();
        }
      });
      sendBtn.addEventListener('click', triggerSend);

      function triggerSend() {
        const text = composerInput.value.trim();
        if (!text) return;
        appendMessage('user', text);
        composerInput.value = '';
        simulateStream("Here's a thoughtful response synthesizing your intent, available sources, and model selection for this conversation.");
      }

      function appendMessage(role, text, streaming=false) {
        const wrap = document.createElement('div');
        wrap.className = `max-w-2xl ${role==='user' ? 'ml-auto' : ''}`;
        const bubble = document.createElement('div');
        bubble.className = `px-3 py-2 rounded-xl ring-1 ring-white/10 ${role==='user' ? '' : ''}`;
        bubble.style.background = role==='user' ? 'rgba(94,140,255,0.15)' : 'rgba(18,18,18,0.45)';
        bubble.innerHTML = `<div class="text-[13px] leading-relaxed">${escapeHtml(text)}</div>`;
        if (streaming) {
          const shimmer = document.createElement('div');
          shimmer.className = 'absolute inset-0 rounded-xl pointer-events-none';
          shimmer.style.background = 'linear-gradient(100deg, transparent, rgba(255,255,255,0.06), transparent)';
          shimmer.style.animation = state.reduced ? 'none' : 'shimmer 1.6s linear infinite';
          bubble.style.position = 'relative';
          bubble.appendChild(shimmer);
        }
        wrap.appendChild(bubble);
        transcript.appendChild(wrap);
        transcript.scrollTop = transcript.scrollHeight;
      }

      // Shimmer keyframes injection (inline style tag not allowed; use Web Animations)
      // Fallback: Use JS-driven animation on shimmer nodes
      function animateShimmer() {
        $$('#transcript [style*="linear-gradient"]', root).forEach(el => {
          el.animate([
            { transform: 'translateX(-120%)' },
            { transform: 'translateX(120%)' }
          ], {
            duration: 1600,
            iterations: Infinity,
            easing: 'linear'
          });
        });
      }

      function simulateStream(fullText) {
        const id = 'stream-' + Math.random().toString(36).slice(2);
        const wrap = document.createElement('div');
        wrap.className = 'max-w-2xl';
        const bubble = document.createElement('div');
        bubble.className = 'px-3 py-2 rounded-xl ring-1 ring-white/10';
        bubble.style.background = 'rgba(18,18,18,0.45)';
        bubble.innerHTML = `<div id="${id}" class="text-[13px] leading-relaxed"></div>`;
        const shimmer = document.createElement('div');
        shimmer.className = 'absolute inset-0 rounded-xl pointer-events-none';
        shimmer.style.background = 'linear-gradient(100deg, transparent, rgba(255,255,255,0.06), transparent)';
        bubble.style.position = 'relative';
        bubble.appendChild(shimmer);
        wrap.appendChild(bubble);
        transcript.appendChild(wrap);
        transcript.scrollTop = transcript.scrollHeight;

        if (!state.reduced) animateShimmer();

        let idx = 0;
        const el = document.getElementById(id);
        const timer = setInterval(() => {
          el.textContent = fullText.slice(0, idx += Math.max(1, Math.round(fullText.length/80)));
          transcript.scrollTop = transcript.scrollHeight;
          if (idx >= fullText.length) {
            clearInterval(timer);
            shimmer.remove();
          }
        }, 24);
      }

      // Mobile sidebar toggle
      mobileSidebarBtn?.addEventListener('click', () => {
        const open = sidebar.classList.contains('hidden');
        sidebar.classList.toggle('hidden');
      });

      newSpaceBtn?.addEventListener('click', () => {
        const id = 's' + Math.random().toString(36).slice(2,6);
        state.spaces.push({ id, name: 'New Space', chats: [], open: true, color: pickSpaceColor(state.spaces.length) });
        renderSidebar();
      });

      // Global search (filter sidebar items by title)
      $('#globalSearch', root)?.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        $$('#spacesList [role="treeitem"], #spacesList button').forEach(el => {
          const text = el.textContent.toLowerCase();
          el.style.opacity = q && !text.includes(q) ? '0.35' : '1';
        });
      });

      // Resize + loop
      window.addEventListener('resize', () => { resizeCanvas(); renderNodes(); });
      // Animation loop for connection dashes
      function tick() {
        drawConnections();
        requestAnimationFrame(tick);
      }
      tick();

      // Initial render
      renderSidebar();
      resizeCanvas();
      renderNodes();

      // Default select first node
      if (state.nodes[0]) selectNode(state.nodes[0].id, { center: true });

      // Ensure lucide stroke width consistency
      if (window.lucide) {
        window.lucide.createIcons();
        document.querySelectorAll('svg.lucide').forEach(s => s.setAttribute('stroke-width', '1.5'));
      }
    };

    function genId() { return Math.random().toString(36).slice(2,8); }
    function escapeHtml(str='') {
      return str.replace(/[&<>"']/g, m => ({        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[m]);
    }

    // Demo bootstrap with example data
    document.addEventListener('DOMContentLoaded', () => {
      const demo = {
        spaces: [
          {
            id: 'space-01',
            name: 'Product Strategy',
            chats: [

      // Cmd/Ctrl+K focuses global search
      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          const search = document.getElementById('globalSearch');
          if (search) { search.focus(); search.select(); }
        }
        if (e.key === 'Escape') {
          // Close menus, inspector and context menu
          document.getElementById('modelMenu')?.classList.add('hidden');
          document.getElementById('composerModelMenu')?.classList.add('hidden');
          document.getElementById('ctxMenu')?.classList.add('hidden');
          document.getElementById('inspector')?.classList.add('translate-x-full');
        }
      });

      // Auto-resize composer textarea
      const ta = document.getElementById('composerInput');
      if (ta) {
        const fit = () => {
          ta.style.height = '0px';
          ta.style.height = Math.min(140, ta.scrollHeight) + 'px';
        };
        ta.addEventListener('input', fit);
        // Submit on Enter without Shift handled in init; keep height synced initially
        fit();
      }
