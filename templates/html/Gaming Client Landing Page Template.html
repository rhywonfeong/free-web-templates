<!DOCTYPE html>
<html lang="en" class="bg-[#0a0a0a] text-white selection:bg-green-500/30 scroll-smooth">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krypton - Minecraft Client</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body {
font-family: 'Inter', sans-serif;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="relative min-h-screen overflow-x-hidden antialiased">
    <!-- Background Glow Effects -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute top-[-10%] left-1/2 -translate-x-1/2 w-[600px] h-[400px] bg-green-500/10 blur-[120px] rounded-full"></div>
        <div class="absolute top-[40%] left-[-10%] w-[500px] h-[500px] bg-green-500/5 blur-[150px] rounded-full"></div>
    </div>

    <!-- Main Container -->
    <main class="relative z-10 w-full">
        <!-- Hero Section -->
        <section class="flex flex-col items-center justify-center pt-32 pb-20 px-6 text-center">
            <!-- Logo -->
            <div class="w-16 h-16 bg-green-500 rounded-2xl flex items-center justify-center text-black font-semibold text-2xl shadow-[0_0_40px_rgba(34,197,94,0.4)] mb-8">
                Kr
            </div>

            <!-- Title -->
            <h1 class="text-7xl md:text-8xl font-semibold tracking-tight text-green-500 drop-shadow-[0_0_25px_rgba(34,197,94,0.5)] mb-6">
                Krypton
            </h1>

            <!-- Subtitles -->
            <h2 class="text-xl md:text-2xl text-neutral-200 mb-3 font-medium tracking-tight">
                The Number <span class="text-green-500">#1 Best</span> Client For Donut SMP
            </h2>
            <p class="text-lg text-neutral-400 mb-10">
                Previously Paid - <span class="text-green-500">Now Free</span>
            </p>
        </section>

        <!-- Content Section -->
        <section class="max-w-7xl mx-auto px-6 py-16 grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
            <!-- Left Column: Text & Actions -->
            <div class="flex flex-col">
                <h3 class="text-4xl md:text-5xl font-semibold tracking-tight text-white mb-6 leading-tight">
                    Unleash The <span class="text-green-500">Full</span> Potential
                </h3>
                
                <p class="text-lg text-neutral-400 mb-10 leading-relaxed">
                    Experience the power that was once behind a paywall - now available to everyone for free.
                </p>

                <!-- Primary Download Link -->
                <a href="krypton-client.jar" download="krypton-client.jar" class="w-full flex items-center justify-center gap-2 bg-green-500 hover:bg-green-400 text-black text-lg font-semibold px-6 py-4 rounded-xl transition-colors mb-10">
                    <i data-lucide="download" class="w-6 h-6" stroke-width="1.5"></i>
                    Download Updated Client Jar (06/04/2026)
                </a>

                <!-- Features Badges -->
                <div class="flex flex-wrap items-center gap-6">
                    <div class="flex items-center gap-2 text-green-500">
                        <i data-lucide="check-circle-2" class="w-5 h-5" stroke-width="1.5"></i>
                        <span class="text-sm font-medium">Official</span>
                    </div>
                    <div class="flex items-center gap-2 text-yellow-500">
                        <i data-lucide="shield-check" class="w-5 h-5" stroke-width="1.5"></i>
                        <span class="text-sm font-medium">Virus Free</span>
                    </div>
                    <div class="flex items-center gap-2 text-orange-500">
                        <i data-lucide="code-2" class="w-5 h-5" stroke-width="1.5"></i>
                        <span class="text-sm font-medium">Open Source</span>
                    </div>
                </div>
            </div>

            <!-- Right Column: UI Image Preview -->
            <div class="relative rounded-2xl border border-neutral-800 bg-neutral-900/50 p-2 shadow-2xl backdrop-blur-sm">
                <img 
                    src="https://images.unsplash.com/photo-1629654297299-c8506221ca97?auto=format&fit=crop&q=80&w=1200" 
                    alt="Client Interface Preview" 
                    class="w-full h-auto rounded-xl opacity-80 mix-blend-luminosity hover:mix-blend-normal hover:opacity-100 transition-all duration-500"
                >
            </div>
        </section>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
