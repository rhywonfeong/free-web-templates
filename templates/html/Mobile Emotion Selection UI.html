<style>
html,body{font-family:'Inter',sans-serif}
/* Custom range slider */
input[type=range]{-webkit-appearance:none;width:100%;background:transparent;height:20px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;height:32px;width:32px;border-radius:50%;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,0.12), 0 3px 6px rgba(0,0,0,0.08);cursor:pointer;border:2px solid #f1f5f9;margin-top:-8px;transition:all 0.2s ease}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.1);box-shadow:0 8px 20px rgba(0,0,0,0.16), 0 4px 8px rgba(0,0,0,0.12)}
input[type=range]::-moz-range-thumb{height:32px;width:32px;border-radius:50%;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,0.12);cursor:pointer;border:2px solid #f1f5f9;transition:all 0.2s ease}
input[type=range]::-webkit-slider-runnable-track{height:16px;border-radius:8px;border:1px solid rgba(0,0,0,0.06)}
input[type=range]::-moz-range-track{height:16px;border-radius:8px;border:1px solid rgba(0,0,0,0.06)}
@keyframes fadeInUp {
from { opacity: 0; transform: translateY(20px); }
to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
from { opacity: 0; }
to { opacity: 1; }
}
@keyframes scaleIn {
from { opacity: 0; transform: scale(0.9); }
to { opacity: 1; transform: scale(1); }
}
@keyframes ripple {
0% { transform: scale(0.8); opacity: 0.8; }
50% { transform: scale(1.05); opacity: 0.4; }
100% { transform: scale(1); opacity: 0.6; }
}
.animate-fade-in-up { animation: fadeInUp 0.6s ease-out; }
.animate-fade-in { animation: fadeIn 0.8s ease-out; }
.animate-scale-in { animation: scaleIn 0.7s ease-out; }
.animate-ripple { animation: ripple 2s ease-in-out infinite; }
</style>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center p-4"><div class="fixed top-0 w-full h-screen bg-cover bg-center z-[-1]" style="background-image: url(&quot;https://images.unsplash.com/photo-1687392946857-96c2b7f94b0d?w=3840&amp;q=80&quot;);"></div>
  
  <!-- iPhone Frame -->
  <div class="relative animate-scale-in" style="animation-delay: 0.2s;">
    <!-- Phone Body -->
    <div class="relative w-[375px] h-[812px] bg-gradient-to-b from-slate-900 to-black rounded-[55px] p-[8px] shadow-2xl">
      <!-- Inner bezel -->
      <div class="w-full h-full bg-gradient-to-b from-slate-100 to-white rounded-[47px] overflow-hidden relative shadow-inner">
        <!-- Dynamic Island -->
        <div class="absolute top-3 left-1/2 transform -translate-x-1/2 w-32 h-7 bg-black rounded-full z-50 flex items-center justify-center">
          <div class="flex items-center gap-2">
            <div class="w-1.5 h-1.5 bg-slate-600 rounded-full"></div>
            <div class="w-3 h-3 bg-slate-700 rounded-full"></div>
          </div>
        </div>
        
        <!-- Home Indicator -->
        <div class="absolute bottom-2 left-1/2 transform -translate-x-1/2 w-32 h-1 bg-black rounded-full opacity-60"></div>
        
        <!-- App Content -->
        <div class="w-full h-full bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 flex flex-col pt-12 pb-8">
          
          <!-- Header -->
          <header class="flex items-center justify-between px-6 pt-4 pb-3 animate-fade-in" style="animation-delay: 0.4s;">
            <button class="p-2.5 rounded-xl bg-white/60 backdrop-blur-sm hover:bg-white/80 transition-all duration-200 hover:scale-105 border border-white/20 shadow-sm">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="menu" class="lucide lucide-menu w-4 h-4 text-slate-600"><path d="M4 12h16"></path><path d="M4 18h16"></path><path d="M4 6h16"></path></svg>
            </button>
            <div class="text-center">
              <h1 class="text-xl font-semibold text-slate-800 tracking-tight">Emotion</h1>
              <div class="w-10 h-0.5 bg-gradient-to-r from-orange-400 to-purple-500 rounded-full mx-auto mt-0.5"></div>
            </div>
            <button class="p-2.5 rounded-xl bg-white/60 backdrop-blur-sm hover:bg-white/80 transition-all duration-200 hover:scale-105 border border-white/20 shadow-sm">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="more-horizontal" class="lucide lucide-more-horizontal w-4 h-4 text-slate-600"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
            </button>
          </header>

          <!-- Subtitle -->
          <div class="px-6 text-center animate-fade-in-up" style="animation-delay: 0.6s;">
            <p class="leading-relaxed text-base font-medium text-slate-600">Select your current emotional state</p>
          </div>

          <!-- Emotion Visualization -->
          <div class="flex-1 flex animate-scale-in pr-6 pl-6 items-center justify-center" style="animation-delay: 0.8s;">
            <div class="relative">
              <!-- Outer ripple rings -->
              <div class="absolute rounded-full animate-ripple bg-slate-300/30 inset-0" style="animation-delay: 0s;" id="ripple1"></div>
              <div class="absolute rounded-full animate-ripple bg-slate-300/30 inset-3" style="animation-delay: 0.5s;" id="ripple2"></div>
              <div class="absolute rounded-full animate-ripple bg-slate-300/30 inset-6" style="animation-delay: 1s;" id="ripple3"></div>
              
              <!-- Main circle -->
              <div class="w-64 h-64 rounded-full bg-gradient-to-br from-white/80 to-white/40 backdrop-blur-sm shadow-2xl border border-white/30 relative overflow-hidden">
                <!-- Inner glow effect -->
                <div class="absolute inset-3 rounded-full bg-gradient-to-br from-white/60 to-transparent"></div>
                
                <!-- Center dot -->
                <div class="absolute inset-0 flex items-center justify-center">
                  <div id="centerDot" class="w-16 h-16 rounded-full bg-gradient-to-br from-slate-300 to-slate-400 shadow-lg transition-all duration-700 ease-out flex items-center justify-center">
                    <div class="w-6 h-6 rounded-full bg-white/80 shadow-inner"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Controls Section -->
          <section class="px-6 pb-4 space-y-6">
            <!-- Emotion Label -->
            <div class="text-center animate-fade-in-up" style="animation-delay: 1s;">
              <h2 id="emotionLabel" class="text-2xl font-semibold text-slate-800 tracking-tight transition-all duration-500">Neutral</h2>
              <p id="emotionDescription" class="text-sm font-medium text-slate-500 mt-1 transition-all duration-500">Finding your balance</p>
            </div>

            <!-- Slider -->
            <div class="space-y-3 animate-fade-in-up" style="animation-delay: 1.2s;">
              <div class="relative">
                <input id="emotionRange" type="range" min="-50" max="50" value="0" class="focus:outline-none w-full cursor-pointer" style="background:linear-gradient(90deg,#fb923c 0%,#a855f7 50%,#cbd5e1 50%)">
                
                <!-- Range labels -->
                <div class="flex justify-between text-xs font-semibold text-slate-400 mt-2 px-1">
                  <span class="flex items-center gap-1">
                    <div class="w-1.5 h-1.5 rounded-full bg-orange-400"></div>
                    UNPLEASANT
                  </span>
                  <span class="flex items-center gap-1">
                    PLEASANT
                    <div class="w-1.5 h-1.5 rounded-full bg-purple-500"></div>
                  </span>
                </div>
              </div>
            </div>

            <!-- Action Button -->
            <div class="animate-fade-in-up" style="animation-delay: 1.4s;">
              <button id="nextButton" class="w-full py-3.5 px-6 rounded-xl text-base font-semibold text-white bg-gradient-to-r from-slate-600 to-slate-700 shadow-xl hover:shadow-2xl hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 border border-white/20">
                <span class="flex items-center justify-center gap-2">
                  Continue
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="arrow-right" class="lucide lucide-arrow-right w-4 h-4"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
                </span>
              </button>
            </div>
          </section>
        </div>
      </div>
    </div>
    
    <!-- Reflection/Shadow -->
    <div class="absolute -bottom-2 left-4 right-4 h-8 bg-gradient-to-b from-black/20 to-transparent rounded-full blur-xl"></div>
  </div>

  <script>
    lucide.createIcons();
    
    const range = document.getElementById('emotionRange');
    const label = document.getElementById('emotionLabel');
    const description = document.getElementById('emotionDescription');
    const centerDot = document.getElementById('centerDot');
    const nextButton = document.getElementById('nextButton');
    const ripple1 = document.getElementById('ripple1');
    const ripple2 = document.getElementById('ripple2');
    const ripple3 = document.getElementById('ripple3');
    
    const emotions = {
      'Very Unpleasant': { color: 'from-red-400 to-orange-500', desc: 'Feeling quite distressed', button: 'from-red-500 to-orange-600', ripple: 'bg-red-300/30' },
      'Unpleasant': { color: 'from-orange-400 to-yellow-500', desc: 'Experiencing some discomfort', button: 'from-orange-500 to-yellow-600', ripple: 'bg-orange-300/30' },
      'Neutral': { color: 'from-slate-300 to-slate-400', desc: 'Finding your balance', button: 'from-slate-600 to-slate-700', ripple: 'bg-slate-300/30' },
      'Pleasant': { color: 'from-blue-400 to-purple-500', desc: 'Feeling good and positive', button: 'from-blue-600 to-purple-700', ripple: 'bg-blue-300/30' },
      'Very Pleasant': { color: 'from-purple-500 to-pink-500', desc: 'Experiencing great joy', button: 'from-purple-600 to-pink-700', ripple: 'bg-purple-300/30' }
    };

    function updateUI() {
      const value = Number(range.value);
      const perc = (value + 50) / 100 * 100;
      
      // Update slider track
      range.style.background = `linear-gradient(90deg,#fb923c 0%,#a855f7 ${perc}%,#cbd5e1 ${perc}%)`;
      
      // Determine emotion
      let emotionKey = 'Neutral';
      if (value < -30) emotionKey = 'Very Unpleasant';
      else if (value < -10) emotionKey = 'Unpleasant';
      else if (value > 30) emotionKey = 'Very Pleasant';
      else if (value > 10) emotionKey = 'Pleasant';
      
      const emotion = emotions[emotionKey];
      
      // Update text
      label.textContent = emotionKey;
      description.textContent = emotion.desc;
      
      // Update center dot
      centerDot.className = `w-16 h-16 rounded-full bg-gradient-to-br ${emotion.color} shadow-lg transition-all duration-700 ease-out flex items-center justify-center`;
      
      // Update button
      nextButton.className = `w-full py-3.5 px-6 rounded-xl text-base font-semibold text-white bg-gradient-to-r ${emotion.button} shadow-xl hover:shadow-2xl hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 border border-white/20`;
      
      // Update ripples
      [ripple1, ripple2, ripple3].forEach(ripple => {
        ripple.className = `absolute rounded-full animate-ripple ${emotion.ripple}`;
      });
      ripple1.className += ' inset-0';
      ripple2.className += ' inset-3';
      ripple3.className += ' inset-6';
    }

    range.addEventListener('input', updateUI);
    nextButton.addEventListener('click', () => {
      // Add click feedback
      nextButton.style.transform = 'scale(0.95)';
      setTimeout(() => {
        nextButton.style.transform = '';
      }, 150);
    });

    // Initialize
    updateUI();
  </script>

</body></html>
