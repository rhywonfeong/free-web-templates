<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<title>Torch-Reveal Hero</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-neutral-950 text-neutral-50 flex items-center justify-center font-[Inter] overflow-hidden">
  <!-- Hero Banner -->
  <section id="hero" class="relative w-full h-[90vh] flex items-center justify-center overflow-hidden">
    <!-- Background Image -->
    <img src="https://images.unsplash.com/photo-1520880867055-1e30d1cb001c?auto=format&fit=crop&w=1950&q=80"
         alt="Background" 
         class="absolute inset-0 h-full w-full object-cover pointer-events-none opacity-80 animate-[fade-in_1s_ease-out]">
    
    <!-- Dark Mask / Torch Layer -->
    <div id="mask" class="pointer-events-none absolute inset-0 transition-opacity duration-300"
         style="background: radial-gradient(circle 15vmax at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.1) 45%, rgba(0,0,0,0.85) 60%);">
    </div>

    <!-- Logo -->
    <div class="relative z-10 flex flex-col items-center gap-6">
      <div class="w-24 h-24 rounded-full bg-neutral-900/80 backdrop-blur-md flex items-center justify-center border border-neutral-700/60 animate-[slide-in_0.8s_0.2s_both]">
        <!-- Example logo using Lucide icon -->
        <i data-lucide="aperture" class="w-12 h-12 stroke-neutral-50"></i>
      </div>
      <h1 class="text-4xl md:text-5xl lg:text-6xl font-semibold tracking-tight animate-[slide-in_0.9s_0.3s_both]">
        Night&nbsp;Vision
      </h1>
      <p class="max-w-lg text-center text-neutral-400 animate-[fade-in_1.2s_0.4s_both]">
        Explore how focused attention reveals hidden details. Move your cursor to illuminate the path.
      </p>
    </div>
  </section>

  <!-- Animations -->
  <style>
    @keyframes fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>

  <!-- Torch Effect Script -->
  <script>
    lucide.createIcons({ strokeWidth: 1.5 });

    const hero  = document.getElementById('hero');
    const mask  = document.getElementById('mask');

    hero.addEventListener('pointermove', e => updateMask(e));
    hero.addEventListener('pointerdown',  e => updateMask(e));

    function updateMask(e) {
      const rect = hero.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      mask.style.background = `radial-gradient(circle 15vmax at ${x}px ${y}px, rgba(0,0,0,0) 0%, rgba(0,0,0,0.1) 45%, rgba(0,0,0,0.85) 60%)`;
    }

    // Reset torch to center on leave
    hero.addEventListener('pointerleave', () => {
      mask.style.transition = 'background 0.6s ease';
      mask.style.background = 'radial-gradient(circle 15vmax at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.1) 45%, rgba(0,0,0,0.85) 60%)';
      setTimeout(()=>mask.style.transition='', 600);
    });
  </script>
</body>
</html>
