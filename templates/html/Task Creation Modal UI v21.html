<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Add Task - AuditPro</title>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <!-- Modal Container -->
  <div class="bg-white rounded-xl shadow-lg w-full max-w-2xl">
    <!-- Modal Header -->
    <div class="border-b px-6 py-4 flex items-center justify-between">
      <h2 class="text-xl font-bold text-gray-900">Add New Task</h2>
      <button class="text-gray-400 hover:text-gray-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    
    <!-- Modal Body -->
    <div class="p-6">
      <form>
        <!-- Task Details Section -->
        <div class="space-y-4 mb-8">
          <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-2">Task Details</h3>
          
          <div>
            <label for="task-name" class="block text-sm font-medium text-gray-700 mb-1">Task Name</label>
            <input type="text" id="task-name" name="task-name" 
                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  placeholder="Enter task name...">
          </div>
          
          <div>
            <label for="task-description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea id="task-description" name="task-description" rows="3"
                     class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                     placeholder="Enter task details..."></textarea>
          </div>
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="website" class="block text-sm font-medium text-gray-700 mb-1">Website</label>
              <div class="relative">
                <select id="website" name="website"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none">
                  <option value="" selected disabled>Select website</option>
                  <option value="example.com">example.com</option>
                  <option value="myshop.io">myshop.io</option>
                  <option value="widgetco.com">widgetco.com</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                  <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                  </svg>
                </div>
              </div>
            </div>
            
            <div>
              <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
              <div class="relative">
                <select id="category" name="category"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none">
                  <option value="" selected disabled>Select category</option>
                  <option value="SEO">SEO</option>
                  <option value="Performance">Performance</option>
                  <option value="Content">Content</option>
                  <option value="Accessibility">Accessibility</option>
                  <option value="Security">Security</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                  <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                  </svg>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Scheduling Section -->
        <div class="space-y-4 mb-8">
          <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-2">Scheduling</h3>
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="priority" class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
              <div class="relative">
                <select id="priority" name="priority"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none">
                  <option value="" selected disabled>Select priority</option>
                  <option value="high" class="text-red-600">High</option>
                  <option value="medium" class="text-yellow-600">Medium</option>
                  <option value="low" class="text-green-600">Low</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                  <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                  </svg>
                </div>
              </div>
            </div>
            
            <div>
              <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
              <div class="relative">
                <select id="status" name="status"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none">
                  <option value="todo" selected>To Do</option>
                  <option value="in-progress">In Progress</option>
                  <option value="review">Review</option>
                  <option value="completed">Completed</option>
                </select>
                <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                  <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                  </svg>
                </div>
              </div>
            </div>
          </div>
          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label for="due-date" class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
              <input type="date" id="due-date" name="due-date"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            
            <div>
              <label for="estimated-time" class="block text-sm font-medium text-gray-700 mb-1">Estimated Time (hours)</label>
              <input type="number" id="estimated-time" name="estimated-time" min="0" step="0.5"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="0.0">
            </div>
          </div>
        </div>
        
        <!-- Assignment Section -->
        <div class="space-y-4 mb-8">
          <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-2">Assignment</h3>
          
          <div>
            <label for="assignee" class="block text-sm font-medium text-gray-700 mb-1">Assigned To</label>
            <div class="relative">
              <select id="assignee" name="assignee"
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none">
                <option value="" selected disabled>Select team member</option>
                <option value="prince">Prince Reuben</option>
                <option value="john">John Doe</option>
                <option value="jane">Jane Smith</option>
              </select>
              <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </div>
            </div>
          </div>
          
          <div class="flex items-center">
            <input type="checkbox" id="notify-assignee" name="notify-assignee"
                  class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
            <label for="notify-assignee" class="ml-2 block text-sm text-gray-700">
              Send email notification to assignee
            </label>
          </div>
        </div>
        
        <!-- Additional Settings Section -->
        <div class="space-y-4">
          <h3 class="text-sm font-medium text-gray-500 uppercase tracking-wider mb-2">Additional Settings</h3>
          
          <div>
            <label for="task-tags" class="block text-sm font-medium text-gray-700 mb-1">Tags</label>
            <div class="flex flex-wrap gap-2 p-2 border border-gray-300 rounded-lg">
              <div class="inline-flex items-center bg-blue-100 text-blue-800 rounded-full px-3 py-1 text-xs font-medium">
                SEO
                <button class="ml-1.5 text-blue-600">×</button>
              </div>
              <div class="inline-flex items-center bg-purple-100 text-purple-800 rounded-full px-3 py-1 text-xs font-medium">
                Bug Fix
                <button class="ml-1.5 text-purple-600">×</button>
              </div>
              <input type="text" class="flex-grow outline-none text-sm py-1 px-2" placeholder="Add tag...">
            </div>
          </div>
          
          <div>
            <label for="related-audit" class="block text-sm font-medium text-gray-700 mb-1">Related Audit</label>
            <div class="relative">
              <select id="related-audit" name="related-audit"
                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 appearance-none">
                <option value="" selected disabled>Select audit</option>
                <option value="audit-1">Q2 2023 SEO Audit - example.com</option>
                <option value="audit-2">Performance Review - myshop.io</option>
                <option value="audit-3">Security Assessment - widgetco.com</option>
              </select>
              <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
              </div>
            </div>
          </div>
          
          <div>
            <label for="attachments" class="block text-sm font-medium text-gray-700 mb-1">Attachments</label>
            <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg">
              <div class="space-y-1 text-center">
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                  <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="flex text-sm text-gray-600">
                  <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-blue-600 hover:text-blue-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-blue-500">
                    <span>Upload files</span>
                    <input id="file-upload" name="file-upload" type="file" class="sr-only" multiple>
                  </label>
                  <p class="pl-1">or drag and drop</p>
                </div>
                <p class="text-xs text-gray-500">PNG, JPG, PDF, DOC up to 10MB</p>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
    
    <!-- Modal Footer -->
    <div class="border-t px-6 py-4 flex justify-end gap-3">
      <button class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
        Cancel
      </button>
      <button class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">
        Create Task
      </button>
    </div>
  </div>
</body>
</html>
