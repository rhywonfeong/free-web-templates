<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Test Type Report</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
/* Hide scrollbar for cleaner look */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-gray-100 text-gray-900 antialiased min-h-screen flex items-center justify-center p-4 sm:p-6">

    <!-- Modal Backdrop -->
    <div class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-40"></div>

    <!-- Modal Container -->
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-[56rem] max-h-[90vh] flex flex-col z-50 relative overflow-hidden">
        
        <!-- Header -->
        <div class="px-8 py-5 border-b border-gray-100 flex items-center justify-between bg-white/80 backdrop-blur-md z-10 sticky top-0">
            <h2 class="text-2xl font-medium tracking-tight text-gray-900">Add Test Type Report</h2>
            <button type="button" class="text-gray-400 hover:text-gray-700 transition-colors p-2 -mr-2 rounded-lg hover:bg-gray-100">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <!-- Scrollable Content Area -->
        <div class="p-8 overflow-y-auto no-scrollbar flex flex-col gap-10">
            
            <!-- Section: Schedule -->
            <div class="flex flex-col gap-3">
                <label class="text-base font-medium text-gray-800">Reports Schedule</label>
                <div class="flex flex-wrap items-center gap-6">
                    <label class="flex items-center gap-2.5 cursor-pointer group">
                        <div class="relative flex items-center justify-center w-5 h-5">
                            <input type="radio" name="schedule" class="peer sr-only">
                            <div class="w-5 h-5 rounded-full border border-gray-300 group-hover:border-gray-400 peer-checked:border-gray-900 peer-checked:border-[6px] transition-all bg-white"></div>
                        </div>
                        <span class="text-base text-gray-600 group-hover:text-gray-900 select-none">Monthly</span>
                    </label>
                    
                    <label class="flex items-center gap-2.5 cursor-pointer group">
                        <div class="relative flex items-center justify-center w-5 h-5">
                            <input type="radio" name="schedule" class="peer sr-only">
                            <div class="w-5 h-5 rounded-full border border-gray-300 group-hover:border-gray-400 peer-checked:border-gray-900 peer-checked:border-[6px] transition-all bg-white"></div>
                        </div>
                        <span class="text-base text-gray-600 group-hover:text-gray-900 select-none">Weekly</span>
                    </label>

                    <label class="flex items-center gap-2.5 cursor-pointer group">
                        <div class="relative flex items-center justify-center w-5 h-5">
                            <input type="radio" name="schedule" class="peer sr-only">
                            <div class="w-5 h-5 rounded-full border border-gray-300 group-hover:border-gray-400 peer-checked:border-gray-900 peer-checked:border-[6px] transition-all bg-white"></div>
                        </div>
                        <span class="text-base text-gray-600 group-hover:text-gray-900 select-none">Daily</span>
                    </label>

                    <label class="flex items-center gap-2.5 cursor-pointer group">
                        <div class="relative flex items-center justify-center w-5 h-5">
                            <input type="radio" name="schedule" checked class="peer sr-only">
                            <div class="w-5 h-5 rounded-full border border-gray-300 group-hover:border-gray-400 peer-checked:border-emerald-600 peer-checked:border-[6px] transition-all bg-white"></div>
                        </div>
                        <span class="text-base font-medium text-gray-900 select-none">Quarterly</span>
                    </label>
                </div>
            </div>

            <!-- Section: Configuration Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-x-6 gap-y-8">
                
                <!-- Start Date -->
                <div class="flex flex-col gap-2">
                    <label class="text-base font-medium text-gray-800">Start Date <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <input type="text" placeholder="Select Start Date" class="w-full rounded-xl border-0 py-3 pl-4 pr-10 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-900 text-base sm:leading-6 transition-all bg-gray-50/50 hover:bg-gray-50">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                            <i data-lucide="calendar" class="h-5 w-5 text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <!-- End Date -->
                <div class="flex flex-col gap-2">
                    <label class="text-base font-medium text-gray-800">End Date</label>
                    <div class="relative">
                        <input type="text" placeholder="Select End Date" class="w-full rounded-xl border-0 py-3 pl-4 pr-10 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-900 text-base sm:leading-6 transition-all bg-gray-50/50 hover:bg-gray-50">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                            <i data-lucide="calendar" class="h-5 w-5 text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Time -->
                <div class="flex flex-col gap-2">
                    <label class="text-base font-medium text-gray-800">Time <span class="text-red-500">*</span></label>
                    <div class="relative">
                        <input type="text" placeholder="Select Time" class="w-full rounded-xl border-0 py-3 pl-4 pr-10 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-900 text-base sm:leading-6 transition-all bg-gray-50/50 hover:bg-gray-50">
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                            <i data-lucide="clock" class="h-5 w-5 text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Timezone -->
                <div class="flex flex-col gap-2 md:col-span-1">
                    <label class="text-base font-medium text-gray-800">Timezone <span class="text-red-500">*</span></label>
                    <div class="relative cursor-pointer">
                        <div class="w-full rounded-xl border-0 py-3 pl-4 pr-10 text-gray-400 shadow-sm ring-1 ring-inset ring-gray-200 bg-gray-50/50 hover:bg-gray-50 text-base sm:leading-6 transition-all flex items-center">
                            Select Timezone
                        </div>
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                            <i data-lucide="chevron-down" class="h-5 w-5 text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <!-- Export Format -->
                <div class="flex flex-col gap-2 md:col-span-2">
                    <label class="text-base font-medium text-gray-800">Export Format <span class="text-red-500">*</span></label>
                    <div class="relative cursor-pointer">
                        <div class="w-full rounded-xl border-0 py-2 pl-2 pr-10 min-h-[50px] shadow-sm ring-1 ring-inset ring-gray-200 bg-gray-50/50 hover:bg-gray-50 transition-all flex items-center gap-2">
                            <!-- Selected Pill -->
                            <span class="inline-flex items-center gap-x-1.5 rounded-lg bg-white px-3 py-1.5 text-sm font-medium text-gray-900 ring-1 ring-inset ring-gray-200 shadow-sm">
                                HTML
                                <button type="button" class="group -mr-1 h-4 w-4 rounded-full hover:bg-gray-100 flex items-center justify-center">
                                    <i data-lucide="x" class="h-3 w-3 text-gray-400 group-hover:text-gray-600"></i>
                                </button>
                            </span>
                        </div>
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                            <i data-lucide="chevron-down" class="h-5 w-5 text-gray-400"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Section: Quarterly Settings (Conditional Block) -->
            <div class="rounded-2xl border border-emerald-100 bg-emerald-50/30 p-6 flex flex-col gap-5">
                <div class="flex items-baseline justify-between">
                    <h3 class="text-base font-medium text-emerald-900">Quarterly Settings <span class="text-red-500">*</span></h3>
                    <span class="text-sm text-gray-500">Quarters:</span>
                </div>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <!-- Q1 Card -->
                    <label class="relative flex cursor-pointer rounded-xl bg-white p-4 shadow-sm ring-1 ring-inset ring-gray-200 focus:outline-none has-[:checked]:ring-2 has-[:checked]:ring-inset has-[:checked]:ring-emerald-500 transition-all hover:ring-gray-300">
                        <input type="checkbox" checked class="peer sr-only">
                        <div class="flex w-full flex-col gap-1">
                            <div class="flex items-center justify-between">
                                <span class="text-base font-medium text-gray-900">Q1</span>
                                <i data-lucide="check-circle-2" class="h-5 w-5 text-emerald-500 opacity-0 peer-checked:opacity-100 transition-opacity fill-emerald-50"></i>
                            </div>
                            <span class="text-sm text-gray-500">Jan - Mar</span>
                        </div>
                    </label>

                    <!-- Q2 Card -->
                    <label class="relative flex cursor-pointer rounded-xl bg-white p-4 shadow-sm ring-1 ring-inset ring-gray-200 focus:outline-none has-[:checked]:ring-2 has-[:checked]:ring-inset has-[:checked]:ring-emerald-500 transition-all hover:ring-gray-300">
                        <input type="checkbox" checked class="peer sr-only">
                        <div class="flex w-full flex-col gap-1">
                            <div class="flex items-center justify-between">
                                <span class="text-base font-medium text-gray-900">Q2</span>
                                <i data-lucide="check-circle-2" class="h-5 w-5 text-emerald-500 opacity-0 peer-checked:opacity-100 transition-opacity fill-emerald-50"></i>
                            </div>
                            <span class="text-sm text-gray-500">Apr - Jun</span>
                        </div>
                    </label>

                    <!-- Q3 Card -->
                    <label class="relative flex cursor-pointer rounded-xl bg-white p-4 shadow-sm ring-1 ring-inset ring-gray-200 focus:outline-none has-[:checked]:ring-2 has-[:checked]:ring-inset has-[:checked]:ring-emerald-500 transition-all hover:ring-gray-300">
                        <input type="checkbox" checked class="peer sr-only">
                        <div class="flex w-full flex-col gap-1">
                            <div class="flex items-center justify-between">
                                <span class="text-base font-medium text-gray-900">Q3</span>
                                <i data-lucide="check-circle-2" class="h-5 w-5 text-emerald-500 opacity-0 peer-checked:opacity-100 transition-opacity fill-emerald-50"></i>
                            </div>
                            <span class="text-sm text-gray-500">Jul - Sep</span>
                        </div>
                    </label>

                    <!-- Q4 Card -->
                    <label class="relative flex cursor-pointer rounded-xl bg-white p-4 shadow-sm ring-1 ring-inset ring-gray-200 focus:outline-none has-[:checked]:ring-2 has-[:checked]:ring-inset has-[:checked]:ring-emerald-500 transition-all hover:ring-gray-300">
                        <input type="checkbox" checked class="peer sr-only">
                        <div class="flex w-full flex-col gap-1">
                            <div class="flex items-center justify-between">
                                <span class="text-base font-medium text-gray-900">Q4</span>
                                <i data-lucide="check-circle-2" class="h-5 w-5 text-emerald-500 opacity-0 peer-checked:opacity-100 transition-opacity fill-emerald-50"></i>
                            </div>
                            <span class="text-sm text-gray-500">Oct - Dec</span>
                        </div>
                    </label>
                </div>

                <div class="flex items-start gap-3 mt-1 bg-emerald-50/50 p-3 rounded-lg text-emerald-800">
                    <i data-lucide="info" class="h-5 w-5 shrink-0 mt-0.5"></i>
                    <p class="text-base leading-relaxed">Reports will be generated after the selected quarter ends and delivered on the first day of the next quarter.</p>
                </div>
            </div>

            <!-- Section: Divider -->
            <div class="w-full h-px bg-gray-100"></div>

            <!-- Section: Email Recipients -->
            <div class="flex flex-col gap-6">
                <h3 class="text-base font-medium text-gray-900">Email Recipients :</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- To -->
                    <div class="flex flex-col gap-2">
                        <div class="flex items-center gap-1.5">
                            <label class="text-base font-medium text-gray-800">To <span class="text-red-500">*</span></label>
                            <i data-lucide="info" class="h-4 w-4 text-gray-400 cursor-help hover:text-gray-600"></i>
                        </div>
                        <textarea rows="3" placeholder="email@address.com" class="block w-full rounded-xl border-0 py-3 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-900 text-base sm:leading-6 resize-none bg-gray-50/50 hover:bg-gray-50 transition-all"></textarea>
                    </div>

                    <!-- CC -->
                    <div class="flex flex-col gap-2">
                        <div class="flex items-center gap-1.5">
                            <label class="text-base font-medium text-gray-800">CC</label>
                            <i data-lucide="info" class="h-4 w-4 text-gray-400 cursor-help hover:text-gray-600"></i>
                        </div>
                        <textarea rows="3" placeholder="email@address.com" class="block w-full rounded-xl border-0 py-3 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-900 text-base sm:leading-6 resize-none bg-gray-50/50 hover:bg-gray-50 transition-all"></textarea>
                    </div>

                    <!-- BCC -->
                    <div class="flex flex-col gap-2">
                        <div class="flex items-center gap-1.5">
                            <label class="text-base font-medium text-gray-800">BCC</label>
                            <i data-lucide="info" class="h-4 w-4 text-gray-400 cursor-help hover:text-gray-600"></i>
                        </div>
                        <textarea rows="3" placeholder="email@address.com" class="block w-full rounded-xl border-0 py-3 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-900 text-base sm:leading-6 resize-none bg-gray-50/50 hover:bg-gray-50 transition-all"></textarea>
                    </div>
                </div>
            </div>

            <!-- Section: Message Content -->
            <div class="flex flex-col gap-6">
                <!-- Subject -->
                <div class="flex flex-col gap-2">
                    <label class="text-base font-medium text-gray-800">Subject</label>
                    <input type="text" placeholder="Enter Subject" class="block w-full rounded-xl border-0 py-3 px-4 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-200 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-900 text-base sm:leading-6 bg-gray-50/50 hover:bg-gray-50 transition-all">
                </div>

                <!-- Body (Rich Text Editor) -->
                <div class="flex flex-col gap-2">
                    <label class="text-base font-medium text-gray-800">Body</label>
                    
                    <div class="rounded-xl border border-gray-200 shadow-sm overflow-hidden bg-white focus-within:ring-2 focus-within:ring-gray-900 focus-within:border-transparent transition-all">
                        <!-- Toolbar -->
                        <div class="bg-gray-50/80 border-b border-gray-200 p-2 flex flex-wrap gap-1 items-center">
                            
                            <!-- Formatting group 1 -->
                            <div class="flex items-center gap-0.5">
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="bold" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="italic" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="underline" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="strikethrough" class="w-4 h-4"></i></button>
                            </div>
                            
                            <div class="w-px h-5 bg-gray-300 mx-1"></div>

                            <!-- Formatting group 2 -->
                            <div class="flex items-center gap-0.5">
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="subscript" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="superscript" class="w-4 h-4"></i></button>
                            </div>

                            <div class="w-px h-5 bg-gray-300 mx-1"></div>

                            <!-- Alignment -->
                            <div class="flex items-center gap-0.5">
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="align-left" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="align-center" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="align-right" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="align-justify" class="w-4 h-4"></i></button>
                            </div>

                            <div class="w-px h-5 bg-gray-300 mx-1"></div>

                            <!-- Dropdowns -->
                            <div class="flex items-center gap-1.5 px-1">
                                <button type="button" class="flex items-center gap-1 px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors">
                                    Size <i data-lucide="chevron-down" class="w-3 h-3"></i>
                                </button>
                                <button type="button" class="flex items-center gap-1 px-2 py-1.5 text-sm text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors">
                                    Formats <i data-lucide="chevron-down" class="w-3 h-3"></i>
                                </button>
                            </div>

                            <div class="w-px h-5 bg-gray-300 mx-1"></div>

                            <!-- Colors -->
                            <div class="flex items-center gap-0.5">
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="baseline" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="paint-bucket" class="w-4 h-4"></i></button>
                            </div>

                            <div class="w-px h-5 bg-gray-300 mx-1"></div>

                            <!-- Lists & Indent -->
                            <div class="flex items-center gap-0.5">
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="list" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="list-ordered" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="outdent" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="indent" class="w-4 h-4"></i></button>
                            </div>

                            <div class="w-px h-5 bg-gray-300 mx-1"></div>

                            <!-- Inserts & Misc -->
                            <div class="flex items-center gap-0.5">
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="link" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="image" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="code" class="w-4 h-4"></i></button>
                                <button type="button" class="p-1.5 text-gray-600 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="printer" class="w-4 h-4"></i></button>
                            </div>

                        </div>
                        
                        <!-- Secondary Toolbar Row -->
                        <div class="bg-gray-50/50 border-b border-gray-200 p-2 flex flex-wrap gap-1 items-center">
                            <button type="button" class="p-1.5 text-gray-500 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="undo" class="w-4 h-4"></i></button>
                            <button type="button" class="p-1.5 text-gray-500 hover:bg-gray-200 hover:text-gray-900 rounded-md transition-colors"><i data-lucide="redo" class="w-4 h-4"></i></button>
                        </div>

                        <!-- Editor Area -->
                        <textarea class="w-full min-h-[160px] p-4 text-base text-gray-900 border-none focus:ring-0 resize-y outline-none bg-white"></textarea>
                    </div>
                </div>
            </div>

        </div>

        <!-- Footer Actions -->
        <div class="px-8 py-5 border-t border-gray-100 bg-gray-50 flex items-center justify-end gap-3 z-10 sticky bottom-0 rounded-b-2xl">
            <button type="button" class="px-5 py-2.5 text-base font-medium text-gray-700 bg-white border border-gray-300 rounded-xl hover:bg-gray-50 hover:text-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-200 transition-colors shadow-sm">
                Cancel
            </button>
            <button type="submit" class="px-6 py-2.5 text-base font-medium text-white bg-emerald-600 border border-transparent rounded-xl hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 transition-colors shadow-sm">
                Create
            </button>
        </div>

    </div>

    <script>
        // Initialize Lucide icons with 1.5 stroke width
        lucide.createIcons({
            attrs: {
                'stroke-width': 1.5
            }
        });
    </script>
</body>
</html>
