<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Assets - New Identity</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body { font-family: 'Inter', sans-serif; }
.font-mono { font-family: 'JetBrains Mono', monospace; }
/* Custom Animations for "GIF-like" feel */
@keyframes blink {
0%, 90%, 100% { transform: scaleY(1); }
95% { transform: scaleY(0.1); }
}
@keyframes float {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(-3px); }
}
.animate-blink {
animation: blink 4s infinite ease-in-out;
transform-origin: center;
}
/* Offset the second eye slightly so they don't always blink in perfect unison, looks more organic */
.animate-blink-delay {
animation: blink 4s infinite ease-in-out;
animation-delay: 0.1s;
transform-origin: center;
}
.animate-float {
animation: float 6s ease-in-out infinite;
}
</style></head>
<body class="bg-[#050505] text-white min-h-screen flex flex-col items-center justify-center p-12 select-none">

    <div class="grid grid-cols-1 gap-24 w-full max-w-4xl place-items-center">

        <!-- OPTION 1: The Primary Logo (Animated Hero) -->
        <div class="flex flex-col items-center gap-8 animate-float">
            <span class="text-neutral-500 text-xs font-mono uppercase tracking-widest">Primary Mark (Animated)</span>
            
            <!-- Logo Construction -->
            <div class="flex flex-col items-center justify-center gap-4">
                <!-- Eyes -->
                <div class="flex gap-6">
                    <div class="w-16 h-16 bg-[#FF5500] rounded-full animate-blink shadow-[0_0_40px_-10px_rgba(255,85,0,0.3)]"></div>
                    <div class="w-16 h-16 bg-[#FF5500] rounded-full animate-blink-delay shadow-[0_0_40px_-10px_rgba(255,85,0,0.3)]"></div>

            <!-- Optional Brand Name underneath -->
            <h1 class="text-3xl font-semibold tracking-tight text-neutral-200 mt-2">
                ASCE<span class="text-[#FF5500]">.FUN</span>
            </h1>
        </div>

        <div class="w-full h-px bg-neutral-900"></div>

        <!-- OPTION 2: App Icons / Monograms -->
        <div class="flex flex-col items-center gap-6">
            <span class="text-neutral-500 text-xs font-mono uppercase tracking-widest mb-4">App Icons</span>
            
            <div class="flex gap-12">

                <div class="group w-28 h-28 bg-[#111] border border-[#222] rounded-[2rem] flex items-center justify-center shadow-2xl transition-transform hover:scale-105 cursor-pointer">

                            <div class="w-8 h-8 bg-[#FF5500] rounded-full group-hover:animate-blink"></div>
                        </div>
                        <div class="w-24 h-12 bg-[#FF5500] rounded-b-full"></div>
                    </div>
                </div>

                <!-- Brand Color Version (Inverted) -->
                <div class="group w-28 h-28 bg-[#FF5500] rounded-[2rem] flex items-center justify-center shadow-2xl shadow-orange-900/40 transition-transform hover:scale-105 cursor-pointer">
                    <div class="flex flex-col items-center gap-1.5 transform scale-50">
                        <div class="flex gap-3">
                            <div class="w-8 h-8 bg-white rounded-full group-hover:animate-blink"></div>
                            <div class="w-8 h-8 bg-white rounded-full group-hover:animate-blink"></div>
                        </div>
                        <div class="w-24 h-12 bg-white rounded-b-full"></div>
                    </div>
                </div>

                 <!-- Outline / Ghost Version -->
                 <div class="group w-28 h-28 border border-neutral-800 bg-neutral-900/30 rounded-[2rem] flex items-center justify-center transition-transform hover:scale-105 cursor-pointer">
                    <div class="flex flex-col items-center gap-1.5 transform scale-50 opacity-60 group-hover:opacity-100 transition-opacity">
                         <div class="flex gap-3">

                            <div class="w-8 h-8 bg-white rounded-full"></div>
                        </div>
                        <div class="w-24 h-12 bg-white rounded-b-full"></div>
                   </div>
               </div>
            </div>
        </div>

        <div class="w-full h-px bg-neutral-900"></div>

        <!-- OPTION 3: Contextual (Nav Bar) -->
        <div class="flex flex-col items-center gap-6 w-full">
            <span class="text-neutral-500 text-xs font-mono uppercase tracking-widest mb-4">Navigation Implementation</span>
            
            <div class="w-full max-w-xl bg-[#0A0A0A] border border-neutral-800 rounded-xl p-3 flex items-center justify-between shadow-lg">

                </div>

                        <div class="relative">
                            <div class="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 bg-[#FF5500] rounded-full"></div>
                            <i data-lucide="bell" class="w-4 h-4 text-neutral-500 hover:text-white cursor-pointer transition-colors"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
