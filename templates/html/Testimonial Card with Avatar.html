    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonial Card Grid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora&family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-primary-sans: 'Roboto', sans-serif;
            --font-primary-serif: 'Lora', serif;
            --font-current-main: var(--font-primary-sans);
            --font-current-heading: var(--font-primary-sans);
            --font-current-quote: var(--font-primary-serif);
            
            --bg-page: #f8f9fa;
            --bg-component: #ffffff;
            --text-primary: #212529;
            --text-secondary: #495057;
            --text-heading: #004085;
            --text-muted: #6c757d;
            --text-rating: #ffc107;
            
            --border-color: #dee2e6;
            --border-radius-lg: 0.3rem;
            --border-radius-avatar: 50%;
            
            --shadow-color-rgb: 0, 0, 0;
            --shadow-opacity-md: 0.15;
            --shadow-opacity-lg: 0.2;
            --shadow-md: 0 .5rem 1rem rgba(var(--shadow-color-rgb), var(--shadow-opacity-md));
            --shadow-lg: 0 1rem 3rem rgba(var(--shadow-color-rgb), var(--shadow-opacity-lg));
            
            --transition-speed-normal: 0.2s;
            --transition-timing-function: ease-in-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: var(--font-current-main);
            line-height: 1.6;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
        }

        .testimonial-card-grid {
            background-color: var(--bg-component);
            padding: 20px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            max-width: 350px;
            width: 100%;
            text-align: left;
            transition: transform var(--transition-speed-normal) var(--transition-timing-function), 
                        box-shadow var(--transition-speed-normal) var(--transition-timing-function);
        }

        .testimonial-card-grid:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .testimonial-avatar {
            width: 60px;
            height: 60px;
            border-radius: var(--border-radius-avatar);
            object-fit: cover;
            float: left;
            margin-right: 15px;
            margin-bottom: 15px;
            display: block;
            border: 3px solid var(--border-color);
            background-color: var(--bg-component);
        }

        .testimonial-author-info {
            overflow: hidden;
            padding-top: 5px;
        }

        .testimonial-rating {
            color: var(--text-rating);
            font-size: 1rem;
            margin-bottom: 10px;
            text-align: left;
        }

        .testimonial-quote {
            font-family: var(--font-current-quote);
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-primary);
            margin-top: 15px;
            clear: both;
        }

        .testimonial-author {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-heading);
            margin-bottom: 3px;
        }

        .testimonial-author-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: block;
        }
    </style>
</head>
<body>
    <div class="testimonial-card-grid">
        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?ixlib=rb-4.0.3&amp;ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&amp;auto=format&amp;fit=crop&amp;w=120&amp;q=80" alt="Author Avatar" class="testimonial-avatar">
        <div class="testimonial-author-info">
            <p class="testimonial-author">Maria Garcia</p>
            <span class="testimonial-author-title">Creative Director, Studio Bloom</span>
            <div class="testimonial-rating">★★★★★</div>
        </div>
        <blockquote class="testimonial-quote">Fantastic product with an intuitive interface. It simplified complex tasks and looks beautiful too.</blockquote>
    </div>
</body>
</html>
