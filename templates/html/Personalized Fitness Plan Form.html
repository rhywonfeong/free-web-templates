  <meta charset="UTF-8">

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    /* Hide number input arrows for a cleaner look */
    input[type='number']::-webkit-inner-spin-button,
    input[type='number']::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type='number'] {
      -moz-appearance: textfield;
    }
    /* Custom slider styles - modern browsers */
    input[type="range"] {
      width: 100%;
      height: 6px;
      background: #27272a;
      border-radius: 12px;
      outline: none;
      transition: background 0.2s;
      accent-color: #22d3ee; /* fallback for supported browsers */
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #22c55e, #4ade80 70%);
      box-shadow: 0 2px 10px #4ade8044;
      border: 3px solid #18181b;
      cursor: pointer;
      transition: box-shadow .2s;
    }
    input[type="range"]:active::-webkit-slider-thumb {
      box-shadow: 0 0 0 6px #4ade8044;
    }
    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #22c55e, #4ade80 70%);
      border: 3px solid #18181b;
      box-shadow: 0 2px 10px #4ade8044;
      cursor: pointer;
      transition: box-shadow .2s;
    }
    input[type="range"]:active::-moz-range-thumb {
      box-shadow: 0 0 0 6px #4ade8044;
    }
    input[type="range"]:focus {
      outline: none;
    }
    input[type="range"]::-ms-thumb {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #22c55e, #4ade80 70%);
      border: 3px solid #18181b;
      box-shadow: 0 2px 10px #4ade8044;
      cursor: pointer;
      transition: box-shadow .2s;
    }
    /* Track styles for Firefox */
    input[type="range"]::-moz-range-track {
      height: 6px;
      background: #27272a;
      border-radius: 12px;
    }
    /* Track styles for IE */
    input[type="range"]::-ms-fill-lower,
    input[type="range"]::-ms-fill-upper {
      background: #27272a;
      border-radius: 12px;
      height: 6px;
    }
    /* Remove outline in Firefox */
    input[type="range"]::-moz-focus-outer {
      border: 0;
    }
    /* Remove vertical line in IE */
    input[type="range"]::-ms-tooltip {
      display: none;
    }

<body class="bg-gray-950 min-h-screen flex items-center justify-center">
  <main class="w-full max-w-md bg-gray-900 rounded-3xl shadow-2xl p-8">

      <svg class="mb-2 h-14 w-14 text-green-400 drop-shadow-lg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="filter: drop-shadow(0 0 14px #22c55e66);">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M8 12l2 2 4-4"/>
      </svg>
      <h1 class="text-3xl font-extrabold text-gray-100 tracking-tight mb-2">Build Your Plan</h1>
      <p class="text-gray-400 text-base">Personalize your fitness journey. Enter your details to create a plan tailored just for you.</p>
    </header>
    <form class="flex flex-col gap-7">
      <div>
        <label for="age" class="block text-sm text-gray-300 mb-1 font-medium">Your Age</label>
        <input type="number" id="age" name="age" min="10" max="100" placeholder="e.g. 21"
          class="w-full bg-gray-800 border border-gray-700 rounded-xl py-3 px-4 text-lg text-gray-100 focus:ring-2 focus:ring-green-500 outline-none transition" required>
      </div>
      <div>
        <label for="height" class="block text-sm text-gray-300 mb-1 font-medium">Height (cm)</label>
        <input type="number" id="height" name="height" min="100" max="250" placeholder="e.g. 160"
          class="w-full bg-gray-800 border border-gray-700 rounded-xl py-3 px-4 text-lg text-gray-100 focus:ring-2 focus:ring-green-500 outline-none transition" required>
      </div>
      <div>
        <label for="bpm" class="block text-sm text-gray-300 mb-1 font-medium">
          Resting Heart Rate (<span id="bpm-value" class="text-green-400 font-bold">65</span> BPM)
        </label>
        <input 
          type="range" 
          id="bpm" 
          name="bpm" 
          min="40" 
          max="120" 
          value="65" 
          class="mt-3 mb-2"
          oninput="document.getElementById('bpm-value').textContent=this.value"
        >
        <div class="flex justify-between text-xs text-gray-400 mt-1">
          <span>40</span>
          <span>120</span>
        </div>
      </div>
      <div class="mt-2">

          class="w-full py-3 rounded-xl font-bold text-lg shadow-xl text-gray-900
            bg-gradient-to-r from-green-400 to-green-600 hover:from-green-300 hover:to-green-500 transition
            ">
          Generate My Plan
        </button>
      </div>
    </form>
    <footer class="mt-8 text-center">
      <p class="text-gray-500 text-xs">Start your transformation today. Consistency leads to results!</p>
    </footer>
  </main>
</body>
