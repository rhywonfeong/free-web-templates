<html lang="en">
<head>
  <title>Course Revenue Overview</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bar-animate { transition: width 0.6s cubic-bezier(.4,0,.2,1); }
    .bar-segment:hover { filter: brightness(0.92) drop-shadow(0 0 6px #5357ea44); }
  </style>
</head>
<body class="bg-neutral-100 flex items-center justify-center min-h-screen">
  <div class="bg-white rounded-xl shadow-lg px-8 py-7 w-fit min-w-[300px]">
    <div class="mb-6">
      <h2 class="text-neutral-900 text-xl font-semibold">Course Revenue</h2>
      <p class="text-neutral-400 text-xs mt-1">Last 6 months</p>
    </div>
    <!-- Stacked Horizontal Bar Chart -->
    <div class="w-full max-w-xs">
      <div class="flex items-center justify-between text-xs mb-2">
        <span class="text-indigo-600 font-medium">Course Sales</span>
        <span class="text-neutral-400 font-medium">$8,100</span>
      </div>
      <div class="flex h-8 rounded-lg overflow-hidden border border-neutral-200 bg-neutral-50 mb-2 w-full">
        <div
          class="bar-segment bar-animate bg-indigo-500 flex items-center justify-center text-white text-sm font-semibold h-full"
          style="width: 62.1%"
          title="Course Sales"
        >
          <span class="ml-2 text-xs font-semibold"></span>
        </div>
        <div
          class="bar-segment bar-animate bg-fuchsia-200 flex items-center justify-center text-indigo-800 text-sm font-semibold h-full"
          style="width: 37.9%"
          title="Other Income"
        >
          <!-- empty for minimal label -->
        </div>
      </div>
      <div class="flex items-center justify-between text-xs">
        <span class="text-fuchsia-400 font-medium">Other Income</span>
        <span class="text-neutral-400 font-medium">$4,950</span>
      </div>
    </div>
    <!-- Percentage Legend -->
    <div class="flex justify-center gap-8 mt-7">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 bg-indigo-500 rounded"></span>
        <span class="text-xs text-neutral-700">62% Course Sales</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 bg-fuchsia-200 rounded"></span>
        <span class="text-xs text-neutral-700">38% Other Income</span>
      </div>
    </div>
    <!-- Total -->
    <div class="flex flex-col items-center mt-8">
      <div class="text-neutral-700 text-sm">Total Revenue</div>
      <div class="text-indigo-600 font-bold text-2xl">$13,050</div>
    </div>
  </div>
</body>
</html>
