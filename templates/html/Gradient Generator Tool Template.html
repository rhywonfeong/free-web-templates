<body class="bg-zinc-950 text-zinc-300 font-sans h-screen w-screen overflow-hidden flex flex-col md:flex-row antialiased selection:bg-zinc-800 selection:text-white">

    <!-- Main Preview Area -->
    <main class="flex-1 relative flex items-center justify-center p-6 md:p-12 overflow-hidden bg-zinc-950" style="background-image: radial-gradient(circle, #27272a 1px, transparent 1px); background-size: 24px 24px;">
        
        <!-- Canvas Container -->
        <div class="w-full max-w-4xl aspect-[4/3] md:aspect-[16/9] rounded-2xl border border-zinc-800/60 shadow-2xl relative overflow-hidden group">
            
            <!-- Dynamic Gradient Background -->
            <div class="absolute inset-0 z-0 transition-all duration-500" style="background: linear-gradient(145deg, #FF453A 0%, #BF5AF2 45%, #0A84FF 100%);"></div>
            
            <!-- Noise Texture Overlay -->
            <div class="absolute inset-0 z-10 pointer-events-none opacity-40 mix-blend-overlay">
                <svg viewBox="0 0 200 200" preserveAspectRatio="none" class="w-full h-full">
                    <filter id="noiseFilter">
                        <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
                    </filter>
                    <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
                </svg>
            </div>
            
            <!-- Optional Vignette -->
            <div class="absolute inset-0 z-20 pointer-events-none mix-blend-multiply opacity-60" style="background: radial-gradient(circle at center, transparent 20%, #000 120%);"></div>

            <!-- Preview Content -->
            <div class="relative z-30 w-full h-full flex flex-col items-center justify-center space-y-6 select-none p-8">
                <div class="w-16 h-16 rounded-2xl bg-white/10 border border-white/20 backdrop-blur-md shadow-2xl flex items-center justify-center transform group-hover:scale-105 transition-transform duration-500">
                    <iconify-icon icon="solar:layers-minimalistic-linear" stroke-width="1.5" class="text-white text-3xl"></iconify-icon>
                </div>
                <div class="text-center space-y-2">
                    <h1 class="text-3xl md:text-5xl font-semibold tracking-tighter text-white drop-shadow-sm">Textured Mesh</h1>
                    <p class="text-white/80 text-sm md:text-base font-medium tracking-tight">Modify parameters to generate unique backgrounds.</p>
                </div>
            </div>

            <!-- Viewport Controls (Overlay) -->
            <div class="absolute bottom-4 right-4 z-40 flex items-center gap-2 bg-zinc-900/80 backdrop-blur-md border border-zinc-800/80 p-1 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <button class="p-1.5 text-zinc-400 hover:text-zinc-100 rounded-md hover:bg-zinc-800 transition-colors flex items-center justify-center" aria-label="Zoom Out">
                    <iconify-icon icon="solar:magnifer-zoom-out-linear" stroke-width="1.5" class="text-base"></iconify-icon>
                </button>
                <span class="text-xs font-mono text-zinc-500 px-1">100%</span>
                <button class="p-1.5 text-zinc-400 hover:text-zinc-100 rounded-md hover:bg-zinc-800 transition-colors flex items-center justify-center" aria-label="Zoom In">
                    <iconify-icon icon="solar:magnifer-zoom-in-linear" stroke-width="1.5" class="text-base"></iconify-icon>
                </button>
                <div class="w-px h-4 bg-zinc-700 mx-1"></div>
                <button class="p-1.5 text-zinc-400 hover:text-zinc-100 rounded-md hover:bg-zinc-800 transition-colors flex items-center justify-center" aria-label="Fullscreen">
                    <iconify-icon icon="solar:maximize-square-minimalistic-linear" stroke-width="1.5" class="text-base"></iconify-icon>
                </button>
            </div>
        </div>
    </main>

    <!-- Sidebar Controls -->
    <aside class="w-full md:w-[340px] h-[50vh] md:h-screen bg-zinc-950 border-t md:border-t-0 md:border-l border-zinc-800/60 flex flex-col shadow-2xl relative z-20">
        
        <!-- Header -->
        <header class="flex items-center justify-between px-5 py-4 border-b border-zinc-800/60 bg-zinc-950/95 backdrop-blur z-10 sticky top-0">
            <div class="text-base font-semibold tracking-tighter text-zinc-100 flex items-center gap-1">
                GRDT<span class="text-zinc-600">.</span>
            </div>
            <div class="flex items-center gap-2">
                <button class="p-1.5 text-zinc-400 hover:text-zinc-100 rounded-md hover:bg-zinc-900 transition-colors flex items-center justify-center" aria-label="Randomize">
                    <iconify-icon icon="solar:refresh-circle-linear" stroke-width="1.5" class="text-lg"></iconify-icon>
                </button>
                <button class="bg-zinc-100 text-zinc-950 text-xs font-medium px-3 py-1.5 rounded-md hover:bg-white transition-colors flex items-center gap-1.5 shadow-sm">
                    <iconify-icon icon="solar:download-minimalistic-linear" stroke-width="1.5"></iconify-icon>
                    Export
                </button>
            </div>
        </header>

        <!-- Scrollable Settings -->

                    <h2 class="text-sm font-medium text-zinc-100">Gradient Configuration</h2>
                </div>

                <!-- Type Selector -->
                <div class="flex p-0.5 bg-zinc-900 rounded-lg border border-zinc-800/50">
                    <button class="flex-1 text-xs py-1.5 text-zinc-100 bg-zinc-800 shadow-sm rounded-md font-medium border border-zinc-700/50">Linear</button>
                    <button class="flex-1 text-xs py-1.5 text-zinc-500 hover:text-zinc-300 font-medium transition-colors">Radial</button>
                    <button class="flex-1 text-xs py-1.5 text-zinc-500 hover:text-zinc-300 font-medium transition-colors">Conic</button>
                </div>

                <!-- Angle Slider -->
                <div class="space-y-2.5 pt-1">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-normal text-zinc-400">Angle</label>
                        <span class="text-xs font-mono text-zinc-300">145&deg;</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <input type="range" min="0" max="360" value="145" class="w-full appearance-none bg-zinc-800 h-1 rounded-full outline-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3 [&::-webkit-slider-thumb]:bg-zinc-200 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:cursor-grab active:[&::-webkit-slider-thumb]:cursor-grabbing cursor-pointer [&::-moz-range-thumb]:appearance-none [&::-moz-range-thumb]:w-3 [&::-moz-range-thumb]:h-3 [&::-moz-range-thumb]:bg-zinc-200 [&::-moz-range-thumb]:border-0 [&::-moz-range-thumb]:rounded-full">
                        <div class="w-6 h-6 rounded-full border border-zinc-800 flex items-center justify-center bg-zinc-900 flex-shrink-0">
                            <div class="w-px h-3 bg-zinc-500 transform rotate-[145deg] origin-bottom -translate-y-1.5"></div>
                        </div>
                    </div>
                </div>

                <!-- Color Stops -->
                <div class="space-y-2 pt-2">
                    <div class="flex items-center justify-between mb-1">
                        <label class="text-xs font-normal text-zinc-400">Color Stops</label>
                    </div>
                    
                    <!-- Stop 1 -->
                    <div class="flex items-center gap-2 group">
                        <iconify-icon icon="solar:reorder-linear" class="text-zinc-600 cursor-grab opacity-0 group-hover:opacity-100 transition-opacity text-sm"></iconify-icon>
                        <div class="w-5 h-5 rounded-md border border-zinc-700/50 shadow-inner flex-shrink-0 cursor-pointer" style="background-color: #FF453A;"></div>
                        <input type="text" value="FF453A" class="flex-1 w-0 bg-zinc-900 border border-zinc-800 rounded-md px-2 py-1.5 text-xs text-zinc-300 font-mono uppercase focus:border-zinc-600 outline-none transition-colors">
                        <input type="text" value="0%" class="w-12 bg-zinc-900 border border-zinc-800 rounded-md px-2 py-1.5 text-xs text-zinc-300 font-mono text-center focus:border-zinc-600 outline-none transition-colors">
                        <button class="text-zinc-600 hover:text-red-400 p-1 rounded transition-colors opacity-0 group-hover:opacity-100">
                            <iconify-icon icon="solar:trash-bin-trash-linear" class="text-sm"></iconify-icon>
                        </button>
                    </div>

                    <!-- Stop 2 -->
                    <div class="flex items-center gap-2 group">
                        <iconify-icon icon="solar:reorder-linear" class="text-zinc-600 cursor-grab opacity-0 group-hover:opacity-100 transition-opacity text-sm"></iconify-icon>
                        <div class="w-5 h-5 rounded-md border border-zinc-700/50 shadow-inner flex-shrink-0 cursor-pointer" style="background-color: #BF5AF2;"></div>
                        <input type="text" value="BF5AF2" class="flex-1 w-0 bg-zinc-900 border border-zinc-800 rounded-md px-2 py-1.5 text-xs text-zinc-300 font-mono uppercase focus:border-zinc-600 outline-none transition-colors">
                        <input type="text" value="45%" class="w-12 bg-zinc-900 border border-zinc-800 rounded-md px-2 py-1.5 text-xs text-zinc-300 font-mono text-center focus:border-zinc-600 outline-none transition-colors">
                        <button class="text-zinc-600 hover:text-red-400 p-1 rounded transition-colors opacity-0 group-hover:opacity-100">
                            <iconify-icon icon="solar:trash-bin-trash-linear" class="text-sm"></iconify-icon>
                        </button>
                    </div>

                    <!-- Stop 3 -->
                    <div class="flex items-center gap-2 group">
                        <iconify-icon icon="solar:reorder-linear" class="text-zinc-600 cursor-grab opacity-0 group-hover:opacity-100 transition-opacity text-sm"></iconify-icon>
                        <div class="w-5 h-5 rounded-md border border-zinc-700/50 shadow-inner flex-shrink-0 cursor-pointer" style="background-color: #0A84FF;"></div>
                        <input type="text" value="0A84FF" class="flex-1 w-0 bg-zinc-900 border border-zinc-800 rounded-md px-2 py-1.5 text-xs text-zinc-300 font-mono uppercase focus:border-zinc-600 outline-none transition-colors">
                        <input type="text" value="100%" class="w-12 bg-zinc-900 border border-zinc-800 rounded-md px-2 py-1.5 text-xs text-zinc-300 font-mono text-center focus:border-zinc-600 outline-none transition-colors">
                        <button class="text-zinc-600 hover:text-red-400 p-1 rounded transition-colors opacity-0 group-hover:opacity-100">
                            <iconify-icon icon="solar:trash-bin-trash-linear" class="text-sm"></iconify-icon>
                        </button>
                    </div>

                    <button class="w-full mt-2 py-1.5 border border-dashed border-zinc-800 text-zinc-400 hover:text-zinc-200 hover:border-zinc-600 rounded-md text-xs font-medium flex items-center justify-center gap-1.5 transition-colors">
                        <iconify-icon icon="solar:add-circle-linear" class="text-sm"></iconify-icon>
                        Add Color Stop
                    </button>
                </div>
            </section>

            <hr class="border-zinc-800/60">

            <!-- Texture & Noise Section -->
            <section class="space-y-5">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-medium text-zinc-100">Texture & Noise</h2>
                    <!-- Custom Toggle -->
                    <button class="w-7 h-4 bg-zinc-700 rounded-full relative transition-colors focus:outline-none flex-shrink-0" aria-checked="true">
                        <span class="absolute left-[2px] top-[2px] w-3 h-3 bg-white rounded-full transition-transform translate-x-[12px] shadow-sm"></span>
                    </button>
                </div>

                <!-- Texture Type -->
                <div class="space-y-1.5">
                    <label class="text-xs font-normal text-zinc-400">Algorithm</label>
                    <button class="w-full flex items-center justify-between bg-zinc-900 border border-zinc-800 rounded-md px-2.5 py-1.5 text-xs text-zinc-200 hover:bg-zinc-800/80 transition-colors outline-none focus:border-zinc-600">
                        <span>Fractal Noise</span>
                        <iconify-icon icon="solar:alt-arrow-down-linear" class="text-zinc-500"></iconify-icon>
                    </button>
                </div>

                <!-- Sliders -->
                <div class="space-y-4">
                    <!-- Intensity Slider -->
                    <div class="space-y-2.5">
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-normal text-zinc-400">Intensity</label>
                            <span class="text-xs font-mono text-zinc-300">40%</span>
                        </div>
                        <input type="range" min="0" max="100" value="40" class="w-full appearance-none bg-zinc-800 h-1 rounded-full outline-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3 [&::-webkit-slider-thumb]:bg-zinc-200 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:cursor-grab active:[&::-webkit-slider-thumb]:cursor-grabbing cursor-pointer [&::-moz-range-thumb]:appearance-none [&::-moz-range-thumb]:w-3 [&::-moz-range-thumb]:h-3 [&::-moz-range-thumb]:bg-zinc-200 [&::-moz-range-thumb]:border-0 [&::-moz-range-thumb]:rounded-full">
                    </div>

                    <!-- Scale Slider -->
                    <div class="space-y-2.5">
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-normal text-zinc-400">Scale</label>
                            <span class="text-xs font-mono text-zinc-300">85%</span>
                        </div>
                        <input type="range" min="1" max="100" value="85" class="w-full appearance-none bg-zinc-800 h-1 rounded-full outline-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3 [&::-webkit-slider-thumb]:bg-zinc-200 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:cursor-grab active:[&::-webkit-slider-thumb]:cursor-grabbing cursor-pointer [&::-moz-range-thumb]:appearance-none [&::-moz-range-thumb]:w-3 [&::-moz-range-thumb]:h-3 [&::-moz-range-thumb]:bg-zinc-200 [&::-moz-range-thumb]:border-0 [&::-moz-range-thumb]:rounded-full">
                    </div>
                </div>

                <!-- Blend Mode -->
                <div class="space-y-1.5 pt-1">
                    <label class="text-xs font-normal text-zinc-400">Blend Mode</label>
                    <button class="w-full flex items-center justify-between bg-zinc-900 border border-zinc-800 rounded-md px-2.5 py-1.5 text-xs text-zinc-200 hover:bg-zinc-800/80 transition-colors outline-none focus:border-zinc-600">
                        <span>Overlay</span>
                        <iconify-icon icon="solar:alt-arrow-down-linear" class="text-zinc-500"></iconify-icon>
                    </button>
                </div>
            </section>

            <hr class="border-zinc-800/60">

            <!-- Effects Section -->
            <section class="space-y-4">
                <div class="flex items-center justify-between">
                    <label class="text-sm font-medium text-zinc-100">Vignette</label>
                    <button class="w-7 h-4 bg-zinc-700 rounded-full relative transition-colors focus:outline-none flex-shrink-0" aria-checked="true">
                        <span class="absolute left-[2px] top-[2px] w-3 h-3 bg-white rounded-full transition-transform translate-x-[12px] shadow-sm"></span>
                    </button>
                </div>
                <div class="space-y-2.5">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-normal text-zinc-400">Opacity</label>
                        <span class="text-xs font-mono text-zinc-300">60%</span>
                    </div>
                    <input type="range" min="0" max="100" value="60" class="w-full appearance-none bg-zinc-800 h-1 rounded-full outline-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-3 [&::-webkit-slider-thumb]:h-3 [&::-webkit-slider-thumb]:bg-zinc-200 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:cursor-grab active:[&::-webkit-slider-thumb]:cursor-grabbing cursor-pointer [&::-moz-range-thumb]:appearance-none [&::-moz-range-thumb]:w-3 [&::-moz-range-thumb]:h-3 [&::-moz-range-thumb]:bg-zinc-200 [&::-moz-range-thumb]:border-0 [&::-moz-range-thumb]:rounded-full">
                </div>
            </section>

        </div>

        <!-- Output Footer -->
        <div class="p-5 border-t border-zinc-800/60 bg-zinc-950/95 backdrop-blur z-10">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-medium text-zinc-400">CSS Output</span>
                <button class="text-zinc-400 hover:text-zinc-100 transition-colors flex items-center gap-1 text-xs">
                    <iconify-icon icon="solar:copy-linear" class="text-sm"></iconify-icon>
                    Copy
                </button>
            </div>
            <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-3 relative group">
                <code class="text-[11px] font-mono text-zinc-400 block break-all leading-relaxed">
                    background: linear-gradient(145deg, <span class="text-zinc-200">#FF453A</span> 0%, <span class="text-zinc-200">#BF5AF2</span> 45%, <span class="text-zinc-200">#0A84FF</span> 100%);<br>
                    <span class="text-zinc-500">/* Note: Noise requires SVG filter overlay */</span>
                </code>
            </div>
        </div>
    </aside>

    <style>
        /* Minimal custom scrollbar for the sidebar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        .custom-scrollbar:hover::-webkit-scrollbar-thumb {
            background: #52525b;
        }
    </style>
