<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
* { font-family: 'Inter', sans-serif; }
.game-enter { opacity: 0; transform: translateY(40px); animation: gameEnter 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.cell-enter { opacity: 0; transform: scale(0.8); animation: cellEnter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
.mark-appear { animation: markAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
.winning-pulse { animation: winningPulse 0.8s ease-in-out infinite; }
.mode-switch { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.float-animation { animation: float 3s ease-in-out infinite; }
.thinking-dots::after { content: ''; animation: thinking 1.5s ease-in-out infinite; }
/* Theme Classes */
.theme-purple { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.theme-blue { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
.theme-green { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); }
.theme-orange { background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); }
.theme-dark { background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); }
.theme-sunset { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
.theme-ocean { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.theme-forest { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
.theme-fire { background: linear-gradient(135deg, #ff6b6b 0%, #ffa500 100%); }
.theme-cosmic { background: linear-gradient(135deg, #8e2de2 0%, #4a00e0 100%); }
.theme-rainbow { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%); }
/* UI Style Classes */
.ui-modern .glass-effect { backdrop-filter: blur(20px); background: rgba(255, 255, 255, 0.9); border-radius: 16px; }
.ui-classic .glass-effect { background: rgba(255, 255, 255, 0.95); border-radius: 8px; border: 1px solid rgba(0, 0, 0, 0.1); }
.ui-neon .glass-effect { background: rgba(0, 0, 0, 0.8); border: 2px solid #00ffff; border-radius: 12px; color: #00ffff; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
.ui-minimal .glass-effect { background: rgba(255, 255, 255, 0.95); border-radius: 20px; border: none; }
.ui-retro .glass-effect { background: rgba(255, 255, 255, 0.9); border-radius: 4px; border: 3px solid #000; box-shadow: 8px 8px 0 rgba(0, 0, 0, 0.2); }
.ui-soft .glass-effect { background: rgba(255, 255, 255, 0.85); border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.5); }
.ui-neon .text-gray-900 { color: #00ffff !important; }
.ui-neon .text-gray-700 { color: #ffffff !important; }
.ui-neon .text-gray-600 { color: #cccccc !important; }
.ui-neon .bg-gray-100 { background: rgba(0, 255, 255, 0.2) !important; }
.ui-neon .bg-white { background: rgba(0, 0, 0, 0.5) !important; }
.ui-neon .bg-blue-100 { background: rgba(0, 255, 255, 0.3) !important; }
.ui-neon .bg-red-100 { background: rgba(255, 0, 255, 0.3) !important; }
.ui-retro .text-gray-900 { color: #000 !important; font-weight: bold; }
.ui-retro .text-gray-700 { color: #333 !important; font-weight: bold; }
.ui-retro .bg-gray-100 { background: #f0f0f0 !important; border: 2px solid #000; }
.glass-effect { backdrop-filter: blur(20px); background: rgba(255, 255, 255, 0.9); }
.cell-hover { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
.cell-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); }
@keyframes gameEnter { to { opacity: 1; transform: translateY(0); } }
@keyframes cellEnter { to { opacity: 1; transform: scale(1); } }
@keyframes markAppear { 0% { opacity: 0; transform: scale(0) rotate(180deg); } 100% { opacity: 1; transform: scale(1) rotate(0deg); } }
@keyframes winningPulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); } 50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); } }
@keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
@keyframes thinking { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
.icon-preview { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.theme-preview { width: 32px; height: 32px; border-radius: 8px; }
.customization-panel { max-height: 0; opacity: 0; overflow: hidden; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
.customization-panel.open { max-height: 800px; opacity: 1; }
.customize-btn-open { background: rgba(255, 255, 255, 0.3) !important; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15); }
.section-divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(0, 0, 0, 0.1), transparent); margin: 1.5rem 0; }
</style></head>
<body class="min-h-screen theme-purple ui-modern p-4 flex items-center justify-center" id="gameBody">
    <div class="absolute inset-0 bg-gradient-to-br from-purple-50/20 to-blue-50/20" id="overlay"></div>
    
    <div class="relative max-w-lg w-full">
        <!-- Header -->
        <div class="text-center mb-6 game-enter" style="animation-delay: 0.1s;">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-white/20 rounded-2xl mb-4 float-animation">
                <i data-lucide="grid-3x3" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-4xl font-semibold text-white tracking-tight mb-2">Tic Tac Toe Pro</h1>
            <p class="text-white/80">Customize your game and challenge yourself!</p>
        </div>

        <!-- Customization Button -->
        <div class="flex justify-center mb-6 game-enter" style="animation-delay: 0.15s;">
            <button id="customizeBtn" class="bg-white/20 text-white px-6 py-3 rounded-xl hover:bg-white/30 transition-all duration-200 flex items-center gap-2 border border-white/30 font-medium">
                <i data-lucide="palette" class="w-5 h-5"></i>
                <span id="customizeBtnText">Customize Game</span>
                <i data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200" id="customizeChevron"></i>
            </button>
        </div>

        <!-- Customization Panel -->
        <div id="customizationPanel" class="customization-panel glass-effect border border-white/20 rounded-2xl p-6 mb-6 game-enter" style="animation-delay: 0.2s;">
            <!-- Icons Section -->
            <div class="mb-6">
                <div class="flex items-center gap-2 mb-4">
                    <i data-lucide="shapes" class="w-5 h-5 text-gray-700"></i>
                    <h3 class="text-lg font-semibold text-gray-900">Game Icons</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-3">Player X Icon</label>
                        <div class="grid grid-cols-4 gap-2">
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-blue-100 transition-colors" data-player="x" data-icon="x">
                                <div class="icon-preview"><i data-lucide="x" class="w-5 h-5 text-blue-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-blue-100 transition-colors" data-player="x" data-icon="star">
                                <div class="icon-preview"><i data-lucide="star" class="w-5 h-5 text-blue-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-blue-100 transition-colors" data-player="x" data-icon="heart">
                                <div class="icon-preview"><i data-lucide="heart" class="w-5 h-5 text-blue-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-blue-100 transition-colors" data-player="x" data-icon="diamond">
                                <div class="icon-preview"><i data-lucide="diamond" class="w-5 h-5 text-blue-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-blue-100 transition-colors" data-player="x" data-icon="zap">
                                <div class="icon-preview"><i data-lucide="zap" class="w-5 h-5 text-blue-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-blue-100 transition-colors" data-player="x" data-icon="crown">
                                <div class="icon-preview"><i data-lucide="crown" class="w-5 h-5 text-blue-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-blue-100 transition-colors" data-player="x" data-icon="flame">
                                <div class="icon-preview"><i data-lucide="flame" class="w-5 h-5 text-blue-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-blue-100 transition-colors" data-player="x" data-icon="sword">
                                <div class="icon-preview"><i data-lucide="sword" class="w-5 h-5 text-blue-600"></i></div>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-3">Player O Icon</label>
                        <div class="grid grid-cols-4 gap-2">
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-red-100 transition-colors" data-player="o" data-icon="circle">
                                <div class="icon-preview"><i data-lucide="circle" class="w-5 h-5 text-red-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-red-100 transition-colors" data-player="o" data-icon="square">
                                <div class="icon-preview"><i data-lucide="square" class="w-5 h-5 text-red-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-red-100 transition-colors" data-player="o" data-icon="triangle">
                                <div class="icon-preview"><i data-lucide="triangle" class="w-5 h-5 text-red-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-red-100 transition-colors" data-player="o" data-icon="hexagon">
                                <div class="icon-preview"><i data-lucide="hexagon" class="w-5 h-5 text-red-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-red-100 transition-colors" data-player="o" data-icon="moon">
                                <div class="icon-preview"><i data-lucide="moon" class="w-5 h-5 text-red-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-red-100 transition-colors" data-player="o" data-icon="sun">
                                <div class="icon-preview"><i data-lucide="sun" class="w-5 h-5 text-red-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-red-100 transition-colors" data-player="o" data-icon="shield">
                                <div class="icon-preview"><i data-lucide="shield" class="w-5 h-5 text-red-600"></i></div>
                            </button>
                            <button class="icon-btn p-3 rounded-lg bg-gray-100 hover:bg-red-100 transition-colors" data-player="o" data-icon="gem">
                                <div class="icon-preview"><i data-lucide="gem" class="w-5 h-5 text-red-600"></i></div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section-divider"></div>

            <!-- Background Theme Section -->
            <div class="mb-6">
                <div class="flex items-center gap-2 mb-4">
                    <i data-lucide="image" class="w-5 h-5 text-gray-700"></i>
                    <h3 class="text-lg font-semibold text-gray-900">Background Theme</h3>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <button class="theme-btn flex items-center gap-3 p-3 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors" data-theme="purple">
                        <div class="theme-preview theme-purple border-2 border-white shadow-sm"></div>
                        <span class="text-sm font-medium">Purple Dream</span>
                    </button>
                    <button class="theme-btn flex items-center gap-3 p-3 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors" data-theme="blue">
                        <div class="theme-preview theme-blue border-2 border-white shadow-sm"></div>
                        <span class="text-sm font-medium">Ocean Blue</span>
                    </button>
                    <button class="theme-btn flex items-center gap-3 p-3 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors" data-theme="green">
                        <div class="theme-preview theme-green border-2 border-white shadow-sm"></div>
                        <span class="text-sm font-medium">Forest Green</span>
                    </button>
                    <button class="theme-btn flex items-center gap-3 p-3 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors" data-theme="orange">
                        <div class="theme-preview theme-orange border-2 border-white shadow-sm"></div>
                        <span class="text-sm font-medium">Sunset Orange</span>
                    </button>
                    <button class="theme-btn flex items-center gap-3 p-3 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors" data-theme="dark">
                        <div class="theme-preview theme-dark border-2 border-white shadow-sm"></div>
                        <span class="text-sm font-medium">Dark Night</span>
                    </button>
                    <button class="theme-btn flex items-center gap-3 p-3 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors" data-theme="sunset">
                        <div class="theme-preview theme-sunset border-2 border-white shadow-sm"></div>
                        <span class="text-sm font-medium">Pink Sunset</span>
                    </button>
                    <button class="theme-btn flex items-center gap-3 p-3 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors" data-theme="fire">
                        <div class="theme-preview theme-fire border-2 border-white shadow-sm"></div>
                        <span class="text-sm font-medium">Fire Red</span>
                    </button>
                    <button class="theme-btn flex items-center gap-3 p-3 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors" data-theme="cosmic">
                        <div class="theme-preview theme-cosmic border-2 border-white shadow-sm"></div>
                        <span class="text-sm font-medium">Cosmic Purple</span>
                    </button>
                    <button class="theme-btn flex items-center gap-3 p-3 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors" data-theme="forest">
                        <div class="theme-preview theme-forest border-2 border-white shadow-sm"></div>
                        <span class="text-sm font-medium">Emerald Forest</span>
                    </button>
                </div>
            </div>

            <div class="section-divider"></div>

            <!-- UI Style Section -->
            <div>
                <div class="flex items-center gap-2 mb-4">
                    <i data-lucide="layout" class="w-5 h-5 text-gray-700"></i>
                    <h3 class="text-lg font-semibold text-gray-900">Interface Style</h3>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <button class="ui-style-btn p-4 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors text-left" data-ui="modern">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                                <i data-lucide="sparkles" class="w-4 h-4 text-white"></i>
                            </div>
                            <div>
                                <div class="text-sm font-semibold">Modern Glass</div>
                                <div class="text-xs text-gray-600">Sleek and contemporary design</div>
                            </div>
                        </div>
                    </button>
                    <button class="ui-style-btn p-4 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors text-left" data-ui="classic">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-gray-600 rounded-lg flex items-center justify-center">
                                <i data-lucide="square" class="w-4 h-4 text-white"></i>
                            </div>
                            <div>
                                <div class="text-sm font-semibold">Classic Clean</div>
                                <div class="text-xs text-gray-600">Traditional and professional</div>
                            </div>
                        </div>
                    </button>
                    <button class="ui-style-btn p-4 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors text-left" data-ui="neon">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center border border-cyan-400">
                                <i data-lucide="zap" class="w-4 h-4 text-cyan-400"></i>
                            </div>
                            <div>
                                <div class="text-sm font-semibold">Neon Cyber</div>
                                <div class="text-xs text-gray-600">Futuristic glowing interface</div>
                            </div>
                        </div>
                    </button>
                    <button class="ui-style-btn p-4 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors text-left" data-ui="minimal">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center border border-gray-300">
                                <i data-lucide="minimize" class="w-4 h-4 text-gray-600"></i>
                            </div>
                            <div>
                                <div class="text-sm font-semibold">Minimal</div>
                                <div class="text-xs text-gray-600">Simple and elegant</div>
                            </div>
                        </div>
                    </button>
                    <button class="ui-style-btn p-4 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors text-left" data-ui="retro">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-yellow-400 rounded-lg flex items-center justify-center border-2 border-black">
                                <i data-lucide="gamepad-2" class="w-4 h-4 text-black"></i>
                            </div>
                            <div>
                                <div class="text-sm font-semibold">Retro Gaming</div>
                                <div class="text-xs text-gray-600">Classic arcade style</div>
                            </div>
                        </div>
                    </button>
                    <button class="ui-style-btn p-4 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors text-left" data-ui="soft">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-pink-300 rounded-lg flex items-center justify-center">
                                <i data-lucide="heart" class="w-4 h-4 text-pink-600"></i>
                            </div>
                            <div>
                                <div class="text-sm font-semibold">Soft & Cozy</div>
                                <div class="text-xs text-gray-600">Warm and comfortable feel</div>
                            </div>
                        </div>
                    </button>
                </div>
            </div>
        </div>

        <!-- Game Mode Selection -->
        <div class="glass-effect border border-white/20 rounded-2xl p-6 mb-6 game-enter" style="animation-delay: 0.3s;">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-medium text-gray-900">Game Mode</h3>
                <div id="modeIndicator" class="flex items-center gap-2 text-sm text-gray-600 bg-gray-100 px-3 py-1 rounded-full">
                    <i data-lucide="users" class="w-4 h-4"></i>
                    <span>Two Players</span>
                </div>
            </div>
            <div class="flex gap-3 mb-4">
                <button id="pvpMode" class="mode-switch flex-1 px-4 py-3 text-sm font-medium rounded-xl bg-gray-900 text-white shadow-lg">
                    <i data-lucide="users" class="w-4 h-4 mr-2"></i>
                    Two Players
                </button>
                <button id="pvbMode" class="mode-switch flex-1 px-4 py-3 text-sm font-medium rounded-xl bg-gray-100 text-gray-700 hover:bg-gray-200">
                    <i data-lucide="cpu" class="w-4 h-4 mr-2"></i>
                    vs AI
                </button>
            </div>
            
            <!-- Bot Difficulty -->
            <div id="difficultySelector" class="hidden">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-sm font-medium text-gray-700">AI Difficulty</span>
                    <div class="flex items-center gap-1 text-xs text-gray-500">
                        <i data-lucide="zap" class="w-3 h-3"></i>
                        <span id="difficultyLabel">Intermediate</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button class="difficulty-btn flex-1 px-3 py-2 text-xs font-medium rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200" data-difficulty="easy">Beginner</button>
                    <button class="difficulty-btn flex-1 px-3 py-2 text-xs font-medium rounded-lg bg-blue-600 text-white shadow-lg" data-difficulty="medium">Intermediate</button>
                    <button class="difficulty-btn flex-1 px-3 py-2 text-xs font-medium rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200" data-difficulty="hard">Expert</button>
                </div>
            </div>
        </div>

        <!-- Game Status -->
        <div class="glass-effect border border-white/20 rounded-2xl p-6 mb-6 text-center game-enter" style="animation-delay: 0.4s;">
            <div id="gameStatus" class="text-xl font-medium text-gray-900 mb-4">Player X's Turn</div>
            <div id="scoreBoard" class="flex justify-center gap-8 text-sm">
                <div class="flex flex-col items-center gap-2">
                    <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center">
                        <i data-lucide="x" class="w-6 h-6 text-blue-600" id="scoreIconX"></i>
                    </div>
                    <span id="scoreX" class="text-lg font-semibold text-blue-600">0</span>
                    <span class="text-xs text-gray-500">Player X</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-12 h-12 bg-gray-100 rounded-xl flex items-center justify-center">
                        <i data-lucide="equal" class="w-6 h-6 text-gray-600"></i>
                    </div>
                    <span id="scoreTies" class="text-lg font-semibold text-gray-600">0</span>
                    <span class="text-xs text-gray-500">Draws</span>
                </div>
                <div class="flex flex-col items-center gap-2">
                    <div class="w-12 h-12 bg-red-100 rounded-xl flex items-center justify-center">
                        <i data-lucide="circle" class="w-6 h-6 text-red-600" id="scoreIconO"></i>
                    </div>
                    <span id="scoreO" class="text-lg font-semibold text-red-600">0</span>
                    <span class="text-xs text-gray-500">Player O</span>
                </div>
            </div>
        </div>

        <!-- Game Board -->
        <div class="glass-effect border border-white/20 rounded-2xl p-6 mb-6 game-enter" style="animation-delay: 0.5s;">
            <div id="gameBoard" class="grid grid-cols-3 gap-3 aspect-square">
                <button class="cell-btn aspect-square bg-white/50 rounded-xl border-2 border-transparent hover:border-white/40 transition-all duration-200 flex items-center justify-center text-4xl font-bold cell-hover cell-enter" data-cell="0" style="animation-delay: 0.1s;"></button>
                <button class="cell-btn aspect-square bg-white/50 rounded-xl border-2 border-transparent hover:border-white/40 transition-all duration-200 flex items-center justify-center text-4xl font-bold cell-hover cell-enter" data-cell="1" style="animation-delay: 0.15s;"></button>
                <button class="cell-btn aspect-square bg-white/50 rounded-xl border-2 border-transparent hover:border-white/40 transition-all duration-200 flex items-center justify-center text-4xl font-bold cell-hover cell-enter" data-cell="2" style="animation-delay: 0.2s;"></button>
                <button class="cell-btn aspect-square bg-white/50 rounded-xl border-2 border-transparent hover:border-white/40 transition-all duration-200 flex items-center justify-center text-4xl font-bold cell-hover cell-enter" data-cell="3" style="animation-delay: 0.25s;"></button>
                <button class="cell-btn aspect-square bg-white/50 rounded-xl border-2 border-transparent hover:border-white/40 transition-all duration-200 flex items-center justify-center text-4xl font-bold cell-hover cell-enter" data-cell="4" style="animation-delay: 0.3s;"></button>
                <button class="cell-btn aspect-square bg-white/50 rounded-xl border-2 border-transparent hover:border-white/40 transition-all duration-200 flex items-center justify-center text-4xl font-bold cell-hover cell-enter" data-cell="5" style="animation-delay: 0.35s;"></button>
                <button class="cell-btn aspect-square bg-white/50 rounded-xl border-2 border-transparent hover:border-white/40 transition-all duration-200 flex items-center justify-center text-4xl font-bold cell-hover cell-enter" data-cell="6" style="animation-delay: 0.4s;"></button>
                <button class="cell-btn aspect-square bg-white/50 rounded-xl border-2 border-transparent hover:border-white/40 transition-all duration-200 flex items-center justify-center text-4xl font-bold cell-hover cell-enter" data-cell="7" style="animation-delay: 0.45s;"></button>
                <button class="cell-btn aspect-square bg-white/50 rounded-xl border-2 border-transparent hover:border-white/40 transition-all duration-200 flex items-center justify-center text-4xl font-bold cell-hover cell-enter" data-cell="8" style="animation-delay: 0.5s;"></button>
            </div>
        </div>

        <!-- Game Controls -->
        <div class="flex gap-3 game-enter" style="animation-delay: 0.6s;">
            <button id="resetBtn" class="flex-1 bg-white/20 text-white px-6 py-3 rounded-xl hover:bg-white/30 transition-all duration-200 flex items-center justify-center gap-2 border border-white/30 font-medium">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                New Game
            </button>
            <button id="resetScoreBtn" class="bg-white/20 text-white px-6 py-3 rounded-xl hover:bg-white/30 transition-all duration-200 flex items-center justify-center gap-2 border border-white/30 font-medium">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                Reset Score
            </button>
        </div>
    </div>

    <script>
        // Game state
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let gameMode = 'pvp';
        let difficulty = 'medium';
        let scores = { X: 0, O: 0, ties: 0 };
        let playerIcons = { X: 'x', O: 'circle' };
        let isThinking = false;

        // Initialize Lucide icons
        lucide.createIcons();

        // Game logic
        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // columns
            [0, 4, 8], [2, 4, 6] // diagonals
        ];

        // DOM elements
        const gameBoard = document.getElementById('gameBoard');
        const gameStatus = document.getElementById('gameStatus');
        const resetBtn = document.getElementById('resetBtn');
        const resetScoreBtn = document.getElementById('resetScoreBtn');
        const pvpMode = document.getElementById('pvpMode');
        const pvbMode = document.getElementById('pvbMode');
        const difficultySelector = document.getElementById('difficultySelector');
        const customizeBtn = document.getElementById('customizeBtn');
        const customizationPanel = document.getElementById('customizationPanel');
        const customizeChevron = document.getElementById('customizeChevron');
        const customizeBtnText = document.getElementById('customizeBtnText');

        // Event listeners
        gameBoard.addEventListener('click', handleCellClick);
        resetBtn.addEventListener('click', resetGame);
        resetScoreBtn.addEventListener('click', resetScore);
        pvpMode.addEventListener('click', () => setGameMode('pvp'));
        pvbMode.addEventListener('click', () => setGameMode('pvb'));
        customizeBtn.addEventListener('click', toggleCustomization);

        // Difficulty buttons
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                difficulty = e.target.dataset.difficulty;
                document.querySelectorAll('.difficulty-btn').forEach(b => {
                    b.classList.remove('bg-blue-600', 'text-white', 'shadow-lg');
                    b.classList.add('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
                });
                e.target.classList.add('bg-blue-600', 'text-white', 'shadow-lg');
                e.target.classList.remove('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
                document.getElementById('difficultyLabel').textContent = 
                    difficulty === 'easy' ? 'Beginner' : difficulty === 'medium' ? 'Intermediate' : 'Expert';
            });
        });

        // Icon selection
        document.querySelectorAll('.icon-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const player = e.currentTarget.dataset.player.toUpperCase();
                const icon = e.currentTarget.dataset.icon;
                playerIcons[player] = icon;
                
                // Update visual feedback
                document.querySelectorAll(`.icon-btn[data-player="${player.toLowerCase()}"]`).forEach(b => {
                    b.classList.remove('bg-blue-100', 'bg-red-100', 'ring-2', 'ring-blue-500', 'ring-red-500');
                    b.classList.add('bg-gray-100');
                });
                
                const colorClass = player === 'X' ? 'bg-blue-100' : 'bg-red-100';
                const ringClass = player === 'X' ? 'ring-blue-500' : 'ring-red-500';
                e.currentTarget.classList.add(colorClass, 'ring-2', ringClass);
                
                // Update score board icons
                const scoreIcon = document.getElementById(`scoreIcon${player}`);
                scoreIcon.setAttribute('data-lucide', icon);
                lucide.createIcons();
                
                updateGameDisplay();
            });
        });

        // Theme selection
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const theme = e.currentTarget.dataset.theme;
                const body = document.getElementById('gameBody');
                
                // Remove all theme classes
                body.classList.remove('theme-purple', 'theme-blue', 'theme-green', 'theme-orange', 'theme-dark', 'theme-sunset', 'theme-fire', 'theme-cosmic', 'theme-forest');
                body.classList.add(`theme-${theme}`);
                
                // Update visual feedback
                document.querySelectorAll('.theme-btn').forEach(b => {
                    b.classList.remove('bg-blue-200', 'ring-2', 'ring-blue-500');
                    b.classList.add('bg-gray-100');
                });
                e.currentTarget.classList.add('bg-blue-200', 'ring-2', 'ring-blue-500');
                e.currentTarget.classList.remove('bg-gray-100');
            });
        });

        // UI style selection
        document.querySelectorAll('.ui-style-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const ui = e.currentTarget.dataset.ui;
                const body = document.getElementById('gameBody');
                
                // Remove all UI classes
                body.classList.remove('ui-modern', 'ui-classic', 'ui-neon', 'ui-minimal', 'ui-retro', 'ui-soft');
                body.classList.add(`ui-${ui}`);
                
                // Update visual feedback
                document.querySelectorAll('.ui-style-btn').forEach(b => {
                    b.classList.remove('bg-blue-200', 'ring-2', 'ring-blue-500');
                    b.classList.add('bg-gray-100');
                });
                e.currentTarget.classList.add('bg-blue-200', 'ring-2', 'ring-blue-500');
                e.currentTarget.classList.remove('bg-gray-100');
            });
        });

        // Functions
        function toggleCustomization() {
            const panel = document.getElementById('customizationPanel');
            const chevron = document.getElementById('customizeChevron');
            const btnText = document.getElementById('customizeBtnText');
            const btn = document.getElementById('customizeBtn');
            
            if (panel.classList.contains('open')) {
                panel.classList.remove('open');
                chevron.style.transform = 'rotate(0deg)';
                btnText.textContent = 'Customize Game';
                btn.classList.remove('customize-btn-open');
            } else {
                panel.classList.add('open');
                chevron.style.transform = 'rotate(180deg)';
                btnText.textContent = 'Hide Customization';
                btn.classList.add('customize-btn-open');
            }
        }

        function setGameMode(mode) {
            gameMode = mode;
            
            if (mode === 'pvp') {
                pvpMode.classList.add('bg-gray-900', 'text-white', 'shadow-lg');
                pvpMode.classList.remove('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
                pvbMode.classList.remove('bg-gray-900', 'text-white', 'shadow-lg');
                pvbMode.classList.add('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
                difficultySelector.classList.add('hidden');
                document.getElementById('modeIndicator').innerHTML = '<i data-lucide="users" class="w-4 h-4"></i><span>Two Players</span>';
            } else {
                pvbMode.classList.add('bg-gray-900', 'text-white', 'shadow-lg');
                pvbMode.classList.remove('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
                pvpMode.classList.remove('bg-gray-900', 'text-white', 'shadow-lg');
                pvpMode.classList.add('bg-gray-100', 'text-gray-700', 'hover:bg-gray-200');
                difficultySelector.classList.remove('hidden');
                document.getElementById('modeIndicator').innerHTML = '<i data-lucide="cpu" class="w-4 h-4"></i><span>vs AI</span>';
            }
            
            lucide.createIcons();
            resetGame();
        }

        function handleCellClick(e) {
            const cell = e.target;
            const cellIndex = parseInt(cell.dataset.cell);
            
            if (!cell.classList.contains('cell-btn') || board[cellIndex] !== '' || !gameActive || isThinking) {
                return;
            }
            
            makeMove(cellIndex, currentPlayer);
            
            if (gameMode === 'pvb' && gameActive && currentPlayer === 'O') {
                isThinking = true;
                gameStatus.innerHTML = `<div class="flex items-center justify-center gap-2">
                    <i data-lucide="cpu" class="w-5 h-5"></i>
                    <span class="thinking-dots">AI is thinking</span>
                </div>`;
                lucide.createIcons();
                
                setTimeout(() => {
                    const botMove = getBotMove();
                    makeMove(botMove, 'O');
                    isThinking = false;
                }, 1000);
            }
        }

        function makeMove(cellIndex, player) {
            board[cellIndex] = player;
            const cell = document.querySelector(`[data-cell="${cellIndex}"]`);
            
            // Create icon element
            const icon = document.createElement('i');
            icon.setAttribute('data-lucide', playerIcons[player]);
            icon.className = `w-8 h-8 ${player === 'X' ? 'text-blue-600' : 'text-red-600'} mark-appear`;
            
            cell.appendChild(icon);
            cell.disabled = true;
            cell.classList.add('pointer-events-none');
            
            lucide.createIcons();
            
            if (checkWinner()) {
                gameActive = false;
                scores[player]++;
                updateScoreboard();
                gameStatus.innerHTML = `<div class="flex items-center justify-center gap-2">
                    <i data-lucide="trophy" class="w-5 h-5 text-yellow-500"></i>
                    <span>Player ${player} Wins!</span>
                </div>`;
                highlightWinningCells();
            } else if (board.every(cell => cell !== '')) {
                gameActive = false;
                scores.ties++;
                updateScoreboard();
                gameStatus.innerHTML = `<div class="flex items-center justify-center gap-2">
                    <i data-lucide="equal" class="w-5 h-5 text-gray-500"></i>
                    <span>It's a Draw!</span>
                </div>`;
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateGameDisplay();
            }
            
            lucide.createIcons();
        }

        function checkWinner() {
            return winningConditions.some(condition => {
                const [a, b, c] = condition;
                return board[a] && board[a] === board[b] && board[a] === board[c];
            });
        }

        function highlightWinningCells() {
            winningConditions.forEach(condition => {
                const [a, b, c] = condition;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    document.querySelector(`[data-cell="${a}"]`).classList.add('winning-pulse');
                    document.querySelector(`[data-cell="${b}"]`).classList.add('winning-pulse');
                    document.querySelector(`[data-cell="${c}"]`).classList.add('winning-pulse');
                }
            });
        }

        function getBotMove() {
            if (difficulty === 'easy') {
                return getRandomMove();
            } else if (difficulty === 'medium') {
                return Math.random() < 0.7 ? getBestMove() : getRandomMove();
            } else {
                return getBestMove();
            }
        }

        function getRandomMove() {
            const availableMoves = board.map((cell, index) => cell === '' ? index : null).filter(val => val !== null);
            return availableMoves[Math.floor(Math.random() * availableMoves.length)];
        }

        function getBestMove() {
            // Simple minimax implementation
            let bestScore = -Infinity;
            let bestMove;
            
            for (let i = 0; i < board.length; i++) {
                if (board[i] === '') {
                    board[i] = 'O';
                    let score = minimax(board, 0, false);
                    board[i] = '';
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = i;
                    }
                }
            }
            
            return bestMove;
        }

        function minimax(board, depth, isMaximizing) {
            const winner = checkWinnerForMinimax();
            if (winner === 'O') return 10 - depth;
            if (winner === 'X') return depth - 10;
            if (board.every(cell => cell !== '')) return 0;
            
            if (isMaximizing) {
                let bestScore = -Infinity;
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = 'O';
                        let score = minimax(board, depth + 1, false);
                        board[i] = '';
                        bestScore = Math.max(score, bestScore);
                    }
                }
                return bestScore;
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < board.length; i++) {
                    if (board[i] === '') {
                        board[i] = 'X';
                        let score = minimax(board, depth + 1, true);
                        board[i] = '';
                        bestScore = Math.min(score, bestScore);
                    }
                }
                return bestScore;
            }
        }

        function checkWinnerForMinimax() {
            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a];
                }
            }
            return null;
        }

        function updateGameDisplay() {
            if (gameActive) {
                if (gameMode === 'pvb' && currentPlayer === 'O') {
                    gameStatus.innerHTML = `<div class="flex items-center justify-center gap-2">
                        <i data-lucide="cpu" class="w-5 h-5"></i>
                        <span>AI's Turn</span>
                    </div>`;
                } else {
                    gameStatus.innerHTML = `<div class="flex items-center justify-center gap-2">
                        <i data-lucide="${playerIcons[currentPlayer]}" class="w-5 h-5 ${currentPlayer === 'X' ? 'text-blue-600' : 'text-red-600'}"></i>
                        <span>Player ${currentPlayer}'s Turn</span>
                    </div>`;
                }
                lucide.createIcons();
            }
        }

        function updateScoreboard() {
            document.getElementById('scoreX').textContent = scores.X;
            document.getElementById('scoreO').textContent = scores.O;
            document.getElementById('scoreTies').textContent = scores.ties;
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            isThinking = false;
            
            document.querySelectorAll('.cell-btn').forEach(cell => {
                cell.innerHTML = '';
                cell.disabled = false;
                cell.classList.remove('pointer-events-none', 'winning-pulse');
            });
            
            updateGameDisplay();
        }

        function resetScore() {
            scores = { X: 0, O: 0, ties: 0 };
            updateScoreboard();
            resetGame();
        }

        // Initialize default selections
        document.querySelector('.icon-btn[data-player="x"][data-icon="x"]').classList.add('bg-blue-100', 'ring-2', 'ring-blue-500');
        document.querySelector('.icon-btn[data-player="o"][data-icon="circle"]').classList.add('bg-red-100', 'ring-2', 'ring-red-500');
        document.querySelector('.theme-btn[data-theme="purple"]').classList.add('bg-blue-200', 'ring-2', 'ring-blue-500');
        document.querySelector('.ui-style-btn[data-ui="modern"]').classList.add('bg-blue-200', 'ring-2', 'ring-blue-500');
        
        // Initialize game
        updateGameDisplay();
        lucide.createIcons();
    </script>
</body>
</html>
