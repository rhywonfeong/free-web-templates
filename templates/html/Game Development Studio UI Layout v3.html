<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}
</script>
<meta charset="UTF-8">
<title>Roblox Studio Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:'Inter',sans-serif;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;}}
.fade-in{animation:fadeIn .45s ease forwards;}
details summary svg{transition:transform .2s;}
details[open] summary svg{transform:rotate(90deg);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:#f4f4f5;}
::-webkit-scrollbar-thumb{background:#d4d4d8;border-radius:6px;}
</style></head>

<body class="bg-gray-100 text-gray-800 flex flex-col h-screen">

<!-- ── Title Bar ─────────────────────────────────────────────────────────── -->
<div class="h-10 flex items-center px-4 border-b border-gray-200 bg-white select-none fade-in">
  <span class="font-semibold tracking-tight text-base text-blue-600 mr-6">Roblox Studio</span>
  <span class="text-sm text-gray-500">[GameName].rbxl</span>
</div>

<!-- ── Ribbon Tabs ───────────────────────────────────────────────────────── -->
<div class="border-b border-gray-200 bg-gray-50 fade-in" style="animation-delay:.05s">
  <!-- Tabs -->
  <div class="flex space-x-2 px-4 h-9 items-end">
    <button data-tab="home" class="tabBtn px-3 pb-1 text-sm border-b-2 border-blue-600 font-medium text-gray-900">Home</button>
    <button data-tab="model" class="tabBtn px-3 pb-1 text-sm text-gray-600 hover:text-gray-900">Model</button>
    <button data-tab="test"  class="tabBtn px-3 pb-1 text-sm text-gray-600 hover:text-gray-900">Test</button>
    <button data-tab="view"  class="tabBtn px-3 pb-1 text-sm text-gray-600 hover:text-gray-900">View</button>
  </div>
  <!-- Ribbon Content -->
  <div class="ribbon-panel px-4 py-2 grid grid-cols-3 gap-6 text-xs">
    <!-- Group: Tools -->
    <div>
      <div class="flex space-x-2">
        <button title="Select" class="flex flex-col items-center w-16 py-1 hover:bg-gray-200 rounded">
          <i data-lucide="mouse-pointer" class="w-5 h-5 text-gray-700"></i><span>Select</span>
        </button>
        <button title="Move" class="flex flex-col items-center w-16 py-1 hover:bg-gray-200 rounded">
          <i data-lucide="move" class="w-5 h-5 text-gray-700"></i><span>Move</span>
        </button>
        <button title="Scale" class="flex flex-col items-center w-16 py-1 hover:bg-gray-200 rounded">
          <i data-lucide="expand" class="w-5 h-5 text-gray-700"></i><span>Scale</span>
        </button>
        <button title="Rotate" class="flex flex-col items-center w-16 py-1 hover:bg-gray-200 rounded">
          <i data-lucide="rotate-ccw" class="w-5 h-5 text-gray-700"></i><span>Rotate</span>
        </button>
      </div>
      <p class="mt-1 text-gray-500 text-center">Tools</p>
    </div>

    <!-- Group: Insert -->
    <div>
      <div class="flex space-x-2">
        <button title="Part" class="flex flex-col items-center w-16 py-1 hover:bg-gray-200 rounded">
          <i data-lucide="square" class="w-5 h-5 text-gray-700"></i><span>Part</span>
        </button>
        <button title="Model" class="flex flex-col items-center w-16 py-1 hover:bg-gray-200 rounded">
          <i data-lucide="package" class="w-5 h-5 text-gray-700"></i><span>Model</span>
        </button>
        <button title="UI" class="flex flex-col items-center w-16 py-1 hover:bg-gray-200 rounded">
          <i data-lucide="layout" class="w-5 h-5 text-gray-700"></i><span>UI</span>
        </button>
      </div>
      <p class="mt-1 text-gray-500 text-center">Insert</p>
    </div>

    <!-- Group: Clipboard -->
    <div>
      <div class="flex space-x-2">
        <button title="Cut" class="flex flex-col items-center w-16 py-1 hover:bg-gray-200 rounded">
          <i data-lucide="scissors" class="w-5 h-5 text-gray-700"></i><span>Cut</span>
        </button>
        <button title="Copy" class="flex flex-col items-center w-16 py-1 hover:bg-gray-200 rounded">
          <i data-lucide="copy" class="w-5 h-5 text-gray-700"></i><span>Copy</span>
        </button>
        <button title="Paste" class="flex flex-col items-center w-16 py-1 hover:bg-gray-200 rounded">
          <i data-lucide="clipboard" class="w-5 h-5 text-gray-700"></i><span>Paste</span>
        </button>
      </div>
      <p class="mt-1 text-gray-500 text-center">Clipboard</p>
    </div>
  </div>
</div>

<!-- ── Main Area ─────────────────────────────────────────────────────────── -->
<div class="flex flex-1 overflow-hidden">

  <!-- Explorer Sidebar -->
  <aside class="bg-white w-64 border-r border-gray-200 flex-col hidden md:flex fade-in" style="animation-delay:.1s">
    <div class="h-9 flex items-center px-3 border-b border-gray-200">
      <span class="uppercase text-xs tracking-wide text-gray-500">Explorer</span>
    </div>
    <nav class="flex-1 overflow-y-auto text-sm py-2">
      <details open class="px-2">
        <summary class="flex items-center gap-1 cursor-pointer py-1">
          <i data-lucide="chevron-right" class="w-3 h-3"></i><span>Game</span>
        </summary>
        <div class="pl-4">
          <details open>
            <summary class="flex items-center gap-1 cursor-pointer py-1">
              <i data-lucide="chevron-right" class="w-3 h-3"></i><span>Workspace</span>
            </summary>
            <div class="pl-4">
              <button data-object="part" class="flex items-center gap-1 py-1 w-full text-left hover:bg-blue-50 rounded">
                <i data-lucide="square" class="w-3 h-3"></i><span>Part</span>
              </button>
              <button class="flex items-center gap-1 py-1 w-full text-left hover:bg-blue-50 rounded">
                <i data-lucide="camera" class="w-3 h-3"></i><span>Camera</span>
              </button>
            </div>
          </details>
          <button class="flex items-center gap-1 py-1 w-full text-left hover:bg-blue-50 rounded">
            <i data-lucide="users" class="w-3 h-3"></i><span>Players</span>
          </button>
          <button class="flex items-center gap-1 py-1 w-full text-left hover:bg-blue-50 rounded">
            <i data-lucide="monitor" class="w-3 h-3"></i><span>StarterGui</span>
          </button>
          <button class="flex items-center gap-1 py-1 w-full text-left hover:bg-blue-50 rounded">
            <i data-lucide="archive" class="w-3 h-3"></i><span>ReplicatedStorage</span>
          </button>
        </div>
      </details>
    </nav>
  </aside>

  <!-- Viewport -->
  <main class="flex-1 relative">
    <canvas id="scene" class="w-full h-full bg-white"></canvas>

    <!-- Status Bar -->
    <div class="absolute bottom-0 inset-x-0 h-8 bg-gray-50 border-t border-gray-200 flex items-center text-xs px-4">
      <span class="mr-4">Memory: <span id="memory">0</span> MB</span>
      <span>FPS: <span id="fps">0</span></span>
    </div>
  </main>

  <!-- Properties Sidebar -->
  <aside class="bg-white w-80 border-l border-gray-200 flex-col hidden lg:flex fade-in" style="animation-delay:.1s">
    <div class="h-9 flex items-center px-3 border-b border-gray-200">
      <span class="uppercase text-xs tracking-wide text-gray-500">Properties</span>
    </div>
    <div class="flex-1 overflow-y-auto px-4 py-4 space-y-5 text-sm">

      <div>
        <label class="block text-xs mb-1 text-gray-500">Name</label>
        <input id="propName" class="w-full bg-white border border-gray-300 rounded px-2 py-1 focus:outline-none focus:border-blue-500" value="Part">
      </div>

      <div>
        <label class="block text-xs mb-1 text-gray-500">Color</label>
        <input id="propColor" type="color" class="w-full h-10 p-0 bg-white border border-gray-300 rounded">
      </div>

      <div>
        <label class="block text-xs mb-1 text-gray-500">Position (X, Y, Z)</label>
        <div class="grid grid-cols-3 gap-2">
          <input id="posX" type="number" step=".1" class="bg-white border border-gray-300 rounded px-2 py-1">
          <input id="posY" type="number" step=".1" class="bg-white border border-gray-300 rounded px-2 py-1">
          <input id="posZ" type="number" step=".1" class="bg-white border border-gray-300 rounded px-2 py-1">
        </div>
      </div>

      <div>
        <h2 class="text-sm font-semibold tracking-tight text-gray-700 mb-2">Performance</h2>
        <div class="bg-gray-50 border border-gray-200 rounded p-3">
          <canvas id="fpsChart"></canvas>
        </div>
      </div>

    </div>
  </aside>
</div>

<!-- ── Scripts ───────────────────────────────────────────────────────────── -->
<script>
document.addEventListener('DOMContentLoaded',()=>{lucide.createIcons({strokeWidth:1.5});});

/* THREE.JS SETUP */
let scene=new THREE.Scene();scene.background=new THREE.Color(0xf9fafb);
let camera=new THREE.PerspectiveCamera(60,1,0.1,1000);camera.position.set(3,2,4);camera.lookAt(0,0,0);
let renderer=new THREE.WebGLRenderer({canvas:document.getElementById('scene'),antialias:true});
renderer.setPixelRatio(devicePixelRatio);resize();window.addEventListener('resize',resize);
function resize(){
  const rect=renderer.domElement.parentElement.getBoundingClientRect();
  renderer.setSize(rect.width,rect.height);
  camera.aspect=rect.width/rect.height;
  camera.updateProjectionMatrix();
}

/* Cube */
let geometry=new THREE.BoxGeometry();let material=new THREE.MeshStandardMaterial({color:0x00aaff});
let cube=new THREE.Mesh(geometry,material);scene.add(cube);

/* Lights */
scene.add(new THREE.AmbientLight(0xffffff,.6));let dir=new THREE.DirectionalLight(0xffffff,.6);dir.position.set(5,10,7);scene.add(dir);

/* Simple Drag Rotation */
let dragging=false,prev={x:0,y:0};
renderer.domElement.addEventListener('mousedown',e=>{dragging=true;prev.x=e.clientX;prev.y=e.clientY;});
window.addEventListener('mouseup',()=>dragging=false);
window.addEventListener('mousemove',e=>{if(!dragging)return;let dx=(e.clientX-prev.x)/200,dy=(e.clientY-prev.y)/200;prev.x=e.clientX;prev.y=e.clientY;cube.rotation.y+=dx;cube.rotation.x+=dy;});

/* Loop & FPS */
let last=performance.now(),fps=0,frames=[];
function animate(){requestAnimationFrame(animate);let now=performance.now(),delta=now-last;if(delta>0){fps=1000/delta;frames.push(fps);if(frames.length>40)frames.shift();}last=now;cube.rotation.y+=0.005;renderer.render(scene,camera);document.getElementById('fps').textContent=fps.toFixed(0);}animate();

/* FPS CHART */
const perfChart=new Chart(document.getElementById('fpsChart'),{type:'line',data:{labels:new Array(40).fill(''),datasets:[{data:new Array(40).fill(0),borderColor:'#2563eb',borderWidth:1,tension:.3,pointRadius:0}]},options:{animation:false,plugins:{legend:{display:false}},scales:{x:{display:false},y:{display:false}}}});
setInterval(()=>{perfChart.data.datasets[0].data=frames.slice();perfChart.update('none');},500);

/* MEMORY MOCK */
setInterval(()=>{document.getElementById('memory').textContent=(Math.random()*400+200).toFixed(0);},1500);

/* PROPERTY BINDING */
function syncPosInputs(){const p=cube.position;posX.value=p.x.toFixed(2);posY.value=p.y.toFixed(2);posZ.value=p.z.toFixed(2);}
syncPosInputs();
['posX','posY','posZ'].forEach(id=>document.getElementById(id).addEventListener('input',()=>cube.position.set(+posX.value||0,+posY.value||0,+posZ.value||0)));
propColor.addEventListener('input',e=>material.color.set(e.target.value));
document.querySelector('[data-object="part"]').addEventListener('click',syncPosInputs);

/* SIMPLE TAB SWITCH */
document.querySelectorAll('.tabBtn').forEach(btn=>btn.addEventListener('click',e=>{
  document.querySelectorAll('.tabBtn').forEach(b=>{b.classList.remove('border-blue-600','text-gray-900');b.classList.add('text-gray-600');});
  e.currentTarget.classList.add('border-blue-600','text-gray-900');
}));
</script>
</body>
</html>
