<meta charset="UTF-8">

<title>IOCO - Biocomputer Interface</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
body { font-family: 'Inter', sans-serif; }

<body class="bg-[#120b1e] min-h-screen flex items-center justify-center p-4 sm:p-8 text-white overflow-hidden selection:bg-pink-500 selection:text-white">

    <!-- Main Container -->
    <div class="relative w-full max-w-[1400px] aspect-[16/9] bg-[#1e1333] rounded-3xl overflow-hidden shadow-2xl border border-white/5 flex flex-col">

        <!-- Background Grid System -->
        <div class="absolute inset-0 grid grid-cols-6 pointer-events-none z-0">
            <div class="border-r border-white/5 h-full"></div>
            <div class="border-r border-white/5 h-full"></div>
            <div class="border-r border-white/5 h-full"></div>
            <div class="border-r border-white/5 h-full"></div>
            <div class="border-r border-white/5 h-full"></div>
            <div class="border-r border-white/5 h-full"></div>
        </div>

        <!-- Organic Shape / Image -->
        <div class="absolute top-0 right-0 w-3/4 h-full z-10 pointer-events-none mix-blend-screen opacity-90">
            <!-- Using an abstract fluid ink image to mimic the organic 3D shape -->
            <img src="https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2070&auto=format&fit=crop" 
                 alt="Abstract Organic Shape"

        </div>
        
        <!-- Gradient Overlay to ensure text readability -->
        <div class="absolute inset-0 bg-gradient-to-r from-[#1e1333] via-[#1e1333]/80 to-transparent z-10 pointer-events-none"></div>

        <!-- Navbar -->
        <nav class="relative z-50 flex justify-between items-center px-12 py-10 w-full">
            <div class="text-2xl font-semibold tracking-tight text-white/90">IOCO</div>
            <button class="text-white/80 hover:text-white transition-colors">
                <i data-lucide="menu" class="w-8 h-8"></i>
            </button>
        </nav>

        <!-- Main Content Area -->
        <main class="relative z-40 flex-1 flex flex-col justify-center px-12 pb-12">
            <div class="grid grid-cols-12 gap-4 h-full items-center">
                
                <!-- Left Control (Navigation Arrows) -->
                <div class="col-span-1 hidden lg:flex flex-row gap-4 items-center">
                    <button class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center text-white/40 hover:border-white/50 hover:text-white transition-all">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </button>
                    <button class="w-12 h-12 rounded-full border border-[#ff2e63] flex items-center justify-center text-white hover:bg-[#ff2e63]/10 transition-all shadow-[0_0_15px_rgba(255,46,99,0.3)]">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </div>

                <!-- Text Content -->
                <div class="col-span-12 lg:col-span-6 flex flex-col justify-center pl-0 lg:pl-10">
                    
                    <h2 class="text-xs font-medium tracking-[0.2em] text-white/70 mb-6 uppercase">
                        Hacking the cell
                    </h2>

                    <h1 class="text-6xl md:text-7xl lg:text-8xl font-semibold tracking-tight leading-[0.95] text-white mb-12">
                        Creating a <br />
                        <span class="text-white">Biocomputer</span>
                    </h1>

                    <!-- Custom Button -->
                    <div class="flex items-center">
                        <button class="group relative flex items-center gap-6 px-8 py-4 border border-[#ff2e63] bg-transparent hover:bg-[#ff2e63]/5 transition-all duration-300">
                            <span class="text-xs font-medium tracking-widest uppercase text-white group-hover:text-[#ff2e63] transition-colors">Watch Video</span>
                            <div class="relative flex items-center justify-center">
                                <i data-lucide="play" class="w-3 h-3 text-white fill-current ml-1"></i>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Right Side Spacer / Image Area -->
                <div class="col-span-4 hidden lg:block"></div>

                <!-- Right Counter -->
                <div class="col-span-1 hidden lg:flex flex-col items-center justify-center h-full pt-12">
                   <div class="flex items-baseline gap-2 relative">
                        <span class="text-3xl font-medium tracking-tight text-white border-b-2 border-white pb-2">01</span>
                        <span class="text-sm font-medium text-[#ff2e63]">/ 05</span>
                   </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons({
