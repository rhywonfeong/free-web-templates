<html lang="en">
<head><meta charset="UTF-8">

<body class="bg-[#fafafa] text-gray-900 antialiased min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 fixed inset-y-0 left-0 bg-white border-r border-gray-200 flex flex-col z-10 hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-gray-100">
            <div class="text-lg font-semibold tracking-tighter text-black flex items-center gap-2">
                <div class="w-6 h-6 bg-black rounded-md flex items-center justify-center">
                    <span class="text-white text-xs font-semibold tracking-tighter">MC</span>
                </div>
                MAILCOMP
            </div>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
            <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50 hover:text-gray-900 transition-colors">
                <iconify-icon icon="solar:home-2-linear" width="1.2em" height="1.2em" style="stroke-width: 1.5;"></iconify-icon>
                Dashboard
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium text-gray-900 bg-gray-100 rounded-md transition-colors">
                <iconify-icon icon="solar:megaphone-linear" width="1.2em" height="1.2em" style="stroke-width: 1.5;"></iconify-icon>
                Campaigns
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50 hover:text-gray-900 transition-colors">
                <iconify-icon icon="solar:users-group-rounded-linear" width="1.2em" height="1.2em" style="stroke-width: 1.5;"></iconify-icon>
                Audience
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50 hover:text-gray-900 transition-colors">
                <iconify-icon icon="solar:chart-square-linear" width="1.2em" height="1.2em" style="stroke-width: 1.5;"></iconify-icon>
                Analytics
            </a>
            <div class="pt-6 mt-6 border-t border-gray-100">
                <a href="#" class="flex items-center gap-3 px-3 py-2 text-sm font-medium text-gray-600 rounded-md hover:bg-gray-50 hover:text-gray-900 transition-colors">
                    <iconify-icon icon="solar:settings-linear" width="1.2em" height="1.2em" style="stroke-width: 1.5;"></iconify-icon>
                    Settings
                </a>
            </div>
        </nav>

        <div class="p-4 border-t border-gray-100">
            <div class="flex items-center gap-3 px-3 py-2 rounded-md hover:bg-gray-50 cursor-pointer transition-colors">
                <div class="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-xs font-medium text-gray-600">
                    JD
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-medium text-gray-900 truncate">John Doe</p>
                    <p class="text-xs text-gray-500 truncate">john@example.com</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 md:pl-64 flex flex-col min-w-0">
        
        <!-- Topbar -->
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 sm:px-8 sticky top-0 z-20">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-gray-500 hover:text-gray-900">
                    <iconify-icon icon="solar:hamburger-menu-linear" width="1.5em" height="1.5em"></iconify-icon>
                </button>
                <nav class="hidden sm:flex items-center space-x-2 text-sm font-medium text-gray-500">
                    <a href="#" class="hover:text-gray-900 transition-colors">Campaigns</a>
                    <iconify-icon icon="solar:alt-arrow-right-linear" width="1em" height="1em"></iconify-icon>
                    <span class="text-gray-900 truncate max-w-[200px]">Create New</span>
                </nav>
            </div>
            <div class="flex items-center gap-3">
                <button class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-1 transition-all">
                    Discard
                </button>
                <button class="px-3 py-1.5 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-1 transition-all">
                    Save Draft
                </button>
                <button class="px-3 py-1.5 text-sm font-medium text-white bg-gray-900 rounded-md shadow-sm hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-1 transition-all flex items-center gap-2">
                    <iconify-icon icon="solar:plain-linear" width="1.2em" height="1.2em"></iconify-icon>
                    Review & Send
                </button>
            </div>
        </header>

        <!-- Scrollable Content -->
        <div class="flex-1 p-4 sm:p-8 overflow-y-auto">
            <div class="max-w-6xl mx-auto space-y-8">

                <!-- Page Header -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h1 class="text-2xl font-semibold tracking-tight text-gray-900">Create Campaign</h1>
                        <p class="mt-1 text-sm text-gray-500">Draft a new email and configure your sending preferences.</p>
                    </div>
                </div>

                <!-- Main Layout -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
                    
                    <!-- Left Column: Setup & Editor -->
                    <div class="lg:col-span-2 space-y-6">
                        
                        <!-- Setup Card -->
                        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                            <div class="border-b border-gray-200 bg-gray-50/50 px-6 py-4">
                                <h2 class="text-sm font-semibold text-gray-900">Basic Information</h2>
                            </div>
                            <div class="p-6 space-y-5">
                                <div>
                                    <label for="campaign_name" class="block text-sm font-medium text-gray-700 mb-1.5">Campaign Name</label>
                                    <input type="text" id="campaign_name" placeholder="e.g. Spring Sale Announcement"
                                        class="block w-full rounded-md border border-gray-300 bg-white py-2 px-3 text-sm text-gray-900 shadow-sm focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900 transition-colors" />
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                                    <div>
                                        <label for="sender_name" class="block text-sm font-medium text-gray-700 mb-1.5">Sender Name</label>
                                        <input type="text" id="sender_name" value="John Doe"
                                            class="block w-full rounded-md border border-gray-300 bg-white py-2 px-3 text-sm text-gray-900 shadow-sm focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900 transition-colors" />
                                    </div>
                                    <div>
                                        <label for="sender_email" class="block text-sm font-medium text-gray-700 mb-1.5">Sender Email</label>
                                        <div class="relative">
                                            <select id="sender_email" class="block w-full rounded-md border border-gray-300 bg-white py-2 pl-3 pr-10 text-sm text-gray-900 shadow-sm focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900 transition-colors cursor-pointer">
                                                <option>john@example.com</option>
                                                <option>hello@example.com</option>
                                                <option>support@example.com</option>
                                            </select>
                                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                                                <iconify-icon icon="solar:alt-arrow-down-linear" width="1.2em" height="1.2em"></iconify-icon>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Content Editor Card -->
                        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                            <div class="border-b border-gray-200 bg-gray-50/50 px-6 py-4 flex justify-between items-center">
                                <h2 class="text-sm font-semibold text-gray-900">Email Content</h2>
                                <button class="text-xs font-medium text-gray-500 hover:text-gray-900 transition-colors flex items-center gap-1">
                                    <iconify-icon icon="solar:code-linear" width="1.2em" height="1.2em"></iconify-icon>
                                    HTML Editor
                                </button>
                            </div>
                            
                            <div class="p-6 space-y-6">
                                <div>
                                    <label for="subject" class="block text-sm font-medium text-gray-700 mb-1.5">Subject Line</label>
                                    <input type="text" id="subject" placeholder="What's this email about?"
                                        class="block w-full rounded-md border border-gray-300 bg-white py-2 px-3 text-sm text-gray-900 shadow-sm focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900 transition-colors" />
                                </div>

                                <div>
                                    <label for="preview_text" class="block text-sm font-medium text-gray-700 mb-1.5 flex justify-between items-center">
                                        Preview Text
                                        <span class="text-xs font-normal text-gray-500">Optional</span>
                                    </label>
                                    <input type="text" id="preview_text" placeholder="Appears in the inbox after the subject line"
                                        class="block w-full rounded-md border border-gray-300 bg-white py-2 px-3 text-sm text-gray-900 shadow-sm focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900 transition-colors" />
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Message Body</label>
                                    <div class="border border-gray-300 rounded-md overflow-hidden bg-white focus-within:border-gray-900 focus-within:ring-1 focus-within:ring-gray-900 transition-all shadow-sm">
                                        <!-- Toolbar -->
                                        <div class="bg-gray-50 border-b border-gray-200 px-3 py-2 flex items-center gap-1 overflow-x-auto">
                                            <button type="button" class="p-1.5 text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-md transition-colors" title="Bold">
                                                <iconify-icon icon="solar:text-bold-linear" width="1.2em" height="1.2em"></iconify-icon>
                                            </button>
                                            <button type="button" class="p-1.5 text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-md transition-colors" title="Italic">
                                                <iconify-icon icon="solar:text-italic-linear" width="1.2em" height="1.2em"></iconify-icon>
                                            </button>
                                            <button type="button" class="p-1.5 text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-md transition-colors" title="Underline">
                                                <iconify-icon icon="solar:text-underline-linear" width="1.2em" height="1.2em"></iconify-icon>
                                            </button>
                                            <div class="w-px h-4 bg-gray-300 mx-1"></div>
                                            <button type="button" class="p-1.5 text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-md transition-colors" title="List">
                                                <iconify-icon icon="solar:list-linear" width="1.2em" height="1.2em"></iconify-icon>
                                            </button>
                                            <button type="button" class="p-1.5 text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-md transition-colors" title="Link">
                                                <iconify-icon icon="solar:link-minimalistic-linear" width="1.2em" height="1.2em"></iconify-icon>
                                            </button>
                                            <button type="button" class="p-1.5 text-gray-500 hover:text-gray-900 hover:bg-gray-200 rounded-md transition-colors" title="Image">
                                                <iconify-icon icon="solar:gallery-linear" width="1.2em" height="1.2em"></iconify-icon>
                                            </button>
                                            <div class="flex-1"></div>
                                            <button type="button" class="text-xs font-medium text-gray-600 hover:text-gray-900 px-2 py-1 rounded-md hover:bg-gray-200 transition-colors flex items-center gap-1 border border-transparent hover:border-gray-300">
                                                <iconify-icon icon="solar:magic-stick-3-linear" width="1em" height="1em"></iconify-icon>
                                                Personalize
                                            </button>
                                        </div>
                                        <textarea rows="12" placeholder="Start typing your email here..."
                                            class="block w-full border-0 bg-transparent py-4 px-4 text-sm text-gray-900 placeholder:text-gray-400 focus:ring-0 resize-y font-sans leading-relaxed"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Audience & Delivery -->
                    <div class="lg:col-span-1 space-y-6">
                        
                        <!-- Audience Card -->
                        <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
                            <div class="border-b border-gray-200 bg-gray-50/50 px-5 py-4">
                                <h2 class="text-sm font-semibold text-gray-900">Audience</h2>
                            </div>
                            <div class="p-5 space-y-5">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Recipient List</label>
                                    <div class="relative">
                                        <select class="block w-full rounded-md border border-gray-300 bg-white py-2 pl-3 pr-10 text-sm text-gray-900 shadow-sm focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900 transition-colors cursor-pointer">
                                            <option value="" disabled selected>Select an audience...</option>
                                            <option value="all">All Subscribers (12,405)</option>
                                            <option value="active">Active Customers (8,192)</option>
                                            <option value="newsletter">Newsletter Only (4,213)</option>
                                        </select>
                                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                                            <iconify-icon icon="solar:alt-arrow-down-linear" width="1.2em" height="1.2em"></iconify-icon>
                                        </div>
                                    </div>
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1.5 flex items-center gap-2">
                                        Exclude Tags
                                    </label>
                                    <div class="relative">
                                        <div class="min-h-[38px] w-full rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm text-gray-900 shadow-sm focus-within:border-gray-900 focus-within:ring-1 focus-within:ring-gray-900 transition-colors cursor-text flex flex-wrap gap-2 items-center">
                                            <span class="inline-flex items-center gap-1 rounded-md bg-gray-100 px-2 py-0.5 text-xs font-medium text-gray-700">
                                                Bounced
                                                <button type="button" class="text-gray-400 hover:text-gray-900">
                                                    <iconify-icon icon="solar:close-circle-linear" width="1em" height="1em"></iconify-icon>
                                                </button>
                                            </span>
                                            <input type="text" placeholder="Add tags..." class="flex-1 border-0 bg-transparent p-0 text-sm placeholder:text-gray-400 focus:ring-0 min-w-[80px]">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Delivery Card -->
                        <div class="bg-white rounded-xl border border-gray-200 shadow-sm">
                            <div class="border-b border-gray-200 bg-gray-50/50 px-5 py-4">
                                <h2 class="text-sm font-semibold text-gray-900">Delivery</h2>
                            </div>
                            <div class="p-5 space-y-4">
                                
                                <div class="space-y-3">
                                    <label class="relative flex cursor-pointer rounded-lg border border-gray-200 bg-white p-4 shadow-sm hover:bg-gray-50 transition-colors radio-wrapper">
                                        <input type="radio" name="delivery_method" value="now" class="sr-only" checked>
                                        <div class="flex w-full items-center justify-between">
                                            <div class="flex items-center gap-3">
                                                <div class="text-gray-500">
                                                    <iconify-icon icon="solar:plain-linear" width="1.2em" height="1.2em"></iconify-icon>
                                                </div>
                                                <div class="text-sm font-medium text-gray-900">Send Immediately</div>
                                            </div>
                                            <div class="h-4 w-4 rounded-full border border-gray-300 bg-white radio-indicator transition-all"></div>
                                        </div>
                                    </label>
                                    
                                    <label class="relative flex cursor-pointer rounded-lg border border-gray-200 bg-white p-4 shadow-sm hover:bg-gray-50 transition-colors radio-wrapper">
                                        <input type="radio" name="delivery_method" value="schedule" class="sr-only">
                                        <div class="flex w-full items-center justify-between">
                                            <div class="flex items-center gap-3">
                                                <div class="text-gray-500">
                                                    <iconify-icon icon="solar:calendar-linear" width="1.2em" height="1.2em"></iconify-icon>
                                                </div>
                                                <div class="text-sm font-medium text-gray-900">Schedule for later</div>
                                            </div>
                                            <div class="h-4 w-4 rounded-full border border-gray-300 bg-white radio-indicator transition-all"></div>
                                        </div>
                                    </label>
                                </div>

                                <!-- Schedule Input (Shown typically when scheduled is selected, kept visible for design preview) -->
                                <div class="pt-2 border-t border-gray-100">
                                    <label for="schedule_time" class="block text-sm font-medium text-gray-700 mb-1.5">Date & Time</label>
                                    <input type="datetime-local" id="schedule_time" 
                                        class="block w-full rounded-md border border-gray-300 bg-white py-2 px-3 text-sm text-gray-900 shadow-sm focus:border-gray-900 focus:outline-none focus:ring-1 focus:ring-gray-900 transition-colors text-gray-500" disabled />
                                </div>

                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

</body>
</html>
