<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<title>HR Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 text-slate-700 font-sans flex h-screen">
  <!-- Sidebar -->
  <aside class="w-20 bg-white flex flex-col items-center py-6 border-r border-slate-200">
    <button class="mb-10">
      <i data-lucide="circle" class="text-blue-500 w-6 h-6"></i>
    </button>
    <nav class="space-y-8">
      <button class="group" aria-label="Dashboard">
        <i data-lucide="layout-dashboard" class="w-6 h-6 text-slate-400 group-hover:text-blue-500 transition-colors"></i>
      </button>
      <button class="group" aria-label="Employees">
        <i data-lucide="users" class="w-6 h-6 text-slate-400 group-hover:text-blue-500 transition-colors"></i>
      </button>
      <button class="group" aria-label="Reports">
        <i data-lucide="bar-chart-3" class="w-6 h-6 text-slate-400 group-hover:text-blue-500 transition-colors"></i>
      </button>
      <button class="group" aria-label="Settings">
        <i data-lucide="settings" class="w-6 h-6 text-slate-400 group-hover:text-blue-500 transition-colors"></i>
      </button>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto p-10">
    <!-- Top Bar -->
    <div class="flex items-center justify-between mb-10">
      <div>
        <h1 class="text-5xl font-semibold tracking-tight text-slate-900 flex flex-wrap" data-animate>
          <span style="opacity:0; transition:opacity .6s ease;">Employee</span>
          <span class="ml-2" style="opacity:0; transition:opacity .6s ease;">Overview</span>
        </h1>
        <p class="text-base text-slate-500 mt-2" data-animate>
          <span style="opacity:0; transition:opacity .6s ease;">HR</span>
          <span class="ml-1" style="opacity:0; transition:opacity .6s ease;">Department</span>
          <span class="ml-1" style="opacity:0; transition:opacity .6s ease;">Dashboard</span>
        </p>
      </div>
      <div class="flex items-center gap-4">
        <button class="relative">
          <i data-lucide="bell" class="w-6 h-6 text-slate-500 hover:text-blue-500 transition-colors"></i>
          <span class="absolute -top-1 -right-1 h-2 w-2 bg-blue-500 rounded-full"></span>
        </button>
        <img src="https://images.unsplash.com/photo-1621619856624-42fd193a0661?w=1080&q=80" alt="User" class="rounded-full border border-slate-200">
      </div>
    </div>

    <!-- Stats Cards -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
      <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 hover:shadow transition-shadow">
        <p class="text-sm text-slate-500 mb-1">Total Employees</p>
        <h2 class="text-3xl font-semibold tracking-tight text-slate-900">1,248</h2>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 hover:shadow transition-shadow">
        <p class="text-sm text-slate-500 mb-1">New Hires</p>
        <h2 class="text-3xl font-semibold tracking-tight text-slate-900">32</h2>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 hover:shadow transition-shadow">
        <p class="text-sm text-slate-500 mb-1">Attrition</p>
        <h2 class="text-3xl font-semibold tracking-tight text-slate-900">4%</h2>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 hover:shadow transition-shadow">
        <p class="text-sm text-slate-500 mb-1">Open Positions</p>
        <h2 class="text-3xl font-semibold tracking-tight text-slate-900">12</h2>
      </div>
    </section>

    <!-- Charts -->
    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <!-- Pie Chart -->
      <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 hover:shadow transition-shadow">
        <h3 class="text-lg font-medium tracking-tight text-slate-900 mb-4">Department Distribution</h3>
        <div>
          <canvas id="deptChart"></canvas>
        </div>
      </div>
      <!-- Bar Chart -->
      <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 hover:shadow transition-shadow">
        <h3 class="text-lg font-medium tracking-tight text-slate-900 mb-4">Monthly Hiring</h3>
        <div>
          <canvas id="hireChart"></canvas>
        </div>
      </div>
    </section>
  </main>

  <script>
    lucide.createIcons();

    // Fade-in word by word
    document.querySelectorAll('[data-animate]').forEach(block=>{
      const spans = block.querySelectorAll('span');
      spans.forEach((span,i)=> setTimeout(()=>{span.style.opacity=1}, i*120));
    });

    // Charts
    const deptCtx = document.getElementById('deptChart');
    new Chart(deptCtx, {
      type: 'doughnut',
      data: {
        labels: ['Front Desk', 'Concierge', 'Security', 'Maintenance', 'Management'],
        datasets: [{
          data: [40, 25, 15, 10, 10],
          backgroundColor: ['#3B82F6','#A5B4FC','#60A5FA','#BFDBFE','#DBEAFE'],
          borderWidth: 0
        }]
      },
      options: {
        plugins: { legend: { position:'bottom', labels:{ boxWidth:12, color:'#64748B', font:{family:'Inter',size:12}} } },
        cutout:'65%'
      }
    });

    const hireCtx = document.getElementById('hireChart');
    new Chart(hireCtx, {
      type: 'bar',
      data: {
        labels: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
        datasets: [{
          label: 'Hires',
          data: [5,8,6,7,9,3,4,6,8,5,7,4],
          backgroundColor:'#3B82F6',
          borderRadius:4
        }]
      },
      options: {
        plugins:{ legend:{ display:false } },
        scales:{
          y:{ grid:{ color:'#E2E8F0' }, ticks:{ color:'#64748B', font:{ family:'Inter' } } },
          x:{ grid:{ display:false }, ticks:{ color:'#64748B', font:{ family:'Inter' } } }
        }
      }
    });
  </script>
</body>
</html>
