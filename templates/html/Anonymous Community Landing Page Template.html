body {
font-family: 'Inter', sans-serif;
background-color: #FDFBFF;
color: #1a1a1a;
overflow-x: hidden;
}
/* Rotations */
@keyframes orbit-rotate {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
@keyframes counter-rotate {
0% { transform: rotate(0deg); }
100% { transform: rotate(-360deg); }
}
/* Subtle Breathing for Center */
@keyframes breathe {
0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 rgba(109, 89, 122, 0); }
50% { transform: scale(1.03); opacity: 0.95; box-shadow: 0 0 25px rgba(109, 89, 122, 0.15); }
}
/* Entrance Animations */
@keyframes fade-in-up {
0% { opacity: 0; transform: translateY(15px); }
100% { opacity: 1; transform: translateY(0); }
}
@keyframes scale-in {
0% { opacity: 0; transform: scale(0.9); }
100% { opacity: 1; transform: scale(1); }
}
/* Utility Classes for Animation */
.orbit-container {
animation: orbit-rotate 16s linear infinite;
}
.orbit-item {
animation: counter-rotate 16s linear infinite;
}
.center-breathe {
animation: breathe 5s ease-in-out infinite;
}
.animate-enter {
opacity: 0;
animation: fade-in-up 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
.animate-scale {
opacity: 0;
animation: scale-in 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}
.delay-200 { animation-delay: 200ms; }
.delay-300 { animation-delay: 300ms; }
.delay-400 { animation-delay: 400ms; }
</style>
