<div class="fixed inset-0 flex items-center justify-center z-50">
  <!-- Overlay -->
  <div class="fixed inset-0 bg-black bg-opacity-80"></div>

  <!-- Modal -->
  <div class="relative z-10 bg-white w-full max-w-2xl mx-4 rounded-xl shadow-lg">
    <button
      class="absolute top-3 right-3 text-gray-400 hover:text-black focus:outline-none"
      aria-label="Close"
      onclick="/* Your closing logic */"
      type="button"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <div class="p-6 sm:p-8">
      <!-- Author & Info -->
      <div class="flex flex-col sm:flex-row sm:items-center mb-4 gap-4">
        <div class="flex-1">
          <div class="text-base text-gray-800"><span class="font-semibold">Author:</span> @nickname123</div>
          <div class="text-sm text-gray-500"><span class="font-semibold">Full Post:</span> Here is the full post description, containing any extra relevant info about this submission.</div>
        </div>
      </div>

      <!-- Video Preview -->
      <div class="w-full mb-4">
        <label class="block text-sm font-semibold text-black mb-2">Video Preview</label>
        <div class="aspect-w-16 aspect-h-9 rounded-lg overflow-hidden bg-black shadow mb-2">
          <video
            controls
            poster="https://placehold.co/600x338"
            src="https://www.w3schools.com/html/mov_bbb.mp4"
            class="w-full h-full object-contain bg-black"
          ></video>
        </div>
      </div>

      <!-- Comment/Caption Section -->
      <div class="mb-4">
        <div class="text-sm text-gray-800">
          <span class="font-semibold">User Comment:</span> 
          This is the user's comment about their submission!
        </div>
      </div>

      <!-- Admin Feedback Form -->
      <form>
        <label for="admin-message" class="block text-sm font-medium text-black mb-1">Feedback/Reason (optional)</label>
        <textarea
          id="admin-message"
          rows="3"
          class="w-full border border-gray-300 rounded-md p-2 mb-5 bg-white text-black placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Type your feedback or reason here..."
        ></textarea>
        <div class="flex flex-col gap-3 sm:flex-row sm:gap-4">
          <!-- Blue CTA Approve -->
          <button
            type="submit"
            class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded shadow-sm transition-colors"
          >Approve</button>
          <!-- Black Reject -->
          <button
            type="button"
            class="flex-1 bg-black hover:bg-gray-900 text-white font-bold py-2 px-4 rounded shadow-sm transition-colors"
          >Reject</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Tailwind aspect-w-16 aspect-h-9 utility: 
If your Tailwind config doesn't have aspect-ratio plugin, 
replace with a div with set height and use "object-cover" or "object-contain" for video.
-->
