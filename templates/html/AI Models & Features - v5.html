<div class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
    <!-- Header -->
    <div class="px-6 py-5 border-b border-gray-200">
      <h1 class="text-xl font-semibold text-gray-900">Send an e-Transfer</h1>
    </div>
    
    <!-- Form -->
    <div class="p-6 space-y-5">
      <!-- Amount -->
      <div class="space-y-2">
        <label for="amount" class="block text-sm font-medium text-gray-700">Amount</label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <span class="text-gray-500">$</span>
          </div>
          <input type="text" id="amount" class="block w-full pl-7 pr-3 py-2.5 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900" placeholder="0.00">
        </div>
      </div>
      
      <!-- Recipient -->
      <div class="space-y-2">
        <label for="recipient" class="block text-sm font-medium text-gray-700">Recipient</label>
        <div class="relative">
          <select id="recipient" class="block w-full pl-3 pr-10 py-2.5 border border-gray-300 rounded-md appearance-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900">
            <option value="" disabled selected>Select a recipient</option>
            <option value="contact1">Sarah Johnson</option>
            <option value="contact2">Michael Chen</option>
            <option value="contact3">Alex Rodriguez</option>
            <option value="new">+ Add new recipient</option>
          </select>
          <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </div>
        </div>
      </div>
      
      <!-- Scheduled for -->
      <div class="space-y-2">
        <label for="scheduled" class="block text-sm font-medium text-gray-700">Scheduled for</label>
        <div class="flex space-x-2">
          <div class="flex-1">
            <input type="radio" id="send-now" name="schedule" class="hidden peer" checked>
            <label for="send-now" class="flex items-center justify-center py-2.5 border border-gray-300 rounded-md text-sm font-medium text-gray-700 cursor-pointer peer-checked:bg-blue-50 peer-checked:border-blue-500 peer-checked:text-blue-600 hover:bg-gray-50">
              Send now
            </label>
          </div>
          <div class="flex-1">
            <input type="radio" id="schedule" name="schedule" class="hidden peer">
            <label for="schedule" class="flex items-center justify-center py-2.5 border border-gray-300 rounded-md text-sm font-medium text-gray-700 cursor-pointer peer-checked:bg-blue-50 peer-checked:border-blue-500 peer-checked:text-blue-600 hover:bg-gray-50">
              Schedule
            </label>
          </div>
        </div>
      </div>
      
      <!-- Source Account -->
      <div class="space-y-2">
        <label for="source" class="block text-sm font-medium text-gray-700">From account</label>
        <div class="relative">
          <select id="source" class="block w-full pl-3 pr-10 py-2.5 border border-gray-300 rounded-md appearance-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900">
            <option value="checking">Checking Account - $2,546.63</option>
            <option value="savings">Savings Account - $8,921.15</option>
            <option value="joint">Joint Account - $4,370.28</option>
          </select>
          <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </div>
        </div>
      </div>
      
      <!-- Fee -->
      <div class="py-3 px-4 bg-gray-50 rounded-md text-sm text-gray-600 flex justify-between items-center">
        <span>Service fee</span>
        <span class="font-medium">$1.50</span>
      </div>
    </div>
    
    <!-- Footer with buttons -->
    <div class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex justify-end">
      <button type="button" class="px-4 py-2 mr-3 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        Cancel
      </button>
      <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
        Confirm Transfer
      </button>
    </div>
  </div>
</div>
