body { font-family: 'Inter', sans-serif; }
/* Custom Keyframes for the Floating Orb */
@keyframes float {
0%, 100% { transform: translateY(0px) rotate(0deg); }
50% { transform: translateY(-20px) rotate(2deg); }
}
@keyframes glow {
0%, 100% { opacity: 0.6; filter: blur(40px); }
50% { opacity: 0.8; filter: blur(60px); }
}
@keyframes pulse-ring {
0% { transform: scale(0.9); opacity: 0.3; }
100% { transform: scale(1.4); opacity: 0; }
}
.orb-float { animation: float 6s ease-in-out infinite; }
.glow-pulse { animation: glow 4s ease-in-out infinite; }
.ring-pulse { animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
/* 3D Perspective Classes */
.scene-container {
perspective: 2000px;
}
#main-view {
transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), border-radius 1s ease, opacity 0.5s ease;
transform-style: preserve-3d;
will-change: transform;
}
/* The Active State for Menu (The 3D Shift) */
.scene-container.menu-active #main-view {
transform: translateZ(-300px) rotateX(4deg) translateY(5vh) scale(0.85);
border-radius: 24px;
box-shadow: 0 50px 100px -20px rgba(0,0,0,0.8);
opacity: 0.8;
pointer-events: none;
overflow: hidden;
}
/* Overlay to darken content when menu is open */
#content-overlay {
opacity: 0;
pointer-events: none;
transition: opacity 0.8s ease;
}
.scene-container.menu-active #content-overlay {
opacity: 1;
}
/* Custom Scrollbar hide */
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const scene = document.getElementById('scene');
        const menuText = document.getElementById('menu-text');

        let isMenuOpen = false;

        menuToggle.addEventListener('click', () => {
            isMenuOpen = !isMenuOpen;
            
            if (isMenuOpen) {
                scene.classList.add('menu-active');
                menuText.textContent = "Close";
            } else {
                scene.classList.remove('menu-active');
                menuText.textContent = "Menu";
            }
        });

        // Close when clicking overlay
        document.getElementById('content-overlay').addEventListener('click', () => {
            if (isMenuOpen) {
                isMenuOpen = false;
                scene.classList.remove('menu-active');
                menuText.textContent = "Menu";
            }
        });
    </script>
