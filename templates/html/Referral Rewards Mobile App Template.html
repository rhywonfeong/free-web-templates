<body class="bg-[#FCFCFF] text-gray-900 antialiased selection:bg-purple-100 selection:text-purple-900" style="font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

    <div class="max-w-md mx-auto min-h-screen relative overflow-hidden bg-[#FCFCFF] flex flex-col shadow-2xl shadow-gray-200/50">
        
        <!-- Header -->
        <header class="flex items-center justify-between px-6 py-5 sticky top-0 bg-[#FCFCFF]/80 backdrop-blur-xl z-20 border-b border-gray-100/60">
            <button class="w-10 h-10 flex items-center justify-center -ml-3 text-gray-500 hover:text-gray-900 transition-colors rounded-full hover:bg-gray-100/50 active:scale-95" aria-label="Go back">
                <iconify-icon icon="solar:arrow-left-linear" width="24" stroke-width="1.5"></iconify-icon>
            </button>
            <h1 class="text-base font-semibold tracking-tight text-[#5E17EB]">Add Mobile Money</h1>
            <div class="w-10 h-10 flex items-center justify-center -mr-3">
                <!-- Empty div to balance flexbox -->
            </div>
        </header>

        <!-- Main Scrollable Content -->
        <main class="flex-1 overflow-y-auto pb-40 relative z-10">
            
            <!-- Cosmic Glow Background -->
            <div class="absolute top-0 right-0 w-64 h-64 bg-purple-400/5 rounded-full blur-[80px] pointer-events-none"></div>

            <div class="px-6 mt-6">
                <!-- Operator Selection -->
                <h2 class="text-sm font-medium text-gray-900 mb-3">Select Operator</h2>
                
                <div class="grid grid-cols-2 gap-4">
                    <!-- Selected Card: MTN -->
                    <label class="relative cursor-pointer group">
                        <input type="radio" name="operator" value="mtn" class="peer sr-only" checked>
                        <div class="p-5 rounded-xl border-2 border-[#5E17EB] bg-[#5E17EB]/[0.03] flex flex-col items-center gap-3 transition-all shadow-sm">
                            <!-- Logo -->
                            <div class="w-12 h-12 rounded-full bg-[#FFCC00] flex items-center justify-center text-black text-sm font-semibold tracking-tighter shadow-sm">
                                MTN
                            </div>
                            <span class="text-sm font-medium text-gray-900">MTN Money</span>
                            
                            <!-- Check Indicator -->
                            <div class="absolute top-3 right-3 w-5 h-5 bg-[#5E17EB] rounded-full flex items-center justify-center shadow-sm">
                                <iconify-icon icon="solar:check-read-linear" width="12" class="text-white" stroke-width="2"></iconify-icon>
                            </div>
                        </div>
                    </label>

                    <!-- Unselected Card: Orange -->
                    <label class="relative cursor-pointer group">
                        <input type="radio" name="operator" value="orange" class="peer sr-only">
                        <div class="p-5 rounded-xl border border-gray-200 bg-white flex flex-col items-center gap-3 transition-all hover:border-gray-300 peer-checked:border-2 peer-checked:border-[#5E17EB] peer-checked:bg-[#5E17EB]/[0.03] shadow-sm">
                            <!-- Logo -->
                            <div class="w-12 h-12 rounded-full bg-[#FF6600] flex items-center justify-center text-white text-sm font-semibold tracking-tighter shadow-sm">
                                ORG
                            </div>
                            <span class="text-sm font-medium text-gray-500 group-hover:text-gray-900 transition-colors">Orange Money</span>
                            
                            <!-- Invisible placeholder to match height perfectly if checked state adds icon -->
                            <div class="absolute top-3 right-3 w-5 h-5 rounded-full flex items-center justify-center opacity-0 peer-checked:opacity-100 peer-checked:bg-[#5E17EB]">
                                <iconify-icon icon="solar:check-read-linear" width="12" class="text-white" stroke-width="2"></iconify-icon>
                            </div>
                        </div>
                    </label>
                </div>

                <!-- Input Fields -->
                <div class="mt-8 space-y-5">
                    
                    <!-- Account Holder Name -->
                    <div>
                        <label for="accountName" class="text-xs font-medium text-gray-500 mb-1.5 block ml-1">Account Holder Name</label>
                        <div class="relative bg-white rounded-xl border border-gray-200 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)] focus-within:border-[#5E17EB] focus-within:ring-1 focus-within:ring-[#5E17EB] transition-all overflow-hidden flex items-center">
                            <input 
                                type="text" 
                                id="accountName" 
                                placeholder="e.g., Sarah Amina" 
                                class="w-full bg-transparent px-4 py-3.5 text-sm text-gray-900 placeholder-gray-400 outline-none font-medium"
                            >
                        </div>
                    </div>

                    <!-- Phone Number -->
                    <div>
                        <label for="phoneNumber" class="text-xs font-medium text-gray-500 mb-1.5 block ml-1">Phone Number</label>
                        <div class="relative bg-white rounded-xl border border-gray-200 shadow-[0_2px_10px_-3px_rgba(0,0,0,0.03)] focus-within:border-[#5E17EB] focus-within:ring-1 focus-within:ring-[#5E17EB] transition-all flex items-center overflow-hidden">
                            <!-- Fixed Country Code -->
                            <div class="flex items-center justify-center pl-4 pr-3 py-3.5 bg-gray-50/80 border-r border-gray-100">
                                <span class="text-sm font-semibold text-gray-600 tracking-wide">+237</span>
                            </div>
                            <!-- Input -->
                            <input 
                                type="tel" 
                                id="phoneNumber" 
                                placeholder="670 000 000" 
                                class="flex-1 bg-transparent pl-3 pr-10 py-3.5 text-sm text-gray-900 placeholder-gray-400 outline-none font-medium tracking-wide"
                            >
                            <!-- Phone Icon -->
                            <div class="absolute right-4 text-gray-400 pointer-events-none flex items-center">
                                <iconify-icon icon="solar:phone-linear" width="18" stroke-width="1.5"></iconify-icon>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Security Disclaimer -->
                <div class="mt-6 bg-[#5E17EB]/[0.04] rounded-xl p-4 flex gap-3.5 border border-[#5E17EB]/10">
                    <div class="mt-0.5 text-[#5E17EB] shrink-0">
                        <iconify-icon icon="solar:shield-check-linear" width="20" stroke-width="1.5"></iconify-icon>
                    </div>
                    <p class="text-xs font-medium text-[#5E17EB]/90 leading-relaxed pr-2">
                        For your security, you will receive an OTP code to verify this account.
                    </p>
                </div>

            </div>
            
        </main>

        <!-- Fixed Footer Area -->
        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-gradient-to-t from-[#FCFCFF] via-[#FCFCFF] to-transparent pt-12 pb-8 px-6 z-30 pointer-events-none">
            
            <div class="pointer-events-auto">
                <!-- Primary CTA -->
                <button class="w-full relative overflow-hidden bg-gradient-to-b from-[#FF7A1A] to-[#FF6B00] text-white py-4 rounded-xl text-base font-semibold shadow-[0_8px_20px_rgb(255,107,0,0.25)] ring-1 ring-white/20 transition-all active:scale-[0.98] active:shadow-md flex items-center justify-center group">
                    <!-- Subtle inner top highlight for glossy effect -->
                    <div class="absolute top-0 left-0 right-0 h-1/2 bg-gradient-to-b from-white/10 to-transparent pointer-events-none"></div>
                    <span class="relative z-10 flex items-center gap-2">
                        Verify & Link Account
                        <iconify-icon icon="solar:arrow-right-linear" width="18" class="group-hover:translate-x-1 transition-transform"></iconify-icon>
                    </span>
                </button>
            </div>
            
        </div>

    </div>
