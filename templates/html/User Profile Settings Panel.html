<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Instagram Profile Settings – Clean Top</title>
  <meta name="viewport" content="width=393, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', Arial, sans-serif; }
    .gradient-btn {
      background: linear-gradient(90deg, #a864fd 0%, #2787f5 100%);
      color: #fff;
      box-shadow: 0 3px 16px 0 #6536f466;
      transition: background .18s, box-shadow .18s;
    }
    .gradient-btn:hover, .gradient-btn:focus {
      background: linear-gradient(90deg, #6a5af9 0%, #32c8fd 100%);
      box-shadow: 0 6px 30px 0 #2787f5aa;
    }
    .dark-switch {
      appearance: none;
      width: 38px; height: 22px;
      background: #27282d;
      border-radius: 32px;
      border: 1.5px solid #394052;
      box-shadow: 0 1px 3px #1115;
      outline: none;
      cursor: pointer;
      transition: background .23s, border .2s;
      position: relative;
    }
    .dark-switch:checked {
      background: #2787f5;
      border-color: #2787f5;
    }
    .dark-switch:before {
      content: '';
      display: block;
      position: absolute;
      top: 2.5px; left: 3px;
      width: 16px; height: 16px;
      border-radius: 999px;
      background: #202127;
      box-shadow: 0 1px 3px #111c;
      transition: transform .19s cubic-bezier(.41,.49,.54,1.23), background .2s;
    }
    .dark-switch:checked:before {
      transform: translateX(16px);
      background: #fff;
    }
    @media (max-width: 420px) {
      .max-w-instagram { max-width: 98vw;}
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-neutral-900 via-neutral-950 to-neutral-800">
  <div class="w-[384px] max-w-instagram mx-auto rounded-2xl shadow-2xl border border-neutral-800 bg-[#15161a]">
    <!-- Profile Top Section -->
    <div class="pt-8 pb-4 border-b border-neutral-800">
      <div class="flex flex-row items-center justify-center gap-5">
        <!-- Avatar -->
        <div class="flex flex-col items-center">
          <img src="https://randomuser.me/api/portraits/women/75.jpg" class="w-20 h-20 object-cover rounded-full border-2 border-neutral-800 shadow" alt="avatar">
        </div>
        <!-- Followers / Following -->
        <div class="flex flex-row items-center gap-7">
          <div class="flex flex-col items-center">
            <span class="font-bold text-white text-[17px] leading-tight">8,652</span>
            <span class="text-gray-400 text-xs tracking-wide mt-0.5">Followers</span>
          </div>
          <div class="flex flex-col items-center">
            <span class="font-bold text-white text-[17px] leading-tight">721</span>
            <span class="text-gray-400 text-xs tracking-wide mt-0.5">Following</span>
          </div>
        </div>
      </div>
      <div class="flex flex-col items-center mt-3 mb-1">
        <span class="font-bold text-lg text-white leading-tight">juliadow</span>
        <span class="text-gray-400 text-[15px]">@julia_doe</span>
      </div>
      <div class="px-9 mt-3">
        <button class="w-full py-1.5 rounded-lg border border-[#232429] text-[15px] font-semibold text-blue-400 hover:bg-[#232a39] transition">Edit Profile</button>
      </div>
    </div>
    <!-- Settings List -->
    <div class="divide-y divide-[#232429]">
      <button class="w-full text-left px-6 py-3 bg-transparent hover:bg-[#232429] flex justify-between items-center transition">
        <span class="font-medium text-[15px] text-white">Change Password</span>
        <svg width="18" height="18" stroke="#6b7280" stroke-width="2" fill="none"><path d="M7 5l5 4-5 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="w-full text-left px-6 py-3 bg-transparent hover:bg-[#232429] flex justify-between items-center transition">
        <span class="font-medium text-[15px] text-white">Notifications</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" checked class="sr-only peer dark-switch">
        </label>
      </button>
      <button class="w-full text-left px-6 py-3 bg-transparent hover:bg-[#232429] flex justify-between items-center transition">
        <span class="font-medium text-[15px] text-white">Privacy &amp; Security</span>
        <svg width="18" height="18" stroke="#6b7280" stroke-width="2" fill="none"><path d="M7 5l5 4-5 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="w-full text-left px-6 py-3 bg-transparent hover:bg-[#232429] flex flex-col sm:flex-row sm:items-center sm:justify-between transition">
        <span>
          <span class="font-medium text-[15px] text-white">Account Status</span>
          <br><span class="text-gray-400 text-[14px]">Personal information and connections</span>
        </span>
        <svg width="18" height="18" stroke="#6b7280" stroke-width="2" fill="none" class="sm:mt-0 mt-2"><path d="M7 5l5 4-5 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="w-full text-left px-6 py-3 bg-transparent hover:bg-[#232429] flex flex-col sm:flex-row sm:items-center sm:justify-between transition">
        <span>
          <span class="font-medium text-[15px] text-white">Help</span>
          <br><span class="text-gray-400 text-[14px]">FAQs & support chat</span>
        </span>
        <svg width="18" height="18" stroke="#6b7280" stroke-width="2" fill="none" class="sm:mt-0 mt-2"><path d="M7 5l5 4-5 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="w-full text-left px-6 py-3 bg-transparent hover:bg-[#232429] flex flex-col sm:flex-row sm:items-center sm:justify-between transition">
        <span>
          <span class="font-medium text-[15px] text-white">About</span>
          <br><span class="text-gray-400 text-[14px]">Terms, data policy, version 3.2.4</span>
        </span>
        <svg width="18" height="18" stroke="#6b7280" stroke-width="2" fill="none" class="sm:mt-0 mt-2"><path d="M7 5l5 4-5 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <!-- Gradient Log out Button -->
    <div class="w-full px-7 pb-7 pt-4">
      <button class="w-full py-2.5 rounded-xl text-base font-semibold shadow gradient-btn focus:outline-none focus:ring-2 focus:ring-blue-800 transition">
        Log out
      </button>
    </div>
  </div>
</body>
</html>
