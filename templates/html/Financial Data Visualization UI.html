    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-[#1a1a35] to-[#121228] min-h-screen text-white font-sans">
    <!-- Status Bar -->
    <div class="flex justify-between items-center p-2 text-xs">
        <span>9:41</span>
        <div class="flex space-x-1">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-three-quarters"></i>
        </div>
    </div>
    
    <!-- Header -->
    <header class="px-6 py-4">
        <h1 class="text-2xl font-bold">Statistics</h1>
    </header>
    
    <!-- Main Content -->
    <main class="px-4 pb-24">
        <div class="grid grid-cols-2 gap-4">
            <!-- Balance Card -->
            <div class="bg-[#1e1e3a] rounded-2xl p-4 shadow-lg">
                <div class="h-16">
                    <canvas id="balanceChart"></canvas>
                </div>
                <div class="mt-2">
                    <p class="text-xs text-gray-400">BALANCE</p>
                    <p class="text-lg font-semibold">19,978.89 USD</p>
                </div>
            </div>
            
            <!-- Cashflow Card -->
            <div class="bg-[#1e1e3a] rounded-2xl p-4 shadow-lg">
                <div class="h-16">
                    <canvas id="cashflowChart"></canvas>
                </div>
                <div class="mt-2">
                    <p class="text-xs text-gray-400">CASHFLOW</p>
                    <p class="text-lg font-semibold">8,978.89 USD</p>
                </div>
            </div>
            
            <!-- Credit Card -->
            <div class="bg-[#1e1e3a] rounded-2xl p-4 shadow-lg">
                <div class="h-16">
                    <canvas id="creditChart"></canvas>
                </div>
                <div class="mt-2">
                    <p class="text-xs text-gray-400">CREDIT</p>
                    <p class="text-lg font-semibold">8,238.38 USD</p>
                </div>
            </div>
            
            <!-- Spending Card -->
            <div class="bg-[#1e1e3a] rounded-2xl p-4 shadow-lg">
                <div class="h-16">
                    <canvas id="spendingChart"></canvas>
                </div>
                <div class="mt-2">
                    <p class="text-xs text-gray-400">SPENDING</p>
                    <p class="text-lg font-semibold">3,978.78 USD</p>
                </div>
            </div>
            
            <!-- Savings Card -->
            <div class="bg-[#1e1e3a] rounded-2xl p-4 shadow-lg">
                <div class="h-16">
                    <canvas id="savingsChart"></canvas>
                </div>
                <div class="mt-2">
                    <p class="text-xs text-gray-400">SAVINGS</p>
                    <p class="text-lg font-semibold">5,789.45 USD</p>
                </div>
            </div>
            
            <!-- Income Card -->
            <div class="bg-[#1e1e3a] rounded-2xl p-4 shadow-lg">
                <div class="h-16">
                    <canvas id="incomeChart"></canvas>
                </div>
                <div class="mt-2">
                    <p class="text-xs text-gray-400">INCOME</p>
                    <p class="text-lg font-semibold">3,978.78 USD</p>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Navigation Bar -->
    <nav class="fixed bottom-0 w-full bg-[#151530]/90 rounded-t-3xl py-4 px-6 backdrop-blur-sm">
        <div class="flex justify-between items-center">
            <div class="flex flex-col items-center">
                <i class="fas fa-dollar-sign text-gray-400"></i>
                <span class="text-xs text-gray-400 mt-1">Finance</span>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-wallet text-gray-400"></i>
                <span class="text-xs text-gray-400 mt-1">Wallet</span>
            </div>
            <div class="relative -mt-8">
                <div class="w-14 h-14 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 flex items-center justify-center shadow-lg shadow-pink-500/20">
                    <i class="fas fa-plus text-white text-xl"></i>
                </div>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-chart-pie text-purple-500"></i>
                <span class="text-xs text-purple-500 mt-1">Stats</span>
                <div class="w-1 h-1 bg-purple-500 rounded-full mt-1"></div>
            </div>
            <div class="flex flex-col items-center">
                <i class="fas fa-ellipsis-h text-gray-400"></i>
                <span class="text-xs text-gray-400 mt-1">More</span>
            </div>
        </div>
    </nav>

    <script>
        // Chart configuration
        Chart.defaults.color = 'rgba(255, 255, 255, 0.5)';
        Chart.defaults.scale.grid.display = false;
        Chart.defaults.scale.display = false;
        
        // Balance Chart
        const balanceCtx = document.getElementById('balanceChart').getContext('2d');
        new Chart(balanceCtx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Income',
                    data: [15000, 17000, 16500, 19000, 18000, 19978],
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    tension: 0.4,
                    pointRadius: 0,
                    borderWidth: 2
                }, {
                    label: 'Expenses',
                    data: [12000, 13500, 14000, 14500, 15000, 16000],
                    borderColor: '#ec4899',
                    backgroundColor: 'rgba(236, 72, 153, 0.1)',
                    tension: 0.4,
                    pointRadius: 0,
                    borderWidth: 2
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                }
            }
        });
        
        // Cashflow Chart
        const cashflowCtx = document.getElementById('cashflowChart').getContext('2d');
        new Chart(cashflowCtx, {
            type: 'bar',
            data: {
                labels: ['Income', 'Expenses'],
                datasets: [{
                    data: [19978, 11000],
                    backgroundColor: ['#3b82f6', '#ec4899'],
                    borderRadius: 5
                }]
            },
            options: {
                maintainAspectRatio: false,
                indexAxis: 'y',
                plugins: {
                    legend: { display: false }
                }
            }
        });
        
        // Credit Chart
        const creditCtx = document.getElementById('creditChart').getContext('2d');
        new Chart(creditCtx, {
            type: 'doughnut',
            data: {
                labels: ['Used', 'Available'],
                datasets: [{
                    data: [8238, 3762],
                    backgroundColor: [
                        'rgba(236, 72, 153, 0.8)',
                        'rgba(139, 92, 246, 0.3)'
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                maintainAspectRatio: false,
                cutout: '75%',
                plugins: {
                    legend: { display: false }
                }
            }
        });
        
        // Spending Chart
        const spendingCtx = document.getElementById('spendingChart').getContext('2d');
        new Chart(spendingCtx, {
            type: 'doughnut',
            data: {
                labels: ['Food', 'Transport', 'Shopping', 'Bills'],
                datasets: [{
                    data: [1200, 800, 1100, 878],
                    backgroundColor: [
                        '#3b82f6',
                        '#8b5cf6',
                        '#ec4899',
                        '#06b6d4'
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                maintainAspectRatio: false,
                cutout: '75%',
                plugins: {
                    legend: { display: false }
                }
            }
        });
        
        // Savings Chart
        const savingsCtx = document.getElementById('savingsChart').getContext('2d');
        new Chart(savingsCtx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    data: [3000, 3500, 4200, 4800, 5300, 5789],
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    borderWidth: 2
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                }
            }
        });
        
        // Income Chart
        const incomeCtx = document.getElementById('incomeChart').getContext('2d');
        new Chart(incomeCtx, {
            type: 'bar',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Income',
                    data: [700, 900, 800, 1100, 700, 900, 1100],
                    backgroundColor: '#3b82f6',
                    borderRadius: 3,
                    barPercentage: 0.5
                }, {
                    label: 'Expenses',
                    data: [500, 600, 550, 700, 500, 650, 800],
                    backgroundColor: '#ec4899',
                    borderRadius: 3,
                    barPercentage: 0.5
                }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                }
            }
        });
    </script>
</body>
</html>
