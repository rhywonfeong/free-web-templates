<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isolated Animated Background</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Three.js Modules -->
<script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
<script type="importmap">
{
"imports": {
"three": "https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}
}
</script><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="antialiased overflow-hidden" style="background-color: #050505;">

    <!-- Visualizer Background Container -->
    <div id="canvas-container" class="fixed inset-0 z-0 opacity-60"></div>
    
    <!-- CRT / Scanline Overlay -->
    <div class="fixed inset-0 z-10" style="background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); background-size: 100% 2px, 3px 100%; pointer-events: none;"></div>
    
    <!-- Noise Overlay -->
    <div class="fixed inset-0 z-20" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.65\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E'); pointer-events: none; opacity: 0.03;"></div>

    <!-- Three.js Visualizer Script -->
    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        
        const container = document.getElementById('canvas-container');
        
        // --- CONFIG ---
        const CONFIG = {
            particleCount: 16000,
            color: new THREE.Color('#7DFDFE'),
            bgColor: new THREE.Color('#050505'),
        };

        // --- SCENE ---
        const renderer = new THREE.WebGLRenderer({ 
            antialias: false, 
            powerPreference: "high-performance",
            alpha: true
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(CONFIG.bgColor, 0.02);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 20);
        camera.lookAt(0, 0, 0);

        // --- PARTICLES ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(CONFIG.particleCount * 3);
        const randoms = new Float32Array(CONFIG.particleCount * 3);
        
        let i3 = 0;
        const width = 120;
        const depth = 120;
        const countPerSide = Math.sqrt(CONFIG.particleCount);
        
        for(let x = 0; x < countPerSide; x++) {
            for(let z = 0; z < countPerSide; z++) {
                // Grid layout
                positions[i3] = (x / countPerSide - 0.5) * width;
                positions[i3 + 1] = 0; // Flat initially
                positions[i3 + 2] = (z / countPerSide - 0.5) * depth;
                
                randoms[i3] = Math.random();
                randoms[i3+1] = Math.random();
                randoms[i3+2] = Math.random();
                
                i3 += 3;
            }
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 3));

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor: { value: CONFIG.color },
                uMouse: { value: new THREE.Vector2(0,0) }
            },
            vertexShader: `
                uniform float uTime;
                uniform vec2 uMouse;
                attribute vec3 aRandom;
                varying float vAlpha;
                varying float vDist;

                // Simplex Noise Function
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
                float snoise(vec2 v) {
                    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                    vec2 i  = floor(v + dot(v, C.yy) );
                    vec2 x0 = v - i + dot(i, C.xx);
                    vec2 i1; i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                    vec4 x12 = x0.xyxy + C.xxzz;
                    x12.xy -= i1;
                    i = mod289(i);
                    vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
                    vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
                    m = m*m ;
                    m = m*m ;
                    vec3 x = 2.0 * fract(p * C.www) - 1.0;
                    vec3 h = abs(x) - 0.5;
                    vec3 ox = floor(x + 0.5);
                    vec3 a0 = x - ox;
                    m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
                    vec3 g;
                    g.x  = a0.x  * x0.x  + h.x  * x0.y;
                    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                    return 130.0 * dot(m, g);
                }

                void main() {
                    vec3 pos = position;
                    
                    // Wave effect based on grid position
                    float wave = snoise(vec2(pos.x * 0.05 + uTime * 0.1, pos.z * 0.05 + uTime * 0.1));
                    pos.y += wave * 4.0;

                    // Mouse interaction
                    float dist = distance(pos.xz, uMouse * 30.0);
                    float mouseInfluence = smoothstep(15.0, 0.0, dist);
                    pos.y += mouseInfluence * 6.0 * sin(uTime * 2.0);

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    
                    // Size attenuation
                    gl_PointSize = (2.0 + aRandom.x * 2.0) * (20.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;

                    // Fade out in distance
                    float depth = -mvPosition.z;
                    vAlpha = smoothstep(50.0, 10.0, depth) * (0.3 + aRandom.y * 0.5);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying float vAlpha;

                void main() {
                    // Square particle for "Pixel/Terminal" look
                    vec2 coord = gl_PointCoord - 0.5;
                    if(abs(coord.x) > 0.4 || abs(coord.y) > 0.4) discard;
                    
                    gl_FragColor = vec4(uColor, vAlpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- POST PROCESSING ---
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // Bloom for the "Tron" glow
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.05;
        bloomPass.strength = 1.2;
        bloomPass.radius = 0.1;
        composer.addPass(bloomPass);

        // RGB Shift Shader for "Glitch/Terminal" vibe
        const rgbShiftShader = {
            uniforms: {
                "tDiffuse": { value: null },
                "amount": { value: 0.002 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float amount;
                varying vec2 vUv;
                void main() {
                    vec2 rUv = vUv + vec2(amount, 0.0);
                    vec2 gUv = vUv;
                    vec2 bUv = vUv - vec2(amount, 0.0);
                    float r = texture2D(tDiffuse, rUv).r;
                    float g = texture2D(tDiffuse, gUv).g;
                    float b = texture2D(tDiffuse, bUv).b;
                    gl_FragColor = vec4(r, g, b, 1.0);
                }
            `
        };
        const rgbShiftPass = new ShaderPass(rgbShiftShader);
        composer.addPass(rgbShiftPass);

        // --- ANIMATION ---
        const clock = new THREE.Clock();
        const mouse = new THREE.Vector2(0,0);
        let targetMouse = new THREE.Vector2(0,0);

        window.addEventListener('mousemove', (e) => {
            // Normalize mouse -1 to 1
            targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Smooth mouse interpolation
            mouse.x += (targetMouse.x - mouse.x) * 0.05;
            mouse.y += (targetMouse.y - mouse.y) * 0.05;

            material.uniforms.uTime.value = time;
            material.uniforms.uMouse.value = mouse;

            // Slowly rotate the grid
            particles.rotation.y = time * 0.05;

            // Camera float
            camera.position.y = 5 + Math.sin(time * 0.2) * 1;

            composer.render();
        }
        
        animate();
    </script>
</body>
</html>
