<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DogeMiner 2 Interface</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-zinc-950 text-zinc-300 min-h-screen flex flex-col antialiased selection:bg-zinc-800 selection:text-white" style="font-family: 'Inter', sans-serif;">
    
    <!-- Top Navigation -->
    <header class="border-b border-zinc-800/60 bg-zinc-950/80 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
            
            <!-- Logo Section -->
            <div class="flex items-center gap-3 text-zinc-100">
                <div class="w-8 h-8 rounded-md bg-gradient-to-br from-zinc-800 to-zinc-900 border border-zinc-700/50 flex items-center justify-center shadow-sm">
                    <iconify-icon icon="solar:gamepad-linear" class="text-lg text-zinc-300" stroke-width="1.5"></iconify-icon>
                </div>
                <span class="text-base font-semibold tracking-tighter">DM</span>
            </div>

            <!-- Central Navigation (Decorative) -->
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
                <a href="#" class="text-zinc-100 relative after:absolute after:-bottom-5 after:left-0 after:h-[2px] after:w-full after:bg-zinc-100">Terminal</a>
                <a href="#" class="text-zinc-500 hover:text-zinc-300 transition-colors duration-200">Upgrades</a>
                <a href="#" class="text-zinc-500 hover:text-zinc-300 transition-colors duration-200">Network</a>
            </nav>

            <!-- Right Controls -->
            <div class="flex items-center gap-5">
                
                <!-- Custom Focus Toggle -->
                <div class="hidden sm:flex items-center gap-2.5">
                    <span class="text-xs text-zinc-500 font-medium">Cinematic</span>
                    <button class="w-9 h-5 bg-zinc-900 rounded-full relative cursor-pointer hover:bg-zinc-800 transition-colors duration-200 border border-zinc-800 focus:outline-none" aria-label="Toggle cinematic mode">
                        <div class="w-3.5 h-3.5 bg-zinc-500 rounded-full absolute top-[2px] left-[3px] shadow-sm"></div>
                    </button>
                </div>

                <div class="h-4 w-[1px] bg-zinc-800 hidden sm:block"></div>

                <button class="text-zinc-400 hover:text-zinc-100 transition-colors duration-200 flex items-center justify-center focus:outline-none" title="Fullscreen">
                    <iconify-icon icon="solar:maximize-square-linear" class="text-xl" stroke-width="1.5"></iconify-icon>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 sm:p-6 lg:p-8 relative overflow-hidden">
        
        <!-- Ambient Background Glow -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[80%] h-[80%] bg-amber-500/5 blur-[120px] rounded-full pointer-events-none z-0"></div>

        <div class="w-full max-w-[1400px] mx-auto flex flex-col gap-4 relative z-10">
            
            <!-- Context Header -->
            <div class="flex items-end justify-between px-1 md:px-2">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-zinc-100">Operation Moon</h1>
                    <p class="text-sm text-zinc-500 mt-1 font-medium">Mining session actively running in isolated container.</p>
                </div>
                <div class="hidden sm:flex items-center gap-2 text-xs font-medium text-zinc-400 bg-zinc-900/50 border border-zinc-800/80 px-3 py-1.5 rounded-full">
                    <span class="flex h-2 w-2 rounded-full bg-emerald-500/20 items-center justify-center relative">
                        <span class="absolute inline-flex h-full w-full rounded-full bg-emerald-500 opacity-20 animate-ping"></span>
                        <span class="h-1 w-1 rounded-full bg-emerald-500"></span>
                    </span>
                    Connection Stable
                </div>
            </div>

            <!-- The Frame Wrapper -->
            <div class="w-full aspect-[4/3] lg:aspect-[16/9] bg-[#111113] border border-zinc-800/80 rounded-xl sm:rounded-2xl overflow-hidden shadow-2xl relative group ring-1 ring-white/5">
                
                <!-- Underlay / Loading state fallback -->
                <div class="absolute inset-0 flex flex-col items-center justify-center z-0 bg-zinc-950">
                    <iconify-icon icon="solar:planet-linear" class="text-4xl text-zinc-800 mb-3" stroke-width="1.5"></iconify-icon>
                    <p class="text-sm text-zinc-600 font-medium">Establishing link...</p>
                </div>

                <!-- Live Embed -->
                <iframe
                    src="https://dogeminer2.com"
                    class="w-full h-full absolute inset-0 z-10 border-0 bg-transparent"
                    title="Mining Application"
                    allowfullscreen>
                </iframe>

                <!-- Inner Shadow Overlay for Depth -->
                <div class="absolute inset-0 rounded-xl sm:rounded-2xl pointer-events-none z-20 shadow-[inset_0_0_0_1px_rgba(255,255,255,0.02)]"></div>
            </div>

            <!-- Footer Details -->
            <div class="flex items-center justify-between text-xs text-zinc-500 px-1 md:px-2 mt-2 font-medium">
                <div class="flex items-center gap-2">
                    <iconify-icon icon="solar:shield-check-linear" class="text-base text-zinc-600" stroke-width="1.5"></iconify-icon>
                    <span>Sandboxed Environment</span>
                </div>
                
                <a href="https://dogeminer2.com" target="_blank" rel="noopener noreferrer" class="hover:text-zinc-200 transition-colors duration-200 flex items-center gap-1 group">
                    External Launch
                    <iconify-icon icon="solar:arrow-right-up-linear" class="text-sm group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform duration-200" stroke-width="1.5"></iconify-icon>
                </a>
            </div>
        </div>
    </main>

</body>
</html>
