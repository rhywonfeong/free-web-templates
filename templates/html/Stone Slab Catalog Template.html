<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miracle Stone Impex | Premium Slab Archive</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
.no-scrollbar::-webkit-scrollbar {
display: none;
}
.no-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
.vertical-text {
writing-mode: vertical-rl;
text-orientation: mixed;
}
.perspective-container {
perspective: 1200px;
}
.slab-scene {
perspective: 1000px;
}
.slab-case {
transform-style: preserve-3d;
transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.slab-case.active {
transform: rotateY(-10deg) translateZ(30px);
}
.stone-texture {
mix-blend-mode: overlay;
pointer-events: none;
background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
}
</style>
<style>

</style>
<script>
// Configure Tailwind to include our custom 3D transform utilities
tailwind.config = {
theme: {

},
plugins: [
function({ addUtilities }) {
const rotateXUtilities = {};
const rotateYUtilities = {};
const rotateZUtilities = {};
const rotateValues = [0, 5, 10, 15, 20, 30, 45, 75];
// Generate rotate-x utilities
rotateValues.forEach((value) => {
rotateXUtilities[`.rotate-x-${value}`] = {

scaleY(var(--tw-scale-y, 1))
`.replace(/\\s+/g, ' ').trim(),
};
if (value !== 0) {
rotateXUtilities[`.-rotate-x-${value}`] = {

}
});
// Generate rotate-y utilities
rotateValues.forEach((value) => {

rotateX(var(--tw-rotate-x, 0))
rotateY(var(--tw-rotate-y, 0))
rotateZ(var(--tw-rotate-z, 0))
skewX(var(--tw-skew-x, 0))
skewY(var(--tw-skew-y, 0))
scaleX(var(--tw-scale-x, 1))
scaleY(var(--tw-scale-y, 1))
`.replace(/\\s+/g, ' ').trim(),
};
if (value !== 0) {
rotateYUtilities[`.-rotate-y-${value}`] = {
'--tw-rotate-y': `-${value}deg`,

`.replace(/\\s+/g, ' ').trim(),

}
});
// Generate rotate-z utilities
rotateValues.forEach((value) => {
rotateZUtilities[`.rotate-z-${value}`] = {
'--tw-rotate-z': `${value}deg`,
transform: `
translate3d(var(--tw-translate-x, 0), var(--tw-translate-y, 0), var(--tw-translate-z, 0))
rotateX(var(--tw-rotate-x, 0))
rotateY(var(--tw-rotate-y, 0))
rotateZ(var(--tw-rotate-z, 0))
skewX(var(--tw-skew-x, 0))

scaleX(var(--tw-scale-x, 1))

if (value !== 0) {

}
});
// Perspective utilities
const perspectiveUtilities = {
".perspective-none": { perspective: "none" },
".perspective-dramatic": { perspective: "100px" },
".perspective-near": { perspective: "300px" },
".perspective-normal": { perspective: "500px" },
".perspective-midrange": { perspective: "800px" },

const transformStyleUtilities = {

addUtilities({

]
};

</head>
<body class="bg-zinc-950 text-zinc-300 font-sans antialiased min-h-screen flex flex-col selection:bg-zinc-800 selection:text-white overflow-hidden">

    <!-- Header -->
    <header class="w-full px-8 py-6 flex justify-between items-center z-20 relative border-b border-zinc-900/50">
        <button class="group flex items-center gap-3 text-xs tracking-widest hover:text-white transition-colors uppercase">
            <div class="border border-zinc-800 px-3 py-1.5 rounded group-hover:border-zinc-600 transition-colors flex items-center gap-2">
                <iconify-icon icon="solar:arrow-left-linear" stroke-width="1.5"></iconify-icon>
                Website
            </div>
            <span class="opacity-50 hidden sm:inline-block">Company Overview</span>
        </button>

        <div class="flex flex-col items-center text-center">
            <h1 class="text-xs tracking-[0.2em] text-zinc-100 font-medium uppercase">
                Miracle Stone Impex
                <span class="text-zinc-500 block mt-1 tracking-widest">Premium Slab Archive</span>
            </h1>
        </div>

        <div class="text-xs tracking-widest opacity-50 uppercase text-right">
            <span class="hidden sm:block">Crafting Excellence</span>
            <span>Est. Rajasthan</span>
        </div>
    </header>

    <!-- Filter Navigation -->
    <nav class="w-full flex justify-center py-8 z-20 relative">
        <div class="flex items-center gap-1 bg-zinc-900/40 p-1.5 rounded-lg backdrop-blur-md border border-zinc-800/50">
            <button class="px-5 py-2 text-xs bg-zinc-200 text-zinc-950 font-medium rounded shadow-sm transition-all uppercase tracking-wider">All Surfaces</button>
            <button class="px-5 py-2 text-xs hover:bg-zinc-800/80 hover:text-zinc-100 transition-all rounded text-zinc-400 uppercase tracking-wider">Granite</button>
            <button class="px-5 py-2 text-xs hover:bg-zinc-800/80 hover:text-zinc-100 transition-all rounded text-zinc-400 uppercase tracking-wider">Marble</button>
            <button class="px-5 py-2 text-xs hover:bg-zinc-800/80 hover:text-zinc-100 transition-all rounded text-zinc-400 uppercase tracking-wider">Quartzite</button>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 relative flex flex-col justify-center items-center w-full perspective-container">
        
        <!-- Carousel/Grid -->
        <div class="relative w-full h-[55vh] min-h-[400px] flex items-center justify-center gap-4 px-12 overflow-x-auto no-scrollbar" id="gallery-container">
            <!-- Items injected via JS -->
        </div>

        <!-- Info Footer -->
        <div class="absolute bottom-0 left-0 w-full pb-8 pt-24 bg-gradient-to-t from-zinc-950 via-zinc-950/90 to-transparent z-30 flex flex-col items-center justify-end pointer-events-none">
            
            <!-- Navigation Arrows -->
            <div class="w-full absolute top-1/2 -translate-y-1/2 flex justify-between px-8 sm:px-16 pointer-events-auto">
                <button class="p-3 sm:p-4 rounded-full bg-zinc-900/50 border border-zinc-800 hover:bg-zinc-800 backdrop-blur-sm transition-all text-zinc-400 hover:text-zinc-100 flex items-center justify-center group" id="prev-btn">
                    <iconify-icon icon="solar:alt-arrow-left-linear" width="20" stroke-width="1.5" class="group-hover:-translate-x-0.5 transition-transform"></iconify-icon>
                </button>
                <button class="p-3 sm:p-4 rounded-full bg-zinc-900/50 border border-zinc-800 hover:bg-zinc-800 backdrop-blur-sm transition-all text-zinc-400 hover:text-zinc-100 flex items-center justify-center group" id="next-btn">
                    <iconify-icon icon="solar:alt-arrow-right-linear" width="20" stroke-width="1.5" class="group-hover:translate-x-0.5 transition-transform"></iconify-icon>
                </button>
            </div>

            <!-- Stone Details -->
            <div class="text-center space-y-4 pointer-events-auto transition-all duration-500 ease-out" id="info-panel">
                <h2 class="text-3xl sm:text-5xl font-normal tracking-tight text-zinc-100" id="stone-title">Alaska Gold</h2>
                <div class="flex items-center justify-center gap-4 text-xs tracking-widest text-zinc-400 uppercase">
                    <span id="stone-category">Granite</span>
                    <span class="w-1 h-1 rounded-full bg-zinc-700"></span>
                    <span id="stone-finish">Polish Finish</span>
                    <span class="w-1 h-1 rounded-full bg-zinc-700 hidden sm:block"></span>
                    <span class="hidden sm:block">Gangsaw Exclusive</span>
                </div>
            </div>

            <!-- Bottom Bar -->
            <div class="w-full flex justify-between items-end px-8 mt-12 text-xs tracking-widest text-zinc-500 uppercase">
                <div class="flex flex-col gap-1">
                    <p class="text-zinc-400">Monthly Prod: 2.25L sq ft</p>
                    <p class="opacity-60">100% Italian Machinery</p>
                </div>
                <div class="flex gap-6">
                    <span class="hover:text-zinc-300 cursor-pointer transition-colors border-b border-transparent hover:border-zinc-300 pb-0.5">Specs</span>
                    <span class="hover:text-zinc-300 cursor-pointer transition-colors border-b border-transparent hover:border-zinc-300 pb-0.5">Inquire</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const products = [
            { id: 1, title: "Alabaster White", type: "Granite", finish: "Leather / Polish", color: "bg-zinc-200", spineColor: "bg-zinc-300", textColor: "text-zinc-800", img: "https://images.unsplash.com/photo-1618220179428-22790b46a0eb?q=80&w=800&auto=format&fit=crop" },
            { id: 2, title: "Black Markino", type: "Marble", finish: "Polish", color: "bg-zinc-900", spineColor: "bg-zinc-900", textColor: "text-zinc-300", img: "https://images.unsplash.com/photo-1620215738871-331610492801?q=80&w=800&auto=format&fit=crop" },
            { id: 3, title: "Taj Mahal", type: "Quartz", finish: "Honed / Polish", color: "bg-stone-200", spineColor: "bg-stone-300", textColor: "text-stone-800", img: "https://images.unsplash.com/photo-1601614392264-16a4220b2247?q=80&w=800&auto=format&fit=crop" },
            { id: 4, title: "Blue Dunes", type: "Granite", finish: "Polish", color: "bg-slate-800", spineColor: "bg-slate-900", textColor: "text-slate-300", img: "https://images.unsplash.com/photo-1588001007887-194160a7e638?q=80&w=800&auto=format&fit=crop" },
            { id: 5, title: "Statuario", type: "Marble", finish: "Polish", color: "bg-neutral-100", spineColor: "bg-neutral-200", textColor: "text-neutral-800", img: "https://images.unsplash.com/photo-1502005097973-f5ae3e125c15?q=80&w=800&auto=format&fit=crop" },
            { id: 6, title: "Patagonia Gold", type: "Quartz", finish: "Polish", color: "bg-amber-100", spineColor: "bg-amber-200", textColor: "text-amber-900", img: "https://images.unsplash.com/photo-1598251261271-e945c71a39f0?q=80&w=800&auto=format&fit=crop" },
            { id: 7, title: "Rajasthan Black", type: "Granite", finish: "Leather / Polish", color: "bg-zinc-950", spineColor: "bg-black", textColor: "text-zinc-400", img: "https://images.unsplash.com/photo-1586041982760-4927ebaf70f1?q=80&w=800&auto=format&fit=crop" },
            { id: 8, title: "Fantasy Brown", type: "Marble", finish: "Polish", color: "bg-stone-300", spineColor: "bg-stone-400", textColor: "text-stone-900", img: "https://images.unsplash.com/photo-1554160759-3fb6245d8b7b?q=80&w=800&auto=format&fit=crop" },
            { id: 9, title: "Cristello", type: "Quartz", finish: "Polish", color: "bg-zinc-100", spineColor: "bg-zinc-200", textColor: "text-zinc-800", img: "https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=800&auto=format&fit=crop" }
        ];

        let activeIndex = 4;

        const container = document.getElementById('gallery-container');
        const titleEl = document.getElementById('stone-title');
        const catEl = document.getElementById('stone-category');
        const finishEl = document.getElementById('stone-finish');

        function render() {
            container.innerHTML = '';
            
            products.forEach((product, index) => {
                const isActive = index === activeIndex;
                const item = document.createElement('div');
                
                item.className = `
                    relative cursor-pointer transition-all duration-700 ease-out group slab-scene flex-shrink-0
                    ${isActive ? 'w-[320px] sm:w-[400px] z-10 mx-6 sm:mx-12' : 'w-16 hover:w-20 opacity-50 hover:opacity-100 z-0 grayscale-[0.8] hover:grayscale-0'}
                `;
                item.style.height = isActive ? '100%' : '90%';
                
                item.onclick = () => {
                    if (activeIndex !== index) {
                        activeIndex = index;
                        render();
                        updateInfo();
                    }
                };

                const card = document.createElement('div');
                card.className = `slab-case w-full h-full relative ${isActive ? 'active shadow-2xl shadow-black/50' : 'shadow-lg'}`;

                if (isActive) {
                    card.innerHTML = `
                        <!-- Main Slab Face -->
                        <div class="absolute inset-0 w-full h-full bg-zinc-900 overflow-hidden rounded-[2px] border border-zinc-700/50">
                            <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/917d6f93-fb36-439a-8c48-884b67b35381_1600w.jpg" class="w-full h-full object-cover opacity-90 transition-transform duration-1000 scale-105 group-hover:scale-100" alt="${product.title}">
                            <div class="absolute inset-0 bg-gradient-to-t from-zinc-950/90 via-zinc-950/20 to-transparent"></div>
                            
                            <!-- Stone Grain Texture Overlay -->
                            <div class="absolute inset-0 stone-texture"></div>

                            <!-- Top Specs -->
                            <div class="absolute top-6 left-6 w-full z-10 flex gap-3">
                                <span class="bg-zinc-100/10 backdrop-blur-md border border-zinc-100/20 text-zinc-100 text-xs px-2.5 py-1 rounded-[2px] tracking-widest uppercase">Gangsaw Cut</span>
                                <span class="bg-zinc-100/5 backdrop-blur-md border border-zinc-100/10 text-zinc-300 text-xs px-2.5 py-1 rounded-[2px] tracking-widest uppercase"><iconify-icon icon="solar:maximize-linear" class="inline-block align-text-bottom mr-1"></iconify-icon>2/3cm</span>
                            </div>
                            
                            <!-- Bottom Label -->
                            <div class="absolute bottom-6 left-6 right-6 z-10 bg-zinc-950/60 backdrop-blur-xl border border-zinc-800/50 p-5 rounded-[2px]">
                                <h3 class="text-xl sm:text-2xl font-normal tracking-tight text-zinc-100 mb-1">${product.title}</h3>
                                <p class="text-xs text-zinc-400 uppercase tracking-widest flex justify-between items-center">
                                    <span>${product.type}</span>
                                    <span>${product.finish}</span>
                                </p>
                            </div>
                        </div>

                        <!-- 3D Edge (Simulated Thickness) -->
                        <div class="absolute top-0 bottom-0 -left-[24px] w-[24px] bg-zinc-900 border-r border-zinc-800/80 transform origin-right -rotate-y-90 flex flex-col items-center py-6 overflow-hidden" style="transform: rotateY(-90deg) translateX(-24px);">
                             <div class="flex-1 vertical-text text-xs tracking-widest text-zinc-600 uppercase w-full text-center">${product.id.toString().padStart(3, '0')}</div>
                        </div>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="w-full h-full ${product.spineColor} relative overflow-hidden border-l border-r border-black/10 flex flex-col items-center py-8 justify-between transition-colors rounded-[1px]">
                            
                            <div class="flex flex-col items-center gap-3">
                                <span class="text-xs font-medium tracking-widest ${product.textColor} opacity-40 uppercase">${product.type.substring(0,3)}</span>
                                <div class="w-full h-[1px] bg-black/10"></div>
                            </div>

                            <div class="flex-1 flex items-center justify-center py-4">
                                <h4 class="vertical-text text-sm font-medium tracking-widest uppercase ${product.textColor} opacity-80 whitespace-nowrap">
                                    ${product.title}
                                </h4>
                            </div>

                            <div class="absolute inset-0 stone-texture opacity-50"></div>
                            
                            <div class="flex flex-col items-center gap-2">
                                <div class="w-4 h-4 border border-black/20 rounded-full flex items-center justify-center">
                                    <div class="w-1 h-1 bg-black/40 rounded-full"></div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                item.appendChild(card);
                container.appendChild(item);
            });
        }

        function updateInfo() {
            const product = products[activeIndex];
            const panel = document.getElementById('info-panel');
            
            panel.style.opacity = '0';
            panel.style.transform = 'translateY(8px)';
            
            setTimeout(() => {
                titleEl.textContent = product.title;
                catEl.textContent = product.type;
                finishEl.textContent = product.finish;
                
                panel.style.opacity = '1';
                panel.style.transform = 'translateY(0)';
            }, 300);
        }

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (activeIndex > 0) {
                activeIndex--;
                render();
                updateInfo();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (activeIndex < products.length - 1) {
                activeIndex++;
                render();
                updateInfo();
            }
        });

        render();
        updateInfo();
    </script>
</body>
</html>
