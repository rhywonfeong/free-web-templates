        <!-- Ikona nagłówka -->
        <div class="w-16 h-16 md:w-20 md:h-20 rounded-full border border-emerald-500/20 bg-emerald-500/10 flex items-center justify-center mb-6 md:mb-8">

        <h2 class="text-3xl md:text-5xl font-semibold tracking-tight text-white mb-4 md:mb-6">

        <!-- Paragraf -->
        <p class="text-lg md:text-xl text-zinc-400 max-w-2xl mb-10 md:mb-12 leading-relaxed">
            Zadzwoń do nas, z przyjemnością odpowiemy na wszystkie Twoje pytania dotyczące warsztatów stacjonarnych.
        </p>

        <!-- Przycisk -->
        <a href="tel:602727263" class="inline-flex items-center gap-3 bg-[#0fb773] hover:bg-[#0da064] text-white font-medium text-lg md:text-xl px-8 py-4 md:px-10 md:py-5 rounded-full transition-all duration-300 shadow-[0_0_40px_-10px_rgba(15,183,115,0.6)] hover:shadow-[0_0_50px_-10px_rgba(15,183,115,0.8)]">
            <i data-lucide="phone" class="w-5 h-5 md:w-6 md:h-6" stroke-width="1.5"></i>
