<style>
body {
-webkit-tap-highlight-color: transparent;
user-select: none;
overscroll-behavior: none;
}
/* Hide scrollbar */
::-webkit-scrollbar { display: none; }
/* Subtle Grid Background */
.bg-grid {
background-size: 24px 24px;
mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
-webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
}
/* Glass Effect (Clean) */
.glass-panel {
background: rgba(20, 20, 23, 0.6);
backdrop-filter: blur(12px);
-webkit-backdrop-filter: blur(12px);
border: 1px solid rgba(255, 255, 255, 0.08);
box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
/* App Icon Base */
.app-icon {
transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
box-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.app-icon:hover {
transform: translateY(-4px) scale(1.05);
box-shadow: 0 12px 24px rgba(0,0,0,0.5);
border-color: rgba(255,255,255,0.2);
z-index: 10;
}
[x-cloak] { display: none !important; }
</style></head>

<body class="bg-black text-zinc-400 h-screen w-full overflow-hidden relative selection:bg-white/20" x-data="canvasSystem()">

    <!-- 1. Background Grid Layer -->
    <div class="fixed inset-0 pointer-events-none opacity-20 z-0">
        <div class="absolute inset-0 bg-grid-pattern bg-grid" 
             :style="`transform: translate(${posX % 24}px, ${posY % 24}px)`"></div>
    </div>

    <!-- 2. Infinite Canvas Layer -->
    <div class="absolute inset-0 z-10 cursor-grab active:cursor-grabbing will-change-transform" 
         @mousedown="startPan" @mousemove="pan" @mouseup="endPan" @mouseleave="endPan"
         @touchstart="startPan" @touchmove="pan" @touchend="endPan"
         @wheel.prevent="handleWheel">
        
        <div class="absolute top-1/2 left-1/2 will-change-transform transition-transform duration-75 cubic-bezier(0,0,0,1) origin-center"
             :style="`transform: translate(calc(-50% + ${posX}px), calc(-50% + ${posY}px)) scale(${scale})`">

            <!-- CLUSTER: DEVELOPMENT (Center) -->
            <div class="absolute top-0 left-0 -translate-x-1/2 -translate-y-1/2 w-[340px]">
                <div class="glass-panel rounded-3xl p-6 flex flex-col gap-6">
                    <div class="flex items-center justify-between border-b border-white/5 pb-4">
                        <div class="flex items-center gap-2">
                            <span class="iconify text-zinc-100" data-icon="lucide:terminal-square"></span>
                            <span class="text-xs font-medium tracking-wide text-zinc-100">Development</span>
                        </div>
                        <div class="flex gap-1">
                            <div class="w-2 h-2 rounded-full bg-emerald-500/20 border border-emerald-500/50"></div>
                            <div class="w-2 h-2 rounded-full bg-zinc-700/50 border border-white/5"></div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-4 gap-4">
                        <template x-for="app in apps.dev" :key="app.id">
                            <div class="group flex flex-col items-center gap-2 cursor-pointer">
                                <div class="app-icon w-14 h-14 rounded-xl bg-zinc-800/50 border border-white/5 flex items-center justify-center text-zinc-300 group-hover:text-white group-hover:bg-zinc-800 ring-1 ring-inset ring-white/0 group-hover:ring-white/10">
                                    <span class="iconify text-2xl" :data-icon="app.icon"></span>
                                </div>
                                <span class="text-[10px] font-medium opacity-0 group-hover:opacity-100 transition-opacity translate-y-1 group-hover:translate-y-0 duration-200" x-text="app.name"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- CLUSTER: DESIGN (Right) -->
            <div class="absolute top-[-40px] left-[320px] w-[280px]">
                <div class="glass-panel rounded-3xl p-5 flex flex-col gap-4">
                    <div class="flex items-center gap-2 pb-2 border-b border-white/5">
                        <span class="iconify text-zinc-400" data-icon="lucide:pen-tool"></span>
                        <span class="text-xs font-medium tracking-wide text-zinc-400">Design System</span>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <template x-for="app in apps.design" :key="app.id">
                            <div class="group flex flex-col items-center gap-2 cursor-pointer">
                                <div class="app-icon w-12 h-12 rounded-2xl bg-gradient-to-br from-zinc-800 to-zinc-900 border border-white/5 flex items-center justify-center text-zinc-300 group-hover:text-white">
                                    <span class="iconify text-xl" :data-icon="app.icon"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- CLUSTER: MESSAGING (Left) -->
            <div class="absolute top-[80px] left-[-280px] w-[240px]">
                <div class="glass-panel rounded-3xl p-1 space-y-1">
                    <template x-for="app in apps.social" :key="app.id">
                        <div class="group flex items-center gap-3 p-3 rounded-2xl hover:bg-white/5 transition-colors cursor-pointer border border-transparent hover:border-white/5">
                            <div class="w-8 h-8 rounded-lg bg-zinc-800 flex items-center justify-center text-zinc-400 group-hover:text-white">
                                <span class="iconify text-sm" :data-icon="app.icon"></span>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-xs font-medium text-zinc-300" x-text="app.name"></span>
                                <span class="text-[9px] text-zinc-500 font-mono tracking-tight" x-text="app.status"></span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- CLUSTER: SYSTEM (Bottom) -->
            <div class="absolute top-[280px] left-[-20px] w-[180px]">
                <div class="flex flex-wrap gap-2 justify-center">
                    <template x-for="app in apps.system" :key="app.id">
                        <div class="app-icon w-10 h-10 rounded-full glass-panel flex items-center justify-center text-zinc-500 hover:text-zinc-200 cursor-pointer">
                            <span class="iconify text-lg" :data-icon="app.icon"></span>
                        </div>
                    </template>
                </div>
            </div>

        </div>
    </div>

    <!-- 3. UI Overlay (Static) -->
    <div class="fixed inset-0 pointer-events-none z-50 flex flex-col justify-between p-6">
        
        <!-- Top Bar -->
        <header class="flex justify-between items-start pointer-events-auto">
            <div class="flex flex-col gap-1">
                <h1 class="text-sm font-semibold tracking-tight text-white flex items-center gap-2">
                    <span class="w-2 h-2 bg-white rounded-full"></span>
                    LiveDesk
                </h1>
                <p class="text-[10px] text-zinc-500 font-mono uppercase tracking-widest">Workspace v20.4</p>
            </div>
            
            <button @click="resetView" class="group flex items-center gap-2 px-3 py-1.5 rounded-full bg-zinc-900/80 border border-white/10 hover:border-white/20 hover:bg-zinc-800 transition-all backdrop-blur-md">
                <span class="iconify text-zinc-400 group-hover:text-white text-xs" data-icon="lucide:locate-fixed"></span>
                <span class="text-[10px] font-medium text-zinc-400 group-hover:text-white">Reset</span>
            </button>
        </header>

        <!-- Bottom Command Bar -->
        <div class="mx-auto pointer-events-auto w-full max-w-sm">
            <div class="glass-panel rounded-full p-1.5 pl-4 flex items-center gap-3 transition-transform hover:scale-[1.02]">
                <span class="iconify text-zinc-500" data-icon="lucide:search"></span>
                <input type="text" placeholder="Search applications..." 
                       class="bg-transparent border-none outline-none text-sm text-white placeholder-zinc-600 w-full font-light h-8">
                <div class="flex gap-1 pr-1">
                    <button class="w-8 h-8 rounded-full bg-zinc-800 hover:bg-zinc-700 flex items-center justify-center text-zinc-400 transition-colors">
                        <span class="iconify" data-icon="lucide:command"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function canvasSystem() {
            return {
                scale: 1,
                posX: 0,
                posY: 0,
                isDragging: false,
                startX: 0,
                startY: 0,
                initialX: 0,
                initialY: 0,
                
                apps: {
                    dev: [
                        { id: 1, name: 'VS Code', icon: 'lucide:code-2' },
                        { id: 2, name: 'Terminal', icon: 'lucide:terminal' },
                        { id: 3, name: 'GitHub', icon: 'lucide:github' },
                        { id: 4, name: 'Docker', icon: 'lucide:container' },
                        { id: 5, name: 'Database', icon: 'lucide:database' },
                        { id: 6, name: 'Vercel', icon: 'lucide:triangle' },
                        { id: 7, name: 'Cloud', icon: 'lucide:cloud' },
                        { id: 8, name: 'Server', icon: 'lucide:server' },
                    ],
                    design: [
                        { id: 10, name: 'Figma', icon: 'lucide:figma' },
                        { id: 11, name: 'Linear', icon: 'lucide:pen-line' },
                        { id: 12, name: 'Frame', icon: 'lucide:layout' },
                        { id: 13, name: 'Colors', icon: 'lucide:palette' },
                        { id: 14, name: 'Type', icon: 'lucide:type' },
                        { id: 15, name: 'Image', icon: 'lucide:image' },
                    ],
                    social: [
                        { id: 20, name: 'Slack', icon: 'lucide:hash', status: '2 mentions' },
                        { id: 21, name: 'Discord', icon: 'lucide:gamepad-2', status: 'Idle' },
                        { id: 22, name: 'Mail', icon: 'lucide:mail', status: 'Inbox Zero' },
                    ],
                    system: [
                        { id: 30, icon: 'lucide:settings' },
                        { id: 31, icon: 'lucide:wifi' },
                        { id: 32, icon: 'lucide:bluetooth' },
                        { id: 33, icon: 'lucide:battery-medium' },
                    ]
                },

                startPan(e) {
                    // Prevent drag if clicking a button or input
                    if(e.target.closest('button') || e.target.closest('input')) return;
                    
                    this.isDragging = true;
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    this.startX = clientX;
                    this.startY = clientY;
                    this.initialX = this.posX;
                    this.initialY = this.posY;
                },

                pan(e) {
                    if (!this.isDragging) return;
                    e.preventDefault();
                    
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    
                    // Direct manipulation delta
                    const dx = (clientX - this.startX);
                    const dy = (clientY - this.startY);
                    
                    // Apply delta adjusted by scale to keep 1:1 feel
                    this.posX = this.initialX + (dx / this.scale);
                    this.posY = this.initialY + (dy / this.scale);
                },

                endPan() {
                    this.isDragging = false;
                },

                handleWheel(e) {
                    // Smooth zoom
                    const zoomSensitivity = 0.001;
                    const newScale = this.scale - (e.deltaY * zoomSensitivity);
                    
                    // Clamp scale
                    this.scale = Math.min(Math.max(0.5, newScale), 3);
                },

                resetView() {
                    this.scale = 1;
                    this.posX = 0;
                    this.posY = 0;
                }
            }
        }
    </script>
</body>
