  <meta charset="UTF-8">
  <title>Animated Button</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      background: #171618;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    @keyframes animate1 {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @keyframes animate2 {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    @keyframes animate3 {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    @keyframes animate4 {
      0% { transform: translateY(100%); }
      100% { transform: translateY(-100%); }
    }
  </style>
</head>
<body>
  <a
    href="https://youtube.com/c/shortcode"
    target="_blank"
    class="relative px-[60px] py-[30px] shadow-[0_0_10px_5px_rgba(0,0,0,0.4)] text-[#999] no-underline uppercase tracking-[4px] font-bold font-mono overflow-hidden inline-block text-[30px] select-none"
    style="font-family:Consolas,monospace;"
  >
    <span
      class="absolute top-0 right-0 w-full h-[3px]"
      style="
        background: linear-gradient(to right, #171618, #37F4FA);
        animation: animate1 2s linear infinite;
      "
    ></span>
    <span
      class="absolute top-0 right-0 h-full w-[3px]"
      style="
        background: linear-gradient(to bottom, #171618, #37F4FA);
        animation: animate2 2s linear infinite;
        animation-delay: 1s;
      "
    ></span>
    <span
      class="absolute bottom-0 right-0 w-full h-[3px]"
      style="
        background: linear-gradient(to left, #171618, #37F4FA);
        animation: animate3 2s linear infinite;
      "
    ></span>
    <span
      class="absolute top-0 left-0 h-full w-[3px]"
      style="
        background: linear-gradient(to top, #171618, #37F4FA);
        animation: animate4 2s linear infinite;
        animation-delay: 1s;
      "
    ></span>
    Getting Started
  </a>
</body>
</html>
