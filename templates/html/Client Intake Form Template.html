<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intake Form</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
}
</style><!-- aura-ga4-start -->

<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col items-center pt-10 sm:pt-20 pb-24 px-4 sm:px-6 selection:bg-blue-100 selection:text-blue-900">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-sm border border-gray-200/60 p-6 sm:p-12">
        
        <!-- Logo -->
        <div class="mb-12">
            <span class="text-sm font-medium tracking-tighter text-blue-600 uppercase">INTAKE</span>
        </div>

        <form id="intakeForm" class="space-y-10" onsubmit="event.preventDefault();">
            
            <!-- Initial Question / Toggles -->
            <div class="space-y-6">
                <h1 class="text-2xl sm:text-3xl font-medium tracking-tight text-gray-900">What stage are you at?</h1>
                
                <div class="grid sm:grid-cols-2 gap-4">
                    <!-- Option 1: Free Preview -->
                    <label class="relative flex flex-col cursor-pointer group">
                        <input type="radio" name="project_stage" value="preview" class="peer hidden" onchange="toggleFormSections()">
                        <div class="h-full border border-gray-200 rounded-xl p-6 group-hover:border-gray-300 group-hover:bg-gray-50/50 peer-checked:border-blue-600 peer-checked:bg-blue-50/40 peer-checked:ring-1 peer-checked:ring-blue-600 transition-all">
                            <iconify-icon icon="solar:eye-linear" class="text-2xl text-blue-600 mb-4" style="stroke-width: 1.5;"></iconify-icon>
                            <h3 class="text-base font-medium text-gray-900 mb-1.5">Free preview</h3>
                            <p class="text-sm text-gray-500 leading-relaxed">Get a basic concept using just your core business details.</p>
                        </div>
                    </label>

                    <!-- Option 2: Full Build -->
                    <label class="relative flex flex-col cursor-pointer group">
                        <input type="radio" name="project_stage" value="full" class="peer hidden" onchange="toggleFormSections()">
                        <div class="h-full border border-gray-200 rounded-xl p-6 group-hover:border-gray-300 group-hover:bg-gray-50/50 peer-checked:border-blue-600 peer-checked:bg-blue-50/40 peer-checked:ring-1 peer-checked:ring-blue-600 transition-all">
                            <iconify-icon icon="solar:rocket-linear" class="text-2xl text-blue-600 mb-4" style="stroke-width: 1.5;"></iconify-icon>
                            <h3 class="text-base font-medium text-gray-900 mb-1.5">Full build</h3>
                            <p class="text-sm text-gray-500 leading-relaxed">Ready to start? Fill out the comprehensive questionnaire.</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Dynamic Form Container -->
            <div id="dynamicFormContainer" class="hidden space-y-10 pt-4 border-t border-gray-100">
                
                <!-- Section 1: Business Info (Always shown when a toggle is clicked) -->
                <div class="space-y-6">
                    <h2 class="text-xl font-medium tracking-tight text-gray-900">1. Business Information</h2>
                    <div class="space-y-5">
                        <div class="grid sm:grid-cols-2 gap-5">
                            <div class="space-y-1.5">
                                <label for="fullName" class="block text-sm font-medium text-gray-700">Full Name</label>
                                <input type="text" id="fullName" class="w-full border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-colors placeholder:text-gray-400 bg-white" placeholder="Jane Doe">
                            </div>
                            <div class="space-y-1.5">
                                <label for="email" class="block text-sm font-medium text-gray-700">Work Email</label>
                                <input type="email" id="email" class="w-full border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-colors placeholder:text-gray-400 bg-white" placeholder="jane@company.com">
                            </div>
                        </div>
                        
                        <div class="space-y-1.5">
                            <label for="industry" class="block text-sm font-medium text-gray-700">Industry</label>
                            <div class="relative">
                                <select id="industry" class="w-full border border-gray-200 rounded-lg pl-3.5 pr-10 py-2.5 text-sm text-gray-900 appearance-none focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-colors bg-white cursor-pointer">
                                    <option value="" disabled selected>Select an industry...</option>
                                    <option value="saas">SaaS / Software</option>
                                    <option value="ecommerce">E-commerce</option>
                                    <option value="agency">Agency / Services</option>
                                    <option value="healthcare">Healthcare</option>
                                    <option value="other">Other</option>
                                </select>
                                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                                    <iconify-icon icon="solar:alt-arrow-down-linear" style="stroke-width: 1.5;"></iconify-icon>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Full Questionnaire (Only shown for 'Full build') -->
                <div id="fullQuestionnaireSection" class="hidden space-y-6 pt-4 border-t border-gray-100">
                    <h2 class="text-xl font-medium tracking-tight text-gray-900">2. Project Details</h2>
                    <div class="space-y-6">
                        
                        <div class="space-y-1.5">
                            <label for="description" class="block text-sm font-medium text-gray-700">Project Description</label>
                            <textarea id="description" rows="4" class="w-full border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-blue-600/20 focus:border-blue-600 outline-none transition-colors placeholder:text-gray-400 resize-y bg-white" placeholder="Tell us about the problem you are trying to solve..."></textarea>
                        </div>

                        <div class="space-y-3">
                            <label class="block text-sm font-medium text-gray-700">Estimated Budget</label>
                            <div class="space-y-2.5">
                                <!-- Custom Radio 1 -->
                                <label class="flex items-center cursor-pointer group">
                                    <div class="relative flex items-center justify-center w-4 h-4">
                                        <input type="radio" name="budget" value="small" class="peer sr-only">
                                        <div class="absolute inset-0 rounded-full border border-gray-300 peer-checked:border-blue-600 peer-checked:border-[4.5px] transition-all bg-white"></div>
                                    </div>
                                    <span class="ml-3 text-sm text-gray-600 group-hover:text-gray-900 transition-colors">Under $5k</span>
                                </label>
                                <!-- Custom Radio 2 -->
                                <label class="flex items-center cursor-pointer group">
                                    <div class="relative flex items-center justify-center w-4 h-4">
                                        <input type="radio" name="budget" value="medium" class="peer sr-only">
                                        <div class="absolute inset-0 rounded-full border border-gray-300 peer-checked:border-blue-600 peer-checked:border-[4.5px] transition-all bg-white"></div>
                                    </div>
                                    <span class="ml-3 text-sm text-gray-600 group-hover:text-gray-900 transition-colors">$5k - $15k</span>
                                </label>
                                <!-- Custom Radio 3 -->
                                <label class="flex items-center cursor-pointer group">
                                    <div class="relative flex items-center justify-center w-4 h-4">
                                        <input type="radio" name="budget" value="large" class="peer sr-only">
                                        <div class="absolute inset-0 rounded-full border border-gray-300 peer-checked:border-blue-600 peer-checked:border-[4.5px] transition-all bg-white"></div>
                                    </div>
                                    <span class="ml-3 text-sm text-gray-600 group-hover:text-gray-900 transition-colors">$15k+</span>
                                </label>
                            </div>
                        </div>

                        <div class="pt-2">
                            <!-- Custom Checkbox -->
                            <label class="flex items-start cursor-pointer group">
                                <div class="relative flex items-center justify-center w-4 h-4 mt-0.5 shrink-0">
                                    <input type="checkbox" name="urgent" class="peer sr-only">
                                    <div class="absolute inset-0 rounded border border-gray-300 peer-checked:bg-blue-600 peer-checked:border-blue-600 transition-colors bg-white"></div>
                                    <iconify-icon icon="solar:check-read-linear" class="absolute text-white opacity-0 peer-checked:opacity-100 transition-opacity z-10" style="font-size: 12px; stroke-width: 2;"></iconify-icon>
                                </div>
                                <span class="ml-3 text-sm text-gray-600 group-hover:text-gray-900 transition-colors">This project is urgent and needs to be completed within 30 days.</span>
                            </label>
                        </div>

                    </div>
                </div>

                <!-- Submit Action -->
                <div class="pt-6">
                    <button type="submit" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2.5 px-6 rounded-lg transition-colors shadow-sm flex items-center justify-center gap-2 focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 outline-none">
                        Submit Request
                        <iconify-icon icon="solar:arrow-right-linear" style="stroke-width: 1.5;"></iconify-icon>
                    </button>
                </div>
                
            </div>
        </form>
    </div>

    <script>
        function toggleFormSections() {
            const selectedStage = document.querySelector('input[name="project_stage"]:checked');
            const dynamicContainer = document.getElementById('dynamicFormContainer');
            const fullQuestionnaire = document.getElementById('fullQuestionnaireSection');

            if (selectedStage) {
                // Always show the container once a choice is made
                dynamicContainer.classList.remove('hidden');
                
                // Determine if we show the full section based on value
                if (selectedStage.value === 'full') {
                    fullQuestionnaire.classList.remove('hidden');
                } else {
                    fullQuestionnaire.classList.add('hidden');
                }
            }
        }
    </script>
</body>
</html>
