  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Stats Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(to bottom right, #0f172a, #020617);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    
    .gradient-bg {
      background: linear-gradient(180deg, rgba(34, 211, 238, 0.3) 0%, rgba(25, 22, 48, 0) 29%);
    }
    
    .radial-bg {
      background: radial-gradient(circle at 60% 110%, rgba(42, 144, 169, 0.5) 0%, rgba(25, 22, 48, 0) 79%);
    }
    
    .bar-gradient {
      background: linear-gradient(180deg, rgba(51, 239, 183, 1) 0%, rgba(11, 209, 242, 1) 100%);
    }
    
    .inner-shadow {
      box-shadow: inset 0 0 24px rgba(42, 144, 169, 0.5);
    }

    .chart-tooltip {
      transform: translateX(-50%);
      transition: all 0.2s ease;
    }

    .chart-column:hover .chart-tooltip {
      transform: translateX(-50%) translateY(-5px);
    }

    @media (max-width: 480px) {
      .stats-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="w-full max-w-md mx-auto">
    <div class="relative rounded-2xl border border-cyan-400/30 overflow-hidden backdrop-blur-3xl gradient-bg radial-bg">
      <!-- Header Section -->
      <div class="p-4 sm:p-6 flex justify-between items-start stats-header">
        <div>
          <h3 class="text-xl font-bold text-white -tracking-tight">New User</h3>
          <p class="text-xs text-white/70 -tracking-tight mt-1">Last 6 months</p>
        </div>
        
        <div class="flex items-center">
          <div class="bg-white/5 rounded-md px-2.5 py-1 backdrop-blur-3xl border border-white/50 border-opacity-50">
            <div class="flex items-center space-x-2">
              <div class="w-2.5 h-2.5 rounded-full bg-blue-500"></div>
              <p class="text-sm sm:text-base font-semibold text-white -tracking-tight">Overall - 80%</p>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Chart Section -->
      <div class="px-3 sm:px-5 pt-2 pb-4">
        <div class="flex space-x-2 sm:space-x-3">
          <!-- Y-axis labels -->
          <div class="flex flex-col justify-between text-right text-xs text-white/70 py-1">
            <p>100</p>
            <p class="py-1">75</p>
            <p class="py-1">50</p>
            <p class="py-1">25</p>
            <p>0</p>
          </div>
          
          <!-- Chart Area -->
          <div class="flex-1 relative">
            <!-- Grid Lines -->
            <div class="absolute inset-0 border border-white/20 border-dashed rounded-md">
              <div class="absolute w-full h-px border-t border-white/20 border-dashed top-1/4"></div>
              <div class="absolute w-full h-px border-t border-white/20 border-dashed top-2/4"></div>
              <div class="absolute w-full h-px border-t border-white/20 border-dashed top-3/4"></div>
            </div>
            
            <!-- Bars -->
            <div class="flex justify-between h-40 sm:h-48 gap-4 sm:gap-6 py-2">
              <!-- Column 1 -->
              <div class="flex-1 flex flex-col justify-end relative chart-column group">
                <div class="absolute top-8 sm:top-10 left-1/2 chart-tooltip bg-white/5 rounded-md px-2 py-1 backdrop-blur-3xl border border-white/50 border-opacity-50 z-10">
                  <p class="text-xs sm:text-sm font-semibold text-white/70 text-center">80%</p>
                  <p class="text-xs sm:text-sm font-semibold text-white text-center">46K</p>
                </div>
                
                <div class="w-full h-[75%] rounded-t-md border border-cyan-400/30 inner-shadow overflow-hidden">
                  <div class="h-[10%] w-full"></div>
                  <div class="h-[90%] w-full bar-gradient"></div>
                </div>
              </div>
              
              <!-- Column 2 -->
              <div class="flex-1 flex flex-col justify-end relative chart-column group">
                <div class="absolute top-14 sm:top-16 left-1/2 chart-tooltip bg-white/5 rounded-md px-2 py-1 backdrop-blur-3xl border border-white/50 border-opacity-50 z-10">
                  <p class="text-xs sm:text-sm font-semibold text-white/70 text-center">70%</p>
                  <p class="text-xs sm:text-sm font-semibold text-white text-center">41K</p>
                </div>
                
                <div class="w-full h-[65%] rounded-t-md border border-cyan-400/30 inner-shadow overflow-hidden">
                  <div class="h-[8%] w-full"></div>
                  <div class="h-[92%] w-full bar-gradient"></div>
                </div>
              </div>
              
              <!-- Column 3 -->
              <div class="flex-1 flex flex-col justify-end relative chart-column group">
                <div class="absolute top-10 sm:top-12 left-1/2 chart-tooltip bg-white/5 rounded-md px-2 py-1 backdrop-blur-3xl border border-white/50 border-opacity-50 z-10">
                  <p class="text-xs sm:text-sm font-semibold text-white/70 text-center">78%</p>
                  <p class="text-xs sm:text-sm font-semibold text-white text-center">30K</p>
                </div>
                
                <div class="w-full h-[72%] rounded-t-md border border-cyan-400/30 inner-shadow overflow-hidden">
                  <div class="h-[9%] w-full"></div>
                  <div class="h-[91%] w-full bar-gradient"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <!-- X-axis labels -->
        <div class="flex justify-between text-xs text-white/70 pt-2 mt-1">
          <div class="flex-1 text-center">App Install</div>
          <div class="flex-1 text-center">App Open</div>
          <div class="flex-1 text-center">Sign Up</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
