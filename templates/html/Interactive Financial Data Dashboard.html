    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in {opacity:0;transform:translateY(10px);animation:fadeIn 0.5s forwards}
        @keyframes fadeIn{to{opacity:1;transform:translateY(0)}}
        .segment-hover {cursor:pointer;transition:all 0.3s ease;transform-origin:center}
        .segment-hover:hover {stroke-width:22;transform:scale(1.05)}
        .tooltip {position:absolute;background-color:white;border-radius:8px;padding:10px;
            box-shadow:0 4px 16px rgba(0,0,0,0.12);opacity:0;visibility:hidden;
            transition:all 0.2s ease;z-index:20;pointer-events:none;min-width:120px;
            transform:translateY(5px);border:1px solid rgba(0,0,0,0.05)}
        .tooltip.visible {opacity:1;visibility:visible;transform:translateY(0)}
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md bg-white/90 backdrop-blur-lg border border-white/40 rounded-2xl shadow-lg overflow-hidden opacity-0" id="card">
        <!-- Header Section -->
        <div class="p-5 space-y-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2 opacity-0" id="header-title">
                    <div class="opacity-70">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M2 22H22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <path d="M12 2L21 8V10H3V8L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            <path d="M5 10V18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <path d="M9 10V18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <path d="M15 10V18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <path d="M19 10V18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            <path d="M3 22V19H21V22" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <h1 class="text-base font-medium">Financial Statements</h1>
                </div>
                <div class="opacity-0" id="header-menu">
                    <button id="menu-button" class="focus:outline-none">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/>
                            <circle cx="12" cy="8" r="1" fill="currentColor"/>
                            <circle cx="12" cy="12" r="1" fill="currentColor"/>
                            <circle cx="12" cy="16" r="1" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </div>
            <p class="text-sm font-semibold text-black/50 opacity-0" id="header-subtitle">Optimize to get your best score</p>
        </div>
        
        <!-- Financial Data Overview -->
        <div class="px-5">
            <div class="flex justify-between items-center py-6">
                <div class="space-y-2 opacity-0" id="income-section">
                    <p class="text-xs font-semibold text-black/70">Income</p>
                    <p class="text-base font-semibold" id="income-value">$0</p>
                </div>
                <div class="h-8 w-px bg-black/10 opacity-0" id="divider-1"></div>
                <div class="space-y-2 opacity-0" id="spending-section">
                    <p class="text-xs font-semibold text-black/70">Spending</p>
                    <p class="text-base font-semibold text-black/50" id="spending-value">$0</p>
                </div>
            </div>
        </div>
        
        <!-- Donut Chart with animated segments and tooltips -->
        <div class="relative px-5 h-[300px] flex items-center justify-center">
            <div class="relative w-[300px] h-[300px] opacity-0" id="chart-container">
                <!-- Tooltips -->
                <div id="youtube-tooltip" class="tooltip text-xs">
                    <p class="font-semibold">YouTube</p>
                    <p class="text-black/70">$1,706.60</p>
                    <p class="text-black/50">45% of total</p>
                </div>
                
                <div id="design-tooltip" class="tooltip text-xs">
                    <p class="font-semibold">Design</p>
                    <p class="text-black/70">$16,786.90</p>
                    <p class="text-black/50">35% of total</p>
                </div>
                
                <div id="angle-tooltip" class="tooltip text-xs">
                    <p class="font-semibold">Angle</p>
                    <p class="text-black/70">$8,282.10</p>
                    <p class="text-black/50">20% of total</p>
                </div>
                
                <!-- YouTube segment (red) - 45% -->
                <svg class="absolute inset-0 transform -rotate-90" viewBox="0 0 100 100">
                    <circle class="segment-hover" id="youtube-segment" cx="50" cy="50" r="40" fill="none" 
                            stroke="#F87171" stroke-width="20" stroke-dasharray="0 251.2" stroke-dashoffset="0">
                    </circle>
                </svg>
                
                <!-- Design segment (blue) - 35% -->
                <svg class="absolute inset-0 transform -rotate-90" viewBox="0 0 100 100">
                    <circle class="segment-hover" id="design-segment" cx="50" cy="50" r="40" fill="none" 
                            stroke="#3B82F6" stroke-width="20" stroke-dasharray="0 251.2" stroke-dashoffset="0">
                    </circle>
                </svg>
                
                <!-- Angle segment (purple) - 20% -->
                <svg class="absolute inset-0 transform -rotate-90" viewBox="0 0 100 100">
                    <circle class="segment-hover" id="angle-segment" cx="50" cy="50" r="40" fill="none" 
                            stroke="#A855F7" stroke-width="20" stroke-dasharray="0 251.2" stroke-dashoffset="0">
                    </circle>
                </svg>
                
                <!-- Center hole - single white circle -->
                <div class="absolute rounded-full bg-white w-[200px] h-[200px] top-[50px] left-[50px]"></div>
                
                <!-- Center text with animated count -->
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <p class="text-sm font-semibold text-black/50 opacity-0" id="total-label">Total</p>
                    <div class="flex items-end opacity-0" id="total-value">
                        <span class="text-xl font-bold">$</span>
                        <span id="counter" class="text-3xl font-bold">0</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Legend -->
        <div class="px-5 py-4 flex justify-between">
            <div class="space-y-1 opacity-0" id="legend-design">
                <div class="flex items-center gap-1">
                    <div class="w-2 h-2 rounded bg-blue-500"></div>
                    <p class="text-xs font-semibold text-black/70">Design</p>
                </div>
                <p class="text-xs" id="design-amount">$0</p>
            </div>
            
            <div class="h-8 w-px bg-black/10 opacity-0" id="divider-2"></div>
            
            <div class="space-y-1 opacity-0" id="legend-angle">
                <div class="flex items-center gap-1">
                    <div class="w-2 h-2 rounded bg-purple-500"></div>
                    <p class="text-xs font-semibold text-black/70">Angle</p>
                </div>
                <p class="text-xs" id="angle-amount">$0</p>
            </div>
            
            <div class="h-8 w-px bg-black/10 opacity-0" id="divider-3"></div>
            
            <div class="space-y-1 opacity-0" id="legend-youtube">
                <div class="flex items-center gap-1">
                    <div class="w-2 h-2 rounded bg-red-400"></div>
                    <p class="text-xs font-semibold text-black/70">Youtube</p>
                </div>
                <p class="text-xs" id="youtube-amount">$0</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Animation sequence timing
            const elements = [
                { id: 'card', delay: 0 },
                { id: 'header-title', delay: 200 },
                { id: 'header-menu', delay: 300 },
                { id: 'header-subtitle', delay: 400 },
                { id: 'income-section', delay: 500 },
                { id: 'divider-1', delay: 550 },
                { id: 'spending-section', delay: 600 },
                { id: 'chart-container', delay: 700 },
                { id: 'total-label', delay: 800 },
                { id: 'total-value', delay: 900 },
                { id: 'legend-design', delay: 1000 },
                { id: 'divider-2', delay: 1050 },
                { id: 'legend-angle', delay: 1100 },
                { id: 'divider-3', delay: 1150 },
                { id: 'legend-youtube', delay: 1200 }
            ];
            
            elements.forEach(item => {
                setTimeout(() => {
                    const el = document.getElementById(item.id);
                    el.classList.add('fade-in');
                    el.style.opacity = 1;
                }, item.delay);
            });

            // Set up tooltips with improved microinteractions
            function setupTooltip(segmentId, tooltipId) {
                const segment = document.getElementById(segmentId);
                const tooltip = document.getElementById(tooltipId);
                
                segment.addEventListener('mouseenter', (e) => {
                    const chartContainer = document.getElementById('chart-container');
                    const containerRect = chartContainer.getBoundingClientRect();
                    
                    let posX, posY;
                    
                    // Position tooltips based on segment
                    if (segmentId === 'youtube-segment') {
                        posX = containerRect.width * 0.75;
                        posY = containerRect.height * 0.25;
                    } else if (segmentId === 'design-segment') {
                        posX = containerRect.width * 0.25;
                        posY = containerRect.height * 0.75;
                    } else { // angle-segment
                        posX = containerRect.width * 0.25;
                        posY = containerRect.height * 0.25;
                    }
                    
                    tooltip.style.left = `${posX}px`;
                    tooltip.style.top = `${posY}px`;
                    tooltip.classList.add('visible');
                });
                
                segment.addEventListener('mouseleave', () => {
                    tooltip.classList.remove('visible');
                });
            }
            
            // Counter animations
            const animateValue = (id, start, end, duration, formatter) => {
                const obj = document.getElementById(id);
                let startTimestamp = null;
                
                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                    const value = progress * (end - start) + start;
                    obj.innerHTML = formatter(value);
                    
                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    }
                };
                
                window.requestAnimationFrame(step);
            };
            
            const dollarFormatter = value => '$' + value.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
            
            const commaFormatter = value => value.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).replace('.', ',');
            
            // Start animations after delay
            setTimeout(() => {
                // Initialize tooltips
                setupTooltip('youtube-segment', 'youtube-tooltip');
                setupTooltip('design-segment', 'design-tooltip');
                setupTooltip('angle-segment', 'angle-tooltip');
                
                // Start counter animations
                animateValue('income-value', 0, 88886.98, 1500, dollarFormatter);
                animateValue('spending-value', 0, 16786.90, 1500, dollarFormatter);
                animateValue('counter', 0, 295.29, 1500, commaFormatter);
                animateValue('design-amount', 0, 16786.90, 1500, dollarFormatter);
                animateValue('angle-amount', 0, 8282.10, 1500, dollarFormatter);
                animateValue('youtube-amount', 0, 1706.60, 1500, dollarFormatter);
                
                // Animate chart segments
                const youtubeSegment = document.getElementById('youtube-segment');
                const designSegment = document.getElementById('design-segment');
                const angleSegment = document.getElementById('angle-segment');
                
                const circumference = 2 * Math.PI * 40;
                const youtubePercentage = 0.45;
                const designPercentage = 0.35;
                const anglePercentage = 0.20;
                
                designSegment.style.strokeDashoffset = -(youtubePercentage * circumference);
                angleSegment.style.strokeDashoffset = -((youtubePercentage + designPercentage) * circumference);
                
                youtubeSegment.style.strokeDasharray = `${youtubePercentage * circumference} ${circumference}`;
                designSegment.style.strokeDasharray = `${designPercentage * circumference} ${circumference}`;
                angleSegment.style.strokeDasharray = `${anglePercentage * circumference} ${circumference}`;
            }, 1000);
        });
    </script>
</body>
</html>
