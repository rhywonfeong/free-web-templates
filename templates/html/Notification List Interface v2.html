<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Notifications</title>
<meta name="theme-color" content="#ffffff" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="antialiased bg-gray-50 text-gray-900 selection:bg-gray-200 font-sans" style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, 'Apple Color Emoji','Segoe UI Emoji';">
  <div class="mx-auto min-h-screen w-full max-w-md md:max-w-lg lg:max-w-xl flex flex-col relative md:my-6 md:rounded-2xl md:border md:border-gray-200 md:bg-white md:shadow-sm">
    <!-- Top Nav -->
    <header class="sticky top-0 z-20 bg-white/90 backdrop-blur supports-[backdrop-filter]:backdrop-blur border-b border-gray-200 shadow-[0_1px_0_0_rgba(0,0,0,0.03)]">
      <div class="pt-[12px] pb-[10px] px-4 flex items-center justify-between">
        <button id="btnBack" class="h-9 w-9 shrink-0 rounded-full flex items-center justify-center hover:bg-gray-100 active:opacity-80 outline-none focus-visible:ring-2 focus-visible:ring-gray-300 transition-colors" aria-label="Back">

        </button>
        <div class="flex-1 text-center">
          <h1 class="text-[17px] md:text-[18px] tracking-tight font-semibold">Notifications</h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="btnMarkAll" class="text-[13px] md:text-[14px] font-medium text-gray-700 hover:text-gray-900 hover:underline decoration-gray-300 underline-offset-4 px-2 py-1 rounded focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-300 transition-colors">
            Mark all as read

          <button id="btnCancelSelect" class="hidden text-[13px] md:text-[14px] font-medium text-gray-700 hover:text-gray-900 px-2 py-1 rounded focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-gray-300 transition-colors">
            Cancel
          </button>
        </div>
      </div>
    </header>

    <!-- Bulk action bar -->
    <div id="bulkBar" class="pointer-events-none opacity-0 transition-opacity duration-200 fixed left-0 right-0 bottom-0">
      <div class="mx-auto w-full max-w-md md:max-w-lg lg:max-w-xl px-4 pb-[max(env(safe-area-inset-bottom),16px)] pt-2">

          <div class="px-3 py-2 text-[13px] md:text-[14px] text-gray-600 flex items-center justify-between">
            <span id="selectedCount">0 selected</span>
            <div class="flex items-center gap-2">

            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Content -->
    <main id="content" class="flex-1 overflow-y-auto md:bg-white">
      <!-- Section: Today -->
      <section class="px-4">
        <div class="pt-3 pb-2 sticky top-[49px] bg-white/85 backdrop-blur z-10">

        </div>
        <div class="divide-y divide-gray-100">
          <!-- Item -->
          <div class="relative notif-item" data-id="n1" data-unread="true">
            <!-- Actions (revealed on swipe) -->
            <div class="absolute inset-y-0 right-0 flex items-center gap-2 pr-2 pl-6">

  <script>
    // Initialize icons
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
      }
    });

    const q = (s, r = document) => r.querySelector(s);
    const qa = (s, r = document) => Array.from(r.querySelectorAll(s));

    const listContainer = q('#content');
    const emptyState = q('#emptyState');
    const btnMarkAll = q('#btnMarkAll');
    const btnCancelSelect = q('#btnCancelSelect');
    const bulkBar = q('#bulkBar');
    const selectedCountEl = q('#selectedCount');
    const bulkMarkRead = q('#bulkMarkRead');
    const bulkDelete = q('#bulkDelete');

    let selectMode = false;
    const selected = new Set();

    function updateEmptyState() {
      const items = qa('.notif-item');
      const hasAny = items.length > 0;
      emptyState.classList.toggle('hidden', hasAny);
      listContainer.classList.toggle('hidden', !hasAny);
    }

    function setUnreadState(item, isUnread) {
      item.dataset.unread = isUnread ? 'true' : 'false';
      const swipeable = q('.swipeable', item);
      swipeable.classList.toggle('bg-gray-50', isUnread);
      const dot = q('.unread-dot', item);
      if (dot) dot.classList.toggle('hidden', !isUnread);
    }

    function closeAllSwipes(except) {
      qa('.notif-item .swipeable').forEach(el => {
        if (el !== except) {
          el.style.transform = 'translateX(0px)';
          el.dataset.open = 'false';
        }
      });
    }

    function enterSelectMode(withItem) {
      selectMode = true;
      btnMarkAll.classList.add('hidden');
      btnCancelSelect.classList.remove('hidden');

      bulkBar.classList.remove('pointer-events-none', 'opacity-0');
      qa('.notif-item .select-dot').forEach(dot => {
        dot.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
      });

      if (withItem) toggleSelect(withItem);
    }

    function exitSelectMode() {
      selectMode = false;
      selected.clear();
      btnMarkAll.classList.remove('hidden');
      btnCancelSelect.classList.add('hidden');

      bulkBar.classList.add('pointer-events-none', 'opacity-0');
      qa('.notif-item .select-dot').forEach(dot => {
        dot.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
        q('i', dot).classList.add('hidden');
        dot.classList.remove('bg-gray-900', 'text-white', 'border-gray-900');
        dot.classList.add('border-gray-300', 'bg-white');
      });
      qa('.notif-item').forEach(item => item.classList.remove('ring', 'ring-gray-300', 'rounded-lg'));
      updateSelectedCount();
    }

    function updateSelectedCount() {
      selectedCountEl.textContent = selected.size + ' selected';
    }

    function toggleSelect(item) {
      const id = item.dataset.id;
      const dot = q('.select-dot', item);
      const icon = q('i', dot);

      if (selected.has(id)) {
        selected.delete(id);
        icon.classList.add('hidden');
        dot.classList.remove('bg-gray-900', 'text-white', 'border-gray-900');
        dot.classList.add('border-gray-300', 'bg-white');
        item.classList.remove('ring', 'ring-gray-300', 'rounded-lg');
      } else {
        selected.add(id);
        icon.classList.remove('hidden');
        dot.classList.add('bg-gray-900', 'text-white', 'border-gray-900');
        dot.classList.remove('border-gray-300', 'bg-white');
        item.classList.add('ring', 'ring-gray-300', 'rounded-lg');
      }
      updateSelectedCount();
    }

    function setupSwipe(item) {
      const row = q('.swipeable', item);
      let startX = 0;
      let dragging = false;
      let lock = false;
      let longPressTimer;

      const maxReveal = 140;

      function onTouchStart(e) {
        if (selectMode) return;
        const touch = e.touches ? e.touches[0] : e;
        startX = touch.clientX;
        dragging = true;
        lock = false;

        longPressTimer = setTimeout(() => {
          dragging = false;
          enterSelectMode(item);
        }, 450);
      }

      function onTouchMove(e) {
        if (!dragging || selectMode) return;
        const touch = e.touches ? e.touches[0] : e;
        const dx = touch.clientX - startX;
        if (!lock && Math.abs(dx) > 6) {
          clearTimeout(longPressTimer);
          lock = true;
        }
        if (dx < 0) {
          const t = Math.max(-maxReveal, dx);
          row.style.transform = `translateX(${t}px)`;
        } else {
          row.style.transform = 'translateX(0px)';
        }
      }

      function onTouchEnd() {
        clearTimeout(longPressTimer);
        if (selectMode) return;
        dragging = false;
        const computed = getComputedStyle(row).transform;
        let x = 0;
        if (computed && computed !== 'none') {
          const m = computed.match(/matrix\(([-0-9., ]+)\)/);
          if (m) {
            const parts = m[1].split(',');
            x = parseFloat(parts[4]) || 0;
          }
        }
        if (x < -60) {
          closeAllSwipes(row);
          row.style.transform = `translateX(${-maxReveal}px)`;
          row.dataset.open = 'true';
        } else {
          row.style.transform = 'translateX(0px)';
          row.dataset.open = 'false';
        }
      }

      row.addEventListener('touchstart', onTouchStart, { passive: true });
      row.addEventListener('touchmove', onTouchMove, { passive: true });
      row.addEventListener('touchend', onTouchEnd);
      row.addEventListener('mousedown', onTouchStart);
      row.addEventListener('mousemove', onTouchMove);
      row.addEventListener('mouseup', onTouchEnd);

      row.addEventListener('click', (e) => {
        if (selectMode) {
          e.preventDefault();
          toggleSelect(item);
        } else {
          closeAllSwipes(row);
        }
      });

      q('.action-delete', item).addEventListener('click', (e) => {
        e.stopPropagation();
        item.remove();
        updateEmptyState();
      });
      q('.action-read', item).addEventListener('click', (e) => {
        e.stopPropagation();
        setUnreadState(item, false);
        q('.swipeable', item).style.transform = 'translateX(0px)';
      });
    }

    qa('.notif-item').forEach(item => {
      const unread = item.dataset.unread === 'true';
      setUnreadState(item, unread);
      setupSwipe(item);
    });

    btnMarkAll.addEventListener('click', () => {
      qa('.notif-item').forEach(item => setUnreadState(item, false));
    });

    btnCancelSelect.addEventListener('click', () => {
      exitSelectMode();
    });

    bulkMarkRead.addEventListener('click', () => {
      qa('.notif-item').forEach(item => {
        if (selected.has(item.dataset.id)) setUnreadState(item, false);
      });
      exitSelectMode();
    });
    bulkDelete.addEventListener('click', () => {
      qa('.notif-item').forEach(item => {
        if (selected.has(item.dataset.id)) item.remove();
      });
      exitSelectMode();
      updateEmptyState();
    });

    document.addEventListener('click', (e) => {
      const within = e.target.closest('.notif-item');
      if (!within) closeAllSwipes(null);
    });

    updateEmptyState();
  </script>
</body>
</html>
