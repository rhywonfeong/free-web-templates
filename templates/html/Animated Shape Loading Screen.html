<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaotic Shape Party</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
  <style>
      body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-900 via-pink-800 to-orange-900 flex flex-col items-center justify-center font-inter overflow-hidden">
    <!-- Floating Messages -->
    <div class="absolute inset-0 pointer-events-none">
        <div class="absolute top-10 left-10 text-yellow-300 font-medium text-sm animate-bounce" style="animation-delay: 0.5s;">BONK!</div>
        <div class="absolute top-20 right-20 text-cyan-300 font-medium text-sm animate-bounce" style="animation-delay: 1.2s;">WHEEE!</div>
        <div class="absolute bottom-32 left-16 text-green-300 font-medium text-sm animate-bounce" style="animation-delay: 0.8s;">WIGGLE!</div>
        <div class="absolute bottom-40 right-32 text-pink-300 font-medium text-sm animate-bounce" style="animation-delay: 1.5s;">BOING!</div>
    </div>

    <!-- Title -->
    <div class="text-center mb-8 animate-pulse">
        <h1 class="text-4xl md:text-6xl font-semibold text-white tracking-tight mb-2">CHAOS LOADING</h1>
        <p class="text-lg text-gray-300 font-normal">Shapes having an existential crisis...</p>
    </div>

    <!-- Main Animation Container -->
    <div class="relative">
        <!-- Crazy Shapes -->
        <div class="flex items-center justify-center gap-4 md:gap-6 mb-8">
            <!-- Drunk Square -->
            <div class="w-8 h-8 md:w-12 md:h-12 bg-gradient-to-r from-red-500 to-pink-500 rounded-lg shadow-lg transform-gpu" 
                 style="animation: drunkSquare 2s infinite ease-in-out;">
            </div>

            <!-- Anxious Triangle -->
            <div class="relative w-8 h-8 md:w-12 md:h-12">
                <div class="absolute inset-0 transform-gpu" style="animation: anxiousTriangle 1.5s infinite ease-in-out;">
                    <div class="w-0 h-0 border-l-4 border-r-4 border-b-8 md:border-l-6 md:border-r-6 md:border-b-10 border-l-transparent border-r-transparent border-b-yellow-400 mx-auto"></div>
                </div>
            </div>

            <!-- Dizzy Diamond -->
            <div class="w-6 h-6 md:w-8 md:h-8 bg-gradient-to-r from-cyan-400 to-blue-500 transform rotate-45 shadow-lg" 
                 style="animation: dizzyDiamond 3s infinite linear;">
            </div>

            <!-- Bouncy Circle -->
            <div class="w-8 h-8 md:w-12 md:h-12 bg-gradient-to-r from-green-400 to-emerald-500 rounded-full shadow-lg transform-gpu" 
                 style="animation: bouncyCircle 1.8s infinite ease-out;">
            </div>

            <!-- Confused Hexagon -->
            <div class="w-8 h-8 md:w-12 md:h-12 bg-gradient-to-r from-purple-500 to-indigo-500 transform-gpu shadow-lg" 
                 style="clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); animation: confusedHexagon 2.5s infinite ease-in-out;">
            </div>

            <!-- Sleepy Star -->
            <div class="w-8 h-8 md:w-12 md:h-12 bg-gradient-to-r from-orange-400 to-red-500 transform-gpu shadow-lg" 
                 style="clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); animation: sleepyStar 4s infinite ease-in-out;">
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-64 md:w-80 h-2 bg-gray-800 rounded-full overflow-hidden shadow-inner">
            <div class="h-full bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 rounded-full transform-gpu" 
                 style="animation: crazyProgress 3s infinite ease-in-out; width: 0%;"></div>
        </div>

        <!-- Loading Text -->
        <div class="text-center mt-6">
            <p class="text-white font-medium text-lg tracking-tight" id="loadingText">Waking up the shapes...</p>
        </div>
    </div>

    <!-- Floating Particles -->
    <div class="absolute inset-0 pointer-events-none">
        <div class="absolute w-2 h-2 bg-yellow-400 rounded-full animate-ping" style="top: 20%; left: 15%; animation-delay: 0.3s;"></div>
        <div class="absolute w-1 h-1 bg-pink-400 rounded-full animate-ping" style="top: 70%; right: 20%; animation-delay: 0.8s;"></div>
        <div class="absolute w-3 h-3 bg-cyan-400 rounded-full animate-ping" style="bottom: 30%; left: 25%; animation-delay: 1.2s;"></div>
        <div class="absolute w-1 h-1 bg-green-400 rounded-full animate-ping" style="top: 40%; right: 30%; animation-delay: 0.6s;"></div>
    </div>

    <style>
        @keyframes drunkSquare {
            0%, 100% { transform: translateX(0) rotate(0deg) scale(1); }
            25% { transform: translateX(-10px) rotate(-15deg) scale(1.2); }
            50% { transform: translateX(5px) rotate(10deg) scale(0.8); }
            75% { transform: translateX(8px) rotate(-5deg) scale(1.1); }
        }

        @keyframes anxiousTriangle {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            10% { transform: translateY(-5px) rotate(3deg) scale(1.1); }
            20% { transform: translateY(2px) rotate(-2deg) scale(0.9); }
            30% { transform: translateY(-3px) rotate(1deg) scale(1.05); }
            40% { transform: translateY(1px) rotate(-1deg) scale(0.95); }
            50% { transform: translateY(-8px) rotate(5deg) scale(1.2); }
            60% { transform: translateY(4px) rotate(-3deg) scale(0.8); }
            80% { transform: translateY(-2px) rotate(2deg) scale(1.1); }
        }

        @keyframes dizzyDiamond {
            0% { transform: rotate(45deg) scale(1); }
            25% { transform: rotate(135deg) scale(1.3); }
            50% { transform: rotate(225deg) scale(0.7); }
            75% { transform: rotate(315deg) scale(1.1); }
            100% { transform: rotate(405deg) scale(1); }
        }

        @keyframes bouncyCircle {
            0%, 100% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-20px) scale(1.2); }
            50% { transform: translateY(-5px) scale(0.9); }
            75% { transform: translateY(-15px) scale(1.1); }
        }

        @keyframes confusedHexagon {
            0%, 100% { transform: rotate(0deg) scale(1); }
            16% { transform: rotate(60deg) scale(1.1); }
            33% { transform: rotate(120deg) scale(0.9); }
            50% { transform: rotate(180deg) scale(1.2); }
            66% { transform: rotate(240deg) scale(0.8); }
            83% { transform: rotate(300deg) scale(1.1); }
        }

        @keyframes sleepyStar {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            25% { transform: scale(0.8) rotate(90deg); opacity: 0.7; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.9; }
            75% { transform: scale(0.6) rotate(270deg); opacity: 0.5; }
        }

        @keyframes crazyProgress {
            0% { width: 0%; }
            25% { width: 30%; }
            50% { width: 60%; }
            75% { width: 85%; }
            100% { width: 100%; }
        }
    </style>

    <script>
        const messages = [
            "Waking up the shapes...",
            "Teaching triangle to be less pointy...",
            "Asking circle to stop rolling around...",
            "Convincing square to think outside the box...",
            "Hexagon is having an identity crisis...",
            "Star is being dramatic as usual...",
            "Diamond thinks it's fancy...",
            "Shapes are arguing about who's the coolest...",
            "Triangle is trying to be edgy...",
            "Circle just wants to roll with it...",
            "Almost there! Shapes are getting tired...",
            "Done! Everyone's happy now... maybe."
        ];

        let messageIndex = 0;
        const loadingText = document.getElementById('loadingText');

        setInterval(() => {
            messageIndex = (messageIndex + 1) % messages.length;
            loadingText.textContent = messages[messageIndex];
            loadingText.style.animation = 'none';
            loadingText.offsetHeight; // Trigger reflow
            loadingText.style.animation = 'pulse 0.5s ease-in-out';
        }, 2500);
    </script>
</body>
</html>
