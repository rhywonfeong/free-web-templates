<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cultural Flows — Global Exchange</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>

</head>
<body class="bg-[radial-gradient(ellipse_at_center,_#0a0e27_0%,_#000208_100%)] text-[#e0e6ff] font-sans overflow-hidden h-screen antialiased selection:bg-[#64b5f6]/30">

<div class="relative w-screen h-screen">
  <canvas class="block cursor-grab active:cursor-grabbing w-full h-full" width="1248" height="949" id="globe"></canvas>
  
  <!-- Title / Logo -->
  <div class="absolute top-6 left-6 md:top-10 md:left-10 pointer-events-none z-10">
    <h1 class="text-2xl md:text-3xl font-thin tracking-tight bg-gradient-to-r from-[#64b5f6] via-[#e91e63] to-[#ffc107] bg-clip-text text-transparent">CULTURALFLOWS</h1>
    <p class="text-xs text-slate-400/80 tracking-widest mt-1.5 font-light">A LIVING MAP OF GLOBAL EXCHANGE</p>
  </div>
  
  <!-- Legend -->
  <div class="absolute top-6 right-6 md:top-10 md:right-10 pointer-events-auto z-10 flex flex-col gap-3">
    <div class="flex items-center text-xs tracking-widest text-slate-400 font-light transition-colors hover:text-slate-200 cursor-default group">
      <span class="w-2 h-2 rounded-full mr-3 transition-transform group-hover:scale-110" style="background: #e91e63; box-shadow: 0 0 10px #e91e63;"></span>MUSIC &amp; ART
    </div>
    <div class="flex items-center text-xs tracking-widest text-slate-400 font-light transition-colors hover:text-slate-200 cursor-default group">
      <span class="w-2 h-2 rounded-full mr-3 transition-transform group-hover:scale-110" style="background: #64b5f6; box-shadow: 0 0 10px #64b5f6;"></span>CINEMA &amp; MEDIA
    </div>
    <div class="flex items-center text-xs tracking-widest text-slate-400 font-light transition-colors hover:text-slate-200 cursor-default group">
      <span class="w-2 h-2 rounded-full mr-3 transition-transform group-hover:scale-110" style="background: #ffc107; box-shadow: 0 0 10px #ffc107;"></span>CUISINE
    </div>
    <div class="flex items-center text-xs tracking-widest text-slate-400 font-light transition-colors hover:text-slate-200 cursor-default group">
      <span class="w-2 h-2 rounded-full mr-3 transition-transform group-hover:scale-110" style="background: #9c27b0; box-shadow: 0 0 10px #9c27b0;"></span>FASHION
    </div>
    <div class="flex items-center text-xs tracking-widest text-slate-400 font-light transition-colors hover:text-slate-200 cursor-default group">
      <span class="w-2 h-2 rounded-full mr-3 transition-transform group-hover:scale-110" style="background: #4caf50; box-shadow: 0 0 10px #4caf50;"></span>LITERATURE
    </div>
  </div>
  
  <!-- Info -->
  <div class="absolute bottom-6 left-6 md:bottom-10 md:left-10 text-xs text-slate-500 tracking-widest font-light pointer-events-none z-10 hidden sm:block">
    DRAG TO ROTATE &nbsp;·&nbsp; SCROLL TO ZOOM &nbsp;·&nbsp; HOVER NODES
  </div>
  
  <!-- Controls -->
  <div class="absolute bottom-6 right-6 md:bottom-10 md:right-10 pointer-events-auto z-10 flex flex-col sm:flex-row gap-2 sm:gap-3">
    <button id="autoRotate" class="group flex items-center justify-center gap-2 bg-white/[0.03] border border-white/10 text-slate-400 px-4 py-2.5 text-xs tracking-widest rounded-md backdrop-blur-md transition-all duration-300 hover:bg-white/10 hover:text-white hover:border-white/20 font-light shadow-lg">
      <iconify-icon icon="solar:global-linear" class="text-sm opacity-70 group-hover:opacity-100 transition-opacity" style="stroke-width: 1.5;"></iconify-icon>
      <span>AUTO ROTATE</span>
    </button>
    <button id="reset" class="group flex items-center justify-center gap-2 bg-white/[0.03] border border-white/10 text-slate-400 px-4 py-2.5 text-xs tracking-widest rounded-md backdrop-blur-md transition-all duration-300 hover:bg-white/10 hover:text-white hover:border-white/20 font-light shadow-lg">
      <iconify-icon icon="solar:refresh-linear" class="text-sm opacity-70 group-hover:opacity-100 transition-opacity" style="stroke-width: 1.5;"></iconify-icon>
      <span>RESET VIEW</span>
    </button>
  </div>
  
  <!-- Tooltip -->
  <div id="tooltip" class="absolute bg-[#0a0e27]/95 border border-white/10 px-4 py-3 rounded-lg pointer-events-none opacity-0 transition-opacity duration-200 backdrop-blur-xl z-20 shadow-2xl transform -translate-x-1/2 -translate-y-full mt-[-15px]"></div>
</div>

<script>
const canvas = document.getElementById('globe');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');

let W, H, cx, cy, R;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  R = Math.min(W, H) * 0.32;
}
resize();
window.addEventListener('resize', resize);

const cities = [
  { name: 'New York',    lat: 40.7,  lon: -74.0,  color: '#64b5f6', cat: 'Media' },
  { name: 'Los Angeles', lat: 34.0,  lon: -118.2, color: '#64b5f6', cat: 'Cinema' },
  { name: 'London',      lat: 51.5,  lon: -0.1,   color: '#e91e63', cat: 'Music' },
  { name: 'Paris',       lat: 48.8,  lon: 2.3,    color: '#9c27b0', cat: 'Fashion' },
  { name: 'Tokyo',       lat: 35.6,  lon: 139.7,  color: '#e91e63', cat: 'Art' },
  { name: 'Seoul',       lat: 37.5,  lon: 127.0,  color: '#e91e63', cat: 'Music' },
  { name: 'Mumbai',      lat: 19.0,  lon: 72.8,   color: '#64b5f6', cat: 'Cinema' },
  { name: 'Rio',         lat: -22.9, lon: -43.2,  color: '#e91e63', cat: 'Music' },
  { name: 'Lagos',       lat: 6.5,   lon: 3.4,    color: '#e91e63', cat: 'Music' },
  { name: 'Cairo',       lat: 30.0,  lon: 31.2,   color: '#4caf50', cat: 'Literature' },
  { name: 'Istanbul',    lat: 41.0,  lon: 28.9,   color: '#ffc107', cat: 'Cuisine' },
  { name: 'Shanghai',    lat: 31.2,  lon: 121.5,  color: '#ffc107', cat: 'Cuisine' },
  { name: 'Sydney',      lat: -33.9, lon: 151.2,  color: '#4caf50', cat: 'Literature' },
  { name: 'Mexico City', lat: 19.4,  lon: -99.1,  color: '#ffc107', cat: 'Cuisine' },
  { name: 'Berlin',      lat: 52.5,  lon: 13.4,   color: '#e91e63', cat: 'Music' },
  { name: 'Milan',       lat: 45.5,  lon: 9.2,    color: '#9c27b0', cat: 'Fashion' },
  { name: 'Bangkok',     lat: 13.8,  lon: 100.5,  color: '#ffc107', cat: 'Cuisine' },
  { name: 'Buenos Aires',lat: -34.6, lon: -58.4,  color: '#4caf50', cat: 'Literature' },
];

const connections = [
  [0,2],[0,4],[0,7],[2,3],[2,14],[3,15],[4,5],[4,11],[5,6],
  [6,16],[7,13],[8,9],[9,10],[10,3],[11,12],[12,4],[13,0],
  [14,15],[16,4],[17,7],[0,13],[2,4],[5,16],[1,4],[1,6],
  [3,14],[9,2],[10,2],[8,7],[15,14],[17,8]
];

let rotY = 0, rotX = -0.2;
let targetRotY = 0, targetRotX = -0.2;
let autoRotate = true;
let isDragging = false;
let lastX = 0, lastY = 0;
let zoomFactor = 1;

function latLonTo3D(lat, lon) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return {
    x: -Math.sin(phi) * Math.cos(theta),
    y: Math.cos(phi),
    z: Math.sin(phi) * Math.sin(theta)
  };
}

function rotate(p, rx, ry) {
  let cosY = Math.cos(ry), sinY = Math.sin(ry);
  let x = p.x * cosY - p.z * sinY;
  let z = p.x * sinY + p.z * cosY;
  
  let cosX = Math.cos(rx), sinX = Math.sin(rx);
  let y = p.y * cosX - z * sinX;
  z = p.y * sinX + z * cosX;
  return { x, y, z };
}

function project(p) {
  const r = R * zoomFactor;
  return {
    x: cx + p.x * r,
    y: cy - p.y * r,
    z: p.z,
    visible: p.z > -0.1
  };
}

const particles = [];
function spawnParticles() {
  connections.forEach((conn) => {
    if (Math.random() < 0.02) {
      particles.push({
        from: conn[0],
        to: conn[1],
        progress: 0,
        speed: 0.003 + Math.random() * 0.005,
        color: cities[conn[0]].color
      });
    }
  });
}

const stars = [];
for (let i = 0; i < 300; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() * 1.5,
    twinkle: Math.random() * Math.PI * 2
  });
}

function drawStars(t) {
  for (const s of stars) {
    const alpha = 0.2 + 0.4 * Math.abs(Math.sin(s.twinkle + t * 0.001));
    ctx.fillStyle = `rgba(148, 163, 184, ${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGlobe() {
  const r = R * zoomFactor;
  
  const glow = ctx.createRadialGradient(cx, cy, r * 0.9, cx, cy, r * 1.4);
  glow.addColorStop(0, 'rgba(100, 181, 246, 0.08)');
  glow.addColorStop(1, 'rgba(100, 181, 246, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.4, 0, Math.PI * 2);
  ctx.fill();
  
  const sphere = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
  sphere.addColorStop(0, 'rgba(15, 23, 42, 0.8)');
  sphere.addColorStop(0.7, 'rgba(2, 6, 23, 0.9)');
  sphere.addColorStop(1, 'rgba(0, 0, 0, 1)');
  ctx.fillStyle = sphere;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
  ctx.lineWidth = 0.5;
  for (let lat = -60; lat <= 60; lat += 30) {
    ctx.beginPath();
    let started = false;
    for (let lon = 0; lon <= 360; lon += 5) {
      const p3 = latLonTo3D(lat, lon);
      const rot = rotate(p3, rotX, rotY);
      const p = project(rot);
      if (p.visible) {
        if (!started) { ctx.moveTo(p.x, p.y); started = true; }
        else ctx.lineTo(p.x, p.y);
      } else {
        started = false;
      }
    }
    ctx.stroke();
  }
  
  for (let lon = 0; lon < 360; lon += 30) {
    ctx.beginPath();
    let started = false;
    for (let lat = -90; lat <= 90; lat += 5) {
      const p3 = latLonTo3D(lat, lon);
      const rot = rotate(p3, rotX, rotY);
      const p = project(rot);
      if (p.visible) {
        if (!started) { ctx.moveTo(p.x, p.y); started = true; }
        else ctx.lineTo(p.x, p.y);
      } else {
        started = false;
      }
    }
    ctx.stroke();
  }
}

function drawArc(a, b, colorA, colorB, alpha) {
  const steps = 40;
  const points = [];
  
  const dot = a.x*b.x + a.y*b.y + a.z*b.z;
  const omega = Math.acos(Math.max(-1, Math.min(1, dot)));
  const sinO = Math.sin(omega);
  
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    let x, y, z;
    if (sinO < 0.001) {
      x = a.x; y = a.y; z = a.z;
    } else {
      const s1 = Math.sin((1 - t) * omega) / sinO;
      const s2 = Math.sin(t * omega) / sinO;
      x = s1 * a.x + s2 * b.x;
      y = s1 * a.y + s2 * b.y;
      z = s1 * a.z + s2 * b.z;
    }
    const len = Math.sqrt(x*x + y*y + z*z);
    const elevation = 1 + 0.3 * Math.sin(t * Math.PI);
    x = x / len * elevation;
    y = y / len * elevation;
    z = z / len * elevation;
    
    const rot = rotate({x, y, z}, rotX, rotY);
    const p = project(rot);
    points.push({ p, t, z: rot.z });
  }
  
  for (let i = 0; i < points.length - 1; i++) {
    const p1 = points[i].p;
    const p2 = points[i+1].p;
    const zAvg = (points[i].z + points[i+1].z) / 2;
    if (zAvg < -0.5) continue;
    
    const visibility = Math.max(0, Math.min(1, (zAvg + 0.5) / 1.5));
    const t = points[i].t;
    
    ctx.strokeStyle = t < 0.5 ? colorA : colorB;
    ctx.lineWidth = 1;
    ctx.globalAlpha = alpha * visibility * 0.4;
    
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawParticle(particle) {
  const a = latLonTo3D(cities[particle.from].lat, cities[particle.from].lon);
  const b = latLonTo3D(cities[particle.to].lat, cities[particle.to].lon);
  const t = particle.progress;
  
  const dot = a.x*b.x + a.y*b.y + a.z*b.z;
  const omega = Math.acos(Math.max(-1, Math.min(1, dot)));
  const sinO = Math.sin(omega);
  
  let x, y, z;
  if (sinO < 0.001) {
    x = a.x; y = a.y; z = a.z;
  } else {
    const s1 = Math.sin((1 - t) * omega) / sinO;
    const s2 = Math.sin(t * omega) / sinO;
    x = s1 * a.x + s2 * b.x;
    y = s1 * a.y + s2 * b.y;
    z = s1 * a.z + s2 * b.z;
  }
  
  const len = Math.sqrt(x*x + y*y + z*z);
  const elevation = 1 + 0.3 * Math.sin(t * Math.PI);
  x = x / len * elevation;
  y = y / len * elevation;
  z = z / len * elevation;
  
  const rot = rotate({x, y, z}, rotX, rotY);
  const p = project(rot);
  
  if (rot.z > -0.3) {
    ctx.fillStyle = particle.color;
    ctx.shadowColor = particle.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

let hoveredCity = null;

function drawCities() {
  const cityPoints = [];
  
  cities.forEach((city, i) => {
    const p3 = latLonTo3D(city.lat, city.lon);
    const rot = rotate(p3, rotX, rotY);
    const p = project(rot);
    cityPoints.push({ ...p, city, i, rot });
    
    if (rot.z > -0.1) {
      const visibility = Math.max(0.2, (rot.z + 0.1) / 1.1);
      const pulse = (Date.now() % 2500) / 2500;
      
      ctx.strokeStyle = city.color;
      ctx.globalAlpha = (1 - pulse) * 0.4 * visibility;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3 + pulse * 12, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.globalAlpha = visibility;
      ctx.fillStyle = city.color;
      ctx.shadowColor = city.color;
      ctx.shadowBlur = hoveredCity === i ? 15 : 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, hoveredCity === i ? 4 : 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      if (hoveredCity === i || rot.z > 0.8) {
        ctx.globalAlpha = visibility * (hoveredCity === i ? 1 : 0.6);
        ctx.fillStyle = '#f8fafc';
        ctx.font = '300 10px ui-sans-serif, system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.letterSpacing = '1px';
        ctx.fillText(city.name.toUpperCase(), p.x + 8, p.y + 3);
      }
    }
  });
  
  ctx.globalAlpha = 1;
  return cityPoints;
}

let cityPositions = [];

function draw() {
  const t = Date.now();
  
  ctx.fillStyle = 'rgba(2, 6, 23, 0.4)';
  ctx.fillRect(0, 0, W, H);
  
  drawStars(t);
  
  if (autoRotate && !isDragging) {
    targetRotY += 0.0015;
  }
  rotY += (targetRotY - rotY) * 0.08;
  rotX += (targetRotX - rotX) * 0.08;
  
  drawGlobe();
  
  connections.forEach(conn => {
    const a = latLonTo3D(cities[conn[0]].lat, cities[conn[0]].lon);
    const b = latLonTo3D(cities[conn[1]].lat, cities[conn[1]].lon);
    drawArc(a, b, cities[conn[0]].color, cities[conn[1]].color, 0.8);
  });
  
  spawnParticles();
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.progress += p.speed;
    if (p.progress >= 1) {
      particles.splice(i, 1);
    } else {
      drawParticle(p);
    }
  }
  
  cityPositions = drawCities();
  
  requestAnimationFrame(draw);
}

draw();

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener('mousemove', e => {
  if (isDragging) {
    targetRotY += (e.clientX - lastX) * 0.005;
    targetRotX += (e.clientY - lastY) * 0.005;
    targetRotX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotX));
    lastX = e.clientX;
    lastY = e.clientY;
  }
  
  hoveredCity = null;
  for (const cp of cityPositions) {
    if (cp.rot.z > -0.1) {
      const dx = e.clientX - cp.x;
      const dy = e.clientY - cp.y;
      if (dx*dx + dy*dy < 64) {
        hoveredCity = cp.i;
        tooltip.style.opacity = '1';
        tooltip.style.left = e.clientX + 'px';
        tooltip.style.top = e.clientY + 'px';
        tooltip.innerHTML = `
          <span style="color:${cp.city.color}" class="block font-medium tracking-tight text-sm">${cp.city.name.toUpperCase()}</span>
          <span class="block text-slate-400 text-xs mt-1 tracking-widest uppercase">${cp.city.cat}</span>
        `;
        break;
      }
    }
  }
  if (hoveredCity === null) tooltip.style.opacity = '0';
});

canvas.addEventListener('mouseup', () => isDragging = false);
canvas.addEventListener('mouseleave', () => { isDragging = false; tooltip.style.opacity = '0'; });

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomFactor *= e.deltaY > 0 ? 0.95 : 1.05;
  zoomFactor = Math.max(0.6, Math.min(2.5, zoomFactor));
}, { passive: false });

document.getElementById('autoRotate').addEventListener('click', () => {
  autoRotate = !autoRotate;
});

document.getElementById('reset').addEventListener('click', () => {
  targetRotY = 0;
  targetRotX = -0.2;
  zoomFactor = 1;
});
</script>

</body></html>
