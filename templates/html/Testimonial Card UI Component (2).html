    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonial Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital@0;1&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #121212;
            --bg-component: #212121;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --text-heading: #ffffff;
            --text-accent: #e0e0e0;
            --text-rating: #e0e0e0;
            --border-color: #444444;
            --shadow-color: 0, 0, 0;
            --shadow-md: 0 4px 10px rgba(var(--shadow-color), 0.2);
            --shadow-lg: 0 8px 20px rgba(var(--shadow-color), 0.3);
            --transition-normal: 0.2s ease-in-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Lora', serif;
            line-height: 1.6;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 40px 20px;
        }

        .testimonial-card {
            background-color: var(--bg-component);
            padding: 25px 30px;
            border-radius: 4px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            max-width: 450px;
            width: 100%;
            text-align: center;
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
            position: relative;
        }

        .testimonial-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .testimonial-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 15px auto;
            display: block;
            border: 3px solid var(--border-color);
            background-color: #3a3a3a;
            transition: transform var(--transition-normal);
        }

        .testimonial-card:hover .testimonial-avatar {
            transform: scale(1.05);
        }

        .testimonial-rating {
            margin-bottom: 15px;
            color: var(--text-rating);
            font-size: 1.1rem;
        }

        .testimonial-quote {
            font-family: 'Lora', serif;
            font-size: 1.1rem;
            line-height: 1.7;
            color: var(--text-primary);
            margin-bottom: 20px;
            font-style: italic;
            position: relative;
            padding: 0 10px;
        }

        .testimonial-quote::before {
            content: '"';
            font-family: 'Lora', serif;
            font-size: 2.5em;
            color: var(--text-accent);
            opacity: 0.3;
            position: absolute;
            left: -10px;
            top: -10px;
            line-height: 1;
        }

        .testimonial-quote::after {
            content: '"';
            font-family: 'Lora', serif;
            font-size: 2.5em;
            color: var(--text-accent);
            opacity: 0.3;
            position: absolute;
            right: -10px;
            bottom: -20px;
            line-height: 1;
        }

        .testimonial-author {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-heading);
            margin-bottom: 3px;
            font-family: 'Playfair Display', serif;
        }

        .testimonial-author-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: block;
        }

        @media (max-width: 480px) {
            .testimonial-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="testimonial-card">
        <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=120&q=80" alt="Author Avatar" class="testimonial-avatar">
        <div class="testimonial-rating">★★★★☆</div>
        <blockquote class="testimonial-quote">This service completely transformed our workflow. The efficiency gains are incredible, and the support team is always responsive and helpful. Highly recommended!</blockquote>
        <p class="testimonial-author">Alex Johnson</p>
        <span class="testimonial-author-title">CEO, Tech Innovators Inc.</span>
    </div>
</body>
</html>
