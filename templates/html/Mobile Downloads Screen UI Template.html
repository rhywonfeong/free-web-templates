<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 antialiased text-slate-800">

        <!-- Main Content Scroll Area -->

                        <button class="h-10 rounded-full border border-gray-200 text-slate-600 text-xs font-medium flex items-center justify-center gap-2 hover:bg-gray-50 transition-colors">

                <!-- 3D Chrome Mascot (SVG Construction) -->

                                <stop offset="0.6" stop-color="#94A3B8"></stop>
                                <stop offset="1" stop-color="#E2E8F0"></stop>
                            </linearGradient>
                            <!-- Chrome Gradient Head -->
                            <radialGradient id="chromeHead" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(90 70) rotate(45) scale(50)">

                                <stop offset="0.6" stop-color="#CBD5E1"></stop>
                                <stop offset="1" stop-color="#64748B"></stop>
                            </radialGradient>
                            <!-- Glow -->
                            <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
                                <feGaussianBlur stdDeviation="2" result="coloredBlur"></feGaussianBlur>
                                <feMerge>
                                    <feMergeNode in="coloredBlur"></feMergeNode>
                                    <feMergeNode in="SourceGraphic"></feMergeNode>
                                </feMerge>
                            </filter>
                        </defs>
                        
                        <!-- Motion Lines -->
                        <path d="M40 160 L20 160" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"></path>
                        <path d="M50 170 L35 170" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"></path>

                        <!-- Back Leg -->
                        <path d="M100 130 Q 90 150 70 160" stroke="url(#chromeBody)" stroke-width="14" stroke-linecap="round"></path>
                        
                        <!-- Back Arm -->
                        <path d="M100 110 Q 130 110 140 90" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"></path>

                        <!-- Body (Torso) -->
                        <ellipse cx="100" cy="120" rx="25" ry="30" fill="url(#chromeBody)"></ellipse>
                        
                        <!-- Front Leg -->
                        <path d="M100 130 Q 120 150 130 170" stroke="url(#chromeBody)" stroke-width="14" stroke-linecap="round"></path>

                        <!-- Head -->
                        <circle cx="100" cy="75" r="32" fill="url(#chromeHead)"></circle>
                        
                        <!-- Antenna -->
                        <line x1="100" y1="43" x2="100" y2="25" stroke="#94A3B8" stroke-width="3"></line>
                        <circle cx="100" cy="25" r="4" fill="#1973E9" filter="url(#blueGlow)"></circle>

                        <!-- Face Screen -->
                        <rect x="78" y="60" width="44" height="26" rx="8" fill="#0F172A"></rect>

                        <!-- Eyes (Glowing Squares) -->
                        <rect x="85" y="68" width="10" height="10" rx="2" fill="#1973E9" filter="url(#blueGlow)"></rect>
                        <rect x="105" y="68" width="10" height="10" rx="2" fill="#1973E9" filter="url(#blueGlow)"></rect>

                        <path d="M92 82 Q 100 85 108 82" stroke="#1973E9" stroke-width="1.5" stroke-linecap="round" opacity="0.8"></path>

                        <path d="M90 110 Q 70 120 70 100" stroke="url(#chromeBody)" stroke-width="12" stroke-linecap="round"></path>
