<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClariFi – Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Roboto&display=swap" rel="stylesheet">
  <style>
      /* Custom font utilities */
      .font-roboto { font-family: 'Roboto', sans-serif !important; }
    </style>
</head>

<body class="antialiased bg-[#FAFBFD] text-[#1A1F36] font-[Roboto] flex items-center justify-center py-10">
  <!-- iPhone 15 Pro clay-style mockup -->
  <div class="relative w-[390px] h-[844px] bg-white rounded-[40px] shadow-2xl overflow-hidden">
    
    <!-- Dynamic Island / sensor cut-out -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[160px] h-[34px] bg-black/90 rounded-b-xl z-20"></div>

    <!-- Screen content -->
    <div class="absolute inset-0 flex flex-col">
      
      <!-- Header -->
      <header class="flex items-center justify-between px-6 pt-6 pb-4 backdrop-blur-sm">
        <h1 class="text-[32px] font-semibold tracking-tight text-[#2B5CE6] stagger-fade opacity-0 translate-y-4">ClariFi</h1>
        <button aria-label="Notifications" class="w-11 h-11 flex items-center justify-center rounded-full hover:bg-[#F0F3FA] transition-colors active:scale-95">
          <i data-lucide="bell" class="w-7 h-7 text-neutral-400"></i>
        </button>
      </header>

      <!-- Scrollable main area -->
      <main class="flex-1 overflow-y-auto px-6 space-y-6 pb-28">

        <!-- Monthly Spending Chart Card -->
        <section class="bg-white rounded-2xl shadow-sm p-4 stagger-fade opacity-0 translate-y-4">
          <h2 class="text-[24px] font-semibold tracking-tight mb-2">Monthly Spending</h2>
          <div class="h-56 relative">
            <canvas id="spendingChart"></canvas>
          </div>
        </section>

        <!-- Key Metrics -->
        <section class="grid grid-cols-2 gap-4 stagger-fade opacity-0 translate-y-4">
          <!-- Current Balance -->
          <div class="bg-white rounded-2xl shadow-sm p-4 flex flex-col justify-between">
            <h3 class="text-[18px] font-semibold mb-1">Current Balance</h3>
            <p class="text-[24px] font-semibold text-[#00C896]">$5,230.50</p>
          </div>
          <!-- Budget Remaining -->
          <div class="bg-white rounded-2xl shadow-sm p-4 flex flex-col justify-between">
            <h3 class="text-[18px] font-semibold mb-1">Budget Remaining</h3>
            <p class="text-[24px] font-semibold text-[#2B5CE6]">$750.00</p>
          </div>
        </section>

        <!-- Recent Activities -->
        <section class="stagger-fade opacity-0 translate-y-4">
          <h2 class="text-[24px] font-semibold tracking-tight mb-4">Recent Activity</h2>
          <ul class="bg-white rounded-2xl shadow-sm divide-y divide-[#E5EAF2]">
            <!-- Transaction Item -->
            <li class="flex items-center justify-between px-4 py-3">
              <div>
                <p class="text-[16px]">Starbucks</p>
                <p class="text-[14px] text-neutral-500">Jun 22</p>
              </div>
              <p class="text-[16px] font-medium text-[#1A1F36]">-$5.75</p>
            </li>
            <li class="flex items-center justify-between px-4 py-3">
              <div>
                <p class="text-[16px]">Grocery Store</p>
                <p class="text-[14px] text-neutral-500">Jun 21</p>
              </div>
              <p class="text-[16px] font-medium text-[#1A1F36]">-$78.20</p>
            </li>
            <li class="flex items-center justify-between px-4 py-3">
              <div>
                <p class="text-[16px]">Netflix</p>
                <p class="text-[14px] text-neutral-500">Jun 19</p>
              </div>
              <p class="text-[16px] font-medium text-[#1A1F36]">-$15.99</p>
            </li>
            <li class="flex items-center justify-between px-4 py-3">
              <div>
                <p class="text-[16px]">Salary</p>
                <p class="text-[14px] text-neutral-500">Jun 16</p>
              </div>
              <p class="text-[16px] font-medium text-[#00C896]">+$3,200.00</p>
            </li>
            <li class="flex items-center justify-between px-4 py-3">
              <div>
                <p class="text-[16px]">Uber</p>
                <p class="text-[14px] text-neutral-500">Jun 15</p>
              </div>
              <p class="text-[16px] font-medium text-[#1A1F36]">-$24.50</p>
            </li>
          </ul>
        </section>
      </main>

      <!-- Bottom Navigation -->
      <nav class="absolute bottom-0 left-0 right-0 bg-white shadow-[0_-2px_6px_rgba(0,0,0,0.05)]">
        <div class="grid grid-cols-4">
          <!-- Dashboard -->
          <button class="flex flex-col items-center justify-center py-3 active:scale-95" aria-label="Dashboard">
            <i data-lucide="home" class="w-7 h-7 text-[#2B5CE6]"></i>
            <span class="text-[16px] font-medium text-[#2B5CE6]">Dashboard</span>
          </button>
          <!-- Transactions -->
          <button class="flex flex-col items-center justify-center py-3 active:scale-95" aria-label="Transactions">
            <i data-lucide="list" class="w-7 h-7 text-neutral-400"></i>
            <span class="text-[16px] font-medium text-neutral-400">Transactions</span>
          </button>
          <!-- Budgets -->
          <button class="flex flex-col items-center justify-center py-3 active:scale-95" aria-label="Budgets">
            <i data-lucide="pie-chart" class="w-7 h-7 text-neutral-400"></i>
            <span class="text-[16px] font-medium text-neutral-400">Budgets</span>
          </button>
          <!-- Profile -->
          <button class="flex flex-col items-center justify-center py-3 active:scale-95" aria-label="Profile">
            <i data-lucide="user" class="w-7 h-7 text-neutral-400"></i>
            <span class="text-[16px] font-medium text-neutral-400">Profile</span>
          </button>
        </div>
      </nav>
    </div>
  </div>

  <!-- Icons, chart, and animation setup -->
  <script>
    // Activate Lucide icons
    lucide.createIcons();

    // Bar Chart
    const ctx = document.getElementById('spendingChart');
    const spendingChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Groceries', 'Transport', 'Entertainment', 'Bills'],
        datasets: [{
          label: 'Amount',
          data: [450, 150, 200, 500],
          backgroundColor: ['#2B5CE6', '#4B7BF5', '#2B5CE6', '#4B7BF5'],
          borderRadius: 6,
          barThickness: 32
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#1A1F36',
            titleFont: { size: 14, weight: 600, family: 'Roboto' },
            bodyFont: { size: 14, weight: 400, family: 'Roboto' },
            padding: 8,
            displayColors: false,
            callbacks: {
              label: ctx => `$${ctx.parsed.y}`
            }
          }
        },
        scales: {
          x: { grid: { display: false }, ticks: { font: { family: 'Roboto', size: 14 } } },
          y: { display: false }
        }
      }
    });

    // Fade-in staggered animation
    window.addEventListener('load', () => {
      document.querySelectorAll('.stagger-fade').forEach((el, i) => {
        setTimeout(() => {
          el.classList.remove('opacity-0', 'translate-y-4');
          el.classList.add('transition-all', 'duration-500');
        }, i * 120);
      });
    });
  </script>
</body>
</html>
