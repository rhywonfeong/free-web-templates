  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen flex items-center justify-center p-4">
  <div class="w-[26rem] bg-zinc-900 border border-zinc-800 rounded-lg shadow-lg overflow-hidden">
    <!-- Header -->
    <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
      <h3 class="text-sm font-medium">Prompt Builder</h3>
      <button class="text-zinc-400 hover:text-zinc-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <!-- Content -->
    <div class="p-4">
      <!-- Role/Instruction -->
      <div class="mb-3">
        <label for="role" class="block text-xs text-zinc-400 mb-1">Role/Instruction</label>
        <input id="role" type="text" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-xs focus:ring-1 focus:ring-indigo-500 outline-none" placeholder="e.g., You are a helpful assistant">
      </div>
      <!-- Prompt Textarea -->
      <div class="mb-3">
        <label for="prompt-main" class="block text-xs text-zinc-400 mb-1">
          Main Prompt <span class="text-zinc-500">(use <code class="bg-zinc-700 px-1 rounded text-amber-300">{variable}</code> to insert variables)</span>
        </label>
        <textarea id="prompt-main" rows="4" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-xs focus:ring-1 focus:ring-indigo-500 outline-none" placeholder="Write your prompt here..."></textarea>
      </div>
      <!-- Variables -->
      <div class="mb-4">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs text-zinc-400">Variables</span>
          <button id="addVarBtn" type="button" class="text-xs text-indigo-400 hover:text-indigo-300">+ Add</button>
        </div>
        <div id="vars-list" class="space-y-2"></div>
      </div>
      <!-- Preview -->
      <div class="mb-4">
        <div class="flex items-center mb-1">
          <span class="text-xs text-zinc-400">Preview</span>
        </div>
        <div id="preview" class="w-full min-h-[70px] bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-xs text-zinc-100 font-mono whitespace-pre-line overflow-x-auto"></div>
      </div>
      <!-- Copy & Save -->
      <div class="flex gap-2">
        <button id="copyBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded text-xs font-medium transition-colors">Copy</button>
        <button id="saveBtn" class="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 py-2 rounded text-xs font-medium transition-colors">Save</button>
      </div>
    </div>
    <!-- Footer -->
    <div class="p-3 border-t border-zinc-800 text-[10px] text-zinc-500 flex items-center">
      <svg class="w-3 h-3 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2a4 4 0 014-4h3m2 2v6a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h7l5 5z"/></svg>
      Prompts are private and auto-saved locally.
    </div>
  </div>
  <script>
    // Element refs
    const roleEl = document.getElementById('role');
    const promptEl = document.getElementById('prompt-main');
    const varsList = document.getElementById('vars-list');
    const addVarBtn = document.getElementById('addVarBtn');
    const previewEl = document.getElementById('preview');
    const copyBtn = document.getElementById('copyBtn');
    const saveBtn = document.getElementById('saveBtn');
    // State
    let variables = [];
    function renderVars() {
      varsList.innerHTML = '';
      for (let i = 0; i < variables.length; i++) {
        const v = variables[i];
        const row = document.createElement('div');
        row.className = 'flex gap-2 items-center';
        row.innerHTML = `
          <input type="text" value="${v.name}" data-idx="${i}" data-type="name" placeholder="Name" class="bg-zinc-800 border border-zinc-700 rounded px-2 py-1 text-xs flex-1 focus:ring-1 focus:ring-amber-400 outline-none" />
          <input type="text" value="${v.value}" data-idx="${i}" data-type="value" placeholder="Value" class="bg-zinc-800 border border-zinc-700 rounded px-2 py-1 text-xs flex-1 focus:ring-1 focus:ring-amber-400 outline-none" />
          <button data-idx="${i}" class="text-xs text-zinc-400 hover:text-red-400 px-1">&times;</button>
        `;
        row.querySelectorAll('input').forEach(input => {
          input.oninput = (e) => {
            const idx = parseInt(e.target.dataset.idx);
            variables[idx][e.target.dataset.type] = e.target.value;
            renderPreview();
          };
        });
        row.querySelector('button').onclick = (e) => {
          variables.splice(i, 1);
          renderVars();
          renderPreview();
        };
        varsList.appendChild(row);
      }
    }
    addVarBtn.onclick = () => {
      variables.push({ name: '', value: '' });
      renderVars();
    };
    function renderPreview() {
      let prompt = promptEl.value;
      variables.forEach(v => {
        if (v.name) {
          const re = new RegExp(`\{${v.name}\}`, 'g');
          prompt = prompt.replace(re, v.value || `{${v.name}}`);
        }
      });
      const roleText = roleEl.value ? `[${roleEl.value}]\n
` : '';
      previewEl.textContent = roleText + prompt;
    }
    [promptEl, roleEl].forEach(el => el.oninput = renderPreview);
    // Initial
    renderVars();
    renderPreview();
    // Copy btn
    copyBtn.onclick = () => {
      navigator.clipboard.writeText(previewEl.textContent);
      copyBtn.textContent = "Copied!";
      setTimeout(() => copyBtn.textContent = "Copy", 1200);
    };
    // Save btn (localStorage)
    function savePrompt() {
      const promptData = {
        role: roleEl.value,
        prompt: promptEl.value,
        variables: variables
      };
      localStorage.setItem('prompt-builder-draft', JSON.stringify(promptData));
      saveBtn.textContent = "Saved!";
      setTimeout(() => saveBtn.textContent = "Save", 1200);
    }
    saveBtn.onclick = savePrompt;
    // Load draft on start
    const draft = localStorage.getItem('prompt-builder-draft');
    if (draft) {
      try {
        const data = JSON.parse(draft);
        roleEl.value = data.role || "";
        promptEl.value = data.prompt || "";
        variables = Array.isArray(data.variables) ? data.variables : [];
        renderVars();
        renderPreview();
      } catch {}
    }
  </script>
</body>
</html>
