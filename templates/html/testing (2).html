<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Gradient Glass Card – No Shadow</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',ui-sans-serif,system-ui;background:#0f172a;}
    .gradient-wrap{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;}
    .gradient{position:absolute;width:200%;height:200%;left:-50%;top:-50%;
      background:radial-gradient(circle at var(--x,50%) var(--y,50%),#3b82f6 0%,rgba(59,130,246,0) 60%);
      filter:blur(80px) saturate(1.4);transition:background .08s;}
    .card{position:relative;z-index:1;width:20rem;height:12rem;
      background:rgba(255,255,255,.12);backdrop-filter:blur(16px) saturate(2);
      -webkit-backdrop-filter:blur(16px) saturate(2);border-radius:1.25rem;
      transform:rotate(52.5deg);}
    .card::before{content:'';position:absolute;inset:0;border-radius:inherit;
      background:linear-gradient(125deg,rgba(255,255,255,.8) 0%,rgba(255,255,255,0) 60%);
      opacity:.25;}
    @media(max-width:420px){.card{width:18rem;height:10rem;}}
  </style>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
  <div class="gradient-wrap" aria-hidden="true">
    <div class="gradient"></div>
  </div>

  <!-- Decorative glass card, now without shadow -->
  <div class="card focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-400" tabindex="0" aria-label="Decorative glass card, no shadow"></div>

  <script>
    const gradient = document.querySelector('.gradient');
    const updatePosition = (e) => {
      const x = (e.clientX / window.innerWidth) * 100;
      const y = (e.clientY / window.innerHeight) * 100;
      gradient.style.setProperty('--x', `${x}%`);
      gradient.style.setProperty('--y', `${y}%`);
    };
    window.addEventListener('pointermove', updatePosition, {passive:true});
  </script>
</body>
</html>
