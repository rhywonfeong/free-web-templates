<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TxFlow Join</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());

</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-[#050805] text-white font-sans antialiased relative min-h-screen flex flex-col justify-center items-center p-6 overflow-x-hidden">

    <!-- Close Button -->
    <button class="absolute top-6 right-6 md:top-8 md:right-8 text-gray-500 hover:text-white transition-colors focus:outline-none">
        <iconify-icon icon="solar:close-circle-linear" width="32" height="32"></iconify-icon>
    </button>

    <main class="w-full max-w-[560px] flex flex-col items-center mt-8 md:mt-0">
        
        <!-- Header -->
        <div class="mb-14 md:mb-20 w-full text-center">
            <h1 class="text-4xl md:text-5xl font-semibold tracking-tight text-white mb-5">
                Welcome to TxFlow
            </h1>
            <p class="text-lg md:text-xl text-gray-400">
                The Blockchain where finance happens.
            </p>
        </div>

        <!-- Form Container -->
        <div class="w-full flex flex-col">
            <h2 class="text-xl md:text-2xl font-medium tracking-tight text-white mb-6 text-left">
                Enter your access code to Join Alpha Mainnet
            </h2>
            
            <!-- Input Field -->
            <input 
                type="text" 
                placeholder="87ehHe9kf9eju09hHe80" 
                class="w-full bg-[#1b211b] text-gray-300 placeholder-gray-500 rounded-md px-5 py-4 text-lg font-mono focus:outline-none focus:ring-1 focus:ring-[#8ced8c] transition-shadow border border-transparent" 
            />
            
            <!-- Promotion Banner -->
            <div class="w-full bg-[#162716] rounded-md mt-5 border border-[#8ced8c]/10 px-5 py-4 flex items-center gap-4">
                
                <!-- Mosaic Loading Container -->
                <div class="relative w-8 h-8 flex-none flex justify-center items-center text-[#8ced8c]" id="mosaic-loader">
                    <iconify-icon icon="solar:ticket-linear" width="28" height="28"></iconify-icon>
                </div>

                <!-- Static Text -->
                <span class="text-lg text-white">
                    Use code <span class="text-[#8ced8c] font-mono">ALPHA</span> for exclusive Alpha access
                </span>

            </div>
            
            <!-- Action Button with Scanlines -->
            <button class="w-full bg-[#8ced8c] bg-[repeating-linear-gradient(0deg,transparent,transparent_2px,rgba(0,0,0,0.08)_2px,rgba(0,0,0,0.08)_4px)] text-black font-medium text-xl py-4 rounded-md mt-6 hover:opacity-90 transition-opacity active:scale-[0.99] flex justify-center items-center">
                Verify
            </button>
            
            <!-- Footer Link -->
            <p class="text-center text-lg text-gray-400 mt-8">
                Don't have a code? 
                <a href="#" class="text-[#8ced8c] hover:underline ml-1">Join the Waitlist</a>
            </p>
        </div>

    </main>

    <!-- Mosaic Loading Script -->
    <script>
        (function() {
            const loader = document.getElementById('mosaic-loader');
            const states = [
                '<iconify-icon icon="solar:ticket-linear" width="28" height="28"></iconify-icon>',
                '<span class="font-bold text-lg tracking-tighter leading-none">40%</span>'
            ];
            let currentState = 0;

            function triggerMosaic() {
                const nextState = (currentState + 1) % states.length;
                
                // Create overlay grid
                const overlay = document.createElement('div');
                overlay.className = 'absolute inset-0 grid grid-cols-4 grid-rows-4 z-10';
                
                // Generate blocks
                const blocks = Array.from({ length: 16 }, () => {
                    const block = document.createElement('div');
                    // Increased transition duration slightly
                    block.className = 'bg-[#8ced8c] opacity-0 transition-opacity duration-[100ms]';
                    
                    // Assign random target opacity
                    const opacities = ['1', '0.6', '0.3'];
                    block.dataset.targetOpacity = opacities[Math.floor(Math.random() * opacities.length)];
                    
                    overlay.appendChild(block);
                    return block;
                });
                
                loader.appendChild(overlay);

                // Randomize indices
                const indices = Array.from({ length: 16 }, (_, i) => i).sort(() => Math.random() - 0.5);
                
                // Phase 1: Cover with mosaic blocks (Slowed interval from 6ms to 15ms)
                indices.forEach((index, i) => {
                    setTimeout(() => blocks[index].style.opacity = blocks[index].dataset.targetOpacity, i * 15);
                });

                // Phase 2: Swap content and reveal
                setTimeout(() => {
                    // Remove current content
                    Array.from(loader.childNodes).forEach(node => {
                        if (node !== overlay) loader.removeChild(node);
                    });

                    // Insert new state content
                    const temp = document.createElement('div');
                    temp.innerHTML = states[nextState];
                    Array.from(temp.childNodes).forEach(node => loader.insertBefore(node, overlay));
                    
                    currentState = nextState;

                    // Uncover blocks
                    indices.forEach((index, i) => {
                        setTimeout(() => blocks[index].style.opacity = '0', i * 15);
                    });

                    // Clean up and schedule next transition
                    setTimeout(() => {
                        if (loader.contains(overlay)) loader.removeChild(overlay);
                        // Longer wait time between animations (1500ms to 2500ms)
                        setTimeout(triggerMosaic, 2500);
                    }, indices.length * 15 + 100);

                }, indices.length * 15 + 150);
            }

            // Start the sequence loop with slower initial delay
            setTimeout(triggerMosaic, 2500);
        })();
    </script>
</body>
</html>
