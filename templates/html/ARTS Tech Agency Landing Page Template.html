        const { useState, useEffect, useRef, useMemo } = React;

        // --- Three.js Background Component ---
        const Scene3D = () => {
            const mountRef = useRef(null);

            useEffect(() => {
                const scene = new THREE.Scene();
                // Fog for depth
                scene.fog = new THREE.FogExp2(0x030305, 0.002);

                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                mountRef.current.appendChild(renderer.domElement);

                // Particles
                const geometry = new THREE.BufferGeometry();
                const particlesCount = 2000;
                const posArray = new Float32Array(particlesCount * 3);

                for(let i = 0; i < particlesCount * 3; i++) {
                    posArray[i] = (Math.random() - 0.5) * 20; 
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
                const material = new THREE.PointsMaterial({
                    size: 0.02,
                    color: 0x4f46e5, // Indigo tint
                    transparent: true,
                    opacity: 0.8,
                });

                const particlesMesh = new THREE.Points(geometry, material);
                scene.add(particlesMesh);

                // Floating Geometric Shapes (Icosahedrons)
                const shapes = [];
                const shapeGeo = new THREE.IcosahedronGeometry(1, 0);
                const shapeMat = new THREE.MeshBasicMaterial({ 
                    color: 0xffffff, 
                    wireframe: true, 
                    transparent: true, 
                    opacity: 0.05 
                });

                for(let i=0; i<3; i++) {
                    const mesh = new THREE.Mesh(shapeGeo, shapeMat);
                    mesh.position.set(
                        (Math.random() - 0.5) * 15,
                        (Math.random() - 0.5) * 15,
                        (Math.random() - 0.5) * 10
                    );
                    mesh.scale.setScalar(Math.random() + 0.5);
                    scene.add(mesh);
                    shapes.push(mesh);
                }

                camera.position.z = 5;

                // Mouse interaction
                let mouseX = 0;
                let mouseY = 0;
                let targetX = 0;
                let targetY = 0;

                const windowHalfX = window.innerWidth / 2;
                const windowHalfY = window.innerHeight / 2;

                const onDocumentMouseMove = (event) => {
                    mouseX = (event.clientX - windowHalfX);
                    mouseY = (event.clientY - windowHalfY);
                }

                document.addEventListener('mousemove', onDocumentMouseMove);

                const animate = () => {
                    requestAnimationFrame(animate);

                    targetX = mouseX * 0.001;
                    targetY = mouseY * 0.001;

                    particlesMesh.rotation.y += 0.001;
                    particlesMesh.rotation.x += 0.0005;

                    particlesMesh.rotation.y += 0.05 * (targetX - particlesMesh.rotation.y);
                    particlesMesh.rotation.x += 0.05 * (targetY - particlesMesh.rotation.x);

                    shapes.forEach((shape, i) => {
                        shape.rotation.x += 0.002 * (i + 1);
                        shape.rotation.y += 0.002 * (i + 1);
                    });

                    renderer.render(scene, camera);
                };

                animate();

                const handleResize = () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                };

                window.addEventListener('resize', handleResize);

                return () => {
                    window.removeEventListener('resize', handleResize);
                    document.removeEventListener('mousemove', onDocumentMouseMove);
                    mountRef.current.removeChild(renderer.domElement);
                };
            }, []);

            return <div ref={mountRef} className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none" />;
        };
