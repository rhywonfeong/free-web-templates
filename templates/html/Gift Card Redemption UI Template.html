<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Redeem Gift Card</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
/* Custom Animations and Base Styles */
@keyframes float {
0% { transform: translateY(0px) rotateX(0deg); }
50% { transform: translateY(-8px) rotateX(2deg); }
100% { transform: translateY(0px) rotateX(0deg); }
}
@keyframes spin-slow {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}
.card-anim {
animation: float 6s ease-in-out infinite;
transform-style: preserve-3d;
perspective: 1000px;
}
.spinner {
animation: spin-slow 1s linear infinite;
}
/* Hide scrollbar for cleaner UI */
body::-webkit-scrollbar {
display: none;
}
body {
-ms-overflow-style: none;
scrollbar-width: none;
}
/* Apple-like input reset */
input:focus {
outline: none;
}
</style></head>
<body class="bg-black text-white font-sans antialiased min-h-screen flex flex-col items-center justify-center p-6 selection:bg-white/20">

    <!-- Main Container -->
    <div class="w-full max-w-sm flex flex-col items-center relative">

        <!-- Header -->
        <header class="flex items-center gap-1 mb-10 opacity-90">
            <iconify-icon icon="cib:apple" width="20" height="20" class="text-white pb-1"></iconify-icon>
            <span class="text-lg font-semibold tracking-tight">Pay</span>
        </header>

        <!-- Card Area -->
        <div class="relative w-full aspect-[1.58/1] mb-12 group perspective">
            <!-- Loading Overlay (High Z-Index, hidden by default) -->
            <div id="loadingOverlay" class="absolute inset-0 z-50 rounded-2xl bg-black/60 backdrop-blur-md flex flex-col items-center justify-center opacity-0 pointer-events-none transition-all duration-300">
                <iconify-icon icon="solar:restart-linear" class="spinner text-white/80 mb-3" width="32" height="32"></iconify-icon>
                <span class="text-sm font-medium tracking-tight text-white/90">Checking card information...</span>
            </div>

            <!-- The Card -->
            <div class="card-anim w-full h-full rounded-2xl bg-gradient-to-br from-zinc-800 via-zinc-900 to-black border border-white/10 shadow-2xl relative overflow-hidden p-6 flex flex-col justify-between">
                <!-- Gloss effect -->
                <div class="absolute -top-1/2 -right-1/2 w-full h-full bg-gradient-to-b from-white/10 to-transparent rounded-full blur-3xl pointer-events-none"></div>

                <div class="flex justify-between items-start z-10">
                    <div class="flex flex-col">
                        <span class="text-xs font-medium text-zinc-400 uppercase tracking-widest mb-1">Digital Gift Card</span>
                        <span class="text-xl font-medium tracking-tight">$512.00</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <span class="text-xs text-zinc-500 tracking-wider h-full flex items-center pt-1">• • • •</span>
                        <span class="text-xs font-mono text-zinc-400">8921</span>
                    </div>
                </div>

                <!-- Logo/Icon decoration on card -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-5 pointer-events-none">
                     <iconify-icon icon="cib:apple" width="120" height="120"></iconify-icon>
                </div>

                <div class="z-10">
                    <span class="text-sm font-medium text-zinc-300 tracking-tight block opacity-80">Marcus Reynold</span>
                </div>
            </div>
        </div>

        <!-- Form Content -->
        <div class="w-full space-y-6">
            <div class="text-center space-y-1">
                <h1 class="text-2xl font-semibold tracking-tight">Redeem Gift Card</h1>
                <p class="text-sm text-zinc-500 font-medium">Redeem a gift card using Apple Pay.</p>
            </div>

            <div class="space-y-4">
                <!-- Input Group -->
                <div class="space-y-2">
                    <label for="giftCode" class="text-xs font-semibold text-zinc-500 uppercase tracking-wider ml-1">Insert Code</label>
                    <div class="relative group">
                        <input type="text" id="giftCode" placeholder="Enter gift card code" class="w-full bg-zinc-900/80 border border-zinc-800 text-white text-base rounded-xl py-4 pl-4 pr-12 placeholder:text-zinc-600 focus:border-zinc-600 transition-colors">
                        
                        <!-- Submit Action (Always Visible) -->
                        <button id="submitBtn" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-white flex items-center justify-center transition-colors active:scale-95">
                            <iconify-icon icon="solar:arrow-right-linear" width="20" height="20"></iconify-icon>
                        </button>
                    </div>
                </div>

                <!-- Error Message Container (Hidden by default) -->
                <div id="errorContainer" class="hidden">
                    <p class="text-sm text-red-400 text-center leading-snug px-2" id="errorText"></p>
                </div>

                <!-- Use Camera Trigger -->
                <div class="pt-2 flex justify-center">
                    <button id="cameraTrigger" class="flex items-center gap-2 text-zinc-400 hover:text-white transition-colors py-2 px-4 rounded-full bg-zinc-900/50 hover:bg-zinc-900 border border-transparent hover:border-zinc-800">
                        <iconify-icon icon="solar:camera-linear" width="18" height="18"></iconify-icon>
                        <span class="text-sm font-medium">Use Camera</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Camera Selector Modal (Hidden by default) -->
    <div id="cameraModal" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm hidden flex flex-col justify-end sm:justify-center items-center opacity-0 transition-opacity duration-200">
        <!-- Hidden File Input for Gallery -->
        <input type="file" id="fileInput" accept="image/*" class="hidden">

        <div class="w-full max-w-sm p-4 space-y-2 translate-y-full sm:translate-y-0 transition-transform duration-300" id="modalContent">
            <div class="bg-zinc-900/90 backdrop-blur-xl rounded-xl overflow-hidden">
                <button id="takePhotoBtn" class="w-full py-4 text-center text-blue-400 text-base font-medium border-b border-white/10 hover:bg-white/5 active:bg-white/10 transition-colors">
                    Take Photo
                </button>
                <button id="galleryBtn" class="w-full py-4 text-center text-blue-400 text-base font-medium hover:bg-white/5 active:bg-white/10 transition-colors">
                    Choose from Gallery
                </button>
            </div>
            
            <button id="cancelBtn" class="w-full py-4 bg-zinc-900/90 backdrop-blur-xl rounded-xl text-center text-blue-400 text-base font-semibold hover:bg-white/5 active:bg-white/10 transition-colors">
                Cancel
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const giftCodeInput = document.getElementById('giftCode');
        const submitBtn = document.getElementById('submitBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorContainer = document.getElementById('errorContainer');
        const errorText = document.getElementById('errorText');
        
        const cameraTrigger = document.getElementById('cameraTrigger');
        const cameraModal = document.getElementById('cameraModal');
        const modalContent = document.getElementById('modalContent');
        const cancelBtn = document.getElementById('cancelBtn');
        const galleryBtn = document.getElementById('galleryBtn');
        const takePhotoBtn = document.getElementById('takePhotoBtn');
        const fileInput = document.getElementById('fileInput');

        // Logic Variables
        let isProcessing = false;

        // --- Core Functions ---

        function showLoading() {
            if (isProcessing) return;
            isProcessing = true;
            
            // Hide previous errors
            errorContainer.classList.add('hidden');
            
            // Show overlay
            loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
            
            // Blur effect on background elements slightly? No, design requests overlay on card.
        }

        function hideLoading() {
            isProcessing = false;
            loadingOverlay.classList.add('opacity-0', 'pointer-events-none');
        }

        function displayError(message, code = null) {
            hideLoading();
            errorContainer.classList.remove('hidden');
            
            if (code) {
                // Secure handling of HTML insertion
                errorText.innerHTML = `This card (<span class="text-white font-mono bg-white/10 px-1 rounded mx-0.5">${code}</span>) cannot be used at this moment. Please try another card.`;
            } else {
                errorText.textContent = message || "An unknown error occurred.";
            }
        }

        function handleCodeSubmit() {
            const code = giftCodeInput.value.trim();
            if (!code || isProcessing) return;

            showLoading();

            // 3-5 second delay
            setTimeout(() => {
                displayError(null, code);
            }, 4000);
        }

        function handleCameraSelection() {
            // Close modal first
            closeModal();
            
            // Trigger loading immediately after selection logic
            showLoading();

            setTimeout(() => {
                displayError("Cannot verify image content. Please enter code manually.");
            }, 3500);
        }

        // --- Event Listeners ---

        // Input Submit (Click)
        submitBtn.addEventListener('click', handleCodeSubmit);

        // Input Submit (Enter Key)
        giftCodeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleCodeSubmit();
                // Close mobile keyboard
                giftCodeInput.blur();
            }
        });

        // Camera Logic
        cameraTrigger.addEventListener('click', () => {
            cameraModal.classList.remove('hidden');
            // Small delay to allow display block to render before opacity transition
            setTimeout(() => {
                cameraModal.classList.remove('opacity-0');
                modalContent.classList.remove('translate-y-full');
            }, 10);
        });

        function closeModal() {
            modalContent.classList.add('translate-y-full');
            cameraModal.classList.add('opacity-0');
            setTimeout(() => {
                cameraModal.classList.add('hidden');
            }, 300);
        }

        cancelBtn.addEventListener('click', closeModal);

        // Gallery Action
        galleryBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                handleCameraSelection();
                // Reset input
                fileInput.value = '';
            }
        });

        // Photo Action
        takePhotoBtn.addEventListener('click', () => {
            // Simulate camera capture flow
            handleCameraSelection();
        });

        // Close modal on outside tap
        cameraModal.addEventListener('click', (e) => {
            if (e.target === cameraModal) closeModal();
        });

    </script>
</body>
</html>
