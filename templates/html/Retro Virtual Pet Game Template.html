<body class="bg-black text-green-500 min-h-screen flex items-center justify-center selection:bg-green-900 selection:text-green-100" style="font-family: 'Press Start 2P', monospace;">

    <!-- Device Container -->
    <div class="w-full max-w-sm mx-auto p-4 sm:p-6 flex flex-col gap-6">
        
        <!-- Header -->
        <div class="text-center tracking-tight text-lg text-green-600">
            V-PET_OS v1.0
        </div>

        <!-- Main Device Shell -->
        <div class="bg-zinc-950 border-4 border-zinc-800 rounded-3xl p-4 sm:p-6 flex flex-col gap-6 shadow-[0_0_30px_rgba(0,255,0,0.05)] relative overflow-hidden">
            
            <!-- Screen Frame -->
            <div class="bg-[#051005] border-4 border-zinc-700 rounded-xl p-3 flex flex-col relative" style="aspect-ratio: 1/1;">
                
                <!-- Screen Glitch overlay (subtle) -->
                <div class="absolute inset-0 bg-[linear-gradient(transparent_50%,rgba(0,255,0,0.02)_50%)] bg-[length:100%_4px] pointer-events-none z-20"></div>

                <!-- Top Stats -->
                <div class="flex justify-between text-xs text-green-700 z-10 mb-2">
                    <div class="flex flex-col gap-1">
                        <div>HNG <span id="bar-hunger" class="text-green-500">■■■■■</span></div>
                        <div>HAP <span id="bar-happiness" class="text-green-500">■■■■■</span></div>
                    </div>
                    <div class="flex flex-col gap-1 items-end">
                        <div>ENG <span id="bar-energy" class="text-green-500">■■■■■</span></div>
                        <div>AGE <span id="val-age" class="text-green-500">0</span></div>
                    </div>
                </div>

                <!-- Main Display Area -->
                <div id="screen-container" class="flex-grow flex items-center justify-center relative z-10 transition-opacity duration-1000">
                    
                    <!-- Poop Indicator -->
                    <div id="poop-area" class="absolute bottom-2 right-2 text-xs hidden">
                        (~)
                    </div>

                    <!-- Pet ASCII Art -->
                    <pre id="pet-art" class="text-sm sm:text-base leading-tight whitespace-pre text-center transform transition-transform duration-200"></pre>
                    
                    <!-- Sleep Overlay -->
                    <div id="sleep-overlay" class="absolute inset-0 bg-black/80 hidden items-center justify-center">
                        <span class="text-xs animate-pulse">ZzZzZ...</span>
                    </div>

                </div>

                <!-- Bottom Message Bar -->
                <div class="h-8 mt-2 flex items-center justify-center border-t border-green-900/50 z-10">
                    <span id="message-bar" class="text-xs text-green-600 truncate uppercase">SYSTEM READY</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="grid grid-cols-4 gap-3 sm:gap-4 relative z-10">
                <button onclick="petAction('feed')" class="flex flex-col items-center justify-center gap-2 p-3 bg-zinc-900 border-2 border-zinc-800 rounded-lg hover:bg-zinc-800 hover:border-green-800 hover:text-green-400 active:scale-95 transition-all focus:outline-none">
                    <iconify-icon icon="solar:cup-hot-linear" class="text-xl"></iconify-icon>
                    <span class="text-xs">FEED</span>
                </button>
                <button onclick="petAction('play')" class="flex flex-col items-center justify-center gap-2 p-3 bg-zinc-900 border-2 border-zinc-800 rounded-lg hover:bg-zinc-800 hover:border-green-800 hover:text-green-400 active:scale-95 transition-all focus:outline-none">
                    <iconify-icon icon="solar:gamepad-linear" class="text-xl"></iconify-icon>
                    <span class="text-xs">PLAY</span>
                </button>
                <button onclick="petAction('sleep')" class="flex flex-col items-center justify-center gap-2 p-3 bg-zinc-900 border-2 border-zinc-800 rounded-lg hover:bg-zinc-800 hover:border-green-800 hover:text-green-400 active:scale-95 transition-all focus:outline-none">
                    <iconify-icon icon="solar:moon-linear" class="text-xl"></iconify-icon>
                    <span class="text-xs">SLP</span>
                </button>
                <button onclick="petAction('clean')" class="flex flex-col items-center justify-center gap-2 p-3 bg-zinc-900 border-2 border-zinc-800 rounded-lg hover:bg-zinc-800 hover:border-green-800 hover:text-green-400 active:scale-95 transition-all focus:outline-none">
                    <iconify-icon icon="solar:trash-bin-trash-linear" class="text-xl"></iconify-icon>
                    <span class="text-xs">CLN</span>
                </button>
            </div>
            
            <!-- Reset Button (Hidden initially) -->
            <button id="btn-reset" onclick="initGame()" class="hidden w-full py-4 mt-2 bg-green-900/20 border-2 border-green-800 rounded-lg hover:bg-green-900/40 active:scale-95 transition-all text-xs focus:outline-none uppercase">
                Reboot System
            </button>

        </div>
    </div>

    <script>
        // Game Engine
        const MAX_STAT = 10;
        const TICK_RATE = 1000; // 1 second

        const frames = {
            egg: [
                "  .---.  \n /     \\ \n \\     / \n  '---'  ",
                "  .---.  \n /  .  \\ \n \\     / \n  '---'  "
            ],
            baby: [
                "   _   \n (o.o) \n  > <  ",
                "   _   \n (-.-) \n  > <  "
            ],
            adult: [
                "  /\\_/\\  \n ( o.o ) \n (  _  ) \n  \"   \"  ",
                "  /\\_/\\  \n ( -.- ) \n (  _  ) \n  \"   \"  "
            ],
            eat: [
                "  /\\_/\\  \n ( ^o^ ) \n (  _  ) \n  \"   \"  "
            ],
            happy: [
                " \\ /\\_/\\ / \n  ( ^.^ )  \n  (  _  )  \n   \"   \"   "
            ],
            dead: [
                "  /\\_/\\  \n ( x.x ) \n (  _  ) \n  \"   \"  ",
                "   RIP   \n  _____  \n |     | "
            ]
        };

        let state = {};
        let loopId;
        let animId;
        let frameIndex = 0;
        let tickCount = 0;

        function initGame() {
            clearInterval(loopId);
            clearInterval(animId);
            
            state = {
                phase: 'egg',
                hunger: MAX_STAT,
                happiness: MAX_STAT,
                energy: MAX_STAT,
                age: 0,
                poop: false,
                isSleeping: false,
                isDead: false,
                currentAction: null,
                actionTimer: 0
            };

            document.getElementById('btn-reset').classList.add('hidden');
            document.getElementById('screen-container').style.opacity = '1';
            
            showMessage("EGG HATCHING...");
            setTimeout(() => {
                state.phase = 'baby';
                showMessage("A NEW FRIEND!");
            }, 5000);

            startLoops();
            updateUI();
        }

        function startLoops() {
            // Main game logic loop
            loopId = setInterval(() => {
                if (state.isDead) return;
                
                tickCount++;

                // Evolution
                if (tickCount === 30 && state.phase === 'baby') {
                    state.phase = 'adult';
                    showMessage("EVOLVED!");
                }

                // Age
                if (tickCount % 60 === 0) state.age++;

                // Action timer clearing
                if (state.currentAction && state.actionTimer > 0) {
                    state.actionTimer--;
                    if (state.actionTimer <= 0) state.currentAction = null;
                }

                // Stat decay
                if (!state.isSleeping && tickCount % 5 === 0) {
                    if (Math.random() > 0.5) state.hunger = Math.max(0, state.hunger - 1);
                    if (Math.random() > 0.5) state.happiness = Math.max(0, state.happiness - 1);
                    state.energy = Math.max(0, state.energy - 1);
                }

                // Sleep logic
                if (state.isSleeping) {
                    state.energy = Math.min(MAX_STAT, state.energy + 2);
                    if (state.energy === MAX_STAT && tickCount % 3 === 0) {
                        state.isSleeping = false; // Wake up naturally
                        showMessage("WOKE UP");
                    }
                }

                // Poop logic
                if (state.phase !== 'egg' && !state.poop && tickCount % 15 === 0 && Math.random() > 0.7) {
                    state.poop = true;
                    showMessage("NEEDS CLEANING");
                }
                
                // Poop penalty
                if (state.poop && tickCount % 3 === 0) {
                    state.happiness = Math.max(0, state.happiness - 1);
                }

                // Death check
                if (state.hunger === 0 || state.happiness === 0 || state.energy === 0) {
                    // Give a small grace period before actual death if stats hit 0, simulated by random chance here
                    if(Math.random() > 0.8) {
                        die();
                    } else if (state.hunger === 0) {
                        showMessage("STARVING...");
                    } else if (state.happiness === 0) {
                        showMessage("SAD...");
                    } else if (state.energy === 0) {
                        showMessage("EXHAUSTED...");
                    }
                }

                updateUI();
            }, TICK_RATE);

            // Animation loop
            animId = setInterval(() => {
                if (state.isDead && state.actionTimer <= 0) {
                     frameIndex = tickCount % 2 === 0 ? 0 : 1; // slow toggle for tombstone
                } else {
                    frameIndex = (frameIndex + 1) % 2;
                }
                renderPet();
            }, 600);
        }

        function die() {
            state.isDead = true;
            state.phase = 'dead';
            state.isSleeping = false;
            state.actionTimer = 2; // Show dead body briefly before tombstone
            showMessage("GAME OVER");
            document.getElementById('btn-reset').classList.remove('hidden');
            clearInterval(loopId);
            updateUI();
        }

        function petAction(action) {
            if (state.isDead || state.phase === 'egg') return;
            
            // Wake up on any action except sleep
            if (state.isSleeping && action !== 'sleep') {
                state.isSleeping = false;
                showMessage("WOKE UP");
            }

            switch(action) {
                case 'feed':
                    if (state.hunger >= MAX_STAT) {
                        showMessage("FULL!");
                    } else {
                        state.hunger = Math.min(MAX_STAT, state.hunger + 3);
                        state.currentAction = 'eat';
                        state.actionTimer = 3;
                        showMessage("YUM!");
                    }
                    break;
                case 'play':
                    if (state.energy < 3) {
                        showMessage("TOO TIRED");
                    } else {
                        state.happiness = Math.min(MAX_STAT, state.happiness + 2);
                        state.energy = Math.max(0, state.energy - 2);
                        state.hunger = Math.max(0, state.hunger - 1);
                        state.currentAction = 'happy';
                        state.actionTimer = 3;
                        showMessage("FUN!");
                    }
                    break;
                case 'sleep':
                    if (state.energy >= MAX_STAT) {
                        showMessage("NOT TIRED");
                    } else {
                        state.isSleeping = !state.isSleeping;
                        showMessage(state.isSleeping ? "SLEEPING..." : "WOKE UP");
                    }
                    break;
                case 'clean':
                    if (state.poop) {
                        state.poop = false;
                        showMessage("SQUEAKY CLEAN");
                    } else {
                        showMessage("ALREADY CLEAN");
                    }
                    break;
            }
            updateUI();
        }

        function getMeterString(val) {
            const filled = Math.ceil(val / 2);
            return '■'.repeat(filled) + '□'.repeat(5 - filled);
        }

        function showMessage(msg) {
            const bar = document.getElementById('message-bar');
            bar.textContent = msg;
            
            // Glitch effect on message change
            bar.classList.add('opacity-50', 'translate-x-1');
            setTimeout(() => {
                bar.classList.remove('opacity-50', 'translate-x-1');
            }, 100);

            // Clear generic messages after a bit
            setTimeout(() => {
                if (document.getElementById('message-bar').textContent === msg && !state.isDead) {
                    document.getElementById('message-bar').textContent = '';
                }
            }, 3000);
        }

        function renderPet() {
            const petEl = document.getElementById('pet-art');
            let currentFrames;

            if (state.isDead) {
                currentFrames = state.actionTimer > 0 ? [frames.dead[0]] : [frames.dead[1]];
            } else if (state.currentAction && frames[state.currentAction]) {
                currentFrames = frames[state.currentAction];
            } else {
                currentFrames = frames[state.phase];
            }

            // Ensure we don't go out of bounds if array size changes
            const art = currentFrames[frameIndex % currentFrames.length];
            petEl.textContent = art;

            // Simple bounce animation during play
            if (state.currentAction === 'happy') {
                petEl.classList.toggle('-translate-y-2');
            } else {
                petEl.classList.remove('-translate-y-2');
            }
        }

        function updateUI() {
            document.getElementById('bar-hunger').textContent = getMeterString(state.hunger);
            document.getElementById('bar-happiness').textContent = getMeterString(state.happiness);
            document.getElementById('bar-energy').textContent = getMeterString(state.energy);
            document.getElementById('val-age').textContent = state.age;

            const sleepOverlay = document.getElementById('sleep-overlay');
            if (state.isSleeping) {
                sleepOverlay.classList.remove('hidden');
                sleepOverlay.classList.add('flex');
            } else {
                sleepOverlay.classList.add('hidden');
                sleepOverlay.classList.remove('flex');
            }

            const poopArea = document.getElementById('poop-area');
            if (state.poop && !state.isDead) {
                poopArea.classList.remove('hidden');
            } else {
                poopArea.classList.add('hidden');
            }

            renderPet();
        }

        // Start
        initGame();

    </script>
</body>
