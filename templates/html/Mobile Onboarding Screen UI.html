  <meta charset="UTF-8">

  <title>Onboarding iPhone UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #171823 0%, #23254a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-container {
      opacity: 0;
      transform: scale(0.95);
      animation: fadeInScale 0.9s cubic-bezier(0.4,0,0.2,1) 0.1s forwards;
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.95);}
      to { opacity:1; transform: scale(1);}
    }
    .phone-body { 
      animation: slideUp 1s cubic-bezier(0.4,0,0.2,1) 0.3s forwards;
      opacity: 0; transform: translateY(44px);
    }
    .screen-shape {
      animation: slideUp 1s cubic-bezier(0.4,0,0.2,1) 0.5s forwards;
      opacity: 0; transform: translateY(44px);
    }
    .screen-content {
      animation: slideUp 1s cubic-bezier(0.4,0,0.2,1) 0.7s forwards;
      opacity: 0; transform: translateY(44px);
    }
    .onboard-text {
      animation: slideUp 0.7s cubic-bezier(0.4,0,0.2,1) 1s forwards;
      opacity: 0; transform: translateY(24px);
    }
    .actions {
      animation: slideUp 0.7s cubic-bezier(0.4,0,0.2,1) 1.2s forwards;
      opacity: 0; transform: translateY(24px);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(44px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .phone-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: tracePath 3.5s cubic-bezier(0.4,0,0.2,1) 1.1s forwards;
    }
    @keyframes tracePath {
      0% { stroke-dashoffset: 1000;}
      100% { stroke-dashoffset: 0;}
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(10px);
      opacity: 0.5;
      mix-blend-mode: screen;
    }
    .blob-1 { width: 64%; height: 64%; background: #8d82f7; animation: blob1 15s ease-in-out infinite alternate;}
    .blob-2 { width: 45%; height: 45%; background: #4d7cfe; animation: blob2 17s ease-in-out infinite alternate;}
    @keyframes blob1 {
      0%,100% { transform: translate(-20%, -18%);}
      50% { transform: translate(18%, 12%);}
    }
    @keyframes blob2 {
      0%,100% { transform: translate(15%, 0);}
      50% { transform: translate(-12%, -16%);}
    }
  </style>
</head>
<body>
  <div class="card-container relative">
    <div class="max-w-[320px] min-w-[230px] w-[296px] rounded-[28px] overflow-hidden flex flex-col bg-[#191b22] border border-white/10 shadow-xl shadow-black/30 relative">
      <!-- Top iPhone Mockup with Animated Phone & Screen -->
      <div class="relative w-full h-[210px] overflow-hidden bg-gradient-to-b from-[#20223a] to-[#191b22] flex items-center justify-center">

          <!-- iPhone body -->
          <div class="phone-body absolute w-[184px] h-[372px] rounded-[36px] top-[-85px] left-0 bg-gradient-to-br from-white/10 to-white/5 border border-white/15 shadow-lg"></div>
          <!-- iPhone screen -->
          <div class="screen-shape absolute top-[-76px] left-[8px] w-[168px] h-[348px] rounded-[28px] bg-gradient-to-b from-[#292b3a] to-[#191b22] border border-white/10 z-10">

                  <rect x="24" y="34" width="32" height="28" rx="8" fill="#4D7CFE"/>
                  <rect x="33" y="25" width="14" height="18" rx="6" fill="#fff" fill-opacity="0.95"/>
                  <circle cx="40" cy="52" r="3" fill="#fff" fill-opacity="0.7"/>

          <!-- iPhone outline with animated stroke -->
          <svg class="absolute top-[-85px] left-0 w-[184px] h-[372px] z-30 pointer-events-none" viewBox="0 0 184 372" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="rgba(77,124,254,0)" />
                <stop offset="35%" stop-color="rgba(77,124,254,0.14)" />
                <stop offset="48%" stop-color="rgba(77,124,254,0.7)" />
                <stop offset="50%" stop-color="rgba(77,124,254,1)" />
                <stop offset="52%" stop-color="rgba(77,124,254,0.7)" />
                <stop offset="70%" stop-color="rgba(77,124,254,0.12)" />
                <stop offset="100%" stop-color="rgba(77,124,254,0)" />
              </linearGradient>
            </defs>
            <path class="phone-path" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" 
              filter="drop-shadow(0 0 5px rgba(77,124,254,0.23))"
              d="M 30,2 H 154 C 169,2 182,15 182,30 V 342 C 182,357 169,370 154,370 H 30 C 15,370 2,357 2,342 V 30 C 2,15 15,2 30,2 Z" />
          </svg>
        </div>
        <div class="absolute bottom-0 left-0 right-0 h-[50px] bg-gradient-to-t from-[#191b22] to-transparent"></div>
      </div>
      <!-- Onboarding Text & Actions -->
      <div class="flex flex-col items-center px-6 pt-6 pb-8 space-y-6 bg-[#191b22] border-t border-white/5">
        <div class="onboard-text flex flex-col items-center space-y-2">
          <h3 class="text-white text-xl font-semibold text-center leading-tight">Let's get started!</h3>
          <p class="text-white text-sm opacity-75 text-center leading-snug max-w-xs">

        <div class="actions w-full flex flex-col gap-2">

            <span class="text-white text-base font-semibold">Continue</span>
          </button>
          <button class="w-full rounded-xl py-3 flex items-center justify-center border border-white/10 bg-white/5 hover:bg-white/10 transition-all duration-200">
            <span class="text-white/80 text-base font-medium">Skip</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script>
    // Animate glowing gradient on iPhone outline
    document.addEventListener('DOMContentLoaded', function () {
      const grad = document.getElementById('glowGrad');
      if (!grad) return;
      let angle = 0;
      function animateGrad() {
        angle = (angle + 1) % 360;
        const x1 = 50 + 45 * Math.cos(angle * Math.PI / 180);
        const y1 = 50 + 45 * Math.sin(angle * Math.PI / 180);
        const x2 = 50 + 45 * Math.cos((angle + 180) * Math.PI / 180);
        const y2 = 50 + 45 * Math.sin((angle + 180) * Math.PI / 180);
        grad.setAttribute('x1', `${x1}%`);
        grad.setAttribute('y1', `${y1}%`);
        grad.setAttribute('x2', `${x2}%`);
        grad.setAttribute('y2', `${y2}%`);
        requestAnimationFrame(animateGrad);
      }
      animateGrad();
    });
  </script>
