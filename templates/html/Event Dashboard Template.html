<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6 text-gray-900">

    <!-- Main Workspace Container -->
    <main class="relative w-full max-w-4xl rounded-[24px] bg-white p-10 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.05)] ring-1 ring-gray-100">
        
        <!-- Header -->
        <header class="mb-10 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <h1 class="text-2xl tracking-tight font-medium text-gray-900 flex items-center gap-2">
                    <span class="text-gray-400 font-normal">Project:</span>
                    Annual Tech Summit
                </h1>
                
                <!-- Pulsing LIVE Badge -->
                <div class="inline-flex items-center gap-1.5 rounded-full bg-pink-50 px-2.5 py-1 text-xs font-medium text-pink-600 ring-1 ring-inset ring-pink-500/20">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-pink-500"></span>
                    </span>
                    LIVE
                </div>
            </div>
            
            <!-- Subtle Logo/Brand element -->
            <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-gray-900 text-white">
                <span class="text-xs font-medium tracking-tighter">NX</span>
            </div>
        </header>

        <!-- Dashboard Body (Grid) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
            
            <!-- Card 1: Registration Webpage -->
            <div class="group flex min-h-[160px] flex-col rounded-2xl border border-gray-100 bg-white p-5 shadow-sm transition-all duration-300 hover:border-gray-200 hover:shadow-md">
                <div class="mb-4 flex h-10 w-10 items-center justify-center rounded-xl bg-gray-50 text-gray-500 ring-1 ring-inset ring-gray-100/50 group-hover:text-blue-600 group-hover:bg-blue-50 transition-colors">
                    <iconify-icon icon="solar:sidebar-minimalistic-linear" class="text-xl" stroke-width="1.5"></iconify-icon>
                </div>
                <h2 class="text-sm font-medium text-gray-900">Registration Webpage</h2>
                
                <div class="mt-auto pt-4 flex items-center justify-between border-t border-gray-50">
                    <span class="text-xs font-normal text-gray-500">Status</span>
                    <div class="flex items-center gap-2.5">
                        <span class="text-xs font-medium text-blue-600">Active</span>
                        <!-- Custom Toggle -->
                        <div class="relative inline-flex h-4 w-8 shrink-0 cursor-pointer items-center justify-center rounded-full">
                            <span class="pointer-events-none absolute h-full w-full rounded-full bg-blue-600 transition-colors duration-200"></span>
                            <span class="pointer-events-none absolute left-0.5 inline-block h-3 w-3 translate-x-4 transform rounded-full bg-white shadow-sm ring-0 transition duration-200 ease-in-out"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Card 2: VIP Photo Booth -->
            <div class="group flex min-h-[160px] flex-col rounded-2xl border border-gray-100 bg-white p-5 shadow-sm transition-all duration-300 hover:border-gray-200 hover:shadow-md">
                <div class="mb-4 flex h-10 w-10 items-center justify-center rounded-xl bg-gray-50 text-gray-500 ring-1 ring-inset ring-gray-100/50 group-hover:text-blue-600 group-hover:bg-blue-50 transition-colors">
                    <iconify-icon icon="solar:camera-linear" class="text-xl" stroke-width="1.5"></iconify-icon>
                </div>
                <h2 class="text-sm font-medium text-gray-900">VIP Photo Booth</h2>
                
                <div class="mt-auto pt-4 flex items-center justify-between border-t border-gray-50">
                    <span class="text-xs font-normal text-gray-500">Engagement</span>
                    <div class="flex items-center gap-1.5 rounded-md bg-gray-50 px-2 py-1 text-xs font-medium text-gray-700 ring-1 ring-inset ring-gray-200/50">
                        <iconify-icon icon="solar:gallery-linear" class="text-gray-400" stroke-width="1.5"></iconify-icon>
                        450 Captures
                    </div>
                </div>
            </div>

            <!-- Card 3: Keynote Trivia -->
            <div class="group flex min-h-[160px] flex-col rounded-2xl border border-gray-100 bg-white p-5 shadow-sm transition-all duration-300 hover:border-gray-200 hover:shadow-md">
                <div class="mb-4 flex h-10 w-10 items-center justify-center rounded-xl bg-gray-50 text-gray-500 ring-1 ring-inset ring-gray-100/50 group-hover:text-blue-600 group-hover:bg-blue-50 transition-colors">
                    <iconify-icon icon="solar:bolt-linear" class="text-xl" stroke-width="1.5"></iconify-icon>
                </div>
                <h2 class="text-sm font-medium text-gray-900">Keynote Trivia</h2>
                
                <div class="mt-auto pt-4 flex items-center justify-between border-t border-gray-50">
                    <span class="text-xs font-normal text-gray-500">Controls</span>
                    <button class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-3.5 py-1.5 text-xs font-medium text-white shadow-sm hover:bg-blue-500 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-600 focus:ring-offset-1">
                        Manage
                    </button>
                </div>
            </div>

        </div>

        <!-- Floating Action Button -->
        <div class="absolute -bottom-6 -right-6 z-10 group">
            <button class="flex h-14 w-14 items-center justify-center rounded-full bg-blue-600 text-white shadow-lg shadow-blue-600/30 ring-4 ring-white transition-transform duration-300 hover:-translate-y-1 hover:bg-blue-500 focus:outline-none">
                <iconify-icon icon="solar:add-linear" class="text-2xl" stroke-width="1.5"></iconify-icon>
            </button>
            
            <!-- Tooltip -->
            <div class="absolute bottom-full right-2 mb-3 w-max opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-200 pointer-events-none">
                <div class="relative bg-gray-900 text-white text-xs font-medium rounded-lg py-1.5 px-3 shadow-xl">
                    Add New Experience
                    <!-- Tooltip Arrow -->
                    <div class="absolute -bottom-1 right-4 w-2 h-2 bg-gray-900 rotate-45"></div>
                </div>
            </div>
        </div>

    </main>

</body>
