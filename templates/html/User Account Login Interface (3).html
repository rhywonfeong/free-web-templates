    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-5xl overflow-hidden rounded-2xl shadow-lg">
        <div class="flex flex-col md:flex-row">
            <!-- Left Column - Image -->
            <div class="w-full md:w-1/2 bg-gradient-to-br from-purple-900 via-blue-900 to-gray-900 p-8 flex items-center justify-center">
                <div class="text-center">
                    <h2 class="text-3xl font-bold text-white mb-6">Welcome Back</h2>
                    <p class="text-blue-200 max-w-sm mx-auto">Sign in to access your account and continue your journey with us.</p>
                </div>
            </div>
            
            <!-- Right Column - Login Form -->
            <div class="w-full md:w-1/2 bg-gray-800 p-8 md:p-12">
                <div class="mb-8">
                    <h1 class="text-2xl font-bold text-white mb-2">Login</h1>
                    <p class="text-gray-400">Please enter your credentials</p>
                </div>
                
                <form class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="you@example.com"
                            required
                        >
                    </div>
                    
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <label for="password" class="block text-sm font-medium text-gray-300">Password</label>
                            <a href="#" class="text-sm text-blue-400 hover:text-blue-300">Forgot password?</a>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="••••••••"
                            required
                        >
                    </div>
                    
                    <div class="flex items-center">
                        <input id="remember-me" type="checkbox" class="h-4 w-4 rounded bg-gray-700 border-gray-600 text-blue-600 focus:ring-blue-500">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-300">Remember me</label>
                    </div>
                    
                    <div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 shadow-md">
                            Sign in
                        </button>
                    </div>
                </form>
                
                <div class="mt-8 text-center">
                    <p class="text-gray-400">
                        Don't have an account? 
                        <a href="#" class="text-blue-400 hover:text-blue-300 font-medium">Create account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
