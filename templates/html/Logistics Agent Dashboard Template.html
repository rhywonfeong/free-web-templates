<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay Agent Dashboard - Dribbble Aesthetic</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
}
/* Hide scrollbar for clean app look */
.no-scrollbar::-webkit-scrollbar {
display: none;
}
.no-scrollbar {
-ms-overflow-style: none;
scrollbar-width: none;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="flex items-center justify-center min-h-screen bg-[#E2E8F0] text-gray-900 antialiased selection:bg-[#6200EE] selection:text-white">

    <!-- Mobile Device Container -->
    <div class="relative w-full max-w-[375px] h-[812px] bg-[#F4F6F9] overflow-hidden shadow-2xl sm:rounded-[40px] sm:border-[8px] border-gray-900 flex flex-col">
        
        <!-- 1. ARTISTIC HEADER BACKGROUND (Subtle Mesh Gradient) -->
        <div class="absolute top-0 inset-x-0 h-64 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-blue-400/20 via-[#6200EE]/10 to-transparent pointer-events-none z-0"></div>

        <!-- Status Bar Space (Mock) -->
        <div class="h-12 w-full flex-shrink-0 relative z-10"></div>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto no-scrollbar relative z-10 pb-40">
            
            <!-- THE TOP NAV & GREETING -->
            <header class="px-6 mb-8 flex items-start justify-between">
                <div>
                    <!-- Greeting -->
                    <h1 class="text-2xl font-semibold tracking-tight text-gray-900 mb-2.5 leading-tight">Good Morning,<br>Marc</h1>
                    <!-- Glassmorphic Hub Pill -->
                    <div class="inline-flex items-center gap-1.5 bg-white/40 backdrop-blur-md border border-white/60 shadow-sm rounded-full px-3 py-1.5">
                        <span class="text-xs">📍</span>
                        <span class="text-xs font-medium text-gray-800">Akwa Central</span>
                    </div>
                </div>
                <!-- Profile Picture (Floating Style) -->
                <div class="w-12 h-12 rounded-full bg-white p-1 shadow-sm border border-white/50">
                    <img src="https://ui-avatars.com/api/?name=Marc+Agent&background=f4f6f9&color=6200EE&rounded=true" alt="Marc" class="w-full h-full rounded-full object-cover">
                </div>
            </header>

            <!-- 2. THE 'REVENUE GLOW' CARD -->
            <section class="mx-6 p-5 rounded-[28px] bg-gradient-to-br from-[#5A00D6] to-[#8E2DE2] text-white shadow-[0_20px_40px_-10px_rgba(98,0,238,0.5)] relative overflow-hidden ring-1 ring-white/20 inset">
                <!-- Decorative Glows -->
                <div class="absolute -top-12 -right-12 w-32 h-32 bg-white/20 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-10 -left-10 w-24 h-24 bg-[#00B4D8]/30 rounded-full blur-2xl pointer-events-none"></div>
                
                <div class="relative z-10">
                    <!-- Top section -->
                    <div class="flex items-start justify-between mb-6">
                        <!-- Neon Wallet Icon -->
                        <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center shadow-[inset_0_0_10px_rgba(255,255,255,0.2)]">
                            <iconify-icon icon="solar:wallet-linear" width="24" class="text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.8)]"></iconify-icon>
                        </div>
                        <!-- Frosted Glass Withdraw Button -->
                        <button class="text-xs font-medium bg-white/20 backdrop-blur-md border border-white/30 hover:bg-white/30 transition-colors px-4 py-2 rounded-full shadow-sm">
                            Withdraw
                        </button>
                    </div>
                    
                    <!-- Middle Currency -->
                    <div class="mb-6">
                        <h2 class="text-[10px] text-white/70 font-medium uppercase tracking-wider mb-1">Total Balance</h2>
                        <div class="text-3xl font-semibold tracking-tight drop-shadow-md">45,200 FCFA</div>
                    </div>
                    
                    <!-- Bottom Progress Bar -->
                    <div>
                        <div class="flex items-center justify-between text-[11px] text-white/90 font-medium mb-2">
                            <span>Progress</span>
                            <span>75% to Next Payout</span>
                        </div>
                        <div class="w-full h-1.5 bg-black/20 rounded-full relative">
                            <!-- Fill -->
                            <div class="absolute left-0 top-0 h-full w-[75%] bg-gradient-to-r from-white/60 to-white rounded-full">
                                <!-- Glowing Tip -->
                                <div class="absolute right-0 top-1/2 -translate-y-1/2 w-2.5 h-2.5 bg-white rounded-full shadow-[0_0_12px_4px_rgba(255,255,255,0.8)]"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 3. THE BENTO-GRID STATS -->
            <section class="mx-6 mt-6 grid grid-cols-2 gap-4">
                <!-- Inbound (Large Square) -->
                <div class="col-span-1 bg-white rounded-[24px] p-5 shadow-[0_8px_30px_rgb(0,0,0,0.03)] flex flex-col justify-between aspect-square border border-gray-50/50">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-50 to-blue-100/50 flex items-center justify-center text-blue-500 shadow-[0_0_20px_rgba(59,130,246,0.15)] relative">
                        <iconify-icon icon="solar:box-linear" width="26" class="drop-shadow-[0_0_6px_rgba(59,130,246,0.5)]"></iconify-icon>
                    </div>
                    <div>
                        <div class="text-3xl font-semibold tracking-tight text-gray-900 leading-none">12</div>
                        <div class="text-xs text-gray-500 mt-2 font-medium leading-snug">Packages<br>Arriving</div>
                    </div>
                </div>
                
                <!-- Right Column (Stacked Horizontals) -->
                <div class="col-span-1 flex flex-col gap-4">
                    <!-- On Shelf -->
                    <div class="flex-1 bg-white rounded-[20px] p-4 shadow-[0_8px_30px_rgb(0,0,0,0.03)] flex items-center gap-3 border border-gray-50/50">
                        <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-500 flex-shrink-0">
                            <iconify-icon icon="solar:server-square-linear" width="20"></iconify-icon>
                        </div>
                        <div>
                            <div class="text-xl font-semibold tracking-tight text-gray-900 leading-none">85</div>
                            <div class="text-[11px] text-gray-500 mt-1 font-medium">On Shelf</div>
                        </div>
                    </div>
                    <!-- Overdue -->
                    <div class="flex-1 bg-white rounded-[20px] p-4 shadow-[0_8px_30px_rgb(0,0,0,0.03)] flex items-center gap-3 border border-red-50 relative overflow-hidden">
                        <div class="absolute inset-0 bg-red-50/30 pointer-events-none"></div>
                        <div class="w-10 h-10 rounded-full bg-red-100/50 flex items-center justify-center text-red-500 flex-shrink-0 relative z-10">
                            <iconify-icon icon="solar:alarm-linear" width="20"></iconify-icon>
                        </div>
                        <div class="relative z-10">
                            <div class="text-xl font-semibold tracking-tight text-red-600 leading-none">03</div>
                            <div class="text-[11px] text-red-500 font-medium mt-1">Needs Action</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 5. THE TASK TIMELINE (Modern List) -->
            <section class="mx-6 mt-8">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold tracking-tight text-gray-900">Recent Tasks</h3>
                    <button class="text-xs text-[#6200EE] font-medium bg-[#6200EE]/5 px-3 py-1.5 rounded-full hover:bg-[#6200EE]/10 transition-colors">View All</button>
                </div>
                
                <div class="flex flex-col gap-3">
                    <!-- Task 1 (Delivery) -->
                    <div class="bg-white rounded-[20px] p-3.5 shadow-[0_8px_30px_rgb(0,0,0,0.03)] border border-gray-50/50 flex items-center justify-between">
                        <div class="flex items-center gap-3.5">
                            <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center flex-shrink-0">
                                <iconify-icon icon="solar:box-linear" width="20"></iconify-icon>
                            </div>
                            <div>
                                <div class="text-sm font-medium text-gray-900">Delivered #KLI-8942</div>
                                <div class="text-[11px] text-gray-400 mt-0.5">Today, 10:30 AM</div>
                            </div>
                        </div>
                        <div class="text-xs font-medium text-emerald-600 bg-emerald-50/50 px-2.5 py-1 rounded-lg">
                            +150
                        </div>
                    </div>

                    <!-- Task 2 (Restock) -->
                    <div class="bg-white rounded-[20px] p-3.5 shadow-[0_8px_30px_rgb(0,0,0,0.03)] border border-gray-50/50 flex items-center justify-between">
                        <div class="flex items-center gap-3.5">
                            <div class="w-10 h-10 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center flex-shrink-0">
                                <iconify-icon icon="solar:archive-down-minimlistic-linear" width="20"></iconify-icon>
                            </div>
                            <div>
                                <div class="text-sm font-medium text-gray-900">Restocked Lot #KLI-05</div>
                                <div class="text-[11px] text-gray-400 mt-0.5">Today, 09:15 AM</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- 4. NEUMORPHIC SCAN BUTTON (Massive Floating CTA) -->
        <div class="absolute bottom-16 left-1/2 -translate-x-1/2 z-30 flex items-center justify-center pointer-events-none">
            <!-- Breathing Light Effect Background -->
            <div class="absolute inset-0 bg-[#6200EE]/20 rounded-full blur-xl animate-pulse scale-150"></div>
            
            <button class="pointer-events-auto relative w-[72px] h-[72px] bg-[#F4F6F9] rounded-full flex items-center justify-center shadow-[8px_8px_16px_#d1d5db,-8px_-8px_16px_#ffffff] transition-transform active:scale-95 border border-white/50">
                <!-- Inner gradient for convex shape -->
                <div class="absolute inset-0 rounded-full bg-gradient-to-br from-white/80 to-transparent opacity-60"></div>
                <iconify-icon icon="solar:qr-code-linear" width="32" class="text-[#6200EE] relative z-10 drop-shadow-sm"></iconify-icon>
            </button>
        </div>

        <!-- 6. FLOATING TAB BAR -->
        <nav class="absolute bottom-6 left-6 right-6 h-[72px] bg-white/75 backdrop-blur-xl rounded-[32px] shadow-[0_20px_40px_-10px_rgba(0,0,0,0.08)] border border-white/60 flex items-center justify-between px-6 z-20">
            <!-- Home (Active) -->
            <button class="text-[#6200EE] flex flex-col items-center gap-1 transition-transform active:scale-95">
                <iconify-icon icon="solar:home-2-bold" width="24" class="drop-shadow-[0_2px_4px_rgba(98,0,238,0.2)]"></iconify-icon>
            </button>
            
            <!-- Inventory -->
            <button class="text-gray-400 hover:text-gray-600 flex flex-col items-center gap-1 transition-all active:scale-95">
                <iconify-icon icon="solar:box-linear" width="24"></iconify-icon>
            </button>
            
            <!-- Structural spacer for the Neumorphic CTA above it -->
            <div class="w-16"></div>
            
            <!-- Wallet -->
            <button class="text-gray-400 hover:text-gray-600 flex flex-col items-center gap-1 transition-all active:scale-95">
                <iconify-icon icon="solar:wallet-linear" width="24"></iconify-icon>
            </button>
            
            <!-- Profile -->
            <button class="text-gray-400 hover:text-gray-600 flex flex-col items-center gap-1 transition-all active:scale-95">
                <iconify-icon icon="solar:user-linear" width="24"></iconify-icon>
            </button>
        </nav>

    </div>

</body>
</html>
