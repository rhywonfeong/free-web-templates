  <meta charset="UTF-8">
  <title>Keyboard Speed Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    let currentLetter = '';
    let score = 0;
    let timer = null;
    let timeLeft = 10; // seconds

    function getRandomLetter() {
      const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      return letters[Math.floor(Math.random() * letters.length)];
    }

    function updateLetter() {
      currentLetter = getRandomLetter();
      document.getElementById('letter').textContent = currentLetter;
    }

    function updateScore() {
      document.getElementById('score').textContent = score;
    }

    function updateTimer() {
      document.getElementById('timer').textContent = timeLeft;
    }

    function endGame() {
      document.getElementById('overlay').classList.remove('hidden');
      document.getElementById('final-score').textContent = score;
      document.removeEventListener('keydown', keyHandler);
      clearInterval(timer);
    }

    function keyHandler(e) {
      if (e.key.toUpperCase() === currentLetter) {
        score++;
        updateScore();
        updateLetter();
      }
    }

    function startGame() {
      score = 0;
      timeLeft = 10;
      updateScore();
      updateLetter();
      updateTimer();
      document.getElementById('overlay').classList.add('hidden');
      document.addEventListener('keydown', keyHandler);
      timer = setInterval(() => {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    window.onload = () => {
      document.getElementById('start-btn').onclick = startGame;
      document.getElementById('restart-btn').onclick = startGame;
    };
  </script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 min-h-screen flex flex-col items-center justify-center">
  <div class="bg-gray-800 rounded-xl shadow-lg p-8 text-center w-80 flex flex-col items-center">
    <h1 class="text-3xl font-bold text-white mb-2">Keyboard Game</h1>
    <p class="text-gray-300 mb-6">Press the highlighted key as fast as you can!</p>
    <div class="my-8">
      <div id="letter" class="text-7xl font-extrabold text-yellow-400 bg-gray-700 rounded-lg px-10 py-6 mx-auto mb-4 shadow-lg select-none">A</div>
      <div class="flex justify-between w-full text-lg mt-2">
        <div class="text-white">Score: <span id="score" class="font-semibold">0</span></div>
        <div class="text-white">Time: <span id="timer" class="font-semibold">10</span>s</div>
      </div>
    </div>
    <button id="start-btn" class="bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-bold px-6 py-2 rounded-lg mt-4 transition">Start</button>
  </div>
  <!-- Overlay -->
  <div id="overlay" class="fixed inset-0 bg-black bg-opacity-80 flex flex-col items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl p-8 shadow-2xl text-center w-80">
      <h2 class="text-2xl font-bold text-gray-900 mb-4">Time's up!</h2>
      <p class="mb-2 text-gray-700">Your final score:</p>
      <div class="text-4xl font-extrabold text-yellow-500 mb-6" id="final-score">0</div>
      <button id="restart-btn" class="bg-yellow-400 hover:bg-yellow-300 text-gray-900 font-bold px-6 py-2 rounded-lg transition">Play Again</button>
    </div>
  </div>
</body>
