? window.cancelAnimationFrame.bind(window)
: window.clearTimeout.bind(window);

const pausedFrameCallbacks = new Map();

style.textContent = [

'  transition-duration: 0s !important;',
'  scroll-behavior: auto !important;',
'}'
].join('\n');
document.head.appendChild(style);
window.requestAnimationFrame = function(callback) {
const frameId = nextFrameId++;
if (paused) {
pausedFrameCallbacks.set(frameId, callback);
frameRecords.set(frameId, { paused: true });
return frameId;
}
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });

};
window.cancelAnimationFrame = function(frameId) {
const record = frameRecords.get(frameId);
pausedFrameCallbacks.delete(frameId);
if (record && typeof record.nativeFrameId !== 'undefined') {
nativeCancelAnimationFrame(record.nativeFrameId);
}
frameRecords.delete(frameId);
};
window.setInterval = function(callback, delay) {
const args = Array.prototype.slice.call(arguments, 2);
return nativeSetInterval(function() {
if (paused) return;
callback.apply(this, args);
}, delay);
};
const flushPausedFrames = function() {
const callbacks = Array.from(pausedFrameCallbacks.entries());
pausedFrameCallbacks.clear();
callbacks.forEach(function(entry) {
const frameId = entry[0];
const callback = entry[1];
const nativeFrameId = nativeRequestAnimationFrame(function(timestamp) {
frameRecords.delete(frameId);
callback(timestamp);
});
frameRecords.set(frameId, { nativeFrameId: nativeFrameId });
});
};
const setPaused = function(nextPaused) {
const shouldPause = Boolean(nextPaused);
if (paused === shouldPause) return;

document.documentElement.toggleAttribute('data-aura-preview-paused', paused);
if (!paused) {
flushPausedFrames();
}

setPaused: setPaused,

return paused;
}
};
window.addEventListener('message', function(event) {
if (event.source !== window.parent) return;

setPaused(event.data.paused);
});

            <div class="grid gap-7 lg:grid-cols-[1.3fr_.7fr]"><div><div class="flex items-center gap-2 text-sm text-[#c0d8d5]">${icon("notebook-bookmark")} Bijoy Classic Course</div><h2 class="mt-4 text-2xl font-semibold tracking-tight">আপনি দারুণভাবে এগোচ্ছেন।</h2><p class="mt-2 text-sm text-[#b8cfcc]">Lesson ${state.currentLesson} / 30 · নিয়মিত অনুশীলন আপনার গতি স্থির রাখবে।</p><div class="mt-6 h-2 overflow-hidden rounded-full bg-white/15"><div class="h-full rounded-full bg-[#83d1ba]" style="width:${completion}%"></div></div><div class="mt-2 flex justify-between text-xs text-[#bad0cd]"><span>${completion}% কোর্স সম্পন্ন</span><span>${state.completed.length}টি Lesson শেষ</span></div><div class="mt-6">${button("Continue Learning " + icon("arrow-right"), "startLesson("+state.currentLesson+")", "soft")}</div></div><div class="grid grid-cols-2 gap-3 self-end"><div class="rounded-xl border border-white/10 bg-white/8 p-4"><p class="text-xs text-[#b8cfcc]">বর্তমান speed</p><p class="mt-2 text-2xl font-semibold">${state.bestWpm} <span class="text-xs font-medium">WPM</span></p></div><div class="rounded-xl border border-white/10 bg-white/8 p-4"><p class="text-xs text-[#b8cfcc]">গড় accuracy</p><p class="mt-2 text-2xl font-semibold">${state.accuracy}<span class="text-xs font-medium">%</span></p></div></div></div>
          </section>
          <section class="mt-6 grid gap-4 sm:grid-cols-2 xl:grid-cols-4">${statCard("Speed",state.bestWpm+" WPM","arrow-trend-up","#267e70","গত সপ্তাহের চেয়ে +2")}${statCard("Accuracy",state.accuracy+"%","target","#4779a3","খুব ভালো নির্ভুলতা")}${statCard("Lessons Completed",state.completed.length+" / 30","notebook-bookmark","#8c6a38","পরবর্তী: Lesson "+state.currentLesson)}${statCard("Practice Time",formatTime(state.practiceSeconds),"clock-circle","#86658b","এই সপ্তাহে 42 মিনিট")}</section>
          <section class="mt-9 grid gap-6 xl:grid-cols-[1.35fr_.65fr]">
            <div><div class="mb-4 flex items-center justify-between"><h2 class="text-xl font-semibold tracking-tight">Continue Learning</h2><button onclick="navigate('course')" class="text-sm font-semibold text-[#267773]">সব Lesson দেখুন</button></div>
              <div class="rounded-2xl border border-[#dfe8e5] bg-white p-5 sm:p-6"><div class="flex flex-wrap items-start justify-between gap-4"><div><span class="text-xs font-bold tracking-wider text-[#4d8e89]">LESSON ${String(state.currentLesson).padStart(2,"0")} · LEVEL 03</span><h3 class="mt-2 text-xl font-semibold">${getLesson(state.currentLesson).title}</h3><p class="mt-2 max-w-xl text-sm leading-6 text-[#667572]">${getLesson(state.currentLesson).desc}</p></div><span class="rounded-full bg-[#fff4df] px-3 py-1.5 text-xs font-semibold text-[#986621]">সহজ</span></div><div class="mt-6 flex flex-wrap items-center justify-between gap-4 border-t border-[#eef2f1] pt-5"><div class="flex gap-5 text-xs text-[#6e7c79]"><span class="flex items-center gap-1">${icon("clock-circle")} 12 মিনিট</span><span class="flex items-center gap-1">${icon("target")} 80% accuracy প্রয়োজন</span></div>${button("Resume Lesson " + icon("arrow-right"),"startLesson("+state.currentLesson+")")}</div></div>
              <h2 class="mb-4 mt-9 text-xl font-semibold tracking-tight">Recent Activity</h2><div class="overflow-hidden rounded-xl border border-[#e0e8e6] bg-white">${state.sessions.map(s=>`<div class="flex items-center justify-between gap-3 border-b border-[#edf1f0] px-5 py-4 last:border-0"><div class="flex items-center gap-3"><span class="flex h-9 w-9 items-center justify-center rounded-lg bg-[#edf6f3] text-[#287772]">${icon("check-circle")}</span><div><p class="text-sm font-semibold">${s.name}</p><p class="mt-0.5 text-xs text-[#7b8886]">${s.time}</p></div></div><div class="text-right text-xs"><p class="font-bold text-[#21302e]">${s.wpm} WPM</p><p class="text-[#6f807d]">${s.accuracy}% accuracy</p></div></div>`).join("")}</div>
            </div>
            <div><div class="mb-4 flex items-center justify-between"><h2 class="text-xl font-semibold tracking-tight">আজকের Practice</h2></div><div class="rounded-2xl border border-[#dce8e4] bg-[#edf6f3] p-5"><span class="flex h-10 w-10 items-center justify-center rounded-xl bg-white text-[#2b8179] shadow-sm">${icon("calendar")}</span><h3 class="mt-5 text-lg font-semibold">আজ 15 মিনিট practice করুন</h3><p class="mt-2 text-sm leading-6 text-[#647572]">নিয়মিত অনুশীলন আপনার হাতের রিদম ধরে রাখে।</p><div class="mt-5 flex items-center gap-3"><div class="h-2 flex-1 overflow-hidden rounded-full bg-[#d2e7e1]"><div class="h-full w-[47%] rounded-full bg-[#3a9389]"></div></div><span class="text-xs font-semibold text-[#367d76]">7 / 15 min</span></div><div class="mt-5">${button("Start Practice", "navigate('practice')", "primary", "w-full")}</div></div>
              <div class="mt-6 rounded-2xl border border-[#e1e9e7] bg-white p-5"><p class="text-xs font-bold tracking-wider text-[#748380]">আপনার মাইলস্টোন</p><div class="mt-4 flex items-center gap-4"><span class="flex h-11 w-11 items-center justify-center rounded-full bg-[#fff4df] text-[#b27a28]">${icon("cup-star")}</span><div><p class="text-sm font-semibold">4 দিনের ধারাবাহিকতা</p><p class="mt-1 text-xs text-[#6d7b78]">আগামীকাল practice করলে streak থাকবে।</p></div></div></div>
            </div>
          </section>
        </div>`, "dashboard");
    }

    function statCard(title,value,ico,color,note) { return `<div class="rounded-xl border border-[#e0e8e6] bg-white p-4"><div class="flex items-center justify-between"><p class="text-xs font-medium text-[#6d7b78]">${title}</p><span class="flex h-8 w-8 items-center justify-center rounded-lg" style="background:${color}18;color:${color}">${icon(ico)}</span></div><p class="mt-4 text-2xl font-semibold tracking-tight">${value}</p><p class="mt-2 text-xs text-[#778582]">${note}</p></div>`; }

    function course() {
      const grouped = levels.map((level, li) => {
        const first = li * 3 + 1;
        return `<section class="mt-8"><div class="mb-3 flex items-center gap-3"><span class="text-xs font-bold tracking-[0.15em] text-[#428b85]">LEVEL ${String(li+1).padStart(2,"0")}</span><div class="h-px flex-1 bg-[#dfe8e6]"></div><span class="text-xs text-[#7b8886]">৩টি Lesson</span></div><h2 class="text-xl font-semibold tracking-tight">${level[0]}</h2><div class="mt-4 grid gap-3">${level[1].map((title,i) => {
          const n = first+i, done=state.completed.includes(n), current=n===state.currentLesson, locked=n>state.currentLesson;
          return `<div class="flex flex-wrap items-center gap-4 rounded-xl border p-4 transition ${current?"border-[#4b938d] bg-[#f2faf8]": "border-[#e0e8e6] bg-white"}">
            <span class="flex h-10 w-10 items-center justify-center rounded-xl text-sm font-bold ${done?"bg-[#dff1e9] text-[#278363]":current?"bg-[#163d46] text-white":"bg-[#f1f4f3] text-[#75827f]"}">${done?icon("check-circle"):"0"+n}</span>
            <div class="min-w-[13rem] flex-1"><div class="flex flex-wrap items-center gap-2"><h3 class="text-sm font-semibold">${title}</h3>${current?'<span class="rounded-full bg-[#dff1e9] px-2 py-0.5 text-xs font-semibold text-[#26785f]">চলমান</span>':""}</div><p class="mt-1 text-xs leading-5 text-[#6c7a77]">${n===1?"কীবোর্ডের গুরুত্বপূর্ণ key ও হাতের অবস্থান বুঝুন।":n===7?"কার চিহ্ন দিয়ে পরিচিত শব্দ লিখতে শিখুন।":"ধাপে ধাপে Bijoy Classic অনুশীলন করুন।"}</p></div>
            <div class="flex items-center gap-5 text-xs text-[#6c7b78]"><span>${10+(n%3)*5} মিনিট</span><span>${done?"Best 94%":locked?"Lesson "+(n-1)+" শেষ করুন":"লক্ষ্য 80%"}</span></div>
            ${locked?`<span class="flex h-9 w-9 items-center justify-center rounded-lg bg-[#f3f5f4] text-[#87918f]">${icon("lock")}</span>`:button(done?"আবার করুন":"শুরু করুন",`startLesson(${n})`,current?"primary":"secondary")}
          </div>`;
        }).join("")}</div></section>`;
      }).join("");
      return shell(`<div class="mx-auto max-w-5xl px-5 py-8 sm:px-8 lg:py-10"><header><p class="text-xs font-bold tracking-[0.15em] text-[#3e8983]">সম্পূর্ণ কোর্স</p><h1 class="mt-2 text-3xl font-semibold tracking-tight">Bijoy Classic Complete Course</h1><p class="mt-3 max-w-2xl text-sm leading-6 text-[#687774]">অক্ষর থেকে দ্রুত বাংলা টাইপিং — ধাপে ধাপে পুরো কোর্স সম্পন্ন করুন।</p></header><div class="mt-7 grid gap-3 sm:grid-cols-4">${statCard("মোট Lesson","30","notebook-bookmark","#4779a3","১০টি Level")}${statCard("সময়","8 ঘণ্টা","clock-circle","#876b3c","নিজের গতিতে")}${statCard("সম্পন্ন",Math.round(state.completed.length/30*100)+"%","chart-square","#2d8573",state.completed.length+"টি Lesson")}${statCard("সেরা speed",state.bestWpm+" WPM","bolt","#8b668a","Accuracy "+state.accuracy+"%")}</div>${grouped}</div>`,"course");
    }

    function keyboard(activeKey="") {
      const rows = [
        [["`","`"],["1","১"],["2","২"],["3","৩"],["4","৪"],["5","৫"],["6","৬"],["7","৭"],["8","৮"],["9","৯"],["0","০"],["-","-"],["=","="],["Backspace","Backspace"]],
        [["Tab","Tab"],["q","ং"],["w","য"],["e","ড"],["r","প"],["t","ট"],["y","চ"],["u","জ"],["i","হ"],["o","গ"],["p","ড়"],["[","["],["]","]"],["\\","\\"]],
        [["Caps","Caps"],["a","ৃ"],["s","ু"],["d","ি"],["f","া"],["g","্"],["h","ব"],["j","ক"],["k","ত"],["l","দ"],[";",";"],["'","'"],["Enter","Enter"]],
        [["Shift","Shift"],["z","ো"],["x","ে"],["c","র"],["v","ন"],["b","ল"],["n","স"],["m","ম"],[",","।"],[".","."],["/","/"],["Shift","Shift"]],
        [["Ctrl","Ctrl"],["Alt","Alt"],["Space","Space"],["Alt","Alt"],["Ctrl","Ctrl"]]
      ];
      return `<div class="mt-5 select-none rounded-xl border border-[#dce6e3] bg-[#edf2f1] p-2.5 sm:p-3">${rows.map(row=>`<div class="mb-1 flex gap-1 last:mb-0">${row.map(([key,bn])=>{
        const hit = activeKey.toLowerCase()===key.toLowerCase() || (activeKey==="Shift" && key==="Shift");
        const wide = ["Backspace","Tab","Caps","Enter","Shift","Ctrl","Alt"].includes(key), space=key==="Space";
        return `<div class="flex min-w-0 flex-1 flex-col justify-center rounded-md border px-1 py-1.5 text-center shadow-sm sm:py-2 ${hit?"border-[#1e8079] bg-[#d9f1eb] text-[#176c67] ring-2 ring-[#58b7a8]/40":"border-[#d4ddda] bg-white text-[#54625f]"} ${wide?"max-w-[4.5rem]":""} ${space?"mx-auto max-w-[19rem]":""}"><span class="text-xs font-semibold">${key}</span>${bn!==key?`<span class="mt-0.5 text-xs">${bn}</span>`:""}</div>`}).join("")}</div>`).join("")}</div>`;
    }

    function practicePage() {
      return shell(`<div class="mx-auto max-w-6xl px-5 py-8 sm:px-8 lg:py-10"><div class="mb-6 flex flex-wrap items-center justify-between gap-3"><div><p class="text-xs font-bold tracking-[0.15em] text-[#428b85]">GUIDED PRACTICE</p><h1 class="mt-1 text-3xl font-semibold tracking-tight">আজকের অনুশীলন</h1></div><div class="rounded-xl border border-[#dce7e5] bg-white px-3 py-2 text-xs text-[#63726f]">সেরা অভিজ্ঞতার জন্য physical keyboard ব্যবহার করুন</div></div>${practiceInterface()}</div>`, "practice");
    }

    function practiceInterface() {
      const typed = practice.typed || "";
      const chars = [...practice.text];
      const elapsed = practice.started ? practice.timer : 0;
      const correct = [...typed].filter((c,i)=>c===chars[i]).length;
      const accuracy = typed.length ? Math.round(correct/typed.length*100) : 100;
      const wpm = elapsed ? Math.max(0, Math.round((correct/5)/(elapsed/60))) : 0;
      const next = chars[typed.length] || "";
      const map = bijoyMap[next] || "—";
      return `<div class="grid gap-6 xl:grid-cols-[1fr_19rem]"><section class="rounded-2xl border border-[#dfe8e5] bg-white p-5 sm:p-7"><div class="flex flex-wrap items-center justify-between gap-4 border-b border-[#edf1f0] pb-5"><div><p class="text-xs font-bold tracking-wider text-[#488c87]">LESSON ${String(practice.lesson).padStart(2,"0")} · STEP 03</p><h2 class="mt-1 text-xl font-semibold">${getLesson(practice.lesson).title}</h2></div><div class="flex gap-4 text-right text-xs"><span><b id="timer" class="block text-base text-[#263532]">${formatTime(elapsed)}</b>সময়</span><span><b id="wpm" class="block text-base text-[#263532]">${wpm}</b>WPM</span><span><b id="accuracy" class="block text-base text-[#263532]">${accuracy}%</b>accuracy</span></div></div><div class="mt-8"><p class="text-xs font-semibold text-[#778583]">লিখুন</p><div class="mt-3 rounded-xl bg-[#f5f8f7] p-5 text-xl leading-10 sm:p-7 sm:text-2xl">${chars.map((ch,i)=>`<span class="${i<typed.length?(typed[i]===ch?"text-[#237e67]":"rounded bg-[#ffe1e1] text-[#ba4141]"):i===typed.length?"rounded bg-[#d8eeea] text-[#173f43] ring-2 ring-[#79bdb4]":"text-[#aeb9b7]"}">${ch===" "?"&nbsp;":ch}</span>`).join("")}</div></div><label class="mt-7 block"><span class="text-xs font-semibold text-[#778583]">আপনার লেখা</span><textarea id="typingInput" oninput="handleTyping(this.value)" onkeydown="if(event.key==='Enter' && this.value===practice.text) completePractice()" autofocus placeholder="এখানে টাইপ করা শুরু করুন…" class="mt-2 min-h-28 w-full resize-none rounded-xl border border-[#cfdedb] bg-white p-4 text-lg outline-none transition placeholder:text-[#abb6b4] focus:border-[#3b938a] focus:ring-4 focus:ring-[#77b8b0]/15"></textarea></label><div class="mt-4 flex flex-wrap justify-between gap-3">${button("Restart", "restartPractice()", "secondary")}<p class="self-center text-xs text-[#73817f]">শেষ হলে <b>Enter</b> চাপুন অথবা সম্পূর্ণ লেখা শেষ করুন।</p></div></section><aside class="space-y-4"><div class="rounded-2xl border border-[#dce8e4] bg-[#edf6f3] p-5"><p class="text-xs font-bold tracking-wider text-[#4a8983]">পরের KEY</p><p class="mt-3 text-lg font-semibold">${next ? `“${next}” লিখতে ${map}` : "অনুশীলন শেষ"}</p><p class="mt-2 text-xs leading-5 text-[#6b7d79]">Bijoy Classic layout-এ highlighted key চাপুন।</p></div><div class="rounded-2xl border border-[#dfe8e5] bg-white p-4">${keyboard(map.includes("Shift") ? map.split(" + ")[1] : map)}</div><div class="rounded-2xl border border-[#e3e9e7] bg-white p-5"><p class="text-xs font-bold tracking-wider text-[#73817f]">ছোট পরামর্শ</p><p class="mt-3 text-sm leading-6 text-[#5e6e6b]">ভুল হলে থামবেন না। ধীরে, নির্ভুলভাবে লিখুন—গতি পরে আসবে।</p></div></aside></div>`;
    }

    function testPage() {
      return shell(`<div class="mx-auto max-w-5xl px-5 py-8 sm:px-8 lg:py-10"><header><p class="text-xs font-bold tracking-[0.15em] text-[#438b86]">EXAM PRACTICE</p><h1 class="mt-2 text-3xl font-semibold tracking-tight">Typing Test</h1><p class="mt-3 text-sm text-[#6b7976]">বাস্তব পরীক্ষার মতো পরিবেশে আপনার speed ও accuracy যাচাই করুন।</p></header><div class="mt-8 grid gap-5 lg:grid-cols-[1fr_.75fr]"><div class="rounded-2xl border border-[#dfe8e5] bg-white p-6"><h2 class="text-lg font-semibold">আপনার Test বেছে নিন</h2><p class="mt-5 text-xs font-bold tracking-wider text-[#75827f]">সময়</p><div class="mt-3 grid grid-cols-4 gap-2">${[1,2,5,10].map((x,i)=>`<button onclick="selectTestTime(this,${x})" class="test-time rounded-xl border px-3 py-3 text-sm font-semibold ${i===0?"border-[#237b76] bg-[#ecf7f4] text-[#216e69]":"border-[#e0e8e6]"}">${x} মিনিট</button>`).join("")}</div><p class="mt-6 text-xs font-bold tracking-wider text-[#75827f]">কঠিনতা</p><div class="mt-3 grid gap-2 sm:grid-cols-2">${["Beginner","Intermediate","Advanced","Exam Mode"].map((x,i)=>`<button onclick="selectDifficulty(this)" class="difficulty rounded-xl border border-[#e0e8e6] p-3 text-left text-sm font-semibold ${i===0?"border-[#237b76] bg-[#ecf7f4] text-[#216e69]":""}">${x}<span class="mt-1 block text-xs font-normal text-[#71807d]">${i===3?"কোনো hint ছাড়া নির্ধারিত লেখা":"নির্বাচিত স্তরের বাংলা লেখা"}</span></button>`).join("")}</div><div class="mt-7">${button("Test শুরু করুন " + icon("arrow-right"),"startTest()","primary","w-full")}</div></div><div class="rounded-2xl bg-[#163d46] p-6 text-white"><span class="flex h-10 w-10 items-center justify-center rounded-xl bg-white/10">${icon("document-text")}</span><h2 class="mt-7 text-xl font-semibold">Exam Mode</h2><p class="mt-3 text-sm leading-6 text-[#bed3d0]">নির্দিষ্ট সময়, বাংলা অনুচ্ছেদ, live WPM ও error count—অপ্রয়োজনীয় কোনো distraction ছাড়া।</p><ul class="mt-6 space-y-3 text-sm text-[#d4e3e0]"><li class="flex gap-2">${icon("check-circle","text-[#83d1ba]")} বাস্তবসম্মত টাইমার</li><li class="flex gap-2">${icon("check-circle","text-[#83d1ba]")} পেশাদার Result Report</li><li class="flex gap-2">${icon("check-circle","text-[#83d1ba]")} progress-এ সংরক্ষিত ফলাফল</li></ul></div></div></div>`,"test");
    }

    function progressPage() {
      const bars=[35,55,42,73,64,82,76];
      return shell(`<div class="mx-auto max-w-6xl px-5 py-8 sm:px-8 lg:py-10"><header><p class="text-xs font-bold tracking-[0.15em] text-[#438b86]">PERSONAL INSIGHTS</p><h1 class="mt-2 text-3xl font-semibold tracking-tight">আমার Progress</h1><p class="mt-3 text-sm text-[#6b7976]">প্রতিটি অনুশীলন আপনাকে আরও স্বচ্ছন্দ টাইপিস্ট বানাচ্ছে।</p></header><div class="mt-7 grid gap-4 sm:grid-cols-2 xl:grid-cols-4)">${statCard("কোর্স সম্পন্ন",Math.round(state.completed.length/30*100)+"%","chart-2","#2d8573",state.completed.length+" / 30 Lesson")}${statCard("সেরা speed",state.bestWpm+" WPM","bolt","#4779a3","Personal best")}${statCard("গড় accuracy",state.accuracy+"%","target","#8d6d3c","সব Session মিলিয়ে")}${statCard("Practice time",formatTime(state.practiceSeconds),"clock-circle","#87658a","মোট সময়")}</div><div class="mt-7 grid gap-6 lg:grid-cols-2"><div class="rounded-2xl border border-[#e0e8e6] bg-white p-6"><div class="flex justify-between"><div><h2 class="text-lg font-semibold">WPM over time</h2><p class="mt-1 text-xs text-[#788683]">গত ৭ দিনের অনুশীলন</p></div><span class="text-sm font-bold text-[#2c8475]">+2 WPM</span></div><div class="mt-9 flex h-44 items-end justify-between gap-3">${bars.map((b,i)=>`<div class="flex flex-1 flex-col items-center gap-2"><div class="w-full rounded-t-md bg-[#78b7ae]" style="height:${b}%"></div><span class="text-xs text-[#7b8986]">${["সো","মো","ম","বু","বৃ","শু","শ"][i]}</span></div>`).join("")}</div></div><div class="rounded-2xl border border-[#e0e8e6] bg-white p-6"><h2 class="text-lg font-semibold">এই সপ্তাহের Progress</h2><p class="mt-1 text-xs text-[#788683]">৭ দিনের মধ্যে ৪ দিন practice করেছেন</p><div class="mt-8 grid grid-cols-7 gap-2">${[1,1,0,1,0,1,0].map((x,i)=>`<div><div class="h-20 rounded-lg ${x?"bg-[#5a9e94]":"bg-[#edf1f0]"}"></div><p class="mt-2 text-center text-xs text-[#7a8885]">${["সো","মো","ম","বু","বৃ","শু","শ"][i]}</p></div>`).join("")}</div><div class="mt-7 rounded-xl bg-[#edf6f3] p-4 text-sm text-[#276e68]">আপনার longest streak <b>4 দিন</b>। কাল 10 মিনিট practice করলে ধারাবাহিকতা থাকবে।</div></div></div><div class="mt-6 rounded-2xl border border-[#e0e8e6] bg-white p-6"><div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="text-lg font-semibold">যেগুলোতে আরও মনোযোগ প্রয়োজন</h2><p class="mt-1 text-xs text-[#778582]">সাম্প্রতিক ভুলের ভিত্তিতে পরামর্শ</p></div>${button("Targeted Practice","startTargetedPractice()","soft")}</div><div class="mt-5 grid gap-3 sm:grid-cols-4">${[["র","12 বার"],["্","9 বার"],["ত","7 বার"],["ি","6 বার"]].map(x=>`<div class="rounded-xl bg-[#f6f8f8] p-4"><p class="text-xl font-semibold">${x[0]}</p><p class="mt-1 text-xs text-[#768481]">${x[1]} ভুল</p></div>`).join("")}</div></div></div>`,"progress");
    }

    function guidePage() {
      return shell(`<div class="mx-auto max-w-6xl px-5 py-8 sm:px-8 lg:py-10"><header><p class="text-xs font-bold tracking-[0.15em] text-[#438b86]">BIJOY CLASSIC REFERENCE</p><h1 class="mt-2 text-3xl font-semibold tracking-tight">Bijoy Keyboard Guide</h1><p class="mt-3 text-sm text-[#6a7976]">বাংলা অক্ষর লিখতে কোন physical key চাপবেন, দ্রুত খুঁজে নিন।</p></header><div class="mt-7 grid gap-6 xl:grid-cols-[1fr_18rem]"><div class="rounded-2xl border border-[#dee8e5] bg-white p-4 sm:p-6"><label class="relative block"><span class="pointer-events-none absolute left-3 top-3 text-[#6b7a77]">${icon("magnifer")}</span><input id="guideSearch" oninput="guideLookup(this.value)" placeholder="খুঁজুন: ক লিখতে কোন key?" class="w-full rounded-xl border border-[#d8e3e0] py-3 pl-10 pr-4 text-sm outline-none focus:border-[#3e948b] focus:ring-4 focus:ring-[#76b9b0]/15"></label><div id="guideResult" class="mt-5 rounded-xl bg-[#edf6f3] p-5"><p class="text-xs font-bold tracking-wider text-[#478982]">অক্ষর বেছে নিন</p><p class="mt-2 text-sm text-[#5f716d]">নিচের keyboard থেকে একটি বাংলা অক্ষর দেখুন অথবা search করুন।</p></div>${keyboard("")}</div><aside class="rounded-2xl border border-[#e0e8e6] bg-white p-5"><h2 class="text-base font-semibold">বিভাগ</h2><div class="mt-4 space-y-2">${["বাংলা ব্যঞ্জনবর্ণ","স্বরবর্ণ","কার","ফলা","সংখ্যা","Punctuation"].map((x,i)=>`<button onclick="showGuideGroup(${i})" class="guide-group w-full rounded-lg px-3 py-2.5 text-left text-sm ${i===0?"bg-[#edf6f3] font-semibold text-[#287973]":"text-[#657370] hover:bg-[#f5f8f7]"}">${x}</button>`).join("")}</div><div class="mt-7 border-t border-[#edf1f0] pt-5"><p class="text-xs leading-5 text-[#778582]">নোট: এই guide-এ প্রচলিত Bijoy Classic ANSI key mapping দেখানো হয়েছে। আপনার সিস্টেমে Bijoy layout সক্রিয় রাখুন।</p></div></aside></div></div>`,"guide");
    }

    function settingsPage() {
      return shell(`<div class="mx-auto max-w-4xl px-5 py-8 sm:px-8 lg:py-10"><h1 class="text-3xl font-semibold tracking-tight">Settings</h1><p class="mt-2 text-sm text-[#6b7976]">আপনার শেখার অভিজ্ঞতা নিজের মতো সাজিয়ে নিন।</p><div class="mt-8 space-y-4">${settingsBlock("Profile","আরিফ রহমান","আপনার নাম ও শেখার লক্ষ্য")}${settingsBlock("Learning Preferences","প্রতিদিন 15 মিনিট","নিয়মিত practice reminder")}${settingsBlock("Typing Preferences","Keyboard ও next key চালু","WPM, accuracy ও mistakes দেখান")}${settingsBlock("Theme","Light","System অনুযায়ী পরিবর্তন করুন")}${settingsBlock("Keyboard Layout","Bijoy Classic","বর্তমান শেখার layout")}</div><div class="mt-7 rounded-xl border border-[#f1d7d7] bg-[#fffafa] p-5"><h2 class="text-sm font-semibold text-[#973c3c]">Progress Reset</h2><p class="mt-1 text-xs text-[#976565]">এই কাজটি ফিরিয়ে আনা যাবে না।</p><div class="mt-4">${button("Reset Progress","resetProgress()","danger")}</div></div></div>`,"settings");
    }
    function settingsBlock(title,value,desc) { return `<div class="flex items-center justify-between gap-4 rounded-xl border border-[#e0e8e6] bg-white p-5"><div><h2 class="text-sm font-semibold">${title}</h2><p class="mt-1 text-xs text-[#74817f]">${desc}</p></div><button onclick="showToast('সেটিংস সংরক্ষিত হয়েছে।')" class="rounded-lg bg-[#f3f6f5] px-3 py-2 text-xs font-semibold text-[#455856]">${value} ${icon("alt-arrow-down","align-middle")}</button></div>`; }

    function getLesson(n) {
      const level=Math.ceil(n/3)-1, title=levels[level]?.[1][(n-1)%3] || "চূড়ান্ত মূল্যায়ন";
      return {title, desc:n===7?"কার চিহ্ন ব্যবহার করে পরিচিত বাংলা শব্দ ও ছোট বাক্য লিখুন।":"এই Lesson-এ ধাপে ধাপে Bijoy Classic key position আয়ত্ত করুন।"};
    }
    function formatTime(s) { const h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60; return h?`${h}h ${String(m).padStart(2,"0")}m`:`${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`; }

    function navigate(view) {
      clearInterval(practice.interval);
      if(view==="landing") currentView="landing"; else { currentView=view; state.started=true; save(); }
      const views={landing,dashboard,course,practice:practicePage,test:testPage,progress:progressPage,guide:guidePage,settings:settingsPage};
      document.getElementById("app").innerHTML=views[view]();
      window.scrollTo({top:0,behavior:"smooth"});
    }

    function openOnboarding() {
      document.body.insertAdjacentHTML("beforeend", `<div id="onboarding" class="fixed inset-0 z-50 flex items-center justify-center bg-[#122423]/55 p-4"><div class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-2xl sm:p-8"><div class="flex items-center justify-between"><span class="text-xs font-bold tracking-[0.15em] text-[#438a84]">শুরু করা যাক</span><button onclick="document.getElementById('onboarding').remove()" class="text-[#71807d]">${icon("close-circle")}</button></div><div id="onboardingBody" class="mt-7"><h2 class="text-2xl font-semibold tracking-tight">Bijoy বাংলা টাইপিং শিখুন</h2><p class="mt-3 text-sm leading-6 text-[#657572]">একদম শুরু থেকে ধাপে ধাপে শিখে দ্রুত ও নির্ভুল বাংলা টাইপিং আয়ত্ত করুন।</p><div class="mt-7">${button("কোর্স শুরু করুন " + icon("arrow-right"),"onboardStep(2)","primary","w-full")}</div><button onclick="navigate('dashboard');document.getElementById('onboarding').remove()" class="mt-4 w-full text-sm font-semibold text-[#377d77]">আমি আগে থেকেই কিছুটা জানি</button></div></div></div>`);
    }
    function onboardStep(step) {
      const body=document.getElementById("onboardingBody");
      if(step===2) body.innerHTML=`<h2 class="text-2xl font-semibold tracking-tight">আপনার বর্তমান টাইপিং অভিজ্ঞতা কেমন?</h2><div class="mt-6 space-y-3">${["একদম নতুন","অল্প জানি","Bijoy জানি, speed বাড়াতে চাই"].map(x=>`<button onclick="onboardStep(3)" class="w-full rounded-xl border border-[#dce6e3] p-4 text-left text-sm font-semibold hover:border-[#41928a] hover:bg-[#f1faf7]">${x}</button>`).join("")}</div>`;
      else body.innerHTML=`<h2 class="text-2xl font-semibold tracking-tight">প্রতিদিন কত সময় practice করতে চান?</h2><p class="mt-2 text-sm text-[#687774]">আমরা আপনার জন্য একটি সহজ learning path সাজাব।</p><div class="mt-6 grid grid-cols-2 gap-3">${["10 মিনিট","20 মিনিট","30 মিনিট","1 ঘণ্টা"].map(x=>`<button onclick="finishOnboarding('${x}')" class="rounded-xl border border-[#dce6e3] p-4 text-sm font-semibold hover:border-[#41928a] hover:bg-[#f1faf7]">${x}</button>`).join("")}</div>`;
    }
    function finishOnboarding(time) { document.getElementById("onboarding").remove(); state.started=true; save(); navigate("dashboard"); setTimeout(()=>showToast(`${time} daily path তৈরি হয়েছে। শুরু করুন Lesson 01 থেকে।`),300); }

    function startLesson(n) {
      practice={lesson:n,text:lessonTexts[(n-1)%lessonTexts.length],started:false,startTime:null,timer:0,interval:null,mode:"lesson",typed:""};
      navigate("practice");
      setTimeout(()=>document.getElementById("typingInput")?.focus(),150);
    }
    function handleTyping(value) {
      if(!practice.started && value.length) {
        practice.started=true; practice.startTime=Date.now();
        practice.interval=setInterval(()=>{ practice.timer=Math.floor((Date.now()-practice.startTime)/1000); refreshPractice(); },1000);
      }
      practice.typed=value;
      if(value===practice.text) completePractice();
      else refreshPractice();
    }
    function refreshPractice() {
      const root=document.querySelector("main");
      if(root && currentView==="practice") {
        const focused=document.activeElement?.id==="typingInput";
        const pos=document.activeElement?.selectionStart;
        root.innerHTML=practicePage().match(/<main[^>]*>([\s\S]*)<\/main>/)?.[1] || root.innerHTML;
        const input=document.getElementById("typingInput");
        if(input){input.value=practice.typed||""; if(focused){input.focus();input.setSelectionRange(pos,pos);}}
      }
    }
    function restartPractice(){ clearInterval(practice.interval); practice.started=false;practice.timer=0;practice.typed=""; refreshPractice(); document.getElementById("typingInput")?.focus(); }
    function completePractice() {
      clearInterval(practice.interval);
      const text=practice.text, typed=practice.typed||"", correct=[...typed].filter((c,i)=>c===[...text][i]).length;
      const accuracy=typed.length?Math.round(correct/typed.length*100):0;
      const wpm=Math.max(1,Math.round((correct/5)/(Math.max(practice.timer,10)/60)));
      if(!state.completed.includes(practice.lesson)) state.completed.push(practice.lesson);
      if(practice.lesson>=state.currentLesson && practice.lesson<30) state.currentLesson=practice.lesson+1;
      state.bestWpm=Math.max(state.bestWpm,wpm); state.accuracy=Math.round((state.accuracy+accuracy)/2); state.practiceSeconds+=practice.timer;state.chars+=typed.length;
      state.sessions.unshift({name:`Lesson ${String(practice.lesson).padStart(2,"0")} · ${getLesson(practice.lesson).title}`,time:"এইমাত্র",wpm,accuracy}); state.sessions=state.sessions.slice(0,5);save();
      showResult(wpm,accuracy,correct,typed.length-correct,practice.timer);
    }
    function showResult(wpm,acc,correct,wrong,time) {
      document.getElementById("app").innerHTML=shell(`<div class="mx-auto flex min-h-[80vh] max-w-3xl items-center px-5 py-10"><div class="w-full rounded-2xl border border-[#dce8e4] bg-white p-6 text-center shadow-sm sm:p-10"><span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-[#def2e8] text-[#27805f]">${icon("check-circle","text-3xl")}</span><p class="mt-5 text-sm font-semibold text-[#39837a]">LESSON COMPLETE</p><h1 class="mt-2 text-3xl font-semibold tracking-tight">Lesson Complete 🎉</h1><p class="mt-3 text-sm text-[#687774]">ভালো করেছেন। নিয়মিত practice আপনার টাইপিংকে আরও স্বচ্ছন্দ করবে।</p><div class="mt-8 grid grid-cols-2 gap-3 sm:grid-cols-4">${[["Accuracy",acc+"%"],["Speed",wpm+" WPM"],["Correct",correct],["Mistakes",wrong]].map(x=>`<div class="rounded-xl bg-[#f4f8f7] p-4"><p class="text-2xl font-semibold">${x[1]}</p><p class="mt-1 text-xs text-[#71807d]">${x[0]}</p></div>`).join("")}</div><div class="mt-7 rounded-xl border border-[#e4ebe9] p-5 text-left"><p class="text-sm font-semibold">যেগুলোতে ভুল হয়েছে</p><p class="mt-2 text-xs leading-5 text-[#6f7d7a]">র, ্ এবং ি-কার নিয়ে আরও 5 মিনিট অনুশীলন করলে accuracy আরও ভালো হবে।</p></div><div class="mt-7 flex flex-wrap justify-center gap-3">${button("Practice Again","startLesson("+practice.lesson+")","secondary")}${button(practice.lesson<30?"Next Lesson "+icon("arrow-right"):"কোর্সে ফিরুন",practice.lesson<30?"startLesson("+(practice.lesson+1)+")":"navigate('course')")}</div></div></div>`,"course");
    }

    function startTargetedPractice(){practice={lesson:state.currentLesson,text:"কর করতে কার বাংলার প্রকার",started:false,timer:0,typed:""};navigate("practice");}
    function selectTestTime(el){document.querySelectorAll(".test-time").forEach(x=>x.className=x.className.replace("border-[#237b76] bg-[#ecf7f4] text-[#216e69]","border-[#e0e8e6]"));el.className+=" border-[#237b76] bg-[#ecf7f4] text-[#216e69]";}
    function selectDifficulty(el){document.querySelectorAll(".difficulty").forEach(x=>x.className=x.className.replace("border-[#237b76] bg-[#ecf7f4] text-[#216e69]","border-[#e0e8e6]"));el.className+=" border-[#237b76] bg-[#ecf7f4] text-[#216e69]";}
    function startTest(){practice={lesson:30,text:"বাংলা ভাষা আমাদের পরিচয়ের একটি গুরুত্বপূর্ণ অংশ। নিয়মিত অনুশীলন ও মনোযোগী চর্চা যেকোনো দক্ষতা উন্নত করতে পারে।",started:false,timer:0,typed:"",mode:"test"};navigate("practice");showToast("Exam practice শুরু হয়েছে।")}
    function guideLookup(value) { const char=[...value].find(c=>bijoyMap[c]);const r=document.getElementById("guideResult");if(char){const key=bijoyMap[char];r.innerHTML=`<p class="text-xs font-bold tracking-wider text-[#478982]">BIJOY CLASSIC MAPPING</p><div class="mt-3 flex items-center gap-4"><span class="flex h-12 w-12 items-center justify-center rounded-xl bg-white text-2xl font-semibold text-[#183f43]">${char}</span><div><p class="text-sm font-semibold">Typing key: ${key}</p><p class="mt-1 text-xs text-[#667976]">${key.includes("Shift")?"Shift চেপে ধরে key চাপুন।":"সরাসরি এই physical key চাপুন।"}</p></div></div>`;} }
    function showGuideGroup(i){document.querySelectorAll(".guide-group").forEach((x,n)=>x.className="guide-group w-full rounded-lg px-3 py-2.5 text-left text-sm "+(n===i?"bg-[#edf6f3] font-semibold text-[#287973]":"text-[#657370] hover:bg-[#f5f8f7]"));showToast(["ব্যঞ্জনবর্ণ key map দেখুন।","স্বরবর্ণের reference শিগগিরই যুক্ত হবে।","কার চিহ্ন: া = f, ি = d, ু = s","ফলা ও যুক্তবর্ণ Lesson 14 থেকে।","সংখ্যা row keyboard-এ দেখুন।","দাঁড়ি (।) = ,"][i]);}
    function resetProgress(){if(confirm("আপনি কি সত্যিই সব progress reset করতে চান?")){localStorage.removeItem("akkhorPathState");location.reload();}}
    function showToast(message){const t=document.getElementById("toast");if(!t)return;t.textContent=message;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),3200);}

    navigate(state.started ? "dashboard" : "landing");
  </script>
</body>
</html>
