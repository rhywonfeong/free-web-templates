<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Album Cover Booth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=IBM+Plex+Serif:wght@700&family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .album-bg {
      background: linear-gradient(135deg, #ff6bcb 0%, #a18aff 45%, #43e97b 100%);
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    .album-bg .shape1,
    .album-bg .shape2,
    .album-bg .shape3 {
      position: absolute;
      opacity: 0.22;
      pointer-events: none;
      filter: blur(1.5px);
    }
    .album-bg .shape1 {
      width: 160px; height: 160px; background: #fff;
      border-radius: 40% 60% 70% 30%/30% 30% 70% 70%;
      top: -30px; left: -30px; transform: rotate(18deg);
    }
    .album-bg .shape2 {
      width: 180px; height: 120px; background: #2dd4bf;
      border-radius: 60% 40% 50% 50%/60% 60% 40% 40%;
      bottom: -40px; right: -50px; transform: rotate(-21deg);
    }
    .album-bg .shape3 {
      width: 90px; height: 80px; background: #f59e42;
      border-radius: 70% 30% 60% 40%/50% 60% 40% 60%;
      top: 60px; right: 30px; transform: rotate(30deg);
    }
    /* Curved label text */
    .curve-text {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      width: 68%;
      text-align: center;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.12em;
      color: #e3d8fc;
      font-weight: 600;
      opacity: 0.75;
      text-shadow: 0 1px 5px #0008, 0 0 1px #fff9;
      pointer-events: none;
      z-index: 40;
      /* SVG curve effect using CSS mask */
      /* Not a true curve, but visually mimics one */
    }
    /* Artist name: big, angled, neon glow */
    .artist-name {
      position: absolute;
      top: 36px;
      left: 20px;
      font-family: 'Montserrat', 'Inter', sans-serif;
      font-size: 2.65rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      text-shadow: 0 3px 24px #a18affbb, 0 1px 4px #000a, 0 0 1px #fff;
      transform: rotate(-10deg) skewY(-6deg);
      filter: brightness(1.25);
      line-height: 1;
      z-index: 30;
      padding: 0.1em 0.25em;
      background: linear-gradient(90deg, #fff 55%, #f472b6 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* Album title: serif, bottom, with shadow */
    .album-title {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%) rotate(2deg);
      font-family: 'IBM Plex Serif', serif;
      font-size: 1.75rem;
      font-weight: 700;
      color: #fffbe9;
      letter-spacing: 0.03em;
      text-shadow: 0 2px 18px #a18affcc, 0 1px 5px #000a, 0 0 2px #fff9;
      background: rgba(230,30,110,0.15);
      border-radius: 0.5em;
      padding: 0.1em 1em 0.11em 1em;
      z-index: 30;
      white-space: nowrap;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-pink-200 via-purple-200 to-blue-200 min-h-screen flex flex-col items-center justify-center">

  <!-- Step 1: Enter Name -->
  <div id="step1" class="bg-white rounded-xl shadow-xl p-8 w-full max-w-md flex flex-col items-center space-y-6">
    <h1 class="text-3xl font-extrabold text-pink-700 text-center">Music Album Cover Booth</h1>
    <p class="text-gray-700 text-lg text-center">Enter your artist name to get started:</p>
    <input id="nameInput" type="text" placeholder="Your artist name..." class="w-full px-4 py-2 rounded-md border-2 border-pink-300 focus:border-pink-500 outline-none text-xl" />
    <button onclick="showPrompt()" class="bg-pink-600 text-white px-6 py-2 rounded-full font-bold hover:bg-pink-800 transition">Next</button>
  </div>

  <!-- Step 2: Strike a Pose -->
  <div id="step2" class="hidden bg-white rounded-xl shadow-xl p-8 w-full max-w-md flex flex-col items-center space-y-5">
    <h2 class="text-2xl font-bold text-purple-700">Strike a Pose!</h2>
    <div class="bg-pink-100 border-2 border-pink-400 px-4 py-2 rounded-lg text-lg text-center font-medium">
      <span id="posePrompt">Make your most iconic pop star face!</span>
    </div>
    <div class="w-64 h-64 rounded-2xl bg-gray-200 border-4 border-pink-300 flex items-center justify-center relative overflow-hidden">
      <video id="webcam" autoplay playsinline class="absolute w-full h-full object-cover hidden rounded-2xl"></video>
      <img id="placeholder" src="https://www.svgrepo.com/show/384674/account-avatar-profile-user-11.svg" alt="Camera preview" class="w-28 h-28 opacity-40" />
      <div class="absolute bottom-1 right-1 bg-white/80 text-xs text-pink-700 px-2 py-0.5 rounded">Live Preview</div>
    </div>
    <div class="flex gap-3">
      <button onclick="showAlbum()" class="bg-purple-600 text-white px-6 py-2 rounded-full font-bold hover:bg-purple-800 transition">Snap Album Cover!</button>
      <button onclick="restartWebcam()" class="bg-gray-200 border border-purple-300 text-purple-700 px-4 py-2 rounded-full font-semibold hover:bg-purple-100">Retake Photo</button>
    </div>
  </div>

  <!-- Step 3: Album Cover Result -->
  <div id="step3" class="hidden flex flex-col items-center space-y-8">
    <h2 class="text-2xl font-extrabold text-blue-700 mb-2">Your Music Album Cover</h2>
    <div class="relative w-96 h-96 rounded-2xl overflow-hidden shadow-2xl flex items-center justify-center">
      <!-- Album style background -->
      <div class="album-bg">
        <div class="shape1"></div>
        <div class="shape2"></div>
        <div class="shape3"></div>
      </div>
      <!-- Artist Name: big, creative placement -->
      <div id="albumName" class="artist-name"></div>
      <!-- Album Title: creative font and placement -->
      <div class="album-title">"They Call Me Bossy"</div>
      <!-- User photo, large and centered, with neon glow -->
      <div class="absolute inset-0 flex items-center justify-center z-10">
        <img id="albumPhoto" src="https://www.svgrepo.com/show/384674/account-avatar-profile-user-11.svg" alt="Your photo" 
             class="w-72 h-72 rounded-full object-cover border-8 border-white shadow-2xl ring-4 ring-pink-400 ring-offset-4 ring-offset-transparent" 
             style="box-shadow: 0 0 60px 0 #a18aff88, 0 0 8px #fff;" />
      </div>
      <!-- Curved label text at bottom -->
      <div class="curve-text">Y2K Records &bull; 2024</div>
      <!-- Parental Advisory (optional) -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2b/Parental_Advisory_label.svg" alt="Parental Advisory" class="absolute bottom-4 right-4 w-14 opacity-80 z-20"/>
    </div>
    <button onclick="restart()" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded-full font-bold hover:bg-blue-800 transition">Make Another!</button>
  </div>

  <script>
    let webcamStream = null;

    function showPrompt() {
      const name = document.getElementById('nameInput').value.trim();
      if (name === "") {
        alert("Please enter your artist name!");
        return;
      }
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
      startWebcam();
      document.getElementById('albumName').textContent = name;
    }

    function startWebcam() {
      const webcam = document.getElementById('webcam');
      const placeholder = document.getElementById('placeholder');
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
          .then(function (stream) {
            webcamStream = stream;
            webcam.srcObject = stream;
            webcam.classList.remove('hidden');
            placeholder.classList.add('hidden');
          })
          .catch(function () {
            webcam.classList.add('hidden');
            placeholder.classList.remove('hidden');
          });
      } else {
        webcam.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }
    }

    function showAlbum() {
      const webcam = document.getElementById('webcam');
      let dataUrl = "https://www.svgrepo.com/show/384674/account-avatar-profile-user-11.svg";
      if (!webcam.classList.contains('hidden') && webcam.videoWidth > 0 && webcam.videoHeight > 0) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        // Cover mode: center crop
        let ratio = Math.max(canvas.width / webcam.videoWidth, canvas.height / webcam.videoHeight);
        let nw = webcam.videoWidth * ratio;
        let nh = webcam.videoHeight * ratio;
        let nx = (canvas.width - nw) / 2;
        let ny = (canvas.height - nh) / 2;
        ctx.drawImage(webcam, nx, ny, nw, nh);
        dataUrl = canvas.toDataURL('image/png');
        if (webcamStream) {
          webcamStream.getTracks().forEach(track => track.stop());
          webcamStream = null;
        }
      }
      document.getElementById('albumPhoto').src = dataUrl;
      document.getElementById('step2').classList.add('hidden');
      document.getElementById('step3').classList.remove('hidden');
    }

    function restartWebcam() {
      if (webcamStream) {
        webcamStream.getTracks().forEach(track => track.stop());
        webcamStream = null;
      }
      startWebcam();
    }

    function restart() {
      if (webcamStream) {
        webcamStream.getTracks().forEach(track => track.stop());
        webcamStream = null;
      }
      document.getElementById('albumPhoto').src = "https://www.svgrepo.com/show/384674/account-avatar-profile-user-11.svg";
      document.getElementById('nameInput').value = '';
      document.getElementById('step3').classList.add('hidden');
      document.getElementById('step1').classList.remove('hidden');
    }
  </script>
</body>
</html>
