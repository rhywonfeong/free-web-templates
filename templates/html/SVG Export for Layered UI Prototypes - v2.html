<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  version="1.1"
  width="800"
  height="600"
  viewBox="0 0 800 600">

  <title>Design Prototype by Duc Huynh</title>

  <!-- Artboard Layer -->
  <g id="Artboard" inkscape:label="Artboard">
    <rect x="0" y="0" width="800" height="600" fill="#F6F6FA"/>
  </g>

  <!-- Header Layer -->
  <g id="Header" inkscape:label="Header">
    <rect x="0" y="0" width="800" height="80" fill="#254081"/>

    <!-- Logo Component -->
    <g id="Logo" inkscape:label="Logo">
      <circle cx="48" cy="40" r="30" fill="#fff"/>
      <text x="48" y="50" 
            text-anchor="middle"
            font-family="Poppins, Arial, sans-serif"
            font-size="28"
            font-weight="bold"
            fill="#254081">
        DH
      </text>
    </g>

    <!-- Navigation -->
    <g id="Navigation" inkscape:label="Navigation">
      <text x="140" y="48" 
            font-family="Poppins, Arial, sans-serif"
            font-size="20"
            fill="#fff"
            style="letter-spacing:0.03em;">
        Home
      </text>
      <text x="210" y="48" 
            font-family="Poppins, Arial, sans-serif"
            font-size="20"
            fill="#fff">
        Features
      </text>
      <text x="320" y="48" 
            font-family="Poppins, Arial, sans-serif"
            font-size="20"
            fill="#fff">
        Contact
      </text>
    </g>
  </g>

  <!-- Main Content Layer -->
  <g id="MainContent" inkscape:label="Main Content">
    <rect x="50" y="120" width="700" height="430" rx="24" fill="#fff" />

    <!-- Title Component -->
    <text x="90" y="170"
          font-family="Poppins, Arial, sans-serif"
          font-size="32"
          font-weight="600"
          fill="#254081">
      Welcome to the Prototype!
    </text>

    <!-- Paragraph Component -->
    <text x="90" y="215"
          font-family="Poppins, Arial, sans-serif"
          font-size="18"
          font-weight="400"
          fill="#333">
      This SVG demonstrates layer structure, vector elements, text metadata, and an embedded image.
    </text>

    <!-- Button Component -->
    <g id="PrimaryButton" inkscape:label="Button">
      <rect x="90" y="260" width="180" height="50" rx="12" fill="#254081"/>
      <text x="180" y="293"
            text-anchor="middle"
            font-family="Poppins, Arial, sans-serif"
            font-size="22"
            font-weight="600"
            fill="#fff">
        Get Started
      </text>
    </g>

    <!-- Vector Icon Component -->
    <g id="IconStar" inkscape:label="Star Icon">
      <polygon points="370,290 380,310 403,313 386,328 392,350 370,338 348,350 354,328 337,313 360,310"
               fill="#FFBE3B" stroke="#F7B100" stroke-width="1"/>
    </g>

    <!-- Embedded Raster Image (Sample 32x32 smiley) -->
    <g id="ImageSample" inkscape:label="Sample Image">
      <image
        xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABM0lEQVR4nO2VUQqDMBBFf8IeOCdUFqFQg/VWhCcQGlDFZcxyRU2KRw2SzgznmksNkO7Wy5QtsaLC+e25E/xDE5rFs5AEM+6IvBK8J2B8066vgQfLw6Lp0u74GQhiBNh7wIXKP514NNWkJfR3TIQxWIKIHnHFQ/gr3P/G9I1MBBL6ivAL80v0AZvKja3oFeKrbjX0KwOK4MqUOqrABRlxDGyd0Tu2TS4P4eQPtRAg6tSoBVvB5fb1CdqiWxCC62rL3mNd5MsAHzvQakwtc5ZDtWgBf3CZHPeZNBwLUW4nWEjicfFY5E5yHgxN7l3XUHuZgAAAABJRU5ErkJggg=="
        x="550" y="180" width="64" height="64"
        preserveAspectRatio="xMidYMid" />
      <text x="550" y="260"
            font-family="Poppins, Arial, sans-serif"
            font-size="14"
            fill="#888">
        (Embedded PNG)
      </text>
    </g>
  </g>
</svg>
