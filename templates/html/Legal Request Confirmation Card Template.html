body {

/* Card Entry Animation */
@keyframes slideUpFade {
0% {
opacity: 0;
transform: translateY(10px) scale(0.98);
}
100% {
opacity: 1;
transform: translateY(0) scale(1);
}
}
/* Checkmark Scale/Bounce */
@keyframes popCheck {
0% { transform: scale(0); opacity: 0; }
50% { transform: scale(1.2); }
100% { transform: scale(1); opacity: 1; }
}
/* Looping Ripple for "Active" feel */
@keyframes softPulse {
0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.1); }
70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}
/* Text Stagger */
@keyframes fadeUp {
from { opacity: 0; transform: translateY(5px); }
to { opacity: 1; transform: translateY(0); }
}
.animate-card { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
.animate-icon-pop { animation: popCheck 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards opacity-0; }
.animate-pulse-loop { animation: softPulse 3s infinite ease-in-out; }
.delay-100 { animation-delay: 0.3s; }
.delay-200 { animation-delay: 0.4s; }
.delay-300 { animation-delay: 0.5s; }
.animate-text { animation: fadeUp 0.8s ease-out forwards; opacity: 0; }
/* Custom thin borders for that clean look */
