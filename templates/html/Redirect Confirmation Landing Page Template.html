<!DOCTYPE html>

<body class="bg-zinc-50 flex items-center justify-center min-h-screen font-['Inter',sans-serif] antialiased text-zinc-900 p-6 selection:bg-zinc-200">
    
    <main class="relative w-full max-w-sm bg-white border border-zinc-200/80 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden flex flex-col items-center text-center p-8">
        <!-- Progress Bar Indicator -->
        <div class="absolute top-0 left-0 h-1 w-full bg-zinc-100">
            <div class="h-full bg-zinc-900 w-full rounded-r-full" style="animation: load 5s linear forwards;"></div>
        </div>

        <!-- Logo -->
        <div class="text-base font-semibold tracking-tighter text-zinc-900 mb-8 uppercase">
            Formule
        </div>

        <!-- Animated Icon -->
        <div class="relative flex items-center justify-center w-16 h-16 mb-6 rounded-full bg-zinc-50 border border-zinc-100 shadow-sm">
            <iconify-icon icon="solar:refresh-linear" class="text-2xl text-zinc-600 animate-spin" style="stroke-width: 1.5;"></iconify-icon>
        </div>

        <!-- Text Content -->
        <div class="space-y-3 mb-8 w-full">
            <h1 class="text-2xl font-semibold tracking-tight text-zinc-900">
                Redirection
            </h1>
            <p class="text-sm text-zinc-500 leading-relaxed">
                Vous allez être redirigé vers <br>
                <span class="font-medium text-zinc-800">formule-confirmation.com</span>
            </p>
        </div>

        <!-- Fallback Action -->
        <a href="https://formule-confirmation.com/" class="group relative inline-flex items-center justify-center gap-2 w-full px-4 py-2.5 text-sm font-medium text-white bg-zinc-900 hover:bg-zinc-800 rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-zinc-900 focus:ring-offset-2">
            Continuer manuellement
            <iconify-icon icon="solar:arrow-right-linear" class="text-lg transition-transform group-hover:translate-x-0.5" style="stroke-width: 1.5;"></iconify-icon>
        </a>
    </main>

    <style>
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>

</html>
