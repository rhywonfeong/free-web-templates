<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprunki - Your Bouncy Friend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for eye movement with bigger eyes - no outline */
        .eye-container {
            position: relative;
            width: 1.5rem;
            height: 1.5rem;
            background-color: white;
            border-radius: 50%;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        
        .pupil {
            position: absolute;
            width: 0.9rem;
            height: 0.9rem;
            background-color: black;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s ease;
        }
        
        /* Removed the eye-shine class */
        
        /* Blinking animation */
        @keyframes blink {
            0% { height: 1.5rem; }
            45% { height: 1.5rem; }
            50% { height: 0.1rem; }
            55% { height: 0.1rem; }
            60% { height: 1.5rem; }
            100% { height: 1.5rem; }
        }
        
        .blinking {
            animation: blink 3s infinite;
        }
    </style>
</head>
<body class="bg-purple-100 min-h-screen flex flex-col items-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6 mt-10">
        <h1 class="text-3xl font-bold text-center text-purple-600 mb-4">Meet Sprunki!</h1>
        <p class="text-center text-gray-600 mb-6">Your bouncy friend from Bouncetopia</p>
        
        <div class="flex justify-center mb-8">
            <div id="sprunki-container" class="relative w-40 h-40">
                <div id="sprunki" class="absolute w-32 h-32 bg-green-400 rounded-full flex items-center justify-center transition-all duration-300 ease-in-out" style="bottom: 0px;">
                    <div class="w-20 h-20 bg-green-200 rounded-full flex items-center justify-center">
                        <div class="flex flex-col items-center">
                            <div class="flex space-x-2">
                                <div id="left-eye" class="eye-container blinking">
                                    <div id="left-pupil" class="pupil"></div>
                                    <!-- Removed eye shine -->
                                </div>
                                <div id="right-eye" class="eye-container blinking" style="animation-delay: 0.1s">
                                    <div id="right-pupil" class="pupil"></div>
                                    <!-- Removed eye shine -->
                                </div>
                            </div>
                            <div class="w-7 h-3 bg-red-400 rounded-full mt-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="text-center mb-6">
            <p id="happiness" class="text-lg font-medium text-purple-500">Happiness: 50%</p>
            <div class="w-full bg-gray-200 rounded-full h-4 mt-2">
                <div id="happiness-bar" class="bg-purple-500 h-4 rounded-full" style="width: 50%"></div>
            </div>
        </div>
        
        <div class="flex justify-center space-x-4 mb-8">
            <button id="bounce-btn" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">Bounce!</button>
            <button id="feed-btn" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition">Feed</button>
            <button id="pet-btn" class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition">Pet</button>
        </div>
        
        <div id="food-options" class="hidden grid grid-cols-2 gap-2 mb-6">
            <button class="food-item p-2 bg-yellow-100 rounded-lg hover:bg-yellow-200 transition flex items-center justify-center">
                <span>Bouncy Ball 🏀</span>
            </button>
            <button class="food-item p-2 bg-pink-100 rounded-lg hover:bg-pink-200 transition flex items-center justify-center">
                <span>Spring Roll 🌀</span>
            </button>
            <button class="food-item p-2 bg-blue-100 rounded-lg hover:bg-blue-200 transition flex items-center justify-center">
                <span>Trampoline Cake 🍰</span>
            </button>
            <button class="food-item p-2 bg-green-100 rounded-lg hover:bg-green-200 transition flex items-center justify-center">
                <span>Boing Berry 🫐</span>
            </button>
        </div>
        
        <div id="message" class="text-center text-gray-700 italic"></div>
    </div>
    
    <script>
        let happiness = 50;
        let isBouncing = false;
        
        const sprunki = document.getElementById('sprunki');
        const leftEye = document.getElementById('left-eye');
        const rightEye = document.getElementById('right-eye');
        const leftPupil = document.getElementById('left-pupil');
        const rightPupil = document.getElementById('right-pupil');
        const happinessDisplay = document.getElementById('happiness');
        const happinessBar = document.getElementById('happiness-bar');
        const messageDisplay = document.getElementById('message');
        const foodOptions = document.getElementById('food-options');
        
        // Eye tracking for mouse movement
        document.addEventListener('mousemove', (e) => {
            moveEyes(e);
        });
        
        function moveEyes(e) {
            const sprunkiRect = sprunki.getBoundingClientRect();
            const sprunkiCenterX = sprunkiRect.left + sprunkiRect.width / 2;
            const sprunkiCenterY = sprunkiRect.top + sprunkiRect.height / 2;
            
            // Calculate angle between mouse and Sprunki
            const angle = Math.atan2(e.clientY - sprunkiCenterY, e.clientX - sprunkiCenterX);
            
            // Calculate distance for pupil movement (limited to keep pupils inside eyes)
            const maxDistance = 3; // max pixels to move (slightly more for bigger eyes)
            const distanceX = Math.cos(angle) * maxDistance;
            const distanceY = Math.sin(angle) * maxDistance;
            
            // Apply movement to pupils
            leftPupil.style.transform = `translate(calc(-50% + ${distanceX}px), calc(-50% + ${distanceY}px))`;
            rightPupil.style.transform = `translate(calc(-50% + ${distanceX}px), calc(-50% + ${distanceY}px))`;
        }
        
        document.getElementById('bounce-btn').addEventListener('click', () => {
            if (!isBouncing) {
                bounce();
                updateHappiness(5);
                showMessage("Wheee! Sprunki loves bouncing!");
            }
        });
        
        document.getElementById('feed-btn').addEventListener('click', () => {
            foodOptions.classList.toggle('hidden');
        });
        
        document.getElementById('pet-btn').addEventListener('click', () => {
            updateHappiness(3);
            showMessage("Sprunki feels loved!");
            wiggle();
        });
        
        document.querySelectorAll('.food-item').forEach(item => {
            item.addEventListener('click', () => {
                const foodName = item.textContent.trim();
                updateHappiness(10);
                showMessage(`Yum! Sprunki loves ${foodName}!`);
                foodOptions.classList.add('hidden');
                grow();
            });
        });
        
        function updateHappiness(change) {
            happiness = Math.min(Math.max(happiness + change, 0), 100);
            happinessDisplay.textContent = `Happiness: ${happiness}%`;
            happinessBar.style.width = `${happiness}%`;
            
            // Change color based on happiness
            if (happiness > 70) {
                sprunki.classList.remove('bg-red-400', 'bg-yellow-400');
                sprunki.classList.add('bg-green-400');
            } else if (happiness > 30) {
                sprunki.classList.remove('bg-red-400', 'bg-green-400');
                sprunki.classList.add('bg-yellow-400');
            } else {
                sprunki.classList.remove('bg-yellow-400', 'bg-green-400');
                sprunki.classList.add('bg-red-400');
            }
        }
        
        function bounce() {
            isBouncing = true;
            let bounceCount = 0;
            const maxBounces = 5;
            
            function singleBounce() {
                sprunki.style.bottom = '40px';
                setTimeout(() => {
                    sprunki.style.bottom = '0px';
                    bounceCount++;
                    
                    if (bounceCount < maxBounces) {
                        setTimeout(singleBounce, 300);
                    } else {
                        isBouncing = false;
                    }
                }, 300);
            }
            
            singleBounce();
        }
        
        function wiggle() {
            sprunki.style.transform = 'rotate(15deg)';
            setTimeout(() => {
                sprunki.style.transform = 'rotate(-15deg)';
                setTimeout(() => {
                    sprunki.style.transform = 'rotate(0)';
                }, 150);
            }, 150);
        }
        
        function grow() {
            sprunki.classList.add('scale-110');
            setTimeout(() => {
                sprunki.classList.remove('scale-110');
            }, 500);
        }
        
        function showMessage(text) {
            messageDisplay.textContent = text;
            setTimeout(() => {
                messageDisplay.textContent = '';
            }, 3000);
        }
        
        // Auto decrease happiness over time
        setInterval(() => {
            updateHappiness(-1);
            if (happiness < 20) {
                showMessage("Sprunki looks sad. Try feeding or playing with him!");
            }
        }, 10000);
    </script>
</body>
</html>
