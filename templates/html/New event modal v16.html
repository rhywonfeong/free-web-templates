<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Event Modal - Clean White</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-950 to-slate-900 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md rounded-[2.5rem] bg-white shadow-xl border border-slate-200 flex flex-col overflow-hidden">
    <form class="flex-1 flex flex-col p-8 pb-7">
      <!-- Header -->
      <div class="flex items-center justify-between mb-4">
        <span class="font-bold text-2xl text-slate-900 select-none">Create Event</span>
        <button type="button" class="p-2 rounded-full hover:bg-slate-100 transition">
          <svg width="26" height="26" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l14 14M20 6l-14 14"/></svg>
        </button>
      </div>
      <!-- Event type selector -->
      <div class="flex gap-3 mb-7 mt-1">
        <button type="button" class="group flex items-center px-3.5 py-1.5 rounded-full border-2 border-cyan-400 bg-cyan-50 text-cyan-700 font-medium text-sm shadow-sm hover:bg-cyan-100 focus:outline-none focus:ring-2 focus:ring-cyan-300">
          <span class="w-2.5 h-2.5 rounded-full mr-2 bg-cyan-400"></span>Meeting
        </button>
        <button type="button" class="group flex items-center px-3.5 py-1.5 rounded-full border-2 border-fuchsia-300 bg-fuchsia-50 text-fuchsia-600 font-medium text-sm shadow-sm hover:bg-fuchsia-100">
          <span class="w-2.5 h-2.5 rounded-full mr-2 bg-fuchsia-300"></span>Personal
        </button>
        <button type="button" class="group flex items-center px-3.5 py-1.5 rounded-full border-2 border-violet-300 bg-violet-50 text-violet-600 font-medium text-sm shadow-sm hover:bg-violet-100">
          <span class="w-2.5 h-2.5 rounded-full mr-2 bg-violet-300"></span>Reminder
        </button>
      </div>
      <!-- Fields -->
      <div class="flex flex-col gap-5">
        <input class="w-full rounded-xl border border-slate-200 bg-slate-100 placeholder-slate-400 text-slate-900 py-3 px-5 text-lg font-semibold shadow-sm focus:outline-none focus:ring-2 focus:ring-cyan-200" placeholder="Title" />
        <div class="flex gap-3">
          <input type="date" class="rounded-xl border border-slate-200 bg-slate-100 text-slate-900 py-3 px-4 flex-1 font-medium focus:ring-2 focus:ring-cyan-200" style="color-scheme:light">
          <input type="time" class="rounded-xl border border-slate-200 bg-slate-100 text-slate-900 py-3 px-4 w-[110px] font-medium focus:ring-2 focus:ring-cyan-200" style="color-scheme:light">
        </div>
        <input class="w-full rounded-xl border border-slate-200 bg-slate-100 placeholder-slate-400 text-slate-900 py-3 px-5 font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-100" placeholder="Location" />
        <textarea rows="2" class="w-full rounded-xl border border-slate-200 bg-slate-100 placeholder-slate-400 text-slate-900 py-3 px-5 font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-50 resize-none" placeholder="Add notes..."></textarea>
      </div>
      <!-- Toggles and Invite -->
      <div class="flex items-center gap-3 mt-7 mb-3">
        <label class="flex items-center text-cyan-600 font-medium space-x-2 cursor-pointer">
          <input type="checkbox" class="accent-cyan-500 w-5 h-5 rounded focus:ring-cyan-400 transition" />
          <span class="text-slate-600 text-base">All day</span>
        </label>
        <div class="flex-1"></div>
        <button type="button" class="flex items-center px-3 py-1.5 rounded-lg bg-violet-100 text-violet-600 font-semibold text-sm hover:bg-violet-200">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" class="mr-2"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Invite
        </button>
      </div>
      <div class="h-px bg-slate-200 mb-4"></div>
      <div class="flex gap-2">
        <button type="submit" class="flex-1 bg-cyan-500 hover:bg-cyan-600 text-white font-semibold py-3 rounded-xl text-lg shadow transition">Save</button>
        <button type="button" class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 rounded-xl text-lg shadow transition">Cancel</button>
      </div>
    </form>
  </div>
</body>
</html>
