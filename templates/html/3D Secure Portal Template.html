<!DOCTYPE html>
<html lang="en" class="antialiased">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Handshake Vault - Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #000;
color: #fff;
}
/* 3D Space Container */
.vault-space {
perspective: 1000px;
transform-style: preserve-3d;
}
/* Floating Animations */
.login-card {
animation: float 6s ease-in-out infinite;
transform: translateZ(50px);
}
.bg-element {
animation: float-slow 12s ease-in-out infinite;
}
@keyframes float {
0%, 100% { transform: translateY(0) translateZ(50px); }
50% { transform: translateY(-10px) translateZ(50px); }
}
@keyframes float-slow {
0%, 100% { transform: translateY(0) rotateX(var(--rx)) rotateY(var(--ry)) translateZ(var(--tz)); }
50% { transform: translateY(-15px) rotateX(calc(var(--rx) + 2deg)) rotateY(calc(var(--ry) - 2deg)) translateZ(var(--tz)); }
}
/* Subtle grid background */
.bg-grid {
background-size: 40px 40px;
background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
-webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
}
/* Custom Checkbox */
.custom-checkbox input:checked + div {
background-color: #fff;
border-color: #fff;
}
.custom-checkbox input:checked + div iconify-icon {
opacity: 1;
}
/* Shake Error Animation */
@keyframes shake {
0%, 100% { transform: translateX(0); }
20%, 60% { transform: translateX(-4px); }
40%, 80% { transform: translateX(4px); }
}
.shake {
animation: shake 0.4s ease-in-out;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="h-screen w-screen overflow-hidden selection:bg-zinc-800 selection:text-white flex flex-col relative">

    <!-- Ambient Background Lighting & Video -->
    <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover -z-30 opacity-25 mix-blend-screen pointer-events-none">
        <source src="https://assets.codepen.io/3364143/7btrrd.mp4" type="video/mp4">
    </video>
    <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_40%,_rgba(39,39,42,0.3)_0%,_#000000_80%)] -z-20 pointer-events-none"></div>
    <div class="absolute inset-0 bg-grid -z-10 pointer-events-none"></div>

    <!-- Top HUD (Minimal Navbar) -->
    <header class="h-16 z-50 flex items-center justify-between px-6 shrink-0 relative w-full">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 rounded bg-white flex items-center justify-center">
                <iconify-icon icon="solar:box-minimalistic-linear" class="text-black text-sm" stroke-width="1.5"></iconify-icon>
            </div>
            <span class="tracking-tight text-sm font-medium">HS_VAULT</span>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-xs text-zinc-500 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_5px_rgba(16,185,129,0.5)]"></span>
                System Secure
            </span>
        </div>
    </header>

    <!-- Main 3D Portal Area -->
    <main class="flex-1 w-full h-full flex items-center justify-center relative vault-space overflow-hidden">
        
        <!-- Background 3D Elements (Left) -->
        <div class="absolute left-1/2 top-1/2 -ml-[380px] -mt-[180px] w-64 h-80 bg-zinc-900/20 backdrop-blur-sm border border-white/[0.03] rounded-3xl bg-element z-0 pointer-events-none flex items-center justify-center overflow-hidden" style="--rx: 15deg; --ry: 25deg; --tz: -200px;">
            <div class="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent opacity-50"></div>
            <svg width="120" height="120" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="0.5" class="text-white/20 animate-[spin_40s_linear_infinite]">
                <circle cx="50" cy="50" r="40" stroke-dasharray="2 4"/>
                <circle cx="50" cy="50" r="30" stroke-dasharray="1 6"/>
                <rect x="35" y="35" width="30" height="30" transform="rotate(45 50 50)"/>
            </svg>
        </div>

        <!-- Background 3D Elements (Right) -->
        <div class="absolute left-1/2 top-1/2 ml-[140px] -mt-[220px] w-72 h-96 bg-indigo-500/[0.02] backdrop-blur-sm border border-white/[0.03] rounded-3xl bg-element z-0 pointer-events-none" style="--rx: -10deg; --ry: -20deg; --tz: -300px; animation-delay: -3s;">
            <div class="absolute inset-0 bg-gradient-to-bl from-indigo-500/10 to-transparent opacity-30"></div>
        </div>

        <!-- Foreground Login Portal -->
        <div class="relative w-full max-w-[360px] z-10 login-card px-4 sm:px-0">
            <!-- Ambient glow behind card -->
            <div class="absolute inset-0 bg-white/5 blur-2xl rounded-3xl"></div>
            
            <!-- Glass Card -->
            <div class="relative bg-zinc-950/70 backdrop-blur-2xl border border-white/10 p-8 rounded-2xl shadow-[0_20px_40px_-10px_rgba(0,0,0,0.8),inset_0_1px_1px_rgba(255,255,255,0.05)] flex flex-col gap-6">
                
                <!-- Portal Header -->
                <div class="text-center flex flex-col items-center">
                    <div class="w-12 h-12 rounded-xl bg-white/[0.03] border border-white/10 flex items-center justify-center mb-4 shadow-inner relative group cursor-default">
                        <div class="absolute inset-0 bg-white/5 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl"></div>
                        <iconify-icon icon="solar:shield-keyhole-linear" class="text-white text-xl" stroke-width="1.5"></iconify-icon>
                    </div>
                    <h1 class="text-lg font-medium tracking-tight">Access Portal</h1>
                    <p class="text-[0.65rem] text-zinc-400 mt-1">Mock Data: <span class="text-white">admin_sigma</span> / <span class="text-white">vault123</span></p>
                </div>

                <!-- Auth Form -->
                <form id="authForm" class="flex flex-col gap-4">
                    
                    <!-- Identity Input -->
                    <div class="space-y-1.5">
                        <label class="text-[0.65rem] text-zinc-500 uppercase tracking-widest ml-1 block">Identity</label>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-zinc-500 group-focus-within:text-white transition-colors">
                                <iconify-icon icon="solar:user-linear" class="text-sm" stroke-width="1.5"></iconify-icon>
                            </div>
                            <!-- Added Value for Mock Testing -->
                            <input type="text" id="identityInput" value="admin_sigma" placeholder="Admin_ID or Email" 
                                class="w-full bg-white/5 border border-white/10 rounded-lg py-2 pl-9 pr-4 text-sm text-white placeholder:text-zinc-600 focus:outline-none focus:bg-white/10 focus:border-white/20 transition-all shadow-[inset_0_1px_2px_rgba(0,0,0,0.5)] ring-1 ring-transparent focus:ring-white/10">
                        </div>
                    </div>

                    <!-- Passkey Input -->
                    <div class="space-y-1.5">
                        <div class="flex justify-between items-center ml-1">
                            <label class="text-[0.65rem] text-zinc-500 uppercase tracking-widest block">Passkey</label>
                            <a href="#" class="text-[0.65rem] text-zinc-400 hover:text-white transition-colors">Recover?</a>
                        </div>
                        <div class="relative group">
                            <div class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-zinc-500 group-focus-within:text-white transition-colors">
                                <iconify-icon icon="solar:lock-password-linear" class="text-sm" stroke-width="1.5"></iconify-icon>
                            </div>
                            <!-- Added Value for Mock Testing -->
                            <input type="password" id="passkeyInput" value="vault123" placeholder="••••••••" 
                                class="w-full bg-white/5 border border-white/10 rounded-lg py-2 pl-9 pr-10 text-sm text-white placeholder:text-zinc-600 focus:outline-none focus:bg-white/10 focus:border-white/20 transition-all shadow-[inset_0_1px_2px_rgba(0,0,0,0.5)] ring-1 ring-transparent focus:ring-white/10">
                            <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-3 flex items-center text-zinc-500 hover:text-white transition-colors">
                                <iconify-icon id="eyeIcon" icon="solar:eye-linear" class="text-sm" stroke-width="1.5"></iconify-icon>
                            </button>
                        </div>
                    </div>

                    <!-- Custom Checkbox (Remember Me) -->
                    <div class="flex items-center justify-between mt-1 mb-2">
                        <label class="flex items-center gap-2 cursor-pointer custom-checkbox group">
                            <input type="checkbox" class="hidden">
                            <div class="w-3.5 h-3.5 rounded-sm border border-white/20 bg-white/5 flex items-center justify-center group-hover:border-white/40 transition-colors">
                                <iconify-icon icon="solar:check-read-linear" class="text-black text-[0.65rem] opacity-0 transition-opacity" stroke-width="2"></iconify-icon>
                            </div>
                            <span class="text-xs text-zinc-400 group-hover:text-white transition-colors select-none">Remember device</span>
                        </label>
                    </div>

                    <!-- Action Button -->
                    <button type="submit" id="submitBtn" class="w-full bg-white text-black hover:bg-zinc-200 font-medium text-sm py-2.5 rounded-lg transition-all duration-300 flex items-center justify-center gap-2 group shadow-[0_0_15px_rgba(255,255,255,0.1)] hover:shadow-[0_0_20px_rgba(255,255,255,0.2)]">
                        <span id="btnText">Initialize Link</span>
                        <iconify-icon id="btnIcon" icon="solar:arrow-right-linear" class="text-sm group-hover:translate-x-1 transition-transform" stroke-width="1.5"></iconify-icon>
                    </button>
                </form>

            </div>
        </div>

    </main>

    <script>
        // Password Visibility Toggle
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const passkeyInput = document.getElementById('passkeyInput');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePasswordBtn.addEventListener('click', () => {
            if (passkeyInput.type === 'password') {
                passkeyInput.type = 'text';
                eyeIcon.setAttribute('icon', 'solar:eye-closed-linear');
            } else {
                passkeyInput.type = 'password';
                eyeIcon.setAttribute('icon', 'solar:eye-linear');
            }
        });

        // Form Validation Logic
        const authForm = document.getElementById('authForm');
        const identityInput = document.getElementById('identityInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        // Initial styling classes
        const defaultBtnClass = "w-full bg-white text-black hover:bg-zinc-200 font-medium text-sm py-2.5 rounded-lg transition-all duration-300 flex items-center justify-center gap-2 group shadow-[0_0_15px_rgba(255,255,255,0.1)] hover:shadow-[0_0_20px_rgba(255,255,255,0.2)]";

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const identity = identityInput.value.trim();
            const passkey = passkeyInput.value.trim();

            if (identity === 'admin_sigma' && passkey === 'vault123') {
                // Success State
                submitBtn.className = "w-full bg-emerald-500 text-white font-medium text-sm py-2.5 rounded-lg transition-all duration-300 flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(16,185,129,0.3)]";
                btnText.textContent = "Access Granted";
                btnIcon.setAttribute('icon', 'solar:check-circle-linear');
                btnIcon.classList.remove('group-hover:translate-x-1');
            } else {
                // Error State
                submitBtn.className = "w-full bg-red-500 text-white font-medium text-sm py-2.5 rounded-lg transition-all duration-300 flex items-center justify-center gap-2 shake shadow-[0_0_20px_rgba(239,68,68,0.3)]";
                btnText.textContent = "Access Denied";
                btnIcon.setAttribute('icon', 'solar:close-circle-linear');
                btnIcon.classList.remove('group-hover:translate-x-1');

                // Reset Button after 2 seconds
                setTimeout(() => {
                    submitBtn.className = defaultBtnClass;
                    btnText.textContent = "Initialize Link";
                    btnIcon.setAttribute('icon', 'solar:arrow-right-linear');
                    btnIcon.classList.add('group-hover:translate-x-1');
                }, 2000);
            }
        });
    </script>
</body>
</html>
