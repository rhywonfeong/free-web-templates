<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Chart Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --font-main: 'Roboto', sans-serif;
            --bg-page: #f8f9fa;
            --bg-component: #ffffff;
            --bg-highlight: rgba(0, 123, 255, 0.03);
            --text-primary: #212529;
            --text-secondary: #495057;
            --text-muted: #6c757d;
            --text-heading: #004085;
            --text-accent: #007bff;
            --border-color: #dee2e6;
            --border-radius: 0.25rem;
            --shadow-md: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 1rem 3rem rgba(0, 0, 0, 0.2);
            --transition-normal: 0.2s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: grid;
            place-items: center;
            align-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .dashboard-sales-chart-panel {
            display: flex;
            max-width: 800px;
            width: 100%;
            background-color: var(--bg-component);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            overflow: hidden;
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
        }

        .dashboard-sales-chart-panel:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .sales-chart-visual {
            flex: 0 0 60%;
            padding: 25px;
            background-color: var(--bg-highlight);
            border-right: 1px solid var(--border-color);
        }

        .sales-chart-visual h4, 
        .sales-stats-content h4 {
            font-size: 1.1rem;
            color: var(--text-heading);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .css-bar-chart {
            display: flex;
            align-items: flex-end;
            height: 220px;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .css-bar-chart .bar {
            flex-grow: 1;
            background-color: var(--text-accent);
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            position: relative;
            text-align: center;
            transition: height 0.5s ease-out, background-color 0.3s;
            min-width: 20px;
        }

        .css-bar-chart .bar:hover {
            background-color: #0056b3;
        }

        .css-bar-chart .bar span {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--text-secondary);
            background-color: var(--bg-component);
            padding: 2px 4px;
            border-radius: var(--border-radius);
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        .css-bar-chart .bar:hover span {
            opacity: 1;
        }

        .css-bar-chart .bar::after {
            content: attr(data-label);
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .sales-stats-content {
            flex: 1 1 40%;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stat-item {
            background-color: var(--bg-highlight);
            padding: 12px 15px;
            border-radius: var(--border-radius);
            border: 1px solid rgba(222, 226, 230, 0.5);
        }

        .stat-label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .stat-value {
            display: block;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-heading);
        }

        .product-list {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .product-list li {
            font-size: 0.9rem;
            color: var(--text-primary);
            padding: 6px 0;
            border-bottom: 1px dashed rgba(222, 226, 230, 0.7);
            display: flex;
            justify-content: space-between;
        }

        .product-list li:last-child {
            border-bottom: none;
        }

        .product-sales {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .dashboard-sales-chart-panel {
                flex-direction: column;
            }
            .sales-chart-visual {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                flex-basis: auto;
            }
            .sales-stats-content {
                flex-basis: auto;
            }
        }

        @media (max-width: 480px) {
            .dashboard-sales-chart-panel {
                padding: 0;
            }
            .sales-chart-visual,
            .sales-stats-content {
                padding: 15px;
            }
            .css-bar-chart {
                height: 180px;
                gap: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-sales-chart-panel animate__animated animate__fadeIn">
        <div class="sales-chart-visual animate__animated animate__fadeInLeft" style="animation-delay: 0.2s;">
            <h4>Monthly Sales ($K)</h4>
            <div class="css-bar-chart">
                <div class="bar animate__animated animate__fadeInUp" style="height: 60%; animation-delay: 0.3s;" data-label="Jan"><span>6</span></div>
                <div class="bar animate__animated animate__fadeInUp" style="height: 80%; animation-delay: 0.4s;" data-label="Feb"><span>8</span></div>
                <div class="bar animate__animated animate__fadeInUp" style="height: 50%; animation-delay: 0.5s;" data-label="Mar"><span>5</span></div>
                <div class="bar animate__animated animate__fadeInUp" style="height: 90%; animation-delay: 0.6s;" data-label="Apr"><span>9</span></div>
                <div class="bar animate__animated animate__fadeInUp" style="height: 70%; animation-delay: 0.7s;" data-label="May"><span>7</span></div>
            </div>
        </div>
        <div class="sales-stats-content animate__animated animate__fadeInRight" style="animation-delay: 0.2s;">
             <div class="stat-item">
                <span class="stat-label">Total Revenue</span>
                <span class="stat-value">$35,000</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Average Sale</span>
                <span class="stat-value">$150.75</span>
            </div>
            <h4>Top Products</h4>
            <ul class="product-list">
                <li>Product Alpha <span class="product-sales">120 units</span></li>
                <li>Product Beta <span class="product-sales">95 units</span></li>
                <li>Product Gamma <span class="product-sales">80 units</span></li>
            </ul>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new WOW().init();
        });
    </script>
</body>
</html>
