<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCENZ - Inscription Drop</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
}
/* Custom Scrollbar */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #09090b; }
::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
/* Hide autofill styling */
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus,
input:-webkit-autofill:active{
-webkit-box-shadow: 0 0 0 30px #18181b inset !important;
-webkit-text-fill-color: white !important;
transition: background-color 5000s ease-in-out 0s;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="min-h-screen flex flex-col items-center justify-center antialiased selection:bg-zinc-800 selection:text-white overflow-hidden text-zinc-100 bg-[#09090b] pt-6 pr-6 pb-6 pl-6 relative">

    <!-- Subtle Background Glow -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-2xl h-[500px] bg-white/[0.03] blur-[100px] rounded-full pointer-events-none z-0"></div>

    <main class="w-full max-w-sm flex flex-col items-center z-10">
        <!-- Logo -->
        <div class="mb-14">
            <span class="uppercase text-xl font-medium text-white tracking-tighter">starzz</span>
        </div>

        <!-- Header -->
        <div class="text-center mb-10 w-full">
            <div class="inline-flex items-center justify-center px-3 py-1.5 mb-6 rounded-full border border-zinc-800 bg-zinc-900/40 backdrop-blur-md text-xs text-zinc-400">
                <span class="w-1.5 h-1.5 rounded-full bg-zinc-300 mr-2 animate-pulse"></span>
                Accès Anticipé
            </div>
            <h1 class="sm:text-4xl text-3xl font-semibold text-white tracking-tight mb-3">Inscription Drop</h1>
            <p class="text-sm text-zinc-400 max-w-[280px] mx-auto leading-relaxed">
                Inscrivez-vous pour être notifié en exclusivité avant l'ouverture publique.
            </p>
        </div>

        <!-- Form -->
        <form class="w-full flex flex-col gap-5">
            <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-zinc-500 group-focus-within:text-zinc-300 transition-colors">
                    <iconify-icon icon="solar:letter-linear" style="stroke-width: 1.5;" class="text-lg"></iconify-icon>
                </div>
                <input type="email" placeholder="Adresse email" required="" class="focus:ring-1 focus:ring-zinc-600 focus:border-zinc-600 block transition-all outline-none placeholder:text-zinc-600 text-sm text-zinc-100 bg-zinc-900/60 w-full border-zinc-800 border rounded-xl pt-3.5 pr-4 pb-3.5 pl-12 backdrop-blur-xl">
            </div>

            <!-- Custom Checkbox -->
            <label class="flex items-start gap-3 mt-1 cursor-pointer group">
                <div class="relative flex items-center justify-center mt-0.5 shrink-0">
                    <input type="checkbox" class="peer sr-only" required="">
                    <div class="w-4 h-4 rounded border border-zinc-700 bg-zinc-900/80 peer-checked:bg-white peer-checked:border-white transition-all shadow-sm"></div>
                    <iconify-icon icon="solar:check-linear" class="absolute text-[#09090b] opacity-0 peer-checked:opacity-100 transition-opacity text-sm" style="stroke-width: 1.5;"></iconify-icon>
                </div>
                <span class="leading-normal select-none group-hover:text-zinc-400 transition-colors text-xs text-zinc-500 text-left">J'accepte de recevoir des communications concernant la marque STARZZ et les prochains lancements.</span>
            </label>

            <button type="submit" class="w-full mt-3 bg-white text-[#09090b] font-medium text-sm rounded-xl px-5 py-3.5 hover:bg-zinc-200 active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#09090b] focus:ring-white shadow-[0_0_20px_rgba(255,255,255,0.05)]">
                Valider l'inscription
            </button>
        </form>

        <!-- Footer Links -->
        
    </main>


</body></html>
