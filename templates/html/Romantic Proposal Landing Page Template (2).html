<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To the Moon & Back</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2'><path d='M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z' fill='rgba(255,255,255,0.5)'/></svg>") 12 12, auto;
}
.twinkle-star {
position: absolute;
animation: twinkle 4s infinite ease-in-out;
opacity: 0;
z-index: 0;
}
@keyframes twinkle {
0% { transform: scale(0.5); opacity: 0; }
50% { transform: scale(1.2); opacity: 0.8; }
100% { transform: scale(0.5); opacity: 0; }
}
.shooting-star {
position: absolute;
width: 100px;
height: 2px;
background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
animation: shoot 5s infinite linear;
opacity: 0;
transform: rotate(-45deg);
}
@keyframes shoot {
0% { transform: translateX(0) translateY(0) rotate(-45deg); opacity: 1; }
20% { transform: translateX(-200px) translateY(200px) rotate(-45deg); opacity: 0; }
100% { opacity: 0; }
}
.confetti {
position: absolute;
width: 8px;
height: 8px;
background-color: #fff;
animation: fall linear forwards;
}
@keyframes fall {
to { transform: translateY(100vh) rotate(700deg); }
}
/* Button transition for smooth movement */
#no-btn {
transition: all 0.2s ease;
}
/* Hide scrollbar */
::-webkit-scrollbar { width: 0px; background: transparent; }
</style></head>
<body class="h-screen w-full bg-slate-950 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-950 via-slate-950 to-black overflow-hidden flex flex-col items-center justify-center selection:bg-indigo-500/30 selection:text-indigo-200 relative text-slate-200">

    <!-- Background Elements -->
    <div id="stars-container" class="absolute inset-0 pointer-events-none overflow-hidden">
        <div class="shooting-star" style="top: 10%; right: 10%; animation-delay: 2s;"></div>
        <div class="shooting-star" style="top: 30%; right: -10%; animation-delay: 6s;"></div>
        <!-- Stars injected via JS -->
    </div>

    <!-- Main Content Card -->
    <main id="main-card" class="relative z-10 w-full max-w-lg p-6 flex flex-col items-center transition-all duration-700 ease-out transform">
        
        <!-- Decoration Icon -->
        <div class="mb-8 p-5 bg-white/5 backdrop-blur-md rounded-full shadow-2xl border border-white/10 ring-1 ring-white/20 animate-[bounce_3s_infinite]">
            <iconify-icon icon="solar:moon-stars-linear" width="56" height="56" class="text-indigo-300 drop-shadow-[0_0_15px_rgba(165,180,252,0.5)]"></iconify-icon>
        </div>

        <!-- Question -->
        <h1 class="text-3xl md:text-5xl font-medium tracking-tight text-white text-center mb-3 leading-tight drop-shadow-lg">
            Will you be my<br><span class="text-indigo-400">Moon & Stars?</span> 🌙
        </h1>
        <p class="text-slate-400 text-sm md:text-base font-normal mb-12 text-center max-w-xs leading-relaxed">
            I promise to give you the universe (and lots of snacks).
        </p>

        <!-- Buttons -->
        <div class="flex flex-col md:flex-row items-center justify-center gap-5 w-full relative h-24">
            
            <button id="yes-btn" onclick="acceptLove()" class="group relative px-10 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-full shadow-[0_0_20px_rgba(79,70,229,0.4)] transition-all duration-300 transform active:scale-95 flex items-center gap-2 z-20 overflow-hidden border border-indigo-400/30">
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700"></div>
                <span>Yes! ✨</span>
                <iconify-icon icon="solar:star-fall-linear" class="opacity-0 group-hover:opacity-100 transition-opacity text-yellow-200"></iconify-icon>
            </button>

            <!-- No Button: Runs on Hover AND Click -->
            <button id="no-btn" onmouseover="moveNoButton()" onclick="moveNoButton()" ontouchstart="moveNoButton()" class="px-10 py-3.5 bg-white/5 backdrop-blur-sm text-slate-300 hover:text-white font-medium rounded-full shadow-sm border border-white/10 hover:bg-white/10 z-20 whitespace-nowrap">
                No 🌑
            </button>
        </div>

    </main>

    <!-- Celebration Screen (Hidden by default) -->
    <div id="success-screen" class="fixed inset-0 z-50 bg-slate-950 hidden flex-col items-center justify-center text-center p-6 opacity-0 transition-opacity duration-1000">
        
        <!-- Stars Background for Success -->
        <div class="absolute inset-0 overflow-hidden">
            <div class="absolute top-10 left-10 text-yellow-200/20"><iconify-icon icon="solar:star-bold" width="40"></iconify-icon></div>
            <div class="absolute bottom-20 right-20 text-indigo-400/20"><iconify-icon icon="solar:moon-bold" width="60"></iconify-icon></div>
        </div>

        <div class="relative z-10 w-72 h-72 md:w-96 md:h-96 mb-8">
            <!-- Happy Face GIF -->
            <img src="https://media.tenor.com/YoGCaqW-vQAAAAAi/peach-goma-happy.gif" alt="Happy Face" class="w-full h-full object-cover rounded-3xl shadow-[0_0_50px_rgba(99,102,241,0.3)] border-2 border-white/20">
            <div class="absolute -bottom-4 -right-4 bg-white/10 backdrop-blur-md p-3 rounded-full border border-white/20 animate-bounce">
                <iconify-icon icon="solar:smile-circle-bold" class="text-yellow-400 text-3xl"></iconify-icon>
            </div>
        </div>

        <h1 class="relative z-10 text-4xl md:text-6xl font-medium tracking-tight text-white mb-4 drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">
            YAY! Happy Face! 😻
        </h1>
        <p class="relative z-10 text-lg text-indigo-200 max-w-md leading-relaxed animate-pulse">
            See? It was destiny!
        </p>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const mainCard = document.getElementById('main-card');
        const successScreen = document.getElementById('success-screen');
        
        let attempts = 0;
        let scaleFactor = 1;

        // Background Stars Generation
        const container = document.getElementById('stars-container');
        
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.classList.add('twinkle-star');
            star.innerHTML = `<iconify-icon icon="solar:star-linear" style="font-size: ${Math.random() * 10 + 4}px; color: white"></iconify-icon>`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 3 + 2}s`;
            star.style.animationDelay = `${Math.random() * 5}s`;
            container.appendChild(star);
        }

        // Logic to make the No Button Run
        function moveNoButton() {
            attempts++;
            
            // Calculate available space
            const maxWidth = window.innerWidth - noBtn.offsetWidth - 40;
            const maxHeight = window.innerHeight - noBtn.offsetHeight - 40;
            
            // Generate random position within viewport
            const randomX = Math.max(20, Math.random() * maxWidth);
            const randomY = Math.max(20, Math.random() * maxHeight);

            // Apply Fixed position to escape the flow
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
            noBtn.style.zIndex = '30'; // Ensure it stays on top
            
            // Make Yes Button bigger each time No runs away
            scaleFactor += 0.1;
            yesBtn.style.transform = `scale(${scaleFactor})`;
        }

        // Success Logic
        function acceptLove() {
            // Audio effect
            const audio = new Audio('https://cdn.pixabay.com/audio/2022/10/05/audio_6861252033.mp3'); 
            audio.volume = 0.5;
            audio.play().catch(e => console.log("Audio needed interaction"));

            mainCard.style.transform = 'scale(0.8) translateY(-100vh)';
            mainCard.style.opacity = '0';
            
            successScreen.classList.remove('hidden');
            setTimeout(() => {
                successScreen.classList.remove('opacity-0');
                startConfetti();
            }, 300);
        }

        // Confetti Effect
        function startConfetti() {
            const colors = ['#fbbf24', '#818cf8', '#ffffff', '#c084fc'];
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = Math.random() * 3 + 2 + 's';
                confetti.style.opacity = Math.random();
                document.body.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
