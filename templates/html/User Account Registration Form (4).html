<body class="bg-gray-100 p-4 md:p-8 max-w-5xl mx-auto">
    <div class="flex flex-col space-y-6">
        <!-- Top Section (Blue Background) -->
        <div class="bg-blue-500 rounded-3xl p-6 md:p-10">
            <div class="mb-8">
                <h1 class="text-3xl md:text-4xl font-bold text-white leading-tight">
                    Join Studio Craft.<br>
                    Elevate Your Design Journey.
                </h1>
            </div>
            
            <div class="bg-white rounded-2xl p-6 shadow-sm">
                <div class="flex flex-col space-y-4">
                    <div class="w-12 h-12 flex items-center justify-center">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <p class="text-black text-lg font-medium">Create your account and unlock a world of design excellence.</p>
                </div>
            </div>
        </div>
        
        <!-- Bottom Section (Sign Up Form) -->
        <div class="bg-white rounded-3xl p-6 md:p-10 shadow-sm">
            <div class="mb-6">
                <h2 class="text-2xl md:text-3xl font-bold text-black">Sign Up</h2>
                <p class="text-gray-600 mt-2">Fill in your details to create an account</p>
            </div>
            
            <form class="space-y-6">
                <!-- Name Fields -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
                        <input type="text" id="firstName" name="firstName" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Enter your first name" required>
                    </div>
                    
                    <div class="space-y-2">
                        <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name</label>
                        <input type="text" id="lastName" name="lastName" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Enter your last name" required>
                    </div>
                </div>
                
                <!-- Email Field -->
                <div class="space-y-2">
                    <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" id="email" name="email" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Enter your email" required>
                </div>
                
                <!-- Password Fields -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="password" name="password" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Create a password" required>
                    </div>
                    
                    <div class="space-y-2">
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Confirm your password" required>
                    </div>
                </div>
                
                <!-- Terms Checkbox -->
                <div class="flex items-start">
                    <div class="flex items-center h-5">
                        <input id="terms" name="terms" type="checkbox" class="w-4 h-4 border-gray-300 rounded focus:ring-blue-500" required>
                    </div>
                    <div class="ml-3 text-sm">
                        <label for="terms" class="text-gray-600">I agree to the <a href="#" class="text-blue-600 hover:underline">Terms of Service</a> and <a href="#" class="text-blue-600 hover:underline">Privacy Policy</a></label>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-700 transition-colors">
                    Create Account
                </button>
                
                <!-- Sign In Link -->
                <div class="text-center">
                    <p class="text-gray-600">Already have an account? <a href="#" class="text-blue-600 font-medium hover:underline">Sign in</a></p>
                </div>
            </form>
        </div>
        
        <!-- Social Sign Up Options -->
        <div class="bg-white rounded-3xl p-6 md:p-10 shadow-sm">
            <div class="text-center mb-6">
                <p class="text-gray-600">Or sign up with</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <span class="font-medium">Continue with Google</span>
                </button>
                
                <button class="flex items-center justify-center space-x-2 border border-gray-300 rounded-lg p-3 hover:bg-gray-50 transition-colors">
                    <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-2c-.55 0-1 .45-1 1v2h3v3h-3v6.95c5.05-.5 9-4.76 9-9.95z" fill="#1877F2"/></svg>
                    <span class="font-medium">Continue with Facebook</span>
                </button>
            </div>
        </div>
    </div>
