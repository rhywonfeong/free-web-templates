<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to PDF Converter</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
}
::-webkit-scrollbar {
width: 6px;
height: 6px;
}
::-webkit-scrollbar-track {
background: transparent;
}
::-webkit-scrollbar-thumb {
background: #e2e8f0;
border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
background: #cbd5e1;
}
.file-input-hidden {
width: 0.1px;
height: 0.1px;
opacity: 0;
overflow: hidden;
position: absolute;
z-index: -1;
}
.dragging {
opacity: 0.4;
transform: scale(0.98);
}
.drag-over {
border-color: #000;
background-color: #f8fafc;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col antialiased selection:bg-gray-200 selection:text-gray-900">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-20">
        <div class="max-w-[88rem] mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-7 h-7 bg-black rounded flex items-center justify-center text-white font-medium text-xs tracking-tighter">
                    IMG
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-gray-300">/</span>
                    <span class="font-medium text-sm tracking-tight text-gray-900">PDF Converter</span>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="clear-all-btn" class="text-sm font-medium text-gray-500 hover:text-red-600 transition-colors flex items-center gap-1.5 hidden sm:flex">
                    <iconify-icon icon="solar:trash-bin-trash-linear" width="16" height="16"></iconify-icon>
                    Clear All
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-[88rem] w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col xl:flex-row gap-6 lg:gap-8">
        
        <div class="flex-1 flex flex-col gap-6">
            
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-medium tracking-tight text-gray-900">Workspace</h1>
                    <p class="text-sm text-gray-500 mt-1">Arrange your images before generating the document.</p>
                </div>
                <div id="image-count" class="text-xs font-medium px-2.5 py-1 bg-gray-100 text-gray-600 rounded-full border border-gray-200 transition-all">
                    4 Images added
                </div>
            </div>

            <label id="dropzone" class="relative group cursor-pointer">
                <input type="file" id="file-input" multiple accept="image/png, image/jpeg, image/jpg, image/gif, image/svg+xml" class="file-input-hidden">
                <div class="border-2 border-dashed border-gray-200 rounded-2xl bg-white/50 p-8 flex flex-col items-center justify-center text-center hover:border-gray-300 hover:bg-white transition-all duration-200">
                    <div class="w-10 h-10 bg-white shadow-sm border border-gray-100 rounded-full flex items-center justify-center text-gray-700 mb-3 group-hover:-translate-y-1 transition-transform duration-300">
                        <iconify-icon icon="solar:gallery-add-linear" width="20" height="20"></iconify-icon>
                    </div>
                    <span class="text-sm font-medium text-gray-900 mb-0.5">Click to upload or drag and drop</span>
                    <span class="text-xs text-gray-500">SVG, PNG, JPG or GIF (max. 10MB)</span>
                </div>
            </label>

            <div id="image-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- Images rendered via JS -->
            </div>
            
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-12 px-4 border-2 border-dashed border-gray-100 rounded-2xl bg-gray-50/50">
                <iconify-icon icon="solar:gallery-remove-linear" width="32" height="32" class="text-gray-300 mb-3"></iconify-icon>
                <p class="text-sm font-medium text-gray-500">No images added yet</p>
                <p class="text-xs text-gray-400 mt-1">Upload images to get started</p>
            </div>
        </div>

        <aside class="w-full xl:w-80 flex-shrink-0">
            <div class="bg-white rounded-2xl border border-gray-200 shadow-sm sticky top-20 flex flex-col">
                
                <div class="p-5 border-b border-gray-100">
                    <h2 class="text-base font-medium tracking-tight text-gray-900 flex items-center gap-2">
                        <iconify-icon icon="solar:settings-linear" width="18" height="18" class="text-gray-500"></iconify-icon>
                        Document Settings
                    </h2>
                </div>

                <div class="p-5 flex flex-col gap-6">
                    
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-medium text-gray-700">Page Size</label>
                        <div class="relative">
                            <select id="setting-size" class="w-full appearance-none bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-1 focus:ring-gray-900 focus:border-gray-900 block px-3 py-2.5 pr-8 transition-shadow outline-none cursor-pointer shadow-sm">
                                <option value="a4">A4 (210 x 297 mm)</option>
                                <option value="letter">US Letter (8.5 x 11 in)</option>
                                <option value="legal">Legal (8.5 x 14 in)</option>
                                <option value="fit">Fit to Image</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                                <iconify-icon icon="solar:alt-arrow-down-linear" width="16" height="16"></iconify-icon>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-2">
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-medium text-gray-700">Orientation</label>
                            <span class="text-[10px] text-gray-400">Default fallback</span>
                        </div>
                        <div class="flex bg-gray-50 p-1 rounded-lg border border-gray-200 relative">
                            <button id="btn-portrait" class="orientation-btn flex-1 flex items-center justify-center gap-2 bg-white shadow-sm rounded-md py-1.5 text-xs font-medium text-gray-900 border border-gray-200/50 transition-all">
                                <iconify-icon icon="solar:document-linear" width="16" height="16"></iconify-icon> Portrait
                            </button>
                            <button id="btn-landscape" class="orientation-btn flex-1 flex items-center justify-center gap-2 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-900 transition-all">
                                <iconify-icon icon="solar:document-linear" width="16" height="16" class="rotate-90"></iconify-icon> Landscape
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-medium text-gray-700">Page Margin</label>
                        <div class="relative">
                            <select id="setting-margin" class="w-full appearance-none bg-white border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-1 focus:ring-gray-900 focus:border-gray-900 block px-3 py-2.5 pr-8 transition-shadow outline-none cursor-pointer shadow-sm">
                                <option value="0">No Margin</option>
                                <option value="10">Small (10mm)</option>
                                <option value="20" selected>Normal (20mm)</option>
                                <option value="30">Large (30mm)</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-400">
                                <iconify-icon icon="solar:alt-arrow-down-linear" width="16" height="16"></iconify-icon>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-3 pt-2">
                        <label class="flex items-center gap-3 group cursor-pointer">
                            <div class="relative flex items-center justify-center">
                                <input type="checkbox" id="setting-compress" class="peer appearance-none w-4 h-4 border border-gray-300 rounded bg-white checked:bg-black checked:border-black transition-colors cursor-pointer" checked>
                                <iconify-icon icon="solar:check-read-linear" width="12" height="12" class="text-white absolute opacity-0 peer-checked:opacity-100 pointer-events-none"></iconify-icon>
                            </div>
                            <span class="text-sm text-gray-700 group-hover:text-gray-900 select-none">Compress images</span>
                        </label>
                        <label class="flex items-center gap-3 group cursor-pointer">
                            <div class="relative flex items-center justify-center">
                                <input type="checkbox" id="setting-numbers" class="peer appearance-none w-4 h-4 border border-gray-300 rounded bg-white checked:bg-black checked:border-black transition-colors cursor-pointer">
                                <iconify-icon icon="solar:check-read-linear" width="12" height="12" class="text-white absolute opacity-0 peer-checked:opacity-100 pointer-events-none"></iconify-icon>
                            </div>
                            <span class="text-sm text-gray-700 group-hover:text-gray-900 select-none">Add page numbers</span>
                        </label>
                    </div>

                </div>

                <div class="p-5 bg-gray-50/50 border-t border-gray-100 rounded-b-2xl">
                    <button id="generate-btn" class="w-full flex items-center justify-center gap-2 bg-gray-900 hover:bg-black disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-medium text-sm rounded-lg px-4 py-3 transition-all active:scale-[0.98] shadow-sm">
                        <iconify-icon id="generate-icon" icon="solar:file-download-linear" width="18" height="18"></iconify-icon>
                        <span id="generate-text">Generate PDF</span>
                    </button>
                    <div class="flex items-center justify-center gap-1.5 mt-3 text-[10px] text-gray-500 font-medium">
                        <iconify-icon icon="solar:shield-check-linear" width="12" height="12"></iconify-icon>
                        Processed locally in your browser
                    </div>
                </div>

            </div>
        </aside>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initial Mock Data to match original design precisely
            let images = [
                { id: 'img_1', name: 'invoice_jan_2024.jpg', size: 1200000, width: 2400, height: 3200, url: 'https://images.unsplash.com/photo-1586281380349-632531db7ed4?auto=format&fit=crop&q=80&w=400&h=533', type: 'image/jpeg' },
                { id: 'img_2', name: 'receipt_uber.png', size: 850000, width: 1080, height: 1920, url: 'https://images.unsplash.com/photo-1618044733300-9472054094ee?auto=format&fit=crop&q=80&w=400&h=533', type: 'image/png' },
                { id: 'img_3', name: 'id_front.jpg', size: 2100000, width: 3000, height: 2000, url: 'https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&q=80&w=600&h=400', type: 'image/jpeg' },
                { id: 'img_4', name: 'id_back.jpg', size: 1900000, width: 3000, height: 2000, url: 'https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&q=80&w=600&h=400', type: 'image/jpeg' }
            ];

            // DOM Elements
            const grid = document.getElementById('image-grid');
            const emptyState = document.getElementById('empty-state');
            const fileInput = document.getElementById('file-input');
            const dropzone = document.getElementById('dropzone');
            const clearAllBtn = document.getElementById('clear-all-btn');
            const countDisplay = document.getElementById('image-count');
            const generateBtn = document.getElementById('generate-btn');
            const generateIcon = document.getElementById('generate-icon');
            const generateText = document.getElementById('generate-text');

            // Settings State
            let orientation = 'p';
            document.getElementById('btn-portrait').addEventListener('click', (e) => setOrientation('p', e.currentTarget));
            document.getElementById('btn-landscape').addEventListener('click', (e) => setOrientation('l', e.currentTarget));

            function setOrientation(val, btnElement) {
                orientation = val;
                document.querySelectorAll('.orientation-btn').forEach(btn => {
                    btn.classList.remove('bg-white', 'shadow-sm', 'text-gray-900', 'border-gray-200/50');
                    btn.classList.add('text-gray-500');
                    btn.classList.remove('border');
                });
                btnElement.classList.remove('text-gray-500');
                btnElement.classList.add('bg-white', 'shadow-sm', 'text-gray-900', 'border', 'border-gray-200/50');
            }

            // Utilities
            const formatBytes = (bytes) => {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            };

            const generateId = () => Math.random().toString(36).substr(2, 9);

            // Render Function
            function render() {
                grid.innerHTML = '';
                
                if (images.length === 0) {
                    grid.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    generateBtn.disabled = true;
                } else {
                    grid.classList.remove('hidden');
                    emptyState.classList.add('hidden');
                    generateBtn.disabled = false;
                    
                    images.forEach((img, index) => {
                        const item = document.createElement('div');
                        item.className = 'group relative bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md hover:border-gray-300 transition-all cursor-move';
                        item.draggable = true;
                        item.dataset.index = index;
                        
                        const isLandscape = img.width > img.height;
                        const objectFitClass = isLandscape ? 'object-contain drop-shadow-sm max-h-full w-auto' : 'object-cover w-full h-full';
                        const containerBg = isLandscape ? 'bg-gray-50 p-2' : 'bg-gray-100';

                        item.innerHTML = `
                            <div class="aspect-[3/4] ${containerBg} flex items-center justify-center relative overflow-hidden pointer-events-none">
                                <img src="${img.url}" alt="${img.name}" class="${objectFitClass} group-hover:scale-105 transition-transform duration-500 pointer-events-none" crossorigin="anonymous" />
                                <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-between p-2 pointer-events-auto">
                                    <div class="flex justify-between items-start w-full">
                                        <div class="bg-white/90 backdrop-blur-md w-6 h-6 rounded-md flex items-center justify-center text-xs font-medium text-gray-900 shadow-sm">${index + 1}</div>
                                        <button onclick="removeImage(${index})" class="bg-white/90 backdrop-blur-md hover:bg-red-50 text-gray-600 hover:text-red-600 w-7 h-7 rounded-md flex items-center justify-center shadow-sm transition-colors" title="Remove image">
                                            <iconify-icon icon="solar:trash-bin-trash-linear" width="14" height="14"></iconify-icon>
                                        </button>
                                    </div>
                                    <div class="self-center bg-white/90 backdrop-blur-md px-2 py-1 rounded-md text-[10px] font-medium text-gray-700 opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0 transition-all shadow-sm flex items-center gap-1">
                                        <iconify-icon icon="solar:reorder-linear" width="12" height="12"></iconify-icon> Drag to reorder
                                    </div>
                                </div>
                            </div>
                            <div class="p-2.5 border-t border-gray-100 bg-white pointer-events-none">
                                <p class="text-xs font-medium text-gray-800 truncate" title="${img.name}">${img.name}</p>
                                <p class="text-[10px] text-gray-400 mt-0.5">${formatBytes(img.size)} • ${img.width}x${img.height}</p>
                            </div>
                        `;

                        // Drag Events
                        item.addEventListener('dragstart', handleDragStart);
                        item.addEventListener('dragover', handleDragOver);
                        item.addEventListener('dragleave', handleDragLeave);
                        item.addEventListener('drop', handleDrop);
                        item.addEventListener('dragend', handleDragEnd);

                        grid.appendChild(item);
                    });
                }
                
                countDisplay.textContent = `${images.length} Image${images.length !== 1 ? 's' : ''} added`;
            }

            // Global Actions
            window.removeImage = (index) => {
                images.splice(index, 1);
                render();
            };

            clearAllBtn.addEventListener('click', () => {
                if(confirm('Are you sure you want to remove all images?')) {
                    images = [];
                    render();
                }
            });

            // Drag and Drop Reordering
            let draggedIndex = null;

            function handleDragStart(e) {
                draggedIndex = parseInt(this.dataset.index);
                e.dataTransfer.effectAllowed = 'move';
                setTimeout(() => this.classList.add('dragging'), 0);
            }

            function handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if(parseInt(this.dataset.index) !== draggedIndex) {
                    this.classList.add('ring-2', 'ring-gray-900', 'ring-offset-2');
                }
                return false;
            }

            function handleDragLeave(e) {
                this.classList.remove('ring-2', 'ring-gray-900', 'ring-offset-2');
            }

            function handleDrop(e) {
                e.stopPropagation();
                this.classList.remove('ring-2', 'ring-gray-900', 'ring-offset-2');
                const dropIndex = parseInt(this.dataset.index);
                
                if (draggedIndex !== null && draggedIndex !== dropIndex) {
                    const item = images.splice(draggedIndex, 1)[0];
                    images.splice(dropIndex, 0, item);
                    render();
                }
                return false;
            }

            function handleDragEnd() {
                this.classList.remove('dragging');
                draggedIndex = null;
            }

            // File Upload Handling
            const handleFiles = (files) => {
                const validFiles = Array.from(files).filter(file => file.type.startsWith('image/') && file.size <= 10 * 1024 * 1024);
                
                if(validFiles.length < files.length) {
                    alert('Some files were ignored. Ensure they are images under 10MB.');
                }

                validFiles.forEach(file => {
                    const url = URL.createObjectURL(file);
                    const imgObj = new Image();
                    imgObj.onload = () => {
                        images.push({
                            id: generateId(),
                            name: file.name,
                            size: file.size,
                            width: imgObj.naturalWidth,
                            height: imgObj.naturalHeight,
                            url: url,
                            type: file.type
                        });
                        render();
                    };
                    imgObj.src = url;
                });
            };

            fileInput.addEventListener('change', (e) => {
                handleFiles(e.target.files);
                e.target.value = ''; 
            });

            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('drag-over');
            });

            dropzone.addEventListener('dragleave', (e) => {
                e.preventDefault();
                dropzone.classList.remove('drag-over');
            });

            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('drag-over');
                if (e.dataTransfer.files.length > 0) {
                    handleFiles(e.dataTransfer.files);
                }
            });

            // PDF Generation
            generateBtn.addEventListener('click', async () => {
                if (images.length === 0) return;
                
                // UI Loading State
                generateBtn.disabled = true;
                generateText.textContent = 'Generating...';
                generateIcon.setAttribute('icon', 'solar:spinner-linear');
                generateIcon.classList.add('animate-spin');

                try {
                    const { jsPDF } = window.jspdf;
                    const pageSize = document.getElementById('setting-size').value;
                    const margin = parseInt(document.getElementById('setting-margin').value) || 0;
                    const addNumbers = document.getElementById('setting-numbers').checked;
                    const compress = document.getElementById('setting-compress').checked;

                    let pdf = new jsPDF({
                        orientation: orientation,
                        unit: 'mm',
                        format: pageSize === 'fit' ? 'a4' : pageSize, 
                        compress: compress
                    });

                    for (let i = 0; i < images.length; i++) {
                        const img = images[i];
                        
                        // Load image to canvas to get base64 (helps with CORS for remote images too)
                        const base64Img = await new Promise((resolve, reject) => {
                            const image = new Image();
                            image.crossOrigin = 'Anonymous';
                            image.onload = () => {
                                const canvas = document.createElement('canvas');
                                canvas.width = image.width;
                                canvas.height = image.height;
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(image, 0, 0);
                                resolve(canvas.toDataURL(img.type || 'image/jpeg', compress ? 0.8 : 1.0));
                            };
                            image.onerror = () => {
                                // Fallback for blocked external images
                                resolve(img.url);
                            };
                            image.src = img.url;
                        });

                        if (i > 0) {
                            if(pageSize === 'fit') {
                                // Dynamic size based on image ratio mapping to mm (very basic approximation)
                                pdf.addPage([img.width * 0.264583, img.height * 0.264583], img.width > img.height ? 'l' : 'p');
                            } else {
                                pdf.addPage(pageSize, orientation);
                            }
                        } else if (pageSize === 'fit') {
                            // Update first page
                            pdf.deletePage(1);
                            pdf.addPage([img.width * 0.264583, img.height * 0.264583], img.width > img.height ? 'l' : 'p');
                            pdf.setPage(1);
                        }

                        const pdfWidth = pdf.internal.pageSize.getWidth();
                        const pdfHeight = pdf.internal.pageSize.getHeight();
                        
                        const contentWidth = pdfWidth - (margin * 2);
                        const contentHeight = pdfHeight - (margin * 2);

                        // Scale to fit
                        const ratio = Math.min(contentWidth / img.width, contentHeight / img.height);
                        const finalWidth = img.width * ratio;
                        const finalHeight = img.height * ratio;
                        
                        // Center image
                        const x = margin + (contentWidth - finalWidth) / 2;
                        const y = margin + (contentHeight - finalHeight) / 2;

                        pdf.addImage(base64Img, img.type === 'image/png' ? 'PNG' : 'JPEG', x, y, finalWidth, finalHeight);

                        if (addNumbers) {
                            pdf.setFontSize(10);
                            pdf.setTextColor(150);
                            pdf.text(`${i + 1}`, pdfWidth / 2, pdfHeight - (margin > 10 ? margin / 2 : 5), { align: 'center' });
                        }
                    }

                    pdf.save('converted_document.pdf');

                } catch (error) {
                    console.error("PDF Generation Error:", error);
                    alert("An error occurred while generating the PDF. If you are using default placeholder images, some browsers block them due to cross-origin policies. Try uploading your own local files.");
                } finally {
                    // Reset UI
                    generateBtn.disabled = false;
                    generateText.textContent = 'Generate PDF';
                    generateIcon.setAttribute('icon', 'solar:file-download-linear');
                    generateIcon.classList.remove('animate-spin');
                }
            });

            // Initial Render
            render();
        });
    </script>
</body>
</html>
