<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

  <meta charset="UTF-8">
  <title>Login Card Layout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Nunito:400,800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .custom-shadow {
      box-shadow:
        rgba(50, 50, 93, 0.25) 0px 13px 27px -5px,
        rgba(0, 0, 0, 0.3) 0px 8px 16px -8px;
    }
    .inherited-styles-for-exported-element {
      font-family: Nunito, arial, sans-serif;
    }
    @keyframes button-spin {
      0% { transform: translate(-50%) rotate(0deg);}
      to { transform: translate(-50%) rotate(720deg);}
    }
    .button-loader {
      animation: button-spin 1.5s ease-in-out infinite;
      display: none;
      height: 100%;
      left: 50%;
      position: absolute;
      top: 0;
      transform: translate(-50%);
      width: auto;
    }
    button.loading .button-loader {
      display: block;
    }
    button.loading .button-content {
      opacity: 0.3;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-stone-100 inherited-styles-for-exported-element">

  <main class="w-full flex items-center justify-center min-h-screen">
    <section class="bg-white border border-transparent rounded-2xl p-8 sm:p-10 w-full max-w-md custom-shadow flex flex-col items-center">
      <!-- Title -->
      <h1 class="text-2xl font-extrabold text-gray-800 mb-2 text-center">Sign in to your account</h1>
      <p class="text-gray-500 text-sm mb-8 text-center">Please enter your credentials to continue</p>

      <!-- Login Form -->
      <form class="w-full flex flex-col gap-4 mb-4" autocomplete="off">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-600 mb-1">Email</label>
          <input
            type="email"
            id="email"
            class="w-full px-4 py-2 rounded-lg border border-stone-200 bg-stone-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-200 transition"
            placeholder="you@email.com"
            required
          />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-gray-600 mb-1">Password</label>
          <input
            type="password"
            id="password"
            class="w-full px-4 py-2 rounded-lg border border-stone-200 bg-stone-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-200 transition"
            placeholder="••••••••"
            required
          />
        </div>
        <button
          type="submit"
          class="relative flex items-center justify-center w-full rounded-lg border border-transparent min-h-[48px] px-4 py-2 font-extrabold text-lg transition-transform duration-200 bg-blue-500 text-white hover:bg-blue-600 hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-blue-200"
          id="loginBtn"
        >
          <span class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <svg class="button-loader fill-white" width="28" height="28" viewBox="0 0 24 24">
              <circle class="opacity-40" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
              <path d="M22 12a10 10 0 0 1-10 10" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="20"/>
            </svg>
          </span>
          <span class="button-content w-full flex items-center justify-center">Sign in</span>
        </button>
      </form>

      <div class="w-full flex justify-between text-sm text-gray-400 mt-2">
        <a href="#" class="hover:underline">Forgot password?</a>
        <a href="#" class="hover:underline">Create account</a>
      </div>
    </section>
  </main>
  <script>
    // Demo loading state for the login button
    document.querySelector('form').addEventListener('submit', function(e){
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.classList.add('loading');
      setTimeout(() => btn.classList.remove('loading'), 2000);
    });
  </script>
</body>
</html>
