  <meta charset="UTF-8">
  <title>100+ Advanced Hover Image Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .clip-hexagon {
      clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
    }
    .clip-circle {
      clip-path: circle(48% at 50% 50%);
    }
    .clip-diamond {
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }
    .shine {
      position: absolute;
      top: 0; left: -75%;
      width: 60%;
      height: 100%;
      background: linear-gradient(120deg, rgba(255,255,255,0) 20%, rgba(255,255,255,0.5) 50%, rgba(255,255,255,0) 80%);
      transform: skewX(-20deg);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .group:hover .shine {
      animation: shine-move 0.8s linear forwards;
      opacity: 1;
    }
    @keyframes shine-move {
      0% { left: -75%; opacity: 0.2;}
      30% { opacity: 1;}
      100% { left: 110%; opacity: 0;}
    }
    .group:hover .glow {
      box-shadow: 0 0 20px 6px rgba(168,85,247,0.6), 0 0 10px 2px rgba(59,130,246,0.3);
      transition: box-shadow .3s;
    }
    .group.nature:hover .glow {
      box-shadow: 0 0 24px 8px rgba(34,197,94,0.5), 0 0 10px 2px rgba(16,185,129,0.25);
    }
    .group.city:hover .glow {
      box-shadow: 0 0 24px 8px rgba(59,130,246,0.5), 0 0 10px 2px rgba(30,64,175,0.25);
    }
    .group.people:hover .glow {
      box-shadow: 0 0 24px 8px rgba(236,72,153,0.45), 0 0 10px 2px rgba(219,39,119,0.2);
    }
    .group.abstract:hover .glow {
      box-shadow: 0 0 24px 8px rgba(234,179,8,0.5), 0 0 10px 2px rgba(202,138,4,0.18);
    }
    .hover-zoom:hover img { transform: scale(1.15); }
    .hover-zoomout:hover img { transform: scale(0.92); }
    .hover-move-up:hover img { transform: translateY(-18px); }
    .hover-move-right:hover img { transform: translateX(18px); }
    .hover-rotate:hover img { transform: rotate(6deg) scale(1.08);}
    .hover-tilt:hover img { transform: rotate(-7deg) scale(1.1);}
    .hover-blur:hover img { filter: blur(2.5px) brightness(1.1);}
    .hover-shadow-xl:hover img { box-shadow: 0 8px 32px 0 rgba(31,41,55,0.25); }
    .hover-grayscale:hover img { filter: grayscale(0.7) brightness(1.15);}
    .img-transition img {
      transition: transform 0.5s cubic-bezier(.16,1,.3,1), filter 0.5s cubic-bezier(.16,1,.3,1), box-shadow 0.5s, border-color 0.5s;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-100 via-purple-100 to-pink-100 min-h-screen">
  <div class="py-10 px-4 max-w-7xl mx-auto">
    <h1 class="font-extrabold text-4xl sm:text-5xl text-center text-purple-800 mb-8 drop-shadow-lg tracking-tight">Animated 100+ Image Gallery</h1>
    <div class="flex flex-wrap justify-center gap-4 mb-10">
      <button onclick="filterImages('all')" class="bg-purple-600 text-white px-4 py-2 rounded-full shadow hover:bg-purple-800 transition">All</button>
      <button onclick="filterImages('nature')" class="bg-green-600 text-white px-4 py-2 rounded-full shadow hover:bg-green-800 transition">Nature</button>
      <button onclick="filterImages('city')" class="bg-blue-600 text-white px-4 py-2 rounded-full shadow hover:bg-blue-800 transition">City</button>
      <button onclick="filterImages('people')" class="bg-pink-600 text-white px-4 py-2 rounded-full shadow hover:bg-pink-800 transition">People</button>
      <button onclick="filterImages('abstract')" class="bg-yellow-500 text-white px-4 py-2 rounded-full shadow hover:bg-yellow-700 transition">Abstract</button>
    </div>
    <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
    </div>
  </div>
  <script>
    function randInt(max) { return Math.floor(Math.random() * max); }
    const categories = ['nature', 'city', 'people', 'abstract'];
    const shapes = ['clip-hexagon', 'clip-circle', 'clip-diamond', 'rounded-3xl'];
    const hoverEffects = [
      'hover-zoom',
      'hover-zoomout',
      'hover-move-up',
      'hover-move-right',
      'hover-rotate',
      'hover-tilt',
      'hover-blur',
      'hover-shadow-xl',
      'hover-grayscale',
      'hover-zoom hover-move-up',
      'hover-zoom hover-rotate',
      'hover-grayscale hover-zoom',
      'hover-blur hover-zoomout',
      'hover-shadow-xl hover-rotate',
      'hover-move-up hover-tilt',
      'hover-zoomout hover-tilt',
    ];
    const images = [];
    for(let i=1; i<=104; i++) {
      const cat = categories[randInt(categories.length)];
      const shape = shapes[randInt(shapes.length)];
      const hover = hoverEffects[randInt(hoverEffects.length)];
      const url = `https://picsum.photos/seed/${cat}${i}/500/500`;
      images.push({
        id: i,
        url,
        cat,
        shape,
        hover
      });
    }
    function renderImages(filterCat='all') {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';
      images.forEach(img => {
        if(filterCat !== 'all' && img.cat !== filterCat) return;
        const borderColor = {
          nature: 'border-green-400',
          city: 'border-blue-400',
          people: 'border-pink-400',
          abstract: 'border-yellow-400'
        }[img.cat];
        const overlayColor = {
          nature: 'bg-green-200/40',
          city: 'bg-blue-200/40',
          people: 'bg-pink-200/40',
          abstract: 'bg-yellow-100/50'
        }[img.cat];
        gallery.innerHTML += `
          <div class="relative group ${img.cat} select-none cursor-pointer img-transition ${img.hover} w-48 h-48 mx-auto">
            <div class="absolute inset-0 glow ${borderColor} border-4 ${img.shape} pointer-events-none transition-shadow duration-300"></div>
            <div class="overflow-hidden w-full h-full ${img.shape}">
              <img src="${img.url}" alt="Image ${img.id}"
                class="w-full h-full object-cover shadow-lg ${img.shape} border-4 ${borderColor}" />
              <span class="shine ${img.shape}"></span>
              <div class="absolute inset-0 ${overlayColor} opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none mix-blend-multiply ${img.shape}"></div>
            </div>
            <span class="absolute bottom-2 left-1/2 -translate-x-1/2 bg-white/80 rounded-lg px-3 py-1 text-xs font-semibold text-gray-600 shadow backdrop-blur-md opacity-0 translate-y-4 group-hover:opacity-100 group-hover:translate-y-0 transition-all duration-500">
              ${img.cat.charAt(0).toUpperCase()+img.cat.slice(1)}
            </span>
          </div>
        `;
      });
    }
    function filterImages(cat) {
      renderImages(cat);
    }
    renderImages();
  </script>
</body>
</html>
