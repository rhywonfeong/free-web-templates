<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

<div class="flex justify-center items-center h-screen">
    <div class="w-full max-w-md bg-white shadow-lg rounded-lg border border-gray-200">
        <div class="p-4 border-b">
            <h1 class="text-xl font-bold text-gray-700">AI Chatbot</h1>
        </div>
        <div id="messages" class="p-4 h-96 overflow-y-auto space-y-2">
            <!-- Message bubbles go here -->
        </div>
        <div class="p-4 border-t flex">
            <input type="text" id="user-input" placeholder="Type your message..." class="w-full p-2 border border-gray-300 rounded-l-md focus:outline-none" />
            <button id="send-button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-r-md">Send</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('send-button').addEventListener('click', function() {
        const userInput = document.getElementById('user-input').value.trim();
        if (userInput) {
            displayMessage(`User: ${userInput}`, 'user');
            document.getElementById('user-input').value = '';
            // Simulating AI response for demonstration
            setTimeout(() => {
                displayMessage(`AI: 感谢您的消息，正在处理中...`, 'ai');
            }, 1000);
        }
    });

    function displayMessage(message, sender) {
        const messagesContainer = document.getElementById('messages');
        const messageElement = document.createElement('div');
        messageElement.classList.add('p-2', 'rounded-md', 'max-w-xs', 'text-sm', 'mx-auto');
        if (sender === 'user') {
            messageElement.classList.add('bg-blue-100', 'text-right');
        } else {
            messageElement.classList.add('bg-gray-200', 'text-left');
        }
        messageElement.textContent = message;
        messagesContainer.appendChild(messageElement);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
</script>

</body>
</html>
