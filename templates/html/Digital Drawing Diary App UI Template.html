<html lang="en"><head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pro Spectrum Diary</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root { --accent: #9168b7; --bg: #0d0d0d; --p-bg: #1a1a1a; --ink: #ffffff; }
body.light-mode { --bg: #f3f4f6; --p-bg: #ffffff; --ink: #1a1a1a; }
body {
background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif;
margin: 0; height: 100vh; overflow: hidden; touch-action: none; transition: 0.3s;
}
/* 3D Book Container */
#book {
perspective: 2000px; height: 55vh; width: 100vw;
display: flex; align-items: center; justify-content: center;
margin-top: 1vh; position: relative; z-index: 10;
}
.page {
position: absolute; width: 88vw; max-width: 360px; height: 50vh;
background: var(--p-bg); border: 1px solid rgba(128,128,128,0.2); border-radius: 16px;
box-shadow: 0 20px 50px rgba(0,0,0,0.5);
transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
transform-origin: left center; overflow: hidden;
backface-visibility: hidden;
}
.page.turned { transform: rotateY(-170deg); opacity: 0; pointer-events: none; }
canvas { position: absolute; top: 0; left: 0; touch-action: none; width: 100%; height: 100%; }
/* Navigation Overlay Buttons */
.nav-btn {
position: absolute; top: 50%; transform: translateY(-50%);
background: rgba(128,128,128,0.2); width: 40px; height: 40px;
border-radius: 50%; display: flex; align-items: center; justify-content: center;
z-index: 50; backdrop-filter: blur(5px);
}
/* Toolbar Styling */
.toolbar {
background: var(--p-bg); border-top: 1px solid rgba(128,128,128,0.2);
padding: 16px 16px 30px 16px; position: fixed; bottom: 0; width: 100%; z-index: 100;
border-radius: 32px 32px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
}
.palette-scroll {
display: flex; gap: 14px; overflow-x: auto; padding: 5px 0;
scrollbar-width: none; -ms-overflow-style: none;
}
.palette-scroll::-webkit-scrollbar { display: none; }
.color-node {
min-width: 34px; height: 34px; border-radius: 50%;
border: 2px solid rgba(128,128,128,0.3); flex-shrink: 0; transition: 0.2s;
}
.color-node.active { border-color: var(--accent); transform: scale(1.1); box-shadow: 0 0 15px var(--accent); }
.tool-btn {
width: 46px; height: 46px; border-radius: 14px; display: flex;
align-items: center; justify-content: center; background: rgba(128,128,128,0.1);
color: var(--ink); transition: 0.2s;
}
.tool-btn.active { background: var(--accent); color: white; transform: translateY(-2px); }
#stickerMenu {
display: none; position: fixed; bottom: 200px; left: 50%; transform: translateX(-50%);
background: var(--p-bg); padding: 20px; border-radius: 24px; border: 1px solid var(--accent);
grid-template-columns: repeat(4, 1fr); gap: 15px; z-index: 200; font-size: 28px;
box-shadow: 0 10px 50px rgba(0,0,0,0.8);
}
</style></head>
<body class="dark-mode">

    <header class="p-6 flex justify-between items-center z-50">
        <button onclick="toggleTheme()" class="text-[11px] font-bold uppercase bg-white/10 px-5 py-2.5 rounded-full backdrop-blur-md" id="themeBtn">Ivory Mode</button>
        <div class="flex gap-3">
             <button onclick="addNewPage()" class="text-[11px] bg-white/10 px-4 py-2.5 rounded-xl font-bold uppercase tracking-wider">New Page</button>
             <button onclick="exportCurrentPage()" class="bg-green-600 text-white w-10 h-10 rounded-xl flex items-center justify-center shadow-lg shadow-green-900/20"><i class="fas fa-download"></i></button>
        </div>
    </header>

    <div id="book">
        <button onclick="prevPage()" class="nav-btn left-4"><i class="fas fa-chevron-left text-xs"></i></button>
        <button onclick="nextPage()" class="nav-btn right-4"><i class="fas fa-chevron-right text-xs"></i></button>
    </div>

    <div id="stickerMenu">
        <span class="cursor-pointer active:scale-125 transition" onclick="dropSticker('✨')">✨</span>
        <span class="cursor-pointer active:scale-125 transition" onclick="dropSticker('🌙')">🌙</span>
        <span class="cursor-pointer active:scale-125 transition" onclick="dropSticker('💜')">💜</span>
        <span class="cursor-pointer active:scale-125 transition" onclick="dropSticker('🌸')">🌸</span>
        <span class="cursor-pointer active:scale-125 transition" onclick="dropSticker('🦋')">🦋</span>
        <span class="cursor-pointer active:scale-125 transition" onclick="dropSticker('🍃')">🍃</span>
        <span class="cursor-pointer active:scale-125 transition" onclick="dropSticker('🧸')">🧸</span>
        <span class="cursor-pointer active:scale-125 transition" onclick="dropSticker('☁️')">☁️</span>
    </div>

    <div class="toolbar">
        <div class="max-w-md mx-auto flex flex-col gap-5">
            
            <div class="flex items-center justify-between px-2">
                <div class="flex items-center gap-4 flex-1">
                    <i class="fas fa-sliders-h text-xs opacity-40"></i>
                    <input type="range" id="sizeSlider" min="1" max="50" value="4" class="w-full accent-[#9168b7]">
                </div>
                <div class="flex gap-5 ml-6">
                    <button onclick="toggleStickers()" class="text-[10px] opacity-70 font-black uppercase tracking-widest">Stickers</button>
                    <button onclick="undo()" class="text-[10px] text-purple-400 font-black uppercase tracking-widest">Undo</button>
                </div>
            </div>

            <div class="palette-scroll" id="spectrum"></div>

            <div class="flex justify-between items-center bg-white/5 p-2 rounded-2xl">
                <div class="flex gap-2">
                    <button id="penBtn" onclick="setTool('pen')" class="tool-btn active"><i class="fas fa-feather-alt"></i></button>
                    <button id="highlighterBtn" onclick="setTool('highlighter')" class="tool-btn"><i class="fas fa-highlighter"></i></button>
                    <button id="eraserBtn" onclick="setTool('eraser')" class="tool-btn"><i class="fas fa-eraser"></i></button>
                    <button id="rectBtn" onclick="setTool('rect')" class="tool-btn"><i class="far fa-square"></i></button>
                </div>
                <div class="flex gap-2 border-l border-white/10 pl-2">
                    <button onclick="prevPage()" class="tool-btn active:bg-white/20"><i class="fas fa-arrow-left"></i></button>
                    <button onclick="nextPage()" class="tool-btn active:bg-white/20"><i class="fas fa-arrow-right"></i></button>
                </div>
            </div>
            
            <p id="pageCounter" class="text-center text-[9px] font-bold uppercase tracking-[0.4em] opacity-30">Page 1 / 1</p>
        </div>
    </div>

    <script>
        let currentTool = 'pen', inkColor = '#ffffff', isDrawing = false;
        let pagesData = JSON.parse(localStorage.getItem('pro_diary_v2')) || [""];
        let undoStack = [];
        let startX, startY, tempCanvas;

        const colors = ['#ffffff', '#ffeb3b', '#ff9800', '#f44336', '#e91e63', '#9c27b0', '#673ab7', '#2196f3', '#00bcd4', '#4caf50', '#8bc34a', '#1a1a1a'];

        function init() {
            const spectrum = document.getElementById('spectrum');
            colors.forEach(c => {
                const node = document.createElement('div');
                node.className = 'color-node cursor-pointer';
                node.style.background = c;
                node.onclick = () => {
                    inkColor = c;
                    document.querySelectorAll('.color-node').forEach(n => n.classList.remove('active'));
                    node.classList.add('active');
                };
                if(c === '#ffffff') node.classList.add('active');
                spectrum.appendChild(node);
            });
            renderBook();
            window.addEventListener('resize', renderBook);
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeBtn').innerText = isLight ? "Onyx Mode" : "Ivory Mode";
            renderBook();
        }

        function setTool(t) {
            currentTool = t;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(t + 'Btn')?.classList.add('active');
        }

        function toggleStickers() {
            const menu = document.getElementById('stickerMenu');
            menu.style.display = menu.style.display === 'grid' ? 'none' : 'grid';
        }

        function dropSticker(emoji) {
            const currentIdx = document.querySelectorAll('.page.turned').length;
            const canvas = document.getElementById(`canvas-${currentIdx}`);
            const ctx = canvas.getContext('2d');
            ctx.font = "50px serif";
            ctx.textAlign = "center";
            ctx.fillText(emoji, canvas.width/2, canvas.height/2);
            saveState(currentIdx, canvas.toDataURL());
            toggleStickers();
        }

        function setupCanvas(cvs, data, idx) {
            const ctx = cvs.getContext('2d');
            const rect = cvs.parentElement.getBoundingClientRect();
            
            // Set internal resolution to match display size
            cvs.width = rect.width;
            cvs.height = rect.height;

            if (data && data !== "") { 
                const img = new Image(); 
                img.onload = () => ctx.drawImage(img, 0, 0, cvs.width, cvs.height); 
                img.src = data; 
            }

            const getPos = (e) => {
                const r = cvs.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - r.left, y: clientY - r.top };
            };

            const start = (e) => {
                isDrawing = true;
                const pos = getPos(e);
                startX = pos.x; startY = pos.y;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                tempCanvas = cvs.toDataURL();
            };

            const move = (e) => {
                if (!isDrawing) return;
                const pos = getPos(e);
                const size = document.getElementById('sizeSlider').value;
                
                ctx.lineWidth = size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                if (['pen', 'highlighter', 'eraser'].includes(currentTool)) {
                    ctx.globalAlpha = currentTool === 'highlighter' ? 0.3 : 1.0;
                    ctx.strokeStyle = currentTool === 'eraser' ? getComputedStyle(document.body).getPropertyValue('--p-bg') : inkColor;
                    if(currentTool === 'eraser') ctx.lineWidth = 40;
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                } else if(currentTool === 'rect') {
                    const img = new Image(); img.src = tempCanvas;
                    ctx.clearRect(0,0,cvs.width,cvs.height); 
                    ctx.drawImage(img,0,0);
                    ctx.globalAlpha = 1.0; ctx.strokeStyle = inkColor; 
                    ctx.strokeRect(startX, startY, pos.x-startX, pos.y-startY);
                }
            };

            const end = () => { if(isDrawing) { isDrawing = false; saveState(idx, cvs.toDataURL()); }};

            cvs.addEventListener('mousedown', start);
            window.addEventListener('mousemove', move);
            window.addEventListener('mouseup', end);
            cvs.addEventListener('touchstart', (e) => { start(e); e.preventDefault(); }, {passive: false});
            window.addEventListener('touchmove', (e) => { if(isDrawing) move(e); e.preventDefault(); }, {passive: false});
            window.addEventListener('touchend', end);
        }

        function saveState(idx, dataUrl) {
            pagesData[idx] = dataUrl;
            if(!undoStack[idx]) undoStack[idx] = [];
            undoStack[idx].push(dataUrl);
            if(undoStack[idx].length > 20) undoStack[idx].shift();
            localStorage.setItem('pro_diary_v2', JSON.stringify(pagesData));
        }

        function undo() {
            const currentIdx = document.querySelectorAll('.page.turned').length;
            if (undoStack[currentIdx]?.length > 1) {
                undoStack[currentIdx].pop();
                const prevState = undoStack[currentIdx][undoStack[currentIdx].length - 1];
                const canvas = document.getElementById(`canvas-${currentIdx}`);
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0,0,canvas.width,canvas.height);
                const img = new Image();
                img.onload = () => ctx.drawImage(img, 0, 0);
                img.src = prevState;
                pagesData[currentIdx] = prevState;
                localStorage.setItem('pro_diary_v2', JSON.stringify(pagesData));
            }
        }

        function exportCurrentPage() {
            const currentIdx = document.querySelectorAll('.page.turned').length;
            const canvas = document.getElementById(`canvas-${currentIdx}`);
            const temp = document.createElement('canvas');
            const tCtx = temp.getContext('2d');
            temp.width = canvas.width; temp.height = canvas.height;
            // Draw background color first
            tCtx.fillStyle = getComputedStyle(document.body).getPropertyValue('--p-bg');
            tCtx.fillRect(0,0,temp.width,temp.height);
            tCtx.drawImage(canvas, 0, 0);
            
            const link = document.createElement('a');
            link.download = `Diary_Page_${currentIdx + 1}_${Date.now()}.png`;
            link.href = temp.toDataURL('image/png');
            link.click();
        }

        function renderBook() {
            const container = document.getElementById('book');
            container.innerHTML = `
                <button onclick="prevPage()" class="nav-btn left-4"><i class="fas fa-chevron-left text-xs"></i></button>
                <button onclick="nextPage()" class="nav-btn right-4"><i class="fas fa-chevron-right text-xs"></i></button>
            `;
            pagesData.forEach((data, i) => {
                const div = document.createElement('div');
                div.className = 'page';
                div.style.zIndex = pagesData.length - i;
                const cvs = document.createElement('canvas');
                cvs.id = `canvas-${i}`;
                div.appendChild(cvs);
                container.appendChild(div);
                if(!undoStack[i]) undoStack[i] = [data || ""];
                setupCanvas(cvs, data, i);
            });
            updateCounter();
        }

        function updateCounter() {
            const current = document.querySelectorAll('.page.turned').length + 1;
            document.getElementById('pageCounter').innerText = `Page ${current} / ${pagesData.length}`;
        }

        function nextPage() { 
            const p = document.querySelectorAll('.page:not(.turned)'); 
            if (p.length > 1) { 
                p[0].classList.add('turned'); 
                setTimeout(updateCounter, 300);
            } 
        }

        function prevPage() { 
            const t = document.querySelectorAll('.page.turned'); 
            if (t.length > 0) { 
                t[t.length - 1].classList.remove('turned'); 
                setTimeout(updateCounter, 300);
            } 
        }

        function addNewPage() { 
            pagesData.push(""); 
            renderBook(); 
            // Smoothly move to the new page
            const turnInterval = setInterval(() => {
                const p = document.querySelectorAll('.page:not(.turned)');
                if(p.length > 1) nextPage();
                else clearInterval(turnInterval);
            }, 100);
        }

        init();
    </script>

</body></html>
