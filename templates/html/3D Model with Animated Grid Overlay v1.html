<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Background</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.grid-pattern {
background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0);
background-size: 24px 24px;
}
</style></head>
<body class="antialiased overflow-hidden bg-black">
    <!-- 3D Interactive Model Background -->
    <iframe 
        src="https://my.spline.design/aidatamodelinteraction-mdTL3FktFVHgDvFr5TKtnYDV" 
        frameborder="0" 
        width="100%" 
        height="100%" 
        class="fixed inset-0 w-full h-full -z-10">
    </iframe>
    
    <!-- Animated Grid Pattern Overlay -->
    <div class="fixed inset-0 grid-pattern" id="gridPattern"></div>

    <script>
        // Parallax effect for grid pattern
        window.addEventListener('scroll', () => {
            const scrolled = window.pageYOffset;
            const parallax = document.getElementById('gridPattern');
            const speed = scrolled * 0.5;
            
            if (parallax) {
                parallax.style.transform = `translateY(${speed}px)`;
            }
        });

        // Subtle animation for grid pattern
        let animationOffset = 0;
        function animateGrid() {
            animationOffset += 0.5;
            const gridPattern = document.getElementById('gridPattern');
            if (gridPattern) {
                gridPattern.style.backgroundPosition = `${Math.sin(animationOffset * 0.01) * 2}px ${Math.cos(animationOffset * 0.01) * 2}px`;
            }
            requestAnimationFrame(animateGrid);
        }
        
        animateGrid();
    </script>
</body>
</html>
