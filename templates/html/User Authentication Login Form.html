    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&family=Lora:ital,wght@0,400;1,400..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-primary-serif: 'Lora', serif;
            --font-style-pastel-ui: 'Nunito Sans', sans-serif;
            
            --font-current-main: var(--font-style-pastel-ui);
            --font-current-heading: var(--font-primary-serif);
            
            --bg-page: #fdf6f0;
            --bg-component: #ffffff;
            --bg-input: #fffefc;
            --bg-button-primary: #ff8c69;
            --bg-button-primary-hover: #ff7043;
            
            --text-primary: #6d5d52;
            --text-secondary: #938278;
            --text-muted: #b5a9a2;
            --text-heading: #5c4d44;
            --text-accent: var(--bg-button-primary);
            --text-on-button-primary: #ffffff;
            
            --border-color: #ffe8d9;
            --border-input: #ffe0c2;
            --border-input-focus: var(--text-accent);
            
            --border-radius-base: 10px;
            --border-radius-lg: 16px;
            --border-radius-sm: 4px;
            
            --shadow-color-rgb: 180, 160, 150;
            --shadow-xs: 0 1px 2px rgba(var(--shadow-color-rgb), 0.03);
            --shadow-sm: 0 3px 6px rgba(var(--shadow-color-rgb), 0.08);
            --shadow-md: 0 6px 12px rgba(var(--shadow-color-rgb), 0.1);
            --shadow-lg: 0 10px 20px rgba(var(--shadow-color-rgb), 0.12);
            
            --focus-ring-color: rgba(255, 140, 105, 0.3);
            --focus-ring-width: 3px;
            
            --transition-speed-fast: 0.15s;
            --transition-speed-normal: 0.25s;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-current-main);
            background-color: var(--bg-page);
            color: var(--text-primary);
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        
        .login-form-wrapper {
            background-color: var(--bg-component);
            padding: 30px 40px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--border-color);
            transition: all var(--transition-speed-normal);
        }
        
        .login-form-logo {
            display: flex;
            width: 60px;
            height: 60px;
            background: var(--text-accent);
            color: var(--text-on-button-primary);
            border-radius: 50%;
            margin: 0 auto 20px;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            text-decoration: none;
            transition: all var(--transition-speed-normal);
        }
        
        .login-form-title {
            font-family: var(--font-current-heading);
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--text-heading);
            text-align: center;
            margin-bottom: 25px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border: 1px solid var(--border-input);
            border-radius: var(--border-radius-base);
            background-color: var(--bg-input);
            color: var(--text-primary);
            transition: all var(--transition-speed-fast);
            box-shadow: var(--shadow-xs);
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--border-input-focus);
            box-shadow: 0 0 0 var(--focus-ring-width) var(--focus-ring-color), var(--shadow-sm);
        }
        
        .form-control::placeholder {
            color: var(--text-muted);
            opacity: 1;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        
        .form-check-label {
            display: flex;
            align-items: center;
            color: var(--text-secondary);
            cursor: pointer;
        }
        
        .form-check-input {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 1px solid var(--border-input);
            border-radius: var(--border-radius-sm);
            margin-right: 8px;
            cursor: pointer;
            position: relative;
            background-color: var(--bg-input);
            transition: background-color var(--transition-speed-fast), border-color var(--transition-speed-fast);
            box-shadow: var(--shadow-xs);
        }
        
        .form-check-input:checked {
            background-color: var(--text-accent);
            border-color: var(--text-accent);
            box-shadow: none;
        }
        
        .form-check-input:checked::before {
            content: '✔';
            color: var(--text-on-button-primary);
            font-size: 12px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.1);
            line-height: 1;
            font-weight: bold;
        }
        
        .form-link {
            color: var(--text-accent);
            text-decoration: none;
            font-weight: 500;
        }
        
        .form-link:hover {
            text-decoration: underline;
        }
        
        .c-btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            border-radius: var(--border-radius-base);
            cursor: pointer;
            transition: all var(--transition-speed-fast);
            border: 1px solid transparent;
            box-shadow: var(--shadow-sm);
        }
        
        .c-btn-primary {
            background: var(--bg-button-primary);
            color: var(--text-on-button-primary);
        }
        
        .c-btn-primary:hover {
            background: var(--bg-button-primary-hover);
            transform: translateY(-2px) scale(1.01);
            box-shadow: var(--shadow-md);
        }
        
        .form-footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        @media (max-width: 480px) {
            .login-form-wrapper {
                padding: 20px;
            }
            
            .form-control, .c-btn {
                font-size: 0.95rem;
                padding: 10px 12px;
            }
            
            .form-options {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="login-form-wrapper">
        <a href="#" class="login-form-logo">L</a>
        <h3 class="login-form-title">Welcome Back!</h3>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="stacked-email">Email Address</label>
                <input type="email" id="stacked-email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="stacked-password">Password</label>
                <input type="password" id="stacked-password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-options">
                <label class="form-check-label" for="stacked-remember">
                    <input type="checkbox" id="stacked-remember" name="remember" class="form-check-input">
                    Remember me
                </label>
                <a href="#" class="form-link">Forgot password?</a>
            </div>
            <button type="submit" class="c-btn c-btn-primary">Sign In</button>
            <p class="form-footer-text">
                Don't have an account? <a href="#" class="form-link">Sign up</a>
            </p>
        </form>
    </div>
</body>
</html>
