    rel="stylesheet"
  />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#FF3B9A",
            secondary: "#7928CA",
          },
          fontFamily: {
            sans: ["Inter", "sans-serif"],
          },

<body class="font-sans bg-gradient-to-br from-white via-purple-50 to-blue-50 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-4xl w-full rounded-2xl shadow-xl overflow-hidden bg-white/60 backdrop-blur-sm flex flex-col md:flex-row relative">
    <!-- Left section: login form -->
    <div class="w-full md:w-1/2 p-10 md:p-16 relative z-10">
      <!-- Header -->
      <div class="mb-12 text-center">
        <div class="inline-flex items-center justify-center">
          <div
            class="h-12 w-12 rounded-full bg-gradient-to-r from-primary to-secondary flex items-center justify-center"
          >
            <div class="h-3 w-3 rounded-full bg-white"></div>
          </div>
          <span class="ml-3 text-2xl font-semibold text-gray-900 select-none">Serendipity</span>
        </div>
      </div>

      <h2 class="text-3xl font-bold text-gray-900 mb-8">Welcome back</h2>

      <form class="space-y-6" novalidate>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-800 mb-1">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
            placeholder="Enter your email"
            class="w-full px-4 py-2 bg-white/90 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors"
          />
        </div>

        <div>
          <div class="flex items-center justify-between mb-1">
            <label for="password" class="block text-sm font-medium text-gray-800">Password</label>
            <a href="#" class="text-sm text-primary hover:text-secondary transition-colors">Forgot password?</a>
          </div>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
            placeholder="Enter your password"
            class="w-full px-4 py-2 bg-white/90 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-colors"
          />
        </div>

        <div class="flex items-center">
          <input
            id="remember-me"
            name="remember-me"
            type="checkbox"
            class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
          />
          <label for="remember-me" class="ml-2 block text-sm text-gray-700 select-none">
            Remember me
          </label>
        </div>

        <button
          type="submit"
          class="w-full bg-gradient-to-r from-primary to-secondary hover:from-pink-600 hover:to-purple-700 text-white font-medium py-3 rounded-lg shadow-md transition duration-300"
        >
          Sign in
        </button>
      </form>

      <div class="mt-8 flex items-center">
        <hr class="flex-grow border-gray-300" />
        <span class="mx-4 text-gray-600 text-sm whitespace-nowrap">Or continue with</span>
        <hr class="flex-grow border-gray-300" />
      </div>

      <div class="grid grid-cols-3 gap-3 mt-6">
        <button
          aria-label="Continue with Google"
          class="flex justify-center items-center py-2 px-4 border border-gray-300 rounded-lg shadow-sm bg-white hover:bg-gray-50 transition-colors"
          type="button"
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path

            />
            <path

              fill="#EA4335"
            />
          </svg>
        </button>
        <button
          aria-label="Continue with Facebook"
          class="flex justify-center items-center py-2 px-4 border border-gray-300 rounded-lg shadow-sm bg-white hover:bg-gray-50 transition-colors"
          type="button"
        >
          <svg
            class="h-5 w-5 text-[#1877F2]"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"
            />
          </svg>
        </button>
        <button
          aria-label="Continue with GitHub"
          class="flex justify-center items-center py-2 px-4 border border-gray-300 rounded-lg shadow-sm bg-white hover:bg-gray-50 transition-colors"
          type="button"
        >
          <svg
            class="h-5 w-5"
            fill="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              fill-rule="evenodd"
              d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
              clip-rule="evenodd"
            ></path>
          </svg>
        </button>
      </div>

      <p class="text-center text-sm text-gray-700 mt-8 select-none">
        Don't have an account?
        <a href="#" class="text-primary font-medium hover:text-secondary transition-colors">Sign up</a>
      </p>
    </div>

    <!-- Right section: Vanta Birds effect -->
    <div id="vanta-birds" class="hidden md:block w-1/2 h-[600px] relative">
      <!-- Overlay for subtle dark */}
      <div class="absolute inset-0 bg-black/20 z-10 rounded-r-2xl"></div>
      <!-- Content on top if needed -->
      <div class="absolute inset-0 flex flex-col items-center justify-center text-white z-20 px-10 select-none">
        <h2 class="text-4xl font-bold mb-4 bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent text-center">
          Welcome to Serendipity
        </h2>
        <p class="text-center max-w-md text-lg">
          Imagine with us — unlock creativity and craft your unique vision with AI-powered tools.
        </p>
      </div>
    </div>
  </div>

  <script>
    VANTA.BIRDS({
      el: "#vanta-birds",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.0,
      minWidth: 200.0,
      scale: 1.0,
      scaleMobile: 1.0,
      backgroundAlpha: 0, // transparent overlay handled by bg-black/20
      color1: 0xff3b9a,
      color2: 0x7928ca,
      birdSize: 1.5,
      wingSpan: 20.0,
      speedLimit: 4.0,
      separation: 60.0,
      quantity: 4.0,
    });
  </script>
</body>
</html>
