<body class="text-stone-900 antialiased selection:bg-stone-200 selection:text-stone-900">

    <!-- Minimal Header -->
    <header class="w-full flex justify-between items-center px-6 py-8 md:px-12 lg:px-20 border-b border-stone-200/50">
        <div class="text-xs font-normal tracking-tighter uppercase text-stone-900">S N C T R Y</div>
        <div class="text-xs font-normal tracking-widest text-stone-500 uppercase">Gallery</div>
    </header>

    <main class="w-full max-w-[1600px] mx-auto px-6 md:px-12 lg:px-20 py-16 md:py-24 lg:py-32">
        
        <!-- Section Intro -->
        <div class="max-w-2xl mb-16 lg:mb-24">
            <h1 class="text-4xl md:text-5xl lg:text-6xl font-normal tracking-tight text-stone-900 mb-6">
                Cultivated Stillness
            </h1>
            <p class="text-base md:text-lg text-stone-500 leading-relaxed font-light max-w-lg">
                A visual journal of our spaces. Designed to foster clarity, grounding, and an unbroken connection with the natural environment.
            </p>
        </div>

        <!-- Strict Grid System -->
        <!-- Using a 4-column grid for absolute order, with equal gaps -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 md:gap-8 items-start">

            <!-- ROW 1 -->
            
            <!-- Item 1.1: Tall Portrait -->
            <div class="w-full flex flex-col gap-4">
                <div class="w-full aspect-[3/4] overflow-hidden bg-stone-100 rounded-md">
                    <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/917d6f93-fb36-439a-8c48-884b67b35381_1600w.jpg" 
                         class="w-full h-full object-cover transition-transform duration-[3s] ease-out hover:scale-105" 
                         alt="Minimalist interior detail">
                </div>
                <div class="flex items-center gap-3">
                    <span class="w-4 h-[1px] bg-stone-300"></span>
                    <span class="text-xs text-stone-400 font-normal uppercase tracking-widest">Texture</span>
                </div>
            </div>

            <!-- Item 1.2: Intentional Gap (Occupies 1 column) -->
            <div class="hidden lg:block w-full h-full"></div>

            <!-- Item 1.3: Standard Portrait -->
            <div class="w-full flex flex-col gap-4">
                 <div class="w-full aspect-[4/5] overflow-hidden bg-stone-100 rounded-md">
                     <img src="https://images.unsplash.com/photo-1616627547584-bf28cee262db?q=80&w=1974&auto=format&fit=crop" 
                          class="w-full h-full object-cover transition-transform duration-[3s] ease-out hover:scale-105" 
                          alt="Soft linens and light">
                </div>
            </div>

            <!-- Item 1.4: Deep Portrait -->
            <div class="w-full flex flex-col gap-4">
                <div class="w-full aspect-[2/3] overflow-hidden bg-stone-100 rounded-md">
                     <img src="https://images.unsplash.com/photo-1509587584298-0f3b3a3a1797?q=80&w=1913&auto=format&fit=crop" 
                          class="w-full h-full object-cover transition-transform duration-[3s] ease-out hover:scale-105" 
                          alt="Close up of organic natural forms">
                </div>
            </div>

            <!-- ROW 2 -->

            <!-- Item 2.1: Landscape (Spans 2 columns for balance against portraits) -->
            <div class="w-full flex flex-col gap-4 md:col-span-2">
                <div class="w-full aspect-[16/9] lg:aspect-[21/9] overflow-hidden bg-stone-100 rounded-md">
                     <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?q=80&w=2020&auto=format&fit=crop" 
                          class="w-full h-full object-cover transition-transform duration-[3s] ease-out hover:scale-105" 
                          alt="Serene landscape with water">
                </div>
            </div>

            <!-- Item 2.2: Standard Portrait -->
            <div class="w-full flex flex-col gap-4">
                <div class="w-full aspect-[4/5] overflow-hidden bg-stone-100 rounded-md">
                     <img src="https://images.unsplash.com/photo-1600607686527-6fb886090705?q=80&w=2053&auto=format&fit=crop" 
                          class="w-full h-full object-cover transition-transform duration-[3s] ease-out hover:scale-105" 
                          alt="Modern architecture exterior">
                </div>
                <div class="flex items-center gap-3">
                    <span class="w-4 h-[1px] bg-stone-300"></span>
                    <span class="text-xs text-stone-400 font-normal uppercase tracking-widest">Grounding</span>
                </div>
            </div>

            <!-- Item 2.3: Square -->
            <div class="w-full flex flex-col gap-4">
                <div class="w-full aspect-square overflow-hidden bg-stone-100 rounded-md">
                     <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/4734259a-bad7-422f-981e-ce01e79184f2_1600w.jpg" 
                          class="w-full h-full object-cover object-bottom transition-transform duration-[3s] ease-out hover:scale-105" 
                          alt="Yoga and meditation space">
                </div>
            </div>

            <!-- ROW 3 -->

            <!-- Item 3.1: Intentional Gap (Occupies 1 column) -->
            <div class="hidden lg:block w-full h-full"></div>

            <!-- Item 3.2: Square -->
            <div class="w-full flex flex-col gap-4">
                <div class="w-full aspect-[4/5] lg:aspect-square overflow-hidden bg-stone-100 rounded-md">
                     <img src="https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?q=80&w=2000&auto=format&fit=crop" 
                          class="w-full h-full object-cover transition-transform duration-[3s] ease-out hover:scale-105" 
                          alt="Minimal living space">
                </div>
                <div class="flex items-center gap-3">
                    <span class="w-4 h-[1px] bg-stone-300"></span>
                    <span class="text-xs text-stone-400 font-normal uppercase tracking-widest">Balance</span>
                </div>
            </div>

            <!-- Item 3.3: Cinematic Landscape (Spans 2 columns) -->
            <div class="w-full flex flex-col gap-4 md:col-span-2">
                <div class="w-full aspect-[4/3] lg:aspect-[16/9] overflow-hidden bg-stone-100 rounded-md">
                     <img src="https://images.unsplash.com/photo-1510798831971-661eb04b3739?q=80&w=2000&auto=format&fit=crop" 
                          class="w-full h-full object-cover transition-transform duration-[3s] ease-out hover:scale-105" 
                          alt="Foggy minimalist landscape">
                </div>
            </div>

            <!-- ROW 4 -->

            <!-- Item 4.1: Standard Portrait -->
            <div class="w-full flex flex-col gap-4">
                <div class="w-full aspect-[4/5] overflow-hidden bg-stone-100 rounded-md">
                     <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=2070&auto=format&fit=crop" 
                          class="w-full h-full object-cover transition-transform duration-[3s] ease-out hover:scale-105" 
                          alt="Neutral interior details">
                </div>
            </div>

            <!-- Item 4.2: Intentional Gap -->
            <div class="hidden lg:block w-full h-full"></div>

            <!-- Item 4.3: Tall Portrait -->
            <div class="w-full flex flex-col gap-4">
                <div class="w-full aspect-[3/4] overflow-hidden bg-stone-100 rounded-md">
                     <img src="https://images.unsplash.com/photo-1445053023192-8d45cb66099d?q=80&w=2000&auto=format&fit=crop" 
                          class="w-full h-full object-cover transition-transform duration-[3s] ease-out hover:scale-105" 
                          alt="Misty forest trees">
                </div>
                <div class="flex items-center gap-3">
                    <span class="w-4 h-[1px] bg-stone-300"></span>
                    <span class="text-xs text-stone-400 font-normal uppercase tracking-widest">Breath</span>
                </div>
            </div>

            <!-- Item 4.4: Intentional Gap -->
            <div class="hidden lg:block w-full h-full"></div>

        </div>

        <!-- Footer / End mark -->
        <div class="w-full flex justify-center mt-24 md:mt-32 lg:mt-40">
            <div class="w-1.5 h-1.5 rounded-full bg-stone-200"></div>
        </div>

    </main>
