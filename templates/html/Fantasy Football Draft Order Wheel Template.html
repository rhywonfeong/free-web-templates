    <script>
      // --- State Management ---
      let initialPlayers = [
          "John Doe", "Mike Smith", "Sarah Jones", "Chris Wilson",
          "Alex Johnson", "Ryan Davis", "Emily Brown", "David Miller",
          "James Taylor", "Matt Anderson"
      ];

      let activePlayers = [...initialPlayers];
      let draftedPlayers = [];
      let currentRotation = 0;
      let isSpinning = false;

      // --- DOM Elements ---
      const wheelSvg = document.getElementById('wheel-svg');
      const playerInput = document.getElementById('player-input');
      const spinBtn = document.getElementById('spin-btn');
      const resetBtn = document.getElementById('reset-btn');
      const draftList = document.getElementById('draft-list');
      const emptyState = document.getElementById('empty-state');
      const draftCount = document.getElementById('draft-count');
      const audioEl = document.getElementById('draft-sound');

      // --- Colors ---
      const colorNavy = "#0B162C";
      const colorOrange = "#D4AF37";

      // --- Initialization ---
      playerInput.value = initialPlayers.join('\n');

      // --- Event Listeners ---
      playerInput.addEventListener('input', handleInput);
      spinBtn.addEventListener('click', spinWheel);
      resetBtn.addEventListener('click', resetDraft);

      // --- Audio Synthesizer (Fallback if no audio element/file) ---
      function playStadiumHorn() {
          if (audioEl) {
              audioEl.currentTime = 0;
              audioEl.play().catch(e => console.log("Audio play prevented:", e));
              return;
          }
          try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc1 = ctx.createOscillator();
              const osc2 = ctx.createOscillator();
              const osc3 = ctx.createOscillator();
              const gain = ctx.createGain();
              osc1.type = 'sawtooth';
              osc2.type = 'sawtooth';
              osc3.type = 'square';
              osc1.frequency.setValueAtTime(150, ctx.currentTime);
              osc2.frequency.setValueAtTime(189, ctx.currentTime);
              osc3.frequency.setValueAtTime(225, ctx.currentTime);
              osc1.frequency.exponentialRampToValueAtTime(130, ctx.currentTime + 1.5);
              osc2.frequency.exponentialRampToValueAtTime(160, ctx.currentTime + 1.5);
              osc3.frequency.exponentialRampToValueAtTime(190, ctx.currentTime + 1.5);
              gain.gain.setValueAtTime(0, ctx.currentTime);
              gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + 0.1);
              gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 1.5);
              osc1.connect(gain);
              osc2.connect(gain);
              osc3.connect(gain);
              gain.connect(ctx.destination);
              osc1.start();
              osc2.start();
              osc3.start();
              osc1.stop(ctx.currentTime + 1.5);
              osc2.stop(ctx.currentTime + 1.5);
              osc3.stop(ctx.currentTime + 1.5);
          } catch (e) {
              console.log("Web Audio API not supported or blocked.");
          }
      }

      function playTick() {
          try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(800, ctx.currentTime);
              gain.gain.setValueAtTime(0.1, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.05);
          } catch (e) {}
      }

      // --- Logic Functions ---

      function handleInput() {
          if (isSpinning) return;
          const text = playerInput.value;
          activePlayers = text.split('\n').map(n => n.trim()).filter(n => n.length > 0);
          renderWheel();
          updateSpinButton();
      }

      function getArcPath(cx, cy, r, startAngle, endAngle) {
          const startRad = (startAngle - 90) * Math.PI / 180.0;
          const endRad = (endAngle - 90) * Math.PI / 180.0;
          const x1 = cx + (r * Math.cos(startRad));
          const y1 = cy + (r * Math.sin(startRad));
          const x2 = cx + (r * Math.cos(endRad));
          const y2 = cy + (r * Math.sin(endRad));
          const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
          return `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;
      }

      function renderWheel() {
          wheelSvg.innerHTML = '';
          const numPlayers = activePlayers.length;
          if (numPlayers === 0) {
              const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
              circle.setAttribute("cx", "50");
              circle.setAttribute("cy", "50");
              circle.setAttribute("r", "50");
              circle.setAttribute("fill", "#0A1120");
              wheelSvg.appendChild(circle);
              return;
          }
          if (numPlayers === 1) {
              const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
              circle.setAttribute("cx", "50");
              circle.setAttribute("cy", "50");
              circle.setAttribute("r", "50");
              circle.setAttribute("fill", colorNavy);
              wheelSvg.appendChild(circle);
              addTextToSvg(activePlayers[0], 0, 360, colorNavy);
              return;
          }
          const sliceAngle = 360 / numPlayers;
          activePlayers.forEach((player, i) => {
              const startAngle = i * sliceAngle;
              const endAngle = (i + 1) * sliceAngle;
              const color = i % 2 === 0 ? colorNavy : colorOrange;
              const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
              path.setAttribute("d", getArcPath(50, 50, 50, startAngle, endAngle));
              path.setAttribute("fill", color);
              path.setAttribute("stroke", "#ffffff");
              path.setAttribute("stroke-width", "0.2");
              wheelSvg.appendChild(path);
              addTextToSvg(player, startAngle, endAngle, color);
          });
      }

      function addTextToSvg(textStr, startAngle, endAngle, bgColor) {
          const midAngle = startAngle + (endAngle - startAngle) / 2;
          const renderAngle = midAngle - 90;
          const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
          text.setAttribute("x", "90");
          text.setAttribute("y", "51.5");
          text.setAttribute("fill", bgColor === colorNavy ? "#ffffff" : "#0B162C");
          text.setAttribute("font-size", "4.8");
          text.setAttribute("font-family", "Montserrat, system-ui, sans-serif");
          text.setAttribute("font-weight", "700");
          text.setAttribute("alignment-baseline", "middle");
          text.setAttribute("text-anchor", "end");
          text.setAttribute("letter-spacing", "0.05em");
          const displayStr = textStr.length > 15 ? textStr.substring(0, 13) + '...' : textStr;
          text.textContent = displayStr.toUpperCase();
          text.setAttribute("transform", `rotate(${renderAngle}, 50, 50)`);
          wheelSvg.appendChild(text);
      }

      function updateSpinButton() {
          if (activePlayers.length === 0) {
              spinBtn.disabled = true;
              spinBtn.innerHTML = `<iconify-icon icon="solar:close-circle-linear" stroke-width="2"></iconify-icon> WHEEL EMPTY`;
          } else if (activePlayers.length === 1 && draftedPlayers.length > 0) {
              spinBtn.disabled = false;
              spinBtn.innerHTML = `<iconify-icon icon="solar:check-circle-linear" stroke-width="2"></iconify-icon> AUTO-DRAFT LAST`;
          } else {
              spinBtn.disabled = false;
              spinBtn.innerHTML = `<iconify-icon icon="solar:restart-circle-linear" stroke-width="2"></iconify-icon> ON THE CLOCK`;
          }
      }

      function spinWheel() {
          if (isSpinning || activePlayers.length === 0) return;
          if (activePlayers.length === 1) {
              const winner = activePlayers[0];
              activePlayers = [];
              handleWin(winner);
              return;
          }
          isSpinning = true;
          spinBtn.disabled = true;

          if (audioEl) {
              audioEl.play().then(() => { audioEl.pause(); audioEl.currentTime = 0; }).catch(() => {});
          }

          const extraSpins = Math.floor(Math.random() * 5 + 5) * 360;
          const randomDegree = Math.floor(Math.random() * 360);
          const targetRotation = currentRotation + extraSpins + randomDegree;

          let tickInterval = setInterval(playTick, 150);
          setTimeout(() => clearInterval(tickInterval), 4000);

          wheelSvg.style.transform = `rotate(${targetRotation}deg)`;

          setTimeout(() => {
              const sliceAngle = 360 / activePlayers.length;
              const normalizedAngle = (360 - (targetRotation % 360)) % 360;
              const winningIndex = Math.floor(normalizedAngle / sliceAngle);
              const winner = activePlayers[winningIndex];

              playStadiumHorn();

              if (typeof confetti === 'function') {
                  confetti({
                      particleCount: 150,
                      spread: 80,
                      origin: { y: 0.6 },
                      colors: ['#D4AF37', '#0B162C', '#ffffff', '#C0C0C0']
                  });
              }

              wheelSvg.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
              wheelSvg.style.transform = `rotate(${targetRotation}deg) scale(1.05)`;
              wheelSvg.style.boxShadow = "0 0 60px rgba(212,175,55,0.8)";

              setTimeout(() => {
                  wheelSvg.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.15, 1)';
                  wheelSvg.style.transform = `rotate(${targetRotation}deg) scale(1)`;
                  wheelSvg.style.boxShadow = "";

                  currentRotation = targetRotation;
                  activePlayers.splice(winningIndex, 1);
                  handleWin(winner);

                  isSpinning = false;
              }, 800);

          }, 5000);
      }

      function handleWin(winnerName) {
          draftedPlayers.push(winnerName);
          playerInput.value = activePlayers.join('\n');
          renderWheel();
          renderDraftList();
          updateSpinButton();
      }

      function renderDraftList() {
          Array.from(draftList.children).forEach(child => {
              if(child.id !== 'empty-state') child.remove();
          });
          if (draftedPlayers.length > 0) {
              emptyState.style.display = 'none';
          } else {
              emptyState.style.display = 'flex';
          }
          draftCount.textContent = `${draftedPlayers.length} PICK${draftedPlayers.length !== 1 ? 'S' : ''}`;
          draftedPlayers.forEach((player, index) => {
              const pickNum = index + 1;
              const item = document.createElement('div');
              item.className = "flex items-center gap-4 p-4 bg-gradient-to-r from-[#0B162C] to-[#050A15] border border-[#ffffff]/10 rounded-2xl shadow-[0_4px_15px_rgba(0,0,0,0.3)] animate-fade-in mb-3 last:mb-0 transition-transform transform hover:scale-[1.02] duration-200";
              const numBadge = document.createElement('div');
              numBadge.className = "w-10 h-10 md:w-12 md:h-12 rounded-full bg-gradient-to-br from-[#D4AF37] to-[#B38D22] flex flex-shrink-0 items-center justify-center text-lg md:text-xl font-bebas text-[#0B162C] shadow-[0_0_15px_rgba(212,175,55,0.4)] border border-[#FFF8DC]/30";
              numBadge.textContent = pickNum;
              const nameEl = document.createElement('div');
              nameEl.className = "text-[15px] md:text-[16px] font-semibold text-white tracking-wide truncate font-montserrat";
              nameEl.textContent = player;
              if (pickNum === 1) {
                  numBadge.classList.replace('from-[#D4AF37]', 'from-[#FFFFFF]');
                  numBadge.classList.replace('to-[#B38D22]', 'to-[#C0C0C0]');
                  numBadge.classList.replace('shadow-[0_0_15px_rgba(212,175,55,0.4)]', 'shadow-[0_0_20px_rgba(255,255,255,0.5)]');
                  numBadge.classList.replace('border-[#FFF8DC]/30', 'border-[#FFFFFF]/50');
                  const star = document.createElement('iconify-icon');
                  star.setAttribute('icon', 'solar:crown-bold');
                  star.className = "text-[#D4AF37] ml-auto text-2xl md:text-3xl drop-shadow-[0_0_10px_rgba(212,175,55,0.8)]";
                  item.appendChild(numBadge);
                  item.appendChild(nameEl);
                  item.appendChild(star);
              } else {
                  item.appendChild(numBadge);
                  item.appendChild(nameEl);
              }
              draftList.appendChild(item);
              draftList.scrollTop = draftList.scrollHeight;
          });
      }

      function resetDraft() {
          if (isSpinning) return;
          if (!confirm("Are you sure you want to reset the entire draft order?")) return;
          activePlayers = [...initialPlayers];
          draftedPlayers = [];
          currentRotation = 0;
          wheelSvg.style.transition = 'none';
          wheelSvg.style.transform = `rotate(0deg)`;
          void wheelSvg.offsetWidth;
          wheelSvg.style.transition = 'transform 5s cubic-bezier(0.15, 0.85, 0.15, 1)';
          playerInput.value = activePlayers.join('\n');
          renderWheel();
          renderDraftList();
          updateSpinButton();
      }

      renderWheel();
      updateSpinButton();
    </script>
  </body>
</html>
