    <script>
        (function() {
            const init = () => {
                const canvas = document.getElementById('nebulaCanvas-aura-emnkzi4b0l0o291x');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;
                let width, height;
                let particles = [];
                
                function resize() {
                    const rect = canvas.parentElement.getBoundingClientRect();
                    width = rect.width;
                    height = rect.height;
                    canvas.width = width * window.devicePixelRatio;
                    canvas.height = height * window.devicePixelRatio;
                    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
                }
                window.addEventListener('resize', resize);
                resize();
                class Particle {
                    constructor() {
                        this.x = Math.random() * width;
                        this.y = Math.random() * height;
                        this.size = Math.random() * 2 + 0.5;
                        this.speedX = (Math.random() - 0.5) * 0.3;
                        this.speedY = (Math.random() - 0.5) * 0.3;
                        this.life = Math.random() * 100;
                        this.maxLife = 100 + Math.random() * 100;
                        this.alpha = 0;
                        this.baseAlpha = Math.random() * 0.5 + 0.2;
                    }
                    update() {
                        this.x += this.speedX;
                        this.y += this.speedY;
                        this.life++;
                        if (this.life < 50) {
                            this.alpha = (this.life / 50) * this.baseAlpha;
                        } else if (this.life > this.maxLife - 50) {
                            this.alpha = ((this.maxLife - this.life) / 50) * this.baseAlpha;
                        } else {
                            this.alpha = this.baseAlpha;
                        }
                        if (this.life >= this.maxLife || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                            this.x = Math.random() * width;
                            this.y = Math.random() * height;
                            this.life = 0;
                            this.maxLife = 100 + Math.random() * 100;
                            this.speedX = (Math.random() - 0.5) * 0.3;
                            this.speedY = (Math.random() - 0.5) * 0.3;
                        }
                    }
                    draw() {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, this.alpha)})`;
                        ctx.fill();
                        ctx.shadowBlur = 5;
                        ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
                    }
                }
                for (let i = 0; i < 40; i++) {
                    particles.push(new Particle());
                }
                const smokeLayer = document.getElementById('smokeLayer-aura-emnkzi4b0l0o291x');
                let time = 0;
                let animationFrameId;
                function animate() {
                    if (!document.getElementById('nebulaCanvas-aura-emnkzi4b0l0o291x')) {
                        cancelAnimationFrame(animationFrameId);
                        return;
                    }
                    ctx.clearRect(0, 0, width, height);
                    particles.forEach(p => {
                        p.update();
                        p.draw();
                    });
                    time += 0.01;
                    const offsetX = Math.sin(time) * 10;
                    const offsetY = Math.cos(time * 0.8) * 10;
                    if (smokeLayer) {
                        smokeLayer.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${time * 5}deg)`;
                    }
                    animationFrameId = requestAnimationFrame(animate);
                }
                animate();
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                setTimeout(init, 50);
            }
        })();
    </script>

    <!-- Star Generation Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sky = document.getElementById('starry-sky');
            const numStars = 180;
            const fragment = document.createDocumentFragment();

            // Generate static and twinkling stars
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                
                // Random properties
                const size = Math.random() * 1.5 + 0.5;
                const top = Math.random() * 100;
                const left = Math.random() * 100;
                const duration = Math.random() * 4 + 2;
                const delay = Math.random() * 5;
                const animationType = Math.floor(Math.random() * 3) + 1;
                
                // Base classes
                star.className = 'absolute rounded-full bg-white';
                
                // Randomly add glow effects
                if (Math.random() > 0.8) star.classList.add('star-glow');
                if (Math.random() > 0.95) star.classList.add('star-super-glow');
                
                // Apply inline styles
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${top}%`;
                star.style.left = `${left}%`;
                star.style.animation = `twinkle-${animationType} ${duration}s ease-in-out ${delay}s infinite`;
                
                fragment.appendChild(star);
            }
            
            sky.appendChild(fragment);

            // Add occasional shooting stars
            setInterval(() => {
                const shootingStar = document.createElement('div');
                shootingStar.className = 'absolute bg-gradient-to-r from-transparent via-white to-white';
                shootingStar.style.height = '1px';
                
                // Start position (mostly top right)
                shootingStar.style.top = `${Math.random() * 40}%`;
                shootingStar.style.left = `${Math.random() * 40 + 60}%`;
                
                // Animation
                shootingStar.style.animation = `shooting-star 2s linear forwards`;
                
                sky.appendChild(shootingStar);
                
                // Cleanup
                setTimeout(() => {
                    if(shootingStar.parentNode) {
                        shootingStar.remove();
                    }
                }, 2000);
            }, 5000);
        });
    </script>
