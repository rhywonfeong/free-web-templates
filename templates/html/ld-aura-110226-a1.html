<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>LiveDesk OS</title>
<meta name="theme-color" content="#000000">
<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<!-- Tailwind & Libraries -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<!-- Alpine -->
<script defer="" src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
<style>
/* Base & Reset */
body { font-family: 'Inter', sans-serif; overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-font-smoothing: antialiased; }
.font-mono { font-family: 'JetBrains Mono', monospace; }
[x-cloak] { display: none !important; }
/* Custom Scrollbar */
.custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #555; }
/* Grid Layouts */
.app-grid {
display: grid;
grid-template-columns: repeat(4, minmax(0, 1fr));
gap: 24px 12px;
padding-bottom: 8rem;
width: 100%;
}
@media (min-width: 640px) { .app-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 32px 16px; } }
@media (min-width: 1024px) { .app-grid { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
/* Window Resizers */
.resizer { position: absolute; z-index: 50; touch-action: none; }
.resizer-n { top: -6px; left: 0; right: 0; height: 12px; cursor: n-resize; }
.resizer-e { top: 0; bottom: 0; right: -6px; width: 12px; cursor: e-resize; }
.resizer-s { bottom: -6px; left: 0; right: 0; height: 12px; cursor: s-resize; }
.resizer-w { top: 0; bottom: 0; left: -6px; width: 12px; cursor: w-resize; }
.resizer-nw { top: -6px; left: -6px; width: 20px; height: 20px; cursor: nw-resize; z-index: 60; }
.resizer-ne { top: -6px; right: -6px; width: 20px; height: 20px; cursor: ne-resize; z-index: 60; }
.resizer-sw { bottom: -6px; left: -6px; width: 20px; height: 20px; cursor: sw-resize; z-index: 60; }
.resizer-se { bottom: -6px; right: -6px; width: 20px; height: 20px; cursor: se-resize; z-index: 60; }
/* Icon Styling */
.glass-icon {
background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.1), 0 4px 12px rgba(0,0,0,0.5);
border: 1px solid rgba(255,255,255,0.08);
transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
}
.glass-icon:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); }
.glass-icon:active { transform: scale(0.96); }
/* Animations */
.fade-enter-active, .fade-leave-active { transition: opacity 0.2s ease; }
.fade-enter-from, .fade-leave-to { opacity: 0; }
.modal-enter { transition: all 0.3s ease-out; }
.modal-enter-start { opacity: 0; transform: scale(0.95) translateY(10px); }
.modal-enter-end { opacity: 1; transform: scale(1) translateY(0); }
</style></head>
<body class="bg-[#050505] text-[#ededed] h-screen w-full flex flex-col relative overflow-hidden" x-data="livedesk()" @mousemove="handleWindowMove($event)" @touchmove="handleWindowMove($event)" @mouseup="handleWindowUp($event)" @touchend="handleWindowUp($event)" @mouseleave="handleWindowUp($event)">

    <!-- Dynamic Background -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,#1a1a1a_0%,#000000_100%)]"></div>
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[1000px] h-[400px] bg-blue-900/10 blur-[120px] rounded-full mix-blend-screen opacity-50"></div>
        <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 brightness-100 contrast-150"></div>
    </div>

    <!-- Top Navigation Bar -->
    <header class="fixed top-0 left-0 right-0 h-12 z-40 flex items-center justify-between px-6 border-b border-white/[0.06] bg-[#050505]/60 backdrop-blur-xl transition-all duration-300" :class="holisticViewOpen ? 'translate-y-[-100%]' : 'translate-y-0'">
        
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 group cursor-pointer" @click="toggleHolistic()">
                <iconify-icon icon="solar:command-linear" width="18" class="text-white/60 group-hover:text-white transition-colors"></iconify-icon>
                <span class="text-xs font-medium tracking-tight text-white/80 group-hover:text-white transition-colors">LiveDesk</span>
            </div>
            
            <div class="h-4 w-[1px] bg-white/10 mx-1"></div>
            
            <!-- Layouts Menu -->
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open" class="flex items-center gap-2 text-xs font-medium text-white/50 hover:text-white transition-colors">
                    <iconify-icon icon="solar:layers-linear" width="14"></iconify-icon>
                    <span>Layouts</span>
                </button>
                <div x-show="open" @click.outside="open = false" class="absolute top-8 left-0 w-48 bg-[#0a0a0a] border border-white/10 rounded-lg shadow-xl py-1 z-50 flex flex-col" x-cloak="" x-transition="">
                    <button @click="saveLayout(); open=false" class="text-left px-3 py-2 text-xs hover:bg-white/10 text-white/70 hover:text-white transition-colors">Save Current Layout</button>
                    <div class="h-[1px] bg-white/5 my-1"></div>
                    <template x-for="(layout, name) in savedLayouts" :key="name">
                        <div class="flex items-center justify-between px-3 hover:bg-white/10 group">
                            <button @click="loadLayout(name); open=false" class="py-2 text-xs text-left text-white/70 group-hover:text-white flex-1" x-text="name"></button>
                            <button @click="deleteLayout(name)" class="text-white/20 hover:text-red-400"><iconify-icon icon="solar:trash-bin-trash-linear" width="12"></iconify-icon></button>
                        </div>
                    </template>
                     <div x-show="Object.keys(savedLayouts).length === 0" class="px-3 py-2 text-[10px] text-white/30 italic">No saved layouts</div>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-5">
            <span class="text-xs font-medium tracking-tight text-white/90" x-text="time"></span>
            <!-- Profile Trigger -->
            <button @click="handleProfileClick()" class="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-colors ring-1 ring-white/10 overflow-hidden relative">
                <template x-if="user &amp;&amp; user.photoURL">
                    <img :src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/917d6f93-fb36-439a-8c48-884b67b35381_1600w.jpg" class="w-full h-full object-cover">
                </template>
                <template x-if="!user || !user.photoURL">
                    <iconify-icon icon="solar:user-circle-linear" width="16" class="text-white/70"></iconify-icon>
                </template>
                <!-- Online indicator if logged in -->
                <div x-show="user" class="absolute bottom-0 right-0 w-1.5 h-1.5 bg-green-500 rounded-full ring-1 ring-black"></div>
            </button>
        </div>
    </header>

    <!-- Login Modal -->
    <div x-show="authModalOpen" class="fixed inset-0 z-[300] flex items-center justify-center p-4" x-cloak="">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-md" @click="authModalOpen=false"></div>
        <div class="relative w-full max-w-sm bg-[#0a0a0a] border border-white/10 rounded-2xl shadow-2xl p-6 flex flex-col items-center gap-4 text-center">
            <div class="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center border border-white/10 mb-2">
                <iconify-icon icon="solar:lock-keyhole-minimalistic-linear" width="24" class="text-white"></iconify-icon>
            </div>
            <div>
                <h2 class="text-lg font-semibold text-white tracking-tight">Access Your OS</h2>
                <p class="text-xs text-white/50 mt-1">Sign in to sync your apps and layouts</p>
            </div>
            
            <form @submit.prevent="handleAuth" class="w-full space-y-3 mt-2">
                <input type="email" x-model="email" placeholder="Email" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:border-blue-500 outline-none transition-colors">
                <input type="password" x-model="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-xs text-white focus:border-blue-500 outline-none transition-colors">
                
                <p x-show="authError" class="text-[10px] text-red-400 text-left" x-text="authError"></p>

                <button type="submit" class="w-full py-2 bg-white text-black text-xs font-bold rounded-lg hover:bg-gray-200 transition-colors">
                    <span x-text="isSignUp ? 'Create Account' : 'Sign In'"></span>
                </button>
            </form>
            
            <button @click="isSignUp = !isSignUp" class="text-[10px] text-white/40 hover:text-white transition-colors">
                <span x-text="isSignUp ? 'Already have an account? Sign In' : 'New here? Create Account'"></span>
            </button>
        </div>
    </div>

    <!-- Window Management Layer -->
    <div x-show="snapPreview" class="fixed z-[90] bg-white/[0.08] border border-white/20 backdrop-blur-md rounded-lg transition-all duration-200 pointer-events-none" :style="`top: ${snapPreview?.y}px; left: ${snapPreview?.x}px; width: ${snapPreview?.w}px; height: ${snapPreview?.h}px`" x-transition.opacity="">
    </div>

    <div class="fixed inset-0 z-[100] pointer-events-none overflow-hidden">
        <template x-for="win in windows" :key="win.id">
            <div x-show="!win.minimized" class="absolute flex flex-col bg-[#0a0a0a] rounded-lg shadow-[0_0_0_1px_rgba(255,255,255,0.08),0_24px_60px_-12px_rgba(0,0,0,0.8)] pointer-events-auto transition-transform will-change-transform" :class="win.snapped ? 'transition-all duration-300 ease-[cubic-bezier(0.2,0,0,1)]' : ''" :style="`top: ${win.y}px; left: ${win.x}px; width: ${win.w}px; height: ${win.h}px; z-index: ${win.zIndex}`" @mousedown="focusWindow(win.id)" @touchstart="focusWindow(win.id)">
                
                <!-- Resizers (Desktop) -->
                <div class="resizer resizer-n" @mousedown.prevent.stop="startResize($event, win.id, 'n')"></div>
                <div class="resizer resizer-e" @mousedown.prevent.stop="startResize($event, win.id, 'e')"></div>
                <div class="resizer resizer-s" @mousedown.prevent.stop="startResize($event, win.id, 's')"></div>
                <div class="resizer resizer-w" @mousedown.prevent.stop="startResize($event, win.id, 'w')"></div>
                <div class="resizer resizer-nw" @mousedown.prevent.stop="startResize($event, win.id, 'nw')"></div>
                <div class="resizer resizer-ne" @mousedown.prevent.stop="startResize($event, win.id, 'ne')"></div>
                <div class="resizer resizer-sw" @mousedown.prevent.stop="startResize($event, win.id, 'sw')"></div>
                <div class="resizer resizer-se" @mousedown.prevent.stop="startResize($event, win.id, 'se')"></div>

                <!-- Window Header -->
                <div class="h-10 px-4 flex items-center justify-between border-b border-white/[0.06] bg-[#0a0a0a] rounded-t-lg shrink-0 select-none group/header relative" @mousedown="startWindowDrag($event, win.id)" @touchstart="startTouchDrag($event, win.id)" @dblclick="toggleMaximize(win.id)">
                    
                    <div x-show="dragState.isDragging &amp;&amp; dragState.id === win.id" class="absolute inset-0 bg-blue-500/10 flex items-center justify-center pointer-events-none">
                         <span class="text-[9px] font-bold uppercase tracking-widest text-blue-400">Dragging</span>
                    </div>

                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2 text-white/40">
                            <!-- Header Icon Logic -->
                            <template x-if="win.icon &amp;&amp; (win.icon.includes('http') || win.icon.includes('data:'))">
                                <img :src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/4734259a-bad7-422f-981e-ce01e79184f2_1600w.jpg" class="w-3.5 h-3.5 object-cover rounded-sm" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                                <iconify-icon icon="solar:window-frame-linear" width="14" class="hidden"></iconify-icon>
                            </template>
                            <template x-if="!win.icon || (!win.icon.includes('http') &amp;&amp; !win.icon.includes('data:'))">
                                <iconify-icon :icon="win.icon || 'solar:window-frame-linear'" width="14"></iconify-icon>
                            </template>
                        </div>
                        <span class="text-xs font-medium text-white/70 tracking-tight truncate max-w-[200px]" x-text="win.title"></span>
                    </div>

                    <div class="flex items-center gap-2 opacity-100 md:opacity-40 md:group-hover/header:opacity-100 transition-opacity">
                        <button @click.stop="win.minimized = true" class="p-1 hover:bg-white/10 rounded text-white/70 transition-colors">
                            <iconify-icon icon="solar:minus-circle-linear" width="14"></iconify-icon>
                        </button>
                        <button @click.stop="toggleMaximize(win.id)" class="p-1 hover:bg-white/10 rounded text-white/70 transition-colors">
                            <iconify-icon :icon="win.maximized ? 'solar:minimize-square-linear' : 'solar:maximize-square-linear'" width="14"></iconify-icon>
                        </button>
                        <button @click.stop="closeWindow(win.id)" class="p-1 hover:bg-red-500/20 hover:text-red-400 rounded text-white/70 transition-colors">
                            <iconify-icon icon="solar:close-circle-linear" width="14"></iconify-icon>
                        </button>
                    </div>
                </div>

                <!-- Window Content -->
                <div class="flex-1 bg-[#050505] relative rounded-b-lg overflow-hidden flex flex-col">
                    <div x-show="dragState.isDragging || dragState.isResizing" class="absolute inset-0 z-50 bg-transparent"></div>
                    
                    <template x-if="win.type === 'code'">
                        <div class="w-full h-full bg-[#050505]">
                            <iframe :srcdoc="win.code" class="w-full h-full border-none" sandbox="allow-scripts allow-forms allow-same-origin"></iframe>
                        </div>
                    </template>
                    
                     <template x-if="win.type === 'gallery'">
                        <div class="w-full h-full bg-[#0a0a0a] p-4 overflow-y-auto custom-scrollbar">
                            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                <template x-for="file in (win.attachments || [])" :key="file.url">
                                    <div class="group relative aspect-square bg-white/5 rounded-lg border border-white/5 overflow-hidden hover:border-white/20 transition-all">
                                        <img :src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/c543a9e1-f226-4ced-80b0-feb8445a75b9_1600w.jpg" class="w-full h-full object-cover" onerror="this.style.display='none'">
                                        <div class="absolute inset-0 flex items-center justify-center bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity">
                                            <a :href="file.url" target="_blank" class="text-white text-xs hover:underline truncate px-2" x-text="file.name"></a>
                                        </div>
                                    </div>
                                </template>
                                <button @click="openModal('edit', getAppById(win.appId))" class="aspect-square rounded-lg border border-dashed border-white/10 flex flex-col items-center justify-center gap-2 text-white/20 hover:text-white hover:border-white/30 transition-all">
                                    <iconify-icon icon="solar:gallery-add-linear" width="24"></iconify-icon>
                                    <span class="text-[10px] font-medium">Add Media</span>
                                </button>
                            </div>
                        </div>
                    </template>

                    <template x-if="win.type !== 'code' &amp;&amp; win.type !== 'gallery'">
                        <div class="w-full h-full flex flex-col bg-white">
                            <iframe :src="win.url" class="w-full h-full border-none" loading="lazy"></iframe>
                        </div>
                    </template>

                    <div class="absolute bottom-0 right-0 w-6 h-6 z-50 cursor-se-resize flex items-end justify-end p-1 opacity-50 hover:opacity-100" @mousedown.prevent.stop="startResize($event, win.id, 'se')" @touchstart.prevent.stop="startResize($event, win.id, 'se')">
                         <svg width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 8H0L8 0V8Z" fill="white"></path>
                         </svg>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Desktop Area -->
    <main class="absolute inset-0 pt-16 pb-24 overflow-hidden z-10" @click.self="activeWindowId = null">
        
        <!-- Holistic View Wrapper -->
        <div class="h-full w-full relative transition-all duration-500 ease-[cubic-bezier(0.2,0,0,1)]" :class="holisticViewOpen ? 'scale-90 opacity-100' : 'scale-100'">
            
            <div id="pages-container" class="h-full w-full" :class="holisticViewOpen ? 'flex flex-wrap items-center justify-center gap-8 overflow-y-auto p-10' : 'relative'">
                
                <template x-for="pNum in pageNumbers" :key="pNum">
                    <div :data-page-id="pNum" class="page-wrapper transition-all duration-500 ease-[cubic-bezier(0.2,0,0,1)]" :class="holisticViewOpen 
                            ? 'relative w-[320px] h-[200px] rounded-xl border border-white/10 bg-[#0a0a0a] hover:border-white/30 cursor-pointer group shadow-2xl shrink-0' 
                            : (currentPage === pNum ? 'absolute inset-0 overflow-y-auto custom-scrollbar px-6 md:px-12' : 'hidden absolute inset-0')">
                        
                        <div x-show="holisticViewOpen" class="absolute -top-8 left-0 w-full flex items-center justify-between px-1">
                             <input type="text" x-model="pageNames[pNum]" @click.stop="" class="bg-transparent text-left text-[10px] font-bold uppercase tracking-widest text-white/40 focus:text-white outline-none w-24" :value="getPageName(pNum)">
                             
                             <div class="flex items-center gap-2">
                                <iconify-icon icon="solar:reorder-linear" class="text-white/20 cursor-move handle"></iconify-icon>
                                <button @click.stop="deletePage(pNum)" class="text-white/20 hover:text-red-400 transition-colors" title="Delete Page">
                                    <iconify-icon icon="solar:trash-bin-trash-linear" width="14"></iconify-icon>
                                </button>
                             </div>
                        </div>

                        <div :class="holisticViewOpen ? 'w-[400%] h-[400%] origin-top-left scale-[0.25] pointer-events-none p-8 bg-[#050505]' : 'max-w-7xl mx-auto h-full'">
                            
                            <div class="app-grid sortable-grid" :data-page="pNum">
                                <template x-for="app in getAppsForPage(pNum)" :key="app.id">
                                    <div :data-id="app.id" class="group relative flex flex-col items-center gap-3 p-2 rounded-xl transition-all cursor-pointer app-item" @click="handleAppClick($event, app)" @contextmenu.prevent="openContext($event, app)">
                                        
                                        <!-- App Icon Container -->
                                        <div class="w-16 h-16 rounded-[18px] glass-icon flex items-center justify-center relative overflow-hidden group-hover:bg-white/10">
                                            
                                            <div x-show="app.note || (app.attachments &amp;&amp; app.attachments.length)" class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-blue-500 shadow-[0_0_8px_rgba(59,130,246,0.5)] z-20"></div>

                                            <template x-if="app.type === 'folder'">
                                                <div class="grid grid-cols-2 gap-1 p-3 w-full h-full opacity-70">
                                                    <template x-for="sub in (app.items || []).slice(0,4)">
                                                        <div class="bg-white/20 rounded-[2px]"></div>
                                                    </template>
                                                    <template x-if="!app.items || app.items.length===0">
                                                         <iconify-icon icon="solar:folder-with-files-linear" width="24" class="col-span-2 m-auto text-white/50"></iconify-icon>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Improved Icon/Image Rendering Logic -->
                                            <template x-if="app.type !== 'folder'">
                                                <div class="text-white/80 group-hover:text-white transition-colors flex items-center justify-center w-full h-full relative">
                                                    
                                                    <!-- Case 1: Icon field is a URL -->
                                                    <template x-if="app.icon &amp;&amp; (app.icon.includes('http') || app.icon.includes('data:'))">
                                                        <img :src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/5bab247f-35d9-400d-a82b-fd87cfe913d2_1600w.webp" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                                                        <!-- Fallback for broken image -->
                                                        <iconify-icon icon="solar:gallery-broken-linear" width="32" class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></iconify-icon>
                                                    </template>

                                                    <!-- Case 2: Icon field is a name string or empty -->
                                                    <template x-if="!app.icon || (!app.icon.includes('http') &amp;&amp; !app.icon.includes('data:'))">
                                                        <iconify-icon :icon="app.icon || 'solar:box-linear'" width="32" stroke-width="1.5"></iconify-icon>
                                                    </template>

                                                </div>
                                            </template>
                                        </div>

                                        <span class="text-[11px] font-medium text-white/60 tracking-tight group-hover:text-white transition-colors text-center w-24 truncate" x-text="app.name"></span>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div x-show="holisticViewOpen" class="absolute inset-0 z-10" @click="currentPage = pNum; holisticViewOpen = false"></div>
                    </div>
                </template>

                <button x-show="holisticViewOpen" @click="addPage()" class="w-[320px] h-[200px] shrink-0 rounded-xl border border-dashed border-white/10 flex flex-col items-center justify-center gap-3 text-white/20 hover:text-white/60 hover:border-white/20 transition-all group">
                    <iconify-icon icon="solar:add-circle-linear" width="32"></iconify-icon>
                    <span class="text-xs font-medium uppercase tracking-widest">New Desktop</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Dock -->

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCo0Rq6eABM3Q6le_x9VjskDCCAg1XUl8A",
            authDomain: "livedesklauncher.firebaseapp.com",
            projectId: "livedesklauncher",
            databaseURL: "https://livedesklauncher-default-rtdb.europe-west1.firebasedatabase.app",
            storageBucket: "livedesklauncher.firebasestorage.app",
            messagingSenderId: "719865623018",
            appId: "1:719865623018:web:104315b70c32db5bd4c293",
            measurementId: "G-N1XRVV5SNJ"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.database();

        document.addEventListener('alpine:init', () => {
            Alpine.data('livedesk', () => ({
                user: null, authModalOpen: false, time: '',
                email: '', password: '', isSignUp: false, authError: '',
                
                apps: [], pageNames: {}, currentPage: 0, holisticViewOpen: false,
                windows: [], activeZIndex: 100, activeWindowId: null, snapPreview: null,
                dragState: { isDragging: false, isResizing: false, id: null, type: null, startX: 0, startY: 0, initialRect: {} },
                contextOpen: false, contextApp: null, contextPos: {x:0, y:0},
                modalOpen: false, modalMode: 'add', modalTab: 'general', modalData: {},
                savedLayouts: {}, longPressTimer: null,

                init() {
                    this.updateTime(); setInterval(() => this.updateTime(), 1000);
                    
                    // Session Restoration
                    const sessionWins = localStorage.getItem('ldl_session_windows');
                    if(sessionWins) {
                        try { this.windows = JSON.parse(sessionWins); this.activeZIndex = Math.max(100, ...this.windows.map(w=>w.zIndex)) + 1; } catch(e){}
                    }
                    this.$watch('windows', val => localStorage.setItem('ldl_session_windows', JSON.stringify(val)));

                    // Auth State
                    auth.onAuthStateChanged(u => {
                        this.user = u;
                        this.authModalOpen = false;
                        if(u) {
                            db.ref(`users/${u.uid}/apps`).on('value', s => this.processApps(s.val() || []));
                            db.ref(`users/${u.uid}/pageNames`).on('value', s => this.pageNames = s.val() || {});
                            db.ref(`users/${u.uid}/layouts`).on('value', s => this.savedLayouts = s.val() || {});
                        } else {
                            // Check local storage or load default guest apps
                            const local = localStorage.getItem('ldl_apps');
                            if(local) {
                                this.processApps(JSON.parse(local));
                            } else {
                                this.processApps([
                                    { id: 'sys_store', name: 'App Store', url: 'https://vercel.com/templates', icon: 'solar:shop-linear', type: 'app', page: 0, index: 0 },
                                    { id: 'sys_browser', name: 'Browser', url: 'https://bing.com', icon: 'solar:globe-linear', type: 'app', page: 0, index: 1 },
                                    { id: 'sys_gallery', name: 'Wallpapers', icon: 'solar:gallery-wide-linear', type: 'gallery', page: 0, index: 2, attachments: [{name:'Abs 1', url:'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=500&q=60'},{name:'Abs 2', url:'https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?auto=format&fit=crop&w=500&q=60'}] }
                                ]);
                            }
                        }
                    });

                    this.$nextTick(() => {
                        new Sortable(document.getElementById('pages-container'), {
                            animation: 150, handle: '.handle', draggable: '.page-wrapper',
                        });
                    });
                },

                handleAuth() {
                    this.authError = '';
                    if(this.isSignUp) {
                        auth.createUserWithEmailAndPassword(this.email, this.password)
                            .then(() => { this.authModalOpen = false; this.email=''; this.password=''; })
                            .catch(e => this.authError = e.message);
                    } else {
                        auth.signInWithEmailAndPassword(this.email, this.password)
                            .then(() => { this.authModalOpen = false; this.email=''; this.password=''; })
                            .catch(e => this.authError = e.message);
                    }
                },

                processApps(data) {
                    // Ensure every app has basic properties
                    this.apps = data.map((a,i) => { 
                        if(a.index===undefined) a.index=i; 
                        if(!a.icon) a.icon = 'solar:box-linear'; // Default fallack
                        return a; 
                    }).sort((a,b)=>(a.page||0)-(b.page||0)||a.index-b.index);
                    this.$nextTick(() => this.initSortable());
                },

                updateTime() { const n=new Date(); this.time=n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}); },
                
                get pageNumbers() { 
                    const max=Math.max(...this.apps.map(a=>a.page||0),0); 
                    return Array.from({length:max+1},(_,i)=>i); 
                },
                getPageName(i) { return this.pageNames[i] || `DESKTOP ${i+1}`; },
                getAppsForPage(p) { return this.apps.filter(a=>(a.page||0)===p).sort((a,b)=>a.index-b.index); },
                getAppById(id) { return this.apps.find(a=>a.id === id); },
                
                addPage() { const next = Math.max(...this.pageNumbers) + 1; this.currentPage = next; this.holisticViewOpen = false; },
                deletePage(pNum) {
                    if(confirm(`Delete Desktop ${pNum+1} and all its apps?`)) {
                        this.apps = this.apps.filter(a => a.page !== pNum);
                        delete this.pageNames[pNum];
                        this.saveData();
                    }
                },
                
                toggleHolistic() { this.holisticViewOpen = !this.holisticViewOpen; },

                handleAppClick(e, app) {
                    if(app.type === 'folder') { /* Folder logic */ }
                    else this.launchApp(app);
                },
                launchApp(app) {
                    const existing = this.windows.find(w => w.appId === app.id);
                    if (existing) { existing.minimized = false; this.focusWindow(existing.id); return; }
                    
                    const w = window.innerWidth < 768 ? window.innerWidth*0.9 : 800;
                    const h = window.innerHeight < 600 ? window.innerHeight*0.8 : 600;
                    
                    this.activeZIndex++;
                    const newWin = {
                        id: 'win_' + Date.now(), appId: app.id, title: app.name, url: app.url, icon: app.icon, 
                        type: app.type, code: app.code, attachments: app.attachments || [],
                        x: (window.innerWidth-w)/2 + (Math.random()*40), 
                        y: (window.innerHeight-h)/2 + (Math.random()*40), 
                        w: w, h: h, zIndex: this.activeZIndex, minimized: false, maximized: false, snapped: false
                    };
                    this.windows.push(newWin);
                    this.activeWindowId = newWin.id;
                },
                
                focusWindow(id) { const w=this.windows.find(x=>x.id===id); if(w) { w.zIndex = ++this.activeZIndex; this.activeWindowId = id; } },
                closeWindow(id) { this.windows = this.windows.filter(w=>w.id!==id); if(this.activeWindowId === id) this.activeWindowId = null; },
                toggleMinimize(id) { const w=this.windows.find(x=>x.id===id); if(w) { if(w.minimized) { w.minimized=false; this.focusWindow(id); } else { if(w.zIndex===this.activeZIndex) w.minimized=true; else this.focusWindow(id); } } },
                toggleMaximize(id) {
                    const w=this.windows.find(x=>x.id===id); if(!w) return;
                    if(w.maximized) { Object.assign(w, w.preMax); w.maximized=false; w.snapped=false; }
                    else { w.preMax={x:w.x,y:w.y,w:w.w,h:w.h}; w.x=0; w.y=48; w.w=window.innerWidth; w.h=window.innerHeight-48-80; w.maximized=true; w.snapped=true; }
                },

                getEventPos(e) { return e.touches ? {x:e.touches[0].clientX, y:e.touches[0].clientY} : {x:e.clientX, y:e.clientY}; },
                
                startWindowDrag(e, id) { 
                    if(e.button!==0)return; 
                    const w=this.windows.find(x=>x.id===id); if(!w||w.maximized)return; 
                    this.focusWindow(id); 
                    this.dragState={isDragging:true, id, startX:e.clientX, startY:e.clientY, initialRect:{x:w.x, y:w.y}}; 
                },
                
                startTouchDrag(e, id) {
                    const w=this.windows.find(x=>x.id===id); if(!w||w.maximized)return;
                    this.focusWindow(id);
                    const pos = this.getEventPos(e);
                    this.longPressTimer = setTimeout(() => {
                        this.dragState = {isDragging:true, id, startX:pos.x, startY:pos.y, initialRect:{x:w.x, y:w.y}};
                        if(navigator.vibrate) navigator.vibrate(50);
                    }, 500); 
                },

                startResize(e, id, type) { 
                    const w=this.windows.find(x=>x.id===id); if(!w||w.maximized)return; 
                    this.focusWindow(id); 
                    const pos = this.getEventPos(e);
                    this.dragState={isResizing:true, id, type, startX:pos.x, startY:pos.y, initialRect:{x:w.x, y:w.y, w:w.w, h:w.h}}; 
                },

                handleWindowMove(e) {
                    if (this.longPressTimer && !this.dragState.isDragging) { clearTimeout(this.longPressTimer); this.longPressTimer = null; }
                    const pos = this.getEventPos(e);

                    if(this.dragState.isDragging) {
                        if(e.preventDefault) e.preventDefault();
                        const w=this.windows.find(x=>x.id===this.dragState.id);
                        if(w) {
                            w.x = this.dragState.initialRect.x + (pos.x - this.dragState.startX);
                            w.y = this.dragState.initialRect.y + (pos.y - this.dragState.startY);
                            this.snapPreview = null; const m=20, h=48;
                            if(pos.y<h+m) this.snapPreview={x:0, y:h, w:window.innerWidth, h:window.innerHeight-h};
                            else if(pos.x<m) this.snapPreview={x:0, y:h, w:window.innerWidth/2, h:window.innerHeight-h};
                            else if(pos.x>window.innerWidth-m) this.snapPreview={x:window.innerWidth/2, y:h, w:window.innerWidth/2, h:window.innerHeight-h};
                        }
                    } else if(this.dragState.isResizing) {
                        if(e.preventDefault) e.preventDefault();
                        const w=this.windows.find(x=>x.id===this.dragState.id);
                        if(w) {
                            const dx=pos.x-this.dragState.startX, dy=pos.y-this.dragState.startY, r=this.dragState.initialRect, t=this.dragState.type;
                            if(t.includes('e')) w.w = Math.max(320, r.w+dx);
                            if(t.includes('s')) w.h = Math.max(200, r.h+dy);
                            if(t.includes('w')) { w.w = Math.max(320, r.w-dx); w.x = r.x + (r.w - w.w); }
                            if(t.includes('n')) { w.h = Math.max(200, r.h-dy); w.y = r.y + (r.h - w.h); }
                        }
                    }
                },
                handleWindowUp() {
                    if (this.longPressTimer) clearTimeout(this.longPressTimer);
                    if(this.dragState.isDragging && this.snapPreview) {
                        const w=this.windows.find(x=>x.id===this.dragState.id);
                        if(w) { w.preMax={x:w.x,y:w.y,w:w.w,h:w.h}; w.x=this.snapPreview.x; w.y=this.snapPreview.y; w.w=this.snapPreview.w; w.h=this.snapPreview.h; w.snapped=true; if(w.w===window.innerWidth) w.maximized=true; }
                    }
                    this.dragState={isDragging:false,isResizing:false}; this.snapPreview=null;
                },

                openContext(e, app) {
                    e.preventDefault();
                    let x = e.clientX, y = e.clientY;
                    if(x + 192 > window.innerWidth) x = window.innerWidth - 200;
                    if(y + 160 > window.innerHeight) y = window.innerHeight - 170;
                    this.contextPos = {x, y}; this.contextApp = app; this.contextOpen = true;
                },
                openModal(mode, data) { 
                    this.modalMode = mode; this.modalTab = 'general';
                    this.modalData = data ? JSON.parse(JSON.stringify(data)) : { type:'app', id: 'app_'+Date.now(), attachments: [] }; 
                    this.modalOpen = true; 
                },
                applyPreset(type) {
                    if(type === 'kanban') {
                        this.modalData.name = 'Kanban Board'; this.modalData.icon = 'solar:clipboard-list-linear'; this.modalData.type = 'code';
                        this.modalData.code = '<iframe src="https://kanban-board-demo.vercel.app/" style="width:100%;height:100%;border:none;"></iframe>';
                    }
                    if(type === 'calendar') {
                        this.modalData.name = 'Calendar'; this.modalData.icon = 'solar:calendar-linear'; this.modalData.type = 'code';
                        this.modalData.code = '<iframe src="https://calendar.google.com/calendar/embed?src=en.usa%23holiday%40group.v.calendar.google.com&ctz=UTC" style="border: 0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>';
                    }
                    if(type === 'todo') {
                         this.modalData.name = 'To-Do'; this.modalData.icon = 'solar:checklist-minimalistic-linear'; this.modalData.type = 'code';
                         this.modalData.code = '<div style="padding:20px; font-family:sans-serif; color:white;"><h3>Tasks</h3><ul><li>[ ] Research</li><li>[ ] Design</li></ul></div>';
                    }
                    if(type === 'gallery') {
                         this.modalData.name = 'Photos'; this.modalData.icon = 'solar:gallery-wide-linear'; this.modalData.type = 'gallery'; this.modalData.attachments = [];
                    }
                },
                closeModal() { this.modalOpen = false; },
                saveModal() {
                    if(this.modalMode === 'add') {
                        this.modalData.page = this.currentPage;
                        this.modalData.index = this.apps.filter(a=>(a.page||0)===this.currentPage).length;
                        this.apps.push(this.modalData);
                    } else {
                        const idx = this.apps.findIndex(a=>a.id===this.modalData.id);
                        if(idx>-1) this.apps[idx] = this.modalData;
                    }
                    this.saveData(); this.closeModal();
                },
                deleteApp(app) { if(confirm('Delete ' + app.name + '?')) { this.apps = this.apps.filter(a=>a.id!==app.id); this.saveData(); } },
                saveData() {
                     if(this.user) {
                        db.ref(`users/${this.user.uid}/apps`).set(this.apps);
                        db.ref(`users/${this.user.uid}/pageNames`).set(this.pageNames);
                     } else {
                        localStorage.setItem('ldl_apps', JSON.stringify(this.apps));
                     }
                     this.$nextTick(() => this.initSortable());
                },
                
                saveLayout() {
                    const name = prompt("Name this layout:", "My Workspace");
                    if(name) {
                        this.savedLayouts[name] = JSON.parse(JSON.stringify(this.windows));
                        if(this.user) db.ref(`users/${this.user.uid}/layouts`).set(this.savedLayouts);
                        else localStorage.setItem('ldl_layouts', JSON.stringify(this.savedLayouts));
                    }
                },
                loadLayout(name) {
                    if(this.savedLayouts[name]) {
                        this.windows = JSON.parse(JSON.stringify(this.savedLayouts[name]));
                        this.activeZIndex = Math.max(100, ...this.windows.map(w=>w.zIndex)) + 1;
                    }
                },
                deleteLayout(name) {
                    if(confirm("Delete layout " + name + "?")) {
                        delete this.savedLayouts[name];
                        if(this.user) db.ref(`users/${this.user.uid}/layouts`).set(this.savedLayouts);
                        else localStorage.setItem('ldl_layouts', JSON.stringify(this.savedLayouts));
                    }
                },

                handleProfileClick() { if(this.user) { if(confirm('Sign Out?')) auth.signOut(); } else { this.authError=''; this.authModalOpen=true; } },
                initSortable() {
                     document.querySelectorAll('.sortable-grid').forEach(el => {
                        if (el._sortable) el._sortable.destroy();
                        el._sortable = new Sortable(el, { 
                            group: 'apps', animation: 200, delay: 200, delayOnTouchOnly: true, draggable: '.app-item',
                            onEnd: (evt) => {
                                const id = evt.item.getAttribute('data-id'), toPage = parseInt(evt.to.getAttribute('data-page'));
                                const app = this.apps.find(a=>a.id===id);
                                if(app) app.page = toPage;
                                Array.from(evt.to.children).forEach((k, i) => { const a = this.apps.find(x=>x.id===k.getAttribute('data-id')); if(a) a.index = i; });
                                this.saveData();
                            }
                        });
                    });
                }
            }));
        });
    </script>

</body></html>
