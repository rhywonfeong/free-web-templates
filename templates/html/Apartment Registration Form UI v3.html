<html lang="it"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registra Appartamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'roboto-condensed': ['Roboto Condensed', 'sans-serif'],
                        'inter': ['Inter', 'sans-serif']
                    },
                    animation: {
                        'blur-in': 'blur-in 0.8s ease-out forwards'
                    },
                    keyframes: {
                        'blur-in': {
                            '0%': { filter: 'blur(10px)', opacity: '0' },
                            '100%': { filter: 'blur(0px)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=IBM+Plex+Serif:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@300;400;500;600;700&amp;family=Roboto:wght@300;400;500;600;700&amp;family=Roboto+Condensed&amp;display=swap" rel="stylesheet">
  <style>
      /* Custom font utilities */
      .font-roboto { font-family: 'Roboto', sans-serif !important; }
    </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=IBM+Plex+Serif:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@300;400;500;600;700&amp;family=Roboto:wght@300;400;500;600;700&amp;family=Roboto+Condensed&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter&amp;display=swap" rel="stylesheet">
  <style>
      /* Custom font utilities */
      .font-roboto { font-family: 'Roboto', sans-serif !important; }
    </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;600;700&family=Roboto+Condensed&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
  <style>
      /* Custom font utilities */
      .font-roboto { font-family: 'Roboto', sans-serif !important; }
    </style>
</head>
<body class="bg-zinc-100 min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto animate-blur-in">
        <div class="bg-white rounded-lg shadow-md p-8">
            <h1 class="font-roboto-condensed text-7xl font-semibold tracking-tight text-black mb-4">Registra Appartamento</h1>
            <p class="font-inter text-base text-zinc-600 mb-8">Inserisci i dettagli del tuo appartamento per iniziare ad affittare</p>
            
            <form class="space-y-6">
                <!-- Informazioni Appartamento -->
                <div class="space-y-4">
                    <h2 class="font-roboto-condensed text-2xl font-semibold tracking-tight text-black">Informazioni Generali</h2>
                    
                    <div class="">
                        <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Nome appartamento</label>
                        <input type="text" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                    </div>
                    
                    <div class="space-y-4">
                        <label class="block text-sm font-medium text-zinc-700 font-inter mb-2">Indirizzo</label>
                        
                        <div class="">
                            <input type="text" placeholder="Via" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="">
                                <input type="text" placeholder="Città" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                            </div>
                            
                            <div class="">
                                <input type="number" placeholder="CAP" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Regole Appartamento -->
                <div class="space-y-4">
                    <h2 class="font-roboto-condensed text-2xl font-semibold tracking-tight text-black">Regole Appartamento</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="">
                            <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Animali ammessi</label>
                            <select class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                                <option>Seleziona</option>
                                <option>Sì</option>
                                <option>No</option>
                            </select>
                        </div>
                        
                        <div class="">
                            <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Coppie ammesse</label>
                            <select class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                                <option>Seleziona</option>
                                <option>Sì</option>
                                <option>No</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="">
                        <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Fumatori ammessi</label>
                        <select class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm mb-2">
                            <option>Seleziona</option>
                            <option>Sì</option>
                            <option>No</option>
                        </select>
                        <input type="text" placeholder="Se sì, specificare dove è consentito" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                    </div>
                    
                    <div class="">
                        <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Spese incluse</label>
                        <select class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                            <option>Seleziona</option>
                            <option>Sì</option>
                            <option>No</option>
                        </select>
                    </div>

                    <!-- Regole Personalizzate -->
                    <div class="space-y-4" id="regole-personalizzate-container">
                        <div class="flex items-center justify-between pt-4 border-t border-zinc-200">
                            <h3 class="font-roboto-condensed text-xl font-semibold tracking-tight text-black">Regole Personalizzate</h3>
                            <button type="button" onclick="aggiungiRegola()" class="px-4 py-2 bg-zinc-800 text-white rounded-md font-inter text-sm hover:bg-zinc-900 transition-colors">+ Aggiungi Regola</button>
                        </div>
                        <p class="font-inter text-sm text-zinc-600">Aggiungi regole specifiche per il tuo appartamento</p>
                        
                        <div id="regole-list" class="space-y-3">
                            <!-- Le regole personalizzate verranno aggiunte qui -->
                        </div>
                    </div>
                </div>

                <!-- Camere -->
                <div class="space-y-6" id="camere-container">
                    <div class="flex items-center justify-between">
                        <h2 class="font-roboto-condensed text-2xl font-semibold tracking-tight text-black">Dettagli Camere</h2>
                        <button type="button" onclick="aggiungiCamera()" class="px-4 py-2 bg-black text-white rounded-md font-inter text-sm hover:bg-zinc-800 transition-colors">+ Aggiungi Camera</button>
                    </div>
                    
                    <div class="camera-item border border-zinc-200 rounded-lg p-6 space-y-4">
                        <h3 class="font-roboto-condensed text-xl font-semibold tracking-tight text-black">Camera 1</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="">
                                <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Nome camera</label>
                                <input type="text" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                            </div>
                            
                            <div class="">
                                <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Grandezza (mq)</label>
                                <input type="number" min="1" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                            </div>
                        </div>
                        
                        <div class="">
                            <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Descrizione camera</label>
                            <textarea rows="3" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm"></textarea>
                        </div>
                        
                        <div class="">
                            <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Prezzo camera (€/mese)</label>
                            <input type="number" min="0" step="0.01" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                        </div>
                        
                        <div class="">
                            <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Foto camera</label>
                            <input type="file" multiple="" accept="image/*" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-6">
                    <button type="submit" class="w-full bg-black text-white py-4 rounded-md font-inter text-base font-medium hover:bg-zinc-800 transition-colors">Registra Appartamento</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let cameraCount = 1;
        let regolaCount = 0;
        
        function aggiungiCamera() {
            cameraCount++;
            const container = document.getElementById('camere-container');
            const newCamera = document.createElement('div');
            newCamera.className = 'camera-item border border-zinc-200 rounded-lg p-6 space-y-4';
            newCamera.innerHTML = `
                <div class="flex items-center justify-between">
                    <h3 class="font-roboto-condensed text-xl font-semibold tracking-tight text-black">Camera ${cameraCount}</h3>
                    <button type="button" onclick="rimuoviCamera(this)" class="text-red-600 hover:text-red-800 font-inter text-sm">Rimuovi</button>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Nome camera</label>
                        <input type="text" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                    </div>
                    
                    <div>
                        <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Grandezza (mq)</label>
                        <input type="number" min="1" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                    </div>
                </div>
                
                <div>
                    <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Descrizione camera</label>
                    <textarea rows="3" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm"></textarea>
                </div>
                
                <div>
                    <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Prezzo camera (€/mese)</label>
                    <input type="number" min="0" step="0.01" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                </div>
                
                <div>
                    <label class="block font-inter text-sm font-medium text-zinc-700 mb-2">Foto camera</label>
                    <input type="file" multiple accept="image/*" class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm">
                </div>
            `;
            container.appendChild(newCamera);
        }
        
        function rimuoviCamera(button) {
            button.closest('.camera-item').remove();
        }

        function aggiungiRegola() {
            regolaCount++;
            const regoleList = document.getElementById('regole-list');
            const newRegola = document.createElement('div');
            newRegola.className = 'regola-item flex items-center gap-3 p-4 bg-zinc-50 rounded-md border border-zinc-200';
            newRegola.innerHTML = `
                <div class="flex-1">
                    <input type="text" placeholder="Scrivi una regola personalizzata per l'appartamento..." class="w-full px-4 py-3 border border-zinc-200 rounded-md focus:outline-none focus:ring-2 focus:ring-black focus:border-transparent font-inter text-sm bg-white">
                </div>
                <button type="button" onclick="rimuoviRegola(this)" class="px-3 py-2 text-red-600 hover:text-red-800 hover:bg-red-50 rounded-md font-inter text-sm transition-colors">Rimuovi</button>
            `;
            regoleList.appendChild(newRegola);
        }
        
        function rimuoviRegola(button) {
            button.closest('.regola-item').remove();
        }
    </script>

</body></html>
