  <style>
    html, body { background: #000; font-family: 'Inter', sans-serif; }
    .cube-container { perspective: 900px; width: 100vw; max-width: 340px; height: 260px; display: flex; align-items: center; justify-content: center; margin: 0 auto; }
    .cube {
      width: 140px;
      height: 140px;
      position: relative;
      transform-style: preserve-3d;
      animation: cube-spin 1s cubic-bezier(.65,.04,.4,.95) 1;
      animation-fill-mode: forwards;
    }
    .cube.finished { display: none; }
    .fanned-cards {
      display: flex;
      justify-content: center;
      align-items: end;
      gap: 0;
      margin-top: 12px;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%,-52%);
      width: 330px;
      z-index: 10;
    }
    .fan-card {
      width: 112px;
      height: 140px;
      color: white;
      font-weight: 600;
      font-size: 1.07rem;
      border-radius: 18px;
      box-shadow: 0 8px 18px 0 rgba(0,0,0,0.22);
      border: 1.5px solid rgba(255,255,255,0.08);
      padding: 18px 17px 15px 17px;
      letter-spacing: -0.01em;
      opacity: 0.97;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      position: relative;
      transition: transform .44s cubic-bezier(.62,.04,.4,.95), box-shadow .3s;
      will-change: transform;
    }
    .fan-card:nth-child(1) { background: linear-gradient(135deg, #00E68A 0%, #48F7B2 45%, #00B27A 100%); transform: rotate(-17deg) translateX(-19px);}
    .fan-card:nth-child(2) { background: linear-gradient(135deg, #43C6AC 0%, #191654 100%); transform: rotate(-6deg) translateX(-9px);}
    .fan-card:nth-child(3) { background: linear-gradient(135deg, #F857A6 5%, #FF5858 60%, #FFB88C 100%); transform: rotate(6deg)  translateX(9px);}
    .fan-card:nth-child(4) { background: linear-gradient(135deg, #FFD452 0%, #FFB88C 50%, #FF6E7F 100%); transform: rotate(17deg)  translateX(19px);}
    @media (max-width: 380px) {
      .cube, .fan-card { width: 86px; height: 95px; font-size: 0.95rem; padding: 10px 9px 10px 9px;}
      .fan-card { border-radius: 10px;}
      .cube-container { height: 140px;}
      .fanned-cards { width: 210px;}
    }
    @keyframes cube-spin {
      0%   { transform: rotateY(0deg) rotateX(0deg);}
      100% { transform: rotateY(720deg) rotateX(0deg);}
    }
  </style>
