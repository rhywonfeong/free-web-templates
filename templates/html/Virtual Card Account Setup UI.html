  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Card Onboarding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            indigo: {
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
            },
          },
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-md">
    <!-- Onboarding Modal -->
    <div class="bg-gradient-to-br from-indigo-500 to-indigo-400 rounded-2xl shadow-xl overflow-hidden">
      <!-- Header -->
      <div class="p-6 pb-0">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-white font-medium text-xl">Welcome to Virtual Card</h2>
          <span class="bg-white/20 text-white text-xs px-3 py-1 rounded-full">Step 1 of 3</span>
        </div>
        <p class="text-white/70 text-sm mb-6">Let's set up your account in just a few steps</p>
      </div>
      
      <!-- Progress Steps -->
      <div class="px-6 flex space-x-2 mb-6">
        <div class="h-1 flex-1 rounded-full bg-white"></div>
        <div class="h-1 flex-1 rounded-full bg-white/30"></div>
        <div class="h-1 flex-1 rounded-full bg-white/30"></div>
      </div>
      
      <!-- Form Area -->
      <div class="bg-white/10 mx-6 rounded-xl p-5 mb-6">
        <div class="mb-5">
          <label class="block text-white/70 text-xs mb-1">Full Name</label>
          <div class="flex items-center bg-white/10 rounded-lg p-3">
            <div class="w-5 h-5 rounded-md bg-white/30 mr-3"></div>
            <input type="text" class="bg-transparent text-white w-full outline-none text-sm placeholder-white/50" placeholder="Enter your name">
          </div>
        </div>
        
        <div class="mb-5">
          <label class="block text-white/70 text-xs mb-1">Email Address</label>
          <div class="flex items-center bg-white/10 rounded-lg p-3">
            <div class="w-5 h-5 rounded-md bg-white/30 mr-3"></div>
            <input type="email" class="bg-transparent text-white w-full outline-none text-sm placeholder-white/50" placeholder="your.email@example.com">
          </div>
        </div>
        
        <div>
          <label class="block text-white/70 text-xs mb-1">Create Password</label>
          <div class="flex items-center bg-white/10 rounded-lg p-3">
            <div class="w-5 h-5 rounded-md bg-white/30 mr-3"></div>
            <input type="password" class="bg-transparent text-white w-full outline-none text-sm placeholder-white/50" placeholder="••••••••">
          </div>
        </div>
      </div>
      
      <!-- Password Strength -->
      <div class="px-6 mb-6">
        <div class="flex justify-between text-xs text-white/70 mb-1">
          <span>Password strength</span>
          <span>Medium</span>
        </div>
        <div class="h-1.5 w-full bg-white/20 rounded-full">
          <div class="h-1.5 bg-white w-1/2 rounded-full"></div>
        </div>
        <div class="flex justify-between text-xs text-white/70 mt-1">
          <span>Include special characters</span>
          <span>50%</span>
        </div>
      </div>
      
      <!-- Terms -->
      <div class="px-6 mb-6">
        <label class="flex items-start text-sm">
          <input type="checkbox" class="mt-0.5 mr-3">
          <span class="text-white/90">I agree to the <a href="#" class="text-white underline">Terms of Service</a> and <a href="#" class="text-white underline">Privacy Policy</a></span>
        </label>
      </div>
      
      <!-- Actions -->
      <div class="px-6 pb-6 space-y-3">
        <button class="w-full bg-white text-indigo-600 font-medium py-3 rounded-xl hover:bg-white/90 transition">Continue</button>
        <button class="w-full bg-transparent border border-white/20 text-white py-3 rounded-xl hover:bg-white/10 transition">Skip for now</button>
      </div>
      
      <!-- Footer -->
      <div class="bg-white/5 py-4 px-6 text-center">
        <p class="text-white/70 text-sm">Already have an account? <a href="#" class="text-white font-medium">Sign in</a></p>
      </div>
    </div>
  </div>
</body>
</html>
