<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pool Risk Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root { color-scheme: light; }
body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji"; }
/* Subtle animated water background */
.water-bg {
position: relative;
overflow: hidden;
background: linear-gradient(180deg, rgba(59,130,246,0.35), rgba(56,189,248,0.45));
backdrop-filter: saturate(120%) blur(2px);
-webkit-mask-image: radial-gradient(white, black);
}
.water-bg::before,
.water-bg::after {
content: "";
position: absolute;
inset: -20% -10%;
pointer-events: none;
}
/* Soft moving highlights */
.water-bg::before {
background:
radial-gradient(1200px 120px at 10% 30%, rgba(255,255,255,0.18), transparent 60%),
radial-gradient(900px 100px at 80% 60%, rgba(255,255,255,0.14), transparent 60%),
radial-gradient(700px 90px at 40% 80%, rgba(255,255,255,0.12), transparent 60%);
animation: driftY 12s ease-in-out infinite alternate;
}
/* Gentle horizontal wave shimmer */
.water-bg::after {
background:
repeating-linear-gradient(
-12deg,
rgba(255,255,255,0.15) 0 2px,
transparent 2px 18px
);
opacity: .35;
animation: waveX 8s linear infinite;
}
@keyframes waveX { from { transform: translateX(0); } to { transform: translateX(-120px); } }
@keyframes driftY { from { transform: translateY(-12px); } to { transform: translateY(12px); } }
/* Alert overlays */
.alert-overlay {
opacity: 0;
transition: opacity .18s ease;
pointer-events: none;
border-radius: .25rem;
}
.alert-overlay.visible { opacity: 1; }
/* Moving caution stripes over the alert color */
.alert-stripes {
position: absolute;
inset: 0;
background: repeating-linear-gradient(
45deg,
var(--alert-soft) 0px,
var(--alert-soft) 12px,
transparent 12px,
transparent 24px
);
background-size: 200% 200%;
animation: stripeMove 1s linear infinite;
mix-blend-mode: multiply;
}
@keyframes stripeMove {
0% { background-position: 0 0; }
100% { background-position: 24px 0; }
}
/* Inner glow and ring to draw attention */
.alert-glow {
position: absolute;
inset: 0;
border: 2px solid var(--alert-solid);
box-shadow:
inset 0 0 18px 2px var(--alert-soft),
0 0 0 2px rgba(255,255,255,0.25);
border-radius: .25rem;
animation: glowPulse 1.2s ease-in-out infinite;
}
@keyframes glowPulse {
0%,100% { box-shadow: inset 0 0 16px 1px var(--alert-soft), 0 0 0 2px rgba(255,255,255,0.25); }
50% { box-shadow: inset 0 0 26px 2px var(--alert-soft), 0 0 0 2px rgba(255,255,255,0.4); }
}
/* Center beacon ping */
.beacon-wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.beacon-core { width: .9rem; height: .9rem; border-radius: 9999px; background: var(--alert-solid); box-shadow: 0 0 0 3px rgba(255,255,255,.6); }
.beacon-ping {
position:absolute; width: 5.5rem; height: 5.5rem; border-radius: 9999px;
border: 2px solid var(--alert-solid); opacity:.85;
animation: pingRing 1.1s cubic-bezier(0,0,0.2,1) infinite;
}
@keyframes pingRing {
0% { transform: scale(.2); opacity: .95; }
70% { transform: scale(1); opacity: 0; }
100% { transform: scale(1.1); opacity: 0; }
}
</style></head>
  <body class="h-full bg-neutral-50 text-neutral-900 antialiased">
    <div class="min-h-screen flex items-start md:items-center justify-center px-4 py-8">
      <div class="w-full max-w-6xl">
        <!-- Header -->
        <div class="mb-5 flex flex-col md:flex-row md:items-end md:justify-between gap-4">
          <div>
            <h1 class="text-2xl md:text-3xl font-semibold tracking-tight text-neutral-900">Pool Risk Monitor</h1>
            <p class="text-sm text-neutral-600">Tap a test button to simulate an alert in a random tile.</p>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <button id="btn-pre" class="group inline-flex items-center gap-2 rounded-md px-3.5 py-2 text-sm font-medium tracking-tight border border-yellow-300/70 bg-yellow-50 text-yellow-900 hover:bg-yellow-100 transition shadow-sm">
              <i data-lucide="bell-ring" class="w-4.5 h-4.5 text-yellow-700"></i>
              Prealarm
            </button>
            <button id="btn-war" class="group inline-flex items-center gap-2 rounded-md px-3.5 py-2 text-sm font-medium tracking-tight border border-orange-300/70 bg-orange-50 text-orange-900 hover:bg-orange-100 transition shadow-sm">
              <i data-lucide="alert-triangle" class="w-4.5 h-4.5 text-orange-700"></i>
              Warning
            </button>
            <button id="btn-dang" class="group inline-flex items-center gap-2 rounded-md px-3.5 py-2 text-sm font-medium tracking-tight border border-red-300/70 bg-red-50 text-red-900 hover:bg-red-100 transition shadow-sm">
              <i data-lucide="alert-octagon" class="w-4.5 h-4.5 text-red-700"></i>
              Danger
            </button>
          </div>
        </div>

        <!-- Card -->
        <div class="rounded-2xl border border-neutral-200 bg-white backdrop-blur-md shadow-2xl overflow-hidden">
          <div class="p-4 md:p-6">
            <!-- Pool -->
            <div id="pool" class="water-bg rounded-xl ring-1 ring-black/10 shadow-xl" style="aspect-ratio: 10 / 6;">
              <!-- Grid frame -->
              <div id="poolGrid" class="absolute inset-2 md:inset-3 grid grid-cols-10 grid-rows-6 bg-sky-100/60 rounded-lg overflow-hidden">
                <!-- Cells injected by JS -->
              </div>
            </div>
          </div>
          <!-- Legend -->
          <div class="px-4 md:px-6 pb-5">
            <div class="flex flex-wrap gap-4 text-xs text-neutral-600">
              <div class="inline-flex items-center gap-2">
                <span class="inline-block h-3 w-3 rounded-sm bg-yellow-400/70 ring-2 ring-yellow-500/70"></span>
                Prealarm
              </div>
              <div class="inline-flex items-center gap-2">
                <span class="inline-block h-3 w-3 rounded-sm bg-orange-400/70 ring-2 ring-orange-500/70"></span>
                Warning
              </div>
              <div class="inline-flex items-center gap-2">
                <span class="inline-block h-3 w-3 rounded-sm bg-red-500/70 ring-2 ring-red-600/70"></span>
                Danger
              </div>
              <div class="ml-auto text-neutral-400">A1–F10 grid</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Icon render
      document.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
      });

      // Build grid dynamically: rows A–F, cols 1–10
      const poolGrid = document.getElementById('poolGrid');
      const rows = ['A','B','C','D','E','F'];
      const cols = Array.from({ length: 10 }, (_, i) => i + 1);

      const cellClass = "pool-cell relative bg-white/70 text-neutral-700 border border-slate-500/40 flex items-start justify-start";
      rows.forEach((r, ri) => {
        cols.forEach((c) => {
          const id = `${r}${c}`;
          const cell = document.createElement('div');
          cell.className = cellClass;
          cell.dataset.cell = id;

          // Label
          const label = document.createElement('span');
          label.className = "select-none p-1.5 md:p-2 text-[10px] md:text-xs font-medium text-neutral-700/80";
          label.textContent = id;
          cell.appendChild(label);

          // Alert overlay (hidden by default)
          const overlay = document.createElement('div');
          overlay.className = "alert-overlay absolute inset-0 rounded-sm";
          overlay.innerHTML = `
            <div class="alert-stripes"></div>
            <div class="alert-glow"></div>
            <div class="beacon-wrap">
              <span class="beacon-core"></span>
              <span class="beacon-ping"></span>
            </div>
          `;
          cell.appendChild(overlay);

          poolGrid.appendChild(cell);
        });
      });

      // Alert palette
      const palette = {
        prealarm: { soft: "rgba(250, 204, 21, 0.45)", solid: "#facc15" },   // pale yellow
        warning:  { soft: "rgba(251, 146, 60, 0.50)", solid: "#fb923c" },   // orange
        danger:   { soft: "rgba(239, 68, 68, 0.55)",  solid: "#ef4444" }    // red
      };

      function randomCell() {
        const cells = document.querySelectorAll('.pool-cell');
        return cells[Math.floor(Math.random() * cells.length)];
      }

      function setAlert(cell, type) {
        const overlay = cell.querySelector('.alert-overlay');
        const { soft, solid } = palette[type];

        overlay.style.setProperty('--alert-soft', soft);
        overlay.style.setProperty('--alert-solid', solid);

        // Reveal overlay
        overlay.classList.add('visible');

        // Make sure beacon colors match
        const core = overlay.querySelector('.beacon-core');
        const ping = overlay.querySelector('.beacon-ping');
        core.style.backgroundColor = solid;
        ping.style.borderColor = solid;
      }

      // Button bindings
      const btnPre = document.getElementById('btn-pre');
      const btnWar = document.getElementById('btn-war');
      const btnDan = document.getElementById('btn-dang');

      btnPre.addEventListener('click', () => setAlert(randomCell(), 'prealarm'));
      btnWar.addEventListener('click', () => setAlert(randomCell(), 'warning'));
      btnDan.addEventListener('click', () => setAlert(randomCell(), 'danger'));
    </script>
  </body>
</html>
