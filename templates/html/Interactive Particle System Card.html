<html lang="en">
<head>

  <meta charset="UTF-8">
  <title>Linear-Inspired Card with Particles</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @layer utilities {
      .bg-linear-dark { background-color: #000000; }
      .bg-linear-card { background-color: #101010; }
      .border-linear { border-color: #333333; }
      .text-linear-primary { color: #FFFFFF; }
      .text-linear-secondary { color: #8A8F98; }
      .text-linear-accent { color: #5E6AD2; }
      .button-linear { 
        background-color: #5E6AD2; 
        transition: all 0.2s ease;
      }
      .button-linear:hover { 
        background-color: #6872E5;
      }
    }
  </style>
</head>
<body class="bg-linear-dark min-h-screen flex items-center justify-center p-4 font-sans text-linear-primary">
  <div class="w-full max-w-md bg-linear-card rounded-xl border border-linear shadow-xl overflow-hidden relative">
    <!-- Particle background -->
    <div id="particles-container" class="absolute inset-0 w-full h-full opacity-80"></div>
    
    <!-- Card content -->
    <div class="relative z-10 p-6 flex flex-col h-full">
      <div class="flex items-center mb-5">
        <div class="w-8 h-8 rounded-md bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center mr-3">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="text-xl font-medium tracking-tight">Particle System</h2>
      </div>
      
      <p class="text-linear-secondary text-sm leading-relaxed mb-6">
        Interactive physics-based particle system with collision detection. Drag particles to interact with the system in real-time.
      </p>
      
      <div class="space-y-3 mb-8">
        <div class="flex items-center">
          <div class="w-4 h-4 rounded-full bg-indigo-500 mr-3"></div>
          <span class="text-sm">Collision-enabled geometry</span>
        </div>
        <div class="flex items-center">
          <div class="w-4 h-4 rounded-full bg-purple-500 mr-3"></div>
          <span class="text-sm">Drag-and-drop interaction</span>
        </div>
        <div class="flex items-center">
          <div class="w-4 h-4 rounded-full bg-pink-500 mr-3"></div>
          <span class="text-sm">Physics-based motion</span>
        </div>
      </div>
      
      <div class="flex flex-col gap-3 mt-auto">
        <button id="toggle-shapes" class="w-full py-2.5 px-4 rounded-md button-linear text-sm font-medium">
          Change Particle Shapes
        </button>
        <button class="w-full py-2.5 px-4 rounded-md bg-transparent border border-[#333333] text-sm font-medium hover:border-[#444444] transition-colors">
          Reset Simulation
        </button>
      </div>
    </div>
  </div>

  <script>
    (async () => {
      let shapeConfigs = [
        {
          types: ["circle", "square"],
          colors: ["#5E6AD2", "#8A8F98", "#F2994A", "#9E77ED", "#FF6B6B"]
        },
        {
          types: ["triangle", "polygon"],
          options: { polygon: { sides: 6 } },
          colors: ["#5E6AD2", "#9E77ED", "#FF6B6B", "#F2994A", "#6FCF97"]
        },
        {
          types: ["polygon", "star"],
          options: { 
            polygon: { sides: 5 }, 
            star: { sides: 5, inset: 2 }
          },
          colors: ["#9E77ED", "#5E6AD2", "#6FCF97", "#F2994A", "#FF6B6B"]
        },
        {
          types: ["heart", "rounded"],
          colors: ["#FF6B6B", "#F2994A", "#5E6AD2", "#9E77ED", "#6FCF97"]
        },
        {
          types: ["star", "circle", "square"],
          options: { 
            star: { sides: 6, inset: 3 }
          },
          colors: ["#F2994A", "#6FCF97", "#5E6AD2", "#FF6B6B", "#9E77ED"]
        },
        {
          types: ["polygon", "polygon", "polygon"],
          options: { 
            polygon: [
              { sides: 3 },
              { sides: 4 },
              { sides: 8 }
            ]
          },
          colors: ["#9E77ED", "#5E6AD2", "#FF6B6B", "#F2994A", "#6FCF97"]
        }
      ];
      
      let configIndex = 0;
      let particlesInstance;

      async function loadParticles() {
        const currentConfig = shapeConfigs[configIndex];
        
        particlesInstance = await tsParticles.load("particles-container", {
          fullScreen: { enable: false },
          fpsLimit: 60,
          particles: {
            color: {
              value: currentConfig.colors,
            },
            collisions: {
              enable: true,
              mode: "bounce",
            },
            move: {
              direction: "none",
              enable: true,
              outModes: {
                default: "bounce",
              },
              random: false,
              speed: 1.2,
              straight: false,
            },
            number: {
              value: 24,
              density: {
                enable: true,
                area: 800,
              }
            },
            opacity: {
              value: 0.85,
            },
            shape: {
              type: currentConfig.types,
              options: currentConfig.options || {}
            },
            size: {
              value: { min: 20, max: 40 },
            },
          },
          detectRetina: true,
          background: {
            color: "transparent",
          }
        });
      }

      function setupInteractions() {
        const container = document.getElementById("particles-container");
        const canvas = container.querySelector("canvas");
        if (!canvas || !particlesInstance) return;

        let dragging = false;
        let dragParticle = null;
        let offset = { x: 0, y: 0 };

        function getParticleAt(x, y) {
          const ratio = window.devicePixelRatio || 1;
          const px = x * ratio;
          const py = y * ratio;
          
          for (let p of particlesInstance.particles.array) {
            const dx = p.position.x - px;
            const dy = p.position.y - py;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist <= p.size.value) {
              return p;
            }
          }
          return null;
        }

        canvas.addEventListener("mousedown", (e) => {
          const rect = canvas.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          const p = getParticleAt(x, y);
          if (p) {
            dragging = true;
            dragParticle = p;
            const ratio = window.devicePixelRatio || 1;
            offset.x = p.position.x - x * ratio;
            offset.y = p.position.y - y * ratio;
            p.velocity.horizontal = 0;
            p.velocity.vertical = 0;
          }
        });

        window.addEventListener("mousemove", (e) => {
          if (dragging && dragParticle) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const ratio = window.devicePixelRatio || 1;
            
            dragParticle.position.x = x * ratio + offset.x;
            dragParticle.position.y = y * ratio + offset.y;
            dragParticle.velocity.horizontal = 0;
            dragParticle.velocity.vertical = 0;
          }
        });

        window.addEventListener("mouseup", () => {
          dragging = false;
          dragParticle = null;
        });
        
        // Add touch support
        canvas.addEventListener("touchstart", (e) => {
          if (e.touches.length > 0) {
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            const p = getParticleAt(x, y);
            if (p) {
              dragging = true;
              dragParticle = p;
              const ratio = window.devicePixelRatio || 1;
              offset.x = p.position.x - x * ratio;
              offset.y = p.position.y - y * ratio;
              p.velocity.horizontal = 0;
              p.velocity.vertical = 0;
              e.preventDefault();
            }
          }
        }, { passive: false });

        window.addEventListener("touchmove", (e) => {
          if (dragging && dragParticle && e.touches.length > 0) {
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            const ratio = window.devicePixelRatio || 1;
            
            dragParticle.position.x = x * ratio + offset.x;
            dragParticle.position.y = y * ratio + offset.y;
            dragParticle.velocity.horizontal = 0;
            dragParticle.velocity.vertical = 0;
            e.preventDefault();
          }
        }, { passive: false });

        window.addEventListener("touchend", () => {
          dragging = false;
          dragParticle = null;
        });
      }

      // Initialize particles
      await loadParticles();
      setupInteractions();

      // Setup shape toggle
      document.getElementById("toggle-shapes").addEventListener("click", async () => {
        configIndex = (configIndex + 1) % shapeConfigs.length;
        await particlesInstance.destroy();
        await loadParticles();
        setupInteractions();
      });

      // Setup reset button
      document.querySelector(".border-\\[\\#333333\\]").addEventListener("click", async () => {
        await particlesInstance.destroy();
        await loadParticles();
        setupInteractions();
      });
    })();
  </script>
</body>
</html>
