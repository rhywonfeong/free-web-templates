<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Otelde %25 İndirim Kampanya Banner</title>
  <meta name="viewport" content="width=1200">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', Arial, sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-[#00BFFF] via-[#1E90FF] to-[#254F7D] min-h-screen flex items-center justify-center">
  <div class="relative w-[1200px] h-[628px] rounded-2xl overflow-hidden shadow-xl flex items-center justify-center">
    <!-- Background image overlay -->
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80"
      alt="Hotel" class="absolute inset-0 w-full h-full object-cover opacity-60" />
    
    <!-- Gradient overlay -->
    <div class="absolute inset-0 bg-gradient-to-br from-[#00bfff66] via-[#1e90ffbb] to-[#254f7dcc] z-10"></div>

    <!-- "Mobil Uygulamada Geçerli" Badge -->
    <div class="absolute top-12 left-12 flex flex-col items-center z-20">
      <div class="bg-[#12bf3c] border-4 border-white shadow-lg rounded-full w-40 h-40 flex flex-col items-center justify-center">
        <span class="text-white text-center font-extrabold text-lg leading-tight tracking-tighter drop-shadow-lg" style="font-family:Poppins, Arial, sans-serif;">
          Mobil<br>Uygulamada<br>Geçerli
        </span>
      </div>
    </div>

    <!-- Date badge -->
    <div class="absolute top-12 right-16 z-20">
      <div class="bg-white/90 rounded-xl px-8 py-3 shadow-md border border-black/10">
        <span class="text-[#FF3300] font-black text-3xl tracking-tight" style="font-family:Poppins, Arial, sans-serif;">
          16-19 Haziran'a Özel
        </span>
      </div>
    </div>

    <!-- Main Campaign Text -->
    <div class="flex flex-col items-center justify-center h-full w-full z-30 relative">
      <div class="bg-gradient-to-r from-[#FF9600] to-[#FF4D00] px-12 py-4 rounded-2xl shadow-2xl mb-8">
        <h1 class="text-white text-center font-extrabold text-6xl md:text-7xl leading-tight tracking-tight drop-shadow-lg" style="font-family:Poppins, Arial, sans-serif;">
          Otel'de <span class="text-yellow-300 drop-shadow-lg"> %25 İNDİRİM! </span>
        </h1>
      </div>
      <div class="mt-4">
        <span class="inline-block bg-[#12bf3c] rounded-lg px-6 py-2 text-white font-bold text-2xl drop-shadow-md" style="font-family:Poppins, Arial, sans-serif;">
          KOD: HOTEL25
        </span>
      </div>
      <div class="mt-6 text-center text-white/90 font-medium text-xl max-w-2xl drop-shadow" style="font-family:Poppins, Arial, sans-serif;">
        Fırsatı kaçırma! Otel rezervasyonlarında yalnızca bu tarihler arasında geçerlidir. Mobil uygulamada kullan.
      </div>
    </div>
  </div>
</body>
</html>
