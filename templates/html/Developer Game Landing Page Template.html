<meta charset="UTF-8">

<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap');
body {
font-family: 'JetBrains Mono', monospace;
background-color: #050505;
cursor: crosshair;
}
/* Custom Shake Animation */
@keyframes shake {
0% { transform: translate(1px, 1px) rotate(0deg); }
10% { transform: translate(-1px, -2px) rotate(-1deg); }
20% { transform: translate(-3px, 0px) rotate(1deg); }
30% { transform: translate(3px, 2px) rotate(0deg); }
40% { transform: translate(1px, -1px) rotate(1deg); }
50% { transform: translate(-1px, 2px) rotate(-1deg); }
60% { transform: translate(-3px, 1px) rotate(0deg); }
70% { transform: translate(3px, 1px) rotate(-1deg); }
80% { transform: translate(-1px, -1px) rotate(1deg); }
90% { transform: translate(1px, 2px) rotate(0deg); }
100% { transform: translate(1px, -2px) rotate(-1deg); }
}
.shake-hard {
animation: shake 0.2s cubic-bezier(.36,.07,.19,.97) both;
}
/* Glitch Text Effect */
.glitch {
position: relative;
}
.glitch::before,
.glitch::after {
content: attr(data-text);
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
}
.glitch::before {
left: 2px;
text-shadow: -1px 0 #ff00c1;
clip: rect(44px, 450px, 56px, 0);
animation: glitch-anim 5s infinite linear alternate-reverse;
display: none;
}
.glitch::after {
left: -2px;
text-shadow: -1px 0 #00fff9;
clip: rect(44px, 450px, 56px, 0);
animation: glitch-anim2 5s infinite linear alternate-reverse;
display: none;
}
.glitch-active::before, .glitch-active::after {
display: block;
}
@keyframes glitch-anim {
0% { clip: rect(12px, 9999px, 5px, 0); }
20% { clip: rect(89px, 9999px, 78px, 0); }
40% { clip: rect(2px, 9999px, 33px, 0); }
60% { clip: rect(66px, 9999px, 11px, 0); }
80% { clip: rect(10px, 9999px, 90px, 0); }
100% { clip: rect(45px, 9999px, 2px, 0); }
}
@keyframes glitch-anim2 {
0% { clip: rect(65px, 9999px, 100px, 0); }
20% { clip: rect(3px, 9999px, 34px, 0); }
40% { clip: rect(50px, 9999px, 2px, 0); }
60% { clip: rect(12px, 9999px, 88px, 0); }
80% { clip: rect(99px, 9999px, 12px, 0); }
100% { clip: rect(2px, 9999px, 66px, 0); }
}
.scanline {
width: 100%;
height: 100px;
z-index: 10;
background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(0,0,0,0) 100%);
opacity: 0.1;
position: absolute;
bottom: 100%;
animation: scanline 10s linear infinite;
pointer-events: none;
}
@keyframes scanline {
0% { bottom: 100%; }
100% { bottom: -100px; }
}
</style></head>
<body class="h-screen w-full overflow-hidden text-zinc-400 select-none flex flex-col items-center justify-center relative transition-colors duration-1000" id="main-body">

    <!-- Scanline Overlay -->
    <div class="scanline"></div>

    <!-- MAIN GAME UI -->
    <div id="game-ui" class="w-full max-w-md p-6 flex flex-col items-center justify-between h-[80vh] transition-opacity duration-1000">
        
        <!-- HEADER -->
        <div class="text-center space-y-2 w-full">
            <h1 class="text-4xl tracking-tighter text-zinc-100 font-semibold glitch" data-text="gm dev" id="main-title">gm dev</h1>
            <p id="status-line" class="text-xs tracking-wide text-zinc-600 uppercase">status: <span class="text-zinc-400">broke</span></p>
        </div>

        <!-- STATS -->
        <div class="grid grid-cols-4 gap-4 w-full text-center py-8">
            <div class="flex flex-col items-center gap-1 group">
                <iconify-icon icon="lucide:zap" width="16" class="text-zinc-600 group-hover:text-yellow-400 transition-colors"></iconify-icon>
                <span class="text-xs text-zinc-600">stress</span>
                <span id="stat-stress" class="text-sm font-semibold text-zinc-300">10%</span>
            </div>
            <div class="flex flex-col items-center gap-1 group">
                <iconify-icon icon="lucide:bug" width="16" class="text-zinc-600 group-hover:text-red-400 transition-colors"></iconify-icon>
                <span class="text-xs text-zinc-600">bugs</span>
                <span id="stat-bugs" class="text-sm font-semibold text-zinc-300">0</span>
            </div>
            <div class="flex flex-col items-center gap-1 group">
                <iconify-icon icon="lucide:crown" width="16" class="text-zinc-600 group-hover:text-purple-400 transition-colors"></iconify-icon>
                <span class="text-xs text-zinc-600">ego</span>
                <span id="stat-ego" class="text-sm font-semibold text-zinc-300">smol</span>
            </div>
            <div class="flex flex-col items-center gap-1 group">
                <iconify-icon icon="lucide:coins" width="16" class="text-zinc-600 group-hover:text-green-400 transition-colors"></iconify-icon>
                <span class="text-xs text-zinc-600">money</span>
                <span id="stat-money" class="text-sm font-semibold text-zinc-300">$0</span>
            </div>
        </div>

        <!-- DYNAMIC MESSAGE -->
        <div class="h-16 flex items-center justify-center w-full px-4 text-center">
            <p id="console-msg" class="text-sm text-zinc-300 italic tracking-tight min-h-[1.5rem] opacity-80"></p>
        </div>

        <!-- MAIN ACTION -->
        <div class="flex-grow flex items-center justify-center w-full relative">
            <button id="ship-btn" class="relative group outline-none focus:outline-none">
                <!-- Glitch/Noise BG on hover -->
                <div class="absolute -inset-1 bg-gradient-to-r from-zinc-800 to-zinc-700 rounded-lg blur opacity-25 group-hover:opacity-75 transition duration-200 group-hover:duration-200 animate-pulse"></div>
                
                <div class="relative px-12 py-6 bg-black border border-zinc-800 hover:border-zinc-500 text-zinc-100 font-bold text-xl tracking-widest uppercase rounded-sm transition-all duration-75 active:scale-95 active:bg-zinc-100 active:text-black flex items-center gap-3">
                    <span class="text-zinc-500 group-hover:text-zinc-300 transition-colors">[</span>
                    ship
                    <span class="text-zinc-500 group-hover:text-zinc-300 transition-colors">]</span>
                </div>
            </button>
        </div>

        <!-- FOOTER HINT -->
        <div class="text-center text-[10px] text-zinc-800 pointer-events-none">
            v0.0.1-alpha // do not refresh
        </div>
    </div>

    <!-- END SCREEN (HIDDEN) -->
    <div id="end-screen" class="hidden absolute inset-0 bg-black flex flex-col items-center justify-center z-50 text-center space-y-8 p-8 opacity-0 transition-opacity duration-2000">
        <div class="space-y-2">
            <h2 class="text-lg text-zinc-100 font-semibold tracking-tight">System Halted.</h2>
            <p class="text-sm text-zinc-500 font-mono">Session terminated.</p>
        </div>

        <div class="w-full max-w-xs border-t border-b border-zinc-900 py-6 space-y-4">
            <div class="flex justify-between items-center text-sm">
                <span class="text-zinc-600">Years shipped</span>
                <span id="end-years" class="text-zinc-300 font-mono">0</span>
            </div>
            <div class="flex justify-between items-center text-sm">
                <span class="text-zinc-600">Things broken</span>
                <span id="end-broken" class="text-zinc-300 font-mono">0</span>
            </div>
            <div class="flex justify-between items-center text-sm">
                <span class="text-zinc-600">Things learned</span>
                <span id="end-learned" class="text-zinc-300 font-mono">Everything</span>
            </div>
        </div>

        <div class="pt-8">
            <a href="#" class="text-xs text-zinc-600 hover:text-zinc-300 transition-colors underline underline-offset-4 decoration-zinc-800">
                If you want to build real things, reach out.
            </a>
        </div>
    </div>

    <script>
        // --- CONFIG & STATE ---
        const btn = document.getElementById('ship-btn');
        const msgEl = document.getElementById('console-msg');
        const ui = document.getElementById('game-ui');
        const body = document.getElementById('main-body');
        const endScreen = document.getElementById('end-screen');
        const title = document.getElementById('main-title');
        
        let stats = {
            stress: 10,
            bugs: 0,
            ego: 1,
            money: 0
        };

        let clicks = 0;
        let lastClickTime = Date.now();
        let spamCount = 0;
        let isFrozen = false;
        let idleTimer = null;
        let era = 0; // 0: Learning, 1: Freelance, 2: Startup, 3: Burnout

        // --- CONTENT ---
        const eras = [
            { // Era 0: Learning (0-15 clicks)
                msgs: [
                    "Hello world?", "It runs on my machine.", "StackOverflow copy-paste.", 
                    "Missed a semicolon.", "Console.log('here').", "CSS is hard.", 
                    "What is a div?", "Git push --force.", "Deleting node_modules...",
                    "Watching tutorials.", "It works. Somehow."
                ],
                tone: "bg-zinc-950"
            },
            { // Era 1: Freelance (16-40 clicks)
                msgs: [
                    "Client hates the font.", "Payment pending.", "Scope creep detected.", 
                    "Fixed it in post.", "Emailing invoice...", "Can you make the logo bigger?",
                    "Deploying on Friday.", "Meeting that could be an email.", "Coffee overdose.",
                    "Sleep is for the weak.", "Another revision."
                ],
                tone: "bg-black"
            },
            { // Era 2: Degen / Startup (41-75 clicks)
                msgs: [
                    "VC funding secured.", "Server crashed.", "Hiring intern.", 
                    "Twitter drama.", "Product Hunt launch.", "Tech debt piling up.",
                    "We need AI.", "Pivot.", "Burn rate is high.", 
                    "User retention is 0.", "Refactoring everything."
                ],
                tone: "bg-zinc-950"
            },
            { // Era 3: Burnout / End (76+ clicks)
                msgs: [
                    "Why are we doing this?", "Just ship it.", "Nothing matters.", 
                    "404 Sanity Not Found.", "I miss sunlight.", "Golden handcuffs.",
                    "Another feature.", "Click click click.", "Is this success?",
                    "Let's break prod."
                ],
                tone: "bg-black"
            }
        ];

        const spamMsgs = ["Slow down.", "You're rushing.", "Touch grass.", "Breathe.", "Spaghetti code."];
        const idleMsgs = ["Nothing ships itself.", "Deadlines approaching.", "Are you there?", "Server costs are running."];

        // --- AUDIO (Simulated via visual feedback only per request) ---

        // --- LOGIC ---

        function updateUI() {
            // Update Stats Display
            document.getElementById('stat-stress').innerText = stats.stress + "%";
            document.getElementById('stat-bugs').innerText = stats.bugs;
            document.getElementById('stat-money').innerText = stats.money > 1000 ? (stats.money/1000).toFixed(1) + "k" : "$" + stats.money;
            
            // Ego logic
            let egoText = "smol";
            if (stats.ego > 10) egoText = "dev";
            if (stats.ego > 30) egoText = "senior";
            if (stats.ego > 50) egoText = "10x";
            if (stats.ego > 80) egoText = "god";
            document.getElementById('stat-ego').innerText = egoText;

            // Status Line Logic
            const statusEl = document.querySelector('#status-line span');
            if(stats.stress > 80) {
                statusEl.innerText = "panicked";
                statusEl.className = "text-red-500 animate-pulse";
            } else if (stats.money > 5000) {
                statusEl.innerText = "comfortable";
                statusEl.className = "text-green-500";
            } else if (stats.bugs > 20) {
                statusEl.innerText = "debugging";
                statusEl.className = "text-yellow-500";
            } else {
                statusEl.innerText = clicks < 20 ? "broke" : "shipping";
                statusEl.className = "text-zinc-400";
            }
        }

        function triggerGlitch() {
            title.classList.add('glitch-active');
            setTimeout(() => title.classList.remove('glitch-active'), 200);
            
            btn.classList.add('shake-hard');
            setTimeout(() => btn.classList.remove('shake-hard'), 200);
        }

        function checkEra() {
            if (clicks > 15 && era === 0) era = 1;
            if (clicks > 40 && era === 1) era = 2;
            if (clicks > 75 && era === 2) era = 3;
            
            // End Game Condition
            if (clicks > 100) { 
                initFreeze(); 
            }
        }

        function initFreeze() {
            if (isFrozen) return;
            isFrozen = true;
            
            // Freeze UI
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            msgEl.innerText = "ok. enough playing.";
            msgEl.className = "text-sm text-red-500 font-bold tracking-widest";
            
            clearInterval(idleTimer);

            // Transition
            setTimeout(() => {
                ui.style.opacity = '0';
                setTimeout(() => {
                    ui.style.display = 'none';
                    showEndScreen();
                }, 1000);
            }, 2000);
        }

        function showEndScreen() {
            endScreen.classList.remove('hidden');
            
            // Calculate fake final stats based on run
            const finalYears = Math.floor(clicks / 12);
            const finalBroken = stats.bugs * 14 + 3;
            
            document.getElementById('end-years').innerText = finalYears + "y";
            document.getElementById('end-broken').innerText = finalBroken;
            
            // Fade in
            setTimeout(() => {
                endScreen.classList.remove('opacity-0');
            }, 100);
        }

        function ship() {
            if (isFrozen) return;

            const now = Date.now();
            const diff = now - lastClickTime;
            lastClickTime = now;
            clicks++;

            // Reset idle check
            clearInterval(idleTimer);
            idleTimer = setInterval(() => {
                if(!isFrozen) {
                    msgEl.innerText = idleMsgs[Math.floor(Math.random() * idleMsgs.length)];
                    msgEl.style.opacity = "0.5";
                }
            }, 8000);

            // Spam logic
            let isSpam = false;
            if (diff < 200) {
                spamCount++;
                if (spamCount > 3) isSpam = true;
            } else {
                spamCount = 0;
            }

            // Update Logic
            checkEra();
            if (isFrozen) return;

            // Visuals
            triggerGlitch();
            msgEl.style.opacity = "1";

            // Determine Message
            let txt = "";
            if (isSpam) {
                txt = spamMsgs[Math.floor(Math.random() * spamMsgs.length)];
                stats.stress += 5;
                stats.bugs += 1;
            } else {
                const pool = eras[era].msgs;
                txt = pool[Math.floor(Math.random() * pool.length)];
                
                // Random Stat Chaos
                if (Math.random() > 0.5) stats.money += Math.floor(Math.random() * 100) * (era + 1);
                if (Math.random() > 0.7) stats.bugs += 1;
                if (Math.random() > 0.3) stats.stress += (Math.random() > 0.5 ? 2 : -1);
                if (Math.random() > 0.6) stats.ego += 2;
                
                // Cap stats
                if (stats.stress < 0) stats.stress = 0;
                if (stats.stress > 100) stats.stress = 100;
            }
            
            msgEl.innerText = txt.toLowerCase();
            updateUI();
        }

        // --- INIT ---
        btn.addEventListener('click', ship);
        
        // Prevent simple refresh accidental loss (cosmetic only for single file)
        window.onbeforeunload = function() {
            return "Nice try.";
        };

        // Start Idle Timer
        idleTimer = setInterval(() => {
            msgEl.innerText = "ship something.";
            msgEl.style.opacity = "0.5";
        }, 5000);

    </script>
</body>
