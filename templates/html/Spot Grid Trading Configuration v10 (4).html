<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script></head>

<body class="min-h-screen bg-neutral-950 text-neutral-200" style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji', 'Segoe UI Emoji';">
  <main class="mx-auto max-w-[420px] sm:max-w-[560px] px-4 sm:px-6 py-6 md:py-10">
    <div class="rounded-2xl border border-white/10 bg-neutral-900/70 backdrop-blur shadow-2xl overflow-hidden">
      <!-- Top tabs (full width) -->
      <div class="border-b border-white/10">
        <div class="grid grid-cols-2">
          <button class="relative w-full min-h-[44px] py-3 text-sm md:text-[15px] font-normal text-neutral-400 hover:text-neutral-200 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20 active:bg-neutral-800/80">
            Trade
          </button>
          <button class="relative w-full min-h-[44px] py-3 text-sm md:text-[15px] font-semibold tracking-tight text-emerald-300 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20">
            Strategies
            <span class="pointer-events-none absolute -bottom-px left-0 h-0.5 w-full bg-emerald-400"></span>
          </button>
        </div>
      </div>

      <!-- Filter cells -->
      <div class="p-4 sm:p-5 pt-4">
        <div class="grid grid-cols-6 gap-2">
          <button class="w-full min-h-[44px] px-3 py-2 rounded-lg text-xs md:text-sm font-medium tracking-tight text-emerald-300 bg-emerald-500/10 border border-emerald-500/20 hover:bg-emerald-500/15 transition text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20 active:bg-neutral-800/80">
            All
          </button>
          <button class="w-full min-h-[44px] px-3 py-2 rounded-lg text-xs md:text-sm font-medium text-neutral-400 bg-neutral-800/70 border border-white/10 hover:bg-neutral-800 hover:text-neutral-200 transition text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20 active:bg-neutral-800/80">
            Bullish
          </button>
          <button class="w-full min-h-[44px] px-3 py-2 rounded-lg text-xs md:text-sm font-medium text-neutral-400 bg-neutral-800/70 border border-white/10 hover:bg-neutral-800 hover:text-neutral-200 transition text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20 active:bg-neutral-800/80">
            Bearish
          </button>
          <button class="w-full min-h-[44px] px-3 py-2 rounded-lg text-xs md:text-sm font-medium text-neutral-400 bg-neutral-800/70 border border-white/10 hover:bg-neutral-800 hover:text-neutral-200 transition text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20 active:bg-neutral-800/80">
            Sideways
          </button>
          <button class="w-full min-h-[44px] px-3 py-2 rounded-lg text-xs md:text-sm font-medium text-neutral-400 bg-neutral-800/70 border border-white/10 hover:bg-neutral-800 hover:text-neutral-200 transition text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20 active:bg-neutral-800/80">
            Slicing bots
          </button>
          <button class="w-full min-h-[44px] px-3 py-2 rounded-lg text-xs md:text-sm font-medium text-neutral-400 bg-neutral-800/70 border border-white/10 hover:bg-neutral-800 hover:text-neutral-200 transition text-left focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20 active:bg-neutral-800/80">
            Signal bots
          </button>
        </div>
      </div>

      <!-- Strategies grid -->
      <section aria-label="Strategies" class="px-4 sm:px-5 pb-5">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
          <!-- Card -->
          <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-neutral-900/70 backdrop-blur p-4 hover:bg-neutral-800 transition active:bg-neutral-800/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20">
            <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-neutral-800/70">
              <i data-lucide="grid-3x3" class="h-4 w-4 text-neutral-200" stroke-width="1.5" aria-hidden="true"></i>
            </span>
            <div class="flex-1 text-left">
              <h3 class="text-[15px] md:text-base font-medium tracking-tight text-neutral-200">Futures grid</h3>
              <p class="hidden sm:block text-xs text-neutral-400">Automated grid strategy for futures markets.</p>
            </div>
          </button>

          <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-neutral-900/70 backdrop-blur p-4 hover:bg-neutral-800 transition active:bg-neutral-800/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20">
            <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-neutral-800/70">
              <i data-lucide="grid" class="h-4 w-4 text-neutral-200" stroke-width="1.5" aria-hidden="true"></i>
            </span>
            <div class="flex-1 text-left">
              <h3 class="text-[15px] md:text-base font-medium tracking-tight text-neutral-200">Spot grid</h3>
              <p class="hidden sm:block text-xs text-neutral-400">Range-trading grid for spot pairs.</p>
            </div>
          </button>

          <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-neutral-900/70 backdrop-blur p-4 hover:bg-neutral-800 transition active:bg-neutral-800/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20">
            <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-neutral-800/70">
              <i data-lucide="repeat-2" class="h-4 w-4 text-neutral-200" stroke-width="1.5" aria-hidden="true"></i>
            </span>
            <div class="flex-1 text-left">
              <h3 class="text-[15px] md:text-base font-medium tracking-tight text-neutral-200">Futures DCA</h3>
              <p class="hidden sm:block text-xs text-neutral-400">Scale into futures positions over time.</p>
            </div>
          </button>

          <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-neutral-900/70 backdrop-blur p-4 hover:bg-neutral-800 transition active:bg-neutral-800/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20">
            <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-neutral-800/70">
              <i data-lucide="repeat" class="h-4 w-4 text-neutral-200" stroke-width="1.5" aria-hidden="true"></i>
            </span>
            <div class="flex-1 text-left">
              <h3 class="text-[15px] md:text-base font-medium tracking-tight text-neutral-200">Spot DCA</h3>
              <p class="hidden sm:block text-xs text-neutral-400">Average into spot positions automatically.</p>
            </div>
          </button>

          <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-neutral-900/70 backdrop-blur p-4 hover:bg-neutral-800 transition active:bg-neutral-800/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20">
            <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-neutral-800/70">
              <i data-lucide="refresh-cw" class="h-4 w-4 text-neutral-200" stroke-width="1.5" aria-hidden="true"></i>
            </span>
            <div class="flex-1 text-left">
              <h3 class="text-[15px] md:text-base font-medium tracking-tight text-neutral-200">Flywheel</h3>
              <p class="hidden sm:block text-xs text-neutral-400">Compound gains via cyclical execution.</p>
            </div>
          </button>

          <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-neutral-900/70 backdrop-blur p-4 hover:bg-neutral-800 transition active:bg-neutral-800/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20">
            <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-neutral-800/70">
              <i data-lucide="arrows-left-right" class="h-4 w-4 text-neutral-200" stroke-width="1.5" aria-hidden="true"></i>
            </span>
            <div class="flex-1 text-left">
              <h3 class="text-[15px] md:text-base font-medium tracking-tight text-neutral-200">Smart Arbitrage</h3>
              <p class="hidden sm:block text-xs text-neutral-400">Capture spreads across pairs or venues.</p>
            </div>
          </button>

          <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-neutral-900/70 backdrop-blur p-4 hover:bg-neutral-800 transition active:bg-neutral-800/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20">
            <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-neutral-800/70">
              <i data-lucide="calendar-plus" class="h-4 w-4 text-neutral-200" stroke-width="1.5" aria-hidden="true"></i>
            </span>
            <div class="flex-1 text-left">
              <h3 class="text-[15px] md:text-base font-medium tracking-tight text-neutral-200">Recurring buy</h3>
              <p class="hidden sm:block text-xs text-neutral-400">Automate periodic accumulation.</p>
            </div>
          </button>

          <button class="group flex items-center gap-4 rounded-xl border border-white/10 bg-neutral-900/70 backdrop-blur p-4 hover:bg-neutral-800 transition active:bg-neutral-800/80 focus:outline-none focus-visible:ring-2 focus-visible:ring-white/20">
            <span class="flex h-10 w-10 items-center justify-center rounded-full border border-white/10 bg-neutral-800/70">
              <i data-lucide="activity" class="h-4 w-4 text-neutral-200" stroke-width="1.5" aria-hidden="true"></i>
            </span>
            <div class="flex-1 text-left">
              <h3 class="text-[15px] md:text-base font-medium tracking-tight text-neutral-200">Tradingview signal</h3>
              <p class="hidden sm:block text-xs text-neutral-400">Execute from external alerts.</p>
            </div>
          </button>
        </div>
      </section>
    </div>
  </main>

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body></html>
