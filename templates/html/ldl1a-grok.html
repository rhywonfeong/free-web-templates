<!DOCTYPE html>
<html lang="en" class="dark">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aura Launcher</title>
<!-- PWA Settings -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<!-- Fonts: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
darkMode: 'class',
theme: {
extend: {
fontFamily: { sans: ['Inter', 'sans-serif'] },
colors: {
gray: { 850: '#1f1f1f', 900: '#111111', 950: '#0a0a0a' }
},
animation: {
'fade-in': 'fadeIn 0.3s ease-out',
'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
},
keyframes: {
fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } }
}
}
}
}
</script>
<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js" defer></script>
<style>
body { -ms-overflow-style: none; scrollbar-width: none; background-color: #000000; }
body::-webkit-scrollbar { display: none; }
* { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
html { scroll-behavior: smooth; }
.iconify { width: 100%; height: 100%; }
.sortable-ghost { opacity: 0.2; transform: scale(0.95); }
.sortable-drag { cursor: grabbing; opacity: 1; transform: scale(1.05); z-index: 50; }
/* Prevent pull-to-refresh on mobile */
body { overscroll-behavior-y: none; }
</style></head>
<body x-data="launcher" class="text-white min-h-screen antialiased overflow-x-hidden relative selection:bg-neutral-800">

    <!-- Background Gradients -->
    <div class="fixed inset-0 pointer-events-none z-0">
        <div class="absolute top-0 left-0 w-full h-40 bg-gradient-to-b from-neutral-900/40 to-transparent"></div>
        <div class="absolute bottom-0 left-0 w-full h-40 bg-gradient-to-t from-black via-black/80 to-transparent"></div>
    </div>

    <!-- Login Status / Button -->
    <div class="fixed top-6 right-6 z-40 animate-fade-in">
        <template x-if="!user">
            <button @click="signIn()" class="flex items-center gap-2 px-3 py-1.5 bg-neutral-900/80 backdrop-blur-md border border-white/10 rounded-full hover:bg-neutral-800 transition-all text-[10px] font-medium text-neutral-400 hover:text-white group shadow-lg">
                <span class="iconify w-3.5 h-3.5" data-icon="flat-color-icons:google"></span>
                <span>Sign In</span>
            </button>
        </template>
        <template x-if="user">
            <div class="group relative">
                <div class="w-8 h-8 rounded-full overflow-hidden border border-white/10 opacity-60 hover:opacity-100 transition-opacity cursor-pointer">
                    <img :src="user.photoURL" class="w-full h-full object-cover">
                </div>
                <!-- Sign Out Tooltip -->
                <div @click="signOutUser()" class="absolute right-0 top-10 w-24 bg-neutral-900 border border-white/10 rounded-lg py-1 px-2 text-center text-[10px] text-neutral-400 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none group-hover:pointer-events-auto cursor-pointer hover:bg-neutral-800 hover:text-white shadow-xl">
                    Sign Out
                </div>
            </div>
        </template>
    </div>

    <!-- Main Container -->
    <main class="relative z-10 w-full max-w-7xl mx-auto px-4 pt-16 pb-40">
        
        <!-- Grid -->
        <div x-ref="gridContainer" class="grid grid-cols-5 md:grid-cols-8 lg:grid-cols-10 gap-x-3 gap-y-6 md:gap-6 w-full pb-20">
            
            <!-- App Items -->
            <template x-for="(app, index) in apps" :key="app.id">
                <div :data-id="app.id" class="group flex flex-col items-center gap-2 cursor-pointer touch-manipulation transition-transform duration-200 active:scale-95 relative">
                    
                    <!-- Delete Button (Visible on Long Press/Hover in desktop) -->
                    <button @click.stop="deleteApp(app.id)" class="absolute -top-2 -right-2 z-20 w-5 h-5 bg-red-500/80 rounded-full text-white flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity md:group-hover:translate-y-0 translate-y-2 pointer-events-none group-hover:pointer-events-auto">
                        <span class="iconify w-3 h-3" data-icon="lucide:x"></span>
                    </button>

                    <!-- Icon Card -->
                    <div @click="launchApp(app.url)" class="relative w-full aspect-square bg-neutral-900/60 border border-white/5 rounded-[22px] flex items-center justify-center shadow-lg shadow-black/50 overflow-hidden group-hover:bg-neutral-800/80 group-hover:border-white/15 transition-all duration-300">
                        <!-- Gradient Overlay -->
                        <div class="absolute inset-0 bg-gradient-to-tr from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                        <!-- Icon -->
                        <div class="w-[50%] h-[50%] text-neutral-400 group-hover:text-white transition-colors duration-300 drop-shadow-md">
                            <span class="iconify" :data-icon="app.icon"></span>
                        </div>
                    </div>

                    <!-- App Name -->
                    <span x-text="app.name" class="text-[0.6rem] md:text-xs font-medium tracking-tight text-neutral-500 group-hover:text-neutral-300 text-center truncate w-full px-1"></span>
                </div>
            </template>
            
            <!-- Ghost Slots (Decorative) -->
            <template x-for="i in 15">
                <div class="flex flex-col items-center gap-2 opacity-[0.02] pointer-events-none select-none">
                    <div class="w-full aspect-square bg-neutral-800 rounded-[22px] border border-white/5"></div>
                    <div class="h-1.5 w-8 bg-neutral-800 rounded-full"></div>
                </div>
            </template>
        </div>
    </main>

    <!-- Floating Add Button -->
    <div class="fixed bottom-8 left-0 right-0 flex justify-center z-50 pointer-events-none">
        <button @click="showModal = true" class="pointer-events-auto bg-neutral-900/90 backdrop-blur-xl border border-white/10 text-white rounded-full w-14 h-14 flex items-center justify-center shadow-2xl hover:scale-110 hover:border-white/20 active:scale-95 transition-all duration-300 group animate-slide-up">
            <span class="iconify w-6 h-6 text-neutral-400 group-hover:text-white transition-colors" data-icon="lucide:plus"></span>
        </button>
    </div>

    <!-- Add App Modal -->
    <div x-show="showModal" style="display: none;" class="fixed inset-0 z-[100] flex items-center justify-center px-4" 
         x-transition:enter="transition ease-out duration-200" 
         x-transition:enter-start="opacity-0" 
         x-transition:enter-end="opacity-100" 
         x-transition:leave="transition ease-in duration-150" 
         x-transition:leave-start="opacity-100" 
         x-transition:leave-end="opacity-0">
        
        <div @click="showModal = false" class="absolute inset-0 bg-black/80 backdrop-blur-sm"></div>
        
        <div class="relative bg-neutral-900 border border-white/10 w-full max-w-sm rounded-[32px] p-6 shadow-2xl animate-slide-up overflow-hidden">
            <!-- Modal Header -->
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-sm font-semibold tracking-tight text-white">Add New App</h2>
                <button @click="showModal = false" class="text-neutral-500 hover:text-white transition-colors bg-neutral-800/50 rounded-full p-1">
                    <span class="iconify w-4 h-4" data-icon="lucide:x"></span>
                </button>
            </div>

            <!-- Form -->
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-medium text-neutral-500 uppercase tracking-wider mb-1.5">App Name</label>
                    <input type="text" x-model="newApp.name" placeholder="Name" class="w-full bg-neutral-950 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-neutral-700 focus:outline-none focus:border-white/30 transition-colors">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-neutral-500 uppercase tracking-wider mb-1.5">URL</label>
                    <input type="url" x-model="newApp.url" placeholder="https://" class="w-full bg-neutral-950 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-neutral-700 focus:outline-none focus:border-white/30 transition-colors">
                </div>
                <div>
                    <label class="block text-[10px] font-medium text-neutral-500 uppercase tracking-wider mb-1.5">Icon (Solar Bold Duotone)</label>
                    <div class="relative">
                        <input type="text" x-model="newApp.icon" placeholder="solar:star-bold-duotone" class="w-full bg-neutral-950 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-neutral-700 focus:outline-none focus:border-white/30 transition-colors pr-10">
                        <div class="absolute right-3 top-1/2 -translate-y-1/2 text-neutral-500">
                            <span class="iconify w-5 h-5" :data-icon="newApp.icon || 'solar:question-circle-bold-duotone'"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Action Button -->
            <button @click="addApp()" class="w-full mt-6 bg-white text-black font-semibold text-sm py-3.5 rounded-xl hover:bg-neutral-200 active:scale-[0.98] transition-all shadow-lg shadow-white/10">
                Add to Grid
            </button>
        </div>
    </div>

    <!-- Firebase & Logic Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Provided Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCo0Rq6eABM3Q6le_x9VjskDCCAg1XUl8A",
            authDomain: "livedesklauncher.firebaseapp.com",
            projectId: "livedesklauncher",
            storageBucket: "livedesklauncher.firebasestorage.app",
            messagingSenderId: "719865623018",
            appId: "1:719865623018:web:104315b70c32db5bd4c293",
            measurementId: "G-N1XRVV5SNJ",
            databaseURL: "https://livedesklauncher-default-rtdb.europe-west1.firebasedatabase.app"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        document.addEventListener('alpine:init', () => {
            Alpine.data('launcher', () => ({
                apps: [],
                showModal: false,
                user: null,
                sortable: null,
                newApp: { name: '', url: '', icon: '' },
                
                defaultApps: [
                    { id: '1', name: 'WhatsApp', url: 'https://web.whatsapp.com', icon: 'solar:chat-round-dots-bold-duotone' },
                    { id: '2', name: 'YouTube', url: 'https://youtube.com', icon: 'solar:play-circle-bold-duotone' },
                    { id: '3', name: 'Gmail', url: 'https://mail.google.com', icon: 'solar:letter-bold-duotone' },
                    { id: '4', name: 'X', url: 'https://twitter.com', icon: 'solar:hashtag-square-bold-duotone' },
                    { id: '5', name: 'ChatGPT', url: 'https://chat.openai.com', icon: 'solar:bolt-circle-bold-duotone' },
                    { id: '6', name: 'Gemini', url: 'https://gemini.google.com', icon: 'solar:stars-minimalistic-bold-duotone' },
                    { id: '7', name: 'Spotify', url: 'https://open.spotify.com', icon: 'solar:music-library-2-bold-duotone' },
                    { id: '8', name: 'Instagram', url: 'https://instagram.com', icon: 'solar:camera-bold-duotone' },
                    { id: '9', name: 'GitHub', url: 'https://github.com', icon: 'solar:code-circle-bold-duotone' },
                    { id: '10', name: 'Reddit', url: 'https://reddit.com', icon: 'solar:mask-happly-bold-duotone' }
                ],

                init() {
                    // 1. Initial Load from LocalStorage (Instant)
                    const localData = localStorage.getItem('auraApps');
                    if (localData) {
                        this.apps = JSON.parse(localData);
                    } else {
                        this.apps = JSON.parse(JSON.stringify(this.defaultApps));
                    }

                    // 2. Initialize SortableJS
                    this.$nextTick(() => this.initSortable());

                    // 3. Auth & Sync Logic
                    onAuthStateChanged(auth, (u) => {
                        this.user = u;
                        if (u) {
                            this.startSync(u.uid);
                        }
                    });
                },

                signIn() {
                    const provider = new GoogleAuthProvider();
                    signInWithPopup(auth, provider).catch((error) => console.error(error));
                },

                signOutUser() {
                    signOut(auth).then(() => {
                        this.user = null;
                        // On sign out, keep the current apps in local storage or revert to defaults?
                        // Let's keep them to avoid jarring UX, or could revert. keeping is safer.
                    });
                },

                startSync(uid) {
                    const userAppsRef = ref(db, `users/${uid}/apps`);
                    
                    // Listen for Realtime Changes
                    onValue(userAppsRef, (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            // Update UI and LocalStorage
                            this.apps = data;
                            localStorage.setItem('auraApps', JSON.stringify(data));
                        } else {
                            // First time sync: push local apps to cloud
                            this.saveApps();
                        }
                    });
                },

                saveApps() {
                    // 1. Save Local
                    localStorage.setItem('auraApps', JSON.stringify(this.apps));

                    // 2. Save Cloud (if logged in)
                    if (this.user) {
                        set(ref(db, `users/${this.user.uid}/apps`), this.apps)
                            .catch(err => console.error("Sync failed", err));
                    }
                },

                addApp() {
                    if (!this.newApp.name || !this.newApp.url) return;
                    
                    const newId = Date.now().toString();
                    const iconName = this.newApp.icon || 'solar:link-circle-bold-duotone';
                    
                    this.apps.push({
                        id: newId,
                        name: this.newApp.name,
                        url: this.newApp.url,
                        icon: iconName
                    });

                    this.saveApps();
                    this.newApp = { name: '', url: '', icon: '' };
                    this.showModal = false;
                },

                deleteApp(id) {
                    this.apps = this.apps.filter(app => app.id !== id);
                    this.saveApps();
                },

                launchApp(url) {
                    // Small delay for visual feedback
                    setTimeout(() => window.location.href = url, 50);
                },

                initSortable() {
                    const el = this.$refs.gridContainer;
                    this.sortable = new Sortable(el, {
                        animation: 200,
                        delay: 200, // Small delay prevents drag when clicking
                        delayOnTouchOnly: true,
                        draggable: ".group", // The class of items
                        ghostClass: "sortable-ghost",
                        dragClass: "sortable-drag",
                        onEnd: (evt) => {
                            if (evt.oldIndex === evt.newIndex) return;
                            
                            // Reorder array data-driven way
                            const item = this.apps.splice(evt.oldIndex, 1)[0];
                            this.apps.splice(evt.newIndex, 0, item);
                            
                            // Sync changes
                            this.saveApps();
                        }
                    });
                }
            }));
        });
    </script>
</body>
</html>
