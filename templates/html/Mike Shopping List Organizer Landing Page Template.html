"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-bricolage">.font-bricolage { font-family: 'Bricolage Grotesque', sans-serif !important; }</style><link id="all-fonts-link-font-jakarta" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap"><style id="all-fonts-style-font-jakarta">.font-jakarta { font-family: 'Plus Jakarta Sans', sans-serif !important; }</style><link id="all-fonts-link-font-manrope" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap"><style id="all-fonts-style-font-manrope">.font-manrope { font-family: 'Manrope', sans-serif !important; }</style><link id="all-fonts-link-font-space-grotesk" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-space-grotesk">.font-space-grotesk { font-family: 'Space Grotesk', sans-serif !important; }</style><link id="all-fonts-link-font-work-sans" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800&amp;display=swap"><style id="all-fonts-style-font-work-sans">.font-work-sans { font-family: 'Work Sans', sans-serif !important; }</style><link id="all-fonts-link-font-pt-serif" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&amp;display=swap"><style id="all-fonts-style-font-pt-serif">.font-pt-serif { font-family: 'PT Serif', serif !important; }</style><link id="all-fonts-link-font-geist-mono" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-geist-mono">.font-geist-mono { font-family: 'Geist Mono', monospace !important; }</style><link id="all-fonts-link-font-space-mono" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;display=swap"><style id="all-fonts-style-font-space-mono">.font-space-mono { font-family: 'Space Mono', monospace !important; }</style><link id="all-fonts-link-font-quicksand" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&amp;display=swap"><style id="all-fonts-style-font-quicksand">.font-quicksand { font-family: 'Quicksand', sans-serif !important; }</style><link id="all-fonts-link-font-nunito" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&amp;display=swap"><style id="all-fonts-style-font-nunito">.font-nunito { font-family: 'Nunito', sans-serif !important; }</style></head>
<body class="min-h-screen bg-gray-50">
    <div class="max-w-6xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl tracking-tight text-blue-600 mb-1 font-geist font-bold">Sponhour Family Custom Lists for a Tidy Life</h1>
            <p class="text-sm text-gray-500 font-geist" style="">Make as many lists as you need to keep track of everything</p>
        </div>

        <!-- Create New List -->
        <div class="mb-8 bg-white border border-gray-200 rounded-lg p-4">
            <div class="flex gap-2">
                <input type="text" placeholder="New list name..." class="focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all text-sm flex-1 border-gray-200 border rounded-lg pt-3 pr-4 pb-3 pl-4 font-geist" id="listNameInput">
                <button class="hover:bg-gray-800 transition-colors flex items-center gap-2 text-sm font-medium text-white font-geist bg-gray-900 rounded-lg pt-3 pr-6 pb-3 pl-6" id="createListBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus" style="width: 18px; height: 18px; stroke-width: 1.5;" class="lucide lucide-plus"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
                    Create List
                </button>
            </div>
        </div>

        <!-- Lists Grid -->
        <div id="listsContainer" class="space-y-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-16">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-gray-100 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="shopping-cart" style="width: 24px; height: 24px; stroke-width: 1.5;" class="lucide lucide-shopping-cart text-gray-400"><circle cx="8" cy="21" r="1"></circle><circle cx="19" cy="21" r="1"></circle><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path></svg>
            </div>
            <h3 class="text-sm font-medium text-gray-900 mb-1 font-geist">No lists yet</h3>
            <p class="text-sm text-gray-500 font-geist">Create your first shopping list to get started</p>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // State
        let lists = [];

        // Elements
        const listNameInput = document.getElementById('listNameInput');
        const createListBtn = document.getElementById('createListBtn');
        const listsContainer = document.getElementById('listsContainer');
        const emptyState = document.getElementById('emptyState');

        // Create new list
        function createList() {
            const name = listNameInput.value.trim();
            if (!name) return;

            const list = {
                id: Date.now(),
                name: name,
                items: []
            };

            lists.push(list);
            listNameInput.value = '';
            render();
        }

        // Delete list
        function deleteList(listId) {
            lists = lists.filter(l => l.id !== listId);
            render();
        }

        // Add item to list
        function addItem(listId, inputElement) {
            const text = inputElement.value.trim();
            if (!text) return;

            const list = lists.find(l => l.id === listId);
            if (list) {
                const item = {
                    id: Date.now(),
                    text: text,
                    checked: false
                };
                list.items.push(item);
                inputElement.value = '';
                render();
            }
        }

        // Toggle item
        function toggleItem(listId, itemId) {
            const list = lists.find(l => l.id === listId);
            if (list) {
                const item = list.items.find(i => i.id === itemId);
                if (item) {
                    item.checked = !item.checked;
                    render();
                }
            }
        }

        // Delete item
        function deleteItem(listId, itemId) {
            const list = lists.find(l => l.id === listId);
            if (list) {
                list.items = list.items.filter(i => i.id !== itemId);
                render();
            }
        }

        // Clear checked items
        function clearChecked(listId) {
            const list = lists.find(l => l.id === listId);
            if (list) {
                list.items = list.items.filter(i => !i.checked);
                render();
            }
        }

        // Render all lists
        function render() {
            if (lists.length === 0) {
                listsContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                listsContainer.innerHTML = lists.map(list => {
                    const totalCount = list.items.length;
                    const checkedCount = list.items.filter(i => i.checked).length;
                    
                    return `
                        <div class="bg-white border border-gray-200 rounded-lg overflow-hidden">
                            <!-- List Header -->
                            <div class="border-b border-gray-100 p-4">
                                <div class="flex items-start justify-between mb-3">
                                    <h2 class="text-lg font-medium text-gray-900 font-geist tracking-tight">${list.name}</h2>
                                    <button onclick="deleteList(${list.id})" class="text-gray-400 hover:text-gray-900 transition-colors">
                                        <i data-lucide="trash-2" style="width: 16px; height: 16px; stroke-width: 1.5;"></i>
                                    </button>
                                </div>
                                
                                <!-- Add Item Input -->
                                <div class="flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="Add an item..." 
                                        class="focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-transparent transition-all text-sm flex-1 border-gray-200 border rounded-md py-2 px-3 font-geist" 
                                        id="itemInput${list.id}"
                                        onkeypress="if(event.key === 'Enter') addItem(${list.id}, this)"
                                    >
                                    <button 
                                        onclick="addItem(${list.id}, document.getElementById('itemInput${list.id}'))"
                                        class="hover:bg-gray-800 transition-colors text-sm font-medium text-white font-geist bg-gray-900 rounded-md px-4 py-2"
                                    >
                                        <i data-lucide="plus" style="width: 16px; height: 16px; stroke-width: 1.5;"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Stats Bar -->
                            <div class="flex items-center justify-between px-4 py-3 bg-gray-50 border-b border-gray-100">
                                <div class="flex items-center gap-4">
                                    <div class="text-xs">
                                        <span class="text-gray-500 font-geist">Total:</span>
                                        <span class="font-medium text-gray-900 ml-1 font-geist">${totalCount}</span>
                                    </div>
                                    <div class="text-xs">
                                        <span class="text-gray-500 font-geist">Checked:</span>
                                        <span class="font-medium text-gray-900 ml-1 font-geist">${checkedCount}</span>
                                    </div>
                                </div>
                                ${checkedCount > 0 ? `
                                    <button onclick="clearChecked(${list.id})" class="text-xs text-gray-500 hover:text-gray-900 transition-colors flex items-center gap-1 font-geist">
                                        <i data-lucide="trash-2" style="width: 14px; height: 14px; stroke-width: 1.5;"></i>
                                        Clear checked
                                    </button>
                                ` : ''}
                            </div>

                            <!-- Items List -->
                            <div class="p-4 max-h-96 overflow-y-auto">
                                ${list.items.length === 0 ? `
                                    <div class="text-center py-8">
                                        <div class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-gray-100 mb-3">
                                            <i data-lucide="shopping-bag" style="width: 20px; height: 20px; stroke-width: 1.5;" class="text-gray-400"></i>
                                        </div>
                                        <p class="text-xs text-gray-500 font-geist">No items yet</p>
                                    </div>
                                ` : `
                                    <div class="space-y-2">
                                        ${list.items.map(item => `
                                            <div class="group flex items-center gap-3 p-3 border border-gray-200 rounded-md hover:border-gray-300 transition-all ${item.checked ? 'bg-gray-50' : 'bg-white'}">
                                                <button 
                                                    onclick="toggleItem(${list.id}, ${item.id})"
                                                    class="flex-shrink-0 w-4 h-4 rounded border-2 ${item.checked ? 'border-gray-900 bg-gray-900' : 'border-gray-300'} flex items-center justify-center hover:border-gray-900 transition-colors"
                                                >
                                                    ${item.checked ? '<i data-lucide="check" style="width: 12px; height: 12px; stroke-width: 2.5;" class="text-white"></i>' : ''}
                                                </button>
                                                <span class="flex-1 text-sm font-geist ${item.checked ? 'text-gray-400 line-through' : 'text-gray-900'}">${item.text}</span>
                                                <button 
                                                    onclick="deleteItem(${list.id}, ${item.id})"
                                                    class="flex-shrink-0 opacity-0 group-hover:opacity-100 transition-opacity"
                                                >
                                                    <i data-lucide="x" style="width: 16px; height: 16px; stroke-width: 1.5;" class="text-gray-400 hover:text-gray-900"></i>
                                                </button>
                                            </div>
                                        `).join('')}
                                    </div>
                                `}
                            </div>
                        </div>
                    `;
                }).join('');
                lucide.createIcons();
            }
        }

        // Event listeners
        createListBtn.addEventListener('click', createList);
        listNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createList();
        });

        // Initial render
        render();
    </script>

</body></html>
