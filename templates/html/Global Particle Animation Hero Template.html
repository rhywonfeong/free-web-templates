<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Particle Animation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #050505;
}
canvas {
outline: none;
}
</style></head>
<body class="relative w-full h-screen overflow-hidden bg-[#050505] text-white/90 selection:bg-cyan-500/30">

    <!-- Wrapper for the 3D Canvas -->
    <div id="canvas-container" class="absolute inset-0 z-0 w-full h-full"></div>

    <!-- Vignette Overlay to enhance focus (Aesthetic Touch) -->
    <div class="pointer-events-none absolute inset-0 z-10 bg-[radial-gradient(circle_at_center,transparent_10%,#050505_110%)] opacity-80 mix-blend-multiply"></div>

    <!-- Script: Three.js Configuration -->
    <script>
        const container = document.getElementById('canvas-container');

        // Scene Setup
        const scene = new THREE.Scene();
        // Matching the background color for seamless blending
        scene.fog = new THREE.FogExp2(0x050505, 0.035); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: true,
            powerPreference: "high-performance"
        });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Limit pixel ratio for performance
        container.appendChild(renderer.domElement);

        // --- Core Sphere (Particles) ---
        const geometry = new THREE.SphereGeometry(14, 96, 96); 
        
        const material = new THREE.PointsMaterial({
            size: 0.06,
            color: 0x66ccff, // Cyan/Blue
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true
        });

        const sphere = new THREE.Points(geometry, material);
        scene.add(sphere);

        // --- Outer Aura (Wireframe) ---
        const auraGeometry = new THREE.SphereGeometry(16, 48, 48);
        const auraMaterial = new THREE.MeshBasicMaterial({
            color: 0x3b82f6, // Slightly darker blue
            transparent: true,
            opacity: 0.03,
            wireframe: true,
            side: THREE.DoubleSide
        });
        const aura = new THREE.Mesh(auraGeometry, auraMaterial);
        scene.add(aura);

        // --- Floating Particles (Stars/Dust) ---
        const starGeo = new THREE.BufferGeometry();
        const starCount = 800;
        const posArray = new Float32Array(starCount * 3);
        
        for(let i = 0; i < starCount * 3; i++) {
            // Spread particles around the sphere
            posArray[i] = (Math.random() - 0.5) * 60; 
        }
        
        starGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starMat = new THREE.PointsMaterial({
            size: 0.04,
            color: 0xffffff,
            transparent: true,
            opacity: 0.2,
            blending: THREE.AdditiveBlending
        });
        const starMesh = new THREE.Points(starGeo, starMat);
        scene.add(starMesh);


        // Camera Positioning
        camera.position.z = 24;

        // Mouse Interaction
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            targetX = mouseX * 0.0008; // Dampened sensitivity
            targetY = mouseY * 0.0008;

            // Sphere Rotation
            sphere.rotation.y += 0.003;
            sphere.rotation.x += 0.001;
            
            // Aura Rotation (Opposite direction)
            aura.rotation.y -= 0.002;
            aura.rotation.z += 0.001;

            // Background Stars Rotation (Very Slow)
            starMesh.rotation.y += 0.0005;

            // Interactive rotation smoothing
            sphere.rotation.y += 0.03 * (targetX - sphere.rotation.y);
            sphere.rotation.x += 0.03 * (targetY - sphere.rotation.x);
            aura.rotation.x += 0.02 * (targetY - aura.rotation.x);

            // Pulse Effect
            const scale = 1 + Math.sin(elapsedTime * 0.8) * 0.03;
            sphere.scale.set(scale, scale, scale);
            
            // Subtle aura breathing
            const auraScale = 1 + Math.cos(elapsedTime * 0.5) * 0.01;
            aura.scale.set(auraScale, auraScale, auraScale);

            renderer.render(scene, camera);
        }

        animate();

        // Responsive Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
