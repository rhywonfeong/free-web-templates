<body class="text-neutral-400 selection:bg-neutral-800 selection:text-white">

    <canvas id="webgl" class="fixed inset-0 z-0 bg-black"></canvas>

    <!-- Overlay UI -->
    <div class="fixed inset-0 pointer-events-none z-10 flex flex-col justify-between p-6">
        <header class="flex items-start justify-between">
            <div class="flex flex-col gap-1 pointer-events-auto">

                    <iconify-icon icon="lucide:orbit" width="20" stroke-width="1.5"></iconify-icon>

                </div>
                <p class="text-xs text-neutral-500 font-light tracking-wide">Multi-Galaxy Simulation</p>
            </div>

            <aside class="w-80 bg-neutral-900/80 backdrop-blur-xl border border-white/10 rounded-xl shadow-2xl overflow-hidden pointer-events-auto transition-all duration-300 group flex flex-col max-h-[90vh]">
                <div class="px-5 py-4 border-b border-white/5 flex items-center justify-between shrink-0">
                    <span class="text-xs font-medium text-neutral-300 uppercase tracking-wider">Parameters</span>
                    <button id="resetBtn" class="text-xs text-neutral-500 hover:text-white transition-colors flex items-center gap-1">
                        <iconify-icon icon="lucide:rotate-ccw" width="12"></iconify-icon> Reset
                    </button>
                </div>

                <div class="p-5 overflow-y-auto flex flex-col gap-6 custom-scrollbar">
                    <!-- Galaxy Structure -->
                    <div class="space-y-4">
                        <div class="flex items-center gap-2 text-neutral-200 text-xs font-medium">
                            <iconify-icon icon="lucide:boxes" width="14"></iconify-icon> Structure
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs">
                                <span>Stars</span>
                                <span id="countVal" class="text-white font-mono">50000</span>
                            </div>
                            <input type="range" id="count" min="1000" max="100000" step="1000" value="50000">
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs">
                                <span>Radius</span>
                                <span id="radiusVal" class="text-white font-mono">5</span>
                            </div>
                            <input type="range" id="radius" min="1" max="20" step="0.1" value="5">
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs">
                                <span>Arms</span>
                                <span id="branchesVal" class="text-white font-mono">3</span>
                            </div>
                            <input type="range" id="branches" min="2" max="10" step="1" value="3">
                        </div>
                    </div>

                    <div class="h-px bg-white/5 w-full"></div>

                    <!-- Physics -->
                    <div class="space-y-4">
                        <div class="flex items-center gap-2 text-neutral-200 text-xs font-medium">
                            <iconify-icon icon="lucide:wind" width="14"></iconify-icon> Dynamics
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs">
                                <span>Spin Curvature</span>
                                <span id="spinVal" class="text-white font-mono">1</span>
                            </div>
                            <input type="range" id="spin" min="-5" max="5" step="0.1" value="1">
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs">
                                <span>Scattering</span>
                                <span id="randomnessVal" class="text-white font-mono">0.2</span>
                            </div>
                            <input type="range" id="randomness" min="0" max="2" step="0.01" value="0.2">
                        </div>
                        <div class="space-y-2">
                            <div class="flex justify-between text-xs">
                                <span>Concentration</span>
                                <span id="powerVal" class="text-white font-mono">3</span>
                            </div>
                            <input type="range" id="power" min="1" max="10" step="0.1" value="3">
                        </div>
                    </div>

                    <div class="h-px bg-white/5 w-full"></div>

                    <!-- Appearance -->
                    <div class="space-y-4">
                        <div class="flex items-center gap-2 text-neutral-200 text-xs font-medium">
                            <iconify-icon icon="lucide:palette" width="14"></iconify-icon> Appearance
                        </div>
                         <div class="space-y-2">
                            <div class="flex justify-between text-xs">
                                <span>Star Size</span>
                                <span id="sizeVal" class="text-white font-mono">0.015</span>
                            </div>
                            <input type="range" id="size" min="0.001" max="0.1" step="0.001" value="0.015">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-1">
                                <label class="text-xs block mb-1">Inner Color</label>
                                <div class="relative h-8 w-full rounded-md overflow-hidden border border-white/10 group-hover:border-white/20 transition-colors">
                                    <input type="color" id="insideColor" value="#ff6030" class="absolute -top-2 -left-2 w-[150%] h-[150%] cursor-pointer p-0 border-0">
                                </div>
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs block mb-1">Outer Color</label>
                                <div class="relative h-8 w-full rounded-md overflow-hidden border border-white/10 group-hover:border-white/20 transition-colors">
                                    <input type="color" id="outsideColor" value="#1b3984" class="absolute -top-2 -left-2 w-[150%] h-[150%] cursor-pointer p-0 border-0">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="h-px bg-white/5 w-full"></div>

                    <!-- Animation -->
                    <div class="flex items-center justify-between">
                        <label for="autoRotate" class="text-xs text-neutral-300 cursor-pointer select-none">Auto Rotate</label>
                        <input type="checkbox" id="autoRotate" class="custom-checkbox w-4 h-4 cursor-pointer" checked>
                    </div>

                    <div class="h-px bg-white/5 w-full"></div>

                     <!-- Teleport -->
                     <button id="warpBtn" class="group relative w-full py-2.5 bg-white text-black text-xs font-semibold rounded-md hover:bg-neutral-200 transition-all overflow-hidden flex items-center justify-center gap-2 active:scale-95">
                        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/50 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000 pointer-events-none"></div>
                        <iconify-icon id="warpIcon" icon="lucide:rocket" width="14"></iconify-icon>
                        <span id="warpText">Warp to Sector 2</span>
                    </button>

                </div>
            </aside>
        </header>

        <footer class="flex items-end justify-between pointer-events-none">
            <div class="flex items-center gap-6 text-xs font-mono text-neutral-600">
                <div class="flex items-center gap-2">
                    <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span id="systemStatus">Active System</span>
                </div>
                <div id="cameraInfo" class="hidden sm:block">POS: 0, 3, 0</div>
            </div>
            <a href="#" class="pointer-events-auto text-neutral-600 hover:text-white transition-colors">
                <iconify-icon icon="lucide:github" width="18"></iconify-icon>
            </a>
        </footer>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const parameters = {
            count: 50000,
            size: 0.015,
            radius: 5,
            branches: 3,
            spin: 1,
            randomness: 0.2,
            randomnessPower: 3,
            insideColor: '#ff6030',
            outsideColor: '#1b3984',
            autoRotate: true
        };

        const canvas = document.querySelector('canvas#webgl');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002); // Reduced fog density to see further

        const sizes = { width: window.innerWidth, height: window.innerHeight };
        // Increased Far Plane so we can see distant galaxy while zooming out
        const camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height, 0.1, 5000);
        camera.position.set(3, 3, 3);
        scene.add(camera);

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(sizes.width, sizes.height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x000000, 1);

        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enableZoom = true;
        controls.autoRotate = parameters.autoRotate;
        controls.autoRotateSpeed = 0.5;
        // Allow zooming out far enough to see both galaxies
        controls.maxDistance = 2000;

        // --- Common Texture ---
        const getTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16,16,0,16,16,16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            grad.addColorStop(0.5, 'rgba(255,255,255,0.2)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,32,32);
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        };
        const particleTexture = getTexture();

        // --- Main Galaxy Generator ---
        let geometry = null;
        let material = null;
        let points = null;

        const generateGalaxy = () => {
            if (points !== null) {
                geometry.dispose();
                material.dispose();
                scene.remove(points);
            }

            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(parameters.count * 3);
            const colors = new Float32Array(parameters.count * 3);
            
            const colorInside = new THREE.Color(parameters.insideColor);
            const colorOutside = new THREE.Color(parameters.outsideColor);

            for (let i = 0; i < parameters.count; i++) {
                const i3 = i * 3;
                const radius = Math.random() * parameters.radius;
                const spinAngle = radius * parameters.spin;
                const branchAngle = (i % parameters.branches) / parameters.branches * Math.PI * 2;
                
                const randomX = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                const randomY = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;
                const randomZ = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * parameters.randomness * radius;

                positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                positions[i3 + 1] = randomY; 
                positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                const mixedColor = colorInside.clone();
                mixedColor.lerp(colorOutside, radius / parameters.radius);

                colors[i3] = mixedColor.r;
                colors[i3 + 1] = mixedColor.g;
                colors[i3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            material = new THREE.PointsMaterial({
                size: parameters.size,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.8
            });

            points = new THREE.Points(geometry, material);
            scene.add(points);
        };

        generateGalaxy();

        // --- Distant Massive Galaxy ---
        const distantGalaxyGroup = new THREE.Group();
        scene.add(distantGalaxyGroup);
        const distantGalaxyPos = new THREE.Vector3(-150, -40, -200);

        const createDistantGalaxy = () => {
            const bgParams = {
                count: 100000,
                size: 0.2, 
                radius: 60,
                branches: 5,
                spin: 2,
                randomness: 0.4,
                randomnessPower: 3,
                insideColor: '#a855f7', 
                outsideColor: '#06b6d4', 
            };

            const bgGeo = new THREE.BufferGeometry();
            const bgPos = new Float32Array(bgParams.count * 3);
            const bgCol = new Float32Array(bgParams.count * 3);
            const bgIn = new THREE.Color(bgParams.insideColor);
            const bgOut = new THREE.Color(bgParams.outsideColor);

            for (let i = 0; i < bgParams.count; i++) {
                const i3 = i * 3;
                const r = Math.random() * bgParams.radius;
                const s = r * bgParams.spin;
                const b = (i % bgParams.branches) / bgParams.branches * Math.PI * 2;
                
                const rndX = Math.pow(Math.random(), bgParams.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * bgParams.randomness * r;
                const rndY = Math.pow(Math.random(), bgParams.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * bgParams.randomness * r;
                const rndZ = Math.pow(Math.random(), bgParams.randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * bgParams.randomness * r;

                bgPos[i3] = Math.cos(b + s) * r + rndX;
                bgPos[i3+1] = rndY;
                bgPos[i3+2] = Math.sin(b + s) * r + rndZ;

                const mixed = bgIn.clone();
                mixed.lerp(bgOut, r / bgParams.radius);

                bgCol[i3] = mixed.r;
                bgCol[i3+1] = mixed.g;
                bgCol[i3+2] = mixed.b;
            }

            bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
            bgGeo.setAttribute('color', new THREE.BufferAttribute(bgCol, 3));

            const bgMat = new THREE.PointsMaterial({
                size: bgParams.size,
                sizeAttenuation: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                vertexColors: true,
                map: particleTexture,
                transparent: true,
                opacity: 0.7
            });

            const galaxyMesh = new THREE.Points(bgGeo, bgMat);
            
            galaxyMesh.position.copy(distantGalaxyPos);
            galaxyMesh.rotation.x = Math.PI / 6;
            galaxyMesh.rotation.z = Math.PI / 6;
            
            distantGalaxyGroup.add(galaxyMesh);
        };
        
        createDistantGalaxy();


        // --- Starfield Background ---
        const bgGeometry = new THREE.BufferGeometry();
        const bgCount = 5000;
        const bgPosArray = new Float32Array(bgCount * 3);
        for(let i = 0; i < bgCount * 3; i++) {
            bgPosArray[i] = (Math.random() - 0.5) * 1000; 
        }
        bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPosArray, 3));
        const bgMaterial = new THREE.PointsMaterial({
            size: 0.15,
            sizeAttenuation: true,
            depthWrite: false,
            color: 0x888888
        });
        const bgStars = new THREE.Points(bgGeometry, bgMaterial);
        scene.add(bgStars);


        // --- UI Binding ---
        const bindInput = (id, paramKey, isNumber = true, isColor = false) => {
            const el = document.getElementById(id);
            const valEl = document.getElementById(id + 'Val');
            if(el) {
                el.addEventListener('input', (e) => {
                    let val = e.target.value;
                    if(isNumber) val = parseFloat(val);
                    parameters[paramKey] = val;
                    if(valEl) valEl.innerText = val;
                    generateGalaxy();
                });
            }
        };

        bindInput('count', 'count');
        bindInput('size', 'size');
        bindInput('radius', 'radius');
        bindInput('branches', 'branches');
        bindInput('spin', 'spin');
        bindInput('randomness', 'randomness');
        bindInput('power', 'randomnessPower');
        bindInput('insideColor', 'insideColor', false, true);
        bindInput('outsideColor', 'outsideColor', false, true);

        document.getElementById('autoRotate').addEventListener('change', (e) => {
            parameters.autoRotate = e.target.checked;
            controls.autoRotate = parameters.autoRotate;
        });

        // --- Navigation Logic ---
        let currentSector = 'home'; // 'home' or 'distant'
        let isTransitioning = false;
        let transitionProgress = 0;
        const transitionDuration = 2.0; // Seconds

        // Transition State Storage
        const transitionStartPos = new THREE.Vector3();
        const transitionEndPos = new THREE.Vector3();
        const transitionStartTarget = new THREE.Vector3();
        const transitionEndTarget = new THREE.Vector3();

        // Preset Locations
        const homeTarget = new THREE.Vector3(0, 0, 0);
        const homeCameraOffset = new THREE.Vector3(8, 6, 8); // Offset relative to target

        const distantTarget = distantGalaxyPos.clone();
        const distantCameraOffset = new THREE.Vector3(30, 20, 30); // Offset relative to target
        
        const warpBtn = document.getElementById('warpBtn');
        const warpText = document.getElementById('warpText');
        const warpIcon = document.getElementById('warpIcon');
        const systemStatus = document.getElementById('systemStatus');
        
        warpBtn.addEventListener('click', () => {
            if(isTransitioning) return; // Prevent double clicking during flight

            isTransitioning = true;
            transitionProgress = 0;
            
            // Capture Start State
            transitionStartPos.copy(camera.position);
            transitionStartTarget.copy(controls.target);

            // Determine End State
            if (currentSector === 'home') {
                // Go to Distant
                currentSector = 'distant';
                transitionEndTarget.copy(distantTarget);
                transitionEndPos.copy(distantTarget).add(distantCameraOffset);
                
                // UI Update
                warpText.innerText = 'Return Home';
                warpIcon.setAttribute('icon', 'lucide:home');
                systemStatus.innerText = 'Deep Space Network';
            } else {
                // Go Home
                currentSector = 'home';
                transitionEndTarget.copy(homeTarget);
                transitionEndPos.copy(homeTarget).add(homeCameraOffset);
                
                // UI Update
                warpText.innerText = 'Warp to Sector 2';
                warpIcon.setAttribute('icon', 'lucide:rocket');
                systemStatus.innerText = 'Active System';
            }

            // Disable controls during flight
            controls.enabled = false;
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            // Reset Params
            parameters.count = 50000;
            parameters.size = 0.015;
            parameters.radius = 5;
            parameters.branches = 3;
            parameters.spin = 1;
            parameters.randomness = 0.2;
            parameters.randomnessPower = 3;
            parameters.insideColor = '#ff6030';
            parameters.outsideColor = '#1b3984';
            parameters.autoRotate = true;

            const inputs = {
                'count': 50000, 'size': 0.015, 'radius': 5, 'branches': 3,
                'spin': 1, 'randomness': 0.2, 'power': 3
            };
            Object.keys(inputs).forEach(key => {
                document.getElementById(key).value = inputs[key];
                document.getElementById(key+'Val').innerText = inputs[key];
            });
            document.getElementById('insideColor').value = '#ff6030';
            document.getElementById('outsideColor').value = '#1b3984';
            document.getElementById('autoRotate').checked = true;
            controls.autoRotate = true;
            generateGalaxy();
            
            // Reset Camera
            currentSector = 'home';
            camera.position.set(3, 3, 3);
            controls.target.set(0, 0, 0);
            controls.update();
            
            // Reset UI
            warpText.innerText = 'Warp to Sector 2';
            warpIcon.setAttribute('icon', 'lucide:rocket');
            systemStatus.innerText = 'Active System';
        });

        window.addEventListener('resize', () => {
            sizes.width = window.innerWidth;
            sizes.height = window.innerHeight;
            camera.aspect = sizes.width / sizes.height;
            camera.updateProjectionMatrix();
            renderer.setSize(sizes.width, sizes.height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

        const clock = new THREE.Clock();
        const cameraInfo = document.getElementById('cameraInfo');

        // Smoothstep function for nicer ease-in-out
        function smoothstep(min, max, value) {
            var x = Math.max(0, Math.min(1, (value-min)/(max-min)));
            return x * x * (3 - 2 * x);
        }

        const tick = () => {
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            
            if (isTransitioning) {
                transitionProgress += delta / transitionDuration;
                
                // Ease function
                const t = smoothstep(0, 1, transitionProgress);

                // Interpolate Position
                camera.position.lerpVectors(transitionStartPos, transitionEndPos, t);
                
                // Interpolate Target (Focus point)
                const currentTarget = new THREE.Vector3().lerpVectors(transitionStartTarget, transitionEndTarget, t);
                controls.target.copy(currentTarget);

                if (transitionProgress >= 1) {
                    isTransitioning = false;
                    controls.enabled = true; // Re-enable user control
                }
            } else {
                controls.update();
            }
            
            // Rotate the distant galaxy slowly
            if(distantGalaxyGroup.children.length > 0) {
                distantGalaxyGroup.children[0].rotation.y = elapsedTime * 0.05;
            }

            if(cameraInfo) {
                const {x, y, z} = camera.position;
                cameraInfo.innerText = `POS: ${x.toFixed(0)}, ${y.toFixed(0)}, ${z.toFixed(0)}`;
            }

            renderer.render(scene, camera);
            window.requestAnimationFrame(tick);
        };

        tick();
    </script>
