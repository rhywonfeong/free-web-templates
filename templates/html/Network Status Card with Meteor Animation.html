  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    @keyframes meteor {
      0% { transform: rotate(215deg) translateX(0); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: rotate(215deg) translateX(-500px); opacity: 0; }
    }
    
    .meteor {
      position: absolute;
      height: 1px;
      width: 1px;
      border-radius: 9999px;
      background-color: rgba(209, 213, 219, 0.8);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1);
      transform: rotate(215deg);
      top: 0;
    }
    
    .meteor::before {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 50px;
      height: 1px;
      background: linear-gradient(to right, rgba(209, 213, 219, 0.8), transparent);
    }
  </style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-xs w-full bg-black/40 backdrop-blur-sm rounded-xl overflow-hidden shadow-lg border border-gray-800">
    <!-- Card with meteors in background -->
    <div class="relative">
      <!-- Meteor background -->
      <div class="absolute inset-0 bg-gray-950 overflow-hidden" id="meteor-canvas"></div>
      
      <!-- Card content -->
      <div class="relative z-10 p-5">
        <div class="mb-4">
          <span class="px-2 py-1 bg-gray-800/80 rounded-full text-xs text-gray-400 inline-block">COSMIC NETWORK</span>
        </div>
        
        <h2 class="text-xl font-bold text-white mb-2">Stellar Connection</h2>
        <div class="h-1 w-12 bg-gray-400 mb-4 rounded-full"></div>
        
        <p class="text-gray-400 text-sm mb-5 leading-relaxed">Our stellar network connects distant points across the cosmos, ensuring reliable transmission through challenging environments.</p>
        
        <div class="space-y-3 mb-5">
          <div>
            <div class="flex justify-between items-center mb-1">
              <span class="text-gray-300 text-xs font-medium">UPTIME</span>
              <span class="text-gray-400 text-xs">99.8%</span>
            </div>
            <div class="w-full h-1.5 bg-gray-800 rounded-full overflow-hidden">
              <div class="h-full bg-gray-400 rounded-full" style="width: 99.8%"></div>
            </div>
          </div>
          
          <div>
            <div class="flex justify-between items-center mb-1">
              <span class="text-gray-300 text-xs font-medium">NODES</span>
              <span class="text-gray-400 text-xs">12</span>
            </div>
            <div class="w-full h-1.5 bg-gray-800 rounded-full overflow-hidden">
              <div class="h-full bg-gray-400 rounded-full" style="width: 85%"></div>
            </div>
          </div>
        </div>
        
        <div class="pt-4 border-t border-gray-800">
          <div class="flex justify-between text-sm">
            <button class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-lg transition flex items-center text-xs">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" viewBox="0 0 20 20" fill="currentColor">
                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
              </svg>
              Details
            </button>
            <button class="px-4 py-2 bg-black hover:bg-gray-800 text-gray-300 rounded-lg transition flex items-center text-xs">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 mr-1" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2h-1V9a1 1 0 00-1-1z" clip-rule="evenodd" />
              </svg>
              Status
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const meteorCanvas = document.getElementById('meteor-canvas');
      const meteorCount = 25;
      
      for (let i = 0; i < meteorCount; i++) {
        const meteor = document.createElement('div');
        meteor.classList.add('meteor');
        
        const delay = Math.random() * 5;
        const duration = Math.random() * 6 + 3;
        const leftPosition = Math.floor(Math.random() * 300) - 300;
        const size = Math.random() * 0.5 + 0.5;
        
        meteor.style.left = `${leftPosition}px`;
        meteor.style.animationDelay = `${delay}s`;
        meteor.style.animationDuration = `${duration}s`;
        meteor.style.animation = `meteor ${duration}s linear ${delay}s infinite`;
        meteor.style.width = `${size}px`;
        meteor.style.height = `${size}px`;
        
        if (i % 3 === 0) {
          meteor.style.background = 'rgba(167, 139, 250, 0.8)';
          meteor.style.boxShadow = '0 0 1px rgba(167, 139, 250, 0.3)';
        } else if (i % 4 === 0) {
          meteor.style.background = 'rgba(96, 165, 250, 0.8)';
          meteor.style.boxShadow = '0 0 1px rgba(96, 165, 250, 0.3)';
        }
        
        meteorCanvas.appendChild(meteor);
      }
    });
  </script>
</body>
