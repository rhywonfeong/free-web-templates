<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Conditions Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .details-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .details-expanded {
            max-height: 500px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 to-purple-100 flex items-center justify-center min-h-screen p-4">
    <div class="w-full max-w-md backdrop-blur-lg bg-white/80 rounded-lg shadow-lg border border-white/40 p-4">
        <!-- Header with Weather Icon and Date -->
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-2">
                <!-- Weather Icon -->
                <div class="w-6 h-6 text-blue-500">
                    <i class="fas fa-cloud-sun text-xl"></i>
                </div>
                <!-- Conditions Text -->
                <span class="text-base font-medium">Partly Cloudy</span>
            </div>
            
            <!-- Current Date -->
            <div class="text-sm text-right">
                Friday, November 17, 2023
            </div>
        </div>
        
        <!-- Current Weather Summary -->
        <div class="flex justify-between items-center mb-6 p-2 bg-blue-50/50 rounded-lg">
            <div class="flex items-center gap-3">
                <i class="fas fa-temperature-half text-2xl text-orange-500"></i>
                <div>
                    <div class="text-3xl font-bold">72°F</div>
                    <div class="text-xs text-gray-500">Feels like 75°F</div>
                </div>
            </div>
            <div class="flex flex-col items-end gap-1">
                <div class="flex items-center gap-1">
                    <i class="fas fa-wind text-blue-400"></i>
                    <span class="text-sm">8 mph</span>
                </div>
                <div class="flex items-center gap-1">
                    <i class="fas fa-droplet text-blue-400"></i>
                    <span class="text-sm">45%</span>
                </div>
            </div>
        </div>
        
        <!-- Days of Week -->
        <div class="flex justify-between mb-2">
            <span class="text-xs font-medium text-black/50 flex-1 text-center">SUN</span>
            <span class="text-xs font-medium text-black/50 flex-1 text-center">MON</span>
            <span class="text-xs font-medium text-black/50 flex-1 text-center">TUE</span>
            <span class="text-xs font-medium text-black/50 flex-1 text-center">WED</span>
            <span class="text-xs font-medium text-black/50 flex-1 text-center">THU</span>
            <span class="text-xs font-medium text-black/50 flex-1 text-center">FRI</span>
            <span class="text-xs font-medium text-black/50 flex-1 text-center">SAT</span>
        </div>
        
        <!-- Date Picker Row -->
        <div class="flex justify-between mb-4">
            <!-- Day 15 -->
            <div class="flex-1 h-10 flex items-center justify-center">
                <span class="text-base font-medium text-black/90">15</span>
            </div>
            
            <!-- Day 16 -->
            <div class="flex-1 h-10 flex items-center justify-center">
                <span class="text-base font-medium text-black">16</span>
            </div>
            
            <!-- Day 17 (Selected) -->
            <div class="flex-1 h-10 flex items-center justify-center">
                <div class="w-11 h-11 bg-blue-500 rounded-lg flex items-center justify-center">
                    <span class="text-base font-medium text-white">17</span>
                </div>
            </div>
            
            <!-- Day 18 -->
            <div class="flex-1 h-10 flex items-center justify-center">
                <span class="text-base font-medium text-black">18</span>
            </div>
            
            <!-- Day 19 -->
            <div class="flex-1 h-10 flex items-center justify-center">
                <span class="text-base font-medium text-black">19</span>
            </div>
            
            <!-- Day 20 -->
            <div class="flex-1 h-10 flex items-center justify-center">
                <span class="text-base font-medium text-black">20</span>
            </div>
            
            <!-- Day 21 -->
            <div class="flex-1 h-10 flex items-center justify-center">
                <span class="text-base font-medium text-black">21</span>
            </div>
        </div>
        
        <!-- Expand Button -->
        <button id="expandBtn" class="w-full flex items-center justify-center py-2 text-blue-500 hover:text-blue-700 transition-colors">
            <span>Show Details</span>
            <i class="fas fa-chevron-down ml-2 transition-transform duration-300"></i>
        </button>
        
        <!-- Expandable Details Section -->
        <div id="detailsContainer" class="details-container">
            <div class="border-t border-gray-200 pt-4 mt-2">
                <!-- Hourly Forecast -->
                <h3 class="text-sm font-semibold mb-3">Hourly Forecast</h3>
                <div class="flex overflow-x-auto pb-2 gap-4">
                    <div class="flex flex-col items-center min-w-[60px]">
                        <span class="text-xs">Now</span>
                        <i class="fas fa-cloud-sun text-lg my-2 text-blue-500"></i>
                        <span class="text-sm font-medium">72°F</span>
                    </div>
                    <div class="flex flex-col items-center min-w-[60px]">
                        <span class="text-xs">2 PM</span>
                        <i class="fas fa-sun text-lg my-2 text-yellow-500"></i>
                        <span class="text-sm font-medium">74°F</span>
                    </div>
                    <div class="flex flex-col items-center min-w-[60px]">
                        <span class="text-xs">3 PM</span>
                        <i class="fas fa-sun text-lg my-2 text-yellow-500"></i>
                        <span class="text-sm font-medium">75°F</span>
                    </div>
                    <div class="flex flex-col items-center min-w-[60px]">
                        <span class="text-xs">4 PM</span>
                        <i class="fas fa-cloud-sun text-lg my-2 text-blue-500"></i>
                        <span class="text-sm font-medium">73°F</span>
                    </div>
                    <div class="flex flex-col items-center min-w-[60px]">
                        <span class="text-xs">5 PM</span>
                        <i class="fas fa-cloud text-lg my-2 text-gray-500"></i>
                        <span class="text-sm font-medium">70°F</span>
                    </div>
                    <div class="flex flex-col items-center min-w-[60px]">
                        <span class="text-xs">6 PM</span>
                        <i class="fas fa-cloud text-lg my-2 text-gray-500"></i>
                        <span class="text-sm font-medium">68°F</span>
                    </div>
                </div>
                
                <!-- Additional Weather Details -->
                <div class="grid grid-cols-2 gap-4 mt-6">
                    <div class="bg-white/40 p-3 rounded-lg">
                        <div class="text-xs text-gray-500 mb-1">Precipitation</div>
                        <div class="flex items-center">
                            <i class="fas fa-cloud-rain text-blue-400 mr-2"></i>
                            <span class="text-lg font-medium">20%</span>
                        </div>
                    </div>
                    <div class="bg-white/40 p-3 rounded-lg">
                        <div class="text-xs text-gray-500 mb-1">UV Index</div>
                        <div class="flex items-center">
                            <i class="fas fa-sun text-yellow-500 mr-2"></i>
                            <span class="text-lg font-medium">5 (Moderate)</span>
                        </div>
                    </div>
                    <div class="bg-white/40 p-3 rounded-lg">
                        <div class="text-xs text-gray-500 mb-1">Sunrise</div>
                        <div class="flex items-center">
                            <i class="fas fa-sunrise text-orange-400 mr-2"></i>
                            <span class="text-lg font-medium">6:42 AM</span>
                        </div>
                    </div>
                    <div class="bg-white/40 p-3 rounded-lg">
                        <div class="text-xs text-gray-500 mb-1">Sunset</div>
                        <div class="flex items-center">
                            <i class="fas fa-sunset text-red-400 mr-2"></i>
                            <span class="text-lg font-medium">5:38 PM</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const expandBtn = document.getElementById('expandBtn');
        const detailsContainer = document.getElementById('detailsContainer');
        const chevron = expandBtn.querySelector('i');
        
        expandBtn.addEventListener('click', function() {
            detailsContainer.classList.toggle('details-expanded');
            chevron.classList.toggle('rotate-180');
            
            if (detailsContainer.classList.contains('details-expanded')) {
                expandBtn.querySelector('span').textContent = 'Hide Details';
            } else {
                expandBtn.querySelector('span').textContent = 'Show Details';
            }
        });
    </script>
</body>
</html>
