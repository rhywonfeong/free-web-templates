<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
body {
font-family: 'Inter', sans-serif;
}
/*
Animation for the gradient wave
Moves continuously from left to right
*/
@keyframes wave-flow {
0% { transform: translateX(-100%) rotate(-10deg); }
100% { transform: translateX(100%) rotate(-10deg); }
}
.gradient-flow {
/* Wide gradient to allow smooth movement */
width: 200%;
height: 100%;
background: linear-gradient(
90deg,
transparent 0%,
rgba(3, 11, 26, 0) 20%,
rgba(252, 211, 77, 0.4) 40%,
rgba(244, 114, 182, 0.5) 50%,
rgba(59, 130, 246, 0.5) 60%,
rgba(3, 11, 26, 0) 80%,
transparent 100%
);
filter: blur(50px);
animation: wave-flow 8s linear infinite;
will-change: transform;
}
/* Ensures the gradient is clipped nicely to the grid area */
.grid-container {
mask-image: linear-gradient(to top, transparent, black 20%, black 80%, transparent);
-webkit-mask-image: linear-gradient(to top, transparent, black 20%, black 80%, transparent);
}
</style>
