<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Receive E-Transfer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Inter:400,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#171b2a] font-['Inter']">
  <div class="relative w-full max-w-sm p-8 rounded-2xl overflow-hidden flex flex-col gap-8 border border-[#23253f] shadow-xl">
    <div class="absolute inset-0 pointer-events-none -z-10 rounded-2xl bg-gradient-to-b from-[#202644] via-[#181c2c] to-transparent"></div>
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center bg-gradient-to-br from-[#4662f6] to-[#4fd4fa] shadow">
        <svg width="28" height="28" fill="none" viewBox="0 0 28 28">
          <circle cx="14" cy="14" r="14" fill="#fff" fill-opacity=".08"/>
          <path d="M19 12.5V10c0-1.1-.9-2-2-2h-6c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h3.5" stroke="#4fd4fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M21.2 16.8l-1.9 1.9-1.9-1.9M19.3 12.5V18.7" stroke="#4fd4fa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="text-lg font-semibold text-white">E-Transfer Received</div>
        <div class="text-xs text-[#bee2fa] mt-0.5">Deposit money sent to you</div>
      </div>
    </div>
    <form class="flex flex-col gap-5">
      <div class="flex flex-col gap-1">
        <label for="from" class="text-xs font-medium text-[#52cdf4]">Sender Email</label>
        <input id="from" type="email" placeholder="john.smith@email.com" required
          class="px-3 py-2 rounded-md bg-[#181c2c] border border-[#273050] focus:border-[#4fd4fa] text-base text-white placeholder:text-[#8fa5cf] outline-none transition " />
      </div>
      <div class="flex flex-col gap-1">
        <label for="amount" class="text-xs font-medium text-[#52cdf4]">Amount</label>
        <input id="amount" type="number" placeholder="0.00" min="0" required
          class="px-3 py-2 rounded-md bg-[#181c2c] border border-[#273050] focus:border-[#4fd4fa] text-base text-white placeholder:text-[#8fa5cf] outline-none transition" />
      </div>
      <div class="flex flex-col gap-1">
        <label for="note" class="text-xs font-medium text-[#52cdf4]">Message <span class="text-[#6fa4c9] font-normal">(optional)</span></label>
        <input id="note" type="text" placeholder="eg. Thanks for your help!"
          class="px-3 py-2 rounded-md bg-[#181c2c] border border-[#273050] focus:border-[#4fd4fa] text-base text-white placeholder:text-[#8fa5cf] outline-none transition" />
      </div>
      <button type="submit"
        class="mt-2 bg-gradient-to-r from-[#4662f6] to-[#4fd4fa] hover:from-[#3651d7] hover:to-[#35c4f0] rounded-xl py-3.5 text-white text-base font-semibold shadow-md shadow-[#273766]/30 transition">
        Deposit Funds
      </button>
    </form>
  </div>
</body>
</html>
