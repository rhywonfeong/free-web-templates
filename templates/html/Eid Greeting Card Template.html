<body class="min-h-screen overflow-hidden flex flex-col items-center justify-center text-zinc-800 relative select-none">

    <!-- Ambient Background Elements -->

        <iconify-icon icon="solar:moon-stars-linear" stroke-width="1.5" class="absolute top-1/4 left-1/4 text-rose-200 text-6xl float-1 opacity-50"></iconify-icon>
        <iconify-icon icon="solar:star-fall-linear" stroke-width="1.5" class="absolute top-1/3 right-1/4 text-amber-200 text-4xl float-2 opacity-60"></iconify-icon>
        <iconify-icon icon="solar:star-outline" stroke-width="1.5" class="absolute bottom-1/3 left-1/3 text-rose-200 text-2xl float-3 opacity-40"></iconify-icon>

    <!-- Main Interactive Scene -->
    <main id="scene" class="relative w-[85vw] max-w-sm aspect-[4/3] perspective-container z-10 scene-transition mt-16">
        
        <!-- Envelope Back -->
        <div class="absolute inset-0 rounded-lg shadow-sm z-10 overflow-hidden">
            <svg width="100%" height="100%" preserveAspectRatio="none" class="absolute inset-0">
                <rect width="100%" height="100%" fill="#fecdd3" />

                    <circle cx="2" cy="2" r="1" fill="#fda4af" opacity="0.4"/>
                </pattern>
                <rect width="100%" height="100%" fill="url(#pattern-dots)" />
            </svg>
        </div>

        <!-- The Greeting Card -->
        <div id="card" class="absolute bottom-[2%] left-[2.5%] w-[95%] aspect-[3/4] bg-white rounded-xl flex flex-col items-center p-6 text-center card-transition z-20 shadow-md border border-white/60">
            
            <div id="card-content" class="opacity-0 transition-opacity duration-700 delay-300 flex flex-col items-center justify-between h-full w-full">

                    <!-- Ambient stage elements -->

                    <div id="bubu" class="bear bubu-bear w-1/5 aspect-[4/5] rounded-t-[2rem] rounded-b-xl anim-bubu z-10 mr-4 shadow-sm">

                        <div class="eye right-[20%]"></div>
                        <div class="blush left-[10%]"></div>
                        <div class="blush right-[10%]"></div>
                        <div class="snout"></div>
                    </div>

                    <!-- Dudu (Right) -->
                    <div id="dudu" class="bear dudu-bear w-1/5 aspect-[4/5] rounded-t-[2rem] rounded-b-xl anim-dudu z-10 ml-4 shadow-sm flex items-center justify-center relative">
                        <div class="eye left-[20%]"></div>
                        <div class="eye right-[20%]"></div>

                        <div class="blush right-[10%]"></div>
                        <div class="snout"></div>
                        <!-- Flower prop -->
                        <div id="flower" class="absolute -left-[30%] top-[40%] text-xl anim-flower z-20 origin-bottom">🌸</div>

                    <!-- Floating Heart -->
                    <div id="heart" class="absolute top-[20%] text-3xl anim-heart z-30 drop-shadow-sm">❤️</div>
                    
                    <!-- Success Text -->
                    <div id="anim-text" class="absolute top-[10%] text-sm font-semibold text-rose-400 anim-text tracking-tight bg-white/80 px-3 py-1 rounded-full shadow-sm backdrop-blur-sm">Yay! Hugs! ✨</div>
                </div>

                <!-- Controls -->
                <div class="flex gap-3 w-full justify-center">

                        <iconify-icon icon="solar:restart-circle-linear" class="text-base group-hover:-rotate-90 transition-transform duration-500"></iconify-icon> Replay
                    </button>
                    <button onclick="closeEnvelope(event)" class="flex items-center gap-1 text-xs px-4 py-2 rounded-full bg-zinc-50 text-zinc-600 hover:bg-zinc-100 transition-all font-medium border border-zinc-200 active:scale-95">
                        <iconify-icon icon="solar:box-minimalistic-linear" class="text-base"></iconify-icon> Close
                    </button>

                <!-- Right Flap -->
                <polygon points="100,0 50,55 100,100" fill="#fda4af" />
                <polygon points="100,0 50,55 100,100" fill="#000000" opacity="0.04" />
                <!-- Bottom Flap -->
                <polygon points="0,100 50,55 100,100" fill="#fb7185" />
            </svg>
        </div>

        <div id="flap" class="absolute inset-0 z-40 flap-transition cursor-pointer" onclick="openEnvelope()">
            <svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" class="drop-shadow-md">
                <polygon points="0,0 100,0 50,60" fill="#fb7185" />
                <!-- Inner flap shading when opened -->
                <polygon points="0,0 100,0 50,60" fill="#000000" opacity="0.05" />
            </svg>
            <div id="flap-text" class="absolute top-[25%] left-1/2 -translate-x-1/2 text-white/90 text-sm font-medium tracking-wide flex items-center gap-2 transition-opacity duration-300">
                Tap to Open <iconify-icon icon="solar:letter-linear" class="text-lg"></iconify-icon>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="absolute bottom-6 text-xs text-zinc-400 font-medium tracking-wide z-0">
        Made with <span class="text-rose-400">❤️</span> for Bubu
    </footer>

    <script>
        const state = { isOpen: false, isAnimating: false };
        
        const elements = {
            flap: document.getElementById('flap'),
            flapText: document.getElementById('flap-text'),
            card: document.getElementById('card'),
            cardContent: document.getElementById('card-content'),
            scene: document.getElementById('scene'),
            bubu: document.getElementById('bubu'),
            dudu: document.getElementById('dudu'),
            flower: document.getElementById('flower'),
            heart: document.getElementById('heart'),
            animText: document.getElementById('anim-text')
        };

        function openEnvelope() {
            if (state.isOpen) return;
            state.isOpen = true;

            // 1. Open flap
            elements.flap.classList.add('flap-open');
            elements.flapText.style.opacity = '0';
            elements.flap.classList.remove('cursor-pointer');

            // 2. Slide card up after flap opens
            setTimeout(() => {
                elements.card.classList.add('card-up');
                elements.scene.classList.add('scene-shifted');
            }, 400);

            // 3. Fade in content and trigger scene
            setTimeout(() => {
                elements.cardContent.classList.remove('opacity-0');
                playAnimation();
            }, 1000);
        }

        function closeEnvelope(e) {
            e.stopPropagation();
            if (!state.isOpen) return;
            state.isOpen = false;

            // Hide content and reset animation
            elements.cardContent.classList.add('opacity-0');
            resetAnimationClasses();

            // Slide card down
            setTimeout(() => {
                elements.card.classList.remove('card-up');
                elements.scene.classList.remove('scene-shifted');
            }, 300);

            // Close flap
            setTimeout(() => {
                elements.flap.classList.remove('flap-open');
                elements.flapText.style.opacity = '1';
                elements.flap.classList.add('cursor-pointer');
            }, 900);
        }

        function resetAnimationClasses() {
            const animElements = [elements.bubu, elements.dudu, elements.flower, elements.heart, elements.animText];
            animElements.forEach(el => {
                el.classList.remove('play', 'hide');
                // Force reflow to allow animation restart
                void el.offsetWidth;
            });
        }

        function playAnimation(e) {
            if (e) e.stopPropagation();
            if (state.isAnimating) return;
            state.isAnimating = true;

            resetAnimationClasses();

            // Sequence:
            // 0.0s: Walk towards each other
            // 0.5s: Flower appears on Dudu
            // 1.5s: Hug (walk completes) -> Flower hides
            // 1.6s: Heart floats up
            // 1.8s: Text pops in

            elements.bubu.classList.add('play');
            elements.dudu.classList.add('play');
            elements.flower.classList.add('play');

            setTimeout(() => {
                elements.flower.classList.add('hide');
            }, 1500);

            elements.heart.classList.add('play');
            elements.animText.classList.add('play');

            setTimeout(() => {
                state.isAnimating = false;
            }, 3600); // Wait for full sequence before allowing replay
        }
    </script>
