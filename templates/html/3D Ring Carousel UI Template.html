<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Ring Carousel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script></head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="mx-auto max-w-6xl px-4 py-10 sm:py-12">
    <header class="flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="grid h-9 w-9 place-items-center rounded-lg bg-white/5 ring-1 ring-white/10">
          <span class="text-sm font-semibold tracking-tight text-slate-100">RC</span>
        </div>
        <div class="leading-tight">
          <div class="text-sm font-medium text-slate-200">Ring Carousel</div>
          <div class="text-xs text-slate-400">Inside-view cylindrical gallery</div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="btnPrev" class="inline-flex items-center gap-2 rounded-lg bg-white/5 px-3 py-2 text-xs font-medium text-slate-100 ring-1 ring-white/10 hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-slate-400/30">
          <span class="iconify" data-icon="lucide:chevron-left" data-width="16" data-height="16" data-flip="" data-rotate="" style="stroke-width:1.5;"></span>
          Prev
        </button>
        <button id="btnNext" class="inline-flex items-center gap-2 rounded-lg bg-white/5 px-3 py-2 text-xs font-medium text-slate-100 ring-1 ring-white/10 hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-slate-400/30">
          Next
          <span class="iconify" data-icon="lucide:chevron-right" data-width="16" data-height="16" style="stroke-width:1.5;"></span>
        </button>
      </div>
    </header>

    <main class="mt-8">
      <section class="relative overflow-hidden rounded-2xl bg-white/5 ring-1 ring-white/10">
        <div class="flex items-center justify-between gap-4 border-b border-white/10 px-4 py-3 sm:px-6">
          <div>
            <h1 class="text-lg font-semibold tracking-tight text-slate-100 sm:text-xl">Explore the ring</h1>
            <p class="mt-1 text-xs text-slate-400">Use arrows, dots, or swipe. Auto-rotates every 4s (pauses on hover).</p>
          </div>

          <button id="btnPlayPause" class="inline-flex items-center gap-2 rounded-lg bg-white/5 px-3 py-2 text-xs font-medium text-slate-100 ring-1 ring-white/10 hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-slate-400/30">
            <span id="playIcon" class="iconify" data-icon="lucide:pause" data-width="16" data-height="16" style="stroke-width:1.5;"></span>
            <span id="playLabel">Pause</span>
          </button>
        </div>

        <div class="relative">
          <!-- 3D stage -->
          <div id="stage" class="relative h-[22rem] sm:h-[26rem] md:h-[30rem] select-none" style="perspective: 1000px;">
            <div id="ring" class="absolute inset-0" style="transform-style: preserve-3d; will-change: transform;"></div>

            <!-- center gradient / vignette -->
            <div class="pointer-events-none absolute inset-0 bg-gradient-to-b from-slate-950/0 via-slate-950/10 to-slate-950/35"></div>
            <div class="pointer-events-none absolute inset-0" style="box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), inset 0 -8rem 10rem rgba(2,6,23,.6);"></div>
          </div>

          <!-- dots -->
          <div class="flex items-center justify-center gap-2 px-4 pb-5 sm:px-6">
            <div id="dots" class="flex flex-wrap items-center justify-center gap-2"></div>
          </div>

          <!-- floating hint -->
          <div class="pointer-events-none absolute right-4 top-4 hidden items-center gap-2 rounded-full bg-slate-950/60 px-3 py-2 text-xs text-slate-200 ring-1 ring-white/10 sm:flex">
            <span class="iconify" data-icon="lucide:mouse-pointer-2" data-width="14" data-height="14" style="stroke-width:1.5;"></span>
            Drag / swipe
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const items = [
      { title: "Northern Lights", subtitle: "Arctic night glow", tag: "New", src: "https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?auto=format&fit=crop&w=1200&q=70" },
      { title: "Desert Road", subtitle: "Endless horizon", tag: "Featured", src: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=70" },
      { title: "Coastal Cliffs", subtitle: "Salt & wind", tag: "Popular", src: "https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=1200&q=70" },
      { title: "City Nights", subtitle: "After-hours glow", tag: "Live", src: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1200&q=70" },
      { title: "Forest Trail", subtitle: "Quiet escape", tag: "Guide", src: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=70" },
      { title: "Snow Peaks", subtitle: "High altitude", tag: "Top", src: "https://images.unsplash.com/photo-1454496522488-7a8e488e8606?auto=format&fit=crop&w=1200&q=70" }
    ];

    const stage = document.getElementById("stage");
    const ring = document.getElementById("ring");
    const dots = document.getElementById("dots");
    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const btnPlayPause = document.getElementById("btnPlayPause");
    const playIcon = document.getElementById("playIcon");
    const playLabel = document.getElementById("playLabel");

    let index = 0;
    let angle = 0;
    let isDragging = false;
    let startX = 0;
    let startAngle = 0;
    let autoplay = true;
    let timer = null;

    function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

    function computeLayout() {
      const w = stage.clientWidth;
      const h = stage.clientHeight;

      // responsive radius/card size; keep subtle and consistent
      const cardW = clamp(w * 0.46, 220, 340);
      const cardH = clamp(h * 0.70, 220, 360);
      const radius = clamp(w * 0.42, 240, 480);

      return { cardW, cardH, radius };
    }

    function build() {
      ring.innerHTML = "";
      dots.innerHTML = "";

      const { cardW, cardH, radius } = computeLayout();
      const step = 360 / items.length;

      items.forEach((it, i) => {
        const card = document.createElement("article");
        card.className =
          "absolute left-1/2 top-1/2 overflow-hidden rounded-2xl bg-white/5 ring-1 ring-white/10 shadow-[0_12px_40px_rgba(0,0,0,.35)]";
        card.style.width = cardW + "px";
        card.style.height = cardH + "px";
        card.style.transformStyle = "preserve-3d";

        const a = step * i;
        // "inside-view": translateZ positive so panels are around you, facing inward.
        // rotateY positions them around the circle.
        card.style.transform =
          `translate(-50%, -50%) rotateY(${a}deg) translateZ(${radius}px) rotateY(180deg)`;

        card.innerHTML = `
          <div class="relative h-full w-full">
            <img alt="${it.title}" src="${it.src}" class="h-full w-full object-cover" draggable="false"/>
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-slate-950/10 to-slate-950/0"></div>

            <div class="absolute left-4 right-4 top-4 flex items-center justify-between gap-3">
              <div class="inline-flex items-center gap-2 rounded-full bg-slate-950/55 px-3 py-1 text-xs text-slate-100 ring-1 ring-white/10">
                <span class="inline-block h-1.5 w-1.5 rounded-full bg-emerald-300/80"></span>
                ${it.tag}
              </div>

              <button class="group inline-flex h-9 w-9 items-center justify-center rounded-full bg-slate-950/55 ring-1 ring-white/10 hover:bg-slate-950/70 focus:outline-none focus:ring-2 focus:ring-slate-400/30" aria-label="Play video">
                <span class="iconify text-slate-100" data-icon="lucide:play" data-width="18" data-height="18" style="stroke-width:1.5;"></span>
              </button>
            </div>

            <div class="absolute bottom-0 left-0 right-0 p-4">
              <div class="text-base font-semibold tracking-tight text-slate-50">${it.title}</div>
              <div class="mt-0.5 text-xs text-slate-200/80">${it.subtitle}</div>
            </div>
          </div>
        `;

        ring.appendChild(card);

        const dot = document.createElement("button");
        dot.className =
          "h-2.5 w-2.5 rounded-full ring-1 ring-white/15 transition hover:ring-white/30 focus:outline-none focus:ring-2 focus:ring-slate-400/30";
        dot.style.background = i === index ? "rgba(255,255,255,.75)" : "rgba(255,255,255,.18)";
        dot.setAttribute("aria-label", `Go to slide ${i + 1}`);
        dot.addEventListener("click", () => goTo(i));
        dots.appendChild(dot);
      });

      update();
    }

    function update() {
      const step = 360 / items.length;
      const targetAngle = -index * step;

      // animate angle smoothly
      angle += (targetAngle - angle) * 0.14;

      ring.style.transform = `rotateY(${angle}deg)`;

      // update dots
      [...dots.children].forEach((d, i) => {
        d.style.background = i === index ? "rgba(255,255,255,.75)" : "rgba(255,255,255,.18)";
      });

      requestAnimationFrame(update);
    }

    function goTo(i) {
      index = (i + items.length) % items.length;
    }

    function next() { goTo(index + 1); }
    function prev() { goTo(index - 1); }

    btnNext.addEventListener("click", next);
    btnPrev.addEventListener("click", prev);

    function setAutoplay(on) {
      autoplay = on;
      clearInterval(timer);
      if (autoplay) {
        timer = setInterval(next, 4000);
        playIcon.setAttribute("data-icon", "lucide:pause");
        playLabel.textContent = "Pause";
      } else {
        playIcon.setAttribute("data-icon", "lucide:play");
        playLabel.textContent = "Play";
      }
    }

    btnPlayPause.addEventListener("click", () => setAutoplay(!autoplay));

    // Pause on hover
    stage.addEventListener("mouseenter", () => autoplay && clearInterval(timer));
    stage.addEventListener("mouseleave", () => autoplay && (timer = setInterval(next, 4000)));

    // Drag + touch
    function pointerDown(e) {
      isDragging = true;
      startX = (e.touches ? e.touches[0].clientX : e.clientX);
      startAngle = angle;
      clearInterval(timer);
    }

    function pointerMove(e) {
      if (!isDragging) return;
      const x = (e.touches ? e.touches[0].clientX : e.clientX);
      const dx = x - startX;
      // map drag to rotation
      angle = startAngle + dx * 0.25;
      ring.style.transform = `rotateY(${angle}deg)`;
    }

    function pointerUp() {
      if (!isDragging) return;
      isDragging = false;

      const step = 360 / items.length;
      // snap to nearest
      const snapped = Math.round(angle / step) * step;
      // convert snapped angle to index (inverse sign of target)
      index = (Math.round((-snapped) / step) % items.length + items.length) % items.length;

      if (autoplay) timer = setInterval(next, 4000);
    }

    stage.addEventListener("mousedown", pointerDown);
    window.addEventListener("mousemove", pointerMove);
    window.addEventListener("mouseup", pointerUp);

    stage.addEventListener("touchstart", pointerDown, { passive: true });
    window.addEventListener("touchmove", pointerMove, { passive: true });
    window.addEventListener("touchend", pointerUp);

    // Keyboard
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") next();
      if (e.key === "ArrowLeft") prev();
    });

    // Resize rebuild
    let resizeT = null;
    window.addEventListener("resize", () => {
      clearTimeout(resizeT);
      resizeT = setTimeout(build, 120);
    });

    build();
    setAutoplay(true);
  </script>
</body>
</html>
