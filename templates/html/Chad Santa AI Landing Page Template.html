<style>
body {
font-family: 'Inter', sans-serif;
background-color: #050505;
background-image:
radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.08) 0%, transparent 40%),
linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px);
background-size: 100% 100%, 4rem 4rem, 4rem 4rem;
}
/* Custom Scrollbar */
::-webkit-scrollbar {
width: 6px;
}
::-webkit-scrollbar-track {
background: transparent;
}
::-webkit-scrollbar-thumb {
background: #262626;
border-radius: 3px;
}
/* Glitch/Hologram Effect for Wireframe */
.wireframe-effect {
filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.3));
animation: float 6s ease-in-out infinite;
}
@keyframes float {
0%, 100% { transform: translateY(0px) rotateX(0deg); }
50% { transform: translateY(-10px) rotateX(2deg); }
}
.scanline {
background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.3) 51%);
background-size: 100% 4px;
pointer-events: none;
}
/* Audio Visualizer Bars */
.bar {
width: 4px;
background: linear-gradient(to top, #ef4444, #f87171);
border-radius: 9999px;
animation: sound 0ms -800ms linear infinite alternate;
height: 10%;
}
@keyframes sound {
0% { height: 10%; opacity: 0.5; }
100% { height: 100%; opacity: 1; }
}
.bar:nth-child(1)  { animation-duration: 474ms; }
.bar:nth-child(2)  { animation-duration: 433ms; }
.bar:nth-child(3)  { animation-duration: 407ms; }
.bar:nth-child(4)  { animation-duration: 458ms; }
.bar:nth-child(5)  { animation-duration: 400ms; }
.bar:nth-child(6)  { animation-duration: 427ms; }
.bar:nth-child(7)  { animation-duration: 441ms; }
.bar:nth-child(8)  { animation-duration: 419ms; }
.bar:nth-child(9)  { animation-duration: 487ms; }
.bar:nth-child(10) { animation-duration: 442ms; }
/* Typing Cursor */
.typing-cursor::after {
content: '|';
animation: blink 1s step-start infinite;
}
@keyframes blink { 50% { opacity: 0; } }
</style></head>
<body class="h-screen w-full text-neutral-300 overflow-hidden flex flex-col selection:bg-red-500/30 selection:text-red-200">

    <!-- Screen Overlay: Scanlines & Vignette -->
    <div class="fixed inset-0 pointer-events-none z-50 scanline opacity-10"></div>
    <div class="fixed inset-0 pointer-events-none z-40 bg-[radial-gradient(circle_at_center,transparent_0%,#000000_120%)]"></div>

    <!-- Header -->
    <header class="flex-none flex items-center justify-between px-6 py-4 border-b border-neutral-900/50 bg-black/20 backdrop-blur-sm z-30">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-neutral-800 to-neutral-900 border border-neutral-800 flex items-center justify-center">
                <span class="text-xs font-semibold tracking-tighter text-white">CS</span>
            </div>
            <div>
                <h1 class="text-sm font-medium tracking-tight text-white leading-none">CHAD SANTA</h1>
                <span class="text-[10px] text-neutral-500 font-medium tracking-wide uppercase">Interactive Agent</span>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-neutral-900/50 border border-neutral-800">
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)] animate-pulse"></div>
                <span class="text-[10px] font-medium text-neutral-400 tracking-wide">SYSTEM ONLINE</span>
            </div>
            <button class="text-neutral-500 hover:text-white transition-colors">
                <iconify-icon icon="lucide:settings-2" width="18" height="18" stroke-width="1.5"></iconify-icon>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col items-center justify-center relative z-10 p-6">
        
        <!-- Wireframe Visualizer Container -->
        <div class="relative w-full max-w-lg aspect-square flex items-center justify-center">
            
            <!-- Rotating Circles Background -->
            <div class="absolute inset-0 border border-neutral-800/30 rounded-full animate-[spin_10s_linear_infinite]"></div>
            <div class="absolute inset-4 border border-neutral-800/30 rounded-full animate-[spin_15s_linear_infinite_reverse] border-dashed"></div>
            
            <!-- Chad Santa Wireframe Face (SVG) -->
            <div class="relative w-64 h-64 wireframe-effect text-red-500/80 transition-all duration-300" id="avatar-container">
                <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-[0_0_15px_rgba(220,38,38,0.2)]">
                    <!-- Head Shape -->
                    <path d="M50 60 C50 20, 150 20, 150 60 L150 100 C150 160, 100 180, 100 190 C100 180, 50 160, 50 100 Z" stroke="currentColor" stroke-width="0.5"/>
                    <!-- Hat -->
                    <path d="M45 60 C45 60, 100 10, 155 60" stroke="currentColor" stroke-width="0.5"/>
                    <path d="M155 60 L180 80 L160 90" stroke="currentColor" stroke-width="0.5"/> <!-- Flop of hat -->
                    <circle cx="160" cy="90" r="5" stroke="currentColor" stroke-width="0.5"/>
                    <!-- Sunglasses (The Chad Look) -->
                    <path d="M60 90 L95 90 L100 95 L105 90 L140 90 L135 110 L105 110 L100 105 L95 110 L65 110 Z" fill="rgba(20,20,20,0.8)" stroke="currentColor" stroke-width="0.5"/>
                    <line x1="60" y1="90" x2="45" y2="85" stroke="currentColor" stroke-width="0.5"/>
                    <line x1="140" y1="90" x2="155" y2="85" stroke="currentColor" stroke-width="0.5"/>
                    <!-- Beard -->
                    <path d="M60 120 C60 120, 70 160, 100 160 C130 160, 140 120, 140 120" stroke="currentColor" stroke-width="0.5" stroke-dasharray="2 2"/>
                    <path d="M70 130 L100 170 L130 130" stroke="currentColor" stroke-width="0.2"/>
                    <!-- Grid lines on face -->
                    <path d="M100 20 L100 190" stroke="currentColor" stroke-width="0.1" opacity="0.5"/>
                    <path d="M50 100 L150 100" stroke="currentColor" stroke-width="0.1" opacity="0.5"/>
                    <ellipse cx="100" cy="100" rx="40" ry="60" stroke="currentColor" stroke-width="0.1" opacity="0.5"/>
                </svg>
            </div>

            <!-- Audio Visualizer (Hidden by default, shows when speaking) -->
            <div id="visualizer" class="absolute bottom-0 left-1/2 -translate-x-1/2 flex items-end justify-center gap-1 h-12 opacity-0 transition-opacity duration-300">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
        </div>

        <!-- Subtitles Area -->
        <div class="mt-8 min-h-[4rem] flex flex-col items-center justify-center max-w-2xl text-center z-20">
            <h2 id="subtitle-text" class="text-lg md:text-xl font-medium tracking-tight text-white drop-shadow-md typing-cursor hidden"></h2>
            <p id="status-text" class="text-xs text-neutral-500 font-mono mt-2 animate-pulse">WAITING FOR INPUT...</p>
        </div>

    </main>

    <!-- Chat Interface Footer -->
    <footer class="flex-none p-4 md:p-6 max-w-3xl mx-auto w-full z-30">
        <!-- Messages History (Fade Overlay) -->
        <div class="absolute bottom-24 left-0 right-0 h-32 bg-gradient-to-t from-[#050505] to-transparent pointer-events-none"></div>

        <div class="relative group">
            <div class="absolute -inset-0.5 bg-gradient-to-r from-red-500/20 to-neutral-700/20 rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
            
            <form id="chat-form" class="relative flex items-center gap-2 bg-neutral-900/80 backdrop-blur-xl border border-white/10 p-2 rounded-xl shadow-2xl">
                
                <button type="button" id="mic-btn" class="flex-none w-10 h-10 rounded-lg flex items-center justify-center text-neutral-400 hover:text-white hover:bg-neutral-800 transition-all">
                    <iconify-icon icon="lucide:mic" width="20" height="20" stroke-width="1.5"></iconify-icon>
                </button>

                <input type="text" id="user-input" 
                    class="flex-1 bg-transparent border-none outline-none text-sm text-white placeholder-neutral-500 px-2 font-light" 
                    placeholder="Ask Chad Santa for gains or gifts..." autocomplete="off">
                
                <div class="h-4 w-[1px] bg-neutral-800"></div>

                <button type="submit" class="flex-none px-4 py-2 bg-white text-black rounded-lg hover:bg-neutral-200 transition-colors flex items-center gap-2 group/send">
                    <span class="text-xs font-semibold tracking-tight">SEND</span>
                    <iconify-icon icon="lucide:arrow-up" width="16" height="16" stroke-width="1.5" class="group-hover/send:-translate-y-0.5 transition-transform"></iconify-icon>
                </button>
            </form>
        </div>
        
        <div class="text-center mt-4">
            <p class="text-[10px] text-neutral-600 font-medium tracking-wide">POWERED BY ELEVEN LABS • NEURAL AUDIO SYNTHESIS</p>
        </div>
    </footer>

    <script>
        // DOM Elements
        const form = document.getElementById('chat-form');
        const input = document.getElementById('user-input');
        const subtitleText = document.getElementById('subtitle-text');
        const statusText = document.getElementById('status-text');
        const visualizer = document.getElementById('visualizer');
        const avatarContainer = document.getElementById('avatar-container');
        const micBtn = document.getElementById('mic-btn');

        // Chad Santa's Brain (Mock Responses)
        const responses = [
            "Ho ho hold up. You think you're getting on the nice list without hitting PRs? Nice try, bro.",
            "I checked the list twice. You're lacking protein, and your squat depth is questionable. coal for you.",
            "Listen, the reindeer are on a strict keto diet this year. Rudolf is shredded. Ask me about my glute routine.",
            "Gifts? The only gift I'm giving out this year is the gift of gains. Merry Liftmas.",
            "Just finished a set of 500 chimney pushups. I'm pumped. What do you want?",
            "Bro, Mrs. Claus got me these new tactical lifting gloves. My grip strength is infinite right now.",
            "I'm detecting low testosterone levels in that question. Try again with more intensity."
        ];

        let isSpeaking = false;
        let typingInterval;

        // UI Logic
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text || isSpeaking) return;

            // Reset UI
            input.value = '';
            handleUserInteraction(text);
        });

        micBtn.addEventListener('click', () => {
            if (isSpeaking) return;
            statusText.textContent = "LISTENING...";
            statusText.classList.add('text-red-400');
            statusText.classList.remove('text-neutral-500');
            
            // Simulate listening delay
            setTimeout(() => {
                handleUserInteraction("Voice Input Detected...");
            }, 1500);
        });

        function handleUserInteraction(userText) {
            // Processing State
            statusText.textContent = "CHAD SANTA IS THINKING...";
            statusText.classList.remove('text-red-400');
            statusText.classList.add('text-emerald-400');
            subtitleText.classList.add('hidden');
            subtitleText.textContent = '';
            
            // Randomize Response
            const randomResponse = responses[Math.floor(Math.random() * responses.length)];

            // Simulate Network/Processing Delay
            setTimeout(() => {
                simulateSpeaking(randomResponse);
            }, 1200);
        }

        function simulateSpeaking(text) {
            isSpeaking = true;
            statusText.textContent = "GENERATING RESPONSE...";
            statusText.classList.remove('text-emerald-400');
            statusText.classList.add('text-red-500');
            
            // UI visual feedback
            visualizer.classList.remove('opacity-0');
            avatarContainer.classList.add('scale-110');
            
            subtitleText.classList.remove('hidden');
            
            // Typewriter effect
            let i = 0;
            clearInterval(typingInterval);
            
            // Calculate timing based on text length to simulate speech cadence roughly
            const speed = 40; 
            
            typingInterval = setInterval(() => {
                if (i < text.length) {
                    subtitleText.textContent += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typingInterval);
                    setTimeout(stopSpeaking, 2000); // Wait a bit after finishing text
                }
            }, speed);
        }

        function stopSpeaking() {
            isSpeaking = false;
            visualizer.classList.add('opacity-0');
            avatarContainer.classList.remove('scale-110');
            statusText.textContent = "WAITING FOR INPUT...";
            statusText.classList.remove('text-red-500');
            statusText.classList.add('text-neutral-500');
        }

        // Initialize with random subtle movement for the avatar
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            avatarContainer.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });

    </script>
