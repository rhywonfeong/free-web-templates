  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient CTA Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .cta-btn {
      background: linear-gradient(90deg, #6366f1 0%, #a21caf 100%);
      transition: 
        transform 0.26s cubic-bezier(.68,-0.55,.27,1.55),
        box-shadow 0.26s;
      box-shadow: 0 4px 18px #6366f133, 0 2px 6px #a21caf22;
      position: relative;
      overflow: hidden;
      outline: none;
    }
    .cta-btn:hover {
      transform: translateY(-5px) scale(1.045);
      box-shadow: 0 8px 32px #6366f144, 0 4px 12px #a21caf33;
    }
    .cta-btn span.cta-arrow {
      display: inline-block;
      margin-left: 10px;
      transition: transform 0.22s cubic-bezier(.68,-0.55,.27,1.55);
    }
    .cta-btn:hover span.cta-arrow {
      transform: translateX(7px) scale(1.15);
    }
    .cta-btn::before {
      content: "";
      position: absolute;
      top: 0; left: -70%;
      width: 60%; height: 100%;
      background: linear-gradient(95deg, transparent 0%, rgba(255,255,255,0.33) 55%, transparent 100%);
      opacity: 0.6;
      transition: left 0.7s cubic-bezier(.68,-0.55,.27,1.55);
      pointer-events: none;
    }
    .cta-btn:hover::before {
      left: 120%;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f5f5fa]">
  <a href="#" class="cta-btn rounded-full px-10 py-4 text-lg sm:text-xl font-bold tracking-tight text-white shadow-lg focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2">
    Get started <span class="cta-arrow">➔</span>
  </a>
</body>
</html>
