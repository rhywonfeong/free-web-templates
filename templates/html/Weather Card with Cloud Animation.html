<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Card with Cloud Animation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.clouds.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        #cloud-background {
            position: absolute;
            width: 100%;
            height: 100vh;
            top: 0;
            left: 0;
        }
        
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 1rem;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
        }

        .glass-divider {
            border-color: rgba(0, 0, 0, 0.2);
        }

        .glass-section {
            background: rgba(255, 255, 255, 0.08);
        }

        .text-primary {
            color: rgba(0, 0, 0, 1);
        }

        .text-secondary {
            color: rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <div id="cloud-background"></div>
    
    <div class="content">
        <div class="max-w-sm w-full glass-card rounded-xl overflow-hidden">
            <!-- Header -->
            <div class="px-6 pt-6 pb-4 border-b glass-divider">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <div class="w-2 h-2 rounded-full bg-blue-400"></div>
                        <h2 class="text-primary font-medium text-sm">San Francisco</h2>
                    </div>
                    <span class="text-xs text-secondary">Updated just now</span>
                </div>
            </div>
            
            <!-- Weather Info -->
            <div class="px-6 py-8">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="flex items-baseline">
                            <span class="text-4xl font-light text-primary">68°</span>
                            <span class="ml-1 text-secondary text-sm">F</span>
                        </div>
                        <p class="text-secondary text-sm mt-1">Partly Cloudy</p>
                    </div>
                    
                    <!-- Weather Icon -->
                    <div class="text-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-14 h-14">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- Stats -->
            <div class="px-6 py-4 glass-section grid grid-cols-3 gap-2 text-center">
                <div class="px-2 py-3">
                    <p class="text-xs text-secondary uppercase tracking-wide">Humidity</p>
                    <p class="text-primary font-medium mt-1">72%</p>
                </div>
                <div class="px-2 py-3">
                    <p class="text-xs text-secondary uppercase tracking-wide">Wind</p>
                    <p class="text-primary font-medium mt-1">8 mph</p>
                </div>
                <div class="px-2 py-3">
                    <p class="text-xs text-secondary uppercase tracking-wide">Feels like</p>
                    <p class="text-primary font-medium mt-1">70°</p>
                </div>
            </div>
            
            <!-- Forecast -->
            <div class="px-6 py-4 border-t glass-divider">
                <div class="grid grid-cols-5 gap-2">
                    <div class="text-center">
                        <p class="text-xs text-secondary">Mon</p>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-6 h-6 mx-auto my-1 text-secondary">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                        </svg>
                        <p class="text-xs font-medium text-primary">72°</p>
                    </div>
                    <div class="text-center">
                        <p class="text-xs text-secondary">Tue</p>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-6 h-6 mx-auto my-1 text-secondary">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />
                        </svg>
                        <p class="text-xs font-medium text-primary">68°</p>
                    </div>
                    <div class="text-center">
                        <p class="text-xs text-secondary">Wed</p>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-6 h-6 mx-auto my-1 text-secondary">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />
                        </svg>
                        <p class="text-xs font-medium text-primary">65°</p>
                    </div>
                    <div class="text-center">
                        <p class="text-xs text-secondary">Thu</p>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-6 h-6 mx-auto my-1 text-secondary">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                        </svg>
                        <p class="text-xs font-medium text-primary">74°</p>
                    </div>
                    <div class="text-center">
                        <p class="text-xs text-secondary">Fri</p>
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="w-6 h-6 mx-auto my-1 text-secondary">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                        </svg>
                        <p class="text-xs font-medium text-primary">76°</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        VANTA.CLOUDS({
            el: "#cloud-background",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            skyColor: 0x68b8d7,
            cloudColor: 0xadc1de,
            cloudShadowColor: 0x183550,
            sunColor: 0xff9919,
            sunGlareColor: 0xff6633,
            sunlightColor: 0xff9933,
            speed: 1.2
        });
    </script>
</body>
</html>
