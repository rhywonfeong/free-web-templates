<style>
/* Fonts */
.font-script { font-family: 'Dancing Script', cursive; }
.font-ui { font-family: 'Inter', sans-serif; }
/* 3D Context */
.perspective-1500 { perspective: 1500px; }
/* Envelope Structure */
.envelope-wrapper {
position: relative;
transform-style: preserve-3d;
cursor: pointer;
transition: transform 0.6s ease;
}
.envelope-wrapper:not(.open):hover {
transform: scale(1.02);
}
/* The Flap */
.flap {
transform-origin: top;
transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s linear 0.3s;
z-index: 50;
}
.envelope-wrapper.open .flap {
transform: rotateX(180deg);
z-index: 10;
}
/* The Letter Animation */
.letter {
transform: translateY(0) translateZ(0);
opacity: 0;
transition: transform 2.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease, box-shadow 0.6s ease;
transition-delay: 0.6s;
z-index: 15;
will-change: transform;
}
.envelope-wrapper.open .letter {
opacity: 1;
/* Lift high and pull forward to clear envelope */
transform: translateY(-80%) translateZ(60px) scale(1.05);
z-index: 60;
box-shadow: 0 25px 50px -12px rgba(244, 114, 182, 0.5);
}
/* Floating Animation */
.letter.floating {
animation: float 5s ease-in-out infinite;
}
.letter.floating:hover {
box-shadow: 0 35px 60px -15px rgba(244, 114, 182, 0.6);
}
@keyframes float {
0%, 100% { transform: translateY(-80%) translateZ(60px) scale(1.05); }
50% { transform: translateY(-83%) translateZ(60px) scale(1.05); }
}
/* Glass Buttons */
.btn-glass {
background: rgba(255, 255, 255, 0.4);
backdrop-filter: blur(8px);
-webkit-backdrop-filter: blur(8px);
border: 1px solid rgba(255, 255, 255, 0.8);
box-shadow: 0 4px 6px -1px rgba(255, 182, 193, 0.2), 0 2px 4px -1px rgba(255, 182, 193, 0.1), inset 0 0 10px rgba(255, 255, 255, 0.5);
transition: all 0.3s ease;
}
.btn-glass:hover {
background: rgba(255, 255, 255, 0.7);
box-shadow: 0 10px 15px -3px rgba(255, 182, 193, 0.3);
transform: translateY(-1px);
}
/* Polaroid Styling */
.polaroid {
background: white;
box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.5s ease;
transform-origin: center bottom;
}
/* Discard Animation for flipbook */
.polaroid.discard {
transform: translateX(120%) rotate(20deg) !important;
opacity: 0;
pointer-events: none;
}
/* Scattering Animation for final state */
.scatter-mode .polaroid {
transition: all 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
/* Utilities */
body { -ms-overflow-style: none; scrollbar-width: none; }
::-webkit-scrollbar { display: none; }
</style>

  <body
    class="overflow-hidden flex items-center justify-center selection:bg-pink-200 selection:text-pink-600 bg-pink-100 w-screen h-screen"
  >
    <!-- Screen 1: The Envelope -->
    <main
      class="flex flex-col transition-opacity duration-700 z-10 w-full h-full relative items-center justify-center"
      id="view-landing"
    >
      <div
        class="relative w-72 h-48 sm:w-80 sm:h-56 perspective-1500 group translate-y-8"
        id="scene-container"
      >
        <!-- Shadow -->
        <div
          class="absolute -bottom-12 left-8 right-8 h-4 bg-pink-400/20 blur-xl rounded-[100%] transition-all duration-1000"
        ></div>

        <div class="envelope-wrapper w-full h-full">
          <!-- Envelope Back -->
          <div
            class="absolute inset-0 bg-pink-200 rounded-lg shadow-sm border border-pink-300/40"
          ></div>

          <!-- THE LETTER -->
          <div
            id="the-letter"
            class="letter absolute left-8 right-8 bottom-0 h-[120%] bg-pink-50 rounded-3xl shadow-xl border-2 border-white flex flex-col items-center justify-center p-6 overflow-hidden"
          >
            <!-- Letter Content -->
            <div class="flex flex-col items-center w-full h-full relative z-10">
              <!-- Text -->
              <h1
                class="font-script text-2xl sm:text-3xl text-pink-500 leading-tight text-center mb-4 drop-shadow-sm tracking-tight font-semibold"
              >
                Baby, will you be
                <br />
                my Valentine?
              </h1>

              <!-- Button Zone: Strictly constrained area -->
              <div
                id="button-zone"
                class="relative w-full flex items-center justify-center mt-2 opacity-0 transition-opacity duration-1000 delay-300 pointer-events-none"
              >
                <div
                  class="relative w-full h-16 flex items-center justify-center gap-4"
                >
                  <!-- YES Button -->
                  <button
                    id="btn-yes"
                    class="btn-glass px-6 py-2 rounded-full text-pink-500 font-ui text-xs sm:text-sm tracking-wide z-20 font-semibold transition-all duration-300 hover:-translate-y-0.5 hover:shadow-[0_0_20px_rgba(236,72,153,0.4)] active:scale-95 cursor-pointer"
                  >
                    YESSSS!!!
                  </button>

                  <!-- NO Button -->
                  <button
                    id="btn-no"
                    class="btn-glass px-6 py-2 rounded-full text-pink-400 font-ui text-xs sm:text-sm tracking-wide z-10 transition-all duration-150 ease-out font-normal cursor-default"
                  >
                    No :(
                  </button>
                </div>
              </div>
            </div>

            <!-- Subtle Paper Texture/Gradient -->
            <div
              class="absolute inset-0 bg-gradient-to-t from-pink-100/30 to-white/50 pointer-events-none z-0"
            ></div>
          </div>

          <!-- Envelope Front (Pocket) -->
          <div class="absolute inset-0 z-30 pointer-events-none">
            <div
              class="absolute bottom-0 left-0 w-full h-full bg-pink-300 rounded-b-lg shadow-inner border-t border-pink-200"
              style="clip-path: polygon(0% 100%, 100% 100%, 100% 0%, 50% 55%, 0% 0%); background: linear-gradient(135deg, #f9a8d4, #f472b6);"
            ></div>
          </div>

          <!-- Envelope Flap -->
          <div class="flap w-full h-full absolute top-0 left-0">
            <div
              class="origin-top flex bg-pink-300 w-full h-1/2 border-white/20 rounded-t-lg border-t relative shadow-sm items-center justify-center"
              style="clip-path: polygon(0% 0%, 100% 0%, 50% 100%); background: #f9a8d4"
            >
              <!-- Heart Seal -->
              <div class="absolute bottom-0 translate-y-1/3 drop-shadow-md">
                <iconify-icon
                  icon="solar:heart-bold"
                  class="text-pink-500 text-3xl filter drop-shadow-sm"
                ></iconify-icon>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Screen 2: The Flipbook -->
    <div
      id="view-flipbook"
      class="fixed inset-0 z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-1000 bg-pink-100"
    >
      <div
        class="absolute inset-0 pointer-events-none opacity-40"
        style="background-image: radial-gradient(#fecdd3 1.5px, transparent 1.5px); background-size: 24px 24px;"
      ></div>
      <div
        class="z-20 w-full max-w-5xl h-full flex items-center justify-center p-4"
      >
        <iframe
          allowfullscreen="allowfullscreen"
          allow="clipboard-write"
          scrolling="no"
          class="fp-iframe shadow-2xl rounded-xl border-4 border-white bg-white"
          src="https://heyzine.com/flip-book/402fbad60a.html"
          style="border: 0px; width: 100%; height: 482px;"
        ></iframe>
      </div>
    </div>

    <script>
      const envelope = document.querySelector('.envelope-wrapper');
      const btnYes = document.getElementById('btn-yes');
      const btnNo = document.getElementById('btn-no');
      const zone = document.getElementById('button-zone');

      // Envelope interaction
      if (envelope) {
        envelope.addEventListener('click', () => {
          if (!envelope.classList.contains('open')) {
            envelope.classList.add('open');
            setTimeout(() => {
              if (zone) {
                zone.classList.remove('opacity-0', 'pointer-events-none');
                zone.classList.add('opacity-100');
              }
            }, 3200);
          }
        });
      }

      // No button playful dodge behavior
      if (btnNo && zone) {
        const dodge = (e) => {
          // Move away from cursor and stay safe
          // Since YES button is to the left, we prefer moving right (positive X)
          // Range: 20px to 80px to the right
          const x = 20 + Math.random() * 60;
          // Range: -20px to 20px vertically to stay in letter bounds
          const y = (Math.random() * 40) - 20;

          btnNo.style.transition = 'transform 0.2s ease-out';
          btnNo.style.transform = `translate(${x}px, ${y}px)`;
        };

        btnNo.addEventListener('mouseover', dodge);
        btnNo.addEventListener('touchstart', dodge);
        btnNo.addEventListener('click', (e) => { e.preventDefault(); });
      }

      // Yes button interaction
      if (btnYes) {
        btnYes.addEventListener('click', (e) => {
          e.stopPropagation();
          const landing = document.getElementById('view-landing');
          const flipbook = document.getElementById('view-flipbook');

          // Fade out landing
          if (landing) {
            landing.style.transition = 'opacity 0.8s ease';
            landing.style.opacity = '0';
            landing.style.pointerEvents = 'none';
          }

          setTimeout(() => {
            if (landing) landing.style.display = 'none';
            if (flipbook) {
              flipbook.classList.remove('hidden');
              flipbook.classList.add('flex');
              // Fade in
              setTimeout(() => {
                flipbook.classList.remove('opacity-0');
              }, 50);
            }
          }, 800);
        });
      }
    </script>
  </body>
