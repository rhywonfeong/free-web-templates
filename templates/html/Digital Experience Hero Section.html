    <style>
        .hero-gradient {
            background: linear-gradient(-45deg, #60a5fa, #1a2a40, #2c4875, #60a5fa);
            background-size: 400% 400%;
            animation: gradient 20s ease infinite alternate;
        }
        
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes bounce-arrow {
            0%, 100% { transform: translateY(0); }

    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            new WOW({
                boxClass: 'wow',
                animateClass: 'animate__animated',
                offset: 50,
                mobile: true,
                live: true
            }).init();

            const header = document.getElementById('header');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 50) {
                    header.classList.add('py-2', 'shadow-md', 'backdrop-blur-md', 'bg-opacity-85');
                } else {
                    header.classList.remove('py-2', 'shadow-md', 'backdrop-blur-md', 'bg-opacity-85');
                }
            });

            window.scrollToNextSection = function() {
                console.log("Scroll indicator clicked");
            };
        });
    </script>
