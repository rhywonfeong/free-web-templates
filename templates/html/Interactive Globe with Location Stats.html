    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Location Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.globe.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">
    <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 w-full max-w-lg shadow-lg">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-gray-100 text-xl font-medium">Top Location</h2>
            <button class="text-gray-300 border border-gray-600 rounded-lg px-3 py-1.5 flex items-center space-x-2 hover:bg-gray-700 transition">
                <span class="text-sm">Filter</span>
                <i class="fas fa-filter text-sm"></i>
            </button>
        </div>
        
        <!-- Map Container -->
        <div class="relative h-72 border border-gray-700 rounded-lg overflow-hidden">
            <div id="globe-container" class="absolute inset-0"></div>
            
            <!-- Location Markers -->
            <div class="absolute top-1/4 left-1/4 transform -translate-x-1/2 -translate-y-1/2">
                <div class="w-6 h-6 bg-gray-800 rounded-full flex items-center justify-center border border-gray-600 shadow-md">
                    <div class="w-5 h-5 rounded-full overflow-hidden">
                        <div class="bg-blue-700 w-full h-2.5 relative"></div>
                        <div class="bg-red-600 w-full h-0.5"></div>
                        <div class="bg-white w-full h-0.5"></div>
                        <div class="bg-red-600 w-full h-0.5"></div>
                        <div class="bg-white w-full h-0.5"></div>
                        <div class="bg-red-600 w-full h-0.5"></div>
                    </div>
                </div>
            </div>
            
            <div class="absolute top-1/2 left-2/3 transform -translate-x-1/2 -translate-y-1/2">
                <div class="w-6 h-6 bg-gray-800 rounded-full flex items-center justify-center border border-gray-600 shadow-md">
                    <div class="w-5 h-5 rounded-full overflow-hidden">
                        <div class="bg-red-600 w-full h-1"></div>
                        <div class="bg-white w-full h-3"></div>
                        <div class="bg-blue-800 w-full h-1"></div>
                    </div>
                </div>
            </div>
            
            <div class="absolute top-3/4 left-3/4 transform -translate-x-1/2 -translate-y-1/2">
                <div class="w-6 h-6 bg-gray-800 rounded-full flex items-center justify-center border border-gray-600 shadow-md">
                    <div class="w-5 h-5 rounded-full overflow-hidden">
                        <div class="bg-red-600 w-full h-2.5"></div>
                        <div class="bg-white w-full h-2.5"></div>
                    </div>
                </div>
            </div>
            
            <div class="absolute top-1/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
                <div class="w-10 h-10 bg-gray-800 rounded-full flex items-center justify-center border border-amber-500 shadow-md">
                    <div class="w-6 h-6 bg-amber-500 rounded-full"></div>
                </div>
            </div>
        </div>
        
        <!-- Stats -->
        <div class="mt-6 grid grid-cols-3 gap-4">
            <div class="border border-gray-700 rounded-lg p-3 bg-gray-800">
                <p class="text-gray-400 text-sm">United States</p>
                <p class="text-gray-100 font-medium">30.4%</p>
            </div>
            <div class="border border-gray-700 rounded-lg p-3 bg-gray-800">
                <p class="text-gray-400 text-sm">Thailand</p>
                <p class="text-gray-100 font-medium">22.8%</p>
            </div>
            <div class="border border-gray-700 rounded-lg p-3 bg-gray-800">
                <p class="text-gray-400 text-sm">Indonesia</p>
                <p class="text-gray-100 font-medium">18.3%</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            VANTA.GLOBE({
                el: "#globe-container",
                mouseControls: true,
                touchControls: true,
                gyroControls: false,
                minHeight: 200.00,
                minWidth: 200.00,
                scale: 1.00,
                scaleMobile: 1.00,
                color: 0x4f46e5,
                color2: 0x1e293b,
                size: 1.0,
                backgroundColor: 0x1f2937
            });
        });
    </script>
</body>
</html>
