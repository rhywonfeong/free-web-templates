<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
background-color: #09090b;
background-image: radial-gradient(circle at 50% 0%, #18181b 0%, #09090b 70%);
background-attachment: fixed;
}
/* Remove arrows from number input */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
-webkit-appearance: none;
margin: 0;
}
input[type="number"] {
-moz-appearance: textfield;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 text-zinc-100 antialiased">







    <div class="w-full max-w-lg bg-zinc-900/80 backdrop-blur-xl border border-zinc-800/80 rounded-2xl shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Header -->
        <div class="px-6 py-5 border-b border-zinc-800/80 flex items-center justify-between">
            <div class="flex items-center gap-3.5">
                <div class="w-9 h-9 rounded-lg bg-zinc-100 text-zinc-950 flex items-center justify-center text-sm font-semibold tracking-tighter shadow-sm">
                    RG
                </div>
                <div>
                    <h1 class="text-xl font-semibold tracking-tight">Result Generator</h1>
                    <p class="text-xs text-zinc-500 mt-0.5">Calculate academic performance</p>
                </div>
            </div>
        </div>

        <!-- Body -->
        <div class="p-6 space-y-6">
            
            <div id="error-msg" class="hidden text-sm text-red-400 bg-red-500/10 px-4 py-3 rounded-xl border border-red-500/20 flex items-center gap-2">
                <iconify-icon icon="solar:danger-circle-linear" stroke-width="1.5" class="text-lg flex-shrink-0"></iconify-icon>
                <span id="error-text"></span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Subject Inputs generated by JS for cleaner HTML, but written directly as requested -->
                <div class="space-y-1.5">
                    <label for="sub1" class="text-xs font-medium text-zinc-400 ml-1">English</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-3 flex items-center text-zinc-500 pointer-events-none">
                            <iconify-icon icon="solar:document-text-linear" stroke-width="1.5"></iconify-icon>
                        </span>
                        <input type="number" id="sub1" min="0" max="100" class="w-full bg-zinc-950/50 border border-zinc-800 rounded-xl py-2.5 pl-9 pr-4 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all shadow-sm" placeholder="0 - 100">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="sub2" class="text-xs font-medium text-zinc-400 ml-1">Maths</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-3 flex items-center text-zinc-500 pointer-events-none">
                            <iconify-icon icon="solar:document-text-linear" stroke-width="1.5"></iconify-icon>
                        </span>
                        <input type="number" id="sub2" min="0" max="100" class="w-full bg-zinc-950/50 border border-zinc-800 rounded-xl py-2.5 pl-9 pr-4 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all shadow-sm" placeholder="0 - 100">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="sub3" class="text-xs font-medium text-zinc-400 ml-1">Science</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-3 flex items-center text-zinc-500 pointer-events-none">
                            <iconify-icon icon="solar:document-text-linear" stroke-width="1.5"></iconify-icon>
                        </span>
                        <input type="number" id="sub3" min="0" max="100" class="w-full bg-zinc-950/50 border border-zinc-800 rounded-xl py-2.5 pl-9 pr-4 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all shadow-sm" placeholder="0 - 100">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="sub4" class="text-xs font-medium text-zinc-400 ml-1">SST</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-3 flex items-center text-zinc-500 pointer-events-none">
                            <iconify-icon icon="solar:document-text-linear" stroke-width="1.5"></iconify-icon>
                        </span>
                        <input type="number" id="sub4" min="0" max="100" class="w-full bg-zinc-950/50 border border-zinc-800 rounded-xl py-2.5 pl-9 pr-4 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all shadow-sm" placeholder="0 - 100">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="sub5" class="text-xs font-medium text-zinc-400 ml-1">Gujarati</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-3 flex items-center text-zinc-500 pointer-events-none">
                            <iconify-icon icon="solar:document-text-linear" stroke-width="1.5"></iconify-icon>
                        </span>
                        <input type="number" id="sub5" min="0" max="100" class="w-full bg-zinc-950/50 border border-zinc-800 rounded-xl py-2.5 pl-9 pr-4 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all shadow-sm" placeholder="0 - 100">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="sub6" class="text-xs font-medium text-zinc-400 ml-1">Hindi / Sanskrit / IT</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-3 flex items-center text-zinc-500 pointer-events-none">
                            <iconify-icon icon="solar:document-text-linear" stroke-width="1.5"></iconify-icon>
                        </span>
                        <input type="number" id="sub6" min="0" max="100" class="w-full bg-zinc-950/50 border border-zinc-800 rounded-xl py-2.5 pl-9 pr-4 text-sm text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 transition-all shadow-sm" placeholder="0 - 100">
                    </div>
                </div>
            </div>

            <div class="flex gap-3 pt-2">
                <button onclick="calculate()" class="flex-1 bg-zinc-100 text-zinc-950 hover:bg-white text-sm font-semibold py-2.5 rounded-xl transition-all shadow-[0_0_15px_rgba(255,255,255,0.1)] flex justify-center items-center gap-2 active:scale-[0.98]">
                    <iconify-icon icon="solar:calculator-linear" stroke-width="1.5" class="text-lg"></iconify-icon> Calculate Result
                </button>
                <button onclick="resetForm()" class="px-5 bg-zinc-800/50 text-zinc-300 hover:text-white hover:bg-zinc-700/50 text-sm font-medium py-2.5 rounded-xl transition-all border border-zinc-700/50 flex items-center justify-center active:scale-[0.98]">
                    Reset
                </button>
            </div>

            <!-- Result Section -->
            <div id="result-area" class="hidden opacity-0 transition-opacity duration-700 ease-out space-y-6 pt-6 border-t border-zinc-800/80">
                
                <div class="flex justify-between items-end">
                    <div class="space-y-1.5">
                        <h3 class="text-xs text-zinc-400 font-medium uppercase tracking-wider">Final Status</h3>
                        <div id="status-badge" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium border">
                            <!-- JS will inject status -->
                        </div>
                    </div>
                    
                    <div class="text-right space-y-1">
                        <h3 class="text-xs text-zinc-400 font-medium uppercase tracking-wider">Obtained Marks</h3>
                        <p class="text-2xl font-semibold tracking-tight text-zinc-100 flex items-baseline justify-end gap-1">
                            <span id="obtained-marks">0</span>
                            <span class="text-sm text-zinc-500 font-normal">/ 600</span>
                        </p>
                    </div>
                </div>

                <div class="space-y-2.5 bg-zinc-950/50 p-4 rounded-xl border border-zinc-800/50">
                    <div class="flex justify-between items-baseline">
                        <span class="text-sm text-zinc-400 font-medium">Calculated Percentage</span>
                        <span id="percentage-text" class="text-lg font-semibold tracking-tight text-zinc-100">0.00%</span>
                    </div>
                    
                    <div class="h-1.5 w-full bg-zinc-800/80 rounded-full overflow-hidden">
                        <div id="progress-bar" class="h-full rounded-full transition-all duration-1000 ease-out w-0 relative">
                            <div class="absolute inset-0 bg-white/20"></div>
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-center text-xs text-zinc-500 pt-1">
                        <span>Formula applied:</span>
                        <code class="bg-zinc-800 px-1.5 py-0.5 rounded text-zinc-400">(Marks / 600) × 100</code>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const resultArea = document.getElementById('result-area');
            
            // Hide previous errors/results
            errorMsg.classList.add('hidden');
            
            let totalMarks = 0;
            let allPassed = true;
            let validationFailed = false;

            for (let i = 1; i <= 6; i++) {
                const inputVal = document.getElementById(`sub${i}`).value;
                
                // Check if empty
                if (inputVal === '') {
                    showError("All 6 subject marks are required.");
                    validationFailed = true;
                    break;
                }
                
                const marks = parseFloat(inputVal);
                
                // Check bounds
                if (isNaN(marks) || marks < 0 || marks > 100) {
                    showError(`Subject ${i} marks must be between 0 and 100.`);
                    validationFailed = true;
                    break;
                }

                totalMarks += marks;
                
                // Check pass condition (<33 is fail)
                if (marks < 33) {
                    allPassed = false;
                }
            }

            if (validationFailed) return;

            // Zero division check based on custom formula logic
            if (totalMarks === 0) {
                showError("Obtained marks cannot be zero (Division by zero error).");
                return;
            }

            // Calculations
            // Applied exact formula requested: Percentage = (600 / Obtained Marks) * 100
            const percentage = (totalMarks/600) * 100;
            
            // Update UI Elements
            document.getElementById('obtained-marks').innerText = totalMarks;
            document.getElementById('percentage-text').innerText = percentage.toFixed(2) + '%';
            
            const statusBadge = document.getElementById('status-badge');
            const progressBar = document.getElementById('progress-bar');
            
            if (allPassed) {
                statusBadge.innerHTML = '<iconify-icon icon="solar:check-circle-linear" class="text-base"></iconify-icon> Pass';
                statusBadge.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium border bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                progressBar.className = 'h-full rounded-full transition-all duration-1000 ease-out bg-emerald-500 relative';
            } else {
                statusBadge.innerHTML = '<iconify-icon icon="solar:close-circle-linear" class="text-base"></iconify-icon> Fail';
                statusBadge.className = 'inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium border bg-red-500/10 text-red-400 border-red-500/20';
                progressBar.className = 'h-full rounded-full transition-all duration-1000 ease-out bg-red-500 relative';
            }

            // Visual Progress bar width setup. 
            // Capping at 100% visually so the layout doesn't break if formula yields > 100%
            const visualWidth = Math.min(percentage, 100);
            
            // Reveal animation
            resultArea.classList.remove('hidden');
            
            // Reset width before animation frame to trigger transition
            progressBar.style.width = '0%';
            
            setTimeout(() => {
                resultArea.classList.remove('opacity-0');
                progressBar.style.width = visualWidth + '%';
            }, 50);
        }

        function showError(message) {
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const resultArea = document.getElementById('result-area');
            
            errorText.innerText = message;
            errorMsg.classList.remove('hidden');
            resultArea.classList.add('hidden');
            resultArea.classList.add('opacity-0');
        }

        function resetForm() {
            for (let i = 1; i <= 6; i++) {
                document.getElementById(`sub${i}`).value = '';
            }
            document.getElementById('error-msg').classList.add('hidden');
            const resultArea = document.getElementById('result-area');
            resultArea.classList.add('opacity-0');
            setTimeout(() => {
                resultArea.classList.add('hidden');
                document.getElementById('progress-bar').style.width = '0%';
            }, 300); // Wait for fade out
        }
    </script>

</body></html>
