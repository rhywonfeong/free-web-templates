  <meta charset="UTF-8">
  <title>Inverted Staggered Concentric Dots</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #fff; min-height: 100vh; }
    .circle-container {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: auto;
    }
    .dot {
      position: absolute;
      border-radius: 9999px;
      background: #111;
      width: 3px;
      height: 3px;
      opacity: 0.8;
      transform: scale(0.55);
      animation: expandContract 2.2s infinite cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes expandContract {
      0%,100% { transform: scale(0.50); opacity: 0.25; }
      18%     { transform: scale(1.2); opacity: 1; }
      65%     { transform: scale(1.2); opacity: 1; }
      85%     { transform: scale(0.50); opacity: 0.25; }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen">
  <div id="container" class="circle-container"></div>
  <script>
    const rings = 7;
    const radiusStep = 33;
    const center = document.createElement("div");
    center.className = "dot";
    center.style.width = center.style.height = "4px";
    center.style.left = "calc(50% - 2px)";
    center.style.top = "calc(50% - 2px)";
    center.style.opacity = "0.96";
    center.style.animationDelay = "0s";
    document.getElementById("container").appendChild(center);

    for(let r=0; r<rings; r++) {
      const radius = 28 + r * radiusStep;
      const dots = 31 + r * 5;
      for(let i=0; i<dots; i++) {
        const angle = (2 * Math.PI * i) / dots;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.style.left = `calc(50% + ${x}px - 1.5px)`;
        dot.style.top = `calc(50% + ${y}px - 1.5px)`;
        dot.style.opacity = `${0.56 - r*0.045}`;
        dot.style.animationDelay = `${(r * 0.13 + i * 0.08)%2.2}s`;
        document.getElementById("container").appendChild(dot);
      }
    }
  </script>
</body>
</html>
