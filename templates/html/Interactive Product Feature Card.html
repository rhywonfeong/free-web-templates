<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Feature Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --cardShadow: 0px 18px 36px -18px rgba(0, 0, 0, 0.1), 0px 30px 45px -30px rgba(50, 50, 93, 0.25);
      --cardBorderRadius: 8px;
      --cardBackground: #fff;
      --productFeatureCardBodyPadding: 24px;
      --productFeatureGraphicAspectRatio: 1.5;
      --productFeatureGraphicBackgroundColor: #f6f9fc;
      --productFeatureCardHoverDistance: -42px;
      --productFeatureCardGraphicHoverDistance: 30px;
      --productFeatureCardBodyPaddingBottom: 28px;
      --fontFamily: "sohne-var", "Helvetica Neue", "Arial", sans-serif;
      --fontWeightSemibold: 425;
      --titleColor: #0a2540;
      --textColor: #425466;
      --linkColor: #635bff;
      --linkHoverColor: #0a2540;
    }
    
    body {
      font-family: var(--fontFamily);
      color: #425466;
      font-weight: 300;
    }
    
    .Card {
      background: var(--cardBackground);
      border-radius: var(--cardBorderRadius);
      box-shadow: var(--cardShadow);
      min-height: 72px;
      overflow: hidden;
      position: relative;
    }
    
    .ProductFeatureCard {
      display: flex;
      flex-direction: column;
    }
    
    .ProductFeatureCard__graphic {
      aspect-ratio: var(--productFeatureGraphicAspectRatio);
      border-radius: 4px;
      margin: 4px 4px 0;
      overflow: hidden;
      position: relative;
    }
    
    .ProductFeatureCard__graphic::after {
      aspect-ratio: var(--productFeatureGraphicAspectRatio);
      background: var(--productFeatureGraphicBackgroundColor);
      border-radius: 4px;
      content: "";
      left: 0;
      position: absolute;
      top: 0;
      transition: transform 0.3s cubic-bezier(.33, 1, .68, 1);
      width: 100%;
      will-change: transform;
      z-index: 0;
    }
    
    .ProductFeatureCard__graphicLayer {
      aspect-ratio: var(--productFeatureGraphicAspectRatio);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s cubic-bezier(.33, 1, .68, 1);
      width: 100%;
      will-change: transform;
      z-index: 3;
    }
    
    .ProductFeatureCard__graphicWrapper {
      aspect-ratio: var(--productFeatureGraphicAspectRatio);
      left: 0;
      overflow: hidden;
      position: absolute;
      top: 0;
      transition: transform 0.3s cubic-bezier(.33, 1, .68, 1);
      width: 100%;
      will-change: transform;
      z-index: 3;
    }
    
    .ProductFeatureCard__graphicOverlay {
      aspect-ratio: var(--productFeatureGraphicAspectRatio);
      background-image: linear-gradient(rgba(190, 201, 220, 0), rgba(190, 201, 220, .4));
      border-bottom-left-radius: 4px;
      border-bottom-right-radius: 4px;
      left: 0;
      opacity: .3;
      position: absolute;
      top: 0;
      transition: transform 0.3s cubic-bezier(.33, 1, .68, 1);
      width: 100%;
      will-change: transform;
      z-index: 4;
    }
    
    .ProductFeatureCard__body {
      display: grid;
      gap: 8px;
      padding: var(--productFeatureCardBodyPadding) var(--productFeatureCardBodyPadding) var(--productFeatureCardBodyPaddingBottom);
      transition: transform 0.3s cubic-bezier(.33, 1, .68, 1);
      will-change: transform;
    }
    
    .ProductFeatureCard__cta {
      bottom: 0;
      left: var(--productFeatureCardBodyPadding);
      opacity: 0;
      position: absolute;
      right: var(--productFeatureCardBodyPadding);
      transition: transform 0.3s cubic-bezier(.33, 1, .68, 1), opacity 0.3s cubic-bezier(.33, 1, .68, 1);
      will-change: transform, opacity;
    }
    
    .Link {
      color: var(--linkColor);
      cursor: pointer;
      font-weight: var(--fontWeightSemibold);
      transition: color 0.15s cubic-bezier(.215, .61, .355, 1);
    }
    
    .Link:hover {
      color: var(--linkHoverColor);
    }
    
    .HoverArrow {
      fill: none;
      margin-left: 4px;
      position: relative;
      stroke: currentcolor;
      stroke-width: 2px;
      top: 1px;
    }
    
    .Copy__title {
      color: var(--titleColor);
      font-family: var(--fontFamily);
      font-size: 26px;
      font-weight: 500;
      line-height: 36px;
    }
    
    .Copy__body {
      color: var(--textColor);
      font-family: var(--fontFamily);
      font-size: 18px;
      font-weight: 300;
      line-height: 28px;
    }
    
    /* Hover effects */
    .ProductFeatureCard.Card:hover .ProductFeatureCard__body,
    .ProductFeatureCard.Card:hover .ProductFeatureCard__graphic::after {
      transform: translateY(var(--productFeatureCardHoverDistance));
    }
    
    .ProductFeatureCard.Card:hover .ProductFeatureCard__cta {
      opacity: 1;
      transform: translateY(-32px);
    }
    
    .ProductFeatureCard.Card:hover .ProductFeatureCard__graphicLayer {
      transform: translateY(var(--productFeatureCardHoverDistance));
    }
    
    .ProductFeatureCard.Card:hover .ProductFeatureCard__graphicWrapper {
      transform: translateY(var(--productFeatureCardGraphicHoverDistance));
    }
    
    .ProductFeatureCard.Card:hover .ProductFeatureCard__graphicOverlay {
      transform: translateY(var(--productFeatureCardHoverDistance));
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-8 flex items-center justify-center">
  <div class="max-w-md">
    <div class="ProductFeatureCard Card">
      <div class="ProductFeatureCard__graphic">
        <div class="ProductFeatureCard__graphic::after"></div>
        <div class="ProductFeatureCard__graphicLayer">
          <div class="ProductFeatureCard__graphicWrapper">
            <div class="LowCodeNoCode__preIntegratedDomGraphic DomGraphic h-full w-full">
              <img src="https://images.unsplash.com/photo-1561070791-2526d30994b5?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80" 
                   alt="Low-code interface" 
                   class="LowCodeNoCode__preIntegratedDomGraphic--image object-cover">
            </div>
          </div>
          <div class="ProductFeatureCard__graphicOverlay"></div>
        </div>
      </div>
      
      <div class="ProductFeatureCard__body">
        <div class="Copy__title">
          Build without limits
        </div>
        <div class="Copy__body">
          Create powerful integrations and workflows with our low-code tools that connect to your existing systems.
        </div>
      </div>
      
      <div class="ProductFeatureCard__cta">
        <a href="#" class="Link flex items-center">
          Learn more
          <svg class="HoverArrow" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2">
              <path class="HoverArrow__linePath" d="M0 5h7"></path>
              <path class="HoverArrow__tipPath" d="M1 1l4 4-4 4"></path>
            </g>
          </svg>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
