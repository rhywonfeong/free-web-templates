<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استعادة كلمة المرور</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'IBM Plex Sans Arabic', sans-serif;
}
@keyframes fadeInUp {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}
.animate-fade {
animation: fadeInUp 0.4s ease-out forwards;
}
@keyframes slideIn {
from { transform: translateY(100%); opacity: 0; }
to { transform: translateY(0); opacity: 1; }
}
.toast-enter {
animation: slideIn 0.3s ease-out forwards;
}
/* OTP Input hide arrows */
input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
-webkit-appearance: none;
margin: 0;
}
input[type=number] {
-moz-appearance: textfield;
}
</style><!-- aura-ga4-start -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2M6V79H761"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-2M6V79H761');
</script>
<!-- aura-ga4-end -->
</head>
<body class="bg-black text-neutral-300 min-h-screen flex flex-col antialiased selection:bg-neutral-800 selection:text-white relative overflow-hidden">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-6 left-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- Main Container -->
    <main class="flex-1 flex items-center justify-center p-4 relative z-10">
        
        <!-- Background Decoration (Subtle glow) -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg h-96 bg-neutral-900/40 blur-[100px] rounded-full pointer-events-none -z-10"></div>

        <!-- Card Container -->
        <div class="w-full max-w-sm relative">
            
            <!-- Step 1: Forgot Password -->
            <div id="step-1" class="animate-fade space-y-8">
                <!-- Header -->
                <div class="text-center space-y-4">
                    <div class="w-12 h-12 bg-[#0A0A0A] border border-neutral-800 rounded-xl mx-auto flex items-center justify-center shadow-sm">
                        <iconify-icon icon="solar:key-minimalistic-linear" width="24" class="text-white"></iconify-icon>
                    </div>
                    <div>
                        <h1 class="text-2xl font-semibold tracking-tight text-white mb-2">نسيت كلمة المرور؟</h1>
                        <p class="text-sm text-neutral-400 leading-relaxed">أدخل بريدك الإلكتروني المرتبط بحسابك وسنرسل لك رمزاً لإعادة تعيين كلمة المرور.</p>
                    </div>
                </div>
                
                <!-- Form -->
                <form onsubmit="showStep2(event)" class="space-y-5">
                    <div class="space-y-2">
                        <label class="block text-sm font-medium text-neutral-300">البريد الإلكتروني</label>
                        <input type="email" id="email-input" required placeholder="name@company.com" class="w-full bg-[#0A0A0A] border border-neutral-800 rounded-lg py-2.5 px-4 text-sm text-white placeholder:text-neutral-600 focus:border-neutral-500 focus:ring-1 focus:ring-neutral-500 outline-none transition-all text-left" dir="ltr">
                    </div>
                    
                    <button type="submit" class="w-full py-2.5 px-4 bg-white text-black text-sm font-medium rounded-lg hover:bg-neutral-200 transition-colors shadow-sm focus:ring-2 focus:ring-offset-2 focus:ring-offset-black focus:ring-white outline-none flex items-center justify-center gap-2">
                        إرسال رمز التحقق
                        <iconify-icon icon="solar:arrow-left-linear" width="18"></iconify-icon>
                    </button>
                </form>
                
                <!-- Footer link -->
                <div class="text-center">
                    <a href="#" class="text-sm text-neutral-500 hover:text-white transition-colors flex items-center justify-center gap-1.5 inline-flex outline-none focus:text-white">
                        <iconify-icon icon="solar:login-2-linear" width="16"></iconify-icon>
                        العودة لتسجيل الدخول
                    </a>
                </div>
            </div>

            <!-- Step 2: Reset Password (OTP) -->
            <div id="step-2" class="hidden space-y-8">
                <!-- Header -->
                <div class="text-center space-y-4">
                    <div class="w-12 h-12 bg-[#0A0A0A] border border-neutral-800 rounded-xl mx-auto flex items-center justify-center shadow-sm">
                        <iconify-icon icon="solar:password-minimalistic-linear" width="24" class="text-white"></iconify-icon>
                    </div>
                    <div>
                        <h1 class="text-2xl font-semibold tracking-tight text-white mb-2">تعيين كلمة المرور</h1>
                        <p class="text-sm text-neutral-400 leading-relaxed">أدخل رمز التحقق المكون من ٤ أرقام المرسل إلى <span id="display-email" class="text-neutral-200 font-medium" dir="ltr"></span></p>
                    </div>
                </div>
                
                <!-- Form -->
                <form onsubmit="resetPassword(event)" class="space-y-6">
                    
                    <!-- OTP Inputs -->
                    <div class="space-y-2" dir="ltr">
                        <label class="block text-sm font-medium text-neutral-300 text-right" dir="rtl">رمز التحقق</label>
                        <div class="flex items-center justify-between gap-3">
                            <input type="number" required maxlength="1" class="w-full h-14 text-center text-xl font-medium bg-[#0A0A0A] border border-neutral-800 rounded-lg text-white focus:border-neutral-500 focus:ring-1 focus:ring-neutral-500 outline-none transition-all otp-input">
                            <input type="number" required maxlength="1" class="w-full h-14 text-center text-xl font-medium bg-[#0A0A0A] border border-neutral-800 rounded-lg text-white focus:border-neutral-500 focus:ring-1 focus:ring-neutral-500 outline-none transition-all otp-input">
                            <input type="number" required maxlength="1" class="w-full h-14 text-center text-xl font-medium bg-[#0A0A0A] border border-neutral-800 rounded-lg text-white focus:border-neutral-500 focus:ring-1 focus:ring-neutral-500 outline-none transition-all otp-input">
                            <input type="number" required maxlength="1" class="w-full h-14 text-center text-xl font-medium bg-[#0A0A0A] border border-neutral-800 rounded-lg text-white focus:border-neutral-500 focus:ring-1 focus:ring-neutral-500 outline-none transition-all otp-input">
                        </div>
                    </div>

                    <!-- New Password -->
                    <div class="space-y-4">
                        <div class="space-y-2">
                            <label class="block text-sm font-medium text-neutral-300">كلمة المرور الجديدة</label>
                            <div class="relative">
                                <input type="password" required placeholder="••••••••" class="w-full bg-[#0A0A0A] border border-neutral-800 rounded-lg py-2.5 pl-10 pr-4 text-sm text-white placeholder:text-neutral-600 focus:border-neutral-500 focus:ring-1 focus:ring-neutral-500 outline-none transition-all text-left" dir="ltr">
                                <button type="button" class="absolute left-3 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-white transition-colors outline-none" onclick="togglePassword(this)">
                                    <iconify-icon icon="solar:eye-linear" width="18"></iconify-icon>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="w-full py-2.5 px-4 bg-white text-black text-sm font-medium rounded-lg hover:bg-neutral-200 transition-colors shadow-sm focus:ring-2 focus:ring-offset-2 focus:ring-offset-black focus:ring-white outline-none flex items-center justify-center gap-2">
                        تأكيد وتغيير كلمة المرور
                        <iconify-icon icon="solar:check-circle-linear" width="18"></iconify-icon>
                    </button>
                </form>
                
                <!-- Footer Links -->
                <div class="flex items-center justify-between text-sm">
                    <button type="button" class="text-neutral-500 hover:text-white transition-colors flex items-center gap-1.5 outline-none" onclick="showStep1()">
                        <iconify-icon icon="solar:arrow-right-linear" width="16"></iconify-icon>
                        تعديل البريد
                    </button>
                    <button type="button" id="resend-btn" class="text-neutral-400 hover:text-white transition-colors outline-none disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        إعادة إرسال <span id="timer" class="text-neutral-600 ml-0.5 font-medium" dir="ltr">00:59</span>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- JavaScript for Interactions -->
    <script>
        let timerInterval;

        // Form Transitions
        function showStep2(e) {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            document.getElementById('display-email').textContent = email;
            
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            
            step1.classList.remove('animate-fade');
            step1.style.opacity = '0';
            
            setTimeout(() => {
                step1.classList.add('hidden');
                step2.classList.remove('hidden');
                step2.classList.add('animate-fade');
                
                // Focus first OTP input
                setTimeout(() => document.querySelector('.otp-input').focus(), 100);
                startTimer();
            }, 200);
        }
        
        function showStep1() {
            const step1 = document.getElementById('step-1');
            const step2 = document.getElementById('step-2');
            
            step2.classList.remove('animate-fade');
            step2.style.opacity = '0';
            
            setTimeout(() => {
                step2.classList.add('hidden');
                step1.classList.remove('hidden');
                step1.style.opacity = '1';
                step1.classList.add('animate-fade');
                clearInterval(timerInterval);
            }, 200);
        }

        // OTP Input Logic
        const otpInputs = document.querySelectorAll('.otp-input');
        otpInputs.forEach((input, index) => {
            // Select content on focus
            input.addEventListener('focus', (e) => {
                e.target.select();
            });

            input.addEventListener('input', (e) => {
                // Ensure only 1 character
                if (e.target.value.length > 1) {
                    e.target.value = e.target.value.slice(0, 1);
                }
                // Move to next input
                if (e.target.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                // Move to previous input on backspace if current is empty
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                    otpInputs[index - 1].value = ''; // Optional: clear previous
                }
            });
        });

        // Toggle Password Visibility
        function togglePassword(btn) {
            const input = btn.previousElementSibling;
            const icon = btn.querySelector('iconify-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('icon', 'solar:eye-closed-linear');
            } else {
                input.type = 'password';
                icon.setAttribute('icon', 'solar:eye-linear');
            }
        }

        // Timer Logic
        function startTimer() {
            let timeLeft = 59;
            const timerEl = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');
            
            resendBtn.disabled = true;
            timerEl.textContent = `00:${timeLeft}`;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                if(timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerEl.textContent = '';
                    resendBtn.disabled = false;
                    return;
                }
                timerEl.textContent = `00:${timeLeft.toString().padStart(2, '0')}`;
            }, 1000);
        }

        // Submit Reset Form
        function resetPassword(e) {
            e.preventDefault();
            showToast('تم بنجاح', 'تم تغيير كلمة المرور الخاصة بك بنجاح.', 'success');
            // Reset form
            setTimeout(() => showStep1(), 2000);
        }

        // Toast Notification Function
        function showToast(title, message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-enter pointer-events-auto bg-[#111111] border border-neutral-800 shadow-xl rounded-lg p-4 w-80 flex items-start gap-3';
            
            let iconHtml = type === 'success' 
                ? `<div class="mt-0.5 text-emerald-500"><iconify-icon icon="solar:check-circle-linear" width="20"></iconify-icon></div>`
                : `<div class="mt-0.5 text-blue-500"><iconify-icon icon="solar:info-circle-linear" width="20"></iconify-icon></div>`;

            toast.innerHTML = `
                ${iconHtml}
                <div class="flex-1">
                    <h4 class="text-sm font-medium text-white">${title}</h4>
                    <p class="text-xs text-neutral-400 mt-0.5">${message}</p>
                </div>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>
</body>
</html>
