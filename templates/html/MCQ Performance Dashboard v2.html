<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Question Bank - MedQ Bank</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html { font-family: 'Inter', sans-serif; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Serif:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Inter&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Sidebar -->
  <aside class="hidden md:flex flex-col w-64 h-screen bg-white border-r border-gray-200 fixed top-0 left-0 z-30">
    <div class="h-20 flex items-center px-6 border-b border-gray-100">
      <span class="text-xl font-semibold tracking-tight text-gray-900">MedQ Bank</span>
    </div>
    <nav class="flex-1 pt-6">
      <ul class="space-y-2">
        <li>
          <a href="#" class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-50 rounded-lg">
            <svg class="lucide lucide-home w-5 h-5 mr-3 stroke-gray-500"></svg>
            Dashboard
          </a>
        </li>
        <li>
          <a href="#" class="flex items-center px-6 py-2 text-gray-900 bg-gray-100 rounded-lg font-semibold">
            <svg class="lucide lucide-book-open w-5 h-5 mr-3 stroke-gray-700"></svg>
            Question Banks
          </a>
        </li>
        <li>
          <a href="#" class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-50 rounded-lg">
            <svg class="lucide lucide-bar-chart w-5 h-5 mr-3 stroke-gray-500"></svg>
            Analytics
          </a>
        </li>
        <li>
          <a href="#" class="flex items-center px-6 py-2 text-gray-700 hover:bg-gray-50 rounded-lg">
            <svg class="lucide lucide-user w-5 h-5 mr-3 stroke-gray-500"></svg>
            Profile
          </a>
        </li>
      </ul>
    </nav>
    <div class="px-6 py-6 border-t border-gray-100">
      <button class="w-full flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition">
        <svg class="lucide lucide-play-circle w-5 h-5 stroke-white"></svg>
        Start New Quiz
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="md:pl64 flex flex-col min-h-screen">
    <!-- Header -->
    <header class="flex items-center justify-between px-6 py-6 border-b border-gray-200 bg-white">
      <div>
        <h1 class="text-2xl md:text-3xl font-semibold tracking-tight text-gray-900">Question Bank</h1>
        <p class="mt-1 text-gray-500 text-sm">Browse, search, and filter medical MCQ sets.</p>
      </div>
      <div class="flex items-center gap-4">
        <button class="relative">
          <svg class="lucide lucide-bell w-6 h-6 stroke-gray-500"></svg>
          <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-blue-600 ring-2 ring-white"></span>
        </button>
        <img src="https://images.unsplash.com/photo-1621619856624-42fd193a0661?w=2160&q=80" alt="Profile" class="w-9 h-9 rounded-full object-cover border border-gray-200">
      </div>
    </header>
    <!-- Filters and Search -->
    <section class="px-4 md:px-8 py-6">
      <div class="flex flex-col md:flex-row md:items-center gap-4">
        <!-- Search -->
        <div class="relative flex-1">
          <input type="text" placeholder="Search question banks..." class="w-full px-4 py-2.5 pl-10 bg-white border border-gray-200 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 font-medium transition">
          <svg class="lucide lucide-search w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none"></svg>
        </div>
        <!-- Filter Dropdowns -->
        <div class="flex gap-2">
          <div class="relative">
            <select class="appearance-none px-3 py-
