<!DOCTYPE html>
<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Experience</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.80/build/spline-viewer.js"></script>
<script src="https://unpkg.com/lucide@latest"></script></head>
<body class="bg-black text-white antialiased overflow-hidden">
  
  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 border-b border-white/10 bg-black/50 backdrop-blur-xl">
    <div class="mx-auto px-6 py-4 flex items-center justify-between">
      <div class="text-lg font-semibold tracking-tight">SPLINE3D</div>
      <nav class="hidden md:flex items-center gap-8">
        <a href="#" class="text-sm text-white/60 hover:text-white transition-colors">Experience</a>
        <a href="#" class="text-sm text-white/60 hover:text-white transition-colors">Gallery</a>
        <a href="#" class="text-sm text-white/60 hover:text-white transition-colors">About</a>
        <a href="#" class="text-sm text-white/60 hover:text-white transition-colors">Contact</a>
      </nav>
      <button class="md:hidden p-2 hover:bg-white/10 rounded-lg transition-colors">
        <i data-lucide="menu" style="width: 20px; height: 20px; stroke-width: 1.5;"></i>
      </button>
    </div>
  </header>

  <!-- 3D Canvas Container -->
  <spline-viewer url="https://prod.spline.design/h2u7Q0M5UvGmDAqa/scene.splinecode" class="fixed inset-0 w-full h-full"></spline-viewer>

  <!-- Overlay UI -->
  <div class="fixed inset-0 pointer-events-none z-10">
    <div class="absolute bottom-8 left-8 pointer-events-auto">
      <div class="bg-black/50 backdrop-blur-xl border border-white/10 rounded-xl p-6 max-w-md">
        <h1 class="text-3xl font-semibold tracking-tight mb-2">Interactive 3D Scene</h1>
        <p class="text-sm text-white/60 mb-4">Drag to rotate • Scroll to zoom • Explore the environment</p>
        <div class="flex items-center gap-3">
          <button class="px-4 py-2 bg-white text-black text-sm font-medium rounded-lg hover:bg-white/90 transition-colors">
            Explore More
          </button>
          <button class="p-2 border border-white/20 rounded-lg hover:bg-white/10 transition-colors">
            <i data-lucide="info" style="width: 20px; height: 20px; stroke-width: 1.5;"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Controls Info -->
    <div class="absolute top-24 right-8 pointer-events-auto">
      <div class="bg-black/50 backdrop-blur-xl border border-white/10 rounded-xl p-4 space-y-3">
        <div class="flex items-center gap-3 text-sm">
          <div class="p-2 bg-white/10 rounded-lg">
            <i data-lucide="mouse" style="width: 16px; height: 16px; stroke-width: 1.5;"></i>
          </div>
          <span class="text-white/60">Rotate View</span>
        </div>
        <div class="flex items-center gap-3 text-sm">
          <div class="p-2 bg-white/10 rounded-lg">
            <i data-lucide="move" style="width: 16px; height: 16px; stroke-width: 1.5;"></i>
          </div>
          <span class="text-white/60">Pan Scene</span>
        </div>
        <div class="flex items-center gap-3 text-sm">
          <div class="p-2 bg-white/10 rounded-lg">
            <i data-lucide="zoom-in" style="width: 16px; height: 16px; stroke-width: 1.5;"></i>
          </div>
          <span class="text-white/60">Zoom In/Out</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initialize Lucide icons
    lucide.createIcons();
  </script>

</body>
</html>
