  <meta charset="UTF-8">

  <style>
    body { background: #15151a; font-family: 'Inter', sans-serif; }
    .flower-canvas { background: transparent; }
    .custom-slider {

      background: linear-gradient(135deg, #6366f1 65%, #ec4899 100%);
      border-radius: 9999px;

      box-shadow: 0 2px 8px rgba(99,102,241,0.25);
      transition: background 0.3s, box-shadow 0.2s;
    }
    .custom-slider:active::-moz-range-thumb {
      box-shadow: 0 2px 12px #ec489980;
      background: linear-gradient(135deg, #ec4899 70%, #6366f1 100%);
    }
    .custom-slider::-ms-thumb {
      width: 1.5rem;
      height: 1.5rem;
      background: linear-gradient(135deg, #6366f1 65%, #ec4899 100%);
      border-radius: 9999px;
      border: 3px solid #fff;
      box-shadow: 0 2px 8px rgba(99,102,241,0.25);
      transition: background 0.3s, box-shadow 0.2s;
    }
    .custom-slider:active::-ms-thumb {
      box-shadow: 0 2px 12px #ec489980;
      background: linear-gradient(135deg, #ec4899 70%, #6366f1 100%);
    }
    .custom-slider::-webkit-slider-runnable-track {

      border-radius: 9999px;

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#16161f] to-[#23233a]">
  <div class="relative z-10 max-w-md w-full mx-auto p-8 rounded-2xl shadow-xl bg-gradient-to-br from-[#191922] to-[#24243e] border border-white/10">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-white tracking-tight">Gradient Flower Builder</h2>
    </div>
    <div class="flex flex-col items-center">
      <canvas id="flower" class="flower-canvas rounded-xl shadow-lg mb-6" width="320" height="320"></canvas>
      <form id="controls" class="w-full space-y-10 text-white/90">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold mb-1" for="petals">Petals</label>
            <input type="range" id="petals" min="4" max="24" value="10" class="custom-slider">
            <div class="text-xs text-slate-300 mt-1 flex justify-between">
              <span>4</span><span>24</span>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1" for="size">Petal Size</label>
            <input type="range" id="size" min="70" max="140" value="100" class="custom-slider">
            <div class="text-xs text-slate-300 mt-1 flex justify-between">
              <span>70</span><span>140</span>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold mb-1" for="innerColor">Inner Color</label>
            <input type="color" id="innerColor" value="#6366f1" class="w-full h-9 rounded-xl border-2 border-slate-600 bg-transparent cursor-pointer transition-all hover:border-indigo-400 p-0">
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1" for="outerColor">Outer Color</label>
            <input type="color" id="outerColor" value="#ec4899" class="w-full h-9 rounded-xl border-2 border-slate-600 bg-transparent cursor-pointer transition-all hover:border-pink-400 p-0">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1" for="rotation">Rotation</label>
          <input type="range" id="rotation" min="0" max="360" value="0" class="custom-slider">
          <div class="text-xs text-slate-300 mt-1 flex justify-between">
            <span>0°</span><span>360°</span>
          </div>
        </div>
      </form>
    </div>
    <div class="mt-8 text-xs text-center text-slate-500 flex items-center flex-col gap-2">
      <span>
        Made with <span class="text-pink-400">♥</span> by AI · 
        <a href="#" class="underline hover:text-indigo-400" id="download-png">Download PNG</a>
      </span>
      <button id="show-code" class="mt-2 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 rounded text-white font-medium text-xs shadow transition">
        Show Code
      </button>
    </div>

    <!-- Modal for SVG Code -->
    <div id="modal-bg" class="fixed inset-0 z-50 bg-black/60 hidden items-center justify-center">
      <div class="bg-[#23233a] rounded-xl shadow-2xl p-6 max-w-lg w-full mx-2 relative">
        <button id="close-modal" class="absolute top-2 right-3 text-white/60 hover:text-pink-400 text-2xl leading-none">&times;</button>
        <h3 class="text-lg font-semibold mb-4 text-indigo-200">Export SVG Code</h3>
        <textarea id="svg-code" class="w-full h-52 rounded-lg bg-[#1b1b2b] text-pink-200 p-3 font-mono text-xs resize-none border border-indigo-700 focus:outline-none" readonly></textarea>
        <button id="copy-code" class="mt-4 px-4 py-2 bg-pink-500 hover:bg-pink-600 rounded text-white font-semibold text-sm transition flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 inline-block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16h8M8 12h8m-7 8h6a2 2 0 002-2V8a2 2 0 00-2-2h-6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
          Copy to Clipboard
        </button>
        <p id="copy-feedback" class="mt-2 text-xs text-green-400 hidden">Copied!</p>
      </div>
    </div>
  </div>
  <script>
    // UI Elements
    const canvas = document.getElementById('flower');
    const ctx = canvas.getContext('2d');
    const controls = {
      petals: document.getElementById('petals'),
      size: document.getElementById('size'),
      innerColor: document.getElementById('innerColor'),
      outerColor: document.getElementById('outerColor'),
      rotation: document.getElementById('rotation')
    };

    function drawFlower(petals, size, innerColor, outerColor, rotation) {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.save();
      ctx.translate(canvas.width/2, canvas.height/2);
      ctx.rotate(rotation * Math.PI/180);

      // Petal gradient
      for (let i = 0; i < petals; i++) {
        ctx.save();
        ctx.rotate((2 * Math.PI * i) / petals);

        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.bezierCurveTo(
          size*0.3, -size*0.2,
          size*0.7, -size*0.5,
          0, -size
        );
        ctx.bezierCurveTo(
          -size*0.7, -size*0.5,
          -size*0.3, -size*0.2,
          0,0
        );
        ctx.closePath();

        // Gradient fill
        const grad = ctx.createLinearGradient(0, -size*0.7, 0, 0);
        grad.addColorStop(0, outerColor);
        grad.addColorStop(1, innerColor);
        ctx.fillStyle = grad;
        ctx.shadowColor = outerColor + '55';
        ctx.shadowBlur = 10;
        ctx.fill();

        ctx.restore();
      }

      // Center "core" gradient
      const coreGrad = ctx.createRadialGradient(0,0,0,0,0,size*0.23);
      coreGrad.addColorStop(0, innerColor);
      coreGrad.addColorStop(1, outerColor+'ee');
      ctx.beginPath();
      ctx.arc(0,0, size*0.23, 0, 2*Math.PI);
      ctx.closePath();
      ctx.shadowColor = outerColor + '33';
      ctx.shadowBlur = 22;
      ctx.fillStyle = coreGrad;
      ctx.fill();

      ctx.restore();
    }

    function updateFlower() {
      drawFlower(
        parseInt(controls.petals.value),
        parseInt(controls.size.value),
        controls.innerColor.value,
        controls.outerColor.value,
        parseInt(controls.rotation.value)
      );
    }

    Object.values(controls).forEach(input => {
      input.addEventListener('input', updateFlower);
    });

    updateFlower();

    // Download PNG
    document.getElementById('download-png').addEventListener('click', e => {
      e.preventDefault();
      const link = document.createElement('a');
      link.download = 'gradient-flower.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    // SVG Export logic
    function generateSVG(petals, size, innerColor, outerColor, rotation) {
      const cx = 160, cy = 160;
      let petalPath = '';
      let petalGradDefs = '';
      for (let i = 0; i < petals; i++) {
        const angle = (360 / petals) * i + rotation;
        const rad = angle * Math.PI / 180;
        // Petal coordinates
        // Move to center
        let d = `M${cx},${cy}`;
        // First control
        let x1 = cx + Math.cos(rad - 0.15) * (size * 0.3);
        let y1 = cy + Math.sin(rad - 0.15) * (size * 0.3);
        // Second control
        let x2 = cx + Math.cos(rad - 0.3) * (size * 0.7);
        let y2 = cy + Math.sin(rad - 0.3) * (size * 0.7);
        // Tip
        let x3 = cx + Math.cos(rad) * size;
        let y3 = cy + Math.sin(rad) * size;
        // Third control
        let x4 = cx + Math.cos(rad + 0.3) * (size * 0.7);
        let y4 = cy + Math.sin(rad + 0.3) * (size * 0.7);
        // Fourth control
        let x5 = cx + Math.cos(rad + 0.15) * (size * 0.3);
        let y5 = cy + Math.sin(rad + 0.15) * (size * 0.3);

        // Petal gradient id
        const gradId = `petal-grad-${i}`;
        petalGradDefs += `
        <linearGradient id="${gradId}" x1="${cx}" y1="${cy}" x2="${x3}" y2="${y3}">
          <stop offset="0%" stop-color="${innerColor}"/>
          <stop offset="100%" stop-color="${outerColor}"/>
        </linearGradient>
        `;
        d += ` C${x1},${y1} ${x2},${y2} ${x3},${y3}`;
        d += ` C${x4},${y4} ${x5},${y5} ${cx},${cy}`;
        petalPath += `<path d="${d}" fill="url(#${gradId})" fill-opacity="1"/>`;
      }
      // Center circle gradient
      const r = size * 0.23;
      const coreGradId = 'core-grad';
      const coreGradDef = `
        <radialGradient id="${coreGradId}" cx="50%" cy="50%" r="70%">
          <stop offset="0%" stop-color="${innerColor}" />
          <stop offset="100%" stop-color="${outerColor}" />
        </radialGradient>
      `;
      // SVG code
      return `<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    ${petalGradDefs}
    ${coreGradDef}
  </defs>
  ${petalPath}
  <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${coreGradId})"/>
</svg>`;
    }

    // Modal logic
    const modalBg = document.getElementById('modal-bg');
    const showCodeBtn = document.getElementById('show-code');
    const closeModalBtn = document.getElementById('close-modal');
    const svgCodeTextarea = document.getElementById('svg-code');
    const copyBtn = document.getElementById('copy-code');
    const copyFeedback = document.getElementById('copy-feedback');

    function updateSVGCode() {
      const petals = parseInt(controls.petals.value),
            size = parseInt(controls.size.value),
            innerColor = controls.innerColor.value,
            outerColor = controls.outerColor.value,
            rotation = parseInt(controls.rotation.value);
      const svg = generateSVG(petals, size, innerColor, outerColor, rotation);
      svgCodeTextarea.value = svg.trim();
    }

    showCodeBtn.addEventListener('click', () => {
      updateSVGCode();
      modalBg.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
    });

    closeModalBtn.addEventListener('click', () => {
      modalBg.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
      copyFeedback.classList.add('hidden');
    });

    modalBg.addEventListener('click', (e) => {
      if (e.target === modalBg) {
        modalBg.classList.add('hidden');
        document.body.classList.remove('overflow-hidden');
        copyFeedback.classList.add('hidden');
      }
    });

    copyBtn.addEventListener('click', () => {
      svgCodeTextarea.select();
      document.execCommand('copy');
      copyFeedback.classList.remove('hidden');
      setTimeout(() => copyFeedback.classList.add('hidden'), 1500);
    });

    // Keep SVG up to date when controls change and modal is open
    Object.values(controls).forEach(input => {
      input.addEventListener('input', () => {
        if (!modalBg.classList.contains('hidden')) updateSVGCode();
      });
    });
  </script>
</body>
