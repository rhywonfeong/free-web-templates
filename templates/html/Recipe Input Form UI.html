  <meta charset="UTF-8" />
  <meta name="viewport" content="width=430, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cook Book - Add Recipe</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>body{background:#f5f7fa;}</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f5f7fa] text-gray-800">
  <div class="relative w-[390px] max-w-full h-[844px] bg-gradient-to-b from-[#ffffff] to-[#f0f2f5] shadow-xl rounded-[40px] overflow-hidden border-4 border-[#e1e4e8] flex flex-col mx-auto">
    <!-- Notch -->
    <div class="absolute left-1/2 -top-1.5 -translate-x-1/2 z-10 flex items-center justify-center" style="height:44px;">
      <div class="w-24 h-4 bg-black/80 rounded-b-3xl mt-2"></div>
    </div>
    <div class="flex-1 flex flex-col">
      <!-- Status Bar -->
      <div class="flex justify-between items-center p-2 text-xs mt-2">
        <span id="clock">9:41</span>
        <div class="flex space-x-1">
          <i class="fas fa-signal"></i>
          <i class="fas fa-wifi"></i>
          <i class="fas fa-battery-three-quarters"></i>
        </div>
      </div>
      <!-- Header -->
      <header class="px-6 py-4">
        <div class="flex justify-between items-center">
          <div class="flex items-center">
            <button class="h-10 w-10 flex items-center justify-center rounded-full bg-[#eaecf0] mr-3">
              <i class="fas fa-arrow-left text-gray-500"></i>
            </button>
            <h1 class="text-2xl font-bold">Add Recipe</h1>
          </div>
          <button class="px-4 py-2 bg-orange-500 text-white rounded-xl text-sm">Save</button>
        </div>
      </header>
      
      <!-- Main Content -->
      <main class="px-4 pb-20 flex-1 overflow-y-auto hide-scrollbar">
        <!-- Upload Photo Section -->
        <div class="mb-6">
          <div class="bg-[#eaecf0] rounded-2xl h-48 flex flex-col items-center justify-center border-2 border-dashed border-gray-300">
            <div class="w-14 h-14 rounded-full bg-orange-100 flex items-center justify-center mb-2">
              <i class="fas fa-camera text-orange-500 text-xl"></i>
            </div>
            <p class="text-sm text-gray-500">Upload Recipe Photo</p>
            <p class="text-xs text-gray-400 mt-1">Tap to browse from gallery</p>
          </div>
        </div>
        
        <!-- Basic Info -->
        <div class="mb-6">
          <h3 class="font-bold mb-3">Basic Information</h3>
          <div class="space-y-4">
            <div>
              <label class="text-sm text-gray-500 mb-1 block">Recipe Name</label>
              <input type="text" placeholder="Enter recipe name" class="w-full bg-[#eaecf0] rounded-xl py-3 px-4 text-sm focus:outline-none border border-gray-200" />
            </div>
            
            <div>
              <label class="text-sm text-gray-500 mb-1 block">Description</label>
              <textarea placeholder="Briefly describe your recipe" class="w-full bg-[#eaecf0] rounded-xl py-3 px-4 text-sm focus:outline-none border border-gray-200 h-24 resize-none"></textarea>
            </div>
            
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-sm text-gray-500 mb-1 block">Prep Time</label>
                <div class="relative">
                  <input type="text" placeholder="15" class="w-full bg-[#eaecf0] rounded-xl py-3 px-4 text-sm focus:outline-none border border-gray-200" />
                  <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-gray-500">mins</span>
                </div>
              </div>
              <div>
                <label class="text-sm text-gray-500 mb-1 block">Cook Time</label>
                <div class="relative">
                  <input type="text" placeholder="30" class="w-full bg-[#eaecf0] rounded-xl py-3 px-4 text-sm focus:outline-none border border-gray-200" />
                  <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-gray-500">mins</span>
                </div>
              </div>
            </div>
            
            <div>
              <label class="text-sm text-gray-500 mb-1 block">Difficulty</label>
              <div class="flex space-x-2">
                <button class="flex-1 py-2 bg-orange-500 text-white rounded-xl text-sm">Easy</button>
                <button class="flex-1 py-2 bg-[#eaecf0] text-gray-600 rounded-xl text-sm">Medium</button>
                <button class="flex-1 py-2 bg-[#eaecf0] text-gray-600 rounded-xl text-sm">Hard</button>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Categories -->
        <div class="mb-6">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold">Categories</h3>
            <button class="text-xs text-orange-600">Add New</button>
          </div>
          <div class="flex flex-wrap gap-2">
            <div class="bg-orange-100 text-orange-600 text-sm px-3 py-1.5 rounded-full flex items-center">
              <span>Breakfast</span>
              <i class="fas fa-times ml-2 text-xs"></i>
            </div>
            <div class="bg-orange-100 text-orange-600 text-sm px-3 py-1.5 rounded-full flex items-center">
              <span>Healthy</span>
              <i class="fas fa-times ml-2 text-xs"></i>
            </div>
            <div class="bg-[#eaecf0] text-gray-600 text-sm px-3 py-1.5 rounded-full">
              + Add Category
            </div>
          </div>
        </div>
        
        <!-- Ingredients -->
        <div class="mb-6">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold">Ingredients</h3>
            <button class="text-xs text-orange-600">Add More</button>
          </div>
          <div class="space-y-3">
            <div class="bg-[#eaecf0] rounded-xl p-3 flex items-center border border-gray-200">
              <input type="text" value="2 large eggs" class="flex-1 bg-transparent focus:outline-none text-sm" />
              <button class="h-8 w-8 flex items-center justify-center rounded-full bg-white/60">
                <i class="fas fa-times text-gray-400 text-sm"></i>
              </button>
            </div>
            <div class="bg-[#eaecf0] rounded-xl p-3 flex items-center border border-gray-200">
              <input type="text" value="1 ripe avocado" class="flex-1 bg-transparent focus:outline-none text-sm" />
              <button class="h-8 w-8 flex items-center justify-center rounded-full bg-white/60">
                <i class="fas fa-times text-gray-400 text-sm"></i>
              </button>
            </div>
            <div class="bg-[#eaecf0] rounded-xl p-3 flex items-center border border-gray-200">
              <input type="text" value="2 slices of bread" class="flex-1 bg-transparent focus:outline-none text-sm" />
              <button class="h-8 w-8 flex items-center justify-center rounded-full bg-white/60">
                <i class="fas fa-times text-gray-400 text-sm"></i>
              </button>
            </div>
            <div class="bg-[#eaecf0] rounded-xl p-3 flex items-center border border-dashed border-gray-300">
              <input type="text" placeholder="Add ingredient" class="flex-1 bg-transparent focus:outline-none text-sm text-gray-400" />
              <button class="h-8 w-8 flex items-center justify-center rounded-full bg-orange-100">
                <i class="fas fa-plus text-orange-500 text-sm"></i>
              </button>
            </div>
          </div>
        </div>
        
        <!-- Instructions -->
        <div class="mb-6">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold">Instructions</h3>
            <button class="text-xs text-orange-600">Add Step</button>
          </div>
          <div class="space-y-3">
            <div class="bg-[#eaecf0] rounded-xl p-3 flex items-start border border-gray-200">
              <div class="w-6 h-6 rounded-full bg-orange-500 text-white flex items-center justify-center mt-1 mr-3 flex-shrink-0">
                <span class="text-xs">1</span>
              </div>
              <textarea class="flex-1 bg-transparent focus:outline-none text-sm resize-none h-16">Toast bread slices until golden brown.</textarea>
              <button class="h-8 w-8 flex items-center justify-center rounded-full bg-white/60 flex-shrink-0 mt-1">
                <i class="fas fa-times text-gray-400 text-sm"></i>
              </button>
            </div>
            <div class="bg-[#eaecf0] rounded-xl p-3 flex items-start border border-gray-200">
              <div class="w-6 h-6 rounded-full bg-orange-500 text-white flex items-center justify-center mt-1 mr-3 flex-shrink-0">
                <span class="text-xs">2</span>
              </div>
              <textarea class="flex-1 bg-transparent focus:outline-none text-sm resize-none h-16">Mash avocado and spread on toast.</textarea>
              <button class="h-8 w-8 flex items-center justify-center rounded-full bg-white/60 flex-shrink-0 mt-1">
                <i class="fas fa-times text-gray-400 text-sm"></i>
              </button>
            </div>
            <div class="bg-[#eaecf0] rounded-xl p-3 flex items-start border border-dashed border-gray-300">
              <div class="w-6 h-6 rounded-full bg-orange-100 text-orange-500 flex items-center justify-center mt-1 mr-3 flex-shrink-0">
                <span class="text-xs">3</span>
              </div>
              <textarea placeholder="Add step instructions" class="flex-1 bg-transparent focus:outline-none text-sm resize-none h-16 text-gray-400"></textarea>
              <button class="h-8 w-8 flex items-center justify-center rounded-full bg-orange-100 flex-shrink-0 mt-1">
                <i class="fas fa-plus text-orange-500 text-sm"></i>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script>
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>
  <style>
    .hide-scrollbar::-webkit-scrollbar { display:none;}
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none;}
  </style>
</body>
</html>
