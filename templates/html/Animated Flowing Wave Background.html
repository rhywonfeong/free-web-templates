  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Wave Paths</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes flowPath {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    .wave-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: flowPath 3s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      opacity: 0;
      animation: fadeIn 1s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
  <div class="relative min-h-screen w-full flex items-center justify-center overflow-hidden">
    <!-- Animated Background Paths -->
    <div class="absolute inset-0 pointer-events-none">
      <svg class="w-full h-full text-slate-800 dark:text-slate-200" viewBox="0 0 800 600" fill="none">
        <path class="wave-path" style="animation-delay: 0.1s" d="M-100 250C50 200 150 350 300 300C450 250 550 400 700 350" stroke="currentColor" stroke-opacity="0.1" stroke-width="2"></path>
        <path class="wave-path" style="animation-delay: 0.3s" d="M-100 270C50 220 150 370 300 320C450 270 550 420 700 370" stroke="currentColor" stroke-opacity="0.15" stroke-width="2.5"></path>
        <path class="wave-path" style="animation-delay: 0.5s" d="M-100 290C50 240 150 390 300 340C450 290 550 440 700 390" stroke="currentColor" stroke-opacity="0.2" stroke-width="3"></path>
        <path class="wave-path" style="animation-delay: 0.7s" d="M-100 310C50 260 150 410 300 360C450 310 550 460 700 410" stroke="currentColor" stroke-opacity="0.25" stroke-width="3.5"></path>
        <path class="wave-path" style="animation-delay: 0.9s" d="M-100 330C50 280 150 430 300 380C450 330 550 480 700 430" stroke="currentColor" stroke-opacity="0.3" stroke-width="4"></path>
      </svg>
    </div>

    <!-- Content -->
    <div class="relative z-10 container mx-auto px-6 text-center">
      <h1 class="fade-in text-5xl sm:text-7xl font-bold mb-8 tracking-tight text-slate-900 dark:text-white" style="animation-delay: 1.2s">
        Flowing <span class="text-blue-600 dark:text-blue-400">Waves</span>
      </h1>
      
      <p class="fade-in max-w-2xl mx-auto text-lg text-slate-700 dark:text-slate-300 mb-10" style="animation-delay: 1.5s">
        Experience the smooth animation of waves flowing from start to finish, creating an elegant visual rhythm.
      </p>
      
      <button class="fade-in group relative inline-flex items-center justify-center px-8 py-3 font-medium text-white bg-blue-600 dark:bg-blue-500 rounded-full overflow-hidden shadow-lg hover:bg-blue-700 dark:hover:bg-blue-600 transition-all duration-300" style="animation-delay: 1.8s">
        <span class="relative z-10">Get Started</span>
        <span class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></span>
      </button>
    </div>
    
    <!-- Theme Toggle -->
    <button id="themeToggle" class="fixed top-4 right-4 z-50 p-2 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-600 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
    </button>
  </div>

  <script>
    // Theme toggle
    document.getElementById('themeToggle').addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });
    
    // Restart animations on click
    document.addEventListener('click', () => {
      document.querySelectorAll('.wave-path').forEach(path => {
        path.style.animation = 'none';
        path.offsetHeight; // Trigger reflow
        path.style.animation = null;
      });
    });
  </script>
</body>
</html>
