<html lang="en">
<head>
<script>
try{if(window.parent&&window.parent!==window){window.parent.promotekit_referral="1fd2949a-d22c-431b-92bf-02d4ad04ee24";window.parent.document.cookie="promotekit_referral=1fd2949a-d22c-431b-92bf-02d4ad04ee24;path=/;domain=.aura.build;max-age=31536000"}}catch(e){}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Printable Habit Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
body {
font-family: 'Inter', sans-serif;
-webkit-print-color-adjust: exact;
print-color-adjust: exact;
}
@media print {
body {
background-color: white;
margin: 0;
padding: 0;
}
.page-container {
box-shadow: none;
margin: 0 auto;
width: 100%;
border: none;
}
/* Hide web-only elements if any */
.no-print { display: none; }
}
/* Ensure borders print crisply */
* {
border-color: #000 !important;
}
</style></head>
<body class="bg-neutral-100 flex justify-center py-10 min-h-screen text-black">

    <!-- A4 Container: 210mm x 297mm -->
    <!-- Using px approximation for screen (794px width is roughly A4 at 96dpi) but mm for print logic -->
    <div class="page-container bg-white w-[210mm] min-h-[297mm] mx-auto p-12 shadow-xl border border-neutral-200 flex flex-col relative box-border">
        
        <!-- HEADER -->
        <div class="flex flex-col items-center mb-8 relative">
            <!-- Left: Month Input -->
            <div class="absolute left-0 bottom-1 flex flex-col items-start">
                <div class="flex items-end gap-2">
                    <span class="text-xs font-bold uppercase tracking-widest">Month:</span>
                    <div class="w-32 border-b border-black h-4"></div>
                </div>
            </div>

            <!-- Center: Title -->
            <h1 class="text-2xl font-semibold tracking-tight uppercase">Getting 1% Better Each Day</h1>
            <h2 class="text-xs font-medium tracking-[0.3em] uppercase mt-1 text-neutral-600">31 Day Dashboard</h2>
        </div>

        <!-- SECTION 1: HABIT TRACKER TABLE -->
        <!-- Fixed layout to ensure equal cell sizes -->
        <div class="w-full mb-10">
            <table class="w-full border-collapse border border-black table-fixed">
                <thead>
                    <tr class="h-8">
                        <!-- Habit Label -->
                        <th class="border-r border-b border-black w-40 text-left pl-2 text-[10px] font-bold uppercase tracking-wider">Habit</th>
                        <!-- Days 1-31 -->
                        <script>
                            for(let i=1; i<=31; i++) {
                                document.write(`<th class="border-l border-b border-black text-[9px] font-medium text-center w-auto">${i}</th>`);
                            }
                        </script>
                    </tr>
                </thead>
                <tbody>
                    <!-- 12 Empty Rows -->
                    <script>
                        for(let row=0; row<12; row++) {
                            document.write(`<tr class="h-8">`);
                            // Name Cell
                            document.write(`<td class="border-r border-b border-black bg-transparent"></td>`);
                            // 31 Day Cells
                            for(let day=1; day<=31; day++) {
                                document.write(`<td class="border-l border-b border-black"></td>`);
                            }
                            document.write(`</tr>`);
                        }
                    </script>
                </tbody>
            </table>
        </div>

        <!-- SECTION 2: WORK HOURS & GRAPH -->
        <div class="flex-grow flex flex-col justify-end">
            
            <!-- Table: Work Hours Data -->
            <div class="w-full mb-6">
                <table class="w-full border-collapse border border-black table-fixed">
                    <!-- Row 1: Day Numbers -->
                    <tr class="h-6">
                        <td class="w-20 border-r border-b border-black bg-neutral-50 text-center text-[9px] font-bold uppercase tracking-wider">Day</td>
                        <script>
                            for(let i=1; i<=31; i++) {
                                document.write(`<td class="border-l border-b border-black text-center text-[8px] font-medium">${i}</td>`);
                            }
                        </script>
                    </tr>
                    <!-- Row 2: Empty Input Boxes -->
                    <tr class="h-8">
                        <td class="border-r border-black text-center text-[9px] font-bold uppercase tracking-wider">Hours</td>
                        <script>
                            for(let i=1; i<=31; i++) {
                                document.write(`<td class="border-l border-black"></td>`);
                            }
                        </script>
                    </tr>
                </table>
            </div>

            <!-- Graph Area -->
            <div class="w-full">
                <!-- Graph Title -->
                <div class="flex justify-between items-end mb-2">
                    <h3 class="text-xs font-bold uppercase tracking-widest">Work Hours Graph</h3>
                    <span class="text-[9px] text-neutral-500 uppercase tracking-wide">0h - 12h Scale</span>
                </div>

                <!-- Graph Box -->
                <div class="w-full h-48 border border-black flex">
                    
                    <!-- Y-Axis Labels Column -->
                    <div class="w-10 border-r border-black flex flex-col justify-between items-end py-0 pr-1 text-[8px] font-medium text-neutral-500 bg-neutral-50 relative">
                        <!-- Using absolute positioning to center label on the line -->
                        <span class="absolute top-0 -translate-y-1/2 right-1.5 bg-neutral-50 px-0.5">12h</span>
                        <span class="absolute top-[16.66%] -translate-y-1/2 right-1.5 bg-neutral-50 px-0.5">10h</span>
                        <span class="absolute top-[33.33%] -translate-y-1/2 right-1.5 bg-neutral-50 px-0.5">8h</span>
                        <span class="absolute top-[50%] -translate-y-1/2 right-1.5 bg-neutral-50 px-0.5">6h</span>
                        <span class="absolute top-[66.66%] -translate-y-1/2 right-1.5 bg-neutral-50 px-0.5">4h</span>
                        <span class="absolute top-[83.33%] -translate-y-1/2 right-1.5 bg-neutral-50 px-0.5">2h</span>
                        <span class="absolute bottom-0 translate-y-1/2 right-1.5 bg-neutral-50 px-0.5">0h</span>
                    </div>

                    <!-- Graph Grid -->
                    <div class="flex-1 relative">
                        
                        <!-- Horizontal Guidelines (0h, 2h, 4h, 6h, 8h, 10h, 12h) -->
                        <div class="absolute inset-0 flex flex-col justify-between pointer-events-none">
                            <div class="border-b border-neutral-300 w-full h-0"></div> <!-- 12h -->
                            <div class="border-b border-neutral-300 w-full h-0"></div> <!-- 10h -->
                            <div class="border-b border-neutral-300 w-full h-0"></div> <!-- 8h -->
                            <div class="border-b border-neutral-300 w-full h-0"></div> <!-- 6h -->
                            <div class="border-b border-neutral-300 w-full h-0"></div> <!-- 4h -->
                            <div class="border-b border-neutral-300 w-full h-0"></div> <!-- 2h -->
                            <div class="w-full h-0"></div> <!-- 0h (bottom border handles this) -->
                        </div>

                        <!-- Vertical Day Guides (Faint) -->
                        <div class="absolute inset-0 flex w-full h-full pointer-events-none">
                             <script>
                                for(let i=1; i<=31; i++) {
                                    document.write(`<div class="flex-1 border-r border-neutral-100 last:border-0 h-full"></div>`);
                                }
                            </script>
                        </div>
                        
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
