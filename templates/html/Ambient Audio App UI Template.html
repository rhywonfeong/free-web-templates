                <!-- Move Card -->

                    <div class="absolute inset-0 bg-gradient-to-br from-emerald-500/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <div class="w-10 h-10 rounded-full glass-button flex items-center justify-center group-hover:bg-white text-white group-hover:text-black transition-colors duration-300">

        <!-- VIEW 2: PLAYER -->
        <div id="player-view" class="view-hidden h-full flex flex-col justify-between p-6 pb-12 transition-all duration-500 z-20">
            
            <!-- Close / Back Button -->
            <div class="w-full flex justify-between items-center pt-20">
                <button onclick="closePlayer()" class="w-12 h-12 flex items-center justify-center rounded-full glass-button text-zinc-300 hover:text-white transition-colors">

                <div class="h-1 w-12 bg-white/10 rounded-full backdrop-blur-md">
                    <div id="progress-bar" class="h-full w-0 bg-white rounded-full transition-all duration-[1000ms]"></div>
                </div>
                <button class="w-12 h-12 flex items-center justify-center rounded-full glass-button text-zinc-300 hover:text-white transition-colors">

            <!-- Content -->
            <div class="flex flex-col items-center justify-center space-y-2 text-center mt-8 mix-blend-difference">
                <h1 id="player-title" class="text-6xl font-extralight tracking-tighter text-white capitalize blur-[0.5px]">Relax</h1>
                <p id="player-subtitle" class="text-xs text-zinc-400 font-semibold tracking-[0.3em] uppercase opacity-70">AI Soundscape</p>
            </div>

            <div class="flex-grow"></div>

            <!-- Controls -->
            <div class="glass-panel rounded-[2.5rem] p-6 pb-8 mx-2 mb-4 backdrop-blur-xl">
                <div class="flex flex-col items-center w-full space-y-8">
                    <!-- Play/Pause Control -->
                    <button id="play-btn" class="group relative flex items-center justify-center w-20 h-20 bg-white rounded-full text-black transition-all duration-500 hover:scale-105 active:scale-95 shadow-[0_0_50px_rgba(255,255,255,0.15)]">
                        <div class="absolute inset-0 bg-white rounded-full opacity-0 group-hover:opacity-100 blur-lg transition-opacity duration-500"></div>

                    <div class="flex justify-between w-full px-8">

                        <span class="text-[10px] tracking-widest text-zinc-600 font-mono pt-1">LIVE</span>

    <script>
        // --- Setup ---
        lucide.createIcons();
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const progressBar = document.getElementById('progress-bar');
        
        const dashboardView = document.getElementById('dashboard-view');
        const playerView = document.getElementById('player-view');
        const canvasEl = document.getElementById('generative-canvas');
        const playerTitle = document.getElementById('player-title');
        
        let isPlaying = false;
        let currentMode = 'relax'; 
        let animationId;

        // --- Simplex Noise Implementation (Simplified) ---
        // Used for organic liquid movement
        const SimplexNoise = (function() {
            var i, j, k;
            var A = [1.5, 2.5, 3.5]; 
            // Simple pseudo-random hash
            function dot(g, x, y) { return g[0]*x + g[1]*y; }
            function noise(x, y) {
                return Math.sin(x * 1.2 + Math.cos(y * 0.5)); // Fallback simplified noise for 1kb size constraint
            }
            return { noise2D: (x,y) => Math.sin(x) * Math.cos(y) + Math.sin(y*2)*0.5 };
        })();
        
        // Better noise helper
        function noise(t) {
            return Math.sin(t * 0.5) * Math.sin(t * 1.5) * Math.cos(t * 0.2);
        }

        // --- Audio Logic ---
        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                progressBar.style.width = '0%';
            } else {
                audio.play();
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                progressBar.style.width = '100%';
            }
            isPlaying = !isPlaying;
        }
        playBtn.addEventListener('click', toggleAudio);

        // --- View Switching ---
        function openPlayer(mode) {
            currentMode = mode;
            playerTitle.innerText = mode;
            
            // Dashboard -> Player
            dashboardView.classList.replace('view-active', 'view-hidden');
            playerView.classList.replace('view-hidden', 'view-active');
            
            // Dim canvas slightly for dashboard, full opacity for player is handled by global visual logic
            // But we keep visuals running on dashboard too for "live" feel
            
            if (!isPlaying) toggleAudio();
            initVisuals(mode);
        }

        function closePlayer() {
            playerView.classList.replace('view-active', 'view-hidden');
            dashboardView.classList.replace('view-hidden', 'view-active');
            
            if (isPlaying) toggleAudio();
            
            // Revert to calm visuals for dashboard background
            setTimeout(() => {
                initVisuals('dashboard');
            }, 500);
        }

        // --- ADVANCED GENERATIVE ENGINE ---
        const canvas = document.getElementById('generative-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let entities = [];
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if(!isPlaying && currentMode === 'relax') initVisuals('dashboard');
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. LIQUID BLOB (Relax) - Metaballs approach using gradients
        class LiquidBlob {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 200 + 100;
                this.colorBase = Math.random() > 0.5 ? 200 : 240; // Blue/White spectrum
            }
            draw(t) {
                this.x += this.vx + Math.sin(t * 0.001 + this.y * 0.01) * 0.5;
                this.y += this.vy + Math.cos(t * 0.001 + this.x * 0.01) * 0.5;

                // Bounce
                if(this.x < -100 || this.x > width + 100) this.vx *= -1;
                if(this.y < -100 || this.y > height + 100) this.vy *= -1;

                // Create a soft glowing gradient
                const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
                grad.addColorStop(0, `rgba(255, 255, 255, 0.15)`);
                grad.addColorStop(0.5, `rgba(${this.colorBase}, 255, 255, 0.05)`);
                grad.addColorStop(1, "rgba(0,0,0,0)");

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 2. FOCUS TUNNEL
        class FocusTunnel {
            constructor(i) {
                this.i = i;
                this.offset = i * 0.5;
            }
            draw(t) {
                const cx = width / 2;
                const cy = height / 2;
                // Breathing radius
                const r = (this.i * 60) + Math.sin(t * 0.002 - this.i * 0.2) * 20;
                
                ctx.strokeStyle = `rgba(255,255,255,${0.05 + Math.sin(t*0.001 + this.i)*0.03})`;
                ctx.lineWidth = 1.5;
                
                ctx.beginPath();
                // Distortion
                for(let a=0; a<Math.PI*2; a+=0.1) {
                    let dr = r + Math.sin(a * 5 + t * 0.005) * 5;
                    let x = cx + Math.cos(a) * dr;
                    let y = cy + Math.sin(a) * dr;
                    if(a===0) ctx.moveTo(x,y);
                    else ctx.lineTo(x,y);
                }
                ctx.closePath();
                ctx.stroke();
            }
        }

        // 3. SLEEP - BOREALIS (Flow Field)
        class BorealisStrand {
            constructor() {
                this.x = Math.random() * width;
                this.width = Math.random() * 100 + 50;
            }
            draw(t) {
                ctx.fillStyle = "rgba(255,255,255,0.02)";
                ctx.beginPath();
                ctx.moveTo(this.x, height);
                
                // Curve up
                for(let y = height; y > 0; y-=20) {
                    // Simplex-like noise movement
                    let noiseVal = Math.sin(y * 0.002 + t * 0.001 + this.x * 0.01);
                    ctx.lineTo(this.x + noiseVal * 100, y);
                }
                ctx.lineTo(this.x + 100, 0);
                ctx.lineTo(this.x + this.width, height);
                ctx.fill();
            }
        }

        // 4. MOVE - PARTICLES & WARP
        class WarpParticle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.z = Math.random() * 2 + 1; // Depth/Speed
                this.len = Math.random() * 50;
            }
            draw(t) {
                this.y -= this.z * 2; // Upward fast movement
                if (this.y < -50) this.reset();
                this.y = (this.y < 0) ? height : this.y;

                let alpha = (this.z / 3) * 0.5;
                ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
                ctx.lineWidth = this.z;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y + this.len * this.z);
                ctx.stroke();
            }
        }

        function initVisuals(mode) {
            entities = [];
            time = 0; // Reset time helps sync
            
            // Clear canvas style for fresh start
            if (mode === 'relax' || mode === 'dashboard') {
                for(let i=0; i<12; i++) entities.push(new LiquidBlob());
            } else if (mode === 'focus') {
                for(let i=1; i<15; i++) entities.push(new FocusTunnel(i));
            } else if (mode === 'sleep') {
                for(let i=0; i<20; i++) entities.push(new BorealisStrand());
            } else if (mode === 'move') {
                for(let i=0; i<80; i++) entities.push(new WarpParticle());
            }

            if (animationId) cancelAnimationFrame(animationId);
            animate(mode);
        }

        function animate(mode) {
            // Trail effects depending on mode
            if (mode === 'move') {
                 ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // Harder clear for sharp lines
                 ctx.fillRect(0, 0, width, height);
            } else if (mode === 'sleep') {
                 ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; // Very long trails
                 ctx.fillRect(0, 0, width, height);
            } else {
                // Liquid mixing (Lighter composite for "add" effect)
                ctx.clearRect(0, 0, width, height);
            }

            // Liquid Glass Blending Logic
            if (mode === 'relax' || mode === 'dashboard') {
                ctx.globalCompositeOperation = 'screen'; // Makes overlapping blobs glow
            } else {
                ctx.globalCompositeOperation = 'source-over';
            }

            time += 16; // Approx 60fps ms
            
            entities.forEach(e => e.draw(time));

            animationId = requestAnimationFrame(() => animate(mode));
        }

        // Start subtle background on load
        initVisuals('dashboard');

    </script>
