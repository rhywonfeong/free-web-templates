## Overall style
- Modern, soft SaaS dashboard aesthetic with rounded corners, airy spacing, and a light neutral background.
- Clean, friendly, slightly playful look driven by purple accents, avatar illustrations, and pill-shaped cards/buttons.
- Feels premium but approachable: minimal shadows, smooth surfaces, subtle borders, and lots of white space.

## Layout and hierarchy
- Full-page app shell with **3-column layout**:
  - **Left sidebar**: narrow vertical navigation panel.
  - **Main content**: widest center column.
  - **Right sidebar**: stacked stats and mentor widgets.
- Large outer container with very rounded corners and a soft gray page background.
- Top row in main area contains a **wide search bar** and right-aligned utility/profile actions.
- Main visual focus is a **large purple hero/banner card** near the top center.
- Below hero: a row of **3 compact progress cards**, then a **content card grid**, then a **table/list section**.
- Right sidebar stacks **Statistic card**, **bar chart card**, and **mentor list card** vertically.

## Key UI sections/components
- **Left sidebar**
  - Brand/logo at top: circular purple icon + wordmark.
  - Section labels in small uppercase/light gray text.
  - Nav items with simple outline icons and bold active state.
  - “Dashboard” is active with purple icon.
  - Friends list with small avatar circles and name/subtitle pairs.
  - Bottom settings/logout area separated by spacing.
- **Top header**
  - Long rounded search input with search icon and placeholder text.
  - Circular icon buttons for message and notifications.
  - Vertical divider before profile avatar and user name.
- **Hero/banner**
  - Large rounded rectangle with purple gradient background.
  - Small uppercase eyebrow text at top left.
  - Large white headline spanning multiple lines.
  - Dark rounded CTA button with white circular arrow segment.
  - Decorative star/sparkle shapes embedded in background.
- **Progress cards row**
  - Three compact white rounded cards with pastel circular icons.
  - Each card shows watched progress line and category title.
  - Small kebab menu on the right.
- **Continue Watching section**
  - Section title on left, circular previous/next controls on right.
  - Three wide course cards in a row.
  - Each card includes image thumbnail with rounded top corners and favorite heart overlay.
  - Small colored category pill under image.
  - Multi-line course title, thin progress line, then mentor avatar/name/meta.
- **Your Lesson section**
  - Title with “See all” link on right.
  - White rounded table-like card with column headers.
  - Single visible row containing mentor, date, type pill, description, and action icon.
- **Right sidebar**
  - **Statistic card**: title top left, kebab top right, circular progress ring around avatar, greeting headline, supporting text.
  - **Chart card**: pale panel containing 5 rounded vertical bars and labeled x-axis date ranges.
  - **Your mentor card**: title plus circular add button, stacked list rows with avatar, mentor info, and outlined Follow button, large “See All” button at bottom.

## Typography
- Sans-serif throughout, likely geometric/humanist style.
- Headings are bold with high legibility and tight line spacing.
- Body text is medium/light weight with muted gray tone.
- Small labels and section headers use lighter gray and sometimes uppercase.
- Main hero headline is large, white, and prominent.
- Buttons and nav labels use medium to semibold weight.

## Color and materials
- Base palette: **white**, **very light gray**, **soft lavender**, and **vivid purple**.
- Accent colors:
  - Purple for active states, buttons, chart bars, rings, links.
  - Pastel blue/pink/lilac tags and icon backgrounds.
  - Orange only appears on logout icon/text and a small flame emoji accent.
- Materials are flat-to-soft:
  - Mostly white cards on pale gray background.
  - Very subtle shadows or elevation.
  - Rounded borders everywhere, from inputs to cards to buttons.
- Purple gradient hero card adds visual energy without becoming dark.

## Imagery/illustration
- Uses cartoon-style illustrated avatars for users/mentors.
- Course cards use real photographic thumbnails with people working on laptops/desks.
- Background hero includes abstract sparkle/star graphics.
- Icons are simple line icons, monochrome or purple.

## Interaction cues
- Active nav item highlighted via purple icon/color emphasis.
- Search input and circular header icons suggest clickable controls.
- CTA button on hero is high contrast and clearly primary.
- Course cards show favorite heart overlay and thin progress indicators.
- Carousel arrows in circles imply horizontal content browsing.
- “Follow” buttons are rounded outlined pills.
- “See all” appears as a text link in one section and a large soft button in another.
- Kebab menus on several cards indicate more options.

## Constraints worth preserving
- Preserve the **three-column dashboard composition** with strong center content and supportive right rail.
- Keep **very rounded corners** across all major surfaces.
- Maintain the **purple-led brand palette** with white/light gray foundation.
- Retain the **large hero banner** as the main visual anchor.
- Keep spacing generous: wide gutters, comfortable padding inside cards, clear vertical rhythm between sections.
- Preserve the mix of **soft illustrated avatars + real imagery**.
- Keep the tone **friendly, elegant, and modern**, not corporate-heavy or overly dark.
