# Image Analysis: Reference Design

## Overall Style
- Modern, bold, geometric flat design
- Dark mode aesthetic with vibrant accent colors
- Playful yet professional, suited for presentation/cover slides
- 16:9 widescreen composition (PowerPoint slide format)

## Layout and Hierarchy
- Centered title block as primary focal point
- Subtitle/secondary label sits directly beneath title, smaller scale
- Decorative circular shapes anchor the four corners and edges, framing the center
- Generous negative space around the text; composition feels balanced and uncluttered
- Clear visual hierarchy: large title → small uppercase subtitle → ambient shapes

## Key Visual Components
- Large two-word display headline ("LOREM IPSUM") with two-tone coloring (first word green, second word white)
- Small uppercase tracked subtitle ("COMPANY NAME") centered below
- Decorative elements:
  - Large purple circle clipped at top edge
  - Large mint/green solid circle upper right with small gray circle overlay
  - Thin outlined teal circle behind the green one
  - Small solid teal dot mid-left
  - Large teal circle clipped at bottom-left corner
  - Dotted purple circular outline lower-center
  - Medium solid teal circle lower-right

## Typography
- Bold, geometric sans-serif (heavy weight, wide proportions, uppercase)
- Title: very large, tight letter spacing, ALL CAPS
- Subtitle: small, ALL CAPS, wide letter-spacing (tracked)
- Two-color word treatment to create emphasis/contrast

## Color and Materials
- Background: deep navy / near-black blue (~#0B1B33)
- Accent green/mint: ~#2BE0A8
- Accent purple: ~#8A5BD6
- Accent teal: ~#2AA9A6
- Neutral light gray: ~#D9DCDE
- White: #FFFFFF
- Flat fills, no gradients, no shadows, crisp vector edges

## Imagery/Illustration
- Purely abstract geometric circles (solid, outlined, dotted)
- Varying sizes and overlaps create depth without realism
- No photography, no icons, no illustrations of people/objects

## Interaction Cues
- None visible (static slide reference)

## Constraints Worth Preserving
- Dark navy background as dominant canvas
- Mint-green + purple + teal accent palette
- Bold uppercase geometric sans-serif headlines
- Two-tone word coloring for emphasis
- Circular/geometric decorative motifs framing content
- Wide 16:9 aspect ratio container ideal for displaying slide thumbnails
- Strong centered composition with ample breathing room
