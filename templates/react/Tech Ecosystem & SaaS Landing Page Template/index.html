# Design Reference: Astana Hub Portal Homepage (Russian-language)

## Overall style
- Modern tech-startup portal: clean white background, generous whitespace, rounded cards (~12–16px radius), soft shadows, green accent brand color.
- Long single-page scroll with sidebar navigation; light theme throughout except dark hero, dark news banners, and dark footer/CTA.

## Layout and hierarchy
- **Top bar**: white, full width. Left: "astana hub" logo (dark circular mark + wordmark). Center-left: pill search input "Поиск по порталу" with magnifier icon. Right: green filled button "Присоединиться" + outlined/ghost "Войти".
- **Left sidebar** (~220px, fixed-looking, white): vertical nav list with line icons; "Главная" active (light green pill highlight). Items: Комьюнити, Налоговые льготы, Программы, Hub Market (expanded with sub-items: Вакансии, Технологические задачи, Услуги и товары), Мероприятия, Онлайн курсы, Tech Orda, Customer Support, FAQ. Below: language selector pill "Русский" + settings toggle, small links "Связаться с нами", "Дополнительно".
- **Main content column** (~1000px) stacked sections with ~60–80px vertical spacing.

## Key UI sections/components
1. **Hero banner**: full-width rounded card with blurred greenish photo background. Large white headline "Join the Unicorn Game", two-line white subtext. Row of 4 frosted-glass role cards (Стартап, Корпорация, Инноватор, Tech Community), each with a 3D icon, title, short description, and translucent "Выбрать" button.
2. **Stats row**: 4 columns on white. Bold dark figures (+1800 компаний, ₸864 млрд., $630 млн., $612 млн.) with small gray captions.
3. **E-lab infrastructure banner**: slim horizontal blue/teal banner with lab imagery, partly covered by a **cookies consent bar**: white rounded card overlapping it; text about cookies, "Подробнее" link, green "Принять все" button.
4. **Популярные программы**: H2 + gray subtitle. 3-card grid: each card has small green pill badge "Идёт прием заявок", heart + share icons top-right, image thumbnail (dark with logo art), bold title, truncated gray description. Below: white pill button "Все программы".
5. **Последние новости**: H2. Large featured news card (dark purple "IT Quest" art with phone mockup), date/time meta, bold white headline overlay. Below: 2 smaller news cards (green Astana Innovations Accelerator image; AI'preneurs sunset image) with white headlines. "Все новости" pill button.
6. **Предстоящие мероприятия**: H2. 3 event cards: top meta row (calendar icon, date "11 Июн, 17:00", "Онлайн"/location badge, heart + share), event image thumbnail, bold title, truncated description. "Все мероприятия" pill button.
7. **Комьюнити и знания Astana Hub**: H2 + subtitle. Horizontal row of community chips (avatar + name + follower count): Управление продуктом, Управление проектами, Подкаст, Startup, GameDev. Below: 3 horizontal post cards — left image thumbnail (~340px wide), right: category tag (Маркетинг, Инвестиции, Участники Astana Hub), bold title, reaction counts (likes, comments, views with icons), author avatar + name + "22/23 часа назад", overflow "..." menu. "Смотреть все" pill button.
8. **CTA banner**: full-width dark green/black gradient rounded card: large white headline "Развивайте нетворкинг вместе с Astana Hub", green "Присоединиться" button; faint partner logos on right (playrix, MYTONA, arbuzz, etc.).
9. **Footer**: dark charcoal/black. Top: astana hub logo + "AI & DIGITAL MINISTRY" co-brand; phone "1818", email info@astanahub.com; green mobile-app card with QR code ("Мобильное приложение / Join the Unicorn Game"). Four link columns: Направления, Модули, Технопарк, Компания (one yellow-highlighted link "Стать участником"). Bottom row: copyright "© 2026, Автономный кластерный фонд «Астана Хаб»", legal links (Политика конфиденциальности, Пользовательское соглашение, F.A.Q., Политика Cookie), language pill bottom-right.

## Typography
- Sans-serif (Inter/SF-like). Hero headline very large bold (~40–48px). Section H2 bold ~24–28px dark. Card titles bold 16–18px. Body/meta 13–14px gray. Stats figures bold ~18px.

## Color and materials
- Background: white / very light gray (#FAFAFA-ish).
- Primary accent: green (#1AA958–#21A654 range) for buttons, badges, active nav.
- Text: near-black headings, mid-gray secondary.
- Dark surfaces: purple-navy news art, dark green-black CTA gradient, charcoal footer.
- Frosted glass (blur + translucency) on hero role cards and their buttons.
- Cards: white, subtle 1px light borders or soft shadows, 12–16px radii; pill buttons fully rounded.

## Imagery/illustration
- 3D rendered icons in hero (rocket, briefcase, atom, chip).
- Program/news/event thumbnails: branded graphics (Tech Orda logo, AI'preneurs, IT Quest with iPhone mockup, Baiterek tower photo, speaker photos, robot-hand image, Monix mascot, blue banner art).
- Footer QR code image; partner logo strip in CTA.

## Interaction cues
- Heart (favorite) and share icons on program/event cards.
- "..." overflow menus on community posts.
- Expandable sidebar item (Hub Market shows sub-links).
- Dismissible cookie banner with "Принять все" CTA.
- Language dropdown chevrons (sidebar and footer).
- Pill "view all" buttons after each section.

## Constraints worth preserving
- Sidebar + main-column layout with fixed top bar.
- 3-column grids for programs and events; 1 large + 2 small news layout.
- All text in Russian as shown; do not translate.
- Cookie bar overlaps the E-lab banner exactly as shown.

## Overview
The Astana Hub visual identity is defined by a sophisticated, "technopark" aesthetic that balances professional corporate utility with high-tech innovation cues. The site utilizes a high-density layout characterized by complex data presentation, grid-based content blocks, and a clear distinction between light and dark modes. The atmosphere is energetic yet structured, utilizing vibrant green accents to represent growth and a "Unicorn Game" theme that introduces gamification elements like XP bars and reward badges. Motion is used purposefully to indicate status, with subtle bounces and scale transformations on interactive elements.

## Typography
"Golos Text" is the sole typeface, providing a modern, geometric sans-serif feel that remains highly legible across varying densities. The hierarchy is steep: massive H1 headings create strong impact in hero sections, while body text and labels are kept compact (`0.875rem`) to accommodate the dense information architecture. Font weights are used strategically, with SemiBold (600) and Bold (700) reserved for navigation and headers to provide immediate scannability.

## Layout
The layout follows a structured, modular grid with a maximum container width of `1392px`. A sticky sidebar provides primary navigation on the left, while the main content area utilizes multi-column grids (1 to 3 columns) that collapse gracefully for mobile devices. Spacing rhythm is tight, favoring `1rem` (16px) gaps between related items and `2.5rem` (40px) between major sections. Card-based containers are used extensively to group related information and actions.

## Shapes
The visual language is softened by a consistent use of rounded corners. Standard components like buttons and cards use an `8px` or `12px` radius, while tags and category filters use a `full` pill shape. Hero sections and larger "Main News" blocks feature more aggressive rounding at `20px`. The use of pill shapes is a recurring motif for both taxonomy (categories) and status indicators.

## Components
- **Primary Button**: Medium height, high-contrast green background with white text, featuring a scale-active state.
- **Content Card**: A complex vertical container with an image header, pill-style category tags, and a masked description that fades at the bottom to indicate more content.
- **Pills/Tags**: Small, rounded-full elements with low-opacity backgrounds (`4%` mix) that match the text color for semantic categorization.
- **Gamification Badges**: Small icons with radial gradients and XP/Reward borders that appear as floating toasts or profile indicators.

## Accessibility
Contrast is strictly managed between surfaces and text, with a dedicated `text-strong` and `text-weak` hierarchy to guide focus. Interactive elements feature explicit `:focus` states with a 2px offset outline. Touch targets for mobile navigation and icon buttons are sized at a minimum of `32px` or `40px` to prevent mis-clicks. The interface supports a native dark/light theme switch that respects user system preferences, and layout shifts are minimized via explicitly defined aspect ratios on media containers.
