<div id="climate-system-root"
  class="relative w-full h-screen overflow-hidden bg-[#050505] font-sans text-white selection:bg-cyan-500/30"
  style="font-family: 'Inter', sans-serif;">
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- 3D Environment Layer --> <canvas id="bg-canvas-component" class="absolute inset-0 z-0"></canvas>
  <!-- Interactive UI Overlay -->
  <div class="relative z-10 flex min-h-screen w-full items-center justify-center py-16 px-4">
    <div class="relative z-10 flex h-full w-full items-center justify-center p-4">
      <div id="app-frame"
        class="relative w-[min(390px,88vw)] aspect-[390/844] overflow-hidden rounded-[3rem] bg-gradient-to-b from-white/15 to-white/5 p-[1px] shadow-[0_0_80px_-20px_rgba(0,0,0,0.8)] transition-transform duration-1000 scale-95">
        <div class="relative flex min-h-[760px] w-full flex-col overflow-hidden rounded-[3rem] bg-[#111318]">
          <!-- Navigation Header -->
          <header class="flex items-center justify-between px-6 pt-8 pb-4">
            <button class="flex h-10 w-10 items-center justify-center rounded-full border border-white/[0.05] bg-white/[0.03] text-white/70 transition-colors hover:bg-white/10"> <iconify-icon icon="solar:alt-arrow-left-linear" class="text-xl"></iconify-icon> </button>
            <h1 class="text-xl font-semibold tracking-tight text-white/90">Climate</h1>
            <button class="flex h-10 w-10 items-center justify-center rounded-full border border-white/[0.05] bg-white/[0.03] text-white/70 transition-colors hover:bg-white/10"> <iconify-icon icon="solar:settings-linear" class="text-xl"></iconify-icon> </button>
          </header> <!-- Status & Progress -->
          <div class="flex-1 overflow-y-auto no-scrollbar pb-32" style="scrollbar-width: none;">
            <div class="relative mx-auto mt-8 flex h-64 w-64 items-center justify-center">
              <div class="absolute inset-0 rounded-full bg-cyan-500/10 blur-3xl"></div> <svg viewBox="0 0 200 200"
                class="absolute inset-0 h-full w-full -rotate-90">
                <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="12" />
                <circle cx="100" cy="100" r="85" fill="none" stroke="#22d3ee" stroke-width="12" stroke-linecap="round"
                  stroke-dasharray="534" stroke-dashoffset="534">
                  <animate attributeName="stroke-dashoffset" from="534" to="180" dur="2s" fill="freeze"
                    calcMode="spline" keySplines="0.4 0 0.2 1" begin="0.2s" />
                </circle>
              </svg>
              <div
                class="relative z-10 flex h-[140px] w-[140px] flex-col items-center justify-center rounded-full border border-white/[0.02] bg-gradient-to-br from-[#1f222b] to-[#12141a] shadow-[inset_0_2px_10px_rgba(255,255,255,0.05),0_10px_30px_-10px_rgba(0,0,0,0.8)]">
                <div class="flex items-start"> <span class="text-4xl font-semibold tracking-tight text-white">20</span>
                  <span class="mt-1 text-lg font-medium text-white/50">°C</span>
                </div>
                <span class="mt-1 text-[0.65rem] font-medium uppercase tracking-widest text-white/40">Cooling</span>
              </div>
            </div> <!-- Modes Slider Section -->
            <div class="mt-12 space-y-7 px-8">
              <div class="flex items-center gap-5">
                <div class="flex w-20 flex-col gap-2"> <span class="text-xs font-medium text-white">Ac</span>
                  <button class="flex h-10 w-10 items-center justify-center rounded-full border border-cyan-500/30 bg-cyan-500/20 text-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.2)]"> <iconify-icon icon="solar:snowflake-linear" class="text-xl"></iconify-icon> </button>
                </div>
                <div class="relative h-1.5 flex-1 overflow-hidden rounded-full bg-white/5">
                  <div
                    class="absolute inset-y-0 left-0 w-[65%] rounded-full bg-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.8)]">
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-5">
                <div class="flex w-20 flex-col gap-2"> <span class="text-xs font-medium text-white/50">Fan</span>
                  <button class="flex h-10 w-10 items-center justify-center rounded-full border border-white/[0.05] bg-white/[0.03] text-white/40"> <iconify-icon icon="solar:wind-linear" class="text-xl"></iconify-icon> </button>
                </div>
                <div class="relative h-1.5 flex-1 rounded-full bg-white/5">
                  <div class="absolute inset-y-0 left-0 w-[30%] rounded-full bg-white/20"></div>
                </div>
              </div>
              <div class="flex items-center gap-5">
                <div class="flex w-20 flex-col gap-2"> <span class="text-xs font-medium text-white/50">Heat</span>
                  <button class="flex h-10 w-10 items-center justify-center rounded-full border border-white/[0.05] bg-white/[0.03] text-white/40"> <iconify-icon icon="solar:fire-linear" class="text-xl"></iconify-icon> </button>
                </div>
                <div class="relative h-1.5 flex-1 rounded-full bg-white/5">
                  <div class="absolute inset-y-0 left-0 w-[10%] rounded-full bg-white/20"></div>
                </div>
              </div>
            </div>
          </div> <!-- Control Dock -->
          <div class="absolute bottom-6 left-6 right-6 z-20">
            <div class="rounded-[2.5rem] bg-gradient-to-b from-white/[0.12] to-transparent p-[1px] shadow-2xl">
              <div
                class="flex items-center justify-between rounded-[2.5rem] bg-gradient-to-br from-[#1e2535]/90 to-[#0e121a]/90 px-6 py-4 backdrop-blur-2xl">
                <button class="group flex flex-col items-center gap-1.5"> <iconify-icon icon="solar:power-linear" class="text-[1.35rem] text-cyan-400 transition-transform group-active:scale-90"></iconify-icon> <span class="text-[0.6rem] font-medium text-white/70">On</span> </button>
                <div class="flex items-center gap-5 rounded-full border border-white/5 bg-black/20 px-4 py-1.5">
                  <button class="text-white/40 hover:text-white"> <iconify-icon icon="solar:alt-arrow-left-linear" class="text-lg"></iconify-icon> </button>
                  <span class="text-xl font-medium tracking-tight text-white">20°</span>
                  <button class="text-white/40 hover:text-white"> <iconify-icon icon="solar:alt-arrow-right-linear" class="text-lg"></iconify-icon> </button>
                </div>
                <button class="group flex flex-col items-center gap-1.5"> <iconify-icon icon="solar:window-frame-linear" class="text-[1.35rem] text-white/50 transition-colors group-hover:text-white"></iconify-icon> <span class="text-[0.6rem] font-medium text-white/50">Vent</span> </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function() { const canvas = document.getElementById('bg-canvas-component'); const appFrame = document.getElementById('app-frame'); const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x050505, 0.04); const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100); const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); const world = new THREE.Group(); scene.add(world); const grid = new THREE.GridHelper(100, 80, 0x22d3ee, 0x111111); grid.position.y = -3; grid.material.opacity = 0.15; grid.material.transparent = true; world.add(grid); const boxGeo = new THREE.BoxGeometry(1, 1, 1); const boxMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee, wireframe: true, transparent: true, opacity: 0.1 }); for (let i = 0; i < 25; i++) { const mesh = new THREE.Mesh(boxGeo, boxMat); mesh.position.set((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 15, (Math.random() - 0.5) * 40); mesh.scale.setScalar(Math.random() * 3 + 1); world.add(mesh); } let targetZ = 18, currentZ = 20, targetY = 6, currentY = 8; camera.position.set(0, currentY, currentZ); const observer = new IntersectionObserver((entries) => { entries.forEach(e => { if (e.isIntersecting) { targetZ = 12; targetY = 3; appFrame.style.transform = 'scale(1)'; } else { targetZ = 20; targetY = 8; appFrame.style.transform = 'scale(0.95)'; } }); }, { threshold: 0.1 }); observer.observe(appFrame); function animate() { requestAnimationFrame(animate); world.rotation.y += 0.002; currentZ += (targetZ - currentZ) * 0.05; currentY += (targetY - currentY) * 0.05; camera.position.set(0, currentY, currentZ); camera.lookAt(0, 0, 0); renderer.render(scene, camera); } animate(); window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }); })(); 
    </script>
  </div>
