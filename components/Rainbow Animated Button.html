<div class="flex items-center justify-center">

}
@keyframes rainbow {

}
.animate-rainbow {

}
.rainbow-button {

display: inline-flex;

linear-gradient(#121213 50%, rgba(18,18,19,0.6) 80%, rgba(18,18,19,0)) border-box,
linear-gradient(90deg,
hsl(var(--color-1)),
hsl(var(--color-5)),
hsl(var(--color-3)),
hsl(var(--color-4)),
hsl(var(--color-2))
) border-box;
