<section
    class="min-h-screen bg-[#FAFAFA] text-gray-900 flex items-center justify-center p-4 sm:p-12 antialiased overflow-x-hidden"
    style="font-family: 'Inter', sans-serif;">
    <div class="fixed inset-0 z-0 pointer-events-none mix-blend-multiply opacity-[0.03]"
        style="background-image: repeating-linear-gradient(45deg, #000 0px, #000 1px, transparent 1px, transparent 12px);">
    </div>

    <div
        class="fixed inset-0 z-0 pointer-events-none flex justify-evenly w-full max-w-7xl mx-auto px-4 sm:px-8 opacity-60">
        <div class="w-px h-full bg-gray-200 relative">
            <div class="absolute top-12 -left-[2px] w-[5px] h-[5px] bg-[#FAFAFA] border border-gray-300"></div>
            <div class="absolute bottom-12 -left-[2px] w-[5px] h-[5px] bg-[#FAFAFA] border border-gray-300"></div>
        </div>
        <div class="w-px h-full bg-gray-200 relative hidden md:block">
            <div class="absolute top-12 -left-[2px] w-[5px] h-[5px] bg-[#FAFAFA] border border-gray-300"></div>
            <div class="absolute bottom-12 -left-[2px] w-[5px] h-[5px] bg-[#FAFAFA] border border-gray-300"></div>
        </div>
        <div class="w-px h-full bg-gray-200 relative hidden lg:block">
            <div class="absolute top-12 -left-[2px] w-[5px] h-[5px] bg-[#FAFAFA] border border-gray-300"></div>
            <div class="absolute bottom-12 -left-[2px] w-[5px] h-[5px] bg-[#FAFAFA] border border-gray-300"></div>
        </div>
        <div class="w-px h-full bg-gray-200 relative">
            <div class="absolute top-12 -left-[2px] w-[5px] h-[5px] bg-[#FAFAFA] border border-gray-300"></div>
            <div class="absolute bottom-12 -left-[2px] w-[5px] h-[5px] bg-[#FAFAFA] border border-gray-300"></div>
        </div>
    </div>

    <main class="relative z-10 w-full max-w-5xl bg-white border border-gray-200 shadow-sm flex flex-col mx-auto my-8">

        <!-- Corner L-Brackets -->
        <div
            class="absolute top-0 left-0 w-4 h-4 border-t border-l border-gray-400 pointer-events-none -translate-x-[1px] -translate-y-[1px] z-20">
        </div>
        <div
            class="absolute top-0 right-0 w-4 h-4 border-t border-r border-gray-400 pointer-events-none translate-x-[1px] -translate-y-[1px] z-20">
        </div>
        <div
            class="absolute bottom-0 left-0 w-4 h-4 border-b border-l border-gray-400 pointer-events-none -translate-x-[1px] translate-y-[1px] z-20">
        </div>
        <div
            class="absolute bottom-0 right-0 w-4 h-4 border-b border-r border-gray-400 pointer-events-none translate-x-[1px] translate-y-[1px] z-20">
        </div>

        <!-- Section Header -->
        <header class="p-8 sm:p-10 border-b border-gray-200 gs-reveal relative overflow-hidden bg-white">
            <div class="absolute inset-0 pointer-events-none"
                style="background: linear-gradient(135deg, rgba(249,250,251,0.8), transparent);"></div>
            <div class="relative z-10">
                <h1 class="text-3xl sm:text-4xl font-medium tracking-tight text-gray-900 mb-2">Platform Metrics</h1>
                <p class="text-sm text-gray-500 font-normal">Live operational data and performance insights across all
                    connected regions.</p>
            </div>
        </header>

        <!-- Structured 1px Boundary Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-px bg-gray-100">

            <!-- Card 1: Active Sessions -->
            <article
                class="relative bg-white p-8 gs-reveal group hover:bg-gray-50/40 transition-colors duration-500 flex flex-col justify-between min-h-[220px]">
                <div class="flex items-start justify-between mb-8">
                    <!-- Border Gradient Container -->
                    <div
                        class="relative w-10 h-10 rounded-lg flex items-center justify-center bg-gray-50 group-hover:-translate-y-0.5 transition-transform duration-500">
                        <div class="absolute inset-0 rounded-lg border border-transparent pointer-events-none"
                            style="background: linear-gradient(135deg, #d1d5db, #f3f4f6) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;">
                        </div>
                        <iconify-icon icon="solar:users-group-two-rounded-linear" class="text-xl text-gray-700"
                            style="stroke-width: 1.5;"></iconify-icon>
                    </div>
                    <span class="text-xs font-normal text-emerald-700 bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-200/50">+14%</span>
                </div>
                <div>
                    <h2 class="text-4xl font-medium tracking-tight text-gray-900 mb-2">4.2k</h2>
                    <p class="text-xs font-normal uppercase tracking-widest text-gray-500">Active Sessions</p>
                </div>
            </article>

            <!-- Card 2: Connected Apps -->
            <article
                class="relative bg-white p-8 gs-reveal group hover:bg-gray-50/40 transition-colors duration-500 flex flex-col justify-between min-h-[220px]">
                <div class="flex items-start justify-between mb-8">
                    <div
                        class="relative w-10 h-10 rounded-lg flex items-center justify-center bg-gray-50 group-hover:-translate-y-0.5 transition-transform duration-500">
                        <div class="absolute inset-0 rounded-lg border border-transparent pointer-events-none"
                            style="background: linear-gradient(135deg, #d1d5db, #f3f4f6) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;">
                        </div>
                        <iconify-icon icon="solar:plug-circle-linear" class="text-xl text-gray-700"
                            style="stroke-width: 1.5;"></iconify-icon>
                    </div>
                </div>
                <div>
                    <h2 class="text-4xl font-medium tracking-tight text-gray-900 mb-2">210+</h2>
                    <p class="text-xs font-normal uppercase tracking-widest text-gray-500">Connected Apps</p>
                </div>
            </article>

            <!-- Card 3: System Reliability -->
            <article
                class="relative bg-white p-8 gs-reveal group hover:bg-gray-50/40 transition-colors duration-500 flex flex-col justify-between min-h-[220px]">
                <div class="flex items-start justify-between mb-8">
                    <div
                        class="relative w-10 h-10 rounded-lg flex items-center justify-center bg-gray-50 group-hover:-translate-y-0.5 transition-transform duration-500">
                        <div class="absolute inset-0 rounded-lg border border-transparent pointer-events-none"
                            style="background: linear-gradient(135deg, #d1d5db, #f3f4f6) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;">
                        </div>
                        <iconify-icon icon="solar:shield-check-linear" class="text-xl text-gray-700"
                            style="stroke-width: 1.5;"></iconify-icon>
                    </div>
                </div>
                <div>
                    <div class="flex items-baseline gap-1 mb-2">
                        <h2 class="text-4xl font-medium tracking-tight text-gray-900">99.99</h2>
                        <span class="text-lg font-medium text-gray-500">%</span>
                    </div>
                    <p class="text-xs font-normal uppercase tracking-widest text-gray-500">System Reliability</p>
                </div>
            </article>

            <!-- Card 4: Data Centers -->
            <article
                class="relative bg-white p-8 gs-reveal group hover:bg-gray-50/40 transition-colors duration-500 flex flex-col justify-between min-h-[220px]">
                <div class="flex items-start justify-between mb-8">
                    <div
                        class="relative w-10 h-10 rounded-lg flex items-center justify-center bg-gray-50 group-hover:-translate-y-0.5 transition-transform duration-500">
                        <div class="absolute inset-0 rounded-lg border border-transparent pointer-events-none"
                            style="background: linear-gradient(135deg, #d1d5db, #f3f4f6) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;">
                        </div>
                        <iconify-icon icon="solar:server-square-linear" class="text-xl text-gray-700"
                            style="stroke-width: 1.5;"></iconify-icon>
                    </div>
                </div>
                <div>
                    <h2 class="text-4xl font-medium tracking-tight text-gray-900 mb-2">6</h2>
                    <p class="text-xs font-normal uppercase tracking-widest text-gray-500">Data Centers</p>
                </div>
            </article>

            <!-- Card 5: Network Ping -->
            <article
                class="relative bg-white p-8 gs-reveal group hover:bg-gray-50/40 transition-colors duration-500 flex flex-col justify-between min-h-[220px]">
                <div class="flex items-start justify-between mb-8">
                    <div
                        class="relative w-10 h-10 rounded-lg flex items-center justify-center bg-gray-50 group-hover:-translate-y-0.5 transition-transform duration-500">
                        <div class="absolute inset-0 rounded-lg border border-transparent pointer-events-none"
                            style="background: linear-gradient(135deg, #d1d5db, #f3f4f6) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;">
                        </div>
                        <iconify-icon icon="solar:bolt-linear" class="text-xl text-gray-700"
                            style="stroke-width: 1.5;"></iconify-icon>
                    </div>
                </div>
                <div>
                    <div class="flex items-baseline gap-1 mb-2">
                        <h2 class="text-4xl font-medium tracking-tight text-gray-900">8</h2>
                        <span class="text-lg font-medium text-gray-500">ms</span>
                    </div>
                    <p class="text-xs font-normal uppercase tracking-widest text-gray-500">Network Ping</p>
                </div>
            </article>

            <!-- Card 6: Compliance Tiers -->
            <article
                class="relative bg-white p-8 gs-reveal group hover:bg-gray-50/40 transition-colors duration-500 flex flex-col justify-between min-h-[220px]">
                <div class="flex items-start justify-between mb-8">
                    <div
                        class="relative w-10 h-10 rounded-lg flex items-center justify-center bg-gray-50 group-hover:-translate-y-0.5 transition-transform duration-500">
                        <div class="absolute inset-0 rounded-lg border border-transparent pointer-events-none"
                            style="background: linear-gradient(135deg, #d1d5db, #f3f4f6) border-box; -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0); -webkit-mask-composite: xor; mask-composite: exclude;">
                        </div>
                        <iconify-icon icon="solar:document-medicine-linear" class="text-xl text-gray-700"
                            style="stroke-width: 1.5;"></iconify-icon>
                    </div>
                </div>
                <div>
                    <h2 class="text-4xl font-medium tracking-tight text-gray-900 mb-2">7</h2>
                    <p class="text-xs font-normal uppercase tracking-widest text-gray-500">Compliance Tiers</p>
                </div>
            </article>

        </div>
    </main>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        // --- GSAP Animations ---
        gsap.registerPlugin(ScrollTrigger);

        // Main timeline for structured entrance
        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: "main",
                start: "top 85%",
                toggleActions: "play none none reverse"
            }
        });

        // Header reveal
        tl.fromTo("header.gs-reveal", 
            { y: 15, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }
        )
        // Staggered grid cards
        .fromTo("article.gs-reveal",
            { y: 20, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.7, stagger: 0.1, ease: "power3.out" },
            "-=0.5"
        );
    </script>
</section>
