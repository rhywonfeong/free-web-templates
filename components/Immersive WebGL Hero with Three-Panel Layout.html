<!DOCTYPE html>
<html lang="en" class="bg-[#040812]">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sequence Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body
  class="bg-[#040812] text-blue-50 font-sans h-screen w-screen overflow-hidden selection:bg-blue-500/20 selection:text-blue-100 flex flex-col relative p-4 md:p-6 lg:p-8">

  <!-- Framed Grid Layout Outer Container -->
  <main class="relative flex-1 w-full h-full border border-blue-500/20 flex flex-col z-10 bg-[#040812]"
    style="background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(59, 130, 246, 0.02) 10px, rgba(59, 130, 246, 0.02) 11px);">

    <!-- L-Shaped Corner Brackets -->
    <div class="absolute -top-px -left-px w-3 h-3 border-t border-l border-blue-500/60 z-30 pointer-events-none"></div>
    <div class="absolute -top-px -right-px w-3 h-3 border-t border-r border-blue-500/60 z-30 pointer-events-none"></div>
    <div class="absolute -bottom-px -left-px w-3 h-3 border-b border-l border-blue-500/60 z-30 pointer-events-none">
    </div>
    <div class="absolute -bottom-px -right-px w-3 h-3 border-b border-r border-blue-500/60 z-30 pointer-events-none">
    </div>

    <!-- Vertical Container Lines -->
    <div class="absolute top-0 bottom-0 left-[25%] w-px bg-blue-500/20 pointer-events-none z-20"></div>
    <div class="hidden lg:block absolute top-0 bottom-0 right-[25%] w-px bg-blue-500/10 pointer-events-none z-20"></div>

    <!-- Top Navigation -->
    <header
      class="relative z-20 flex h-16 shrink-0 items-center text-sm font-extralight text-blue-100/60 border-b border-blue-500/20">
      <!-- Left Column -->
      <div class="w-[25%] h-full flex items-center px-6 lg:px-10">
        <!-- Geometric Logo removed as requested -->
      </div>
      <!-- Right Column -->
      <div class="w-[75%] h-full flex justify-between items-center px-6 lg:px-10">
        <a href="mailto:contact@sequence.co"
          class="hover:text-blue-200 transition-colors duration-300">contact@sequence.co</a>
        <button class="hover:text-blue-200 transition-colors duration-300 uppercase text-xs tracking-widest">Index</button>
      </div>
      <!-- Intersection Mini Square -->
      <div class="absolute bottom-0 left-[25%] w-1 h-1 bg-blue-500/60 -translate-x-1/2 translate-y-1/2 z-30"></div>
    </header>

    <!-- Hero Typography Section -->
    <section
      class="relative z-20 flex flex-col justify-center border-b border-blue-500/20 py-6 lg:py-10 shrink-0 bg-[#040812]/80 backdrop-blur-sm">
      <div class="w-full px-4 md:px-6 lg:px-10 flex items-center justify-center overflow-hidden">
        <!-- Masked Reveal Target -->
        <h1
          class="text-7xl sm:text-8xl md:text-9xl leading-none font-normal tracking-tight text-blue-50 uppercase reveal-title w-full flex justify-between">
          Sequence
        </h1>
      </div>
      <!-- Intersection Mini Square -->
      <div class="absolute bottom-0 left-[25%] w-1 h-1 bg-blue-500/60 -translate-x-1/2 translate-y-1/2 z-30"></div>
    </section>

    <!-- Sub Navigation -->
    <nav
      class="relative z-20 flex h-12 shrink-0 items-center text-xs font-extralight text-blue-100/50 uppercase tracking-widest border-b border-blue-500/20 bg-[#040812]">
      <div class="w-[25%] h-full flex items-center px-6 lg:px-10">
        Operating Globally
      </div>
      <div class="w-[75%] h-full flex items-center px-6 lg:px-10">
        Digital Architectures
      </div>
      <!-- Intersection Mini Square -->
      <div class="absolute bottom-0 left-[25%] w-1 h-1 bg-blue-500/60 -translate-x-1/2 translate-y-1/2 z-30"></div>
    </nav>

    <!-- Abstract Media Container / Dither Area -->
    <section class="relative z-0 flex-1 w-full overflow-hidden bg-[#040812]">

      <!-- Procedural Dither Background Canvas -->
      <canvas id="ditherCanvas" class="absolute inset-0 w-full h-full object-cover mix-blend-screen opacity-90"
        style="image-rendering: pixelated;"></canvas>

      <!-- Vignette Gradients for Depth -->
      <div class="absolute inset-0 z-10 bg-gradient-to-t from-[#040812] via-[#040812]/40 to-transparent"></div>
      <div class="absolute inset-0 z-10 bg-gradient-to-r from-[#040812] via-transparent to-transparent opacity-70">
      </div>

      <!-- Footer Icons -->
      <div class="absolute bottom-8 left-6 lg:left-10 z-30 flex items-center gap-6 text-blue-100/60">
        <iconify-icon icon="solar:slash-circle-linear"
          class="text-3xl hover:text-blue-100 transition-colors cursor-pointer"
          style="stroke-width: 1.5;"></iconify-icon>
        <iconify-icon icon="solar:sun-2-linear" class="text-3xl hover:text-blue-100 transition-colors cursor-pointer"
          style="stroke-width: 1.5;"></iconify-icon>
        <iconify-icon icon="solar:box-minimalistic-linear"
          class="text-3xl hover:text-blue-100 transition-colors cursor-pointer"
          style="stroke-width: 1.5;"></iconify-icon>
        <iconify-icon icon="solar:infinity-linear" class="text-3xl hover:text-blue-100 transition-colors cursor-pointer"
          style="stroke-width: 1.5;"></iconify-icon>
      </div>
    </section>
  </main>

  <!-- UI Interaction & Procedural Dither Script -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
            // GSAP Typography Reveal
            gsap.registerPlugin(ScrollTrigger);
            const title = document.querySelector('.reveal-title');
            if(title) {
                const text = title.textContent.trim();
                title.innerHTML = '';
                
                text.split('').forEach(char => {
                    const spanOuter = document.createElement('span');
                    spanOuter.className = 'inline-block overflow-hidden align-top leading-none';
                    
                    if (char === ' ') {
                        spanOuter.innerHTML = '&nbsp;';
                    } else {
                        const spanInner = document.createElement('span');
                        spanInner.className = 'reveal-char inline-block';
                        spanInner.textContent = char;
                        spanOuter.appendChild(spanInner);
                    }
                    title.appendChild(spanOuter);
                });

                gsap.set('.reveal-char', { y: '110%' });
                gsap.to('.reveal-char', {
                    y: '0%',
                    duration: 1.4,
                    ease: 'power4.out',
                    stagger: 0.05,
                    delay: 0.2
                });
            }

            // WebGL-Style Bayer Dither Animation
            const cvs = document.getElementById('ditherCanvas');
            if(!cvs) return;
            const ctx = cvs.getContext('2d', { alpha: false });
            let w, h;

            function resize() {
                // Reduced resolution forces standard image pixelation on upscale 
                // matching the "enlarged square pixels" directive
                w = Math.ceil(window.innerWidth / 4);
                h = Math.ceil(window.innerHeight / 4);
                cvs.width = w;
                cvs.height = h;
            }
            window.addEventListener('resize', resize);
            resize();

            // 4x4 Ordered Dithering Matrix (Bayer)
            const bayer = [
                [ 0,  8,  2, 10],
                [12,  4, 14,  6],
                [ 3, 11,  1,  9],
                [15,  7, 13,  5]
            ];

            let time = 0;
            function draw() {
                time += 0.012;
                
                // Clear to near-black base
                ctx.fillStyle = '#040812';
                ctx.fillRect(0, 0, w, h);
                
                // Render procedural "clouds" using slow radial gradients
                const cx1 = w/2 + Math.sin(time) * (w/3);
                const cy1 = h/2 + Math.cos(time * 0.8) * (h/3);
                const g1 = ctx.createRadialGradient(cx1, cy1, 0, cx1, cy1, w/1.5);
                g1.addColorStop(0, '#1E3A8A');
                g1.addColorStop(1, 'transparent');
                
                ctx.globalCompositeOperation = 'screen';
                ctx.fillStyle = g1;
                ctx.fillRect(0, 0, w, h);

                const cx2 = w/2 + Math.cos(time * 1.1) * (w/4);
                const cy2 = h/2 + Math.sin(time * 0.9) * (h/4);
                const g2 = ctx.createRadialGradient(cx2, cy2, 0, cx2, cy2, w/2);
                g2.addColorStop(0, '#3B82F6');
                g2.addColorStop(1, 'transparent');
                
                ctx.fillStyle = g2;
                ctx.fillRect(0, 0, w, h);

                ctx.globalCompositeOperation = 'source-over';
                
                // Read pixels & apply manual thresholding via dither matrix
                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;
                
                for(let i = 0; i < data.length; i += 4) {
                    const x = (i / 4) % w;
                    const y = Math.floor((i / 4) / w);
                    
                    const r = data[i];
                    const g = data[i+1];
                    const b = data[i+2];
                    
                    const luma = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
                    const bayerVal = (bayer[y % 4][x % 4] / 16);
                    const adjusted = luma + (bayerVal - 0.5) * 0.6;
                    
                    // Restrained blue monochrome palette
                    if (adjusted > 0.55) {
                        data[i]=147; data[i+1]=197; data[i+2]=253; // Occasional light highlight
                    } else if (adjusted > 0.35) {
                        data[i]=45; data[i+1]=64; data[i+2]=100; // Soft blue-gray build-up
                    } else if (adjusted > 0.15) {
                        data[i]=15; data[i+1]=23; data[i+2]=42; // Charcoal/Navy midtones
                    } else {
                        data[i]=4; data[i+1]=8; data[i+2]=18; // Near-black base
                    }
                }
                ctx.putImageData(imgData, 0, 0);
                requestAnimationFrame(draw);
            }
            draw();
        });
  </script>
</body>

</html>
