<div
  class="relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-[#030304] font-sans antialiased text-white selection:bg-indigo-500/30"
  style="margin: 0;">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <!-- Background Layer -->
  <canvas id="nova-dots-canvas" class="absolute inset-0 z-0 w-full h-full pointer-events-none"></canvas>

  <!-- Interaction Layer -->
  <div class="w-full max-w-[420px] mx-auto relative z-10 p-6 group" style="perspective: 1200px;">
    <!-- Glow Backdrop -->
    <div
      class="absolute inset-0 bg-gradient-to-tr from-indigo-500/10 via-purple-500/5 to-transparent rounded-[32px] blur-3xl opacity-60 pointer-events-none">
    </div>

    <!-- Interactive Card -->
    <div id="nova-tilt-card"
      class="relative w-full rounded-[24px] transition-transform duration-300 ease-out will-change-transform shadow-[0_30px_60px_-15px_rgba(0,0,0,0.8)]"
      style="transform-style: preserve-3d;">

      <!-- Border Effect -->
      <div
        class="absolute inset-0 rounded-[24px] bg-gradient-to-b from-white/15 via-white/5 to-white/5 p-[1px] z-0 pointer-events-none">
      </div>

      <!-- Content Container -->
      <div
        class="relative w-full h-full bg-[#0a0b0e]/85 backdrop-blur-2xl rounded-[23px] overflow-hidden flex flex-col aspect-square sm:aspect-[4/5]"
        style="transform-style: preserve-3d;">

        <div id="nova-shine"
          class="absolute inset-0 pointer-events-none opacity-0 transition-opacity duration-300 z-50 rounded-[23px]">
        </div>

        <!-- Header Section -->
        <div class="flex border-b border-white/5 h-[25%] min-h-[90px]">
          <div class="flex-1 p-6 flex items-center">
            <div style="transform: translateZ(30px);">
              <h1 class="text-3xl sm:text-4xl font-normal tracking-tight text-white flex items-baseline">
                Nova<span class="text-indigo-400 text-5xl leading-none ml-1">.</span>
              </h1>
            </div>
          </div>
          <div class="w-[30%] border-l border-white/5 relative flex items-center justify-center bg-white/[0.01]">
            <div class="relative flex items-center justify-center" style="transform: translateZ(20px);">
              <div
                class="absolute w-12 h-12 rounded-full border border-indigo-500/20 animate-[ping_3s_linear_infinite]">
              </div>
              <div class="w-2 h-2 rounded-full bg-indigo-400 shadow-[0_0_12px_rgba(129,140,248,0.9)]"></div>
            </div>
          </div>
        </div>

        <!-- Body Section -->
        <div class="flex flex-1">
          <!-- Left: Metrics -->
          <div class="w-[35%] border-r border-white/5 flex flex-col">
            <div
              class="h-[40%] border-b border-white/5 relative flex items-end px-4 pb-4 bg-gradient-to-b from-transparent to-white/[0.01]">
              <div class="absolute inset-0 opacity-20"
                style="background-image: radial-gradient(rgba(255,255,255,0.4) 1px, transparent 1px); background-size: 6px 6px;">
              </div>
              <span class="text-[10px] font-mono text-white/30 uppercase tracking-widest">Index</span>
            </div>
            <div class="flex-1 bg-white/[0.02] p-5 flex flex-col justify-end">
              <div style="transform: translateZ(40px);">
                <div class="text-5xl sm:text-6xl font-light tracking-tighter text-white leading-none flex items-start">
                  <span id="nova-counter">0</span>
                  <span class="text-lg text-indigo-400 font-light mt-1">%</span>
                </div>
                <div class="text-[10px] text-white/40 tracking-widest uppercase mt-2">Efficiency</div>
              </div>
            </div>
          </div>

          <!-- Right: Details -->
          <div class="flex-1 flex flex-col bg-gradient-to-br from-transparent to-white/[0.01]">
            <div
              class="h-12 border-b border-white/5 flex items-center justify-between px-4 font-mono text-[10px] text-white/40">
              <button class="hover:text-white transition-colors"><iconify-icon icon="solar:alt-arrow-left-linear"></iconify-icon></button>
              <span class="tracking-widest uppercase">Seq: Aether</span>
              <button class="hover:text-white transition-colors"><iconify-icon icon="solar:alt-arrow-right-linear"></iconify-icon></button>
            </div>

            <div class="p-5 sm:p-6 flex-1 flex flex-col justify-end relative">
              <iconify-icon icon="solar:server-square-linear"
                class="absolute top-6 right-6 text-7xl text-white/[0.03] -rotate-6"></iconify-icon>
              <div style="transform: translateZ(30px);">
                <div
                  class="inline-flex items-center gap-2 px-2 py-1 rounded-full border border-indigo-500/20 bg-indigo-500/10 mb-4">
                  <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-pulse"></span>
                  <span class="text-[9px] font-mono text-indigo-300 uppercase tracking-widest">Live Sync</span>
                </div>
                <h2 class="text-xl font-normal text-white mb-2">System Resonance</h2>
                <p class="text-xs text-white/50 leading-relaxed font-light">Real-time node synchronization latency
                  across Aether grid.</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function() {
            const card = document.getElementById('nova-tilt-card');
            const container = card.parentElement;
            const shine = document.getElementById('nova-shine');
            const counter = document.getElementById('nova-counter');
            const canvas = document.getElementById('nova-dots-canvas');

            // 3D Tilt & Shine
            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = (e.clientX - rect.left) / rect.width;
                const y = (e.clientY - rect.top) / rect.height;
                const rX = (0.5 - y) * 16;
                const rY = (x - 0.5) * 16;
                card.style.transform = `rotateX(${rX}deg) rotateY(${rY}deg)`;
                shine.style.opacity = '1';
                shine.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(255,255,255,0.08) 0%, transparent 60%)`;
            });

            container.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg)`;
                shine.style.opacity = '0';
            });

            // Counter Logic
            let count = 0;
            const target = 94;
            const interval = setInterval(() => {
                if (count < target) {
                    count++;
                    counter.innerText = count;
                } else clearInterval(interval);
            }, 20);

            // WebGL Background
            const gl = canvas.getContext('webgl');
            if (!gl) return;

            const vs = `attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
            const fs = `
                precision lowp float;
                uniform vec2 u_res; uniform float u_time;
                void main() {
                    vec2 uv = gl_FragCoord.xy / u_res;
                    vec2 grid = uv * vec2(u_res.x/u_res.y, 1.0) * 40.0;
                    grid.y -= u_time * 0.2;
                    vec2 gv = fract(grid) - 0.5;
                    float d = length(gv);
                    float mask = smoothstep(0.4, 0.0, uv.x * uv.y * (1.0-uv.x) * (1.0-uv.y) * 10.0);
                    float dot = smoothstep(0.08, 0.05, d) * (1.0 - mask);
                    gl_FragColor = vec4(vec3(0.1, 0.12, 0.2) * dot, 1.0);
                }
            `;

            const createShader = (gl, type, source) => {
                const s = gl.createShader(type);
                gl.shaderSource(s, source);
                gl.compileShader(s);
                return s;
            };

            const program = gl.createProgram();
            gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vs));
            gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fs));
            gl.linkProgram(program);
            gl.useProgram(program);

            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
            const pLoc = gl.getAttribLocation(program, 'p');
            gl.enableVertexAttribArray(pLoc);
            gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

            const rLoc = gl.getUniformLocation(program, 'u_res');
            const tLoc = gl.getUniformLocation(program, 'u_time');

            const render = (t) => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
                gl.uniform2f(rLoc, canvas.width, canvas.height);
                gl.uniform1f(tLoc, t * 0.001);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            };
            requestAnimationFrame(render);
        })();
  </script>
</div>
