<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis - Zero Breach Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Roboto+Mono:wght@400&display=swap"
        rel="stylesheet">
</head>

<body
    class="bg-[#020617] text-slate-200 antialiased min-h-screen relative overflow-hidden flex flex-col selection:bg-sky-500/30 selection:text-sky-200"
    style="font-family: 'Inter', sans-serif; margin: 0;">

    <!-- Background WebGL Canvas -->
    <canvas id="bg-canvas" class="absolute inset-0 z-0 pointer-events-none opacity-50"></canvas>

    <!-- Interactive Cursor Glow -->
    <div id="cursor-glow" class="absolute inset-0 z-0 pointer-events-none transition-opacity duration-500"
        style="background: radial-gradient(1000px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(14, 165, 233, 0.05), transparent 40%);">
    </div>

    <!-- Main Application Frame -->
    <div
        class="max-w-7xl mx-auto w-full px-4 sm:px-8 md:px-12 flex flex-col flex-1 relative z-10 border-x border-slate-800/40 bg-[#020617]/40 backdrop-blur-[2px]">

        <!-- Header -->
        <header class="h-20 md:h-24 flex items-center justify-between border-b border-slate-800/50">
            <div class="flex items-center gap-2.5 text-slate-100 group cursor-pointer">
                <div
                    class="relative flex items-center justify-center w-8 h-8 rounded border border-slate-700 bg-slate-900 overflow-hidden group-hover:border-sky-500/50 transition-colors">
                    <div
                        class="absolute inset-0 bg-sky-500/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300">
                    </div>
                    <iconify-icon icon="solar:shield-network-linear" width="18"
                        style="stroke-width: 1.5; color: #38bdf8;" class="relative z-10"></iconify-icon>
                </div>
                <span class="text-sm md:text-base tracking-tight font-medium">aegis.</span>
            </div>

            <a href="#"
                class="flex items-center gap-2 text-xs md:text-sm text-slate-500 hover:text-sky-400 transition-colors font-light">
                <iconify-icon icon="solar:laptop-minimalistic-linear" width="18"
                    style="stroke-width: 1.5;"></iconify-icon>
                <span class="hidden sm:inline">System Access</span>
            </a>
        </header>

        <!-- Main Content Section -->
        <main class="flex-1 flex flex-col md:flex-row items-center justify-center py-12 md:py-0 gap-12 md:gap-8">

            <!-- Left: Graphic / Abstract Visual -->
            <div
                class="w-full md:w-1/2 flex justify-center items-center relative order-2 md:order-1 h-64 sm:h-80 md:h-auto z-20">
                <div
                    class="relative flex justify-center items-center w-full max-w-[320px] sm:max-w-[400px] aspect-square">

                    <!-- Ambient Core Glow -->
                    <div class="absolute inset-0 bg-sky-600/10 blur-[100px] rounded-full scale-150"></div>

                    <!-- Concentric Rings -->
                    <div class="ring-outer absolute inset-0 sm:inset-4 border border-slate-800/80 rounded-full"></div>
                    <div
                        class="ring-middle absolute inset-8 sm:inset-14 border border-sky-500/20 border-dashed rounded-full">
                    </div>
                    <div
                        class="ring-inner absolute inset-16 sm:inset-24 border border-blue-600/30 rounded-full shadow-[inset_0_0_40px_rgba(37,99,235,0.1)]">
                    </div>

                    <!-- Central Server Node -->
                    <div
                        class="central-node absolute inset-0 m-auto w-20 h-20 sm:w-24 sm:h-24 bg-slate-950 border border-sky-500/40 rounded-xl shadow-[0_0_50px_rgba(14,165,233,0.15)] flex flex-col items-center justify-center overflow-hidden z-10 backdrop-blur-md">
                        <div
                            class="w-full h-[1px] bg-gradient-to-r from-transparent via-sky-500/50 to-transparent absolute top-1/2 -translate-y-1/2">
                        </div>
                        <iconify-icon icon="solar:server-square-cloud-linear" width="32"
                            style="stroke-width: 1.5; color: #38bdf8;" class="mb-1"></iconify-icon>
                        <div class="flex gap-1 mt-2">
                            <div class="w-1 h-1 rounded-full bg-sky-400 animate-pulse"></div>
                            <div class="w-1 h-1 rounded-full bg-slate-600"></div>
                            <div class="w-1 h-1 rounded-full bg-slate-600"></div>
                        </div>
                    </div>

                    <!-- Orbiting Elements -->
                    <div class="orbit-container absolute inset-0 animate-[spin_20s_linear_infinite]">
                        <div
                            class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-sky-400 rounded-full shadow-[0_0_12px_#38bdf8]">
                        </div>
                    </div>
                    <div
                        class="orbit-container-reverse absolute inset-8 sm:inset-14 animate-[spin_15s_linear_infinite_reverse]">
                        <div
                            class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 w-1.5 h-1.5 bg-blue-500 rounded-full shadow-[0_0_10px_#3b82f6]">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right: Typography & Call to Action -->
            <div
                class="w-full md:w-1/2 flex flex-col items-center md:items-start text-center md:text-left order-1 md:order-2 z-20 px-4 sm:px-0">

                <div class="mb-6 px-3 py-1 text-[10px] md:text-xs text-sky-400 border border-sky-900/50 bg-sky-950/20 rounded-full uppercase tracking-widest"
                    style="font-family: 'Roboto Mono', monospace;">
                    Protocol v4.2 Active
                </div>

                <h1
                    class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-medium tracking-tight text-slate-100 leading-[1.05] mb-6">
                    <div class="overflow-hidden inline-block align-top">
                        <span class="block title-word translate-y-full">ZERO</span>
                    </div>
                    <div class="overflow-hidden inline-block align-top">
                        <span class="block title-word translate-y-full text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-blue-600">BREACH.</span>
                    </div>
                    <br>
                    <div class="overflow-hidden inline-block align-top mt-1 md:mt-2">
                        <span class="block title-word translate-y-full">ARCHITECTURE.</span>
                    </div>
                </h1>

                <div id="desc-container" class="text-sm md:text-base text-slate-400 max-w-md leading-relaxed font-light"
                    data-text="Deploy military-grade encryption protocols across your distributed network. Autonomous threat mitigation powered by advanced neural analysis.">
                    <!-- Words injected here -->
                </div>

                <div class="mt-10 flex flex-wrap justify-center md:justify-start items-center gap-4 opacity-0 w-full"
                    id="action-buttons">
                    <button class="px-6 py-3 bg-slate-100 hover:bg-white text-slate-900 text-xs sm:text-sm font-medium rounded-md transition-colors flex items-center gap-2 group w-full sm:w-auto justify-center">
                        Initialize Core
                        <iconify-icon icon="solar:arrow-right-linear" width="16" style="stroke-width: 1.5;" class="group-hover:translate-x-1 transition-transform"></iconify-icon>
                    </button>
                    <button class="px-6 py-3 bg-transparent border border-slate-700 hover:border-slate-500 hover:bg-slate-800/50 text-slate-300 text-xs sm:text-sm font-medium rounded-md transition-colors flex items-center gap-2 w-full sm:w-auto justify-center">
                        <iconify-icon icon="solar:document-text-linear" width="16" style="stroke-width: 1.5;"></iconify-icon>
                        View Logs
                    </button>
                </div>
            </div>

        </main>

        <!-- Bottom Data Stream Visualization -->
        <div
            class="h-20 sm:h-24 border-t border-slate-800/50 flex flex-col justify-end overflow-hidden relative opacity-70 mt-auto z-10">
            <div class="absolute top-3 left-4 text-[10px] text-slate-500 uppercase tracking-widest"
                style="font-family: 'Roboto Mono', monospace;">Network Throughput</div>
            <div class="absolute top-3 right-4 text-[10px] text-sky-500/70 font-medium"
                style="font-family: 'Roboto Mono', monospace;">LIVE</div>

            <div class="flex items-end w-full h-12 gap-[1px] sm:gap-[2px] px-1" id="data-bars">
                <!-- Data bars generated by JS -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Track mouse for background glow
            const body = document.body;
            body.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth) * 100;
                const y = (e.clientY / window.innerHeight) * 100;
                body.style.setProperty('--mouse-x', `${x}%`);
                body.style.setProperty('--mouse-y', `${y}%`);
            });

            // Prepare Description Text for Staggered Reveal
            const descContainer = document.getElementById('desc-container');
            const text = descContainer.getAttribute('data-text');
            const words = text.split(' ');
            descContainer.innerHTML = ''; // Clear fallback text
            
            words.forEach(word => {
                const wrapper = document.createElement('div');
                wrapper.className = 'overflow-hidden inline-block align-top mr-1 mb-1';
                
                const span = document.createElement('span');
                span.className = 'block desc-word translate-y-full text-slate-400';
                span.innerText = word;
                
                wrapper.appendChild(span);
                descContainer.appendChild(wrapper);
            });

            // Generate Bottom Data Bars
            const barsContainer = document.getElementById('data-bars');
            const numBars = window.innerWidth > 768 ? 80 : 40;
            
            for (let i = 0; i < numBars; i++) {
                const bar = document.createElement('div');
                bar.className = 'data-bar bg-sky-500/40 w-full rounded-t-sm';
                bar.style.height = '10%';
                bar.style.transformOrigin = 'bottom';
                barsContainer.appendChild(bar);
            }

            // --- GSAP Animations ---
            
            const tl = gsap.timeline({ delay: 0.2 });

            // 1. Title Reveal
            tl.to(".title-word", {
                y: "0%",
                duration: 1,
                stagger: 0.1,
                ease: "power4.out"
            });

            // 2. Description Reveal
            tl.to(".desc-word", {
                y: "0%",
                duration: 0.8,
                stagger: 0.015,
                ease: "power3.out"
            }, "-=0.6");

            // 3. Buttons Fade In
            tl.to("#action-buttons", {
                opacity: 1,
                y: 0,
                duration: 0.8,
                ease: "power2.out",
                startAt: { y: 20 }
            }, "-=0.4");

            // 4. Center Node Float
            gsap.to(".central-node", {
                y: -10,
                duration: 3,
                yoyo: true,
                repeat: -1,
                ease: "sine.inOut"
            });

            // 5. Data Bars Equalizer Loop
            document.querySelectorAll('.data-bar').forEach((bar) => {
                gsap.to(bar, {
                    height: () => `${20 + Math.random() * 80}%`,
                    duration: 0.4 + Math.random() * 0.6,
                    yoyo: true,
                    repeat: -1,
                    ease: "sine.inOut",
                    delay: Math.random() * -2
                });
            });
        });

        // --- Three.js WebGL Landscape ---
        const initWebGL = () => {
            const canvas = document.getElementById('bg-canvas');
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020617, 0.04);
            
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.y = 5;
            camera.position.z = 20;
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Create a moving grid plain
            const geometry = new THREE.PlaneGeometry(100, 100, 40, 40);
            
            // Distort vertices to make terrain
            const vertices = geometry.attributes.position.array;
            for (let i = 0; i < vertices.length; i += 3) {
                vertices[i + 2] = Math.random() * 1.5; // slight random height
            }
            
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x0ea5e9, // Sky 500
                wireframe: true,
                transparent: true,
                opacity: 0.15
            });

            const plane = new THREE.Mesh(geometry, material);
            plane.rotation.x = -Math.PI / 2;
            scene.add(plane);

            let time = 0;
            const animate = () => {
                requestAnimationFrame(animate);
                time += 0.005;
                
                // Move grid towards camera to simulate forward movement
                plane.position.z = (time * 10) % 2.5; // 2.5 is the segment size (100/40)
                
                // Gentle sway
                camera.position.x = Math.sin(time) * 2;
                camera.lookAt(0, 0, 0);

                renderer.render(scene, camera);
            };

            animate();

            // Handle Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        };

        // Initialize WebGL if device is somewhat capable
        if (window.WebGLRenderingContext) {
            initWebGL();
        }
    </script>
</body>

</html>
