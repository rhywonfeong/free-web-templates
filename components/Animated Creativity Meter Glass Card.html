<div
    class="min-h-screen bg-[#070a11] flex items-center justify-center p-4 font-sans antialiased text-white overflow-hidden relative">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <!-- Ambient Background Glooms -->
    <div
        class="fixed top-0 left-1/4 w-full h-full max-w-2xl max-h-[600px] bg-indigo-900/20 rounded-full blur-[120px] pointer-events-none -z-10 mix-blend-screen">
    </div>
    <div
        class="fixed bottom-0 right-1/4 w-full h-full max-w-xl max-h-[500px] bg-emerald-900/10 rounded-full blur-[100px] pointer-events-none -z-10 mix-blend-screen">
    </div>

    <!-- Main Card Container -->
    <div class="relative w-full max-w-[740px] rounded-[3.5rem] p-8 sm:p-10 shadow-[0_20px_60px_-15px_rgba(0,0,0,0.7)] border border-white/10 overflow-hidden"
        style="opacity: 0; transform: scale(0.95) translateY(20px); transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1);"
        id="main-card">

        <!-- Internal Colored Blobs for Glass Effect -->
        <div
            class="absolute -top-[10%] -left-[10%] w-[60%] h-[60%] bg-[#3b82f6] rounded-full mix-blend-normal opacity-70 blur-[70px] -z-10">
        </div>
        <div
            class="absolute -top-[10%] -right-[10%] w-[50%] h-[50%] bg-[#10b981] rounded-full mix-blend-normal opacity-60 blur-[60px] -z-10">
        </div>
        <div
            class="absolute -bottom-[20%] -left-[5%] w-[60%] h-[60%] bg-[#4f46e5] rounded-full mix-blend-normal opacity-80 blur-[80px] -z-10">
        </div>
        <div
            class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] bg-[#e11d48] rounded-full mix-blend-normal opacity-50 blur-[70px] -z-10">
        </div>

        <!-- Frosted Glass Overlay -->
        <div class="absolute inset-0 bg-[#0c1222]/30 backdrop-blur-2xl -z-10"></div>

        <!-- Title -->
        <h2 class="text-center text-xl sm:text-2xl font-medium tracking-tight mb-8 sm:mb-12 text-white/95 anim-elem"
            style="opacity: 0; transform: translateY(-10px); transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);">
            Creativity Meter
        </h2>

        <!-- Middle Content Row -->
        <div
            class="flex flex-col sm:flex-row items-center justify-between gap-8 sm:gap-4 w-full mb-10 sm:mb-14 relative z-10">

            <!-- Left: Lightbulb -->
            <div class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-[2rem] bg-gradient-to-br from-[#9b66ff] via-[#6d28d9] to-[#311b92] flex items-center justify-center shadow-lg border border-white/20 shrink-0 anim-elem overflow-hidden"
                style="opacity: 0; transform: translateX(-20px); transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);">
                <div class="absolute inset-0 bg-gradient-to-t from-transparent to-white/20 opacity-50"></div>
                <div class="absolute inset-0 bg-fuchsia-400/30 blur-xl mix-blend-screen" id="bulb-glow"></div>
                <iconify-icon icon="solar:lightbulb-linear"
                    class="text-amber-200 text-5xl sm:text-6xl relative z-10 drop-shadow-[0_0_12px_rgba(253,230,138,0.8)]"></iconify-icon>
            </div>

            <!-- Center: Meter SVG -->
            <div class="relative w-full max-w-[320px] h-[160px] flex-grow flex items-end justify-center anim-elem"
                style="opacity: 0; transform: scale(0.9); transition: all 1s cubic-bezier(0.2, 0.8, 0.2, 1);">
                <svg viewBox="0 0 300 160" class="w-full h-full overflow-visible">
                    <defs>
                        <linearGradient id="fluidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#3b82f6" />
                            <stop offset="40%" stop-color="#06b6d4" />
                            <stop offset="60%" stop-color="#2dd4bf" />
                            <stop offset="100%" stop-color="#ec4899" />
                        </linearGradient>
                        <linearGradient id="fluidHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="rgba(255,255,255,0.6)" />
                            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                        </linearGradient>
                    </defs>
                    <path d="M 30 140 A 120 120 0 0 1 270 140" fill="none" stroke="rgba(255,255,255,0.15)"
                        stroke-width="2" stroke-linecap="round" />
                    <path id="active-arc" d="M 30 140 A 120 120 0 0 1 150 20" fill="none" stroke="#e2e8f0"
                        stroke-width="4" stroke-linecap="round" stroke-dasharray="200" stroke-dashoffset="200"
                        style="transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1) 0.5s;" />
                    <circle id="top-dot" cx="150" cy="20" r="5" fill="#ffffff"
                        class="drop-shadow-[0_0_8px_rgba(255,255,255,0.9)]"
                        style="opacity: 0; transition: opacity 0.5s ease 1.5s;" />
                    <path d="M 50 140 A 100 100 0 0 1 250 140" fill="none" stroke="rgba(255,255,255,0.08)"
                        stroke-width="20" stroke-linecap="round" />
                    <g fill="rgba(255,255,255,0.75)" font-family="sans-serif" font-size="11" font-weight="500"
                        text-anchor="middle" dominant-baseline="middle" class="tracking-widest">
                        <text x="45" y="140" transform="rotate(-90 45 140)">0</text>
                        <text x="65" y="78" transform="rotate(-54 65 78)">20</text>
                        <text x="118" y="40" transform="rotate(-18 118 40)">40</text>
                        <text x="150" y="34" transform="rotate(0 150 34)">50</text>
                        <text x="182" y="40" transform="rotate(18 182 40)">60</text>
                        <text x="235" y="78" transform="rotate(54 235 78)">80</text>
                        <text x="255" y="140" transform="rotate(90 255 140)">100</text>
                    </g>
                    <g style="transform-origin: 150px 140px;" id="liquid-wave">
                        <path
                            d="M 60 140 C 70 140, 75 90, 100 90 C 125 90, 135 30, 145 30 C 155 30, 155 125, 180 130 C 200 130, 220 135, 240 135 L 240 140 Z"
                            fill="url(#fluidGrad)" />
                        <path
                            d="M 60 140 C 70 140, 75 90, 100 90 C 125 90, 135 30, 145 30 C 155 30, 155 125, 180 130 C 200 130, 220 135, 240 135"
                            fill="none" stroke="url(#fluidHighlight)" stroke-width="1.5" opacity="0.8" />
                    </g>
                </svg>
            </div>

            <!-- Right: Percentage Status -->
            <div class="relative shrink-0 anim-elem"
                style="opacity: 0; transform: translateX(20px); transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);">
                <div
                    class="absolute inset-y-0 -left-12 right-0 bg-[#1a2333]/80 backdrop-blur-xl rounded-l-full rounded-r-[2rem] -z-10 shadow-inner">
                </div>
                <div class="px-5 sm:px-6 py-3 sm:py-4 flex items-center justify-center min-w-[100px]">
                    <span class="text-2xl sm:text-3xl font-semibold tracking-tight text-white drop-shadow-md">0-0%</span>
                </div>
            </div>
        </div>

        <!-- Bottom Actions -->
        <div class="flex items-center justify-center gap-4 sm:gap-6 w-full anim-elem"
            style="opacity: 0; transform: translateY(20px); transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);">
            <button class="group relative flex items-center gap-2.5 px-6 sm:px-8 py-2.5 sm:py-3 rounded-full bg-white/5 hover:bg-white/10 border border-white/20 backdrop-blur-md transition-all duration-300 hover:scale-105 active:scale-95 hover:border-white/40 shadow-lg">
                <iconify-icon icon="solar:bolt-linear" class="text-lg text-white/90 group-hover:text-white transition-colors"></iconify-icon>
                <span class="text-sm sm:text-base font-medium tracking-wide text-white/90 group-hover:text-white transition-colors">Spark Idea</span>
            </button>
            <button class="group relative flex items-center gap-2.5 px-6 sm:px-8 py-2.5 sm:py-3 rounded-full bg-white/5 hover:bg-white/10 border border-white/20 backdrop-blur-md transition-all duration-300 hover:scale-105 active:scale-95 hover:border-white/40 shadow-lg">
                <iconify-icon icon="solar:settings-linear" class="text-lg text-white/90 group-hover:text-white transition-colors"></iconify-icon>
                <span class="text-sm sm:text-base font-medium tracking-wide text-white/90 group-hover:text-white transition-colors">Generate</span>
            </button>
        </div>

        <script>
            (function() {
                setTimeout(() => {
                    document.getElementById('main-card').style.opacity = '1';
                    document.getElementById('main-card').style.transform = 'scale(1) translateY(0)';
                }, 100);

                const animElements = document.querySelectorAll('.anim-elem');
                animElements.forEach((el, index) => {
                    setTimeout(() => {
                        el.style.opacity = '1';
                        el.style.transform = 'translate(0, 0) scale(1)';
                    }, 300 + (index * 150));
                });

                setTimeout(() => {
                    const arc = document.getElementById('active-arc');
                    if (arc) arc.style.strokeDashoffset = '0';
                    const dot = document.getElementById('top-dot');
                    if (dot) dot.style.opacity = '1';
                }, 800);

                const wave = document.getElementById('liquid-wave');
                const bulbGlow = document.getElementById('bulb-glow');
                let start = Date.now();

                function loop() {
                    const now = Date.now();
                    const delta = now - start;
                    if (wave) wave.style.transform = `scaleY(${1 + Math.sin(delta * 0.002) * 0.03})`;
                    if (bulbGlow) bulbGlow.style.opacity = 0.3 + Math.sin(delta * 0.001) * 0.2;
                    requestAnimationFrame(loop);
                }
                requestAnimationFrame(loop);
            })();
        </script>
    </div>
</div>
