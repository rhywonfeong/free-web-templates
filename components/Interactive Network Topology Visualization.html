<section class="topology-section z-10 w-full max-w-6xl mb-24 relative mx-auto"
  style="animation: topologyReveal 1s cubic-bezier(.22, 1, .36, 1) both;">
  <style>
    .topology-frame {
      transition: transform 0.45s ease, box-shadow 0.45s ease, border-color 0.45s ease;
    }

    .topology-frame:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.14), 0 18px 60px rgba(0, 0, 0, 0.48), 0 0 40px rgba(16, 185, 129, 0.06);
    }

    .topology-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 0%, transparent 35%, rgba(16, 185, 129, 0.08) 50%, transparent 65%, transparent 100%);
      transform: translateX(-130%);
      animation: topologySweep 6s linear infinite;
      z-index: 2;
    }

    .topology-left>* {
      opacity: 0;
      transform: translateY(18px);
      animation: topologyFadeUp 0.8s ease forwards;
    }

    .topology-left>*:nth-child(1) {
      animation-delay: 0.08s;
    }

    .topology-left>*:nth-child(2) {
      animation-delay: 0.16s;
    }

    .topology-left>*:nth-child(3) {
      animation-delay: 0.24s;
    }

    .topology-left>*:nth-child(4) {
      animation-delay: 0.32s;
    }

    .topology-badge svg {
      animation: badgePulse 2.4s ease-in-out infinite;
    }

    .stat-row {
      opacity: 0;
      transform: translateY(10px);
      animation: topologyFadeUp 0.7s ease forwards;
    }

    .stat-row:nth-child(1) {
      animation-delay: 0.45s;
    }

    .stat-row:nth-child(2) {
      animation-delay: 0.55s;
    }

    .stat-row:nth-child(3) {
      animation-delay: 0.65s;
    }

    .topology-canvas-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.08), transparent 42%), radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.04), transparent 62%);
      animation: canvasGlow 5.5s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes topologyReveal {
      from {
        opacity: 0;
        transform: translateY(28px);
        filter: blur(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @keyframes topologyFadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes topologySweep {
      0% {
        transform: translateX(-130%);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      100% {
        transform: translateX(130%);
        opacity: 0;
      }
    }

    @keyframes canvasGlow {

      0%,
      100% {
        opacity: 0.35;
      }

      50% {
        opacity: 0.8;
      }
    }

    @keyframes badgePulse {

      0%,
      100% {
        opacity: 0.8;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.06);
      }
    }
  </style>

  <div class="absolute -top-1 -left-1 w-2 h-2 border border-emerald-500/50 bg-[#050a06] z-20"></div>
  <div class="absolute -top-1 -right-1 w-2 h-2 border border-emerald-500/50 bg-[#050a06] z-20"></div>
  <div class="absolute -bottom-1 -left-1 w-2 h-2 border border-emerald-500/50 bg-[#050a06] z-20"></div>
  <div class="absolute -bottom-1 -right-1 w-2 h-2 border border-emerald-500/50 bg-[#050a06] z-20"></div>

  <div
    class="topology-frame flex flex-col md:flex-row overflow-hidden bg-black/40 w-full border border-emerald-900/30 p-1 relative backdrop-blur-md">
    <div
      class="topology-left md:w-1/3 flex flex-col md:border-b-0 md:border-r bg-gradient-to-r from-white/[0.02] to-transparent w-full border-b border-emerald-900/30 p-8 justify-center">
      <div class="topology-badge flex items-center gap-2 mb-4 text-emerald-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
          <path
            d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2">
          </path>
        </svg>
        <span class="text-xs font-light tracking-widest uppercase">Live Network Topology</span>
      </div>
      <h2 class="text-3xl font-light tracking-tight mb-4 text-white">Observe event flow in real time.</h2>
      <p class="text-lg font-thin text-emerald-50/50 leading-relaxed mb-8">Monitor how events move through distributed
        gateways and delivery nodes with live throughput, latency, and activity signals.</p>
      <div class="space-y-4">
        <div class="stat-row flex justify-between items-center text-sm border-b border-emerald-900/30 pb-2">
          <span class="font-thin text-gray-400">Active Nodes</span>
          <span class="stat-number font-light text-emerald-400" data-type="number" data-target="2408" style="text-shadow: 0 0 14px rgba(16, 185, 129, 0.18);">0</span>
        </div>
        <div class="stat-row flex justify-between items-center text-sm border-b border-emerald-900/30 pb-2">
          <span class="font-thin text-gray-400">Events / Sec</span>
          <span class="stat-number font-light text-emerald-400" data-type="compact" data-target="14200000" style="text-shadow: 0 0 14px rgba(16, 185, 129, 0.18);">0</span>
        </div>
        <div class="stat-row flex justify-between items-center text-sm">
          <span class="font-thin text-gray-400">Avg Latency</span>
          <span class="stat-number font-light text-emerald-400" data-type="suffix" data-target="12" data-suffix="ms" style="text-shadow: 0 0 14px rgba(16, 185, 129, 0.18);">0</span>
        </div>
      </div>
    </div>

    <div id="three-container"
      class="topology-canvas-wrap w-full md:w-2/3 h-[400px] md:h-auto relative bg-[#020503] cursor-crosshair overflow-hidden">
      <div class="absolute inset-0 pointer-events-none shadow-[inset_0_0_100px_rgba(0,0,0,0.8)] z-10"></div>
      <canvas id="topology-canvas" class="block w-full h-full relative z-0"></canvas>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (() => {
      const section = document.currentScript.closest(".topology-section");
      const canvas = section.querySelector("#topology-canvas");
      const container = section.querySelector("#three-container");
      if (!canvas || !container || typeof THREE === "undefined") return;

      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const statEls = section.querySelectorAll(".stat-number");

      function formatValue(v, t, s = "") {
        if (t === "compact") {
          if (v >= 1000000) return (v / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
          if (v >= 1000) return (v / 1000).toFixed(1).replace(/\.0$/, "") + "K";
          return Math.round(v).toLocaleString();
        }
        return Math.round(v).toLocaleString() + s;
      }

      statEls.forEach((el, i) => {
        const target = Number(el.dataset.target || 0), type = el.dataset.type, suffix = el.dataset.suffix || "";
        let start = null;
        const tick = (ts) => {
          if (!start) start = ts;
          const progress = Math.min((ts - start) / 1400, 1);
          el.textContent = formatValue(target * (1 - Math.pow(1 - progress, 3)), type, suffix);
          if (progress < 1) requestAnimationFrame(tick);
        };
        setTimeout(() => requestAnimationFrame(tick), 450 + i * 120);
      });

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.8));
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 1000);
      camera.position.z = 18;
      const group = new THREE.Group(); scene.add(group);
      const globeGroup = new THREE.Group(); group.add(globeGroup);

      const globe = new THREE.Mesh(new THREE.IcosahedronGeometry(3.2, 1), new THREE.MeshBasicMaterial({ color: 0x0eb88a, wireframe: true, transparent: true, opacity: 0.2 }));
      const outer = new THREE.Mesh(new THREE.IcosahedronGeometry(3.55, 1), new THREE.MeshBasicMaterial({ color: 0x44ffd0, wireframe: true, transparent: true, opacity: 0.05 }));
      globeGroup.add(globe, outer);

      const nodeGeo = new THREE.BufferGeometry();
      const nodePos = [];
      for (let i = 0; i < 38; i++) {
        const p = Math.acos(-1 + (2 * i) / 38), t = Math.sqrt(38 * Math.PI) * p, r = 3.28;
        nodePos.push(r * Math.cos(t) * Math.sin(p), r * Math.sin(t) * Math.sin(p), r * Math.cos(p));
      }
      nodeGeo.setAttribute("position", new THREE.Float32BufferAttribute(nodePos, 3));
      const nodes = new THREE.Points(nodeGeo, new THREE.PointsMaterial({ color: 0x6effdb, size: 0.08, transparent: true, opacity: 0.9 }));
      globeGroup.add(nodes);

      const starsGeo = new THREE.BufferGeometry();
      const starPos = new Float32Array(700 * 3), starSize = new Float32Array(700);
      for (let i = 0; i < 700; i++) {
        starPos[i * 3] = (Math.random() - 0.5) * 50; starPos[i * 3 + 1] = (Math.random() - 0.5) * 28; starPos[i * 3 + 2] = (Math.random() - 0.5) * 22;
        starSize[i] = Math.random();
      }
      starsGeo.setAttribute("position", new THREE.BufferAttribute(starPos, 3));
      starsGeo.setAttribute("aSize", new THREE.BufferAttribute(starSize, 1));
      const starsMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, uniforms: { uTime: { value: 0 } },
        vertexShader: `attribute float aSize; uniform float uTime; varying float vA; void main() { vA = 0.55 + 0.45 * sin(uTime * 1.2 + position.x); vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = (1.5 + aSize * 2.5) * (18.0 / -mv.z); gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `varying float vA; void main() { float d = length(gl_PointCoord - 0.5); gl_FragColor = vec4(0.38, 1.0, 0.82, smoothstep(0.5, 0.0, d) * vA * 0.8); }`
      });
      const stars = new THREE.Points(starsGeo, starsMat); scene.add(stars);

      const ring = new THREE.Mesh(new THREE.TorusGeometry(4.15, 0.012, 8, 180), new THREE.MeshBasicMaterial({ color: 0x17c89b, transparent: true, opacity: 0.12 }));
      ring.rotation.set(Math.PI / 2.6, 0.45, 0); globeGroup.add(ring);

      let mX = 0, mY = 0, tX = 0, tY = 0;
      const resize = () => {
        renderer.setSize(container.clientWidth, container.clientHeight, false);
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
      };
      container.addEventListener("mousemove", (e) => {
        const r = container.getBoundingClientRect();
        tX = ((e.clientX - r.left) / r.width - 0.5) * 1.4;
        tY = ((e.clientY - r.top) / r.height - 0.5) * 0.8;
      });
      container.addEventListener("mouseleave", () => { tX = 0; tY = 0; });

      const clock = new THREE.Clock();
      const animate = () => {
        const t = clock.getElapsedTime();
        mX += (tX - mX) * 0.04; mY += (tY - mY) * 0.04;
        group.rotation.set(-mY * 0.22, mX * 0.35, 0);
        if (!prefersReducedMotion) {
          globe.rotation.y += 0.002; outer.rotation.y -= 0.001; nodes.rotation.y += 0.002;
          ring.rotation.z += 0.002; stars.rotation.y = t * 0.01; starsMat.uniforms.uTime.value = t;
        }
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      };
      resize(); animate();
      new ResizeObserver(resize).observe(container);
    })();
  </script>
</section>
