<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="antialiased min-h-screen flex items-center justify-center m-0 overflow-hidden relative" style="background-color: #2e3035;">

    <!-- WebGL Canvas for background animation -->
    <canvas id="gl-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></canvas>

    <!-- Main UI Container -->
    <div class="flex items-center justify-center w-full px-4" style="z-index: 10; position: relative;">
        
        <!-- Responsive Wrapper -->
        <div class="relative scale-75 sm:scale-100 transition-transform duration-500 flex items-center justify-center">

            <!-- Ambient Deep Shadow behind the track -->
            <div style="position: absolute; width: 130%; height: 170%; background: radial-gradient(ellipse at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0) 65%); border-radius: 9999px; pointer-events: none; z-index: -1;"></div>

            <!-- Toggle Track -->
            <div id="toggle-track" class="group" style="width: 320px; height: 130px; border-radius: 9999px; background-color: #1a1c20; box-shadow: inset 0px 18px 25px -5px rgba(0,0,0,0.8), inset 0px -2px 5px rgba(255,255,255,0.03), 0 0 0 1px rgba(0,0,0,0.9); position: relative; cursor: pointer; display: flex; align-items: center; padding: 8px; -webkit-tap-highlight-color: transparent;">

                <!-- Toggle Knob -->
                <div id="toggle-knob" style="width: 154px; height: 114px; border-radius: 9999px; background: linear-gradient(135deg, #3a3c44 0%, #303238 100%); position: absolute; left: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 12px 12px 24px rgba(0,0,0,0.6), -4px -4px 12px rgba(255,255,255,0.02), inset 0px 2px 2px rgba(255,255,255,0.08), inset 0px -2px 6px rgba(0,0,0,0.4); transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.4s ease; border: 1px solid rgba(255,255,255,0.03);">
                    
                    <!-- Toggle Text -->
                    <span id="toggle-text" class="text-white text-xl font-semibold tracking-widest select-none transition-all duration-400" style="font-family: ui-sans-serif, system-ui, sans-serif; text-shadow: 0px 2px 4px rgba(0,0,0,0.5);">HALT</span>
                
                </div>
            </div>
        </div>
    </div>

    <script>
        // Toggle Interaction Logic
        const track = document.getElementById('toggle-track');
        const knob = document.getElementById('toggle-knob');
        const text = document.getElementById('toggle-text');
        let isSystemActive = false;

        track.addEventListener('click', () => {
            isSystemActive = !isSystemActive;
            if (isSystemActive) {
                knob.style.transform = 'translateX(150px)';
                text.innerText = 'EXEC';
                text.style.color = '#e2e8f0'; 
                knob.style.background = 'linear-gradient(135deg, #40434c 0%, #35383f 100%)';
                knob.style.boxShadow = '12px 12px 24px rgba(0,0,0,0.6), -4px -4px 12px rgba(255,255,255,0.02), inset 0px 2px 2px rgba(255,255,255,0.12), inset 0px -2px 6px rgba(0,0,0,0.4)';
            } else {
                knob.style.transform = 'translateX(0px)';
                text.innerText = 'HALT';
                text.style.color = '#ffffff';
                knob.style.background = 'linear-gradient(135deg, #3a3c44 0%, #303238 100%)';
                knob.style.boxShadow = '12px 12px 24px rgba(0,0,0,0.6), -4px -4px 12px rgba(255,255,255,0.02), inset 0px 2px 2px rgba(255,255,255,0.08), inset 0px -2px 6px rgba(0,0,0,0.4)';
            }
        });

        // WebGL Ambient Background Animation
        const canvas = document.getElementById('gl-canvas');
        const gl = canvas.getContext('webgl');
        
        if (gl) {
            const program = gl.createProgram();
            
            const compileShader = (type, source) => {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                gl.attachShader(program, shader);
            };

            // Vertex Shader
            compileShader(gl.VERTEX_SHADER, 'attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }');
            
            // Fragment Shader (Generates subtle dark grain and interactive mouse glow)
            compileShader(gl.FRAGMENT_SHADER, `
                precision lowp float;
                uniform vec2 u_res;
                uniform float u_time;
                uniform vec2 u_mouse;
                
                void main() {
                    vec2 uv = gl_FragCoord.xy / u_res;
                    vec2 mouse_uv = u_mouse / u_res;
                    mouse_uv.y = 1.0 - mouse_uv.y; // Flip Y for WebGL coords
                    
                    // Exact background color from reference
                    vec3 baseColor = vec3(0.180, 0.188, 0.208); 
                    
                    // Subtle interactive glow
                    float dist = length(uv - mouse_uv);
                    vec3 glowColor = vec3(0.02, 0.025, 0.035) * max(0.0, 1.0 - dist * 2.2);
                    
                    // Animated subtle noise
                    float noise = fract(sin(dot(uv + u_time * 0.00005, vec2(12.9898, 78.233))) * 43758.5453);
                    
                    gl_FragColor = vec4(baseColor + glowColor + (noise * 0.012), 1.0);
                }
            `);

            gl.linkProgram(program);
            gl.useProgram(program);

            // Setup fullscreen quad
            const buffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
            
            const positionLocation = gl.getAttribLocation(program, 'p');
            gl.enableVertexAttribArray(positionLocation);
            gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

            // Uniforms setup
            const resLocation = gl.getUniformLocation(program, 'u_res');
            const timeLocation = gl.getUniformLocation(program, 'u_time');
            const mouseLocation = gl.getUniformLocation(program, 'u_mouse');

            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;

            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            const resize = () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            };
            
            window.addEventListener('resize', resize);
            resize();

            // Render loop
            const render = (time) => {
                gl.uniform2f(resLocation, canvas.width, canvas.height);
                gl.uniform1f(timeLocation, time);
                gl.uniform2f(mouseLocation, mouseX, mouseY);
                
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            };
            
            requestAnimationFrame(render);
        }
    </script>
</body>
</html>
