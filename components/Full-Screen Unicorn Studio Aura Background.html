<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unicorn Studio Background</title>

  <style>
    /* Reset complet pour le mode plein écran */
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Supprime les barres de défilement */
      background-color: #000;
      /* Fond noir par défaut pendant le chargement */
    }

    /* Le conteneur principal */
    .unicorn-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    /* L'emplacement de l'effet aura */
    .aura-background-component {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div class="unicorn-container">
    <div class="aura-background-component">
      <div data-us-project="PbfL8YshrLU8GjeTZ4HP" style="width: 100%; height: 100%;"></div>
    </div>
  </div>

  <script type="text/javascript">
    !(function() {
      if (!window.UnicornStudio) {
        window.UnicornStudio = { isInitialized: false };
        var i = document.createElement("script");
        i.async = true;
        i.src = "https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v2.1.0-1/dist/unicornStudio.umd.js";
        
        i.onload = function() {
          const initUS = () => {
            if (!window.UnicornStudio.isInitialized && window.UnicornStudio.init) {
              window.UnicornStudio.init();
              window.UnicornStudio.isInitialized = true;
            }
          };

          // Vérifie si le DOM est déjà prêt
          if (document.readyState === "complete" || document.readyState === "interactive") {
            initUS();
          } else {
            document.addEventListener("DOMContentLoaded", initUS);
          }
        };
        (document.head || document.body).appendChild(i);
      }
    })();
  </script>

</body>

</html>
