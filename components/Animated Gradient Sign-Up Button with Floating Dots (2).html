<button type="button" class="button">
  <div class="points_wrapper">
    <i class="point"></i>
    <i class="point"></i>
    <i class="point"></i>
    <i class="point"></i>
    <i class="point"></i>
    <i class="point"></i>
    <i class="point"></i>
    <i class="point"></i>
    <i class="point"></i>
    <i class="point"></i>
  </div>

  <span class="inner">
    Sign Up
    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path d="M5 12h14" class=""></path>
      <path d="m12 5 7 7-7 7" class=""></path>
    </svg>
  </span>
  <style>
    .button {
      cursor: pointer;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: all 0.25s ease;
      background: radial-gradient(65.28% 65.28% at 50% 100%,
          rgba(99, 102, 241, 0.6) 0%,
          rgba(129, 140, 248, 0.3) 50%,
          rgba(99, 102, 241, 0) 100%),
        linear-gradient(135deg, #4338ca, #6366f1, #8b5cf6);
      border-radius: 9999px;
      border: none;
      outline: none;
      padding: 16px 32px;
      min-height: 56px;
      min-width: 160px;
      box-shadow: 0 8px 25px -8px rgba(99, 102, 241, 0.6),
                  0 0 0 1px rgba(255, 255, 255, 0.1);
    }
  
    .button::before,
    .button::after {
      content: "";
      position: absolute;
      transition: all 0.5s ease-in-out;
      z-index: 0;
    }
  
    .button::before {
      inset: 1px;
      background: linear-gradient(135deg,
          rgba(255, 255, 255, 0.2) 0%,
          rgba(255, 255, 255, 0.05) 50%,
          rgba(255, 255, 255, 0) 100%);
      border-radius: 9999px;
    }
  
    .button::after {
      inset: 2px;
      background: radial-gradient(65.28% 65.28% at 50% 100%,
          rgba(99, 102, 241, 0.4) 0%,
          rgba(129, 140, 248, 0.2) 50%,
          rgba(99, 102, 241, 0) 100%),
        linear-gradient(135deg, #4338ca, #6366f1, #8b5cf6);
      border-radius: 9999px;
    }
  
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px -8px rgba(99, 102, 241, 0.8),
                  0 0 0 1px rgba(255, 255, 255, 0.2);
    }
  
    .button:active {
      transform: translateY(-1px) scale(0.98);
    }
  
    .points_wrapper {
      overflow: hidden;
      width: 100%;
      height: 100%;
      pointer-events: none;
      position: absolute;
      z-index: 1;
    }
  
    .points_wrapper .point {
      bottom: -10px;
      position: absolute;
      animation: floating-points infinite ease-in-out;
      pointer-events: none;
      width: 2px;
      height: 2px;
      background-color: #c7d2fe;
      border-radius: 9999px;
      box-shadow: 0 0 4px rgba(199, 210, 254, 0.8);
    }
  
    @keyframes floating-points {
      0% {
        transform: translateY(0);
        opacity: 0.8;
      }
  
      50% {
        opacity: 1;
      }
  
      85% {
        opacity: 0.3;
      }
  
      100% {
        transform: translateY(-60px);
        opacity: 0;
      }
    }
  
    .points_wrapper .point:nth-child(1) {
      left: 15%;
      opacity: 0.9;
      animation-duration: 2.8s;
      animation-delay: 0.3s;
    }
  
    .points_wrapper .point:nth-child(2) {
      left: 25%;
      opacity: 0.7;
      animation-duration: 3.2s;
      animation-delay: 0.7s;
    }
  
    .points_wrapper .point:nth-child(3) {
      left: 35%;
      opacity: 0.8;
      animation-duration: 2.6s;
      animation-delay: 0.2s;
    }
  
    .points_wrapper .point:nth-child(4) {
      left: 50%;
      opacity: 0.6;
      animation-duration: 2.4s;
      animation-delay: 0.1s;
    }
  
    .points_wrapper .point:nth-child(5) {
      left: 60%;
      opacity: 0.9;
      animation-duration: 2.1s;
      animation-delay: 0s;
    }
  
    .points_wrapper .point:nth-child(6) {
      left: 70%;
      opacity: 0.5;
      animation-duration: 2.9s;
      animation-delay: 1.2s;
    }
  
    .points_wrapper .point:nth-child(7) {
      left: 80%;
      opacity: 0.8;
      animation-duration: 2.7s;
      animation-delay: 0.4s;
    }
  
    .points_wrapper .point:nth-child(8) {
      left: 45%;
      opacity: 0.7;
      animation-duration: 3.0s;
      animation-delay: 0.6s;
    }
  
    .points_wrapper .point:nth-child(9) {
      left: 85%;
      opacity: 0.6;
      animation-duration: 2.3s;
      animation-delay: 0.8s;
    }
  
    .points_wrapper .point:nth-child(10) {
      left: 65%;
      opacity: 0.9;
      animation-duration: 2.5s;
      animation-delay: 0.5s;
    }
  
    .inner {
      z-index: 2;
      gap: 8px;
      position: relative;
      width: 100%;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      transition: all 0.2s ease-in-out;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
  
    .inner svg.icon {
      width: 18px;
      height: 18px;
      transition: transform 0.3s ease;
      stroke: #ffffff;
      fill: none;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
    }
  
    .button:hover svg.icon {
      transform: translateX(3px);
    }
  
    .button:hover svg.icon path {
      animation: dash 0.8s linear forwards;
    }
  
    @keyframes dash {
      0% {
        stroke-dasharray: 0, 25;
        stroke-dashoffset: 0;
      }
  
      50% {
        stroke-dasharray: 12, 12;
        stroke-dashoffset: -6;
      }
  
      100% {
        stroke-dasharray: 25, 0;
        stroke-dashoffset: -12;
      }
    }
  </style>
</button>
