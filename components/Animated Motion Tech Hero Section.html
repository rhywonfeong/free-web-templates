<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Motion Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link id="all-fonts-link-font-dm-sans" rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&amp;display=swap">
  <style id="all-fonts-style-font-dm-sans">
    .font-dm-sans {
      font-family: 'DM Sans', sans-serif !important;
    }
  </style>
</head>

<body class="bg-[#050511] text-white overflow-hidden font-sans antialiased selection:bg-blue-600/30">

  <!-- Ambient Mesh Background -->
  <div
    style="position: fixed; inset: 0; z-index: 0; background: radial-gradient(circle at 10% 40%, rgba(26, 32, 140, 0.6) 0%, transparent 60%), radial-gradient(circle at 80% 20%, rgba(40, 50, 180, 0.4) 0%, transparent 50%), radial-gradient(circle at 50% 80%, rgba(60, 90, 255, 0.25) 0%, transparent 60%); filter: blur(80px); pointer-events: none;">
  </div>

  <!-- Dither/Grain Noise Overlay -->
  <div
    style="position: fixed; inset: 0; z-index: 1; opacity: 0.35; mix-blend-mode: overlay; background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.85\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E'); pointer-events: none;">
  </div>

  <!-- WebGL Canvas for Wave Animation -->
  <canvas id="webgl-canvas" class="fixed inset-0 z-10 pointer-events-none w-full h-full"></canvas>

  <!-- Framed Grid Lines -->
  <div class="fixed inset-0 z-20 pointer-events-none flex justify-between px-6 md:px-12 lg:px-24">
    <div class="w-px h-full bg-white/[0.03] relative">
      <div class="absolute top-0 -left-[1px] w-[3px] h-[3px] bg-white/[0.15]"></div>
      <div class="absolute bottom-0 -left-[1px] w-[3px] h-[3px] bg-white/[0.15]"></div>
    </div>
    <div class="w-px h-full bg-white/[0.03] relative">
      <div class="absolute top-0 -left-[1px] w-[3px] h-[3px] bg-white/[0.15]"></div>
      <div class="absolute bottom-0 -left-[1px] w-[3px] h-[3px] bg-white/[0.15]"></div>
    </div>
  </div>

  <!-- Main Content Container -->
  <div class="relative z-30 min-h-screen flex flex-col px-6 md:px-12 lg:px-24 w-full max-w-[1920px] mx-auto">

    <!-- Navigation -->
    <header class="flex items-center justify-between py-8 nav-item-anim opacity-0">
      <!-- Logo -->
      <div class="flex items-center">
        <span class="font-serif font-bold text-3xl tracking-tight text-white drop-shadow-[0_2px_10px_rgba(255,255,255,0.2)] font-sans">lumina</span>
      </div>

      <!-- Nav Links (Desktop) -->
      <nav class="hidden md:flex items-center gap-2">
        <a href="#"
          class="px-5 py-2 rounded-full bg-white/[0.06] border border-white/[0.05] backdrop-blur-md text-sm font-medium text-white/80 hover:text-white hover:bg-white/[0.1] transition-all duration-300 font-sans">Platform</a>
        <a href="#"
          class="px-5 py-2 rounded-full bg-white/[0.06] border border-white/[0.05] backdrop-blur-md text-sm font-medium text-white/80 hover:text-white hover:bg-white/[0.1] transition-all duration-300 font-sans">Ecosystem</a>
        <a href="#"
          class="px-5 py-2 rounded-full bg-white/[0.06] border border-white/[0.05] backdrop-blur-md text-sm font-medium text-white/80 hover:text-white hover:bg-white/[0.1] transition-all duration-300 font-sans">Solutions</a>
        <a href="#"
          class="px-5 py-2 rounded-full bg-white/[0.06] border border-white/[0.05] backdrop-blur-md text-sm font-medium text-white/80 hover:text-white hover:bg-white/[0.1] transition-all duration-300 font-sans">Developers</a>
      </nav>

      <!-- CTA Button -->
      <div class="flex items-center">
        <button class="group pl-5 pr-1.5 py-1.5 bg-white text-black rounded-full flex items-center gap-3 font-semibold text-sm transition-all duration-300 hover:shadow-[0_0_20px_rgba(255,255,255,0.3)] hover:scale-[1.02]">
                    <span class="tracking-tight font-sans">Start Building</span>
                    <div class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center transition-transform duration-300 group-hover:rotate-45 group-hover:bg-blue-500">
                        <iconify-icon icon="solar:arrow-right-up-linear" width="18"></iconify-icon>
                    </div>
                </button>
      </div>
    </header>

    <!-- Hero Section -->
    <main class="flex-grow flex flex-col items-center justify-center -mt-10 md:-mt-20">

      <!-- Giant Typography -->
      <div class="flex items-center justify-center gap-1 md:gap-3 lg:gap-4 w-full max-w-7xl">
        <div class="hero-char opacity-0 translate-y-12 flex-1 flex justify-center">
          <span class="text-[80px] md:text-[140px] lg:text-[220px] font-bold leading-none tracking-tighter text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.15)] font-sans">M</span>
        </div>
        <div class="hero-char opacity-0 translate-y-12 flex-1 flex justify-center">
          <span class="text-[80px] md:text-[140px] lg:text-[220px] font-bold leading-none tracking-tighter text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.15)] font-sans">O</span>
        </div>
        <div class="hero-char opacity-0 translate-y-12 flex-1 flex justify-center">
          <span class="text-[80px] md:text-[140px] lg:text-[220px] font-bold leading-none tracking-tighter text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.15)] font-sans">T</span>
        </div>
        <div class="hero-char opacity-0 translate-y-12 flex-1 flex justify-center">
          <span class="text-[80px] md:text-[140px] lg:text-[220px] font-bold leading-none tracking-tighter text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.15)] font-sans">I</span>
        </div>
        <div class="hero-char opacity-0 translate-y-12 flex-1 flex justify-center">
          <span class="text-[80px] md:text-[140px] lg:text-[220px] font-bold leading-none tracking-tighter text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.15)] font-sans">O</span>
        </div>
        <div class="hero-char opacity-0 translate-y-12 flex-1 flex justify-center">
          <span class="text-[80px] md:text-[140px] lg:text-[220px] font-bold leading-none tracking-tighter text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.15)] font-sans">N</span>
        </div>
      </div>

      <!-- Subtitle with ScrollTrigger Word Reveal -->
      <div class="hero-subtitle mt-10 md:mt-16 text-center px-4 overflow-hidden">
        <h1 class="text-xl md:text-3xl lg:text-4xl tracking-tight font-medium text-white/90">
          <span class="word-reveal inline-block opacity-0 translate-y-6 font-dm-sans font-light">Experience</span>
          <span class="word-reveal inline-block opacity-0 translate-y-6 font-dm-sans font-light">the</span>
          <span class="word-reveal inline-block opacity-0 translate-y-6 font-dm-sans font-light">fluidity</span>
          <span class="word-reveal inline-block opacity-0 translate-y-6 font-dm-sans font-light">of</span>
          <span class="word-reveal inline-block opacity-0 translate-y-6 text-white/40 font-dm-sans font-light">Next-Gen</span>
          <span class="word-reveal inline-block opacity-0 translate-y-6 text-white/40 font-dm-sans font-light">Interfaces</span>
        </h1>
      </div>

    </main>
  </div>

  <script>
    // GSAP Masked Reveal Animations
        document.addEventListener("DOMContentLoaded", (event) => {
            gsap.registerPlugin(ScrollTrigger);

            gsap.to(".nav-item-anim", {
                y: 0,
                opacity: 1,
                duration: 1,
                ease: "power3.out",
                delay: 0.2
            });

            gsap.to(".hero-char", {
                y: 0,
                opacity: 1,
                duration: 1.2,
                stagger: 0.1,
                ease: "expo.out",
                delay: 0.4
            });

            // Staggered Masked Reveal for Subtitle
            gsap.to(".word-reveal", {
                y: 0,
                opacity: 1,
                duration: 1,
                stagger: 0.08,
                ease: "power3.out",
                delay: 1.2,
                scrollTrigger: {
                    trigger: ".hero-subtitle",
                    start: "top 95%"
                }
            });
        });

        // Three.js Background Elements (Procedural Wave Grid)
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        
        // Add deep atmospheric fog matching the background
        scene.fog = new THREE.FogExp2(0x050511, 0.04);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Create the particle wave geometry
        const waveGeometry = new THREE.PlaneGeometry(60, 60, 120, 120);
        const waveMaterial = new THREE.PointsMaterial({
            color: 0x4d7cff,
            size: 0.06,
            transparent: true,
            opacity: 0.7,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const waveMesh = new THREE.Points(waveGeometry, waveMaterial);
        
        // Rotate and position the wave to form a ground plane receding into the horizon
        waveMesh.rotation.x = -Math.PI / 2.2;
        waveMesh.position.y = -6;
        waveMesh.position.z = -15;
        scene.add(waveMesh);

        // Lighting (optional for points, added to future-proof if physical mesh is added)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        camera.position.z = 5;

        // Mouse interaction variables
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX) * 0.001;
            mouseY = (event.clientY - windowHalfY) * 0.001;
        });

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime() * 0.6;

            // Animate wave vertices
            const positions = waveMesh.geometry.attributes.position.array;
            for(let i = 0; i < positions.length; i += 3) {
                const x = positions[i];
                const y = positions[i+1];
                
                // Procedural compound sine wave to create organic liquid motion
                positions[i+2] = Math.sin(x * 0.3 + time) * 1.5 
                               + Math.cos(y * 0.3 + time * 0.8) * 1.5 
                               + Math.sin((x + y) * 0.1 + time * 0.5) * 1.0;
            }
            waveMesh.geometry.attributes.position.needsUpdate = true;

            // Subtle parallax effect matching original camera feel
            targetX = mouseX * 0.6;
            targetY = mouseY * 0.6;
            waveMesh.rotation.y += 0.02 * (targetX - waveMesh.rotation.y);
            waveMesh.rotation.x += 0.02 * (-Math.PI / 2.2 + targetY - waveMesh.rotation.x);

            renderer.render(scene, camera);
        }

        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
  </script>

</body>

</html>
