<div class="flex items-center justify-center min-h-screen w-full"
  style="background-color: #050514; font-family: 'Inter', sans-serif;">
  <style>
    @property --border-angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    @property --shimmer-pos {
      syntax: '<percentage>';
      initial-value: -100%;
      inherits: false;
    }

    @keyframes borderSpin {
      to {
        --border-angle: 360deg;
      }
    }

    @keyframes shimmer {
      to {
        --shimmer-pos: 200%;
      }
    }

    .btn-conic {
      --accent: #f59e0b;
      --pink: #f97316;
      --gold: #fde68a;
      --accent3: #fb923c;
      --bg: #050514;

      position: relative;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 0.84rem;
      font-weight: 500;
      color: white;
      background: var(--bg);
      z-index: 1;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
      border: none;
      outline: none;
    }

    .btn-conic::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 14px;
      background: conic-gradient(from var(--border-angle),
          var(--accent),
          var(--pink),
          var(--gold),
          var(--accent3),
          var(--accent));
      z-index: -2;
      animation: borderSpin 3s linear infinite;
    }

    .btn-conic::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(5, 5, 20, 0.95));
      z-index: -1;
    }

    .btn-conic .shimmer-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.08) 50%, transparent 100%);
      animation: shimmer 2.5s ease-in-out infinite;
      background-size: 200% 100%;
      background-position: var(--shimmer-pos) center;
      pointer-events: none;
    }

    .btn-conic:hover {
      transform: translateY(-2px);
    }
  </style>

  <!-- Container for the single button -->
  <div class="relative">
    <button class="btn-conic">
      <span class="shimmer-layer"></span>
      <span style="position: relative; z-index: 2;">Start Building Free</span>
    </button>
  </div>

  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" async></script>
</div>
