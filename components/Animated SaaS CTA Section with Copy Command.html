<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenith Component — CTA Section</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" async></script>
<style>
/* ============================================
   TOKENS
   ============================================ */
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}
:root {
  --bg: #050510;
  --bg-alt: #080814;
  --bg-card: rgba(255,255,255,0.04);
  --surface: rgba(255,255,255,0.04);
  --surface-2: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.06);
  --border-2: rgba(255,255,255,0.10);
  --text: #e8edf3;
  --text-2: #94a3b8;
  --text-3: #4b5e78;
  --blue: #2563eb;
  --blue-light: #3b82f6;
  --cyan: #0ea5e9;
  --cyan-light: #38bdf8;
  --sky: #7dd3fc;
  --grad-text: linear-gradient(135deg, #38bdf8 0%, #3b82f6 50%, #60a5fa 100%);
  --grad-border: linear-gradient(135deg, rgba(37,99,235,0.4), rgba(14,165,233,0.15), transparent 70%);
  --grad-cta: linear-gradient(135deg, #0ea5e9, #2563eb);
  --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  --r: 12px;
  --r-lg: 16px;
  --r-xl: 24px;
}

/* ============================================
   RESET & BASE
   ============================================ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.55;
  overflow-x: hidden;
}
/* Custom selection */
::selection { background: rgba(59,130,246,0.3); color: #fff; }
/* Custom scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }
/* Focus-visible for keyboard accessibility */
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 4px; }
.skip-link {
  position: absolute;
  top: -100%;
  left: 16px;
  z-index: 10000;
  padding: 8px 16px;
  background: var(--cyan);
  color: #fff;
  border-radius: 4px;
  font-size: 0.85rem;
}
.skip-link:focus { top: 12px; }
/* Subtle grain texture overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: var(--noise);
  opacity: 0.03;
  pointer-events: none;
  z-index: 9999;
  mix-blend-mode: overlay;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; border: none; cursor: pointer; background: none; color: inherit; }
ul { list-style: none; }
h1, h2, h3, h4, h5, h6 { font-family: 'Outfit', sans-serif; font-weight: 200; line-height: 1.1; letter-spacing: -0.03em; text-wrap: balance; }

/* ============================================
   LAYOUT
   ============================================ */
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.container-sm { max-width: 800px; margin: 0 auto; padding: 0 24px; }

/* ============================================
   TYPOGRAPHY
   ============================================ */
.text-gradient {
  background: var(--grad-text);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.text-mono {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8em;
  letter-spacing: 0.05em;
}
.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--blue-light);
  margin-bottom: 10px;
  font-weight: 500;
}
.section-title {
  font-size: clamp(1.6rem, 3vw, 2.2rem);
  font-weight: 200;
  letter-spacing: -0.035em;
  margin-bottom: 10px;
  line-height: 1.08;
}
.section-desc {
  color: var(--text-2);
  font-size: 0.88rem;
  max-width: 480px;
  line-height: 1.55;
  font-weight: 300;
  text-wrap: balance;
}
.section-header { margin-bottom: 36px; }
.section-header--center { text-align: center; }
.section-header--center .section-desc { margin: 0 auto; }

/* ============================================
   BUTTONS
   ============================================ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 18px;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 400;
  transition: all 0.3s ease;
  position: relative;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.btn-primary {
  background: var(--grad-cta);
  color: #fff;
  box-shadow: 0 0 24px rgba(59,130,246,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
}
.btn-primary:hover {
  box-shadow: 0 0 40px rgba(59,130,246,0.4), inset 0 1px 0 rgba(255,255,255,0.15);
  transform: translateY(-1px);
}
.btn-primary:active { transform: translateY(0); box-shadow: 0 0 16px rgba(59,130,246,0.2); }
.btn-ghost {
  background: var(--surface);
  border: 1px solid var(--border-2);
  color: var(--text);
  backdrop-filter: blur(12px);
}
.btn-ghost:hover {
  background: var(--surface-2);
  border-color: rgba(255,255,255,0.18);
}
.btn-ghost:active { transform: scale(0.98); }
.btn iconify-icon { font-size: 1.1em; }

/* --- Nav Get Started: pill with pulse glow --- */
.nav__actions .btn-primary {
  border-radius: 50px;
  padding: 8px 20px;
  background: linear-gradient(135deg, var(--cyan), var(--blue));
  box-shadow: 0 0 16px rgba(14,165,233,0.3);
  animation: nav-btn-glow 3s ease-in-out infinite;
}
@keyframes nav-btn-glow {
  0%, 100% { box-shadow: 0 0 16px rgba(14,165,233,0.3); }
  50% { box-shadow: 0 0 28px rgba(14,165,233,0.5), 0 0 8px rgba(56,189,248,0.2); }
}
.nav__actions .btn-primary:hover {
  box-shadow: 0 0 36px rgba(14,165,233,0.5);
  transform: translateY(-1px);
}
.nav__actions .btn-ghost { border-radius: 50px; }

/* ============================================
   GLASS CARD
   ============================================ */
.glass {
  background: rgba(12,12,30,0.8);
  border: 1px solid var(--border-2);
  border-radius: var(--r-lg);
  transition: border-color 0.3s ease;
}
.glass:hover { border-color: rgba(255,255,255,0.15); }

/* ============================================
   GRADIENT BORDER CARD
   ============================================ */
.grad-border {
  position: relative;
  background: var(--bg-card);
  border-radius: var(--r-lg);
  border: 1px solid transparent;
}
.grad-border::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: var(--r-lg);
  padding: 1px;
  background: var(--grad-border);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.4s ease;
}
.grad-border:hover::before { opacity: 1; }

/* ============================================
   ANIMATED CONIC BORDER
   ============================================ */
.conic-border {
  position: relative;
  border-radius: var(--r-lg);
  overflow: hidden;
}
.conic-border::before {
  content: '';
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  background: conic-gradient(from var(--angle), transparent 30%, var(--cyan) 48%, var(--blue) 52%, transparent 70%);
  animation: conic-spin 4s linear infinite;
  z-index: -1;
}
.conic-border::after {
  content: '';
  position: absolute;
  inset: 1px;
  border-radius: calc(var(--r-lg) - 1px);
  background: var(--bg-alt);
  z-index: -1;
}
@keyframes conic-spin { to { --angle: 360deg; } }

/* ============================================
   REVEAL ANIMATIONS
   ============================================ */
.reveal {
  opacity: 0;
  transform: translateY(32px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal.is-visible {
  opacity: 1;
  transform: translateY(0);
}
.reveal-scale {
  opacity: 0;
  transform: scale(0.95);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal-scale.is-visible {
  opacity: 1;
  transform: scale(1);
}
.stagger-up .reveal-child {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.stagger-up.is-visible .reveal-child {
  opacity: 1;
  transform: translateY(0);
}
.stagger-up.is-visible .reveal-child:nth-child(1) { transition-delay: 0ms; }
.stagger-up.is-visible .reveal-child:nth-child(2) { transition-delay: 80ms; }
.stagger-up.is-visible .reveal-child:nth-child(3) { transition-delay: 160ms; }
.stagger-up.is-visible .reveal-child:nth-child(4) { transition-delay: 240ms; }
.stagger-up.is-visible .reveal-child:nth-child(5) { transition-delay: 320ms; }
.stagger-up.is-visible .reveal-child:nth-child(6) { transition-delay: 400ms; }
.stagger-up.is-visible .reveal-child:nth-child(7) { transition-delay: 480ms; }
.stagger-up.is-visible .reveal-child:nth-child(8) { transition-delay: 560ms; }


/* ============================================
   CTA — TERMINAL INSTALL
   ============================================ */
.cta-section {
  padding: 100px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  text-align: center;
  overflow: hidden;
  background: var(--bg-alt);
}
/* Animated orbs — visible movement */
.cta-section::before {
  content: '';
  position: absolute;
  top: -10%;
  left: 5%;
  width: 450px;
  height: 450px;
  background: radial-gradient(circle, rgba(14,165,233,0.22), rgba(14,165,233,0.06) 45%, transparent 70%);
  border-radius: 50%;
  filter: blur(60px);
  pointer-events: none;
  animation: cta-orb-a 6s ease-in-out infinite alternate;
}
.cta-section::after {
  content: '';
  position: absolute;
  bottom: -15%;
  right: 0%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(37,99,235,0.2), rgba(37,99,235,0.05) 45%, transparent 70%);
  border-radius: 50%;
  filter: blur(70px);
  pointer-events: none;
  animation: cta-orb-b 8s ease-in-out infinite alternate;
}
@keyframes cta-orb-a {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(120px, 60px) scale(1.3); }
  100% { transform: translate(-40px, 80px) scale(0.9); }
}
@keyframes cta-orb-b {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-100px, -70px) scale(1.25); }
  100% { transform: translate(60px, -40px) scale(0.95); }
}
/* Center glow — bright focal point */
.cta-section__glow {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 700px;
  height: 400px;
  background: radial-gradient(ellipse, rgba(14,165,233,0.12) 0%, rgba(37,99,235,0.05) 40%, transparent 65%);
  pointer-events: none;
}
/* Grid dot overlay — more visible */
.cta-section__grid {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0);
  background-size: 32px 32px;
  pointer-events: none;
  mask-image: radial-gradient(ellipse at center, black 40%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 75%);
}
/* Top/bottom gradient borders — brighter */
.cta-section__border-top,
.cta-section__border-bottom {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(14,165,233,0.25) 30%, rgba(37,99,235,0.2) 70%, transparent);
  pointer-events: none;
}
.cta-section__border-top { top: 0; }
.cta-section__border-bottom { bottom: 0; }
.cta-section__content { position: relative; z-index: 1; }
.cta-section__title {
  font-size: clamp(1.6rem, 3.5vw, 2.4rem);
  font-weight: 200;
  letter-spacing: -0.03em;
  margin-bottom: 10px;
  line-height: 1.1;
}
.cta-section__desc {
  color: var(--text-2);
  font-size: 0.85rem;
  max-width: 400px;
  margin: 0 auto 20px;
  line-height: 1.65;
  font-weight: 300;
}
.cta-terminal {
  max-width: 480px;
  margin: 0 auto 32px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border-2);
  text-align: left;
}
.cta-terminal__bar {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid var(--border);
  gap: 6px;
}
.cta-terminal__bar span {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
}
.cta-terminal__body {
  padding: 16px 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  color: var(--text-2);
  background: rgba(5,5,16,0.9);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.cta-terminal__copy {
  cursor: pointer;
  color: var(--text-3);
  transition: color 0.2s;
  background: none;
  border: none;
  padding: 4px;
}
.cta-terminal__copy:hover { color: var(--text); }
.cta-section__actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

@media (max-width: 1024px) {
  .footer__grid { grid-template-columns: repeat(2, 1fr); }
  .capabilities__layout { grid-template-columns: 1fr; }
  .capabilities__tabs { flex-direction: row; overflow-x: auto; gap: 8px; padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
  .cap-tab { white-space: nowrap; flex-shrink: 0; }
  .comparison__grid { grid-template-columns: 1fr; max-width: 480px; margin: 0 auto; }
}
@media (max-width: 768px) {
  .nav__links { display: none; }
  .nav__actions { display: none; }
  .nav__toggle { display: flex; }
  .nav.is-open .nav__links {
    display: flex;
    flex-direction: column;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: rgba(5,5,16,0.95);
    backdrop-filter: blur(20px);
    padding: 24px;
    gap: 20px;
    border-bottom: 1px solid var(--border);
  }
  .footer__grid { grid-template-columns: 1fr; gap: 32px; }
  .footer__bottom { flex-direction: column; gap: 16px; text-align: center; }
  .page-hero__title { font-size: clamp(1.6rem, 5vw, 2.2rem); }
  .arch__canvas { height: 320px; }
  .arch__node { min-width: 110px; padding: 10px 12px; }
  .arch__core { width: 80px; height: 80px; }
  .arch__core-inner { width: 48px; height: 48px; font-size: 1.1rem; }
  .cap-tiles { grid-template-columns: 1fr; }
  .comparison__stats { gap: 20px; flex-direction: column; align-items: center; }
}
@media (max-width: 480px) {
  .container { padding: 0 16px; }
  .cap-panel__visual { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .reveal, .reveal-scale, .stagger-up .reveal-child {
    opacity: 1 !important;
    transform: none !important;
  }
}
</style></head>
<body>
<!-- ==================== CTA ==================== -->
<section class="cta-section">
  <div class="cta-section__border-top"></div>
  <div class="cta-section__border-bottom"></div>
  <div class="cta-section__grid"></div>
  <div class="cta-section__glow"></div>
  <div class="container">
    <div class="cta-section__content reveal">
      <h2 class="cta-section__title">Ready to build the<br><span class="text-gradient">future of intelligence?</span></h2>
      <p class="cta-section__desc">Get started in seconds. No credit card required.</p>

      <div class="cta-terminal">
        <div class="cta-terminal__bar"><span></span><span></span><span></span></div>
        <div class="cta-terminal__body">
          <span><span class="t-prompt">$</span> npx create-zenith-app my-project<span class="t-cursor"></span></span>
          <button class="cta-terminal__copy" aria-label="Copy command">
            <iconify-icon icon="lucide:copy" width="14"></iconify-icon>
          </button>
        </div>
      </div>

      <div class="cta-section__actions">
        <a href="login.html" class="btn btn-primary">
          Start Building Free
          <iconify-icon icon="lucide:arrow-right"></iconify-icon>
        </a>
        <a href="contact.html" class="btn btn-ghost">Talk to an Expert</a>
      </div>

      <div style="display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:32px;">
        <span style="display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--text-3);"><iconify-icon icon="lucide:credit-card" style="color:var(--text-3);"></iconify-icon> No credit card required</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--text-3);"><iconify-icon icon="lucide:clock" style="color:var(--text-3);"></iconify-icon> Deploy in under 60s</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--text-3);"><iconify-icon icon="lucide:shield-check" style="color:var(--text-3);"></iconify-icon> SOC 2 compliant</span>
        <span style="display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--text-3);"><iconify-icon icon="lucide:headphones" style="color:var(--text-3);"></iconify-icon> 24/7 support</span>
      </div>
    </div>
  </div>
</section>
<script>
const revealEls=document.querySelectorAll('.reveal,.reveal-scale,.stagger-up');
const observer=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('is-visible');observer.unobserve(x.target)}})},{threshold:0.15,rootMargin:'0px 0px -40px 0px'});
revealEls.forEach(el=>observer.observe(el));
const copyBtn=document.querySelector('.cta-terminal__copy');
if(copyBtn){copyBtn.addEventListener('click',()=>{navigator.clipboard.writeText('npx create-zenith-app my-project').then(()=>{
const i=copyBtn.querySelector('iconify-icon');i.setAttribute('icon','lucide:check');setTimeout(()=>i.setAttribute('icon','lucide:copy'),2000)})})}
</script>
</body>
</html>
