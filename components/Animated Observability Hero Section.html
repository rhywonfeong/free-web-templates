<section
    class="antialiased bg-gray-950 text-gray-300 font-sans selection:bg-white/10 selection:text-white min-h-screen flex flex-col overflow-x-hidden relative">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { gray: { 950: '#030303', 900: '#0a0a0a', 800: '#171717', 700: '#262626', 400: '#888888', 300: '#a3a3a3', 200: '#e5e5e5' } }
                }
            }
        }
    </script>

    <div
        class="w-full max-w-[1400px] mx-auto min-h-screen flex flex-col relative bg-[radial-gradient(ellipse_at_top,rgba(255,255,255,0.02)_0%,transparent_100%)]">
        <div class="flex-1 flex flex-col p-4 sm:p-6 lg:p-10 pb-10">
            <div class="relative flex-1 w-full rounded-3xl overflow-hidden flex flex-col items-center justify-center min-h-[600px] group"
                style="background: linear-gradient(#0a0a0a, #0a0a0a) padding-box, linear-gradient(180deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.02) 100%) border-box; border: 1px solid transparent;">

                <!-- Effects Layers -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10 overflow-hidden">
                    <div
                        class="w-[60vw] max-w-[600px] aspect-square bg-blue-500/10 rounded-full blur-[120px] mix-blend-screen opacity-70">
                    </div>
                    <div
                        class="absolute w-[30vw] max-w-[300px] aspect-square bg-indigo-500/10 rounded-full blur-[80px] mix-blend-screen opacity-50 translate-y-10">
                    </div>
                </div>

                <div id="sculpture-container"
                    class="absolute top-1/2 right-[-15vw] md:right-[-5vw] -translate-y-1/2 z-10 w-[70vw] md:w-[50vw] h-[150vh] origin-right pointer-events-none mix-blend-screen opacity-60">
                </div>
                <div id="sparkles-container"
                    class="absolute top-1/2 right-[-15vw] md:right-[-5vw] -translate-y-1/2 z-20 pointer-events-none mix-blend-screen">
                </div>

                <!-- Content Area -->
                <main
                    class="relative z-40 flex-1 flex flex-col items-center justify-center text-center px-6 w-full max-w-5xl mx-auto pointer-events-none">
                    <a href="#"
                        class="pointer-events-auto inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-normal text-gray-300 mb-8 hover:bg-white/[0.08] transition-all backdrop-blur-md"
                        style="background: linear-gradient(#111, #111) padding-box, linear-gradient(90deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%) border-box; border: 1px solid transparent;">
                        <span class="flex h-1.5 w-1.5 relative">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-blue-500"></span>
                        </span>
                        Observability Core v4.0 is online
                        <iconify-icon icon="solar:alt-arrow-right-linear" class="text-xs text-gray-400"></iconify-icon>
                    </a>

                    <h1 id="hero-title"
                        class="pointer-events-auto text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-normal tracking-tight text-white mb-6 leading-[1.05] max-w-4xl"
                        style="text-shadow: 0 4px 40px rgba(0,0,0,0.5);"></h1>

                    <p class="text-sm md:text-base text-gray-400 mb-10 max-w-2xl leading-relaxed font-normal opacity-0"
                        id="hero-subtitle">
                        A dimensional observability engine that turns tangled microservices, databases, and edge
                        networks into a live architectural map. Move beyond logs and truly observe your stack.
                    </p>

                    <div class="pointer-events-auto flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto opacity-0"
                        id="hero-actions">
                        <button class="w-full sm:w-auto px-6 py-3 rounded-xl bg-white text-gray-950 font-semibold text-sm hover:bg-gray-200 transition-all active:scale-95 shadow-[0_0_30px_rgba(255,255,255,0.15)] flex items-center justify-center gap-2.5">
                            <iconify-icon icon="solar:rocket-linear" class="text-base"></iconify-icon> Launch Environment
                        </button>
                        <button class="w-full sm:w-auto px-6 py-3 rounded-xl bg-gray-900/40 text-white font-normal text-sm hover:bg-gray-800/60 transition-all backdrop-blur-md flex items-center justify-center gap-2.5"
                            style="background: linear-gradient(rgba(20,20,20,0.4), rgba(20,20,20,0.4)) padding-box, linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%) border-box; border: 1px solid transparent;">
                            <iconify-icon icon="solar:document-text-linear" class="text-base text-gray-400"></iconify-icon> View API Docs
                        </button>
                    </div>
                </main>

                <div
                    class="absolute bottom-0 left-0 right-0 h-40 bg-gradient-to-t from-gray-900 to-transparent z-20 pointer-events-none rounded-b-3xl">
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            gsap.registerPlugin(ScrollTrigger);
            const titleEl = document.getElementById('hero-title');
            const titleText = "Map your entire infrastructure with pinpoint accuracy.";
            titleEl.innerHTML = titleText.split(' ').map(word => `<span class="inline-block overflow-hidden pb-2 -mb-2 align-bottom"><span class="reveal-word inline-block translate-y-full opacity-0 will-change-transform">${word}</span></span>`).join(' ');

            const tl = gsap.timeline({ scrollTrigger: { trigger: "#hero-title", start: "top 90%" } });
            tl.to('.reveal-word', { y: '0%', opacity: 1, duration: 1.2, ease: 'power4.out', stagger: 0.08 })
              .to(['#hero-subtitle', '#hero-actions'], { opacity: 1, y: 0, duration: 1, ease: 'power3.out', stagger: 0.2 }, "-=0.8");

            const sculptureContainer = document.getElementById('sculpture-container');
            const numBlades = 42;
            for (let i = 0; i < numBlades; i++) {
                const blade = document.createElement('div');
                blade.className = 'absolute top-1/2 right-0 origin-right blade opacity-0';
                blade.style.width = window.innerWidth > 768 ? '45vw' : '75vw';
                blade.style.height = '6vw'; blade.style.minHeight = '35px';
                blade.style.borderRadius = '100% 0 0 100% / 50% 0 0 50%';
                const progress = i / (numBlades - 1);
                const angle = -85 + (progress * 170);
                gsap.set(blade, { yPercent: -50, rotation: angle, zIndex: i });
                blade.style.background = `linear-gradient(to bottom, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 8%, rgba(0,0,0,0) 85%, rgba(0,0,0,0.8) 100%), linear-gradient(to right, #dbeafe 0%, #3b82f6 15%, #1d4ed8 45%, #0f172a 80%, #020617 100%)`;
                blade.style.boxShadow = `0px 18px 45px -8px rgba(0,0,0,0.95), inset 0px 2px 4px rgba(255, 255, 255, 0.4), inset 0px -4px 12px rgba(0, 0, 0, 0.9)`;
                sculptureContainer.appendChild(blade);
            }

            gsap.to('.blade', { opacity: 1, duration: 2.5, stagger: { amount: 1.8, from: "center" }, ease: 'power2.out', delay: 0.2 });
            gsap.to(sculptureContainer, { rotation: -4, duration: 16, repeat: -1, yoyo: true, ease: 'sine.inOut' });
            gsap.utils.toArray('.blade').forEach((blade, index) => {
                gsap.to(blade, { rotation: `+=${2 + (index % 2.5)}`, scaleX: 1.015 + (index % 3) * 0.005, duration: 5 + (index % 3), repeat: -1, yoyo: true, ease: 'sine.inOut', delay: index * 0.06 });
            });

            const sparklesContainer = document.getElementById('sparkles-container');
            function emitSparkle() {
                if (!sparklesContainer) return;
                const sparkle = document.createElement('div');
                const size = Math.random() * 2 + 1;
                sparkle.className = 'absolute rounded-full bg-blue-100 will-change-transform';
                sparkle.style.cssText = `width:${size}px; height:${size}px; box-shadow:0 0 ${size * 3}px rgba(96, 165, 250, 0.9);`;
                gsap.set(sparkle, { xPercent: -50, yPercent: -50, x: 0, y: 0, opacity: 0, scale: 0 });
                sparklesContainer.appendChild(sparkle);
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 250 + 80;
                const duration = Math.random() * 3 + 2;
                gsap.to(sparkle, { x: Math.cos(angle) * distance, y: Math.sin(angle) * distance, scale: Math.random() * 1.5 + 0.5, duration: duration, ease: 'power1.out', onComplete: () => sparkle.remove() });
                gsap.to(sparkle, { opacity: Math.random() * 0.7 + 0.3, duration: duration * 0.3, ease: 'power2.out', yoyo: true, repeat: 1 });
            }
            setInterval(emitSparkle, 120);
        });
    </script>
</section>
