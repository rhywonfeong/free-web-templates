<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scrolling Company Strip</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap');

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #030303;
    }
  </style>
</head>

<body class="bg-[#030303] text-zinc-400 antialiased overflow-x-hidden">

  <!-- Scrolling Company Strip -->
  <section class="py-24 relative">
    <div class="max-w-[1200px] mx-auto px-6 mb-10 text-center flex flex-col items-center gap-3">
      <div class="text-base md:text-lg font-light tracking-[0.15em] uppercase text-white">
        Trusted by leading revenue teams
      </div>
      <div
        class="text-xs md:text-sm font-light tracking-widest text-emerald-400 uppercase drop-shadow-[0_0_2px_rgba(16,185,129,0.5)]">
        Active in 500,000+ networks
      </div>
    </div>

    <div class="relative w-screen left-1/2 -translate-x-1/2 overflow-hidden">
      <div
        class="absolute top-0 left-0 w-24 md:w-40 h-full bg-gradient-to-r from-[#030303] to-transparent z-20 pointer-events-none">
      </div>
      <div
        class="absolute top-0 right-0 w-24 md:w-40 h-full bg-gradient-to-l from-[#030303] to-transparent z-20 pointer-events-none">
      </div>

      <div id="logo-marquee-track"
        class="flex w-max items-center opacity-40 grayscale hover:grayscale-0 hover:opacity-80 transition-all duration-500 mix-blend-screen text-zinc-300">
        <div class="flex items-center gap-x-12 pr-12">
          <span class="text-xl md:text-2xl font-light tracking-tight font-serif italic">
            AUTODESK
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tighter flex items-center gap-1">
            <iconify-icon icon="solar:soundwave-linear" class="text-xl md:text-2xl" stroke-width="1.5"></iconify-icon>
            Dolby
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tight flex items-center gap-1">
            <iconify-icon icon="solar:global-linear" class="text-xl md:text-2xl" stroke-width="1.5"></iconify-icon>
            SMARTLING
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tight italic">
            Reddit
          </span>
          <span class="text-xl md:text-2xl font-light tracking-widest">
            ANTHROPIC
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tight">
            DocuSign
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tight">
            Vercel
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tight">
            Atlassian
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tight">
            HubSpot
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tighter">
            Shopify
          </span>
        </div>

        <div class="flex items-center gap-x-12 pr-12" aria-hidden="true">
          <span class="text-xl md:text-2xl font-light tracking-tight font-serif italic">
            AUTODESK
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tighter flex items-center gap-1">
            <iconify-icon icon="solar:soundwave-linear" class="text-xl md:text-2xl" stroke-width="1.5"></iconify-icon>
            Dolby
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tight flex items-center gap-1">
            <iconify-icon icon="solar:global-linear" class="text-xl md:text-2xl" stroke-width="1.5"></iconify-icon>
            SMARTLING
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tight italic">
            Reddit
          </span>
          <span class="text-xl md:text-2xl font-light tracking-widest">
            ANTHROPIC
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tight">
            DocuSign
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tight">
            Vercel
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tight">
            Atlassian
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tight">
            HubSpot
          </span>
          <span class="text-xl md:text-2xl font-light tracking-tighter">
            Shopify
          </span>
        </div>
      </div>
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const logoTrack = document.getElementById('logo-marquee-track');

      if (logoTrack && !prefersReducedMotion) {
        logoTrack.animate(
          [
            { transform: 'translateX(0)' },
            { transform: 'translateX(-50%)' }
          ],
          {
            duration: 60000,
            iterations: Infinity,
            easing: 'linear'
          }
        );
      }
    });
  </script>
</body>

</html>
