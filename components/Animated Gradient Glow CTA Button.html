<div class="relative inline-block">
    <!-- Dependency Loader -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <div class="relative group cursor-pointer">
        <!-- Animated Glow Effect -->
        <div class="absolute -inset-1 bg-gradient-to-r from-orange-500 via-amber-400 to-red-500 rounded-full blur-xl opacity-60 group-hover:opacity-100 transition duration-500"
            style="will-change: opacity, filter;">
        </div>

        <!-- Main Button Surface -->
        <div
            class="relative bg-gradient-to-b from-white to-[#e5e5e5] text-black px-8 py-3.5 rounded-full flex items-center gap-2 shadow-[0_0_0_1px_rgba(255,255,255,0.5)] active:scale-95 transition-transform duration-200">

            <span class="text-sm font-semibold tracking-wide uppercase">
                Launch Workspace
            </span>

            <!-- Icon with Hover Translation -->
            <iconify-icon icon="solar:arrow-right-linear" width="18"
                class="transition-transform duration-300 group-hover:translate-x-1">
            </iconify-icon>
        </div>
    </div>
</div>
