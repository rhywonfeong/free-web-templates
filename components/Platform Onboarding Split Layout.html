<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        @keyframes float-soft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
        @keyframes float-soft-reverse {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }
        .animate-float {
            animation: float-soft 7s ease-in-out infinite;
        }
        .animate-float-reverse {
            animation: float-soft-reverse 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-[#f4f2ee] font-sans antialiased text-stone-800 min-h-screen flex items-center justify-center p-4 sm:p-8 md:p-12 selection:bg-orange-100 selection:text-orange-900">

    <main class="w-full max-w-[1100px] mx-auto bg-[#fcfbfa] rounded-[2rem] md:rounded-[2.5rem] shadow-[0_24px_80px_-24px_rgba(234,88,12,0.08)] border border-[#ebe7e0] flex flex-col lg:flex-row overflow-hidden relative z-10">
        
        <!-- Left Panel: Form & Actions -->
        <section class="w-full lg:w-3/5 p-8 md:p-12 lg:p-16 flex flex-col justify-center relative z-20">
            
            <!-- Progress Signal -->
            <div class="flex items-center gap-2.5 mb-8">
                <div class="flex gap-1.5">
                    <div class="w-6 h-1 rounded-full bg-[#ebe7e0]"></div>
                    <div class="w-6 h-1 rounded-full bg-orange-500"></div>
                    <div class="w-6 h-1 rounded-full bg-[#ebe7e0]"></div>
                </div>
                <span class="text-xs font-medium tracking-wide text-orange-600 uppercase ml-2">Setup • Step 2</span>
            </div>

            <!-- Header -->
            <h1 class="text-3xl md:text-4xl lg:text-5xl font-normal tracking-tight text-stone-900 mb-4 leading-[1.15]">
                Establish your baseline
            </h1>
            <p class="text-base text-stone-500 font-light mb-10 leading-relaxed max-w-md">
                Configure how the engine interprets your delivery. We will tailor the real-time feedback model to your primary communication environment.
            </p>

            <!-- Selection Form Area -->
            <div class="flex flex-col gap-4 mb-10 w-full max-w-lg">
                
                <!-- Active Option Card -->
                <label class="group relative bg-[#fffdfb] border border-orange-200 rounded-2xl p-5 shadow-[0_8px_30px_-12px_rgba(234,88,12,0.12)] ring-1 ring-orange-500/10 cursor-pointer flex items-start gap-4 transition-all hover:shadow-[0_8px_30px_-12px_rgba(234,88,12,0.18)]">
                    <div class="w-5 h-5 rounded-full border-[5px] border-orange-500 bg-white flex-shrink-0 mt-0.5 shadow-sm"></div>
                    <div class="flex-1">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="text-base font-medium text-stone-800 tracking-tight">Executive Briefings</h3>
                            <iconify-icon icon="solar:microphone-3-linear" style="stroke-width: 1.5;" class="text-xl text-orange-500"></iconify-icon>
                        </div>
                        <p class="text-sm text-stone-500 font-light leading-relaxed">
                            Optimize for concise, high-impact delivery and absolute certainty in boardroom settings.
                        </p>
                    </div>
                </label>

                <!-- Inactive Option Card -->
                <label class="group relative bg-[#f9f8f5] hover:bg-white border border-[#ebe7e0] hover:border-[#e0dcd4] rounded-2xl p-5 shadow-sm cursor-pointer flex items-start gap-4 transition-all hover:shadow-md">
                    <div class="w-5 h-5 rounded-full border border-[#d8d3cc] bg-white flex-shrink-0 mt-0.5 group-hover:border-orange-300 transition-colors"></div>
                    <div class="flex-1">
                        <div class="flex items-center justify-between mb-1">
                            <h3 class="text-base font-normal text-stone-700 tracking-tight group-hover:text-stone-900 transition-colors">Public Presentations</h3>
                            <iconify-icon icon="solar:users-group-rounded-linear" style="stroke-width: 1.5;" class="text-xl text-stone-400 group-hover:text-stone-600 transition-colors"></iconify-icon>
                        </div>
                        <p class="text-sm text-stone-500 font-light leading-relaxed">
                            Focus on volume modulation, cadence variations, and sustained audience engagement metrics.
                        </p>
                    </div>
                </label>

            </div>

            <!-- Primary CTA -->
            <button class="bg-orange-500 hover:bg-orange-600 text-white text-sm font-medium px-7 py-3.5 rounded-xl transition-all shadow-[0_6px_20px_-6px_rgba(234,88,12,0.4)] hover:shadow-[0_8px_24px_-6px_rgba(234,88,12,0.5)] hover:-translate-y-0.5 flex items-center justify-center w-full sm:w-max gap-2.5">
                Proceed to calibration
                <iconify-icon icon="solar:arrow-right-linear" style="stroke-width: 1.5;" class="text-lg"></iconify-icon>
            </button>

        </section>

        <!-- Right Panel: Visual Product Demonstration -->
        <aside class="w-full lg:w-2/5 bg-[#f0eee9] border-t lg:border-t-0 lg:border-l border-[#ebe7e0] relative flex items-center justify-center p-8 lg:p-12 min-h-[400px] lg:min-h-auto overflow-hidden">
            
            <!-- Ambient Background Effects -->
            <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,#fcfbfa_0%,transparent_60%)] opacity-70"></div>
            <div class="absolute inset-0 opacity-[0.04]" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 20px 20px;"></div>

            <!-- Floating Illustration Container -->
            <div class="relative w-full max-w-[280px]">
                
                <!-- Main Product Card -->
                <div class="relative z-10 bg-white/95 backdrop-blur-xl rounded-2xl shadow-[0_16px_40px_-12px_rgba(120,110,100,0.15)] border border-white p-6 animate-float">
                    
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-orange-500 shadow-[0_0_8px_rgba(234,88,12,0.5)]"></div>
                            <span class="text-xs font-medium text-stone-800">Vocal Clarity Index</span>
                        </div>
                        <iconify-icon icon="solar:soundwave-circle-linear" style="stroke-width: 1.5;" class="text-stone-400 text-lg"></iconify-icon>
                    </div>

                    <!-- Abstract Chart Area -->
                    <div class="flex items-end justify-between h-20 gap-1.5 mb-5 border-b border-[#f4f2ee] pb-2">
                        <div class="w-full bg-[#f4f2ee] rounded-t-sm h-[30%]"></div>
                        <div class="w-full bg-[#f4f2ee] rounded-t-sm h-[50%]"></div>
                        <div class="w-full bg-[#f4f2ee] rounded-t-sm h-[40%]"></div>
                        <div class="w-full bg-[#f4f2ee] rounded-t-sm h-[75%]"></div>
                        <!-- Active Orange Bar -->
                        <div class="w-full bg-orange-400 rounded-t-sm h-[95%] shadow-[0_0_12px_rgba(234,88,12,0.3)] relative">
                            <div class="absolute -top-2.5 left-1/2 -translate-x-1/2 bg-stone-800 text-white text-[10px] py-0.5 px-1.5 rounded-[4px] font-medium tracking-wide">94</div>
                        </div>
                        <div class="w-full bg-[#f4f2ee] rounded-t-sm h-[60%]"></div>
                        <div class="w-full bg-[#f4f2ee] rounded-t-sm h-[45%]"></div>
                    </div>

                    <div class="flex items-center justify-between">
                        <span class="text-xs text-stone-400 font-light">Analyzing cadence...</span>
                        <span class="text-xs text-stone-700 font-medium tracking-tight">Optimal</span>
                    </div>

                </div>

                <!-- Floating Insight Badge -->
                <div class="absolute -left-6 lg:-left-12 bottom-8 z-20 bg-white/90 backdrop-blur-md rounded-xl shadow-[0_8px_24px_-8px_rgba(100,90,80,0.12)] border border-[#ebe7e0] p-3.5 flex items-center gap-3 w-max max-w-[200px] animate-float-reverse">
                    <div class="w-8 h-8 rounded-lg bg-orange-50 flex items-center justify-center flex-shrink-0 border border-orange-100">
                        <iconify-icon icon="solar:lightbulb-minimalistic-linear" style="stroke-width: 1.5;" class="text-orange-500 text-lg"></iconify-icon>
                    </div>
                    <p class="text-xs text-stone-600 font-light leading-snug">
                        Pacing is <span class="font-medium text-stone-800">12% faster</span> than target baseline.
                    </p>
                </div>

                <!-- Decorative blur element behind -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3/4 h-3/4 bg-orange-200/30 blur-[40px] rounded-full z-0 pointer-events-none"></div>
            </div>

        </aside>

    </main>

</body>
</html>
