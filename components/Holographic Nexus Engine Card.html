<div class="flex min-h-screen w-full items-center justify-center bg-zinc-950 overflow-hidden"
  style="font-family: 'Inter', sans-serif;">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <div id="nebula-quantum-card" class="relative group" style="perspective: 1200px;">
    <div id="nebula-tilt" class="w-[340px] aspect-[1/1.4] relative transform-gpu"
      style="transform-style: preserve-3d; will-change: transform;">
      <div id="nebula-wrapper"
        class="absolute inset-0 p-[1px] rounded-[24px] bg-gradient-to-br from-neutral-500/40 via-neutral-800/20 to-neutral-600/20 shadow-[0_30px_80px_-20px_rgba(0,0,0,0.9)] opacity-0 transform-gpu translate-y-12 scale-95 transition-shadow duration-500">

        <div class="relative w-full h-full rounded-[23px] overflow-hidden bg-[#070707] transform-gpu">
          <!-- WebGL Holographic Surface -->
          <canvas id="nebula-gl" class="absolute inset-0 w-full h-full block z-0"></canvas>

          <!-- Aesthetic Overlays -->
          <div
            class="absolute inset-0 z-10 bg-gradient-to-t from-black/80 via-black/10 to-black/40 pointer-events-none mix-blend-multiply">
          </div>
          <div class="absolute inset-0 z-10 opacity-20 pointer-events-none"
            style="background-image: url('https://grainy-gradients.vercel.app/noise.svg'); filter: contrast(150%) brightness(100%);">
          </div>

          <!-- Interface Layer -->
          <div class="absolute inset-0 z-20 p-8 flex flex-col justify-between pointer-events-none text-white">
            <div
              class="flex justify-between items-baseline text-[10px] font-medium tracking-[0.25em] uppercase text-neutral-400 neb-elem">
              <span class="flex items-center gap-1.5"><iconify-icon icon="solar:shield-unique-linear"></iconify-icon> VERIFIED</span>
              <span>OVERDRIVE / 09</span>
            </div>

            <div class="w-full neb-elem">
              <div class="flex justify-between items-end mb-2">
                <h2 class="text-3xl font-semibold tracking-tight leading-none text-white drop-shadow-lg">NEXUS <br/> ENGINE
                </h2>
                <iconify-icon icon="solar:bolt-linear" class="text-2xl text-neutral-300"></iconify-icon>
              </div>
              <div class="h-[1px] w-full bg-gradient-to-r from-neutral-500/50 to-transparent my-3"></div>
              <p class="text-[10px] font-medium tracking-[0.2em] uppercase text-neutral-400">Type: Hyper-Grid / Class IX
              </p>
            </div>

            <div class="flex gap-4 neb-elem">
              <div class="flex-1">
                <span class="block text-xl font-semibold text-white">142.6</span>
                <span class="text-[9px] font-medium tracking-[0.2em] text-neutral-500 uppercase mt-0.5 block">TFLOPS</span>
              </div>
              <div class="flex-1 border-x border-white/5 px-4">
                <span class="block text-xl font-semibold text-white">88%</span>
                <span class="text-[9px] font-medium tracking-[0.2em] text-neutral-500 uppercase mt-0.5 block">Yield</span>
              </div>
              <div class="flex-1">
                <span class="block text-xl font-semibold text-white">0.003s</span>
                <span class="text-[9px] font-medium tracking-[0.2em] text-neutral-500 uppercase mt-0.5 block">Ping</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function() {
        const wrapper = document.getElementById('nebula-wrapper');
        const tilt = document.getElementById('nebula-tilt');
        const canvas = document.getElementById('nebula-gl');
        const gl = canvas.getContext('webgl');

        gsap.to(wrapper, { opacity: 1, y: 0, scale: 1, duration: 1.8, ease: 'expo.out', delay: 0.2 });
        gsap.fromTo('.neb-elem', { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 1, stagger: 0.15, delay: 0.8 });

        if (!gl) return;
        const VS = 'attribute vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }';
        const FS = `
          precision highp float;
          uniform vec2 u_res; uniform float u_time; uniform vec2 u_ptr; uniform float u_hov;
          float hash(vec2 p){ p=fract(p*vec2(127.1,311.7)); return fract(p.x*p.y); }
          float noise(vec2 p){
            vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
            return mix(mix(hash(i),hash(i+vec2(1,0)),u.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x),u.y);
          }
          vec3 pal(float t){ return vec3(0.5)+0.5*cos(6.283*(t+vec3(0,0.1,0.2))); }
          void main(){
            vec2 uv = gl_FragCoord.xy/u_res; vec2 p = uv-0.5; p.x *= u_res.x/u_res.y;
            float n = noise(uv*3.0 + u_time*0.05);
            float ang = uv.x*1.2 - uv.y*1.0 + (u_ptr.x-0.5)*2.0 + n*0.5;
            vec3 irid = pal(ang*0.5 + n*0.2);
            float sweep = exp(-10.0 * abs(dot(p,normalize(vec2(0.7))) - (u_ptr.x-0.5)*1.5));
            float foil = (pow(0.5+0.5*sin(ang*10.0), 2.0)*0.3 + sweep*0.6) * (0.5+0.5*u_hov);
            vec3 col = mix(vec3(0.03), irid, foil) + sweep*0.1*u_hov;
            gl_FragColor = vec4(col, 1.0);
          }`;

        const createShader = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); return sh; };
        const pr = gl.createProgram();
        gl.attachShader(pr, createShader(gl.VERTEX_SHADER, VS));
        gl.attachShader(pr, createShader(gl.FRAGMENT_SHADER, FS));
        gl.linkProgram(pr); gl.useProgram(pr);

        const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

        const uRes = gl.getUniformLocation(pr, 'u_res'), uTime = gl.getUniformLocation(pr, 'u_time'), uPtr = gl.getUniformLocation(pr, 'u_ptr'), uHov = gl.getUniformLocation(pr, 'u_hov');

        const fit = () => { const d = Math.min(window.devicePixelRatio, 2); canvas.width = canvas.clientWidth * d; canvas.height = canvas.clientHeight * d; gl.viewport(0, 0, canvas.width, canvas.height); };
        window.addEventListener('resize', fit); fit();

        let px = 0.5, py = 0.5, tx = 0.5, ty = 0.5, hov = 0, th = 0, rx = 0, ry = 0;
        window.addEventListener('pointermove', e => { 
          tx = e.clientX / window.innerWidth; ty = e.clientY / window.innerHeight; 
          th = 1; 
        });
        window.addEventListener('pointerleave', () => { th = 0; });

        const loop = (t) => {
          px += (tx-px)*0.1; py += (ty-py)*0.1; hov += (th-hov)*0.05;
          rx += ((0.5-py)*25 - rx)*0.1; ry += ((px-0.5)*25 - ry)*0.1;
          tilt.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
          gl.uniform2f(uRes, canvas.width, canvas.height);
          gl.uniform1f(uTime, t/1000);
          gl.uniform2f(uPtr, px, 1-py);
          gl.uniform1f(uHov, hov);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
      })();
    </script>
  </div>
</div>
