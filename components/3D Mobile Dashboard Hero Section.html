<div class="relative w-full min-h-screen bg-[#050505] text-white overflow-hidden flex items-center justify-center selection:bg-green-500/30"

    <link

    <div

    <main class="relative z-10 flex flex-col items-center justify-center w-full max-w-7xl mx-auto px-4">
        <div class="relative flex items-center justify-center w-full h-[450px] sm:h-[700px]"
            style="perspective: 1200px;">
            <div id="carousel-container"
                class="relative w-full h-full flex items-center justify-center transition-transform duration-75"
                style="transform-style: preserve-3d;">
                <!-- Left Phone -->
                <div class="carousel-card absolute w-[160px] sm:w-[260px] h-[330px] sm:h-[530px] rounded-[2rem] sm:rounded-[2.5rem] bg-neutral-800 border-[3px] sm:border-[5px] border-neutral-700 cursor-pointer z-10"
                    style="transform: translateX(-110%) translateZ(-200px) rotateY(25deg); box-shadow: inset 0 0 10px rgba(0,0,0,1);">
                    <div
                        class="absolute inset-0 border-[6px] sm:border-[8px] border-black rounded-[1.8rem] sm:rounded-[2.2rem] overflow-hidden bg-[#0a0a0a] flex flex-col pointer-events-none">
                        <div
                            class="absolute top-2 left-1/2 -translate-x-1/2 w-20 sm:w-24 h-5 sm:h-6 bg-black rounded-full z-20">
                        </div>
                        <div
                            class="w-full h-full bg-gradient-to-b from-green-900/10 to-transparent p-4 pt-14 flex flex-col gap-3">
                            <div class="w-2/3 h-4 rounded bg-neutral-800 mb-2"></div>
                            <div
                                class="w-full h-12 rounded-lg bg-green-500/10 border border-green-500/20 flex items-center px-3 gap-2">
                                <div class="w-2 h-2 rounded-full bg-green-400"></div>
                                <div class="w-16 h-2 rounded bg-green-500/30"></div>
                            </div>
                            <div
                                class="w-full h-12 rounded-lg bg-neutral-900 border border-neutral-800 flex items-center px-3 gap-2">
                                <div class="w-2 h-2 rounded-full bg-neutral-600"></div>
                                <div class="w-12 h-2 rounded bg-neutral-700"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Right Phone -->
                <div class="carousel-card absolute w-[160px] sm:w-[260px] h-[330px] sm:h-[530px] rounded-[2rem] sm:rounded-[2.5rem] bg-neutral-800 border-[3px] sm:border-[5px] border-neutral-700 cursor-pointer z-10"
                    style="transform: translateX(110%) translateZ(-200px) rotateY(-25deg); box-shadow: inset 0 0 10px rgba(0,0,0,1);">
                    <div
                        class="absolute inset-0 border-[6px] sm:border-[8px] border-black rounded-[1.8rem] sm:rounded-[2.2rem] overflow-hidden bg-[#0a0a0a] flex flex-col pointer-events-none">
                        <div
                            class="absolute top-2 left-1/2 -translate-x-1/2 w-20 sm:w-24 h-5 sm:h-6 bg-black rounded-full z-20">
                        </div>
                        <div
                            class="w-full h-full bg-gradient-to-b from-green-900/10 to-transparent p-4 pt-14 flex flex-col gap-3">
                            <div class="w-1/2 h-4 rounded bg-neutral-800 mb-2"></div>
                            <div
                                class="w-full flex-1 rounded-xl bg-neutral-900 border border-neutral-800 p-3 flex items-end justify-between gap-1 opacity-60">
                                <div class="w-full bg-green-500/40 h-[50%] rounded-t-sm"></div>
                                <div class="w-full bg-green-500/80 h-[90%] rounded-t-sm"></div>
                                <div class="w-full bg-green-500/30 h-[40%] rounded-t-sm"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Center Phone -->
                <div class="carousel-card absolute w-[180px] sm:w-[280px] h-[370px] sm:h-[580px] rounded-[2.2rem] sm:rounded-[2.8rem] bg-neutral-400 border-[3px] sm:border-[5px] border-neutral-500 cursor-pointer z-30"
                    style="transform: translateZ(50px); box-shadow: 0 0 60px 15px rgba(34, 197, 94, 0.15), inset 0 0 20px rgba(255,255,255,0.2);">
                    <div
                        class="absolute inset-0 border-[6px] sm:border-[8px] border-black rounded-[1.9rem] sm:rounded-[2.5rem] overflow-hidden bg-[#020804] flex flex-col pointer-events-none">
                        <div
                            class="absolute top-2.5 left-1/2 -translate-x-1/2 w-24 h-7 bg-black rounded-full z-20 flex items-center justify-end px-3">
                            <div
                                class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)]">
                            </div>
                        </div>
                        <div
                            class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(34,197,94,0.12)_0%,transparent_60%),repeating-linear-gradient(0deg,rgba(34,197,94,0.03)_0px,rgba(34,197,94,0.03)_1px,transparent_1px,transparent_20px)]">
                        </div>
                        <div class="relative z-10 p-5 pt-16 flex flex-col h-full gap-5">
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] font-light text-green-400 tracking-wider" style="font-family: 'JetBrains Mono', monospace;">SYS_OK</span>
                                <div
                                    class="w-10 h-5 bg-green-500/20 rounded-full relative border border-green-500/40 shadow-[inset_0_0_5px_rgba(0,0,0,0.5)]">
                                    <div class="absolute right-0.5 top-0.5 w-4 h-4 bg-green-400 rounded-full"></div>
                                </div>
                            </div>
                            <div class="flex-1 flex items-center justify-center">
                                <div
                                    class="w-36 h-36 rounded-full border border-green-500/20 flex items-center justify-center relative">
                                    <div
                                        class="absolute inset-0 rounded-full border border-green-400/50 scale-110 animate-[spin_4s_linear_infinite] border-t-transparent">
                                    </div>
                                    <span class="text-4xl font-light text-green-300 tracking-tighter">99<span class="text-2xl text-green-500/70">%</span></span>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-green-950/30 rounded-xl border border-green-900/40 p-3">
                                    <span class="block text-[8px] text-green-500/70 uppercase tracking-widest mb-1">Latency</span><span class="text-sm text-green-100 font-light">12ms</span>
                                </div>
                                <div class="bg-green-950/30 rounded-xl border border-green-900/40 p-3">
                                    <span class="block text-[8px] text-green-500/70 uppercase tracking-widest mb-1">Uptime</span><span class="text-sm text-green-100 font-light">99.9%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none z-40"
            id="hero-content" style="opacity: 0; transform: translateY(20px);">
            <div class="flex items-center gap-3 px-4 py-2 rounded-full bg-[#031207]/80 backdrop-blur-md border border-green-900/60 text-green-400 text-[10px] sm:text-xs font-light tracking-widest uppercase mb-8"
                style="font-family: 'JetBrains Mono', monospace; box-shadow: 0 0 20px rgba(34,197,94,0.1);">
                <iconify-icon icon="solar:radar-linear" width="16"
                    height="16"></iconify-icon><span>Telemetry Active</span>
            </div>
            <h1 class="text-5xl sm:text-7xl md:text-[5.5rem] font-light tracking-tighter text-[#fafafa] leading-[1.05] max-w-5xl"
                style="text-shadow: 0 10px 40px rgba(0,0,0,0.8);">Global mobile
                ecosystem<br><span class="text-green-300/90">observability network</span></h1>
            <button class="group relative mt-12 px-8 py-4 rounded-full text-sm font-light text-white transition-all duration-300 active:scale-95 pointer-events-auto flex items-center justify-center bg-green-600 hover:bg-green-500 border border-green-500/50 shadow-[0_0_20px_rgba(34,197,94,0.2)]">
                <span class="relative z-10 flex items-center gap-2">Deploy Dashboard <iconify-icon icon="solar:arrow-right-linear" width="18" height="18" class="transition-transform group-hover:translate-x-1"></iconify-icon></span>
            </button>
        </div>
    </main>

    <script>
        (function() {
            const canvas = document.getElementById('bg-canvas-component');
            const ctx = canvas.getContext('2d');
            let w, h, pts = [];

            function resize() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
                pts = Array.from({length: w < 768 ? 40 : 100}, () => ({
                    x: Math.random() * w, y: Math.random() * h,
                    l: Math.random() * 60 + 20, s: Math.random() * 0.5 + 0.1,
                    o: Math.random() * 0.15 + 0.05
                }));
            }
            window.addEventListener('resize', resize);
            resize();

            function draw() {
                ctx.clearRect(0, 0, w, h);
                pts.forEach(p => {
                    const prox = Math.max(0, 1 - (Math.abs(p.x - w/2) / (w/2))) * Math.max(0, 1 - (Math.abs(p.y - h/2) / (h/2)));
                    const curL = p.l * (1 + prox * 3);
                    const grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + curL);
                    grad.addColorStop(0, 'rgba(34,197,94,0)');
                    grad.addColorStop(0.5, `rgba(${34 + prox*100}, ${197 + prox*50}, ${94 + prox*100}, ${p.o + prox})`);
                    grad.addColorStop(1, 'rgba(34,197,94,0)');
                    ctx.strokeStyle = grad;
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y + curL); ctx.stroke();
                    p.y -= p.s * (1 + prox);
                    if (p.y + curL < 0) { p.y = h; p.x = Math.random() * w; }
                });
                requestAnimationFrame(draw);
            }
            draw();

            const carousel = document.getElementById('carousel-container');
            const cards = document.querySelectorAll('.carousel-card');
            let ry = 0, try_ = 0, time = 0;

            window.addEventListener('mousemove', (e) => try_ = ((e.clientX / w) - 0.5) * 30);
            cards.forEach(c => {
                c.onmouseenter = () => c.hvr = 1; c.onmouseleave = () => c.hvr = 0;
                c.hAmt = 0; c.baseT = c.style.transform;
                const m = c.baseT.match(/translateX\(([^)]+)\)/);
                c.dX = m ? parseFloat(m[1]) : 0;
            });

            function loop() {
                time += 0.015; ry += (try_ - ry) * 0.08;
                carousel.style.transform = `rotateY(${ry}deg)`;
                cards.forEach((c, i) => {
                    c.hAmt += ((c.hvr || 0) - c.hAmt) * 0.15;
                    const hZ = c.hAmt * 40, hY = c.hAmt * -15, hX = (c.dX < 0 ? -20 : c.dX > 0 ? 20 : 0) * c.hAmt;
                    const osc = Math.sin(time + i * 0.8) * 6;
                    c.style.transform = `${c.baseT} translateX(${hX}px) translateY(${osc + hY}px) translateZ(${hZ}px)`;
                });
                requestAnimationFrame(loop);
            }
            loop();

            setTimeout(() => {
                const el = document.getElementById('hero-content');
                el.style.transition = 'all 1.2s cubic-bezier(0.16, 1, 0.3, 1)';
                el.style.opacity = '1'; el.style.transform = 'translateY(0)';
            }, 400);
        })();
    </script>
</div>
