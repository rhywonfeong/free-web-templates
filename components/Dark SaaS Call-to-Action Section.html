<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Final CTA - Standalone</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fonts from original layout -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <!-- Iconify from original layout -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <style>
    .font-sans {
      font-family: 'Inter', sans-serif !important;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace !important;
    }

    @keyframes animationIn {
      0% {
        opacity: 0;
        transform: translateY(20px);
        filter: blur(4px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0px);
      }
    }

    .animate-on-scroll {
      animation-play-state: paused !important;
    }

    .animate-on-scroll.animate {
      animation-play-state: running !important;
    }
  </style>

  <script>
    (function () {
      const once = true;

      if (!window.__inViewIO) {
        window.__inViewIO = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("animate");
              if (once) window.__inViewIO.unobserve(entry.target);
            }
          });
        }, { threshold: 0.15, rootMargin: "0px 0px -5% 0px" });
      }

      window.initInViewAnimations = function (selector = ".animate-on-scroll") {
        document.querySelectorAll(selector).forEach((el) => {
          window.__inViewIO.observe(el);
        });
      };

      document.addEventListener("DOMContentLoaded", () => {
        initInViewAnimations();
      });
    })();
  </script>
</head>

<body
  class="bg-[#0f0f11] text-[#cbd5e1] font-sans antialiased min-h-screen relative selection:bg-cyan-500/30 selection:text-cyan-200">
  <!-- Background environment matching original page mood -->
  <div class="fixed inset-0 z-0 opacity-40 pointer-events-none"
    style="background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f0f11 60%);"></div>

  <main class="relative z-10 min-h-screen flex items-center justify-center px-4 sm:px-6 py-10 sm:py-16">
    <div class="w-full max-w-[1200px]">
      <!-- Outer spacing similar to original content bay -->
      <div class="px-0 sm:px-4 md:px-10">
        <!-- SECTION 06: Final CTA Module -->
        <section
          class="bg-gradient-to-b from-[#18181b] to-[#131315] border border-[#27272a] rounded-xl p-8 md:p-16 text-center relative overflow-hidden shadow-[inset_0_2px_8px_rgba(0,0,0,0.5)] [animation:animationIn_0.8s_ease-out_0.2s_both] animate-on-scroll">
          <div
            class="absolute inset-0 opacity-[0.03] bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:24px_24px]">
          </div>

          <div class="relative z-10 max-w-2xl mx-auto">
            <div
              class="inline-flex items-center gap-2 px-3 py-1 bg-[#09090b] border border-[#27272a] rounded text-[10px] font-mono text-cyan-400 shadow-[inset_0_1px_2px_rgba(0,0,0,0.6)] uppercase tracking-widest mb-6">
              <iconify-icon icon="solar:rocket-linear"></iconify-icon>
              System Ready
            </div>

            <h2 class="text-3xl md:text-5xl font-medium text-slate-100 tracking-tight mb-4 drop-shadow-md">
              Initialize Deployment
            </h2>

            <p class="text-sm text-slate-400 mb-8 max-w-lg mx-auto leading-relaxed">
              Provision your workspace and allocate model routing in
              real-time. API keys generated securely upon initialization.
            </p>

            <button class="bg-gradient-to-b from-cyan-600 to-cyan-700 hover:from-cyan-500 hover:to-cyan-600 border-t border-cyan-400/20 shadow-[0_2px_10px_-2px_rgba(6,182,212,0.4),inset_0_1px_0_rgba(255,255,255,0.2)] active:translate-y-[1px] text-white px-8 py-4 rounded text-xs font-mono uppercase tracking-wider transition-all inline-flex items-center gap-3">
              Generate Keys
              <iconify-icon icon="solar:arrow-right-linear" class="text-cyan-200"></iconify-icon>
            </button>

            <div
              class="mt-8 flex items-center justify-center gap-4 text-[10px] font-mono text-slate-500 uppercase tracking-wider">
              <span class="flex items-center gap-1.5">
                <iconify-icon icon="solar:shield-check-linear"></iconify-icon>
                SOC-2 Type II
              </span>
              <span class="w-1 h-1 rounded-full bg-[#3f3f46]"></span>
              <span class="flex items-center gap-1.5">
                <iconify-icon icon="solar:server-path-linear"></iconify-icon>
                99.99% Uptime
              </span>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>

</html>
