<div class="min-h-screen w-full flex items-center justify-center bg-slate-50 p-4 sm:p-8 overflow-hidden">
    <!-- Main Container -->
    <div
        class="relative w-full max-w-[1200px] aspect-[16/10] sm:aspect-[21/10] bg-gradient-to-r from-[#2044F4] via-[#A238B5] to-[#F76A1C] rounded-[2rem] sm:rounded-[3rem] shadow-2xl overflow-hidden flex items-center justify-center isolate">
        <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

        <!-- Background Ambient Glow -->
        <div class="absolute inset-0 opacity-40 mix-blend-screen pointer-events-none"
            style="background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4) 0%, transparent 60%);"></div>

        <!-- Connection Lines (SVG) -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none z-0 opacity-60" preserveAspectRatio="none">
            <path class="draw-path" d="M 50% 50% Q 35% 60% 20% 60%" fill="none" stroke="rgba(255,255,255,0.8)"
                stroke-width="1.5" vector-effect="non-scaling-stroke"
                style="stroke-dasharray: 1000; stroke-dashoffset: 1000; transition: stroke-dashoffset 1.5s ease-out;" />
            <circle class="fade-in-node opacity-0" cx="20%" cy="60%" r="3.5" fill="white"
                style="transition: opacity 0.5s ease-out 1s;" />
            <path class="draw-path" d="M 50% 50% Q 40% 35% 30% 35%" fill="none" stroke="rgba(255,255,255,0.8)"
                stroke-width="1.5" vector-effect="non-scaling-stroke"
                style="stroke-dasharray: 1000; stroke-dashoffset: 1000; transition: stroke-dashoffset 1.5s ease-out;" />
            <circle class="fade-in-node opacity-0" cx="30%" cy="35%" r="3.5" fill="white"
                style="transition: opacity 0.5s ease-out 1s;" />
            <path class="draw-path" d="M 50% 50% Q 65% 25% 75% 25%" fill="none" stroke="rgba(255,255,255,0.8)"
                stroke-width="1.5" vector-effect="non-scaling-stroke"
                style="stroke-dasharray: 1000; stroke-dashoffset: 1000; transition: stroke-dashoffset 1.5s ease-out;" />
            <circle class="fade-in-node opacity-0" cx="75%" cy="25%" r="3.5" fill="white"
                style="transition: opacity 0.5s ease-out 1s;" />
            <path class="draw-path" d="M 50% 50% Q 65% 38% 80% 38%" fill="none" stroke="rgba(255,255,255,0.8)"
                stroke-width="1.5" vector-effect="non-scaling-stroke"
                style="stroke-dasharray: 1000; stroke-dashoffset: 1000; transition: stroke-dashoffset 1.5s ease-out;" />
            <circle class="fade-in-node opacity-0" cx="80%" cy="38%" r="3.5" fill="white"
                style="transition: opacity 0.5s ease-out 1s;" />
            <path class="draw-path" d="M 50% 50% Q 65% 55% 75% 55%" fill="none" stroke="rgba(255,255,255,0.8)"
                stroke-width="1.5" vector-effect="non-scaling-stroke"
                style="stroke-dasharray: 1000; stroke-dashoffset: 1000; transition: stroke-dashoffset 1.5s ease-out;" />
            <circle class="fade-in-node opacity-0" cx="75%" cy="55%" r="3.5" fill="white"
                style="transition: opacity 0.5s ease-out 1s;" />
        </svg>

        <!-- Central Orb Area -->
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-20 flex items-center justify-center">
            <div
                class="absolute w-[280px] h-[280px] sm:w-[340px] sm:h-[340px] rounded-full border border-white/30 animate-[spin_40s_linear_infinite]">
            </div>
            <div class="anim-item relative w-[180px] h-[180px] sm:w-[220px] sm:h-[220px] rounded-full bg-gradient-to-br from-white/40 via-white/10 to-transparent backdrop-blur-md shadow-[0_0_100px_rgba(255,255,255,0.4),inset_0_0_40px_rgba(255,255,255,0.2)] border border-white/50 flex items-center justify-center overflow-hidden opacity-0 scale-75"
                style="transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);">
                <div id="waveform" class="flex items-center justify-center gap-[3px] h-16 w-32 z-10 mix-blend-overlay">
                </div>
            </div>
        </div>

        <!-- Left Elements -->
        <div class="anim-item absolute top-[35%] left-[10%] sm:left-[30%] -translate-x-1/2 -translate-y-1/2 z-20 flex items-center justify-center opacity-0 -translate-x-8"
            style="transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s;">
            <div
                class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-full border-[3px] border-white/20 border-dashed animate-[spin_60s_linear_infinite]">
            </div>
            <div class="absolute inset-0 flex items-center justify-center">
                <svg class="w-full h-full -rotate-90 transform" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="4"
                        stroke-dasharray="188" stroke-dashoffset="47" stroke-linecap="round"></circle>
                </svg>
            </div>
            <div class="absolute text-white font-medium text-xl sm:text-2xl tracking-tight">75%</div>
        </div>

        <div class="anim-item absolute top-[60%] left-[10%] sm:left-[20%] -translate-x-1/2 -translate-y-1/2 z-20 w-40 sm:w-48 bg-[#F8F9FA]/90 backdrop-blur-xl rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-xl border border-white/60 flex items-center justify-between opacity-0 -translate-x-8 hover:scale-105"
            style="transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;">
            <div class="flex flex-col gap-0.5 sm:gap-1">
                <span class="text-[10px] sm:text-xs text-slate-500 font-medium">CPU Usage</span>
                <span class="text-sm sm:text-base font-semibold tracking-tight">75%</span>
            </div>
            <div class="w-8 h-8 rounded-full bg-slate-200/50 flex items-center justify-center text-slate-600">
                <iconify-icon icon="solar:server-linear" width="18"></iconify-icon>
            </div>
        </div>

        <!-- Right Elements -->
        <div class="anim-item absolute top-[25%] right-[10%] sm:right-[25%] translate-x-1/2 -translate-y-1/2 z-20 w-44 sm:w-56 bg-[#F8F9FA]/90 backdrop-blur-xl rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-xl border border-white/60 flex items-center justify-between opacity-0 translate-x-8"
            style="transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s;">
            <div class="flex flex-col gap-0.5 sm:gap-1">
                <span class="text-[10px] sm:text-xs text-slate-500 font-medium">CPU Usage</span><span class="text-sm sm:text-base font-semibold tracking-tight">SPU 75%</span>
            </div>
            <div class="w-8 h-8 rounded-full bg-slate-200/50 flex items-center justify-center text-slate-600">
                <iconify-icon icon="solar:document-text-linear" width="18"></iconify-icon>
            </div>
        </div>

        <div class="anim-item absolute top-[38%] right-[5%] sm:right-[20%] translate-x-1/2 -translate-y-1/2 z-20 w-48 sm:w-60 bg-[#F8F9FA]/90 backdrop-blur-xl rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-xl border border-white/60 flex items-center justify-between opacity-0 translate-x-8"
            style="transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.5s;">
            <div class="flex flex-col gap-0.5 sm:gap-1">
                <span class="text-[10px] sm:text-xs text-slate-500 font-medium">Memory</span><span class="text-sm sm:text-base font-semibold tracking-tight">Disk 8GB</span>
            </div>
            <div class="w-8 h-8 rounded-full bg-slate-200/50 flex items-center justify-center text-slate-600">
                <iconify-icon icon="solar:chip-linear" width="18"></iconify-icon>
            </div>
        </div>

        <div class="anim-item absolute top-[55%] right-[10%] sm:right-[25%] translate-x-1/2 -translate-y-1/2 z-20 w-44 sm:w-56 bg-[#F8F9FA]/90 backdrop-blur-xl rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-xl border border-white/60 flex items-center justify-between opacity-0 translate-x-8"
            style="transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s;">
            <div class="flex flex-col gap-0.5 sm:gap-1">
                <span class="text-[10px] sm:text-xs text-slate-500 font-medium">Disk:</span><span class="text-sm sm:text-base font-semibold tracking-tight">500GB free</span>
            </div>
            <div class="w-8 h-8 rounded-full bg-slate-200/50 flex items-center justify-center text-slate-600">
                <iconify-icon icon="solar:cloud-storage-linear" width="18"></iconify-icon>
            </div>
        </div>

        <!-- Footer Elements -->
        <div class="anim-item absolute bottom-8 sm:bottom-12 left-1/2 -translate-x-1/2 text-white font-medium text-lg sm:text-xl tracking-tight opacity-0 translate-y-4"
            style="transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1) 1.2s;">System Overview</div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(() => {
                    document.querySelectorAll('.anim-item').forEach(el => {
                        el.classList.remove('opacity-0', 'scale-75', 'scale-50', '-translate-x-8', 'translate-x-8', 'translate-y-4');
                        el.style.opacity = '1';
                        if (el.classList.contains('-translate-x-1/2')) {
                            el.style.transform = el.classList.contains('-translate-y-1/2') ? 'translate(-50%, -50%) scale(1)' : 'translate(-50%, 0) scale(1)';
                        } else if (el.classList.contains('translate-x-1/2')) {
                             el.style.transform = 'translate(50%, -50%) scale(1)';
                        } else { el.style.transform = 'translate(0, 0) scale(1)'; }
                    });
                    document.querySelectorAll('.draw-path').forEach(path => path.style.strokeDashoffset = '0');
                    document.querySelectorAll('.fade-in-node').forEach(node => node.style.opacity = '1');
                }, 100);

                const waveformContainer = document.getElementById('waveform');
                const bars = [];
                for (let i = 0; i < 35; i++) {
                    const bar = document.createElement('div');
                    const env = Math.sin((i / 34) * Math.PI);
                    bar.className = 'w-[2px] bg-white rounded-full transition-all duration-300';
                    bar.style.height = `${(env * 30) + 10}px`;
                    waveformContainer.appendChild(bar);
                    bars.push({ el: bar, baseEnv: env });
                }
                setInterval(() => {
                    bars.forEach(b => {
                        const v = Math.random() * 20 * b.baseEnv;
                        b.el.style.height = `${Math.max(4, (b.baseEnv * 30) + v)}px`;
                        b.el.style.opacity = 0.6 + (Math.random() * 0.4);
                    });
                }, 150);
            });
        </script>
    </div>
</div>
