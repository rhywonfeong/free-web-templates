<section class="w-full max-w-6xl mx-auto my-16 relative font-sans overflow-hidden">
  <!-- Decorative Corner Brackets -->
  <div class="absolute -top-1 -left-1 w-2 h-2 border border-emerald-500/50 bg-[#050a06] z-20"></div>
  <div class="absolute -top-1 -right-1 w-2 h-2 border border-emerald-500/50 bg-[#050a06] z-20"></div>
  <div class="absolute -bottom-1 -left-1 w-2 h-2 border border-emerald-500/50 bg-[#050a06] z-20"></div>
  <div class="absolute -bottom-1 -right-1 w-2 h-2 border border-emerald-500/50 bg-[#050a06] z-20"></div>

  <div
    class="flex flex-col md:flex-row overflow-hidden bg-black/40 border border-emerald-900/30 relative backdrop-blur-xl">
    <div class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-emerald-500/30 to-transparent">
    </div>

    <!-- Content Side -->
    <div
      class="md:w-1/2 md:p-16 p-8 flex flex-col md:border-r border-b md:border-b-0 border-emerald-900/30 z-10 bg-gradient-to-br from-white/[0.02] to-transparent justify-center relative overflow-hidden">
      <div class="absolute inset-0 pointer-events-none opacity-40">
        <div class="absolute -top-10 -left-10 w-40 h-40 rounded-full bg-emerald-500/5 blur-3xl animate-pulse"></div>
        <div class="absolute bottom-0 right-0 w-32 h-32 rounded-full bg-emerald-400/5 blur-3xl animate-pulse"
          style="animation-delay: 1.2s;"></div>
      </div>

      <div
        class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-emerald-500/20 bg-emerald-500/[0.02] mb-6 w-max relative">
        <span class="absolute inset-0 rounded-full border border-emerald-400/10 animate-[badgeGlow_3s_ease-in-out_infinite]"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
        <span class="text-xs font-mono tracking-widest text-emerald-400 uppercase">Platform Overview</span>
      </div>

      <h1 class="text-4xl md:text-5xl lg:text-6xl font-light text-white tracking-tight leading-[1.15] mb-6">
        The control plane for <span class="text-emerald-300">event-driven</span> architecture.
      </h1>

      <p class="text-lg font-thin text-emerald-50/60 leading-relaxed mb-10 max-w-xl">
        TrueNorth handles ingestion, schema transformation, routing, and reliable delivery at the global edge. Stop
        managing queues and focus on business logic.
      </p>

      <button class="group flex transition-all duration-500 ease-out hover:bg-[#050a06] hover:border-emerald-400/80 hover:shadow-[inset_0_0_30px_rgba(16,185,129,0.2),0_0_30px_rgba(52,211,153,0.4)] hover:-translate-y-0.5 cursor-pointer font-light text-emerald-50 tracking-wide bg-[#030704]/90 border-emerald-500/40 border py-3 px-8 shadow-[inset_0_0_20px_rgba(16,185,129,0.15)] gap-x-2 items-center justify-center w-max">
        Explore the Mesh
        <i data-lucide="arrow-right" class="w-4 h-4 text-emerald-400 group-hover:translate-x-1 transition-transform"></i>
      </button>
    </div>

    <!-- Visual Side -->
    <div
      class="w-full md:w-1/2 h-[450px] md:h-auto relative bg-[#020503] flex items-center justify-center overflow-hidden z-10">
      <div class="absolute inset-0 opacity-20 pointer-events-none">
        <div class="absolute inset-[-40px]"
          style="background-image: radial-gradient(#10b981 1px, transparent 1px); background-size: 24px 24px; mask-image: radial-gradient(circle, black 38%, transparent 72%); -webkit-mask-image: radial-gradient(circle, black 38%, transparent 72%); animation: gridDrift 16s linear infinite;">
        </div>
      </div>

      <div
        class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_35%,rgba(0,0,0,0.45)_100%)] pointer-events-none">
      </div>

      <div class="absolute inset-y-0 left-[-20%] w-[40%] pointer-events-none animate-[scanBeam_7s_linear_infinite]"
        style="background: linear-gradient(90deg, transparent, rgba(52,211,153,0.06), rgba(52,211,153,0.14), rgba(52,211,153,0.06), transparent); filter: blur(12px);">
      </div>

      <div
        class="relative w-full h-full max-w-[420px] max-h-[420px] flex items-center justify-center animate-[floatSubtle_6s_ease-in-out_infinite]">
        <svg width="100%" height="100%" viewBox="0 0 400 400" fill="none" class="absolute inset-0">
          <defs>
            <filter id="softGlow">
              <feGaussianBlur stdDeviation="2.5" result="coloredBlur" />
              <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <g stroke-width="1" fill="none" opacity="0.14" stroke="#10b981">
            <path d="M 50 200 Q 120 100 200 200" />
            <path d="M 50 200 Q 120 300 200 200" />
            <path d="M 200 200 L 320 120" />
            <path d="M 200 200 L 350 200" />
            <path d="M 200 200 L 320 280" />
          </g>
          <g filter="url(#softGlow)" stroke="#34d399" stroke-width="1.6">
            <path d="M 50 200 Q 120 100 200 200" class="data-line" />
            <path d="M 50 200 Q 120 300 200 200" class="data-line" style="animation-delay: -1.6s;" />
            <path d="M 200 200 L 320 120" class="data-line-fast" />
            <path d="M 200 200 L 350 200" class="data-line-fast" style="animation-delay: -0.55s;" />
            <path d="M 200 200 L 320 280" class="data-line-fast" style="animation-delay: -1.1s;" />
          </g>
          <circle r="3" fill="#6ee7b7" class="packet">
            <animateMotion dur="3.4s" repeatCount="indefinite" path="M 50 200 Q 120 100 200 200" />
          </circle>
          <circle r="3" fill="#6ee7b7" class="packet" opacity="0.85">
            <animateMotion dur="3.4s" begin="1.7s" repeatCount="indefinite" path="M 50 200 Q 120 300 200 200" />
          </circle>
          <circle r="2.8" fill="#34d399" class="packet">
            <animateMotion dur="2.1s" repeatCount="indefinite" path="M 200 200 L 320 120" />
          </circle>
          <circle r="2.8" fill="#34d399" class="packet">
            <animateMotion dur="2.1s" begin="0.55s" repeatCount="indefinite" path="M 200 200 L 350 200" />
          </circle>
          <circle r="2.8" fill="#34d399" class="packet">
            <animateMotion dur="2.1s" begin="1.1s" repeatCount="indefinite" path="M 200 200 L 320 280" />
          </circle>
        </svg>

        <div
          class="absolute w-40 h-40 rounded-full bg-emerald-500/10 blur-3xl animate-[coreAura_4s_ease-in-out_infinite]">
        </div>

        <div
          class="absolute w-24 h-24 bg-[#030704] rounded-full border border-emerald-500/40 flex items-center justify-center z-20 shadow-[0_0_30px_rgba(16,185,129,0.2)] animate-[nodeBreath_4s_ease-in-out_infinite]">
          <div class="absolute inset-0 rounded-full border border-emerald-400/20 animate-[pulseRing_2.4s_infinite]">
          </div>
          <iconify-icon icon="solar:routing-linear"
            class="text-3xl text-emerald-400 animate-[iconFlicker_3s_ease-in-out_infinite]"></iconify-icon>
        </div>

        <div
          class="absolute left-[30px] top-1/2 -translate-y-1/2 w-12 h-12 bg-[#050a06] border border-emerald-900/60 rounded-full flex items-center justify-center z-10 animate-[nodePulse_4s_infinite]">
          <iconify-icon icon="solar:server-square-linear" class="text-lg text-emerald-50/50"></iconify-icon>
        </div>

        <div
          class="absolute right-[50px] top-[95px] w-10 h-10 bg-[#050a06] border border-emerald-900/60 rounded-full flex items-center justify-center z-10 animate-[nodePulse_4s_infinite_0.3s]">
          <iconify-icon icon="solar:database-linear" class="text-sm text-emerald-50/50"></iconify-icon>
        </div>

        <div
          class="absolute right-[20px] top-1/2 -translate-y-1/2 w-10 h-10 bg-[#050a06] border border-emerald-900/60 rounded-full flex items-center justify-center z-10 animate-[nodePulse_4s_infinite_0.8s]">
          <iconify-icon icon="solar:cloud-linear" class="text-sm text-emerald-50/50"></iconify-icon>
        </div>

        <div
          class="absolute right-[50px] bottom-[95px] w-10 h-10 bg-[#050a06] border border-emerald-900/60 rounded-full flex items-center justify-center z-10 animate-[nodePulse_4s_infinite_1.3s]">
          <iconify-icon icon="solar:webhook-linear" class="text-sm text-emerald-50/50"></iconify-icon>
        </div>
      </div>
    </div>
  </div>

  <style>
    @keyframes gridDrift {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(24px, 24px);
      }
    }

    @keyframes floatSubtle {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes scanBeam {
      0% {
        transform: translateX(0);
        opacity: 0;
      }

      10%,
      90% {
        opacity: 1;
      }

      100% {
        transform: translateX(320%);
        opacity: 0;
      }
    }

    @keyframes pulseRing {
      0% {
        transform: scale(0.88);
        opacity: 0.7;
      }

      70%,
      100% {
        transform: scale(1.45);
        opacity: 0;
      }
    }

    @keyframes nodePulse {

      0%,
      100% {
        box-shadow: 0 0 0 rgba(52, 211, 153, 0);
        transform: scale(1);
      }

      50% {
        box-shadow: 0 0 18px rgba(52, 211, 153, 0.18);
        transform: scale(1.04);
      }
    }

    @keyframes nodeBreath {

      0%,
      100% {
        transform: scale(1);
        box-shadow: 0 0 30px rgba(16, 185, 129, 0.18);
      }

      50% {
        transform: scale(1.035);
        box-shadow: 0 0 42px rgba(16, 185, 129, 0.26);
      }
    }

    @keyframes coreAura {

      0%,
      100% {
        transform: scale(0.95);
        opacity: 0.35;
      }

      50% {
        transform: scale(1.12);
        opacity: 0.55;
      }
    }

    @keyframes iconFlicker {

      0%,
      22%,
      24%,
      70%,
      100% {
        opacity: 1;
      }

      20% {
        opacity: 0.8;
      }
    }

    @keyframes badgeGlow {

      0%,
      100% {
        opacity: 0.25;
      }

      50% {
        opacity: 0.7;
        box-shadow: 0 0 20px rgba(52, 211, 153, 0.12);
      }
    }

    @keyframes flowLines {
      0% {
        stroke-dashoffset: 100;
        opacity: 0.3;
      }

      50% {
        opacity: 1;
      }

      100% {
        stroke-dashoffset: 0;
        opacity: 0.3;
      }
    }

    .data-line {
      stroke-dasharray: 14 10;
      animation: flowLines 3.2s linear infinite;
    }

    .data-line-fast {
      stroke-dasharray: 10 8;
      animation: flowLines 2s linear infinite;
    }

    .packet {
      filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.9));
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script>
    if (window.lucide) { lucide.createIcons(); }
  </script>
</section>
