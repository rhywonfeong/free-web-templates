  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" class=""></script>
  <script>
    setTimeout(() => {
        document.querySelectorAll('.word-reveal').forEach(element => {
            const text = element.innerText;
            const words = text.split(' ');
            element.innerHTML = '';
            
            words.forEach(word => {
                const wrapper = document.createElement('span');
                wrapper.style.display = 'inline-block';
                wrapper.style.overflow = 'hidden';
                wrapper.style.verticalAlign = 'bottom';
                wrapper.style.marginRight = '0.2em';
                wrapper.style.paddingBottom = '0.1em';

                const inner = document.createElement('span');
                inner.style.display = 'inline-block';
                inner.style.transform = 'translateY(110%)';
                inner.innerText = word;
                inner.className = 'word-inner';

                wrapper.appendChild(inner);
                element.appendChild(wrapper);
            });

            if (typeof gsap !== 'undefined') {
                gsap.to(element.querySelectorAll('.word-inner'), {
                    y: '0%',
                    duration: 0.8,
                    ease: 'power3.out',
                    stagger: 0.1,
                    scrollTrigger: {
                        trigger: element,
                        start: 'top 85%',
                    }
                });
            } else {
                element.querySelectorAll('.word-inner').forEach(el => el.style.transform = 'translateY(0)');
            }
        });

        const initWebGL = () => {
            if (typeof THREE === 'undefined') return;
            
            const container = document.getElementById('webgl-container');
            if (!container || container.children.length > 0) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 30;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
            container.appendChild(renderer.domElement);

            const geometry = new THREE.TorusKnotGeometry(10, 3, 200, 32);
            const particleMaterial = new THREE.PointsMaterial({
                color: 0x22d3ee,
                size: 0.05,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });

            const particles = new THREE.Points(geometry, particleMaterial);
            scene.add(particles);

            let mouseX = 0;
            let mouseY = 0;
            let targetX = 0;
            let targetY = 0;
            let windowHalfX = window.innerWidth / 2;
            let windowHalfY = window.innerHeight / 2;

            const section = container.parentElement;
            if (section) {
                section.addEventListener('mousemove', (event) => {
                    mouseX = (event.clientX - windowHalfX) * 0.001;
                    mouseY = (event.clientY - windowHalfY) * 0.001;
                });
            }

            const clock = new THREE.Clock();

            const animate = () => {
                requestAnimationFrame(animate);
                const elapsedTime = clock.getElapsedTime();

                targetX = mouseX * 0.5;
                targetY = mouseY * 0.5;

                particles.rotation.y += 0.002;
                particles.rotation.x += 0.001;

                particles.rotation.x += 0.05 * (targetY - particles.rotation.x);
                particles.rotation.y += 0.05 * (targetX - particles.rotation.y);

                const scale = 1 + Math.sin(elapsedTime * 0.5) * 0.05;
                particles.scale.set(scale, scale, scale);

                renderer.render(scene, camera);
            };

            animate();

            window.addEventListener('resize', () => {
                if (!container.clientWidth) return;
                windowHalfX = window.innerWidth / 2;
                windowHalfY = window.innerHeight / 2;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        };

        if (document.readyState === 'complete') {
            initWebGL();
        } else {
            window.addEventListener('DOMContentLoaded', initWebGL);
        }
    }, 100);
  </script>
