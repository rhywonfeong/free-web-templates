<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Background</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative h-screen w-screen m-0 overflow-hidden bg-gray-900">

    <div class="aura-background-component absolute top-0 left-0 w-full h-full z-0 pointer-events-none">
        <div data-us-project="SrJYfPcDUR4StI3maLL6" class="absolute w-full h-full left-0 top-0 z-0"></div>
    </div>

    <div class="relative z-10 flex items-center justify-center h-full">
    </div>

    <script type="text/javascript">
        !(function() {
            if (!window.UnicornStudio) {
                window.UnicornStudio = { isInitialized: false };
                var i = document.createElement("script");
                i.src = "https://cdn.jsdelivr.net/gh/hiunicornstudio/unicornstudio.js@v2.1.0-1/dist/unicornStudio.umd.js";
                i.onload = function() {
                    if (document.readyState === "loading") {
                        document.addEventListener("DOMContentLoaded", function() {
                            UnicornStudio.init();
                            window.UnicornStudio.isInitialized = true;
                        });
                    } else {
                        UnicornStudio.init();
                        window.UnicornStudio.isInitialized = true;
                    }
                };
                (document.head || document.body).appendChild(i);
            } else if (!window.UnicornStudio.isInitialized && window.UnicornStudio.init) {
                UnicornStudio.init();
                window.UnicornStudio.isInitialized = true;
            }
        })();
    </script>
</body>
</html>
