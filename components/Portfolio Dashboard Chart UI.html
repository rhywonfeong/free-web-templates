<div id="dashboard-root" class="w-full min-h-screen flex items-center justify-center p-4 sm:p-8 selection:bg-zinc-200"
    style="font-family: 'Inter', sans-serif; background-color: #fafafa; background-image: radial-gradient(circle, #e4e4e7 1px, transparent 1px); background-size: 24px 24px;">
    <!-- Iconify Import -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <main id="main-card"
        class="relative z-10 w-full max-w-[1100px] bg-white ring-1 ring-zinc-200/80 rounded-[2rem] p-8 md:p-12 flex flex-col lg:flex-row gap-12 lg:gap-20 shadow-[0_20px_40px_-15px_rgba(0,0,0,0.05)] transition-all duration-1000 ease-out"
        style="opacity: 0; transform: translateY(20px);">

        <!-- Sidebar Column -->
        <div class="flex flex-col justify-between w-full lg:w-[35%]">
            <div class="space-y-12">
                <header class="flex items-center gap-4">
                    <div
                        class="w-12 h-12 rounded-2xl bg-zinc-50 ring-1 ring-zinc-200 flex items-center justify-center text-zinc-900 shadow-sm">
                        <iconify-icon icon="solar:wallet-money-linear" width="24" height="24"></iconify-icon>
                    </div>
                    <h1 class="text-xl tracking-tight font-normal text-zinc-900">Total Portfolio</h1>
                </header>

                <section>
                    <div class="mb-6">
                        <h2 class="text-xs uppercase tracking-widest text-zinc-400 font-medium mb-2">Current Balance
                        </h2>
                        <div class="flex items-baseline gap-2">
                            <span class="text-4xl tracking-tight font-light text-zinc-900">$142,590</span>
                            <span class="text-xs uppercase tracking-widest text-zinc-400 font-medium">EUR</span>
                        </div>
                    </div>
                    <p class="text-sm text-zinc-500 leading-relaxed">
                        Our proprietary algorithms continuously analyze market data to execute trades with precision and
                        maximum efficiency.
                    </p>
                    <button class="mt-8 px-6 py-3 rounded-full bg-zinc-900 text-white text-xs font-medium tracking-wide flex items-center gap-2 hover:bg-zinc-800 hover:shadow-lg transition-all duration-300 group">
                        Execute Trade
                        <iconify-icon icon="solar:arrow-right-linear" width="16" height="16" class="group-hover:translate-x-1 transition-transform"></iconify-icon>
                    </button>
                </section>
            </div>

            <nav class="hidden lg:flex flex-wrap items-center gap-2 mt-12">
                <button class="px-4 py-2 rounded-xl text-xs font-medium bg-white ring-1 ring-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 transition-colors">1H</button>
                <button class="px-4 py-2 rounded-xl text-xs font-medium bg-white ring-1 ring-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 transition-colors">4H</button>
                <button class="px-4 py-2 rounded-xl text-xs font-medium bg-zinc-900 text-white shadow-md">1D</button>
                <button class="px-4 py-2 rounded-xl text-xs font-medium bg-white ring-1 ring-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 transition-colors">1W</button>
                <button class="px-4 py-2 rounded-xl text-xs font-medium bg-white ring-1 ring-zinc-200 text-zinc-500 hover:bg-zinc-50 hover:text-zinc-900 transition-colors">1M</button>
            </nav>
        </div>

        <!-- Chart Column -->
        <div class="w-full lg:w-[65%] flex flex-col relative">
            <div class="flex items-center justify-between lg:justify-end gap-3 mb-10 lg:mb-16 relative z-10">
                <nav class="flex lg:hidden items-center gap-2 overflow-x-auto pb-2 pr-4" style="scrollbar-width: none;">
                    <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-zinc-900 text-white">1D</button>
                    <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-white ring-1 ring-zinc-200 text-zinc-500">1W</button>
                </nav>

                <div class="flex items-center gap-3">
                    <button class="w-10 h-10 rounded-[0.85rem] bg-white ring-1 ring-zinc-200 flex items-center justify-center text-zinc-500 hover:text-zinc-900 transition-colors">
                        <iconify-icon icon="solar:tuning-square-linear" width="20" height="20"></iconify-icon>
                    </button>
                    <button class="h-10 px-4 rounded-[0.85rem] bg-white ring-1 ring-zinc-200 flex items-center gap-2 text-zinc-600 hover:bg-zinc-50 transition-colors group shadow-sm">
                        <span class="text-xs font-medium tracking-wide">14 Days</span>
                        <iconify-icon icon="solar:alt-arrow-down-linear" width="16" height="16" class="text-zinc-400 group-hover:text-zinc-900"></iconify-icon>
                    </button>
                </div>
            </div>

            <!-- Visualization Area -->
            <div class="relative w-full h-[280px] sm:h-[340px] flex select-none z-10 mt-auto">
                <!-- Y-Axis Labels -->
                <div class="absolute inset-0 flex flex-col justify-between pointer-events-none z-0">
                    <div class="w-full flex justify-end items-center border-b border-zinc-100 pb-1 h-0">
                        <span class="text-[10px] uppercase tracking-widest text-zinc-400 font-medium translate-y-[-50%] pr-2">150k</span>
                    </div>
                    <div class="w-full flex justify-end items-center border-b border-zinc-100 pb-1 h-0">
                        <span class="text-[10px] uppercase tracking-widest text-zinc-400 font-medium translate-y-[-50%] pr-2">120k</span>
                    </div>
                    <div class="w-full flex justify-end items-center border-b border-zinc-100 pb-1 h-0">
                        <span class="text-[10px] uppercase tracking-widest text-zinc-400 font-medium translate-y-[-50%] pr-2">90k</span>
                    </div>
                    <div class="w-full flex justify-end items-center border-b border-zinc-100 pb-1 h-0">
                        <span class="text-[10px] uppercase tracking-widest text-zinc-400 font-medium translate-y-[-50%] pr-2">60k</span>
                    </div>
                    <div class="w-full flex justify-end items-center border-b border-zinc-100 pb-1 h-0">
                        <span class="text-[10px] uppercase tracking-widest text-zinc-400 font-medium translate-y-[-50%] pr-2">30k</span>
                    </div>
                </div>

                <!-- X-Axis Labels -->
                <div
                    class="absolute bottom-[-35px] left-0 right-12 flex justify-between text-[10px] uppercase tracking-widest text-zinc-400 font-medium z-0 px-2">
                    <span>Oct 12</span><span>Oct 16</span><span>Oct 20</span><span>Oct 22</span>
                </div>

                <!-- Candlestick Wrapper -->
                <div class="absolute inset-y-0 left-0 right-14 flex items-end justify-between px-2 z-10 pb-[1px]"
                    id="candlestick-wrapper"></div>

                <!-- Highlight Region -->
                <div id="highlight-overlay"
                    class="absolute top-2 bottom-0 left-[42%] w-[20%] z-20 pointer-events-none transition-all duration-1000 ease-out"
                    style="opacity: 0; transform: translateY(10px);">
                    <div
                        class="absolute inset-0 bg-zinc-50/60 border-t border-l border-r border-zinc-200 rounded-t-[1.5rem]">
                    </div>
                    <div
                        class="absolute top-[45%] -left-3.5 w-7 h-7 rounded-full bg-white ring-1 ring-zinc-200 flex items-center justify-center text-zinc-500 shadow-sm pointer-events-auto cursor-pointer hover:text-zinc-900 transition-all">
                        <iconify-icon icon="solar:alt-arrow-left-linear" width="16" height="16"></iconify-icon>
                    </div>
                    <div
                        class="absolute top-[45%] -right-3.5 w-7 h-7 rounded-full bg-white ring-1 ring-zinc-200 flex items-center justify-center text-zinc-500 shadow-sm pointer-events-auto cursor-pointer hover:text-zinc-900 transition-all">
                        <iconify-icon icon="solar:alt-arrow-right-linear" width="16" height="16"></iconify-icon>
                    </div>
                    <div
                        class="absolute -top-5 right-[-10%] sm:right-0 bg-white ring-1 ring-zinc-200 text-zinc-900 px-4 py-2 rounded-xl text-xs font-medium flex items-baseline gap-1.5 shadow-lg pointer-events-auto">
                        $142,590
                        <span class="text-[10px] uppercase tracking-widest text-zinc-400 font-medium">EUR</span>
                    </div>
                    <div class="absolute inset-y-0 right-0 w-[1px] bg-zinc-300"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        (function() {
            const init = () => {
                const mainCard = document.getElementById('main-card');
                const wrapper = document.getElementById('candlestick-wrapper');
                const highlight = document.getElementById('highlight-overlay');
                
                mainCard.style.opacity = '1';
                mainCard.style.transform = 'translateY(0)';

                const data = [45, 42, 38, 30, 25, 22, 18, 25, 22, 28, 32, 28, 35, 38, 45, 55, 58, 65, 58, 62, 65, 70, 75, 85, 80, 85];
                let prev = data[0];

                data.forEach((val, i) => {
                    const open = prev;
                    const close = val + (Math.random() * 4 - 2); 
                    const isUp = close >= open;
                    const high = Math.max(open, close) + (Math.random() * 8);
                    const low = Math.min(open, close) - (Math.random() * 8);

                    const map = (v) => Math.max(0, Math.min(100, v));
                    const candle = document.createElement('div');
                    candle.className = 'relative w-1.5 sm:w-2 h-full flex flex-col items-center group transition-transform duration-[800ms]';
                    candle.style.cssText = `transform: scaleY(0); transform-origin: bottom; transition-delay: ${i * 15}ms;`;
                    
                    candle.innerHTML = `
                        <div class="absolute w-[1px] bg-zinc-200 group-hover:bg-zinc-400 transition-colors" style="top: ${100-map(high)}%; bottom: ${map(low)}%;"></div>
                        <div class="absolute w-full ${isUp ? 'bg-zinc-800 group-hover:bg-black' : 'bg-zinc-300 group-hover:bg-zinc-400'} rounded-sm transition-all" 
                             style="top: ${100-map(Math.max(open, close))}%; bottom: ${map(Math.min(open, close))}%;"></div>
                    `;
                    wrapper.appendChild(candle);
                    prev = close;
                });

                setTimeout(() => {
                    Array.from(wrapper.children).forEach(c => c.style.transform = 'scaleY(1)');
                    setTimeout(() => {
                        highlight.style.opacity = '1';
                        highlight.style.transform = 'translateY(0)';
                    }, 800);
                }, 300);
            };
            if (document.readyState === 'complete') init();
            else window.addEventListener('load', init);
        })();
    </script>
</div>
