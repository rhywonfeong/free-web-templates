<section class="md:py-32 border-white/[0.03] border-t pt-24 pb-24 relative">
  <div class="lg:px-12 max-w-[1400px] mr-auto ml-auto pr-6 pl-6">
    <div
      class="md:p-12 overflow-hidden border-white/[0.05] flashlight-card bg-[#050914] border rounded-sm relative shadow-2xl"
      style="--mouse-x: 42px; --mouse-y: 486.25px;">
      <!-- Brackets -->
      <div class="absolute top-0 left-0 w-3 h-3 border-t border-l border-amber-500/50"></div>
      <div class="absolute top-0 right-0 w-3 h-3 border-t border-r border-amber-500/50"></div>
      <div class="absolute bottom-0 left-0 w-3 h-3 border-b border-l border-amber-500/50"></div>
      <div class="absolute bottom-0 right-0 w-3 h-3 border-b border-r border-amber-500/50"></div>

      <div class="absolute top-0 right-0 w-96 h-96 rounded-full blur-[100px] pointer-events-none bg-amber-500/5"></div>

      <div class="flex mb-10 items-center justify-between relative z-10 p-6 md:p-0">
        <span class="uppercase block text-xs font-medium text-slate-400 tracking-wide">
                Network Log
              </span>
        <div
          class="flex gap-2 text-xs font-mono text-slate-500 border border-white/[0.1] px-3 py-1 bg-white/[0.02] rounded-sm">
          <span id="slide-number" class="transition-all duration-300 text-amber-400">
                  01
                </span>
          / 03
        </div>
      </div>

      <div class="grid lg:grid-cols-2 gap-12 items-center px-6 pb-6 md:px-0 md:pb-0 relative z-10">
        <div class="">
          <h3 class="text-3xl lg:text-4xl font-light tracking-tight leading-[1.2] mb-8 text-slate-200">
            Our AI models have successfully generated over
            <span class="text-transparent bg-clip-text bg-gradient-to-r font-medium from-amber-300 to-amber-400">
                    1.2 Billion images
                  </span>
            this year.
          </h3>
          <button class="btn-beam-wrap group">
                  <div class="btn-beam-content px-6 py-2 text-xs font-medium flex items-center gap-2 transition-colors duration-300 text-amber-100">
                    Start Generating
                    <iconify-icon icon="solar:arrow-right-linear"></iconify-icon>
                  </div>
                </button>
        </div>

        <div class="flex flex-col gap-4 w-full">
          <!-- Dynamic Image Area -->
          <div
            class="relative w-full h-[350px] rounded-sm overflow-hidden border border-white/[0.05] bg-[#0a0f1c] group p-1">
            <img id="gen-slide-img" src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/variants/bb7d69a4-6b69-421d-8749-3a98dac099a1/800w.png" alt="Generated visual" class="w-full h-full object-cover transition-all duration-500 group-hover:scale-[1.02] rounded-sm">

            <div
              class="absolute top-4 right-4 z-20 bg-[#050914]/80 backdrop-blur-md border border-white/[0.1] px-3 py-1.5 rounded-sm flex items-center gap-2">
              <div class="w-1.5 h-1.5 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,211,238,0.8)] bg-amber-400">
              </div>
              <span class="text-[9px] font-mono uppercase tracking-widest text-slate-300">
                      Model: Alpha
                    </span>
            </div>
          </div>

          <!-- Prompt Info & Navigation -->
          <div class="flex items-start justify-between gap-4 bg-white/[0.02] border border-white/[0.05] p-4 rounded-sm">
            <div class="flex-1">
              <p class="text-[10px] font-mono mb-1 tracking-widest uppercase text-amber-400/70">
                Input Data
              </p>
              <p id="gen-slide-prompt" class="text-xs font-light text-slate-300 line-clamp-2 leading-relaxed">
                A surreal figure standing in calm waters beneath a massive
                glowing crescent moon, atmospheric lighting, cinematic, 8k
                resolution.
              </p>
            </div>

            <div class="flex gap-1 shrink-0">
              <button onclick="changeGenSlide(-1)" class="flex hover:bg-white/[0.05] transition-colors w-8 h-8 border-white/[0.1] border rounded-sm items-center justify-center text-slate-400 hover:text-white">
                      <iconify-icon icon="solar:alt-arrow-left-linear"></iconify-icon>
                    </button>
              <button onclick="changeGenSlide(1)" class="flex transition-all border w-8 h-8 rounded-sm items-center justify-center bg-amber-500/10 hover:bg-amber-500/20 border-amber-500/30 text-amber-400">
                      <iconify-icon icon="solar:alt-arrow-right-linear"></iconify-icon>
                    </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const genSlides = [
            { img: "https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/variants/bb7d69a4-6b69-421d-8749-3a98dac099a1/800w.png", prompt: "A surreal figure standing in calm waters beneath a massive glowing crescent moon, atmospheric lighting, cinematic, 8k resolution.", id: "01" },
            { img: "https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/variants/333ed9cc-5ceb-4a82-b640-b96d93a6743f/800w.png", prompt: "A solitary figure walking across an expansive desert dune at sunset, warm golden hour lighting, dramatic shadows, photorealistic.", id: "02" },
            { img: "https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/variants/429fb0e2-bd97-413a-8168-ae276101fc2c/800w.png", prompt: "A futuristic monolithic structure emerging from a hazy landscape, dramatic scale, sci-fi concept art, high detail.", id: "03" }
            ];
            let currentGenIdx = 0;

            function changeGenSlide(direction) {
            currentGenIdx = (currentGenIdx + direction + genSlides.length) % genSlides.length;
            const imgEl = document.getElementById('gen-slide-img');
            const numEl = document.getElementById('slide-number');
            const promptEl = document.getElementById('gen-slide-prompt');

            if(imgEl && numEl && promptEl) {
                imgEl.style.opacity = '0';
                numEl.style.opacity = '0';
                promptEl.style.opacity = '0';

                setTimeout(() => {
                    imgEl.src = genSlides[currentGenIdx].img;
                    numEl.innerText = genSlides[currentGenIdx].id;
                    promptEl.innerText = genSlides[currentGenIdx].prompt;

                    imgEl.onload = () => { imgEl.style.opacity = '1'; };
                    if(imgEl.complete) imgEl.style.opacity = '1';

                    numEl.style.opacity = '1';
                    promptEl.style.opacity = '1';
                }, 200);
            }
            }
    </script>
  </div>
</section>
