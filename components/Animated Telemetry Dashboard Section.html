  <script>
    (function() {
              const initTelemetry = () => {
                  if (typeof gsap !== 'undefined') {
                      gsap.to(".reveal-word", {
                          y: "0%",
                          duration: 1.2,
                          stagger: 0.15,
                          ease: "power4.out",
                          scrollTrigger: {
                              trigger: "#reveal-title",
                              start: "top 85%",
                          }
                      });
                  }

                  const canvas = document.getElementById('quantumChart');
                  if (!canvas) return;
                  const ctx = canvas.getContext('2d');

                  const initChartJS = () => {
                      const gradient1 = ctx.createLinearGradient(0, 0, 0, canvas.clientHeight || 300);
                      gradient1.addColorStop(0, 'rgba(34, 211, 238, 0.4)');
                      gradient1.addColorStop(1, 'rgba(34, 211, 238, 0.0)');

                      const gradient2 = ctx.createLinearGradient(0, 0, 0, canvas.clientHeight || 300);
                      gradient2.addColorStop(0, 'rgba(59, 130, 246, 0.4)');
                      gradient2.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

                      const numPoints = 180;
                      const labels = Array.from({length: numPoints}, (_, i) => i);
                      
                      const generateData = (freq, phase, baseHeight, amp) => {
                          const time = Date.now() * 0.001;
                          return labels.map(i => {
                              const normalizedX = i / numPoints;
                              const envelope = Math.sin(normalizedX * Math.PI);
                              const noise1 = Math.sin(i * freq + time + phase);
                              const noise2 = Math.cos(i * freq * 0.5 - time * 1.2);
                              const noise3 = Math.sin(i * freq * 2 + time * 0.8);
                              let value = (noise1 * 0.5 + noise2 * 0.3 + noise3 * 0.2);
                              return baseHeight + (value * amp * envelope);
                          });
                      };

                      if (window.quantumChartInstance) {
                          window.quantumChartInstance.destroy();
                      }

                      window.quantumChartInstance = new Chart(ctx, {
                          type: 'line',
                          data: {
                              labels: labels,
                              datasets: [
                                  {
                                      data: generateData(0.06, 200, 30, 40),
                                      borderColor: 'rgba(34, 211, 238, 0.9)',
                                      backgroundColor: gradient1,
                                      borderWidth: 2,
                                      fill: true,
                                      tension: 0.4,
                                      pointRadius: 0
                                  },
                                  {
                                      data: generateData(0.04, 100, 50, 30),
                                      borderColor: 'rgba(59, 130, 246, 0.6)',
                                      backgroundColor: gradient2,
                                      borderWidth: 1.5,
                                      fill: true,
                                      tension: 0.4,
                                      pointRadius: 0
                                  },
                                  {
                                      data: generateData(0.02, 0, 70, 20),
                                      borderColor: 'rgba(55, 65, 81, 0.4)',
                                      borderWidth: 1,
                                      fill: false,
                                      tension: 0.4,
                                      pointRadius: 0
                                  }
                              ]
                          },
                          options: {
                              responsive: true,
                              maintainAspectRatio: false,
                              animation: false,
                              plugins: {
                                  legend: { display: false },
                                  tooltip: { enabled: false }
                              },
                              scales: {
                                  x: { display: false },
                                  y: { display: false, min: 0, max: 100 }
                              },
                              layout: { padding: 0 }
                          }
                      });

                      const animate = () => {
                          window.quantumChartInstance.data.datasets[0].data = generateData(0.06, 200, 30, 40);
                          window.quantumChartInstance.data.datasets[1].data = generateData(0.04, 100, 50, 30);
                          window.quantumChartInstance.data.datasets[2].data = generateData(0.02, 0, 70, 20);
                          window.quantumChartInstance.update('none');
                          requestAnimationFrame(animate);
                      };
                      animate();
                  };

                  if (typeof Chart === 'undefined') {
                      const script = document.createElement('script');
                      script.src = 'https://cdn.jsdelivr.net/npm/chart.js';
                      script.onload = initChartJS;
                      document.head.appendChild(script);
                  } else {
                      initChartJS();
                  }
              };

              if (document.readyState === 'complete' || document.readyState === 'interactive') {
                  setTimeout(initTelemetry, 100);
              } else {
                  document.addEventListener('DOMContentLoaded', initTelemetry);
              }
          })();
  </script>
