<div class="relative flex items-center justify-center p-12 bg-[#020208]" style="font-family: 'Inter', sans-serif;">
  <!-- External Resources -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <div class="relative group">
    <!-- Quantum Aether Button -->
    <button id="aether-btn" type="button"
      class="group relative flex items-center justify-center w-[250px] h-[70px] border-0 p-0 rounded-2xl overflow-hidden cursor-pointer bg-[#050b1a] outline-none transition-all duration-[220ms] ease-[cubic-bezier(0.34,1.4,0.5,1)] hover:-translate-y-[2px] active:translate-y-[1px] active:scale-[0.985] focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#00d2ff] focus-visible:outline-offset-[5px]"
      style="box-shadow: 0 24px 48px rgba(4, 98, 126, 0.2), 0 3px 10px rgba(2, 6, 20, 0.35);">

      <canvas id="aether-gl" class="absolute inset-0 w-full h-full block group-[.nogl]:hidden" aria-hidden="true"></canvas>
      
      <!-- Fallback for no WebGL -->
      <div class="absolute inset-0 hidden group-[.nogl]:block" style="background: radial-gradient(130% 170% at 50% 118%, #61d3ff 0%, #33a7ff 24%, #084c8e 56%, #050a19 88%);"></div>
      
      <span class="relative z-10 pointer-events-none font-semibold text-sm tracking-[.26em] indent-[.26em] text-[#e2f1ff]" style="text-shadow: 0 1px 12px rgba(0, 16, 40, .85);">AETHER DRIVE</span>
    </button>

    <script>
      (function () {
        const btn = document.getElementById('aether-btn');
        const canvas = document.getElementById('aether-gl');
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const gl = canvas.getContext('webgl');
        
        if (!gl) { btn.classList.add('nogl'); return; }

        const hoverStyles = "0 30px 60px rgba(0, 150, 220, 0.35), 0 4px 12px rgba(2, 6, 20, 0.4)";
        const defaultStyles = "0 24px 48px rgba(4, 98, 126, 0.2), 0 3px 10px rgba(2, 6, 20, 0.35)";
        
        btn.addEventListener('mouseenter', () => { if(!reduced) btn.style.boxShadow = hoverStyles; });
        btn.addEventListener('mouseleave', () => { if(!reduced) btn.style.boxShadow = defaultStyles; });

        const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
        const FS = `
          precision highp float;
          uniform vec2 u_res;
          uniform float u_time, u_heat, u_flash;
          float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
          float noise(vec2 p){
            vec2 i=floor(p), f=fract(p);
            vec2 u=f*f*(3.0-2.0*f);
            return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);
          }
          float fbm(vec2 p){
            float v=0.0; float a=0.5;
            for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.02+vec2(17.3,9.1); a*=0.5; }
            return v;
          }
          void main(){
            vec2 uv = gl_FragCoord.xy / u_res;
            vec2 p = uv * vec2(u_res.x/u_res.y, 1.0) * 2.1;
            float t = u_time;
            float heat = u_heat + u_flash * 1.3;
            vec2 q = vec2(fbm(p + vec2(0.0, t*0.32)), fbm(p + vec2(5.2, t*0.27)));
            vec2 r = vec2(fbm(p + 1.7*q + vec2(1.7, 9.2) + t*0.12), fbm(p + 1.6*q + vec2(8.3, 2.8) + t*0.09));
            float v = fbm(p + 2.1*r);
            float m = v*1.4 + heat*0.22;
            vec3 c1 = vec3(0.004, 0.008, 0.035), c2 = vec3(0.04, 0.08, 0.35), c3 = vec3(0.0, 0.6, 1.0), c4 = vec3(0.7, 0.9, 1.0);
            vec3 col = mix(c1, c2, smoothstep(0.2, 0.52, m));
            col = mix(col, c3, smoothstep(0.52, 0.8, m));
            col = mix(col, c4, smoothstep(0.82, 1.02, m));
            float vein = exp(-abs(q.x - q.y) * 9.0);
            col += c3 * vein * (0.12 + heat * 0.25);
            vec2 e = uv * (1.0 - uv);
            float vig = pow(e.x * e.y * 16.0, 0.28);
            col *= mix(0.5, 1.0, vig);
            col *= 0.78 + heat * 0.5;
            col += vec3(0.82, 0.94, 1.0) * u_flash * 0.4 * (0.3 + v);
            gl_FragColor = vec4(col, 1.0);
          }`;

        function compile(type, src) {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          return s;
        }

        const prog = gl.createProgram();
        gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
        gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
        gl.linkProgram(prog);
        gl.useProgram(prog);

        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
        const locP = gl.getAttribLocation(prog, 'p');
        gl.enableVertexAttribArray(locP);
        gl.vertexAttribPointer(locP, 2, gl.FLOAT, false, 0, 0);

        const uRes = gl.getUniformLocation(prog, 'u_res');
        const uTime = gl.getUniformLocation(prog, 'u_time');
        const uHeat = gl.getUniformLocation(prog, 'u_heat');
        const uFlash = gl.getUniformLocation(prog, 'u_flash');

        function resize() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const w = Math.max(1, Math.round(btn.clientWidth * dpr));
          const h = Math.max(1, Math.round(btn.clientHeight * dpr));
          if (canvas.width !== w || canvas.height !== h) {
            canvas.width = w; canvas.height = h;
            gl.viewport(0, 0, w, h);
          }
        }

        let heat = 0, heatTarget = 0, erupt = 0, churn = 0, last = performance.now();

        btn.addEventListener('mouseenter', () => heatTarget = 1);
        btn.addEventListener('mouseleave', () => heatTarget = 0);
        btn.addEventListener('mousedown', () => erupt = 1);

        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          heat += (heatTarget - heat) * Math.min(1, dt * 6);
          erupt *= Math.exp(-3.2 * dt);
          churn += dt * (0.35 + heat * 1.1 + erupt * 2.2);
          resize();
          gl.uniform2f(uRes, canvas.width, canvas.height);
          gl.uniform1f(uTime, reduced ? 6.0 : churn);
          gl.uniform1f(uHeat, heat);
          gl.uniform1f(uFlash, erupt);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
  </div>
</div>
