<section
  class="bg-[#050508] text-white min-h-screen flex items-center justify-center overflow-hidden relative font-sans selection:bg-[#ccff00] selection:text-black"
  style="isolation: isolate;">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- Visual Background Layer -->
  <div
    class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,_#2a264a_0%,_transparent_60%)] opacity-50 pointer-events-none">
  </div>

  <!-- 3D Environment Container -->
  <div id="three-canvas-wrapper"
    class="absolute inset-0 z-0 flex items-center justify-center opacity-40 pointer-events-none">
    <script>
      {
                const container = document.getElementById('three-canvas-wrapper');
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 6;

                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                container.appendChild(renderer.domElement);

                const deviceGroup = new THREE.Group();
                const outlineGeo = new THREE.BoxGeometry(2.4, 4.8, 0.2);
                const edges = new THREE.EdgesGeometry(outlineGeo);
                const outlineMat = new THREE.LineBasicMaterial({ color: 0x8b7ff9, transparent: true, opacity: 0.15 });
                const deviceOutline = new THREE.LineSegments(edges, outlineMat);
                deviceGroup.add(deviceOutline);

                const contentParticles = [];
                const pGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
                const pMat1 = new THREE.MeshBasicMaterial({ color: 0xccff00, transparent: true, opacity: 0.8 });
                const pMat2 = new THREE.MeshBasicMaterial({ color: 0x8b7ff9, transparent: true, opacity: 0.6 });

                for (let i = 0; i < 8; i++) {
                    const mesh = new THREE.Mesh(pGeo, i % 2 === 0 ? pMat1 : pMat2);
                    mesh.position.set((Math.random() - 0.5) * 1.8, (Math.random() - 0.5) * 4.0, 0);
                    mesh.userData = { rx: (Math.random() - 0.5) * 0.05, ry: (Math.random() - 0.5) * 0.05, yOffset: Math.random() * Math.PI * 2 };
                    contentParticles.push(mesh);
                    deviceGroup.add(mesh);
                }
                scene.add(deviceGroup);

                let mouseX = 0, mouseY = 0;
                window.addEventListener('mousemove', (e) => {
                    mouseX = (e.clientX - window.innerWidth / 2) * 0.0005;
                    mouseY = (e.clientY - window.innerHeight / 2) * 0.0005;
                });

                const clock = new THREE.Clock();
                function animate() {
                    requestAnimationFrame(animate);
                    const time = clock.getElapsedTime();
                    deviceGroup.rotation.y += 0.05 * (mouseX - deviceGroup.rotation.y) + 0.002;
                    deviceGroup.rotation.x += 0.05 * (mouseY - deviceGroup.rotation.x);
                    deviceGroup.position.y = Math.sin(time * 0.5) * 0.2;
                    contentParticles.forEach(p => {
                        p.rotation.x += p.userData.rx;
                        p.rotation.y += p.userData.ry;
                        p.position.y += Math.sin(time * 2 + p.userData.yOffset) * 0.005;
                    });
                    renderer.render(scene, camera);
                }
                animate();
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }
    </script>
  </div>

  <!-- Interface Layer -->
  <main
    class="relative z-10 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 lg:py-32 flex flex-col items-center text-center">

    <!-- Floating Elements -->
    <div id="pills-container" class="hidden lg:block absolute inset-0 pointer-events-none">
      <div
        class="pill-c absolute top-[15%] left-1/2 bg-[#121217] rounded-full p-1.5 pr-5 flex items-center gap-3 border border-white/5 shadow-2xl"
        style="transform: translateX(-50%);">
        <div class="bg-[#ccff00] text-black p-2 rounded-full flex items-center justify-center"><iconify-icon
            icon="solar:shield-check-linear" width="18"></iconify-icon></div>
        <span class="text-xs text-gray-300 font-medium tracking-wide">Top Security</span>
      </div>
      <div
        class="pill-s absolute top-[35%] left-[8%] bg-[#121217] rounded-full p-1.5 pr-5 flex items-center gap-3 border border-white/5 shadow-2xl">
        <div class="bg-[#8b7ff9] text-white p-2 rounded-full flex items-center justify-center"><iconify-icon
            icon="solar:bolt-linear" width="18"></iconify-icon></div>
        <span class="text-xs text-gray-300 font-medium tracking-wide">Fast Speed</span>
      </div>
      <div
        class="pill-s absolute top-[35%] right-[8%] bg-[#121217] rounded-full p-1.5 pr-5 flex items-center gap-3 border border-white/5 shadow-2xl">
        <div class="bg-black text-white p-2 rounded-full flex items-center justify-center border border-white/10">
          <iconify-icon icon="solar:card-linear" width="18"></iconify-icon>
        </div>
        <span class="text-xs text-gray-300 font-medium tracking-wide">Fast Transactions</span>
      </div>
      <div
        class="pill-s absolute bottom-[25%] left-[12%] bg-[#121217] rounded-full p-1.5 pr-5 flex items-center gap-3 border border-white/5 shadow-2xl">
        <div class="bg-[#ccff00] text-black p-2 rounded-full flex items-center justify-center"><iconify-icon
            icon="solar:cloud-check-linear" width="18"></iconify-icon></div>
        <span class="text-xs text-gray-300 font-medium tracking-wide">Cloud Sync</span>
      </div>
      <div
        class="pill-s absolute bottom-[25%] right-[12%] bg-[#121217] rounded-full p-1.5 pr-5 flex items-center gap-3 border border-white/5 shadow-2xl">
        <div class="bg-[#8b7ff9] text-white p-2 rounded-full flex items-center justify-center"><iconify-icon
            icon="solar:bell-linear" width="18"></iconify-icon></div>
        <span class="text-xs text-gray-300 font-medium tracking-wide">Real-Time Alerts</span>
      </div>
      <script>
        {
                    const centers = document.querySelectorAll('.pill-c');
                    const sides = document.querySelectorAll('.pill-s');
                    const animatePills = () => {
                        const elapsed = Date.now() * 0.001;
                        centers.forEach(el => {
                            el.style.transform = `translateX(-50%) translateY(${Math.sin(elapsed * 1.5) * 8}px)`;
                        });
                        sides.forEach((el, i) => {
                            el.style.transform = `translateY(${Math.sin(elapsed + i) * 12}px)`;
                        });
                        requestAnimationFrame(animatePills);
                    };
                    animatePills();
                }
      </script>
    </div>

    <!-- Hero Content -->
    <div id="hero-text" class="max-w-3xl flex flex-col items-center z-10"
      style="opacity: 0; transform: translateY(30px);">
      <div class="flex items-center gap-2 text-[#ccff00] font-medium text-xs tracking-widest uppercase mb-8">
        <iconify-icon icon="solar:stars-linear" width="18"></iconify-icon>
        <span>Core Benefits</span>
      </div>
      <h1 class="text-5xl sm:text-6xl lg:text-[5.5rem] font-normal tracking-tight mb-8 leading-[1.1] text-white">
        Beyond simple <br class="hidden sm:block"> task management
      </h1>
      <p class="text-lg text-gray-400 max-w-xl mb-12 leading-relaxed font-light">
        Our platform delivers a powerful suite of tools designed to optimize workflows, automate security, and drive
        smarter decisions.
      </p>
      <div class="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto">
        <button class="bg-[#ccff00] text-black px-8 py-3.5 rounded-full text-sm font-medium hover:bg-[#b3e600] transition-all duration-300 w-full sm:w-auto hover:scale-105 active:scale-95">
                    Get Started
                </button>
        <button class="bg-transparent border border-[#52525b] text-gray-300 px-8 py-3.5 rounded-full text-sm font-medium hover:border-white hover:text-white transition-all duration-300 w-full sm:w-auto">
                    Explore Features
                </button>
      </div>
      <script>
        document.addEventListener("DOMContentLoaded", () => {
                    document.getElementById('hero-text').animate([
                        { opacity: 0, transform: 'translateY(30px)' },
                        { opacity: 1, transform: 'translateY(0)' }
                    ], {
                        duration: 1000,
                        delay: 300,
                        easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)',
                        fill: 'forwards'
                    });
                });
      </script>
    </div>
  </main>
</section>
