<section class="border-white/[0.03] bg-gradient-to-b from-white/[0.01] to-transparent border-t pt-24 pb-24 relative">
  <div class="max-w-[1400px] mx-auto px-6 lg:px-12">
    <div class="grid lg:grid-cols-2 gap-16 items-center">
      <div
        class="relative rounded-sm overflow-hidden aspect-square border border-white/[0.05] group bg-[#0a0f1c] p-2 shadow-2xl flashlight-card"
        style="--mouse-x: 537px; --mouse-y: 266.75px;">
        <div class="w-full h-full relative overflow-hidden rounded-sm">
          <img id="version-display-image" src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/variants/e41c2eba-a959-4377-8295-ac996393ebcd/1600w.png" class="w-full h-full object-cover transition-all duration-700 group-hover:scale-105 filter hue-rotate-180 saturate-50 contrast-125">
          <div class="absolute inset-0 bg-gradient-to-t from-[#050914] via-transparent to-transparent opacity-80"></div>
        </div>
      </div>

      <div class="">
        <div class="flex gap-6 border-white/[0.05] overflow-x-auto border-b mb-10 pb-3 gap-x-6 gap-y-6"
          id="version-tabs-container">
          <button onclick="updateVersionTab('v4')" class="version-tab text-sm font-medium text-slate-200 pb-3 border-b inline-block bg-transparent cursor-pointer transition-colors tracking-wide uppercase border-amber-500" data-version="v4">
                  Core v4.0
                </button>
          <button onclick="updateVersionTab('v3')" class="version-tab text-sm font-light text-slate-500 hover:text-slate-300 pb-3 border-b border-transparent inline-block bg-transparent cursor-pointer transition-colors tracking-wide uppercase" data-version="v3">
                  Core v3.0
                </button>
          <button onclick="updateVersionTab('v2')" class="version-tab text-sm font-light text-slate-500 hover:text-slate-300 pb-3 border-b border-transparent inline-block bg-transparent cursor-pointer transition-colors tracking-wide uppercase" data-version="v2">
                  Legacy
                </button>
        </div>

        <span class="uppercase block text-[10px] font-mono tracking-widest mb-3 border px-2 py-1 rounded-sm w-max text-amber-400 border-amber-500/30 bg-amber-500/10">
                Deployment Specs
              </span>

        <div class="flex justify-between items-start mb-6">
          <h2 class="text-4xl font-light tracking-tight leading-none text-slate-100">
            <span id="version-title" class="block">Nexus Alpha</span>
            <span id="version-subtitle" class="block text-xl text-slate-500 font-light mt-3">
                    Optimization Patch
                  </span>
          </h2>
          <div class="flex flex-col gap-2">
            <button onclick="navigateVersion(1)" class="flex border border-white/[0.1] hover:bg-white/[0.05] transition-colors cursor-pointer text-slate-400 w-10 h-10 rounded-sm items-center justify-center">
                    <iconify-icon icon="solar:alt-arrow-right-linear" class="text-lg"></iconify-icon>
                  </button>
          </div>
        </div>

        <div id="version-tags" class="flex flex-wrap gap-2 mb-8">
          <span class="px-2 py-1 rounded-sm bg-white/[0.02] text-[10px] font-mono text-slate-400 border border-white/[0.05] uppercase tracking-wide">
                  12B Params
                </span>
          <span class="px-2 py-1 rounded-sm bg-white/[0.02] text-[10px] font-mono text-slate-400 border border-white/[0.05] uppercase tracking-wide">
                  Prompt Coherence
                </span>
          <span class="px-2 py-1 rounded-sm bg-white/[0.02] text-[10px] font-mono text-slate-400 border border-white/[0.05] uppercase tracking-wide">
                  Res 1024x1024
                </span>
        </div>

        <p id="version-description" class="text-slate-400 text-sm font-light leading-relaxed mb-10 max-w-md">
          Our latest AI model update enhances prompt understanding and
          image coherence. Generation times are drastically reduced while
          boosting base resolution to 1024x1024.
        </p>

        <button class="btn-beam-wrap group w-max">
                <div class="btn-beam-content px-6 py-2.5 text-xs font-medium flex items-center gap-2 transition-colors duration-300 text-amber-100">
                  Review Changelog
                </div>
              </button>
      </div>
    </div>
  </div>
  <script>
    const versionData = {
          'v4': {
              title: 'Nexus Alpha',
              subtitle: 'Optimization Patch',
              desc: 'Our latest AI model update enhances prompt understanding and image coherence. Generation times are drastically reduced while boosting base resolution to 1024x1024.',
              tags: ['12B Params', 'Prompt Coherence', 'Res 1024x1024'],
              img: 'https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/variants/e41c2eba-a959-4377-8295-ac996393ebcd/1600w.png'
          },
          'v3': {
              title: 'Core Delta',
              subtitle: 'Structural Engine',
              desc: 'Implemented base framework for structural constraints. Enabled ControlNet-based spatial control parameters directly in the execution pipeline.',
              tags: ['8B Params', 'ControlNet', 'Fast Routing'],
              img: 'https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/variants/2cfc7a4b-7b93-4383-bb69-3a3535aa9000/1600w.png'
          },
          'v2': {
              title: 'Legacy Beta',
              subtitle: 'Initial Boot',
              desc: 'The foundational model structure. Allowed for rapid prototyping via primitive image distribution algorithms.',
              tags: ['3B Params', 'SD Base', 'Raw Power'],
              img: 'https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/variants/00b2a18f-3b42-4b51-822c-d32fc870fc2c/1600w.jpg'
          }
          };

          let currentActiveVersion = 'v4';
          const versionsList = ['v4', 'v3', 'v2'];

          function updateVersionTab(version) {
          if (!versionData[version]) return;
          currentActiveVersion = version;

          const tabs = document.querySelectorAll('.version-tab');
          tabs.forEach(tab => {
              if (tab.getAttribute('data-version') === version) {
              tab.classList.remove('text-slate-500', 'hover:text-slate-300', 'border-transparent', 'font-light');
              tab.classList.add('text-slate-200', 'border-amber-500', 'font-medium');
              } else {
              tab.classList.remove('text-slate-200', 'border-amber-500', 'font-medium');
              tab.classList.add('text-slate-500', 'hover:text-slate-300', 'border-transparent', 'font-light');
              }
          });

          const data = versionData[version];
          const imgEl = document.getElementById('version-display-image');
          const titleEl = document.getElementById('version-title');
          const subtitleEl = document.getElementById('version-subtitle');
          const descEl = document.getElementById('version-description');
          const tagsEl = document.getElementById('version-tags');

          imgEl.style.opacity = '0.5';
          setTimeout(() => {
              imgEl.src = data.img;
              imgEl.onload = () => { imgEl.style.opacity = '1'; };
              if(imgEl.complete) imgEl.style.opacity = '1';
          }, 150);

          titleEl.textContent = data.title;
          subtitleEl.textContent = data.subtitle;
          descEl.textContent = data.desc;

          tagsEl.innerHTML = data.tags.map(tag =>
              `<span class="px-2 py-1 rounded-sm bg-white/[0.02] text-[10px] font-mono text-slate-400 border border-white/[0.05] uppercase tracking-wide">${tag}</span>`
          ).join('');
          }

          function navigateVersion(direction) {
          const currentIndex = versionsList.indexOf(currentActiveVersion);
          let newIndex = currentIndex + direction;

          if (newIndex >= versionsList.length) newIndex = 0;
          if (newIndex < 0) newIndex = versionsList.length - 1;

          updateVersionTab(versionsList[newIndex]);
          }
  </script>
</section>
