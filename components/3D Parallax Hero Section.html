<section
    class="bg-[#050505] text-zinc-100 font-sans antialiased overflow-hidden selection:bg-cyan-500/30 m-0 p-0 h-screen w-full flex items-center justify-center relative">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <!-- Background Ambient Glow -->
    <div
        class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[60vw] h-[60vw] max-w-[800px] max-h-[800px] rounded-full bg-cyan-600/10 blur-[100px] pointer-events-none mix-blend-screen animate-pulse-glow z-0">
    </div>

    <main id="track-pad" style="perspective: 1200px;"
        class="relative w-full h-full flex items-center justify-center z-10 cursor-crosshair">
        <div id="scene" style="transform-style: preserve-3d;"
            class="relative w-full max-w-7xl h-full flex items-center justify-center transition-transform duration-700 ease-out">

            <!-- LAYER -3: Deepest Background -->
            <div style="transform: translateZ(-600px) scale(1.6);"
                class="absolute inset-0 flex items-center justify-center pointer-events-none z-0">
                <div
                    class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.03)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:64px_64px] [mask-image:radial-gradient(ellipse_60%_60%_at_50%_50%,#000_10%,transparent_100%)]">
                </div>
                <div
                    class="absolute top-1/4 right-1/4 w-96 h-96 rounded-full bg-blue-900/30 blur-[60px] mix-blend-screen">
                </div>
            </div>

            <!-- LAYER -2: Background UI -->
            <div style="transform: translateZ(-300px) scale(1.2);"
                class="absolute inset-0 pointer-events-none z-10 flex items-center justify-center opacity-60 blur-[3px]">
                <div
                    class="absolute top-[20%] left-[10%] w-80 bg-zinc-950/80 border border-white/5 rounded-2xl p-6 backdrop-blur-2xl shadow-[0_0_50px_rgba(6,182,212,0.05)] animate-float-slow">
                    <div class="flex gap-2 mb-6">
                        <div class="w-2.5 h-2.5 rounded-full bg-zinc-700"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-zinc-700"></div>
                        <div class="w-2.5 h-2.5 rounded-full bg-zinc-700"></div>
                    </div>
                    <div class="space-y-3">
                        <div class="h-2 w-full bg-zinc-800/50 rounded-full"></div>
                        <div class="h-2 w-4/5 bg-zinc-800/50 rounded-full"></div>
                        <div class="h-2 w-2/3 bg-zinc-800/50 rounded-full"></div>
                    </div>
                </div>

                <div
                    class="absolute bottom-[20%] right-[10%] w-64 bg-zinc-900/40 border border-blue-500/10 rounded-2xl p-5 backdrop-blur-2xl animate-float-medium">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-8 h-8 rounded-full bg-blue-500/10 flex items-center justify-center text-blue-400">
                            <iconify-icon icon="solar:server-linear" width="16"></iconify-icon>
                        </div>
                        <div class="text-xs text-zinc-400 font-medium">Node Cluster</div>
                    </div>
                    <div class="flex items-end gap-1.5 h-16 w-full">
                        <div class="w-full bg-blue-500/20 rounded-sm h-[30%]"></div>
                        <div class="w-full bg-blue-500/60 rounded-sm h-[80%]"></div>
                        <div class="w-full bg-blue-500/80 rounded-sm h-[100%] shadow-[0_0_15px_rgba(59,130,246,0.5)]">
                        </div>
                        <div class="w-full bg-blue-500/40 rounded-sm h-[50%]"></div>
                    </div>
                </div>
            </div>

            <!-- LAYER -1: Midground Badges -->
            <div style="transform: translateZ(-100px);"
                class="absolute inset-0 pointer-events-none z-20 flex items-center justify-center opacity-90">
                <div
                    class="absolute top-[30%] left-[25%] flex items-center gap-2 px-3 py-1.5 rounded-full bg-zinc-900/80 border border-white/10 backdrop-blur-md animate-float-medium">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                    </span>
                    <span class="text-xs text-zinc-300 font-medium">Sync Active</span>
                </div>
                <div
                    class="absolute bottom-[35%] right-[25%] bg-zinc-900/60 border border-zinc-800 rounded-lg p-3 backdrop-blur-md animate-float-slow">
                    <div class="text-[10px] text-zinc-500 font-mono">XYZ-COORD: 14.004 : 89.221</div>
                </div>
            </div>

            <!-- LAYER 0: Foreground Content -->
            <div style="transform: translateZ(0px);"
                class="relative z-30 flex flex-col items-center text-center px-6 w-full max-w-4xl pointer-events-none">
                <div
                    class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 backdrop-blur-xl mb-8">
                    <iconify-icon icon="solar:layers-linear" width="16" class="text-cyan-400"></iconify-icon>
                    <span class="text-xs font-medium text-zinc-200 tracking-wide uppercase">Spatial Framework v2.0</span>
                </div>
                <h1 class="text-5xl sm:text-6xl md:text-8xl font-semibold tracking-tight text-white mb-6 leading-[1.1]">
                    Navigate the <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-br from-cyan-300 via-blue-500 to-purple-600 pb-2 drop-shadow-[0_0_30px_rgba(6,182,212,0.3)]">Infinite Depth</span>
                </h1>
                <p class="text-base md:text-xl text-zinc-400 max-w-2xl mb-10 font-normal leading-relaxed">
                    Experience seamless parallax navigation with multiple layers of intuitive panels stacked in
                    dimensional space.
                </p>
                <div class="flex flex-col sm:flex-row items-center gap-4 pointer-events-auto">
                    <button class="px-8 py-3.5 rounded-full bg-zinc-100 text-zinc-950 font-medium text-sm hover:scale-105 transition-all duration-300 flex items-center gap-2 shadow-[0_0_30px_rgba(255,255,255,0.2)]">
                        Initialize Core <iconify-icon icon="solar:arrow-right-linear" width="18"></iconify-icon>
                    </button>
                    <button class="px-8 py-3.5 rounded-full bg-zinc-900/50 border border-zinc-700/50 text-zinc-300 font-medium text-sm hover:bg-zinc-800 transition-all backdrop-blur-xl">
                        Explore Topology
                    </button>
                </div>
            </div>

            <!-- LAYER 1: Foreground Particles -->
            <div style="transform: translateZ(150px);"
                class="absolute inset-0 pointer-events-none z-40 flex items-center justify-center">
                <svg class="absolute inset-0 w-full h-full opacity-40" viewBox="0 0 1000 1000">
                    <path d="M 300,600 C 500,500 600,300 900,400" stroke="url(#cyan-grad)" stroke-width="1.5"
                        fill="none"></path>
                    <defs>
                        <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"></stop>
                            <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8"></stop>
                            <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"></stop>
                        </linearGradient>
                    </defs>
                </svg>
                <div
                    class="absolute top-[25%] right-[35%] w-1.5 h-1.5 bg-cyan-300 rounded-full shadow-[0_0_10px_2px_#22d3ee] animate-pulse">
                </div>
            </div>

            <!-- LAYER 2: Extreme Foreground Blur -->
            <div style="transform: translateZ(300px);"
                class="absolute inset-0 pointer-events-none z-50 overflow-hidden">
                <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-purple-600/10 rounded-full blur-[80px]"></div>
                <div class="absolute -top-32 -right-32 w-80 h-80 bg-cyan-600/10 rounded-full blur-[90px]"></div>
            </div>
        </div>
    </main>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: {
                        'float-slow': 'float 8s ease-in-out infinite',
                        'float-medium': 'float 6s ease-in-out infinite reverse',
                        'pulse-glow': 'pulse-glow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-20px)' } },
                        'pulse-glow': { '0%, 100%': { opacity: '0.4', filter: 'blur(40px)' }, '50%': { opacity: '0.8', filter: 'blur(60px)' } }
                    }
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const trackPad = document.getElementById('track-pad');
            const scene = document.getElementById('scene');
            let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

            const updatePos = (x, y) => {
                mouseX = (x - window.innerWidth / 2) / 45;
                mouseY = (y - window.innerHeight / 2) / 45;
            };

            trackPad.addEventListener('mousemove', (e) => updatePos(e.clientX, e.clientY));
            trackPad.addEventListener('touchmove', (e) => e.touches[0] && updatePos(e.touches[0].clientX, e.touches[0].clientY));
            trackPad.addEventListener('mouseleave', () => { mouseX = 0; mouseY = 0; });

            const animate = () => {
                targetX += (mouseX - targetX) * 0.05;
                targetY += (mouseY - targetY) * 0.05;
                scene.style.transform = `rotateY(${targetX}deg) rotateX(${-targetY}deg)`;
                requestAnimationFrame(animate);
            };
            animate();
        });
    </script>
</section>
