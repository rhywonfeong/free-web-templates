<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Journey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>
<body class="bg-black min-h-screen flex items-center justify-center m-0 overflow-hidden font-['Inter']" style="
    background-color: #050505;
    background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: center center;
">

    <!-- Container for centered element -->
    <div class="relative flex items-center justify-center w-full h-full p-6">
        
        <!-- Ambient Background Glow -->
        <div class="absolute w-[80vw] max-w-[500px] h-[200px] bg-white/5 rounded-[100%] blur-[80px] pointer-events-none" style="transform: translateY(-10%);"></div>

        <!-- Interactive Pill Button -->
        <button class="group relative flex items-center justify-center rounded-full cursor-pointer transition-transform duration-700 ease-out hover:scale-105 active:scale-95 focus:outline-none" style="width: 320px; height: 100px;">
            
            <!-- Outer Glass Border Layer -->
            <div class="absolute inset-0 rounded-full border border-white/10 shadow-[0_0_40px_rgba(0,0,0,0.8)]" style="
                background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 50%, rgba(255,255,255,0.08) 100%);
            "></div>

            <!-- Inner Depth & Shadow Layer -->
            <div class="absolute inset-[1px] rounded-full overflow-hidden bg-[#0a0a0a]/80 backdrop-blur-xl" style="
                box-shadow: 
                    inset 0px 4px 20px rgba(255,255,255,0.08), 
                    inset 0px -4px 20px rgba(255,255,255,0.02),
                    inset 20px 0px 30px rgba(0,0,0,0.5),
                    inset -20px 0px 30px rgba(255,255,255,0.1);
            ">
                
                <!-- Smoky Animated Gradient Background -->
                <div class="absolute w-[200%] h-[200%] top-[-50%] left-[-50%] opacity-40 transition-opacity duration-500 group-hover:opacity-60" id="smokeLayer" style="
                    background: radial-gradient(circle at center, rgba(255,255,255,0.15) 0%, transparent 60%);
                    filter: blur(20px);
                "></div>

                <!-- Canvas for Fluid/Particle Simulation -->
                <canvas id="nebulaCanvas" class="absolute inset-0 w-full h-full opacity-80 mix-blend-screen transition-opacity duration-500 group-hover:opacity-100"></canvas>
            </div>

            <!-- Text Content -->
            <span class="relative z-10 text-2xl font-medium tracking-tight text-white/90 group-hover:text-white transition-colors duration-300" style="
                text-shadow: 0 0 12px rgba(255,255,255,0.5), 0 0 24px rgba(255,255,255,0.2);
            ">
                Begin Journey
            </span>

        </button>

    </div>

    <script>
        // Fluid/Particle Animation Script to simulate WebGL-like internal movement
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('nebulaCanvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            
            // Adjust canvas size to match parent
            function resize() {
                const rect = canvas.parentElement.getBoundingClientRect();
                width = rect.width;
                height = rect.height;
                canvas.width = width * window.devicePixelRatio;
                canvas.height = height * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }

            window.addEventListener('resize', resize);
            resize();

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 2 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.3;
                    this.speedY = (Math.random() - 0.5) * 0.3;
                    this.life = Math.random() * 100;
                    this.maxLife = 100 + Math.random() * 100;
                    this.alpha = 0;
                    this.baseAlpha = Math.random() * 0.5 + 0.2;
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.life++;

                    // Fade in and out
                    if (this.life < 50) {
                        this.alpha = (this.life / 50) * this.baseAlpha;
                    } else if (this.life > this.maxLife - 50) {
                        this.alpha = ((this.maxLife - this.life) / 50) * this.baseAlpha;
                    } else {
                        this.alpha = this.baseAlpha;
                    }

                    // Reset if out of bounds or dead
                    if (this.life >= this.maxLife || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                        this.x = Math.random() * width;
                        this.y = Math.random() * height;
                        this.life = 0;
                        this.maxLife = 100 + Math.random() * 100;
                        this.speedX = (Math.random() - 0.5) * 0.3;
                        this.speedY = (Math.random() - 0.5) * 0.3;
                    }
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, this.alpha)})`;
                    ctx.fill();
                    
                    // Add subtle glow to particles
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
                }
            }

            // Create particles
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle());
            }

            // Animate smoky background layer
            const smokeLayer = document.getElementById('smokeLayer');
            let time = 0;

            function animate() {
                ctx.clearRect(0, 0, width, height);

                // Draw particles
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });

                // Animate the CSS gradient background slightly for fluid feel
                time += 0.01;
                const offsetX = Math.sin(time) * 10;
                const offsetY = Math.cos(time * 0.8) * 10;
                smokeLayer.style.transform = `translate(${offsetX}px, ${offsetY}px) rotate(${time * 5}deg)`;

                requestAnimationFrame(animate);
            }

            animate();
        });
    </script>
</body>
</html>
