<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Progress</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body
    class="min-h-screen w-full bg-gradient-to-br from-gray-50 to-gray-200 flex items-center justify-center font-sans overflow-hidden m-0 p-0">

    <!-- Main Container -->
    <div id="upload-widget"
        class="relative w-72 h-72 sm:w-80 sm:h-80 md:w-96 md:h-96 bg-white rounded-full shadow-[0_20px_50px_-12px_rgba(0,0,0,0.1)] flex items-center justify-center"
        style="opacity: 0; transform: scale(0.9) translateY(20px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);">

        <!-- SVG Layers -->
        <svg class="absolute inset-0 w-full h-full drop-shadow-sm" viewBox="0 0 200 200"
            xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Outer Ring Gradient -->
                <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#4fd1c5" /> <!-- Cyan/Teal -->
                    <stop offset="30%" stop-color="#3b82f6" /> <!-- Blue -->
                    <stop offset="70%" stop-color="#8b5cf6" /> <!-- Purple -->
                    <stop offset="100%" stop-color="#ec4899" /> <!-- Pink -->
                </linearGradient>
            </defs>

            <!-- Outer Gradient Progress Ring -->
            <!-- Path length is ~522. We animate stroke-dashoffset to reveal it. -->
            <path id="progress-path" d="M 109,14.5 A 86,86 0 1,1 91,14.5" fill="none" stroke="url(#ring-gradient)"
                stroke-width="12" stroke-linecap="round"
                style="stroke-dasharray: 522; stroke-dashoffset: 522; transition: stroke-dashoffset 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;" />

            <!-- Sparkle Dots (simulating the background texture in the gradient) -->
            <circle cx="20" cy="90" r="1.5" fill="#ffffff" style="opacity: 0.6;" class="animate-pulse" />
            <circle cx="175" cy="50" r="1" fill="#ffffff" style="opacity: 0.8;" class="animate-ping" />
            <circle cx="160" cy="170" r="1.5" fill="#ffffff" style="opacity: 0.5;" class="animate-pulse" />
            <circle cx="45" cy="165" r="2" fill="#ffffff" style="opacity: 0.4;" class="animate-pulse" />

            <!-- Inner Dashed Ring Group -->
            <!-- Group is rotated slowly via JS -->
            <g id="inner-ring-group" style="transform-origin: 100px 100px;">
                <!-- Dashed Arc -->
                <path d="M 59,159 A 72,72 0 1,1 141,159" fill="none" stroke="#6476c5" stroke-width="3"
                    stroke-linecap="round" stroke-dasharray="0 12" />
                <!-- End Dots -->
                <circle cx="59" cy="159" r="3.5" fill="#6476c5" />
                <circle cx="141" cy="159" r="3.5" fill="#6476c5" />
            </g>
        </svg>

        <!-- Center Content (HTML Overlay) -->
        <div class="relative z-10 flex flex-col items-center justify-center w-full h-full">

            <!-- Icon Wrapper -->
            <div id="icon-wrapper" class="mb-3 text-[#55a69c]"
                style="opacity: 0; transform: scale(0.5); transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s;">
                <!-- Using linear as requested, scaled up slightly to match visual weight -->
                <iconify-icon icon="solar:cloud-upload-linear"
                    class="text-6xl sm:text-7xl drop-shadow-md"></iconify-icon>
            </div>

            <!-- Text Wrapper -->
            <div id="text-wrapper" class="flex items-baseline space-x-1 sm:space-x-2"
                style="opacity: 0; transform: translateY(10px); transition: all 0.8s ease-out 0.9s;">
                <h2 class="text-sm sm:text-base md:text-lg font-semibold tracking-tight text-gray-800 m-0">
                    Uploading Files...
                </h2>
                <span class="text-xs sm:text-sm md:text-base font-medium text-gray-400">
                    75%
                </span>
            </div>

        </div>
    </div>

    <!-- Animation Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Trigger entry animations for container and internal elements
            setTimeout(() => {
                const widget = document.getElementById('upload-widget');
                widget.style.opacity = '1';
                widget.style.transform = 'scale(1) translateY(0)';

                const icon = document.getElementById('icon-wrapper');
                icon.style.opacity = '1';
                icon.style.transform = 'scale(1)';

                const text = document.getElementById('text-wrapper');
                text.style.opacity = '1';
                text.style.transform = 'translateY(0)';
            }, 100);

            // Trigger the SVG path draw animation (75% completion)
            // Path length is ~522. 25% remaining = 130.5 offset.
            setTimeout(() => {
                const path = document.getElementById('progress-path');
                path.style.strokeDashoffset = '130.5';
            }, 400);

            // Setup continuous, smooth rotation for the inner dashed ring
            const innerRing = document.getElementById('inner-ring-group');
            let rotationAngle = 0;
            let lastTime = 0;

            function animateRing(time) {
                if (!lastTime) lastTime = time;
                const delta = time - lastTime;
                
                // Rotate by roughly 10 degrees per second
                rotationAngle += (10 * delta) / 1000; 
                innerRing.style.transform = `rotate(${rotationAngle}deg)`;
                
                lastTime = time;
                requestAnimationFrame(animateRing);
            }
            requestAnimationFrame(animateRing);
        });
    </script>
</body>

</html>
