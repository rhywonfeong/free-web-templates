<div class="relative flex items-center justify-center py-12">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <div id="launch-container" class="opacity-0 scale-[0.6] blur-[10px]">
    <button id="ignition-btn" type="button" class="group relative block w-[264px] h-[78px] border-0 p-[7px] rounded-[24px] cursor-pointer outline-none transition-all duration-300 ease-[cubic-bezier(.34,1.4,.5,1)] hover:-translate-y-[2px] active:translate-y-[1px] active:scale-[0.985] focus-visible:outline-2 focus-visible:outline-[#d43d17] focus-visible:outline-offset-[5px] bg-[linear-gradient(180deg,#3c3f46_0%,#15171b_55%,#2a2d33_100%)] shadow-[0_26px_52px_rgba(15,12,10,.35),0_3px_10px_rgba(0,0,0,.35),inset_0_1px_0_rgba(255,255,255,.14)] hover:shadow-[0_32px_64px_rgba(160,60,12,.3),0_4px_12px_rgba(0,0,0,.4),inset_0_1px_0_rgba(255,255,255,.16)]">
      <span class="relative block w-full h-full rounded-[17px] overflow-hidden bg-[#06050a] flex items-center justify-center shadow-[inset_0_2px_8px_rgba(0,0,0,.9)]">
        <canvas id="portal-canvas" class="absolute inset-0 w-full h-full block" aria-hidden="true"></canvas>
        <span class="relative z-10 pointer-events-none font-medium text-sm tracking-[0.34em] indent-[0.34em] text-[#fdf6ee] uppercase" style="font-family: 'Inter', sans-serif; text-shadow: 0 0 14px rgba(255, 170, 100, .55), 0 1px 6px rgba(0, 0, 0, .9);">LAUNCH</span>
      </span>
    </button>
  </div>

  <script>
    (function() {
      const container = document.getElementById('launch-container');
      const btn = document.getElementById('ignition-btn');
      const canvas = document.getElementById('portal-canvas');
      const gl = canvas.getContext('webgl');

      // Initial Animation
      gsap.to(container, {
        scale: 1,
        opacity: 1,
        duration: 1.2,
        ease: "back.out(1.7)",
        onUpdate: function() {
          let progress = this.progress();
          let blurAmount = Math.max(0, 10 * (1 - progress * 1.2));
          container.style.filter = `blur(${blurAmount}px)`;
        }
      });

      // Mouse Parallax
      document.addEventListener("mousemove", (e) => {
        const x = (e.clientX / window.innerWidth - 0.5) * 15;
        const y = (e.clientY / window.innerHeight - 0.5) * 15;
        gsap.to(container, { x, y, duration: 2, ease: "power2.out" });
      });

      if (!gl) return;

      const VS = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
      const FS = `
        precision highp float;
        uniform vec2 u_res;
        uniform float u_time;
        uniform float u_warp;
        uniform float u_flash;
        float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
        float noise(vec2 p){
          vec2 i=floor(p), f=fract(p);
          vec2 u=f*f*(3.0-2.0*f);
          return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);
        }
        float fbm(vec2 p){
          float v=0.0; float a=0.5;
          for(int i=0;i<4;i++){ v+=a*noise(p); p=p*2.07+vec2(13.1,5.7); a*=0.5; }
          return v;
        }
        void main(){
          vec2 sc = gl_FragCoord.xy / u_res;
          vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
          float r = length(uv), rr = max(r, 0.08), a = atan(uv.y, uv.x), t = u_time;
          vec3 col = vec3(0.012, 0.011, 0.014);
          float hz = fbm(uv * 2.6 + vec2(t * 0.35, 1.7));
          col += vec3(0.13, 0.06, 0.032) * hz * (0.7 + 0.6 * u_warp);
          for (int i = 0; i < 3; i++) {
            float fi = float(i), ringN = 26.0 + fi * 9.0;
            vec2 sp = vec2((a / 6.28318 + 0.5) * ringN, (0.3 + fi * 0.22) / rr + t * (2.0 + fi * 1.2));
            vec2 cell = floor(sp), f = fract(sp);
            float h = hash(cell + fi * 17.31), on = step(0.68, h);
            vec2 c = vec2(0.2 + 0.6 * hash(cell + 4.7), 0.5), dlt = f - c;
            float sy = mix(130.0, 8.0, u_warp), star = on * exp(-(dlt.x * dlt.x * 150.0 + dlt.y * dlt.y * sy));
            float tw = (0.7 + 0.3 * sin(h * 81.0 + t * 9.0));
            vec3 sCol = mix(vec3(1.0, 0.94, 0.85), vec3(1.0, 0.6, 0.33), step(0.9, h));
            col += sCol * star * mix(tw, 1.0, u_warp) * smoothstep(0.02, 0.25, r) * (1.1 + 0.7 * u_warp);
          }
          col += vec3(1.0, 0.8, 0.58) * u_warp * 0.32 * exp(-r * 4.0);
          col = mix(col, vec3(1.0, 0.97, 0.92), clamp(u_flash, 0.0, 1.0));
          gl_FragColor = vec4(col, 1.0);
        }`;

      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
      const locP = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(locP);
      gl.vertexAttribPointer(locP, 2, gl.FLOAT, false, 0, 0);

      const uRes = gl.getUniformLocation(prog, 'u_res'), uTime = gl.getUniformLocation(prog, 'u_time'), 
            uWarp = gl.getUniformLocation(prog, 'u_warp'), uFlash = gl.getUniformLocation(prog, 'u_flash');

      let warp = 0, warpTarget = 0, flash = 0, z = 0, last = performance.now();
      btn.addEventListener('mouseenter', () => warpTarget = 1);
      btn.addEventListener('mouseleave', () => warpTarget = 0);
      btn.addEventListener('click', () => { flash = 1; warp = 0; z = 0; });

      function frame(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        warp += (warpTarget - warp) * Math.min(1, dt * 2.6);
        flash *= Math.exp(-4.5 * dt);
        z += dt * (0.05 + warp * 1.35);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = canvas.clientWidth * dpr, h = canvas.clientHeight * dpr;
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uTime, z);
        gl.uniform1f(uWarp, warp);
        gl.uniform1f(uFlash, flash);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</div>
