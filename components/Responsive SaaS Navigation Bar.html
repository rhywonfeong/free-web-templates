<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SignalAI Navigation</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background: #030303;
      margin: 0;
      min-height: 100vh;
      color: #fff;
    }
  </style>
</head>

<body class="bg-[#030303] text-zinc-400 antialiased overflow-x-hidden">

  <!-- Navigation Component -->
  <nav class="sticky top-0 z-50 bg-[#030303]/80 backdrop-blur-sm border-b border-zinc-800/50">
    <div class="max-w-[1200px] mx-auto px-6 py-5 flex flex-wrap md:flex-nowrap items-center md:gap-4 lg:gap-8 relative">
      <!-- Logo -->
      <div class="flex-shrink-0 flex items-center gap-1 text-xl tracking-tight font-normal text-white">
        Signal
        <div
          class="h-7 px-2 bg-emerald-500/10 border border-emerald-500/30 rounded-lg flex items-center justify-center">
          <span class="text-sm font-semibold text-emerald-300 tracking-wide">
            AI
          </span>
        </div>
      </div>

      <!-- Mobile Actions & Hamburger -->
      <div class="flex items-center gap-4 ml-auto md:hidden">
        <a href="#"
          class="flex items-center justify-center px-4 py-1.5 bg-zinc-800 text-emerald-400 border border-emerald-500/30 rounded-full text-sm font-normal hover:bg-zinc-700 shadow-[0_0_15px_rgba(16,185,129,0.2)] transition-all">
          Start free
        </a>

        <button
          id="mobile-menu-btn"
          class="text-zinc-400 hover:text-white transition-colors flex items-center justify-center p-1 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 rounded-md"
          aria-expanded="false"
          aria-label="Toggle navigation"
          aria-controls="mobile-menu"
        >
          <iconify-icon
            icon="solar:hamburger-menu-linear"
            class="text-2xl"
            stroke-width="1.5"
          ></iconify-icon>
        </button>
      </div>

      <!-- Desktop Links -->
      <div class="hidden lg:flex flex-1 justify-center items-center gap-6 lg:gap-8 text-base text-zinc-400 font-normal">
        <a href="#"
          class="hover:text-emerald-300 transition-colors drop-shadow-[0_0_5px_rgba(52,211,153,0)] hover:drop-shadow-[0_0_5px_rgba(52,211,153,0.5)]">Platform</a>
        <a href="#"
          class="hover:text-emerald-300 transition-colors drop-shadow-[0_0_5px_rgba(52,211,153,0)] hover:drop-shadow-[0_0_5px_rgba(52,211,153,0.5)]">Solutions</a>
        <a href="#"
          class="hover:text-emerald-300 transition-colors drop-shadow-[0_0_5px_rgba(52,211,153,0)] hover:drop-shadow-[0_0_5px_rgba(52,211,153,0.5)]">Customers</a>
        <a href="#"
          class="hover:text-emerald-300 transition-colors drop-shadow-[0_0_5px_rgba(52,211,153,0)] hover:drop-shadow-[0_0_5px_rgba(52,211,153,0.5)]">Resources</a>
        <a href="#"
          class="hover:text-emerald-300 transition-colors drop-shadow-[0_0_5px_rgba(52,211,153,0)] hover:drop-shadow-[0_0_5px_rgba(52,211,153,0.5)]">Pricing</a>
      </div>

      <!-- Tablet Links -->
      <div
        class="hidden md:flex lg:hidden flex-1 justify-center items-center gap-6 text-base text-zinc-400 font-normal relative">
        <a href="#"
          class="hover:text-emerald-300 transition-colors drop-shadow-[0_0_5px_rgba(52,211,153,0)] hover:drop-shadow-[0_0_5px_rgba(52,211,153,0.5)]">
          Platform
        </a>

        <button
          id="tablet-more-btn"
          class="flex items-center gap-1 hover:text-emerald-300 transition-colors focus:outline-none"
          aria-expanded="false"
          aria-controls="tablet-more-menu"
        >
          More
          <iconify-icon icon="lucide:chevron-down" class="text-sm"></iconify-icon>
        </button>

        <div id="tablet-more-menu"
          class="absolute top-full mt-4 left-1/2 -translate-x-1/2 w-48 bg-[#030303]/95 backdrop-blur-xl border border-zinc-800/50 rounded-xl px-5 py-5 flex flex-col gap-4 shadow-2xl transition-all duration-300 opacity-0 -translate-y-2 invisible z-50">
          <a href="#" class="hover:text-emerald-300 transition-colors">Solutions</a>
          <a href="#" class="hover:text-emerald-300 transition-colors">Customers</a>
          <a href="#" class="hover:text-emerald-300 transition-colors">Resources</a>
          <a href="#" class="hover:text-emerald-300 transition-colors">Pricing</a>
        </div>
      </div>

      <!-- Right Actions -->
      <div class="hidden md:flex items-center justify-end flex-shrink-0 gap-4 ml-auto whitespace-nowrap">
        <a href="#" class="text-base text-zinc-400 hover:text-white font-normal transition-colors">
          Log in
        </a>

        <a href="#"
          class="flex items-center justify-center px-4 py-2 border border-zinc-700 bg-zinc-900/50 rounded-full text-base font-normal text-zinc-300 hover:bg-zinc-800 transition-colors backdrop-blur-sm">
          Book a demo
        </a>

        <a href="#"
          class="flex items-center justify-center px-5 py-2 bg-zinc-800 text-emerald-400 border border-emerald-500/30 rounded-full text-base font-normal hover:bg-zinc-700 shadow-[0_0_15px_rgba(16,185,129,0.2)] transition-all hover:shadow-[0_0_20px_rgba(16,185,129,0.4)]">
          Start free
        </a>
      </div>
    </div>

    <!-- Mobile Menu Dropdown -->
    <div id="mobile-menu"
      class="absolute top-full left-0 w-full bg-[#030303]/95 backdrop-blur-xl border-b border-zinc-800/50 px-6 py-6 flex flex-col gap-6 shadow-2xl transition-all duration-300 opacity-0 -translate-y-4 invisible md:hidden z-40">
      <div class="flex flex-col gap-4 text-base text-zinc-400 font-normal">
        <a href="#" class="hover:text-emerald-300 transition-colors">Platform</a>
        <a href="#" class="hover:text-emerald-300 transition-colors">Solutions</a>
        <a href="#" class="hover:text-emerald-300 transition-colors">Customers</a>
        <a href="#" class="hover:text-emerald-300 transition-colors">Resources</a>
        <a href="#" class="hover:text-emerald-300 transition-colors">Pricing</a>
      </div>

      <div class="h-px w-full bg-zinc-800/50"></div>

      <div class="flex flex-col gap-4 text-base text-zinc-400 font-normal">
        <a href="#" class="hover:text-white transition-colors">Log in</a>
        <a href="#"
          class="inline-flex items-center justify-center px-4 py-2 border border-zinc-700 bg-zinc-900/50 rounded-full text-base font-normal text-zinc-300 hover:bg-zinc-800 transition-colors backdrop-blur-sm w-fit">
          Book a demo
        </a>
      </div>
    </div>
  </nav>

  <script>
    (() => {
      const mobileBtn = document.getElementById('mobile-menu-btn');
      const mobileMenu = document.getElementById('mobile-menu');
      const tabletBtn = document.getElementById('tablet-more-btn');
      const tabletMenu = document.getElementById('tablet-more-menu');

      function openMenu(menu, btn, hiddenClasses, visibleClasses) {
        btn.setAttribute('aria-expanded', 'true');
        hiddenClasses.forEach(cls => menu.classList.remove(cls));
        visibleClasses.forEach(cls => menu.classList.add(cls));
      }

      function closeMenu(menu, btn, hiddenClasses, visibleClasses) {
        btn.setAttribute('aria-expanded', 'false');
        visibleClasses.forEach(cls => menu.classList.remove(cls));
        hiddenClasses.forEach(cls => menu.classList.add(cls));
      }

      function toggleMenu(menu, btn, hiddenClasses, visibleClasses) {
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        if (expanded) {
          closeMenu(menu, btn, hiddenClasses, visibleClasses);
        } else {
          openMenu(menu, btn, hiddenClasses, visibleClasses);
        }
      }

      if (mobileBtn && mobileMenu) {
        mobileBtn.addEventListener('click', () => {
          toggleMenu(
            mobileMenu,
            mobileBtn,
            ['opacity-0', 'invisible', '-translate-y-4'],
            ['opacity-100', 'visible', 'translate-y-0']
          );
        });
      }

      if (tabletBtn && tabletMenu) {
        tabletBtn.addEventListener('click', () => {
          toggleMenu(
            tabletMenu,
            tabletBtn,
            ['opacity-0', 'invisible', '-translate-y-2'],
            ['opacity-100', 'visible', 'translate-y-0']
          );
        });
      }

      document.addEventListener('click', (event) => {
        if (
          tabletBtn &&
          tabletMenu &&
          !tabletBtn.contains(event.target) &&
          !tabletMenu.contains(event.target)
        ) {
          closeMenu(
            tabletMenu,
            tabletBtn,
            ['opacity-0', 'invisible', '-translate-y-2'],
            ['opacity-100', 'visible', 'translate-y-0']
          );
        }

        if (
          mobileBtn &&
          mobileMenu &&
          !mobileBtn.contains(event.target) &&
          !mobileMenu.contains(event.target)
        ) {
          closeMenu(
            mobileMenu,
            mobileBtn,
            ['opacity-0', 'invisible', '-translate-y-4'],
            ['opacity-100', 'visible', 'translate-y-0']
          );
        }
      });

      window.addEventListener('resize', () => {
        if (window.innerWidth >= 768 && mobileBtn && mobileMenu) {
          closeMenu(
            mobileMenu,
            mobileBtn,
            ['opacity-0', 'invisible', '-translate-y-4'],
            ['opacity-100', 'visible', 'translate-y-0']
          );
        }

        if (window.innerWidth >= 1024 && tabletBtn && tabletMenu) {
          closeMenu(
            tabletMenu,
            tabletBtn,
            ['opacity-0', 'invisible', '-translate-y-2'],
            ['opacity-100', 'visible', 'translate-y-0']
          );
        }
      });
    })();
  </script>
</body>

</html>
