<!DOCTYPE html>
<html lang="en" class="antialiased selection:bg-cyan-500/30">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Schematic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>

<body
    class="bg-[#050810] min-h-screen w-full flex items-center justify-center p-2 sm:p-6 lg:p-12 font-sans text-slate-300 overflow-hidden">

    <!-- Main Responsive Container -->
    <main
        class="relative w-full max-w-[1400px] aspect-[4/5] sm:aspect-[4/3] lg:aspect-[16/9] bg-[#0E1324]/80 backdrop-blur-3xl rounded-[2rem] sm:rounded-[3rem] border border-white/[0.04] shadow-[0_0_100px_rgba(0,10,30,0.8)] overflow-hidden flex items-center justify-center">

        <!-- Ambient Background Glows -->
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3/4 h-3/4 bg-gradient-to-tr from-cyan-500/10 via-transparent to-purple-500/10 rounded-full blur-3xl pointer-events-none">
        </div>

        <!-- SVG Connection Lines Layer -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none z-0" preserveAspectRatio="none">
            <defs>
                <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#475569" stop-opacity="0" />
                    <stop offset="50%" stop-color="#475569" stop-opacity="0.4" />
                    <stop offset="100%" stop-color="#475569" stop-opacity="0" />
                </linearGradient>
            </defs>
            <!-- Lines dynamically drawn towards center -->
            <path d="M 20% 25% L 48% 48%" stroke="url(#lineGrad)" stroke-width="1.5" fill="none" class="anim-draw"
                style="stroke-dasharray: 500; stroke-dashoffset: 500;" />
            <path d="M 12% 50% L 45% 50%" stroke="url(#lineGrad)" stroke-width="1.5" fill="none" class="anim-draw"
                style="stroke-dasharray: 500; stroke-dashoffset: 500;" />
            <path d="M 25% 75% L 48% 52%" stroke="url(#lineGrad)" stroke-width="1.5" fill="none" class="anim-draw"
                style="stroke-dasharray: 500; stroke-dashoffset: 500;" />
            <path d="M 80% 20% L 52% 48%" stroke="url(#lineGrad)" stroke-width="1.5" fill="none" class="anim-draw"
                style="stroke-dasharray: 500; stroke-dashoffset: 500;" />
            <path d="M 85% 50% L 55% 50%" stroke="url(#lineGrad)" stroke-width="1.5" fill="none" class="anim-draw"
                style="stroke-dasharray: 500; stroke-dashoffset: 500;" />
            <path d="M 80% 80% L 52% 52%" stroke="url(#lineGrad)" stroke-width="1.5" fill="none" class="anim-draw"
                style="stroke-dasharray: 500; stroke-dashoffset: 500;" />
        </svg>

        <!-- Central Hub Element -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 flex items-center justify-center anim-trigger"
            style="opacity: 0; transform: scale(0.5); transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);">

            <!-- Outermost Faint Spin Ring -->
            <div class="absolute w-[240px] h-[240px] sm:w-[320px] sm:h-[320px] lg:w-[400px] lg:h-[400px] rounded-full border border-white/[0.03] animate-spin"
                style="animation-duration: 30s; animation-direction: reverse; animation-timing-function: linear;">
                <div class="absolute top-0 left-1/2 w-1.5 h-1.5 bg-cyan-500 rounded-full blur-[2px]"></div>
                <div class="absolute bottom-1/4 right-0 w-1 h-1 bg-purple-500 rounded-full blur-[1px]"></div>
            </div>

            <!-- SVG Animated Arcs -->
            <svg class="absolute w-[180px] h-[180px] sm:w-[240px] sm:h-[240px] lg:w-[300px] lg:h-[300px] animate-spin"
                style="animation-duration: 20s; animation-timing-function: linear;" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="46" fill="none" stroke="#1E293B" stroke-width="6" stroke-opacity="0.4" />
                <path d="M 50 4 A 46 46 0 0 1 96 50" fill="none" stroke="#00f2fe" stroke-width="6"
                    stroke-linecap="round" />
                <path d="M 4 50 A 46 46 0 0 0 50 96" fill="none" stroke="#a18cd1" stroke-width="6"
                    stroke-linecap="round" />
            </svg>

            <!-- Inner Solid Track -->
            <div
                class="absolute w-[120px] h-[120px] sm:w-[160px] sm:h-[160px] lg:w-[200px] lg:h-[200px] rounded-full border-2 border-[#1E293B]/60 bg-[#0B101E]/50 backdrop-blur-md">
            </div>

            <!-- Core Button -->
            <div
                class="relative w-12 h-12 sm:w-16 sm:h-16 lg:w-20 lg:h-20 rounded-full bg-[#1A2235] border border-white/10 flex items-center justify-center shadow-[0_0_30px_rgba(0,0,0,0.8)] z-30 ring-1 ring-cyan-500/20">
                <span class="text-slate-200 font-medium tracking-tight text-lg sm:text-xl animate-pulse" style="animation-duration: 3s;">A</span>
            </div>
        </div>

        <!-- Floating Cards -->

        <!-- Top Left Card -->
        <div class="absolute top-[8%] left-[4%] sm:top-[12%] sm:left-[8%] lg:top-[15%] lg:left-[15%] w-36 sm:w-48 lg:w-56 bg-[#161D2E]/80 backdrop-blur-xl border border-white/[0.06] rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-2xl z-10 anim-trigger flex flex-col gap-3"
            style="opacity: 0; transform: translate(-20px, -20px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="text-xs sm:text-sm font-medium text-slate-100 tracking-tight leading-tight">Population
                        Mapping</h3>
                    <p class="text-[10px] sm:text-xs text-slate-500 leading-tight mt-0.5 max-w-[120px] truncate">Active
                        sync protocols</p>
                </div>
                <div
                    class="w-6 h-6 rounded-full border border-white/5 flex items-center justify-center bg-white/[0.02]">
                    <iconify-icon icon="solar:refresh-circle-linear" class="text-cyan-400 text-sm"></iconify-icon>
                </div>
            </div>
            <!-- Mini Bar Chart -->
            <div class="h-10 sm:h-12 w-full flex items-end gap-1 sm:gap-1.5 pt-1">
                <div class="w-full bg-cyan-500/80 rounded-t-sm chart-bar"
                    style="height: 0%; transition: height 1s ease-out;" data-h="40%"></div>
                <div class="w-full bg-cyan-400 rounded-t-sm chart-bar"
                    style="height: 0%; transition: height 1s ease-out;" data-h="70%"></div>
                <div class="w-full bg-purple-500/80 rounded-t-sm chart-bar"
                    style="height: 0%; transition: height 1s ease-out;" data-h="50%"></div>
                <div class="w-full bg-cyan-500/60 rounded-t-sm chart-bar"
                    style="height: 0%; transition: height 1s ease-out;" data-h="90%"></div>
                <div class="w-full bg-purple-400 rounded-t-sm chart-bar"
                    style="height: 0%; transition: height 1s ease-out;" data-h="60%"></div>
            </div>
        </div>

        <!-- Middle Left Card -->
        <div class="absolute top-[40%] left-[2%] sm:top-[45%] sm:left-[4%] lg:left-[6%] w-32 sm:w-44 lg:w-52 bg-[#161D2E]/80 backdrop-blur-xl border border-white/[0.06] rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-2xl z-10 anim-trigger flex flex-col gap-3"
            style="opacity: 0; transform: translateX(-30px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="text-xs sm:text-sm font-medium text-slate-100 tracking-tight leading-tight">Data Greepide
                    </h3>
                    <p class="text-[10px] sm:text-xs text-slate-500 leading-tight mt-0.5 line-clamp-2">Systematic
                        allocation of core resources</p>
                </div>
                <div
                    class="w-6 h-6 rounded-full border border-white/5 flex items-center justify-center bg-white/[0.02] shrink-0">
                    <iconify-icon icon="solar:minimize-square-linear" class="text-purple-400 text-sm"></iconify-icon>
                </div>
            </div>
        </div>

        <!-- Bottom Left Card -->
        <div class="absolute bottom-[8%] left-[6%] sm:bottom-[10%] sm:left-[10%] lg:bottom-[12%] lg:left-[18%] w-36 sm:w-48 lg:w-56 bg-[#161D2E]/80 backdrop-blur-xl border border-white/[0.06] rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-2xl z-10 anim-trigger flex flex-col gap-3"
            style="opacity: 0; transform: translate(-20px, 20px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);">
            <!-- Mini Bar Chart (Top for variation) -->
            <div class="h-8 sm:h-10 w-full flex items-end gap-1 sm:gap-1.5 pb-1 border-b border-white/5">
                <div class="w-full bg-cyan-600 rounded-t-sm chart-bar"
                    style="height: 0%; transition: height 1s ease-out;" data-h="30%"></div>
                <div class="w-full bg-purple-500 rounded-t-sm chart-bar"
                    style="height: 0%; transition: height 1s ease-out;" data-h="80%"></div>
                <div class="w-full bg-cyan-400 rounded-t-sm chart-bar"
                    style="height: 0%; transition: height 1s ease-out;" data-h="45%"></div>
                <div class="w-full bg-purple-400 rounded-t-sm chart-bar"
                    style="height: 0%; transition: height 1s ease-out;" data-h="65%"></div>
                <div class="w-full bg-cyan-500 rounded-t-sm chart-bar"
                    style="height: 0%; transition: height 1s ease-out;" data-h="20%"></div>
            </div>
            <div class="flex justify-between items-center">
                <div>
                    <h3 class="text-xs sm:text-sm font-medium text-slate-100 tracking-tight leading-tight">Node Aropline
                    </h3>
                    <p class="text-[10px] sm:text-xs text-slate-500 leading-tight mt-0.5">Vector processing</p>
                </div>
                <iconify-icon icon="solar:settings-linear" class="text-cyan-400 text-lg animate-spin"
                    style="animation-duration: 8s;"></iconify-icon>
            </div>
        </div>

        <!-- Top Right Card -->
        <div class="absolute top-[6%] right-[5%] sm:top-[10%] sm:right-[10%] lg:top-[12%] lg:right-[18%] w-36 sm:w-48 lg:w-56 bg-[#161D2E]/80 backdrop-blur-xl border border-white/[0.06] rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-2xl z-10 anim-trigger flex flex-col gap-3"
            style="opacity: 0; transform: translate(20px, -20px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="text-xs sm:text-sm font-medium text-slate-100 tracking-tight leading-tight">Mane Mooping
                    </h3>
                    <p class="text-[10px] sm:text-xs text-slate-500 leading-tight mt-0.5 line-clamp-2">Latency
                        optimization algorithms active</p>
                </div>
                <div
                    class="w-6 h-6 rounded-full border border-white/5 flex items-center justify-center bg-white/[0.02] shrink-0">
                    <iconify-icon icon="solar:cpu-linear" class="text-cyan-400 text-sm"></iconify-icon>
                </div>
            </div>
        </div>

        <!-- Middle Right Card -->
        <div class="absolute top-[42%] right-[2%] sm:top-[45%] sm:right-[4%] lg:right-[6%] w-40 sm:w-52 lg:w-64 bg-[#161D2E]/80 backdrop-blur-xl border border-white/[0.06] rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-2xl z-10 anim-trigger flex flex-col gap-3"
            style="opacity: 0; transform: translateX(30px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);">
            <div class="flex justify-between items-start mb-1">
                <div>
                    <h3 class="text-xs sm:text-sm font-medium text-slate-100 tracking-tight leading-tight">Rotten
                        Sretping</h3>
                    <p class="text-[10px] sm:text-xs text-slate-500 leading-tight mt-0.5">Throughput metrics</p>
                </div>
                <div
                    class="w-6 h-6 rounded-full border border-white/5 flex items-center justify-center bg-white/[0.02] shrink-0">
                    <iconify-icon icon="solar:target-linear" class="text-purple-400 text-sm"></iconify-icon>
                </div>
            </div>
            <!-- Mini Line Chart SVG -->
            <div class="w-full h-12 sm:h-16 relative">
                <svg viewBox="0 0 100 40" class="w-full h-full overflow-visible" preserveAspectRatio="none">
                    <path d="M 0 35 Q 15 10 30 25 T 60 15 T 85 30 T 100 5" fill="none" stroke="#00f2fe" stroke-width="2"
                        class="anim-draw drop-shadow-[0_0_5px_rgba(0,242,254,0.5)]"
                        style="stroke-dasharray: 200; stroke-dashoffset: 200;" stroke-linecap="round" />
                    <path d="M 0 40 Q 20 20 40 35 T 70 20 T 90 35 T 100 15" fill="none" stroke="#a18cd1"
                        stroke-width="1.5" class="anim-draw opacity-60"
                        style="stroke-dasharray: 200; stroke-dashoffset: 200;" stroke-linecap="round" />
                </svg>
            </div>
        </div>

        <!-- Bottom Right Card -->
        <div class="absolute bottom-[6%] right-[4%] sm:bottom-[12%] sm:right-[8%] lg:bottom-[15%] lg:right-[15%] w-32 sm:w-44 lg:w-48 bg-[#161D2E]/80 backdrop-blur-xl border border-white/[0.06] rounded-xl sm:rounded-2xl p-3 sm:p-4 shadow-2xl z-10 anim-trigger flex flex-col gap-3"
            style="opacity: 0; transform: translate(20px, 20px); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);">
            <div class="flex justify-between items-start">
                <div>
                    <h3 class="text-xs sm:text-sm font-medium text-slate-100 tracking-tight leading-tight">Cuttiges
                        Veder</h3>
                    <p class="text-[10px] sm:text-xs text-slate-500 leading-tight mt-0.5 line-clamp-2">Compile times
                        optimized</p>
                </div>
                <div
                    class="w-6 h-6 rounded-full border border-white/5 flex items-center justify-center bg-white/[0.02] shrink-0">
                    <iconify-icon icon="solar:cup-linear" class="text-cyan-400 text-sm"></iconify-icon>
                </div>
            </div>
        </div>

    </main>

    <!-- Inline script to handle complex entrance animations without <style> tag constraints -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Staggered fade and slide for cards and center
            const triggers = document.querySelectorAll('.anim-trigger');
            triggers.forEach((el, index) => {
                setTimeout(() => {
                    el.style.opacity = '1';
                    // Strip the transform values to snap to normal absolute position
                    if(el.style.transform.includes('scale')) {
                        el.style.transform = 'scale(1)';
                    } else {
                        el.style.transform = 'translate(0, 0)';
                    }
                }, 100 + (index * 150));
            });

            // Staggered height growth for bar charts
            const bars = document.querySelectorAll('.chart-bar');
            bars.forEach((bar, index) => {
                setTimeout(() => {
                    const targetHeight = bar.getAttribute('data-h');
                    if (targetHeight) {
                        bar.style.height = targetHeight;
                    }
                }, 800 + (index * 60));
            });

            // Draw line animations for SVGs
            const paths = document.querySelectorAll('.anim-draw');
            paths.forEach((path, index) => {
                setTimeout(() => {
                    path.style.transition = 'stroke-dashoffset 2s cubic-bezier(0.2, 0.8, 0.2, 1)';
                    path.style.strokeDashoffset = '0';
                }, 1200 + (index * 100));
            });
        });
    </script>
</body>

</html>
