<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Quantum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen font-sans flex flex-col p-2 sm:p-4 md:p-6 lg:p-8 antialiased selection:bg-cyan-500/20 overflow-x-hidden">

    <!-- Main Card Container -->
    <main class="relative flex-grow rounded-[2rem] md:rounded-[2.5rem] border border-white/10 overflow-hidden bg-slate-900/50 flex flex-col w-full max-w-[1600px] mx-auto shadow-2xl z-10">
        
        <!-- Canvas Animation Background -->
        <canvas id="wave-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0 mix-blend-screen opacity-80"></canvas>

        <!-- Inner Card Header -->
        <div class="relative z-10 flex justify-between items-center p-6 sm:p-8 lg:p-10 w-full">
            <!-- Brand -->
            <div class="fade-el opacity-0 translate-y-5 transition-all duration-700 ease-out flex items-center gap-3 text-xl font-normal tracking-tight">
                <iconify-icon icon="solar:box-linear" width="24" stroke-width="1.5"></iconify-icon>
                Nexus
            </div>
            
            <!-- Inner Navigation & CTA -->
            <div class="fade-el opacity-0 translate-y-5 transition-all duration-700 ease-out flex items-center gap-4 sm:gap-6" style="transition-delay: 100ms;">
                <nav class="hidden md:flex bg-slate-900/80 backdrop-blur-md border border-white/5 rounded-full p-1 shadow-inner">
                    <a href="#" class="px-5 py-1.5 text-sm text-slate-400 rounded-full hover:bg-white/5 hover:text-white transition-colors duration-200">Discover</a>
                    <a href="#" class="px-5 py-1.5 text-sm text-slate-400 rounded-full hover:bg-white/5 hover:text-white transition-colors duration-200">Nodes</a>
                    <a href="#" class="px-5 py-1.5 text-sm text-slate-400 rounded-full hover:bg-white/5 hover:text-white transition-colors duration-200">Network</a>
                </nav>
                <button class="bg-cyan-400 text-slate-950 px-5 py-2 sm:px-6 sm:py-2.5 rounded-full text-sm font-normal hover:scale-105 transition-transform duration-300 shadow-[0_0_20px_rgba(34,211,238,0.15)]">
                    Launch
                </button>
            </div>
        </div>

        <!-- Hero Content -->
        <div class="relative z-10 flex-grow flex flex-col items-center justify-center text-center px-4 sm:px-6 pb-20 w-full max-w-4xl mx-auto">
            <h1 class="fade-el opacity-0 translate-y-5 transition-all duration-700 ease-out text-7xl sm:text-8xl lg:text-9xl leading-none font-medium tracking-tight mb-4 sm:mb-6" 
                style="transition-delay: 200ms; background: linear-gradient(180deg, #FFFFFF 0%, #bae6fd 60%, #0ea5e9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                Quantum
            </h1>
            <p class="fade-el opacity-0 translate-y-5 transition-all duration-700 ease-out text-slate-400 text-sm sm:text-base md:text-lg max-w-md sm:max-w-xl mx-auto mb-8 sm:mb-12 font-light leading-relaxed tracking-wide" style="transition-delay: 300ms;">
                Nexus delivers the foundational architecture for pioneers to scale distributed systems from inception to global reach.
            </p>
            <button class="fade-el opacity-0 translate-y-5 transition-all duration-700 ease-out bg-cyan-400 text-slate-950 px-6 py-3 sm:px-8 sm:py-3.5 rounded-full text-sm sm:text-base font-normal hover:scale-105 transition-transform duration-300 shadow-[0_0_30px_rgba(34,211,238,0.2)]" style="transition-delay: 300ms;">
                Deploy Instance
            </button>
        </div>
        
        <!-- Dark gradient overlay to blend bottom -->
        <div class="absolute bottom-0 left-0 w-full h-32 bg-gradient-to-t from-slate-950 to-transparent pointer-events-none z-0"></div>
    </main>

    <!-- Initialization Scripts -->
    <script>
        // Reveal Animations
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.querySelectorAll('.fade-el').forEach(el => {
                    el.classList.remove('opacity-0', 'translate-y-5');
                    el.classList.add('opacity-100', 'translate-y-0');
                });
            }, 50);
        });

        // Canvas Animation Logic
        const canvas = document.getElementById('wave-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;
        let time = 0;

        function resize() {
            width = canvas.width = canvas.offsetWidth * window.devicePixelRatio;
            height = canvas.height = canvas.offsetHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            width /= window.devicePixelRatio;
            height /= window.devicePixelRatio;
        }

        window.addEventListener('resize', resize);
        resize();

        function draw() {
            // Fill background with slate 950
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, width, height);

            ctx.globalCompositeOperation = 'screen';
            ctx.lineWidth = 1.2;

            const lines = 35;
            const yOffset = height * 0.4; // Center vertical base
            
            for (let i = 0; i < lines; i++) {
                ctx.beginPath();
                
                // Calculate progress through lines for gradients/phase
                const iNorm = i / lines;
                
                // Create cool cyan/indigo gradient for each line
                const gradient = ctx.createLinearGradient(0, height, 0, 0);
                gradient.addColorStop(0, `rgba(34, 211, 238, ${0.1 + iNorm * 0.8})`); 
                gradient.addColorStop(0.4, `rgba(59, 130, 246, ${0.4 + iNorm * 0.4})`);
                gradient.addColorStop(0.8, `rgba(99, 102, 241, ${0.1 + iNorm * 0.1})`);
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                
                ctx.strokeStyle = gradient;

                for (let x = 0; x <= width; x += 10) {
                    const xNorm = x / width;
                    
                    // Complex wave formula
                    let baseWave = Math.sin((xNorm * 4) + time + (iNorm * 5));
                    let wave2 = Math.cos((xNorm * 2) - time * 0.5);
                    
                    const centerBend = Math.pow(Math.abs(xNorm - 0.5) * 2, 2);
                    const amplitude = 50 + (100 * centerBend) + (i * 12);
                    const vSpace = i * (8 + (iNorm * 15));
                    
                    const y = yOffset + vSpace + (baseWave * amplitude * 0.5) + (wave2 * 20);
                    const perspective = (Math.pow(Math.abs(xNorm - 0.5) * 2, 4)) * 150;

                    if (x === 0) {
                        ctx.moveTo(x, y - perspective);
                    } else {
                        ctx.lineTo(x, y - perspective);
                    }
                }
                ctx.stroke();
            }

            ctx.globalCompositeOperation = 'source-over';
            time += 0.005; // Animation speed
            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
