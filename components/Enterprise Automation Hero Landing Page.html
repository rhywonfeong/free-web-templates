<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova - Enterprise Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
    <link id="all-fonts-link-font-geist" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&amp;display=swap">
</head>
<body class="bg-[#050505] text-white font-sans overflow-x-hidden selection:bg-[#0070f3] selection:text-white" style="font-family: 'Inter', sans-serif;">

    <!-- Background Animation Canvas -->
    <canvas id="bg-canvas" class="fixed inset-0 z-0 pointer-events-none w-full h-full"></canvas>

    <!-- Noise Texture Overlay -->
    <div class="fixed inset-0 z-0 pointer-events-none opacity-[0.03]" style="background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E');"></div>

    <!-- Navigation -->
    <nav class="relative z-50 w-full border-b border-white/[0.04] bg-black/10 backdrop-blur-md">
        <div class="max-w-[1400px] mx-auto px-6 h-24 flex items-center justify-between">
            <!-- Brand Logo -->
            <a href="#" class="text-white font-['Geist'] font-semibold text-xl tracking-tight">Nova</a>

            <!-- Links -->
            <div class="hidden md:flex items-center gap-10 text-xs text-gray-400 font-medium tracking-widest uppercase">
                <a href="#" class="hover:text-white transition-colors duration-300 font-['Geist']">Products</a>
                <a href="#" class="hover:text-white transition-colors duration-300 font-['Geist']">Solutions</a>
                <a href="#" class="hover:text-white transition-colors duration-300 font-['Geist']">Pricing</a>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-4">
                <a href="#" class="hidden sm:inline-flex text-xs font-semibold text-white px-6 py-3 rounded-md border border-white/10 hover:bg-white/5 transition-all duration-300 tracking-wide uppercase font-['Geist']">
                    Talk to Sales
                </a>
                <a href="#" class="text-xs font-semibold text-white bg-[#0070f3] px-6 py-3 rounded-md hover:bg-[#3291ff] transition-all duration-300 tracking-wide uppercase shadow-[0_0_20px_rgba(0,112,243,0.3)] hover:shadow-[0_0_30px_rgba(0,112,243,0.5)] font-['Geist']">
                    Start for Free
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative z-10 flex flex-col items-center justify-center min-h-[calc(100vh-6rem)] px-6 pt-10 pb-32">
        
        <!-- Hero Section -->
        <div class="text-center max-w-5xl mx-auto flex flex-col items-center z-30">
            <h1 class="text-5xl md:text-7xl lg:text-8xl text-white leading-[1.05] mb-8 opacity-0 translate-y-8 transition-all duration-1000 ease-out animate-on-load font-['Geist'] font-light tracking-tighter">
                MODERNIZE YOUR<br>ENTERPRISE WORKFLOW
            </h1>
            <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto mb-12 opacity-0 translate-y-8 transition-all duration-1000 ease-out animate-on-load delay-150 font-normal leading-relaxed font-['Geist']">
                Optimize core processes, align your workforce, and discover new growth opportunities with our smart orchestration engine.
            </p>
            
            <div class="flex flex-col sm:flex-row items-center gap-5 opacity-0 translate-y-8 transition-all duration-1000 ease-out animate-on-load delay-300">
                <a href="#" class="w-full sm:w-auto text-sm font-semibold text-white bg-[#0070f3] px-10 py-4 rounded-md hover:bg-[#3291ff] transition-all duration-300 tracking-wide uppercase shadow-[0_0_25px_rgba(0,112,243,0.4)] hover:shadow-[0_0_40px_rgba(0,112,243,0.6)] font-['Geist']">
                    Start for Free
                </a>
                <a href="#" class="w-full sm:w-auto text-sm font-semibold text-white px-10 py-4 rounded-md border border-white/10 bg-black/20 hover:bg-white/5 backdrop-blur-sm transition-all duration-300 tracking-wide uppercase font-['Geist']">
                    Talk to Sales
                </a>
            </div>
        </div>

    </main>

    <!-- Interactive Logic -->
    <script>
        // Reveal Animations
        document.addEventListener("DOMContentLoaded", () => {
            const elements = document.querySelectorAll('.animate-on-load');
            elements.forEach((el) => {
                const delayClass = Array.from(el.classList).find(c => c.startsWith('delay-'));
                const delayMs = delayClass ? parseInt(delayClass.split('-')[1]) : 0;
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100 + delayMs);
            });
        });

        // WebGL / Canvas Background Effect
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let time = 0;

        function animateBackground() {
            time += 0.003;
            
            // Base extremely dark background
            ctx.fillStyle = '#030303';
            ctx.fillRect(0, 0, width, height);

            // Create a breathing, glowing light source from the bottom center
            const centerX = width / 2;
            const centerY = height * 0.9 + Math.sin(time * 2) * 20; 
            const maxRadius = Math.max(width, height) * 0.8;
            
            const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, maxRadius);
            // Updated to striking blue
            glow.addColorStop(0, 'rgba(0, 112, 243, 0.45)'); 
            glow.addColorStop(0.4, 'rgba(0, 60, 160, 0.15)');
            glow.addColorStop(1, 'rgba(5, 5, 5, 0)');
            
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, width, height);

            const panelWidth = Math.max(100, width / 12); 
            const numPanels = Math.ceil(width / panelWidth) + 1;
            const gapWidth = panelWidth * 0.15; 

            for (let i = -1; i < numPanels; i++) {
                const x = i * panelWidth;
                
                const panelGradient = ctx.createLinearGradient(x, 0, x + panelWidth, 0);
                panelGradient.addColorStop(0, 'rgba(3, 3, 3, 0.98)');
                panelGradient.addColorStop(0.5, 'rgba(6, 6, 6, 0.95)');
                panelGradient.addColorStop(1, 'rgba(3, 3, 3, 0.1)'); 
                
                ctx.fillStyle = panelGradient;
                ctx.fillRect(x, 0, panelWidth - gapWidth, height);
            }

            requestAnimationFrame(animateBackground);
        }

        animateBackground();
    </script>

</body>
</html>
