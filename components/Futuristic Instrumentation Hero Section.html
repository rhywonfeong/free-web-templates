<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Command - Instrumentation</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body
  class="bg-[#050505] text-zinc-400 antialiased min-h-screen flex flex-col relative selection:bg-zinc-800 selection:text-white"
  style="font-family: 'Outfit', sans-serif;">

  <!-- Background Blueprint & Beam System -->
  <div class="fixed inset-0 z-0 pointer-events-none flex justify-center overflow-hidden">
    <!-- Structural Crosshairs -->
    <div class="h-full w-[1px] bg-gradient-to-b from-transparent via-white/[0.03] to-transparent absolute left-1/4">
    </div>
    <div class="h-full w-[1px] bg-gradient-to-b from-transparent via-white/[0.04] to-transparent absolute left-1/2">
    </div>
    <div class="h-full w-[1px] bg-gradient-to-b from-transparent via-white/[0.03] to-transparent absolute right-1/4">
    </div>
    <div class="w-full h-[1px] bg-gradient-to-r from-transparent via-white/[0.03] to-transparent absolute top-[30%]">
    </div>
    <div class="w-full h-[1px] bg-gradient-to-r from-transparent via-white/[0.03] to-transparent absolute top-[70%]">
    </div>

    <!-- Faint Calibration Grid -->
    <div class="absolute inset-0 opacity-[0.15]"
      style="background-image: linear-gradient(to right, #ffffff 1px, transparent 1px), linear-gradient(to bottom, #ffffff 1px, transparent 1px); background-size: 4rem 4rem; mask-image: radial-gradient(circle at center, black 20%, transparent 80%); -webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 80%);">
    </div>
  </div>

  <!-- Frosted Navigation Shell -->
  <nav class="w-full fixed top-0 left-0 right-0 z-50 flex justify-center pt-6 px-6 pointer-events-none">
    <div
      class="w-full max-w-6xl rounded-2xl bg-zinc-900/30 backdrop-blur-xl border border-white/[0.05] p-[1px] shadow-[0_4px_24px_-4px_rgba(0,0,0,0.5)] pointer-events-auto">
      <div
        class="w-full rounded-[15px] bg-zinc-950/50 flex items-center justify-between px-6 py-4 relative overflow-hidden">
        <!-- Top Highlight -->
        <div class="absolute inset-x-0 top-0 h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent">
        </div>

        <div class="flex items-center gap-3">
          <iconify-icon icon="solar:radial-blur-linear" class="text-xl text-zinc-100" stroke-width="1.5"></iconify-icon>
          <span class="text-zinc-100 font-medium text-sm tracking-wide">NEXUS</span>
        </div>

        <div class="hidden lg:flex items-center gap-10 text-xs uppercase tracking-[0.2em] text-zinc-500 font-normal">
          <a href="#" class="hover:text-zinc-200 transition-colors">Frameworks</a>
          <a href="#" class="hover:text-zinc-200 transition-colors">Modules</a>
          <a href="#" class="hover:text-zinc-200 transition-colors">Logs</a>
          <a href="#" class="hover:text-zinc-200 transition-colors">Talent</a>
          <a href="#" class="hover:text-zinc-200 transition-colors">Foundry</a>
        </div>

        <div class="flex items-center">
          <a href="#"
            class="border border-white/10 bg-white/[0.02] rounded-full px-6 py-2 text-xs uppercase tracking-[0.15em] text-zinc-300 hover:text-white hover:bg-white/5 transition-all font-normal shadow-[inset_0_1px_0_0_rgba(255,255,255,0.05)]">
            Initiate
          </a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Viewport -->
  <main class="flex-grow w-full z-10 relative pt-40 pb-24">

    <!-- Instrument Panel Hero -->
    <section
      class="max-w-7xl mx-auto px-6 w-full flex flex-col lg:flex-row items-center justify-between relative pt-12 pb-20 min-h-[600px] gap-16 lg:gap-8">

      <!-- Sparse Typography (Left) -->
      <div class="relative z-30 flex-1 flex flex-col items-start text-left lg:max-w-xl hero-content">
        <div
          class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-white/10 bg-zinc-900/50 backdrop-blur-md mb-8">
          <div class="w-1.5 h-1.5 rounded-full bg-zinc-300 animate-pulse"></div>
          <span class="text-xs uppercase tracking-[0.2em] text-zinc-300 font-light">System Calibrated</span>
        </div>

        <h1 class="text-5xl sm:text-6xl lg:text-7xl tracking-tight leading-[1.1] text-zinc-50 font-normal mb-8">
          Precision temporal logic for engineers
        </h1>

        <p class="text-base text-zinc-400 font-light leading-relaxed max-w-md mb-10">
          Deploy hyper-calibrated models that align complex state variables into singular, cohesive operational
          frequencies.
        </p>

        <!-- Glass Action Pill -->
        <div
          class="p-[1px] rounded-full bg-gradient-to-b from-white/20 to-transparent inline-block shadow-[0_0_40px_rgba(255,255,255,0.03)] group">
          <button class="bg-zinc-950/80 backdrop-blur-xl hover:bg-zinc-900 transition-colors text-zinc-100 px-8 py-4 rounded-full text-xs font-medium tracking-[0.15em] uppercase flex items-center gap-4">
                        <span>Align Infrastructure</span>
                        <iconify-icon icon="solar:arrow-right-linear" class="text-lg text-zinc-400 group-hover:text-white transition-colors group-hover:translate-x-1 duration-300" stroke-width="1.5"></iconify-icon>
                    </button>
        </div>
      </div>

      <!-- Dominant Calibration Dial (Right) -->
      <div
        class="relative w-full max-w-[400px] lg:max-w-[500px] aspect-square flex items-center justify-center dial-container flex-1 shrink-0">

        <!-- Internal Glow -->
        <div class="absolute inset-0 bg-zinc-100/[0.03] rounded-full blur-[80px]"></div>

        <!-- Central Crosshairs for the Dial -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-10">
          <div class="w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
          <div class="h-full w-[1px] bg-gradient-to-b from-transparent via-white/20 to-transparent absolute"></div>
        </div>

        <!-- Clock / Calibration Rings SVG -->
        <div class="absolute inset-0 z-0">
          <svg class="w-full h-full" viewBox="0 0 200 200">
            <!-- Outer Boundary Ring -->
            <circle cx="100" cy="100" r="98" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="0.5">
            </circle>

            <!-- Rotating Degree Ticks (Slow Forward) -->
            <g class="origin-center animate-[spin_60s_linear_infinite]">
              <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="0.5"
                stroke-dasharray="1 3"></circle>
              <circle cx="100" cy="100" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="0.2"
                stroke-dasharray="0.2 6"></circle>
            </g>

            <!-- Secondary Tick Ring (Slow Reverse) -->
            <g class="origin-center animate-[spin_40s_linear_infinite_reverse]">
              <circle cx="100" cy="100" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="0.3"
                stroke-dasharray="3 6"></circle>
              <!-- Orbital Node -->
              <circle cx="100" cy="24" r="1.5" fill="#ffffff" fill-opacity="0.6"></circle>
            </g>

            <!-- Solid Inner Frame -->
            <circle cx="100" cy="100" r="50" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
            </circle>
          </svg>
        </div>

        <!-- Rotating Text Label Path -->
        <svg class="absolute inset-0 w-full h-full animate-[spin_80s_linear_infinite] z-10" viewBox="0 0 200 200">
          <defs>
            <path id="dialPath" d="M 100, 100 m -64, 0 a 64,64 0 1,1 128,0 a 64,64 0 1,1 -128,0" />
          </defs>
          <text class="text-[6px] fill-zinc-500 uppercase tracking-[0.3em] font-light">
            <textPath href="#dialPath" startOffset="0%">SYS.CALIBRATION / NOMINAL / ORBITAL SYNC / 100% /
              SYS.CALIBRATION / NOMINAL /</textPath>
          </text>
        </svg>

        <!-- Center Core Glass Hub -->
        <div
          class="relative z-20 w-32 h-32 rounded-full border border-white/10 bg-zinc-900/40 backdrop-blur-md flex items-center justify-center shadow-[inset_0_1px_0_0_rgba(255,255,255,0.1),0_0_20px_rgba(255,255,255,0.02)]">
          <div class="w-16 h-16 rounded-full border border-white/[0.05] flex items-center justify-center relative">
            <div class="w-2 h-2 rounded-full bg-zinc-200 shadow-[0_0_10px_#ffffff]"></div>
            <!-- Micro spinning radar line -->
            <div
              class="absolute inset-0 border-t-2 border-transparent border-r-white/20 rounded-full animate-[spin_2s_linear_infinite]">
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);

            // Nav reveal
            gsap.from("nav", { y: -20, opacity: 0, duration: 1, ease: "power2.out", delay: 0.2 });

            // Hero content reveal
            gsap.from(".hero-content > *", {
                y: 20, 
                opacity: 0, 
                duration: 1.2, 
                ease: "power2.out", 
                stagger: 0.1,
                delay: 0.3
            });

            // Dial continuous scale/fade reveal
            gsap.from(".dial-container", {
                scale: 0.95,
                opacity: 0,
                duration: 1.5,
                ease: "power2.out",
                delay: 0.5
            });
        });
  </script>
</body>

</html>
