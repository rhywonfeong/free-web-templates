<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Impact 3D Neon Logo</title>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

    <style>
        body {
            margin: 0;
            padding: 0;
            /* Deep dark teal background */
            background-color: #000a0c; 
            /* Adding the subtle vertical texture seen in the original image */
            background-image: 
                linear-gradient(to right, rgba(0,20,25,0.3) 0%, transparent 50%, rgba(0,20,25,0.3) 100%),
                radial-gradient(circle at center, #011a20 0%, #00080a 100%);
            background-size: 20px 100%, 100% 100%; /* Creates subtle vertical stripes */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        .logo-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            /* Overall perspective to enhance 3D feel */
            transform: perspective(500px);
        }

        /* --- TOP TEXT: "dot" --- */
        .logo-top {
            font-size: 140px;
            line-height: 0.75;
            color: #ffffff;
            font-weight: 900; /* Extra Black weight */
            position: relative;
            letter-spacing: -4px;
            /* Complex shadow for 3D floating + soft glow effect */
            text-shadow: 
                0 2px 5px rgba(0,0,0,0.4), /* Subtle depth curve */
                0 15px 25px rgba(0,0,0,0.6), /* Heavy floating shadow beneath */
                0 0 20px rgba(255, 255, 255, 0.4), /* Soft white outer glow */
                0 0 60px rgba(0, 224, 255, 0.3); /* Wide ambient cyan glow */
        }

        /* Positioning parent for the 'o' dot */
        .logo-o {
            position: relative;
            display: inline-block;
        }

        /* The Cyan Dot inside the 'o' */
        .logo-o::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -43%); /* Fine-tuned centering */
            width: 32px;
            height: 32px;
            background-color: #00f7ff; /* Super bright cyan */
            border-radius: 50%;
            /* Intense neon glow for the dot */
            box-shadow: 
                inset 0 0 10px #ffffff, /* White hot center */
                0 0 15px #00f7ff,       /* Intense cyan aura */
                0 0 30px #00f7ff;       /* Wider cyan spill */
            z-index: 2;
        }

        /* --- BOTTOM TEXT: "IMPACT" --- */
        .logo-bottom {
            font-size: 45px;
            color: #e0ffff; /* Slightly off-white base for better neon effect */
            font-weight: 700; /* Bold */
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            position: relative;
            /* Intense Cyan Neon 3D Effect */
            text-shadow:
                0 0 5px #ffffff,    /* White hot core definition */
                0 0 15px #00f7ff,   /* Strong neon aura */
                0 0 35px #00f7ff,   /* Wide glow */
                0 15px 20px rgba(0,0,0,0.7); /* Dark shadow below for floating look */
        }
        
        /* Responsive scaling for smaller screens */
        @media (max-width: 600px) {
            .logo-top { font-size: 90px; }
            .logo-o::after { width: 20px; height: 20px; }
            .logo-bottom { font-size: 30px; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="logo-top">
            d<span class="logo-o">o</span>t
        </div>
        <div class="logo-bottom">IMPACT</div>
    </div>

</body>
</html>
