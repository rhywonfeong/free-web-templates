<section
    class="bg-[#050505] text-white font-sans antialiased min-h-screen relative overflow-hidden selection:bg-blue-500/30 selection:text-white"
    style="display: flex; align-items: center; justify-content: center;">
    <style>
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        @keyframes float-delayed {

            0%,
            100% {
                transform: translateY(0) rotate(-15deg);
            }

            50% {
                transform: translateY(-8px) rotate(-15deg);
            }
        }

        @keyframes float-delayed-alt {

            0%,
            100% {
                transform: translateY(0) rotate(15deg);
            }

            50% {
                transform: translateY(-10px) rotate(15deg);
            }
        }

        .premium-border::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(to bottom right, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.02));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>

    <!-- Background Layer -->
    <div class="fixed inset-0 z-0">
        <canvas id="webgl-canvas" style="width: 100%; height: 100%; pointer-events: none;"></canvas>
        <div
            style="position: absolute; inset: 0; pointer-events: none; background-image: url('data:image/svg+xml,%3Csvg viewBox=\'0 0 200 200\' xmlns=\'http://www.w3.org/2000/svg\'%3E%3Cfilter id=\'noiseFilter\'%3E%3CfeTurbulence type=\'fractalNoise\' baseFrequency=\'0.8\' numOctaves=\'3\' stitchTiles=\'stitch\'/%3E%3C/filter%3E%3Crect width=\'100%25\' height=\'100%25\' filter=\'url(%23noiseFilter)\'/%3E%3C/svg%3E'); opacity: 0.05; mix-blend-mode: screen;">
        </div>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
        <script>
            const canvas = document.getElementById('webgl-canvas');
            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const material = new THREE.ShaderMaterial({
                uniforms: { u_time: { value: 0 }, u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) } },
                fragmentShader: `
                    uniform float u_time; uniform vec2 u_resolution;
                    float snoise(vec2 v){ return fract(sin(dot(v, vec2(12.9898, 78.233))) * 43758.5453); }
                    void main() {
                        vec2 uv = gl_FragCoord.xy / u_resolution.xy;
                        vec2 st = uv - vec2(0.5, 1.1);
                        st.x *= u_resolution.x / u_resolution.y;
                        float rays = smoothstep(0.1, 0.9, snoise(vec2(atan(st.y, st.x) * 3.0 - u_time * 0.1, length(st)))) * smoothstep(1.2, 0.0, length(st));
                        vec3 color = mix(vec3(0.01, 0.0, 0.03), vec3(0.4, 0.1, 0.7), rays * 0.5);
                        float scan = smoothstep(0.99, 1.0, fract(uv.y * 10.0 - u_time * 0.4));
                        gl_FragColor = vec4(color + scan * 0.1, 1.0);
                    }`
            });
            scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));
            function animate(t) { material.uniforms.u_time.value = t * 0.001; renderer.render(scene, camera); requestAnimationFrame(animate); }
            animate(0);
            window.addEventListener('resize', () => { renderer.setSize(window.innerWidth, window.innerHeight); material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight); });
        </script>
    </div>

    <!-- Main Content -->
    <div class="relative z-10 max-w-[1400px] w-full mx-auto px-6 py-20 flex items-center">
        <div class="grid lg:grid-cols-2 gap-16 lg:gap-24 w-full items-center">

            <div class="space-y-8 reveal-container">
                <h1 class="text-5xl md:text-6xl lg:text-7xl font-semibold tracking-tight leading-[1.05] text-white">
                    <span class="inline-block overflow-hidden align-bottom"><span class="reveal-word inline-block">Build</span></span>
                    <span class="inline-block overflow-hidden align-bottom"><span class="reveal-word inline-block">software</span></span><br>
                    <span class="inline-block overflow-hidden align-bottom"><span class="reveal-word inline-block text-gray-400">together,</span></span>
                    <span class="inline-block overflow-hidden align-bottom"><span class="reveal-word inline-block text-blue-500">faster.</span></span>
                </h1>
                <p class="reveal-fade text-lg md:text-xl text-gray-400 max-w-md leading-relaxed">
                    Experience true multiplayer presence. See cursors, live edits, and collaborate in real-time.
                </p>
                <div class="reveal-fade pt-4">
                    <button class="px-6 py-3 rounded-full bg-white text-black text-sm font-medium hover:bg-gray-200 transition-all shadow-lg shadow-white/10">Get Started</button>
                </div>
            </div>

            <div class="relative w-full aspect-square md:aspect-[4/3] flex items-center justify-center reveal-scale">
                <!-- Background Mockup -->
                <div class="absolute inset-0 rounded-[2.5rem] bg-[#0a0a0a] border border-white/5 shadow-2xl overflow-hidden flex flex-col items-center justify-center p-8 text-center"
                    style="opacity: 0.6;">
                    <div class="flex flex-col items-center select-none pointer-events-none opacity-20">
                        <h2 class="text-7xl md:text-8xl font-bold tracking-tighter mb-4">PLATFORM</h2>
                        <div class="flex gap-4">
                            <div class="h-10 w-32 bg-white/10 rounded-full"></div>
                            <div class="h-10 w-32 border border-white/10 rounded-full"></div>
                        </div>
                    </div>
                </div>

                <!-- Floating Card -->
                <div class="relative z-10 w-72 rounded-2xl bg-[#111111] p-4 premium-border shadow-2xl"
                    style="animation: float 6s ease-in-out infinite;">
                    <div
                        class="w-full h-32 bg-white/[0.03] rounded-xl border border-white/[0.04] flex items-center justify-center mb-5">
                        <iconify-icon icon="solar:programming-linear" class="text-4xl text-gray-600"></iconify-icon>
                    </div>
                    <div class="space-y-2 mb-6">
                        <div class="h-2 w-3/4 bg-white/10 rounded-full"></div>
                        <div class="h-2 w-1/2 bg-white/10 rounded-full"></div>
                    </div>
                    <button class="w-full py-2.5 bg-[#0099FF] rounded-xl text-white text-xs font-medium shadow-[0_0_20px_rgba(0,153,255,0.2)]">Publish Changes</button>

                    <!-- Cursor 1 -->
                    <div class="absolute -top-6 -left-8 flex flex-col items-start pointer-events-none"
                        style="animation: float-delayed 5s ease-in-out infinite;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="#0099FF" stroke="white"
                            stroke-width="1.5">
                            <path d="M5.5 3.21V20.8l4.86-4.86h6.87L5.5 3.21Z" />
                        </svg>
                        <div
                            class="bg-[#0099FF] text-white text-[10px] px-2 py-0.5 rounded-full translate-x-4 -translate-y-1">
                            Sarah J.</div>
                    </div>

                    <!-- Cursor 2 -->
                    <div class="absolute bottom-12 -right-12 flex flex-col items-start pointer-events-none"
                        style="animation: float-delayed-alt 7s ease-in-out infinite;">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="#FF0066" stroke="white"
                            stroke-width="1.5">
                            <path d="M5.5 3.21V20.8l4.86-4.86h6.87L5.5 3.21Z" />
                        </svg>
                        <div
                            class="bg-[#FF0066] text-white text-[10px] px-2 py-0.5 rounded-full translate-x-4 -translate-y-1">
                            David K.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);
            gsap.from(".reveal-word", { y: "100%", opacity: 0, duration: 1, ease: "power4.out", stagger: 0.1 });
            gsap.from(".reveal-fade", { opacity: 0, y: 20, duration: 1, delay: 0.5, stagger: 0.2 });
            gsap.from(".reveal-scale", { scale: 0.9, opacity: 0, duration: 1.2, ease: "expo.out", delay: 0.3 });
        });
    </script>
</section>
