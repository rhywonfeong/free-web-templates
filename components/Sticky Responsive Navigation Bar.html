<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axiom Navigation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <style>
    body {
      background: #020617;
      font-family: 'Rajdhani', sans-serif;
    }
  </style>
</head>

<body class="min-h-screen text-slate-300 antialiased overflow-x-hidden">

  <!-- Demo wrapper so the sticky nav renders like the original layout -->
  <div
    class="max-w-[1400px] mx-auto min-h-screen border-x border-cyan-500/10 bg-slate-950/70 backdrop-blur-md shadow-[0_0_100px_rgba(2,6,23,0.8)]">

    <!-- Floating Sticky Navigation -->
    <header class="sticky top-4 z-50 px-4 sm:px-6 lg:px-8">
      <div class="max-w-[1460px] mx-auto">
        <div
          class="relative flex items-center justify-between h-[72px] px-4 sm:px-5 lg:px-6 border border-cyan-500/20 bg-[#020617]/78 backdrop-blur-xl shadow-[0_10px_40px_rgba(2,6,23,0.55),inset_0_1px_0_rgba(34,211,238,0.06)]">

          <!-- Subtle inner top highlight -->
          <div
            class="pointer-events-none absolute inset-x-10 top-0 h-px bg-gradient-to-r from-transparent via-cyan-400/25 to-transparent">
          </div>

          <!-- Corner brackets -->
          <div class="pointer-events-none absolute top-0 left-0 w-3 h-3 border-t border-l border-cyan-400/45"></div>
          <div class="pointer-events-none absolute top-0 right-0 w-3 h-3 border-t border-r border-cyan-400/45"></div>
          <div class="pointer-events-none absolute bottom-0 left-0 w-3 h-3 border-b border-l border-cyan-400/45"></div>
          <div class="pointer-events-none absolute bottom-0 right-0 w-3 h-3 border-b border-r border-cyan-400/45"></div>

          <!-- Brand -->
          <a href="#" class="flex items-center gap-3 shrink-0 relative z-20">
            <div class="relative w-6 h-6 flex items-center justify-center">
              <div class="absolute inset-0 border border-cyan-500/50"></div>
              <div class="w-1.5 h-1.5 bg-cyan-400 shadow-[0_0_10px_rgba(34,211,238,0.8)]"></div>
            </div>
            <span class="text-slate-50 tracking-tight text-xl font-light uppercase">
              AXIOM
            </span>
          </a>

          <!-- Desktop Nav -->
          <nav
            class="hidden md:flex items-center gap-7 lg:gap-9 absolute left-1/2 -translate-x-1/2 text-[0.72rem] text-slate-400 font-normal uppercase tracking-[0.22em]">
            <a href="#architecture" class="hover:text-cyan-400 transition-colors whitespace-nowrap">Architecture</a>
            <a href="#capabilities" class="hover:text-cyan-400 transition-colors whitespace-nowrap">Capabilities</a>
            <a href="#engine" class="hover:text-cyan-400 transition-colors whitespace-nowrap">Engine</a>
          </nav>

          <!-- Right side -->
          <div class="hidden md:flex items-center gap-3 shrink-0 relative z-20">
            <a href="#contact"
              class="inline-flex items-center justify-center gap-2 h-[46px] px-5 border border-cyan-500/30 bg-cyan-500/10 text-cyan-50 hover:bg-cyan-500/18 hover:border-cyan-400 hover:shadow-[0_0_18px_rgba(34,211,238,0.16)] transition-all duration-300 text-[0.72rem] uppercase tracking-[0.2em]">
              Request Access
              <iconify-icon icon="solar:arrow-right-up-linear" class="text-base"></iconify-icon>
            </a>
          </div>

          <!-- Mobile toggle -->
          <button
            id="mobile-menu-toggle"
            class="md:hidden inline-flex items-center justify-center h-11 w-11 border border-cyan-500/25 bg-slate-950/70 text-cyan-100 hover:border-cyan-400 hover:bg-slate-900/90 transition-colors relative z-20"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="mobile-menu"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M4 7h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 17h16"></path>
            </svg>
          </button>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu"
          class="hidden md:hidden mt-3 border border-cyan-500/20 bg-[#020617]/92 backdrop-blur-xl shadow-[0_18px_40px_rgba(2,6,23,0.55)] p-3">
          <div class="flex flex-col gap-2">
            <a href="#architecture"
              class="px-4 py-3 text-[0.72rem] uppercase tracking-[0.2em] text-slate-300 hover:text-cyan-400 hover:bg-cyan-500/5 transition-colors">
              Architecture
            </a>
            <a href="#capabilities"
              class="px-4 py-3 text-[0.72rem] uppercase tracking-[0.2em] text-slate-300 hover:text-cyan-400 hover:bg-cyan-500/5 transition-colors">
              Capabilities
            </a>
            <a href="#engine"
              class="px-4 py-3 text-[0.72rem] uppercase tracking-[0.2em] text-slate-300 hover:text-cyan-400 hover:bg-cyan-500/5 transition-colors">
              Engine
            </a>

            <div class="h-px bg-cyan-500/10 my-2"></div>

            <a href="#contact"
              class="inline-flex items-center justify-center gap-2 h-12 px-5 border border-cyan-500/30 bg-cyan-500/10 text-cyan-50 hover:bg-cyan-500/18 hover:border-cyan-400 transition-all duration-300 text-[0.72rem] uppercase tracking-[0.2em]">
              Request Access
              <iconify-icon icon="solar:arrow-right-up-linear" class="text-base"></iconify-icon>
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Spacer only for preview -->
    <main class="h-[1400px]"></main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const mobileToggle = document.getElementById("mobile-menu-toggle");
      const mobileMenu = document.getElementById("mobile-menu");

      if (!mobileToggle || !mobileMenu) return;

      mobileToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpen = !mobileMenu.classList.contains("hidden");
        mobileMenu.classList.toggle("hidden");
        mobileToggle.setAttribute("aria-expanded", String(!isOpen));
      });

      document.addEventListener("click", (e) => {
        if (!mobileToggle.contains(e.target) && !mobileMenu.contains(e.target)) {
          mobileMenu.classList.add("hidden");
          mobileToggle.setAttribute("aria-expanded", "false");
        }
      });
    });
  </script>
</body>

</html>
