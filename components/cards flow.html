  <!-- WebGL & Interaction Scripts -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
            // --- 1. Background Breathing Bars Logic ---
            const barsContainer = document.getElementById('v-bars-container');
            const numBars = 30;
            const bars = [];
            
            for(let i=0; i<numBars; i++) {
                const bar = document.createElement('div');
                // Calculate height based on distance from center (V-shape)
                const distance = Math.abs((i - numBars/2) / (numBars/2));
                const baseHeight = 20 + distance * 80; // 20% to 100%
                
                bar.className = 'flex-1 rounded-t-sm w-full';
                bar.style.height = `${baseHeight}%`;
                bar.style.background = 'linear-gradient(to top, #020617 0%, #1e3a8a 22%, #ffffff 42%, #3b82f6 65%, transparent 95%)';
                bar.style.transformOrigin = 'bottom';
                
                barsContainer.appendChild(bar);
                bars.push({ el: bar, baseHeight, phase: i * 0.2 });
            }

            // --- 2. Three.js Dot-Matrix Particle Field ---
            const canvas = document.getElementById('webgl-canvas');
            const scene = new THREE.Scene();
            // High FOV for perspective depth
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.z = 15;
            camera.position.y = 5;
            camera.lookAt(0, 0, 0);

            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // DPR Clamp
            renderer.setSize(window.innerWidth, window.innerHeight);

            // Shader Material for Dots + Fade
            const vertexShader = `
                uniform float uTime;
                uniform vec2 uMouse;
                varying float vAlpha;
                void main() {
                    vec3 pos = position;
                    float dist = length(pos.xz);
                    
                    // Slow breathing pulse (wave)
                    float wave = sin(dist * 0.8 - uTime * 1.5) * 0.4;
                    pos.y += wave;
                    
                    // Pointer reactive drift (Parallax)
                    pos.x += uMouse.x * 3.0;
                    pos.z += uMouse.y * 3.0;

                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    
                    // Size attenuation
                    gl_PointSize = (12.0 / -mvPosition.z);
                    
                    // Soft depth fade (sparse spacing visibility)
                    vAlpha = smoothstep(25.0, 5.0, dist) * 0.6;
                }
            `;

            const fragmentShader = `
                varying float vAlpha;
                void main() {
                    // Soft circular dot
                    vec2 pt = gl_PointCoord - vec2(0.5);
                    float r = length(pt);
                    if(r > 0.5) discard;
                    
                    float glow = 1.0 - (r * 2.0);
                    glow = pow(glow, 1.5); // sharpen center
                    
                    // Deep space / electric blue tint mix
                    vec3 color = mix(vec3(0.6, 0.8, 1.0), vec3(0.23, 0.51, 0.96), r);
                    gl_FragColor = vec4(color, vAlpha * glow);
                }
            `;

            const uniforms = {
                uTime: { value: 0 },
                uMouse: { value: new THREE.Vector2(0, 0) }
            };

            const material = new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                uniforms,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            // Grid Geometry
            const geometry = new THREE.BufferGeometry();
            const particles = [];
            const gridSize = 40;
            const step = 1.2; // Sparse spacing

            for(let x = -gridSize; x <= gridSize; x += step) {
                for(let z = -gridSize; z <= gridSize; z += step) {
                    particles.push(x, 0, z);
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(particles, 3));
            const pointsMesh = new THREE.Points(geometry, material);
            // Tilt slightly to see the field receding
            pointsMesh.rotation.x = 0.2; 
            scene.add(pointsMesh);

            // --- 3. Pointer & Animation Loop (GSAP + Three + DOM) ---
            const domCards = document.querySelectorAll('.card-wrapper');
            let time = 0;
            let mouseX = 0, mouseY = 0;
            let targetMouseX = 0, targetMouseY = 0;

            window.addEventListener('mousemove', (e) => {
                // Normalized -1 to 1
                targetMouseX = (e.clientX / window.innerWidth) * 2 - 1;
                targetMouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                
                // Scale DOM scene slightly on smaller screens
                const sceneDom = document.getElementById('scene');
                const scale = Math.min(1, window.innerWidth / 1200);
                gsap.set(sceneDom, { scale: scale });
            });
            window.dispatchEvent(new Event('resize'));

            // Main Tick
            gsap.ticker.add(() => {
                time += 0.01;
                
                // Lerp mouse for smoothness
                mouseX += (targetMouseX - mouseX) * 0.05;
                mouseY += (targetMouseY - mouseY) * 0.05;

                // Update Three.js
                uniforms.uTime.value = time;
                uniforms.uMouse.value.set(mouseX, mouseY);
                renderer.render(scene, camera);

                // Update Background Bars (Breathing wave)
                bars.forEach(b => {
                    // Sine wave oscillation
                    const osc = Math.sin(time * 2 + b.phase) * 10;
                    b.el.style.height = `${b.baseHeight + osc}%`;
                });

                // DOM Cards Parallax (Skeuomorphic float)
                domCards.forEach((card, i) => {
                    const bx = parseFloat(card.dataset.x);
                    const by = parseFloat(card.dataset.y);
                    const br = parseFloat(card.dataset.r);
                    const depth = parseFloat(card.dataset.depth);

                    // Organic buoyant float
                    const floatY = Math.sin(time * 1.2 + i) * 12 * depth;
                    const floatX = Math.cos(time * 0.8 + i) * 6 * depth;
                    const floatR = Math.sin(time + i) * 1.5 * depth;

                    // Parallax drift based on pointer
                    const pX = mouseX * 60 * depth;
                    const pY = -mouseY * 60 * depth; // invert Y for natural dom feel
                    
                    // Subtle 3D rotation based on mouse
                    const rotX = mouseY * 10 * depth;
                    const rotY = mouseX * 10 * depth;

                    gsap.set(card, {
                        xPercent: -50,
                        yPercent: -50,
                        x: bx + pX + floatX,
                        y: by + pY + floatY,
                        rotationZ: br + floatR,
                        rotationX: rotX,
                        rotationY: rotY,
                        transformOrigin: "center center"
                    });
                });
            });

            // --- 4. Entrance Animation Sequences ---
            const tl = gsap.timeline({ delay: 0.2 });
            
            // Fade in framing
            tl.fromTo('.border-white\\/\\[0\\.03\\] > div', 
                { opacity: 0 }, 
                { opacity: 1, duration: 1.5, stagger: 0.1, ease: "power2.inOut" }, 0
            );

            // Stagger cards in from bottom with 20px offset (Power3.out)
            tl.fromTo(domCards,
                { y: "+=40", opacity: 0, scale: 0.95 },
                { 
                    y: "-=40", // relative adjustment handled by ticker overriding, but creates entrance delta
                    opacity: 1, 
                    scale: 1,
                    duration: 1.2, 
                    stagger: 0.15, 
                    ease: "power3.out",
                    onStart: function() {
                        // Let ticker take over transforms smoothly
                        gsap.set(this.targets()[0], { clearProps: "y,scale" });
                    }
                }, 0.5
            );
        });
  </script>
</body>
