<div
    class="bg-[#0b0c10] text-slate-200 min-h-screen flex flex-col items-center justify-center overflow-hidden font-sans antialiased relative selection:bg-fuchsia-500/30">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <!-- Background Rays -->
    <div class="absolute inset-0 z-0 flex items-center justify-center opacity-40 pointer-events-none">
        <div class="w-[200vw] h-[200vw] animate-spin [animation-duration:120s] linear"
            style="background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.03) 0deg, rgba(255,255,255,0.03) 1deg, transparent 1deg, transparent 12deg); mask-image: radial-gradient(circle, black 10%, transparent 60%); -webkit-mask-image: radial-gradient(circle, black 10%, transparent 60%);">
        </div>
    </div>

    <!-- Ambient Glow Background -->
    <div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center mix-blend-screen opacity-50">
        <div class="w-[800px] h-[800px] rounded-full"
            style="background: radial-gradient(circle, rgba(56,189,248,0.15) 0%, rgba(217,70,239,0.1) 40%, transparent 70%);">
        </div>
    </div>

    <!-- Particles Layer -->
    <div class="absolute inset-0 z-0 pointer-events-none" id="particles-container">
        <div
            class="absolute top-[20%] left-[30%] w-1.5 h-1.5 bg-cyan-200 rounded-full animate-ping [animation-duration:3s] shadow-[0_0_10px_cyan]">
        </div>
        <div
            class="absolute top-[40%] right-[25%] w-1 h-1 bg-fuchsia-200 rounded-full animate-pulse [animation-duration:2s] shadow-[0_0_8px_fuchsia]">
        </div>
        <div
            class="absolute bottom-[30%] left-[40%] w-2 h-2 bg-blue-200 rounded-full opacity-50 shadow-[0_0_12px_blue] transform transition-transform duration-1000 hover:scale-150">
        </div>
        <div
            class="absolute top-[60%] right-[40%] w-1 h-1 bg-white rounded-full animate-ping [animation-duration:4s] shadow-[0_0_5px_white]">
        </div>
        <div
            class="absolute top-[25%] right-[45%] w-1.5 h-1.5 bg-cyan-400 rounded-full opacity-60 shadow-[0_0_15px_cyan]">
        </div>
        <div
            class="absolute bottom-[20%] right-[35%] w-1 h-1 bg-purple-300 rounded-full animate-pulse [animation-duration:2.5s]">
        </div>
    </div>

    <!-- Main Layout Container -->
    <main class="relative z-10 w-full max-w-5xl px-6 flex flex-col items-center justify-center gap-12">
        <div
            class="w-full flex flex-col md:flex-row items-center justify-between lg:justify-center lg:gap-16 xl:gap-24">
            <!-- Left Panel -->
            <div class="flex flex-col gap-4 w-full md:w-56 order-2 md:order-1 mt-8 md:mt-0">
                <div class="w-full text-center stagger-animate opacity-0 translate-x-[-20px]">
                    <span class="text-sm font-normal text-slate-300/80 tracking-wide">Input A</span>
                </div>
                <div
                    class="w-full h-11 rounded-full border border-white/10 bg-[#1a1b26]/60 backdrop-blur-md flex items-center justify-center cursor-pointer transition-all duration-300 hover:bg-white/5 hover:border-white/20 hover:shadow-[0_0_15px_rgba(255,255,255,0.05)] stagger-animate opacity-0 translate-x-[-20px] group">
                    <span class="text-sm font-medium text-slate-200 group-hover:text-white transition-colors">Input B</span>
                </div>
                <div
                    class="w-full h-11 rounded-full border border-white/10 bg-[#1a1b26]/60 backdrop-blur-md flex items-center justify-center relative cursor-ew-resize transition-all duration-300 hover:bg-white/5 hover:border-white/20 stagger-animate opacity-0 translate-x-[-20px] group">
                    <span class="text-sm font-medium text-slate-200 group-hover:text-white transition-colors">Input C</span>
                    <div
                        class="absolute top-0 left-[65%] -translate-y-1/2 -translate-x-1/2 w-3.5 h-3.5 bg-slate-200 rounded-full shadow-[0_0_10px_rgba(255,255,255,0.8)] group-hover:bg-white group-hover:scale-110 transition-all">
                    </div>
                </div>
                <div
                    class="w-full h-11 rounded-full border border-white/10 bg-[#1a1b26]/60 backdrop-blur-md flex items-center justify-center relative cursor-ew-resize transition-all duration-300 hover:bg-white/5 hover:border-white/20 stagger-animate opacity-0 translate-x-[-20px] group">
                    <span class="text-sm font-medium text-slate-200 group-hover:text-white transition-colors">Input</span>
                    <div
                        class="absolute top-0 left-[40%] -translate-y-1/2 -translate-x-1/2 w-3.5 h-3.5 bg-slate-200 rounded-full shadow-[0_0_10px_rgba(255,255,255,0.8)] group-hover:bg-white group-hover:scale-110 transition-all">
                    </div>
                </div>
            </div>

            <!-- Central Orb -->
            <div
                class="relative w-72 h-72 lg:w-80 lg:h-80 flex items-center justify-center order-1 md:order-2 flex-shrink-0 stagger-animate opacity-0 scale-90">
                <div class="absolute inset-2 rounded-full border-[3px] border-white/80 animate-pulse [animation-duration:4s]"
                    style="box-shadow: -25px 0 60px -15px rgba(6,182,212,0.8), 25px 0 60px -15px rgba(217,70,239,0.8), inset 0 0 20px rgba(255,255,255,0.4);">
                </div>
                <div
                    class="absolute inset-0 flex items-center justify-center animate-spin [animation-duration:30s] linear reverse">
                    <div
                        class="w-24 h-24 border border-cyan-400/40 rounded-sm transform rotate-[30deg] flex items-center justify-center">
                        <div class="w-20 h-20 border border-fuchsia-400/30 rounded-sm transform -rotate-[45deg]"></div>
                    </div>
                    <div class="absolute w-28 h-28 border border-blue-400/20 rounded-full"></div>
                    <div
                        class="absolute w-[1px] h-32 bg-gradient-to-b from-transparent via-cyan-300/40 to-transparent transform rotate-45">
                    </div>
                    <div
                        class="absolute w-[1px] h-32 bg-gradient-to-b from-transparent via-fuchsia-300/40 to-transparent transform -rotate-45">
                    </div>
                    <div
                        class="absolute w-[1px] h-20 bg-gradient-to-b from-transparent via-white/50 to-transparent transform rotate-90">
                    </div>
                </div>
                <div class="absolute w-[150%] h-[150%] flex items-center justify-center pointer-events-none"
                    style="transform: rotateX(65deg) rotateY(-15deg);">
                    <div
                        class="w-[90%] h-[90%] rounded-full border border-cyan-300/30 animate-spin [animation-duration:8s] linear relative">
                        <div
                            class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 bg-white rounded-full shadow-[0_0_12px_cyan]">
                        </div>
                        <div
                            class="absolute bottom-0 right-1/4 translate-x-1/2 translate-y-1/2 w-1.5 h-1.5 bg-fuchsia-200 rounded-full shadow-[0_0_10px_fuchsia]">
                        </div>
                    </div>
                    <div
                        class="absolute w-[100%] h-[100%] rounded-full border border-white/5 animate-spin [animation-duration:14s] linear reverse">
                    </div>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="flex flex-col gap-4 w-full md:w-56 order-3 mt-8 md:mt-0">
                <div class="w-full text-center stagger-animate opacity-0 translate-x-[20px]">
                    <span class="text-sm font-normal text-slate-300/80 tracking-wide">Input F</span>
                </div>
                <div
                    class="w-full h-11 rounded-full border border-white/10 bg-[#1a1b26]/60 backdrop-blur-md flex items-center justify-center cursor-pointer transition-all duration-300 hover:bg-white/5 hover:border-white/20 hover:shadow-[0_0_15px_rgba(255,255,255,0.05)] stagger-animate opacity-0 translate-x-[20px] group">
                    <span class="text-sm font-medium text-slate-200 group-hover:text-white transition-colors">Input D</span>
                </div>
                <div
                    class="w-full h-11 rounded-full border border-white/10 bg-[#1a1b26]/60 backdrop-blur-md flex items-center justify-center relative cursor-ew-resize transition-all duration-300 hover:bg-white/5 hover:border-white/20 stagger-animate opacity-0 translate-x-[20px] group">
                    <span class="text-sm font-medium text-slate-200 group-hover:text-white transition-colors">Input E</span>
                    <div
                        class="absolute top-0 left-[75%] -translate-y-1/2 -translate-x-1/2 w-4 h-4 bg-slate-200 rounded-full shadow-[0_0_10px_rgba(255,255,255,0.9)] group-hover:bg-white group-hover:scale-110 transition-all">
                    </div>
                </div>
                <div
                    class="w-full h-11 rounded-full border border-white/10 bg-[#1a1b26]/60 backdrop-blur-md flex items-center justify-center cursor-pointer transition-all duration-300 hover:bg-white/5 hover:border-white/20 hover:shadow-[0_0_15px_rgba(255,255,255,0.05)] stagger-animate opacity-0 translate-x-[20px] group">
                    <span class="text-sm font-medium text-slate-200 group-hover:text-white transition-colors">Input F</span>
                </div>
            </div>
        </div>

        <button class="relative mt-12 px-16 py-4 rounded-full overflow-hidden group stagger-animate opacity-0 translate-y-[20px]">
            <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 via-indigo-500 to-fuchsia-500 opacity-90 group-hover:opacity-100 transition-opacity duration-300"></div>
            <div class="absolute inset-0 rounded-full border border-white/20 shadow-[inset_0_-2px_10px_rgba(0,0,0,0.4)]"></div>
            <div class="absolute inset-0 -translate-x-[150%] bg-gradient-to-r from-transparent via-white/30 to-transparent group-hover:animate-[expand_1.5s_ease-in-out_infinite]" style="transform: skewX(-20deg);"></div>
            <span class="relative z-10 text-base font-medium text-white tracking-wide">Process Data</span>
            <div class="absolute -inset-1 bg-gradient-to-r from-cyan-500 via-indigo-500 to-fuchsia-500 rounded-full blur-lg opacity-40 group-hover:opacity-70 transition-opacity duration-300 -z-10"></div>
        </button>
    </main>

    <style>
        @keyframes expand {
            0% {
                transform: translateX(-150%) skewX(-20deg);
            }

            100% {
                transform: translateX(150%) skewX(-20deg);
            }
        }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const elements = document.querySelectorAll('.stagger-animate');
            elements.forEach((el, index) => {
                el.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
                setTimeout(() => {
                    el.classList.remove('opacity-0', 'translate-x-[-20px]', 'translate-x-[20px]', 'translate-y-[20px]', 'scale-90');
                    el.classList.add('opacity-100', 'translate-x-0', 'translate-y-0', 'scale-100');
                }, 100 + (index * 120));
            });
        });
    </script>
</div>
