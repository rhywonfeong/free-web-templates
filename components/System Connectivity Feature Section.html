                    <iconify-icon icon="solar:letter-p-bold-duotone"
                        class="text-2xl sm:text-3xl text-zinc-500 group-hover:text-zinc-800 transition-colors"></iconify-icon>
                </div>
            </div>
        </div>

        <!-- Technical Action Button -->
        <div class="mt-16 md:mt-24 text-center relative z-10">
            <button class="bg-[#E05A33] hover:bg-[#C94D29] text-white text-xs sm:text-sm font-light px-8 py-3.5 rounded-[4px] transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#E05A33] focus:ring-offset-[#F9F8F5] inline-flex items-center gap-2" style="font-family: 'JetBrains Mono', monospace;">
                Initiate deployment sequence
                <iconify-icon icon="solar:arrow-right-bold-duotone" class="text-base"></iconify-icon>
            </button>
        </div>

    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);
            
            const elements = document.querySelectorAll('.animate-masked-words');
            
            elements.forEach(el => {
                const text = el.textContent.trim();
                const words = text.split(/\s+/);
                el.textContent = ''; 
                
                words.forEach((word, index) => {
                    const wrapper = document.createElement('span');
                    wrapper.className = 'inline-flex overflow-hidden align-bottom pb-[0.15em] -mb-[0.15em]';
                    
                    const inner = document.createElement('span');
                    inner.className = 'inline-block translate-y-[120%] will-change-transform';
                    inner.textContent = word;
                    
                    wrapper.appendChild(inner);
                    el.appendChild(wrapper);
                    
                    if (index < words.length - 1) {
                        el.appendChild(document.createTextNode(' '));
                    }
                });

                el.classList.remove('opacity-0');

                gsap.to(el.querySelectorAll('span > span'), {
                    y: '0%',
                    duration: 1.2,
                    stagger: 0.04,
                    ease: "power4.out",
                    scrollTrigger: {
                        trigger: el,
                        start: "top 90%",
                    }
                });
            });
        });
    </script>
</body>

</html>
