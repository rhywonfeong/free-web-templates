  <!-- WebGL Particle Animation Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gl-canvas');
            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            // Core Glowing Sphere (Dense Particles)
            const coreGeometry = new THREE.SphereGeometry(3.5, 96, 96);
            const coreMaterial = new THREE.PointsMaterial({
                size: 0.015,
                color: 0x6366f1, // Indigo-500 hex
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending
            });
            const coreSphere = new THREE.Points(coreGeometry, coreMaterial);
            scene.add(coreSphere);

            // Outer Swirling Atmosphere (Wireframe/Lines)
            const atmosphereGeometry = new THREE.SphereGeometry(3.6, 32, 32);
            const atmosphereMaterial = new THREE.MeshBasicMaterial({
                color: 0x818cf8, // Indigo-400 hex
                wireframe: true,
                transparent: true,
                opacity: 0.08,
                blending: THREE.AdditiveBlending
            });
            const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
            scene.add(atmosphere);

            // Floating Ambient Particles
            const particleCount = 800;
            const particlesGeometry = new THREE.BufferGeometry();
            const posArray = new Float32Array(particleCount * 3);
            
            for(let i = 0; i < particleCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 25;
            }
            
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.02,
                color: 0xc7d2fe, // Indigo-200 hex
                transparent: true,
                opacity: 0.4,
                blending: THREE.AdditiveBlending
            });
            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            // Animation Loop
            const clock = new THREE.Clock();
            
            function animate() {
                const elapsedTime = clock.getElapsedTime();
                
                // Slow rotation for core
                coreSphere.rotation.y = elapsedTime * 0.05;
                coreSphere.rotation.x = elapsedTime * 0.02;
                
                // Counter-rotation for atmosphere
                atmosphere.rotation.y = elapsedTime * -0.03;
                atmosphere.rotation.z = elapsedTime * 0.01;
                
                // Drift ambient particles
                particlesMesh.rotation.y = elapsedTime * 0.015;
                particlesMesh.position.y = Math.sin(elapsedTime * 0.5) * 0.2;

                renderer.render(scene, camera);
                requestAnimationFrame(animate);
            }
            
            animate();

            // Handle Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        });
  </script>
