<button class="group outline-none cursor-pointer transition-transform duration-200 active:scale-95 bg-transparent border-0 pt-0 pr-0 pb-0 pl-0 relative" aria-label="Action Button">

        <!-- Progressive Blur Glow Layers -->
<div class="absolute inset-0 -m-3 rounded-full bg-indigo-500/30 blur-md opacity-0 group-hover:opacity-100 transition-opacity duration-300 ease-out z-0"></div>

<div class="absolute inset-0 -m-6 rounded-full bg-indigo-600/20 blur-xl opacity-0 group-hover:opacity-100 transition-opacity duration-500 ease-out z-0"></div>

<div class="-m-10 group-hover:opacity-100 transition-opacity duration-700 ease-out z-0 bg-indigo-700/10 opacity-0 rounded-full absolute top-0 right-0 bottom-0 left-0 blur-2xl"></div>

        <!-- Outer Glass Casing -->
        <div class="relative z-10 flex items-center justify-center p-2 rounded-full transition-all duration-300 group-hover:shadow-purple-500/10" style="background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.1) 100%);
                    box-shadow: 
                        inset 0 4px 6px rgba(255, 255, 255, 0.95),
                        inset 0 -5px 8px rgba(0, 0, 0, 0.08),
                        0 12px 24px -6px rgba(0, 0, 0, 0.15),
                        0 4px 8px -4px rgba(0, 0, 0, 0.1),
                        0 0 0 1px rgba(255, 255, 255, 0.4);
                    backdrop-filter: blur(12px);">

    <!-- Inner Colored Pill (The "Liquid") -->
    <div class="flex overflow-hidden transition-all duration-300 rounded-full pt-3.5 pr-12 pb-3.5 pl-12 relative items-center justify-center" style="
background: linear-gradient(180deg,#6366f1 0%,#4f46e5 100%);
box-shadow:
inset 0 2px 4px rgba(255,255,255,0.45),
inset 0 -3px 6px rgba(0,0,0,0.35),
0 6px 14px rgba(79,70,229,0.35);
">

        <!-- Internal specular highlight to give 'liquid/gel' volume -->
        <div class="absolute top-0 left-[15%] right-[15%] h-[40%] bg-gradient-to-b from-white/30 to-transparent rounded-full blur-[1px]">
        </div>

        <!-- Text Content -->
        <span class="text-white text-sm font-medium tracking-widest uppercase drop-shadow-md relative z-20 pointer-events-none">
                    Get Started
                </span>
    </div>
</div>
    </button>
