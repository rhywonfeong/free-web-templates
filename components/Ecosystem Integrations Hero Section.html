<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosystem Integrations - System Module</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>

<body
    class="bg-gradient-to-br from-[#E2E4E9] to-[#CDD0D8] text-[#111827] antialiased min-h-screen flex items-center justify-center p-4 sm:p-8 lg:p-12"
    style="font-family: 'Inter', sans-serif;">

    <main
        class="w-full max-w-7xl rounded-[2rem] bg-[#0E0E10] shadow-[0_40px_80px_-20px_rgba(0,0,0,0.6),_0_0_0_1px_rgba(0,0,0,0.8),_inset_0_1px_0_rgba(255,255,255,0.08)] relative overflow-hidden flex flex-col">

        <!-- Structural Top Rail -->
        <header
            class="h-12 w-full bg-gradient-to-b from-[#18181B] to-[#0E0E10] border-b border-[#27272A] flex items-center justify-between px-6 shadow-[inset_0_1px_0_rgba(255,255,255,0.04)] z-20">
            <div class="flex items-center gap-3">
                <div class="flex gap-1.5">
                    <div
                        class="w-2.5 h-2.5 rounded-full bg-[#27272A] shadow-[inset_0_1px_2px_rgba(0,0,0,0.8),_0_1px_0_rgba(255,255,255,0.05)]">
                    </div>
                    <div
                        class="w-2.5 h-2.5 rounded-full bg-[#27272A] shadow-[inset_0_1px_2px_rgba(0,0,0,0.8),_0_1px_0_rgba(255,255,255,0.05)]">
                    </div>
                </div>
            </div>

            <div
                class="flex items-center gap-3 px-3 py-1 rounded bg-[#050505] shadow-[inset_0_1px_3px_rgba(0,0,0,0.9),_0_1px_0_rgba(255,255,255,0.05)] border border-[#1F1F22]">
                <div
                    class="w-1.5 h-1.5 rounded-full bg-violet-400 shadow-[0_0_8px_rgba(167,139,250,0.45)] animate-pulse">
                </div>
                <span class="text-[10px] text-gray-400 tracking-widest uppercase" style="font-family: 'JetBrains Mono', monospace;">SYS.ROUTING_MODULE</span>
            </div>

            <div class="w-8 flex justify-end">
                <div
                    class="w-2.5 h-2.5 rounded-full bg-[#27272A] shadow-[inset_0_1px_2px_rgba(0,0,0,0.8),_0_1px_0_rgba(255,255,255,0.05)]">
                </div>
            </div>
        </header>

        <!-- Main Interface Split -->
        <div class="flex flex-col lg:flex-row w-full flex-grow relative z-10">

            <!-- Left Column -->
            <section
                class="w-full lg:w-5/12 p-8 sm:p-12 lg:p-16 flex flex-col justify-center border-b lg:border-b-0 lg:border-r border-[#27272A] bg-[radial-gradient(ellipse_at_top_left,_var(--tw-gradient-stops))] from-[#18181B] to-[#0E0E10] relative z-20">

                <div
                    class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-[#141417] border border-[#27272A] shadow-[inset_0_2px_4px_rgba(0,0,0,0.4)] w-fit mb-8">
                    <iconify-icon icon="solar:link-circle-linear" class="text-sm text-violet-400"></iconify-icon>
                    <span class="text-xs font-medium text-gray-300 tracking-wide">Universal Connectors</span>
                </div>

                <h1
                    class="text-3xl sm:text-4xl lg:text-5xl font-medium tracking-tight text-white leading-[1.1] mb-6 drop-shadow-md">
                    Unify your <br> isolated toolchains.
                </h1>

                <p class="text-sm sm:text-base text-gray-400 leading-relaxed mb-10 max-w-md">
                    Establish high-fidelity data pipelines across disparate environments. Our modular integration matrix
                    bonds independent applications into a synchronized, zero-latency network.
                </p>

                <div>
                    <button class="relative group inline-flex items-center justify-center px-6 py-3.5 text-sm font-medium text-violet-400 transition-all rounded-xl focus:outline-none w-fit">
                        <div class="absolute inset-0 rounded-xl bg-gradient-to-b from-[#3F3F46] to-[#18181B] shadow-[0_8px_20px_rgba(0,0,0,0.6),_0_0_0_1px_rgba(0,0,0,0.8)]"></div>
                        <div class="absolute inset-[1.5px] rounded-[10px] bg-gradient-to-b from-[#27272A] to-[#141417] shadow-[inset_0_1px_1px_rgba(255,255,255,0.12)] group-active:shadow-[inset_0_4px_10px_rgba(0,0,0,0.8)] group-active:from-[#18181B] group-active:to-[#0E0E10] transition-all duration-150"></div>
                        <span class="relative z-10 flex items-center gap-2.5 tracking-wide drop-shadow-[0_0_10px_rgba(167,139,250,0.25)] group-active:text-violet-500 group-active:drop-shadow-none transition-all">
                            Initialize Sequence
                            <iconify-icon icon="solar:alt-arrow-right-linear" class="text-base" style="stroke-width: 1.5;"></iconify-icon>
                        </span>
                    </button>
                </div>

            </section>

            <!-- Right Column -->
            <section
                class="w-full lg:w-7/12 bg-[#0A0A0C] relative flex items-center justify-center p-8 sm:p-12 lg:p-20 overflow-hidden min-h-[400px]">

                <!-- Background Structural Guide Rails -->
                <div class="absolute inset-0 opacity-60 pointer-events-none">
                    <div
                        class="absolute left-1/4 top-0 bottom-0 w-px bg-gradient-to-b from-transparent via-[rgba(167,139,250,0.16)] to-transparent">
                    </div>
                    <div
                        class="absolute left-2/4 top-0 bottom-0 w-px bg-gradient-to-b from-transparent via-[rgba(167,139,250,0.16)] to-transparent">
                    </div>
                    <div
                        class="absolute left-3/4 top-0 bottom-0 w-px bg-gradient-to-b from-transparent via-[rgba(167,139,250,0.16)] to-transparent">
                    </div>
                    <div
                        class="absolute top-1/4 left-0 right-0 h-px bg-gradient-to-r from-transparent via-[rgba(167,139,250,0.16)] to-transparent">
                    </div>
                    <div
                        class="absolute top-2/4 left-0 right-0 h-px bg-gradient-to-r from-transparent via-[rgba(167,139,250,0.16)] to-transparent">
                    </div>
                    <div
                        class="absolute top-3/4 left-0 right-0 h-px bg-gradient-to-r from-transparent via-[rgba(167,139,250,0.16)] to-transparent">
                    </div>
                </div>

                <div class="relative w-full max-w-[420px] aspect-square flex items-center justify-center">

                    <!-- Central Core Component -->
                    <div
                        class="absolute z-30 w-24 h-24 rounded-full bg-gradient-to-b from-[#27272A] to-[#141417] shadow-[0_16px_32px_rgba(0,0,0,0.8),_inset_0_2px_1px_rgba(255,255,255,0.08),_0_0_0_1px_rgba(0,0,0,0.6)] flex items-center justify-center">
                        <div
                            class="w-16 h-16 rounded-full bg-[#050505] shadow-[inset_0_4px_12px_rgba(0,0,0,1),_0_1px_0_rgba(255,255,255,0.05)] flex items-center justify-center relative">
                            <div class="absolute inset-2 rounded-full border border-violet-400/25 border-t-violet-400 animate-spin"
                                style="animation-duration: 3s;"></div>
                            <iconify-icon icon="solar:infinity-linear"
                                class="text-2xl text-violet-400 drop-shadow-[0_0_8px_rgba(167,139,250,0.4)]"
                                style="stroke-width: 1.5;"></iconify-icon>
                        </div>
                    </div>

                    <!-- Orbiting Sub-modules -->
                    <div class="grid grid-cols-3 gap-6 sm:gap-8 relative z-20 w-full h-full">

                        <!-- Top Left: Active -->
                        <div class="flex items-start justify-start">
                            <div
                                class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-b from-[#27272A] to-[#18181B] shadow-[0_8px_16px_rgba(0,0,0,0.5),_inset_0_1px_1px_rgba(255,255,255,0.08),_0_0_0_1px_rgba(0,0,0,0.8)] p-[3px]">
                                <div
                                    class="w-full h-full rounded-[13px] bg-[#0A0A0C] shadow-[inset_0_3px_8px_rgba(0,0,0,0.9)] flex items-center justify-center relative">
                                    <div
                                        class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-violet-400 shadow-[0_0_8px_rgba(167,139,250,0.55)]">
                                    </div>
                                    <iconify-icon icon="solar:database-linear"
                                        class="text-xl sm:text-2xl text-white drop-shadow-[0_0_6px_rgba(255,255,255,0.12)]"
                                        style="stroke-width: 1.5;"></iconify-icon>
                                </div>
                            </div>
                        </div>

                        <!-- Top Center: Inactive -->
                        <div class="flex items-start justify-center">
                            <div
                                class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-b from-[#202024] to-[#141417] shadow-[0_4px_8px_rgba(0,0,0,0.5),_inset_0_1px_1px_rgba(255,255,255,0.04),_0_0_0_1px_rgba(0,0,0,0.8)] p-[3px] opacity-80">
                                <div
                                    class="w-full h-full rounded-[13px] bg-[#0E0E10] shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)] flex items-center justify-center relative">
                                    <div
                                        class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-[#3F3F46] shadow-[inset_0_1px_2px_rgba(0,0,0,0.8)]">
                                    </div>
                                    <iconify-icon icon="solar:cloud-linear" class="text-xl sm:text-2xl text-[#52525B]"
                                        style="stroke-width: 1.5;"></iconify-icon>
                                </div>
                            </div>
                        </div>

                        <!-- Top Right: Active same as TL -->
                        <div class="flex items-start justify-end">
                            <div
                                class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-b from-[#27272A] to-[#18181B] shadow-[0_8px_16px_rgba(0,0,0,0.5),_inset_0_1px_1px_rgba(255,255,255,0.08),_0_0_0_1px_rgba(0,0,0,0.8)] p-[3px]">
                                <div
                                    class="w-full h-full rounded-[13px] bg-[#0A0A0C] shadow-[inset_0_3px_8px_rgba(0,0,0,0.9)] flex items-center justify-center relative">
                                    <div
                                        class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-violet-400 shadow-[0_0_8px_rgba(167,139,250,0.55)]">
                                    </div>
                                    <iconify-icon icon="solar:database-linear"
                                        class="text-xl sm:text-2xl text-white drop-shadow-[0_0_6px_rgba(255,255,255,0.12)]"
                                        style="stroke-width: 1.5;"></iconify-icon>
                                </div>
                            </div>
                        </div>

                        <!-- Mid Left: Inactive same as top center -->
                        <div class="flex items-center justify-start">
                            <div
                                class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-b from-[#202024] to-[#141417] shadow-[0_4px_8px_rgba(0,0,0,0.5),_inset_0_1px_1px_rgba(255,255,255,0.04),_0_0_0_1px_rgba(0,0,0,0.8)] p-[3px] opacity-80">
                                <div
                                    class="w-full h-full rounded-[13px] bg-[#0E0E10] shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)] flex items-center justify-center relative">
                                    <div
                                        class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-[#3F3F46] shadow-[inset_0_1px_2px_rgba(0,0,0,0.8)]">
                                    </div>
                                    <iconify-icon icon="solar:cloud-linear" class="text-xl sm:text-2xl text-[#52525B]"
                                        style="stroke-width: 1.5;"></iconify-icon>
                                </div>
                            </div>
                        </div>

                        <!-- Mid Center -->
                        <div class="flex items-center justify-center pointer-events-none"></div>

                        <!-- Mid Right: Inactive same as top center -->
                        <div class="flex items-center justify-end">
                            <div
                                class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-b from-[#202024] to-[#141417] shadow-[0_4px_8px_rgba(0,0,0,0.5),_inset_0_1px_1px_rgba(255,255,255,0.04),_0_0_0_1px_rgba(0,0,0,0.8)] p-[3px] opacity-80">
                                <div
                                    class="w-full h-full rounded-[13px] bg-[#0E0E10] shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)] flex items-center justify-center relative">
                                    <div
                                        class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-[#3F3F46] shadow-[inset_0_1px_2px_rgba(0,0,0,0.8)]">
                                    </div>
                                    <iconify-icon icon="solar:cloud-linear" class="text-xl sm:text-2xl text-[#52525B]"
                                        style="stroke-width: 1.5;"></iconify-icon>
                                </div>
                            </div>
                        </div>

                        <!-- Bottom Left: Active same as TL -->
                        <div class="flex items-end justify-start">
                            <div
                                class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-b from-[#27272A] to-[#18181B] shadow-[0_8px_16px_rgba(0,0,0,0.5),_inset_0_1px_1px_rgba(255,255,255,0.08),_0_0_0_1px_rgba(0,0,0,0.8)] p-[3px]">
                                <div
                                    class="w-full h-full rounded-[13px] bg-[#0A0A0C] shadow-[inset_0_3px_8px_rgba(0,0,0,0.9)] flex items-center justify-center relative">
                                    <div
                                        class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-violet-400 shadow-[0_0_8px_rgba(167,139,250,0.55)]">
                                    </div>
                                    <iconify-icon icon="solar:database-linear"
                                        class="text-xl sm:text-2xl text-white drop-shadow-[0_0_6px_rgba(255,255,255,0.12)]"
                                        style="stroke-width: 1.5;"></iconify-icon>
                                </div>
                            </div>
                        </div>

                        <!-- Bottom Center: Inactive same as top center -->
                        <div class="flex items-end justify-center">
                            <div
                                class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-b from-[#202024] to-[#141417] shadow-[0_4px_8px_rgba(0,0,0,0.5),_inset_0_1px_1px_rgba(255,255,255,0.04),_0_0_0_1px_rgba(0,0,0,0.8)] p-[3px] opacity-80">
                                <div
                                    class="w-full h-full rounded-[13px] bg-[#0E0E10] shadow-[inset_0_2px_4px_rgba(0,0,0,0.6)] flex items-center justify-center relative">
                                    <div
                                        class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-[#3F3F46] shadow-[inset_0_1px_2px_rgba(0,0,0,0.8)]">
                                    </div>
                                    <iconify-icon icon="solar:cloud-linear" class="text-xl sm:text-2xl text-[#52525B]"
                                        style="stroke-width: 1.5;"></iconify-icon>
                                </div>
                            </div>
                        </div>

                        <!-- Bottom Right: Active same as TL -->
                        <div class="flex items-end justify-end">
                            <div
                                class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-b from-[#27272A] to-[#18181B] shadow-[0_8px_16px_rgba(0,0,0,0.5),_inset_0_1px_1px_rgba(255,255,255,0.08),_0_0_0_1px_rgba(0,0,0,0.8)] p-[3px]">
                                <div
                                    class="w-full h-full rounded-[13px] bg-[#0A0A0C] shadow-[inset_0_3px_8px_rgba(0,0,0,0.9)] flex items-center justify-center relative">
                                    <div
                                        class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-violet-400 shadow-[0_0_8px_rgba(167,139,250,0.55)]">
                                    </div>
                                    <iconify-icon icon="solar:database-linear"
                                        class="text-xl sm:text-2xl text-white drop-shadow-[0_0_6px_rgba(255,255,255,0.12)]"
                                        style="stroke-width: 1.5;"></iconify-icon>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </section>
        </div>

        <!-- Bottom System Rail -->
        <footer
            class="h-10 w-full bg-[#0A0A0C] border-t border-[#1F1F22] flex items-center justify-between px-6 z-20 relative">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2">
                    <div class="w-1.5 h-1.5 rounded-full bg-violet-400"></div>
                    <span class="text-[10px] text-gray-500 tracking-wide uppercase" style="font-family: 'JetBrains Mono', monospace;">Uplink Secure</span>
                </div>
            </div>
            <div class="h-1 w-16 rounded-full bg-[#1F1F22] shadow-[inset_0_1px_2px_rgba(0,0,0,0.8)]"></div>
        </footer>

    </main>

</body>

</html>
