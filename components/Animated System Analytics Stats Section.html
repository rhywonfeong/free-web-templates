<section
    class="bg-[#050505] text-white min-h-screen overflow-x-hidden selection:bg-[#4ade80]/30 selection:text-white relative font-sans">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @keyframes glitchFlicker {

            0%,
            96%,
            98%,
            100% {
                opacity: 1;
                transform: translate(0, 0);
                text-shadow: none;
                filter: none;
            }

            97% {
                opacity: 0.8;
                transform: translate(-2px, 1px);
                text-shadow: 2px 0 0 rgba(74, 222, 128, 0.4), -2px 0 0 rgba(255, 0, 0, 0.3);
                filter: brightness(1.2);
            }

            99% {
                opacity: 0.9;
                transform: translate(2px, -1px);
                text-shadow: -2px 0 0 rgba(74, 222, 128, 0.4);
            }
        }

        .animate-glitch {
            animation: glitchFlicker 8s infinite;
        }

        .bg-vignette {
            background: radial-gradient(circle at center, transparent 30%, #050505 100%);
        }

        .mask-overflow {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0% 100%);
        }

        .edge-blur-mask {
            mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
        }

        @keyframes pulseGlow {

            0%,
            100% {
                opacity: 0.4;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.5);
            }
        }

        @keyframes beamMoveY {
            0% {
                top: -10%;
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                top: 110%;
                opacity: 0;
            }
        }

        .animate-pulse-slow {
            animation: pulseGlow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .animate-beam-y {
            animation: beamMoveY 4s linear infinite;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        system: { bg: '#050505', line: 'rgba(255, 255, 255, 0.08)', neon: '#4ade80', neonDim: 'rgba(74, 222, 128, 0.15)', textMuted: '#8a8a8a' }
                    }
                }
            }
        }
    </script>

    <canvas id="particleCanvas" class="fixed inset-0 z-0 pointer-events-none opacity-50"></canvas>
    <div
        class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-system-neonDim rounded-full blur-[150px] pointer-events-none z-0 opacity-40 mix-blend-screen">
    </div>
    <div class="fixed inset-0 bg-vignette z-0 pointer-events-none"></div>

    <main class="relative z-10 w-full min-h-screen flex flex-col items-center justify-center py-24">
        <header class="mb-24 text-center">
            <h1
                class="text-xs font-semibold tracking-[0.3em] uppercase text-system-textMuted flex items-center justify-center gap-3">
                <iconify-icon icon="solar:cpu-linear" class="text-system-neon text-base"></iconify-icon>
                <div class="flex gap-2">
                    <span class="inline-block mask-overflow"><span class="inline-block word translate-y-full">SYSTEM</span></span>
                    <span class="inline-block mask-overflow"><span class="inline-block word translate-y-full">ANALYTICS</span></span>
                    <span class="inline-block mask-overflow"><span class="inline-block word translate-y-full">CORE</span></span>
                </div>
            </h1>
        </header>

        <section class="relative w-full max-w-5xl h-[800px] md:h-[600px] mx-auto edge-blur-mask" id="stats-container">
            <div class="absolute inset-0 z-0">
                <div
                    class="absolute left-1/2 top-[10%] bottom-[10%] w-px bg-system-line -translate-x-1/2 origin-top line-v">
                    <div
                        class="absolute top-0 left-[-1px] w-[3px] h-[150px] bg-gradient-to-b from-transparent via-system-neon to-transparent opacity-100 animate-beam-y blur-[1px]">
                    </div>
                </div>
                <div class="absolute right-1/2 top-[42%] w-[40%] h-px bg-system-line origin-right line-h-l"></div>
                <div class="absolute left-1/2 top-[58%] w-[40%] h-px bg-system-line origin-left line-h-r"></div>
            </div>

            <div class="absolute inset-0 z-10 pointer-events-none">
                <div class="absolute right-1/2 top-[42%] w-0 h-0 flex items-center justify-center node-group">
                    <div
                        class="absolute w-[150px] h-px bg-gradient-to-r from-transparent via-system-neon/80 to-transparent blur-[2px]">
                    </div>
                    <div
                        class="absolute w-px h-[100px] bg-gradient-to-b from-transparent via-system-neon/80 to-transparent blur-[2px]">
                    </div>
                    <div
                        class="w-1.5 h-1.5 bg-white rounded-full shadow-[0_0_12px_4px_rgba(74,222,128,0.7)] animate-pulse-slow">
                    </div>
                </div>
                <div class="absolute left-1/2 top-[58%] w-0 h-0 flex items-center justify-center node-group"
                    style="animation-delay: -2s;">
                    <div
                        class="absolute w-[150px] h-px bg-gradient-to-r from-transparent via-system-neon/80 to-transparent blur-[2px]">
                    </div>
                    <div
                        class="absolute w-px h-[100px] bg-gradient-to-b from-transparent via-system-neon/80 to-transparent blur-[2px]">
                    </div>
                    <div class="w-1.5 h-1.5 bg-white rounded-full shadow-[0_0_12px_4px_rgba(74,222,128,0.7)] animate-pulse-slow"
                        style="animation-delay: -1s;"></div>
                </div>
            </div>

            <div
                class="absolute bottom-[58%] right-1/2 w-full max-w-[320px] p-6 pb-10 flex flex-col justify-end group transition-transform duration-500 hover:scale-[1.02] cursor-default z-20">
                <div class="flex flex-col items-start pl-4 md:pl-12 opacity-0 stat-content">
                    <div class="flex items-baseline gap-0.5">
                        <span class="text-5xl font-medium tracking-tight text-white animate-glitch" data-target="1.2" data-prefix="$">0</span><span class="text-5xl font-medium tracking-tight text-system-neon">M+</span>
                    </div>
                    <p
                        class="text-sm font-normal text-system-textMuted mt-3 max-w-[200px] leading-relaxed group-hover:text-neutral-300">
                        Processed through the system</p>
                </div>
            </div>

            <div
                class="absolute bottom-[42%] left-1/2 w-full max-w-[320px] p-6 pb-10 flex flex-col justify-end group transition-transform duration-500 hover:scale-[1.02] cursor-default z-20">
                <div class="flex flex-col items-start pl-8 md:pl-16 opacity-0 stat-content">
                    <div class="flex items-baseline gap-0.5">
                        <span class="text-5xl font-medium tracking-tight text-white animate-glitch" data-target="28" style="animation-delay: -3s;">0</span><span class="text-5xl font-medium tracking-tight text-system-neon">K+</span>
                    </div>
                    <p
                        class="text-sm font-normal text-system-textMuted mt-3 max-w-[200px] leading-relaxed group-hover:text-neutral-300">
                        Active signal nodes</p>
                </div>
            </div>

            <div
                class="absolute top-[42%] right-1/2 w-full max-w-[320px] p-6 pt-10 flex flex-col justify-start group transition-transform duration-500 hover:scale-[1.02] cursor-default z-20">
                <div class="flex flex-col items-start pl-4 md:pl-12 opacity-0 stat-content">
                    <div class="flex items-baseline gap-0.5">
                        <span class="text-5xl font-medium tracking-tight text-white animate-glitch" data-target="190" style="animation-delay: -5s;">0</span><span class="text-5xl font-medium tracking-tight text-system-neon">+</span>
                    </div>
                    <p
                        class="text-sm font-normal text-system-textMuted mt-3 max-w-[200px] leading-relaxed group-hover:text-neutral-300">
                        Connected regions globally</p>
                </div>
            </div>

            <div
                class="absolute top-[58%] left-1/2 w-full max-w-[320px] p-6 pt-10 flex flex-col justify-start group transition-transform duration-500 hover:scale-[1.02] cursor-default z-20">
                <div class="flex flex-col items-start pl-8 md:pl-16 opacity-0 stat-content">
                    <div class="flex items-baseline gap-0.5">
                        <span class="text-5xl font-medium tracking-tight text-white animate-glitch" data-target="12" style="animation-delay: -7s;">0</span><span class="text-5xl font-medium tracking-tight text-system-neon">ms</span>
                    </div>
                    <p
                        class="text-sm font-normal text-system-textMuted mt-3 max-w-[200px] leading-relaxed group-hover:text-neutral-300">
                        Average execution latency</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            gsap.registerPlugin(ScrollTrigger);
            gsap.to('.word', { y: '0%', duration: 1, ease: 'power3.out', stagger: 0.15, delay: 0.2 });
            
            const tl = gsap.timeline({ scrollTrigger: { trigger: '#stats-container', start: 'top 70%' } });
            tl.fromTo('.line-v', { scaleY: 0 }, { scaleY: 1, duration: 1.2, ease: 'expo.inOut' })
              .fromTo(['.line-h-l', '.line-h-r'], { scaleX: 0 }, { scaleX: 1, duration: 1, ease: 'expo.inOut', stagger: 0.1 }, '-=0.6')
              .fromTo('.node-group', { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.8, ease: 'back.out(1.5)', stagger: 0.2 }, '-=0.4')
              .to('.stat-content', { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out', stagger: 0.1, onStart: initCounters }, '-=0.2');

            function initCounters() {
                document.querySelectorAll('span[data-target]').forEach(counter => {
                    const target = parseFloat(counter.getAttribute('data-target'));
                    const prefix = counter.getAttribute('data-prefix') || '';
                    const hasDecimals = target % 1 !== 0;
                    let current = 0;
                    const timer = setInterval(() => {
                        current += target / 60;
                        if (current >= target) { current = target; clearInterval(timer); }
                        counter.innerText = prefix + (hasDecimals ? current.toFixed(1) : Math.floor(current));
                    }, 1000/60);
                });
            }

            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let w, h, particles = [];
            const resize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
            window.addEventListener('resize', resize); resize();
            
            class P {
                constructor() { this.reset(); this.y = Math.random() * h; }
                reset() { this.x = Math.random() * w; this.y = h + 20; this.s = Math.random() * 1.5 + 0.5; this.vy = -(Math.random() * 0.3 + 0.1); this.o = Math.random() * 0.5; this.d = Math.random() * 100; }
                up(t) { this.y += this.vy; this.x += Math.sin(t * 0.001 + this.d) * 0.2; if (this.y < -10) this.reset(); }
                dr() { ctx.fillStyle = `rgba(74, 222, 128, ${this.o})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, Math.PI * 2); ctx.fill(); }
            }
            for (let i = 0; i < 50; i++) particles.push(new P());
            const anim = (t) => { ctx.clearRect(0, 0, w, h); particles.forEach(p => { p.up(t); p.dr(); }); requestAnimationFrame(anim); };
            anim(0);
        });
    </script>
</section>
