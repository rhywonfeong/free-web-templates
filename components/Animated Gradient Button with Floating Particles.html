<div class="inline-block">
  <style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap');
    
    .animated-button {
      cursor: pointer;
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: all 0.25s ease;
      background: radial-gradient(65.28% 65.28% at 50% 100%, rgba(99, 102, 241, 0.8) 0%, rgba(99, 102, 241, 0) 100%), linear-gradient(0deg, #4f46e5, #4f46e5);
      border-radius: 9999px;
      border: none;
      outline: none;
      padding: 8px 18px;
      min-height: 36px;
      min-width: 90px;
    }

    .animated-button::before,
    .animated-button::after {
      content: "";
      position: absolute;
      transition: all 0.5s ease-in-out;
      z-index: 0;
    }

    .animated-button::before {
      inset: 1px;
      background: linear-gradient(177.95deg, rgba(255, 255, 255, 0.19) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 9999px;
    }

    .animated-button::after {
      inset: 2px;
      background: radial-gradient(65.28% 65.28% at 50% 100%, rgba(99, 102, 241, 0.8) 0%, rgba(99, 102, 241, 0) 100%), linear-gradient(0deg, #4f46e5, #4f46e5);
      border-radius: 9999px;
    }

    .animated-button:active {
      transform: scale(0.95);
    }

    .animated-button-points {
      overflow: hidden;
      width: 100%;
      height: 100%;
      pointer-events: none;
      position: absolute;
      z-index: 1;
    }

    .animated-button-points .point {
      bottom: -8px;
      position: absolute;
      animation: floating-particles infinite ease-in-out;
      pointer-events: none;
      width: 1.5px;
      height: 1.5px;
      background-color: #fff;
      border-radius: 9999px;
    }

    @keyframes floating-particles {
      0% {
        transform: translateY(0);
      }
      85% {
        opacity: 0;
      }
      100% {
        transform: translateY(-40px);
        opacity: 0;
      }
    }

    .animated-button-points .point:nth-child(1) {
      left: 10%;
      opacity: 1;
      animation-duration: 2.35s;
      animation-delay: 0.2s;
    }

    .animated-button-points .point:nth-child(2) {
      left: 30%;
      opacity: 0.7;
      animation-duration: 2.5s;
      animation-delay: 0.5s;
    }

    .animated-button-points .point:nth-child(3) {
      left: 25%;
      opacity: 0.8;
      animation-duration: 2.2s;
      animation-delay: 0.1s;
    }

    .animated-button-points .point:nth-child(4) {
      left: 44%;
      opacity: 0.6;
      animation-duration: 2.05s;
    }

    .animated-button-points .point:nth-child(5) {
      left: 50%;
      opacity: 1;
      animation-duration: 1.9s;
    }

    .animated-button-points .point:nth-child(6) {
      left: 75%;
      opacity: 0.5;
      animation-duration: 1.5s;
      animation-delay: 1.5s;
    }

    .animated-button-points .point:nth-child(7) {
      left: 88%;
      opacity: 0.9;
      animation-duration: 2.2s;
      animation-delay: 0.2s;
    }

    .animated-button-points .point:nth-child(8) {
      left: 58%;
      opacity: 0.8;
      animation-duration: 2.25s;
      animation-delay: 0.2s;
    }

    .animated-button-points .point:nth-child(9) {
      left: 98%;
      opacity: 0.6;
      animation-duration: 2.6s;
      animation-delay: 0.1s;
    }

    .animated-button-points .point:nth-child(10) {
      left: 65%;
      opacity: 1;
      animation-duration: 2.5s;
      animation-delay: 0.2s;
    }

    .animated-button-inner {
      z-index: 2;
      gap: 5px;
      position: relative;
      width: 100%;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      transition: color 0.2s ease-in-out;
      font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif;
    }

    .animated-button-inner svg.icon {
      width: 16px;
      height: 16px;
      transition: transform 0.3s ease;
      stroke: white;
      fill: none;
    }

    .animated-button:hover svg.icon {
      transform: translateX(2px);
    }

    .animated-button:hover svg.icon path {
      animation: dash-animation 0.8s linear forwards;
    }

    @keyframes dash-animation {
      0% {
        stroke-dasharray: 0, 20;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 10, 10;
        stroke-dashoffset: -5;
      }
      100% {
        stroke-dasharray: 20, 0;
        stroke-dashoffset: -10;
      }
    }</style>
  <button type="button" class="animated-button">
    <div class="animated-button-points">
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
      <i class="point"></i>
    </div>
    <span class="animated-button-inner">
      <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
        <path d="M5 12h14"></path>
        <path d="m12 5 7 7-7 7"></path>
      </svg>
    </span>
  </button>
</div>
