<body class="bg-[#F8F6F1] font-sans text-neutral-900 antialiased min-h-screen flex flex-col overflow-x-hidden selection:bg-[#F25F2E] selection:text-white">

    <!-- Global Background Wrapper -->

        </div>

    <!-- Main Content Layer -->
    <div class="relative z-10 flex flex-col min-h-screen w-full max-w-[1920px] mx-auto">

        <!-- Navigation -->
        <header class="w-full px-6 lg:px-12 py-8 flex justify-between items-center">
            
            <!-- Brand & Left Nav -->
            <div class="flex items-center gap-8 lg:gap-12">

                <a href="#" class="text-xl font-semibold tracking-tight text-neutral-900 uppercase">Zenith</a>
                
                <!-- Left Nav -->
                <nav class="hidden lg:flex items-center space-x-8 text-sm font-normal text-neutral-800">

                    <a href="#" class="hover:text-[#F25F2E] transition-colors duration-300">Challenges</a>
                    <a href="#" class="hover:text-[#F25F2E] transition-colors duration-300">Community</a>
                    <a href="#" class="hover:text-[#F25F2E] transition-colors duration-300">Memberships</a>
                </nav>
            </div>

            <!-- Right Nav -->
            <div class="flex items-center gap-6">
                <a href="#" class="hidden md:block text-sm font-normal text-neutral-800 hover:text-[#F25F2E] transition-colors duration-300">Schedule call</a>
                <div class="hidden md:block h-4 w-[1px] bg-neutral-300"></div>
                <a href="#" class="hidden md:block text-sm font-normal text-neutral-800 hover:text-[#F25F2E] transition-colors duration-300">Sign in</a>
                <a href="#" class="bg-[#F25F2E] text-white text-sm font-normal rounded-full px-6 py-2.5 hover:bg-[#d94f24] transition-all duration-300 transform hover:scale-105 shadow-sm">Join now</a>
            </div>
        </header>

        <!-- Hero Section -->
        <main class="flex-1 w-full px-6 lg:px-12 grid grid-cols-1 lg:grid-cols-12 relative pb-12">
            
            <!-- Left Typography Column -->
            <div class="col-span-1 lg:col-span-8 flex flex-col pt-[5vh] lg:pt-[8vh] z-20 pointer-events-none">
                <div class="pointer-events-auto flex flex-col">
                    <h1 class="text-neutral-900 font-semibold leading-[0.85] tracking-[-0.04em] uppercase transition-all duration-1000 ease-[cubic-bezier(0.16,1,0.3,1)] opacity-0 translate-y-16 load-anim origin-left" style="font-size: clamp(4rem, 11vw, 13rem); transition-delay: 100ms;">

                    </h1>
                    <h1 class="text-[#F25F2E] font-semibold leading-[0.85] tracking-[-0.04em] uppercase transition-all duration-1000 ease-[cubic-bezier(0.16,1,0.3,1)] opacity-0 translate-y-16 load-anim origin-left pl-[12%]" style="font-size: clamp(4rem, 11vw, 13rem); transition-delay: 250ms;">
                        energy
                    </h1>
                    <h1 class="text-neutral-900 font-semibold leading-[0.85] tracking-[-0.04em] uppercase transition-all duration-1000 ease-[cubic-bezier(0.16,1,0.3,1)] opacity-0 translate-y-16 load-anim origin-left mix-blend-normal" style="font-size: clamp(4rem, 11vw, 13rem); transition-delay: 400ms;">

                </div>
            </div>

            <!-- Right Info Panel -->
            <div class="col-span-1 lg:col-span-4 lg:border-l border-neutral-300/70 pt-[8vh] lg:pl-12 z-20 pointer-events-auto flex flex-col mt-12 lg:mt-0">
                
                <!-- Tabs -->
                <div class="flex gap-8 text-sm font-normal text-neutral-800 mb-12 transition-all duration-1000 ease-out opacity-0 translate-x-8 load-anim" style="transition-delay: 500ms;">

                <!-- Stats & Avatars -->

                    <div class="flex -space-x-3">

                        <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/77415a2e-dcbc-4748-a29d-fced4821881a_1600w.jpg" alt="Member" class="w-10 h-10 rounded-full ring-2 ring-[#F8F6F1] object-cover grayscale hover:grayscale-0 transition-all duration-300 cursor-pointer" />
                        <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/c92852bb-a510-405a-85ab-ffa0fde136a4_1600w.jpg" alt="Member" class="w-10 h-10 rounded-full ring-2 ring-[#F8F6F1] object-cover grayscale hover:grayscale-0 transition-all duration-300 cursor-pointer" />
                    </div>
                    <span class="text-2xl font-semibold tracking-tight text-neutral-900">+42k</span>
                </div>

                <!-- Description -->
                <p class="text-neutral-600 font-normal leading-relaxed text-sm max-w-[18rem] transition-all duration-1000 ease-out opacity-0 translate-x-8 load-anim" style="transition-delay: 800ms;">
                    Embark on a transformative journey. Zenith provides the guidance and community you need to unlock your physical potential and achieve profound mental clarity.
                </p>

            </div>
        </main>
    </div>

    <!-- Scripts for Animations -->
    <script>
        // --- 1. Load Animations ---
        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const elements = document.querySelectorAll('.load-anim');
                elements.forEach(el => {
                    el.classList.remove('opacity-0', 'translate-y-16', 'translate-x-8');
                    el.classList.add('opacity-100', 'translate-y-0', 'translate-x-0');
                });
            }, 50);
        });

        // --- 2. WebGL Kinetic Animation ---
        const canvas = document.getElementById('kinetic-canvas');
        const gl = canvas.getContext('webgl');
        
        const pid = gl.createProgram();
        function shader(type, source) {
            const s = gl.createShader(type);
            gl.shaderSource(s, source);
            gl.compileShader(s);
            gl.attachShader(pid, s);
        }

        // Minimal Vertex Shader
        shader(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}');
        
        // Fluid Kinetic Fragment Shader
        shader(gl.FRAGMENT_SHADER, `
            precision highp float;
            uniform vec2 r;
            uniform float t;
            uniform vec2 m;
            
            void main() {
                vec2 uv = gl_FragCoord.xy / r.xy;
                // Fix aspect ratio for consistent pattern
                vec2 p = uv;
                p.x *= r.x / r.y;
                p *= 3.0;
                
                // Track mouse
                vec2 mp = m / r.xy;
                mp.x *= r.x / r.y;
                mp.y = 1.0 - mp.y; // flip Y for WebGL
                mp *= 3.0;
                
                // Mouse interaction force
                float dist = distance(p, mp);
                float force = exp(-dist * 1.5);
                p += force * 0.3 * vec2(cos(t), sin(t));

                // Domain warping
                for(float i=1.0; i<6.0; i++){
                    p.x += 0.5/i * cos(i*p.y + t*0.3);
                    p.y += 0.5/i * sin(i*p.x + t*0.3);
                }
                
                // Output grayscale fluid which multiplies cleanly with the background color
                float f = cos(p.x + p.y);
                vec3 col = vec3(f * 0.5 + 0.5);
                
                gl_FragColor = vec4(col, 1.0);
            }
        `);

        gl.linkProgram(pid);
        gl.useProgram(pid);

        // Quad covering the whole screen
        const array = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
        const buffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, array, gl.STATIC_DRAW);

        const pLoc = gl.getAttribLocation(pid, 'p');
        gl.enableVertexAttribArray(pLoc);
        gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

        const rLoc = gl.getUniformLocation(pid, 'r');
        const tLoc = gl.getUniformLocation(pid, 't');
        const mLoc = gl.getUniformLocation(pid, 'm');

        let mx = -1000, my = -1000;
        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            if(e.clientY > rect.top && e.clientY < rect.bottom) {
                mx = e.clientX - rect.left;
                my = e.clientY - rect.top;
            } else {
                mx = -1000;
                my = -1000;
            }
        });

        function animate(time) {
            // Auto-resize canvas
            if(canvas.width !== canvas.offsetWidth || canvas.height !== canvas.offsetHeight) {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
            
            // Pass uniforms
            gl.uniform2f(rLoc, canvas.width, canvas.height);
            gl.uniform1f(tLoc, time * 0.001);
            gl.uniform2f(mLoc, mx, my);
            
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(animate);
        }
        
        requestAnimationFrame(animate);
    </script>
</body>
</html>
