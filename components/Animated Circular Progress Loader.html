<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Component</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>

<body
    class="min-h-screen bg-[#030614] flex items-center justify-center overflow-hidden relative font-sans antialiased text-white selection:bg-cyan-500/30">

    <!-- Ambient Background Glow -->
    <div
        class="absolute top-[-20%] left-[-10%] w-[60vw] h-[60vw] rounded-full bg-[#1e3a8a]/20 blur-[120px] pointer-events-none">
    </div>
    <div
        class="absolute bottom-[-20%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-[#3b0764]/20 blur-[100px] pointer-events-none">
    </div>

    <!-- Main Component Wrapper -->
    <div class="relative w-[340px] h-[340px] sm:w-[460px] sm:h-[460px] flex items-center justify-center">

        <!-- Outer Animated Rings (SVG) -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none opacity-90" viewBox="0 0 460 460" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <!-- Ring 1 (Outermost Thin Blue) -->
            <circle cx="230" cy="230" r="220" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="150 30 50 40 200 20"
                stroke-linecap="round" class="animate-[spin_40s_linear_infinite] origin-center" />

            <!-- Ring 2 (Purple Dashed) -->
            <circle cx="230" cy="230" r="200" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="30 20 80 30 150 40"
                stroke-linecap="round" class="animate-[spin_25s_linear_infinite_reverse] origin-center opacity-80" />

            <!-- Ring 3 (Cyan Segments) -->
            <circle cx="230" cy="230" r="180" stroke="#06b6d4" stroke-width="2"
                stroke-dasharray="5 15 40 20 10 10 100 30" stroke-linecap="round"
                class="animate-[spin_20s_linear_infinite] origin-center" />

            <!-- Ring 4 (Inner Blue Fine Dashes) -->
            <circle cx="230" cy="230" r="165" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="80 30 20 20"
                stroke-linecap="round" class="animate-[spin_35s_linear_infinite_reverse] origin-center opacity-70" />
        </svg>

        <!-- Inner Gray Circle Container -->
        <div id="gray-circle"
            class="absolute w-[240px] h-[240px] sm:w-[290px] sm:h-[290px] rounded-full bg-white/[0.12] backdrop-blur-md shadow-[0_0_60px_rgba(0,0,0,0.4)] border border-white/5 flex flex-col items-center justify-center z-10 transition-all duration-1000 ease-out scale-90 opacity-0"
            style="transform: scale(0.9); opacity: 0;">

            <!-- Orange Arc (SVG Overlay) -->
            <!-- Rotated to start from bottom-left (-135deg visually places top at bottom-left) -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none -rotate-[135deg]" viewBox="0 0 290 290"
                fill="none">
                <circle id="orange-arc" cx="145" cy="145" r="136" stroke="#f97316" stroke-width="5"
                    stroke-linecap="round"
                    style="stroke-dasharray: 854.5; stroke-dashoffset: 854.5; transition: stroke-dashoffset 2s cubic-bezier(0.34, 1.56, 0.64, 1);" />
            </svg>

            <!-- Inner Content Area -->
            <div class="relative z-20 flex flex-col items-center justify-center w-full mt-2">

                <!-- Percentage Text -->
                <span id="percent-text" class="text-6xl sm:text-[72px] leading-none font-medium tracking-tight text-white mb-4 drop-shadow-sm">0%</span>

                <!-- Horizontal Progress Bar Wrapper -->
                <div
                    class="relative w-40 sm:w-48 h-3.5 rounded-full border border-gray-400/40 bg-[#0f1423]/60 p-[2px] mb-3 flex items-center shadow-inner">

                    <!-- Left Burst Particles -->
                    <div class="absolute -left-7 top-1/2 -translate-y-1/2 w-6 h-6 pointer-events-none">
                        <div class="absolute top-1 left-3 w-1.5 h-[1.5px] rounded-full bg-cyan-400 rotate-45 animate-pulse"
                            style="animation-duration: 1.1s;"></div>
                        <div class="absolute top-3 left-1 w-2.5 h-[2px] rounded-full bg-orange-400 -rotate-12 animate-pulse"
                            style="animation-duration: 1.5s; animation-delay: 0.2s;"></div>
                        <div class="absolute top-5 left-3 w-1.5 h-[1.5px] rounded-full bg-cyan-400 -rotate-45 animate-pulse"
                            style="animation-duration: 0.9s; animation-delay: 0.5s;"></div>
                        <div class="absolute top-2 left-0 w-1 h-[1px] rounded-full bg-orange-300 rotate-[30deg] animate-pulse"
                            style="animation-duration: 1.3s; animation-delay: 0.7s;"></div>
                    </div>

                    <!-- Right Burst Particles -->
                    <div class="absolute -right-7 top-1/2 -translate-y-1/2 w-6 h-6 pointer-events-none">
                        <div class="absolute top-1 right-3 w-1.5 h-[1.5px] rounded-full bg-cyan-400 -rotate-45 animate-pulse"
                            style="animation-duration: 1.2s; animation-delay: 0.1s;"></div>
                        <div class="absolute top-3 right-1 w-2.5 h-[2px] rounded-full bg-orange-400 rotate-12 animate-pulse"
                            style="animation-duration: 1.4s; animation-delay: 0.4s;"></div>
                        <div class="absolute top-5 right-3 w-1.5 h-[1.5px] rounded-full bg-cyan-400 rotate-45 animate-pulse"
                            style="animation-duration: 1s; animation-delay: 0.3s;"></div>
                        <div class="absolute top-4 right-0 w-1 h-[1px] rounded-full bg-orange-300 -rotate-[20deg] animate-pulse"
                            style="animation-duration: 1.6s; animation-delay: 0.6s;"></div>
                    </div>

                    <!-- Bar Fill Container -->
                    <div id="h-bar"
                        class="h-full rounded-full overflow-hidden w-0 relative transition-all duration-2000 ease-out shadow-[0_0_10px_rgba(249,115,22,0.3)]"
                        style="width: 0%;">
                        <!-- Striped Animated Background -->
                        <div id="stripe-bg" class="absolute inset-0 w-[200%] h-full opacity-90"
                            style="background-image: repeating-linear-gradient(-45deg, #f97316, #f97316 5px, #fb923c 5px, #fb923c 10px);">
                        </div>
                    </div>
                </div>

                <!-- Status Text -->
                <span class="text-xs sm:text-[13px] font-normal text-gray-200 tracking-wide opacity-80 animate-pulse" style="animation-duration: 2s;">Loading Data...</span>
            </div>
        </div>
    </div>

    <!-- Animation Logic Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const elGrayCircle = document.getElementById("gray-circle");
            const elPercent = document.getElementById("percent-text");
            const elArc = document.getElementById("orange-arc");
            const elHBar = document.getElementById("h-bar");
            const elStripe = document.getElementById("stripe-bg");

            // 1. Initial Scale & Fade In
            setTimeout(() => {
                elGrayCircle.style.opacity = "1";
                elGrayCircle.style.transform = "scale(1)";
            }, 150);

            // 2. Value Animations setup
            const targetPercent = 70;
            const durationMs = 2000;
            const fps = 60;
            const totalFrames = (durationMs / 1000) * fps;
            let currentFrame = 0;

            // Arc calculations (Radius 136)
            const arcCircumference = 2 * Math.PI * 136; // Approx 854.5
            elArc.style.strokeDasharray = arcCircumference;
            
            // Start animation after container scales in
            setTimeout(() => {
                const animateProgress = setInterval(() => {
                    currentFrame++;
                    const progressRatio = currentFrame / totalFrames;
                    
                    // Ease out easing function for smooth deceleration
                    const easeOutProgress = 1 - Math.pow(1 - progressRatio, 3);
                    const currentVal = easeOutProgress * targetPercent;

                    if (currentFrame >= totalFrames) {
                        clearInterval(animateProgress);
                        elPercent.innerText = targetPercent + "%";
                        elHBar.style.width = targetPercent + "%";
                        return;
                    }

                    // Update UI elements
                    elPercent.innerText = Math.round(currentVal) + "%";
                    elHBar.style.width = currentVal + "%";

                    // Arc draws approx 35% of the total circle when it reaches 100% data
                    const maxArcCoverage = 0.35; 
                    const currentDrawLength = arcCircumference * maxArcCoverage * (currentVal / targetPercent);
                    elArc.style.strokeDashoffset = arcCircumference - currentDrawLength;

                }, 1000 / fps);
            }, 400);

            // 3. Continuous seamless stripe sliding
            let bgPos = 0;
            setInterval(() => {
                bgPos -= 0.5; // Speed of stripes
                elStripe.style.backgroundPosition = `${bgPos}px 0`;
            }, 16); // Approx 60fps
        });
    </script>
</body>

</html>
