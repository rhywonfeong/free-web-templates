<section class="bg-[#080b11] font-['Inter',sans-serif] antialiased text-white selection:bg-white/20 overflow-x-hidden"
    style="background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px); background-size: 24px 24px;">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">

    <main class="relative flex min-h-screen flex-col items-center justify-center p-4 sm:p-8">

        <!-- Center Floating Card -->
        <div
            class="relative w-full max-w-[24rem] rounded-[2.5rem] border border-white/[0.08] bg-white/[0.02] p-8 shadow-[0_0_80px_-20px_rgba(0,0,0,0.5)] backdrop-blur-3xl">

            <!-- Flight Data Module Wrapper -->
            <div class="relative mb-12 h-28 w-full">
                <!-- Background Glow -->
                <div
                    class="absolute left-1/2 top-1/2 -z-10 h-24 w-48 -translate-x-1/2 -translate-y-1/2 rounded-full bg-slate-400/20 blur-[2.5rem]">
                </div>

                <!-- Layered Card Back -->
                <div class="absolute inset-x-2 -top-2 bottom-2 rounded-2xl border border-white/5 bg-white/[0.01]"></div>

                <!-- Main Flight Card -->
                <div
                    class="absolute inset-x-0 top-0 flex gap-4 rounded-2xl border border-white/[0.12] bg-white/[0.04] p-4 shadow-xl backdrop-blur-md">

                    <!-- Left Column -->
                    <div class="flex flex-1 flex-col justify-between">
                        <div class="space-y-0.5">
                            <div class="text-xs font-medium text-white">CA $950</div>
                            <div class="text-[0.65rem] leading-tight text-white/50">Roundtrip per<br>passenger</div>
                        </div>
                        <div class="mt-3 flex items-center gap-1.5">
                            <!-- Faux Airline Logo -->
                            <div
                                class="flex h-3.5 w-3.5 items-center justify-center rounded-full bg-red-600/90 text-[0.4rem] text-white">
                                ★</div>
                            <span class="text-[0.7rem] font-medium text-white/70">Air Canada</span>
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="flex flex-1 flex-col justify-between text-right">
                        <div class="space-y-0.5">
                            <div class="text-[0.7rem] font-medium text-white">1:15 PM - 4:50 AM</div>
                            <div class="text-[0.65rem] leading-tight text-white/50 mt-1">Montreal (YUL) -<br>Tokyo (NRT)
                            </div>
                        </div>
                        <div class="text-[0.65rem] text-white/50">13:35 Nonstop</div>
                    </div>
                </div>
            </div>

            <!-- Typography Content -->
            <h2 class="mb-4 text-2xl font-medium tracking-tight text-white">
                <span class="text-white/40">Modular Design</span> Systems
            </h2>

            <p class="mb-8 text-sm leading-relaxed text-white/60">
                Explore the art of building scalable, cohesive design systems that streamline UI development and enhance
                team collaboration.
            </p>

            <!-- Action Button -->
            <button class="group inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-4 py-2 text-sm font-medium text-white/80 transition-all hover:bg-white/10 hover:text-white">
                Start course
                <iconify-icon icon="solar:alt-arrow-right-linear" class="text-base text-white/50 transition-colors group-hover:text-white"></iconify-icon>
            </button>

            <!-- Overlapping Circular Performance UI -->
            <div
                class="absolute -bottom-10 -right-10 flex h-48 w-48 items-center justify-center rounded-full bg-[#050505]/80 shadow-[0_20px_40px_-10px_rgba(0,0,0,0.8)] backdrop-blur-xl border border-white/[0.05]">

                <!-- Spinning Text Ring -->
                <svg viewBox="0 0 100 100" class="absolute inset-0 h-full w-full origin-center animate-spin"
                    style="animation-duration: 25s; animation-timing-function: linear;">
                    <path id="textPath" d="M 50, 50 m -44, 0 a 44,44 0 1,1 88,0 a 44,44 0 1,1 -88,0" fill="none"></path>
                    <text class="fill-white/30 text-[0.4rem] font-medium uppercase tracking-[0.2em]">
                        <textPath href="#textPath" startOffset="0">
                            Performance - Performance - Performance -
                        </textPath>
                    </text>
                </svg>

                <!-- Tick Marks Ring -->
                <svg viewBox="0 0 100 100" class="absolute inset-0 h-full w-full">
                    <!-- Adjusted dasharray to create thin inner-pointing ticks -->
                    <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"
                        stroke-dasharray="1 3.9"></circle>
                </svg>

                <!-- Animated Progress Bar (SVG) -->
                <svg viewBox="0 0 100 100" class="absolute inset-0 h-full w-full -rotate-90 transform">
                    <!-- Track -->
                    <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5">
                    </circle>
                    <!-- Fill (Calculated circumference is ~238.7. 98% complete leaves offset of ~4.7) -->
                    <circle cx="50" cy="50" r="38" fill="none" stroke="#3b82f6" stroke-width="1.5"
                        stroke-linecap="round" stroke-dasharray="238.7" stroke-dashoffset="238.7">
                        <animate attributeName="stroke-dashoffset" from="238.7" to="4.7" dur="1.5s" fill="freeze"
                            calcMode="spline" keySplines="0.4 0 0.2 1"></animate>
                    </circle>
                </svg>

                <!-- Center Value display -->
                <div
                    class="relative z-10 flex h-[4.5rem] w-[4.5rem] items-center justify-center rounded-full bg-gradient-to-b from-white/10 to-transparent shadow-[inset_0_1px_2px_rgba(255,255,255,0.2)]">
                    <span class="text-[3rem] font-medium tracking-tighter text-white" style="line-height: 1;">98</span>
                </div>
            </div>

        </div>

        <!-- Faux Bottom Navigation Context (to match visual weight) -->
        <div
            class="mt-20 flex w-full max-w-[24rem] items-center justify-between rounded-2xl border border-white/5 bg-white/[0.02] px-5 py-4 backdrop-blur-md">
            <span class="text-sm font-medium text-white/70">Notifications</span>
            <div class="flex items-center gap-4 text-white/50">
                <iconify-icon icon="solar:home-2-linear"
                    class="text-lg hover:text-white transition-colors cursor-pointer"></iconify-icon>
                <iconify-icon icon="solar:tuning-square-2-linear"
                    class="text-lg hover:text-white transition-colors cursor-pointer"></iconify-icon>
                <div
                    class="h-6 w-6 rounded-full bg-gradient-to-tr from-amber-600 to-amber-900 border border-white/10 shadow-inner">
                </div>
            </div>
        </div>

    </main>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</section>
