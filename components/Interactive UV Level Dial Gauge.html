    <script>
      (function() {
                const CONFIG = { minTemp: 0, maxTemp: 12, startAngle: 135, sweepAngle: 270, cx: 140, cy: 140, radiusTrack: 90, radiusTicksInner: 104, radiusTicksOuter: 112, radiusLabels: 126 };
                let currentTemp = 4;
                let targetTemp = 4;
                let isDragging = false;
                const container = document.getElementById('dial-container-mod');
                const trackPath = document.getElementById('track-mod');
                const arcPath = document.getElementById('arc-mod');
                const ticksGroup = document.getElementById('ticks-group-mod');
                const labelsGroup = document.getElementById('labels-group-mod');
                const tempDisplay = document.getElementById('temp-display-mod');
                const dimpleContainer = document.getElementById('dimple-container-mod');
                const tempBar = document.getElementById('temp-bar-mod');

                function polarToCartesian(cx, cy, radius, angleDeg) {
                    const rad = angleDeg * Math.PI / 180;
                    return { x: cx + radius * Math.cos(rad), y: cy + radius * Math.sin(rad) };
                }
                function describeArc(cx, cy, radius, startAngle, endAngle) {
                    const start = polarToCartesian(cx, cy, radius, startAngle);
                    const end = polarToCartesian(cx, cy, radius, endAngle);
                    const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
                    return ["M", start.x, start.y, "A", radius, radius, 0, largeArcFlag, 1, end.x, end.y].join(" ");
                }
                function buildDial() {
                    const pathData = describeArc(CONFIG.cx, CONFIG.cy, CONFIG.radiusTrack, CONFIG.startAngle, CONFIG.startAngle + CONFIG.sweepAngle);
                    trackPath.setAttribute('d', pathData);
                    arcPath.setAttribute('d', pathData);
                    const arcLength = arcPath.getTotalLength();
                    arcPath.style.strokeDasharray = arcLength;
                    
                    for (let t = CONFIG.minTemp; t <= CONFIG.maxTemp; t += 0.5) {
                        const progress = (t - CONFIG.minTemp) / (CONFIG.maxTemp - CONFIG.minTemp);
                        const angle = CONFIG.startAngle + (progress * CONFIG.sweepAngle);
                        const isMajor = t % 3 === 0;
                        const rInner = isMajor ? CONFIG.radiusTicksInner - 2 : CONFIG.radiusTicksInner;
                        const rOuter = CONFIG.radiusTicksOuter;
                        const p1 = polarToCartesian(CONFIG.cx, CONFIG.cy, rInner, angle);
                        const p2 = polarToCartesian(CONFIG.cx, CONFIG.cy, rOuter, angle);
                        
                        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                        line.setAttribute("x1", p1.x); line.setAttribute("y1", p1.y);
                        line.setAttribute("x2", p2.x); line.setAttribute("y2", p2.y);
                        line.setAttribute("stroke", isMajor ? "#737373" : "#333");
                        line.setAttribute("stroke-width", isMajor ? "2" : "1.5");
                        line.setAttribute("stroke-linecap", "round");
                        ticksGroup.appendChild(line);
                        
                        if (isMajor) {
                            const lPos = polarToCartesian(CONFIG.cx, CONFIG.cy, CONFIG.radiusLabels, angle);
                            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
                            text.textContent = t;
                            text.setAttribute("x", lPos.x); text.setAttribute("y", lPos.y);
                            text.setAttribute("fill", "#737373");
                            text.setAttribute("font-family", "monospace");
                            text.setAttribute("font-size", "10px");
                            text.setAttribute("font-weight", "500");
                            text.setAttribute("text-anchor", "middle");
                            text.setAttribute("dominant-baseline", "middle");
                            labelsGroup.appendChild(text);
                        }
                    }
                }
                function updateUI() {
                    tempDisplay.textContent = Math.round(currentTemp);
                    const progress = (currentTemp - CONFIG.minTemp) / (CONFIG.maxTemp - CONFIG.minTemp);
                    const arcLength = arcPath.getTotalLength();
                    arcPath.style.strokeDashoffset = arcLength * (1 - progress);
                    const currentAngle = CONFIG.startAngle + (progress * CONFIG.sweepAngle);
                    dimpleContainer.style.transform = `rotate(${currentAngle + 90}deg)`;
                    tempBar.style.width = `${progress * 100}%`;
                }
                function handlePointer(e) {
                    const rect = container.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    let angle = Math.atan2(y, x) * 180 / Math.PI;
                    if (angle < 0) angle += 360;
                    let relativeAngle = angle - CONFIG.startAngle;
                    if (relativeAngle < -90) relativeAngle += 360; 
                    let progress = Math.max(0, Math.min(1, relativeAngle / CONFIG.sweepAngle));
                    targetTemp = CONFIG.minTemp + (progress * (CONFIG.maxTemp - CONFIG.minTemp));
                    if (isDragging) { currentTemp = targetTemp; updateUI(); }
                }
                container.addEventListener('pointerdown', (e) => { isDragging = true; container.setPointerCapture(e.pointerId); handlePointer(e); });
                container.addEventListener('pointermove', (e) => { if (isDragging) handlePointer(e); });
                container.addEventListener('pointerup', () => isDragging = false);
                container.addEventListener('pointercancel', () => isDragging = false);
                
                function animate() {
                    if (!isDragging && Math.abs(targetTemp - currentTemp) > 0.01) { currentTemp += (targetTemp - currentTemp) * 0.15; updateUI(); }
                    requestAnimationFrame(animate);
                }
                buildDial(); updateUI(); animate();
            })();
    </script>
