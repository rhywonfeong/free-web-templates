<div
    class="bg-[#EEF2F6] min-h-screen flex items-center justify-center p-4 sm:p-8 font-sans antialiased overflow-x-hidden text-gray-900">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <!-- Main Card Container -->
    <div id="mainCard"
        class="bg-white rounded-[2rem] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.08)] w-full max-w-4xl p-8 md:p-12 relative overflow-hidden"
        style="opacity: 0; transform: translateY(30px) scale(0.98); transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);">

        <!-- Subtle Grid Background -->
        <div class="absolute inset-0 pointer-events-none"
            style="background-size: 32px 32px; background-image: linear-gradient(to right, rgba(0,0,0,0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(0,0,0,0.02) 1px, transparent 1px);">
        </div>

        <div class="relative z-10 flex flex-col gap-12">
            <!-- Top Section -->
            <div class="flex flex-col md:flex-row items-center md:items-start gap-12 md:gap-16">
                <!-- Circular Progress Area -->
                <div class="relative w-64 h-64 flex-shrink-0 animate-list-item"
                    style="opacity: 0; transform: translateY(15px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);">

                    <div id="boundingBox" class="absolute inset-4 border border-dashed border-gray-200"
                        style="opacity: 0; transition: opacity 1.2s ease-in-out;">
                        <div class="absolute -top-[5px] -left-[5px] w-2.5 h-2.5 bg-indigo-600 rounded-full shadow-sm">
                        </div>
                        <div class="absolute -top-[5px] -right-[5px] w-2.5 h-2.5 bg-indigo-600 rounded-full shadow-sm">
                        </div>
                        <div
                            class="absolute -bottom-[5px] -left-[5px] w-2.5 h-2.5 bg-indigo-600 rounded-full shadow-sm">
                        </div>
                        <div
                            class="absolute -bottom-[5px] -right-[5px] w-2.5 h-2.5 bg-indigo-600 rounded-full shadow-sm">
                        </div>
                    </div>

                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-2xl"
                            style="transform: rotate(-135deg);">
                            <defs>
                                <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#3B82F6" />
                                    <stop offset="100%" stop-color="#A855F7" />
                                </linearGradient>
                                <linearGradient id="outerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#00F0FF" />
                                    <stop offset="100%" stop-color="#8B5CF6" />
                                </linearGradient>
                            </defs>
                            <circle cx="100" cy="100" r="70" fill="url(#innerGrad)" />
                            <circle id="progressCircle" cx="100" cy="100" r="82" fill="none" stroke="url(#outerGrad)"
                                stroke-width="16" stroke-linecap="round"
                                style="stroke-dasharray: 515; stroke-dashoffset: 515; transition: stroke-dashoffset 2s cubic-bezier(0.22, 1, 0.36, 1);" />
                        </svg>
                    </div>

                    <div class="absolute inset-0 flex flex-col items-center justify-center z-10 pointer-events-none">
                        <span id="counterText" class="text-[3.5rem] leading-none font-semibold text-white tracking-tight drop-shadow-md">0%</span>
                        <span class="text-sm font-medium text-white/90 mt-1 drop-shadow-sm">Complete</span>
                    </div>
                </div>

                <div class="pt-6 text-center md:text-left animate-list-item"
                    style="opacity: 0; transform: translateY(15px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);">
                    <h2 class="text-[1.75rem] leading-tight font-semibold text-gray-900 tracking-tight">Project Progress
                    </h2>
                    <p class="text-lg font-medium text-gray-600 mt-1 tracking-tight">Website Redesign</p>
                </div>
            </div>

            <!-- Bottom Section -->
            <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-10 lg:gap-6 w-full">
                <div class="flex flex-col gap-4 w-full lg:w-[70%]">
                    <div class="flex flex-wrap sm:flex-nowrap justify-between w-full items-center gap-4 sm:gap-0 animate-list-item"
                        style="opacity: 0; transform: translateY(15px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);">
                        <div class="flex items-center gap-2.5 sm:w-1/3">
                            <iconify-icon icon="solar:check-circle-linear"
                                class="text-indigo-600 text-2xl flex-shrink-0"></iconify-icon>
                            <span class="text-sm font-medium text-gray-900">Wireframing</span>
                        </div>
                        <div class="flex items-center gap-2.5 sm:w-1/3 sm:justify-center">
                            <iconify-icon icon="solar:round-alt-linear"
                                class="text-gray-300 text-2xl flex-shrink-0"></iconify-icon>
                            <span class="text-sm font-medium text-gray-600">Design Mockups</span>
                        </div>
                        <div class="flex items-center gap-2.5 sm:w-1/3 sm:justify-end">
                            <iconify-icon icon="solar:round-alt-linear"
                                class="text-gray-300 text-2xl flex-shrink-0"></iconify-icon>
                            <span class="text-sm font-medium text-gray-600">Development</span>
                        </div>
                    </div>

                    <div class="flex w-full animate-list-item"
                        style="opacity: 0; transform: translateY(15px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);">
                        <div class="w-[34px] flex-shrink-0"></div>
                        <span class="text-[0.95rem] font-semibold text-gray-900">100%</span>
                    </div>

                    <div class="flex w-full items-center gap-3.5 animate-list-item"
                        style="opacity: 0; transform: translateY(15px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);">
                        <div class="w-7 flex justify-center flex-shrink-0">
                            <iconify-icon icon="solar:pen-2-linear"
                                class="text-emerald-500 text-[1.35rem]"></iconify-icon>
                        </div>
                        <div class="flex-grow h-2.5 bg-gray-100 rounded-full overflow-hidden relative shadow-inner">
                            <div id="bar1"
                                class="absolute inset-y-0 left-0 bg-gradient-to-r from-emerald-400 to-indigo-500 rounded-full"
                                style="width: 0%; transition: width 1.8s cubic-bezier(0.22, 1, 0.36, 1);"></div>
                        </div>
                        <span class="text-[0.95rem] font-semibold text-gray-900 w-10 text-right">80%</span>
                    </div>

                    <div class="flex w-full items-center gap-3.5 animate-list-item"
                        style="opacity: 0; transform: translateY(15px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);">
                        <div class="w-7 flex justify-center flex-shrink-0 relative">
                            <iconify-icon icon="solar:round-alt-linear"
                                class="text-amber-500 text-[1.35rem]"></iconify-icon>
                        </div>
                        <div class="flex-grow h-2.5 bg-gray-100 rounded-full overflow-hidden relative shadow-inner">
                            <div id="bar2"
                                class="absolute inset-y-0 left-0 bg-gradient-to-r from-amber-400 to-indigo-500 rounded-full"
                                style="width: 0%; transition: width 1.8s cubic-bezier(0.22, 1, 0.36, 1);"></div>
                        </div>
                        <span class="text-[0.95rem] font-semibold text-gray-900 w-10 text-right">40%</span>
                    </div>
                </div>

                <div class="relative mt-6 lg:mt-0 lg:ml-auto flex justify-center animate-list-item"
                    style="opacity: 0; transform: translateY(15px); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);">
                    <button class="bg-[#1A1A24] text-white px-8 py-3.5 rounded-[1.25rem] text-[0.95rem] font-medium hover:bg-gray-800 transition-colors shadow-lg active:scale-95 group relative">
                        View Details
                        <div id="cursorIcon" class="absolute -bottom-5 -right-3 pointer-events-none z-50 text-gray-800 drop-shadow-md group-hover:scale-110 transition-transform origin-top-left" style="opacity: 0; transition: opacity 0.5s ease-out;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                <path d="M5.5 2.5L20.5 9.5L12 12L9.5 20.5L5.5 2.5Z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const card = document.getElementById('mainCard');
                card.style.opacity = '1';
                card.style.transform = 'translateY(0) scale(1)';
            }, 100);
            setTimeout(() => { document.getElementById('boundingBox').style.opacity = '1'; }, 600);
            setTimeout(() => { document.getElementById('progressCircle').style.strokeDashoffset = '129'; }, 500);
            setTimeout(() => {
                let count = 0; const target = 75; const counterEl = document.getElementById('counterText');
                const interval = setInterval(() => {
                    if(count >= target) { clearInterval(interval); counterEl.innerText = target + '%'; } 
                    else { count += Math.ceil((target - count) * 0.1) || 1; counterEl.innerText = count + '%'; }
                }, 30);
            }, 500);
            document.querySelectorAll('.animate-list-item').forEach((item, index) => {
                setTimeout(() => { item.style.opacity = '1'; item.style.transform = 'translateY(0)'; }, 500 + (index * 120));
            });
            setTimeout(() => {
                document.getElementById('bar1').style.width = '80%';
                document.getElementById('bar2').style.width = '40%';
            }, 900);
            setTimeout(() => { document.getElementById('cursorIcon').style.opacity = '1'; }, 1600);
        });
    </script>
</div>
