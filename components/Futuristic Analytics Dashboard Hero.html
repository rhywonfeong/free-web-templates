<div
    class="relative w-full h-screen overflow-hidden flex flex-col items-center justify-center bg-[#080B14] text-white font-sans antialiased selection:bg-blue-500/30">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <!-- Ambient Background Effects -->
    <div class="absolute inset-0 z-0 pointer-events-none"
        style="background: radial-gradient(circle at 50% 50%, rgba(30, 58, 138, 0.15) 0%, rgba(8, 11, 20, 1) 60%);">
    </div>
    <div class="absolute top-0 left-0 w-full h-full opacity-20 pointer-events-none mix-blend-screen"
        style="background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px); background-size: 40px 40px;">
    </div>

    <!-- Header -->
    <header
        class="w-full flex justify-between items-center p-6 md:px-12 z-20 absolute top-0 left-0 transition-all duration-1000">
        <!-- Logo -->
        <div class="flex items-center gap-3 cursor-pointer group">
            <div
                class="relative w-8 h-8 flex items-center justify-center transform group-hover:rotate-180 transition-transform duration-700 ease-in-out">
                <div class="absolute w-3 h-3 bg-white top-1 left-1 rounded-sm shadow-[0_0_10px_white]"></div>
                <div class="absolute w-3 h-3 bg-white/70 top-1 right-1 rounded-sm"></div>
                <div class="absolute w-3 h-3 bg-white/40 bottom-1 left-1 rounded-sm"></div>
                <div class="absolute w-3 h-3 bg-white/20 bottom-1 right-1 rounded-sm"></div>
                <div class="absolute inset-0 border border-white/10 rounded-md animate-spin"
                    style="animation-duration: 4s;"></div>
            </div>
            <span class="text-xl tracking-tight font-medium text-white/90 group-hover:text-white transition-colors">Stoch</span>
        </div>

        <!-- Header Actions -->
        <div class="flex items-center gap-6">
            <button class="text-white/60 hover:text-white transition-colors duration-300 transform hover:scale-110">
                <iconify-icon icon="solar:magnifer-linear" width="24" height="24"></iconify-icon>
            </button>
            <button class="bg-gradient-to-r from-[#4F75FF] to-[#3A5EE6] hover:from-[#5A7FFF] hover:to-[#4669F2] text-white px-5 py-2.5 rounded-lg text-sm font-medium transition-all duration-300 shadow-[0_0_15px_rgba(79,117,255,0.3)] hover:shadow-[0_0_25px_rgba(79,117,255,0.5)] border border-blue-400/30 hover:-translate-y-0.5">
                Uisi Mode
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 w-full h-full relative flex items-center justify-center z-10">

        <!-- Center Hexagon Complex -->
        <div
            class="relative w-[500px] h-[500px] flex items-center justify-center scale-[0.6] sm:scale-75 md:scale-90 xl:scale-100 transition-transform duration-700 ease-out">

            <!-- Rotating Network Background SVG -->
            <svg class="absolute inset-0 w-full h-full opacity-50 animate-spin" style="animation-duration: 90s;"
                viewBox="0 0 400 400">
                <g stroke="rgba(79,117,255,0.3)" stroke-width="0.5" fill="none">
                    <polygon points="200,30 347,115 347,285 200,370 53,285 53,115" stroke-dasharray="2 4" />
                    <polygon points="200,80 304,140 304,260 200,320 96,260 96,140" stroke="rgba(139,92,246,0.3)" />
                    <polygon points="200,120 269,160 269,240 200,280 131,240 131,160" />
                    <line x1="200" y1="30" x2="200" y2="200" />
                    <line x1="347" y1="115" x2="200" y2="200" />
                    <line x1="347" y1="285" x2="200" y2="200" />
                    <line x1="200" y1="370" x2="200" y2="200" />
                    <line x1="53" y1="285" x2="200" y2="200" />
                    <line x1="53" y1="115" x2="200" y2="200" />
                    <circle cx="200" cy="30" r="2" fill="#4F75FF" />
                    <circle cx="347" cy="115" r="2" fill="#4F75FF" />
                    <circle cx="347" cy="285" r="2" fill="#4F75FF" />
                    <circle cx="200" cy="370" r="2" fill="#4F75FF" />
                    <circle cx="53" cy="285" r="2" fill="#4F75FF" />
                    <circle cx="53" cy="115" r="2" fill="#4F75FF" />
                </g>
                <g class="animate-pulse">
                    <circle cx="200" cy="80" r="1.5" fill="#8B5CF6" />
                    <circle cx="304" cy="140" r="1.5" fill="#8B5CF6" />
                    <circle cx="96" cy="260" r="1.5" fill="#8B5CF6" />
                </g>
            </svg>

            <!-- Counter-rotating secondary network -->
            <svg class="absolute inset-0 w-full h-full opacity-30 animate-spin"
                style="animation-duration: 120s; animation-direction: reverse; transform: scale(1.1);"
                viewBox="0 0 400 400">
                <circle cx="200" cy="200" r="180" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"
                    stroke-dasharray="10 20" />
                <circle cx="200" cy="200" r="130" fill="none" stroke="rgba(79,117,255,0.1)" stroke-width="2"
                    stroke-dasharray="5 15" />
            </svg>

            <!-- Center Core Glow & Energy -->
            <div class="absolute w-[280px] h-[280px] rounded-full mix-blend-screen opacity-60 animate-spin"
                style="animation-duration: 15s; background: conic-gradient(from 0deg, transparent, rgba(139, 92, 246, 0.5) 20%, transparent 40%, rgba(79, 117, 255, 0.5) 70%, transparent);">
            </div>
            <div class="absolute w-[200px] h-[200px] rounded-full bg-[#4F75FF]/20 blur-[40px] animate-pulse"></div>
            <div class="absolute w-[120px] h-[120px] rounded-full bg-[#8B5CF6]/30 blur-[30px] animate-pulse"
                style="animation-direction: reverse; animation-duration: 2s;"></div>

            <!-- Central Button -->
            <button class="absolute z-40 bg-[#3A5EE6] px-10 py-4 rounded-full text-sm font-medium tracking-wide text-white border-[2px] border-[#81A1FF] shadow-[0_0_20px_#4F75FF_inset,0_0_40px_rgba(79,117,255,0.6)] hover:shadow-[0_0_30px_#4F75FF_inset,0_0_60px_rgba(79,117,255,0.9)] hover:scale-[1.03] transition-all duration-300 group overflow-hidden">
                <span class="relative z-10 text-white drop-shadow-[0_0_8px_rgba(255,255,255,0.8)]">ACTIVATE</span>
                <div class="absolute inset-0 bg-gradient-to-r from-white/0 via-white/20 to-white/0 w-[200%] -translate-x-[100%] group-hover:translate-x-[100%] transition-transform duration-1000 ease-in-out"></div>
            </button>

            <!-- Hexagon Panels -->
            <div class="absolute top-1/2 left-1/2 w-40 h-14 -ml-20 -mt-7 bg-gradient-to-b from-white/10 to-transparent backdrop-blur-[8px] border border-white/15 rounded-md flex items-center justify-center shadow-[0_0_25px_rgba(79,117,255,0.15)] group cursor-pointer transition-all duration-500 hover:bg-white/20 hover:border-white/30 hover:scale-110 hover:z-30 hover:shadow-[0_0_40px_rgba(79,117,255,0.4)]"
                style="transform: translate(0px, -170px) rotate(0deg);">
                <div class="absolute top-0 w-3/4 h-[2px] bg-white/90 rounded-full shadow-[0_0_15px_#fff]"></div>
                <span class="text-xs font-medium text-blue-50/80 group-hover:text-white tracking-wide transition-colors">Data Stream</span>
            </div>

            <div class="absolute top-1/2 left-1/2 w-40 h-14 -ml-20 -mt-7 bg-gradient-to-b from-white/10 to-transparent backdrop-blur-[8px] border border-white/15 rounded-md flex items-center justify-center shadow-[0_0_25px_rgba(79,117,255,0.15)] group cursor-pointer transition-all duration-500 hover:bg-white/20 hover:border-white/30 hover:scale-110 hover:z-30 hover:shadow-[0_0_40px_rgba(79,117,255,0.4)]"
                style="transform: translate(147px, -85px) rotate(60deg);">
                <div class="absolute top-0 w-3/4 h-[2px] bg-white/90 rounded-full shadow-[0_0_15px_#fff]"></div>
                <span class="text-xs font-medium text-blue-50/80 group-hover:text-white tracking-wide transition-colors">System Status</span>
            </div>

            <div class="absolute top-1/2 left-1/2 w-40 h-14 -ml-20 -mt-7 bg-gradient-to-b from-white/10 to-transparent backdrop-blur-[8px] border border-white/15 rounded-md flex items-center justify-center shadow-[0_0_25px_rgba(79,117,255,0.15)] group cursor-pointer transition-all duration-500 hover:bg-white/20 hover:border-white/30 hover:scale-110 hover:z-30 hover:shadow-[0_0_40px_rgba(79,117,255,0.4)]"
                style="transform: translate(147px, 85px) rotate(-60deg);">
                <div class="absolute top-0 w-3/4 h-[2px] bg-white/90 rounded-full shadow-[0_0_15px_#fff]"></div>
                <span class="text-xs font-medium text-blue-50/80 group-hover:text-white tracking-wide transition-colors">User Analytics</span>
            </div>

            <div class="absolute top-1/2 left-1/2 w-40 h-14 -ml-20 -mt-7 bg-gradient-to-b from-white/10 to-transparent backdrop-blur-[8px] border border-white/15 rounded-md flex items-center justify-center shadow-[0_0_25px_rgba(79,117,255,0.15)] group cursor-pointer transition-all duration-500 hover:bg-white/20 hover:border-white/30 hover:scale-110 hover:z-30 hover:shadow-[0_0_40px_rgba(79,117,255,0.4)]"
                style="transform: translate(0px, 170px) rotate(0deg);">
                <div class="absolute top-0 w-3/4 h-[2px] bg-white/90 rounded-full shadow-[0_0_15px_#fff]"></div>
                <span class="text-xs font-medium text-blue-50/80 group-hover:text-white tracking-wide transition-colors">User Analytics</span>
            </div>

            <div class="absolute top-1/2 left-1/2 w-40 h-14 -ml-20 -mt-7 bg-gradient-to-b from-white/10 to-transparent backdrop-blur-[8px] border border-white/15 rounded-md flex items-center justify-center shadow-[0_0_25px_rgba(79,117,255,0.15)] group cursor-pointer transition-all duration-500 hover:bg-white/20 hover:border-white/30 hover:scale-110 hover:z-30 hover:shadow-[0_0_40px_rgba(79,117,255,0.4)]"
                style="transform: translate(-147px, 85px) rotate(60deg);">
                <div class="absolute top-0 w-3/4 h-[2px] bg-white/90 rounded-full shadow-[0_0_15px_#fff]"></div>
                <span class="text-xs font-medium text-blue-50/80 group-hover:text-white tracking-wide transition-colors">Data Stream</span>
            </div>

            <div class="absolute top-1/2 left-1/2 w-40 h-14 -ml-20 -mt-7 bg-gradient-to-b from-white/10 to-transparent backdrop-blur-[8px] border border-white/15 rounded-md flex items-center justify-center shadow-[0_0_25px_rgba(79,117,255,0.15)] group cursor-pointer transition-all duration-500 hover:bg-white/20 hover:border-white/30 hover:scale-110 hover:z-30 hover:shadow-[0_0_40px_rgba(79,117,255,0.4)]"
                style="transform: translate(-147px, -85px) rotate(-60deg);">
                <div class="absolute top-0 w-3/4 h-[2px] bg-white/90 rounded-full shadow-[0_0_15px_#fff]"></div>
                <span class="text-xs font-medium text-blue-50/80 group-hover:text-white tracking-wide transition-colors">Data Stream</span>
            </div>
        </div>

        <!-- Left Side Widget -->
        <div
            class="absolute left-10 xl:left-24 top-1/2 -translate-y-1/2 hidden lg:flex flex-col items-center gap-2 group">
            <div
                class="relative w-32 h-32 flex items-center justify-center transform group-hover:scale-105 transition-transform duration-500">
                <svg class="absolute inset-0 w-full h-full transform -rotate-90">
                    <circle cx="64" cy="64" r="54" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="6" />
                    <circle cx="64" cy="64" r="54" fill="none" stroke="#4F75FF" stroke-width="6"
                        stroke-dasharray="339.29" stroke-dashoffset="74.64"
                        class="drop-shadow-[0_0_12px_rgba(79,117,255,0.8)] animate-pulse" />
                </svg>
                <span class="text-3xl font-medium tracking-tight text-white drop-shadow-md">78%</span>
            </div>
        </div>

        <!-- Right Side Widgets -->
        <div class="absolute right-10 xl:right-24 top-1/2 -translate-y-1/2 hidden lg:flex flex-col items-center gap-14">
            <div class="flex flex-col items-center gap-4 group">
                <div
                    class="w-44 h-24 relative border-l border-b border-white/10 group-hover:border-white/30 transition-colors duration-500">
                    <svg class="absolute inset-0 w-full h-full overflow-visible" preserveAspectRatio="none"
                        viewBox="0 0 100 100">
                        <path d="M0,100 L0,50 Q10,70 20,40 T40,60 T60,20 T80,50 T100,10 L100,100 Z"
                            fill="url(#chart-grad)" opacity="0.4"
                            class="group-hover:opacity-60 transition-opacity duration-500" />
                        <path d="M0,50 Q10,70 20,40 T40,60 T60,20 T80,50 T100,10" fill="none" stroke="#4F75FF"
                            stroke-width="1.5" class="drop-shadow-[0_0_8px_rgba(79,117,255,0.8)]">
                            <animate attributeName="stroke-dasharray" from="0,200" to="200,0" dur="2s" fill="freeze" />
                        </path>
                        <defs>
                            <linearGradient id="chart-grad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#4F75FF" />
                                <stop offset="100%" stop-color="rgba(79,117,255,0)" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="absolute -left-4 h-full flex flex-col justify-between text-[8px] text-white/30 py-1">
                        <span>003</span><span>000</span>
                    </div>
                </div>
                <div class="flex flex-col items-center gap-3 mt-4">
                    <span class="text-xs font-medium text-white/80 tracking-wide">Real-time Metrics</span>
                    <label class="relative inline-flex items-center cursor-pointer group/toggle">
                        <input type="checkbox" value="" class="sr-only peer" checked>
                        <div class="w-12 h-6 bg-white/10 rounded-full peer peer-checked:after:translate-x-6 peer-checked:after:bg-white after:content-[''] after:absolute after:top-[3px] after:left-[3px] after:bg-white after:rounded-full after:h-[18px] after:w-[18px] after:transition-all peer-checked:bg-[#4F75FF] shadow-[0_0_15px_rgba(79,117,255,0.2)] group-hover/toggle:scale-105"></div>
                    </label>
                </div>
            </div>
        </div>
    </main>
</div>
