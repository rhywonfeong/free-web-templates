<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Component</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <!-- Tailwind config removed as per instructions, using arbitrary values directly -->
</head>

<body
    class="bg-[#1a1b1f] min-h-screen flex items-center justify-center overflow-hidden font-sans text-gray-800 antialiased selection:bg-indigo-500/30">

    <!-- Main 3D Scene Wrapper -->
    <div id="scene"
        class="relative flex items-center justify-center w-full max-w-md transition-all duration-1000 ease-out opacity-0 scale-90"
        style="perspective: 1200px; transform: rotateX(25deg) rotateY(-15deg) rotateZ(8deg);">

        <!-- Component Stack -->
        <div class="relative w-[340px] h-[320px]">

            <!-- Bottom Layer (Blue) -->
            <div id="layer-blue"
                class="absolute inset-0 bg-[#83cae9] rounded-[36px] shadow-2xl transition-all duration-700 ease-[cubic-bezier(0.34,1.56,0.64,1)] translate-x-0 translate-y-0"
                style="box-shadow: inset 0px 4px 10px rgba(255,255,255,0.3), 0px 20px 40px rgba(0,0,0,0.4);"></div>

            <!-- Middle Layer (Purple) -->
            <div id="layer-purple"
                class="absolute inset-0 bg-[#bba7f1] rounded-[36px] shadow-xl transition-all duration-700 ease-[cubic-bezier(0.34,1.56,0.64,1)] delay-75 translate-x-0 translate-y-0"
                style="box-shadow: inset 0px 4px 10px rgba(255,255,255,0.3), 0px 10px 20px rgba(0,0,0,0.2);"></div>

            <!-- Top Layer (White Card) -->
            <div id="layer-white"
                class="absolute inset-0 bg-[#fdfdfe] rounded-[36px] p-7 flex flex-col z-10 transition-all duration-700 ease-out delay-150 shadow-[0_10px_30px_rgba(0,0,0,0.15)] ring-1 ring-white/50">

                <!-- Close Button -->
                <button class="absolute top-5 right-5 text-gray-300 hover:text-gray-600 hover:rotate-90 transition-transform duration-300 ease-in-out focus:outline-none">
                    <iconify-icon icon="solar:close-linear" class="text-xl"></iconify-icon>
                </button>

                <!-- Menu Items -->
                <div class="flex flex-col mt-2 flex-grow">

                    <!-- Item: Workflow step -->
                    <button class="flex items-center gap-4 group p-2 -ml-2 rounded-xl hover:bg-gray-50 transition-colors duration-200">
                        <div class="flex items-center justify-center w-10 h-10 bg-[#795cf6] rounded-xl shadow-md shadow-indigo-500/20 group-hover:scale-105 transition-transform duration-300">
                            <iconify-icon icon="solar:add-linear" class="text-white text-xl"></iconify-icon>
                        </div>
                        <span class="text-base font-medium tracking-tight text-gray-900 group-hover:translate-x-0.5 transition-transform duration-200">Workflow step</span>
                    </button>

                    <!-- Divider -->
                    <div class="flex">
                        <div class="w-10 mr-4"></div>
                        <div class="flex-grow border-t border-gray-100 my-2"></div>
                    </div>

                    <!-- Item: Project Step -->
                    <button class="flex items-center gap-4 group p-2 -ml-2 rounded-xl hover:bg-gray-50 transition-colors duration-200">
                        <div class="flex items-center justify-center w-10 h-10 rounded-xl group-hover:scale-105 transition-transform duration-300">
                            <iconify-icon icon="solar:widget-5-linear" class="text-gray-400 text-2xl group-hover:text-gray-600 transition-colors"></iconify-icon>
                        </div>
                        <span class="text-base font-medium text-gray-700 group-hover:translate-x-0.5 transition-transform duration-200">Project Step</span>
                    </button>

                    <!-- Item: Project Task -->
                    <button class="flex items-center gap-4 group p-2 -ml-2 rounded-xl hover:bg-gray-50 transition-colors duration-200">
                        <div class="flex items-center justify-center w-10 h-10 rounded-xl group-hover:scale-105 transition-transform duration-300">
                            <iconify-icon icon="solar:home-smile-linear" class="text-gray-400 text-2xl group-hover:text-gray-600 transition-colors"></iconify-icon>
                        </div>
                        <span class="text-base font-medium text-gray-700 group-hover:translate-x-0.5 transition-transform duration-200">Project Task</span>
                    </button>
                </div>

                <!-- Bottom Actions -->
                <div class="flex items-center justify-between mt-auto pt-4">
                    <button class="px-5 py-2.5 rounded-[14px] border border-gray-200/80 text-gray-600 text-sm font-medium hover:bg-gray-50 hover:text-gray-900 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-gray-200">
                        Storing
                    </button>
                    <button class="px-6 py-2.5 rounded-[14px] bg-[#795cf6] text-white text-sm font-medium shadow-[0_8px_16px_-6px_rgba(121,92,246,0.5)] hover:shadow-[0_12px_20px_-6px_rgba(121,92,246,0.6)] hover:-translate-y-0.5 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 focus:ring-offset-white">
                        Gletereigle
                    </button>
                </div>

            </div>
        </div>
    </div>

    <!-- Entrance Animation Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Short delay to ensure rendering before animation starts
            setTimeout(() => {
                const scene = document.getElementById('scene');
                const layerBlue = document.getElementById('layer-blue');
                const layerPurple = document.getElementById('layer-purple');
                
                // Fade in and scale up the main wrapper
                scene.classList.remove('opacity-0', 'scale-90');
                scene.classList.add('opacity-100', 'scale-100');

                // Trigger the "unfolding" or "dealing" animation by applying translations
                // These specific arbitrary values create the stacked perspective
                layerBlue.classList.remove('translate-x-0', 'translate-y-0');
                layerBlue.classList.add('-translate-x-[26px]', 'translate-y-[38px]');

                layerPurple.classList.remove('translate-x-0', 'translate-y-0');
                layerPurple.classList.add('-translate-x-[13px]', 'translate-y-[19px]');
            }, 150);
        });
    </script>
</body>

</html>
