  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script>
    // WebGL-simulated background animation using Canvas 2D
        const canvas = document.getElementById('grid-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let lines = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initLines();
        }

        class GridLine {
            constructor(x) {
                this.x = x;
                this.y = Math.random() * height;
                this.length = Math.random() * 100 + 50;
                this.speed = Math.random() * 1 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y += this.speed;
                if (this.y > height) {
                    this.y = -this.length;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.beginPath();
                const gradient = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.length);
                gradient.addColorStop(0, `rgba(100, 100, 100, 0)`);
                gradient.addColorStop(0.5, `rgba(150, 150, 150, ${this.opacity})`);
                gradient.addColorStop(1, `rgba(100, 100, 100, 0)`);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 1;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y + this.length);
                ctx.stroke();
            }
        }

        function initLines() {
            lines = [];
            const numberOfLines = Math.floor(width / 30);
            for (let i = 0; i < numberOfLines; i++) {
                lines.push(new GridLine(Math.random() * width));
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw static vertical structural lines
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            for(let i = 0; i < width; i += 100) {
                ctx.moveTo(i, 0);
                ctx.lineTo(i, height);
            }
            ctx.stroke();

            // Draw animated particles/lines
            lines.forEach(line => {
                line.update();
                line.draw();
            });
            requestAnimationFrame(animateCanvas);
        }

        window.addEventListener('resize', resize);
        resize();
        animateCanvas();

        // GSAP Animations
        gsap.registerPlugin(ScrollTrigger);

        // Header Reveal
        gsap.fromTo('.gs-reveal', 
            { y: 30, opacity: 0 },
            { y: 0, opacity: 1, duration: 1, ease: 'power3.out' }
        );

        // Grid Items Stagger
        const cards = gsap.utils.toArray('.gs-card');
        gsap.fromTo(cards, 
            { 
                y: 50, 
                opacity: 0,
                scale: 0.95
            },
            { 
                y: 0, 
                opacity: 1, 
                scale: 1,
                duration: 1, 
                stagger: 0.1,
                ease: 'power3.out',
                scrollTrigger: {
                    trigger: '.gs-card',
                    start: 'top 85%',
                }
            }
        );
  </script>
