<section class="flex min-h-screen w-full items-center justify-center bg-[#050514] p-6"
  style="--bg: #050514; --text-dim: #4b5e78; --border: rgba(245, 158, 11, 0.10); --font-body: 'Inter', sans-serif;">
  <style>
    @keyframes marquee {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-50%);
      }
    }

    .logo-track {
      display: flex;
      gap: 48px;
      width: max-content;
      align-items: center;
      animation: marquee 25s linear infinite;
      will-change: transform;
    }

    .logo-bar-wrap {
      overflow: hidden;
      -webkit-mask-image: linear-gradient(90deg, transparent, black 15%, black 85%, transparent);
      mask-image: linear-gradient(90deg, transparent, black 15%, black 85%, transparent);
    }

    .logo-bar-wrap:hover .logo-track {
      animation-play-state: paused;
    }

    @media (max-width: 768px) {
      .logo-track {
        gap: 32px;
      }
    }
  </style>

  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js" async></script>

  <div class="w-full max-w-[1200px] border-y py-8" style="border-color: var(--border);">
    <div class="mb-5 text-center text-[10px] font-normal uppercase tracking-[0.1em]"
      style="color: var(--text-dim); font-family: var(--font-body);">
      Trusted by engineering teams worldwide
    </div>

    <div class="logo-bar-wrap">
      <div class="logo-track">
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Prisma Labs</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Voltaire</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">StackLayer</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">NeuralPath</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Orion AI</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">CipherGuard</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">DataForge</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">LaunchKit</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Axiom</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Cortex</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Stratum</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Cuboid</span>
        <!-- Duplicated for infinite effect -->
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Prisma Labs</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Voltaire</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">StackLayer</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">NeuralPath</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Orion AI</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">CipherGuard</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">DataForge</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">LaunchKit</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Axiom</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Cortex</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Stratum</span>
        <span class="whitespace-nowrap text-sm font-medium opacity-50 transition-opacity hover:opacity-100" style="color: var(--text-dim);">Cuboid</span>
      </div>
    </div>
  </div>
</section>
