<div
    class="min-h-screen w-full flex items-center justify-center bg-[#0A0A0A] text-neutral-200 font-sans antialiased selection:bg-blue-500/30 overflow-hidden py-12 px-4 md:p-8 relative">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <!-- Ambient Background Lighting & Mesh -->
    <div class="fixed inset-0 pointer-events-none z-0 flex items-center justify-center opacity-40">
        <div class="w-[60vw] h-[60vh] bg-blue-900/10 rounded-full blur-[100px]"></div>
    </div>
    <div class="fixed inset-0 pointer-events-none z-0"
        style="background-image: linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 64px 64px;">
    </div>

    <!-- Main Container Wrapper -->
    <main class="relative z-10 w-full max-w-[1100px] mx-auto">

        <!-- Glass Panel Setup with Grid Layout -->
        <div
            class="grid grid-cols-1 lg:grid-cols-3 bg-neutral-900/40 border border-neutral-800/80 rounded-[2rem] backdrop-blur-2xl shadow-2xl p-8 lg:p-12 relative overflow-hidden">

            <!-- Left Panel: System Metrics (Gauge) -->
            <section
                class="flex flex-col justify-center items-center relative w-full h-full lg:pr-10 lg:border-r border-neutral-800/50 pb-10 lg:pb-0 border-b lg:border-b-0">
                <div class="relative w-56 h-56 flex items-center justify-center">
                    <!-- SVG Circular Progress -->
                    <svg class="absolute inset-0 w-full h-full -rotate-90" viewBox="0 0 200 200"
                        xmlns="http://www.w3.org/2000/svg">
                        <circle cx="100" cy="100" r="85" fill="none" stroke="currentColor" stroke-width="2"
                            class="text-neutral-800" />
                        <circle cx="100" cy="100" r="85" fill="none" stroke="currentColor" stroke-width="3"
                            class="text-blue-500 transition-all duration-1000 ease-out" stroke-linecap="round"
                            stroke-dasharray="280 534" />
                        <circle cx="100" cy="100" r="70" fill="none" stroke="currentColor" stroke-width="1"
                            class="text-neutral-700/80" stroke-dasharray="4 8" />
                    </svg>
                    <!-- Center Metrics Display -->
                    <div class="flex flex-col items-center z-10 text-center">
                        <span class="text-xs text-neutral-500 tracking-widest uppercase font-normal mb-1">Compute</span>
                        <span class="text-4xl tracking-tight text-neutral-100 font-light mb-1">48<span class="text-lg text-neutral-500">%</span></span>
                        <div class="flex items-center gap-1.5 mt-1">
                            <div class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></div>
                            <span class="text-xs text-neutral-400 font-normal">Active</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Center Panel: Core Orb & Controls -->
            <section
                class="flex flex-col justify-center items-center relative w-full h-full space-y-10 py-10 lg:py-0 lg:px-10">
                <!-- Central Orb -->
                <div
                    class="relative w-52 h-52 rounded-full border border-neutral-700/40 bg-neutral-900/30 flex items-center justify-center shadow-[inset_0_0_40px_rgba(255,255,255,0.02)] backdrop-blur-sm overflow-hidden group hover:scale-[1.02] transition-transform duration-700 ease-out">
                    <div
                        class="absolute inset-4 rounded-full border border-neutral-700/30 border-dashed animate-[spin_40s_linear_infinite]">
                    </div>
                    <div
                        class="absolute inset-10 rounded-full border border-neutral-700/40 animate-[spin_30s_linear_reverse_infinite]">
                    </div>
                    <div
                        class="absolute w-24 h-24 bg-blue-500/20 rounded-full blur-[24px] group-hover:bg-blue-400/30 transition-colors duration-700 animate-pulse">
                    </div>
                    <div class="absolute w-8 h-8 bg-blue-400/50 rounded-full blur-[12px]"></div>
                    <div class="w-1 h-1 bg-white rounded-full shadow-[0_0_12px_#fff]"></div>
                    <div class="absolute inset-0 opacity-[0.15]"
                        style="background-image: radial-gradient(circle at center, white 1px, transparent 1px); background-size: 16px 16px;">
                    </div>
                </div>

                <!-- Status Notification -->
                <div
                    class="flex items-center gap-3 bg-neutral-900/60 border border-neutral-800/80 rounded-full px-4 py-1.5 backdrop-blur-md shadow-sm">
                    <span class="text-xs text-neutral-300 font-normal tracking-wide">Syncing Nodes</span>
                    <div class="flex gap-1.5">
                        <div class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-[bounce_1.2s_infinite]"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-[bounce_1.2s_infinite_200ms]"></div>
                        <div class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-[bounce_1.2s_infinite_400ms]"></div>
                    </div>
                </div>

                <!-- Control Button Cluster -->
                <div class="flex items-center gap-5 w-full justify-center">
                    <button class="relative w-12 h-12 rounded-full border border-neutral-800 bg-neutral-900/50 flex items-center justify-center hover:bg-neutral-800 hover:text-white hover:border-neutral-700 transition-all text-neutral-400 group">
                        <iconify-icon icon="solar:settings-linear" class="text-xl group-hover:rotate-90 transition-transform duration-500"></iconify-icon>
                    </button>
                    <button class="relative w-16 h-16 rounded-full border border-blue-500/40 bg-blue-500/10 flex items-center justify-center hover:bg-blue-500/20 hover:-translate-y-1 transition-all text-blue-400 shadow-[0_0_20px_rgba(59,130,246,0.15)] group">
                        <div class="absolute inset-0 rounded-full bg-blue-400/20 blur-md opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <iconify-icon icon="solar:magnifer-linear" class="text-2xl relative z-10"></iconify-icon>
                    </button>
                    <button class="relative w-12 h-12 rounded-full border border-neutral-800 bg-neutral-900/50 flex items-center justify-center hover:bg-neutral-800 hover:text-white hover:border-neutral-700 transition-all text-neutral-400 group">
                        <iconify-icon icon="solar:play-linear" class="text-xl translate-x-[1px] group-hover:text-blue-400 transition-colors duration-300"></iconify-icon>
                    </button>
                </div>
            </section>

            <!-- Right Panel: Data Stream Visualization -->
            <section
                class="flex flex-col justify-center relative w-full h-full lg:pl-10 lg:border-l border-neutral-800/50 pt-10 lg:pt-0 border-t lg:border-t-0">
                <div class="flex items-center justify-between mb-8">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.6)] animate-pulse">
                        </div>
                        <h3 class="text-lg tracking-tight text-neutral-100 font-normal">Network Traffic</h3>
                    </div>
                </div>
                <div
                    class="relative w-full h-48 border border-neutral-800/60 rounded-2xl bg-neutral-900/20 overflow-hidden flex flex-col p-4">
                    <div
                        class="absolute inset-x-4 top-4 bottom-4 flex flex-col justify-between z-0 pointer-events-none">
                        <div class="w-full h-px bg-neutral-800/50"></div>
                        <div class="w-full h-px bg-neutral-800/50"></div>
                        <div class="w-full h-px bg-neutral-800/50"></div>
                        <div class="w-full h-px bg-neutral-800/50"></div>
                    </div>
                    <div
                        class="absolute left-4 top-4 bottom-4 flex flex-col justify-between text-xs text-neutral-500 z-10 font-mono">
                        <span>100</span><span>66</span><span>33</span><span>0</span>
                    </div>
                    <div class="absolute left-12 right-4 top-4 bottom-4 z-10 overflow-visible">
                        <svg class="w-full h-full overflow-visible drop-shadow-md" preserveAspectRatio="none"
                            viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <linearGradient id="chartFill" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
                                    <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
                                </linearGradient>
                            </defs>
                            <path
                                d="M0,70 C20,70 40,50 60,65 C80,80 100,40 120,40 C140,40 160,55 180,55 C200,55 220,25 240,25 C260,25 280,45 300,45 L300,100 L0,100 Z"
                                fill="url(#chartFill)" />
                            <path
                                d="M0,70 C20,70 40,50 60,65 C80,80 100,40 120,40 C140,40 160,55 180,55 C200,55 220,25 240,25 C260,25 280,45 300,45"
                                fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" />
                            <path
                                d="M0,45 C30,45 50,65 80,35 C110,15 120,65 150,65 C180,65 190,35 210,35 C230,35 240,60 260,60 C280,60 290,30 300,30"
                                fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"
                                stroke-linecap="round" />
                        </svg>
                    </div>
                </div>
                <div
                    class="flex justify-between items-center mt-4 text-xs text-neutral-500 font-mono uppercase tracking-widest px-1">
                    <span>Live</span><span>History</span>
                </div>
            </section>
        </div>
    </main>
</div>
