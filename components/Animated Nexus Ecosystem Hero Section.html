<section class="relative w-full min-h-screen bg-[#fafafa] flex items-center justify-center overflow-hidden font-geist"
    style="font-family: 'Geist', sans-serif;">
    <!-- External Dependencies -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Background Gradients -->
    <div class="absolute inset-0 pointer-events-none">
        <div class="absolute top-[-10%] right-[-5%] w-[800px] h-[800px] bg-indigo-100/50 blur-[120px] rounded-full">
        </div>
        <div class="absolute bottom-[-20%] left-[-10%] w-[600px] h-[600px] bg-rose-50/60 blur-[100px] rounded-full">
        </div>
    </div>

    <div class="relative w-full max-w-[1200px] aspect-auto lg:aspect-[16/9] min-h-[600px] mt-20 lg:mt-0">
        <!-- Noodle Connection Lines -->
        <svg viewBox="0 0 1200 675" class="absolute inset-0 w-full h-full pointer-events-none"
            preserveAspectRatio="none">
            <path d="M 160 480 L 480 480 Q 500 480 500 460 L 500 360 Q 500 340 520 340 L 900 340" fill="none"
                stroke="#e2e8f0" stroke-width="1.5"></path>
            <path d="M 700 340 L 700 400" fill="none" stroke="#e2e8f0" stroke-width="1.5"></path>
            <path d="M 700 190 L 900 190" fill="none" stroke="#e2e8f0" stroke-width="1.5"></path>
            <path id="nexus-anim-path" d="M 280 480 L 480 480 Q 500 480 500 460 L 500 360 Q 500 340 520 340 L 900 340"
                fill="none" stroke="transparent" stroke-width="2"></path>
        </svg>

        <!-- Animated Particles -->
        <div id="nexus-pt-1"
            class="absolute w-1.5 h-1.5 bg-indigo-500 rounded-full shadow-[0_0_8px_2px_rgba(99,102,241,0.4)] opacity-0 z-10"
            style="transform: translate(-50%, -50%);"></div>
        <div id="nexus-pt-2"
            class="absolute w-1.5 h-1.5 bg-rose-400 rounded-full shadow-[0_0_8px_2px_rgba(251,113,133,0.4)] opacity-0 z-10"
            style="transform: translate(-50%, -50%);"></div>

        <!-- Hero Content -->
        <div
            class="absolute inset-0 z-20 flex flex-col justify-center w-full lg:w-[50%] pl-8 lg:pl-20 pointer-events-none">
            <div class="pointer-events-auto">
                <h1 class="text-5xl lg:text-7xl leading-[1.1] text-slate-900 mb-6 font-light tracking-tighter"
                    id="nexus-reveal-title">
                    <span class="inline-flex overflow-hidden pb-2"><span class="nexus-word inline-block translate-y-[110%]">Connect</span></span>
                    <span class="inline-flex overflow-hidden pb-2"><span class="nexus-word inline-block translate-y-[110%]">Your</span></span>
                    <span class="inline-flex overflow-hidden pb-2"><span class="nexus-word inline-block translate-y-[110%]">Ecosystem</span></span>
                    <br>
                    <span class="inline-flex overflow-hidden pb-2"><span class="nexus-word inline-block translate-y-[110%] text-indigo-600">Without</span></span>
                    <span class="inline-flex overflow-hidden pb-2"><span class="nexus-word inline-block translate-y-[110%] text-indigo-600">Friction</span></span>
                </h1>
                <p class="text-slate-500 text-base leading-relaxed max-w-[420px] mb-10 font-normal">Unify your tools,
                    teams, and data in one beautiful interface. Experience a seamlessly integrated workflow designed for
                    modern scale.</p>
                <div class="relative inline-flex group cursor-pointer">
                    <div
                        class="absolute inset-0 bg-indigo-200 rounded-full blur-md group-hover:bg-indigo-300 transition-all duration-500 opacity-60">
                    </div>
                    <button class="relative bg-white text-slate-900 border border-slate-200 px-6 py-3 rounded-full text-sm font-normal flex items-center gap-2 shadow-sm transition-all duration-300 hover:scale-[1.02]">
                        Explore Integrations
                        <iconify-icon icon="solar:arrow-right-linear" width="18" class="text-slate-400 group-hover:text-indigo-500 transition-colors"></iconify-icon>
                    </button>
                </div>
            </div>
        </div>

        <!-- Floating Data Nodes -->
        <div class="absolute z-30 flex items-center gap-2" style="left: 13.3%; top: 71%; transform: translateY(-50%);">
            <div
                class="w-8 h-8 bg-white border border-slate-200 rounded-full flex items-center justify-center shadow-sm overflow-hidden">
                <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/2f563338-39fa-47ea-9761-658d4f3f84db_800w.jpg" class="w-full h-full object-cover">
            </div>
            <div
                class="w-8 h-8 bg-white border border-slate-200 rounded-full flex items-center justify-center shadow-sm overflow-hidden">
                <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/4f5668c5-fc4a-44e0-bc5e-a664189d3c31_800w.jpg" class="w-full h-full object-cover">
            </div>
        </div>

        <div class="absolute z-30 flex items-center gap-2 p-2 rounded-xl border border-indigo-100 bg-indigo-50/50 shadow-sm backdrop-blur-sm"
            style="left: 48.3%; top: 50.3%; transform: translate(-50%, -50%);">
            <div
                class="w-6 h-6 bg-white border border-slate-200 rounded-lg flex items-center justify-center text-indigo-500">
                <iconify-icon icon="solar:folder-with-files-linear" width="14"></iconify-icon>
            </div>
            <div
                class="w-6 h-6 bg-white border border-slate-200 rounded-lg flex items-center justify-center text-rose-400">
                <iconify-icon icon="solar:chart-square-linear" width="14"></iconify-icon>
            </div>
        </div>

        <!-- Compass Schema -->
        <div id="nexus-compass" class="absolute z-10 top-1/2 -translate-y-1/2 rounded-full pointer-events-none"
            style="right: -260px; width: 820px; height: 820px;">
            <div
                class="absolute inset-0 rounded-full bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.95)_0%,rgba(239,246,255,0.55)_45%,transparent_75%)] blur-2xl">
            </div>
            <svg viewBox="0 0 820 820" class="absolute inset-0 w-full h-full overflow-visible">
                <defs>
                    <linearGradient id="compGrad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#6366f1" stop-opacity="0.55" />
                        <stop offset="100%" stop-color="#0f172a" stop-opacity="0.08" />
                    </linearGradient>
                </defs>
                <circle cx="410" cy="410" r="375" fill="none" stroke="#e2e8f0" stroke-width="1" />
                <circle cx="410" cy="410" r="295" fill="none" stroke="#e5e7eb" stroke-width="1" />
                <circle cx="410" cy="410" r="235" fill="none" stroke="#eef2ff" stroke-width="42" />
                <g id="nexus-ticks" style="transform-origin: 410px 410px;">
                    <circle cx="410" cy="410" r="265" fill="none" stroke="#cbd5e1" stroke-width="54"
                        stroke-dasharray="1 14" opacity="0.75" />
                </g>
                <g id="nexus-needle" style="transform-origin: 410px 410px;">
                    <path d="M410 130 L426 410 L410 690 L394 410 Z" fill="url(#compGrad)" opacity="0.45" />
                </g>
                <circle cx="410" cy="410" r="145" fill="white" opacity="0.55" stroke="#e2e8f0" />
            </svg>

            <!-- Central Core -->
            <div
                class="absolute top-1/2 left-1/2 w-[168px] h-[168px] -translate-x-1/2 -translate-y-1/2 rounded-full bg-white border border-slate-200 shadow-[0_25px_80px_rgba(15,23,42,0.12)] flex items-center justify-center pointer-events-auto">
                <div id="nexus-spinner"
                    class="absolute inset-[-7px] rounded-full border border-dashed border-indigo-300 border-t-indigo-500">
                </div>
                <div class="relative w-[132px] h-[132px] rounded-full overflow-hidden">
                    <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/d14dc069-558a-4c51-8aad-5cc237f9b61d_3840w.jpg" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Orbiting Nodes -->
            <div class="nexus-node absolute z-20 w-14 h-14 rounded-full bg-white border border-slate-200 shadow-md flex items-center justify-center text-indigo-500 pointer-events-auto"
                style="left: 220px; top: 165px;"><iconify-icon icon="solar:globus-linear"
                    class="text-2xl"></iconify-icon></div>
            <div class="nexus-node absolute z-20 w-12 h-12 rounded-full bg-white border border-slate-200 shadow-md overflow-hidden p-1 pointer-events-auto"
                style="left: 132px; top: 315px;"><img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/77415a2e-dcbc-4748-a29d-fced4821881a_800w.jpg" class="w-full h-full object-cover rounded-full">
            </div>
            <div class="nexus-node absolute z-20 w-14 h-14 rounded-full bg-white border border-slate-200 shadow-md flex items-center justify-center text-amber-500 pointer-events-auto"
                style="left: 235px; top: 570px;"><iconify-icon icon="solar:pie-chart-2-linear"
                    class="text-2xl"></iconify-icon></div>
            <div class="nexus-node absolute z-20 w-12 h-12 rounded-full bg-slate-50 border border-indigo-100 shadow-sm flex items-center justify-center pointer-events-auto"
                style="left: 545px; top: 165px;"><iconify-icon icon="solar:database-linear"
                    class="text-indigo-500 text-[20px]"></iconify-icon></div>
        </div>
    </div>

    <script>
        (function() {
            window.addEventListener('load', () => {
                if (typeof gsap !== 'undefined') {
                    gsap.registerPlugin(ScrollTrigger);
                    gsap.to(".nexus-word", { y: "0%", duration: 1.2, stagger: 0.1, ease: "power4.out", scrollTrigger: { trigger: "#nexus-reveal-title", start: "top 85%" }});
                }

                const spinner = document.getElementById('nexus-spinner');
                const ticks = document.getElementById('nexus-ticks');
                const needle = document.getElementById('nexus-needle');
                const nodes = document.querySelectorAll('.nexus-node');
                const path = document.getElementById('nexus-anim-path');
                const pt1 = document.getElementById('nexus-pt-1');
                const pt2 = document.getElementById('nexus-pt-2');
                
                let angle = 0, tickA = 0, needleA = 0;
                const pathLen = path ? path.getTotalLength() : 0;
                let prog1 = 0, prog2 = 0.5;

                function frame() {
                    angle += 0.35; tickA -= 0.04; needleA += 0.08;
                    if (spinner) spinner.style.transform = `rotate(${angle}deg)`;
                    if (ticks) ticks.style.transform = `rotate(${tickA}deg)`;
                    if (needle) needle.style.transform = `rotate(${Math.sin(needleA * 0.02) * 8}deg)`;
                    nodes.forEach((n, i) => n.style.transform = `translateY(${Math.sin(angle * 0.018 + i) * 6}px)`);

                    if (path && pt1 && pt2) {
                        prog1 = (prog1 + 0.002) % 1;
                        prog2 = (prog2 + 0.002) % 1;
                        const p1 = path.getPointAtLength(prog1 * pathLen);
                        const p2 = path.getPointAtLength(prog2 * pathLen);
                        pt1.style.left = `${(p1.x / 1200) * 100}%`; pt1.style.top = `${(p1.y / 675) * 100}%`;
                        pt1.style.opacity = Math.sin(prog1 * Math.PI);
                        pt2.style.left = `${(p2.x / 1200) * 100}%`; pt2.style.top = `${(p2.y / 675) * 100}%`;
                        pt2.style.opacity = Math.sin(prog2 * Math.PI);
                    }
                    requestAnimationFrame(frame);
                }
                frame();
            });
        })();
    </script>
</section>
