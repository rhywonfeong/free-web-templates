<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stellaris - Journey Further</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body
  class="antialiased bg-gray-100 text-white overflow-hidden h-screen relative selection:bg-white/30 selection:text-white"
  style="font-family: 'Inter', sans-serif;">

  <!-- Background Image & Overlays -->
  <div class="absolute inset-0 z-0 bg-black">
    <div id="bg-container" class="absolute inset-0 z-0"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/30 pointer-events-none"></div>
  </div>

  <!-- Main Interface Wrapper -->
  <div class="relative z-10 w-full h-full flex flex-col justify-between px-6 py-6 lg:px-12 lg:py-8">

    <!-- Header -->
    <header class="flex justify-between items-start w-full">

      <!-- Left: Menu & Model Name -->
      <div class="flex items-center gap-6 text-sm font-normal tracking-wide">
        <button class="flex flex-col justify-center gap-[6px] w-8 h-8 group focus:outline-none" aria-label="Menu">
                    <div class="w-8 h-[1px] bg-white transition-transform group-hover:translate-y-[-1px]"></div>
                    <div class="w-8 h-[1px] bg-white transition-transform group-hover:translate-y-[1px]"></div>
                </button>
        <span class="hidden md:block">Orion.X</span>
      </div>

      <!-- Center: Logo -->
      <div class="flex flex-col items-center absolute left-1/2 -translate-x-1/2 top-6 lg:top-8">
        <div class="flex gap-4 mb-1 text-white/80">
          <iconify-icon icon="solar:star-fall-minimalistic-linear" width="14" height="14"
            stroke-width="1.5"></iconify-icon>
          <iconify-icon icon="solar:star-fall-minimalistic-linear" width="14" height="14" stroke-width="1.5"
            class="transform scale-x-[-1]"></iconify-icon>
        </div>
        <span class="text-sm md:text-base tracking-[0.25em] uppercase font-medium">
                    STELLARIS
                </span>
      </div>

      <!-- Right: Navigation -->
      <nav class="hidden md:flex gap-8 text-sm font-light">
        <a href="#" class="hover:text-white/70 transition-colors">Technology</a>
        <a href="#" class="hover:text-white/70 transition-colors">Pre-order</a>
      </nav>

    </header>

    <!-- Main Center Content (Massive Typography) -->
    <main class="flex-1 flex flex-col justify-end w-full pb-16 lg:pb-24 pointer-events-none select-none">
      <h1 id="explore-title"
        class="text-[25vw] md:text-[22vw] lg:text-[20vw] leading-[0.75] tracking-tighter font-medium text-center w-full whitespace-nowrap drop-shadow-sm flex justify-center">
        Discover
      </h1>
    </main>

    <!-- Bottom Footer Bar -->
    <footer class="w-full relative">
      <div class="w-full border-t border-white/30 pt-4 flex justify-between items-end pb-2">
        <a href="#explore"
          class="text-white hover:text-white/70 transition-colors flex items-center justify-center w-8 h-8 pointer-events-auto"
          aria-label="Scroll Down">
          <iconify-icon icon="solar:arrow-down-linear" width="20" height="20" stroke-width="1.5"></iconify-icon>
        </a>

        <span class="text-xs md:text-sm font-light text-white/90 tracking-wide">
                    Scroll to explore
                </span>
      </div>
    </footer>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);

            // 1. Generate Vertical Blinds Background
            const bgContainer = document.getElementById('bg-container');
            const imageUrl = 'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?q=80&w=2560&auto=format&fit=crop';
            const numBlinds = 12;

            for (let i = 0; i < numBlinds; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = 'blind-wrapper';
                wrapper.style.position = 'absolute';
                wrapper.style.top = '0';
                wrapper.style.left = `${(i / numBlinds) * 100}%`;
                wrapper.style.width = `${100 / numBlinds}%`;
                wrapper.style.height = '100%';
                wrapper.style.overflow = 'hidden';
                wrapper.style.clipPath = 'inset(0 100% 0 0)';

                const img = document.createElement('div');
                img.style.position = 'absolute';
                img.style.top = '0';
                img.style.left = `-${i * 100}%`;
                img.style.width = `${numBlinds * 100}%`;
                img.style.height = '100%';
                img.style.backgroundImage = `url('${imageUrl}')`;
                img.style.backgroundSize = 'cover';
                img.style.backgroundPosition = 'center';

                wrapper.appendChild(img);
                bgContainer.appendChild(wrapper);
            }

            // Animate Vertical Blinds
            gsap.to('.blind-wrapper', {
                clipPath: 'inset(0 0% 0 0)',
                duration: 1.6,
                stagger: 0.06,
                ease: 'power3.inOut',
                delay: 0.2
            });

            // 2. Text Reveal Animation
            const title = document.getElementById('explore-title');
            const text = title.textContent.trim();
            title.textContent = '';
            
            title.style.perspective = '600px';

            text.split('').forEach(char => {
                const mask = document.createElement('span');
                mask.style.overflow = 'hidden';
                mask.style.display = 'inline-block';
                mask.style.paddingBottom = '0.05em'; 
                mask.style.marginBottom = '-0.05em';

                const letter = document.createElement('span');
                letter.style.display = 'inline-block';
                letter.textContent = char;
                letter.style.transformOrigin = 'left center';

                mask.appendChild(letter);
                title.appendChild(mask);
            });

            const letters = title.querySelectorAll('span > span');

            gsap.fromTo(letters,
                {
                    y: "100%",
                    opacity: 0,
                    rotationY: 8 
                },
                {
                    y: "0%",
                    opacity: 1,
                    rotationY: 0,
                    duration: 0.9,
                    stagger: 0.06,
                    ease: "power3.out",
                    delay: 0.8, // Wait for blinds to be partially revealed
                    scrollTrigger: {
                        trigger: title,
                        start: "top 95%",
                        toggleActions: "play none none reverse"
                    }
                }
            );
        });
  </script>
</body>

</html>
