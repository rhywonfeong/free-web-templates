<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommandLayer — Navigation</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <style>
    .font-sans {
      font-family: 'Inter', sans-serif !important;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace !important;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
      border: 1px solid #3f3f46;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }
  </style>
</head>

<body
  class="bg-[#0f0f11] text-[#cbd5e1] font-sans antialiased min-h-screen relative selection:bg-cyan-500/30 selection:text-cyan-200">

  <!-- Background Environment -->
  <div class="fixed inset-0 z-0 opacity-40 pointer-events-none"
    style="background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f0f11 60%);"></div>
  <div class="fixed inset-0 z-0 opacity-[0.03] pointer-events-none"></div>

  <!-- SECTION 00: Fixed Navigation -->
  <header class="fixed top-4 left-1/2 -translate-x-1/2 z-50 w-[calc(100%-2rem)] max-w-[1200px]">
    <nav
      class="bg-gradient-to-b from-[#27272a] to-[#18181b] border border-[#000] shadow-[0_1px_0_rgba(255,255,255,0.05),0_4px_12px_rgba(0,0,0,0.5)] rounded-xl px-6 py-3 flex items-center justify-between w-full relative overflow-hidden">

      <!-- Panel screws -->
      <div
        class="absolute top-2 left-2 w-1.5 h-1.5 rounded-full bg-[#0f0f11] shadow-[inset_0_1px_2px_rgba(255,255,255,0.1)] flex items-center justify-center opacity-50">
        <div class="w-1 h-px bg-[#27272a] rotate-45"></div>
      </div>
      <div
        class="absolute bottom-2 left-2 w-1.5 h-1.5 rounded-full bg-[#0f0f11] shadow-[inset_0_1px_2px_rgba(255,255,255,0.1)] flex items-center justify-center opacity-50">
        <div class="w-1 h-px bg-[#27272a] rotate-45"></div>
      </div>
      <div
        class="absolute top-2 right-2 w-1.5 h-1.5 rounded-full bg-[#0f0f11] shadow-[inset_0_1px_2px_rgba(255,255,255,0.1)] flex items-center justify-center opacity-50">
        <div class="w-1 h-px bg-[#27272a] rotate-45"></div>
      </div>
      <div
        class="absolute bottom-2 right-2 w-1.5 h-1.5 rounded-full bg-[#0f0f11] shadow-[inset_0_1px_2px_rgba(255,255,255,0.1)] flex items-center justify-center opacity-50">
        <div class="w-1 h-px bg-[#27272a] rotate-45"></div>
      </div>

      <!-- Left Brand -->
      <div class="flex items-center gap-4 relative z-10 pl-2">
        <div class="flex flex-col">
          <span class="font-mono text-[10px] uppercase tracking-widest text-slate-500 font-medium">
            SYS_STATUS
          </span>
          <div class="flex items-center gap-2">
            <div class="relative w-2 h-2 rounded-full bg-cyan-500 shadow-[0_0_10px_1px_rgba(6,182,212,0.5)]"></div>
            <span class="font-mono text-xs font-medium text-slate-200 tracking-wide">
              COMMANDLAYER
            </span>
          </div>
        </div>
      </div>

      <!-- Desktop Navigation -->
      <div
        class="hidden md:flex items-center gap-8 bg-[#131315] px-6 py-1.5 rounded border border-[#27272a] shadow-[inset_0_2px_4px_0_rgba(0,0,0,0.6),0_1px_0_0_rgba(255,255,255,0.05)]">
        <a href="#"
          class="text-xs font-mono uppercase tracking-widest text-slate-500 hover:text-cyan-400 transition-colors">
          Platform
        </a>
        <a href="#"
          class="text-xs font-mono uppercase tracking-widest text-slate-500 hover:text-cyan-400 transition-colors">
          Telemetry
        </a>
        <a href="#"
          class="text-xs font-mono uppercase tracking-widest text-slate-500 hover:text-cyan-400 transition-colors">
          Pricing
        </a>
      </div>

      <!-- Right CTA -->
      <div class="flex items-center relative z-10 pr-2 gap-3">
        <!-- Mobile button -->
        <button
          id="mobile-menu-toggle"
          class="md:hidden inline-flex items-center justify-center w-10 h-10 rounded border border-[#27272a] bg-[#131315] text-slate-300 shadow-[inset_0_2px_4px_0_rgba(0,0,0,0.6),0_1px_0_0_rgba(255,255,255,0.05)]"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="mobile-menu"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 7h16"></path>
            <path d="M4 12h16"></path>
            <path d="M4 17h16"></path>
          </svg>
        </button>

        <a href="#"
          class="hidden sm:inline-flex bg-gradient-to-b from-cyan-600 to-cyan-700 hover:from-cyan-500 hover:to-cyan-600 border-t border-cyan-400/20 shadow-[0_2px_10px_-2px_rgba(6,182,212,0.4),inset_0_1px_0_rgba(255,255,255,0.2)] active:translate-y-[1px] text-white px-5 py-2 rounded text-xs font-mono uppercase tracking-wider transition-all items-center gap-2">
          <iconify-icon icon="solar:bolt-linear" width="16"></iconify-icon>
          Initialize
        </a>
      </div>
    </nav>

    <!-- Mobile Menu -->
    <div id="mobile-menu"
      class="hidden md:hidden mt-3 rounded-xl border border-[#27272a] bg-gradient-to-b from-[#202023] to-[#131315] shadow-[0_1px_0_rgba(255,255,255,0.04),0_8px_20px_rgba(0,0,0,0.55)] overflow-hidden">
      <div class="p-3 space-y-2">
        <a href="#"
          class="flex items-center justify-between px-4 py-3 rounded border border-[#27272a] bg-[#131315] text-xs font-mono uppercase tracking-widest text-slate-400 hover:text-cyan-400 hover:border-[#3f3f46] transition-colors">
          <span>Platform</span>
          <iconify-icon icon="solar:alt-arrow-right-linear" width="14"></iconify-icon>
        </a>

        <a href="#"
          class="flex items-center justify-between px-4 py-3 rounded border border-[#27272a] bg-[#131315] text-xs font-mono uppercase tracking-widest text-slate-400 hover:text-cyan-400 hover:border-[#3f3f46] transition-colors">
          <span>Telemetry</span>
          <iconify-icon icon="solar:alt-arrow-right-linear" width="14"></iconify-icon>
        </a>

        <a href="#"
          class="flex items-center justify-between px-4 py-3 rounded border border-[#27272a] bg-[#131315] text-xs font-mono uppercase tracking-widest text-slate-400 hover:text-cyan-400 hover:border-[#3f3f46] transition-colors">
          <span>Pricing</span>
          <iconify-icon icon="solar:alt-arrow-right-linear" width="14"></iconify-icon>
        </a>

        <a href="#"
          class="mt-2 inline-flex w-full justify-center bg-gradient-to-b from-cyan-600 to-cyan-700 hover:from-cyan-500 hover:to-cyan-600 border-t border-cyan-400/20 shadow-[0_2px_10px_-2px_rgba(6,182,212,0.4),inset_0_1px_0_rgba(255,255,255,0.2)] active:translate-y-[1px] text-white px-5 py-3 rounded text-xs font-mono uppercase tracking-wider transition-all items-center gap-2">
          <iconify-icon icon="solar:bolt-linear" width="16"></iconify-icon>
          Initialize
        </a>
      </div>
    </div>
  </header>

  <!-- Demo spacing so fixed nav previews correctly -->
  <main class="relative z-10 pt-28 px-4">
    <div
      class="max-w-[1200px] mx-auto rounded-xl border border-[#27272a] bg-[#18181b] min-h-[420px] shadow-[inset_0_1px_0_0_rgba(255,255,255,0.1),0_1px_2px_0_rgba(0,0,0,0.5),0_12px_24px_0_rgba(0,0,0,0.8)] p-8">
      <div class="border border-[#27272a] bg-[#131315] rounded-lg p-8 shadow-[inset_0_4px_12px_rgba(0,0,0,0.8)]">
        <p class="font-mono text-[10px] uppercase tracking-widest text-cyan-400 mb-4">NAV_PREVIEW</p>
        <h1 class="text-3xl md:text-5xl font-medium tracking-tight text-slate-100 max-w-3xl leading-[1.1]">
          Operate AI workflows
          <br>
          like infrastructure
        </h1>
        <p class="mt-6 text-slate-400 max-w-2xl leading-relaxed">
          Placeholder content for preview only, so the fixed navigation sits in the same kind of environment as the
          original design.
        </p>
      </div>
    </div>
  </main>

  <script>
    const mobileToggle = document.getElementById('mobile-menu-toggle');
    const mobileMenu = document.getElementById('mobile-menu');

    if (mobileToggle && mobileMenu) {
      mobileToggle.addEventListener('click', () => {
        const isOpen = !mobileMenu.classList.contains('hidden');
        mobileMenu.classList.toggle('hidden');
        mobileToggle.setAttribute('aria-expanded', String(!isOpen));
      });

      document.addEventListener('click', (e) => {
        if (!mobileToggle.contains(e.target) && !mobileMenu.contains(e.target)) {
          mobileMenu.classList.add('hidden');
          mobileToggle.setAttribute('aria-expanded', 'false');
        }
      });
    }
  </script>
</body>

</html>
