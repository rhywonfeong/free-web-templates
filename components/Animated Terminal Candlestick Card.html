    <!-- Bar Animation Script -->
    <script>
        (function() {
            const candles = document.querySelectorAll('.js-anim-candle');
            const bars = document.querySelectorAll('.js-anim-bar');

            // Initialize random phases and speeds
            candles.forEach(candle => {
                candle.dataset.phase = Math.random() * Math.PI * 2;
                candle.dataset.speed = 0.0008 + Math.random() * 0.001;
            });

            bars.forEach(bar => {
                bar.dataset.phase = Math.random() * Math.PI * 2;
                bar.dataset.speed = 0.0015 + Math.random() * 0.002;
                bar.dataset.base = 35 + Math.random() * 30; // Base height %
            });

            function animate(time) {
                // Bobbing motion for the entire candlestick
                candles.forEach(candle => {
                    const phase = parseFloat(candle.dataset.phase);
                    const speed = parseFloat(candle.dataset.speed);
                    const yOffset = Math.sin(time * speed + phase) * 8;
                    candle.style.transform = `translateY(${yOffset}px)`;
                });

                // Height fluctuation for the inner bar body
                bars.forEach(bar => {
                    const phase = parseFloat(bar.dataset.phase);
                    const speed = parseFloat(bar.dataset.speed);
                    const base = parseFloat(bar.dataset.base);
                    const heightVariance = Math.sin(time * speed + phase) * 20; 
                    bar.style.height = `${base + heightVariance}%`;
                });

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        })();
    </script>
