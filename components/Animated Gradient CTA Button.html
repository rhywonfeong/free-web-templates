<div class="verd-project-cta-component" style="display: inline-block; isolation: isolate;">
  <style>
    .verd-cta-btn {
      --color-copper: #C17F59;
      --color-copper-light: #D4A07A;
      --color-gold: #C9A96E;
      --color-bg: #0F0F0E;
      --color-cream: #F5F0EB;
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);

      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.8rem;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 500;
      border-radius: 100px;
      color: var(--color-cream);
      text-decoration: none;
      overflow: hidden;
      transition: color 0.6s var(--ease-out-expo),
        box-shadow 0.6s,
        letter-spacing 0.6s var(--ease-out-expo),
        transform 0.6s var(--ease-out-expo);
      cursor: pointer;
    }

    /* Spinning Gradient Border */
    .verd-cta-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300%;
      aspect-ratio: 1;
      transform-origin: center;
      background: conic-gradient(rgba(212, 160, 122, 0.7),
          rgba(193, 127, 89, 0.25) 25%,
          rgba(201, 169, 110, 0.6) 50%,
          rgba(193, 127, 89, 0.25) 75%,
          rgba(212, 160, 122, 0.7));
      animation: verdBorderSpin 4s linear infinite;
      z-index: -2;
      transform: translate(-50%, -50%);
    }

    @keyframes verdBorderSpin {
      from {
        transform: translate(-50%, -50%) rotate(0deg);
      }

      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    /* Inner Background Mask */
    .verd-cta-btn::after {
      content: '';
      position: absolute;
      inset: 1.5px;
      border-radius: 100px;
      background: var(--color-bg);
      z-index: -1;
      transition: background 0.6s;
    }

    /* Shimmer Effect */
    .verd-cta-shimmer {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 40%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(232, 184, 148, 0.35), transparent 70%);
      animation: verdShimmer 3.5s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes verdShimmer {
      0% {
        left: -50%;
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      50% {
        left: 120%;
        opacity: 1;
      }

      65% {
        opacity: 0;
      }

      100% {
        left: 120%;
        opacity: 0;
      }
    }

    /* Hover States */
    .verd-cta-btn:hover {
      color: #fff;
      box-shadow: 0 0 25px rgba(193, 127, 89, 0.25), 0 0 60px rgba(193, 127, 89, 0.1);
      letter-spacing: 0.17em;
      transform: translateY(-2px);
    }

    .verd-cta-btn:hover::before {
      animation-duration: 2s;
    }

    .verd-cta-btn:hover::after {
      background: rgba(25, 23, 20, 0.92);
    }

    .verd-cta-btn:hover .verd-cta-shimmer {
      animation-duration: 1.8s;
    }

    .verd-cta-text {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
  </style>

  <a href="#contact" class="verd-cta-btn">
    <i class="verd-cta-shimmer"></i>
    <span class="verd-cta-text">
      Start a Project
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transition: transform 0.4s var(--ease-out-expo);">
        <path d="M5 12h14m-7-7 7 7-7 7"/>
      </style>
    </span>
  </a>

  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
</div>
