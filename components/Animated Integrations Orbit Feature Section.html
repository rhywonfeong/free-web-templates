<section class="min-h-screen flex overflow-hidden bg-slate-50/30 pt-32 pb-32 relative items-center justify-center">
  <style>
    @keyframes orbit-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes orbit-counter {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(-360deg);
      }
    }

    @keyframes logo-pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.7;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    .animate-orbit-track {
      animation: orbit-spin 28s linear infinite;
    }

    .animate-orbit-card {
      animation: orbit-counter 28s linear infinite;
    }

    .animate-logo-pulse {
      animation: logo-pulse 4s ease-in-out infinite;
    }
  </style>

  <div class="absolute top-16 left-1/2 -translate-x-1/2 text-center z-20 px-6">
    <h2 class="text-4xl md:text-5xl font-medium text-slate-900 tracking-tight mb-4">
      Connects with your stack
    </h2>
    <p class="text-lg text-slate-500">
      Orion integrates seamlessly with the tools your team already uses.
    </p>
  </div>

  <div
    class="md:scale-75 lg:scale-100 transition-transform duration-700 ease-out flex w-[800px] h-[800px] mt-40 relative scale-[0.45] items-center justify-center">

    <!-- Center Logo Sphere -->
    <div
      class="relative z-10 w-40 h-40 rounded-full bg-[#eef2f6] border border-white/80 shadow-[0_25px_60px_rgba(15,23,42,0.08),inset_8px_8px_18px_rgba(255,255,255,0.95),inset_-10px_-10px_20px_rgba(148,163,184,0.12)] flex items-center justify-center">
      <div class="absolute inset-0 rounded-full bg-white/40 blur-xl scale-110 pointer-events-none"></div>

      <div
        class="relative w-[112px] h-[112px] rounded-full border border-slate-300/40 bg-gradient-to-br from-white to-slate-100 shadow-[inset_0_2px_10px_rgba(255,255,255,0.95),0_10px_24px_rgba(15,23,42,0.04)] flex items-center justify-center animate-logo-pulse">
        <div class="relative w-[58px] h-[58px]">
          <div class="absolute inset-0 rounded-full border border-slate-400/40"></div>
          <div class="absolute inset-[7px] rounded-full border border-slate-500/25 rotate-45"></div>

          <div
            class="absolute top-1/2 left-1/2 w-4 h-4 rounded-full bg-slate-700 -translate-x-1/2 -translate-y-1/2 shadow-[0_0_0_6px_rgba(148,163,184,0.08)]">
          </div>
          <div class="absolute top-[4px] left-1/2 w-2.5 h-2.5 rounded-full bg-slate-500 -translate-x-1/2"></div>
          <div class="absolute bottom-[8px] right-[6px] w-2 h-2 rounded-full bg-slate-400"></div>
          <div class="absolute bottom-[10px] left-[7px] w-1.5 h-1.5 rounded-full bg-slate-300"></div>
        </div>
      </div>

      <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 text-center">
        <span class="text-[11px] uppercase tracking-[0.35em] text-slate-400 font-medium">ORION</span>
      </div>
    </div>

    <!-- Rotating Orbit Track -->
    <div class="absolute inset-0 rounded-full border border-slate-900/[0.03] animate-orbit-track">

      <!-- Card 1: Top -->
      <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-24 flex items-center justify-center">
        <div class="animate-orbit-card w-full">
          <div
            class="bg-white/70 backdrop-blur-xl border border-white/60 p-4 rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.04)] hover:shadow-[0_20px_40px_rgba(0,0,0,0.08)] transition-all duration-300 hover:-translate-y-1 cursor-default group">
            <div class="flex items-center gap-4">
              <div
                class="w-10 h-10 rounded-full bg-slate-100 border border-slate-200/80 flex items-center justify-center group-hover:scale-110 transition-transform">
                <svg class="w-5 h-5 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M7 18a4 4 0 1 1 .8-7.92A5 5 0 0 1 18 11a3 3 0 0 1 0 6H7Z"></path>
                </svg>
              </div>
              <div>
                <h3 class="text-sm font-medium text-slate-800 tracking-tight">
                  Cloud Infrastructure
                </h3>
                <p class="text-xs text-slate-500 font-medium">
                  AWS, GCP, Azure
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Card 2: Right -->
      <div class="absolute top-1/2 right-0 translate-x-1/2 -translate-y-1/2 w-64 h-24 flex items-center justify-center">
        <div class="animate-orbit-card w-full">
          <div
            class="bg-white/70 backdrop-blur-xl border border-white/60 p-4 rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.04)] hover:shadow-[0_20px_40px_rgba(0,0,0,0.08)] transition-all duration-300 hover:-translate-y-1 cursor-default group">
            <div class="flex items-center gap-4">
              <div
                class="w-10 h-10 rounded-full bg-slate-100 border border-slate-200/80 flex items-center justify-center group-hover:scale-110 transition-transform">
                <svg class="w-5 h-5 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                  <path d="M10.5 21h3"></path>
                </svg>
              </div>
              <div>
                <h3 class="text-sm font-medium text-slate-800 tracking-tight">
                  Incident Management
                </h3>
                <p class="text-xs text-slate-500 font-medium">
                  PagerDuty, Opsgenie
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Card 3: Bottom -->
      <div
        class="absolute bottom-0 left-1/2 -translate-x-1/2 translate-y-1/2 w-64 h-24 flex items-center justify-center">
        <div class="animate-orbit-card w-full">
          <div
            class="bg-white/70 backdrop-blur-xl border border-white/60 p-4 rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.04)] hover:shadow-[0_20px_40px_rgba(0,0,0,0.08)] transition-all duration-300 hover:-translate-y-1 cursor-default group">
            <div class="flex items-center gap-4">
              <div
                class="w-10 h-10 rounded-full bg-slate-100 border border-slate-200/80 flex items-center justify-center group-hover:scale-110 transition-transform">
                <svg class="w-5 h-5 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 19h16"></path>
                  <path d="M7 16V10"></path>
                  <path d="M12 16V6"></path>
                  <path d="M17 16v-3"></path>
                </svg>
              </div>
              <div>
                <h3 class="text-sm font-medium text-slate-800 tracking-tight">
                  Telemetry &amp; Metrics
                </h3>
                <p class="text-xs text-slate-500 font-medium">
                  Datadog, New Relic
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Card 4: Left -->
      <div class="absolute top-1/2 left-0 -translate-x-1/2 -translate-y-1/2 w-64 h-24 flex items-center justify-center">
        <div class="animate-orbit-card w-full">
          <div
            class="bg-white/70 backdrop-blur-xl border border-white/60 p-4 rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.04)] hover:shadow-[0_20px_40px_rgba(0,0,0,0.08)] transition-all duration-300 hover:-translate-y-1 cursor-default group">
            <div class="flex items-center gap-4">
              <div
                class="w-10 h-10 rounded-full bg-slate-100 border border-slate-200/80 flex items-center justify-center group-hover:scale-110 transition-transform">
                <svg class="w-5 h-5 text-slate-600" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M8 10h8"></path>
                  <path d="M8 14h5"></path>
                  <path d="M5 19l1.5-3H18a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2H6A2 2 0 0 0 4 7v7a2 2 0 0 0 2 2h.5L5 19Z">
                  </path>
                </svg>
              </div>
              <div>
                <h3 class="text-sm font-medium text-slate-800 tracking-tight">
                  Collaboration
                </h3>
                <p class="text-xs text-slate-500 font-medium">
                  Slack, Microsoft Teams
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="absolute inset-[180px] border border-slate-900/[0.02] rounded-full pointer-events-none"></div>
    <div class="absolute inset-[280px] border border-slate-900/[0.015] rounded-full pointer-events-none"></div>
  </div>
</section>
