  <!-- UI Interaction Scripts -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);

            const tl = gsap.timeline();

            // Masked Reveal for Title Letters
            tl.to(".title-char", {
                y: "0%",
                duration: 1.2,
                ease: "power4.out",
                stagger: 0.08,
                delay: 0.2
            })
            // Subheadline Reveal
            .to("#hero-sub", {
                y: "0%",
                duration: 1,
                ease: "power3.out",
                opacity: 1
            }, "-=0.8")
            // Thumbnails stagger in
            .to(".thumbnail-item", {
                y: 0,
                opacity: 1,
                duration: 1,
                stagger: 0.1,
                ease: "power3.out"
            }, "-=0.6")
            // Nav items fade in
            .fromTo(".nav-item", 
                { opacity: 0, y: -10 },
                { opacity: 1, y: 0, duration: 0.6, stagger: 0.05, ease: "power2.out" },
                "-=1.2"
            );
        });
  </script>

  <!-- 
      SKILL: Background Grid WebGL & Globe Particles 
      Implementation via Three.js
    -->
  <script type="module">
    import * as THREE from 'three';

        // Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Deep blue fog to fade out grid in distance (Mesh Gradient Dark Blue context)
        scene.fog = new THREE.FogExp2(0x03060c, 0.04);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- SKILL: Background Grid WebGL ---
        // Subtle perspective grid receding into the fog
        const gridHelper = new THREE.GridHelper(60, 60, 0x1e3a5f, 0x0a162b);
        gridHelper.position.y = -2;
        scene.add(gridHelper);

        // --- SKILL: Globe Particles ---
        // Creates a subtle planetary data-globe sitting behind the main text
        const globeGroup = new THREE.Group();
        scene.add(globeGroup);

        // Core Sphere Particles
        const sphereGeo = new THREE.BufferGeometry();
        const sphereCount = 2000;
        const spherePositions = new Float32Array(sphereCount * 3);
        const radius = 3.5;

        for(let i = 0; i < sphereCount * 3; i+=3) {
            // Random point on sphere surface
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const r = Math.cbrt(Math.random()) * radius; // Volume distribution
            
            spherePositions[i] = r * Math.sin(phi) * Math.cos(theta);
            spherePositions[i+1] = r * Math.sin(phi) * Math.sin(theta);
            spherePositions[i+2] = r * Math.cos(phi);
        }

        sphereGeo.setAttribute('position', new THREE.BufferAttribute(spherePositions, 3));
        const sphereMat = new THREE.PointsMaterial({
            size: 0.03,
            color: 0x3b82f6, // Dark blue accent
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const sphereParticles = new THREE.Points(sphereGeo, sphereMat);
        globeGroup.add(sphereParticles);

        // Outer Ring Particles
        const ringGeo = new THREE.BufferGeometry();
        const ringCount = 1000;
        const ringPositions = new Float32Array(ringCount * 3);
        const innerRadius = 4.0;
        const outerRadius = 5.5;

        for(let i = 0; i < ringCount * 3; i+=3) {
            const angle = Math.random() * Math.PI * 2;
            const r = innerRadius + Math.random() * (outerRadius - innerRadius);
            // Flatten the Y axis for a disc shape
            const yDistortion = (Math.random() - 0.5) * 0.5; 
            
            ringPositions[i] = Math.cos(angle) * r;
            ringPositions[i+1] = yDistortion;
            ringPositions[i+2] = Math.sin(angle) * r;
        }

        ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
        const ringMat = new THREE.PointsMaterial({
            size: 0.02,
            color: 0x60a5fa, // Lighter blue accent
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const ringParticles = new THREE.Points(ringGeo, ringMat);
        
        // Tilt the ring
        ringParticles.rotation.x = Math.PI / 4;
        globeGroup.add(ringParticles);

        // Position Globe behind text
        globeGroup.position.z = -2;
        globeGroup.position.y = 1;

        // Mouse Parallax Interaction
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - window.innerWidth / 2) * 0.0005;
            mouseY = (event.clientY - window.innerHeight / 2) * 0.0005;
        });

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Parallax easing
            targetX = mouseX * 0.5;
            targetY = mouseY * 0.5;
            camera.position.x += (targetX * 5 - camera.position.x) * 0.02;
            camera.position.y += (-targetY * 5 + 3 - camera.position.y) * 0.02;
            camera.lookAt(0, 0, 0);

            // Grid drift
            gridHelper.position.z = (time * 0.5) % 1;

            // Globe slow rotation & breathing
            globeGroup.rotation.y = time * 0.05;
            globeGroup.rotation.z = Math.sin(time * 0.2) * 0.05;
            sphereMat.opacity = 0.3 + Math.sin(time * 0.5) * 0.1;

            renderer.render(scene, camera);
        }

        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
  </script>
