<section id="nexus-engine-hero"
    class="bg-[#0a0a0a] text-[#ededed] overflow-hidden w-screen h-screen relative font-sans selection:bg-white/20 selection:text-white flex flex-col">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { gray: { 950: '#0a0a0a', 900: '#111111', 800: '#222222', 700: '#333333', 400: '#888888', 200: '#ededed' } }
                }
            }
        }
    </script>

    <div class="absolute inset-0 z-0 pointer-events-none"
        style="background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 60%);"></div>

    <div id="scene" class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center overflow-hidden"
        style="perspective: 800px; perspective-origin: 50% 50%;">
        <div id="tunnel" class="relative w-full h-full" style="transform-style: preserve-3d;">
            <!-- Panels injected via JavaScript -->
        </div>
    </div>

    <main class="relative z-40 flex-1 flex flex-col items-center justify-center text-center px-4 pointer-events-none">
        <div class="pointer-events-auto flex flex-col items-center">
            <a href="#"
                class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-xs font-medium text-gray-400 mb-8 hover:bg-white/10 hover:text-white transition-all backdrop-blur-md">
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                </span>
                Nexus Engine v2.0 is live
                <iconify-icon icon="solar:arrow-right-linear" class="text-[10px]"></iconify-icon>
            </a>

            <h1 class="text-4xl md:text-6xl lg:text-7xl font-medium tracking-tight text-white mb-6 max-w-4xl leading-[1.1]"
                style="text-shadow: 0 0 40px rgba(255,255,255,0.1);">
                Visualize your systems in infinite depth.
            </h1>

            <p class="text-sm md:text-base text-gray-400 mb-10 max-w-2xl leading-relaxed">
                A spatial observability platform that maps your entire microservice architecture, databases, and edge
                nodes into a unified, navigable environment.
            </p>

            <div class="flex flex-col sm:flex-row items-center gap-4 w-full sm:w-auto">
                <button class="w-full sm:w-auto px-6 py-3 rounded-md bg-white text-gray-950 font-medium text-sm hover:bg-gray-200 transition-colors shadow-[0_0_20px_rgba(255,255,255,0.1)]">
                    Deploy to Production
                </button>
                <button class="w-full sm:w-auto px-6 py-3 rounded-md bg-gray-900/50 border border-white/10 text-white font-medium text-sm hover:bg-gray-800/50 transition-colors backdrop-blur-md flex items-center justify-center gap-2">
                    <iconify-icon icon="solar:terminal-linear"></iconify-icon>
                    Read the Docs
                </button>
            </div>
        </div>
    </main>

    <div
        class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-gray-950 to-transparent z-10 pointer-events-none">
    </div>

    <script>
        (function() {
            const tunnel = document.getElementById('tunnel');
            const scene = document.getElementById('scene');
            const generators = {
                chart: () => `<div class="flex items-center justify-between mb-4"><span class="text-xs font-medium text-gray-200">Latency</span><iconify-icon icon="solar:chart-square-linear" class="text-blue-400"></iconify-icon></div><div class="flex items-end gap-1.5 h-16 w-full">${Array.from({length: 8}).map(() => `<div class="w-full bg-gray-700 hover:bg-blue-500/50 transition-colors rounded-t-sm" style="height: ${Math.random() * 60 + 20}%"></div>`).join('')}</div>`,
                stats: () => `<div class="flex flex-col gap-1"><div class="flex items-center justify-between w-full"><span class="text-xs text-gray-400 font-medium">Nodes</span><iconify-icon icon="solar:server-square-linear" class="text-gray-400"></iconify-icon></div><span class="text-3xl font-medium text-white tracking-tight mt-1">1,024</span><div class="flex items-center gap-1 text-[10px] text-emerald-400 mt-2"><iconify-icon icon="solar:trend-up-linear"></iconify-icon><span>+12.5% scaling</span></div></div>`,
                code: () => `<div class="flex items-center gap-2 mb-3 border-b border-white/5 pb-2"><iconify-icon icon="solar:code-square-linear" class="text-gray-400"></iconify-icon><span class="text-[10px] font-medium text-gray-200">router.ts</span></div><div class="font-mono text-[10px] text-gray-400 flex flex-col gap-1.5"><div class="flex gap-2"><span class="text-blue-400">export</span> <span class="text-yellow-200">handler</span> <span class="text-gray-200">=</span> <span>(req)</span></div><div class="pl-3 text-gray-200">await process(req.body);</div></div>`,
                status: () => `<div class="flex items-start justify-between"><div class="flex flex-col gap-1"><span class="text-xs font-medium text-gray-200">DB Sync</span><span class="text-[10px] text-gray-400">eu-central-1</span></div><div class="h-2 w-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.5)]"></div></div><div class="w-full bg-gray-800 h-1 rounded-full mt-4"><div class="w-[85%] h-full bg-emerald-500 rounded-full"></div></div>`,
                alert: () => `<div class="flex items-start gap-3"><div class="p-1.5 rounded bg-red-500/10 text-red-400"><iconify-icon icon="solar:danger-triangle-linear"></iconify-icon></div><div class="flex flex-col gap-0.5"><span class="text-xs font-medium text-white">Memory Spike</span><span class="text-[10px] text-gray-400 leading-tight">Pod worker-03 exceeding limits.</span></div></div>`
            };

            const panelTypes = Object.keys(generators);
            const numPanels = window.innerWidth < 768 ? 20 : 40;
            const maxDepth = 4000;
            const panels = [];

            for (let i = 0; i < numPanels; i++) {
                const el = document.createElement('div');
                const type = panelTypes[Math.floor(Math.random() * panelTypes.length)];
                el.className = 'absolute top-1/2 left-1/2 w-64 p-5 rounded-xl border border-white/5 bg-gray-900/60 backdrop-blur-md flex flex-col will-change-transform';
                if(type === 'alert') el.classList.add('border-red-500/20');
                el.innerHTML = generators[type]();
                tunnel.appendChild(el);
                const angle = Math.random() * Math.PI * 2;
                const radiusX = (window.innerWidth < 768 ? 180 : 350) + Math.random() * 400;
                const radiusY = (window.innerWidth < 768 ? 130 : 250) + Math.random() * 300;
                const x = Math.cos(angle) * radiusX;
                const y = Math.sin(angle) * radiusY;
                const z = -Math.random() * maxDepth;
                panels.push({ el, x, y, z });
            }

            let speed = 1.5;
            const cameraZ = 300;

            function animate() {
                panels.forEach(p => {
                    p.z += speed;
                    if (p.z > cameraZ) p.z -= maxDepth + cameraZ;
                    let blur = p.z < -1200 ? Math.min(6, (-p.z - 1200) / 400) : 0;
                    let opacity = p.z < -3200 ? Math.max(0, 1 - ((-p.z - 3200) / 800)) : (p.z > 0 ? Math.max(0, 1 - (p.z / cameraZ)) : 1);
                    p.el.style.transform = `translate(-50%, -50%) translate3d(${p.x}px, ${p.y}px, ${p.z}px)`;
                    p.el.style.filter = blur > 0.5 ? `blur(${blur.toFixed(1)}px)` : 'none';
                    p.el.style.opacity = opacity.toFixed(2);
                    p.el.style.zIndex = Math.round(p.z + maxDepth); 
                });
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate);

            let mouseX = 50, mouseY = 50, targetX = 50, targetY = 50;
            document.addEventListener('mousemove', (e) => {
                mouseX = 50 + ((e.clientX / window.innerWidth - 0.5) * 20);
                mouseY = 50 + ((e.clientY / window.innerHeight - 0.5) * 20);
            });

            function updateParallax() {
                targetX += (mouseX - targetX) * 0.05;
                targetY += (mouseY - targetY) * 0.05;
                scene.style.perspectiveOrigin = `${targetX.toFixed(2)}% ${targetY.toFixed(2)}%`;
                requestAnimationFrame(updateParallax);
            }
            if (window.innerWidth >= 768) requestAnimationFrame(updateParallax);
        })();
    </script>
</section>
