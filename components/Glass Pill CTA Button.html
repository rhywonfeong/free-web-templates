<style>
  .pill-btn-wrapper {
    position: relative;
    display: inline-flex;
    height: 52px;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    font-family: var(--font-body);
  }

  .pill-bg-glow {
    position: absolute;
    inset: -4px;
    background: rgba(74, 140, 255, 0);
    filter: blur(16px);
    opacity: 0;
    border-radius: 999px;
    transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 0;
    transform: translateY(2px) scale(0.95);
    pointer-events: none;
  }

  .pill-btn-wrapper:hover .pill-bg-glow {
    opacity: 1;
    background: rgba(51, 210, 255, 0.35);
    transform: translateY(4px) scale(1.02);
    filter: blur(20px);
  }

  .pill-container {
    position: relative;
    z-index: 1;
    display: flex;
    height: 100%;
    border-radius: 999px;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
  }

  .pill-btn-wrapper:hover .pill-container {
    transform: translateY(-2px);
    box-shadow: 0 14px 32px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
  }

  /* Solid Left Cap */
  .pill-cap {
    width: 48px;
    height: 100%;
    background: linear-gradient(180deg, #42424a 0%, #202025 35%, #0f0f13 100%);
    border-radius: 999px 0 0 999px;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-right: 1px solid #000;
    box-shadow:
      inset 4px 0 8px rgba(0, 0, 0, 0.4),
      inset 0 2px 4px rgba(255, 255, 255, 0.12),
      inset 0 -3px 6px rgba(0, 0, 0, 0.9);
    overflow: hidden;
    z-index: 2;
  }

  /* Cap Top Highlight */
  .pill-cap::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 6px;
    right: 2px;
    height: 16px;
    background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 70%);
    border-radius: 999px;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  /* Right Glass Section */
  .pill-glass {
    display: flex;
    align-items: center;
    padding: 0 32px 0 8px;
    height: 100%;
    background: linear-gradient(90deg, rgba(20, 24, 32, 0.7) 0%, rgba(10, 14, 20, 0.5) 100%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(51, 210, 255, 0.15);
    border-left: none;
    border-radius: 0 999px 999px 0;
    position: relative;
    box-shadow:
      inset 0 0 20px rgba(51, 210, 255, 0.05),
      inset 0 1px 1px rgba(255, 255, 255, 0.15);
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 1;
    overflow: hidden;
  }

  .pill-btn-wrapper:hover .pill-glass {
    border-color: rgba(51, 210, 255, 0.4);
    background: linear-gradient(90deg, rgba(20, 28, 40, 0.85) 0%, rgba(10, 16, 26, 0.6) 100%);
    box-shadow:
      inset 0 0 30px rgba(51, 210, 255, 0.15),
      inset 0 1px 1px rgba(255, 255, 255, 0.25);
  }

  /* Glass Top Edge Reflection */
  .pill-glass::before {
    content: '';
    position: absolute;
    top: 1px;
    left: 0;
    right: 2px;
    height: 40%;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0) 100%);
    border-radius: 0 999px 0 0;
    pointer-events: none;
  }

  /* Internal Filament Glow Source */
  .pill-inner-glow {
    position: absolute;
    left: -10px;
    top: 50%;
    transform: translateY(-50%);
    width: 40px;
    height: 40px;
    background: radial-gradient(circle, rgba(51, 210, 255, 0.4) 0%, transparent 70%);
    opacity: 0.6;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .pill-btn-wrapper:hover .pill-inner-glow {
    opacity: 1;
    width: 60px;
    height: 60px;
    background: radial-gradient(circle, rgba(51, 210, 255, 0.7) 0%, transparent 70%);
  }

  /* Inner Content Wrapper */
  .pill-content {
    display: flex;
    align-items: center;
    position: relative;
    z-index: 3;
    gap: 10px;
  }

  .pill-filament-icon {
    width: 24px;
    height: 24px;
    margin-left: -20px;
    color: rgba(255, 255, 255, 0.5);
    filter: drop-shadow(0 0 4px rgba(51, 210, 255, 0));
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    align-items: center;
  }

  .pill-btn-wrapper:hover .pill-filament-icon {
    color: rgba(255, 255, 255, 0.9);
    filter: drop-shadow(0 0 8px rgba(51, 210, 255, 0.8));
  }

  .pill-text {
    color: rgba(255, 255, 255, 0.8);
    letter-spacing: 0.5px;
    transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    text-shadow: 0 0 10px rgba(51, 210, 255, 0);
  }

  .pill-btn-wrapper:hover .pill-text {
    color: #fff;
    text-shadow: 0 0 12px rgba(51, 210, 255, 0.6);
  }
</style>

<a href="#" class="pill-btn-wrapper">
  <div class="pill-bg-glow"></div>
  <div class="pill-container">
    <div class="pill-cap"></div>
    <div class="pill-glass">
      <div class="pill-inner-glow"></div>
      <div class="pill-content">
        <div class="pill-filament-icon">

        </div>
        <span class="pill-text">Explore Platform</span>
      </div>
    </div>
  </div>
</a>
