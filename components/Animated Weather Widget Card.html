<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Weather Widget UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>

<body
    class="bg-[#10121a] text-white font-sans antialiased min-h-screen flex items-center justify-center overflow-hidden selection:bg-cyan-500/30 relative">

    <!-- Ambient Background Glows -->
    <div class="absolute top-1/2 left-1/4 -translate-y-1/2 -translate-x-1/4 w-[40vw] h-[40vw] bg-cyan-500/10 rounded-full blur-[120px] pointer-events-none z-0 ambient-glow"
        style="transform-origin: center;"></div>
    <div class="absolute top-1/2 right-1/4 -translate-y-1/2 translate-x-1/4 w-[40vw] h-[40vw] bg-purple-500/10 rounded-full blur-[120px] pointer-events-none z-0 ambient-glow"
        style="animation-delay: 2s; transform-origin: center;"></div>

    <!-- Main Container -->
    <div class="relative w-full max-w-[700px] aspect-[1.5] flex items-center justify-center p-4 sm:p-12 z-10"
        id="scene-container">

        <!-- Wireframe Bounding Box -->
        <div class="absolute inset-4 sm:inset-6 border border-white/10 rounded-xl pointer-events-none" id="wireframe"
            style="opacity: 0;">
            <!-- Top Left -->
            <div
                class="absolute -top-[5px] -left-[5px] w-[10px] h-[10px] rounded-full border border-white/40 bg-[#10121a] flex items-center justify-center">
                <div class="w-[3px] h-[3px] bg-white/60 rounded-full"></div>
            </div>
            <!-- Top Right -->
            <div
                class="absolute -top-[5px] -right-[5px] w-[10px] h-[10px] rounded-full border border-white/40 bg-[#10121a] flex items-center justify-center">
                <div class="w-[3px] h-[3px] bg-white/60 rounded-full"></div>
            </div>
            <!-- Bottom Left -->
            <div
                class="absolute -bottom-[5px] -left-[5px] w-[10px] h-[10px] rounded-full border border-white/40 bg-[#10121a] flex items-center justify-center">
                <div class="w-[3px] h-[3px] bg-white/60 rounded-full"></div>
            </div>
            <!-- Bottom Right -->
            <div
                class="absolute -bottom-[5px] -right-[5px] w-[10px] h-[10px] rounded-full border border-white/40 bg-[#10121a] flex items-center justify-center">
                <div class="w-[3px] h-[3px] bg-white/60 rounded-full"></div>
            </div>
            <!-- Top Mid -->
            <div
                class="absolute -top-[5px] left-1/2 -translate-x-1/2 w-[10px] h-[10px] rounded-full border border-white/40 bg-[#10121a] flex items-center justify-center">
                <div class="w-[3px] h-[3px] bg-white/60 rounded-full"></div>
            </div>
            <!-- Bottom Mid -->
            <div
                class="absolute -bottom-[5px] left-1/2 -translate-x-1/2 w-[10px] h-[10px] rounded-full border border-white/40 bg-[#10121a] flex items-center justify-center">
                <div class="w-[3px] h-[3px] bg-white/60 rounded-full"></div>
            </div>
            <!-- Left Mid -->
            <div
                class="absolute top-1/2 -left-[5px] -translate-y-1/2 w-[10px] h-[10px] rounded-full border border-white/40 bg-[#10121a] flex items-center justify-center">
                <div class="w-[3px] h-[3px] bg-white/60 rounded-full"></div>
            </div>
            <!-- Right Mid -->
            <div
                class="absolute top-1/2 -right-[5px] -translate-y-1/2 w-[10px] h-[10px] rounded-full border border-white/40 bg-[#10121a] flex items-center justify-center">
                <div class="w-[3px] h-[3px] bg-white/60 rounded-full"></div>
            </div>
        </div>

        <!-- Widget Card -->
        <div class="relative w-full h-full rounded-[28px] sm:rounded-[36px] overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.5)] group"
            id="widget-card" style="opacity: 0;">

            <!-- Gradient Background -->
            <div class="absolute inset-0 bg-[linear-gradient(135deg,#5ec7f7_0%,#6993ed_45%,#ab74d7_100%)] opacity-90 transition-transform duration-1000 ease-out group-hover:scale-105"
                id="card-bg"></div>

            <!-- Inner Ring Highlight -->
            <div
                class="absolute inset-0 rounded-[28px] sm:rounded-[36px] ring-1 ring-white/20 ring-inset pointer-events-none">
            </div>

            <!-- Content Container -->
            <div class="relative w-full h-full p-6 sm:p-8 flex flex-col justify-between z-10">

                <!-- Top Section -->
                <div class="flex justify-between items-start">
                    <!-- Weather Icon Box -->
                    <div class="w-20 h-20 sm:w-28 sm:h-28 rounded-[20px] sm:rounded-[24px] bg-white/10 backdrop-blur-md flex items-center justify-center relative overflow-visible shadow-xl border border-white/10 animate-item"
                        style="opacity: 0;">
                        <!-- Custom 3D-ish Weather Icon Assembly -->
                        <div
                            class="relative w-full h-full flex items-center justify-center group-hover:scale-110 transition-transform duration-500 ease-out">
                            <!-- Sun -->
                            <div
                                class="absolute w-8 h-8 sm:w-12 sm:h-12 bg-[#FFD15B] rounded-full top-2 right-2 sm:top-4 sm:right-4 z-0 shadow-[0_0_20px_rgba(255,209,91,0.6)]">
                            </div>

                            <!-- Cloud Component -->
                            <div class="absolute z-10 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 mt-1 sm:mt-2">
                                <div
                                    class="relative w-[50px] h-[26px] sm:w-[70px] sm:h-[36px] bg-[#F4F6FB] rounded-full shadow-[0_8px_16px_rgba(0,0,0,0.15)]">
                                    <!-- Left Fluff -->
                                    <div
                                        class="absolute w-[24px] h-[24px] sm:w-[34px] sm:h-[34px] bg-[#F4F6FB] rounded-full -top-[10px] left-[6px] sm:-top-[16px] sm:left-[8px]">
                                    </div>
                                    <!-- Right Fluff -->
                                    <div
                                        class="absolute w-[30px] h-[30px] sm:w-[44px] sm:h-[44px] bg-[#F4F6FB] rounded-full -top-[14px] right-[4px] sm:-top-[22px] sm:right-[6px]">
                                    </div>
                                </div>
                            </div>

                            <!-- Lightning Bolt -->
                            <div
                                class="absolute z-20 bottom-1 sm:bottom-3 text-[#FFD15B] drop-shadow-[0_2px_4px_rgba(0,0,0,0.3)]">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFD15B" stroke="#E5AC18"
                                    stroke-width="1" class="w-5 h-5 sm:w-8 sm:h-8">
                                    <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke-linejoin="round" />
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Top Right Icons -->
                    <div class="flex gap-3 sm:gap-4 text-white/80 animate-item" style="opacity: 0;">
                        <button class="hover:text-white transition-colors">
                            <iconify-icon icon="solar:nodes-linear" class="text-xl sm:text-2xl" stroke-width="1.5"></iconify-icon>
                        </button>
                        <button class="hover:text-white transition-colors">
                            <iconify-icon icon="solar:user-linear" class="text-xl sm:text-2xl" stroke-width="1.5"></iconify-icon>
                        </button>
                    </div>
                </div>

                <!-- Middle Section: Text & Toggle -->
                <div class="mt-6 sm:mt-10 relative z-20 flex-grow animate-item" style="opacity: 0;">
                    <h2 class="text-2xl sm:text-3xl font-medium tracking-tight text-white mb-2 sm:mb-4">Weather Widget
                    </h2>

                    <label class="flex items-center gap-3 cursor-pointer group/toggle w-max">
                        <span class="text-white/90 text-xs sm:text-sm font-normal">Dark Mode</span>
                        <div class="relative">
                            <input type="checkbox" class="sr-only peer" checked>
                            <!-- Track -->
                            <div class="w-9 h-5 sm:w-11 sm:h-6 bg-white/20 rounded-full peer-checked:bg-white/30 transition-colors shadow-inner border border-white/10"></div>
                            <!-- Thumb -->
                            <div class="absolute left-[2px] top-[2px] w-[16px] h-[16px] sm:w-[20px] sm:h-[20px] bg-white rounded-full shadow-md transition-all peer-checked:translate-x-[16px] sm:peer-checked:translate-x-[20px]"></div>
                        </div>
                    </label>
                </div>

                <!-- Bottom Section: Chart -->
                <div class="absolute bottom-0 left-0 w-full h-[45%] sm:h-[50%] pointer-events-none overflow-hidden">

                    <!-- Faint Vertical Bars -->
                    <div class="absolute inset-0 flex items-end justify-between px-6 sm:px-8 pb-8 opacity-10"
                        id="chart-bars">
                        <div class="w-1.5 sm:w-2 bg-white rounded-t-sm" style="height: 15%"></div>
                        <div class="w-1.5 sm:w-2 bg-white rounded-t-sm" style="height: 35%"></div>
                        <div class="w-1.5 sm:w-2 bg-white rounded-t-sm" style="height: 25%"></div>
                        <div class="w-1.5 sm:w-2 bg-white rounded-t-sm" style="height: 55%"></div>
                        <div class="w-1.5 sm:w-2 bg-white rounded-t-sm" style="height: 40%"></div>
                        <div class="w-1.5 sm:w-2 bg-white rounded-t-sm" style="height: 10%"></div>
                        <div class="w-1.5 sm:w-2 bg-white rounded-t-sm" style="height: 20%"></div>
                        <div class="w-1.5 sm:w-2 bg-white rounded-t-sm" style="height: 45%"></div>
                        <div class="w-1.5 sm:w-2 bg-white rounded-t-sm" style="height: 70%"></div>
                        <div class="w-1.5 sm:w-2 bg-white rounded-t-sm" style="height: 30%"></div>
                    </div>

                    <!-- SVG Line Chart -->
                    <svg viewBox="0 0 600 150" class="absolute bottom-0 left-0 w-full h-[120%] sm:h-[110%] preserve-3d"
                        preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="fillGrad" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="white" stop-opacity="0.3" />
                                <stop offset="100%" stop-color="white" stop-opacity="0.0" />
                            </linearGradient>
                            <filter id="glowLine" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="2" result="blur" />
                                <feComposite in="SourceGraphic" in2="blur" operator="over" />
                            </filter>
                        </defs>

                        <!-- Filled Area under curve -->
                        <path id="chart-fill"
                            d="M 60,110 C 80,110 90,90 110,90 C 130,90 140,110 160,110 C 180,110 190,120 210,120 C 240,120 250,90 270,90 C 290,90 300,30 310,30 C 320,30 330,110 340,110 C 370,110 400,110 420,110 C 440,110 450,70 470,60 L 470,160 L 60,160 Z"
                            fill="url(#fillGrad)" style="opacity: 0; transform-origin: bottom; transform: scaleY(0);" />

                        <!-- The Glowing Line -->
                        <path id="chart-line"
                            d="M 60,110 C 80,110 90,90 110,90 C 130,90 140,110 160,110 C 180,110 190,120 210,120 C 240,120 250,90 270,90 C 290,90 300,30 310,30 C 320,30 330,110 340,110 C 370,110 400,110 420,110 C 440,110 450,70 470,60"
                            fill="none" stroke="white" stroke-width="1.5" filter="url(#glowLine)" />
                    </svg>

                    <!-- Chart Data Dots (Absolute positioned for easy animation control) -->
                    <div id="chart-dots" class="absolute inset-0">
                        <!-- Positions relative to container matching SVG curve roughly -->
                        <div class="chart-dot absolute bottom-[35%] left-[17%] w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full border border-white bg-[#8c82df] shadow-[0_0_8px_rgba(255,255,255,0.8)]"
                            style="opacity: 0; transform: scale(0);"></div>
                        <div class="chart-dot absolute bottom-[21%] left-[25.5%] w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full border border-white bg-[#8c82df] shadow-[0_0_8px_rgba(255,255,255,0.8)]"
                            style="opacity: 0; transform: scale(0);"></div>
                        <div class="chart-dot absolute bottom-[14%] left-[34%] w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full border border-white bg-[#8c82df] shadow-[0_0_8px_rgba(255,255,255,0.8)]"
                            style="opacity: 0; transform: scale(0);"></div>
                        <div class="chart-dot absolute bottom-[35%] left-[44%] w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full border border-white bg-[#8c82df] shadow-[0_0_8px_rgba(255,255,255,0.8)]"
                            style="opacity: 0; transform: scale(0);"></div>
                        <div class="chart-dot absolute bottom-[77%] left-[51%] w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full border border-white bg-[#8c82df] shadow-[0_0_8px_rgba(255,255,255,0.8)]"
                            style="opacity: 0; transform: scale(0);"></div>
                        <div class="chart-dot absolute bottom-[21%] left-[56%] w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full border border-white bg-[#8c82df] shadow-[0_0_8px_rgba(255,255,255,0.8)]"
                            style="opacity: 0; transform: scale(0);"></div>
                        <div class="chart-dot absolute bottom-[21%] left-[69%] w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full border border-white bg-[#8c82df] shadow-[0_0_8px_rgba(255,255,255,0.8)]"
                            style="opacity: 0; transform: scale(0);"></div>
                        <div class="chart-dot absolute bottom-[56%] left-[77%] w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full border border-white bg-[#8c82df] shadow-[0_0_8px_rgba(255,255,255,0.8)]"
                            style="opacity: 0; transform: scale(0);"></div>
                    </div>

                    <!-- Temperature Text -->
                    <div class="absolute left-6 sm:left-8 bottom-[20%] text-white font-medium text-sm sm:text-base animate-item"
                        style="opacity: 0;">2°C</div>
                </div>

                <!-- Add City Button Area -->
                <div class="absolute bottom-6 right-6 sm:bottom-8 sm:right-8 flex flex-col items-center gap-1.5 sm:gap-2 z-30"
                    id="add-city" style="opacity: 0;">
                    <button class="w-12 h-12 sm:w-14 sm:h-14 rounded-full border border-white/40 bg-white/10 backdrop-blur-sm flex items-center justify-center relative cursor-pointer shadow-lg group hover:bg-white/20 transition-all duration-300">
                        <iconify-icon icon="solar:user-bold" class="text-white/80 text-2xl sm:text-3xl group-hover:scale-105 transition-transform"></iconify-icon>
                        
                        <!-- Plus Badge -->
                        <div class="absolute -top-0.5 -right-0.5 sm:-top-1 sm:-right-1 w-4 h-4 sm:w-5 sm:h-5 bg-white/20 backdrop-blur-md rounded-full border border-white/50 flex items-center justify-center text-white shadow-sm">
                            <iconify-icon icon="solar:add-linear" class="text-[10px] sm:text-xs"></iconify-icon>
                        </div>
                    </button>
                    <span class="text-[10px] sm:text-xs text-white/90 font-medium">Add City</span>
                </div>

            </div>
        </div>
    </div>

    <!-- Inline script for precise, sequencing animations using Web Animations API to avoid style tags -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Setup Chart Line drawing
            const chartLine = document.getElementById('chart-line');
            const pathLength = chartLine.getTotalLength();
            chartLine.style.strokeDasharray = pathLength;
            chartLine.style.strokeDashoffset = pathLength;

            // Easing functions
            const easeOutCubic = 'cubic-bezier(0.215, 0.61, 0.355, 1)';
            const easeOutBack = 'cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            const easeInOutSine = 'cubic-bezier(0.445, 0.05, 0.55, 0.95)';

            // 1. Ambient Glow Animation
            const glows = document.querySelectorAll('.ambient-glow');
            glows.forEach((glow, index) => {
                glow.animate([
                    { transform: 'scale(1) translate(0px, 0px)', opacity: 0.5 },
                    { transform: 'scale(1.1) translate(20px, -20px)', opacity: 0.8 },
                    { transform: 'scale(0.95) translate(-10px, 10px)', opacity: 0.4 },
                    { transform: 'scale(1) translate(0px, 0px)', opacity: 0.5 }
                ], {
                    duration: 15000 + (index * 2000),
                    iterations: Infinity,
                    easing: easeInOutSine,
                    delay: index * -5000 // offset start
                });
            });

            // 2. Wireframe Entrance
            document.getElementById('wireframe').animate([
                { opacity: 0, transform: 'scale(0.9)' },
                { opacity: 1, transform: 'scale(1)' }
            ], { duration: 1000, easing: easeOutCubic, fill: 'forwards', delay: 200 });

            // 3. Main Card Entrance
            document.getElementById('widget-card').animate([
                { opacity: 0, transform: 'translateY(40px) scale(0.95) rotateX(-10deg)' },
                { opacity: 1, transform: 'translateY(0) scale(1) rotateX(0deg)' }
            ], { duration: 1200, easing: easeOutBack, fill: 'forwards', delay: 400 });

            // 4. Inner Elements Staggered Fade In
            const items = document.querySelectorAll('.animate-item');
            items.forEach((item, index) => {
                item.animate([
                    { opacity: 0, transform: 'translateY(15px)' },
                    { opacity: 1, transform: 'translateY(0)' }
                ], { duration: 800, easing: easeOutCubic, fill: 'forwards', delay: 800 + (index * 150) });
            });

            // 5. Chart Animation Sequence
            const chartDelay = 1300;
            
            // Line draw
            chartLine.animate([
                { strokeDashoffset: pathLength },
                { strokeDashoffset: 0 }
            ], { duration: 2000, easing: easeOutCubic, fill: 'forwards', delay: chartDelay });

            // Fill fade up
            document.getElementById('chart-fill').animate([
                { opacity: 0, transform: 'scaleY(0)' },
                { opacity: 1, transform: 'scaleY(1)' }
            ], { duration: 1500, easing: easeOutCubic, fill: 'forwards', delay: chartDelay + 400 });

            // Dots pop in along the line
            const dots = document.querySelectorAll('.chart-dot');
            dots.forEach((dot, index) => {
                dot.animate([
                    { opacity: 0, transform: 'scale(0)' },
                    { opacity: 1, transform: 'scale(1)' }
                ], { duration: 400, easing: easeOutBack, fill: 'forwards', delay: chartDelay + 500 + (index * 150) });
            });

            // 6. Add City Button Pop
            document.getElementById('add-city').animate([
                { opacity: 0, transform: 'scale(0.5) translateY(20px)' },
                { opacity: 1, transform: 'scale(1) translateY(0)' }
            ], { duration: 800, easing: easeOutBack, fill: 'forwards', delay: 2200 });

        });
    </script>
</body>

</html>
