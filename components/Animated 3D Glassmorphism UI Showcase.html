<div
  class="fixed inset-0 w-full h-full flex items-center justify-center bg-[#4a4e59] overflow-hidden font-sans text-slate-200 antialiased font-medium selection:bg-purple-500/30">
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

  <!-- Ambient Background Light -->
  <div
    class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.08)_0%,transparent_60%)] pointer-events-none">
  </div>

  <!-- Main Container with Perspective -->
  <div class="relative w-full max-w-[320px] sm:max-w-[450px] aspect-square flex items-center justify-center"
    style="perspective: 2000px;">

    <!-- 3D Rotated Wrapper -->
    <div class="w-full h-full relative reveal-anim"
      style="transform-style: preserve-3d; transform: rotateX(40deg) rotateZ(-20deg) scale(0.8); opacity: 0; transition: all 2.2s cubic-bezier(0.23, 1, 0.32, 1); will-change: transform, opacity;"
      data-target-transform="rotateX(55deg) rotateZ(-40deg) scale(1)" data-target-opacity="1">

      <!-- Bottom Blue Layer -->
      <div
        class="absolute w-[90%] h-[90%] bottom-0 right-0 bg-[#3b82f6]/40 backdrop-blur-xl rounded-[2.5rem] border border-white/20 shadow-[0_40px_80px_rgba(0,0,0,0.6)] reveal-anim"
        style="transform: translateZ(0px); transition: transform 2s cubic-bezier(0.23, 1, 0.32, 1) 0.6s; will-change: transform;"
        data-target-transform="translateZ(-70px)">
      </div>

      <!-- Mid Purple Layer -->
      <div
        class="absolute w-[95%] h-[95%] top-[2%] left-[2%] bg-[#a855f7]/40 backdrop-blur-xl rounded-[3rem] border border-white/30 shadow-[0_20px_40px_rgba(0,0,0,0.3)] reveal-anim"
        style="transform: translateZ(0px); transition: transform 2s cubic-bezier(0.23, 1, 0.32, 1) 0.5s; will-change: transform;"
        data-target-transform="translateZ(-20px)">
      </div>

      <!-- Mid Pink Layer -->
      <div
        class="absolute w-[85%] h-[85%] bottom-[8%] left-[5%] bg-[#ec4899]/40 backdrop-blur-xl rounded-[2.5rem] border border-white/40 shadow-[0_10px_30px_rgba(0,0,0,0.2)] reveal-anim"
        style="transform: translateZ(0px); transition: transform 2s cubic-bezier(0.23, 1, 0.32, 1) 0.4s; will-change: transform;"
        data-target-transform="translateZ(30px)">
        <div
          class="absolute -right-3 top-1/4 bg-[#eab308] p-1.5 rounded-lg shadow-lg border border-white/30 flex items-center justify-center transform rotate-12">
          <iconify-icon icon="solar:star-linear" class="text-white text-sm"></iconify-icon>
        </div>
      </div>

      <!-- Floating Orange Panel -->
      <div
        class="absolute w-[25%] h-[40%] top-[30%] -left-[10%] bg-[#f97316]/60 backdrop-blur-xl rounded-2xl border border-white/30 shadow-[0_20px_40px_rgba(0,0,0,0.4)] reveal-anim"
        style="transform: translateZ(0px); opacity: 0; transition: all 2s cubic-bezier(0.23, 1, 0.32, 1) 0.7s; will-change: transform, opacity;"
        data-target-transform="translateZ(60px)" data-target-opacity="1">
      </div>

      <!-- Top Cyan Layer -->
      <div
        class="absolute w-[105%] h-[105%] -top-[2%] -right-[2%] bg-[#2dd4bf]/25 backdrop-blur-md rounded-[3.5rem] border-[3px] border-white/40 shadow-[inset_0_0_30px_rgba(255,255,255,0.2),0_10px_30px_rgba(0,0,0,0.1)] reveal-anim"
        style="transform: translateZ(0px); transition: transform 2s cubic-bezier(0.23, 1, 0.32, 1) 0.3s; will-change: transform;"
        data-target-transform="translateZ(80px)">
        <div
          class="absolute bottom-[15%] right-[10%] w-3 h-3 bg-white rounded-full shadow-[0_0_15px_white] animate-pulse">
        </div>
      </div>

      <!-- Center Core UI Box -->
      <div
        class="absolute w-[45%] h-[45%] top-[27.5%] left-[27.5%] bg-[#0f172a]/95 backdrop-blur-3xl rounded-[1.5rem] border border-[#a855f7]/50 shadow-[0_30px_60px_rgba(0,0,0,0.7),0_0_50px_rgba(168,85,247,0.2)] flex flex-col p-3 sm:p-4 reveal-anim"
        style="transform: translateZ(0px) scale(0.6); opacity: 0; transition: all 1.8s cubic-bezier(0.23, 1, 0.32, 1) 0.9s; will-change: transform, opacity;"
        data-target-transform="translateZ(130px) scale(1)" data-target-opacity="1">
        <div class="flex gap-1.5 sm:gap-2 mb-2 sm:mb-3">
          <div class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#f97316]"></div>
          <div class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-[#22c55e]"></div>
          <div class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-white/40"></div>
          <div class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-white/20 ml-auto"></div>
        </div>
        <div
          class="flex-1 bg-gradient-to-b from-[#3b82f6] to-[#2563eb] rounded-xl shadow-[inset_0_2px_10px_rgba(255,255,255,0.3)] flex items-center justify-center relative overflow-hidden group">
          <div
            class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEuNSIgZmlsbD0iI2ZmZmZmZjE1Ii8+PC9zdmc+')] opacity-50">
          </div>
          <iconify-icon icon="solar:refresh-square-linear"
            class="text-white text-5xl sm:text-6xl drop-shadow-lg relative z-10 transition-transform duration-1000 group-hover:rotate-180"></iconify-icon>
        </div>
      </div>

      <!-- Decorative Paths -->
      <div
        class="absolute w-[120%] h-[120%] -top-[10%] -left-[10%] rounded-[3rem] border-2 border-white/80 border-dashed opacity-30 pointer-events-none reveal-anim"
        style="transform: translateZ(0px); opacity: 0; transition: all 2s ease-out 1.2s;"
        data-target-transform="translateZ(50px)" data-target-opacity="0.4">
      </div>
      <div
        class="absolute w-[110%] h-[110%] -top-[5%] -left-[5%] rounded-[2.5rem] border-2 border-white pointer-events-none drop-shadow-[0_0_8px_rgba(255,255,255,0.6)] reveal-anim"
        style="transform: translateZ(0px) rotateZ(5deg); opacity: 0; transition: all 2.5s cubic-bezier(0.23, 1, 0.32, 1) 1.4s;"
        data-target-transform="translateZ(100px) rotateZ(5deg)" data-target-opacity="1">
      </div>
    </div>
  </div>

  <!-- 2D Overlay Elements -->
  <div class="absolute inset-0 w-full h-full max-w-6xl mx-auto pointer-events-none z-20 overflow-hidden">
    <div
      class="absolute top-[15%] right-[5%] sm:top-[20%] sm:right-[15%] lg:right-[20%] bg-[#1c1e24]/90 backdrop-blur-xl p-3 sm:p-4 rounded-2xl border border-white/10 shadow-[0_20px_40px_rgba(0,0,0,0.5)] flex items-start gap-3 w-[180px] sm:w-[220px] reveal-anim pointer-events-auto"
      style="transform: translateX(40px); opacity: 0; transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1) 1.5s;"
      data-target-transform="translateX(0)" data-target-opacity="1">
      <div
        class="mt-0.5 w-7 h-7 rounded-lg bg-[#2dd4bf]/20 flex items-center justify-center shrink-0 border border-[#2dd4bf]/30">
        <iconify-icon icon="solar:document-add-linear" class="text-[#2dd4bf] text-base"></iconify-icon>
      </div>
      <div class="flex flex-col gap-1.5 w-full mt-1">
        <div class="w-full h-2 bg-white/30 rounded-full"></div>
        <div class="w-2/3 h-2 bg-white/10 rounded-full"></div>
      </div>
    </div>

    <div
      class="absolute top-[40%] left-[5%] sm:left-[10%] lg:left-[15%] bg-[#1c1e24]/90 backdrop-blur-xl p-3 rounded-2xl border border-white/10 shadow-[0_20px_40px_rgba(0,0,0,0.5)] flex items-center gap-3 w-[160px] sm:w-[200px] reveal-anim pointer-events-auto"
      style="transform: translateX(-40px); opacity: 0; transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1) 1.7s;"
      data-target-transform="translateX(0)" data-target-opacity="1">
      <div
        class="w-8 h-8 rounded-xl bg-gradient-to-br from-[#ec4899] to-[#8b5cf6] flex items-center justify-center shrink-0 shadow-inner">
        <iconify-icon icon="solar:layers-minimalistic-linear" class="text-white text-lg"></iconify-icon>
      </div>
      <div class="flex flex-col gap-1.5 w-full">
        <div class="w-full h-2 bg-white/30 rounded-full"></div>
        <div class="w-1/2 h-2 bg-white/10 rounded-full"></div>
      </div>
    </div>

    <div
      class="absolute bottom-[20%] right-[10%] sm:bottom-[25%] sm:right-[20%] lg:right-[25%] bg-[#1c1e24]/90 backdrop-blur-xl p-4 rounded-2xl border border-white/10 shadow-[0_20px_40px_rgba(0,0,0,0.5)] flex flex-col gap-3.5 w-[220px] sm:w-[260px] reveal-anim pointer-events-auto"
      style="transform: translateY(40px); opacity: 0; transition: all 1.2s cubic-bezier(0.23, 1, 0.32, 1) 1.9s;"
      data-target-transform="translateY(0)" data-target-opacity="1">
      <div class="flex items-center gap-3">
        <div
          class="w-7 h-7 rounded-full bg-[#3b82f6] flex items-center justify-center shrink-0 border-2 border-white/20 shadow-md">
          <iconify-icon icon="solar:user-linear" class="text-white text-sm"></iconify-icon>
        </div>
        <div class="flex flex-col gap-1.5 w-full">
          <div class="w-full h-2 bg-white/30 rounded-full"></div>
          <div class="w-1/2 h-2 bg-white/10 rounded-full"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
            requestAnimationFrame(() => {
                setTimeout(() => {
                    const elements = document.querySelectorAll('.reveal-anim');
                    elements.forEach(el => {
                        if (el.dataset.targetOpacity !== undefined) el.style.opacity = el.dataset.targetOpacity;
                        if (el.dataset.targetTransform !== undefined) el.style.transform = el.dataset.targetTransform;
                    });
                }, 100);
            });
        });
  </script>
</div>
