<style>
  .hero-asset {
    animation: heroFadeUp 1s cubic-bezier(.22, 1, .36, 1) both;
  }

  .hero-glow {
    animation: glowPulse 5.5s ease-in-out infinite;
  }

  .hero-badge {
    animation: softFloat 4.5s ease-in-out infinite;
  }

  .hero-title {
    animation: heroFadeUp 1s cubic-bezier(.22, 1, .36, 1) 0.08s both;
  }

  .hero-copy {
    animation: heroFadeUp 1s cubic-bezier(.22, 1, .36, 1) 0.16s both;
  }

  .hero-cta {
    position: relative;
    overflow: hidden;
    animation: heroFadeUp 1s cubic-bezier(.22, 1, .36, 1) 0.24s both;
  }

  .hero-cta::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg,
        transparent 0%,
        transparent 35%,
        rgba(255, 255, 255, 0.08) 50%,
        transparent 65%,
        transparent 100%);
    transform: translateX(-130%);
    animation: ctaShimmer 4.8s linear infinite;
    pointer-events: none;
  }

  .hero-compass-wrap {
    perspective: 1200px;
  }

  .compass-float {
    animation: compassFloat 6s ease-in-out infinite;
    transform-style: preserve-3d;
    will-change: transform;
  }

  #compass-dial {
    transition: transform 0.18s ease-out;
    transform-origin: center;
    will-change: transform;
  }

  #display-degree,
  #display-dir {
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  #dial-ticks line {
    animation: tickPulse 3.2s ease-in-out infinite;
  }

  #dial-labels {
    animation: dialLabelsPulse 4s ease-in-out infinite;
  }

  @keyframes heroFadeUp {
    from {
      opacity: 0;
      transform: translateY(24px);
      filter: blur(8px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  @keyframes softFloat {

    0%,
    100% {
      transform: translateY(0px);
    }

    50% {
      transform: translateY(-8px);
    }
  }

  @keyframes glowPulse {

    0%,
    100% {
      opacity: 0.4;
      transform: translate(-50%, -50%) scale(0.96);
      filter: blur(100px);
    }

    50% {
      opacity: 0.8;
      transform: translate(-50%, -50%) scale(1.08);
      filter: blur(118px);
    }
  }

  @keyframes compassFloat {

    0%,
    100% {
      transform: translateY(0px) rotateX(0deg) rotateY(0deg);
    }

    50% {
      transform: translateY(-10px) rotateX(2deg) rotateY(-2deg);
    }
  }

  @keyframes ctaShimmer {
    0% {
      transform: translateX(-130%);
    }

    100% {
      transform: translateX(130%);
    }
  }

  @keyframes tickPulse {

    0%,
    100% {
      opacity: 0.7;
    }

    50% {
      opacity: 1;
    }
  }

  @keyframes dialLabelsPulse {

    0%,
    100% {
      opacity: 0.75;
    }

    50% {
      opacity: 1;
    }
  }
</style>

<script>
  (() => {
    const container = document.getElementById("hero-compass-container");
    const dial = document.getElementById("compass-dial");
    const degreeText = document.getElementById("display-degree");
    const dirText = document.getElementById("display-dir");
    const floatLayer = container?.querySelector(".compass-float");

    if (!container || !dial || !degreeText || !dirText || !floatLayer) return;

    const directions = [
      "N", "NNE", "NE", "ENE",
      "E", "ESE", "SE", "SSE",
      "S", "SSW", "SW", "WSW",
      "W", "WNW", "NW", "NNW"
    ];

    let targetAngle = 359;
    let currentAngle = 359;
    let isHovering = false;
    let rafId = null;

    function getDirectionLabel(angle) {
      const normalized = ((angle % 360) + 360) % 360;
      const index = Math.round(normalized / 22.5) % 16;
      return directions[index];
    }

    function updateReadout(angle) {
      const normalized = ((angle % 360) + 360) % 360;
      degreeText.textContent = `${Math.round(normalized)}°`;
      dirText.textContent = getDirectionLabel(normalized);
    }

    function animate() {
      if (!isHovering) {
        targetAngle += 0.08;
      }

      currentAngle += (targetAngle - currentAngle) * 0.08;

      const normalized = ((currentAngle % 360) + 360) % 360;
      dial.style.transform = `rotate(${normalized}deg)`;
      updateReadout(normalized);

      rafId = requestAnimationFrame(animate);
    }

    function handleMove(e) {
      const rect = container.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const dx = e.clientX - cx;
      const dy = e.clientY - cy;

      const angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
      targetAngle = angle;

      const rotateY = Math.max(-8, Math.min(8, dx / 24));
      const rotateX = Math.max(-8, Math.min(8, -dy / 24));

      floatLayer.style.transform = `translateY(-6px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    }

    function handleEnter() {
      isHovering = true;
    }

    function handleLeave() {
      isHovering = false;
      floatLayer.style.transform = "";
    }

    container.addEventListener("mousemove", handleMove);
    container.addEventListener("mouseenter", handleEnter);
    container.addEventListener("mouseleave", handleLeave);

    if (!rafId) animate();
  })();
</script>
