<div
    class="bg-[#111322] min-h-screen text-white font-sans overflow-hidden flex flex-col justify-center items-center relative selection:bg-cyan-500/30">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

    <!-- Background Ambient Glow -->
    <div
        class="absolute bottom-0 left-1/2 -translate-x-1/2 w-[800px] h-[300px] bg-cyan-500/10 blur-[100px] rounded-[100%] pointer-events-none">
    </div>

    <!-- Header / Logo -->
    <div class="absolute top-8 left-8 flex items-center gap-3 z-50 transition-all duration-1000 ease-out opacity-0 -translate-x-4"
        id="logo-container">
        <div class="relative w-8 h-8 flex items-center justify-center">
            <div
                class="absolute w-5 h-5 rounded-full border-[2.5px] border-cyan-400 -top-0.5 -left-0.5 mix-blend-screen">
            </div>
            <div class="absolute w-5 h-5 rounded-full border-[2.5px] border-blue-500 bottom-0 right-0 mix-blend-screen">
            </div>
            <div class="absolute w-1.5 h-1.5 bg-white rounded-full bottom-1 left-1"></div>
        </div>
        <h1 class="text-xl font-medium tracking-tight text-gray-100">Soml Lunt</h1>
    </div>

    <!-- Main Interactive Stage -->
    <div
        class="relative w-[800px] h-[600px] scale-[0.45] sm:scale-75 lg:scale-100 origin-center transition-transform duration-700 flex items-center justify-center">

        <!-- Central Glowing Orb -->
        <div class="relative w-64 h-64 z-30 flex items-center justify-center transition-all duration-1000 ease-out scale-90 opacity-0"
            id="center-orb">
            <div class="absolute inset-[-30px] bg-gradient-to-br from-purple-600/60 via-transparent to-cyan-400/60 rounded-full blur-[40px] animate-spin"
                style="animation-duration: 12s;"></div>
            <div
                class="absolute inset-0 rounded-full p-[3px] bg-gradient-to-br from-purple-500 via-blue-500 to-cyan-300 shadow-[0_0_50px_rgba(0,240,255,0.4),inset_0_0_20px_rgba(168,85,247,0.4)]">
                <div
                    class="w-full h-full bg-[#0d0f1a] rounded-full shadow-[inset_0_0_60px_rgba(0,0,0,0.9)] flex items-center justify-center relative overflow-hidden">
                    <div
                        class="absolute top-[-20%] left-[-20%] w-[140%] h-[140%] bg-gradient-to-br from-white/5 to-transparent rounded-full blur-md mix-blend-overlay">
                    </div>
                </div>
            </div>
        </div>

        <!-- Top Card: Bachving -->
        <div class="absolute bottom-[calc(50%+4rem)] left-1/2 -translate-x-1/2 w-[220px] h-[260px] bg-[#1a1f35]/60 backdrop-blur-xl border border-white/10 rounded-3xl p-5 z-20 shadow-2xl transition-all duration-1000 delay-300 ease-out translate-y-8 opacity-0 flex flex-col"
            id="card-top">
            <h2 class="text-sm font-medium tracking-tight text-gray-100 mb-4">Bachving</h2>
            <div class="flex-1 w-full relative flex flex-col justify-end">
                <div
                    class="absolute left-0 top-0 bottom-6 flex flex-col justify-between text-[9px] text-gray-400 font-mono">
                    <span>10</span><span>13</span><span>13</span><span>13</span>
                </div>
                <div
                    class="absolute left-6 right-0 bottom-0 flex justify-between text-[9px] text-gray-400 font-mono border-t border-white/10 pt-1">
                    <span>09</span><span>00</span><span>00</span><span>00</span><span>00</span><span>00</span>
                </div>
                <div
                    class="ml-6 mb-6 h-full flex items-end justify-between border-b border-l border-white/10 pb-1 pl-1">
                    <div class="w-2.5 bg-gradient-to-t from-cyan-600 to-cyan-300 h-[30%] rounded-sm"></div>
                    <div class="w-2.5 bg-gradient-to-t from-cyan-600 to-cyan-300 h-[25%] rounded-sm"></div>
                    <div class="w-2.5 bg-gradient-to-t from-cyan-600 to-cyan-300 h-[45%] rounded-sm"></div>
                    <div class="w-2.5 bg-gradient-to-t from-cyan-600 to-cyan-300 h-[65%] rounded-sm"></div>
                    <div class="w-2.5 bg-gradient-to-t from-cyan-600 to-cyan-300 h-[40%] rounded-sm"></div>
                    <div class="w-2.5 bg-gradient-to-t from-cyan-600 to-cyan-300 h-[80%] rounded-sm"></div>
                </div>
            </div>
            <div
                class="absolute -bottom-8 left-1/2 -translate-x-1/2 w-16 h-16 rounded-full border-[1.5px] border-white/10 border-t-transparent mix-blend-screen pointer-events-none">
            </div>
        </div>

        <!-- Bottom Left Card: Locttiun -->
        <div class="absolute right-[calc(50%+3rem)] top-[calc(50%-1rem)] w-[280px] h-[160px] bg-[#1a1f35]/60 backdrop-blur-xl border border-white/10 rounded-3xl p-5 z-20 shadow-2xl transition-all duration-1000 delay-500 ease-out translate-x-8 opacity-0 flex flex-col"
            id="card-left">
            <button class="absolute -left-4 top-4 w-8 h-8 rounded-full bg-[#2a2e45] border border-white/10 shadow-lg flex items-center justify-center hover:bg-white/10 transition-colors cursor-pointer group">
                <iconify-icon icon="solar:list-linear" class="text-white text-lg group-hover:scale-110 transition-transform"></iconify-icon>
            </button>
            <h2 class="text-sm font-medium tracking-tight text-gray-100 mb-2">Locttiun</h2>
            <div class="flex-1 w-full relative">
                <div
                    class="absolute left-0 top-0 bottom-4 flex flex-col justify-between text-[9px] text-gray-400 font-mono">
                    <span>10</span><span>90</span><span>90</span><span>80</span>
                </div>
                <div
                    class="absolute left-5 right-0 bottom-0 flex justify-between text-[9px] text-gray-400 font-mono border-t border-white/10 pt-1">
                    <span>09</span><span>00</span><span>00</span><span>00</span><span>00</span>
                </div>
                <div class="absolute left-5 right-0 top-0 bottom-4 border-b border-l border-white/10">
                    <svg class="w-full h-full overflow-visible" viewBox="0 0 100 50" preserveAspectRatio="none">
                        <defs>
                            <linearGradient id="cyanArea" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3" />
                                <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
                            </linearGradient>
                            <linearGradient id="blueArea" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
                                <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
                            </linearGradient>
                        </defs>
                        <path d="M0,45 Q25,10 50,25 T100,10 L100,50 L0,50 Z" fill="url(#blueArea)" />
                        <path d="M0,25 Q20,50 40,20 T80,35 T100,20 L100,50 L0,50 Z" fill="url(#cyanArea)" />
                    </svg>
                </div>
            </div>
            <div
                class="absolute -right-8 top-1/2 -translate-y-1/2 w-16 h-16 rounded-full border-[1.5px] border-white/10 border-l-transparent mix-blend-screen pointer-events-none">
            </div>
        </div>

        <!-- Bottom Right Card: Suders -->
        <div class="absolute left-[calc(50%+3rem)] top-[calc(50%-1rem)] w-[280px] h-[160px] bg-[#1a1f35]/60 backdrop-blur-xl border border-white/10 rounded-3xl p-5 z-20 shadow-2xl transition-all duration-1000 delay-[700ms] ease-out -translate-x-8 opacity-0 flex flex-col"
            id="card-right">
            <button class="absolute -right-4 -bottom-4 w-8 h-8 rounded-full bg-[#2a2e45] border border-white/10 shadow-lg flex items-center justify-center hover:bg-white/10 transition-colors cursor-pointer group">
                <iconify-icon icon="solar:maximize-square-linear" class="text-white text-lg group-hover:scale-110 transition-transform"></iconify-icon>
            </button>
            <h2 class="text-sm font-medium tracking-tight text-gray-100 mb-2">Suders</h2>
            <div class="flex-1 w-full relative flex flex-col justify-end">
                <div
                    class="absolute left-2 right-2 bottom-0 flex justify-between text-[9px] text-gray-400 font-mono border-t border-white/10 pt-1">
                    <span>015</span><span>010</span><span>010</span><span>150</span><span>010</span>
                </div>
                <div class="ml-2 mr-2 mb-6 h-full flex items-end justify-between border-b border-white/10 pb-1">
                    <div class="w-2 bg-gradient-to-t from-cyan-600 to-cyan-300 h-[35%] rounded-sm"></div>
                    <div class="w-2 bg-gradient-to-t from-cyan-600 to-cyan-300 h-[60%] rounded-sm"></div>
                    <div class="w-2 bg-gradient-to-t from-cyan-600 to-cyan-300 h-[45%] rounded-sm"></div>
                    <div
                        class="w-2 bg-gradient-to-t from-cyan-500 to-cyan-200 h-[80%] rounded-sm shadow-[0_0_10px_rgba(0,240,255,0.5)]">
                    </div>
                    <div class="w-2 bg-gradient-to-t from-cyan-600 to-cyan-300 h-[65%] rounded-sm"></div>
                    <div class="w-2 bg-gradient-to-t from-cyan-600 to-cyan-300 h-[40%] rounded-sm"></div>
                </div>
            </div>
            <div
                class="absolute -left-8 top-1/2 -translate-y-1/2 w-16 h-16 rounded-full border-[1.5px] border-white/10 border-r-transparent mix-blend-screen pointer-events-none">
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('logo-container').classList.remove('opacity-0', '-translate-x-4');
                document.getElementById('center-orb').classList.remove('opacity-0', 'scale-90');
                document.getElementById('card-top').classList.remove('opacity-0', 'translate-y-8');
                document.getElementById('card-left').classList.remove('opacity-0', 'translate-x-8');
                document.getElementById('card-right').classList.remove('opacity-0', '-translate-x-8');

                const cards = [
                    { el: document.getElementById('card-top'), speed: 0.001, offset: 0, amp: 4 },
                    { el: document.getElementById('card-left'), speed: 0.0008, offset: Math.PI / 2, amp: 3 },
                    { el: document.getElementById('card-right'), speed: 0.0012, offset: Math.PI, amp: 5 }
                ];
                
                function floatCards(time) {
                    cards.forEach(card => {
                        const y = Math.sin(time * card.speed + card.offset) * card.amp;
                        card.el.style.transform = `translate(${card.el.id === 'card-top' ? '-50%' : '0'}, ${card.el.id === 'card-top' ? `calc(-50% + ${y}px)` : `${y}px`})`;
                    });
                    requestAnimationFrame(floatCards);
                }
                setTimeout(() => requestAnimationFrame(floatCards), 2000);
            }, 100);
        });
    </script>
</div>
