<section
  class="bg-[#0a0a0a] text-neutral-200 font-['Inter'] min-h-screen flex flex-col items-center justify-center overflow-x-hidden selection:bg-neutral-800 selection:text-white relative">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">

  <div class="fixed inset-0 z-0 pointer-events-none"
    style="background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 12px);">
  </div>

  <canvas id="grid-canvas" class="fixed inset-0 z-0 pointer-events-none opacity-40"></canvas>

  <main
    class="w-full max-w-6xl mx-auto px-4 py-24 relative z-10 flex flex-col items-center justify-center min-h-screen">

    <!-- Framed Grid Container -->
    <div class="relative w-full p-6 md:p-12">

      <!-- Container Lines & Corner Marks -->
      <div class="absolute inset-0 border border-neutral-800/80 pointer-events-none z-0"></div>

      <!-- Mini corner squares -->
      <div class="absolute -top-1 -left-1 w-2 h-2 bg-neutral-800 z-10"></div>
      <div class="absolute -top-1 -right-1 w-2 h-2 bg-neutral-800 z-10"></div>
      <div class="absolute -bottom-1 -left-1 w-2 h-2 bg-neutral-800 z-10"></div>
      <div class="absolute -bottom-1 -right-1 w-2 h-2 bg-neutral-800 z-10"></div>

      <!-- L-Brackets -->
      <div
        class="absolute top-0 left-0 w-6 h-6 border-t-2 border-l-2 border-neutral-600 -translate-x-1/2 -translate-y-1/2 z-10">
      </div>
      <div
        class="absolute top-0 right-0 w-6 h-6 border-t-2 border-r-2 border-neutral-600 translate-x-1/2 -translate-y-1/2 z-10">
      </div>
      <div
        class="absolute bottom-0 left-0 w-6 h-6 border-b-2 border-l-2 border-neutral-600 -translate-x-1/2 translate-y-1/2 z-10">
      </div>
      <div
        class="absolute bottom-0 right-0 w-6 h-6 border-b-2 border-r-2 border-neutral-600 translate-x-1/2 translate-y-1/2 z-10">
      </div>

      <!-- Header Section -->
      <div class="mb-16 text-center space-y-4 relative gs-reveal">
        <div
          class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-neutral-800 bg-neutral-900/50 backdrop-blur-sm text-xs font-medium text-neutral-400">
          <span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>
          Capabilities
        </div>
        <h2 class="text-3xl md:text-5xl font-semibold tracking-tight text-white">Digital disciplines</h2>
      </div>

      <!-- Main Layout: Background Track for Desktop -->
      <div class="relative w-full">
        <!-- Desktop Horizontal Track -->
        <div
          class="hidden md:block absolute top-1/2 -translate-y-1/2 left-0 right-0 h-[280px] bg-neutral-900/30 backdrop-blur-md border border-neutral-800 rounded-2xl z-0">
        </div>

        <!-- Grid Items Wrapper -->
        <div class="relative z-10 grid grid-cols-1 md:grid-cols-4 gap-6 md:gap-0 items-center">

          <!-- Item 1: Strategy -->
          <div
            class="gs-card relative flex flex-col items-center justify-between py-10 md:h-[280px] bg-neutral-900/50 md:bg-transparent rounded-2xl md:rounded-none border border-neutral-800 md:border-none md:border-r md:border-neutral-800/50 group">
            <div class="text-center space-y-8 flex flex-col items-center">
              <h3
                class="text-xs font-semibold tracking-[0.15em] uppercase text-neutral-500 group-hover:text-neutral-300 transition-colors duration-300">
                Strategy</h3>
              <iconify-icon icon="solar:star-outline"
                class="text-5xl text-neutral-600 group-hover:text-blue-400 group-hover:scale-110 transition-all duration-500 ease-out"></iconify-icon>
            </div>
            <button class="mt-8 w-10 h-10 rounded-full border border-neutral-700/50 flex items-center justify-center text-neutral-500 group-hover:bg-neutral-800 group-hover:text-white group-hover:border-neutral-600 transition-all duration-300" aria-label="Learn more about Strategy">
                            <iconify-icon icon="solar:add-linear" class="text-lg"></iconify-icon>
                        </button>
          </div>

          <!-- Item 2: Product Design (Elevated/Active) -->
          <div
            class="gs-card relative flex flex-col items-center justify-between p-8 h-[380px] rounded-xl shadow-[0_0_50px_-12px_rgba(0,0,0,0.8)] z-20 md:mx-[-1px]">
            <!-- Subtle Gradient Border Treatment -->
            <div
              class="absolute inset-0 rounded-xl p-[1px] bg-gradient-to-b from-neutral-600 via-neutral-800 to-neutral-900 z-0">
              <div class="absolute inset-0 bg-[#111111] rounded-[11px] h-full w-full"></div>
            </div>

            <!-- Inner content wrapper -->
            <div class="relative z-10 flex flex-col items-center justify-between h-full w-full">
              <h3 class="text-xs font-semibold tracking-[0.15em] uppercase text-white mt-2">Product Design</h3>

              <div class="relative flex items-center justify-center w-24 h-24 mt-4">
                <!-- Circular dashed line decoration -->
                <div
                  class="absolute inset-0 rounded-full border-[1.5px] border-dashed border-neutral-700 animate-[spin_20s_linear_infinite]">
                </div>
                <iconify-icon icon="solar:pen-new-square-linear"
                  class="text-6xl text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]"></iconify-icon>
              </div>

              <button class="w-full mt-6 py-3.5 px-6 rounded-lg bg-white hover:bg-neutral-200 text-neutral-950 text-xs font-semibold flex items-center justify-center gap-2 transition-colors duration-300 shadow-[0_0_20px_rgba(255,255,255,0.1)] group">
                                Explore Services
                                <iconify-icon icon="solar:arrow-right-linear" class="text-sm group-hover:translate-x-1 transition-transform"></iconify-icon>
                            </button>
            </div>
          </div>

          <!-- Item 3: Engineering -->
          <div
            class="gs-card relative flex flex-col items-center justify-between py-10 md:h-[280px] bg-neutral-900/50 md:bg-transparent rounded-2xl md:rounded-none border border-neutral-800 md:border-none md:border-l md:border-neutral-800/50 group">
            <div class="text-center space-y-8 flex flex-col items-center">
              <h3
                class="text-xs font-semibold tracking-[0.15em] uppercase text-neutral-500 group-hover:text-neutral-300 transition-colors duration-300">
                Engineering</h3>
              <iconify-icon icon="solar:code-square-linear"
                class="text-5xl text-neutral-600 group-hover:text-emerald-400 group-hover:scale-110 transition-all duration-500 ease-out"></iconify-icon>
            </div>
            <button class="mt-8 w-10 h-10 rounded-full border border-neutral-700/50 flex items-center justify-center text-neutral-500 group-hover:bg-neutral-800 group-hover:text-white group-hover:border-neutral-600 transition-all duration-300" aria-label="Learn more about Engineering">
                            <iconify-icon icon="solar:add-linear" class="text-lg"></iconify-icon>
                        </button>
          </div>

          <!-- Item 4: Motion -->
          <div
            class="gs-card relative flex flex-col items-center justify-between py-10 md:h-[280px] bg-neutral-900/50 md:bg-transparent rounded-2xl md:rounded-none border border-neutral-800 md:border-none md:border-l md:border-neutral-800/50 group">
            <div class="text-center space-y-8 flex flex-col items-center">
              <h3
                class="text-xs font-semibold tracking-[0.15em] uppercase text-neutral-500 group-hover:text-neutral-300 transition-colors duration-300">
                Motion</h3>
              <iconify-icon icon="solar:video-frame-play-horizontal-linear"
                class="text-5xl text-neutral-600 group-hover:text-orange-400 group-hover:scale-110 transition-all duration-500 ease-out"></iconify-icon>
            </div>
            <button class="mt-8 w-10 h-10 rounded-full border border-neutral-700/50 flex items-center justify-center text-neutral-500 group-hover:bg-neutral-800 group-hover:text-white group-hover:border-neutral-600 transition-all duration-300" aria-label="Learn more about Motion">
                            <iconify-icon icon="solar:add-linear" class="text-lg"></iconify-icon>
                        </button>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script>
    // WebGL-simulated background animation using Canvas 2D
        const canvas = document.getElementById('grid-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let lines = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initLines();
        }

        class GridLine {
            constructor(x) {
                this.x = x;
                this.y = Math.random() * height;
                this.length = Math.random() * 100 + 50;
                this.speed = Math.random() * 1 + 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y += this.speed;
                if (this.y > height) {
                    this.y = -this.length;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.beginPath();
                const gradient = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.length);
                gradient.addColorStop(0, `rgba(100, 100, 100, 0)`);
                gradient.addColorStop(0.5, `rgba(150, 150, 150, ${this.opacity})`);
                gradient.addColorStop(1, `rgba(100, 100, 100, 0)`);
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 1;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x, this.y + this.length);
                ctx.stroke();
            }
        }

        function initLines() {
            lines = [];
            const numberOfLines = Math.floor(width / 30);
            for (let i = 0; i < numberOfLines; i++) {
                lines.push(new GridLine(Math.random() * width));
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw static vertical structural lines
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            for(let i = 0; i < width; i += 100) {
                ctx.moveTo(i, 0);
                ctx.lineTo(i, height);
            }
            ctx.stroke();

            // Draw animated particles/lines
            lines.forEach(line => {
                line.update();
                line.draw();
            });
            requestAnimationFrame(animateCanvas);
        }

        window.addEventListener('resize', resize);
        resize();
        animateCanvas();

        // GSAP Animations
        gsap.registerPlugin(ScrollTrigger);

        // Header Reveal
        gsap.fromTo('.gs-reveal', 
            { y: 30, opacity: 0 },
            { y: 0, opacity: 1, duration: 1, ease: 'power3.out' }
        );

        // Grid Items Stagger
        const cards = gsap.utils.toArray('.gs-card');
        gsap.fromTo(cards, 
            { 
                y: 50, 
                opacity: 0,
                scale: 0.95
            },
            { 
                y: 0, 
                opacity: 1, 
                scale: 1,
                duration: 1, 
                stagger: 0.1,
                ease: 'power3.out',
                scrollTrigger: {
                    trigger: '.gs-card',
                    start: 'top 85%',
                }
            }
        );
  </script>
</section>
