                    Series 01
                </div>
                
                <h1 class="text-4xl sm:text-5xl font-medium tracking-tight text-white leading-[1.1] reveal-el">
                    The Art of <br> Striking

                <p class="text-base text-neutral-400 leading-relaxed max-w-sm reveal-el">
                    Master the foundational mechanics of boxing. From perfecting your stance and footwork to delivering crisp, defensive counter-combinations.
                </p>
            </div>

            <div class="pt-12 sm:pt-20 relative z-10 reveal-el">
                <button class="inline-flex items-center justify-center gap-2 px-6 py-3 rounded-xl bg-white text-black text-sm font-medium transition-transform hover:scale-[1.02] active:scale-[0.98] w-full sm:w-auto" style="box-shadow: 0 4px 14px 0 rgba(255, 255, 255, 0.15);">

            <!-- Impact Lines Canvas -->
            <canvas id="impact-canvas" class="absolute inset-0 z-20 pointer-events-none mix-blend-screen opacity-90"></canvas>

            <!-- 3D-Abstracted Punching Bag Assembly -->
            <div class="absolute inset-0 flex flex-col items-center justify-start pt-[15%] sm:pt-[10%] scene-container z-10">
                <!-- Suspension Wire -->
                <div class="w-px h-24 sm:h-32 bg-gradient-to-b from-white/30 to-white/5"></div>
                
                <!-- Heavy Bag -->
                <div class="w-20 h-48 sm:w-24 sm:h-56 rounded-[2rem] sm:rounded-[2.5rem] bg-[#1a1a1a] border border-white/10 flex flex-col items-center justify-center relative overflow-hidden" style="box-shadow: inset 0 2px 15px rgba(255,255,255,0.05), inset -10px -10px 30px rgba(0,0,0,0.8), 0 20px 40px -10px rgba(0,0,0,0.9);">
                    
                    <!-- Texture Lines -->
                    <div class="w-full h-px bg-white/5 absolute top-[20%]"></div>
                    <div class="w-full h-px bg-white/5 absolute bottom-[20%]"></div>
                    <div class="absolute top-0 left-4 w-px h-full bg-white/[0.02]"></div>
                    
                    <!-- Target Area Indicator -->
                    <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border border-indigo-500/40 flex items-center justify-center bg-indigo-500/10 relative z-10">
                        <div class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-indigo-400" style="box-shadow: 0 0 15px 2px rgba(129,140,248,0.8);"></div>
                    </div>
                </div>
            </div>

            <!-- Concentric Impact Shockwaves -->
            <div class="absolute top-[45%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-[200px] h-[200px] sm:w-[300px] sm:h-[300px] border border-indigo-500/30 rounded-full z-0 pointer-events-none ring-anim"></div>
            <div class="absolute top-[45%] left-1/2 -translate-x-1/2 -translate-y-1/2 w-[350px] h-[350px] sm:w-[500px] sm:h-[500px] border border-indigo-500/10 rounded-full z-0 pointer-events-none ring-anim-delay"></div>
            
            <!-- Floor Reflection Gradient -->
            <div class="absolute bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-indigo-500/10 to-transparent z-10 pointer-events-none"></div>
        </div>

        <!-- Panel 3: Metadata Bar (Bottom) -->
        <div class="lg:col-span-12 grid grid-cols-1 sm:grid-cols-3 gap-[1px] bg-white/10 rounded-[1.5rem] sm:rounded-[2rem] border border-white/10 overflow-hidden shadow-2xl bento-panel">
            
            <div class="p-6 sm:p-8 flex items-center gap-4 bg-[#111111] transition-colors hover:bg-[#151515]">
                <div class="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-indigo-400 shrink-0">

                </div>
                <div>
                    <div class="text-xs text-neutral-500 font-normal mb-0.5">Duration</div>
                    <div class="text-sm text-neutral-200 font-medium">45 Minutes</div>
                </div>
            </div>

            <div class="p-6 sm:p-8 flex items-center gap-4 bg-[#111111] transition-colors hover:bg-[#151515]">
                <div class="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-indigo-400 shrink-0">
                    <iconify-icon icon="solar:medal-ribbon-linear" width="24"></iconify-icon>
                </div>
                <div>
                    <div class="text-xs text-neutral-500 font-normal mb-0.5">Difficulty</div>
                    <div class="text-sm text-neutral-200 font-medium">Beginner Friendly</div>
                </div>
            </div>

            <div class="p-6 sm:p-8 flex items-center gap-4 bg-[#111111] transition-colors hover:bg-[#151515]">
                <div class="w-12 h-12 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-indigo-400 shrink-0">
                    <iconify-icon icon="solar:video-library-linear" width="24"></iconify-icon>
                </div>
                <div>
                    <div class="text-xs text-neutral-500 font-normal mb-0.5">Curriculum</div>
                    <div class="text-sm text-neutral-200 font-medium">12 Core Modules</div>
                </div>
            </div>

        </div>
    </main>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
        // Entrance Animations
        const tl = gsap.timeline({ defaults: { ease: "power3.out" } });

        tl.fromTo(".bento-panel", 
            { opacity: 0, y: 30 }, 
            { opacity: 1, y: 0, duration: 1, stagger: 0.15 }
        )
        .fromTo(".reveal-el", 
            { opacity: 0, y: 15 }, 
            { opacity: 1, y: 0, duration: 0.8, stagger: 0.1 }, 
            "-=0.6"
        );

        // Subtle Swinging Animation for the Heavy Bag
        gsap.to(".scene-container", {
            rotate: -4,
            transformOrigin: "top center",
            duration: 1.8,
            ease: "sine.inOut",
            yoyo: true,
            repeat: -1
        });

        // Pulsing Impact Rings
        gsap.to(".ring-anim", {
            scale: 1.2,
            opacity: 0,
            duration: 2,
            ease: "power2.out",
            repeat: -1
        });
        
        gsap.to(".ring-anim-delay", {
            scale: 1.1,
            opacity: 0,
            duration: 2.5,
            delay: 0.5,
            ease: "power2.out",
            repeat: -1
        });

        // Precision Impact Lines (Canvas WebGL-style simulation)
        const canvas = document.getElementById('impact-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let lines = [];
        
        // Focal point perfectly centered on the bag's target
        const focalRatioX = 0.5;
        const focalRatioY = 0.45; 

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        class ImpactLine {
            constructor() {
                this.reset();
            }

            reset() {
                // Focus incoming lines from the sides and bottom to simulate strikes
                this.angle = (Math.random() * Math.PI) + (Math.PI / 4); 
                this.distance = Math.random() * 50 + 40; 
                this.length = Math.random() * 80 + 30;
                this.speed = Math.random() * 5 + 3;
                this.opacity = Math.random() * 0.6 + 0.1;
                this.width = Math.random() * 1.5 + 0.5;
                // Technical color palette: Indigos, whites, and transparent grays
                const colors = ['#818cf8', '#ffffff', '#4f46e5', '#a5b4fc'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.active = false;
                
                setTimeout(() => { this.active = true; }, Math.random() * 2500);
            }

            update() {
                if (!this.active) return;
                
                this.distance += this.speed;
                this.opacity -= 0.01;

                if (this.opacity <= 0 || this.distance > Math.max(width, height)) {
                    this.reset();
                    this.active = true; 
                }
            }

            draw() {
                if (!this.active || this.opacity <= 0) return;

                const cx = width * focalRatioX;
                const cy = height * focalRatioY;

                // Reverse calculate start and end so lines travel INWARD towards the target
                const startX = cx + Math.cos(this.angle) * this.distance;
                const startY = cy + Math.sin(this.angle) * this.distance;
                const endX = cx + Math.cos(this.angle) * (this.distance + this.length);
                const endY = cy + Math.sin(this.angle) * (this.distance + this.length);

                ctx.beginPath();
                ctx.moveTo(endX, endY);
                ctx.lineTo(startX, startY);
                
                // Gradient stroke fading out at the tail
                const gradient = ctx.createLinearGradient(endX, endY, startX, startY);
                gradient.addColorStop(0, 'rgba(255,255,255,0)');
                gradient.addColorStop(1, this.color);
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = this.width;
                ctx.lineCap = 'round';
                ctx.globalAlpha = this.opacity;
                ctx.stroke();
            }
        }

        function initLines() {
            lines = [];
            for (let i = 0; i < 20; i++) {
                lines.push(new ImpactLine());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            lines.forEach(line => {
                line.update();
                line.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        initLines();
        animate();
    </script>
</section>
