<section class="z-20 overflow-hidden min-h-[800px] flex border-white/5 border-t pt-32 pb-32 relative items-center">
  <!-- subtle ambient background -->
  <div class="absolute inset-0 pointer-events-none">
    <div
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[34rem] h-[34rem] rounded-full bg-white/[0.04] blur-[120px]">
    </div>
    <div
      class="absolute top-1/2 left-[62%] -translate-x-1/2 -translate-y-1/2 w-[26rem] h-[26rem] rounded-full bg-white/[0.03] blur-[80px]">
    </div>
  </div>

  <!-- faint grid -->
  <div
    class="absolute inset-0 opacity-20 pointer-events-none [mask-image:radial-gradient(circle_at_center,black_20%,transparent_75%)]"
    style="-webkit-mask-image: radial-gradient(circle at center, black 20%, transparent 75%);">
    <div
      class="w-full h-full bg-[linear-gradient(rgba(255,255,255,0.025)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.025)_1px,transparent_1px)] bg-[size:42px_42px]">
    </div>
  </div>

  <div class="container mx-auto px-6 max-w-7xl relative z-20 h-full py-20">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">

      <!-- Left content -->
      <div class="flex flex-col gap-8 relative z-30">
        <div>
          <h2 class="font-display text-4xl md:text-5xl font-semibold tracking-tight mb-4 text-white">
            Live
            <span class="text-white/40">Telemetry.</span>
          </h2>
          <p class="text-gray-400 font-light max-w-md leading-relaxed">
            Real-time performance metrics streamed directly from the active
            engine core.
          </p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div class="glass-panel p-6 rounded-2xl w-full bg-white/[0.02] border border-white/8">
            <div class="flex items-center gap-2 mb-4 border-b border-white/10 pb-3">
              <iconify-icon icon="solar:chart-square-linear" class="text-gray-400"></iconify-icon>
              <span class="text-[11px] font-mono text-gray-400 uppercase tracking-[0.18em]">
                Throughput
              </span>
            </div>
            <div class="text-3xl font-display font-semibold text-white mb-2">
              24.8
              <span class="text-sm text-gray-500 font-sans">GB/s</span>
            </div>
            <div class="h-1.5 w-full bg-white/5 rounded-full overflow-hidden">
              <div class="h-full bg-white/75 w-[75%] rounded-full"></div>
            </div>
          </div>

          <div class="glass-panel p-6 rounded-2xl w-full bg-white/[0.02] border border-white/8">
            <div class="flex items-center gap-2 mb-4 border-b border-white/10 pb-3">
              <iconify-icon icon="solar:hierarchy-linear" class="text-gray-400"></iconify-icon>
              <span class="text-[11px] font-mono text-gray-400 uppercase tracking-[0.18em]">
                Active Nodes
              </span>
            </div>
            <div class="text-3xl font-display font-semibold text-white mb-3">
              1,042
            </div>
            <div class="flex gap-1.5 items-end h-8">
              <div class="w-2 h-[40%] bg-white/30 rounded-sm"></div>
              <div class="w-2 h-[30%] bg-white/20 rounded-sm"></div>
              <div class="w-2 h-[60%] bg-white/45 rounded-sm"></div>
              <div class="w-2 h-[20%] bg-white/15 rounded-sm"></div>
              <div class="w-2 h-[50%] bg-white/35 rounded-sm"></div>
              <div class="w-2 h-[80%] bg-white rounded-sm shadow-[0_0_10px_rgba(255,255,255,0.35)]"></div>
            </div>
          </div>

          <div class="glass-panel p-6 rounded-2xl w-full bg-white/[0.02] border border-white/8">
            <div class="flex items-center gap-2 mb-4 border-b border-white/10 pb-3">
              <iconify-icon icon="solar:stopwatch-linear" class="text-gray-400"></iconify-icon>
              <span class="text-[11px] font-mono text-gray-400 uppercase tracking-[0.18em]">
                Latency
              </span>
            </div>
            <div class="flex items-end gap-2 mb-2">
              <div class="text-3xl font-display font-semibold text-white">
                0.4
              </div>
              <span class="text-sm text-gray-500 mb-1">ms</span>
            </div>
            <div class="text-xs text-white/70 font-mono uppercase tracking-[0.16em]">
              Status: Optimal
            </div>
          </div>

          <div class="glass-panel p-6 rounded-2xl w-full bg-white/[0.02] border border-white/8">
            <div class="flex items-center gap-2 mb-4 border-b border-white/10 pb-3">
              <iconify-icon icon="solar:server-path-linear" class="text-gray-400"></iconify-icon>
              <span class="text-[11px] font-mono text-gray-400 uppercase tracking-[0.18em]">
                System Load
              </span>
            </div>
            <div class="text-3xl font-display font-semibold text-white mb-3">
              12%
            </div>
            <div class="grid grid-cols-4 gap-1.5">
              <div class="h-1.5 bg-white rounded-sm"></div>
              <div class="h-1.5 bg-white/20 rounded-sm"></div>
              <div class="h-1.5 bg-white/20 rounded-sm"></div>
              <div class="h-1.5 bg-white/20 rounded-sm"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right content -->
      <div class="relative w-full h-[400px] md:h-[600px] flex items-center justify-center pointer-events-none z-10">
        <div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center z-10 animate-float-slow">

          <!-- Soft background glow -->
          <div class="absolute inset-[-35%] rounded-full bg-white/[0.04] blur-[80px]"></div>
          <div class="absolute inset-[-10%] rounded-full bg-white/[0.03] blur-[40px]"></div>

          <!-- Outer structure -->
          <div class="absolute inset-[-22%] rounded-full border border-white/[0.04]"></div>
          <div class="absolute inset-[-8%] rounded-full border border-white/[0.06] border-dashed"></div>

          <!-- Cross signal lines -->
          <div class="absolute inset-0">
            <div
              class="absolute top-1/2 left-1/2 w-[150%] h-px bg-gradient-to-r from-transparent via-white/[0.08] to-transparent -translate-x-1/2 -translate-y-1/2 rotate-[28deg]">
            </div>
            <div
              class="absolute top-1/2 left-1/2 w-[150%] h-px bg-gradient-to-r from-transparent via-white/[0.06] to-transparent -translate-x-1/2 -translate-y-1/2 -rotate-[28deg]">
            </div>
          </div>

          <!-- restrained ring -->
          <div class="absolute inset-[8%] rounded-full border border-white/[0.08]"></div>
          <div class="absolute inset-[22%] rounded-full border border-white/[0.08]"></div>

          <!-- pulse ring -->
          <div class="absolute inset-[18%] rounded-full border border-white/[0.05] animate-ping"
            style="animation-duration: 4s;"></div>

          <!-- Node points -->
          <div
            class="absolute top-[10%] left-1/2 -translate-x-1/2 w-2 h-2 bg-white/80 rounded-full shadow-[0_0_10px_rgba(255,255,255,0.6)]">
          </div>
          <div class="absolute bottom-[12%] left-1/2 -translate-x-1/2 w-1.5 h-1.5 bg-white/40 rounded-full"></div>
          <div class="absolute left-[10%] top-1/2 -translate-y-1/2 w-1.5 h-1.5 bg-white/40 rounded-full"></div>
          <div class="absolute right-[10%] top-1/2 -translate-y-1/2 w-1.5 h-1.5 bg-white/40 rounded-full"></div>

          <!-- Central Core -->
          <div class="absolute inset-0 m-auto w-32 h-32 md:w-40 md:h-40 flex items-center justify-center z-20">
            <div class="absolute inset-0 rounded-full bg-white/[0.05] blur-[30px]"></div>
            <div
              class="absolute inset-0 rounded-full border border-white/[0.08] bg-[#060913]/85 backdrop-blur-xl shadow-[0_0_40px_rgba(255,255,255,0.05)]">
            </div>
            <div class="absolute inset-[18%] rounded-full border border-white/[0.08]"></div>

            <div class="relative z-10 flex flex-col items-center justify-center">
              <div
                class="w-14 h-14 rounded-2xl bg-white/[0.05] border border-white/[0.12] flex items-center justify-center shadow-[0_0_20px_rgba(255,255,255,0.04)]">
                <div class="w-4 h-4 bg-white rounded-full shadow-[0_0_18px_rgba(255,255,255,0.65)] animate-pulse"></div>
              </div>
            </div>
          </div>

          <!-- Floating labels -->
          <div
            class="absolute -top-6 right-0 md:-right-12 glass-panel px-4 py-2 rounded-xl border border-white/10 shadow-[0_10px_30px_rgba(0,0,0,0.22)] flex items-center gap-3 animate-float-delayed z-30 pointer-events-auto bg-white/[0.02]">
            <div class="w-2 h-2 rounded-full bg-white/70 animate-pulse"></div>
            <div class="flex flex-col">
              <span class="text-[9px] font-mono text-gray-500 tracking-wider">SYNC RATE</span>
              <span class="text-xs font-mono text-white font-semibold">99.9%</span>
            </div>
          </div>

          <div
            class="absolute -bottom-10 left-0 md:-left-10 glass-panel px-4 py-2 rounded-xl border border-white/10 shadow-[0_10px_30px_rgba(0,0,0,0.22)] flex items-center gap-3 animate-float z-30 pointer-events-auto bg-white/[0.02]">
            <iconify-icon icon="solar:radar-bold-duotone" class="text-white/70 text-lg"></iconify-icon>
            <div class="flex flex-col">
              <span class="text-[9px] font-mono text-gray-500 tracking-wider">CORE STATE</span>
              <span class="text-xs font-mono text-white font-semibold">OPTIMAL</span>
            </div>
          </div>

          <div
            class="absolute top-1/2 -left-10 md:-left-20 glass-panel px-3 py-1.5 rounded-lg border border-white/10 shadow-[0_10px_30px_rgba(0,0,0,0.22)] flex flex-col items-end gap-0.5 animate-float-slow z-30 -translate-y-1/2 pointer-events-auto bg-white/[0.02]">
            <span class="text-[9px] font-mono text-gray-500 tracking-wider">LATENCY</span>
            <span class="text-xs font-mono text-white font-semibold">0.4ms</span>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
