<section
    class="w-screen h-screen relative bg-neutral-950 text-neutral-50 overflow-hidden m-0 p-0 antialiased selection:bg-red-500/30"
    style="font-family: 'Inter', sans-serif;">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"

    <canvas id="glcanvas" class="absolute inset-0 z-0 w-full h-full pointer-events-none"></canvas>

    <div class="absolute inset-0 z-[1] pointer-events-none opacity-20 mix-blend-overlay"

    </div>

    <div class="absolute inset-0 z-[5] pointer-events-none flex justify-center opacity-30">

            <div class="absolute top-0 bottom-0 right-[25%] border-l border-white/5"></div>
            <div class="absolute top-0 bottom-0 left-[50%] border-r border-white/[0.03]"></div>

            <!-- Horizontal guides -->
            <div class="absolute top-[20%] left-0 w-full border-b border-white/5"></div>
            <div class="absolute bottom-[20%] left-0 w-full border-t border-white/5"></div>

            <!-- Corner Brackets -->
            <div class="absolute top-8 left-8 w-6 h-6 border-t border-l border-white/40"></div>
            <div class="absolute top-8 right-8 w-6 h-6 border-t border-r border-white/40"></div>
            <div class="absolute bottom-8 left-8 w-6 h-6 border-b border-l border-white/40"></div>
            <div class="absolute bottom-8 right-8 w-6 h-6 border-b border-r border-white/40"></div>

            <!-- Mini corner squares -->
            <div class="absolute top-[19.8%] -left-1 w-2 h-2 bg-white/20"></div>
            <div class="absolute top-[19.8%] -right-1 w-2 h-2 bg-white/20"></div>
            <div class="absolute bottom-[19.8%] -left-1 w-2 h-2 bg-white/20"></div>
            <div class="absolute bottom-[19.8%] -right-1 w-2 h-2 bg-white/20"></div>
        </div>
    </div>

    <main class="absolute inset-0 z-20 pointer-events-none flex flex-col justify-between p-6 md:p-12">

        <!-- Navigation Pill (Skeuomorphic Skill) -->
        <nav class="w-full flex justify-center gs-reveal pointer-events-auto">
            <div class="flex items-center justify-between px-2 py-1.5 rounded-full bg-neutral-900/80 backdrop-blur-xl"
                style="box-shadow: inset 0 1px 1px rgba(255,255,255,0.1), 0 0 0 1px rgba(255,255,255,0.05), 0 8px 24px -4px rgba(0,0,0,0.5);">
                <div class="flex items-center gap-2 pl-3 pr-6">
                    <div class="w-5 h-5 rounded-full bg-gradient-to-tr from-red-600 to-orange-400 relative"
                        style="box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), 0 0 8px rgba(220,38,38,0.5);">
                        <div class="absolute inset-1 rounded-full bg-neutral-950/40"></div>
                    </div>
                    <span class="text-sm font-medium tracking-tight text-neutral-200">NexusCore</span>
                </div>

                <div class="hidden md:flex items-center gap-1 px-4 border-l border-white/10">
                    <button class="px-4 py-1.5 rounded-full text-xs font-medium text-neutral-400 hover:text-neutral-100 hover:bg-white/5 transition-colors">Telemetry</button>
                    <button class="px-4 py-1.5 rounded-full text-xs font-medium text-neutral-400 hover:text-neutral-100 hover:bg-white/5 transition-colors">Topology</button>
                    <button class="px-4 py-1.5 rounded-full text-xs font-medium text-neutral-100 bg-white/10" style="box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);">Engine</button>
                </div>

                <div class="pl-2 border-l border-white/10">
                    <button class="flex items-center justify-center w-8 h-8 rounded-full text-neutral-400 hover:text-neutral-100 transition-colors">
                        <iconify-icon icon="solar:hamburger-menu-linear" width="18" height="18" stroke-width="1.5"></iconify-icon>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Center Content -->
        <div
            class="flex-1 flex flex-col justify-center items-center text-center max-w-3xl mx-auto w-full relative z-10 pointer-events-auto">

            <div class="gs-reveal flex items-center gap-2 mb-6 px-3 py-1 rounded-full bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-medium tracking-wide"
                style="font-family: 'JetBrains Mono', monospace;">
                <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
                SYSTEM V.09 ONLINE
            </div>

            <h1
                class="gs-reveal text-5xl md:text-7xl font-medium tracking-tight text-neutral-50 mb-6 leading-tight drop-shadow-2xl">
                Distributed routing.<br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-red-500 to-orange-400">Zero latency.</span>
            </h1>

            <p class="gs-reveal text-base md:text-lg text-neutral-400 max-w-xl font-normal leading-relaxed mb-10">
                Orchestrate massive infrastructural deployments in real-time. Nexus Engine calculates optimal pathways
                through the noise, delivering uncompromised throughput globally.
            </p>

            <div class="gs-reveal flex items-center gap-4">
                <button class="relative group rounded-full px-6 py-2.5 text-sm font-medium text-white transition-all active:scale-95" style="background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%); box-shadow: inset 0 1px 1px rgba(255,255,255,0.3), 0 0 0 1px #991b1b, 0 4px 14px -2px rgba(220, 38, 38, 0.4);">
                    <span class="relative z-10 flex items-center gap-2">
                        Initialize Core
                        <iconify-icon icon="solar:arrow-right-linear" width="16" height="16"></iconify-icon>
                    </span>
                    <div class="absolute inset-0 rounded-full bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </button>

                <button class="px-6 py-2.5 rounded-full text-sm font-medium text-neutral-300 hover:text-white transition-all active:scale-95 bg-neutral-900/50 backdrop-blur-md" style="box-shadow: inset 0 1px 1px rgba(255,255,255,0.05), 0 0 0 1px rgba(255,255,255,0.1);">
                    View Documentation
                </button>
            </div>
        </div>

        <!-- Bottom Status Row -->
        <div class="w-full flex justify-between items-end relative z-10 pointer-events-none">

            <!-- Bottom Left Data -->
            <div class="gs-reveal text-xs text-neutral-500 uppercase tracking-widest leading-relaxed flex flex-col gap-1"
                style="font-family: 'JetBrains Mono', monospace;">
                <div class="flex items-center gap-2">
                    <iconify-icon icon="solar:cpu-linear" width="14" height="14"
                        class="text-neutral-400"></iconify-icon>
                    <span>Load: 24.8%</span>
                </div>
                <div class="flex items-center gap-2">
                    <iconify-icon icon="solar:server-square-linear" width="14" height="14"
                        class="text-neutral-400"></iconify-icon>
                    <span>Nodes: 1,024</span>
                </div>
            </div>

            <!-- Bottom Right Mini Map / Target -->
            <div class="gs-reveal flex flex-col items-end gap-2">
                <div class="text-xs text-neutral-500 uppercase tracking-widest text-right"
                    style="font-family: 'JetBrains Mono', monospace;">
                    <span class="text-red-500">///</span> ENGINE SYNC
                </div>
                <div class="w-16 h-16 border border-white/10 rounded-full relative flex items-center justify-center">
                    <div
                        class="w-1 h-1 bg-red-500 rounded-full absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 shadow-[0_0_8px_rgba(239,68,68,1)]">
                    </div>
                    <div class="w-full h-[1px] bg-white/5 absolute"></div>
                    <div class="h-full w-[1px] bg-white/5 absolute"></div>
                    <svg class="absolute inset-0 w-full h-full text-white/20 animate-[spin_10s_linear_infinite]"
                        viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="1"
                            stroke-dasharray="4 8"></circle>
                    </svg>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // --- WebGL Implementation (Remixed to Red) ---
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl2');

        if (!gl) {
            console.error('WebGL2 not supported');
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        // Shaders
        const vsSource = `#version 300 es
            in float a_t;          
            in float a_instance;   
            
            uniform float u_time;
            uniform vec2 u_resolution;
            uniform float u_instances;
            
            out float v_instance;
            
            void main() {
                v_instance = a_instance;
                
                float time = u_time * 0.0004;
                float id = (a_instance / u_instances) * 2.0 - 1.0; 
                float u = a_t * 3.14159 * 2.0; 
                
                vec3 p;
                
                float s = sin(u);
                p.x = 2.0 * (s * s * s);
                p.y = 1.6 * cos(u) - 0.6 * cos(2.0 * u) - 0.2 * cos(3.0 * u) - 0.1 * cos(4.0 * u);
                
                p.y += 0.2; 
                p.z = sin(u * 2.0 + time * 1.5) * 0.6;
                
                float pulse = 1.0 + 0.05 * sin(time * 5.0);
                p *= pulse;
                
                float spread = 0.5;
                p.x += sin(u * 4.0 + time) * id * spread * 0.4;
                p.y += cos(u * 4.0 + time) * id * spread * 0.4;
                p.z += sin(u * 2.0) * id * spread;
                
                float rx = sin(time * 0.5) * 0.2; 
                float ry = time * 0.4;            
                
                mat2 rotX = mat2(cos(rx), -sin(rx), sin(rx), cos(rx));
                mat2 rotY = mat2(cos(ry), -sin(ry), sin(ry), cos(ry));
                
                vec2 yz = rotX * vec2(p.y, p.z);
                p.y = yz.x; p.z = yz.y;
                
                vec2 xz = rotY * vec2(p.x, p.z);
                p.x = xz.x; p.z = xz.y;
                
                float z_dist = 6.0;
                float z_factor = z_dist / (z_dist - p.z);
                vec2 pos2d = p.xy * z_factor;
                
                float aspect = u_resolution.x / u_resolution.y;
                pos2d.x /= aspect;
                
                pos2d *= 0.45; 
                pos2d *= 1.0 + sin(time * 2.0) * 0.02;

                gl_Position = vec4(pos2d, 0.0, 1.0);
            }
        `;

        const fsSource = `#version 300 es
            precision highp float;
            
            in float v_instance;
            uniform float u_instances;
            
            out vec4 outColor;
            
            void main() {
                // REMIX: Changed from purple to vibrant red tones
                vec3 coreColor = vec3(1.0, 0.15, 0.15); // Bright Red
                
                float edgeFactor = abs((v_instance / u_instances) * 2.0 - 1.0);
                // Mix towards a deeper, darker crimson at the edges
                vec3 finalColor = mix(coreColor, vec3(0.5, 0.0, 0.05), pow(edgeFactor, 2.0));
                
                outColor = vec4(finalColor, 0.35);
            }
        `;

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        const vertexShader = createShader(gl, gl.VERTEX_SHADER, vsSource);
        const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
        const program = gl.createProgram();
        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);
        gl.useProgram(program);

        const segments = 800;    
        const instances = 60;    

        const tData = new Float32Array(segments);
        for (let i = 0; i < segments; i++) tData[i] = i / (segments - 1);

        const instanceData = new Float32Array(instances);
        for (let i = 0; i < instances; i++) instanceData[i] = i;

        const tBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, tBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, tData, gl.STATIC_DRAW);
        const a_t = gl.getAttribLocation(program, "a_t");
        gl.enableVertexAttribArray(a_t);
        gl.vertexAttribPointer(a_t, 1, gl.FLOAT, false, 0, 0);

        const instanceBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, instanceData, gl.STATIC_DRAW);
        const a_instance = gl.getAttribLocation(program, "a_instance");
        gl.enableVertexAttribArray(a_instance);
        gl.vertexAttribPointer(a_instance, 1, gl.FLOAT, false, 0, 0);
        gl.vertexAttribDivisor(a_instance, 1); 

        const u_time = gl.getUniformLocation(program, "u_time");
        const u_resolution = gl.getUniformLocation(program, "u_resolution");
        const u_instances = gl.getUniformLocation(program, "u_instances");

        gl.uniform1f(u_instances, instances);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE); 
        gl.disable(gl.DEPTH_TEST);

        function render(time) {
            gl.clearColor(0.0, 0.0, 0.0, 0.0); // Transparent to show dark background
            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.uniform1f(u_time, time);
            gl.uniform2f(u_resolution, canvas.width, canvas.height);

            gl.drawArraysInstanced(gl.LINE_STRIP, 0, segments, instances);

            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);

        // --- GSAP Animations ---
        document.addEventListener("DOMContentLoaded", () => {
            gsap.fromTo(".gs-reveal", 
                { 
                    y: 20, 
                    opacity: 0,
                    filter: "blur(8px)"
                },
                { 
                    y: 0, 
                    opacity: 1, 
                    filter: "blur(0px)",
                    duration: 1.2, 
                    stagger: 0.1, 
                    ease: "power3.out",
                    delay: 0.2
                }
            );
        });
    </script>
</section>
