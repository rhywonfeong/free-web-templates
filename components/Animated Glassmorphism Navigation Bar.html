<!DOCTYPE html>
<html lang="en" class="gsap-loading">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STRATA Navigation — Standalone</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <style>
    body {
      font-family: "Inter", sans-serif;
      background: #f5f5f2;
      min-height: 100vh;
    }

    .font-display {
      font-family: "Bebas Neue", sans-serif;
    }

    html.gsap-loading nav {
      opacity: 0;
      visibility: hidden;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body class="bg-zinc-50 text-zinc-900 antialiased selection:bg-zinc-200 selection:text-zinc-900">

  <!-- Spacer so fixed nav can be previewed nicely -->
  <div class="h-[140px]"></div>

  <!-- Navigation -->
  <nav aria-label="Primary" class="fixed top-5 left-1/2 z-50 w-[calc(100%-24px)] max-w-6xl -translate-x-1/2">
    <div
      class="relative flex h-16 items-center justify-between rounded-2xl border border-black/10 bg-[rgba(245,245,242,0.78)] px-4 shadow-[0_10px_40px_rgba(10,10,10,0.08)] backdrop-blur-xl md:px-3">
      <div class="pointer-events-none absolute inset-0 rounded-2xl ring-1 ring-white/40"></div>

      <!-- Brand -->
      <a href="#" class="relative z-10 flex shrink-0 items-center gap-3">
        <div
          class="relative flex h-9 w-9 items-center justify-center rounded-xl border border-black/10 bg-[#10141B] shadow-[inset_0_1px_0_rgba(255,255,255,0.06)]">
          <span class="absolute inset-[6px] rounded-[8px] border border-[#4DA3FF]/30"></span>
          <span class="h-1.5 w-1.5 rounded-[2px] bg-[#4DA3FF] shadow-[0_0_10px_rgba(77,163,255,0.45)]"></span>
        </div>

        <div class="flex flex-col leading-none">
          <span class="font-display text-[1.6rem] leading-none tracking-[0.04em] text-[#0A0A0A]">
            STRATA
          </span>
          <span class="-mt-0.5 hidden text-[10px] uppercase tracking-[0.18em] text-[#6B7280] sm:block">
            Runtime Infrastructure
          </span>
        </div>
      </a>

      <!-- Center navigation -->
      <div class="absolute left-1/2 hidden -translate-x-1/2 items-center gap-8 md:flex">
        <a href="#"
          class="text-[11px] uppercase tracking-[0.16em] text-[#6B7280] transition-colors hover:text-[#0A0A0A]">
          Platform
        </a>
        <a href="#"
          class="text-[11px] uppercase tracking-[0.16em] text-[#6B7280] transition-colors hover:text-[#0A0A0A]">
          Runtime
        </a>
        <a href="#"
          class="text-[11px] uppercase tracking-[0.16em] text-[#6B7280] transition-colors hover:text-[#0A0A0A]">
          Solutions
        </a>
        <a href="#"
          class="text-[11px] uppercase tracking-[0.16em] text-[#6B7280] transition-colors hover:text-[#0A0A0A]">
          Docs
        </a>
      </div>

      <!-- Actions -->
      <div class="relative z-10 flex shrink-0 items-center gap-2 md:gap-3">
        <a href="#"
          class="hidden text-[11px] uppercase tracking-[0.16em] text-[#6B7280] transition-colors hover:text-[#0A0A0A] md:inline-flex">
          Sign in
        </a>

        <a href="#"
          class="inline-flex h-10 items-center justify-center rounded-xl border border-[#1A2130] bg-[#10141B] px-4 text-[11px] uppercase tracking-[0.16em] text-[#F5F5F2] transition-all hover:bg-[#17202B] hover:shadow-[0_0_0_1px_rgba(77,163,255,0.22),0_8px_24px_rgba(77,163,255,0.12)] md:px-5">
          Start building
        </a>
      </div>
    </div>
  </nav>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const nav = document.querySelector("nav");
      const brand = nav.querySelector("a");
      const centerLinks = nav.querySelectorAll(".absolute a");
      const actions = nav.querySelectorAll(".relative.z-10.flex.shrink-0.items-center.gap-2 a");

      if (prefersReduced) {
        document.documentElement.classList.remove("gsap-loading");
        return;
      }

      gsap.set(nav, { opacity: 0, y: -22 });
      gsap.set(brand, { opacity: 0, x: -16 });
      gsap.set(centerLinks, { opacity: 0, y: -10 });
      gsap.set(actions, { opacity: 0, x: 12 });

      document.documentElement.classList.remove("gsap-loading");

      const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
      tl.to(nav, { opacity: 1, y: 0, duration: 0.8 })
        .to(brand, { opacity: 1, x: 0, duration: 0.55 }, 0.15)
        .to(centerLinks, { opacity: 1, y: 0, duration: 0.45, stagger: 0.06 }, 0.22)
        .to(actions, { opacity: 1, x: 0, duration: 0.45, stagger: 0.06 }, 0.28);
    });
  </script>
</body>

</html>
