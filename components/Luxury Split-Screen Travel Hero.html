<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voyage - Luxury Sanctuaries</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
</head>

<body
  class="bg-stone-50 text-stone-900 antialiased h-screen overflow-hidden flex flex-col relative selection:bg-[#B5A58A]/20 selection:text-stone-900"
  style="font-family: 'Inter', sans-serif;">

  <!-- Environmental Background Assets -->
  <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden opacity-30 mix-blend-multiply">
    <div class="absolute top-0 left-0 w-[500px] h-[500px] blur-[100px] -translate-x-1/3 -translate-y-1/3"
      style="background: radial-gradient(circle, rgba(217,119,6,0.15) 0%, transparent 70%);"></div>
    <div class="absolute top-0 left-0 w-32 h-32 bg-white/40 blur-[30px] -translate-x-1/2 -translate-y-1/2"></div>
    <div class="absolute top-0 left-0 w-12 h-12 bg-white/80 blur-[10px] -translate-x-1/2 -translate-y-1/2"></div>
  </div>

  <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden opacity-30 mix-blend-multiply">
    <div
      class="absolute top-0 right-0 w-[800px] h-[800px] bg-[radial-gradient(circle_at_center,rgba(217,119,6,0.04)_0%,transparent_60%)] -translate-y-1/3 translate-x-1/3 blur-3xl">
    </div>
    <div
      class="absolute top-1/4 right-0 w-[600px] h-[600px] bg-[radial-gradient(circle_at_center,rgba(59,130,246,0.02)_0%,transparent_60%)] translate-x-1/2 blur-3xl">
    </div>
  </div>

  <!-- Floating Navigation -->
  <div class="nav-wrapper fixed top-4 md:top-8 left-0 right-0 z-50 flex justify-center pointer-events-none px-4">
    <nav
      class="bg-[#FCFBFA]/90 backdrop-blur-md pointer-events-auto px-6 py-4 flex items-center justify-between w-full max-w-[900px] shadow-[0_12px_40px_rgba(0,0,0,0.04)] border border-stone-200/60 transition-all">

      <div class="flex items-center gap-3 pl-2">
        <iconify-icon icon="solar:compass-linear" class="text-xl text-[#A39171]"
          style="stroke-width: 1.5;"></iconify-icon>
        <span class="font-normal text-stone-900 tracking-widest text-lg uppercase" style="font-family: 'Cormorant Garamond', serif;">Voyage</span>
      </div>

      <div class="hidden md:flex items-center gap-12 text-xs font-light uppercase tracking-widest">
        <a href="#" class="text-stone-900 border-b border-stone-900/30 pb-1 transition-colors">Discover</a>
        <a href="#" class="text-stone-400 hover:text-stone-800 transition-colors">Sanctuaries</a>
        <a href="#" class="text-stone-400 hover:text-stone-800 transition-colors">Residences</a>
      </div>

      <div class="flex items-center">
        <button class="bg-[#262523] text-[#F7F6F2] px-8 py-3 text-xs font-light tracking-widest uppercase hover:bg-[#1A1917] hover:shadow-lg transition-all flex items-center gap-2">
                    Reserve
                </button>
      </div>
    </nav>
  </div>

  <!-- Main Content -->
  <main class="flex-grow w-full h-full z-10 relative flex flex-col md:flex-row p-3 md:p-4 gap-3 md:gap-4">

    <!-- Left Panel: Destinations -->
    <section class="flex-1 relative overflow-hidden group hero-element min-h-[50vh] md:min-h-0 bg-stone-900 shadow-xl">
      <!-- Masking Wrapper revealing from the right -->
      <div class="absolute inset-0 left-image-wrapper pointer-events-none"
        style="clip-path: polygon(100% 0%, 100% 0%, 100% 100%, 100% 100%);">
        <!-- Inner slide container separating GSAP translation from CSS hover scale -->
        <div class="absolute inset-0 left-image-slide pointer-events-auto">
          <div
            class="absolute inset-0 bg-cover bg-center transition-transform duration-[1.5s] ease-out group-hover:scale-105"
            style="background-image: url('https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/47e2c634-a90b-4ee9-a746-bba13a818810_3840w.webp');">
          </div>
        </div>
        <div
          class="absolute inset-0 bg-black/10 transition-colors duration-700 group-hover:bg-black/20 pointer-events-none">
        </div>
        <div
          class="absolute inset-x-0 bottom-0 h-3/5 bg-gradient-to-t from-black/80 via-black/30 to-transparent pointer-events-none">
        </div>
      </div>

      <div class="absolute bottom-8 left-8 md:bottom-12 md:left-12 pointer-events-none">
        <h1
          class="text-5xl md:text-7xl lg:text-8xl tracking-tight text-white font-light leading-none drop-shadow-md flex flex-wrap gap-[0.25em] masked-title"
          style="font-family: 'Cormorant Garamond', serif;">
          <span class="overflow-hidden inline-flex py-1 -my-1"><span class="reveal-word animate-explore inline-block translate-y-full">Discover</span></span>
          <span class="overflow-hidden inline-flex py-1 -my-1"><span class="reveal-word inline-block translate-y-full">Sanctuaries</span></span>
        </h1>
      </div>
    </section>

    <!-- Right Panel: Experiences -->
    <section class="flex-1 relative overflow-hidden group hero-element min-h-[50vh] md:min-h-0 bg-stone-900 shadow-xl">
      <!-- Masking Wrapper revealing from the left -->
      <div class="absolute inset-0 right-image-wrapper pointer-events-none"
        style="clip-path: polygon(0% 0%, 0% 0%, 0% 100%, 0% 100%);">
        <!-- Inner slide container separating GSAP translation from CSS hover scale -->
        <div class="absolute inset-0 right-image-slide pointer-events-auto">
          <div
            class="absolute inset-0 bg-cover bg-center transition-transform duration-[1.5s] ease-out group-hover:scale-105"
            style="background-image: url('https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/d1d55e81-76aa-4f1b-87dc-d04f58b9bab4_3840w.webp');">
          </div>
        </div>
        <div
          class="absolute inset-0 bg-black/10 transition-colors duration-700 group-hover:bg-black/20 pointer-events-none">
        </div>
        <div
          class="absolute inset-x-0 bottom-0 h-3/5 bg-gradient-to-t from-black/80 via-black/30 to-transparent pointer-events-none">
        </div>
      </div>

      <div class="absolute bottom-8 left-8 md:bottom-12 md:left-12 pointer-events-none">
        <h1
          class="text-5xl md:text-7xl lg:text-8xl tracking-tight text-white font-light leading-none drop-shadow-md flex flex-wrap gap-[0.25em] masked-title"
          style="font-family: 'Cormorant Garamond', serif;">
          <span class="overflow-hidden inline-flex py-1 -my-1"><span class="reveal-word inline-block translate-y-full">Secluded</span></span>
          <span class="overflow-hidden inline-flex py-1 -my-1"><span class="reveal-word inline-block translate-y-full">Reserves</span></span>
        </h1>
      </div>
    </section>

    <!-- Hidden Ecosystem Matrix -->
    <section class="max-w-[1200px] mx-auto px-6 eco-grid opacity-0 pointer-events-none absolute top-full">
      <div class="eco-header">
        <h2 class="text-2xl">Core Components</h2>
      </div>
      <div class="eco-card"></div>
    </section>
  </main>

  <!-- Hidden ThreeJS Canvas Container -->
  <div class="absolute opacity-0 pointer-events-none w-0 h-0 overflow-hidden">
    <canvas id="monolith-canvas"></canvas>
  </div>

  <!-- Base floor subtle reflection -->
  <div
    class="fixed bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-white/50 to-transparent z-0 pointer-events-none mix-blend-overlay">
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);

            // Nav Drop-in
            gsap.from(".nav-wrapper", { y: -20, opacity: 0, duration: 1.2, ease: "power3.out" });

            // Hero Containers Stagger
            gsap.from(".hero-element", {
                y: 40, 
                opacity: 0, 
                duration: 1.2, 
                stagger: 0.15, 
                ease: "power4.out", 
                delay: 0.2
            });

            // Smooth Mask & Slide Animation - Left Image (Coming from the Right)
            gsap.to(".left-image-wrapper", {
                clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
                duration: 1.8,
                ease: "power3.inOut",
                delay: 0.1
            });
            gsap.fromTo(".left-image-slide", 
                { x: "15%" },
                { x: "0%", duration: 1.8, ease: "power3.inOut", delay: 0.1 }
            );

            // Smooth Mask & Slide Animation - Right Image (Coming from the Left)
            gsap.to(".right-image-wrapper", {
                clipPath: "polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)",
                duration: 1.8,
                ease: "power3.inOut",
                delay: 0.25
            });
            gsap.fromTo(".right-image-slide", 
                { x: "-15%" },
                { x: "0%", duration: 1.8, ease: "power3.inOut", delay: 0.25 }
            );

            // Masked Word Reveal
            const maskedTitles = document.querySelectorAll('.masked-title');
            maskedTitles.forEach((title) => {
                const words = title.querySelectorAll('.reveal-word');
                gsap.to(words, {
                    scrollTrigger: {
                        trigger: title,
                        start: "top 95%",
                    },
                    y: "0%",
                    duration: 1.2,
                    stagger: 0.1,
                    ease: "power4.out",
                    delay: 0.5 
                });
            });

            // Animate shimmer on primary specific word
            gsap.to(".animate-explore", {
                color: "#E2D7C1",
                textShadow: "0px 0px 25px rgba(226, 215, 193, 0.4)",
                duration: 2.5,
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut",
                delay: 1.5 
            });

            // Grid Items Scroll Stagger 
            gsap.from(".eco-header", {
                scrollTrigger: { trigger: ".eco-grid", start: "top 85%" },
                y: 30, opacity: 0, duration: 1, ease: "power3.out"
            });

            gsap.from(".eco-card", {
                scrollTrigger: { trigger: ".eco-grid", start: "top 80%" },
                y: 50, opacity: 0, duration: 1.2, stagger: 0.1, ease: "power3.out"
            });
        });

        // ThreeJS Logic
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof THREE === 'undefined') return;

            const canvas = document.getElementById('monolith-canvas');
            if (!canvas) return;
            
            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            
            const resizeCanvas = () => {
                const maxW = 500;
                const maxH = maxW * (5/4); 
                renderer.setSize(maxW, maxH, false);
                canvas.style.width = maxW + 'px';
                canvas.style.height = maxH + 'px';
                if (camera) { camera.aspect = maxW / maxH; camera.updateProjectionMatrix(); }
            };
            
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(40, 4/5, 0.1, 100);
            camera.position.set(0, 0, 9);

            const group = new THREE.Group();
            scene.add(group);

            const material = new THREE.MeshPhysicalMaterial({
                color: 0x111118, metalness: 0.85, roughness: 0.35, clearcoat: 1.0, 
                clearcoatRoughness: 0.1, emissive: 0xd97706, emissiveIntensity: 0.15, flatShading: true
            });

            const m1 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.9, 6.5, 5), material);
            m1.position.set(0, 0.8, 0); m1.rotation.set(0, Math.PI/5, 0); group.add(m1);

            const m2 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.6, 4.5, 4), material);
            m2.position.set(-1.4, -0.2, 0.5); m2.rotation.set(0.1, Math.PI/3, -0.1); group.add(m2);

            const m3 = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.8, 5.5, 6), material);
            m3.position.set(1.5, 0.1, -0.5); m3.rotation.set(-0.1, Math.PI/6, 0.1); group.add(m3);

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            scene.add(new THREE.DirectionalLight(0xd97706, 3.5).position.set(6, 4, 5));
            scene.add(new THREE.DirectionalLight(0x60a5fa, 2.5).position.set(-6, 3, -4));
            scene.add(new THREE.PointLight(0xffedd5, 2, 12).position.set(0, -3, 3));

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            let time = 0;
            function animate() {
                requestAnimationFrame(animate);
                time += 0.008;
                group.rotation.y = Math.sin(time * 0.6) * 0.2 + time * 0.3;
                group.position.y = Math.sin(time * 1.5) * 0.15 - 0.5;
                m1.rotation.y = time * 0.15;
                m2.rotation.y = -time * 0.2;
                m3.rotation.y = time * 0.18;
                renderer.render(scene, camera);
            }
            animate();
        });
  </script>
</body>

</html>
