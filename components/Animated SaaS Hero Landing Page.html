<!doctype html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Landing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-[#0a0f1a] text-white font-sans antialiased h-screen overflow-hidden relative flex flex-col m-0 p-0 selection:bg-white/20">

    <!-- WebGL Background Animation -->
    <div id="canvas-container" class="absolute top-0 left-0 w-full h-[75vh] z-0 pointer-events-none" style="mask-image: linear-gradient(to bottom, black 40%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);"></div>

    <!-- Subdued Ambient Glow -->
    <div class="absolute top-[-30%] left-1/2 -translate-x-1/2 w-[100vw] h-[100vw] max-w-[1000px] max-h-[1000px] rounded-full z-0 pointer-events-none" style="background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(0,0,0,0) 60%);"></div>

    <!-- Header -->
    <header class="relative z-10 w-full px-6 py-5 flex justify-between items-center bg-[#0a0f1a]/40 backdrop-blur-md border-b border-white/5">
        <div class="flex items-center gap-8">
            <!-- Brand Logo -->
            <a href="#" class="flex items-center gap-3 group">
                <span class="text-lg font-medium tracking-tight text-white">Vertex</span>
            </a>
            
            <!-- Main Navigation -->
            <nav class="hidden md:flex items-center gap-2">
                <a href="#" class="px-3 py-1.5 text-sm text-zinc-300 hover:text-cyan-400 transition-colors font-medium">Products</a>
                <a href="#" class="px-3 py-1.5 text-sm text-zinc-300 hover:text-cyan-400 transition-colors font-medium">Solutions</a>
                <a href="#" class="px-3 py-1.5 text-sm text-zinc-300 hover:text-cyan-400 transition-colors font-medium">Pricing</a>
            </nav>
        </div>

        <!-- Call to Actions -->
        <div class="hidden md:flex items-center gap-5">
            <a href="#" class="text-sm text-zinc-300 hover:text-white transition-colors font-medium">Talk to Sales</a>
            <a href="#" class="px-5 py-2 text-sm font-medium bg-cyan-500 text-black hover:bg-cyan-400 hover:scale-[1.02] active:scale-95 transition-all shadow-[0_0_15px_rgba(6,182,212,0.25)]" style="clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);">Start for Free</a>
        </div>

        <!-- Mobile Menu Toggle -->
        <button class="md:hidden p-2 text-zinc-400 hover:text-white transition-colors rounded-md hover:bg-white/5 border border-transparent hover:border-white/10">
            <iconify-icon icon="solar:hamburger-menu-linear" width="24" height="24" style="stroke-width: 1.5;"></iconify-icon>
        </button>
    </header>

    <!-- Main Hero Content -->
    <main class="relative z-10 flex-grow flex flex-col items-center justify-center text-center px-4 mt-[-8vh]">
        
        <!-- Animated Title with Gradient and Blinking Cursor -->
        <h1 class="text-7xl md:text-[10rem] leading-none font-semibold tracking-tighter flex items-center justify-center select-none" style="background: linear-gradient(180deg, #ffffff 30%, #ffdfc4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
            Summits
        </h1>
        
        <!-- Subtitle -->
        <p class="mt-8 text-base md:text-lg text-[#a1a1a1] max-w-lg mx-auto leading-relaxed font-normal tracking-wide">
            Nexus offers a venue for pioneers to assemble communities from scratch to worldwide reach.
        </p>
        
        <!-- CTA Button -->
        <a href="#" class="mt-10 px-7 py-3.5 bg-white text-black rounded-full text-sm font-medium hover:scale-[1.02] active:scale-95 transition-all duration-200 shadow-[0_0_30px_rgba(255,255,255,0.15)] hover:shadow-[0_0_40px_rgba(255,255,255,0.25)]">
            Launch today
        </a>
    </main>

    <!-- WebGL Script implementation -->
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        // Setup Camera to look slightly upwards towards the center
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / (window.innerHeight * 0.75), 0.1, 1000);
        camera.position.z = 18;
        camera.position.y = -6;
        camera.lookAt(0, 6, 0);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight * 0.75);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for performance
        container.appendChild(renderer.domElement);

        // Main outer wireframe torus
        const geometry = new THREE.TorusGeometry(14, 4, 32, 180);
        const material = new THREE.MeshBasicMaterial({
            color: 0x06b6d4, // Cyan to match new background glow
            wireframe: true,
            transparent: true,
            opacity: 0.6
        });
        const torus = new THREE.Mesh(geometry, material);
        torus.position.y = 10;
        torus.rotation.x = Math.PI / 2.3; // Tilt forward to form an arch
        scene.add(torus);

        // Inner denser layer for a glowing core effect
        const innerGeometry = new THREE.TorusGeometry(14, 3.8, 16, 120);
        const innerMaterial = new THREE.MeshBasicMaterial({
            color: 0x3b82f6, // Blue inner accent
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const innerTorus = new THREE.Mesh(innerGeometry, innerMaterial);
        innerTorus.position.y = 10;
        innerTorus.rotation.x = Math.PI / 2.3;
        scene.add(innerTorus);

        // Subtle animation loop
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Rotate the rings slowly in opposite directions
            torus.rotation.z = -elapsedTime * 0.05;
            innerTorus.rotation.z = -elapsedTime * 0.03;

            // Slight undulating breathing effect
            const scale = 1 + Math.sin(elapsedTime * 1.5) * 0.015;
            torus.scale.set(scale, scale, scale);
            innerTorus.scale.set(scale, scale, scale);

            renderer.render(scene, camera);
        }

        animate();

        // Responsive handling
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight * 0.75;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });
    </script>

</body></html>
