<div class="flex flex-col items-center justify-center min-h-screen w-full bg-[#09090b] text-zinc-200 overflow-hidden relative"
    style="font-family: 'Inter', sans-serif;">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">

    <!-- Background Subtle Grid -->
    <div class="absolute inset-0 z-0 pointer-events-none"
        style="background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px); background-size: 24px 24px;">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[100vw] h-[100vw] max-w-[800px] max-h-[800px] rounded-full"
            style="background: radial-gradient(circle at center, rgba(139, 92, 246, 0.05) 0%, transparent 60%);"></div>
    </div>

    <!-- Main Responsive Container -->
    <main
        class="relative w-[260px] sm:w-[380px] md:w-[500px] aspect-square flex items-center justify-center z-10 transition-all duration-1000 ease-out opacity-0 scale-95"
        id="nexusContainer">

        <!-- Scalable SVG Progress Interface -->
        <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" viewBox="0 0 500 500">
            <circle cx="250" cy="250" r="200" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1" />
            <circle cx="250" cy="250" r="216" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"
                stroke-dasharray="2 6" class="animate-[spin_60s_linear_infinite]"
                style="transform-origin: 250px 250px;" />
            <circle cx="250" cy="250" r="200" fill="none" stroke="url(#quantumGradient)" stroke-width="2"
                stroke-dasharray="1256" stroke-dashoffset="1256" stroke-linecap="round"
                style="transition: stroke-dashoffset 2.8s cubic-bezier(0.16, 1, 0.3, 1);" id="nexusArc" />
            <defs>
                <linearGradient id="quantumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#8b5cf6" />
                    <stop offset="50%" stop-color="#d946ef" />
                    <stop offset="100%" stop-color="#06b6d4" />
                </linearGradient>
            </defs>
        </svg>

        <!-- Central Core Interface -->
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 sm:w-48 sm:h-48 md:w-64 md:h-64 flex items-center justify-center rounded-full">
            <div class="absolute inset-0 bg-violet-500/5 rounded-full blur-xl animate-pulse"></div>
            <div
                class="absolute inset-0 rounded-full bg-[conic-gradient(from_0deg,transparent_0%,rgba(139,92,246,0.04)_20%,transparent_40%)] animate-[spin_5s_linear_infinite]">
            </div>
            <div
                class="absolute inset-[8%] rounded-full border border-white/[0.02] animate-[spin_30s_linear_infinite_reverse]">
            </div>
            <div
                class="absolute inset-[16%] rounded-full border-t border-r border-transparent border-t-violet-400/30 border-r-fuchsia-400/20 animate-[spin_8s_linear_infinite]">
            </div>
            <div
                class="relative z-20 flex flex-col items-center justify-center w-full h-full rounded-full bg-gradient-to-b from-[#18181b] to-[#09090b] border border-white/5 shadow-2xl backdrop-blur-md">
                <span class="text-3xl sm:text-5xl md:text-6xl font-normal tracking-tight text-transparent bg-clip-text bg-gradient-to-br from-white to-zinc-500 tabular-nums" id="syncValue">0.0%</span>
                <div class="flex items-center gap-1.5 sm:gap-2 mt-2 sm:mt-4">
                    <div class="w-1 h-1 sm:w-1.5 sm:h-1.5 rounded-full bg-fuchsia-500 animate-pulse"></div>
                    <span class="text-[10px] sm:text-xs tracking-widest text-zinc-400 uppercase">Nexus Active</span>
                </div>
            </div>
        </div>

        <!-- Nodes -->
        <div class="absolute flex flex-col items-center justify-center z-20 -translate-x-1/2 -translate-y-1/2"
            style="top: 10%; left: 50%;">
            <div
                class="relative flex items-center justify-center w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-full border border-violet-500/40 bg-violet-500/10 shadow-[0_0_20px_rgba(139,92,246,0.15)] backdrop-blur-sm">
                <iconify-icon icon="solar:key-linear" class="text-violet-300 text-sm sm:text-base md:text-xl"
                    stroke-width="1.5"></iconify-icon>
            </div>
            <span class="absolute bottom-full mb-1 sm:mb-2 text-xs sm:text-sm font-normal text-zinc-300 whitespace-nowrap">Key Exchange</span>
        </div>

        <div class="absolute flex flex-col items-center justify-center z-20 -translate-x-1/2 -translate-y-1/2"
            style="top: 21.7%; left: 78.3%;">
            <div
                class="relative flex items-center justify-center w-7 h-7 sm:w-9 sm:h-9 md:w-11 md:h-11 rounded-full border border-fuchsia-500/40 bg-fuchsia-500/10 backdrop-blur-sm">
                <iconify-icon icon="solar:database-linear" class="text-fuchsia-300 text-xs sm:text-sm md:text-lg"
                    stroke-width="1.5"></iconify-icon>
            </div>
        </div>

        <div class="absolute flex flex-col items-center justify-center z-20 -translate-x-1/2 -translate-y-1/2"
            style="top: 50%; left: 90%;">
            <div
                class="relative flex items-center justify-center w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-full border border-violet-400/50 bg-violet-500/10 backdrop-blur-sm">
                <iconify-icon icon="solar:shield-check-linear" class="text-violet-300 text-sm sm:text-base md:text-xl"
                    stroke-width="1.5"></iconify-icon>
            </div>
        </div>

        <div class="absolute flex flex-col items-center justify-center z-20 -translate-x-1/2 -translate-y-1/2"
            style="top: 78.3%; left: 78.3%;">
            <div class="relative flex items-center justify-center w-6 h-6 sm:w-8 sm:h-8 md:w-10 md:h-10 rounded-full border border-white/5 bg-black/40 transition-all duration-700"
                id="nodeFlux">
                <iconify-icon icon="solar:server-path-linear"
                    class="text-zinc-600 text-xs transition-colors duration-700" id="iconFlux"></iconify-icon>
            </div>
        </div>

        <div class="absolute flex flex-col items-center justify-center z-20 -translate-x-1/2 -translate-y-1/2"
            style="top: 90%; left: 50%;">
            <div class="relative flex items-center justify-center w-7 h-7 sm:w-9 sm:h-9 md:w-11 md:h-11 rounded-full border border-white/5 bg-black/40 transition-all duration-700"
                id="nodeSynapse">
                <iconify-icon icon="solar:cpu-linear" class="text-zinc-600 text-xs transition-colors duration-700"
                    id="iconSynapse"></iconify-icon>
            </div>
        </div>
    </main>

    <!-- Terminal Status Output -->
    <section
        class="absolute bottom-12 left-1/2 -translate-x-1/2 flex flex-col items-center text-center w-[90%] max-w-sm pointer-events-none opacity-0 transition-opacity duration-1000 delay-300"
        id="terminalContainer">
        <p class="text-[10px] sm:text-xs text-violet-400 font-normal tracking-wide animate-pulse mb-1">Secure Uplink
            Established</p>
        <p class="text-xs sm:text-sm text-zinc-300 h-6" id="sysMessage">Bootstrapping quantum state...</p>
    </section>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('nexusContainer');
            const terminalContainer = document.getElementById('terminalContainer');
            const arc = document.getElementById('nexusArc');
            const valueText = document.getElementById('syncValue');
            const sysMessage = document.getElementById('sysMessage');
            const logEntries = ["Bootstrapping quantum state...", "Parsing encrypted payloads...", "Distributing compute loads...", "Refining transmission vectors..."];
            let entryIdx = 0;

            const nodeFlux = document.getElementById('nodeFlux');
            const iconFlux = document.getElementById('iconFlux');
            const nodeSynapse = document.getElementById('nodeSynapse');
            const iconSynapse = document.getElementById('iconSynapse');

            setTimeout(() => {
                container.classList.remove('opacity-0', 'scale-95');
                container.classList.add('opacity-100', 'scale-100');
                terminalContainer.classList.remove('opacity-0');
            }, 150);

            setTimeout(() => { arc.style.strokeDashoffset = '270'; }, 500);

            let startVal = 0, endVal = 78.5, animDuration = 2800, animStart = null;
            function animateValue(timestamp) {
                if (!animStart) animStart = timestamp;
                let elapsed = timestamp - animStart;
                let ease = 1 - Math.pow(1 - elapsed / animDuration, 3);
                let currentVal = Math.min(startVal + ease * endVal, endVal);
                valueText.innerText = currentVal.toFixed(1) + '%';
                if (elapsed < animDuration) window.requestAnimationFrame(animateValue);
                else setInterval(() => { valueText.innerText = (endVal + (Math.random() * 0.2 - 0.1)).toFixed(1) + '%'; }, 250);
            }
            setTimeout(() => { window.requestAnimationFrame(animateValue); }, 400);

            setInterval(() => {
                sysMessage.style.opacity = '0';
                setTimeout(() => {
                    entryIdx = (entryIdx + 1) % logEntries.length;
                    sysMessage.innerText = logEntries[entryIdx];
                    sysMessage.style.opacity = '1';
                }, 500);
            }, 3500);

            setTimeout(() => {
                nodeFlux.classList.replace('border-white/5', 'border-fuchsia-500/40');
                nodeFlux.classList.replace('bg-black/40', 'bg-fuchsia-500/10');
                iconFlux.classList.replace('text-zinc-600', 'text-fuchsia-300');
            }, 1800);
            
            setTimeout(() => {
                nodeSynapse.classList.replace('border-white/5', 'border-violet-400/50');
                nodeSynapse.classList.replace('bg-black/40', 'bg-violet-500/10');
                iconSynapse.classList.replace('text-zinc-600', 'text-violet-300');
            }, 2800);
        });
    </script>
</div>
