<section
  class="bg-neutral-100 min-h-screen flex flex-col items-center justify-center font-['Inter',sans-serif] text-neutral-900 overflow-hidden antialiased selection:bg-amber-500/30 selection:text-amber-900 relative">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&amp;family=JetBrains+Mono:wght@300;400&amp;display=swap"
    rel="stylesheet">
  <style>
    /* Utility classes for 3D context that Tailwind doesn't provide by default without config */
    .preserve-3d {
      transform-style: preserve-3d;
    }

    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    @keyframes spin-slow {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* Subtle texture for the dark pages */
    .noise-bg {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
    }
  </style>

  <div class="absolute inset-0 pointer-events-none"
    style="background-image: linear-gradient(to right, #e5e5e5 1px, transparent 1px), linear-gradient(to bottom, #e5e5e5 1px, transparent 1px); background-size: 40px 40px; mask-image: radial-gradient(circle at center, black, transparent 80%); -webkit-mask-image: radial-gradient(circle at center, black, transparent 80%);">
  </div>

  <main class="w-full max-w-6xl px-4 sm:px-8 relative z-10 flex flex-col items-center justify-center"
    style="perspective: 2500px;">

    <!-- Interactive Book Container -->
    <!-- The rotation gives it a slight top-down viewing angle -->
    <div id="book-trigger"
      class="relative w-full max-w-[900px] aspect-[4/3] sm:aspect-[16/9] md:aspect-[2.2/1] drop-shadow-2xl transition-all duration-500 ease-out hover:scale-[1.01] cursor-pointer group preserve-3d"
      style="transform: rotateX(10deg) rotateY(-2deg);">

      <!-- FIXED LEFT PAGE (Revealed backdrop) -->
      <div
        class="absolute left-0 w-1/2 h-full bg-[#0a0a0a] rounded-l-lg border border-white/10 border-r-0 overflow-hidden noise-bg"
        style="box-shadow: inset -10px 0 20px -10px rgba(0,0,0,0.8);">
        <!-- Internal Shadow / Crease -->
        <div class="absolute inset-y-0 right-0 w-16 bg-gradient-to-l from-black/60 to-transparent pointer-events-none">
        </div>

        <div class="absolute inset-0 p-6 sm:p-10 flex flex-col justify-between opacity-40 mix-blend-plus-lighter">
          <div class="font-['JetBrains_Mono'] text-neutral-400 text-xs tracking-widest uppercase">
            Archive // 2024
          </div>
          <div class="flex flex-col gap-2">
            <div class="h-[1px] w-full bg-white/10"></div>
            <div class="h-[1px] w-3/4 bg-white/10"></div>
            <div class="h-[1px] w-1/2 bg-white/10"></div>
          </div>
        </div>
      </div>

      <!-- FIXED RIGHT PAGE (Revealed when cover opens) -->
      <div
        class="absolute right-0 w-1/2 h-full bg-[#0a0a0a] rounded-r-lg border border-white/10 border-l-0 overflow-hidden noise-bg"
        style="box-shadow: inset 10px 0 20px -10px rgba(0,0,0,0.8);">
        <!-- Internal Shadow / Crease -->
        <div class="absolute inset-y-0 left-0 w-16 bg-gradient-to-r from-black/60 to-transparent pointer-events-none">
        </div>

        <div class="absolute inset-0 p-6 sm:p-10 flex flex-col justify-between z-10">
          <div class="flex justify-between items-start w-full">
            <div class="font-['JetBrains_Mono'] text-amber-500/80 text-[10px] sm:text-xs tracking-widest uppercase">
              Event Details
            </div>
            <iconify-icon icon="solar:ticket-linear" class="text-neutral-500 text-xl"></iconify-icon>
          </div>

          <div class="space-y-6">
            <div>
              <h3 class="text-white text-sm sm:text-base font-normal tracking-tight mb-1">Location</h3>
              <p class="font-['JetBrains_Mono'] text-neutral-400 text-xs">HQ Basement Level 2<br>Access via Service Elevator
              </p>
            </div>
            <div>
              <h3 class="text-white text-sm sm:text-base font-normal tracking-tight mb-1">Dress Code</h3>
              <p class="font-['JetBrains_Mono'] text-neutral-400 text-xs">Mandatory. No effort,<br>no entry.</p>
            </div>
          </div>

          <div class="w-full flex justify-end">
            <div
              class="px-4 py-2 rounded-full border border-white/10 bg-white/5 text-white text-xs font-medium backdrop-blur-sm flex items-center gap-2 transition-colors group-hover:bg-white/10 group-hover:border-white/20">
              RSVP Required <iconify-icon icon="solar:arrow-right-up-linear"></iconify-icon>
            </div>
          </div>
        </div>
      </div>

      <!-- FLIPPING PAGE (Starts on right, turns to left) -->
      <div id="page-flipper"
        class="absolute right-0 w-1/2 h-full origin-left transition-transform duration-[1200ms] ease-[cubic-bezier(0.645,0.045,0.355,1)] z-20 preserve-3d">

        <!-- FRONT OF FLIPPING PAGE (The Main Cover) -->
        <div
          class="absolute inset-0 w-full h-full bg-[#0f0f0f] rounded-r-lg border border-white/10 border-l-0 overflow-hidden backface-hidden noise-bg"
          style="box-shadow: inset 20px 0 30px -10px rgba(0,0,0,0.8);">

          <!-- Cover Glow -->
          <div
            class="absolute top-0 right-0 w-3/4 h-3/4 bg-amber-600/10 blur-[80px] rounded-full pointer-events-none translate-x-1/4 -translate-y-1/4">
          </div>

          <!-- Spinning Circular Text -->
          <div
            class="absolute top-4 right-4 sm:top-8 sm:right-8 w-24 h-24 sm:w-32 sm:h-32 text-amber-500 opacity-90 pointer-events-none z-10">
            <svg viewBox="0 0 100 100" class="w-full h-full" style="animation: spin-slow 20s linear infinite;">
              <path id="circlePath" d="M 50, 50 m -32, 0 a 32,32 0 1,1 64,0 a 32,32 0 1,1 -64,0" fill="transparent">
              </path>
              <text font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="400" fill="currentColor"
                letter-spacing="1.5px">
                <textPath href="#circlePath" startOffset="0%">• CLICK TO OPEN • HALLOWEEN </textPath>
              </text>
            </svg>
          </div>

          <div class="absolute inset-0 p-6 sm:p-10 flex flex-col justify-end z-10">
            <iconify-icon icon="solar:moon-fog-linear"
              class="text-amber-500/50 text-4xl sm:text-5xl mb-auto"></iconify-icon>

            <div class="space-y-1 sm:space-y-2">
              <h1 class="text-white text-2xl sm:text-4xl md:text-5xl font-light tracking-tight leading-none uppercase">
                All Hallows
              </h1>
              <div class="flex items-center gap-3">
                <span class="font-['JetBrains_Mono'] text-amber-500 text-xs sm:text-sm tracking-widest">
                                    VOL. VII
                                </span>
                <div class="h-[1px] flex-grow bg-gradient-to-r from-amber-500/50 to-transparent"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- BACK OF FLIPPING PAGE (Inside Left, revealed after turn) -->
        <div
          class="absolute inset-0 w-full h-full bg-[#0f0f0f] rounded-l-lg border border-white/10 border-r-0 overflow-hidden backface-hidden noise-bg"
          style="transform: rotateY(180deg); box-shadow: inset -20px 0 30px -10px rgba(0,0,0,0.8);">

          <div class="absolute inset-0 p-6 sm:p-10 flex flex-col justify-between z-10">
            <div class="font-['JetBrains_Mono'] text-white/40 text-[10px] sm:text-xs tracking-widest uppercase">
              Itinerary
            </div>

            <div class="space-y-4 w-full">
              <div class="flex justify-between items-end border-b border-white/10 pb-2">
                <span class="text-white text-sm sm:text-base font-light tracking-tight">Doors Open</span>
                <span class="font-['JetBrains_Mono'] text-amber-500/80 text-xs">20:00</span>
              </div>
              <div class="flex justify-between items-end border-b border-white/10 pb-2">
                <span class="text-white text-sm sm:text-base font-light tracking-tight">Judging</span>
                <span class="font-['JetBrains_Mono'] text-amber-500/80 text-xs">22:30</span>
              </div>
              <div class="flex justify-between items-end border-b border-white/10 pb-2">
                <span class="text-white text-sm sm:text-base font-light tracking-tight">Curfew</span>
                <span class="font-['JetBrains_Mono'] text-amber-500/80 text-xs">02:00</span>
              </div>
            </div>

            <div class="font-['JetBrains_Mono'] text-white/30 text-[10px] uppercase tracking-widest">
              31.10.2025
            </div>
          </div>
        </div>

      </div>

      <!-- Center Binding Line -->
      <div class="absolute top-0 bottom-0 left-1/2 -translate-x-1/2 w-[2px] bg-black/40 z-30 pointer-events-none"
        style="transform: translateZ(1px);"></div>
      <div
        class="absolute top-0 bottom-0 left-1/2 -translate-x-1/2 w-6 bg-gradient-to-r from-transparent via-black/20 to-transparent z-30 pointer-events-none blur-[2px]"
        style="transform: translateZ(2px);"></div>
    </div>

    <!-- Interaction Hint -->
    <p
      class="mt-12 text-neutral-400 text-sm font-light tracking-tight flex items-center gap-2 opacity-0 animate-[fadeIn_1s_ease-out_1s_forwards]">
      <style>
        @keyframes fadeIn {
          to {
            opacity: 1;
          }
        }
      </style>
      Click the book to open <iconify-icon icon="solar:mouse-circle-linear"
        class="text-lg text-neutral-500"></iconify-icon>
    </p>
  </main>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <script>
    // Simple script to toggle the CSS class that triggers the 3D flip transform
        document.addEventListener('DOMContentLoaded', () => {
            const bookTrigger = document.getElementById('book-trigger');
            const pageFlipper = document.getElementById('page-flipper');
            let isFlipped = false;

            bookTrigger.addEventListener('click', () => {
                isFlipped = !isFlipped;
                if (isFlipped) {
                    pageFlipper.style.transform = 'rotateY(-180deg)';
                } else {
                    pageFlipper.style.transform = 'rotateY(0deg)';
                }
            });
        });
  </script>
</section>
