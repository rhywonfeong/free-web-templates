<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Gatherings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
        }
        /* Ensure smooth rendering for the WebGL canvas */
        #webgl-container canvas {
            display: block;
            outline: none;
        }
        /* Custom text gradient to match reference */
        .text-glow-gradient {
            background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 overflow-hidden text-white selection:bg-white/20">

    <!-- Main Application Container -->
    <main class="relative w-full max-w-7xl aspect-[4/3] md:aspect-[4/3] lg:aspect-[16/11] bg-[#030712] rounded-[2rem] border border-white/10 overflow-hidden flex flex-col shadow-2xl">
        
        <!-- WebGL Background -->
        <div id="webgl-container" class="absolute inset-0 z-0 pointer-events-none"></div>

        <!-- Ambient Glow Elements -->
        <div class="absolute top-[-10%] left-1/2 -translate-x-1/2 w-[80%] aspect-square bg-[#2563eb] rounded-full blur-[150px] opacity-10 z-0 pointer-events-none"></div>
        
        <!-- Bottom Dark Gradient for Text Readability -->
        <div class="absolute bottom-0 left-0 right-0 h-[60%] bg-gradient-to-t from-[#030712] via-[#030712]/80 to-transparent z-0 pointer-events-none"></div>

        <!-- Navigation Bar -->
        <header class="relative z-10 flex items-center justify-between px-6 py-6 md:px-10 md:py-8 w-full">
            <!-- Logo -->
            <a href="#" class="flex items-center gap-2 text-white hover:opacity-80 transition-opacity">
                <iconify-icon icon="solar:box-minimalistic-linear" width="24" height="24" class="text-white"></iconify-icon>
                <span class="text-lg font-medium tracking-tight">Lumina</span>
            </a>

            <!-- Navigation Links & CTA -->
            <nav class="flex items-center gap-3">
                <!-- Grouped Links (Desktop) -->
                <div class="hidden md:flex items-center gap-6 bg-white/10 backdrop-blur-md border border-white/5 rounded-full px-5 py-2 text-sm font-normal text-white/80">
                    <a href="#" class="hover:text-white transition-colors">Discover</a>
                    <a href="#" class="hover:text-white transition-colors">Spaces</a>
                    <a href="#" class="hover:text-white transition-colors">Network</a>
                </div>
                <!-- Primary Action -->
                <a href="#" class="bg-white text-black rounded-full px-5 py-2 text-sm font-normal hover:bg-gray-200 transition-colors">
                    Connect
                </a>
            </nav>
        </header>

        <!-- Hero Content Section -->
        <section class="relative z-10 flex-1 flex flex-col items-center justify-end pb-12 md:pb-20 px-6 text-center">
            
            <!-- Main Title with subtle vertical separator -->
            <div class="relative flex items-center justify-center">
                <h1 class="text-7xl md:text-8xl lg:text-9xl font-medium tracking-tighter text-glow-gradient leading-none pr-4 md:pr-8">
                    Gatherings
                </h1>
                <div class="w-px h-[0.9em] bg-gradient-to-b from-white/80 via-white/50 to-transparent absolute right-0 top-1/2 -translate-y-1/2"></div>
            </div>

            <!-- Subtitle -->
            <p class="mt-6 text-sm md:text-base text-white/70 max-w-md mx-auto font-normal leading-relaxed">
                Lumina offers a dynamic environment for visionaries to scale connections effortlessly.
            </p>

            <!-- Call to Action Button -->
            <button class="mt-8 bg-white text-black rounded-full px-6 py-3 text-sm font-normal hover:scale-105 active:scale-95 transition-all shadow-[0_0_30px_rgba(255,255,255,0.15)] focus:outline-none focus:ring-2 focus:ring-white/50 focus:ring-offset-2 focus:ring-offset-black">
                Start connecting
            </button>
            
        </section>
    </main>

    <!-- WebGL Animation Script -->
    <script>
        const initWebGL = () => {
            const container = document.getElementById('webgl-container');
            if (!container) return;

            // Scene setup
            const scene = new THREE.Scene();
            
            // Camera setup - positioned to capture the arching curve
            const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, -2, 28);
            camera.lookAt(0, 5, 0);

            // Renderer setup
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Create geometry matching the dense wireframe tube look
            // Using a Torus that will be positioned above the camera line to form an arch
            const radius = 22;
            const tubeRadius = 7;
            const radialSegments = 120; // High density for the line effect
            const tubularSegments = 250;
            
            const geometry = new THREE.TorusGeometry(radius, tubeRadius, radialSegments, tubularSegments);
            const edges = new THREE.WireframeGeometry(geometry);

            // Create a group to hold layered wireframes for depth and intensity
            const torusGroup = new THREE.Group();

            // Outer glow lines (updated to blue)
            const matOuter = new THREE.LineBasicMaterial({
                color: 0x2563eb,
                transparent: true,
                opacity: 0.15,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const lineOuter = new THREE.LineSegments(edges, matOuter);
            
            // Inner brighter lines (updated to light blue)
            const matInner = new THREE.LineBasicMaterial({
                color: 0x60a5fa,
                transparent: true,
                opacity: 0.1,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const lineInner = new THREE.LineSegments(edges, matInner);
            lineInner.scale.set(0.98, 0.98, 0.98); // Slightly smaller to sit inside
            lineInner.rotation.z = Math.PI / radialSegments; // Offset lines slightly

            torusGroup.add(lineOuter);
            torusGroup.add(lineInner);
            
            // Position the geometry so it arches over the top of the container
            torusGroup.position.set(0, 18, 0);
            // Tilt it slightly to show depth
            torusGroup.rotation.x = Math.PI * 0.1;
            
            scene.add(torusGroup);

            // Animation Loop
            let time = 0;
            const animate = () => {
                requestAnimationFrame(animate);
                time += 0.0015;

                // Subtle slow rotation to give life to the abstract shape
                torusGroup.rotation.z = time * 0.5;
                torusGroup.rotation.y = Math.sin(time) * 0.05;

                // Gentle floating effect
                torusGroup.position.y = 18 + Math.sin(time * 2) * 0.5;

                renderer.render(scene, camera);
            };
            animate();

            // Handle Resize
            const handleResize = () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            };
            window.addEventListener('resize', handleResize);
        };

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', initWebGL);
    </script>
</body>
</html>
